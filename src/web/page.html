<title>멸망까지 10년</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;600&family=Nanum+Gothic+Coding:wght@400;700&family=Song+Myung&display=swap">
<style>
/* Layout: 왼쪽은 책처럼 읽는 이야기 기둥, 오른쪽은 웹소설식 '상태창'.
   이야기는 명조, 시스템(상태창·공략 노트·붕괴도)은 고정폭 + 파란 창으로 확실히 구분한다. */
:root {
  --bg: #e6e9f0;
  --page: #f7f8fb;
  --ink: #1b2030;
  --muted: #5a6276;
  --line: #c8cedb;
  --sys: #2154cf;
  --sys-bg: rgba(33, 84, 207, 0.06);
  --sys-line: rgba(33, 84, 207, 0.35);
  --gold: #8f6610;
  --doom: #b0223a;
  --on-accent: #ffffff;
  --ok: #23845a;
  --doom-bg: rgba(176, 34, 58, 0.08);
  --doom-line: rgba(176, 34, 58, 0.4);
  --gold-bg: rgba(143, 102, 16, 0.12);
  --shadow: 0 1px 0 rgba(27, 32, 48, 0.04), 0 8px 24px -16px rgba(27, 32, 48, 0.25);
  --font-title: 'Song Myung', 'Gowun Batang', 'AppleMyungjo', serif;
  --font-story: 'Gowun Batang', 'Noto Serif KR', 'AppleMyungjo', 'Batang', serif;
  --font-sys: 'Nanum Gothic Coding', 'D2Coding', ui-monospace, 'SFMono-Regular', monospace;
  --font-ui: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --r: 6px;
  --gutter: clamp(16px, 3vw, 32px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f1b; --page: #121828; --ink: #dde3f1; --muted: #8b95ac; --line: #263049;
    --sys: #62c3ff; --sys-bg: rgba(98, 195, 255, 0.07); --sys-line: rgba(98, 195, 255, 0.32);
    --gold: #e3b95a; --doom: #ff5d73; --on-accent: #0b0f1b;
    --ok: #5fd39c; --doom-bg: rgba(255, 93, 115, 0.1); --doom-line: rgba(255, 93, 115, 0.45); --gold-bg: rgba(227, 185, 90, 0.14);
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 10px 30px -18px rgba(0, 0, 0, 0.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f1b; --page: #121828; --ink: #dde3f1; --muted: #8b95ac; --line: #263049;
  --sys: #62c3ff; --sys-bg: rgba(98, 195, 255, 0.07); --sys-line: rgba(98, 195, 255, 0.32);
  --gold: #e3b95a; --doom: #ff5d73; --on-accent: #0b0f1b;
  --ok: #5fd39c; --doom-bg: rgba(255, 93, 115, 0.1); --doom-line: rgba(255, 93, 115, 0.45); --gold-bg: rgba(227, 185, 90, 0.14);
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 10px 30px -18px rgba(0, 0, 0, 0.8);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-ui); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--sys); outline-offset: 2px; }
#app { height: 100%; padding-inline: var(--gutter); display: flex; flex-direction: column; }

/* ---------- 상단 막대 */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.brand { font: 22px/1 var(--font-title); letter-spacing: 0.02em; margin-right: auto; }
.clock { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 13px var(--font-sys); }
.clock .doom { color: var(--doom); }
.meter-wrap { display: flex; align-items: center; gap: 8px; font: 12px var(--font-sys); color: var(--muted); }
.meter { width: 90px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--doom); transition: width 0.4s; }
.meter-wrap .ms { display: none; }
.meter-wrap b { color: var(--doom); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3.2em; }
.ghost { background: none; border: 1px solid var(--line); border-radius: var(--r); padding: 4px 10px; font-size: 12px; color: var(--muted); cursor: pointer; }
.ghost:hover { color: var(--ink); border-color: var(--muted); }
.ghost.danger { color: var(--doom); border-color: var(--doom); }
#panel-toggle { display: none; }

/* ---------- 캐릭터 생성 */
.create { flex: 1; overflow-y: auto; margin-inline: calc(var(--gutter) * -1); padding-inline: var(--gutter); }
.create-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; max-width: 1180px; margin-inline: auto; padding-block: 28px 64px; }
.intro h1 { font: 400 clamp(40px, 7vw, 76px)/1.05 var(--font-title); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.intro .lede { font: 17px/1.85 var(--font-story); color: var(--muted); max-width: 34em; margin: 14px 0 0; }
.intro .lede em { font-style: normal; color: var(--ink); border-bottom: 1px solid var(--doom); }
.resume { margin-top: 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--sys-line); background: var(--sys-bg); border-radius: var(--r); font: 13px var(--font-sys); color: var(--sys); }
.resume span { flex: 1 1 14em; }
.step { margin-top: 34px; }
.step h3 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 0 0 12px; font: 600 13px var(--font-ui); letter-spacing: 0.08em; color: var(--ink); }
.step h3 small { font: 12px var(--font-ui); letter-spacing: 0; color: var(--muted); font-weight: 400; }
.name-input { font: 18px var(--font-story); padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--page); color: var(--ink); width: min(100%, 16em); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.card { text-align: left; display: grid; gap: 3px; align-content: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--page); cursor: pointer; min-width: 0; }
.card:hover:not([disabled]) { border-color: var(--muted); }
.card[aria-pressed="true"] { border-color: var(--sys); background: var(--sys-bg); box-shadow: inset 0 0 0 1px var(--sys); }
.card[disabled] { opacity: 0.42; cursor: not-allowed; }
.card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 600; font-size: 14px; }
.card .desc { font-size: 12.5px; line-height: 1.5; color: var(--muted); }
.card .why { font-size: 11.5px; color: var(--doom); }
.card select { margin-top: 4px; font: 12px var(--font-ui); padding: 2px 4px; border: 1px solid var(--sys-line); border-radius: 4px; background: var(--page); color: var(--ink); justify-self: start; }
.cost { font: 700 12px var(--font-sys); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cost.spend { color: var(--sys); }
.cost.gain { color: var(--doom); }
.cost.free { color: var(--gold); }
.cat { font: 12px var(--font-sys); color: var(--muted); margin: 16px 0 6px; letter-spacing: 0.06em; }
.alloc { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.alloc-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--page); font-size: 14px; }
.alloc-row .v { font: 13px var(--font-sys); font-variant-numeric: tabular-nums; min-width: 2.4em; text-align: right; }
.step-btn { width: 26px; height: 26px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; line-height: 1; }
.step-btn[disabled] { opacity: 0.35; cursor: not-allowed; }

.ledger { position: sticky; top: 16px; align-self: start; display: grid; gap: 12px; }
.window { border: 1px solid var(--sys-line); background: var(--sys-bg); border-radius: 3px; padding: 12px 14px; font-family: var(--font-sys); font-size: 13px; }
.window h4 { margin: 0 0 10px; font: 700 12px var(--font-sys); letter-spacing: 0.12em; color: var(--sys); }
.row { display: flex; justify-content: space-between; gap: 10px; padding-block: 2px; font-variant-numeric: tabular-nums; }
.row.total { border-top: 1px dashed var(--sys-line); margin-top: 6px; padding-top: 8px; font-size: 15px; font-weight: 700; }
.row.total .bad { color: var(--doom); }
.errors { margin: 0; padding-left: 1.1em; color: var(--doom); font-size: 12.5px; }
.primary { width: 100%; padding: 12px 16px; border: 0; border-radius: var(--r); background: var(--sys); color: var(--on-accent); font: 600 15px var(--font-ui); cursor: pointer; }
.primary[disabled] { opacity: 0.4; cursor: not-allowed; }
.secondary { width: 100%; padding: 9px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--page); font-size: 13px; cursor: pointer; }
.mobilebar { display: none; }

/* ---------- 게임 화면 */
.game { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; }
.story { overflow-y: auto; min-height: 0; margin-left: calc(var(--gutter) * -1); padding-left: var(--gutter); scroll-padding-bottom: 24px; }
.story-inner { max-width: 40rem; margin-inline: auto; padding-block: 8px 24px; }
.scene { padding-block: 22px 6px; border-top: 1px solid var(--line); font: 17px/1.9 var(--font-story); animation: rise 0.35s ease-out; }
.scene.cont { border-top: 0; padding-top: 4px; }
.scene:first-child { border-top: 0; }
.scene .when { font: 12px var(--font-sys); color: var(--muted); letter-spacing: 0.04em; }
.scene h2 { font: 400 23px/1.3 var(--font-title); margin: 2px 0 12px; text-wrap: balance; }
.scene p { margin: 0 0 0.7em; }
.say .who { display: block; font: 600 12px/1.4 var(--font-ui); letter-spacing: 0.08em; color: var(--muted); margin-bottom: 1px; }
.say.me .who { color: var(--sys); }
.inner { color: var(--muted); border-left: 2px solid var(--line); padding-left: 12px; }
.sysline { font: 13px/1.6 var(--font-sys); color: var(--sys); background: var(--sys-bg); border: 1px solid var(--sys-line); border-radius: 3px; padding: 7px 12px; margin: 0.3em 0 0.9em; }
.pin { display: flex; align-items: center; gap: 8px; font: 13px var(--font-sys); color: var(--gold); margin: 0.2em 0 0.8em; }
.tag { font: 700 11px var(--font-sys); letter-spacing: 0.06em; padding: 1px 6px; border: 1px solid currentColor; border-radius: 3px; }
.act { font: 13px var(--font-sys); color: var(--muted); padding-block: 8px 0; }
.act::before { content: '▸ '; color: var(--sys); }
.act.bare::before { content: ''; }
.act .delta { display: block; color: var(--gold); font-size: 12px; padding-left: 1.1em; }
.act.bare .delta { padding-left: 0; }
.check { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font: 12.5px/1.5 var(--font-sys); color: var(--muted); margin: 0.3em 0 0.8em; }
.check.ok .tag { color: var(--sys); }
.check.ng .tag { color: var(--doom); }
.weekly { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 14px 0 4px; padding: 8px 12px; border: 1px dashed var(--sys-line); border-radius: 3px; font: 12px var(--font-sys); color: var(--sys); }
.weekly .wt { font-weight: 700; }
.weekly .chip.down { color: var(--doom); border-color: var(--doom); }
.nextup { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font: 12px var(--font-sys); color: var(--gold); }
.linkish { background: none; border: 0; padding: 0; color: var(--sys); font: 12px var(--font-sys); text-decoration: underline; cursor: pointer; }
.activity .ad { font-size: 11.5px; line-height: 1.4; color: var(--muted); }
.goal { display: grid; gap: 3px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.goal:last-child { border-bottom: 0; }
.goal .gs { font: 11px var(--font-sys); color: var(--sys); letter-spacing: 0.06em; }
.goal.done .gs { color: var(--muted); }
.goal.done b { color: var(--muted); text-decoration: line-through; }
.goal.failed .gs, .goal.failed b { color: var(--doom); }
.goal b { font-size: 14px; }
.goal p { margin: 0; font: 13.5px/1.65 var(--font-story); color: var(--muted); }
.when-s { color: var(--gold); }
.rel { display: grid; gap: 4px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.rel:last-child { border-bottom: 0; }
.rel-top { display: flex; justify-content: space-between; align-items: baseline; }
.rel-top b { font-size: 14px; }
.rel .rank { font: 12px var(--font-sys); color: var(--sys); }
.rel p { margin: 0; font: 13.5px/1.6 var(--font-story); color: var(--muted); }
.rel .trust { font: 11.5px var(--font-sys); color: var(--sys); }
.rel .trust.low { color: var(--doom); }
@keyframes rise { from { transform: translateY(6px); opacity: 0.4; } }

.controls { display: grid; gap: 8px; padding-block: 18px 40px; }
.prompt { font: 12px var(--font-sys); color: var(--muted); letter-spacing: 0.04em; }
.choice { display: flex; gap: 12px; align-items: baseline; text-align: left; padding: 11px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--page); font: 15.5px/1.55 var(--font-story); cursor: pointer; box-shadow: var(--shadow); }
.choice:hover:not([disabled]) { border-color: var(--sys); }
.choice[disabled] { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
.choice .k { font: 12px var(--font-sys); color: var(--sys); min-width: 1.1em; }
.choice .hint { display: block; font: 12px/1.5 var(--font-ui); color: var(--gold); }
.choice .lock { display: block; font: 12px var(--font-ui); color: var(--doom); }
.activities { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 8px; }
.activity { display: grid; gap: 2px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--page); cursor: pointer; box-shadow: var(--shadow); min-width: 0; }
.activity:hover { border-color: var(--sys); }
.activity b { font-size: 14px; font-weight: 600; }
.activity .fx { font: 11.5px var(--font-sys); color: var(--muted); }
.activity .k { font: 11px var(--font-sys); color: var(--sys); }
.continue { justify-self: start; padding: 10px 26px; border: 0; border-radius: var(--r); background: var(--ink); color: var(--page); font: 600 14px var(--font-ui); cursor: pointer; }
.ending { border: 1px solid var(--sys-line); background: var(--sys-bg); border-radius: var(--r); padding: 18px; display: grid; gap: 10px; font-family: var(--font-story); }
.ending h3 { margin: 0; font: 400 24px var(--font-title); }
.ending ul { margin: 0; padding-left: 1.1em; }

.panel { overflow-y: auto; min-height: 0; border-left: 1px solid var(--line); padding: 12px 0 24px 20px; margin-right: calc(var(--gutter) * -1); padding-right: var(--gutter); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; position: sticky; top: 0; background: var(--bg); z-index: 1; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { color: var(--sys); border-bottom-color: var(--sys); }
.tab .n { font: 11px var(--font-sys); margin-left: 3px; }
.pane { display: grid; gap: 12px; }
.stat { display: grid; grid-template-columns: 4.6em minmax(0, 1fr) 3.4em; gap: 8px; align-items: center; padding-block: 2px; }
.bar-s { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar-s i { display: block; height: 100%; background: var(--sys); }
.bar-s.warn i { background: var(--doom); }
.stat .g { text-align: right; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 12px var(--font-sys); padding: 2px 8px; border: 1px solid var(--sys-line); border-radius: 3px; color: var(--ink); }
.chip.bloom { border-color: var(--gold); color: var(--gold); }
.note { border-bottom: 1px solid var(--line); padding-bottom: 10px; display: grid; gap: 3px; }
.note:last-child { border-bottom: 0; }
.note .stars { font: 12px var(--font-sys); color: var(--gold); letter-spacing: 0.1em; }
.note b { font-size: 14px; }
.note p { margin: 0; font: 14px/1.7 var(--font-story); color: var(--muted); }
.note.bad p { text-decoration: line-through; text-decoration-color: var(--doom); }
.note .warn { font: 12px var(--font-sys); color: var(--doom); }
.empty { font-size: 13px; color: var(--muted); }
.fate { display: grid; gap: 2px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.fate:last-child { border-bottom: 0; }
.fate .st { font: 12px var(--font-sys); }
.fate .st.canon { color: var(--doom); }
.fate .st.changed { color: var(--sys); }
.fate .st.open { color: var(--muted); }
.legend { font-size: 12px; color: var(--muted); }


/* ---------- 누르는 느낌 */
button { position: relative; overflow: hidden; transition: transform 0.08s ease, opacity 0.18s ease, border-color 0.15s ease, background-color 0.15s ease; }
button:active:not([disabled]) { transform: scale(0.98); }
.choice:hover:not([disabled]), .activity:hover, .skill:hover:not([disabled]) { transform: translateY(-1px); }
.ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: 0.16; transform: scale(0); animation: ripple 0.6s ease-out forwards; pointer-events: none; }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }
.picked { border-color: var(--sys) !important; background: var(--sys-bg) !important; box-shadow: 0 0 0 2px var(--sys) !important; }
.dim { opacity: 0.4; }

/* ---------- 장면이 한 줄씩 떠오른다 */
.scene.reveal > * { animation: lineIn 0.45s ease-out both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes lineIn { from { opacity: 0; transform: translateY(6px); } }

/* ---------- 주사위 */
.check .die { display: inline-block; min-width: 1.3em; text-align: center; color: var(--ink); font-variant-numeric: tabular-nums; }
.check .die.landed { animation: pop 0.3s ease-out; }
.check .tag { animation: pop 0.3s ease-out 0.45s both; }
@keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 70% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); } }

/* ---------- 원작 이탈 글리치, 기술 습득 */
.sysline.glitch { animation: glitch 0.5s steps(2) 2; border-color: var(--doom-line); color: var(--doom); background: var(--doom-bg); }
@keyframes glitch {
  0% { transform: translate(0); text-shadow: 2px 0 var(--doom), -2px 0 var(--sys); }
  25% { transform: translate(-2px, 1px); clip-path: inset(10% 0 40% 0); }
  50% { transform: translate(2px, -1px); text-shadow: -2px 0 var(--doom), 2px 0 var(--sys); clip-path: inset(50% 0 5% 0); }
  75% { transform: translate(-1px, 0); clip-path: none; }
  100% { transform: none; text-shadow: none; }
}
.meter-wrap.pulse .meter { animation: meterPulse 0.9s ease-out; }
@keyframes meterPulse { 0%, 60% { box-shadow: 0 0 0 3px var(--doom-bg); } 100% { box-shadow: none; } }
.sysline.learn { border-color: var(--gold); color: var(--gold); background: linear-gradient(100deg, transparent 20%, var(--gold-bg) 50%, transparent 80%) 0 0 / 250% 100%, var(--gold-bg); animation: shimmer 1.6s ease-out; }
@keyframes shimmer { from { background-position: 120% 0, 0 0; } to { background-position: -120% 0, 0 0; } }
.ranks { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 1.1em; margin-top: 3px; }
.rankup { font: 700 11.5px var(--font-sys); color: var(--gold); border: 1px solid var(--gold); border-radius: 3px; padding: 0 6px; background: var(--gold-bg); animation: pop 0.4s ease-out; }

/* ---------- 알림 */
#toasts { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 60px); left: 50%; transform: translateX(-50%); display: grid; gap: 6px; justify-items: center; z-index: 30; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
.toast { padding: 8px 16px; border: 1px solid var(--sys-line); border-radius: 3px; background: var(--page); color: var(--sys); font: 700 13px var(--font-sys); box-shadow: var(--shadow); animation: toastIn 0.35s cubic-bezier(0.2, 1.4, 0.4, 1); transition: opacity 0.4s, transform 0.4s; text-align: center; }
.toast.learn, .toast.rank { color: var(--gold); border-color: var(--gold); }
.toast.lose { color: var(--doom); border-color: var(--doom); }
.toast.out { opacity: 0; transform: translateY(-8px); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-14px) scale(0.9); } }

/* ---------- 전투 */
.battle { display: grid; gap: 10px; }
.combatant { position: relative; overflow: hidden; border: 1px solid var(--line); background: var(--page); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 7px; box-shadow: var(--shadow); }
.combatant.foe { border-color: var(--doom-line); }
.combatant.enraged { box-shadow: 0 0 0 1px var(--doom), 0 0 26px -8px var(--doom); }
.ch { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ch b { font: 600 15px var(--font-ui); }
.num { font: 12px var(--font-sys); color: var(--muted); font-variant-numeric: tabular-nums; }
.gauge { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.gauge i { display: block; height: 100%; transition: width 0.55s cubic-bezier(0.2, 0.8, 0.2, 1); }
.gauge.hp.foe i { background: var(--doom); }
.gauge.hp.mine i { background: var(--ok); }
.gauge.sp i { background: var(--gold); }
.gauge.mp i { background: var(--sys); }
.res { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.res .gauge { height: 5px; }
.rl { display: grid; gap: 3px; font: 11.5px var(--font-sys); color: var(--muted); }
.chip.ally { color: var(--ok); border-color: var(--ok); }
.chip.turn { color: var(--muted); }
.intent { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: baseline; padding: 8px 10px; border-radius: 3px; border: 1px dashed var(--line); }
.intent .il { grid-column: 1 / -1; font: 11px var(--font-sys); color: var(--muted); letter-spacing: 0.06em; }
.intent b { font: 400 22px/1.2 var(--font-title); }
.intent .it { font: 13.5px/1.5 var(--font-story); color: var(--muted); }
.intent.exact { border-style: solid; border-color: var(--sys-line); background: var(--sys-bg); }
.intent.exact b { color: var(--sys); }
.intent.danger { border-color: var(--doom); background: var(--doom-bg); animation: danger 1.2s ease-in-out infinite; }
.intent.danger b { color: var(--doom); }
.intent.hidden b { color: var(--muted); }
@keyframes danger { 50% { box-shadow: 0 0 0 3px var(--doom-bg); } }
.skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.skill { text-align: left; display: grid; gap: 3px; align-content: start; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r); background: var(--page); cursor: pointer; box-shadow: var(--shadow); min-width: 0; }
.skill:hover:not([disabled]) { border-color: var(--sys); }
.skill .st { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.skill .k { font: 11px var(--font-sys); color: var(--sys); }
.skill b { font-size: 14px; font-weight: 600; }
.skill .cost { font: 11px var(--font-sys); color: var(--gold); }
.skill .sd { font-size: 11.5px; line-height: 1.4; color: var(--muted); }
.skill[disabled] { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
.combatant.hit { animation: shake 0.35s; }
.combatant.hurt { animation: shake 0.35s, flashRed 0.6s; }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
@keyframes flashRed { 0% { background: var(--doom-bg); } 100% { background: var(--page); } }
.float { position: absolute; top: 28%; font: 700 21px var(--font-sys); color: var(--ink); pointer-events: none; animation: floatUp 1.1s ease-out both; text-shadow: 0 1px 0 var(--page); z-index: 2; }
.float.crit { color: var(--gold); font-size: 28px; }
.float.me { color: var(--doom); }
.float.heal { color: var(--ok); }
@keyframes floatUp { from { opacity: 0; transform: translateY(8px) scale(0.8); } 15% { opacity: 1; transform: translateY(0) scale(1.15); } to { opacity: 0; transform: translateY(-36px) scale(1); } }
.battlelog { margin: 12px 0 4px; padding: 6px 12px; border-left: 2px solid var(--doom-line); font: 13px/1.65 var(--font-sys); color: var(--muted); display: grid; gap: 1px; }
.bl-head { color: var(--doom); font-weight: 700; letter-spacing: 0.04em; margin-bottom: 2px; }
.bl.me { color: var(--ink); }
.bl.ally { color: var(--ok); }
.bl.sys { color: var(--sys); }
.bl.crit { font-weight: 700; }
.dmg { color: var(--gold); font-weight: 700; }
.dmg.me { color: var(--doom); }
.dmg.heal { color: var(--ok); }
.result { justify-self: start; margin-top: 8px; font: 400 24px var(--font-title); padding: 0 16px; border: 2px solid currentColor; border-radius: 3px; animation: stamp 0.5s cubic-bezier(0.2, 1.6, 0.4, 1) both; }
.result.win { color: var(--sys); }
.result.lose { color: var(--doom); }
@keyframes stamp { from { opacity: 0; transform: scale(1.9) rotate(-8deg); } to { opacity: 1; transform: scale(1) rotate(-2deg); } }
.continue.fight { background: var(--doom); color: var(--on-accent); }


/* ---------- 도트 그림 */
.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; flex: none; }
img.icon { display: inline-block; vertical-align: -3px; }
.portrait { border-radius: 4px; box-shadow: 0 0 0 1px var(--line); background: var(--line); }
.portrait.flip { transform: scaleX(-1); }

/* 대사: 초상화 + 말풍선 */
.say { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: start; margin: 0.2em 0 0.8em; }
.say .bubble { padding-top: 2px; min-width: 0; }
.say.me { grid-template-columns: minmax(0, 1fr) 64px; }
.say.me .portrait, .say.me .crowd { order: 2; }
.say.me .bubble { text-align: right; }
.say .ghost-pt { visibility: hidden; height: 1px; box-shadow: none; }
.say .crowd { justify-self: center; margin-top: 4px; }

/* 삽화와 장소 띠 */
.art { margin: 0.4em 0 1.1em; }
.art img, .strip img, .month img, .hero img, .ending-art { width: 100%; height: auto; border-radius: 4px; box-shadow: 0 0 0 1px var(--line), var(--shadow); }
.art figcaption { font: 11.5px var(--font-sys); color: var(--muted); margin-top: 6px; letter-spacing: 0.04em; }
.strip { margin: 0 0 12px; height: 84px; overflow: hidden; border-radius: 4px; }
.strip img { height: 100%; object-fit: cover; object-position: center 62%; box-shadow: none; }
.scene.reveal > .art img { animation: artIn 0.9s ease-out both; }
@keyframes artIn { from { opacity: 0; filter: brightness(2) saturate(0); } }

/* 주 / 달 넘김 */
.weekly { display: grid; gap: 6px; }
.wtop { display: flex; align-items: center; gap: 6px; }
.weekly .season { margin: 0; font: 14px/1.6 var(--font-story); color: var(--muted); }
.month { margin: 26px 0 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--page); overflow: hidden; box-shadow: var(--shadow); }
.month img { border-radius: 0; box-shadow: none; max-height: 200px; object-fit: cover; object-position: center 60%; }
.mcap { padding: 12px 16px 14px; display: grid; gap: 4px; }
.mcap h2 { margin: 0; font: 400 26px/1.2 var(--font-title); }
.mcap .season { margin: 0; font: 15px/1.6 var(--font-story); color: var(--muted); }
.mcap .mrec { margin: 4px 0 0; font: 12px/1.6 var(--font-sys); color: var(--gold); }

/* 인물 등장 카드 */
.intro-card { display: flex; align-items: center; gap: 16px; margin: 0.6em 0 1em; padding: 12px 14px; border: 1px solid var(--sys-line); border-radius: var(--r); background: linear-gradient(100deg, var(--sys-bg), transparent 70%); }
.intro-card .portrait { box-shadow: 0 0 0 1px var(--sys-line), var(--shadow); }
.ic-text { display: grid; gap: 2px; min-width: 0; }
.ic-k { font: 11px var(--font-sys); color: var(--sys); letter-spacing: 0.14em; }
.ic-text b { font: 400 28px/1.15 var(--font-title); }
.ic-d { font: 14px/1.5 var(--font-story); color: var(--muted); }
.scene.reveal > .intro-card { animation: cardIn 0.6s cubic-bezier(0.2, 0.9, 0.3, 1) both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes cardIn { from { opacity: 0; transform: translateX(-24px); } }

/* 판정 주사위 */
.check { display: flex; align-items: center; gap: 10px; }
.die-wrap { position: relative; width: 32px; height: 32px; display: inline-grid; place-items: center; flex: none; }
.die-wrap .d20 { position: absolute; inset: 0; }
.check .die { position: relative; font: 700 12px/1 var(--font-sys); color: #0e0b16; min-width: 0; }
.die-wrap.nat20 .d20 { filter: drop-shadow(0 0 4px var(--gold)); }
.die-wrap.nat1 .d20 { filter: drop-shadow(0 0 3px var(--doom)) saturate(0.4); }
.cinfo { display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; min-width: 0; }
.clabel { color: var(--ink); }
.cmath { font-variant-numeric: tabular-nums; }
.check.rolling .die-wrap { animation: roll 0.62s cubic-bezier(0.25, 0.7, 0.35, 1); }
.check.rolling .tag, .check.rolling .cmath { opacity: 0; }
.check.landed .tag { animation: stampIn 0.4s cubic-bezier(0.2, 1.6, 0.4, 1); }
.check.landed .cmath { animation: lineIn 0.3s ease-out; }
@keyframes roll {
  0% { transform: translate(-130px, -14px) rotate(-760deg); }
  30% { transform: translate(-64px, 0) rotate(-380deg); }
  45% { transform: translate(-34px, -9px) rotate(-170deg); }
  62% { transform: translate(0, 0) rotate(0deg); }
  78% { transform: translate(5px, -3px) rotate(14deg); }
  100% { transform: none; }
}
@keyframes stampIn { from { transform: scale(1.8); opacity: 0; } }
.float.spark { color: var(--gold); font-size: 14px; top: 0; }

/* 활동 버튼 */
.activity { grid-template-columns: 32px minmax(0, 1fr); column-gap: 10px; align-items: start; }
.activity .atext { display: grid; gap: 2px; min-width: 0; }
.activity .k { margin-right: 6px; }
.act-ic { margin-right: 6px; }
.act:has(.act-ic)::before { content: ''; }

/* 상태창 */
.sname { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.stat { grid-template-columns: 6.4em minmax(0, 1fr) 3.4em; }
.me-card { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.rel { grid-template-columns: 64px minmax(0, 1fr); column-gap: 12px; }
.rel > :not(.rel-pt) { grid-column: 2; }
.rel-pt { grid-row: 1 / span 6; }

/* 전투 초상화 */
.foe-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.22; pointer-events: none; }
.combatant > :not(.foe-bg):not(.float) { position: relative; }
.cn { display: flex; align-items: center; gap: 10px; min-width: 0; }
.combatant.hit .cpt, .combatant.hurt .cpt { animation: flashWhite 0.35s steps(2); }
@keyframes flashWhite { 50% { filter: brightness(2.6) saturate(0); } }
.intent b { display: inline-flex; align-items: center; gap: 8px; }
.intent.hidden .iic, .intent.vague .iic { opacity: 0.55; }
.chip.ally { display: inline-flex; align-items: center; gap: 5px; }
img.mini { width: 22px; height: 22px; border-radius: 3px; box-shadow: none; }
.toast { display: flex; align-items: center; gap: 8px; }

/* 캐릭터 만들기 */
.hero { margin: 0 0 22px; max-width: 760px; }
.look-row { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
.look-preview { display: grid; gap: 8px; justify-items: center; }
.look-moods { display: flex; gap: 4px; }
.look-opts { flex: 1 1 280px; display: grid; gap: 10px; }
.look-group { display: grid; gap: 4px; }
.look-group .lg { font: 12px var(--font-sys); color: var(--muted); }
.chip.pick { cursor: pointer; background: var(--page); padding: 3px 10px; }
.chip.pick[aria-pressed="true"] { border-color: var(--sys); color: var(--sys); background: var(--sys-bg); box-shadow: inset 0 0 0 1px var(--sys); }
.ending-art { margin-bottom: 6px; }
.bond-row { display: flex; flex-wrap: wrap; gap: 14px; }
.bond { margin: 0; display: grid; justify-items: center; gap: 4px; }
.bond figcaption { font: 12px var(--font-sys); color: var(--muted); }
.doom-ic { margin-right: -8px; }
.tod-ic { margin-right: 6px; }

/* 계절 입자 */
#ambience { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
#app > * { position: relative; z-index: 1; }
#ambience i { position: absolute; top: -12px; left: var(--x); animation: fall var(--d) linear var(--delay) infinite; }
#ambience.petal i { width: 5px; height: 4px; background: #f6a9c1; border-radius: 4px 0; opacity: 0.55; }
#ambience.leaf i { width: 5px; height: 4px; background: #8fd16a; border-radius: 0 4px; opacity: 0.4; }
#ambience.snow i { width: 3px; height: 3px; background: #fff; border-radius: 50%; opacity: 0.7; box-shadow: 0 0 2px rgba(120, 140, 180, 0.6); }
#ambience.rain i { width: 1px; height: 14px; background: linear-gradient(transparent, rgba(110, 160, 220, 0.55)); animation-name: rain; }
#ambience.firefly i { top: var(--y); width: 3px; height: 3px; border-radius: 50%; background: #d4f08a; box-shadow: 0 0 6px 2px rgba(212, 240, 138, 0.5); animation-name: drift; animation-timing-function: ease-in-out; animation-direction: alternate; }
@keyframes fall { to { transform: translate(var(--drift), 105vh) rotate(540deg); } }
@keyframes rain { to { transform: translate(-30px, 105vh); } }
@keyframes drift { 0% { transform: translate(0, 0); opacity: 0.1; } 50% { opacity: 0.9; } 100% { transform: translate(var(--drift), -40px); opacity: 0.2; } }


/* ================================================================ 무대 (비주얼 노벨식) */
.play { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px 0 28px; margin-left: calc(var(--gutter) * -1); padding-left: var(--gutter); }
.play > * { width: min(100%, 880px); margin-inline: auto; box-sizing: border-box; }
.theater .dialog { transition: opacity 0.25s ease; }
.theater { position: relative; width: min(100%, 880px, calc((100vh - 330px) * 16 / 9)); flex: none; }
.theater .stage { width: 100%; }
@media (min-width: 861px) {
  .theater .dialog { position: absolute; z-index: 5; display: flex; flex-direction: column; left: 2.2%; right: 2.2%; bottom: 3%; min-height: 0; height: 30%; background: rgba(9, 11, 24, 0.84); color: #eef1fb; border-color: rgba(255, 255, 255, 0.14); backdrop-filter: blur(3px); box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.7); font-size: clamp(14px, 1.6vw, 17px); line-height: 1.7; padding: 14px 20px 12px; }
  .theater .dialog .dl-plate { background: #eef1fb; color: #0e0b16; }
  .theater .dialog .dl-next { color: #9ad0ff; }
  .theater .dialog.k-inner .dl-text { color: #b9c3dc; border-left-color: rgba(255, 255, 255, 0.25); }
  .theater .dialog.k-sys { background: rgba(14, 34, 64, 0.88); border-color: rgba(98, 195, 255, 0.5); }
  .theater .dialog.k-sys .dl-text { color: #9ad0ff; }
  .theater .dialog.k-check .dl-text, .theater .dialog.k-prompt .dl-text p + p { color: #aab4cc; }
  .theater .dialog.k-battle .bl { color: #aab4cc; }
  .theater .dialog.k-battle .bl.me { color: #fff; }
  .theater .dialog.k-battle .bl.ally { color: #5fd39c; }
  .theater .dialog.k-battle .bl.sys { color: #9ad0ff; }
  .theater .dialog .dl-text { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
  .theater .st-intro { bottom: auto; top: 22%; }
  .theater .actor { bottom: 14%; width: 34%; }
  .theater .stage.battle .actor { width: 30%; bottom: 20%; }
  .theater .stage.battle ~ .dialog { height: 21%; }
  .play.carding .theater .dialog { opacity: 0; pointer-events: none; }
  .st-chips { top: 4%; }
}
.stage { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #0b0d18; box-shadow: 0 0 0 1px var(--line), 0 24px 60px -34px rgba(0, 0, 0, 0.85); cursor: pointer; flex: none; user-select: none; -webkit-tap-highlight-color: transparent; }
.st-bg, .st-actors, .st-hud, .st-fx { position: absolute; inset: 0; }
.st-bgimg { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; opacity: 0; transition: opacity 0.6s ease; }
.st-bgimg.on { opacity: 1; }
.st-bgimg.now { transition: none; }
.st-actors { pointer-events: none; transition: opacity 0.35s ease; }
.st-actors.hidden { opacity: 0; }
.st-hud, .st-fx { pointer-events: none; }

/* 인물 */
.actor { position: absolute; bottom: 0; left: var(--x, 50%); translate: -50% 0; width: 40%; aspect-ratio: 1; transition: left 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.3s ease; }
.actor-img { width: 100%; height: 100%; background-size: 300% 100%; background-position: 0% 0; background-repeat: no-repeat; image-rendering: pixelated; animation: breathe 3.2s steps(1) infinite; }
.actor-img.blink { background-position: 50% 0; }
.actor-img.talk { background-position: 100% 0; }
@keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.5625%); } }
.actor.idle { filter: brightness(0.6) saturate(0.75); }
.actor.speaking { z-index: 2; }
.actor.enter { animation: actorIn 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.25) both; }
.actor.intro { animation: actorIntro 0.75s cubic-bezier(0.2, 0.9, 0.3, 1.1) both; }
.actor.leave { animation: actorOut 0.32s ease-in both; }
@keyframes actorIn { from { opacity: 0; transform: translateY(7%); } }
@keyframes actorIntro { 0% { opacity: 0; transform: translateX(-18%); filter: brightness(3) saturate(0); } 60% { filter: brightness(1.4); } }
@keyframes actorOut { to { opacity: 0; transform: translateY(6%); } }
.r-hop { animation: hop 0.45s cubic-bezier(0.3, 1.6, 0.5, 1); }
.r-bounce { animation: bounce 0.5s ease-out; }
.r-shake { animation: ashake 0.4s; }
.r-sink { animation: sink 0.7s ease-out; }
.r-wobble { animation: wobble 0.5s; }
.r-lean { animation: lean 0.45s ease-out; }
@keyframes hop { 40% { transform: translateY(-9%); } }
@keyframes bounce { 30% { transform: translateY(-4%); } 60% { transform: translateY(0); } 80% { transform: translateY(-1.5%); } }
@keyframes ashake { 20% { transform: translateX(-3%); } 40% { transform: translateX(3%); } 60% { transform: translateX(-2%); } 80% { transform: translateX(1%); } }
@keyframes sink { 50% { transform: translateY(3%); } }
@keyframes wobble { 25% { transform: rotate(-2.5deg); } 75% { transform: rotate(2.5deg); } }
@keyframes lean { 50% { transform: translateY(1.5%) scale(1.02); } }
/* 전투 몸짓 */
.lunge-r { animation: lungeR 0.32s cubic-bezier(0.3, 0, 0.3, 1); }
.lunge-l { animation: lungeL 0.32s cubic-bezier(0.3, 0, 0.3, 1); }
.hurt { animation: hurt 0.38s steps(2, end); }
.dodge { animation: dodge 0.4s ease-out; }
.stagger { animation: stagger 0.45s ease-out; }
.defeat { animation: defeat 0.9s ease-in forwards; }
@keyframes lungeR { 45% { transform: translateX(28%) scale(1.04); } }
@keyframes lungeL { 45% { transform: translateX(-28%) scale(1.04); } }
@keyframes hurt { 0% { filter: brightness(3) saturate(0); transform: translateX(4%); } 50% { filter: brightness(1.6); transform: translateX(-3%); } 100% { filter: none; transform: none; } }
@keyframes dodge { 30% { transform: translateX(-16%); opacity: 0.35; } }
@keyframes stagger { 30% { transform: translateX(6%) rotate(3deg); } }
@keyframes defeat { 20% { filter: brightness(3); } to { transform: translateY(18%) rotate(4deg); opacity: 0; filter: grayscale(1); } }

/* 무대 연출 */
.stage.shake { animation: stShake 0.3s; }
.stage.shake-big { animation: stShakeBig 0.45s; }
@keyframes stShake { 25% { transform: translate(-3px, 2px); } 50% { transform: translate(3px, -2px); } 75% { transform: translate(-2px, 1px); } }
@keyframes stShakeBig { 15% { transform: translate(-8px, 4px); } 30% { transform: translate(7px, -5px); } 45% { transform: translate(-6px, 3px); } 60% { transform: translate(4px, -2px); } 80% { transform: translate(-2px, 1px); } }
.stage.glitch { animation: stGlitch 0.6s steps(3); }
@keyframes stGlitch { 30% { filter: hue-rotate(80deg) saturate(2); transform: translateX(-4px); } 60% { filter: invert(0.15) hue-rotate(-60deg); transform: translateX(4px); } }
.stage.defeated .st-bg, .stage.defeated .st-actors { filter: grayscale(1) brightness(0.65); transition: filter 0.8s; }
.st-flash { position: absolute; inset: 0; animation: flash 0.5s ease-out forwards; }
.st-flash.white { background: #fff; }
.st-flash.red { background: radial-gradient(circle, transparent 30%, rgba(229, 64, 79, 0.75)); }
.st-flash.gold { background: radial-gradient(circle, rgba(255, 243, 176, 0.9), rgba(255, 211, 107, 0.2)); }
.st-flash.blue { background: radial-gradient(circle, rgba(191, 230, 255, 0.85), rgba(66, 120, 212, 0.15)); }
@keyframes flash { from { opacity: 0.85; } to { opacity: 0; } }
.st-title { position: absolute; top: 4%; left: 0; max-width: 78%; padding: 7px 16px 8px 14px; background: linear-gradient(90deg, rgba(8, 10, 22, 0.86), rgba(8, 10, 22, 0.55)); color: #eef1fb; border-left: 3px solid #62c3ff; opacity: 0; transform: translateX(-104%); pointer-events: none; display: grid; }
.st-title .tw { font: 11px var(--font-sys); color: #9fb3d9; letter-spacing: 0.06em; }
.st-title b { font: 400 clamp(16px, 2.6vw, 22px)/1.25 var(--font-title); }
.st-title.show { animation: titleIn 3.6s cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }
@keyframes titleIn { 0% { opacity: 0; transform: translateX(-104%); } 12% { opacity: 1; transform: none; } 80% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateX(-6%); } }
.st-chips { position: absolute; top: 4%; right: 3%; display: grid; gap: 5px; justify-items: end; }
.st-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 6px; border-radius: 999px; font: 700 12.5px var(--font-sys); background: rgba(8, 10, 22, 0.82); color: #eef1fb; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12); animation: chipUp 2.4s cubic-bezier(0.2, 0.9, 0.3, 1) both; }
.st-chip.up { color: #9df0c4; }
.st-chip.down { color: #ff9aa8; }
.st-chip.bond { color: #ffc9d9; }
@keyframes chipUp { 0% { opacity: 0; transform: translateY(10px) scale(0.9); } 12% { opacity: 1; transform: none; } 82% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-10px); } }
.st-pop { position: absolute; translate: -50% -50%; font: 800 clamp(20px, 4vw, 34px)/1 var(--font-sys); color: #fff; text-shadow: 0 2px 0 #000, 0 0 10px rgba(0, 0, 0, 0.6); animation: popUp 1.25s cubic-bezier(0.2, 1.5, 0.4, 1) forwards; white-space: nowrap; }
.st-pop.crit { color: #ffd36b; font-size: clamp(28px, 6vw, 48px); }
.st-pop.me { color: #ff5d73; }
.st-pop.heal, .st-pop.ally { color: #5fd39c; }
.st-pop.guard, .st-pop.read { color: #9ad0ff; font-size: clamp(18px, 3.4vw, 28px); }
.st-pop.gold { color: #ffd36b; font-size: clamp(18px, 3.4vw, 28px); }
.st-pop.tag { font-size: clamp(11px, 1.8vw, 15px); letter-spacing: 0.3em; color: #ffd36b; }
@keyframes popUp { 0% { opacity: 0; transform: scale(2.2); } 14% { opacity: 1; transform: scale(0.9); } 24% { transform: scale(1.05); } 70% { opacity: 1; transform: translateY(-10px); } 100% { opacity: 0; transform: translateY(-28px); } }
.st-slash { position: absolute; width: 26%; height: 34%; translate: -50% -50%; animation: slash 0.36s ease-out forwards; }
.st-slash.slash { background: linear-gradient(135deg, transparent 44%, #fff 48%, #fff 52%, transparent 56%); filter: drop-shadow(0 0 6px #fff); }
.st-slash.claw { background: linear-gradient(120deg, transparent 30%, #ff5d73 33%, transparent 36%, transparent 46%, #ff5d73 49%, transparent 52%, transparent 62%, #ff5d73 65%, transparent 68%); filter: drop-shadow(0 0 5px #e5404f); }
.st-slash.magic { border-radius: 50%; border: 4px solid #b98af0; box-shadow: 0 0 18px #b98af0, inset 0 0 18px #e9c6ff; width: 18%; height: 30%; }
@keyframes slash { 0% { opacity: 0; transform: scale(0.3) rotate(-20deg); } 30% { opacity: 1; transform: scale(1.1) rotate(0); } 100% { opacity: 0; transform: scale(1.25); } }
.st-spark { position: absolute; width: 5px; height: 5px; animation: spark 0.65s ease-out forwards; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
.st-intro { position: absolute; left: 3%; bottom: 8%; display: grid; gap: 1px; padding: 9px 16px 10px; max-width: 46%; background: linear-gradient(90deg, rgba(8, 10, 22, 0.9), rgba(8, 10, 22, 0.6)); border-left: 3px solid #ffd36b; color: #eef1fb; animation: introIn 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; transition: opacity 0.4s, transform 0.4s; }
.st-intro.out { opacity: 0; transform: translateX(-10px); }
.st-intro .ik { font: 10.5px var(--font-sys); letter-spacing: 0.24em; color: #ffd36b; }
.st-intro b { font: 400 clamp(22px, 4vw, 34px)/1.1 var(--font-title); }
.st-intro .id { font: 13px/1.45 var(--font-story); color: #c9d1e8; }
@keyframes introIn { from { opacity: 0; transform: translateX(-30px); } }
.stage.battle .st-title { display: none; }
.stage.battle .actor { width: 31%; }

/* 카드 (주, 달, 전투 개시, 승패) */
.st-card { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(4, 6, 14, 0.5); opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
.st-card.show { opacity: 1; }
.st-card > * { animation: cardPop 0.45s cubic-bezier(0.2, 1.3, 0.4, 1) both; }
@keyframes cardPop { from { opacity: 0; transform: translateY(14px) scale(0.94); } }
.wk { display: grid; gap: 8px; justify-items: center; text-align: center; padding: 16px 22px; max-width: 86%; background: rgba(10, 13, 28, 0.92); border: 1px solid rgba(98, 195, 255, 0.4); border-radius: 6px; color: #eef1fb; }
.wk-t { font: 700 13px var(--font-sys); letter-spacing: 0.1em; color: #62c3ff; }
.wk-chips { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
.wk-chips .st-chip { animation: none; }
.wk-s { margin: 0; font: 16px/1.6 var(--font-story); color: #dfe5f5; }
.st-card.month { background: linear-gradient(180deg, transparent 40%, rgba(4, 6, 14, 0.85)); place-items: end start; }
.mo { padding: 0 6% 7%; color: #fff; display: grid; gap: 2px; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7); }
.mo-k { font: 11px var(--font-sys); letter-spacing: 0.4em; color: #ffd36b; }
.mo h2 { margin: 0; font: 400 clamp(30px, 6vw, 54px)/1.05 var(--font-title); }
.mo-s { margin: 2px 0 0; font: clamp(14px, 2vw, 17px)/1.5 var(--font-story); }
.mo-r { margin: 4px 0 0; font: 12px/1.5 var(--font-sys); color: #ffd36b; }
.bt { display: grid; justify-items: center; color: #fff; text-shadow: 0 3px 0 #000; animation: slam 0.5s cubic-bezier(0.2, 1.6, 0.4, 1) both !important; }
.bt-k { font: 800 12px var(--font-sys); letter-spacing: 0.6em; color: #ff5d73; }
.bt b { font: 400 clamp(28px, 6vw, 52px)/1.1 var(--font-title); }
@keyframes slam { from { opacity: 0; transform: scale(2.4); } }
.res-stamp { font: 400 clamp(46px, 10vw, 92px)/1 var(--font-title); padding: 0 24px; border: 4px solid currentColor; border-radius: 6px; transform: rotate(-4deg); text-shadow: 0 4px 0 rgba(0, 0, 0, 0.6); animation: slam 0.55s cubic-bezier(0.2, 1.6, 0.4, 1) both !important; }
.res-stamp.win { color: #ffd36b; }
.res-stamp.lose { color: #ff5d73; }

/* 주사위 */
.st-dice { position: absolute; left: 50%; top: 44%; translate: -50% -50%; display: grid; justify-items: center; gap: 6px; transition: opacity 0.4s; }
.st-dice.out { opacity: 0; }
.st-die { position: relative; width: clamp(64px, 13vw, 104px); aspect-ratio: 1; display: grid; place-items: center; animation: dieRoll 0.7s cubic-bezier(0.25, 0.7, 0.35, 1); filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.45)); }
.st-die img { position: absolute; inset: 0; width: 100%; height: 100%; }
.st-die b { position: relative; font: 800 clamp(20px, 4vw, 32px)/1 var(--font-sys); color: #0e0b16; }
.st-dice.landed .st-die { animation: dieLand 0.3s cubic-bezier(0.2, 1.8, 0.4, 1); }
@keyframes dieRoll { 0% { transform: translate(-220%, -60%) rotate(-720deg) scale(0.6); } 55% { transform: translate(14%, 6%) rotate(20deg); } 75% { transform: translate(-6%, -8%) rotate(-8deg); } 100% { transform: none; } }
@keyframes dieLand { 40% { transform: scale(1.25); } }
.st-dice-cap { font: 700 12px var(--font-sys); color: #fff; background: rgba(8, 10, 22, 0.8); padding: 2px 10px; border-radius: 999px; }
.st-stamp { position: absolute; top: -12%; font: 400 clamp(24px, 5vw, 40px)/1 var(--font-title); padding: 2px 14px; border: 3px solid currentColor; border-radius: 4px; transform: rotate(-8deg); background: rgba(8, 10, 22, 0.7); animation: slam 0.45s cubic-bezier(0.2, 1.6, 0.4, 1) both; white-space: nowrap; }
.st-stamp.ok { color: #62c3ff; }
.st-stamp.ng { color: #ff5d73; }

/* 전투 HUD */
.st-hud > * { position: absolute; background: rgba(8, 10, 22, 0.78); color: #e8ecf8; border-radius: 6px; padding: 6px 9px; font: 11.5px/1.4 var(--font-sys); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08); }
.hud-foe { top: 3%; right: 3%; width: 40%; display: grid; gap: 4px; }
.hud-foe.enraged { box-shadow: 0 0 0 1px #ff5d73, 0 0 18px -4px #ff5d73; }
.hud-me { top: 3%; left: 3%; width: 38%; display: grid; gap: 4px; }
.hn { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.hn b { font: 700 13px var(--font-ui); }
.st-hud .num { color: #aab4cc; }
.st-hud .gauge { background: rgba(255, 255, 255, 0.14); }
.st-hud .rl { color: #aab4cc; }
.hud-intent { top: 20%; right: 3%; width: 40%; border-radius: 6px; }
.hud-intent.intent { grid-template-columns: auto minmax(0, 1fr); background: rgba(8, 10, 22, 0.82); border: 1px solid rgba(255, 255, 255, 0.14); }
.hud-intent.exact { border-color: #62c3ff; }
.hud-intent.danger { border-color: #ff5d73; background: rgba(60, 10, 24, 0.85); }
.hud-intent b { font-size: clamp(16px, 2.6vw, 22px); color: #fff; }
.hud-intent.exact b { color: #9ad0ff; }
.hud-intent.danger b { color: #ff8a8a; }
.hud-intent .it { color: #c9d1e8; font-size: 12.5px; }
.hud-intent .il { color: #8b95ac; }
.hud-tags { top: 21%; left: 3%; background: none !important; box-shadow: none !important; padding: 0 !important; display: flex; flex-wrap: wrap; gap: 4px; max-width: 40%; }
.hud-tags .chip { background: rgba(8, 10, 22, 0.78); color: #e8ecf8; border-color: rgba(255, 255, 255, 0.2); }

/* 대사창 */
.dialog { position: relative; min-height: 8.6em; padding: 18px 22px 16px; background: var(--page); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); cursor: pointer; font: 17px/1.8 var(--font-story); user-select: none; -webkit-tap-highlight-color: transparent; }
.dl-plate { position: absolute; top: -15px; left: 16px; display: none; align-items: center; gap: 7px; padding: 3px 14px 3px 6px; background: var(--ink); color: var(--page); border-radius: 999px; font: 700 13px var(--font-ui); box-shadow: var(--shadow); }
.dialog.has-name .dl-plate { display: inline-flex; }
.dl-plate:not(:has(img)) { padding-left: 14px; }
.dl-face img { display: block; width: 28px; height: 28px; border-radius: 50%; box-shadow: none; background: var(--page); }
.dl-text p { margin: 0 0 0.35em; }
.dl-text p:last-child { margin-bottom: 0; }
.dl-next { position: absolute; right: 16px; bottom: 8px; font-size: 12px; color: var(--sys); opacity: 0; }
.dl-next.on { opacity: 1; animation: nextBlink 1s ease-in-out infinite; }
@keyframes nextBlink { 50% { transform: translateY(3px); opacity: 0.4; } }
.dialog.k-inner .dl-text { color: var(--muted); border-left: 2px solid var(--line); padding-left: 12px; }
.dialog.k-sys { background: var(--sys-bg); border-color: var(--sys-line); }
.dialog.k-sys .dl-text { font: 14.5px/1.7 var(--font-sys); color: var(--sys); }
.dialog.k-check .dl-text, .dialog.k-prompt .dl-text p + p { font: 13.5px/1.7 var(--font-sys); color: var(--muted); }
.dialog.k-prompt .dl-text p:first-child { font: 400 22px/1.4 var(--font-title); }
.dialog.k-battle { font: 13.5px/1.65 var(--font-sys); }
.dialog.k-battle .bl { margin: 0; color: var(--muted); }
.dialog.k-battle .bl.me { color: var(--ink); }
.dialog.k-battle .bl.ally { color: var(--ok); }
.dialog.k-battle .bl.sys { color: var(--sys); }
.dialog.k-battle .bl { animation: lineIn 0.25s ease-out; }

/* 조작부 */
.controls { padding: 0; gap: 8px; }
.controls.wait { display: none; }
.choices { display: grid; gap: 8px; }
.choice { align-items: center; }
.choice .ct { flex: 1; min-width: 0; }
.odds { display: inline-flex; align-items: center; gap: 5px; flex: none; padding: 2px 9px 2px 5px; border-radius: 999px; font: 700 12px var(--font-sys); border: 1px solid currentColor; }
.odds.hi { color: var(--ok); }
.odds.mid { color: var(--gold); }
.odds.lo { color: var(--doom); }
.pv { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.pv-c { display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px 1px 3px; border-radius: 999px; font: 700 11px var(--font-sys); background: var(--bg); }
.pv-c.up { color: var(--ok); }
.pv-c.down { color: var(--doom); }
.continue { justify-self: end; }
.toolbar { display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
.tb-hint { margin-right: auto; font: 11.5px var(--font-sys); color: var(--muted); }
.toolbar .ghost[aria-pressed="true"] { color: var(--sys); border-color: var(--sys); }

/* 기록 서랍 */
.drawer { position: fixed; inset: 0; z-index: 40; background: rgba(4, 6, 14, 0); transition: background 0.25s; }
.drawer.open { background: rgba(4, 6, 14, 0.5); }
.drawer-box { position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--bg); box-shadow: -20px 0 50px -30px rgba(0, 0, 0, 0.8); display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.26s cubic-bezier(0.2, 0.8, 0.2, 1); }
.drawer.open .drawer-box { transform: none; }
.drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 12px var(--gutter); border-bottom: 1px solid var(--line); }
.drawer-body { overflow-y: auto; padding: 0 var(--gutter) 40px; flex: 1; scroll-behavior: smooth; }

@media (max-width: 860px) {
  .create-grid { grid-template-columns: minmax(0, 1fr); padding-bottom: 120px; }
  .ledger { position: static; }
  .bar { gap: 6px 12px; }
  .brand { font-size: 19px; }
  #panel-toggle, #restart { order: 1; }
  .clock { order: 2; font-size: 12px; }
  .meter-wrap { order: 3; }
  .meter-wrap .ml { display: none; }
  .meter-wrap .ms { display: inline; }
  .meter { width: 56px; }
  .mobilebar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; align-items: center; gap: 12px; padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--page); border-top: 1px solid var(--line); }
  .mobilebar .left { flex: 1; font: 13px var(--font-sys); }
  .mobilebar .primary { width: auto; padding-inline: 20px; }
  .game { grid-template-columns: minmax(0, 1fr); }
  #panel-toggle { display: inline-block; }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 72%; z-index: 6; margin: 0; border: 0; border-top: 1px solid var(--sys-line); background: var(--bg); padding: 0 var(--gutter) calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateY(105%); transition: transform 0.25s ease-out; box-shadow: 0 -18px 40px -24px rgba(0, 0, 0, 0.5); }
  .panel.open { transform: none; }
  .story { margin-left: calc(var(--gutter) * -1); margin-right: calc(var(--gutter) * -1); padding-inline: var(--gutter); }
  .scene { font-size: 16.5px; }
  .say { gap: 10px; }
  .play { margin-right: calc(var(--gutter) * -1); padding-right: var(--gutter); padding-top: 10px; }
  .stage { border-radius: 8px; }
  .dialog { font-size: 15.5px; min-height: 7.6em; padding: 16px 16px 14px; }
  .dialog.k-prompt, .dialog.k-battle { min-height: 0; }
  .tb-hint { display: none; }
  .st-hud > * { font-size: 10.5px; padding: 4px 6px; }
  .hud-intent .it { display: none; }
  .activities { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .strip { height: 48px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .float { display: none; }
}

/* ---- 판정 확률: 말 + 요인 */
.choice { flex-wrap: wrap; }
.choice .ct { flex: 1 1 60%; min-width: 0; }
.odds { flex-wrap: wrap; row-gap: 2px; max-width: 100%; }
.odds b { font-weight: 700; }
.odds .fx { font: 600 11px var(--font-sys); padding: 0 5px; border-radius: 999px; background: color-mix(in srgb, currentColor 10%, transparent); }
.odds .fx.up { color: var(--ok); }
.odds .fx.down { color: var(--doom); }
.choice .past { display: inline-block; margin-right: 6px; padding: 0 6px; border-radius: 3px; font: 600 11px var(--font-sys); color: #b98af0; border: 1px solid #b98af0; vertical-align: 1px; }

/* ---- 기억의 파편 */
.shards { display: inline-flex; align-items: center; gap: 1px; margin-left: 10px; }
.shards .sh, .memory .sh { width: 16px; height: 16px; }
.sh.off { opacity: 0.25; filter: grayscale(1); }
.shards .loopn { margin-left: 4px; font: 700 11px var(--font-sys); color: #b98af0; }
.memory { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 8px; }
.memory .gems { display: inline-flex; gap: 1px; }
.memory .mtxt { font: 13px var(--font-story); color: #8d6fd6; }
.remember { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border: 1px solid #8155c9; border-radius: 999px; background: color-mix(in srgb, #8155c9 10%, var(--page)); color: #8155c9; font: 600 13px var(--font-ui); cursor: pointer; }
.remember:hover:not(:disabled) { background: color-mix(in srgb, #8155c9 20%, var(--page)); }
.remember:disabled { opacity: 0.45; cursor: not-allowed; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .remember { color: #c9a6ff; border-color: #b98af0; } :root:not([data-theme="light"]) .memory .mtxt { color: #c9a6ff; } }
:root[data-theme="dark"] .remember { color: #c9a6ff; border-color: #b98af0; }
:root[data-theme="dark"] .memory .mtxt { color: #c9a6ff; }
.future { display: grid; gap: 3px; margin-top: 6px; padding: 6px 8px; border-left: 2px solid #b98af0; background: color-mix(in srgb, #b98af0 8%, transparent); border-radius: 0 4px 4px 0; font: 12px/1.5 var(--font-ui); animation: futureIn 0.5s ease both; }
@keyframes futureIn { from { opacity: 0; transform: translateX(-6px); filter: blur(2px); } to { opacity: 1; transform: none; filter: none; } }
.future .fb { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 6px; }
.future .fl { font: 700 11px var(--font-sys); padding: 0 6px; border-radius: 3px; }
.future .fl.ok { color: var(--ok); border: 1px solid var(--ok); }
.future .fl.ng { color: var(--doom); border: 1px solid var(--doom); }
.future .fc { display: inline-flex; align-items: center; gap: 3px; font: 600 11.5px var(--font-sys); color: var(--muted); }
.future .fc img { width: 14px; height: 14px; }
.future .fc.up { color: var(--ok); }
.future .fc.down { color: var(--doom); }
.future .fc.bond { color: #e0559a; }
.future .fc.gain { color: var(--gold); }
.future .fc.fate { color: #8155c9; }
.future .fc.ev { color: var(--sys); font-weight: 500; }
.future .fc.war { color: var(--doom); }
.future .fc.death { color: #fff; background: var(--doom); padding: 0 6px; border-radius: 3px; }
.future .fc.more { color: var(--muted); font-weight: 400; }
.future .fv { color: var(--muted); font-style: italic; }
.choice.seen, .activity.seen { border-color: #b98af0; }

/* ---- 판정 주사위: 결정적 요인 */
.st-dice-cap { display: inline-flex; align-items: center; gap: 5px; }
.st-dice-cap img { width: 16px; height: 16px; }
.st-stamp.big { font-size: clamp(30px, 6.4vw, 52px); }
.st-key { position: absolute; top: 112%; white-space: nowrap; font: 700 13px var(--font-sys); padding: 3px 12px; border-radius: 999px; background: rgba(8, 10, 22, 0.85); animation: keyIn 0.4s cubic-bezier(0.2, 1.6, 0.4, 1) both; }
.st-key.ok { color: #7ff0b8; }
.st-key.ng { color: #ff8a9a; }
@keyframes keyIn { from { opacity: 0; transform: translateY(6px) scale(0.9); } to { opacity: 1; transform: none; } }
.st-flash.violet { background: radial-gradient(circle, rgba(233, 198, 255, 0.85), rgba(129, 85, 201, 0.2)); }

/* ---- 죽음과 회귀 */
.stage.dead .st-bg, .stage.dead .st-actors { filter: grayscale(1) brightness(0.35); transition: filter 1.2s ease; }
.deathbox { display: grid; gap: 8px; justify-items: start; padding: 4px 2px; }
.deathbox .dt { margin: 0; font: 400 26px var(--font-title); color: var(--doom); letter-spacing: 0.2em; }
.deathbox p { margin: 0; font: 15px var(--font-story); }
.regress { background: #4f3190 !important; color: #fff !important; }
.deathlog { padding: 8px 12px; border: 1px solid var(--doom); color: var(--doom); font: 700 13px var(--font-sys); border-radius: var(--r); }
.looplog { padding: 8px 12px; border: 1px solid #b98af0; color: #8155c9; font: 700 13px var(--font-sys); border-radius: var(--r); }
.mo.loop .mo-k { color: #e9c6ff; }
.toast.shard { color: #8155c9; border-color: #b98af0; }

/* ---- 가방 */
.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.slot { display: grid; justify-items: center; gap: 1px; padding: 6px 4px; border: 1px dashed var(--line); border-radius: var(--r); background: var(--page); font: 11px var(--font-ui); color: var(--muted); cursor: pointer; min-width: 0; }
.slot.on { border-style: solid; border-color: var(--sys-line); color: var(--ink); }
.slot:disabled { cursor: default; }
.slot .ghost { opacity: 0.3; filter: grayscale(1); }
.slot .sl { font: 600 10.5px var(--font-sys); color: var(--sys); }
.slot .sn { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
