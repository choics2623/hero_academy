<title>멸망까지 10년</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;600&family=Nanum+Gothic+Coding:wght@400;700&family=Song+Myung&display=swap">
<style>
/* Layout: 왼쪽은 책처럼 읽는 이야기 기둥, 오른쪽은 웹소설식 '상태창'.
   이야기는 명조, 시스템(상태창·공략 노트·붕괴도)은 고정폭 + 파란 창으로 확실히 구분한다. */
:root {
  --bg: #e6e9f0;
  --page: #f7f8fb;
  --ink: #1b2030;
  --muted: #5a6276;
  --line: #c8cedb;
  --sys: #2154cf;
  --sys-bg: rgba(33, 84, 207, 0.06);
  --sys-line: rgba(33, 84, 207, 0.35);
  --gold: #8f6610;
  --doom: #b0223a;
  --on-accent: #ffffff;
  --shadow: 0 1px 0 rgba(27, 32, 48, 0.04), 0 8px 24px -16px rgba(27, 32, 48, 0.25);
  --font-title: 'Song Myung', 'Gowun Batang', 'AppleMyungjo', serif;
  --font-story: 'Gowun Batang', 'Noto Serif KR', 'AppleMyungjo', 'Batang', serif;
  --font-sys: 'Nanum Gothic Coding', 'D2Coding', ui-monospace, 'SFMono-Regular', monospace;
  --font-ui: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --r: 6px;
  --gutter: clamp(16px, 3vw, 32px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f1b; --page: #121828; --ink: #dde3f1; --muted: #8b95ac; --line: #263049;
    --sys: #62c3ff; --sys-bg: rgba(98, 195, 255, 0.07); --sys-line: rgba(98, 195, 255, 0.32);
    --gold: #e3b95a; --doom: #ff5d73; --on-accent: #0b0f1b;
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 10px 30px -18px rgba(0, 0, 0, 0.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f1b; --page: #121828; --ink: #dde3f1; --muted: #8b95ac; --line: #263049;
  --sys: #62c3ff; --sys-bg: rgba(98, 195, 255, 0.07); --sys-line: rgba(98, 195, 255, 0.32);
  --gold: #e3b95a; --doom: #ff5d73; --on-accent: #0b0f1b;
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 10px 30px -18px rgba(0, 0, 0, 0.8);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-ui); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--sys); outline-offset: 2px; }
#app { height: 100%; padding-inline: var(--gutter); display: flex; flex-direction: column; }

/* ---------- 상단 막대 */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.brand { font: 22px/1 var(--font-title); letter-spacing: 0.02em; margin-right: auto; }
.clock { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 13px var(--font-sys); }
.clock .doom { color: var(--doom); }
.meter-wrap { display: flex; align-items: center; gap: 8px; font: 12px var(--font-sys); color: var(--muted); }
.meter { width: 90px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--doom); transition: width 0.4s; }
.meter-wrap .ms { display: none; }
.meter-wrap b { color: var(--doom); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3.2em; }
.ghost { background: none; border: 1px solid var(--line); border-radius: var(--r); padding: 4px 10px; font-size: 12px; color: var(--muted); cursor: pointer; }
.ghost:hover { color: var(--ink); border-color: var(--muted); }
.ghost.danger { color: var(--doom); border-color: var(--doom); }
#panel-toggle { display: none; }

/* ---------- 캐릭터 생성 */
.create { flex: 1; overflow-y: auto; margin-inline: calc(var(--gutter) * -1); padding-inline: var(--gutter); }
.create-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; max-width: 1180px; margin-inline: auto; padding-block: 28px 64px; }
.intro h1 { font: 400 clamp(40px, 7vw, 76px)/1.05 var(--font-title); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.intro .lede { font: 17px/1.85 var(--font-story); color: var(--muted); max-width: 34em; margin: 14px 0 0; }
.intro .lede em { font-style: normal; color: var(--ink); border-bottom: 1px solid var(--doom); }
.resume { margin-top: 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--sys-line); background: var(--sys-bg); border-radius: var(--r); font: 13px var(--font-sys); color: var(--sys); }
.resume span { flex: 1 1 14em; }
.step { margin-top: 34px; }
.step h3 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 0 0 12px; font: 600 13px var(--font-ui); letter-spacing: 0.08em; color: var(--ink); }
.step h3 small { font: 12px var(--font-ui); letter-spacing: 0; color: var(--muted); font-weight: 400; }
.name-input { font: 18px var(--font-story); padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--page); color: var(--ink); width: min(100%, 16em); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.card { text-align: left; display: grid; gap: 3px; align-content: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--page); cursor: pointer; min-width: 0; }
.card:hover:not([disabled]) { border-color: var(--muted); }
.card[aria-pressed="true"] { border-color: var(--sys); background: var(--sys-bg); box-shadow: inset 0 0 0 1px var(--sys); }
.card[disabled] { opacity: 0.42; cursor: not-allowed; }
.card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 600; font-size: 14px; }
.card .desc { font-size: 12.5px; line-height: 1.5; color: var(--muted); }
.card .why { font-size: 11.5px; color: var(--doom); }
.card select { margin-top: 4px; font: 12px var(--font-ui); padding: 2px 4px; border: 1px solid var(--sys-line); border-radius: 4px; background: var(--page); color: var(--ink); justify-self: start; }
.cost { font: 700 12px var(--font-sys); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cost.spend { color: var(--sys); }
.cost.gain { color: var(--doom); }
.cost.free { color: var(--gold); }
.cat { font: 12px var(--font-sys); color: var(--muted); margin: 16px 0 6px; letter-spacing: 0.06em; }
.alloc { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.alloc-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--page); font-size: 14px; }
.alloc-row .v { font: 13px var(--font-sys); font-variant-numeric: tabular-nums; min-width: 2.4em; text-align: right; }
.step-btn { width: 26px; height: 26px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; line-height: 1; }
.step-btn[disabled] { opacity: 0.35; cursor: not-allowed; }

.ledger { position: sticky; top: 16px; align-self: start; display: grid; gap: 12px; }
.window { border: 1px solid var(--sys-line); background: var(--sys-bg); border-radius: 3px; padding: 12px 14px; font-family: var(--font-sys); font-size: 13px; }
.window h4 { margin: 0 0 10px; font: 700 12px var(--font-sys); letter-spacing: 0.12em; color: var(--sys); }
.row { display: flex; justify-content: space-between; gap: 10px; padding-block: 2px; font-variant-numeric: tabular-nums; }
.row.total { border-top: 1px dashed var(--sys-line); margin-top: 6px; padding-top: 8px; font-size: 15px; font-weight: 700; }
.row.total .bad { color: var(--doom); }
.errors { margin: 0; padding-left: 1.1em; color: var(--doom); font-size: 12.5px; }
.primary { width: 100%; padding: 12px 16px; border: 0; border-radius: var(--r); background: var(--sys); color: var(--on-accent); font: 600 15px var(--font-ui); cursor: pointer; }
.primary[disabled] { opacity: 0.4; cursor: not-allowed; }
.secondary { width: 100%; padding: 9px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--page); font-size: 13px; cursor: pointer; }
.mobilebar { display: none; }

/* ---------- 게임 화면 */
.game { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; }
.story { overflow-y: auto; min-height: 0; margin-left: calc(var(--gutter) * -1); padding-left: var(--gutter); scroll-padding-bottom: 24px; }
.story-inner { max-width: 40rem; margin-inline: auto; padding-block: 8px 24px; }
.scene { padding-block: 22px 6px; border-top: 1px solid var(--line); font: 17px/1.9 var(--font-story); animation: rise 0.35s ease-out; }
.scene.cont { border-top: 0; padding-top: 4px; }
.scene:first-child { border-top: 0; }
.scene .when { font: 12px var(--font-sys); color: var(--muted); letter-spacing: 0.04em; }
.scene h2 { font: 400 23px/1.3 var(--font-title); margin: 2px 0 12px; text-wrap: balance; }
.scene p { margin: 0 0 0.7em; }
.say .who { display: block; font: 600 12px/1.4 var(--font-ui); letter-spacing: 0.08em; color: var(--muted); margin-bottom: 1px; }
.say.me .who { color: var(--sys); }
.inner { color: var(--muted); border-left: 2px solid var(--line); padding-left: 12px; }
.sysline { font: 13px/1.6 var(--font-sys); color: var(--sys); background: var(--sys-bg); border: 1px solid var(--sys-line); border-radius: 3px; padding: 7px 12px; margin: 0.3em 0 0.9em; }
.pin { display: flex; align-items: center; gap: 8px; font: 13px var(--font-sys); color: var(--gold); margin: 0.2em 0 0.8em; }
.tag { font: 700 11px var(--font-sys); letter-spacing: 0.06em; padding: 1px 6px; border: 1px solid currentColor; border-radius: 3px; }
.act { font: 13px var(--font-sys); color: var(--muted); padding-block: 8px 0; }
.act::before { content: '▸ '; color: var(--sys); }
@keyframes rise { from { transform: translateY(6px); opacity: 0.4; } }

.controls { display: grid; gap: 8px; padding-block: 18px 40px; }
.prompt { font: 12px var(--font-sys); color: var(--muted); letter-spacing: 0.04em; }
.choice { display: flex; gap: 12px; align-items: baseline; text-align: left; padding: 11px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--page); font: 15.5px/1.55 var(--font-story); cursor: pointer; box-shadow: var(--shadow); }
.choice:hover:not([disabled]) { border-color: var(--sys); }
.choice[disabled] { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
.choice .k { font: 12px var(--font-sys); color: var(--sys); min-width: 1.1em; }
.choice .hint { display: block; font: 12px/1.5 var(--font-ui); color: var(--gold); }
.choice .lock { display: block; font: 12px var(--font-ui); color: var(--doom); }
.activities { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 8px; }
.activity { display: grid; gap: 2px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--page); cursor: pointer; box-shadow: var(--shadow); min-width: 0; }
.activity:hover { border-color: var(--sys); }
.activity b { font-size: 14px; font-weight: 600; }
.activity .fx { font: 11.5px var(--font-sys); color: var(--muted); }
.activity .k { font: 11px var(--font-sys); color: var(--sys); }
.continue { justify-self: start; padding: 10px 26px; border: 0; border-radius: var(--r); background: var(--ink); color: var(--page); font: 600 14px var(--font-ui); cursor: pointer; }
.ending { border: 1px solid var(--sys-line); background: var(--sys-bg); border-radius: var(--r); padding: 18px; display: grid; gap: 10px; font-family: var(--font-story); }
.ending h3 { margin: 0; font: 400 24px var(--font-title); }
.ending ul { margin: 0; padding-left: 1.1em; }

.panel { overflow-y: auto; min-height: 0; border-left: 1px solid var(--line); padding: 12px 0 24px 20px; margin-right: calc(var(--gutter) * -1); padding-right: var(--gutter); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; position: sticky; top: 0; background: var(--bg); z-index: 1; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 10px; font-size: 13px; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { color: var(--sys); border-bottom-color: var(--sys); }
.tab .n { font: 11px var(--font-sys); margin-left: 3px; }
.pane { display: grid; gap: 12px; }
.stat { display: grid; grid-template-columns: 4.6em minmax(0, 1fr) 3.4em; gap: 8px; align-items: center; padding-block: 2px; }
.bar-s { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar-s i { display: block; height: 100%; background: var(--sys); }
.bar-s.warn i { background: var(--doom); }
.stat .g { text-align: right; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 12px var(--font-sys); padding: 2px 8px; border: 1px solid var(--sys-line); border-radius: 3px; color: var(--ink); }
.chip.bloom { border-color: var(--gold); color: var(--gold); }
.note { border-bottom: 1px solid var(--line); padding-bottom: 10px; display: grid; gap: 3px; }
.note:last-child { border-bottom: 0; }
.note .stars { font: 12px var(--font-sys); color: var(--gold); letter-spacing: 0.1em; }
.note b { font-size: 14px; }
.note p { margin: 0; font: 14px/1.7 var(--font-story); color: var(--muted); }
.note.bad p { text-decoration: line-through; text-decoration-color: var(--doom); }
.note .warn { font: 12px var(--font-sys); color: var(--doom); }
.empty { font-size: 13px; color: var(--muted); }
.fate { display: grid; gap: 2px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.fate:last-child { border-bottom: 0; }
.fate .st { font: 12px var(--font-sys); }
.fate .st.canon { color: var(--doom); }
.fate .st.changed { color: var(--sys); }
.fate .st.open { color: var(--muted); }
.legend { font-size: 12px; color: var(--muted); }

@media (max-width: 860px) {
  .create-grid { grid-template-columns: minmax(0, 1fr); padding-bottom: 120px; }
  .ledger { position: static; }
  .bar { gap: 6px 12px; }
  .brand { font-size: 19px; }
  #panel-toggle, #restart { order: 1; }
  .clock { order: 2; font-size: 12px; }
  .meter-wrap { order: 3; }
  .meter-wrap .ml { display: none; }
  .meter-wrap .ms { display: inline; }
  .meter { width: 56px; }
  .mobilebar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; align-items: center; gap: 12px; padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--page); border-top: 1px solid var(--line); }
  .mobilebar .left { flex: 1; font: 13px var(--font-sys); }
  .mobilebar .primary { width: auto; padding-inline: 20px; }
  .game { grid-template-columns: minmax(0, 1fr); }
  #panel-toggle { display: inline-block; }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 72%; z-index: 6; margin: 0; border: 0; border-top: 1px solid var(--sys-line); background: var(--bg); padding: 0 var(--gutter) calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateY(105%); transition: transform 0.25s ease-out; box-shadow: 0 -18px 40px -24px rgba(0, 0, 0, 0.5); }
  .panel.open { transform: none; }
  .story { margin-left: calc(var(--gutter) * -1); margin-right: calc(var(--gutter) * -1); padding-inline: var(--gutter); }
  .scene { font-size: 16.5px; }
}
@media (prefers-reduced-motion: reduce) {
  .scene { animation: none; }
  .panel, .meter i { transition: none; }
}
</style>

<div id="app">
  <header class="bar">
    <div class="brand">멸망까지 10년</div>
    <div class="clock" id="clock" hidden><span id="time"></span><span class="doom" id="doom"></span></div>
    <div class="meter-wrap" id="meter" hidden><span class="ml">원작 붕괴도</span><span class="ms" aria-hidden="true">붕괴</span><div class="meter"><i id="collapse-fill" style="width:0%"></i></div><b id="collapse-val">0%</b></div>
    <button class="ghost" id="panel-toggle" type="button" hidden>상태창</button>
    <button class="ghost" id="restart" type="button" hidden>처음으로</button>
  </header>
  <main class="create" id="screen-create"></main>
  <main class="game" id="screen-game" hidden>
    <section class="story" id="story" aria-label="이야기">
      <div class="story-inner">
        <div id="log" aria-live="polite"></div>
        <div class="controls" id="controls"></div>
      </div>
    </section>
    <aside class="panel" id="panel" aria-label="상태창"></aside>
  </main>
</div>
