# 적. pattern은 행동 순서 (한 칸에 여러 개면 그중 무작위). 차지 다음 턴은 항상 강타(1.5배).
# tell = 이 '간파' 수치(지성 + 20×직감 + 10×마력감응) 이상이면 의도가 정확히 보인다. 15 모자라면 흐릿하게.
# reveal = 이 조건이 참이면 항상 정확히 보인다 (공략 노트, 관찰로 얻은 정보).

- id: rats
  name: 동굴 쥐 떼
  hp: 22
  atk: 4
  def: 0
  acc: 14
  tell: 5
  turns: 12
  pattern: [공격, 차지, 공격, 방어]
  weak: { magic: 1.5 }
  tells:
    공격: 쥐들이 이빨을 드러낸다
    차지: 쥐들이 한쪽 구석으로 몰려든다
    강타: 쥐 떼가 한 덩어리가 되어 몸을 낮춘다 — 한꺼번에 덮칠 기세
    방어: 쥐들이 바위틈으로 숨으려 한다
  acts:
    공격: 쥐들이 발목을 물어뜯는다!
    강타: 쥐 떼가 한꺼번에 덮친다!
    방어: 쥐들이 바위틈에 숨었다.
    차지: 쥐들이 한데 모여 꿈틀거린다.
  intro:
    - "[전투 안내] 위에 적의 다음 행동이 보인다. 강타가 오면 방어, 힘을 모으면(차지) 강타로 끊고, 숨으면(방어) 간파나 마법으로."

- id: cult_shadow
  name: 로브 입은 그림자
  hp: 48
  atk: 7
  matk: 8
  def: 2
  acc: 24
  tell: 25
  turns: 12
  pattern: [마법, 공격, 차지, 방어, 마법]
  tells:
    공격: 로브 자락 아래로 단검이 번뜩인다
    마법: 그림자의 손끝에 검붉은 빛이 고인다
    차지: 피의 원에서 무언가를 끌어올린다
    강타: 끌어올린 힘이 단검에 감긴다 — 치명적인 일격
    방어: 그림자가 어둠 속으로 녹아든다
  acts:
    공격: 단검이 옆구리를 스친다!
    마법: 검붉은 저주가 몸을 파고든다!
    차지: 피의 원이 맥박처럼 뛴다.
    강타: 피를 머금은 단검이 내리꽂힌다!
    방어: 그림자가 어둠 속으로 녹아들었다.
  intro:
    - "피로 그린 원 위에서, 로브 입은 그림자가 천천히 고개를 돌린다."
  enrage: { below: 0.4, pattern: [마법, 차지], atk: 1.2, line: "그림자가 피의 원 한가운데로 물러나며 낯선 주문을 외운다!" }

