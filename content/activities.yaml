  art: campus
  desc: 뒷산과 호숫가. 누가 있을지 모른다
  window: { from: "1.3", to: "1.7" }
  effects: ["stress -= 15", "fatigue -= 5", "stat.매력 += 0.3"]
  lines:
    - 나레이션:
        - "교정 가로수길을 따라 걸었다. 바람에 나뭇잎이 뒤집히며 은빛으로 반짝인다."
        - { when: "time.roll < 0.34", text: "교정 가로수길을 따라 걸었다. 바람에 나뭇잎이 뒤집히며 은빛으로 반짝인다." }
        - { when: "time.roll >= 0.34 and time.roll < 0.67", text: "호숫가까지 내려갔다. 물 위에 아카데미 첨탑이 거꾸로 떠 있다." }
        - { when: "time.roll >= 0.67", text: "뒷산 오솔길로 들어섰다. 흙냄새와 풀냄새가 진하다." }
    - 나레이션:
        - "분수대 가장자리에 앉은 학생들이 시험 이야기를 하고 있다."
        - { when: "time.roll < 0.34", text: "분수대 가장자리에 앉은 학생들이 시험 이야기를 하고 있다." }
        - { when: "time.roll >= 0.34 and time.roll < 0.67", text: "돌을 하나 던졌다. 첨탑이 일그러졌다가 천천히 제자리로 돌아온다." }
        - { when: "time.roll >= 0.67", text: "새 한 마리가 가지 끝에서 나를 따라오듯 옮겨 앉는다." }
    - 나레이션:
        - "아무 목적 없이 걷는 건 오랜만이다. 저쪽 세상에선 늘 모니터 앞에 있었으니까."
