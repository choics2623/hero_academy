# 활동: 플레이어가 슬롯마다 고르는 행동. 고르면 effects가 적용되고,
# 그 활동에 걸린(on) 스토리렛 중 하나가 발생한다:
#   조건 있는 일회성 이벤트 > pool 이벤트(서로 무작위) > 조건 없는 일상 묘사
# 피로가 50을 넘으면 훈련 효율이 떨어진다 (식: 1 - max(0, fatigue - 50) / 100).

# ---------------------------------------------------------------- 서장 (입학 전 한 달)
- id: 폐광
  name: 마을 뒤 폐광 탐색
  art: mine
  desc: 원작에서 아렌이 영약을 얻는 곳
  window: "0.2"
  effects: ["fatigue += 20 * (1 + mod.fatigue)"]
  lines:
    - 나레이션:
        - "폐광 입구에 서자 안쪽에서 찬 바람이 불어 나왔다. 젖은 돌과 녹슨 쇠 냄새."
        - { when: "time.roll < 0.34", text: "폐광 입구에 서자 안쪽에서 찬 바람이 불어 나왔다. 젖은 돌과 녹슨 쇠 냄새." }
        - { when: "time.roll >= 0.34 and time.roll < 0.67", text: "두 번째 갱도까지 들어갔다가 돌아 나왔다. 오늘은 더 볼 것이 없다." }
        - { when: "time.roll >= 0.67", text: "(원작의 아렌은 이 폐광에서 영약을 줍는다. 3,000시간 동안 백 번은 본 컷신이다.)" }
    - 나레이션:
        - "랜턴 심지를 올렸다. 버팀목에 누군가 칼로 새긴 이름들이 줄지어 있다."
        - { when: "time.roll < 0.34", text: "랜턴 심지를 올렸다. 버팀목에 누군가 칼로 새긴 이름들이 줄지어 있다." }
        - { when: "time.roll >= 0.34 and time.roll < 0.67", text: "벽을 두드려 보니 속이 빈 소리가 난다. 원작 지도엔 없던 공간이다. …아니, 그냥 무너진 자리일지도." }
        - { when: "time.roll >= 0.67", text: "(실제로 와 보니 컷신보다 훨씬 춥고, 훨씬 어둡고, 훨씬 무섭다.)" }
    - 나레이션:
        - "입구 앞 공터에 새 발자국이 하나도 없다. 이 마을 사람들은 정말로 여길 잊은 모양이다."
        - { when: "time.roll < 0.34", text: "입구 앞 공터에 새 발자국이 하나도 없다. 이 마을 사람들은 정말로 여길 잊은 모양이다." }
        - { when: "time.roll >= 0.34 and time.roll < 0.67", text: "천장에서 물방울이 떨어져 목덜미로 흘렀다. 소리를 지를 뻔했다." }
        - { when: "time.roll >= 0.67", text: "(게임은 냄새를 구현하지 않았지. 다행이었다.)" }

- id: 고서점
  name: 도시 고서점
  art: bookshop
  desc: 오래된 책이 쌓인 가게
  window: "0.2"
  effects: ["fatigue += 5"]
  lines:
    - 나레이션:
        - "문에 달린 종이 맑게 울렸다. 먼지와 낡은 종이 냄새가 한꺼번에 밀려온다."
        - { when: "time.roll < 0.34", text: "문에 달린 종이 맑게 울렸다. 먼지와 낡은 종이 냄새가 한꺼번에 밀려온다." }
        - { when: "time.roll >= 0.34 and time.roll < 0.67", text: "손에 잡히는 대로 몇 권을 넘겨 봤다. 마법 이론서, 요리책, 누군가의 연애편지 묶음." }
        - { when: "time.roll >= 0.67", text: "(원작에선 이 서점에 '조사하기' 버튼이 딱 하나 있었다.)" }
    - 나레이션:
        - "책장 사이 통로가 겨우 한 사람 지나갈 만큼 좁다. 어깨로 책 탑을 무너뜨리지 않게 몸을 옆으로 틀었다."
        - { when: "time.roll < 0.34", text: "책장 사이 통로가 겨우 한 사람 지나갈 만큼 좁다. 어깨로 책 탑을 무너뜨리지 않게 몸을 옆으로 틀었다." }
        - { when: "time.roll >= 0.34 and time.roll < 0.67", text: "어느 책 사이에서 마른 꽃잎이 떨어졌다. 수십 년 전의 봄이다." }
        - { when: "time.roll >= 0.67", text: "(실제로는 책이 수천 권이다. 위키에 적힌 좌표가 얼마나 고마운 건지 이제 안다.)" }
    - 나레이션:
        - "주인은 오늘도 계산대에 엎드려 졸고 있다. 코 고는 소리가 일정하다."
        - { when: "time.roll < 0.34", text: "주인은 오늘도 계산대에 엎드려 졸고 있다. 코 고는 소리가 일정하다." }
        - { when: "time.roll >= 0.34 and time.roll < 0.67", text: "가격표가 없는 책이 대부분이다. 아마 주인도 값을 모를 것이다." }
        - { when: "time.roll >= 0.67", text: "해가 기울어 창으로 드는 빛이 주황색이 될 때까지, 책등의 제목만 읽었다." }

- id: 뒷골목
  name: 뒷골목 정보상
  art: back_alley
  desc: 은화 10닢이 든다
  window: "0.2"
  when: "money >= 10"
  lines:
    - 나레이션:
        - "골목은 대낮에도 어둡다. 빨래가 머리 위를 가리고, 바닥은 늘 젖어 있다."
        - { when: "time.roll < 0.34", text: "골목은 대낮에도 어둡다. 빨래가 머리 위를 가리고, 바닥은 늘 젖어 있다." }
        - { when: "time.roll >= 0.34 and time.roll < 0.67", text: "고양이 한 마리가 쓰레기통 위에서 나를 내려다본다. 이 골목에선 저 녀석이 터줏대감이다." }
        - { when: "time.roll >= 0.67", text: "(원작에서 이 골목은 '정보 상점' 메뉴 하나였다.)" }
    - 나레이션:
        - "모퉁이마다 누군가 서 있다가, 눈이 마주치기 전에 사라진다."
        - { when: "time.roll < 0.34", text: "모퉁이마다 누군가 서 있다가, 눈이 마주치기 전에 사라진다." }
        - { when: "time.roll >= 0.34 and time.roll < 0.67", text: "어디선가 동전 세는 소리, 낮은 웃음소리, 문 닫히는 소리." }
        - { when: "time.roll >= 0.67", text: "(메뉴 뒤에 이런 냄새와 이런 눈빛이 있었을 줄은 몰랐다.)" }
    - 나레이션:
        - "정보상의 자리는 비어 있었다. 낡은 나무 상자 위에 촛농만 굳어 있다."
        - { when: "time.roll < 0.34", text: "정보상의 자리는 비어 있었다. 낡은 나무 상자 위에 촛농만 굳어 있다." }
        - { when: "time.roll >= 0.34 and time.roll < 0.67", text: "오늘은 그림을 만나지 못했다. 다음엔 은화를 넉넉히 챙겨 오자." }
        - { when: "time.roll >= 0.67", text: "주머니 속 은화를 한 번 더 확인하고 골목을 빠져나왔다." }

- id: 새벽연무장
  name: 새벽 연무장 구경
  art: training_ground
  desc: 아침에만 갈 수 있다
  window: "0.2"
  slots: [오전]
  lines:
    - 나레이션:
        - "해가 뜨기 전의 연무장은 하얗다. 입김이 흩어지는 소리마저 들릴 것 같다."
        - { when: "time.roll < 0.34", text: "해가 뜨기 전의 연무장은 하얗다. 입김이 흩어지는 소리마저 들릴 것 같다." }
        - { when: "time.roll >= 0.34 and time.roll < 0.67", text: "허수아비 앞에서 서툰 자세로 목검을 몇 번 휘둘러 봤다." }
        - { when: "time.roll >= 0.67", text: "구석에 누가 쓸어 둔 듯한 빗자루 자국이 동그랗게 남아 있다." }
    - 나레이션:
        - "모래 위에 밤새 내린 이슬이 얇게 얼어 있다. 밟을 때마다 바스락거린다."
        - { when: "time.roll < 0.34", text: "모래 위에 밤새 내린 이슬이 얇게 얼어 있다. 밟을 때마다 바스락거린다." }
        - { when: "time.roll >= 0.34 and time.roll < 0.67", text: "어깨가 금세 비명을 지른다. 이 몸은 정말로 아무것도 해 본 적이 없다." }
        - { when: "time.roll >= 0.67", text: "자국은 아무렇게나 쓴 게 아니라, 원을 그리며 발을 옮긴 흔적처럼 보인다." }
    - 나레이션:
        - "아무도 없다. 목검 걸이의 목검들만 줄을 맞춰 서 있다."
        - { when: "time.roll < 0.34", text: "아무도 없다. 목검 걸이의 목검들만 줄을 맞춰 서 있다." }
        - { when: "time.roll >= 0.34 and time.roll < 0.67", text: "동쪽 지붕 위로 해가 머리를 내밀었다. 모래가 금빛으로 바뀐다." }
        - { when: "time.roll >= 0.67", text: "(…발놀림 연습 자국이다. 누가 여기서?)" }

- id: 집안정리
  name: 집안 정리
  art: home_room
  desc: 이 몸의 사정을 살핀다
  window: "0.2"
  effects: ["stress -= 5"]
  lines:
    - 나레이션:
        - "다락방 창을 열었다. 묵은 공기가 빠져나가고 찬 바람이 들어온다."
        - { when: "time.roll < 0.34", text: "다락방 창을 열었다. 묵은 공기가 빠져나가고 찬 바람이 들어온다." }
        - { when: "time.roll >= 0.34 and time.roll < 0.67", text: "벽에 연필로 그은 키 재기 눈금이 있다. 맨 위 눈금 옆에 작은 글씨로 '열다섯'." }
        - { when: "time.roll >= 0.67", text: "책상 서랍이 삐걱 열렸다. 정리된 공책들, 깎아 둔 연필, 단정한 글씨." }
    - 나레이션:
        - "침대 밑에서 이 몸의 원래 주인이 숨겨 둔 것들이 나왔다. 접힌 지도, 마른 사탕, 부러진 펜."
        - { when: "time.roll < 0.34", text: "침대 밑에서 이 몸의 원래 주인이 숨겨 둔 것들이 나왔다. 접힌 지도, 마른 사탕, 부러진 펜." }
        - { when: "time.roll >= 0.34 and time.roll < 0.67", text: "(이 아이는 몇 살까지 여기서 키를 쟀을까.)" }
        - { when: "time.roll >= 0.67", text: "이 몸의 원래 주인은 꽤 깔끔한 사람이었던 것 같다." }
    - 나레이션:
        - "버리지 못하고 상자에 다시 담았다. 남의 인생을 함부로 치우는 기분이었다."
        - { when: "time.roll < 0.34", text: "버리지 못하고 상자에 다시 담았다. 남의 인생을 함부로 치우는 기분이었다." }
        - { when: "time.roll >= 0.34 and time.roll < 0.67", text: "먼지를 털고 바닥을 닦았다. 손이 바쁘니 생각이 조금 조용해진다." }
        - { when: "time.roll >= 0.67", text: "(…미안. 당분간 이 방을 빌릴게.)" }

- id: 기초훈련
  name: 기초 훈련
  art: home_room
  window: "0.2"
  effects: ["stat.근력 += 1.5", "stat.체질 += 1.5", "fatigue += 15 * (1 + mod.fatigue)"]

# ---------------------------------------------------------------- 1학년
- id: 훈련장
  name: 훈련장
  art: training_ground
  desc: 카이든, 브루노, 아렌이 자주 온다
  window: { from: "1.3", to: "1.7" }
  effects:
    - "stat.근력 += 1.2 * (1 - max(0, fatigue - 50) / 100)"
    - "stat.민첩 += 0.7 * (1 - max(0, fatigue - 50) / 100)"
    - "stat.체질 += 0.5 * (1 - max(0, fatigue - 50) / 100)"
    - "fatigue += 15 * (1 + mod.fatigue)"

- id: 도서관
  name: 도서관
  art: library
  desc: 사서 노인과 미라벨이 있다
  window: { from: "1.3", to: "1.7" }
  effects: ["stat.지성 += 1.3 * (1 - max(0, fatigue - 50) / 100)", "fatigue += 8 * (1 + mod.fatigue)"]

- id: 마법실습
  name: 마법 실습실
  art: magic_lab
  desc: 엘베라 교수의 실습실
  window: { from: "1.3", to: "1.7" }
  effects:
    - "stat.마력제어 += 1.2 * (1 - max(0, fatigue - 50) / 100)"
    - "stat.마력량 += 0.8 * (1 - max(0, fatigue - 50) / 100)"
    - "fatigue += 12 * (1 + mod.fatigue)"

- id: 성당
  name: 성당
  art: chapel
  desc: 시스터 루나가 있다. 마음이 가라앉는다
  window: { from: "1.3", to: "1.7" }
  effects: ["stat.의지 += 1.2 * (1 - max(0, fatigue - 50) / 100)", "stress -= 10", "fatigue += 5"]
  lines:
    - 나레이션:
        - "성당 문을 밀자 바깥 소리가 뚝 끊겼다. 차가운 돌 냄새와 밀랍 냄새."
        - { when: "time.roll < 0.34", text: "성당 문을 밀자 바깥 소리가 뚝 끊겼다. 차가운 돌 냄새와 밀랍 냄새." }
        - { when: "time.roll >= 0.34 and time.roll < 0.67", text: "누군가 켜 둔 초가 다 타 가고 있다. 심지 끝이 작게 떨린다." }
        - { when: "time.roll >= 0.67", text: "(원작의 성당은 '스트레스 감소' 아이콘이 붙은 장소였다.)" }
    - 나레이션:
        - "스테인드글라스를 통과한 빛이 바닥에 색 조각을 흩뿌려 놓았다."
        - { when: "time.roll < 0.34", text: "스테인드글라스를 통과한 빛이 바닥에 색 조각을 흩뿌려 놓았다." }
        - { when: "time.roll >= 0.34 and time.roll < 0.67", text: "앞줄에서 누가 조용히 훌쩍이는 소리가 났다가 멎었다." }
        - { when: "time.roll >= 0.67", text: "(실제로 앉아 보니 아이콘이 왜 붙었는지 알겠다.)" }
    - 나레이션:
        - "맨 뒷자리에 앉았다. 기도를 할 줄은 모르지만, 앉아 있는 건 할 수 있다."
        - { when: "time.roll < 0.34", text: "맨 뒷자리에 앉았다. 기도를 할 줄은 모르지만, 앉아 있는 건 할 수 있다." }
        - { when: "time.roll >= 0.34 and time.roll < 0.67", text: "눈을 감고 숨을 세었다. 열까지 세고 나니 어깨가 조금 내려간다." }
        - { when: "time.roll >= 0.67", text: "종이 한 번 울렸다. 소리가 천장까지 올라갔다가 천천히 내려앉는다." }

- id: 식당
