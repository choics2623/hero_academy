# 판정 종류. 선택지는 `check: { type: 설득, dc: 보통 }`처럼 종류와 난이도만 적는다.
# 판정 값 = value + 재능(plus/minus) + 시너지 + 장비 + 상황 보정(mods) + luck.  성공: 값 + d20 >= 난이도.
# 보정 크기: 결정적인 재능 5~6 · 잘 맞는 재능 3~4 · 곁다리 1~2. (주사위 한 눈 = 5%)

tiers: { 쉬움: 26, 보통: 31, 어려움: 36, 극한: 42 }
# 능력치가 자라므로 난이도 이름은 달마다 오른다 (숫자로 쓴 난이도는 그대로)
# npm run balance 기준: 평범한 캐릭터 ≈ 56%, 컨셉 빌드가 자기 분야에서 ≈ 96%, 다른 분야에서 ≈ 56%
month_offset: { 2: -1, 3: 0, 4: 3, 5: 6, 6: 9, 7: 12 }
odds: [[0.9, 확실], [0.65, 유리], [0.4, 반반], [0.15, 불리], [0, 무모]]
# 한 능력치만 몰아 키우면 7월엔 60을 넘는다. 그 달 평범한 캐릭터의 기본값(expected)보다
# over 이상 높은 부분은 rate만 쳐준다 — 전문가는 여전히 앞서지만 '극한'까지 공짜가 되진 않는다.
softcap:
  expected: { 2: 18, 3: 19.5, 4: 21.5, 5: 24, 6: 27, 7: 30 }
  over: 8
  rate: 0.35

types:
  - id: 완력
    icon: dumbbell
    desc: 힘으로 밀고, 들고, 부수기
    value: "stat.근력 + stat.체질 / 2"
    plus: { 천생신력: 5, 거구: 3, 서번트.검: 3, 강골: 2, 굳은살: 2, 검무: 2, 마나회로손상: 2, 영웅의그릇: 2 }
    minus: { 병약: 3, 유리몸: 2, 키작음: 2, 트라우마.피: 2 }

  - id: 기민
    icon: wing
    desc: 피하고, 뛰고, 낚아채기
    value: "stat.민첩 + stat.체질 / 2"
    plus: { 고양이반사신경: 5, 검무: 4, 짐승의혈통: 3, 쌍검감각: 3, 서번트.검: 3, 키작음: 2, 직감: 2, 그림자걸음: 2, 원소친화.풍: 2, 잠귀밝음: 1, 영웅의그릇: 2 }
    minus: { 오래된상처: 3, 거구: 2, 저질체력: 2, 허약한심장: 2, 고소공포증: 2, 트라우마.물: 2, 덜렁이: 1 }

  - id: 은밀
    icon: mask
    desc: 들키지 않게 숨고 움직이기
    value: "stat.민첩 + stat.지성 / 2"
    plus: { 그림자걸음: 5, 키작음: 3, 밤눈: 3, 고양이반사신경: 2, 짐승의혈통: 2, 사냥꾼의눈: 2, 손버릇: 1, 외톨이: 1, 영웅의그릇: 2 }
    minus: { 거구: 3, 수다쟁이: 3, 트라우마.어둠: 3, 눈치없음: 2, 산만함: 2, 야맹증: 2, 길치: 2, 덜렁이: 2, 악명높은가문: 1 }

  - id: 인내
    icon: heart
    desc: 아픔·추위·독·피로를 버티기
    value: "stat.체질 + stat.의지 / 2"
    plus: { 무통증: 4, 불굴: 4, 강철위장: 4, 질긴힘줄: 3, 빠른회복: 3, 강골: 2, 만독불침: 2, 굳은살: 2, 약초지식: 2, 원소친화.지: 2, 대식가: 1, 치유의손: 1, 영웅의그릇: 2 }
    minus: { 병약: 4, 허약한심장: 3, 저질체력: 3, 게으름: 2, 결벽증: 2, 트라우마.물: 2 }

  - id: 정신력
    icon: flame
    desc: 공포·유혹·환각에 맞서기
    value: "stat.의지 + stat.지성 / 2"
    plus: { 강철멘탈: 5, 용기: 3, 불굴: 3, 맹세: 3, 집중력: 2, 성흔: 2, 냉혈: 2, 마력둔감: 2, 고집불통: 1, 영웅의그릇: 2 }
    minus: { 겁쟁이: 5, 트라우마: 3, 마력폭주체질: 2, 몸주인의잔재: 2, 고소공포증: 2, 망자의목소리: 1 }

  - id: 설득
    icon: talk
    desc: 말로 마음을 움직이기
    value: "stat.매력 + stat.지성 / 2"
    plus: { 달변: 5, 사람좋은얼굴: 3, 카리스마: 3, 흥정꾼: 3, 미모: 2, 귀공자의품격: 2, 서번트.교육: 2, 수다쟁이: 1, 영웅의그릇: 2 }
    minus: { 말더듬: 5, 혐오스러운분위기: 4, 눈치없음: 3, 고집불통: 3, 외톨이: 3, 악명높은가문: 2 }

  - id: 위압
    icon: fist
    desc: 기세로 누르고 겁주기
    value: "stat.의지 + stat.근력 / 2"
    plus: { 카리스마: 4, 저주술소질: 4, 거구: 3, 악명높은가문: 3, 마왕의흔적: 3, 허세: 3, 천생신력: 2, 혐오스러운분위기: 2, 거리의말투: 2, 원소친화.화: 2, 영웅의그릇: 2 }
    minus: { 겁쟁이: 4, 사람좋은얼굴: 2, 키작음: 2, 말더듬: 2, 트라우마.피: 2 }

  - id: 기만
    icon: mask
    desc: 거짓말, 연기, 시치미
    value: "stat.지성 + stat.매력 / 2"
    plus: { 냉혈: 4, 달변: 3, 사람좋은얼굴: 3, 거리의말투: 3, 미모: 1, 직감: 1, 영웅의그릇: 2 }
    minus: { 말더듬: 3, 눈치없음: 3, 맹신: 3, 맹세: 2, 수다쟁이: 2, 겁쟁이: 1 }

  - id: 통찰
    icon: eye
    desc: 살피고, 눈치채고, 꿰뚫어 보기
    value: "stat.지성 + stat.의지 / 2"
    plus: { 직감: 4, 망자의목소리: 4, 마력감응: 3, 사냥꾼의눈: 3, 완전기억: 2, 집중력: 2, 쌍검감각: 2, 밤눈: 2, 잠귀밝음: 2, 고문자해독: 2, 원소친화.뇌: 2, 짐승의혈통: 1, 영웅의그릇: 2 }
    minus: { 맹신: 4, 눈치없음: 3, 산만함: 3, 마력둔감: 2, 고집불통: 2, 길치: 2, 야맹증: 2, 허세: 1 }

  - id: 학식
    icon: book
    desc: 배운 것을 떠올리고 풀어내기
    value: "stat.지성 + stat.마력제어 / 2"
    plus: { 완전기억: 4, 서번트.교육: 4, 속독: 4, 마도학재능: 3, 고문자해독: 3, 집중력: 2, 연금술사의손: 1, 영웅의그릇: 2 }
    minus: { 망각증: 4, 게으름: 3, 산만함: 2 }

  - id: 마법
    icon: wand
    desc: 마력을 다루고 주문을 엮기
    value: "stat.마력제어 + stat.마력량 / 2"
    plus: { 섬세한제어: 4, 무영창소질: 4, 서번트.마법: 4, 마도학재능: 3, 원소친화: 3, 저주술소질: 3, 마나탱크: 2, 마력감응: 1, 고문자해독: 1, 영웅의그릇: 2 }
    minus: { 마나회로손상: 6, 마력폭주체질: 3, 마력둔감: 2, 속성부적합: 2, 트라우마.불: 2 }

  - id: 신성
    icon: chapel
    desc: 기도와 신성력
    value: "stat.의지 + stat.마력량 / 2"
    plus: { 성흔: 6, 서번트.신성: 4, 기도하는손: 4, 치유의손: 4, 맹세: 2, 맹신: 2, 용기: 1, 영웅의그릇: 2 }
    minus: { 마왕의흔적: 5, 저주술소질: 3, 몸주인의잔재: 2 }

  - id: 손재주
    icon: hammer
    desc: 만들고, 고치고, 섞기 (연금, 대장일, 요리, 자물쇠)
    value: "stat.민첩 / 2 + stat.마력제어 / 2 + stat.지성 / 2"
    plus: { 연금술사의손: 5, 서번트.연금: 5, 손버릇: 3, 약초지식: 3, 섬세한제어: 2, 집중력: 2, 영웅의그릇: 2 }
    minus: { 덜렁이: 4, 산만함: 2, 트라우마.불: 2, 천생신력: 1 }

  - id: 교감
    icon: paw
    desc: 동물·정령·아이와 통하기
    value: "stat.매력 + stat.의지 / 2"
    plus: { 자연친화력: 5, 짐승의혈통: 3, 사람좋은얼굴: 2, 치유의손: 2, 원소친화.수: 2, 성흔: 1, 영웅의그릇: 2 }
    minus: { 혐오스러운분위기: 4, 마왕의흔적: 2, 냉혈: 2, 결벽증: 2, 외톨이: 2, 음치: 1 }
