# 동아리 만남 풀, 능력치 이정표, 재능 개화, 학교생활 소소한 사건

# ================================================================ 동아리
- id: enc_green_work
  title: 온실 정리
  on: 온실
  pool: true
  repeat: true
  cooldown: 1
  effects: ["affinity.liana += 3"]
  lines:
    - 나레이션:
        - "유리 지붕 아래 오후 햇살이 고여 있다. 젖은 흙과 풋잎 냄새가 훅 끼친다."
        - { when: "time.month >= 6", text: "여름의 온실은 찜통이다. 유리벽에 맺힌 물방울이 줄지어 흘러내린다." }
    - "작업대 위에 분갈이를 기다리는 화분들이 줄지어 서 있다. 리아나는 벌써 장갑을 끼고 있다."
    - 리아나@웃음:
        - "왔다! 오늘은 이 아이들 흙 갈아 주는 날이야."
        - { when: "affinity.liana >= 30", text: "왔네. 네 자리 비워 놨어. 장갑도 네 거로 챙겨 뒀고." }
    - 리아나: "묵은 흙은 숨을 못 쉬거든. 손으로 살살 털어 줘. 뿌리 다치지 않게."
    - "화분을 기울이자 뿌리가 흙덩이째 쑥 빠져나온다. 화분 모양 그대로 굳어 있다."
    - 리아나@슬픔: "답답했겠다. 너무 오래 한자리에만 있었으니까."
    - "리아나가 엉킨 뿌리를 손끝으로 하나씩 풀어 낸다. 머리카락 사이로 뾰족한 귀 끝이 보인다."
    - when: "fired.enc_green_work <= 1"
      리아나: "숲에선 나무마다 이름을 붙여 줬어. 여기 애들도 붙여 줄까?"
    - when: "fired.enc_green_work <= 1"
      나@당황: "…그럼 저 구석의 선인장은?"
    - when: "fired.enc_green_work <= 1"
      리아나@웃음: "가렌 교관님. 가시 많고, 물 안 줘도 꿋꿋하고."
    - when: "fired.enc_green_work <= 1"
      나레이션: "웃음이 터졌다. 저쪽 선반에서 원예부장 선배가 쉿, 하고 손가락을 세운다."
    - when: "fired.enc_green_work == 2"
      리아나: "흙 냄새 맡으면 고향 생각이 나. 비 온 다음 날 숲 냄새랑 똑같거든."
    - when: "fired.enc_green_work == 2"
      리아나: "너는? 이 냄새 맡으면 생각나는 데 있어?"
    - when: "fired.enc_green_work == 2"
      속마음: "(아스팔트에 비 떨어지는 냄새. …라고 말할 수는 없지.)"
    - when: "fired.enc_green_work == 2"
      나@웃음: "여기. 이제는 여기가 생각날 것 같아."
    - when: "fired.enc_green_work >= 3"
      나레이션: "오늘은 둘 다 별말이 없다. 흙 터는 소리와 물뿌리개 소리만 오간다."
    - when: "fired.enc_green_work >= 3"
      리아나@웃음: "봐, 저번에 살린 그 아이. 새잎이 세 장이나 났어."
    - when: "fired.enc_green_work >= 3"
      나레이션: "창가의 화분 하나가 연두색 잎을 펼치고 있다. 처음 봤을 땐 다 시들어 있던 아이다."
    - when: "fired.enc_green_work >= 3"
      리아나: "너 오고 나서 여기 애들이 기운이 나. 진짜야. 나도 그렇고."
    - 나레이션:
        - "리아나와 나란히 앉아 화분 흙을 갈았다. 말없이도 편하다."
        - { when: "talent.자연친화력", text: "내가 만진 화분만 유독 잎이 반짝인다. 리아나가 샘을 낸다." }
        - { when: "affinity.liana >= 30", text: "리아나가 엘프어로 콧노래를 부른다. 무슨 뜻이냐고 물으니 비밀이란다." }
    - "마지막 화분을 선반에 올리자 해가 한 뼘 기울어 있었다. 손톱 밑까지 흙투성이다."
    - 리아나@웃음: "고마워. 혼자 했으면 밤까지 걸렸을 거야. 또 와 줄 거지?"
    - 속마음:
        - "(원작에선 '원예부 활동' 텍스트 한 줄이었다. 그 한 줄 안에 이런 오후가 있었다.)"
        - { when: "note.note_liana.known", text: "(밤까지. 이 아이의 시간은 남들보다 짧다. 한 시간이라도 덜어 주고 싶다.)" }

- id: enc_sword_spar
  title: 검술부 대련
  art: sword_club
  on: 검술부
  pool: true
  repeat: true
  cooldown: 1
  lines:
    - "검술부 도장. 높은 창으로 들어온 빛 속에 먼지가 천천히 떠다닌다."
    - "나무 바닥은 땀에 젖어 미끄럽다. 목검 부딪히는 소리가 천장까지 울린다."
    - 검술부장@진지: "돌아가면서 세 판씩! 진 사람은 도장 바닥 걸레질이다!"
    - 학생들: "으아아…"
    - "부원끼리 돌아가며 대련을 한다."
    - 나레이션:
        - "오늘 내 상대는 2학년 선배. 키가 한 뼘은 더 크다."
        - { when: "fired.enc_sword_spar >= 3", text: "오늘 상대는 지난번에 붙었던 선배다. 나를 기억하는지 눈이 가늘어진다." }
        - { when: "fired.enc_sword_spar == 2", text: "오늘 상대는 3학년 선배. 도장에서 제일 늦게까지 남는다는 연습벌레다." }
    - 상급생:
        - "1학년이지? 살살 해 줄게. 진짜로."
        - { when: "fired.enc_sword_spar >= 3", text: "또 너냐. 이번엔 살살 안 한다." }
        - { when: "fired.enc_sword_spar == 2", text: "D반이라며? 손목에 힘 빼. 그러다 다친다." }
    - 속마음: "(살살 해 준다는 사람치고 살살 하는 사람 없다. 온라인 게임에서 배운 진리다.)"
    - "도장 구석에서 카이든이 혼자 목검을 휘두른다."
    - "이쪽은 보지도 않는다. …보지 않는 척을 한다."
    - 검술부장: "시작!"
  check: { label: 부원 대련, value: "stat.근력 + stat.민첩 / 2 + luck", dc: 32 }
  success:
    lines:
      - "첫 판은 졌다. 어깨에 닿은 목검의 감각이 뒤늦게 저릿하다."
      - "두 번째 판. 상대의 발이 먼저 움직였다. 그게 보였다."
      - "반 박자 빨리 옆으로 빠지며 손목을 쳤다. 목검이 바닥을 굴렀다."
      - 상급생@놀람: "어, 어? 방금 뭐였어?"
      - "세 번째 판도 가져왔다. 숨이 턱까지 차오른다."
      - "세 판 중 두 판을 이겼다."
      - 검술부장@웃음: "1학년이 이겼네! 걸레는 선배 몫이다!"
      - 상급생@당황: "…다음 주에 다시 해. 오늘은 바닥이 미끄러웠어."
      - "카이든이 아주 잠깐 이쪽을 봤다. 그리고 다시 자기 검으로 시선을 돌렸다."
      - 속마음: "(민첩 +1. …아니, 숫자로 생각하지 말자.)"
      - 속마음: "(오늘 발이 한 번 먼저 움직였다. 그게 전부다.)"
    effects: ["stat.민첩 += 1", "reputation += 2"]
  fail:
    lines:
      - "첫 판, 목검이 옆구리에 꽂혔다. 숨이 컥 막힌다."
      - "두 번째 판, 손목. 세 번째 판은… 잘 기억나지 않는다."
      - 상급생@당황: "괜찮아? 살살 한다는 게 그만."
      - 나@당황: "…괜찮습니다. 살살 하신 거 맞죠?"
      - "걸레를 쥐고 도장 바닥을 밀었다. 팔뚝을 걷어 보니 멍이 하나 늘었다."
      - "그래도 몸이 기억한다. 맞은 자리마다, 다음엔 어떻게 피할지가 새겨지는 느낌이다."
      - 속마음: "(원작의 성장 공식엔 '맞아서 배운다' 같은 항목은 없었다.)"
      - 속마음: "(여기엔 있다. 아프게.)"
      - "창밖으로 해가 진다. 바닥에 비친 내 그림자가 아까보다 조금 단단해 보였다."
    effects: ["stat.체질 += 1"]

- id: kaiden_palace
  title: 카이든의 형들
  art: sword_club
  on: 검술부
  priority: 1
  when: "fired.kaiden_sword and trust.kaiden >= 8 and time.month >= 5"
  lines:
    - "검술부 도장. 부원들이 하나둘 빠져나가고, 노을이 나무 바닥에 길게 눕는다."
    - "목검을 걸이에 걸고 돌아서는데, 카이든이 아직 남아 있었다."
    - "연습이 끝난 뒤, 카이든이 땀을 닦으며 먼저 말을 꺼냈다."
    - 카이든: "…너. 잠깐 앉아라."
    - 속마음: "(카이든이 먼저 말을 건다. 원작에서 이 플래그는… 아니, 이건 플래그가 아니다.)"
    - "도장 마루 끝에 나란히 앉았다. 창밖에서 저녁 새가 운다."
    - "카이든은 한참 말이 없었다. 수건을 쥔 손가락만 천천히 움직인다."
    - when: "origin == '악역도련님'"
      카이든: "벨모어가 사람한테 이런 이야기를 하게 될 줄은 몰랐군. 나도 꽤 지쳤나 보다."
    - 카이든@진지: "황궁에선 다들 내가 실패하길 기다려. 큰형도, 작은형도."
    - 나: "…형들이?"
    - 카이든: "큰형은 황태자 자리를 지키고 싶고, 작은형은 그 자리를 뺏고 싶지."
    - 카이든: "둘 다 셋째가 쓸모 있어지는 건 원하지 않는다. 그 점에서만큼은 사이가 좋더군."
    - "웃음 비슷한 소리가 났다. 웃음은 아니었다."
    - 속마음: "(작은형. 2황자 레오폴트.)"
    - 속마음: "(커뮤니티에선 황제 암살 진범 후보 1순위였던 이름이다.)"
    - 카이든: "아카데미에 보낸 것도 그래서다. 황궁 밖으로 치워 두면 조용하니까."
    - 카이든@화남: "검술 교사가 나를 칭찬하면, 다음 날 그 교사가 바뀌어 있었다. 몇 번이나."
    - "카이든의 오른손이 무심코 왼쪽 어깨로 올라갔다가, 멈칫하고 내려온다."
    - 나: "그래서 그렇게 혼자 남아서 연습하는 거야?"
    - 카이든@진지: "가르쳐 주는 사람이 없으면, 혼자 하는 수밖에 없지."
    - 카이든: "아카데미 무투대회 우승."
    - 카이든: "그것만큼은 황궁도 무시 못 한다. 아버지 귀에도 들어가고."
    - 카이든@당황: "그래서 무투대회는 꼭 이겨야 한다. …이걸 왜 너한테 말하고 있지."
    - "카이든이 고개를 돌렸다. 귀 끝이 붉다. 노을 탓인지는 모르겠다."
    - 카이든@화남: "잊어라. 피곤해서 헛소리를 했다."
    - when: "note.note_tourney.known"
      속마음: "(원작에서 카이든은 우승한다. 그리고 6년 뒤 반역자 누명을 쓴다.)"
    - when: "note.note_tourney.known"
      속마음: "(트로피를 들고도 웃지 않던 일러스트. 그땐 그냥 무뚝뚝한 캐릭터인 줄 알았다.)"
    - 나@진지: "안 잊을게. 대신 아무한테도 말 안 해."
    - 카이든@놀람: "……."
    - 카이든: "이상하군. 황자의 약점을 쥐고도 값을 부르지 않다니."
    - "카이든이 일어나 목검을 집었다. 그리고 도장 문 앞에서 한 번 멈췄다."
    - 카이든@진지: "무투대회에서 만나면, 봐주지 마라. 동정은 형님들 앞에서 받는 걸로 충분하다."
    - "도장 문이 닫혔다. 노을이 마루 위에서 천천히 식어 간다."
    - 속마음: "(원작에선 '오만한 3황자' 한 줄로 요약되던 사람이, 방금 내 옆에 앉아 있었다.)"
  effects: ["affinity.kaiden += 8", "trust.kaiden += 6", "know.kaiden_palace = 1"]

- id: enc_news_scoop
  title: 취재
  on: 신문부
  pool: true
  repeat: true
  cooldown: 2
  lines:
    - "신문부 동아리방. 잉크 냄새와 눅눅한 종이 냄새."
    - "벽엔 지난 호 1면이 덕지덕지 붙어 있다."
    - 부장@진지: "무투대회 특집 들어간다. 우승 후보 인터뷰, 오늘 안에 세 명!"
    - 나@당황: "세 명이요? 오늘 안에요?"
    - 부장: "기자는 발로 뛰는 거야. 수첩, 펜, 그리고 뻔뻔함. 가!"
    - "무투대회 특집 취재. 우승 후보들을 인터뷰하러 다녔다."
    - when: "fired.enc_news_scoop <= 1"
      나레이션: "첫 상대는 훈련장의 브루노. 묻기도 전에 대답이 쏟아진다."
    - when: "fired.enc_news_scoop <= 1"
      브루노@웃음: "목표? 우승이지! 아니다, 8강! 아니 4강! 하하, 그냥 다 적어 줘!"
    - when: "fired.enc_news_scoop <= 1"
      나레이션: "두 번째는 카이든. 질문 다섯 개에 대답은 한 단어였다."
    - when: "fired.enc_news_scoop <= 1"
      카이든@진지: "우승. …다음."
    - when: "fired.enc_news_scoop >= 2"
      나레이션: "오늘은 아렌부터. 수첩을 꺼내자마자 아렌의 얼굴이 빨개졌다."
    - when: "fired.enc_news_scoop >= 2"
      아렌@당황: "인, 인터뷰? 나를? 성검 말고 나를?"
    - when: "fired.enc_news_scoop >= 2"
      나레이션: "다음은 도서관의 미라벨. 펜을 내려놓지도 않고 대답했다."
    - when: "fired.enc_news_scoop >= 2"
      미라벨: "인터뷰는 아델하이트 가문 대변인을 통해서 해."
    - when: "fired.enc_news_scoop >= 2"
      미라벨: "…대변인은 없어. 안 한다는 뜻이야."
    - 속마음: "(원작 신문부는 '정보 수집' 버튼 하나였다. 직접 해 보니 이건 영업직이다.)"
    - "마지막 한 명. 수첩을 쥔 손에 땀이 찬다."
  check: { label: 인터뷰, value: "stat.매력 + stat.지성 / 2 + luck", dc: 30 }
  success:
    lines:
      - "마지막 인터뷰에서, 아무도 몰랐던 이야기가 나왔다."
      - "카이든 황자가 매일 해 질 녘 혼자 남아 같은 동작을 수백 번 한다는 것. 훈련장 경비병의 증언이다."
      - 부장@놀람: "이거… 이거 특종이잖아!"
      - 부장@웃음: "특종을 건졌네. 제목 옆에 네 이름 박는다. 「취재: D반 {{player.name}}」."
      - "다음 날 아침, 식당 게시판에 신문이 붙었다. 부장이 약속대로 기사 제목에 내 이름을 넣어줬다."
      - 학생 A: "이거 쓴 사람 D반이래. 신문부에 D반이 있었어?"
      - "활자로 찍힌 내 이름을 한참 들여다봤다."
      - 속마음: "(이름 없는 엑스트라 자리였던 몸이다. 이 세계에 처음 남긴 흔적이 신문 귀퉁이라니.)"
    effects: ["reputation += 5", "intel += 1"]
  fail:
    lines:
      - "첫 번째 거절은 카이든이었다."
      - 카이든: "할 말 없다."
      - "두 번째는 미라벨."
      - 미라벨@화남: "신문부한테 내 얘기를? 꿈도 꾸지 마."
      - "세 번째는 아렌이었다. 미안하다며 도망쳤다."
      - 아렌@당황: "미, 미안! 나 그런 거 진짜 못 해!"
      - "인터뷰를 세 번 거절당했다. 수첩엔 날짜만 적혀 있다."
      - 부장: "괜찮아. 기자는 거절당하면서 크는 거야. …근데 원고는 내일까지다."
      - 속마음: "(원작 스탯 창에서 스트레스는 숫자였다. 숫자가 위장을 이렇게 쥐어짜는 줄은 몰랐다.)"
    effects: ["stress += 5"]

- id: finn_garen
  title: 핀과 가렌
  art: cg_finn_mentor
  on: 밤의연무장
  priority: 2
  when: "affinity.finn >= 20 and affinity.garen >= 15"
  lines:
    - "밤의 연무장. 횃불 두 개가 흙바닥 위에 흔들리는 원을 그린다."
    - "핀을 데리고 가렌 교관을 찾아갔다."
    - "핀은 연무장 입구에서 벌써 세 번째로 발을 멈췄다. 빗자루를 두 손으로 꼭 쥐고."
    - 핀@당황: "저, 저기요. 진짜 가요? 교관님한테요? 저, 청소부인데요."
    - 나:
        - "괜찮아. 보여 주기만 하면 돼."
        - { when: "finn.promise", text: "약속했잖아. 제대로 가르쳐 줄 사람 찾아 준다고." }
    - "연무장 한가운데, 가렌 교관이 혼자 목검을 닦고 있었다. 밤마다 여기 있다는 건 알고 있었다."
    - 속마음: "(가렌의 밤 루틴. 원작에선 '밤에 훈련장에 가면 가끔 가렌이 있다' 한 줄이 전부였다.)"
    - 가렌@진지: "통금 지났다. 용건."
    - 나: "보여 드리고 싶은 사람이 있습니다."
    - "등 뒤에서 핀이 반걸음 나왔다가, 다시 반걸음 숨었다."
    - 가렌: "청소부 아이를?"
    - "가렌의 눈이 핀의 빗자루 끝에 잠깐 머물렀다. 닳아서 비스듬히 깎인 빗자루 끝에."
    - 가렌: "…검을 쥐어 봐라."
    - "가렌이 걸이에서 목검 하나를 뽑아 던졌다. 핀이 허둥지둥 빗자루를 놓고 받아 든다."
    - 핀@당황: "아, 저, 저는 그냥 빗자루로…"
    - "핀이 목검을 쥐는 순간, 가렌의 눈빛이 바뀌었다."
    - "횃불이 흔들렸다. 아니, 흔들린 건 공기였다."
    - "방금까지 웅크리고 있던 소년이 아니다. 발끝, 무릎, 허리, 검끝이 한 줄로 서 있다."
    - 속마음:
        - "(누구한테 배운 자세가 아니다. 수천 번 보고, 수천 번 따라 한 몸이다.)"
        - { when: "perk.데이터마이너", text: "(검술 스탯 S. 파일 속 숫자 하나가, 지금 눈앞에서 자세가 됐다.)" }
    - 가렌: "쳐라."
    - 핀@놀람: "네, 네? 교관님을요?"
    - 가렌: "못 맞힌다. 그러니까 쳐라."
    - "핀의 발이 바닥을 쓸 듯 미끄러졌다. 빗자루질하던 그 궤적 그대로."
    - "딱. 목검 두 자루가 부딪히는 소리가 연무장에 한 번 울렸다."
    - "가렌의 목검이 반 뼘 밀려나 있었다."
    - "가렌이 자기 손을 내려다봤다. 한참."
    - 가렌@놀람: "누가 가르쳤지?"
    - 핀@당황: "아, 아무도요. 그냥 학생분들 연습하는 거 보고… 죄송해요."
    - 핀@당황: "다시는 안 할게요."
    - 가렌: "아무도?"
    - "가렌의 얼굴에 처음 보는 표정이 스쳤다. 놀람보다 오래된 무언가."
    - when: "fired.bond_garen_2"
      속마음: "(20년 전, 지키지 못했다던 아이. 그 아이를 처음 봤을 때도 저런 얼굴이었을까.)"
    - 가렌@진지: "…매일 밤 이 시간에 와라."
    - 핀@놀람: "네?"
    - 가렌: "검은 내가 준다. 빗자루는 두고 와라. 늦으면 돌려보낸다."
    - "가렌은 그 말만 남기고 목검을 걸이에 걸었다. 연무장을 나서는 걸음이 평소보다 반 박자 느렸다."
    - "핀은 목검을 쥔 채 한참 그 자리에 서 있었다."
    - 핀@슬픔: "저, 저 같은 게… 진짜로 와도 되는 거죠? 꿈 아니죠?"
    - when: "finn.trauma_talk"
      속마음: "(피를 보면 손이 굳는다는 고백.)"
    - when: "finn.trauma_talk"
      속마음: "(아직은 이 아이와 나만 아는 이야기다. 언젠가 저 교관도 알게 되겠지.)"
    - 나@웃음: "내일 늦지 마. 빗자루는 두고."
    - 핀@웃음: "…네! 네!"
    - "핀이 목검을 꼭 끌어안았다. 횃불 아래, 그 작은 그림자가 처음으로 꼿꼿했다."
    - 속마음: "(원작에 없던 사제 관계가 생겼다.)"
    - 속마음: "(5년 뒤 장벽에서 죽는 교관과, 원작에선 이름조차 없던 청소부.)"
    - 속마음: "(이 날갯짓이 어디에 닿을지는 모른다. 그래도 오늘 밤만큼은 잘한 일 같다.)"
  effects: ["finn.mentor = 'garen'", "affinity.finn += 10", "affinity.garen += 8", "world.collapse_bonus += 3"]

# ================================================================ 능력치 이정표 (강제·무료 이벤트)
- id: ms_str_25
  title: 가벼워진 목검
  art: training_ground
  on: auto
  free: true
  priority: 3
  when: "time.year == 1 and stat.근력 >= 25"
  lines:
    - "새벽 훈련장. 흙바닥의 이슬이 아직 마르지 않았다."
    - "늘 하던 대로 목검을 들어 올렸다. 그런데."
    - "…가볍다."
    - "휘둘러 본다. 바람 가르는 소리가 낮고 짧아졌다."
    - "검끝이 흔들리지 않는다."
    - 속마음: "(입학 첫 주엔 스무 번 휘두르면 팔이 덜덜 떨렸다. 저녁엔 숟가락도 겨우 들었는데.)"
    - "손바닥을 펴 본다. 굳은살이 박인 자리가 몇 달 전과 다르다."
    - "목검이 가볍다. 입학했을 때와는 다른 손이다."
    - "옆에서 목검을 휘두르던 3학년 선배가 동작을 멈추고 이쪽을 본다."
    - 상급생: "어이, 1학년. 너 몇 반이야?"
    - 나: "D반입니다."
    - 상급생@놀람: "D반? …흐음. 다음에 한 판 하자. 진심으로."
    - "선배가 웃으며 돌아섰다. 웃고 있었지만, 장난인 눈은 아니었다."
    - 속마음: "(근력이 일정 이상이면 선배 대련 이벤트 해금. 위키에서 수십 번 본 한 줄이다.)"
    - 시스템: "근력 D등급 달성 — 훈련장에서 선배들이 대련을 걸어오기 시작한다."
    - when: "perk.상태창"
      시스템: "[ 근력 {{stat.근력}} ]"
    - "해가 떴다. 목검 끝에 맺힌 이슬이 반짝 떨어졌다."

- id: ms_str_45
  title: 교관의 호출
  art: training_ground
  on: auto
  free: true
  priority: 3
  when: "time.year == 1 and stat.근력 >= 40"
  lines:
    - "검술 수업이 끝나고 다들 흩어지는 참이었다."
    - 가렌@진지: "거기. D반."
    - "훈련장이 얼어붙었다. 가렌 교관이 이름 대신 반을 부를 땐 보통 벌을 줄 때다."
    - 동기@당황: "야, 뭐 했어? 또 목검 부러뜨렸어?"
    - "가렌이 성큼성큼 다가와 내 앞에 섰다. 그리고 내 손목을 잡아 들어 올렸다."
    - "굳은살, 터졌다 아문 물집, 손목에 감은 붕대. 가렌의 눈이 그것들을 하나씩 훑는다."
    - 가렌: "너. 내일부터 상급반 대련에 들어가라."
    - 동기@놀람: "상급반? 1학년이?"
    - 나@당황: "…제가요?"
    - 가렌: "두 번 말하게 하지 마라."
    - "가렌은 그 말만 하고 돌아섰다. 서너 걸음 가다 멈춘다."
    - 가렌: "…이름."
    - 나: "{{player.name}}입니다."
    - 가렌@진지: "{{player.name}}. 내일 늦지 마라."
    - "그날 저녁, 상급반 출석부 맨 아래 칸에 내 이름이 적혀 있었다. 가렌의 각진 글씨로."
    - 속마음: "(가렌이 이름을 묻는다. 원작에서 이 대사를 들으려면 근력에 거의 몰빵해야 했다.)"
    - 속마음: "(그리고 나는 안다. 5년 뒤 장벽에서, 이 사람이 무엇을 지키다 죽는지.)"
    - 시스템: "근력 C등급 직전 — 가렌 교관이 이름을 기억한다."
  effects: ["affinity.garen += 8", "reputation += 5"]

- id: ms_int_30
  title: 머리가 맑아졌다
  art: classroom
  on: auto
  free: true
  priority: 3
  when: "time.year == 1 and stat.지성 >= 28"
  lines:
    - "아침 이론 수업. 계단식 강의실 꼭대기 자리에서 펜을 굴린다."
    - "오늘은 교수 대신 조교가 칠판 앞에 섰다. 분필 가루가 햇빛 속에서 반짝인다."
    - 조교: "마력 회로의 3대 손실 요인. 교재 47쪽. 자, 누가—"
    - "질문이 끝나기도 전에 답이 떠올랐다."
    - "마찰, 누설, 공명. 47쪽 세 번째 단락."
    - "아니, 떠오른 게 아니다. 지난주에 한 번 읽은 쪽이 머릿속에 그대로 펼쳐져 있다."
    - 나: "마찰, 누설, 공명입니다. 공명 손실은 회로가 길수록 커지고요."
    - 조교@놀람: "…교재엔 마지막 문장은 없는데."
    - 조교: "맞아요. 그건 3학년 과정이에요. 어디서 봤죠?"
    - 속마음: "(2회차 때 공략용으로 외운 거다. …라고 말할 수는 없지.)"
    - 나@당황: "도서관에서… 우연히요."
    - "강의실 여기저기서 고개가 돌아간다. D반 자리 쪽으로."
    - "요즘은 어느 수업이든 이렇다. 수업 내용이 한 번에 들어온다."
    - "교수가 질문하기 전에 답이 떠오른다."
    - 속마음: "(이 몸, 원래 공부와는 거리가 멀었던 것 같은데. 머리도 근육처럼 단련되는 모양이다.)"
    - "쉬는 시간, 복도 끝 도서관 쪽을 바라봤다. 안쪽 서가에 쇠사슬이 걸린 문이 하나 있다."
    - 속마음: "(금서 서고. 원작에선 지성이 일정 이상이면 사서가 열람증을 내줬다.)"
    - 시스템: "지성 D등급 달성 — 도서관 사서가 금서 열람을 허락할지도 모른다."

- id: ms_ctrl_25
  title: 마력이 손에 붙는다
  art: magic_lab
  on: auto
  free: true
  priority: 3
  when: "time.year == 1 and stat.마력제어 >= 25"
  lines:
    - "방과 후 마법 실습실. 바닥의 마법진이 희미하게 맥박친다."
    - "손바닥 위에 불꽃을 하나 피웠다. 늘 그렇듯 반쯤 각오하고."
    - "…그런데 불꽃이 얌전하다."
    - "구슬을 떠올리자 구슬이 됐다. 꽃을 떠올리자 다섯 장의 꽃잎이 됐다."
    - "불꽃이 생각한 모양대로 맺힌다. 실습실 바닥에 그을음이 더는 생기지 않는다."
    - 속마음: "(첫 실습 땐 앞머리를 태웠다. 그 냄새, 아직도 기억난다.)"
    - "등 뒤에서 느릿한 박수 소리가 났다."
    - 엘베라@웃음: "어머. 이제야 불이 당신 말을 듣기 시작했네요."
    - "엘베라 교수가 언제부터인지 문틀에 기대어 있었다. 은발이 노을빛에 물들어 있다."
    - 엘베라: "마력은 고집 센 짐승 같아서요. 처음엔 다들 끌려다니죠. 저도 그랬고요."
    - 나@놀람: "교수님도요?"
    - 엘베라@진지: "아주 오래전에요. 불 다루는 법을 처음 가르쳐 준 분이 계셨는데…"
    - "엘베라가 말끝을 흐렸다. 창밖 어딘가, 아주 먼 곳을 보는 눈이다."
    - 엘베라@웃음: "…오래된 이야기예요. 계속하세요. 지켜보고 있을게요."
    - 속마음: "(엘베라에게 불을 가르쳐 준 사람. 커뮤니티에선 그게 마왕 아니냐는 떡밥이 돌았다.)"
    - 시스템: "마력제어 D등급 달성 — 엘베라 교수가 눈여겨본다."
    - "손 위의 불꽃이 작게 흔들렸다. 엘베라의 시선이 그 불꽃에 오래 머물렀다."
  effects: ["affinity.elvera += 5", "met.elvera = 1"]

- id: ms_cha_22
  title: 말을 걸어오는 사람들
  art: campus
  on: auto
  free: true
  priority: 3
  when: "time.year == 1 and stat.매력 >= 20"
  lines:
    - "아침 교정. 분수대 물소리와 가로수 그늘을 지나 강의동으로 들어선다."
    - "복도는 늘 그렇듯 시끄럽다. 사물함 여닫는 소리, 웃음소리, 지각이라는 비명."
    - 나레이션:
        - "복도에서 모르는 동기들이 먼저 인사를 건넨다."
        - { when: "talent.혐오스러운분위기", text: "복도에서 동기 하나가 먼저 인사를 건넸다. 그리고 내 얼굴을 보고 사과했다. 그래도 인사는 인사다." }
    - when: "not talent.혐오스러운분위기"
      여학생@웃음: "안녕! 너 D반 맞지? 지난번 실습 때 봤어."
    - when: "not talent.혐오스러운분위기"
      남학생: "점심 같이 먹을래? 우리 자리 하나 남는데."
    - when: "not talent.혐오스러운분위기"
      나@당황: "어… 응. 좋아."
    - when: "not talent.혐오스러운분위기"
      나레이션: "이름도 모르는 동기들이 내 이름을 안다. 묘하게 간지럽다."
    - when: "not talent.혐오스러운분위기"
      속마음: "(입학 첫 주엔 투명 인간이었다. 엑스트라 자리의 숙명이라고 생각했는데.)"
    - when: "talent.혐오스러운분위기"
      동기@당황: "아, 미, 미안. 그게… 아침이라 눈이 덜 떠져서."
    - when: "talent.혐오스러운분위기"
      나: "괜찮아. 익숙해."
    - when: "talent.혐오스러운분위기"
      동기@웃음: "그래도, 어제 실습 때 도와준 거 고마웠어. 진짜로."
    - when: "talent.혐오스러운분위기"
      나레이션: "동기는 반쯤 뒷걸음질 치면서도 끝까지 손을 흔들었다."
    - when: "talent.혐오스러운분위기"
      속마음: "(캐릭터 생성 때 포인트 받으려고 고른 재능이다. 그 대가를 매일 아침 치르는 중이다.)"
    - "강의실 문을 열었다. 몇몇이 고개를 들어 가볍게 손을 든다."
    - 속마음: "(원작에서 매력은 대사 분기용 숫자였다. 여기선, 아침 인사 한 번이다.)"
    - 시스템: "매력 D등급 달성 — 첫인상이 나아졌다."

- id: ms_will_25
  title: 덜 무서워졌다
  art: labyrinth
  on: auto
  free: true
  priority: 3
  when: "time.year == 1 and stat.의지 >= 25"
  lines:
    - "강의동 지하, 미궁 입구. 지나가던 길에 문득 발을 멈췄다."
    - "철문 너머로 돌계단이 어둠 속으로 이어진다."
    - "서늘한 바람이 올라온다. 이끼와 녹 냄새."
    - 나레이션:
        - "아직 실습으로 내려가 본 적 없는 곳. 원작에서는 수없이 죽었던 곳."
        - { when: "fired.y1_labyrinth", text: "그날의 기억이 계단을 타고 올라온다. 횃불, 압력판, 그리고 3층의 문양." }
    - 속마음: "(처음 이 계단 앞에 섰을 땐 무릎이 떨렸다. 화면으로만 보던 던전이 진짜 냄새를 풍겼으니까.)"
    - "계단 한 칸 아래를 내려다본다. 어둠이 이쪽을 마주 본다."
    - "미궁 계단을 내려다봐도 다리가 떨리지 않는다."
    - "숨을 들이쉬고, 내쉰다. 심장이 평소의 박자로 뛴다."
    - "무섭지 않은 건 아니다. 무서운데, 그게 다리까지 내려오지 않는다."
    - 경비병: "학생, 실습 시간 아니면 들어가면 안 된다."
    - 나: "알아요. 그냥 보고 있었어요."
    - 경비병@웃음: "보통 1학년은 그 앞에 서면 얼굴이 하얗게 질리던데. 담력 좋네."
    - 속마음: "(언젠가 이 미궁 바닥에서 차원문이 열린다. 그날도 이 다리가 떨리지 않아야 한다.)"
    - 시스템: "의지 D등급 달성"
    - "돌아서는 등 뒤로, 미궁의 바람이 한 번 더 불어왔다."

# ================================================================ 재능 개화 / 진화
- id: bloom_mana
  title: 재능 개화 — 마나 탱크
  art: cg_bloom_mana
  on: auto
  free: true
  priority: 6
  when: "talent.마나탱크 == 1 and stat.마력량 >= 45"
  lines:
    - "자다가 깼다."
    - "창밖의 달이 기울어 있다. 새벽 두 시쯤일까. 방 안은 고요하다."
    - "그런데 몸속이 시끄럽다."
    - "명치 아래에서 무언가가 출렁인다. 고여 있던 물이 둑을 넘는 소리."
    - "몸 안에서 마력이 강물처럼 돌고 있다."
    - "손끝, 발끝, 머리카락 끝까지. 핏줄이 아닌 길을 따라 뜨거운 것이 흐른다."
    - 속마음: "(뭐야, 이거. 폭주? 아니, 폭주라면 이렇게 고르지 않아.)"
    - "이불을 걷어차고 앉았다. 손바닥이 희미하게 빛난다."
    - "빛 알갱이가 반딧불처럼 방 안을 떠다닌다."
    - when: "origin != '악역도련님' and origin != '몰락귀족'"
      나레이션: "건너편 침대의 브루노가 코를 골며 돌아눕는다. 다행이다."
    - "마력이 한 바퀴 돌 때마다 고였던 자리가 넓어진다. 저수지가 아니라, 강이 되어 간다."
    - 속마음: "(마나 탱크. 마력량만 많은 '물통' 재능.)"
    - 속마음: "(원작에서 개화 조건이 마력량 45였다.)"
    - 속마음: "(그리고 개화하면 이름이 바뀐다. 고여 있던 물이—)"
    - 시스템: "[ 조건 충족: 마력량 45 ]"
    - 시스템: "[ 재능 「마나 탱크」가 반응합니다 ]"
    - "눈앞에 반투명한 창이 떠올랐다. 게임에서 수천 번 본 바로 그 창이."
    - when: "perk.상태창"
      나레이션: "숫자만 보여 주던 상태창에, 오늘은 숫자가 아닌 문장이 떠 있다."
    - 시스템: "[ 고인 것은 썩고, 흐르는 것은 맑아진다 ]"
    - "창의 테두리가 금빛으로 갈라진다. 글자가 한 획씩 다시 쓰인다."
    - 시스템: "재능 개화: 마나 탱크 → 「마나 순환」 (마력량 +6, 마력량 성장 +20%)"
    - "그 순간, 몸 안의 강이 크게 한 바퀴를 돌았다."
    - "숨을 들이쉬자 공기 중의 마나가 저절로 따라 들어온다. 내쉬자 몸 밖으로 맑게 빠져나간다."
    - "물통이 아니다. 이제 이건 순환이다."
    - 속마음: "(1회차 땐 이 개화 컷신을 보려고 마력 수련만 3주를 돌렸다. 화면엔 반짝이 이펙트 하나였다.)"
    - 속마음: "(직접 겪으니 다르다. 온몸이, 처음으로 숨을 쉬는 것 같다.)"
    - "빛 알갱이가 하나둘 꺼진다. 손바닥엔 미지근한 온기만 남았다."
    - when: "origin != '악역도련님' and origin != '몰락귀족'"
      브루노: "…으음… 뭐야… 왜 이렇게 밝아…"
    - "다시 누웠다. 잠이 오지 않는다."
    - "몸속에서 강물 소리가 자장가처럼 흐른다."
    - 속마음: "(10년. 이 강은 어디까지 넓어질 수 있을까.)"
  effects: ["talent.마나탱크 = 2", "stat.마력량 += 6", "growth.마력량 += 0.2"]

- id: bloom_sense
  title: 재능 개화 — 마력 감응
  art: dorm_room
  on: auto
  free: true
  priority: 6
  when: "talent.마력감응 == 1 and found.finn and found.dorothy"
  lines:
    - "식당에서 도로시를, 연무장에서 핀을 본 날 밤."
    - "기숙사 침대에 누워 천장을 본다. 눈을 감아도 두 사람의 잔상이 지워지지 않는다."
    - "도로시의 냄비에서 피어오르던 무지갯빛 김. 핀의 빗자루 끝에서 번뜩이던 칼날 같은 선."
    - 속마음: "(마력 감응. 남의 잠재 재능을 '느낌'으로 아는 재능.)"
    - 속마음: "(원작에선 직감 보정 정도로 쓰였다.)"
    - 속마음: "(그런데 오늘 둘을 봤을 때는 느낌이 아니었다. 거의… 보였다.)"
    - "관자놀이가 욱신거린다. 머릿속에서 무언가 바스락거린다."
    - "덧문이 열리기 직전처럼."
    - "그리고, 감각이 한 겹 더 열렸다."
    - 시스템: "[ 감응 누적: 숨은 재능 2명 확인 ]"
    - 시스템: "[ 재능 「마력 감응」이 한계를 넘습니다 ]"
    - "눈을 감았는데 방 안이 보인다. 아니, 방이 아니라 방 안의 '마력'이 보인다."
    - when: "origin != '악역도련님' and origin != '몰락귀족'"
      나레이션: "건너편 침대. 잠든 브루노의 가슴께에서 붉은 쇳빛 덩어리가 맥박친다."
    - when: "origin != '악역도련님' and origin != '몰락귀족'"
      나레이션: "꺼지지 않는 화로의 불씨 같다."
    - "벽 너머, 기숙사 곳곳에서 크고 작은 빛이 깜빡인다. 촛불 같은 것, 모닥불 같은 것."
    - "감각이 담장 너머까지 번진다. 어떤 빛은 별처럼 작고, 어떤 빛은 눈이 아플 만큼 크다."
    - "이제 사람마다 품은 재능의 '모양'이 어렴풋이 보인다."
    - 시스템: "[ 보이지 않던 것을 보는 눈은, 보고 싶지 않던 것도 보게 됩니다 ]"
    - 시스템: "재능 개화: 마력 감응 → 「재능 투시」"
    - "눈을 떴다. 방은 다시 평범한 어둠이다. 심장이 쿵쿵 뛴다."
    - 속마음: "(이건 원작에 없다. 마력 감응의 개화 같은 건, 위키 어디에도 없었다.)"
    - 속마음: "(미구현 데이터 속 아이들. 원작이 버린 재능들.)"
    - 속마음: "(이 눈이라면 더 찾을 수 있다.)"
    - 속마음: "(…그리고 아마, 찾지 말았어야 할 것도.)"
    - "달이 구름 뒤로 숨은 짧은 순간, 아카데미 지하 깊은 곳에서 검붉은 무언가가 맥박친 것 같았다."
    - "기분 탓이겠지. 이불을 머리끝까지 끌어올렸다."
  effects: ["talent.마력감응 = 2"]

- id: bloom_bulgul
  title: 재능 진화 — 병약 → 불굴
  art: dorm_room
  on: auto
  free: true
  priority: 6
  when: "talent.병약 and sick.count >= 2 and stat.체질 >= 22"
  lines:
    - "또 앓아누웠다가 일어난 아침."
    - "며칠 내내 열에 들떠 있었다. 꿈과 천장이 번갈아 보였다."
    - when: "origin != '악역도련님' and origin != '몰락귀족'"
      나레이션: "머리맡에 브루노가 두고 간 물 주전자와 식은 죽 한 그릇이 놓여 있다."
    - "창으로 아침 햇살이 들어온다. 몸을 일으켰다. 늘 그렇듯 각오하고."
    - "…어?"
    - "이상하게 몸이 가볍다."
    - "머리가 핑 돌지 않는다."
    - "다리가 후들거리지 않는다. 숨이 끝까지 들어간다."
    - 속마음: "(병약. 캐릭터 생성 때 포인트 4를 받고 고른 음수 재능.)"
    - 속마음: "(그땐 숫자 장사라고 생각했다.)"
    - 속마음: "(그 숫자의 대가로 이 몸은 몇 번이나 쓰러졌다. 훈련장에서, 수업 중에, 계단에서.)"
    - "손을 쥐었다 편다. 손끝까지 피가 도는 게 느껴진다."
    - "몇 번을 쓰러져도 다시 일어났던 몸이, 그 사실을 기억하고 있다."
    - 시스템: "[ 쓰러진 횟수를 확인합니다 ]"
    - 시스템: "[ 일어선 횟수를 확인합니다 ]"
    - 시스템: "[ 일어선 횟수가 쓰러진 횟수보다 한 번 많습니다 ]"
    - "반투명한 창 속에서 「병약」 두 글자에 금이 간다."
    - "유리 깨지는 소리 대신, 오래 참았던 숨을 내쉬는 소리가 났다. 내 숨이었다."
    - 시스템: "재능 진화: 병약 → 「불굴」 (체질 성장 +20%, 더 이상 앓아눕지 않는다)"
    - 속마음: "(음수 재능이 진화하는 루트는 원작에도 있었다. 조건이 너무 가혹해서 아무도 안 했을 뿐.)"
    - 속마음: "(위키엔 '비추천. 그 시간에 다른 거 하세요'라고 적혀 있었다.)"
    - 속마음: "(…내가 쓴 문장이었나.)"
    - "침대에서 내려와 창문을 열었다."
    - "아침 공기가 폐 깊숙이 들어온다. 차갑고 달다."
    - "저 아래 훈련장에서 아침 구보를 하는 학생들이 보인다."
    - 나@웃음: "…좋아. 오늘은 나도 뛴다."
    - "계단을 두 칸씩 뛰어 내려갔다. 숨이 찬다. 그런데 멈추지 않아도 된다."
    - 속마음: "(이 몸의 원래 주인도 매일 이렇게 숨이 찼을까. 이 아침을 보여 주고 싶다.)"
  effects: ["talent.병약 = 0", "talent.불굴 = 1", "growth.체질 += 0.5"]

- id: bloom_courage
  title: 재능 진화 — 겁쟁이 → 용기
  on: auto
  free: true
  priority: 6
  when: "talent.겁쟁이 and (fate.edric == 'saved' or tourney.round >= 2)"
  lines:
    - when: "fate.edric == 'saved'"
      나레이션: "미궁 실습이 끝나고 기숙사로 돌아온 뒤에도, 손이 떨린다."
    - when: "fate.edric == 'saved'"
      나레이션: "피로 그린 원. 로브 입은 그림자. 에드릭의 목덜미를 쥐고 있던 손."
    - when: "fate.edric == 'saved'"
      나레이션: "그 통로 끝에 섰을 때, 다리가 먼저 돌아서려 했다. 늘 그랬던 것처럼."
    - when: "fate.edric != 'saved'"
      나레이션: "본선 8강을 치른 뒤. 눈을 감아도 귓가에서 함성이 가시지 않는다."
    - when: "fate.edric != 'saved'"
      나레이션: "수천 개의 눈. 진행자의 외침. 맞은편에서 무기를 고쳐 쥐던 상대."
    - when: "fate.edric != 'saved'"
      나레이션: "경기장 입구에 섰을 때, 다리가 먼저 돌아서려 했다. 늘 그랬던 것처럼."
    - 속마음: "(겁쟁이. 강적 앞에서 행동 실패.)"
    - 속마음: "(원작이었다면 '도망친다' 선택지만 빛나고 있었을 거다.)"
    - "무서웠다."
    - "그런데 도망치지 않았다."
    - when: "fate.edric == 'saved'"
      나레이션: "발이 앞으로 나갔다. 에드릭이 울 것 같은 얼굴을 하고 있어서였을까."
    - when: "fate.edric != 'saved'"
      나레이션: "발이 앞으로 나갔다. 모래 위로, 한 걸음씩."
    - "손바닥을 본다. 아직도 떨린다. 떨리는데, 주먹이 쥐어진다."
    - "그 주먹 위로, 반투명한 창이 소리 없이 떠올랐다."
    - 시스템: "[ 공포를 확인합니다 ]"
    - 시스템: "[ 공포는 사라지지 않았습니다 ]"
    - 시스템: "[ 다만, 당신이 공포보다 한 걸음 앞에 있었습니다 ]"
    - "「겁쟁이」라는 글자가 창 안에서 천천히 지워진다. 그 자리에 새 글자가 한 획씩 새겨진다."
    - 시스템: "재능 진화: 겁쟁이 → 「용기」 (의지 +10)"
    - 속마음: "(용기는 겁이 없는 게 아니라, 겁이 나는데 하는 거다. …어디서 많이 들은 대사다.)"
    - 속마음: "(3,000시간 동안 화면 속 캐릭터들한테 그 말을 시켜 놓고, 정작 나는 처음이다.)"
    - "가슴 한가운데가 묵직하다. 겁이 빠져나간 자리가 아니라, 단단한 무언가가 들어선 자리다."
    - when: "fate.edric == 'saved'"
      나레이션: "복도 저편 의무실 쪽에서 에드릭이 투덜거리는 목소리가 들렸다. 살아 있는 목소리."
    - when: "fate.edric != 'saved'"
      나레이션: "창밖에서 다음 경기를 알리는 깃발이 펄럭인다. 이번엔, 그 소리가 무섭지 않다."
    - 속마음: "(무서운 일은 앞으로도 많을 거다.)"
    - 속마음: "(10년 치나 남았으니까. 그래도 한 번은 해냈다.)"
  effects: ["talent.겁쟁이 = 0", "talent.용기 = 1", "stat.의지 += 10"]

# ================================================================ 학교생활 (무작위·무료)
- id: life_rain
  title: 소나기
  art: rain_courtyard
  on: auto
  free: true
  chance: 0.06
  repeat: 3
  cooldown: 4
  when: "time.year == 1"
  lines:
    - "강의동을 나서는데, 하늘이 갑자기 어두워졌다."
    - "후두둑. 굵은 빗방울이 돌바닥을 두드리더니, 순식간에 장대비가 됐다."
    - "회랑 처마 밑으로 뛰어들었다."
    - "안뜰이 하얗게 흐려진다. 흙냄새가 확 올라온다."
    - 나레이션:
        - "갑자기 소나기가 쏟아졌다. 처마 밑에서 비가 그치길 기다렸다."
        - { when: "affinity.liana >= 15", text: "갑자기 소나기. 처마 밑으로 뛰어든 리아나와 어깨가 닿았다. 둘 다 아무 말도 하지 않았다." }
        - { when: "affinity.bruno >= 20", text: "갑자기 소나기. 브루노가 망토를 펼쳐 우산처럼 씌워줬다. 브루노는 다 젖었다." }
    - when: "affinity.liana >= 15"
      나레이션: "젖은 머리카락 끝에서 물방울이 떨어진다. 리아나의 뾰족한 귀 끝도 젖어 있다."
    - when: "affinity.liana >= 15"
      나레이션: "빗소리만 크다. 어깨에 닿은 체온이 생각보다 따뜻하다."
    - when: "affinity.liana >= 15"
      리아나@웃음: "…숲에선 비 오면 큰 잎 밑에 숨었어. 여긴 잎이 없네."
    - when: "affinity.liana >= 15"
      나: "처마가 잎인 셈 치자."
    - when: "affinity.liana >= 15"
      리아나@웃음: "응. 그럼 우리, 지금 같은 잎 밑에 있는 거다."
    - when: "affinity.liana >= 15"
      속마음: "(원작에선 '비가 온다' 한 줄짜리 날씨 이벤트였다. 그 한 줄 안에 이런 체온이 있을 줄은.)"
    - when: "affinity.bruno >= 20 and affinity.liana < 15"
      나레이션: "망토 밑은 브루노의 체온으로 후끈하다. 쇳가루와 숯 냄새가 난다."
    - when: "affinity.bruno >= 20 and affinity.liana < 15"
      브루노@웃음: "하하! 대장간 애는 비 좀 맞아도 안 죽는다!"
    - when: "affinity.bruno >= 20 and affinity.liana < 15"
      브루노@웃음: "넌 감기 걸리면 큰일이잖아."
    - when: "affinity.bruno >= 20 and affinity.liana < 15"
      나@당황: "너 다 젖었는데."
    - when: "affinity.bruno >= 20 and affinity.liana < 15"
      브루노: "괜찮다니까. 화로 앞에 서면 금방 마른다. 진짜다, 김 난다 아이가?"
    - when: "affinity.bruno >= 20 and affinity.liana < 15"
      속마음: "(이 커다란 등이 6년 뒤 수도의 대장간 거리에서… 아니. 지금은 생각하지 말자.)"
    - when: "affinity.liana < 15 and affinity.bruno < 20"
      나레이션: "처마 밑엔 나 혼자다. 빗줄기가 안뜰 돌바닥 위에서 하얗게 튄다."
    - when: "affinity.liana < 15 and affinity.bruno < 20"
      나레이션: "웅덩이마다 동그라미가 생겼다 사라진다. 끝도 없이."
    - when: "affinity.liana < 15 and affinity.bruno < 20"
      속마음: "(원작에선 '비가 온다. 야외 활동 효율 감소' 한 줄짜리 날씨 이벤트였다.)"
    - when: "affinity.liana < 15 and affinity.bruno < 20"
      속마음: "(여기엔 냄새가 있고, 소리가 있고, 젖은 소매의 무게가 있다.)"
    - when: "affinity.liana < 15 and affinity.bruno < 20"
      나레이션: "회랑 끝에서 누군가 우산도 없이 뛰어간다. 비명 반, 웃음 반."
    - "빗소리가 조금씩 가늘어진다. 구름 사이로 희미하게 빛이 새어 나온다."
    - "안뜰 웅덩이에 하늘이 비쳤다. 이 세계의 하늘도, 비가 그치면 이렇게 맑다."

- id: life_letter
  title: 편지
  art: dorm_room
  on: auto
  free: true
  chance: 0.08
  repeat: 2
  cooldown: 6
  when: "time.year == 1"
  branch:
    - when: "origin == '평민장학생'"
      lines:
        - "기숙사 우편함에 누런 봉투가 꽂혀 있었다. 모서리가 닳고 흙 자국이 묻어 있다."
        - "집에서 편지가 왔다."
        - "보낸 사람 자리엔 삐뚤빼뚤한 글씨로 마을 이름. 그리고 '엄마가'."
        - "봉투를 뜯자 쪽지 한 장이 나온다. 서툰 글씨로 딱 한 줄."
        - "'밥 잘 먹어라.'"
        - "봉투 바닥에서 은화 다섯 닢이 짤랑 굴러 나왔다. 천 조각에 꼼꼼히 싸여 동봉돼 있었다."
        - 속마음: "(은화 다섯 닢. 시골 살림에선 한 달 반찬값쯤 될 거다.)"
        - 속마음: "(이 편지는 나한테 온 게 아니다. 이 몸의 원래 주인에게 온 거다.)"
        - "쪽지 뒷면에 연필로 썼다 지운 자국이 있다. '보고 싶다'였던 것 같다."
        - "결국 지운 모양이다. 대신 '밥 잘 먹어라'만 남았다."
        - 속마음: "(…밥 잘 먹을게요. 이 몸, 아프지 않게 잘 쓸게요.)"
        - "은화는 지갑 깊숙이 넣었다. 쪽지는 베개 밑에 넣었다."
        - "그날 밤은 오랜만에 꿈도 꾸지 않고 잤다."
      effects: ["money += 5", "stress -= 10"]
    - when: "origin == '몰락귀족'"
      lines:
        - "사감이 굳은 얼굴로 봉투 하나를 건넸다."
        - "붉은 밀랍 봉인. 낯익은 상회의 문장."
        - 사감@진지: "학생 앞으로 온 거다. …이번 달에만 세 번째구나."
        - "독촉장이 기숙사까지 따라왔다."
        - "'채무 이행 기한 경과. 차기 분기까지 상환하지 않을 시, 저택 및 부속 토지에 대하여—'"
        - "끝까지 읽지 않았다. 숫자만 봐도 위가 쓰리다."
        - 속마음: "(몰락 귀족 3남. 캐릭터 생성 화면에서 '가문 빚이 있다'는 한 줄을 가볍게 넘겼었다.)"
        - 속마음: "(그 한 줄은 이렇게 매달 우편으로 온다. 붉은 밀랍을 달고.)"
        - "봉투 안쪽에 접힌 종이가 하나 더 있다. 저택 집사의 필체다."
        - "'도련님, 저택은 저희가 어떻게든 지키겠습니다. 학업에만 전념하십시오.'"
        - "글씨 끝이 떨려 있었다."
        - 속마음: "(지켜야 할 게 하나 더 늘었다. 이 몸의 이름과, 그 이름 아래에서 사는 사람들.)"
        - "독촉장을 접어 서랍 맨 밑에 넣었다."
        - "서랍이 잘 닫히지 않는다. 지난번 것들 때문이다."
      effects: ["stress += 10"]
    - when: "origin == '악역도련님'"
      lines:
        - "하인이 은쟁반에 편지를 받쳐 들고 왔다. 검은 밀랍에 벨모어 백작가의 문장."
        - 하인@진지: "백작님께서 보내셨습니다, 도련님."
        - "아버지의 편지. 두꺼운 고급 양피지를 펼쳤다."
        - "'벨모어의 이름에 먹칠하지 마라.'"
        - "한 줄이 전부다. 서명조차 비서의 필체다."
        - when: "fate.edric == 'alive_scarred'"
          나레이션: "가슴의 흉터가 욱신거린다. 아들이 미궁에서 죽을 뻔했다는 소식은 아버지 귀에 닿지 않은 모양이다."
        - when: "fate.edric == 'alive'"
          나레이션: "미궁 3층에서 죽을 뻔했던 일 같은 건, 물론 묻지 않는다."
        - 속마음: "(원작의 에드릭이 왜 그렇게 비뚤어졌는지, 위키엔 '원래 그런 놈'이라고만 적혀 있었다.)"
        - 속마음: "(이런 편지만 받으며 자랐다면. …원래 그런 놈 같은 건 없다.)"
        - 하인@당황: "답장을… 쓰시겠습니까?"
        - 나: "아니. 괜찮아. 가져와 줘서 고마워."
        - 하인@놀람: "…예, 예. 도련님."
        - 나레이션:
            - "하인이 서둘러 물러났다. 문이 닫히고 나서야 숨을 내쉬는 소리가 들렸다."
            - { when: "servant.trust >= 1", text: "하인이 물러나며 고개를 한 번 더 숙였다. 예전보다 조금 덜 굳은 얼굴로." }
      effects: ["stress += 5"]
    - when: "origin == '숲고아'"
      lines:
        - "아침, 창문을 두드리는 소리에 눈을 떴다. 똑, 똑, 똑."
        - "창틀에 숲의 새가 앉았다. 이 도시에선 본 적 없는 청록색 날개다."
        - "새가 고개를 갸웃하며 나를 본다. 무서워하지 않는 눈이다."
        - 속마음: "(숲 출신 고아. 이 몸에게는 편지를 써 줄 가족이 없다. 대신—)"
        - "새는 부리에 물고 온 깃털 하나를 창틀에 두고 날아갔다. 동쪽 하늘, 숲이 있는 쪽으로."
        - "깃털을 집어 들었다. 이슬 냄새, 이끼 냄새, 오래된 나무껍질 냄새가 묻어 있다."
        - "가슴 안쪽이 뜨거워진다. 이 몸이 기억하는 냄새다. 나는 처음 맡는데."
        - when: "talent.몸주인의잔재"
          나레이션: "모르는 노래 한 소절이 입에서 흘러나왔다. 이 몸의 원래 주인이 부르던 노래일까."
        - 속마음: "(편지 대신 깃털. 숲이 보내는 안부.)"
        - 속마음: "(이 몸한텐 원래 이런 게 일상이었겠지.)"
        - "깃털을 책갈피 삼아 교재 사이에 끼웠다. 오늘 하루는 숲 냄새가 따라다닐 것이다."
      effects: ["stress -= 10"]
    - lines:
        - "기숙사 현관 우편함 앞. 아침마다 사람들이 북적인다."
        - 학생 A@웃음: "엄마가 과자 보냈다! 나눠 먹자!"
        - 학생 B: "누나가 또 잔소리 편지 보냈어. 세 장이나."
        - "웃음소리, 봉투 뜯는 소리, 종이 냄새."
        - "내 칸을 열었다."
        - "편지함은 오늘도 비어 있다."
        - 속마음: "(이름 없는 엑스트라. 원작 데이터상 가족 설정 없음.)"
        - 속마음: "(출신 마을 없음. 대사 없음.)"
        - "이 몸에게 편지를 보낼 사람은 없다."
        - 속마음: "(이 몸의 원래 주인은, 매일 아침 이 빈칸을 열면서 무슨 생각을 했을까.)"
        - "빈 우편함 안쪽 나무 벽에, 손톱으로 그은 작은 줄들이 있다. 무언가를 세던 흔적이다."
        - "우편함을 조용히 닫았다."
        - 속마음: "(괜찮다. 받을 편지가 없으면 쓰면 된다.)"
        - 속마음: "(10년 뒤의 나한테 보내는 편지라도.)"

- id: life_snore
  title: 룸메이트의 코골이
  art: dorm_room
  on: auto
  free: true
  chance: 0.05
  repeat: 2
  cooldown: 4
  slots: [밤]
  when: "time.year == 1 and affinity.bruno >= 10 and origin != '악역도련님' and origin != '몰락귀족'"
  lines:
    - "새벽 한 시. 눈을 감은 지 두 시간째."
    - "드르렁— 푸우. 드르렁— 푸우."
    - "브루노의 코골이가 벽을 울린다. 대장간 풀무 소리 같다."
    - "창틀이 미세하게 떨린다. 기분 탓이 아니다. 진짜로 떨린다."
    - 속마음: "(원작 기숙사 이벤트 '룸메이트의 코골이: 피로 +5'. 숫자 5가 이렇게 긴 밤일 줄이야.)"
    - "베개로 귀를 막았다. 소용없다. 베개를 뚫고 들어온다."
    - "이불을 머리끝까지 덮었다. 이불도 같이 울린다."
    - 브루노: "으음… 할아버지… 망치… 내가 들 수 있다니까…"
    - "잠꼬대다. 커다란 손이 허공을 쥐었다 놓는다."
    - "꿈에서도 망치질을 하는 모양이다."
    - "어이가 없어서 웃음이 나왔다. 화가 스르르 녹아 버렸다."
    - 브루노@웃음: "헤헤… 봐라… 반짝반짝하제…"
    - "드르렁— 푸우."
    - "창밖이 희뿌옇게 밝아 온다. 새가 울기 시작한다."
    - "브루노는 여전히 풀무질 중이다."
    - "잠은 다 잤다."
    - 속마음: "(그래도 이상하게 화가 안 난다. 이 소리가 6년 뒤에도 계속 들렸으면 좋겠다.)"
  effects: ["fatigue += 5"]

- id: life_exam_notice
  title: 무투대회 공고
  art: campus
  on: auto
  free: true
  at: "1.6.2.방과후"
  priority: 4
  lines:
    - "방과 후, 중앙 광장 게시판 앞에 사람들이 벽을 이루고 있다."
    - "까치발을 들어도 안 보인다. 누군가의 팔꿈치가 옆구리를 찌른다."
    - 학생 A@화남: "밀지 마! 나도 아직 못 봤어!"
    - "겨우 틈을 비집고 들어가자, 새로 붙은 공고 한 장이 보였다."
    - "게시판에 공고가 붙었다. ─ 1학년 무투대회: 7월 2주차 예선, 3주차 본선."
    - "그 아래 붉은 글씨로 한 줄 더. '반 구분 없이 누구나 참가 가능.'"
    - 학생들: "우승은 카이든 황자겠지. 성검 쓰는 평민은 어떨까?"
    - 학생 B: "그 평민, 성검 없이 목검만 들면 별거 없다던데."
    - 학생 A: "아델하이트 그 애도 나온대. 마법 쓰면 반칙 아니야?"
    - 상급생@웃음: "1학년 대회는 마법 허용이야. 재작년엔 결승에서 경기장 바닥이 날아갔지."
    - "웅성거림이 뚝 끊겼다. 물살이 갈라지듯 사람들 사이로 길이 열린다."
    - "카이든이었다. 공고를 한 번 훑어보더니, 아무 말 없이 돌아선다."
    - 학생 A: "봤어? 눈길도 안 주네. 이미 우승했다는 거지."
    - "그 뒤로 아렌이 공고 앞에 오래 서 있었다. 주먹을 쥐었다 폈다 한다."
    - 아렌@진지: "…나갈 거야. 성검 말고, 내 힘으로 어디까지 가는지 보고 싶어."
