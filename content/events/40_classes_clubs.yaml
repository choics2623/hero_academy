          - "가렌의 목검이 다섯 번 날아왔고, 다섯 번 다 허공을 갈랐다."
          - 학생들: "(웅성웅성) 저 둘 뭐야…?"
          - 카이든: "나쁘지 않군. 등 뒤에서 칼 맞을 걱정은 안 해도 되겠어."
          - 가렌: "황자. 등을 맡겼으면 끝까지 맡겨라. 세 번 돌아봤다."
