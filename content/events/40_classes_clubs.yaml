          - "카이든이 혼자 사방을 다 막아 버렸다. 나는 밧줄에 끌려다녔다."
          - "왼쪽, 오른쪽, 다시 왼쪽. 발이 땅에 닿는 시간보다 공중에 뜬 시간이 길었다."
          - 카이든@화남: "등을 맡기라 했지, 업히라곤 안 했다."
          - 가렌: "황자, 너도 틀렸다. 짝을 끌고 다니는 건 혼자 싸우는 거다."
          - "카이든이 이를 악물었다. 그리고 다음 목검부터는, 아주 조금 속도를 줄였다."
          - 속마음: "(아주 조금. 그게 이 녀석이 할 수 있는 최대한의 양보다.)"
