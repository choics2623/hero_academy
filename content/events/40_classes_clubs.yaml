    - "열람실엔 시험공부 하던 학생 몇이 졸고 있다. 책장 넘기는 소리, 누군가의 작은 코 고는 소리."
    - "반납할 책을 카운터에 내려놓자, 졸고 있는 줄 알았던 노인이 눈을 떴다."
    - "사서 노인이 서가 맨 위 칸을 지팡이로 가리켰다."
    - 사서: "저 파란 책 좀 꺼내 주게. 아니, 그 옆. 그래, 그거."
