    - "노인은 그걸 신문 읽듯 술술 읽어 내려갔다. 손가락으로 줄을 짚지도 않고."
    - "입술이 아주 조금 움직였다. 아는 노래의 가사를, 소리 없이 따라 부르는 것처럼."
    - 속마음: "(원작에서 이런 문자는 해독 아이템이 있어야 읽을 수 있었다. 그걸, 그냥 읽는다.)"
    - "펼쳐진 페이지에 빛바랜 삽화가 하나 있었다. 눈 덮인 고개를 넘는 사람들."
    - "노인의 손가락이 그 그림 위에 오래 머물렀다. 읽는 손이 아니라, 쓰다듬는 손이었다."
    - "한참 읽던 노인이 책장 사이에 손가락을 끼운 채, 창밖을 봤다."
    - 사서: "자네, 무언가를 바꾸려는 사람의 눈을 하고 있어."
    - "심장이 쿵 내려앉았다."
    - "손에 들고 있던 먼지떨이가 떨어졌다. 졸던 학생 하나가 깼다가 다시 잤다."
    - 사서: "놀랄 것 없네. 그런 눈은 가끔 있어. 아주 가끔."
    - "노인은 나를 보지 않았다. 여전히 창밖을 보고 있었다."
    - 사서: "바꾸려는 사람은 대개 둘 중 하나로 끝나지. 지치거나, 혼자가 되거나."
