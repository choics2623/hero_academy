    - 속마음: "(이백 개의 이름. 졸업할 땐 절반만 남는다. 그 절반 중 몇이 10년 뒤까지 살아 있을까.)"
    - "노인이 등잔 심지를 조금 올렸다. 꿰매야 할 등은 아직 반이나 남아 있었다."
  plants:
