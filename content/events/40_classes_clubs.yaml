          - 카이든: "돌아보지 않고."
          - 속마음: "(세 번 돌아봤던 사람이, 돌아보지 않겠다고 했다. 황자식으로는 최고의 칭찬이다.)"
        effects: ["trust.kaiden += 2"]
    - text: 혼자 남은 에드릭 벨모어와 묶는다
      when: "origin != '악역도련님'"
      effects: ["met.edric = 1"]
      lines:
        - "연무장 끝. 다들 짝을 찾아 흩어진 뒤에도, 한 명이 혼자 밧줄을 쥐고 서 있다."
        - "에드릭 벨모어. 금실 수놓은 훈련복이 흙바닥 위에서 혼자 반짝인다."
        - "아무도 그쪽을 보지 않는다. 아니, 다들 일부러 안 보고 있다."
        - 속마음: "(원작 1권의 악역. 하인을 때리고, 평민을 괴롭히고, 그리고──)"
        - 에드릭@화남: "…뭘 봐. 나랑 묶이겠다고? 동정이면 사양이야."
      check:
        type: 설득
        dc: 쉬움
        mods:
          - { when: "note.note_edric.known", value: 2, label: 원작 지식 }
      success:
        lines:
          - 나: "동정 아니야. 남은 게 너뿐이라서."
          - 에드릭@놀람: "…하. 솔직하네."
          - "막상 묶이니 에드릭은 의외로 성실했다."
          - "가르친 사람이 좋았는지 자세 하나는 반듯하다. 귀족 검술 특유의 깔끔한 막기."
          - "가렌의 목검이 내 등으로 오자, 욕을 하면서도 막아냈다."
          - 에드릭: "…착각하지 마. 내가 맞기 싫어서 막은 거야."
          - "수업이 끝나고 밧줄을 풀 때, 에드릭이 시선을 피한 채 중얼거렸다."
          - 에드릭: "근데 너 이름이 뭐냐. …다음 주 미궁, 같은 층이면 아는 척 정도는 해 줄게."
          - 속마음: "(다음 주 미궁. 같은 층. …그래, 아는 척해 줘. 꼭.)"
        effects: ["edric.contact = 1", "affinity.edric += 6"]
      fail:
        lines:
          - 나: "그냥, 혼자 서 있길래."
          - 에드릭@화남: "그러니까 그게 동정이잖아."
          - "에드릭은 끝까지 내 쪽을 보지 않았다."
          - "목검이 날아와도 혼자 막고, 혼자 맞았다. 밧줄은 내 허리만 당겼다."
          - "밧줄이 팽팽하게 당겨진 채로 수업이 끝났다."
          - 속마음: "(이 밧줄만큼의 거리. 다음 주까지 그걸 좁힐 수 있을까.)"
        effects: ["affinity.edric += 2"]
      great:
        lines:
          - "에드릭이 밧줄을 감아 내 손에 쥐여 주었다. 매듭이 반듯하다."
          - 에드릭: "…이 매듭, 우리 집 검술 사범한테 배운 거다. 절대 안 풀려."
          - 에드릭@당황: "아, 아니, 그냥 그렇다고. 미궁에서 쓰든가 말든가."
          - 속마음: "(안 풀리는 매듭. 원작의 에드릭은 3층에서 혼자였다. 이번엔 손에 밧줄이 하나 더 있다.)"
        effects: ["affinity.edric += 2"]
    - text: 아무도 다가오지 않는다. 먼저 손을 내민다
      when: "origin == '악역도련님'"
      check:
        type: 설득
        dc: 보통
        mods:
          - { when: "servant.trust >= 1", value: 4, label: 달라진 소문 }
          - { when: "servant.trust >= 2", value: 4, label: 늙은 하인의 말 }
      success:
        lines:
          - "주위를 둘러봤다. 시선이 닿는 곳마다 다들 고개를 돌린다."
          - "벨모어가 망나니. 원작의 에드릭이 쌓아 온 이름이다. 그리고 지금은 내 이름이다."
          - "밧줄 끝을 들고, 가장 가까이 서 있던 평민 학생에게 내밀었다."
          - 나: "…부탁할게. 같이 해 줘."
          - "망설이던 평민 학생 하나가 결국 밧줄 끝을 받아 들었다."
          - 학생들: "(속닥) 벨모어가 도련님이 먼저 부탁을 다 하네…"
          - "어색했지만, 등은 맡겼다. 원작의 에드릭은 한 번도 해 본 적 없는 일이다."
          - 속마음: "(다음 주. 이 등을 맡겨 줄 사람이 하나라도 있다면, 원작과는 다르게 끝날지도 모른다.)"
        effects: ["reputation += 4", "stat.의지 += 0.5"]
      fail:
        lines:
          - "밧줄 끝을 내밀었다. 받는 사람이 없었다."
          - "한 명, 두 명. 다들 한 걸음씩 물러섰다. 벨모어가 망나니가 한 짓을 다들 기억한다. 내가 한 게 아닌데도."
          - "결국 가렌 교관이 직접 내 짝이 됐다."
          - 가렌: "벨모어. 넌 나랑 묶는다. 불만 있나."
          - 나@당황: "…없습니다."
          - "그날 하루 동안 맞은 목검이 지난 한 달 치보다 많았다."
          - "등 뒤에서 가렌의 숨소리가 났다. 한 번도 흐트러지지 않는 숨소리."
          - "이상하게 덜 외로웠다."
        effects: ["affinity.garen += 4", "stat.체질 += 1", "fatigue += 15"]
      great:
        lines:
          - "수업이 끝나고, 그 평민 학생이 쭈뼛거리며 다가왔다."
          - 학생 A: "저, 벨모어 님… 생각보다 등이 든든하던데요."
          - "그 한마디가 기숙사 복도를 타고 퍼졌다. 저녁 무렵엔 소문의 색이 조금 달라져 있었다."
          - 속마음: "(망나니 소문을 지우는 데 필요한 건 대단한 일이 아니었다. 등 한 번이었다.)"
        effects: ["reputation += 2"]

- id: cls_alchemy_2
  title: 연금술 — 상처약
  art: alchemy_lab
  on: auto
  free: true
  window: "1.5.3"
  effects: ["affinity.bistol += 2"]
  lines:
    - "미궁 실습 다음 주. 연금술 실습실로 내려가는 계단의 발소리가 유난히 무겁다."
    - "붕대 감은 학생이 절반이다. 팔걸이를 한 학생, 이마에 거즈를 붙인 학생, 절뚝이며 들어오는 학생."
    - "실습실에선 오늘만큼은 소독약 냄새가 유황 냄새를 이겼다."
    - "드물게 비스톨이 먼저 와 있었다. 교탁 위에 약초 바구니가 놓여 있다. 쑥, 서리풀, 노란 꽃잎 같은 것들."
    - "가운 소매에 연고 얼룩이 잔뜩이다. 연구실에서 밤새 상처약을 만든다는 소문이 맞는 모양이다."
    - 비스톨: "미궁에서 긁혀 온 놈들이 많군. 잘됐다. 오늘은 상처약이다."
    - 학생 A@당황: "(속닥) 잘됐다고…?"
    - 비스톨: "자기가 만든 건 자기 상처에 바른다. 그러니 대충 만들지 마라."
    - "몇몇이 얼굴을 굳혔다. 비스톨은 개의치 않고 칠판에 배합비를 적어 내려간다."
    - "서리풀 세 줌, 쑥 즙 두 숟갈, 밀랍 한 덩이. 숫자 옆마다 작은 글씨로 '절대'가 붙어 있다."
    - 비스톨@진지: "절대, 라고 적힌 건 절대다. 연금술에서 '대충'은 독의 다른 이름이다."
    - when: "fate.edric == 'dead'"
      나레이션: "맨 뒷줄에 빈자리가 하나 있다. 비스톨이 출석부의 한 이름 위에서 펜을 오래 멈췄다가, 조용히 줄을 그었다."
    - when: "fate.edric == 'dead'"
      속마음: "(원작대로 됐다. 출석부의 줄 하나. 원작은 그 줄조차 보여 주지 않았다.)"
    - when: "origin != '악역도련님' and (fate.edric == 'saved' or fate.edric == 'saved_by_teacher')"
      나레이션: "에드릭이 붕대 감은 팔로 솥을 젓고 있다. 비스톨이 그 앞을 지나며 연고 한 통을 말없이 놓고 갔다."
    - when: "origin != '악역도련님' and (fate.edric == 'saved' or fate.edric == 'saved_by_teacher')"
      에드릭@당황: "(속닥) …뭐야, 이거. 나 주는 거야?"
    - when: "fate.edric == 'alive_scarred'"
      나레이션: "가슴의 상처가 아직 욱신거린다. 비스톨이 내 책상에 연고 한 통을 내려놓았다. ─ 미궁 상처엔 이게 낫다."
    - when: "fate.edric == 'alive_scarred'"
      속마음: "(원작의 에드릭은 이 연고를 받지 못했다. 이 상처가 생길 만큼도 버티지 못했으니까.)"
    - "약초를 빻는 소리가 실습실을 채웠다. 절구마다 박자가 제각각이다."
    - 속마음: "(상처약. 원작에선 상점에서 은화 세 닢이면 사는 소모품이었다. 직접 만들면 이렇게 손이 많이 가는구나.)"
    - "소매를 걷자 손등에 미궁에서 긁힌 자국이 아직 남아 있다."
  choices:
    - text: 배합비를 한 방울도 틀리지 않게 지킨다
      check:
        type: 손재주
        dc: 보통
        mods:
          - { when: "fired.club_green_mandrake", value: 2, label: 약초 손질 }
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      success:
        lines:
          - "칠판의 숫자를 한 번 더 읽었다. 서리풀 세 줌. 손대중이 아니라 저울로."
          - "쑥 즙은 숟가락 대신 눈금 유리관으로 쟀다. 밀랍은 불에서 내린 뒤 열을 세고 넣었다."
          - "연둣빛 연고가 완성됐다. 박하 비슷한 시원한 냄새가 올라온다."
          - "손등 긁힌 데 바르자 쓰라림이 금세 가라앉는다."
          - "비스톨이 지나가다 멈췄다. 새끼손가락으로 연고를 조금 찍어 냄새를 맡았다."
          - 비스톨: "…쓸 만하군. 남은 건 가져가라. 미궁은 또 갈 테니까."
          - 속마음: "(미궁은 또 간다. 그 말이 칭찬보다 오래 귀에 남았다.)"
        effects: ["affinity.bistol += 3", "stat.지성 += 0.5", "fatigue -= 10"]
      fail:
        lines:
          - "서리풀이 세 줌이었나, 세 숟갈이었나. 칠판을 다시 보려는데 앞사람 머리가 가렸다."
          - "감으로 넣었다. 감이 틀렸다."
          - "연고가 돌처럼 굳었다. 숟가락이 꽂힌 채로 서 있다."
          - 학생 B@웃음: "(속닥) 야, 숟가락이 서 있어…"
          - 비스톨: "벽 틈 메우는 데 쓰면 되겠군. 기숙사 벽이 마침 금이 갔다더라."
          - 비스톨: "…농담이다. 쓰지 마. 벽이 더 갈라진다."
          - 속마음: "(이 사람 농담은 한 박자 늦게 온다. 그래서 더 웃기다. 웃으면 안 될 것 같은데.)"
        effects: ["affinity.bistol += 1"]
      great:
        lines:
          - "비스톨이 연고 통을 들어 불빛에 비춰 보더니, 선반에서 갈색 병 하나를 내렸다."
          - 비스톨: "교환이다. 강장제. 내가 만든 거라 맛은 보장 못 한다."
          - 비스톨: "그 연고는 내 연구실 상비약으로 쓰지. …라벨에 자네 이름을 적어도 되겠나."
          - 속마음: "(교수 연구실 상비약에 내 이름이. 원작 업적 목록 어디에도 없던 업적이다.)"
        effects: ["item.강장제 += 1", "affinity.bistol += 1"]
    - text: 비스톨 교수의 손놀림을 지켜본다
      effects: ["affinity.bistol += 2", "bistol.gentle = 1", "stat.지성 += 0.5"]
      lines:
        - "내 솥은 잠깐 미뤄 두고, 교수의 손을 따라 눈을 옮겼다."
        - "교수의 손은 학생들 솥 사이를 쉬지 않고 오간다. 무뚝뚝하고, 빠르고, 정확하다."
        - "불을 줄여 주고, 저울 눈금을 고쳐 주고, 넘치려는 솥을 손등으로 툭 밀어 낸다. 말은 한마디도 없다."
        - "그런데 화상 입은 여학생 앞에서만 동작이 느려졌다."
        - 여학생@슬픔: "죄, 죄송해요. 손잡이가 뜨거운 줄 몰라서…"
        - "비스톨은 대답 대신 자기 연고를 꺼냈다. 학생들 것보다 색이 맑은 연고였다."
        - "아주 조심스럽게 발라 준다. 아이를 대하는 손이었다."
        - 비스톨: "…다음부턴 장갑을 껴라."
        - "그 말을 하고 돌아서는 얼굴이, 아주 잠깐 아주 늙어 보였다."
        - when: "talent.마력감응"
          속마음: "(교수의 연고에서 희미한 마력이 느껴졌다. 약초만으로는 나지 않는 결이다. 무언가를 섞었다.)"
        - 속마음:
            - "(무뚝뚝한 사람이 다정해지는 순간은, 대개 누군가를 떠올릴 때다.)"
            - { when: "perk.고인물의기억 or perk.공략위키편집자", text: "(원작 교주의 손이 저렇게 다정할 리가 없다. …없어야 했다.)" }
    - text: 브루노의 솥이 끓어 넘치려 한다 — 뚜껑을 덮친다
      when: "met.bruno or affinity.bruno > 0"
      check:
        type: 기민
        dc: 보통
        mods:
          - { when: "affinity.bruno >= 15", value: 2, label: 브루노의 버릇 }
      success:
        lines:
          - "옆에서 브루노의 솥이 부글부글 부풀어 오른다. 초록 거품이 가장자리를 넘으려 한다."
          - 브루노@당황: "어, 어어, 또? 왜 또!"
          - "몸을 날려 솥뚜껑을 눌렀다. 쉬이익. 초록색 김이 뚜껑 틈으로 빠져나간다."
          - "손바닥이 뜨거웠지만 놓지 않았다. 열을 셀 때까지."
          - 브루노@웃음: "살았다! 너 방금 기사 같았어, 기사!"
          - 비스톨: "기사는 솥뚜껑을 안 든다. …잘했다."
          - "비스톨이 내 손바닥을 힐끗 보더니, 자기 연고를 말없이 책상 위로 굴려 주고 갔다."
          - 속마음: "(잘했다. 이 사람 입에서 나온 세 글자. 솥뚜껑 하나로 받을 줄은 몰랐다.)"
        effects: ["affinity.bruno += 3", "affinity.bistol += 2"]
      fail:
        lines:
          - "옆에서 브루노의 솥이 부글부글 부풀어 오른다."
          - 브루노@당황: "어, 어어, 또? 왜 또!"
          - "뚜껑을 향해 몸을 날렸다. 한 박자 늦었다."
          - "펑. 천장에 초록색 얼룩이 생겼다. 별 모양으로."
          - "비스톨이 천장을 올려다보고, 길고 깊은 한숨을 쉬었다."
          - 비스톨: "둘 다 수업 끝나고 남아서 천장 닦아."
          - 브루노: "(속닥) …미안. 저녁은 내가 살게."
          - "그날 저녁, 사다리 위에서 천장을 닦는 내내 브루노는 노래를 불렀다. 음정은 엉망이었다."
        effects: ["affinity.bruno += 2", "fatigue += 10"]
      fumble:
        lines:
          - "천장을 닦는 동안, 비스톨이 몇 번이나 사다리 밑을 지나갔다."
          - "셔츠 앞섶에 커다란 커피 얼룩을 단 채로."
          - "펑 하던 순간, 튕겨 나간 솥뚜껑이 그의 커피 잔을 정통으로 맞혔던 것이다."
          - 비스톨: "…………."
          - 비스톨: "천장 다 닦으면 바닥도 닦아. 그리고 내일 아침에 커피 한 잔."
          - 속마음: "(원작 위키 비스톨 항목. '수업 중 커피를 건드리면 호감도 대폭 하락.' …다행히 숫자는 안 보인다.)"
        effects: ["stress += 5", "fatigue += 5"]
    - text: 연고를 혀끝으로 맛봐서 배합을 맞춘다 (만독불침)
      when: "talent.만독불침"
      lines:
        - 속마음: "(규칙 둘. 재료를 맛보지 마라. 죽는다. …나만 빼고.)"
        - "새끼손가락으로 연고를 찍어 혀끝에 댔다."
        - "쓰다. 서리풀의 떫은맛, 쑥의 풋내. 그리고 밀랍이 덜 녹은 텁텁함."
        - 학생 A@놀람: "(속닥) 야, 쟤 방금 먹었어…!"
      check:
        type: 손재주
        dc: 쉬움
      success:
        lines:
          - "밀랍을 다시 데우고, 쑥 즙을 반 숟갈 덜었다. 혀가 시키는 대로."
          - "두 번째 맛은 깔끔했다. 박하처럼 시원한 뒷맛."
          - "비스톨이 어느새 등 뒤에 서 있었다. 얼굴이 하얗게 질려 있다."
          - 비스톨: "……뱉어. 지금 당장."
          - 나: "괜찮아요. 독이 잘 안 들어요, 제 몸."
          - "비스톨이 내 눈동자와 혀를 차례로 들여다보더니, 길게 숨을 내쉬었다."
          - 비스톨: "…만독불침인가. 연금술사들이 평생 부러워하는 체질이지."
          - 비스톨@진지: "그래도 다신 내 수업에서 맛보지 마라. 다른 놈들이 따라 한다."
          - "그가 돌아서다 멈췄다. 그리고 아주 작게 물었다."
          - 비스톨: "…몇 점이었나. 맛은."
        effects: ["affinity.bistol += 4", "stat.지성 += 0.5", "fatigue -= 10"]
      fail:
        lines:
          - "혀가 쓴맛에 마비된 것 같다. 뭐가 넘치고 뭐가 모자란지 모르겠다."
          - "감으로 쑥 즙을 더 넣었다. 더 썼다."
          - 비스톨: "……뱉어. 지금 당장."
          - "비스톨이 물 컵을 내 입에 들이밀었다. 처음 보는 빠르기였다."
          - 나: "괜, 괜찮아요. 독이 잘 안 들어요, 제 몸."
          - 비스톨: "독이 안 드는 혀는 맛도 둔하다. 그걸 몰랐나."
          - 비스톨@진지: "다신 내 수업에서 맛보지 마라. …연고는 저울로 만드는 거다."
          - 속마음: "(만독불침은 해독 능력이지 미식 능력이 아니었다. 패치노트에 적어 둬야겠다.)"
        effects: ["affinity.bistol += 2", "stat.지성 += 0.5"]

# ================================================================ 수업 — 6월

- id: cls_history_2
  title: 세계사 — 세 자루의 붓
  art: classroom
  on: auto
  free: true
  window: "1.6.2"
  lines:
    - "6월. 장마가 시작되려는지 하늘이 낮게 내려앉았다."
    - "교실 창문에 빗방울이 하나둘 부딪힌다. 습기 때문에 교과서 종이가 눅눅하게 손에 붙는다."
    - "세계사 강사의 봄 감기는 여름이 다 되도록 낫지 않았다. 사서 노인의 대강도 벌써 두 달째다."
    - 학생 A: "(속닥) 그 강사, 사실 그만둔 거 아냐?"
    - 학생 B@웃음: "(속닥) 난 할아버지 수업이 더 좋아. 시험엔 안 나오지만."
    - "지팡이 소리. 노인이 창가 의자에 앉았다. 이제는 아무도 그 의자에 앉지 않는다."
    - 사서: "오늘은 제국사. 아스테라 황가는 지난 삼백 년 동안 황위를 세 번 피로 넘겼지."
    - "교실 공기가 묘하게 굳었다. 창가 자리의 카이든이 펜을 내려놓는다."
    - 사서: "첫 번째는 형이 아우를. 두 번째는 숙부가 조카를."
    - 사서: "세 번째는… 기록마다 이름이 다르네. 그래서 재미있지."
    - 사서: "황자가 셋이면 역사가들은 붓을 셋 준비한다네. 누가 이길지 모르니까."
    - 사서: "이긴 쪽 붓만 남고, 나머지 둘은 불쏘시개가 되지."
    - 학생들: "(속닥) 3황자 앞에서 저런 얘길…"
    - "몇몇이 카이든의 뒤통수를 흘끔거렸다. 카이든은 미동도 없다. 창밖 빗줄기만 보고 있다."
    - 속마음: "(6년차 겨울, 황제 암살. 원작 커뮤니티엔 진범 논쟁 스레드가 몇백 개 올라왔다.)"
    - 속마음: "(2황자, 교회, 교단. 아무도 확신하지 못했지. 나도 댓글을 달았다. '3황자는 아님. 걔는 그냥 처형당하는 역'.)"
    - 속마음: "(…지금 생각하니 끔찍한 댓글이다.)"
    - "노인은 카이든 쪽을 보지 않았다. 일부러 안 보는 것 같았다."
    - "빗소리가 조금 굵어졌다. 누군가 창문을 닫으려다, 교실 분위기에 손을 멈췄다."
  choices:
    - text: 카이든을 본다
      effects: ["affinity.kaiden += 2", "know.kaiden_shoulder = 1"]
      lines:
        - "카이든 쪽으로 눈을 돌렸다."
        - "카이든은 표정 하나 바꾸지 않았다. 턱선이 돌처럼 굳어 있다."
        - "그런데 책상 아래, 왼손이 왼쪽 어깨를 꽉 감싸고 있다."
        - "손가락 마디가 하얗게 질릴 만큼."
        - 나레이션:
            - "긴장할 때 나오는 버릇일까."
            - { when: "fired.bond_kaiden_3", text: "큰형의 말에서 떨어뜨려졌다던 그 어깨다." }
        - when: "talent.직감"
          속마음: "(직감이 말한다. 저건 긴장해서 나오는 버릇이 아니다. 오래된 상처를 감싸는 손이다.)"
        - "종이 울리자 카이든은 손을 내리고, 아무 일도 없었다는 듯 교과서를 덮었다."
        - 속마음: "(대련할 때도 이 버릇이 나온다면… 아니. 지금 그런 계산부터 하는 내가 조금 싫다.)"
    - text: "\"세 자루 중에 맞는 붓은 어느 거였나요?\""
      effects: ["affinity.librarian += 3", "stat.지성 += 0.5"]
      lines:
        - "손을 들었다. 노인의 회색 눈이 안경 너머로 나를 향했다."
        - 나: "세 자루 중에 맞는 붓은 어느 거였나요?"
        - "교실이 조용해졌다. 빗소리만 들린다."
        - 사서: "늘 마지막까지 살아남은 쪽 붓이 맞았지. 역사란 그런 거네."
        - when: "talent.완전기억"
          속마음: "(머릿속에서 원작 연표가 펼쳐졌다. 황위 계승 세 번. 노인이 말한 순서와 한 칸도 다르지 않다.)"
        - 사서: "그래서 나는 붓보다 사람을 믿네. 붓은 끝까지 거짓말을 해도, 사람은 죽기 전에 한 번은 진실을 말하거든."
        - "노인이 카이든 쪽을 보지 않은 채 덧붙였다."
        - 사서: "…그러니 진실을 말할 사람을 죽게 두면 안 되는 게지."
        - "카이든의 펜이 아주 잠깐, 종이 위에서 멈췄다."
        - 속마음: "(진실을 말할 사람. 원작에서 끝내 입을 열지 못하고 죽은 사람이, 몇이었더라.)"
    - text: 수업이 끝나고 카이든에게 말을 건다
      when: "affinity.kaiden >= 10"
      lines:
        - 삽화: rain_courtyard
        - "종이 울리고 다들 빠져나간 복도. 카이든이 창가에 기대 비를 보고 있었다."
        - "다가가는 발소리에, 그가 고개도 돌리지 않고 말했다."
        - 카이든: "동정이라면 필요 없다."
        - 속마음: "(여기서 말을 잘못 고르면 문이 닫힌다. 원작에선 이 복도 장면 자체가 없었다.)"
      check:
        type: 설득
        dc: 보통
        mods:
          - { when: "trust.kaiden >= 5", value: 3, label: 카이든의 신뢰 }
          - { when: "fired.bond_kaiden_1", value: 2, label: 나눈 이야기 }
      success:
        lines:
          - 나: "동정 아니야. 그냥, 비가 와서."
          - "말이 안 되는 대답이었다. 카이든이 코로 짧게 숨을 내쉬었다."
          - 카이든@진지: "저 늙은이 말이 맞아. 붓은 이미 셋 준비돼 있다."
          - 카이든: "내 이름 옆엔 아마 '반역'이라고 적혀 있겠지. 형님들 붓에는."
          - when: "perk.고인물의기억 or perk.공략위키편집자"
            속마음: "(원작 그대로다. 카이든은 6년 뒤 내전 속에서 반역자 누명을 쓰고 처형된다.)"
          - 나: "그 붓, 다 쓰기 전에 꺾으면 되잖아."
          - "카이든이 처음으로 나를 똑바로 봤다. 그리고 아주 짧게, 코웃음 같은 웃음을 흘렸다."
          - 카이든@웃음: "…평민은 말이 쉽군. 그래도, 나쁘지 않은 소리다."
          - "그가 창틀에서 몸을 떼고 걸어갔다. 왼손은 이번엔 어깨가 아니라 검 손잡이에 얹혀 있었다."
        effects: ["trust.kaiden += 4", "affinity.kaiden += 3", "know.kaiden_palace = 1"]
      fail:
        lines:
          - 나: "아니, 동정이 아니라… 그러니까, 아까 수업에서……"
          - "말이 꼬였다. 무슨 말을 이어도 동정처럼 들릴 것 같았다."
          - 카이든: "비가 오면 너는 아무한테나 말을 거나."
          - 카이든: "됐다. 늙은이 이야기는 늙은이 이야기일 뿐이다."
          - "그가 창틀에서 몸을 떼고 걸어갔다. 왼손이 다시 왼쪽 어깨를 감싸고 있었다."
          - "몇 걸음 가다 말고, 그가 고개만 반쯤 돌렸다."
          - 카이든: "…우산은 있나. 없으면 뛰어라. 감기는 검을 무디게 한다."
          - 속마음: "(문은 열리지 않았다. 그래도 문고리를 한 번 돌려 본 소리는 났다.)"
        effects: ["affinity.kaiden += 1"]
      great:
        lines:
          - "복도 끝에서 그가 멈춰 섰다. 돌아보지는 않았다."
          - 카이든: "…다음 대련 때, 내 왼쪽을 노려 봐라. 다들 피해서 무뎌졌다."
          - 속마음: "(자기 약점을 먼저 내밀었다. 황자식 신뢰의 표현이다. …받아도 되는 걸까.)"
        effects: ["trust.kaiden += 2", "know.kaiden_shoulder = 1"]

- id: cls_theology_2
  title: 신학 — 오만인가, 신앙인가
  art: chapel
  on: auto
  free: true
  window: "1.6.3"
  lines:
    - "신학 토론 수업. 장마가 한창이라 성당 옆 강의실 창문이 김으로 뿌옇다."
    - "누군가 우산을 털다 물방울이 튀었다. 젖은 양털 냄새, 촛농 냄새."
    - "시스터 루나가 칠판에 한 문장을 적었다. 분필 소리가 오늘따라 또박또박하다."
    - "── 구할 수 없는 사람을 구하려는 것은 신앙인가, 오만인가."
    - 시스터 루나@웃음: "정답은 없어요. 대신 오답은 있죠. '모르겠다'가 오답이에요."
    - 시스터 루나: "오늘은 모두 한 번씩 말해야 해요. 대답 안 하면 결석 처리할게요. 몸은 와 있어도요."
    - "학생들이 차례로 일어난다."
    - 학생 A: "시, 신앙입니다. 여신님은 아무도 포기하지 않으시니까요."
    - 학생 B: "신앙이요. …저도 그렇게 생각합니다."
    - "대부분 '신앙'이라고 대답했다. 성당 옆 강의실에서 할 수 있는 가장 안전한 대답이니까."
    - "시스터 루나는 한 명 한 명에게 고개를 끄덕여 주었다. 끄덕임의 깊이가 조금씩 달랐다."
    - when: "origin != '악역도련님' and (fate.edric == 'saved' or fate.edric == 'saved_by_teacher')"
      에드릭: "…오만이든 뭐든, 구해진 쪽은 고맙지. 그걸로 된 거 아냐?"
    - when: "origin != '악역도련님' and (fate.edric == 'saved' or fate.edric == 'saved_by_teacher')"
      나레이션: "강의실이 술렁였다. 벨모어가 도련님이 고맙다는 말을 했다."
    - when: "origin != '악역도련님' and (fate.edric == 'saved' or fate.edric == 'saved_by_teacher')"
      나레이션: "에드릭은 귀까지 빨개진 얼굴로 털썩 앉더니, 팔짱을 끼고 창밖만 봤다."
    - when: "fate.edric == 'dead'"
      나레이션: "누군가 미궁에서 죽은 벨모어가 도련님 이야기를 꺼냈다가, 시스터 루나의 시선에 입을 다물었다."
    - when: "fate.edric == 'dead'"
      속마음: "(원작대로 죽은 사람이 있다. 그래서 오늘 이 질문이 목에 걸린다.)"
    - when: "origin == '악역도련님'"
      나레이션: "몇몇이 힐끔 나를 본다. 미궁에서 살아 나온 벨모어가 도련님이 뭐라고 할지 궁금한 얼굴로."
    - when: "origin == '악역도련님'"
      속마음: "(구할 수 없는 사람. 원작대로라면, 그게 나였다.)"
    - "내 차례가 왔다."
    - "의자를 밀고 일어섰다. 오래 앉아 있던 다리가 조금 저렸다."
    - 속마음: "(이건… 지금 내가 하는 일 그 자체다.)"
    - 속마음: "(37개 엔딩 전부에서 누군가는 죽었다. 그걸 다 구하겠다는 건, 신앙일까 오만일까.)"
    - 속마음: "(3,000시간. 서른일곱 번. 서른일곱 번 다, 누군가를 못 구했다.)"
    - "시스터 루나가 기다린다. 웃는 얼굴로, 아주 조용히."
  choices:
    - text: "\"오만이에요. 그래도 할 거예요\""
      effects: ["affinity.luna += 6", "stat.의지 += 1"]
      lines:
        - 나: "오만이에요."
        - "강의실이 다시 술렁였다. 이 교실에서 그 단어를 처음 들은 얼굴들이었다."
        - when: "talent.겁쟁이"
          나레이션: "무릎이 떨렸다. 책상 모서리를 붙잡았다. 그래도 말은 멈추지 않았다."
        - 나: "…그래도 할 거예요."
        - "시스터 루나의 눈썹이 아주 조금 올라갔다."
        - 시스터 루나@웃음: "좋네요. 자기가 오만한 줄 아는 사람은 적어도 남 탓은 안 하거든요."
        - 시스터 루나: "오만한 사람이 제일 무서울 때는, 자기가 신앙인 줄 알 때예요."
        - 시스터 루나@진지: "그 대답, 졸업할 때까지 바꾸지 말아요."
        - "자리에 앉았다. 가슴이 이상하게 가벼웠다."
        - 속마음: "(오만이다. 맞다. 세계를 통째로 고쳐 쓰겠다는 엑스트라가, 오만이 아니면 뭐겠어.)"
    - text: "\"신앙이에요. 저는 아직 아무도 포기하지 않았으니까요\""
      effects: ["affinity.luna += 4", "stress -= 5"]
      lines:
        - 나: "신앙이에요."
        - "몇몇이 고개를 끄덕였다. 또 하나의 안전한 대답."
        - 나: "…저는 아직 아무도 포기하지 않았으니까요."
        - "뒤에 붙은 말에, 끄덕이던 고개들이 멈췄다."
        - when: "talent.성흔"
          나레이션: "손등이 따뜻해졌다. 시스터 루나의 눈길이 아주 잠깐, 내 손에 닿았다가 떨어졌다."
        - 시스터 루나: "포기하지 않는 걸 신앙이라고 부르는 사람, 오랜만에 보네요."
        - 시스터 루나@웃음: "교회에선 그걸 고집이라고 불러요. 저는 신앙 쪽이 더 마음에 들지만요."
        - "그녀가 분필로 칠판 구석에 작게 무언가를 적었다. ── 아직."
        - 속마음: "(아직. 그래, 아직이다. 10년이 다 지나기 전까지는.)"
    - text: "\"구할 수 없는 사람인지는 해 봐야 알죠\""
      requires: "stat.지성 >= 16 or stat.의지 >= 16"
      lines:
        - 나: "구할 수 없는 사람인지는, 해 봐야 알죠."
        - "정적. 시스터 루나가 분필을 내려놓았다."
        - 시스터 루나@놀람: "…아. 문제의 전제를 걷어차네요."
        - 학생 A@당황: "(속닥) 저래도 돼…?"
      check:
        type: 설득
        dc: 보통
        mods:
          - { when: "affinity.luna >= 20", value: 2, label: 루나의 관심 }
          - { when: "stress >= 60", value: -2, label: 긴장 }
      success:
        lines:
          - 나: "구할 수 없다는 건 끝난 뒤에야 알 수 있잖아요. 시작도 전에 정해 두는 쪽이 더 오만하죠."
          - 시스터 루나@웃음: "반칙인 거 알죠? 반칙도 점수는 줘요. 오늘만."
          - 시스터 루나: "그런데 학생. 해 봤는데 못 구하면, 그땐 뭐라고 대답할 거예요?"
          - "대답하지 못했다. 그녀도 대답을 기다리지 않았다."
          - 속마음: "(원작은 그걸 서른일곱 번 보여 줬다. 그래도, 서른여덟 번째는 아직 안 봤다.)"
        effects: ["affinity.luna += 5", "stat.지성 += 0.5"]
      fail:
        lines:
          - 시스터 루나@웃음: "그럼 반대로 물을게요. 해 보기 전엔 모르니까, 아무도 포기하면 안 되나요?"
          - 시스터 루나: "열 명이 물에 빠졌는데 손이 두 개뿐이에요. 그래도요?"
          - 나: "그, 그건……"
          - "말문이 막혔다. 전제를 걷어찼더니, 더 큰 전제가 날아왔다."
          - "강의실 여기저기서 작게 웃음이 터졌다."
          - 시스터 루나: "괜찮아요. 막힌 대답이 제일 정직해요. 다음 시간까지 손 두 개로 생각해 와요."
          - 속마음: "(손이 두 개뿐이다. 원작의 나는 세이브 슬롯이 스무 개였다. 지금은 하나다.)"
        effects: ["affinity.luna += 3", "stress += 5"]
    - text: 세라의 대답을 기다린다
      when: "fate.sera == 'saved' or fate.sera == 'saved_quiet'"
      effects: ["affinity.sera += 5", "affinity.luna += 3"]
      lines:
        - "일어서려다, 앞줄을 봤다. 세라가 무릎 위에서 손을 꼭 쥐고 있었다."
        - "시스터 루나가 내 눈길을 따라가더니, 작게 고개를 끄덕였다. 순서를 바꿔 주겠다는 듯이."
        - "세라가 일어섰다. 손끝이 떨린다. 손등은 소매로 덮은 채로."
        - 세라: "저는… 구해진 적이 있어서, 잘 몰라요."
        - 세라: "그때 그 사람이 오만했대도, 저는 고마울 것 같아요. 그래서… 오만해도 괜찮다고 생각해요."
        - "강의실이 조용했다. 아무도 속닥이지 않았다."
        - when: "fate.sera == 'saved'"
          나레이션: "자리에 앉으며 세라가 아주 잠깐 내 쪽을 봤다."
        - 시스터 루나: "……오늘 수업은 여기까지 해도 되겠네요."
        - "그녀가 출석부를 덮었다. 웃음 대신, 아주 부드러운 얼굴로."
        - "종이 울리려면 아직 십오 분이나 남아 있었다."
        - 속마음: "(내 차례는 오지 않았다. 내 대답은, 세라가 대신 해 준 것 같았다.)"
    - text: "\"구원받을 수 없다고 정해진 쪽에서 보면요\" (마왕의 흔적)"
      when: "talent.마왕의흔적"
      lines:
        - "일어서는 순간, 가슴 한가운데가 욱신했다."
        - "성당 옆 강의실. 벽 하나 너머가 성수반이다. 이 몸에 박힌 것이 그걸 안다."
        - 속마음: "(마왕의 흔적. 원작에선 교회 루트를 닫아 버리는 디버프였다. 숨 쉬는 것도 아프다.)"
        - 속마음: "(그래도 이 질문엔, 이 몸이라서 할 수 있는 대답이 있다.)"
      check:
        type: 정신력
        dc: 보통
        mods:
          - { when: "luna.covered", value: 2, label: 루나의 배려 }
          - { when: "stress >= 60", value: -3, label: 스트레스 }
      success:
        lines:
          - 나: "구원받을 수 없다고 정해진 쪽에서 보면요."
          - 나: "누가 손을 내밀어 주는 게, 오만이든 신앙이든 상관없을 것 같아요."
          - 나: "그냥… 손이 보인다는 게 중요하겠죠."
          - "목소리가 떨리지 않았다. 가슴의 욱신거림을 끝까지 눌러 담았다."
          - "강의실이 조용했다. 아무도 속닥이지 않았다."
          - "시스터 루나의 웃음이 아주 잠깐 사라졌다. 그리고 다시, 아주 천천히 돌아왔다."
          - 시스터 루나: "…'정해진 쪽'이라. 꼭 그쪽 사람처럼 말하네요."
          - 시스터 루나@웃음: "좋은 대답이에요. 교회 사람들 앞에서는 하지 말고요."
          - 속마음: "(눈치챈 걸까. 웃는 얼굴로는 알 수가 없다. 그래도 저 사람은 방금, 손을 내밀었다.)"
        effects: ["affinity.luna += 7", "stat.의지 += 1"]
      fail:
        lines:
          - 나: "구원받을 수 없다고, 정해진 쪽에서… 보면……"
          - "가슴이 쿡 찔렸다. 숨이 반쯤에서 끊겼다."
          - "책상 모서리를 짚었다. 이마에 식은땀이 맺혔다."
          - 시스터 루나: "학생, 얼굴이 하얘요. 앉아요."
          - "그녀가 창문을 열었다. 축축한 장마 바람이 들어오자 조금 살 것 같았다."
          - 시스터 루나: "대답은 다음에 들을게요. 하다 만 대답이 제일 궁금하거든요."
          - "수업이 끝나고 나갈 때, 그녀가 문 앞에서 박하사탕 하나를 내 손에 쥐여 주었다."
          - 속마음: "(성당 벽 하나가 이렇게 무겁다. 10년 동안, 이 몸으로 저 문을 몇 번이나 지나가야 할까.)"
        effects: ["affinity.luna += 4", "stress += 5"]

# ================================================================ 수업 — 7월

- id: cls_sword_2
  title: 검술 — 지는 법
  art: training_ground
  on: auto
  free: true
  window: "1.7.1"
  slots: [밤, 주말]
  lines:
    - "무투대회 신청이 마감된 뒤. 정규 수업도 아닌 시간에, 가렌 교관이 1학년 전원을 연무장에 불러 모았다."
    - "7월의 연무장은 하루 내내 데워진 흙냄새로 후끈하다. 담장 너머에서 풀벌레 소리가 끊이지 않는다."
    - 학생 A: "(속닥) 대회 안 나가는 애들까지 왜…?"
    - 가렌: "대회에 나가는 놈도, 안 나가는 놈도 들어라."
    - 가렌: "오늘은 이기는 법이 아니라 지는 법을 가르친다."
    - 학생들@놀람: "지는 법…?"
    - 가렌: "제대로 지는 놈은 다음에 다시 싸운다. 엉망으로 지는 놈은 다음이 없다."
    - "웃는 사람은 없었다. 미궁을 다녀온 뒤로, 다들 '다음이 없다'는 말이 어떤 뜻인지 조금은 안다."
    - "두 시간 동안 넘어지고, 굴렀다."
    - "목검을 놓치는 법. 손목이 꺾이기 전에 놓아야 한다."
    - "무릎을 꿇는 법. 무릎은 꿇어도 눈은 상대에게서 떼지 않는다."
    - "그리고 일어나는 법. 손을 짚지 말고, 굴러서, 발부터."
    - when: "fired.bond_garen_1"
      속마음: "(새벽 수련 때 배운 것과 같다. 맞는 법, 넘어지는 법, 다시 일어나는 법.)"
    - "땀이 눈에 들어가 따갑다. 온몸에 흙이 덕지덕지 붙었다."
    - "마지막에 가렌이 1학년들을 한 줄로 세우고, 목검 끝으로 한 명씩 가리켰다."
    - 가렌: "카이든. 넌 질 줄을 모른다. 그게 네 약점이다."
    - 카이든: "……"
    - "카이든의 턱에 힘이 들어가는 게 보였다. 대꾸하지 않았다. 대꾸할 수 없는 말이었으니까."
    - 가렌: "아렌. 넌 검이 대신 이겨 줄 거라 믿는다. 그것도 약점이다."
    - 아렌@당황: "……네."
    - "목검 끝이 옆으로 움직였다. 그리고 내 코앞에서 멈췄다."
    - 가렌: "그리고 너."
    - 속마음: "(원작 가렌은 약점 분석 대사를 주인공에게만 했다. 엑스트라에겐 목검 끝도 오지 않았다.)"
  choices:
    - text: "\"제 약점은 뭔가요\""
      effects: ["affinity.garen += 4", "stat.의지 += 0.5"]
      lines:
        - 나: "…제 약점은 뭔가요?"
        - "가렌이 나를 오래 봤다. 목검 끝은 내려가지 않았다."
      branch:
        - when: "talent.겁쟁이"
          lines:
            - 가렌: "무서워한다."
            - "연무장이 조용해졌다. 얼굴이 화끈거렸다. 다들 들었다."
            - 가렌: "…무서워하는 건 약점이 아니다. 무서워서 멈추는 게 약점이지. 넌 아직 안 멈췄다."
            - 가렌@진지: "오늘 열네 번 넘어졌고, 열네 번 일어났다."
            - "세고 있었던 거다. 내가 넘어진 횟수를."
            - 속마음: "(겁쟁이. 캐릭터 생성 때 포인트 받으려고 고른 재능이었다. …그때는 이런 기분일 줄 몰랐지.)"
        - when: "talent.무통증"
          lines:
            - 가렌: "아파하지 않는다."
            - 가렌: "오늘 손목이 두 번 꺾였다. 넌 두 번 다 그냥 일어났다."
            - "손목을 내려다봤다. 퉁퉁 부어 있었다. 몰랐다."
            - 가렌@진지: "아픔은 그만하라는 신호다. 신호를 못 듣는 놈은, 멈춰야 할 때를 모른다."
            - 속마음: "(무통증. '고통 페널티 무시'라는 좋은 재능이었다.)"
            - 속마음: "(그 밑에 '숨은 부상을 자각하지 못함'이라는 한 줄이 더 있었지. 그 줄은 읽지 않았다.)"
        - when: "stat.근력 >= stat.지성 + 10"
          lines:
            - 가렌: "힘을 믿는다."
            - 가렌: "힘은 배신한다. 반드시, 가장 필요할 때."
            - "그가 목검으로 내 손목을 툭 쳤다. 꽉 쥐고 있던 손이 저절로 풀렸다."
            - 가렌: "봐라. 힘이 아니라 손목 하나에 졌다."
            - 속마음: "(근력 몰빵 빌드의 숙명. 원작에서도 후반 보스한테 딱 저렇게 털렸다.)"
        - when: "stat.지성 >= stat.근력 + 10"
          lines:
            - 가렌: "생각이 많다."
            - 가렌: "칼끝이 머리보다 빨라야 할 때가 온다."
            - "말이 끝나기도 전에 목검이 내 어깨를 툭 건드렸다. 막아야겠다고 생각하는 사이에, 이미."
            - 가렌: "지금처럼."
            - 속마음: "(공략을 아는 머리. 그 머리가 몸보다 늦을 때, 나는 뭘 할 수 있을까.)"
        - lines:
            - 가렌: "…아직 모르겠군."
            - "가렌이 미간을 좁혔다. 처음 보는 얼굴이다. 곤란한 얼굴."
            - 가렌: "그게 제일 위험하다. 자기 약점을 모르는 놈보다, 약점이 안 보이는 놈이."
            - 가렌: "약점이 안 보이는 놈은, 대개 뭔가를 숨기는 놈이다."
            - 속마음: "(숨기고 있다. 맞다. 이 세계가 10년 뒤에 끝난다는 걸, 나 혼자 알고 있으니까.)"
    - text: 낙법 시범을 자청한다
      check:
        type: 기민
        dc: 보통
        mods:
          - { when: "fired.bond_garen_1", value: 3, label: 새벽 수련 }
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      success:
        lines:
          - 나: "제가 해 보겠습니다."
          - "가렌이 대답 대신 목검을 낮게 휘둘렀다. 예고도 없이."
          - "가렌의 목검에 다리가 걸리는 순간, 몸을 말아 굴렀다."
          - "어깨, 등, 허리 순서로. 흙먼지 속에서 바로 일어섰다. 목검도 놓치지 않았다."
          - 가렌: "…그거다. 다들 봤나."
          - 학생들@놀람: "오오…"
          - 속마음: "(두 시간 동안 백 번은 넘어졌다. 머리보다 몸이 먼저 기억했다.)"
        effects: ["affinity.garen += 5", "reputation += 2", "stat.체질 += 0.5"]
      fail:
        lines:
          - 나: "제가 해 보겠습니다."
          - "가렌의 목검이 다리를 걸었다. 몸을 말아야 하는데── 생각이 먼저 나갔다."
          - "등부터 떨어졌다. 숨이 턱 막힌다."
          - 가렌: "그게 엉망으로 지는 거다. 다들 봤나."
          - "웃음소리가 터졌다. 하늘이 빙글빙글 돌았다."
          - "그런데 가렌이 손을 내밀어 나를 일으켜 세웠다. 처음 있는 일이다."
          - "거칠고 큰 손이었다. 손바닥에 굳은살이 단단하게 박혀 있었다."
          - 가렌: "…다음엔 이렇게 지지 마라."
        effects: ["affinity.garen += 3", "stress += 5"]
      great:
        lines:
          - "가렌이 목검을 한 번 더, 이번엔 어깨 높이로 휘둘렀다. 예고 없이."
          - "몸이 먼저 뒤로 굴렀다. 흙먼지 속에서 무릎을 세웠을 때, 목검 끝은 가렌을 향해 있었다."
          - 가렌: "……두 번."
          - 가렌: "다음 주 대회. 지는 법을 아는 놈은 쉽게 안 진다."
          - 속마음: "(가렌이 같은 말을 두 번 했다. 단어 수로 따지면 오늘 하루 할당량을 다 쓴 셈이다.)"
        effects: ["affinity.garen += 2", "stat.민첩 += 0.5"]
    - text: 카이든에게 다가간다
      when: "affinity.kaiden >= 10"
      effects: ["affinity.kaiden += 3", "trust.kaiden += 3"]
      lines:
        - "해산 뒤. 카이든이 연무장 구석에서 혼자 목검을 닦고 있었다. 이미 깨끗한 목검을."
        - 카이든@화남: "위로할 생각이면 관둬라."
        - 나: "위로 안 해. 그냥 같이 닦으려고."
        - "카이든이 한참 말이 없었다. 풀벌레 소리만 들렸다."
        - 카이든: "…질 수 없는 사람도 있다. 황궁에선 한 번 지면 끝이니까."
        - when: "origin == '악역도련님'"
          카이든: "…벨모어가에서도 그렇게 가르치지 않았나."
        - 나: "여긴 황궁이 아니잖아."
        - "카이든이 대답 대신 목검을 들어 올렸다."
        - "그리고, 일부러 한 번 넘어졌다. 어색하게. 무릎부터 땅에 닿는, 엉망인 낙법으로."
        - 카이든@당황: "……이렇게 하는 건가."
        - 나: "응. 엉망이야."
        - "카이든이 흙바닥에 앉은 채로 나를 노려봤다. 그런데 입꼬리가, 아주 조금 움직였다."
        - 속마음: "(원작의 카이든은 처형대 앞에서도 무릎을 꿇지 않았다. 오늘 처음으로, 스스로 흙바닥에 무릎을 꿇었다.)"
    - text: 넘어진 채로 숨부터 고른다 (병약)
      when: "talent.병약"
      lines:
        - "가렌의 목검 끝을 보면서, 일어서는 대신 흙바닥에 등을 붙였다."
        - "숨이 가쁘다. 두 시간 동안 이 몸은 이미 바닥까지 갔다."
        - 속마음: "(병약. 원작에선 '가끔 앓아누움'이라는 한 줄짜리 디버프였다.)"
        - 속마음: "(앓아누운 횟수만큼, 다시 일어나는 법도 배웠다. 이 몸은 그걸 기억한다.)"
        - "넷을 세며 들이쉬고, 넷을 세며 내쉬었다. 그리고 굴러서, 발부터."
      check:
        type: 정신력
        dc: 보통
        mods:
          - { when: "fired.bond_luna_1", value: 2, label: 숨 쉬는 기도 }
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      success:
        lines:
          - "무릎이 떨렸다. 그래도 섰다. 목검 끝은 가렌을 향해 있었다."
          - 가렌: "……"
          - "가렌이 목검을 내렸다. 연무장이 조용해졌다."
          - 가렌: "넌 이미 아는군. 지는 법을."
          - 가렌@진지: "숨이 먼저다. 칼은 그다음이다. 다들 저걸 봐라."
          - 학생들@놀람: "……"
          - 속마음: "(몸이 약해서 먼저 배운 것. 그게 처음으로 쓸모가 있었다.)"
        effects: ["affinity.garen += 6", "stat.의지 += 1"]
      fail:
        lines:
          - "일어서려는데 눈앞이 하얘졌다. 귀에서 물소리가 났다."
          - "정신을 차리니 연무장 그늘이었다. 이마에 젖은 수건이 얹혀 있다."
          - "옆에 가렌이 쪼그려 앉아 물통을 내밀고 있었다."
          - 가렌: "멈춘 건 잘했다. 다만 늦었다."
          - 가렌: "네 몸은 신호를 남들보다 일찍 보낸다. 그걸 듣는 것도 지는 법이다."
          - 속마음: "(업혀 왔다고 했다. 가렌한테. …다음 주 대회 전까지 이 이야기가 퍼지지 않기를.)"
        effects: ["affinity.garen += 4", "fatigue += 10"]

- id: cls_magic_2
  title: 마법학 — 학기 마지막 실습
  art: magic_lab
  on: auto
  free: true
  window: "1.7.4"
  lines:
    - "1학기 마지막 마법학 수업. 창밖은 벌써 여름이다."
    - "매미 소리가 열린 창으로 쏟아져 들어온다. 실습실 바닥에 햇빛이 네모나게 떨어져 있다."
    - "다들 들떠 있다. 다음 주면 방학이다. 누군가는 고향 이야기를, 누군가는 바다 이야기를 한다."
    - 엘베라@웃음: "자, 자. 마음은 벌써 방학이겠지만 몸은 아직 여기 있어요."
    - 엘베라: "오늘은 둘씩 짝을 지어요. 한 명은 결계를 치고, 한 명은 그걸 깨요."
    - 엘베라: "깨는 쪽은 상대를 다치게 하지 않을 만큼만. 치는 쪽은 상대를 믿을 만큼만."
    - 엘베라: "둘 다 생각보다 어려워요."
    - 학생 A: "(속닥) 믿을 만큼만이 뭐야…"
    - 엘베라: "결계는 마음이 흔들리면 같이 흔들려요. 깨는 사람이 무서우면, 결계가 먼저 금이 가죠."
    - "엘베라가 시범을 보였다. 조교가 땀을 흘리며 친 결계를, 손가락 하나로 톡 건드렸다."
    - "결계가 소리도 없이 사라졌다. 비눗방울이 터지듯이."
    - 엘베라@웃음: "이건 따라 하지 마요. 조교님이 매번 울거든요."
    - 조교@슬픔: "…안 울었습니다."
    - "실습실 여기저기서 반짝이는 막이 생겼다가 깨지는 소리가 이어진다. 유리 풍경 소리 같다."
    - 속마음: "(원작에선 엔딩 크레딧 직전에 '학기가 끝났다' 한 줄로 넘어가던 날이다.)"
    - 속마음: "(한 줄짜리 날에도 매미가 울고, 햇빛이 들고, 누군가는 방학 계획을 짜고 있었구나.)"
    - 속마음: "(1학기가 끝난다. 멸망까지 남은 시간이 줄어드는 게, 처음으로 실감 난다.)"
    - "짝을 찾아 고개를 돌렸다."
  choices:
    - text: 미라벨과 짝을 한다 (내가 결계를 친다)
      when: "affinity.mirabel >= 5 or rival.mirabel"
      lines:
        - "미라벨이 이미 지팡이를 들고 내 앞에 서 있었다. 고르는 얼굴이 아니라, 이미 고른 얼굴로."
        - 미라벨: "내가 깨는 쪽이네. 버텨 봐. 3초면 충분하겠지만."
        - "숨을 고르고 결계를 펼쳤다. 손끝에서 얇은 막이 부채꼴로 퍼진다."
      check:
        type: 마법
        dc: 보통
        mods:
          - { when: "skill.방벽", value: 6, label: 방벽 }
          - { when: "stress >= 60", value: -3, label: 흔들리는 마음 }
      success:
        lines:
          - "첫 번째 영창. 결계가 출렁였다. 버텼다."
          - "두 번째 영창. 금이 갈 것 같았다. 버텼다."
          - "미라벨의 세 번째 영창이 결계 표면에서 물보라처럼 흩어졌다."
          - "미라벨이 지팡이를 내렸다. 숨이 조금 가빠 보였다."
          - 미라벨@당황: "…3초라고 한 건 취소할게."
          - 미라벨: "2학기엔 30초 안에 깨 줄 거야. 각오해."
          - 엘베라@웃음: "어머. 30초라니, 미라벨 학생 입에서 나온 숫자 중에 제일 크네요."
          - 미라벨@화남: "교, 교수님!"
        effects: ["affinity.mirabel += 5", "trust.mirabel += 3", "affinity.elvera += 3"]
      fail:
        lines:
          - "첫 번째 영창에 결계가 출렁였다. 두 번째에 금이 갔다."
          - "결계가 유리처럼 깨졌다. 반짝이는 조각이 바닥에 닿기도 전에 사라진다."
          - "미라벨이 다가와 손끝으로 내 이마를 툭 쳤다."
          - 미라벨: "2.8초. 과대평가했네."
          - "돌아서려던 미라벨이 멈췄다. 고개는 안 돌리고."
          - 미라벨: "…방학 동안 연습해 와. 2학기에도 3초 못 버티면 재미없으니까."
          - 속마음: "(재미없다는 건, 2학기에도 상대해 주겠다는 뜻이다. 미라벨어 번역.)"
        effects: ["affinity.mirabel += 2"]
      great:
        lines:
          - "엘베라가 다가와 결계 표면을 손끝으로 쓸어 봤다. 금 하나 없었다."
          - 엘베라: "깨는 사람을 믿고 친 결계네요. 그래서 안 깨진 거예요."
          - 미라벨@당황: "미, 믿긴 누가 누굴 믿어요!"
          - 속마음: "(미라벨의 귀가 또 빨갛다. 이번 학기 들어 몇 번째더라.)"
        effects: ["stat.마력제어 += 0.5", "affinity.mirabel += 1"]
    - text: 리아나와 짝을 한다 (리아나가 결계를 친다)
      when: "affinity.liana >= 10"
      lines:
        - "리아나가 쭈뼛쭈뼛 다가왔다. 손에 든 지팡이가 나뭇가지처럼 생겼다. 실제로 나뭇가지다."
        - 리아나: "나 결계 진짜 못하는데… 살살 깨 줘?"
        - "리아나의 결계는 얇은 잎사귀 같았다. 그런데 이상하게 단단하다. 숲 냄새가 난다."
      check:
        type: 마법
        dc: 쉬움
        mods:
          - { when: "affinity.liana >= 25", value: 2, label: 리아나의 믿음 }
      success:
        lines:
          - "부수지 않기로 했다. 손끝을 결계에 대고, 숨처럼 아주 약하게 마력을 밀었다."
          - "결계에 손끝으로 작은 틈만 냈다."
          - "그 틈으로 바람이 들어가 리아나의 머리카락을 흔든다."
          - 리아나@웃음: "간지러워! 이게 깨는 거야?"
          - "실습실의 다른 소리들이 잦아들었다. 다들 이쪽을 보고 있다."
          - 엘베라: "…이게 정답이에요. 다들 봐요. 부수는 게 아니라 여는 거예요."
          - 엘베라@웃음: "첫 학기에 이걸 해낸 짝은, 오백 년 동안 손에 꼽아요."
          - 리아나@웃음: "들었어? 손에 꼽는대! …우리 몇 번째 손가락이야?"
        effects: ["affinity.liana += 5", "affinity.elvera += 4", "stat.마력제어 += 0.5"]
      fail:
        lines:
          - "살살 하려고 했다. 정말로."
          - "힘 조절을 놓쳐 결계가 펑 터졌다. 리아나가 엉덩방아를 찧었다."
          - 나@당황: "리아나! 괜찮아?"
          - 리아나: "괜, 괜찮아! 진짜로."
          - "리아나는 웃으며 일어섰지만, 한 손이 잠깐 가슴께에 머물렀다."
          - "아주 잠깐. 숨 한 번 고를 만큼."
          - when: "note.note_liana.known"
            속마음: "(…조심해야 한다. 이 아이의 심장은 생각보다 약하다.)"
          - 리아나@웃음: "봐, 멀쩡해. 엉덩이만 좀 아파."
        effects: ["affinity.liana += 3"]
    - text: 엘베라 교수에게 짝을 청한다
      lines:
        - "짝 없이 남은 나를 보고, 엘베라가 손짓했다."
        - 나: "교수님, 혹시… 교수님 결계를 깨 봐도 될까요?"
        - "실습실이 술렁였다. 누군가 '미쳤다'고 속삭였다."
        - 엘베라@웃음: "저랑요? 좋아요. 마음껏 깨 봐요. 봐주진 않을 거지만요."
        - "엘베라가 손가락 하나를 들자, 공기가 소리 없이 굳었다. 얇은데, 끝이 보이지 않는 벽."
      check:
        type: 마법
        dc: 극한
        mods:
          - { when: "know.warm_flame", value: 3, label: 부탁하는 마력 }
      success:
        lines:
          - "있는 힘을 한 점에 모았다. 넓게가 아니라, 바늘 끝처럼."
          - "결계 표면에 머리카락 같은 금이 갔다."
          - "엘베라의 눈썹이 아주 조금 올라갔다."
          - 엘베라@놀람: "…금이 갔네요. 이 결계에 금이 간 건, 한 오십 년 만인가요."
          - 학생들@놀람: "……!"
          - 엘베라@웃음: "방학 숙제 없음. 학생만요."
          - 학생 A@당황: "에에─?!"
          - 속마음: "(오십 년 전에 금을 낸 사람은 누구였을까. …물어보면 안 될 것 같은 숫자였다.)"
        effects: ["affinity.elvera += 6", "stat.마력제어 += 1"]
      fail:
        lines:
          - "있는 힘을 다 쏟아부었다. 결계는 물결 하나 일지 않았다."
          - "손바닥이 저릿하다. 벽을 민 게 아니라, 하늘을 민 것 같았다."
          - 엘베라@웃음: "괜찮아요. 이걸 깨면 제가 곤란해져요."
          - 엘베라: "대신 학생 마력이 어디서 새는지는 잘 봤어요. 왼손 약지 쪽이에요."
          - 엘베라: "방학 동안 그쪽을 막아 봐요."
          - "왼손을 내려다봤다. 아무것도 안 보였다. 그런데 듣고 나니, 거기만 조금 시린 것 같았다."
          - 속마음: "(원작엔 이런 피드백이 없었다. 그냥 '실패'. 오백 년 산 교수의 눈은 숫자보다 정확하다.)"
        effects: ["affinity.elvera += 3", "stat.마력제어 += 0.5"]
      fumble:
        lines:
          - "그런데 손을 떼는 순간, 밀어 넣었던 마력이 고스란히 되돌아왔다."
          - "팔꿈치까지 찌릿했다. 코끝이 뜨끈해졌다. 손등에 붉은 게 떨어졌다."
          - 엘베라@놀람: "어머, 코피. 너무 세게 밀었네요."
          - "엘베라가 손수건을 건넸다. 연보랏빛 손수건에 들꽃이 수놓여 있었다."
          - 엘베라: "벽을 밀 땐 손을 떼는 법부터 배워야 해요. 그것도 방학 숙제예요."
        effects: ["fatigue += 10"]
    - text: 결계 대신 몸으로 받아 본다 (마나 회로 손상)
      when: "talent.마나회로손상"
      lines:
        - 나: "교수님. 저는 결계가 안 쳐져요. 대신… 몸으로 받아 봐도 될까요?"
        - "실습실이 술렁였다. 엘베라가 고개를 갸웃했다가, 천천히 웃었다."
        - 엘베라@웃음: "수정구 날 했던 말, 기억했네요. 밖으로 못 나오면 안에서 쓰라고."
        - 엘베라: "좋아요. 아주 약하게 쏠게요. 마력을 피부 바로 밑에 깔아요. 갑옷처럼."
        - 속마음: "(투기. 원작에선 회로 손상 빌드만 3학년에 해금되던 기술이다. 1학년 여름에 시도하는 건 처음이다.)"
      check:
        type: 인내
        dc: 보통
        mods:
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      success:
        lines:
          - "엘베라의 손끝에서 작은 빛 덩이가 날아왔다."
          - "가슴에 닿는 순간, 몸 안에서 무언가가 단단해졌다. 피부 밑으로 열이 번졌다."
          - "빛이 흩어졌다. 셔츠 한 올 그을리지 않았다."
          - "실습실 여기저기서 결계 깨지는 소리가 멈췄다."
          - 엘베라@놀람: "…첫 시도에. 어머."
          - 엘베라@웃음: "학생 건 몸이 결계네요. 마음이 흔들리면, 대신 이를 악물면 되겠어요."
          - 속마음: "(회로가 망가진 몸. 수정구는 반응도 안 했다. 그 몸이 지금, 마법을 막았다.)"
        effects: ["affinity.elvera += 5", "stat.체질 += 1"]
      fail:
        lines:
          - "빛 덩이가 가슴에 닿았다. 몸 안에서 열이 엉뚱한 데로 몰렸다."
          - "쿵. 엉덩방아를 찧었다. 셔츠 앞섶이 동그랗게 그을렸다."
          - "엘베라가 다가와 손을 내밀었다. 손가락이 차갑고 가벼웠다."
          - 엘베라: "방향은 맞아요. 열이 왼쪽으로 쏠렸어요. 가슴 한가운데로만 모으면 돼요."
          - 엘베라@웃음: "방학 숙제예요. 학생만요."
          - 속마음: "(그을린 셔츠는 버리지 않기로 했다. 첫 시도의 기념품이다.)"
        effects: ["affinity.elvera += 3", "stat.체질 += 0.5"]

# ================================================================ 교수 인연 — 비스톨

- id: bond_bistol_1
  title: 비스톨 — 식은 커피
  on: 도서관
  priority: 1
  slots: [밤]
  when: "met.bistol and affinity.bistol >= 5 and fired.cls_alchemy_2"
  lines:
    - "밤의 도서관. 폐관 종이 울리기 이십 분 전."
    - "열람실 등잔은 반쯤 꺼졌고, 남은 불빛이 책상마다 노란 웅덩이를 만들고 있다."
    - "창밖에서 벌레 소리가 들린다. 초여름 밤은 생각보다 시끄럽다."
    - "읽던 책을 덮자 눈이 뻑뻑했다. 목덜미가 뻣뻣하게 굳어 있다."
    - "미궁 실습이 끝난 뒤로 연금술 연구실 불이 꺼진 적이 없다는 소문이다. 상처약 주문이 밀려들었다고."
    - "가방을 챙겨 나가려는데, 구석 자리에서 무언가가 눈에 걸렸다."
    - "누군가 엎드려 자고 있다. 책 더미 사이로 헝클어진 검은 머리."
    - "비스톨 교수다. 안경이 이마 위로 밀려 올라가 있다."
    - 속마음: "(교수가 학생 열람실에서? 연구실은 놔두고.)"
    - "쌓인 책 등에는 연금술 기호가 박혀 있다. 『고급 조제학』, 『약재 보존법』, 제목이 닳아 읽을 수 없는 낡은 책 한 권."
    - "가까이 가 보니 숨소리가 고르지 않다. 꿈을 꾸는지 눈썹이 가끔 움찔거린다."
    - "팔꿈치 옆에는 식은 커피 잔. 표면에 얇은 막이 생겼다. 한 모금도 마시지 않은 것 같다."
    - "그 옆에 펼쳐진 노트에는 빽빽한 배합식과, 몇 번이고 줄을 그어 지운 숫자들."
    - "지운 자국 위에 또 지운 자국. 종이가 얇아져 등잔 불빛이 비쳐 보일 정도다."
    - "노트 귀퉁이에 토끼 한 마리가 그려져 있다. 연금술사의 노트에 어울리지 않는, 삐뚤빼뚤한 선."
    - 속마음: "(연금술 교수의 노트에 토끼라니. …아니, 남의 노트를 너무 오래 보고 있다.)"
    - when: "bistol.gentle"
      속마음: "(화상 입은 학생에게 연고를 발라 주던 손이다. 지금은 펜을 쥔 채 굳어 있다.)"
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(원작 공식 교단 교주가 도서관 열람실에서 엎드려 자고 있다. 이런 장면은 원작에 없었다.)"
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(교주의 일지라면 피로 그린 마법진이나 제물 명단 같은 걸 상상했다. 눈앞에 있는 건 지운 숫자뿐이다.)"
    - "비스톨이 잠결에 무언가를 중얼거렸다. 알아들을 수 없었다. 누군가의 이름 같기도 했다."
    - "아주 작고, 다정한 목소리였다. 수업 시간엔 한 번도 들어 본 적 없는."
    - "괜히 내가 민망해져서 한 걸음 물러섰다."
    - "열린 창으로 밤바람이 들어올 때마다, 비스톨의 어깨가 움찔한다."
    - "열람실 저쪽에서 사서 노인이 등잔을 하나씩 끄며 다가오고 있다. 폐관 시간이 가깝다."
    - 속마음: "(어떻게 할까.)"
  choices:
    - text: 겉옷을 덮어 준다
      effects: ["affinity.bistol += 5"]
      lines:
        - "겉옷을 벗었다. 초여름이라도 밤의 도서관은 서늘하다."
        - "깨지 않게, 천천히 어깨에 걸쳐 주었다. 생각보다 어깨가 좁다."
        - when: "talent.거구"
          나레이션: "내 겉옷은 그의 어깨를 넘어 등까지, 이불처럼 덮었다."
        - when: "talent.키작음"
          나레이션: "내 겉옷은 그의 어깨를 반밖에 못 덮었다. 그래도 반은 덮었다."
        - "셔츠 너머로 날개뼈가 도드라진다. 제대로 먹고는 있는 걸까."
        - "등잔 하나만 남기고 돌아서는데, 잠긴 목소리가 등 뒤에서 들렸다."
        - 비스톨: "…창문 닫고 가라. 밤바람은 몸에 안 좋아."
        - "멈칫했다. 깨어 있었나. 언제부터."
        - 나: "…네. 교수님도 너무 늦게까지 계시지 마세요."
        - "그는 끝까지 고개를 들지 않았다. 대신 겉옷 깃을 조금 더 끌어당겼다."
        - "창문을 닫았다. 벌레 소리가 멀어졌다."
        - "열람실을 나서며 돌아보니, 사서 노인이 그 등잔 하나만은 끄지 않고 지나치고 있었다."
        - 속마음: "(겉옷은 내일 받으러 가야 하나. …아니, 그냥 두자. 저 사람한테는 겉옷이 하나 더 필요해 보였다.)"
        - "다음 날 아침, 겉옷은 반듯하게 개어진 채 기숙사 사감실에 맡겨져 있었다."
        - "쪽지는 없었다. 대신 주머니에 상처 연고 한 통이 들어 있었다."
    - text: 깨운다
      effects: ["affinity.bistol += 3", "trust.bistol += 3"]
      lines:
        - "어깨를 조심스럽게 두드렸다."
        - 나: "교수님, 폐관 시간이에요."
        - 비스톨@놀람: "──늦었나? 미안하다, 금방 갈──"
        - "벌떡 일어나던 비스톨이 나를 보고 멈췄다. 의자가 뒤로 밀려 끼익 울었다."
        - "누군가 다른 사람을 기다리던 얼굴이, 천천히 원래의 피곤한 얼굴로 돌아온다."
        - "아주 천천히. 벗었던 가면을 다시 쓰는 것처럼."
        - 비스톨: "…자네군. 아무것도 아니다. 꿈을 꿨어."
        - when: "talent.사람좋은얼굴"
          비스톨: "……자네 얼굴은 잠 깨기엔 너무 순하군. 꿈이 이어지는 줄 알았어."
        - "그가 노트를 덮고, 식은 커피를 단숨에 들이켰다. 얼굴을 찡그렸다."
        - 비스톨: "식은 커피는 연금술의 실패작이다. 기억해 둬."
        - "그는 안경을 고쳐 쓰고 책을 쌓기 시작했다. 손이 떨려서 책이 두 번 미끄러졌다."
        - "말없이 책 절반을 들어 주었다. 그는 말리지 않았다."
        - 비스톨: "…깨워 줘서 고맙다. 다음엔 좀 더 일찍 깨워."
        - "도서관 문 앞에서 우리는 반대 방향으로 갈라졌다. 그는 숙소가 아니라 연구실 쪽으로 걸어갔다."
        - 속마음: "('미안하다, 금방 갈게.' 누구한테 하려던 말이었을까. 학생한테 할 말투는 아니었다.)"
    - text: 펼쳐진 노트를 훑어본다
      check:
        type: 통찰
        dc: 보통
        mods:
          - { when: "talent.서번트.연금", value: 3, label: 연금 눈썰미 }
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      success:
        lines:
          - "숨을 죽이고, 노트 쪽으로 고개를 기울였다."
          - "보존액이다. 살아 있는 조직을 상하지 않게 붙잡아 두는 배합."
          - "연고 따위와는 차원이 다르다. 재료 이름 절반은 교과서에서도 본 적이 없다."
          - "숫자를 지운 자리마다 같은 단어가 작게 적혀 있다. ── 실패. 실패. 실패."
          - "기준 체중 칸에 적힌 숫자가 이상하게 작다. 다 큰 어른의 절반도 안 되는 무게."
          - 속마음: "(…어른의 몸이 아니다.)"
          - "등골이 서늘해졌다. 손끝이 차가워졌다."
          - 비스톨: "남의 노트를 훔쳐보는 건 연금술사의 첫 번째 금기다."
          - "언제 깼는지, 비스톨이 노트를 덮고 있었다."
          - "화난 목소리가 아니었다. 그냥 아주 지쳐 있었다."
          - 비스톨: "두 번째 금기는 본 걸 입 밖에 내는 거고. …가게."
          - "노트를 품에 안고 일어선 그의 등이, 아까보다 더 굽어 보였다."
          - 속마음:
              - "(어른의 몸이 아닌 무언가를 위한 배합. 이 사람은 지금, 누구를 붙잡아 두려는 걸까.)"
              - { when: "perk.고인물의기억 or perk.공략위키편집자", text: "(원작 위키의 비스톨 항목, 동기 칸엔 '불명'이라고 적혀 있었다. 그 두 글자의 무게가 방금 손끝에 닿았다.)" }
        effects: ["know.bistol_formula = 1", "affinity.bistol += 1"]
      fail:
        lines:
          - "노트 쪽으로 고개를 기울였다."
          - "글씨가 너무 빽빽해서 한 줄도 읽지 못했다. 약어와 기호와 지운 자국이 뒤엉켜 있다."
          - "읽을 수 있는 건 귀퉁이의 토끼 그림뿐이었다."
          - "그때 노트가 탁 덮였다."
          - 비스톨@화남: "읽지도 못할 걸 왜 보나. 가서 잠이나 자게."
          - "비스톨이 노트를 겨드랑이에 끼고 일어섰다. 비틀거리다 한 손으로 책상을 짚었다."
          - "책상 아래로 그의 안경이 굴러떨어졌다. 주워서 건넸다."
          - "비스톨이 안경을 받아 들고, 잠깐 나를 봤다. 화난 얼굴이 금방 풀렸다."
          - 비스톨: "…자네도. 잠은 자게. 젊을 때 안 자면 늙어서 못 잔다."
          - 속마음: "(그 말을 하는 사람이, 제일 못 자는 얼굴이었다.)"
        effects: ["affinity.bistol += 1"]
      great:
        lines:
          - "덮이기 직전에 본 것이 하나 더 있었다."
          - "지운 숫자들 사이에, 하나만 지워지지 않은 숫자. 동그라미가 세 번 쳐져 있었다."
          - "── 일곱."
          - 속마음: "(나이일까. 무게일까. 날짜일까. 셋 다 아니길 바랐다. 셋 다 맞을 것 같았다.)"
        effects: ["stat.지성 += 0.5"]

- id: bond_bistol_2
  title: 비스톨 — 두 그릇
  art: cg_bistol_bowls
  on: 아르바이트
  priority: 1
  when: "affinity.bistol >= 10 and fired.bond_bistol_1"
  lines:
    - "문 닫을 무렵의 식당. 마지막 손님들이 떠난 자리에 빵 부스러기와 맥주 거품 자국이 남아 있다."
    - "의자를 테이블 위에 뒤집어 올리고, 바닥을 쓸던 참이었다."
    - "하루 종일 서 있었던 다리가 욱신거린다. 앞치마에서 양파 냄새가 빠지지 않는다."
    - "문에 달린 종이 딸랑 울렸다."
    - "누군가 들어와 구석 자리에 앉았다. 늘 앉는 자리라는 듯이, 망설임 없이."
    - "외투 어깨가 젖어 있다. 밖엔 가는 비가 내리는 모양이다."
    - 비스톨: "스튜 두 그릇."
    - 나@당황: "저, 손님. 주문은 마감이──"
    - "말이 끝나기도 전에 주방에서 식당 아주머니가 '네에─' 하고 길게 대답했다. 묻지도 않는다. 늘 그랬다는 듯이."
    - "그제야 손님 얼굴이 보였다. 연금술 실습실에서 늘 보던, 그 거뭇한 눈 밑. 비스톨 교수다."
    - when: "fired.enc_job_bistol"
      속마음: "(전에도 봤다. 한 그릇은 손도 대지 않고, 작은 숟가락을 옆에 놓아두던.)"
    - "스튜 두 그릇을 쟁반에 받쳐 들고 갔다. 김이 얼굴로 올라온다."
    - "비스톨이 한 그릇을 자기 앞에, 한 그릇을 맞은편에 놓았다."
    - "오늘도 한 그릇 옆에는 아이용 작은 숟가락이 놓여 있다. 김이 천천히 식어 간다."
    - "숟가락 손잡이에 토끼 한 마리가 새겨져 있다. 식당 숟가락이 아니다. 그가 품에서 꺼낸 거다."
    - when: "know.bistol_formula"
      속마음: "(도서관에서 본 노트가 떠올랐다. 귀퉁이의 토끼. 어른의 절반도 안 되는 무게.)"
    - 속마음: "(토끼 숟가락. 아주머니가 아무것도 묻지 않는 이유를, 알 것 같기도 하다.)"
    - "비스톨은 자기 스튜에 손을 대기 전에, 맞은편 그릇의 김이 오르는 걸 한참 내려다봤다."
    - "그릇을 내려놓자 비스톨이 턱으로 맞은편 자리를 가리켰다."
    - "앉으라는 건지, 그 자리는 안 된다는 건지 알 수 없다."
    - "주방에서 식당 아주머니가 손짓한다. ─ 앉아, 앉아. 쉬는 시간이야."
    - "앞치마를 풀었다. 테이블 위의 의자를 하나 내렸다."
    - 속마음: "(어디에 앉느냐. 이상하게, 이게 중요한 선택처럼 느껴진다.)"
  choices:
    - text: 맞은편이 아니라 옆자리에 앉는다
      effects: ["affinity.bistol += 6", "trust.bistol += 4"]
      lines:
        - "맞은편 의자를 지나쳐, 비스톨 옆에 의자를 놓았다."
        - "옆에 앉으니 그의 외투에서 약품 냄새와 빗물 냄새가 같이 났다."
        - "비스톨이 아주 잠깐 놀란 얼굴을 했다."
        - "그리고 아무 말 없이 빵 바구니를 내 쪽으로 밀었다."
        - 비스톨: "…거기가 맞다. 맞은편은, 비워 둬."
        - "주방에서 아주머니가 스튜 한 그릇을 더 내왔다. 내 몫이었다."
        - "우리는 말없이 스튜를 먹었다."
        - when: "talent.대식가"
          나레이션: "한 그릇을 금세 비웠다. 비스톨이 말없이 빵 바구니를 통째로 내 앞에 옮겨 놓았다."
        - "숟가락이 그릇에 닿는 소리, 창밖 마차 바퀴 소리, 주방에서 그릇 씻는 소리."
        - "비스톨은 가끔 맞은편 그릇 쪽으로 빵을 조금씩 찢어 놓았다. 아무도 먹지 않을 걸 알면서."
        - "식은 그릇은 끝까지 그대로였다."
        - 비스톨: "…잘 먹었다. 자네 몫은 내가 내지."
        - "그가 일어서며, 아무도 없는 맞은편 의자 쪽으로 아주 작게 고개를 숙였다."
        - "그리고 토끼 숟가락을 손수건에 싸서 품에 넣었다."
        - 속마음: "(맞은편은 비워 둘 것. 이 사람의 규칙을 하나 알게 됐다.)"
    - text: "\"그 그릇은 누구 몫이에요?\""
      effects: ["affinity.bistol += 2", "trust.bistol -= 2"]
      lines:
        - "맞은편 자리에 앉기 전에, 그 질문이 먼저 나와 버렸다."
        - when: "talent.눈치없음"
          속마음: "(주방의 아주머니가 고개를 젓는 게 보였다. 그게 무슨 뜻인지, 말이 나가고 나서야 알았다.)"
        - 나: "그 그릇은 누구 몫이에요?"
        - "숟가락이 멈췄다."
        - "주방의 그릇 소리도 멈췄다. 아주머니가 이쪽을 보지 않으려고 애쓰는 게 느껴졌다."
        - 비스톨: "약속한 사람 몫이다."
        - 비스톨@슬픔: "늦는 사람이라. …아주 많이."
        - "그 뒤로 그는 한마디도 하지 않았다."
        - "스튜를 다 먹고, 두 그릇 값을 내려놓고, 작은 숟가락을 손수건에 싸서 품에 넣고 나갔다."
        - "묻지 말걸 그랬다."
        - "그릇을 치우러 갔다. 맞은편 그릇은 한 숟갈도 줄지 않은 채 식어 있었다."
        - "아주머니가 다가와 그 그릇을 받아 갔다. 버리지 않고, 뚜껑을 덮어 따로 두었다."
        - "─ 내일 아침에 저 양반 연구실에 갖다 드려. 늘 그래."
        - 속마음: "(질문 하나로 문이 닫히는 소리를 들었다. 이 사람의 마음은, 숫자처럼 다시 올릴 수가 없다.)"
    - text: 빈 그릇 옆에 꿀과자를 하나 놓아둔다 (은화 5)
      requires: "money >= 5"
      effects: ["money -= 5", "affinity.bistol += 8", "trust.bistol += 5"]
      lines:
        - "앞치마 주머니에 꿀과자가 하나 있었다. 오는 길에 제과점에서 은화 다섯 닢을 주고 산 것."
        - "주머니에 있던 꿀과자를 작은 숟가락 옆에 내려놓았다."
        - "종이 포장이 바스락거렸다. 그 소리에 비스톨이 고개를 들었다."
        - "비스톨이 그걸 오래 내려다봤다. 아주 오래."
        - "스튜가 식는 동안. 창밖으로 마차가 두 대 지나가는 동안."
        - 비스톨@슬픔: "……단 거라면 사족을 못 썼지."
        - "목소리가 갈라져 있었다. 그가 헛기침을 했다."
        - 비스톨: "고맙네. 이건, 내가 전해 주지."
        - "그는 꿀과자를 손수건에 조심스럽게 싸서, 작은 숟가락과 함께 품에 넣었다."
        - "외투를 걸치고 문 앞까지 간 그가, 한 번 돌아봤다."
        - 비스톨: "…자네, 단 거 좋아하나."
        - 나@놀람: "네? 아, 네."
        - 비스톨: "다음 수업 끝나고 연구실에 들르게. 사탕이 남아. 아무도 안 먹는."
        - 속마음: "(전해 준다. 어디로. …묻지 않았다. 묻지 않는 게, 오늘 내가 할 수 있는 전부였다.)"

- id: bond_bistol_3
  title: 비스톨 — 되돌리는 연금술
  art: cg_bistol_frame
  on: 마법실습
  priority: 1
  when: "affinity.bistol >= 16 and fired.bond_bistol_2"
  effects: ["stat.지성 += 1"]
  lines:
    - "마법 실습을 마치고 돌아가는 복도. 해 질 녘 빛이 복도 끝까지 길게 누워 있다."
    - "복도 끝, 연금술 연구실 문이 반쯤 열려 있다. 처음 보는 광경이다. 그 문은 늘 잠겨 있었다."
    - "문틈으로 유리 부딪는 소리와, 무언가 낮게 끓는 소리가 새어 나온다."
    - "안에서 비스톨이 손짓한다."
    - 비스톨: "들어오게. 남는 플라스크 정리 좀 도와."
    - 비스톨: "실습 끝났으면 손이 남겠지. 남는 손은 연금술사의 재산이야."
    - "연구실은 생각보다 깔끔했다."
    - "라벨 붙은 약병들이 키 순서대로 서 있고, 책은 크기별로 꽂혀 있다."
    - "셔츠 단추를 밀려 잠그는 사람의 방이라고는 믿기지 않는다."
    - "책상 위의 작은 액자 하나만 빼면."
    - "일곱 살쯤 된 소녀가 수줍게 웃고 있다. 앞니 하나가 빠져 있다."
    - "액자 모서리가 손때로 닳아 반들거린다."
    - 속마음: "(시선을 오래 두지 않으려고 했다. 그런데 자꾸 그쪽으로 눈이 갔다.)"
    - "플라스크를 하나씩 씻어 선반에 엎었다. 한참 동안 물소리만 이어졌다."
    - "창밖에서 저녁 종이 울렸다. 비스톨은 종소리가 다 그칠 때까지 손을 멈추고 있었다."
    - 비스톨: "자네, 연금술의 끝이 뭔지 아나."
    - 나: "…금을 만드는 거요?"
    - 비스톨: "금을 만드는 것도, 불로장생도 아니야."
    - 비스톨@진지: "되돌리는 거지. 깨진 걸 붙이고, 시든 걸 피우고, 떠난 걸──"
    - "말이 끊겼다. 비스톨이 플라스크 하나를 불빛에 비춰 본다."
    - "유리 속에서 노을이 일그러졌다."
    - 비스톨: "젊을 땐 그런 연금술사들을 비웃었네. 다 미친놈들이라고."
    - 비스톨: "되돌리는 건 자연을 거스르는 일이다. 교과서 첫 장에 그렇게 써 놨지. 내가 쓴 교과서에."
    - 비스톨@슬픔: "…요즘은, 그 사람들 마음을 알 것 같아."
    - when: "know.bistol_formula"
      속마음: "(그 노트. 어른의 절반도 안 되는 몸을 위한 보존액.)"
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(원작은 끝까지 이 사람이 왜 차원문을 열었는지 말해 주지 않았다. …정말 이유가 없었을까.)"
    - "그가 플라스크를 내려놓았다. 손이 아주 조금 떨렸다."
    - 속마음: "(무슨 말을 해야 할까. 이상하게, 지금 하는 대답이 아주 오래 남을 것 같았다.)"
  plants:
    - { id: F06, notice: { value: "stat.지성 + 10 * talent.직감 + 10 * know.bistol_formula", dc: 20 } }
  choices:
    - text: "\"교수님은 그런 연금술사가 되지 마세요\""
      effects: ["bistol.warned = 1", "trust.bistol += 6", "affinity.bistol += 3"]
      lines:
        - 나: "교수님은 그런 연금술사가 되지 마세요."
        - 비스톨: "……"
        - "물소리가 멈췄다. 내가 물을 잠갔는지, 시간이 멈췄는지 모르겠다."
        - 비스톨: "학생한테 그런 소리를 들을 줄은 몰랐군."
        - "그는 웃으려다 실패했다. 대신 플라스크를 조심스럽게 선반에 올렸다."
        - "깨지지 않게, 아주 조심스럽게. 무언가를 내려놓는 사람처럼."
        - 비스톨: "기억해 두지. 자네가 그렇게 말했다는 거."
        - 비스톨: "…가 보게. 플라스크는 다 씻었으니."
        - "연구실을 나서는데, 등 뒤에서 서랍이 덜컥 열리는 소리가 났다."
        - "무언가를 꺼내는 소리인지, 넣는 소리인지 알 수 없었다."
        - when: "talent.직감"
          속마음: "(직감이 목덜미를 쓸었다. 넣는 소리였다. 무언가를 다시 깊이 넣어 두는 소리.)"
        - "돌아보지 않았다. 돌아보면 안 될 것 같았다."
        - 속마음:
            - "(기억해 두겠다고 했다. 그 말이 이상하게 무겁게 들렸다.)"
            - { when: "perk.고인물의기억 or perk.공략위키편집자", text: "(기억해 두겠다고 했다. 8년차 봄, 미궁 최하층의 그 문 앞에서도 기억하고 있을까.)" }
    - text: "\"되돌릴 수 있다면, 저라도 하고 싶을 것 같아요\""
      effects: ["bistol.empathy = 1", "affinity.bistol += 7"]
      lines:
        - 나: "되돌릴 수 있다면, 저라도 하고 싶을 것 같아요."
        - "말해 놓고 나니 진심이었다. 서른일곱 번의 엔딩. 되돌릴 수 있다면."
        - 비스톨: "그렇지. 그게 사람이지."
        - "그의 눈이 처음으로 똑바로 나를 봤다."
        - "반가움인지, 다른 무엇인지 모를 빛이었다. 같은 병을 앓는 사람을 알아본 눈."
        - 비스톨: "자네는 젊으니 아직 되돌릴 게 없겠지만."
        - 비스톨@웃음: "…생기거든 찾아오게. 연금술은 그런 사람한테만 문을 여는 학문이야."
        - "그가 선반에서 작은 유리병 하나를 꺼내 내 손에 쥐여 주었다. 투명한 액체가 찰랑거렸다."
        - 비스톨: "첫 방문 기념이다. 그냥 증류수야. …내 첫 작품도 증류수였지."
        - "웃음이 섞인 목소리였다. 이 방에 들어와서 처음 듣는."
        - 속마음: "(…방금 그 대답, 옳은 대답이었을까.)"
        - 속마음: "(동정이 아니라 공감이었다. 그래서 더 무섭다. 이 사람을 어딘가로 미는 손이, 내 손이 될 수도 있다.)"
        - when: "loop.count >= 1"
          속마음: "(되돌릴 수 있다면, 이라고 했다. …나는 이미 한 번 되돌아왔다. 그래서 그 말은 거짓말이 아니었다.)"
    - text: 액자 속 아이에 대해 묻는다
      requires: "trust.bistol >= 6"
      effects: ["trust.bistol += 4", "affinity.bistol += 4"]
      lines:
        - 나: "…그 아이는, 누구예요?"
        - "물어보고 나서 숨을 참았다."
        - "비스톨이 대답 대신 액자를 집어 들었다."
        - "손끝으로 유리 위의 먼지를 한 번 쓸었다. 먼지는 없었다. 매일 닦는 거였다."
        - "그리고 아주 조심스럽게, 액자를 엎어 놓았다."
        - 비스톨: "그 아이 이야기는 아직 못 하네."
        - 비스톨@진지: "…언젠가 하게 된다면, 자네한테 하지."
        - "약속이었다. 이 사람이 하는 약속 중에, 아마 가장 무거운."
        - "엎어진 액자 뒷면은 너무 오래 쓰다듬어서, 나무가 반들반들했다."
        - "비스톨이 수도꼭지를 틀었다. 물소리가 다시 연구실을 채웠다."
        - 비스톨: "플라스크 마저 씻게. 반도 안 했어."
        - "그 목소리가, 아까보다 조금 가벼웠다."
        - 속마음: "(언젠가. 그 언젠가가 오기 전에, 이 사람이 다른 길로 가지 않게 해야 한다.)"

# ================================================================ 교수 인연 — 시스터 루나

- id: bond_luna_1
  title: 시스터 루나 — 숨 쉬는 기도
  on: 성당
  priority: 1
  when: "met.luna and affinity.luna >= 12"
  lines:
    - "저녁 성당. 저녁 미사가 끝나고 신자들이 다 돌아간 뒤다."
    - "문을 밀자 무거운 경첩이 길게 울었다."
    - "긴 의자들이 텅 비어 있다. 촛불 몇 개만 남아 제단 쪽을 흔들리며 비춘다."
    - "향 냄새, 밀랍 냄새, 오래된 돌 냄새. 발소리가 천장까지 올라갔다가 내려온다."
    - "시스터 루나가 제단 촛대를 하나씩 닦고 있다. 베일을 벗어 의자에 걸쳐 두었다."
    - "걷어붙인 소매 아래로 오래된 흉터가 보인다. 칼자국 같기도, 화상 같기도 한."
    - 속마음: "(수녀의 팔에 저런 흉터가. 원작 일러스트에선 늘 긴 소매였다.)"
    - 시스터 루나@웃음: "아, 마침 잘 왔어요. 그 촛대 좀 들어 줘요."
    - 시스터 루나: "신은 사람을 공평하게 사랑하시는데, 촛대 무게는 공평하지 않거든요."
    - "들어 보니 정말 무거웠다. 은이 아니라 납 같았다."
    - 시스터 루나@웃음: "그렇죠? 어느 백작님이 기증하신 건데, 그분 죄만큼 무거워요."
    - "웃어야 할지 말아야 할지 모르는 사이에, 그녀는 벌써 다음 촛대를 닦고 있었다."
    - "촛대를 다 닦을 때까지 그녀는 아무것도 묻지 않았다."
    - "천으로 문지르는 소리, 촛농을 긁어내는 소리. 이상하게 마음이 가라앉는 소리들."
    - "마지막 촛대를 내려놓고서야 입을 열었다."
    - 시스터 루나: "요즘 얼굴이 쫓기는 사람 얼굴이에요. 시험 때문은 아닌 것 같고."
    - 나@당황: "…티 나요?"
    - 시스터 루나: "사람 얼굴 보는 게 제 일이에요. 고해성사만 이십 년 들었거든요."
    - 시스터 루나: "죄지은 얼굴, 아픈 얼굴, 숨기는 얼굴. 학생은 두 번째랑 세 번째 사이예요."
    - "숨이 턱 막혔다. 아니라고 하려다, 그만뒀다. 이 사람 앞에선 소용없을 것 같았다."
    - when: "talent.마왕의흔적"
      나레이션: "성수반 쪽으로 한 걸음 옮기자 가슴이 욱신거렸다. 시스터 루나가 아무렇지 않게 내 앞을 가로막고 섰다."
    - when: "talent.마왕의흔적"
      시스터 루나: "거긴 가지 말아요. 오늘 성수가 좀 독하게 나왔거든요. …제가 그렇다면 그런 거예요."
    - when: "talent.마왕의흔적"
      속마음: "(…알고 막은 건가? 아니면 정말 성수가 독한 건가. 저 웃는 얼굴로는 알 수가 없다.)"
    - 시스터 루나: "앉아요. 말하고 싶으면 말하고, 아니면 그냥 앉아 있어도 돼요. 성당 의자는 그러라고 있는 거예요."
    - "맨 앞줄 의자에 나란히 앉았다. 촛불이 흔들렸다."
    - 속마음: "(쫓기고 있다. 맞다. 10년이라는 시계에.)"
  branch:
    - when: "talent.마왕의흔적"
      effects: ["luna.covered = 1"]
  choices:
    - text: "\"해야 할 일이 너무 많아서요\""
      effects: ["affinity.luna += 5", "stat.의지 += 1", "stress -= 10"]
      lines:
        - 나: "해야 할 일이 너무 많아서요."
        - 시스터 루나: "그렇겠죠. 다들 그래요. 그런데 학생은 '해야 할 일'을 말할 때 눈이 좀 달라요."
        - 시스터 루나@웃음: "그럼 기도 하나 가르쳐 줄게요. 효과는 확실해요. 신이 안 들어 주셔도 효과가 있거든요."
        - 시스터 루나: "넷을 세며 들이쉬고, 넷을 세며 참고, 넷을 세며 내쉬어요."
        - 시스터 루나: "끝에 '아멘'은 붙여도 되고 안 붙여도 돼요."
        - "따라 해 봤다. 하나, 둘, 셋, 넷."
        - "참는 넷이 제일 길었다. 내쉬는 넷에서, 어깨가 내려갔다."
        - when: "talent.겁쟁이"
          나레이션: "참는 넷에서 숨이 떨렸다. 그래도 끝까지 셌다. 시스터 루나가 작게 고개를 끄덕였다."
        - "가슴 안쪽에 얹혀 있던 무언가가 조금 내려앉았다."
        - 시스터 루나@웃음: "봐요. 신학은 생각보다 실용적인 학문이에요."
        - 시스터 루나: "자기 전에 세 번. 잠이 안 오면 열 번. 그래도 안 오면 저한테 와요. 그땐 진짜 기도를 해 줄게요."
        - 속마음: "(넷, 넷, 넷. 원래 세계에선 이걸 호흡법이라고 불렀다. 이 세계에선 기도라고 부른다.)"
        - "성당을 나서는 길, 밤공기가 아까보다 덜 차가웠다."
    - text: "\"시스터는 무서운 거 없어요?\""
      effects: ["affinity.luna += 4", "trust.luna += 4"]
      lines:
        - 나: "시스터는 무서운 거 없어요?"
        - "그녀가 눈을 동그랗게 떴다. 질문을 받는 쪽이 되는 게 익숙하지 않은 얼굴이었다."
        - 시스터 루나: "많죠."
        - 시스터 루나@웃음: "지금은 추기경님 서한이 제일 무섭고, 그다음이 다음 주 교수회의예요."
        - "농담처럼 말했는데, 눈은 웃지 않았다."
        - "제단 옆 촛대 뒤에 봉인된 편지 한 통이 놓여 있었다. 붉은 밀랍에 교회 문장."
        - 시스터 루나: "무서운 게 있어야 기도도 하죠. 안 무서운 사람은 기도할 이유가 없어요."
        - 시스터 루나: "그러니 학생도 무서워해도 돼요. 여기선."
        - "그녀가 서한을 집어 들었다. 뜯지 않은 채로 촛불에 비춰 보더니, 다시 내려놓았다."
        - 시스터 루나@웃음: "내일 읽을래요. 오늘은 학생이랑 촛대를 닦았으니까, 그걸로 충분해요."
        - 속마음:
            - "(웃는 얼굴 뒤에 숨긴 게 많은 사람이다. 나처럼.)"
            - { when: "perk.고인물의기억 or perk.공략위키편집자", text: "(원작의 시스터 루나는 교회 숙청에 휘말려 죽는다. 저 서한이, 그 시작일까.)" }
    - text: 웃어넘긴다
      effects: ["affinity.luna += 2"]
      lines:
        - 나@웃음: "에이, 그냥 좀 피곤해서요."
        - "웃었다. 늘 하던 대로."
        - 시스터 루나: "그래요, 웃어요."
        - "그녀는 더 묻지 않았다. 대신 촛불 하나를 더 켜서 내 앞에 놓았다."
        - 시스터 루나@웃음: "웃는 사람은 적어도 아직 안 진 거니까."
        - "그녀가 내 옆에 앉았다. 촛불 하나가 다 탈 때까지, 아무 말도 하지 않았다."
        - "웃음이 얼굴에서 조금씩 빠져나갔다. 억지로 붙이고 있던 웃음이었다는 걸, 그제야 알았다."
        - 시스터 루나: "…다만 너무 오래 웃고만 있진 말아요. 그것도 저처럼 직업병이 되거든요."
        - 속마음: "(웃는 얼굴로 날카로운 말을 하는 사람이, 웃는 얼굴의 무게를 제일 잘 안다.)"
    - text: "\"진짜 기도를 해 주세요. …같이요\" (성흔)"
      when: "talent.성흔"
      lines:
        - 나: "진짜 기도를 해 주세요. …같이요."
        - "시스터 루나가 나를 봤다. 그리고 내 손등을 봤다. 아주 잠깐."
        - 시스터 루나: "같이, 라."
        - "그녀가 제단 앞에 무릎을 꿇었다. 옆자리를 손바닥으로 톡톡 두드렸다."
        - "무릎을 꿇었다. 성당 돌바닥이 차가웠다."
        - 속마음: "(성흔. 원작에선 신성 마법 해금 재능이었다. 기도가 진짜로 닿는 몸이라는 뜻이다.)"
      check:
        type: 신성
        dc: 보통
        mods:
          - { when: "affinity.luna >= 20", value: 2, label: 루나의 인도 }
          - { when: "stress >= 60", value: -2, label: 흐트러진 마음 }
      success:
        lines:
          - "손을 모았다. 시스터 루나의 기도문이 낮게 흘렀다. 따라 했다."
          - "손등이 뜨거워졌다. 아프지 않게."
          - "제단의 촛불들이 일제히 이쪽으로 기울었다. 바람은 없었다."
          - "시스터 루나의 기도가 한 박자 멈췄다가, 다시 이어졌다. 목소리가 아주 조금 떨렸다."
          - "기도가 끝났을 때, 가슴에 얹혀 있던 것이 통째로 내려가 있었다."
          - 시스터 루나: "……학생."
          - 시스터 루나@진지: "오늘 본 건 저만 알게요. 촛불도 입이 무거운 편이에요."
          - 시스터 루나@웃음: "그리고 진짜 기도는 앞으로 저랑만 해요. 다른 신부님들 앞에선 숨 쉬는 기도만."
          - 속마음: "(숨겨 주겠다는 말이다. 원작의 시스터 루나는, 이런 걸 숨기다 죽었다.)"
        effects: ["affinity.luna += 6", "trust.luna += 4", "stat.의지 += 1", "stress -= 15"]
      fail:
        lines:
          - "손을 모았다. 시스터 루나의 기도문을 따라 했다."
          - "아무 일도 일어나지 않았다. 촛불은 그냥 촛불이었다."
          - "손등이 간지러웠다. 그게 다였다."
          - 시스터 루나@웃음: "신은 바쁘세요. 오늘은 백작님 촛대 무게 때문에 상담이 밀리셨나 봐요."
          - "웃음이 터졌다. 웃고 나니, 이상하게 기도한 것보다 가벼웠다."
          - 시스터 루나: "기도는 닿는 날보다 안 닿는 날이 많아요. 그래도 하는 거예요. 그게 신앙이에요."
          - 속마음: "(성흔이 있어도 안 닿는 날이 있다. 원작 위키에는 없던 정보다.)"
        effects: ["affinity.luna += 4", "stat.의지 += 0.5", "stress -= 8"]

- id: bond_luna_2
  title: 시스터 루나 — 성인 아니면 이단
  art: cg_luna_saint
  on: 성당
  priority: 1
  when: "affinity.luna >= 22 and fired.bond_luna_1"
  lines:
    - "성당 뒤뜰. 오랜만에 맑은 날이다."
    - "시스터 루나가 빨래를 널고 있다. 하얀 수녀복들이 바람에 부풀어 오른다. 돛 같다."
    - "빨랫줄 끝에 앉은 참새 두 마리가, 물방울이 튈 때마다 자리를 옮긴다."
    - 시스터 루나@웃음: "아, 학생. 빨래집게 좀 줘요. 그 바구니요. 손이 셋이면 좋겠어요."
    - "빨래집게를 건네며 나란히 섰다. 비누 냄새가 바람에 실려 왔다."
    - "그녀는 빨래를 널며 콧노래를 불렀다. 성가인데, 박자가 장터 노래처럼 경쾌하다."
    - 시스터 루나@웃음: "추기경님이 들으시면 기절하실 박자죠? 빨래는 이 박자로 널어야 빨리 말라요."
    - when: "kaiden.treat"
      시스터 루나: "그러고 보니 지난주에 황자님이 어깨를 보이러 오셨어요. 누가 보냈는지는 끝까지 말 안 하시더군요."
    - when: "kaiden.treat"
      시스터 루나@웃음: "의리 있는 분이에요. 누구랑 닮았네요."
    - when: "sera.warned"
      시스터 루나: "세라가 성녀 후보 시험을 미루고 싶다고 찾아왔어요. 누가 먼저 저한테 물어보라고 했다던데."
    - when: "sera.warned"
      시스터 루나@진지: "잘했어요. 추기경 쪽 사람들은 사람을 안 봐요. 손등만 보죠."
    - when: "luna.covered"
      시스터 루나: "그리고 성수반 말인데요. 앞으로 미사 땐 제 오른쪽에 서요. 거기가 성수가 제일 안 튀는 자리예요."
    - "마지막 수녀복을 널고, 그녀가 빈 바구니를 옆구리에 끼었다."
    - "웃음은 그대로인데, 목소리가 반 톤 낮아졌다."
    - 시스터 루나: "{{player.name}} 학생. 하나만 말해 둘게요."
    - 시스터 루나: "학생은 가끔 앞일을 다 아는 사람처럼 말해요. 표정도 그렇고요."
    - "심장이 철렁했다. 얼굴에 드러났는지, 그녀의 눈이 아주 조금 가늘어졌다."
    - 시스터 루나: "지금 그 얼굴이요."
    - "그녀가 손을 뻗어, 손가락으로 내 미간을 톡 쳤다. 아프진 않았다."
    - 시스터 루나: "여기요. 앞일을 아는 사람은 여기가 먼저 굳어요."
    - 시스터 루나@진지: "교회는 그런 사람을 두 가지로 불러요. 성인, 아니면 이단."
    - 시스터 루나@웃음: "둘 다 오래 못 살았어요. 역사적으로."
    - "바람이 불었다. 하얀 수녀복들이 일제히 부풀었다가 가라앉았다."
    - 속마음: "(웃으면서 하는 말인데, 농담이 아니다.)"
    - 속마음: "(원작 지식이 얼굴에 새고 있었다. 고인물 특유의 '아, 이거 아는 장면' 표정이.)"
  choices:
    - text: "\"시스터는 제가 어느 쪽 같아요?\""
      effects: ["affinity.luna += 5", "trust.luna += 3"]
      lines:
        - 나: "시스터는 제가 어느 쪽 같아요?"
        - 시스터 루나: "저요?"
        - "그녀가 빈 바구니를 고쳐 들며 하늘을 봤다. 한참 생각하는 척을 했다."
        - 시스터 루나@웃음: "저는 그냥, 수업 시간에 자주 창밖을 보는 학생 같아요."
        - 시스터 루나: "그러니까 둘 다 되지 말아요. 성인도 이단도 말고, 그냥 졸업하는 학생."
        - 시스터 루나: "그게 제일 어려운 거예요. 교회 역사를 보면요."
        - "그녀가 빨래집게 하나를 내 옷깃에 집어 주었다. 장난처럼."
        - 시스터 루나@웃음: "표시해 둔 거예요. 제 학생이라고."
        - when: "talent.성흔"
          시스터 루나: "아, 그리고 손등도 숨기고요. 성인 후보를 찾는 사람들은 손등부터 보거든요."
        - 속마음: "(그냥 졸업하는 학생. 3,000시간 동안 한 번도 목표로 삼아 본 적 없는 엔딩이다.)"
        - "옷깃의 빨래집게는 저녁에 기숙사로 돌아와서야 발견했다."
        - "떼어서, 버리지 않고 책상 위에 올려 두었다."
    - text: "\"조심할게요. 고마워요\""
      effects: ["trust.luna += 6", "affinity.luna += 3", "stat.의지 += 0.5"]
      lines:
        - 나: "조심할게요. …고마워요."
        - "시스터 루나가 조금 놀란 얼굴로 나를 봤다. 고맙다는 말을 들을 줄은 몰랐다는 듯이."
        - 시스터 루나: "고맙다는 말은 졸업식 때 들을게요. 그때까지 둘 다 살아 있으면요."
        - "농담처럼 말했다. 늘 그렇듯."
        - when: "perk.고인물의기억 or perk.공략위키편집자"
          속마음: "(원작의 시스터 루나는 교회 숙청에 휘말려 죽는다. 졸업식은 보지 못한다.)"
        - when: "perk.고인물의기억 or perk.공략위키편집자"
          속마음: "(둘 다 살아 있으면. 그녀도 아는 걸까. 위험한 쪽은 자기라는 걸.)"
        - 시스터 루나@웃음: "자, 고마운 김에 바구니 좀 들어 줘요. 신은 공평하신데, 빨래 바구니는──"
        - 나@웃음: "공평하지 않죠."
        - 시스터 루나@웃음: "잘 배웠네요."
        - "빈 바구니를 들고 성당까지 걸었다. 앞서 걷는 그녀가 또 그 경쾌한 성가를 흥얼거렸다."
        - 속마음: "(졸업식 날의 계획. 그 계획 안에 그녀 자신도 들어 있기를.)"
    - text: "\"시스터도 뭔가 알고 있는 사람 같은데요\""
      requires: "trust.luna >= 4 or fs.F19.noticed"
      effects: ["trust.luna += 4", "affinity.luna += 4"]
      lines:
        - 나: "시스터도… 뭔가 알고 있는 사람 같은데요."
        - "빨래를 털던 손이 아주 잠깐 멈췄다."
        - "참새 두 마리가 동시에 날아올랐다."
        - 시스터 루나: "…그러니까 제가 아직 살아 있는 거예요. 아는 걸 다 말하지 않아서."
        - "그녀가 다시 빨래를 털었다. 탁, 탁. 아까보다 조금 세게."
        - 시스터 루나@웃음: "학생도 그렇게 해요. 오래오래."
        - "그녀가 마지막 수녀복을 털어 널었다. 하얀 천이 바람에 부풀어, 우리 둘을 잠깐 가렸다."
        - "천 너머에서 작은 목소리가 들렸다."
        - 시스터 루나: "…다 말하지 않는 사람끼리는, 서로 알아보는 법이에요."
        - when: "fs.F19.noticed"
          속마음: "(성검은 고르지 않는다, 교회가 고른다. 그녀가 흘렸던 말이 떠오른다.)"
        - 속마음: "(아는 걸 서로 말하지 않기로 한 두 사람. 이것도 일종의 동맹일까.)"

# ================================================================ 교수 인연 — 사서

- id: bond_librarian_1
  title: 사서 — 봄마다 하는 말
  on: 도서관
  priority: 1
  when: "affinity.librarian >= 8"
  lines:
    - "폐관 뒤의 도서관. 열람실 등잔은 다 꺼지고, 사서 책상 위 하나만 남았다."
    - "서가 사이로 어둠이 고여 있다. 종이 냄새, 먼지 냄새, 아주 희미한 아교 냄새."
    - "발끝이 시리다. 밤이 되면 도서관 돌바닥은 계절을 잊고 식는다."
    - "사서 노인이 등불 아래에서 낡은 책의 등을 꿰매고 있다."
    - "바늘은 느리지만 한 번도 엇나가지 않는다. 땀과 땀 사이 간격이 자로 잰 것처럼 같다."
    - 속마음: "(폐관 시간을 놓쳤다. 나가려면 저 책상 앞을 지나가야 한다.)"
    - "발소리를 죽이고 지나가려는데──"
    - 사서: "거기 서 있지 말고 앉게. 실 좀 잡아 주고."
    - "고개도 들지 않고 한 말이었다. 언제부터 내가 있는 걸 알았는지."
    - "맞은편 의자에 앉아 실타래를 잡았다. 노인이 실을 당길 때마다 손가락 사이로 실이 미끄러진다."
    - 사서: "너무 꽉 잡지 말게. 실은 당기는 쪽보다 풀어 주는 쪽이 더 중요해."
    - "무슨 뜻인지 물으려다 그만뒀다. 노인은 벌써 다음 땀을 뜨고 있었다."
    - "실을 잡아 주는 동안 노인은 올해 신입생 명부를 넘겼다. 이백 개의 이름."
    - 사서: "명부를 꿰매 두는 것도 내 일일세. 해마다 한 권씩."
    - "노인이 턱으로 뒤쪽 서가를 가리켰다. 같은 크기의 명부들이 한 칸을 가득 채우고, 다음 칸까지 넘어가 있었다."
    - "한 장, 한 장. 손끝이 이름 위를 천천히 지나간다. 읽는 게 아니라 쓰다듬는 것처럼."
    - "손끝이 어느 이름 위에서 아주 잠깐 멈췄다가, 다시 움직였다. 누구 이름인지는 보이지 않았다."
    - 사서: "올해도 이름들이 곱구먼."
    - "명부를 덮으며, 노인이 아주 작게 덧붙였다. ─ 또 시작이구나."
    - "등잔 불꽃이 흔들렸다. 바람은 없었다."
    - when: "not fs.F02.noticed"
