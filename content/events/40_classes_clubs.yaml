        - "그대로 카운터로 걸어가, 서랍 깊은 곳에 넣었다. 자물쇠 잠기는 소리가 났다."
        - 속마음: "(원작은 동료를 '파티 슬롯'이라고 불렀다. 넷까지만. …이번엔 슬롯 같은 거 없다.)"
    - text: 대답 대신 파란 책을 제자리에 꽂는다
      effects: ["affinity.librarian += 4", "stat.지성 += 1"]
      lines:
        - "대답할 말이 떠오르지 않았다. 아니, 너무 많았다."
        - "노인 손에서 파란 책을 받아 들었다. 사다리를 올라, 원래 자리에 꽂았다."
        - "먼지 없는 빈자리 하나가, 다시 책으로 채워졌다."
        - when: "talent.완전기억"
          속마음: "(꽂기 전에 표지의 금박 글자를 한 자도 빠짐없이 외워 두었다. 언젠가 읽을 수 있게 되면.)"
        - "사다리에서 내려오는 동안, 노인은 아무것도 묻지 않았다."
        - "내려오니 노인이 천천히 고개를 끄덕였다."
        - 사서: "대답하지 않는 것도 대답이지. 젊은 사람치곤 현명하군."
        - 사서: "말로 한 각오는 금방 닳네. 말하지 않고 지니는 게 오래가지."
        - "노인이 지팡이 끝으로 바닥에 떨어진 먼지를 흩었다."
        - 사서@웃음: "다음에 오면 그 칸 먼지 좀 털어 주게. 이제 내 팔이 거기까지 안 닿아서."
        - 속마음: "(각오는 했다. 말하지 않았을 뿐이다. 3,000시간 전부터.)"

# ================================================================ 교수 인연 — 엘베라 (3), 가렌 (3)

- id: bond_elvera_3
  title: 엘베라 — 태우지 않는 불
  art: cg_elvera_flame
  on: 마법실습
  priority: 1
  when: "affinity.elvera >= 36 and fired.bond_elvera_2"
  lines:
    - "실습이 끝난 빈 실습실. 해가 기울어 창틀 그림자가 바닥에 길게 누웠다."
    - "두고 간 공책을 찾으러 돌아온 길이었다. 문이 한 뼘쯤 열려 있었다."
    - "다들 나간 뒤에도 마력의 잔향이 공기 중에 떠 있다. 비 온 뒤의 쇠 냄새 같은."
    - "엘베라가 창가 책상에 걸터앉아, 손바닥 위에 작은 불꽃을 띄워 놓고 있다."
    - "불꽃 바로 아래에 양피지가 놓여 있는데, 그을리지도 않는다."
    - "찾던 공책은 엘베라가 앉은 책상 위에 있었다. 그녀의 팔꿈치 바로 옆에."
    - 엘베라@웃음: "아, 학생. 들어와요. 문은 닫고요. 바람이 들면 이 아이가 싫어해요."
    - "불꽃을 '이 아이'라고 불렀다."
    - 속마음: "(오백 살 엘프는 불도 아이처럼 부르는구나.)"
    - 엘베라: "신기하죠? 불이라고 다 태우기만 하는 건 아니에요."
    - "가까이 가자 따뜻했다. 뜨겁지 않고, 따뜻했다. 겨울 아침 이불 속 같은 온도."
    - "손을 내밀자 손끝이 간질간질했다. 불이 손가락을 핥는 것 같은데, 아프지 않다."
    - 엘베라: "저한테 처음 불을 가르쳐 주신 분은, 겨울이면 손바닥에 이런 불을 올려놓고 아이들 손을 녹여 주셨어요."
    - 엘베라@웃음: "저도 그 아이들 중 하나였고요. 손이 늘 차가운 아이였어요."
    - 엘베라: "엘프들은 불을 무서워해요. 숲을 태우니까. 그런데 그분 불은 하나도 무섭지 않았어요."
    - when: "elvera.shaken"
      엘베라: "학생이 전에 한 대답 말이에요. '누군가의 오랜 친구.' …오래 생각했어요."
    - when: "elvera.saw_mark"
      엘베라: "그리고 수정구 날, 학생 마력에 섞여 있던 붉은 실. 저 말고 본 사람은 없어요. 앞으로도 없게 할게요."
    - when: "elvera.saw_mark"
      속마음: "(봤던 거다. 역시. 그리고 지금, 덮어 주겠다고 한다.)"
    - "불꽃이 엘베라의 손바닥 위에서 작게 일렁였다. 보랏빛 눈동자에 같은 불꽃이 비쳤다."
    - 엘베라@슬픔: "그분은 지금… 아주 먼 곳에 계세요. 만날 수 없는 곳에."
    - "먼 곳. 돌아가셨다는 말과는 결이 달랐다."
    - "그 말을 할 때, 그녀는 불꽃이 아니라 창밖의 먼 하늘을 보고 있었다."
    - when: "fs.F11.noticed"
      속마음: "(존칭을 붙일 뻔했던 이름. 불을 가르쳐 준 스승. …설마.)"
    - 속마음: "(오백 년. 그 긴 시간이 이 작은 불꽃 하나에 다 담겨 있는 것 같았다.)"
    - 엘베라: "…이상하죠. 학생한테는 자꾸 오래된 이야기를 하게 돼요."
    - "창밖 하늘이 보랏빛으로 물들기 시작했다. 불꽃이 조금 더 밝아 보였다."
  choices:
    - text: "\"그 불, 저도 배울 수 있을까요?\""
      check:
        type: 마법
        dc: 보통
        mods:
          - { when: "talent.원소친화.화", value: 2, label: 불의 결 }
          - { when: "talent.속성부적합.화", value: -3, label: 불이 안 맞음 }
          - { when: "trust.elvera >= 10", value: 2, label: 엘베라의 손 }
      success:
        lines:
          - 엘베라@웃음: "해 봐요. 불을 '만들려고' 하지 말고, 불한테 '부탁'해요."
          - "손바닥을 펴고 숨을 골랐다. 태우지 마. 그냥, 거기 있어 줘."
          - "손바닥 위에 불꽃이 맺혔다."
          - "뜨겁지 않다. 손금 사이로 빛이 고였다."
          - "엘베라가 양피지를 내 손 아래로 밀어 넣었다. 양피지 끝이 그을리지 않았다."
          - 엘베라@웃음: "…그분이 보셨으면 좋아하셨을 거예요. 제 첫 시도보다 낫네요."
          - "엘베라가 자기 불꽃을 내 불꽃 옆으로 가져왔다. 두 불꽃이 하나로 겹쳤다가, 다시 나뉘었다."
          - 엘베라@슬픔: "…이걸 누군가에게 건네 본 건, 처음이에요."
          - 엘베라: "겨울이 오면, 누군가의 손을 녹여 줘요. 이 불은 그러라고 있는 거예요."
          - 속마음: "(기술 습득… 이 아니다. 무언가를 물려받았다. 그런 느낌이었다.)"
        effects: ["stat.마력제어 += 1.5", "affinity.elvera += 6", "know.warm_flame = 1"]
      fail:
        lines:
          - 엘베라@웃음: "해 봐요. 불을 '만들려고' 하지 말고, 불한테 '부탁'해요."
          - "손바닥을 펴고 숨을 골랐다. 부탁. 부탁이라니, 어떻게──"
          - "불꽃이 확 일었다."
          - "불꽃이 양피지를 홀랑 태웠다. 재가 나풀나풀 날렸다."
          - "엘베라가 웃음을 참으며 재를 털어 냈다. 어깨가 떨리고 있었다."
          - 엘베라: "괜찮아요. 저는 삼십 년 걸렸어요."
          - 엘베라@웃음: "그동안 그분 소매를 몇 번이나 태워 먹었는지 몰라요. 그때마다 웃으셨어요. 지금 저처럼."
          - "엘베라가 새 양피지를 꺼내 내 앞에 놓았다."
          - 엘베라: "자, 한 번 더. 이번엔 부탁하는 목소리로요."
          - 속마음: "(삼십 년. 엘프 기준으로는 금방이라는 얼굴이다. 나한텐 10년도 없는데.)"
        effects: ["stat.마력제어 += 0.5", "affinity.elvera += 4"]
      great:
        lines:
          - "불꽃이 손바닥 위에서 몸을 기울였다. 엘베라의 불꽃 쪽으로, 인사하듯이."
          - 엘베라@놀람: "…이 아이가 먼저 인사를 했네요."
          - 엘베라@웃음: "그분 불도 그랬어요. 처음 보는 불한테 늘 먼저 고개를 숙였죠."
        effects: ["affinity.elvera += 2", "trust.elvera += 2"]
      fumble:
        lines:
          - "날리던 재 하나가 엘베라의 소매 끝에 내려앉았다."
          - "치익. 연보랏빛 소매에 콩알만 한 구멍이 뚫렸다."
          - 나@당황: "죄, 죄송──"
          - 엘베라@웃음: "…어머. 이걸로 똑같아졌네요. 제가 그분 소매를 처음 태웠을 때랑."
          - "그녀는 구멍 난 소매를 오래 내려다봤다. 아주 소중한 걸 보는 눈으로."
    - text: "\"그분 이야기, 더 듣고 싶어요\""
      effects: ["trust.elvera += 6", "affinity.elvera += 4"]
      lines:
        - 나: "그분 이야기, 더 듣고 싶어요."
        - 엘베라: "……"
        - "엘베라가 불꽃을 쥐어 껐다. 손가락 사이로 연기가 한 줄기 피어올랐다."
        - "실습실이 갑자기 어두워졌다. 해가 그새 더 기울어 있었다."
        - "꺼진 불꽃 자리에, 따뜻한 기운이 한참 남아 있었다."
        - 엘베라: "언젠가요. 학생이 졸업할 때쯤. 그때도 듣고 싶다면."
        - when: "talent.완전기억"
          속마음: "(잊어버릴 일은 없다. 이 약속은 토씨 하나까지 그대로 남을 것이다. 그게 조금 무섭다.)"
        - 엘베라@슬픔: "오백 년을 살면, 이야기를 꺼낼 때를 고르는 데도 오래 걸려요."
        - "그녀가 창밖을 봤다. 노을 속 어딘가, 아주 먼 곳을."
        - 엘베라: "약속할게요. 엘프의 약속은 길어요. 학생이 잊어버려도, 저는 기억해요."
        - 엘베라@웃음: "그러니까 졸업은 꼭 해요. 이야기 들으러."
        - 속마음:
            - "(졸업할 때쯤. 약속이 하나 늘었다. 지켜야 할 시간도.)"
            - { when: "perk.고인물의기억 or perk.공략위키편집자", text: "(졸업할 때쯤. 원작의 엘베라는 마지막에 행방불명이 된다. 그 전에, 들을 수 있을까.)" }
    - text: 조용히 불꽃을 바라본다
      effects: ["affinity.elvera += 5", "stress -= 10"]
      lines:
        - "아무 말도 하지 않았다. 엘베라 옆 책상에 걸터앉아 불꽃을 봤다."
        - "둘이서 한참 불꽃을 봤다."
        - "불꽃은 가끔 숨 쉬듯 커졌다 작아졌다. 엘베라의 숨과 박자가 같았다."
        - "불빛 너머로 엘베라의 옆얼굴이 보였다. 오백 살 교수가 아니라, 손이 차가운 아이의 얼굴 같았다."
        - "어느새 그녀가 아주 작게 흥얼거리고 있었다. 처음 듣는 가락이었다."
        - when: "talent.자연친화력"
          나레이션: "처음 듣는 가락인데, 숲 냄새가 났다. 창밖 나뭇가지가 박자에 맞춰 흔들리는 것 같았다."
        - "창밖으로 해가 졌다. 실습실엔 불꽃 하나만 남았다."
        - 엘베라: "…고마워요. 아무것도 안 물어봐 줘서."
        - "불꽃은 끝까지 아무것도 태우지 않았다."
        - "공책은 끝내 챙기지 못했다. 다음 날 아침, 그 공책이 내 책상 위에 올려져 있었다."
        - "겉장이 이상하게 따뜻했다."
        - 속마음: "(이런 시간이 원작에도 있었으면 좋았을 텐데. 아니, 있었는데 내가 몰랐던 걸까.)"

- id: bond_garen_3
  title: 가렌 — 다섯 개의 칼자국
  art: cg_garen_marks
  on: 훈련장
  priority: 1
  when: "affinity.garen >= 38 and fired.bond_garen_2"
  lines:
    - "새벽 수련이 끝난 뒤. 해가 막 담장 위로 올라오고 있다."
    - "숨이 아직 가라앉지 않았다. 땀이 식으면서 등이 서늘해진다."
    - "가렌이 말없이 훈련장 뒤편으로 걸어갔다."
    - "따라오라는 말은 없었다. 오지 말라는 말도 없었다."
    - "따라갔다. 이슬 젖은 풀이 무릎까지 닿았다."
    - "가렌의 등은 넓었다. 그런데 오늘따라 걸음이 조금 느렸다."
    - "훈련장 뒤편은 아무도 오지 않는 곳이다. 잡초가 허리까지 자랐고, 무너진 담장 돌이 나뒹군다."
    - "잡초 사이에 낡은 나무 기둥 하나가 서 있다."
    - "허리 높이에 칼자국 다섯 개가 나란히 새겨져 있다."
    - "넷은 이끼에 덮였고, 하나만 깨끗하다."
    - "칼자국 아래마다 작은 글자가 있다. 이끼 낀 넷은 읽을 수 없다. 깨끗한 하나에만 '가렌'."
    - 가렌: "원정 떠나기 전날 밤에 새겼다. 한 사람씩."
    - "가렌이 품에서 마른 천을 꺼내, 깨끗한 칼자국 하나를 닦았다. 이미 깨끗한 것을."
    - 가렌: "매년 이맘때 와서 내 것만 닦는다."
    - 가렌@슬픔: "나머지는… 닦을 사람이 없어서."
    - "바람이 풀을 쓸고 지나갔다. 이끼 낀 칼자국 넷은 그대로였다."
    - "가렌의 손이 기둥 위에서 잠깐 멈췄다. 자기 이름 바로 옆, 이끼 낀 칼자국 하나 앞에서."
    - "그리고 그냥, 내려갔다."
    - when: "fs.F23.noticed"
      속마음: "(20년 전, 지키지 못했다던 아이. 그리고 나머지 셋.)"
    - when: "finn.mentor == 'garen'"
      가렌: "…그 꼬마. 네가 데려왔지. 20년 만에 처음으로 뭘 가르치고 싶어졌다. 그건 고맙게 생각한다."
    - when: "finn.mentor == 'garen'"
      나레이션: "가렌은 그 말을 하고 괜히 헛기침을 했다. 고맙다는 말은 칼보다 무거운 모양이었다."
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(그리고 원작대로라면, 이 사람은 5년 뒤 이 기둥을 닦으러 오지 못한다.)"
    - 속마음: "(이끼 낀 칼자국 넷. 무슨 뜻인지 묻지 않아도 알 것 같았다.)"
    - "가렌이 천을 접어 품에 넣었다. 기둥에서 한 걸음 물러섰다."
    - 가렌: "…쓸데없는 걸 보여 줬군."
    - "그런데 돌아서지는 않았다."
  choices:
    - text: 말없이 옆에서 목검을 휘두른다
      lines:
        - "뭐라고 말해야 할지 몰랐다. 그래서 목검을 들었다."
        - "기둥 옆, 풀을 밟아 다진 자리에서 내려베기를 시작했다."
        - "하나, 둘. 새벽에 배운 대로. 허리부터, 어깨는 나중에."
        - "가렌은 한참 내 검을 지켜봤다. 팔짱을 낀 채, 아무 말 없이."
        - "열 번, 스무 번. 땀이 다시 흘렀다. 새벽 수련을 막 끝낸 팔이 무겁다."
      check:
        type: 완력
        dc: 보통
        mods:
          - { when: "fatigue >= 70", value: -3, label: 피로 }
          - { when: "fired.cls_sword_2", value: 2, label: 지는 법 }
      success:
        lines:
          - 가렌: "…허리가 들어갔군."
          - "목검이 허공에서 멈췄다."
          - "칭찬이었다. 입학하고 처음 듣는."
          - "가슴 안쪽이 뜨거워졌다. 목검을 쥔 손에 괜히 힘이 들어갔다."
          - 속마음: "(3,000시간 동안 가렌의 칭찬 대사는 본 적이 없다. 아마 데이터에도 없었을 거다.)"
          - "가렌은 이미 돌아서 걷고 있었다. 기둥 쪽을, 한 번 돌아보고."
          - 가렌: "…내일도 다섯 시다."
        effects: ["affinity.garen += 6", "garen.praised = 1", "stat.근력 += 1"]
      fail:
        lines:
          - "서른 번째에서 어깨가 먼저 나갔다. 목검 끝이 흔들렸다."
          - "가렌이 팔짱을 풀었다. 다가와서, 목검 끝으로 내 허리를 툭 쳤다."
          - 가렌: "여기."
          - "한 마디뿐이었다. 다시 휘둘렀다. 허리부터."
          - "가렌은 말없이 열 번을 더 지켜보다가, 돌아섰다."
          - 가렌: "…내일도 다섯 시다."
          - 속마음: "(칭찬은 없었다. 그래도 그가 기둥 앞에서 한 마디를 보탰다. 이 장소에서는, 그것도 작지 않다.)"
        effects: ["affinity.garen += 4", "stat.근력 += 0.5"]
      great:
        lines:
          - "돌아서던 가렌이 멈췄다. 고개는 돌리지 않았다."
          - 가렌: "…다섯 시 반으로 하지. 삼십 분 더 자라."
          - 속마음: "(가렌식 상장 수여식이다. 부상은 수면 삼십 분.)"
        effects: ["fatigue -= 10"]
    - text: "\"그때 일, 언젠가 말씀해 주실 수 있어요?\""
      requires: "trust.garen >= 8"
      effects: ["trust.garen += 6", "affinity.garen += 4", "garen.promise = 1"]
      lines:
        - 나: "…그때 일, 언젠가 말씀해 주실 수 있어요?"
        - "가렌이 나를 봤다. 화난 얼굴은 아니었다. 무게를 재는 얼굴이었다."
        - "한참 뒤에야 입이 열렸다."
        - 가렌: "네가 졸업할 때까지 살아 있으면."
        - 가렌@진지: "…그러니 살아 있어라. 그게 조건이다."
        - "가렌이 손가락으로 기둥을 툭 쳤다. 다섯 개의 칼자국 옆, 아무것도 새겨지지 않은 자리를."
        - "그 자리엔 아무것도 새길 생각이 없다는 듯이."
        - 속마음: "(졸업할 때까지. 이 사람도 그때까지 살아 있어야 한다. 조건은 양쪽에 걸려 있다.)"
        - when: "talent.병약"
          속마음: "(이 약한 몸에 걸기엔 무거운 조건이다. …그래도 걸었다. 살아 있겠다고.)"
        - "가렌이 천을 다시 꺼냈다. 그리고 이번엔, 이끼 낀 칼자국 하나를 닦기 시작했다."
        - "아주 조금. 이끼 한 귀퉁이만."
        - "글자 한 획이 드러났다. 가렌은 거기서 손을 멈추고, 한참 그 한 획을 내려다봤다."
    - text: "\"교관님은 이번엔 안 돌아가세요\" (원작 지식으로 말한다)"
      when: "perk.고인물의기억 or perk.공략위키편집자"
      effects: ["trust.garen -= 4", "affinity.garen += 2", "garen.warned = 1"]
      lines:
        - 나: "교관님은 이번엔 안 돌아가세요."
        - "말이 먼저 나갔다. 원작 지식이, 머리를 거치지 않고."
        - "가렌의 눈이 가늘어졌다."
        - 가렌@진지: "…누가 죽는다고 했지."
        - "목소리가 낮았다. 새벽 공기보다 차가웠다."
        - 속마음: "(원작 5년차, 잿빛 장벽. 이 사람은 거기서 죽는다. 그리고 그 죽음이 아렌을 무너뜨린다.)"
        - 속마음: "(…아차. 원작 지식은 입 밖에 내면 안 된다. 알고 있었는데.)"
        - "가렌이 한참 나를 봤다. 그리고 목검을 내 쪽으로 던졌다."
        - 가렌@화남: "헛소리 말고 검이나 들어. …내일 다섯 시."
        - "그는 돌아서 걸어갔다. 기둥 쪽은 돌아보지 않았다."
        - "다음 날 새벽 다섯 시. 가렌은 평소보다 두 배로 나를 굴렸다."
        - "한마디도 하지 않았다. 그날도, 그다음 날도."

- id: prof_corridor
  title: 교수 휴게실의 목소리
  art: cg_prof_lounge
  on: [훈련장, 마법실습]
  pool: true
  chance: 0.5
  when: "affinity.garen >= 15 and affinity.elvera >= 15"
  lines:
    - "교무동 복도. 해 질 녘이라 복도 끝 창이 주황색으로 타오른다."
    - "과제를 내러 교수실 앞을 지나는데, 반쯤 열린 교수 휴게실 문틈으로 낮은 목소리가 새어 나온다."
    - "찻잔 부딪는 소리. 그리고 익숙한 두 목소리."
    - 속마음: "(엘베라 교수와… 가렌 교관?)"
    - "발이 저절로 멈췄다."
    - 속마음: "(엿듣는 건 나쁜 짓이다. 원작에선 '엿듣기' 선택지에 꼬박꼬박 보상이 붙어 있었지만.)"
    - 엘베라: "올해 또 성검이 반응했죠. 20년 만에."
    - 가렌: "…알고 있다."
    - 엘베라: "괜찮아요? 요즘 잠을 못 자는 얼굴이던데요."
    - "대답이 없었다. 찻잔이 내려놓이는 소리."
    - 가렌: "이번엔 다르다. 다르게 할 거다."
    - "목검을 쥐는 손처럼, 단단하게 쥔 목소리였다."
    - 엘베라: "다르길 바라요."
    - 엘베라@슬픔: "저는 이 장면을 너무 많이 봤거든요."
    - 속마음: "(너무 많이…? 오백 년을 산 엘프라서? 아니면──)"
    - "복도 끝에서 누군가의 발소리가 다가온다. 오래 서 있을 수는 없다."
  choices:
    - text: 발소리를 죽이고 돌아선다
      lines:
        - "숨을 죽이고 한 걸음 물러섰다. 또 한 걸음."
      check:
        type: 은밀
        dc: 쉬움
        mods:
          - { when: "fatigue >= 70", value: -2, label: 피로 }
      success:
        lines:
          - "복도 모퉁이를 돌고 나서야 숨을 내쉬었다. 심장이 시끄러웠다."
          - "들은 건 들은 대로 남는다. 머릿속 노트 한쪽에 적어 두었다."
          - "── 20년 전, 성검. 가렌. '이번엔 다르게.'"
          - "── 엘베라. '이 장면을 너무 많이 봤다.'"
          - "뒤에서 휴게실 문이 조용히 닫히는 소리가 났다. 누군가 문틈을 확인한 것처럼."
          - 속마음: "(원작 공략 노트엔 없던 줄이다. 이 세계는 원작보다 많은 걸 숨기고 있다.)"
        effects: ["stat.지성 += 0.5"]
      fail:
        lines:
          - "세 번째 걸음에서 마룻바닥이 길게 울었다. 끼이익."
          - "휴게실 안의 목소리가 뚝 끊겼다."
          - "문이 열렸다. 엘베라가 찻잔을 든 채 고개를 내밀었다."
          - 엘베라@웃음: "어머, 학생. 과제 내러 왔어요? 교수실은 저쪽이에요."
          - 나@당황: "아, 네, 네! 저쪽이요."
          - "엘베라 어깨 너머로 가렌이 보였다. 찻잔을 든 채, 나를 똑바로 보고 있었다."
          - "아무 말도 하지 않았다. 그게 더 무서웠다."
          - 속마음: "(원작엔 엿듣기 실패 패널티가 없었다. 여기선 가렌의 눈빛이 패널티다.)"
        effects: ["stress += 5", "affinity.elvera += 1"]
      great:
        lines:
          - "모퉁이 너머로 발소리의 주인이 지나갔다. 사서 노인이었다."
          - "노인은 휴게실 문 앞에서 아주 잠깐 멈췄다가, 나 있는 쪽은 보지도 않고 지나갔다."
          - "지팡이 소리가 나지 않았다. 지팡이를 짚고 있었는데도."
          - 속마음: "(못 본 척해 준 걸까. 아니면 처음부터 다 알고 있었던 걸까.)"
        effects: ["stat.지성 += 0.5"]
    - text: 문을 두드린다
      effects: ["affinity.garen += 3", "affinity.elvera += 3"]
      lines:
        - "똑, 똑."
        - "대화가 뚝 끊겼다."
        - "문이 열리고, 엘베라가 아무 일 없다는 듯 웃는다."
        - 엘베라@웃음: "어머, 학생. 과제 질문이에요? 마침 가렌 교관님도 계시니 둘 다 물어봐요."
        - 가렌: "……"
        - "가렌은 찻잔만 내려다봤다. 아무 일 없었다는 얼굴이, 엘베라보다 한참 서툴렀다."
        - "질문 두 개를 하고, 대답 두 개를 들었다. 둘 다 아주 친절한 대답이었다."
        - 엘베라@웃음: "또 와요. 차는 늘 있어요."
        - when: "talent.눈치없음"
          속마음: "(…둘 다 친절했다. 뭔가 중요한 걸 놓친 것 같은데, 그게 뭔지 모르겠다.)"
        - 속마음: "(친절할수록 문은 더 단단히 닫힌다. 원작의 교수들이 이렇게 연기를 잘했었나.)"
    - text: 모퉁이 그림자에 붙어 끝까지 듣는다 (짐승의 혈통 · 키 작음 · 그림자)
      when: "talent.짐승의혈통 or talent.키작음 or synergy.그림자 >= 1"
      lines:
        - "물러서는 대신, 복도 모퉁이의 기둥 그림자에 등을 붙였다."
        - "숨을 낮췄다. 귀가 저절로 문 쪽으로 기울었다."
        - 속마음:
            - "(발소리가 지나갈 때까지 그림자가 되면 된다. 들키지 않는 건 내 특기다.)"
            - { when: "talent.키작음", text: "(기둥 그림자 하나에 몸이 통째로 들어간다. 키가 작아서 좋은 날도 있다.)" }
            - { when: "talent.짐승의혈통", text: "(이 몸의 귀는 사람 귀보다 멀리 듣는다. 원작에선 '청각 판정 +' 한 줄이었지.)" }
      check:
        type: 은밀
        dc: 보통
      success:
        lines:
          - "발소리가 바로 옆을 지나갔다. 사서 노인이었다. 지팡이를 짚었는데, 지팡이 소리가 없다."
          - "노인은 휴게실 문 앞에서 아주 잠깐 멈췄다가, 그냥 지나갔다."
          - "다시 목소리가 들렸다. 아까보다 낮게."
          - 가렌: "…그 노인네도 알고 있나."
          - 엘베라: "저보다 오래 봤을 거예요. 훨씬."
          - "찻잔이 내려놓이는 소리. 그리고 의자 끄는 소리."
          - 속마음: "(엘베라보다 오래. 오백 년보다 오래. …사서는 대체 몇 살이지.)"
          - "문이 열리기 전에, 그림자를 타고 계단 쪽으로 빠져나왔다."
        effects: ["stat.지성 += 1"]
      fail:
        lines:
          - "발소리가 가까워졌다. 그림자에 더 바짝 붙었다."
          - "그 순간 소매가 기둥의 못에 걸렸다. 찌익."
          - "발소리가 멈췄다. 지팡이 끝이 내 발치에서 톡, 하고 바닥을 쳤다."
          - 사서: "엿듣는 데는 소질이 있는데, 옷이 따라가질 못하는군."
          - "노인이 아무렇지 않게 휴게실 문을 두드렸다. 안의 목소리가 뚝 끊겼다."
          - 사서: "교수님들, 반납 기한이 한참 지난 책이 있소만."
          - "그 틈에 계단 쪽으로 빠져나왔다. 노인이 나를 가려 준 건지, 정말 책 이야기를 하러 온 건지 알 수 없었다."
          - 속마음: "(찢어진 소매만 남았다. 그리고 '소질이 있다'는 말도.)"
        effects: ["stat.지성 += 0.5"]

# ================================================================ 동아리 — 원예부 (온실)

- id: club_green_mandrake
  title: 맨드레이크 분갈이
  on: 온실
  pool: true
  lines:
    - "방과 후의 온실. 유리 지붕 아래 공기가 축축하고 따뜻하다."
    - "흙냄새, 물 냄새, 어디선가 달큰한 꽃가루 냄새. 들어서자마자 재채기가 났다."
    - "원예부장 선배가 귀마개 세 쌍을 작업대에 늘어놓았다."
    - "4학년인데, 늘 흙 묻은 앞치마 차림이라 다들 학년을 자주 잊는다. 오늘은 코끝에도 흙이 묻어 있다."
    - 원예부장: "오늘은 맨드레이크 분갈이."
    - 원예부장@진지: "뽑을 때 비명 지르니까 귀마개 꼭 해. 작년 신입은 이틀 누워 있었어."
    - "화분 셋. 흙 위로 쭈글쭈글한 잎사귀가 삐죽 나와 있다. 왠지 이쪽을 째려보는 것 같다."
    - 리아나: "숲에서는 노래 불러 주면서 뽑았는데…"
    - 원예부장: "그건 엘프 얘기고."
    - 리아나@웃음: "저 반은 엘프인데요?"
    - 원예부장: "그럼 반만 불러."
    - 속마음: "(원예부. 원작에선 리아나 호감도 작업용 동아리였다. …이렇게 시끄러운 곳인 줄은 몰랐다.)"
  choices:
    - text: 귀마개를 단단히 하고 뽑는다
      check:
        type: 인내
        dc: 쉬움
        mods:
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      success:
        lines:
          - "귀마개를 단단히 눌러 썼다. 세상이 먹먹해졌다."
          - "잎사귀를 쥐고, 하나, 둘, 셋."
          - "흙 속에서 주름진 얼굴이 튀어나와 입을 쩍 벌렸다."
          - "귀마개 너머로도 머리가 울린다. 이가 덜덜 떨렸다. 버텼다."
          - 원예부장@놀람: "오, 신입치고 안 쓰러졌네. 합격."
          - 리아나@웃음: "대단해! 나 처음엔 울었는데."
        effects: ["stat.의지 += 0.5", "affinity.liana += 2"]
      fail:
        lines:
          - "귀마개를 썼다. 잘 쓴 줄 알았다."
          - "잎사귀를 쥐고 당기는 순간──"
          - "비명이 귀마개를 뚫고 들어왔다."
          - "눈을 떠 보니 온실 천장이 보이고, 리아나가 부채질을 하고 있다."
          - 리아나@당황: "괜찮아? 삼십 초 기절했어."
          - 리아나@웃음: "작년 선배보다는 짧대. 기록 좋은 거래!"
          - 속마음: "(그게… 위로 맞나?)"
        effects: ["affinity.liana += 3", "fatigue += 10"]
      great:
        lines:
          - "비명이 끝나자 맨드레이크가 기운이 빠진 듯 축 늘어졌다. 그대로 새 화분에 쏙 들어갔다."
          - 원예부장@웃음: "한 번에 옮겼어? 너 오늘부터 맨드레이크 담당."
          - 속마음: "(원작에 없던 직함이 생겼다. 맨드레이크 담당. 명함에 넣을 수는 없겠지.)"
        effects: ["affinity.liana += 1", "stat.체질 += 0.5"]
    - text: 리아나와 같이 노래를 불러 주며 뽑는다
      requires: "affinity.liana >= 15 or talent.자연친화력"
      lines:
        - 리아나@웃음: "같이 불러 볼래? 가락만 따라 하면 돼."
        - "리아나가 엘프어로 낮게 흥얼거렸다. 따라 불렀다."
        - "가사는 모르지만 가락은 금방 몸에 익는다. 바람이 풀숲을 쓰다듬는 소리 같은 노래."
      check:
        type: 교감
        dc: 쉬움
        mods:
          - { when: "affinity.liana >= 30", value: 2, label: 리아나와 화음 }
          - { when: "origin == '숲고아'", value: 2, label: 숲의 노래 }
      success:
        lines:
          - 나레이션:
              - "맨드레이크가 흙 밖으로 나오더니… 하품을 했다. 비명 대신."
              - { when: "talent.음치", text: "내가 따라 부르자 맨드레이크가 도로 흙 속으로 파고들었다. 리아나가 웃다가 주저앉았다. 결국 리아나 혼자 불렀다." }
          - 원예부장@놀람: "……이거 논문 써도 되냐?"
          - 리아나@웃음: "봐, 숲에서는 이렇게 한다니까."
          - "리아나가 맨드레이크 뿌리의 흙을 털어 주며 작게 속삭였다. 잘 잤어? 이사 가자."
          - 속마음: "(원작 미니게임엔 '노래하기' 버튼이 없었다. 있었으면 기절로 날린 시간이 백 시간은 줄었을 텐데.)"
        effects: ["affinity.liana += 6", "trust.liana += 2"]
      fail:
        lines:
          - "맨드레이크가 흙 밖으로 반쯤 나오더니, 내 쪽을 보고 눈을 가늘게 떴다."
          - "그리고 입을 벌렸다. 비명의 절반쯤 되는 소리가 터졌다."
          - "머릿속이 띵 울렸다. 무릎이 휘청했다."
          - "그 순간 차가운 손바닥 두 개가 내 귀를 덮었다. 리아나였다."
          - 리아나@당황: "괜찮아? 얘가 아직 너를 몰라서 그래. 낯가림이야."
          - "리아나가 한쪽 손으로 내 귀를 막은 채, 남은 손으로 맨드레이크 잎을 쓰다듬었다."
          - "노래가 다시 이어지자, 맨드레이크가 마지못해 하품을 했다."
          - 원예부장: "…반은 성공. 반은 논문 감."
          - 속마음: "(귀가 아직 멍하다. 그런데 리아나 손이 닿았던 자리만, 이상하게 따뜻하다.)"
        effects: ["affinity.liana += 4", "fatigue += 5"]
    - text: 귀마개 없이 뽑아 본다 (원작에선 그냥 채집 아이템이었다)
      lines:
        - "귀마개를 집으려다, 손을 멈췄다."
        - 속마음: "(원작에서 맨드레이크는 클릭 한 번이면 끝나는 채집물이었다. 비명 같은 건──)"
        - 원예부장@당황: "야, 신입, 귀마개──"
        - "──있었다."
      check:
        type: 인내
        dc: 어려움
        mods:
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      success:
        lines:
          - "비명이 온몸을 때렸다. 이가 덜덜 떨리고, 시야 가장자리가 하얗게 번졌다."
          - "그런데 무릎이 꺾이지 않았다."
          - "뽑아 든 맨드레이크가 숨이 찬 듯 입을 다물었다. 비명이 먼저 지쳤다."
          - 원예부장@놀람: "……서 있어? 귀마개 없이?"
          - 리아나@놀람: "말도 안 돼…"
          - "오른쪽 귀에서 삐── 소리가 났다. 한동안 아무것도 들리지 않았다."
          - 원예부장: "…신입. 그래도 다음부턴 귀마개 써. 기록 깨지 말고."
          - 속마음: "(원작에선 클릭 한 번. 여기선 이 악물기 한 번. 그래도 버텼다.)"
        effects: ["stat.의지 += 1", "fatigue += 10", "affinity.liana += 2"]
      fail:
        lines:
          - "세상이 하얘졌다."
          - "정신을 차렸을 땐 리아나가 젖은 수건을 내 이마에 올려 주고 있었다."
          - 리아나@슬픔: "바보. 왜 그랬어…"
          - 원예부장: "신입. 다음부턴 선배 말 들어."
          - "귀에서 아직도 삐── 소리가 난다. 이 세계엔 클릭 한 번으로 끝나는 게 하나도 없다."
          - 속마음: "(작년 신입은 이틀 누워 있었다고 했다. 경고는 들었다. 들었는데.)"
        effects: ["fatigue += 15", "stress += 5", "affinity.liana += 2"]
      fumble:
        lines:
          - "리아나 말로는 꼬박 한 시간을 누워 있었다고 한다."
          - "그날 저녁까지 오른쪽 귀가 들리지 않았다."
          - "식당에서 누가 세 번이나 내 이름을 불렀다는데, 한 번도 듣지 못했다."
          - 속마음: "(한 시간. 작년 신입보다는 짧다. …위로가 안 된다.)"
        effects: ["fatigue += 10"]

- id: club_green_night
  title: 밤의 온실
  on: 온실
  pool: true
  repeat: 2
  cooldown: 3
  slots: [밤]
  when: "affinity.liana >= 10"
  lines:
    - "밤의 온실. 문을 열자 낮보다 서늘한 공기가 얼굴에 닿았다."
    - "유리 지붕 너머로 달빛이 쏟아진다. 화분들 사이로 은빛 길이 났다."
    - "벌레 우는 소리, 물방울 떨어지는 소리. 낮에는 들리지 않던 소리들."
    - "리아나가 맨 안쪽 화단 앞에 쪼그려 앉아 있다. 등잔도 켜지 않고."
    - 리아나@웃음: "쉿. 왔어? 이리 와, 지금이야."
    - "낮에는 꼭 닫혀 있던 하얀 꽃봉오리들이 하나둘 벌어지고 있다."
    - "아주 천천히. 보고 있으면 안 움직이는 것 같고, 눈을 깜빡이면 조금 열려 있다."
    - 리아나: "달맞이꽃이야. 밤에만 펴. 낮에만 오는 사람들은 이 꽃이 피는 줄도 몰라."
    - 리아나:
        - "…좀 나 같지 않아? 아, 아니다. 이상한 소리 했다."
        - { when: "affinity.liana >= 30", text: "너는 밤에 와서 다행이다. 낮에만 왔으면 이 꽃, 못 봤을 거야." }
    - "리아나가 무릎을 끌어안았다. 달빛에 옆얼굴이 하얗다."
    - 속마음: "(아무도 모르게 피었다 지는 꽃. 그 꽃 앞에 쪼그려 앉은 리아나를 보니, 이상하게 목이 막혔다.)"
  choices:
    - text: "\"밤에 피는 꽃도 꽃이야\""
      effects: ["affinity.liana += 5"]
      lines:
        - 나: "밤에 피는 꽃도 꽃이야."
        - 나: "보는 사람이 적다고 덜 예쁜 거 아니잖아."
        - "리아나가 눈을 동그랗게 떴다. 그리고 천천히, 무릎에 턱을 묻었다."
        - 리아나@웃음: "…응. 고마워."
        - "리아나가 고개를 숙였다. 달빛에 귀 끝이 반쯤 투명하게 빛났다."
        - when: "talent.달변"
          속마음: "(입에 발린 말은 잘한다. 그런데 이 말은 다듬지도 않았는데 나왔다.)"
        - 리아나@당황: "너 가끔 그런 말 아무렇지 않게 한다. 반칙이야."
        - 속마음: "(반칙인 건 나다. 진심인데도, 이게 원작의 '정답 선택지'였다는 걸 기억하고 있으니까.)"
    - text: 말없이 꽃이 피는 걸 같이 본다
      effects: ["affinity.liana += 4", "stress -= 10"]
      lines:
        - "말없이 옆에 쪼그려 앉았다."
        - "꽃잎 하나가 펼쳐지는 데 백 번쯤 숨을 쉬었다."
        - "리아나는 그 백 번을 같이 셌다. 작게, 입 모양으로만."
        - "백 번째 숨에, 꽃이 다 폈다."
        - 리아나@웃음: "…다 폈다."
        - "그 한마디가 이상하게 오래 남았다. 온실을 나와서도, 기숙사 침대에 누워서도."
    - text: 꽃잎 하나를 말려 책갈피를 만들자고 한다
      when: "fired.bond_liana_2"
      effects: ["affinity.liana += 6", "trust.liana += 3"]
      lines:
        - 나: "꽃잎 하나, 말려서 책갈피 만들까?"
        - 리아나@놀람: "어? …응, 좋아!"
        - "리아나가 떨어진 꽃잎 하나를 손바닥에 조심스럽게 올렸다. 상처 하나 없는 걸로 골랐다."
        - 리아나: "내 월광초 책갈피 옆에 둘래."
        - 리아나@웃음: "두 장이면 덜 외롭겠다."
        - "책갈피 얘기였다. 분명히 책갈피 얘기였을 것이다."
        - 속마음: "(엄마가 돌아가신 해 가을에 딴 마지막 월광초. 그 옆자리를, 리아나가 내줬다.)"
    - text: 달맞이꽃에게 작게 말을 걸어 본다 (자연 친화력)
      when: "talent.자연친화력"
      lines:
        - "리아나 옆에 쪼그려 앉아, 제일 늦게 벌어지는 봉오리에 얼굴을 가까이 댔다."
        - 나: "(작게) …천천히 해도 돼. 기다릴게."
        - 리아나@놀람: "어? 너도 그거 해? 숲에서는 다들 그렇게 하는데."
        - 속마음: "(자연 친화력. 원작에선 '정령·동물 호감도 +'였다. 꽃도 포함인지는 위키에 없었다.)"
      check:
        type: 교감
        dc: 쉬움
        mods:
          - { when: "affinity.liana >= 30", value: 2, label: 리아나와 함께 }
      success:
        lines:
          - "봉오리가 움찔했다. 그리고 다른 꽃들보다 빠르게, 한 장 한 장 펼쳐졌다."
          - "꽃잎 안쪽에서 희미한 빛이 새어 나왔다. 반딧불 같은, 아주 옅은 은빛."
          - 리아나@놀람: "…빛나. 달맞이꽃이 빛나는 건, 숲에서도 정령이 곁에 있을 때뿐인데."
          - "리아나가 손가락으로 빛을 가만히 건드렸다. 빛이 그녀의 손끝으로 옮겨 앉았다."
          - 리아나@웃음: "엄마가 그랬어. 꽃이 먼저 말을 거는 사람은, 숲이 기억해 둔 사람이래."
          - 리아나: "너, 숲이 기억해 둔 사람인가 봐."
          - 속마음: "(이 세계의 숲은, 나를 어떻게 알고 있는 걸까.)"
        effects: ["affinity.liana += 6", "trust.liana += 3", "stress -= 10"]
      fail:
        lines:
          - "봉오리는 꿈쩍도 하지 않았다. 오히려 조금 더 꼭 다문 것 같았다."
          - 리아나@웃음: "부끄럼 타나 봐. 처음 보는 사람이라서."
          - "리아나가 봉오리 옆에 대고 엘프어로 뭐라고 속삭였다. 그제야 꽃잎 하나가 벌어졌다."
          - 리아나: "내 친구라고 소개해 줬어. 다음엔 너한테도 열어 줄 거야."
          - "꽃잎이 벌어지는 걸 보며, 리아나가 무릎에 턱을 괴고 웃었다."
          - 속마음: "(꽃한테 소개를 받았다. 3,000시간 동안 해 본 적 없는 종류의 퀘스트다.)"
        effects: ["affinity.liana += 4", "stress -= 5"]

- id: club_green_wheat
  title: 원예부장의 밀
  on: 온실
  pool: true
  when: "time.month >= 4"
  effects: ["club.green_seed = 1"]
  lines:
    - "온실 맨 안쪽. 유리창에 금이 가서 종이로 덧대 놓은 구석이 있다."
    - "아무도 손대지 않는 화단이다. 다른 화단엔 꽃이 피는데, 여기만 맨흙에 가는 초록 싹이 줄지어 있다."
    - "원예부장이 쪼그려 앉아 밀싹에 물을 주고 있다. 물뿌리개가 아니라 작은 컵으로, 한 줄기씩."
    - 원예부장@웃음: "아, 이거? 내 졸업 작품."
    - 원예부장: "마나를 거의 안 먹고도 자라는 밀이야."
    - "흙을 만져 보았다. 다른 화단 흙과 다르다. 푸석하고, 차갑다. 마나 비료를 하나도 안 줬다고 했다."
    - 원예부장: "다들 쓸데없대. 마나가 넘쳐나는 세상에 왜 그런 걸 만드냐고."
    - 원예부장: "지도 교수님도 그러셨어. '자네, 졸업은 하고 싶은가?'"
    - 원예부장@진지: "근데 할머니가 그랬거든. 땅이 지치는 해가 온다고. 그땐 이런 게 필요할 거라고."
    - 원예부장: "할머니네 할머니도 그랬대. 그 할머니네 할머니도."
    - 속마음: "(7년차. 세계수가 말라 죽고 대륙의 마나 농도가 떨어진다. 원작에선 기근 이벤트가 연달아 터졌다.)"
    - 속마음: "(원작엔 이 선배 이름조차 없었다. 그런데 지금, 멸망 하나를 미리 준비하고 있다.)"
    - "선배가 컵에 남은 물을 마지막 싹에 붓고 일어섰다. 무릎에서 뚝 소리가 났다."
  choices:
    - text: 교배 기록 정리를 돕는다
      check:
        type: 학식
        dc: 쉬움
        mods:
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      success:
        lines:
          - 원예부장: "기록 정리 좀 도와줄래? 삼 년 치가 이 꼴이야."
          - "상자 하나 가득 쪽지가 쏟아졌다. 날짜, 화분 번호, 싹 높이, 그리고 커피 얼룩."
          - "삼 년 치 기록을 표로 정리했다."
          - "마나를 덜 먹는 쪽으로 이어지는 줄기가 한눈에 보인다. 2년 차의 7번 화분, 거기서부터다."
          - 원예부장@놀람: "…너 원예부 말고 연금과 가라. 아니, 가지 마. 여기 있어."
          - 속마음: "(엑셀이 있었으면 십 분이면 끝났을 거다. 엑셀 없는 세계에서 사무 노동 경력이 빛을 볼 줄이야.)"
        effects: ["stat.지성 += 0.5"]
      fail:
        lines:
          - 원예부장: "기록 정리 좀 도와줄래? 삼 년 치가 이 꼴이야."
          - "상자 하나 가득 쪽지가 쏟아졌다. 날짜, 화분 번호, 싹 높이."
          - "기록을 정리하다 두 장을 뒤섞었다. 2년 차 3번 화분과 3년 차 2번 화분."
          - "원예부장이 한숨을 쉬며 다시 나눴다. 쪽지 귀퉁이의 커피 얼룩만 보고 단번에."
          - 원예부장: "괜찮아. 나도 첫해엔 씨앗 반을 쏟았어."
          - 원예부장@웃음: "그 반이 저기 화단 밖에서 잡초처럼 자라고 있어. 걔네가 제일 튼튼해."
          - 속마음: "(제일 튼튼한 건 쏟아진 씨앗이었다. 실수도 기록해 둘 가치가 있다는 뜻일까.)"
        effects: ["stress -= 3"]
      great:
        lines:
          - "표를 다 그리고 나서야 보였다. 7번 화분 줄기의 싹 높이가, 해마다 달 모양을 따라 오르내린다."
          - 원예부장@놀람: "…보름에 심은 것만 살아남았다고? 삼 년 동안 그걸 못 봤네."
          - "선배가 내 이름을 기록장 맨 앞장, 자기 이름 바로 아래에 적었다. ── 공동 기록자."
        effects: ["stat.지성 += 0.5"]
    - text: "\"선배, 그거 꼭 완성하세요\""
      effects: ["stat.의지 += 0.5", "stress -= 5"]
      lines:
        - 나: "선배, 그거 꼭 완성하세요."
        - "생각보다 목소리가 진지하게 나왔다."
        - 원예부장@놀람: "…뭐야, 진지하게. 다들 웃던데."
        - 나: "웃을 일이 아니에요. 정말로, 필요해질 거예요."
        - when: "origin == '숲고아'"
          나: "숲에서도 그랬어요. 땅이 지친 해엔, 덜 먹고도 버티는 풀만 살아남았어요."
        - "선배가 나를 한참 봤다. 흙 묻은 손으로 코를 문지르는 바람에 얼굴에 흙이 더 묻었다."
        - 원예부장@웃음: "알았어. 너 하나 믿고 해 볼게."
        - 속마음: "(7년 뒤 이 밀 한 줌이 몇 명을 살릴까. 계산하려다 그만뒀다. 숫자로 셀 일이 아니다.)"

- id: club_green_harvest
  title: 첫 이삭
  on: 온실
  pool: true
  when: "club.green_seed and time.month >= 6"
  lines:
    - "장마 사이로 해가 잠깐 난 오후. 온실 유리에 맺힌 물방울이 반짝인다."
    - "리아나와 화분 물받이를 갈고 있는데, 온실 문이 벌컥 열렸다."
    - "원예부장이 뛰어 들어왔다. 장화에서 흙탕물이 튀었다."
    - "손에 작은 이삭 하나를 쥐고, 높이 치켜든 채로."
    - 원예부장@웃음: "나왔어! 마나 거의 안 준 화단에서! 봐, 알이 찼어!"
    - "이삭은 손가락 한 마디만 했다. 그런데 정말로 알이 차 있었다. 작고 단단한 금빛 알갱이 열두 개."
    - "리아나가 박수를 쳤다. 이삭 하나에 셋이서 한참 호들갑을 떨었다."
    - 리아나@놀람: "숲에서도 이런 건 못 봤어. 땅한테 덜 기대는 식물이라니."
    - 리아나: "숲의 나무들은 다 서로 기대서 자라거든. 다들 그게 당연한 줄 알아."
    - 원예부장: "삼 년 걸렸어. 삼 년. 열두 알 얻는 데."
    - 속마음: "(열두 알. 7년 뒤의 기근에 비하면 아무것도 아니다. 그래도, 0이 아니다.)"
  choices:
    - text: 씨앗을 조금 나눠 달라고 한다
      effects: ["affinity.liana += 3", "stat.지성 += 0.5"]
      lines:
        - 나: "선배, 씨앗 조금만 나눠 주실 수 있어요?"
        - 원예부장: "가져가."
        - "망설임도 없이, 앞치마 주머니에서 작은 천 주머니를 꺼냈다. 작년 시험 화단에서 받아 둔 씨앗이었다."
        - 원예부장: "대신 어디 심었는지 꼭 적어 둬. 졸업하고 나면 너희가 이어 가야 하니까."
        - when: "talent.완전기억"
          속마음: "(적을 필요도 없다. 어디에 심었는지, 이 몸은 잊지 않는다.)"
        - "주머니는 가벼웠다. 손바닥에 올리니 무게가 거의 없었다."
        - 속마음: "(작은 주머니 하나. 7년 뒤를 위한 첫 번째 보험이다.)"
        - 속마음: "(원작 인벤토리 어디에도 없던 아이템이다. 이건 이 세계가 직접 준 거다.)"
    - text: 리아나에게 이삭을 건넨다
      effects: ["affinity.liana += 5", "trust.liana += 2"]
      lines:
        - "원예부장이 잠깐 들고 있으라며 이삭을 내 손에 쥐여 줬다."
        - "그 이삭을 그대로 리아나에게 건넸다."
        - 리아나@놀람: "나한테? …고마워."
        - "리아나가 이삭을 두 손으로 받았다. 작은 새를 받아 드는 것처럼."
        - when: "talent.자연친화력"
          나레이션: "바람도 없는데, 리아나 손바닥 위의 이삭이 살랑 흔들렸다. 인사하는 것처럼."
        - 리아나: "숲에 편지 보낼 때 같이 넣어야지."
        - 리아나@웃음: "엄마 친구들이 깜짝 놀랄 거야. 인간 아카데미에서 이런 걸 만들었다고."
        - 원예부장@당황: "어, 어? 그거 올해 첫… 아, 아니야. 숲이면 됐어. 숲이면 좋지."

# ================================================================ 동아리 — 검술부

- id: club_sword_thousand
  title: 천 번 내려베기
  art: sword_club
  on: 검술부
  pool: true
  repeat: 2
  cooldown: 3
  lines:
    - "검술부 연습장. 오후 햇살에 흙바닥이 하얗게 말라 있다."
    - "목검 부딪는 소리, 기합 소리, 누군가 넘어지며 내는 신음 소리."
    - "땀 냄새와 가죽 장갑 냄새가 섞여 코를 찌른다."
    - 검술부장: "신입은 오늘 천 번이다. 내려베기 천 번. 세는 건 각자 양심에 맡긴다."
    - 나레이션:
        - "4학년 검술부장은 말이 짧고 목소리가 낮다. 졸업하면 기사단에 들어간다고 했다."
        - { when: "fired.club_sword_thousand >= 2", text: "또 천 번이다. 지난번보다 팔이 덜 떨린다. 아마도." }
    - "줄지어 서서 목검을 들었다. 하나, 둘, 셋."
    - "백 번까지는 괜찮았다. 삼백 번쯤에서 어깨가 뜨거워졌다."
    - "오백 번쯤에서 팔이 떨리기 시작했다. 옆에서 카이든은 숫자를 세지도 않고 휘두르고 있다."
    - "같은 높이, 같은 속도. 지친 기색도 없다. 목검이 아니라 시계추 같다."
    - 속마음: "(원작에선 '훈련' 버튼 한 번에 근력 +1이었다. 그 +1이, 이거였다.)"
    - "육백. 팔이 내 팔 같지 않다. 손바닥이 화끈거린다."
  check:
    type: 인내
    dc: 보통
    mods:
      - { when: "fired.club_sword_thousand >= 2", value: 2, label: 익숙해진 팔 }
      - { when: "fatigue >= 70", value: -3, label: 피로 }
  success:
    lines:
      - "팔백. 숫자 세는 것도 잊었다. 목검이 혼자 올라가고 혼자 내려온다."
      - "구백. 숨소리와 목검 소리가 하나가 됐다."
      - "천 번째에 목검을 내렸다. 손바닥 물집이 터졌다."
      - "다리가 풀려 주저앉았다. 하늘이 노랗다."
      - 검술부장: "세다가 틀렸지. 천 열두 번이었다. 나도 셌다."
      - "부장이 물통을 내 앞에 툭 놓고 갔다. 다른 신입들 앞엔 없었다."
      - 속마음: "(열두 번 더. 손해 본 기분인데, 이상하게 뿌듯하다.)"
    effects: ["stat.근력 += 1", "stat.의지 += 0.5", "reputation += 2"]
  fail:
    lines:
      - "칠백 번째쯤에 목검이 손에서 빠졌다."
      - "땀에 젖은 손잡이가 미끄러진 거다. 목검이 데구루루 굴러 카이든 발치에서 멈췄다."
      - "주워 들고 끝까지 했다. 숫자는… 아마 천 번쯤."
      - 카이든: "구백팔십일. 열아홉 개 모자란다."
      - "카이든이 셌다. 내 걸."
      - 나@당황: "…네 것도 하면서 내 걸 셌어?"
      - 카이든: "내 건 안 셌다. 셀 필요가 없으니까."
    effects: ["affinity.kaiden += 2", "stat.체질 += 0.5", "fatigue += 10"]
  great:
    lines:
      - "부장이 지나가다 멈춰 서서, 내 목검 손잡이를 내려다봤다. 감아 둔 천이 피와 땀으로 젖어 있었다."
      - "부장이 말없이 자기 허리춤에서 새 천을 풀어, 손잡이에 감아 주었다."
      - 검술부장: "다음 천 번은 이걸로 해라. 손이 아니라 검이 닳게."
      - 속마음: "(원작이었다면 '낡은 손잡이 천'이라는 아이템으로 떴겠지. 여기선 그냥, 선물이다.)"
    effects: ["stat.근력 += 0.5"]

