      lines:
        - "에드릭 옆에 섰다. 아무 말도 하지 않았다."
        - "대신 연습장 안쪽, 킥킥대던 얼굴들을 하나씩 천천히 봤다."
        - 속마음: "(원작 악역 전용 커맨드, '노려보기'. 이걸 에드릭을 위해 쓰게 될 줄은.)"
      check:
        type: 위압
        dc: 보통
      success:
        lines:
          - "웃음소리가 하나씩 꺼졌다. 마지막 하나는 기침으로 바뀌었다."
          - "선배가 헛기침을 하며 신청서를 받아 들었다."
          - 선배: "…뭐, 미궁에서 살아 나왔으면 근성은 있겠지. 내일부터 나와."
          - 에드릭@놀람: "……"
          - "연습장으로 들어가기 전, 에드릭이 나를 힐끔 봤다."
          - 에드릭: "너, 그 눈빛. 우리 아버지보다 무섭다."
          - 에드릭@웃음: "…다음에 나도 가르쳐 줘."
          - 속마음: "(벨모어가 도련님이 처음으로 웃었다. 노려보기 커맨드의 보상치고는 과분하다.)"
        effects: ["affinity.edric += 6", "trust.edric += 5"]
      fail:
        lines:
          - "노려봤다. 선배 하나가 마주 노려봤다. 그리고 웃음을 터뜨렸다."
          - 선배: "뭐야, 보디가드야? 벨모어가는 돈 많다더니 사람도 사냐?"
          - "연습장에 웃음이 더 크게 번졌다. 얼굴이 화끈거렸다."
          - "에드릭이 내 소매를 잡아당겼다."
          - 에드릭: "됐어. …내가 할게."
          - "그가 신청서를 다시 내밀었다. 손이 떨렸지만, 끝까지 거두지 않았다."
          - 선배: "…쳇. 내일부터 바닥 청소다."
          - 속마음: "(내가 실패한 자리에서 에드릭이 버텼다. 어쩌면 이게 더 나은 결말일지도.)"
        effects: ["affinity.edric += 4", "trust.edric += 3", "stat.의지 += 0.5"]

- id: club_sword_rain
  title: 빗속의 연습
  art: cg_sword_rain
  on: 검술부
  pool: true
  chance: 0.6
  when: "time.month >= 5"
  lines:
    - "연습 도중, 하늘이 갑자기 어두워졌다."
    - "후두둑. 첫 빗방울이 흙바닥에 동전만 한 자국을 냈다. 그리고 곧, 쏟아졌다."
    - "소나기. 다들 처마 밑으로 뛰어갔다."
    - "그런데 검술부장은 연습장 한가운데서 움직이지 않는다. 빗물이 턱 끝에서 줄줄 흐른다."
    - 검술부장: "전장에선 비 온다고 안 쉰다. 남을 놈은 남아."
    - "처마 밑에서 신입들이 서로 눈치를 봤다. 젖은 셔츠가 등에 달라붙는다."
    - "하나, 둘. 빗속으로 다시 걸어 나간다."
    - "절반이 남았다. 카이든은 당연하다는 듯 그 절반에 서 있다. 처마 밑에는 온 적도 없는 얼굴로."
    - 속마음: "(원작에서 날씨는 그냥 배경 그림이었다. 비 오는 날 훈련해도 수치는 똑같았지.)"
    - 속마음: "(…여기선 비가 차갑다.)"
  choices:
    - text: 빗속에 남는다
      check:
        type: 기민
        dc: 보통
        mods:
          - { when: "origin == '숲고아'", value: 2, label: 젖은 땅 }
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      success:
        lines:
          - "빗속으로 나갔다. 셔츠가 한순간에 무거워졌다."
          - "첫 합에 발이 미끄러졌다. 두 번째도."
          - "세 번째부터 알았다. 버티면 넘어진다."
          - "젖은 흙에 발이 미끄러지는 감각을 익혔다. 미끄러지는 쪽으로 같이 흘러가면, 넘어지지 않는다."
          - "물보라 속에서 카이든의 목검을 흘려 냈다."
          - 카이든: "나쁘지 않군. 비 오는 날엔 너랑 하지."
          - 속마음: "(비 오는 날 전용 대련 상대. 카이든식 친구 신청… 인가?)"
        effects: ["stat.민첩 += 1", "affinity.kaiden += 2"]
      fail:
        lines:
          - "빗속으로 나갔다. 셔츠가 한순간에 무거워졌다."
          - "세 번 미끄러졌다. 세 번 다 카이든 앞이었다."
          - "세 번째엔 진흙에 얼굴부터 박았다. 입에서 흙 맛이 났다."
          - "카이든이 내려다봤다. 손은 내밀지 않았다."
          - 카이든: "일어나. 그게 연습이다."
          - "일어났다. 그가 고개를 아주 조금 끄덕였다. 빗소리에 묻힐 만큼 작게."
        effects: ["stat.체질 += 0.5", "affinity.kaiden += 1", "fatigue += 10"]
      great:
        lines:
          - "비가 그칠 무렵, 처마 밑의 부장이 팔짱을 풀었다."
          - 검술부장: "신입. 내일부터 2진 대련에 들어와."
          - "처마 밑의 신입들이 일제히 이쪽을 봤다. 젖은 셔츠가 이상하게 가벼웠다."
        effects: ["reputation += 2"]
    - text: 처마 밑에서 부원들의 발을 관찰한다
      lines:
        - "처마 밑에 남았다. 대신 눈은 연습장에서 떼지 않았다."
        - "젖은 땅은 버릇을 숨기지 못한다."
      check:
        type: 통찰
        dc: 쉬움
        mods:
          - { when: "fired.cls_history_2", value: 2, label: 본 적 있는 버릇 }
      success:
        lines:
          - "누가 어느 발에 체중을 싣는지 훤히 보인다. 미끄러지는 방향이 곧 그 사람의 버릇이다."
          - "부장은 왼발. 3학년 선배는 뒤꿈치. 그리고──"
          - "카이든은 미끄러질 때마다 왼쪽 어깨부터 감쌌다."
          - "넘어질 것 같으면 반사적으로. 머리보다 몸이 먼저 기억하는 방어."
          - 속마음: "(공략 노트에 한 줄이 늘었다. …적으면서도, 이게 친구의 약점이라는 생각에 펜이 무거웠다.)"
        effects: ["stat.지성 += 1", "know.kaiden_shoulder = 1"]
      fail:
        lines:
          - "빗줄기가 굵어졌다. 연습장이 뿌연 커튼 너머로 멀어졌다."
          - "보이는 건 부장의 왼발 하나. 미끄러질 때마다 왼발로 버틴다."
          - "나머지는 다 물보라였다. 누가 누군지도 헷갈렸다."
          - "옆에서 같이 처마 밑에 남은 신입이 중얼거렸다."
          - 동기: "…넌 뭘 그렇게 열심히 봐? 아무것도 안 보이는데."
          - 속마음: "(원작의 '관찰' 커맨드는 날씨를 안 탔다. 여기선 비가 오면 눈도 젖는다.)"
        effects: ["stat.지성 += 0.5"]
    - text: 수건을 챙겨다 준다
      effects: ["stat.매력 += 0.5", "reputation += 1"]
      lines:
        - "기숙사로 뛰어가 수건을 한 아름 안고 왔다."
        - "비가 그칠 무렵, 흠뻑 젖은 부원들에게 하나씩 건넸다."
        - 검술부장: "…신입. 이런 건 매니저가 하는 거다."
        - "부장이 수건을 받아 얼굴을 묻었다. 한참 그러고 있었다."
        - 검술부장: "고맙다."
        - when: "talent.사람좋은얼굴"
          나레이션: "부원 하나가 수건에 얼굴을 묻은 채 중얼거렸다. ─ 너 같은 얼굴이 매니저면, 아무도 안 그만둘 텐데."
        - "카이든도 말없이 하나 가져갔다. 다 쓰고 나서, 반듯하게 개어 돌려줬다."

# ================================================================ 동아리 — 신문부

- id: club_news_poll
  title: 교수님께 묻는다
  on: 신문부
  pool: true
  when: "time.month >= 4"
  lines:
    - "신문부실. 잉크 냄새와 종이 먼지 냄새. 낡은 인쇄기가 구석에서 쉬고 있다."
    - 부장@웃음: "이번 호 특집은 '교수님께 묻는다'! 신입이 돌아. 질문은 하나야. ─ 학생 시절 제일 싫었던 과목은?"
    - 나@당황: "…교수님들한테 그걸 물어요?"
    - 부장: "그러니까 신입이 가는 거지. 혼나도 신입은 귀엽잖아."
    - 삽화: campus
    - "교무동을 한 바퀴 돌았다."
    - "연무장. 가렌 교관은 목검을 닦다가 나를 봤다."
    - 가렌: "…없다."
    - 가렌: "(한참 뒤) 역사. 외울 게 많았다."
    - "마법학 실습실. 엘베라 교수는 찻잔을 든 채 고개를 갸웃했다."
    - 엘베라@웃음: "학생 시절이요? 너무 오래전이라… 아, 인간 언어 문법이요. 존댓말이 너무 많았어요."
    - "연금술 연구실. 비스톨 교수는 고개도 들지 않았다."
    - 비스톨: "꺼져."
    - 비스톨: "…연금술. 지금도 싫다."
    - "성당 옆 강의실. 시스터 루나는 질문을 듣자마자 웃었다."
    - 시스터 루나@웃음: "신학이요. 정답이 정해진 과목은 다 싫었어요. 이건 기사에 쓰지 말아요."
    - 삽화: library
    - "마지막으로 도서관. 사서 노인은 꿰매던 책에서 눈을 떼지 않았다."
    - 사서: "나 때는 과목이란 게 없었네. 칼 쓰는 법 하나만 배웠지."
    - 속마음: "(…칼?)"
    - "신문부실로 돌아오자, 받아 적은 걸 훑던 부장의 눈이 번쩍였다. 특히 신학 쪽에서."
  choices:
    - text: 루나 교수의 대답까지 그대로 싣는다 (특종)
      effects: ["reputation += 6", "affinity.luna -= 3"]
      lines:
        - 부장@웃음: "신학 교수가 신학을 싫어했다! 이거야, 이거!"
        - when: "talent.직감"
          속마음: "(직감이 목덜미를 쿡 찌른다. 이 특종, 값이 비싸게 먹힐 거다.)"
        - "루나 교수의 대답까지 그대로 실었다."
        - "신문이 동났다. 점심시간이 끝나기도 전에."
        - "다음 날 성당 앞에서 시스터 루나가 웃으며 손을 흔들었다."
        - "웃는 얼굴인데 등골이 서늘했다."
        - 속마음: "(평판 +6. 그리고 어딘가에서 무언가 -3. 숫자가 안 보여도 알 수 있었다.)"
    - text: 루나 교수의 대답은 빼고 싣는다
      effects: ["reputation += 2", "affinity.luna += 4"]
      lines:
        - 부장@슬픔: "아깝다… 진짜 아깝다…"
        - "루나 교수의 대답은 빼고 실었다. 대신 '신학: 학생 시절에도 성실했음'이라고 적었다."
        - "평범한 기사가 나갔다. 평범하게 팔렸다."
        - "다음 날 성당 앞을 지나는데, 시스터 루나가 작게 윙크했다."
        - "그리고 스쳐 지나가며, 내 손에 박하사탕 하나를 쥐여 줬다."
        - 속마음: "(입막음 값인지 고맙다는 건지. 둘 다겠지.)"
    - text: 사서 노인에게 다시 가서 묻는다 ("칼이요?")
      lines:
        - "기사를 넘기기 전에, 도서관으로 다시 갔다."
        - 나: "아까 '칼'이라고 하셨죠? 칼이요?"
        - 사서: "늙은이 농담일세. 기사엔 '독서'라고 써 주게. 그게 사서답잖나."
        - "노인은 웃었다."
      check:
        type: 통찰
        dc: 쉬움
        mods:
          - { when: "affinity.librarian >= 15", value: 2, label: 사서와의 친분 }
          - { when: "fired.bond_garen_1", value: 2, label: 가렌의 손 }
      success:
        lines:
          - "그런데 책장을 넘기는 손바닥, 손가락이 시작되는 자리에 오래된 굳은살이 줄지어 있었다."
          - "펜으로는 생기지 않는 자리다. 검 손잡이가 닿는 자리."
          - 속마음: "(연무장에서 매일 보는 굳은살이다. 교관들의 손바닥에서.)"
          - "노인이 내 시선을 따라 자기 손바닥을 내려다봤다. 그리고 천천히 책을 덮었다."
          - 사서: "…눈이 좋군. 기사엔 '독서'일세."
        effects: ["affinity.librarian += 3"]
      fail:
        lines:
          - "노인은 웃으며 소매 속으로 손을 거두었다. 책장은 이미 덮여 있었다."
          - 사서: "그리고 기사 마감이 내일이라지? 늙은이 붙잡고 있을 시간에 교정이나 보게."
          - "도서관을 나서며 수첩을 펼쳤다. 적힌 건 '칼(?)' 한 단어였다."
          - 속마음: "(칼. 물음표. 원작 3,000시간 동안 이 노인한테 물음표를 붙여 본 적이 없다.)"
          - 속마음: "(대사 세 줄짜리 NPC. 그 세 줄이, 어쩌면 일부러 세 줄이었던 걸까.)"
        effects: ["affinity.librarian += 2"]

- id: club_news_ghost
  title: 도서관 유령 잠복 취재
  art: library
  on: 신문부
  pool: true
  slots: [밤]
  when: "time.month >= 4"
  lines:
    - 부장: "제보 들어왔어. 밤마다 도서관 3층 창문에 불빛이 돌아다닌대."
    - 부장@웃음: "유령이다, 유령. 오늘 밤 잠복!"
    - 나: "…그냥 사서 선생님 아니에요?"
    - 부장: "그걸 확인하는 게 기자야. 그리고 유령이면 1면이고."
    - "자정 무렵. 도서관 맞은편 덤불 속."
    - "풀벌레가 목덜미로 기어들었다. 부장은 망원경 대신 둘둘 만 원고지를 눈에 대고 있다."
    - "밤바람이 차다. 하품을 참느라 눈물이 났다."
    - "그때."
    - "도서관 3층 창문에 정말로 작은 불빛 하나가 움직인다."
    - 부장@놀람: "(속닥) 저, 저기! 봤지? 봤지?!"
    - 속마음: "(원작 신문부 이벤트에 '도서관 유령'이 있었나? …기억에 없다.)"
  check:
    type: 은밀
    dc: 보통
    mods:
      - { when: "fatigue >= 70", value: -3, label: 피로 }
      - { when: "fired.prof_corridor", value: 2, label: 엿듣던 솜씨 }
  success:
    lines:
      - "뒷문은 잠겨 있지 않았다. 그림자를 따라 서가 사이로 숨어들었다."
      - "계단을 오를 때마다 숨을 참았다. 3층. 불빛이 서가 사이를 천천히 지나간다."
      - "불빛의 주인은 촛대를 든 사서 노인이었다."
      - "한 권 한 권 책등을 손끝으로 쓸며 걷는다. 누군가의 이름을 확인하듯이."
      - 사서: "…신문부인가. 유령은 아니니 실망하겠군."
      - "돌아보지도 않고 한 말이었다."
      - 사서: "잠이 안 오는 밤엔 책들 안부를 묻네. 늙으면 아는 이름이 책밖에 안 남거든."
      - 부장: "(속닥) 근데 우리 선배의 선배가 그러는데, 저 할아버지 그때도 저 얼굴이었대. 사십 년 전에도."
      - 속마음: "(원작에서 사서는 대사 세 줄짜리 NPC였다. 그 세 줄 어디에도 '사십 년 전에도 같은 얼굴' 같은 건 없었다.)"
      - "촛불이 서가 모퉁이를 돌아 사라졌다. 발소리는 끝내 들리지 않았다."
    effects: ["affinity.librarian += 4", "intel += 1"]
  fail:
    lines:
      - "뒷문으로 숨어들었다. 계단을 살금살금 올랐다."
      - "계단에서 발을 헛디뎠다. 우당탕."
      - "불빛이 꺼졌다. 부장이 비명을 질렀다. 내가 지른 건지도 모른다."
      - "그날 밤은 그렇게 끝났다."
      - "다음 날 아침, 신문부실 문에 쪽지가 붙어 있었다. 반듯하고 오래된 글씨체로."
      - "── 3층 계단 넷째 칸은 삐걱거리니 조심하게. 도서관."
      - 부장: "…유령이 친절하네."
      - 속마음: "(계단 넷째 칸. 원작 맵 데이터엔 삐걱거리는 계단 같은 건 없었다.)"
    effects: ["stress += 5", "affinity.librarian += 1"]
  great:
    lines:
      - "돌아서 나오려는데, 서가 모퉁이 너머에서 목소리가 한 번 더 들렸다."
      - 사서: "내려가는 길엔 넷째 칸을 밟지 말게. 삐걱거리니."
      - 부장@놀람: "(속닥) …우리 계단에 있는 거 언제부터 알았지?"
      - 속마음: "(처음부터였겠지. 이 노인은, 처음부터 다 알고 있는 사람 같다.)"
    effects: ["affinity.librarian += 1"]

- id: club_news_headline
  title: 마감 전야
  on: 신문부
  pool: true
  when: "time.month >= 5"
  lines:
    - "마감 전날 밤. 신문부실 창밖으로 기숙사 불빛이 하나둘 꺼져 간다."
    - "책상 위에 원고 더미, 식은 차, 잉크 묻은 손수건. 그리고 엎드려 자는 부장."
    - 부장: "(잠꼬대) …헤드라인… 헤드라인이 약해…"
    - "의자에 걸린 담요를 부장 등에 덮어 주었다. 담요에 잉크 얼룩이 별자리처럼 찍혀 있다."
    - "창밖으로 순찰 도는 경비병의 등불이 천천히 지나갔다."
    - "인쇄는 내일 새벽이다. 1면 기사 제목 칸이 아직 비어 있다."
    - "무투대회 우승 후보 특집이다. 본문은 다 써 놨다. 제목만 없다."
    - "펜을 들었다. 잉크가 펜촉 끝에서 동그랗게 맺혔다."
    - 속마음: "(원작 신문부 루트에선 이 제목 하나로 평판 수치가 바뀌었다. 그땐 그냥 숫자였는데.)"
    - 속마음: "(지금은 이 제목을 읽을 얼굴들이 떠오른다.)"
    - 부장: "(잠꼬대) …사람들이… 읽고 싶은 거…"
  choices:
    - text: "\"카이든 황자, 3학년도 못 이긴다\" (안전한 제목)"
      effects: ["reputation += 2"]
      lines:
        - "「카이든 황자, 3학년도 못 이긴다」. 무난하다. 사실이기도 하고."
        - "새벽에 깬 부장이 제목을 보더니, '무난하네' 한마디 하고 다시 엎드렸다."
        - "다음 날, 무난하게 팔렸다. 카이든은 기사를 읽지도 않았다는 소문이다."
        - when: "origin == '악역도련님'"
          나레이션: "기사 끝에 '글: 신문부'라고만 적었다. 벨모어라는 이름이 붙으면 아무도 안 읽을 테니까."
        - "…그런데 그날 저녁, 카이든이 연습장에 평소보다 두 배는 오래 남아 있었다는 소문도 같이 돌았다."
        - 속마음: "(읽었다. 분명히 읽었다.)"
    - text: "\"성검의 평민, 황자를 넘을 수 있나\" (자극적인 제목)"
      effects: ["reputation += 5", "affinity.aren += 2", "affinity.kaiden -= 2"]
      lines:
        - "펜이 멋대로 움직였다. 「성검의 평민, 황자를 넘을 수 있나」."
        - when: "talent.달변"
          속마음: "(제목 뽑는 손이 근질거렸다. 낚시 제목은 원래 세계에서도 잘 썼다. 자랑은 아니다.)"
        - 부장: "(잠꼬대) …좋아… 그거야…"
        - "신문이 오전에 동났다. 점심때 아렌이 쭈뼛거리며 찾아왔다."
        - 아렌@당황: "저기… 그 기사 쓴 거 너야? 덕분에 오늘만 결투 신청을 세 번 받았어."
        - 나@당황: "…미안."
        - 아렌@웃음: "…근데 좀 기분 좋더라. 누가 날 그렇게 봐 준 건 처음이라."
        - 아렌: "다들 성검만 보잖아. 근데 그 제목은, 성검이 아니라 내가 넘는 거잖아."
        - "복도 저쪽에서 카이든이 신문을 구겨 쥐고 지나갔다. 눈이 마주쳤다. 차가웠다."
    - text: "\"아델하이트의 천재, 실기 무패 행진\""
      when: "rival.mirabel"
      effects: ["reputation += 3", "affinity.mirabel += 5"]
      lines:
        - "「아델하이트의 천재, 실기 무패 행진」. 쓰고 나서 보니 칭찬밖에 없다."
        - "다음 날 도서관. 미라벨이 신문을 반으로 접어 내 앞에 내려놓았다."
        - 미라벨: "기사 봤어. 사실이니까 고맙다곤 안 할게."
        - 미라벨@당황: "…'천재'는 빼도 됐잖아. 노력한 건데."
        - "미라벨은 그 신문을 다시 집어 가방에 넣었다. 조심스럽게, 구겨지지 않게."
        - 속마음: "(아델하이트라는 이름이 좋은 일로 1면에 실린 게, 몇 년 만일까.)"
    - text: "\"D반에도 다크호스가 있다\" (나를 띄운다)"
      requires: "reputation >= 10"
      effects: ["reputation += 8", "stress += 5"]
      lines:
        - "펜을 들었다. 「D반에도 다크호스가 있다」. 내 얘기다."
        - 부장@놀람: "(벌떡 일어나서) …뻔뻔한데 마음에 들어."
        - 부장@웃음: "본문도 고쳐. 다크호스 본인 인터뷰. 인터뷰이는 너."
        - "다음 날부터 복도에서 모르는 얼굴들이 나를 힐끔거린다."
        - 학생 A: "(속닥) 저 사람이야. 다크호스."
        - when: "talent.미모"
          학생 B: "(속닥) …얼굴도 다크호스네."
        - "좋은 건지는 잘 모르겠다."
        - 속마음: "(엑스트라가 주목받으면 어떻게 되는지, 원작엔 데이터가 없다.)"
