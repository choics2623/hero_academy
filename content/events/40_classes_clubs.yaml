          - 가렌: "……"
          - "가렌이 금 간 목검을 내려다보다가, 말없이 새 목검을 가지러 갔다."
          - 브루노@웃음: "(속닥) 야, 우리 교관님 목검 부쉈어. 이거 자랑해도 되냐?"
          - 속마음: "(안 될 것 같다. 그래도 그날 저녁 식당에서, 브루노는 열 번쯤 자랑했다.)"
        effects: ["stat.근력 += 0.5"]
    - text: 아렌과 묶는다
      when: "affinity.aren >= 5"
