# 수업, 교수, 동아리 (1학년 1학기)
#
# 1) 수업 장면: 주중 수업. on: auto + free: true 라서 행동 슬롯을 쓰지 않는다.
#    한 주 창(window)으로 박아 두고, 같은 주의 메인 사건(priority 10)이 먼저 오면 다음 슬롯에 열린다.
# 2) 교수 인연: 비스톨, 시스터 루나, 사서, 엘베라(3단계), 가렌(3단계). 일회성이라 priority 1.
# 3) 동아리 풀: 원예부(온실), 검술부, 신문부의 선배·부원들과 마주치는 장면 (pool: true).

# ================================================================ 수업 — 3월

- id: cls_alchemy_1
  title: 연금술 — 첫 수업
  on: auto
  free: true
  window: "1.3.3"
  effects: ["met.bistol = 1", "affinity.bistol += 2"]
  lines:
    - "지하 연금술 실습실. 천장이 낮고, 어디선가 유황 냄새가 난다."
    - "교탁 앞에 선 교수는 눈 밑이 거뭇하다. 셔츠 단추가 한 칸씩 밀려 잠겨 있다."
    - 비스톨: "비스톨이다. 연금술 담당."
    - 비스톨: "첫 시간이니 규칙만 말하지. 하나. 솥 앞에서 졸지 마라. 터진다."
    - 비스톨: "둘. 재료를 맛보지 마라. 죽는다."
    - 비스톨: "셋. 수업 중에 나를 깨우지 마라. …내가 터진다."
    - "아무도 웃지 않았다. 농담인지 확신할 수가 없어서."
    - 속마음: "(원작 연금술 수업은 미니게임이었다. 다들 스킵했지. 나도 했고.)"
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(그리고 저 사람이 원작 공식 심연교단 교주다. 8년차 봄, 미궁 최하층에서 차원문을 연다. …셔츠 단추도 제대로 못 잠그는 사람이.)"
    - 비스톨: "오늘은 간단한 거다. 소금물에서 소금만 다시 걸러내. 종 칠 때까지."
  choices:
    - text: 교과서대로 약불에 천천히 졸인다 (지성)
      check: { label: 정제, value: "stat.지성 + stat.마력제어 / 2 + luck", dc: 24 }
      success:
        lines:
          - "유리 접시 바닥에 하얀 결정이 눈처럼 깔렸다."
          - 비스톨: "…교과서를 읽은 놈이 있군. 놀랍게도."
        effects: ["affinity.bistol += 3", "stat.지성 += 0.5"]
      fail:
        lines:
          - "불 조절을 놓쳤다. 접시에 남은 건 갈색 얼룩뿐이다."
          - 비스톨: "그걸 소금이라고 부를 거면 식당 가서 불러."
        effects: ["affinity.bistol += 1"]
    - text: 마력으로 물만 날려 본다 (마력제어)
      check: { label: 편법 정제, value: "stat.마력제어 + stat.마력량 / 2 + luck", dc: 27 }
      success:
        lines:
          - "손끝으로 열을 모아 수면만 살짝 끓였다. 김이 걷히자 결정만 남는다."
          - "비스톨의 한쪽 눈썹이 올라갔다."
          - 비스톨: "편법이군. …편법도 결과가 나오면 기법이다. 이름."
        effects: ["affinity.bistol += 4", "stat.마력제어 += 0.5"]
      fail:
        lines:
          - "쨍. 유리 접시가 열을 못 이기고 갈라졌다."
          - "비스톨이 깨진 조각을 집어 들고 오래 한숨을 쉬었다."
          - 비스톨: "아무도 안 죽었군. 첫 시간치곤 선방이다."
        effects: ["affinity.bistol += 2"]
    - text: 옆자리 브루노의 솥부터 봐준다 (벌써 보라색으로 끓고 있다)
      when: "met.bruno or affinity.bruno > 0"
      effects: ["affinity.bruno += 3", "affinity.bistol += 1"]
      lines:
        - 브루노@당황: "어, 어어? 이거 원래 보라색 되는 거야? 소금물이었잖아!"
        - "솥을 불에서 내리고 둘이서 부채질을 했다. 보라색 거품이 천천히 가라앉는다."
        - "결과물은 둘 다 없었지만, 실습실은 무사했다."
        - 비스톨: "…거기 둘. 다음 시간부턴 떨어져 앉아."
        - 브루노@웃음: "(속닥) 그래도 재밌었다. 그치?"

- id: cls_theology_1
  title: 신학 — 첫 질문
  on: auto
  free: true
  window: "1.3.4"
  effects: ["met.luna = 1", "affinity.luna += 2"]
  lines:
    - "성당 옆 강의실. 스테인드글라스 빛이 책상 위에 비스듬히 눕는다."
    - "검은 수녀복의 교수가 출석부를 덮으며 웃는다. 웃는 얼굴인데, 눈은 출석부보다 정확하게 우리를 세고 있다."
    - 시스터 루나: "신학 담당 루나예요. 시스터라고 불러도 되고 교수님이라고 불러도 돼요. 졸면 둘 다 대답 안 해요."
    - 시스터 루나: "첫 질문. 천 년 전, 여신님은 왜 직접 마왕을 막지 않으셨을까요?"
    - "강의실이 조용해졌다. 맨 앞줄 귀족 학생이 손을 들었다가 슬그머니 내렸다."
    - 속마음: "(원작 신학 수업은 선택지 세 개짜리 퀴즈였다. 정답은 늘 '여신의 뜻'. 그런데 저 사람 표정은 그 답을 기다리는 얼굴이 아니다.)"
  choices:
    - text: "\"여신의 뜻이니까요\" (교과서 정답)"
      effects: ["affinity.luna += 1", "stress -= 5"]
      lines:
        - 시스터 루나@웃음: "만점짜리 대답이네요. 시험에선 꼭 그렇게 쓰세요."
        - 시스터 루나: "…시험에서만요."
    - text: "\"막을 수 없었던 거 아닐까요\""
      effects: ["affinity.luna += 4"]
      lines:
        - "누군가 숨을 들이켰다. 성당 옆 강의실에서 할 소리가 아니다."
        - 시스터 루나: "흥미로운 이단이네요. 이름이 뭐예요?"
        - "강의실이 얼어붙었다. 시스터 루나가 출석부에 뭔가를 적었다."
        - 시스터 루나@웃음: "농담이에요. 반쯤은. 출석 체크했을 뿐이에요."
    - text: "\"인간이 스스로 하길 바라신 거겠죠\""
      effects: ["affinity.luna += 3", "stat.의지 += 0.5"]
      lines:
        - 시스터 루나: "그래서 성검을 남기셨다? 좋아요. 그럼 다음 질문."
        - 시스터 루나: "그 성검을 누가 쥘지는, 누가 정하죠?"
        - "아무도 대답하지 않았다. 시스터 루나는 대답을 기다리지 않고 칠판으로 돌아섰다."
        - when: "perk.고인물의기억 or perk.공략위키편집자"
          속마음: "(원작에선 '성검이 스스로 고른다'가 공식 설정이었다. 그런데 저 질문, 꼭 다른 답을 아는 사람처럼 들린다.)"
    - text: 세라를 슬쩍 본다 (손을 들까 말까 망설이고 있다)
      when: "fate.sera == 'saved' or fate.sera == 'saved_quiet'"
      effects: ["affinity.sera += 4", "affinity.luna += 3"]
      lines:
        - "눈이 마주치자 세라가 작게 숨을 삼키고, 손을 들었다."
        - 세라: "여, 여신님은… 막으셨다고 생각해요. 사람의 손을 빌려서요."
        - 시스터 루나: "……좋은 대답이에요. 아주."
        - "시스터 루나의 시선이 세라의 손등에 오래 머물렀다. 웃음기가 아주 잠깐 사라졌다."

# ================================================================ 수업 — 4월

- id: cls_history_1
  title: 세계사 — 사서의 대강
  art: classroom
  on: auto
  free: true
  window: "1.4.3"
  lines:
    - "세계사 시간. 담당 강사가 봄 감기로 쓰러졌다는 공지가 붙었다."
    - "대신 들어온 사람은 도서관 사서 노인이었다. 지팡이를 짚고, 교과서 없이."
    - 학생들: "(속닥) 사서 할아버지가 수업을…?"
    - 사서: "책을 오래 지키다 보면 이런 일도 맡게 되지. 교과서 3장. 천 년 전, 봉인 전쟁."
    - "노인은 교과서를 펴지 않았다. 창밖을 보며 이야기를 시작했다."
    - 사서: "그해 겨울은 길었네. 칼데라 고개에 눈이 허리까지 쌓여서, 용사 일행은 말을 버리고 걸어서 넘었지."
    - 사서: "마지막 밤에 다섯이 모닥불을 피웠어. 아무도 내일 이야기는 하지 않았네. 다들 고향 이야기만 했지."
    - "교실이 쥐 죽은 듯 조용하다. 교과서 어디에도 모닥불 이야기는 없다."
    - 속마음: "(원작에선 세계사 수업 텍스트를 스킵 버튼 연타로 넘겼다. …이런 내용이었나?)"
  plants:
    - { id: F15, notice: { value: "stat.지성 + 15 * talent.완전기억 + 10 * perk.고인물의기억", dc: 32 } }
  choices:
    - text: 한 줄도 놓치지 않고 받아 적는다 (지성)
      check: { label: 필기, value: "stat.지성 + 10 * talent.집중력 - 10 * talent.산만함 + luck", dc: 24 }
      success:
        lines:
          - "노트가 빼곡해졌다. 교과서보다 노트가 두꺼워질 것 같다."
          - 사서: "적는 손이 바쁘군. 좋아. 적어 둔 건 잊어도 다시 찾을 수 있지."
        effects: ["stat.지성 += 0.5", "affinity.librarian += 2"]
      fail:
        lines:
          - "받아 적다 보니 이야기에 빠져서 손이 멈춰 있었다. 노트엔 '모닥불'이라는 글자 하나뿐."
        effects: ["affinity.librarian += 1", "stress -= 5"]
    - text: "\"그걸 어떻게 아세요? 교과서엔 없는데요\""
      effects: ["affinity.librarian += 3"]
      lines:
        - "학생들의 시선이 나에게, 그리고 노인에게로 옮겨갔다."
        - 사서: "책이 다 적지 못한 걸 기억하는 게 사서의 일일세."
        - 사서: "…그리고 늙으면 남의 이야기도 제 이야기처럼 하게 되지. 신경 쓰지 말게."
    - text: 옆자리 아렌을 본다 (창밖을 멍하니 보고 있다)
      effects: ["affinity.aren += 2"]
      lines:
        - 아렌: "(작게) …칼데라 고개. 이상하다. 처음 듣는 이름인데."
        - 아렌: "거기 바람 소리를 아는 것 같아. 눈 밟히는 소리도."
        - "아렌이 스스로도 이상한지 고개를 저었다."
        - 속마음: "(원작 아렌에겐 이런 대사가 없었다. 플레이어의 분신에게 기억 같은 건 필요 없었으니까.)"
      plants:
        - { id: F24, notice: { value: "stat.지성 + 10 * talent.직감 + 10 * perk.고인물의기억", dc: 22 } }

- id: cls_magic_1
  title: 마법학 — 수정구
  on: auto
  free: true
  window: "1.4.4"
  effects: ["met.elvera = 1"]
  lines:
    - "마법학 실습. 엘베라 교수가 교탁 위에 사람 머리만 한 수정구를 올려놓았다."
    - 엘베라: "오늘은 각자 마력의 결을 볼 거예요. 손을 얹으면 색이 떠올라요."
    - 엘베라: "색에 좋고 나쁨은 없어요. …라고 말해도 다들 비교하겠죠. 오백 년 동안 안 그런 반이 없었어요."
    - "미라벨이 먼저 손을 얹었다. 수정구 안에서 짙은 자줏빛이 소용돌이친다. 감탄이 터졌다."
    - 미라벨: "아델하이트의 색이야. 외워 둬."
    - "아렌 차례. 수정구는 거의 반응하지 않았다. 대신 아렌 허리춤의 성검이 낮게 웅웅거렸다."
    - 아렌@당황: "어, 어? 왜 검이 대답해?"
    - 속마음: "(원작에선 캐릭터 생성 때 고른 속성을 확인시켜 주는 연출이었다. 그땐 그냥 예쁜 이펙트였는데.)"
    - "내 차례다."
  branch:
    - when: "talent.마나탱크"
      lines:
        - "손을 얹는 순간 수정구가 새하얗게 차오르더니── 쩍, 금이 갔다."
        - 엘베라: "…괜찮아요. 수정구는 창고에 또 있어요. 이런 그릇은 또 없겠지만요."
        - 미라벨@화남: "……"
      effects: ["affinity.elvera += 4", "reputation += 3"]
    - when: "talent.마력폭주체질"
      lines:
        - "수정구 색이 빨강, 파랑, 초록으로 미친 듯이 바뀌다가── 펑."
        - "연기가 걷히자 엘베라가 침착하게 소화 마법을 거두고 있었다."
        - 엘베라: "감정이 마력보다 앞서 달리네요. 나쁜 게 아니에요. 고삐가 없을 뿐이죠."
      effects: ["affinity.elvera += 3", "stress += 5"]
    - when: "talent.마나회로손상"
      lines:
        - "아무 일도 일어나지 않았다. 수정구는 그냥 커다란 유리공이었다. 뒤에서 킥킥대는 소리."
        - 엘베라: "회로가 상했다고 그릇이 없는 건 아니에요."
        - 엘베라: "마력이 밖으로 못 나오면, 안에서 쓰면 돼요. 몸 안에서."
        - 속마음: "(투기 루트. 원작에서 회로 손상 빌드에만 열리던 숨은 길이다. 이걸 수업 중에 대놓고 말해 주다니.)"
      effects: ["affinity.elvera += 4", "stat.의지 += 0.5"]
    - when: "talent.마왕의흔적"
      lines:
        - "맑은 빛 사이로 검붉은 실 한 가닥이 스쳤다가 사라졌다. 눈 깜짝할 사이였다."
        - "아무도 못 봤다. 엘베라만 빼고. 그녀의 눈이 아주 잠깐 커졌다가, 아무 일 없다는 듯 웃음으로 덮였다."
        - 엘베라: "깨끗한 색이네요. 다음 학생."
      effects: ["elvera.saw_mark = 1", "affinity.elvera += 2"]
    - when: "talent.성흔"
      lines:
        - "수정구가 금빛으로 물들었다. 따뜻한 빛이 교실 바닥까지 번진다."
        - 엘베라: "…성당에 자주 가 봐요. 시스터 루나가 아주 좋아하겠네요."
      effects: ["affinity.elvera += 3"]
    - check: { label: 마력 발현, value: "stat.마력량 + stat.마력제어 / 2 + luck", dc: 26 }
      success:
        lines:
          - "맑은 청록빛이 수정구 안에서 천천히 돌았다. 흐트러짐이 없다."
          - 엘베라: "깨끗하네요. 이런 결은 다듬을수록 좋아져요."
        effects: ["affinity.elvera += 4", "stat.마력제어 += 0.5"]
      fail:
        lines:
          - "회색 안개가 겨우 피어올랐다가 꺼졌다. 미라벨이 코웃음을 쳤다."
          - 엘베라: "안개도 색이에요. 아직 모양이 정해지지 않았다는 뜻이죠."
        effects: ["affinity.elvera += 2"]
  choices:
    - text: 미라벨에게 "자줏빛, 예쁘던데"라고 말한다
      effects: ["affinity.mirabel += 3"]
      lines:
        - 미라벨@당황: "…색 칭찬 들으려고 한 거 아니거든."
        - "미라벨이 고개를 홱 돌렸다. 귀 끝이 수정구보다 빨갰다."
    - text: "\"색으로 실력이 정해지는 건 아니잖아\""
      effects: ["trust.mirabel += 3", "affinity.mirabel += 1"]
      lines:
        - 미라벨: "맞아. 그러니까 실기에서 보여줄게."
        - 미라벨: "기대해. 그때 가서 울지나 말고."
    - text: 아렌에게 성검 이야기를 묻는다
      effects: ["affinity.aren += 3"]
      lines:
        - 아렌: "가끔 이래. 내 마력을 검이 먼저 먹어 버리는 것 같아."
        - 아렌@웃음: "…배고픈 검인가 봐."
        - 속마음: "(원작에선 그냥 '성검 보정'이라는 숫자 한 줄이었다. 배고픈 검이라니.)"

# ================================================================ 수업 — 5월

- id: cls_sword_1
  title: 검술 — 등을 맡길 사람
  on: auto
  free: true
  window: "1.5.1"
  lines:
    - "검술 실기. 가렌 교관이 목검 대신 밧줄 한 다발을 바닥에 던졌다."
    - 가렌: "다음 주에 미궁이다."
    - 가렌: "미궁에선 앞의 적보다 등 뒤가 더 많이 죽인다. 오늘은 둘씩 묶는다. 등을 맡길 놈을 골라라."
    - "허리를 밧줄로 서로 묶고, 사방에서 날아드는 교관의 목검을 둘이서 막아내는 훈련이다."
    - when: "note.note_edric.known and origin != '악역도련님'"
      속마음: "(다음 주. 에드릭이 죽는 날이다. 원작에서 이 수업은 짝 선택 화면 하나로 끝났지.)"
    - when: "origin == '악역도련님'"
      속마음: "(다음 주가 원작 에드릭의 기일이다. 그러니까, 내 기일.)"
  choices:
    - text: 브루노와 묶는다
      when: "met.bruno or affinity.bruno > 0"
      check: { label: 2인 방어, value: "stat.근력 + stat.체질 / 2 + 5 + luck", dc: 30 }
      success:
        lines:
          - "브루노가 앞을, 내가 뒤를 막았다. 가렌의 목검이 세 번 튕겨 나갔다."
          - 가렌: "…벽이 둘이군."
          - 브루노@웃음: "들었냐? 벽이래, 벽!"
        effects: ["affinity.bruno += 3", "affinity.garen += 4", "stat.체질 += 0.5"]
      fail:
        lines:
          - "브루노가 갑자기 오른쪽으로 도는 바람에 밧줄에 걸려 둘 다 나뒹굴었다."
          - 브루노: "하하, 미안! 돈다고 말 안 했지!"
          - 가렌: "미궁에서도 미안하다고 할 건가."
        effects: ["affinity.bruno += 2", "affinity.garen += 1"]
    - text: 아렌과 묶는다
      when: "affinity.aren >= 5"
      check: { label: 2인 방어, value: "stat.민첩 + stat.의지 / 2 + 5 + luck", dc: 30 }
      success:
        lines:
          - "아렌이 내 박자에 맞춰 돈다. 등에 닿는 체온이 묘하게 든든하다."
          - 아렌: "등 뒤에 누가 있으니까… 앞만 보면 되네. 이거 좋다."
          - 가렌: "……"
          - "가렌이 아렌을 한참 봤다. 무언가를 떠올리는 얼굴로."
        effects: ["affinity.aren += 4", "aren.kind += 0.5", "affinity.garen += 3"]
      fail:
        lines:
          - "아렌이 허리춤의 성검을 신경 쓰느라 반 박자씩 늦는다. 목검이 내 옆구리를 쳤다."
          - 아렌@당황: "미, 미안! 검이 자꾸 무거워서…"
        effects: ["affinity.aren += 3", "affinity.garen += 1"]
    - text: 카이든에게 짝을 청한다
      requires: "stat.근력 + stat.민첩 >= 32"
      lines:
        - 카이든: "…날 고른 이유는?"
        - 나: "등 뒤에서 제일 안 무너질 것 같아서."
        - 카이든: "흥. 맞는 판단이다."
      check: { label: 2인 방어, value: "stat.근력 + stat.민첩 / 2 + luck", dc: 33 }
      success:
        lines:
          - "카이든과 등을 맞대자 이상하게 박자가 맞았다. 그가 막으면 내가 찌르고, 내가 막으면 그가 찌른다."
          - 카이든: "나쁘지 않군. 등 뒤에서 칼 맞을 걱정은 안 해도 되겠어."
          - 가렌: "황자. 등을 맡겼으면 끝까지 맡겨라. 세 번 돌아봤다."
          - 카이든@화남: "……"
        effects: ["affinity.kaiden += 4", "trust.kaiden += 3", "affinity.garen += 3"]
      fail:
        lines:
          - "카이든이 혼자 사방을 다 막아 버렸다. 나는 밧줄에 끌려다녔다."
          - 카이든: "등을 맡기라 했지, 업히라곤 안 했다."
        effects: ["affinity.kaiden += 1", "stress += 5"]
    - text: 혼자 남은 에드릭 벨모어와 묶는다
      when: "origin != '악역도련님'"
      effects: ["met.edric = 1"]
      lines:
        - 에드릭: "…뭘 봐. 나랑 묶이겠다고? 동정이면 사양이야."
      check: { label: 말 붙이기, value: "stat.매력 + stat.의지 / 2 + luck", dc: 28 }
      success:
        lines:
          - "막상 묶이니 에드릭은 의외로 성실했다. 가렌의 목검이 내 등으로 오자, 욕을 하면서도 막아냈다."
          - 에드릭: "…착각하지 마. 내가 맞기 싫어서 막은 거야."
          - 에드릭: "근데 너 이름이 뭐냐. …다음 주 미궁, 같은 층이면 아는 척 정도는 해 줄게."
        effects: ["edric.contact = 1", "affinity.edric += 6"]
      fail:
        lines:
          - "에드릭은 끝까지 내 쪽을 보지 않았다. 밧줄이 팽팽하게 당겨진 채로 수업이 끝났다."
        effects: ["affinity.edric += 2"]
    - text: 아무도 다가오지 않는다. 먼저 손을 내민다
      when: "origin == '악역도련님'"
      check: { label: 먼저 손 내밀기, value: "stat.매력 + stat.의지 / 2 + 5 * min(servant.trust, 2) + luck", dc: 28 }
      success:
        lines:
          - "망설이던 평민 학생 하나가 결국 밧줄 끝을 받아 들었다."
          - 학생들: "(속닥) 벨모어가 도련님이 먼저 부탁을 다 하네…"
          - "어색했지만, 등은 맡겼다. 원작의 에드릭은 한 번도 해 본 적 없는 일이다."
        effects: ["reputation += 4", "stat.의지 += 0.5"]
      fail:
        lines:
          - "결국 가렌 교관이 직접 내 짝이 됐다."
          - 가렌: "벨모어. 넌 나랑 묶는다. 불만 있나."
          - "그날 하루 동안 맞은 목검이 지난 한 달 치보다 많았다. 이상하게 덜 외로웠다."
        effects: ["affinity.garen += 4", "stat.체질 += 1", "fatigue += 15"]

- id: cls_alchemy_2
  title: 연금술 — 상처약
  on: auto
  free: true
  window: "1.5.3"
  effects: ["affinity.bistol += 2"]
  lines:
    - "미궁 실습 다음 주. 연금술 실습실에 붕대 감은 학생이 절반이다."
    - 비스톨: "미궁에서 긁혀 온 놈들이 많군. 잘됐다. 오늘은 상처약이다."
    - 비스톨: "자기가 만든 건 자기 상처에 바른다. 그러니 대충 만들지 마라."
    - "몇몇이 얼굴을 굳혔다. 비스톨은 개의치 않고 칠판에 배합비를 적어 내려간다."
    - when: "fate.edric == 'dead'"
      나레이션: "맨 뒷줄에 빈자리가 하나 있다. 비스톨이 출석부의 한 이름 위에서 펜을 오래 멈췄다가, 조용히 줄을 그었다."
    - when: "origin != '악역도련님' and (fate.edric == 'saved' or fate.edric == 'saved_by_teacher')"
      나레이션: "에드릭이 붕대 감은 팔로 솥을 젓고 있다. 비스톨이 그 앞을 지나며 연고 한 통을 말없이 놓고 갔다."
    - when: "fate.edric == 'alive_scarred'"
      나레이션: "가슴의 상처가 아직 욱신거린다. 비스톨이 내 책상에 연고 한 통을 내려놓았다. ─ 미궁 상처엔 이게 낫다."
  choices:
    - text: 배합비를 한 방울도 틀리지 않게 지킨다 (지성)
      check: { label: 조제, value: "stat.지성 + stat.마력제어 / 2 + luck", dc: 28 }
      success:
        lines:
          - "연둣빛 연고가 완성됐다. 손등 긁힌 데 바르자 쓰라림이 금세 가라앉는다."
          - 비스톨: "…쓸 만하군. 남은 건 가져가라. 미궁은 또 갈 테니까."
        effects: ["affinity.bistol += 3", "stat.지성 += 0.5", "fatigue -= 10"]
      fail:
        lines:
          - "연고가 돌처럼 굳었다. 숟가락이 꽂힌 채로 서 있다."
          - 비스톨: "벽 틈 메우는 데 쓰면 되겠군. 기숙사 벽이 마침 금이 갔다더라."
        effects: ["affinity.bistol += 1"]
    - text: 비스톨 교수의 손놀림을 지켜본다
      effects: ["affinity.bistol += 2", "bistol.gentle = 1", "stat.지성 += 0.5"]
      lines:
        - "교수의 손은 학생들 솥 사이를 쉬지 않고 오간다. 무뚝뚝하고, 빠르고, 정확하다."
        - "그런데 화상 입은 여학생 앞에서만 동작이 느려졌다."
        - "자기 연고를 꺼내, 아주 조심스럽게 발라 준다. 아이를 대하는 손이었다."
        - 비스톨: "…다음부턴 장갑을 껴라."
        - "그 말을 하고 돌아서는 얼굴이, 아주 잠깐 아주 늙어 보였다."
    - text: 브루노의 솥이 끓어 넘치려 한다 — 뚜껑을 덮친다 (민첩)
      when: "met.bruno or affinity.bruno > 0"
      check: { label: 솥뚜껑, value: "stat.민첩 + stat.체질 / 2 + luck", dc: 26 }
      success:
        lines:
          - "몸을 날려 솥뚜껑을 눌렀다. 쉬이익. 초록색 김이 뚜껑 틈으로 빠져나간다."
          - 브루노@웃음: "살았다! 너 방금 기사 같았어, 기사!"
          - 비스톨: "기사는 솥뚜껑을 안 든다. …잘했다."
        effects: ["affinity.bruno += 3", "affinity.bistol += 2"]
      fail:
        lines:
          - "한 박자 늦었다. 천장에 초록색 얼룩이 생겼다."
          - "비스톨이 천장을 올려다보고, 길고 깊은 한숨을 쉬었다."
          - 비스톨: "둘 다 수업 끝나고 남아서 천장 닦아."
          - 브루노: "(속닥) …미안. 저녁은 내가 살게."
        effects: ["affinity.bruno += 2", "fatigue += 10"]

# ================================================================ 수업 — 6월

- id: cls_history_2
  title: 세계사 — 세 자루의 붓
  on: auto
  free: true
  window: "1.6.2"
  lines:
    - "세계사 강사의 봄 감기는 여름이 다 되도록 낫지 않았다. 사서 노인의 대강도 벌써 두 달째다."
    - 사서: "오늘은 제국사. 아스테라 황가는 지난 삼백 년 동안 황위를 세 번 피로 넘겼지."
    - "교실 공기가 묘하게 굳었다. 창가 자리의 카이든이 펜을 내려놓는다."
    - 사서: "황자가 셋이면 역사가들은 붓을 셋 준비한다네. 누가 이길지 모르니까. 이긴 쪽 붓만 남고, 나머지 둘은 불쏘시개가 되지."
    - 학생들: "(속닥) 3황자 앞에서 저런 얘길…"
    - 속마음: "(6년차 겨울, 황제 암살. 원작 커뮤니티엔 진범 논쟁 스레드가 몇백 개 올라왔다. 2황자, 교회, 교단. 아무도 확신하지 못했지.)"
  choices:
    - text: 카이든을 본다
      effects: ["affinity.kaiden += 2", "know.kaiden_shoulder = 1"]
      lines:
        - "카이든은 표정 하나 바꾸지 않았다."
        - "그런데 책상 아래, 왼손이 왼쪽 어깨를 꽉 감싸고 있다."
        - 나레이션:
            - "긴장할 때 나오는 버릇일까."
            - { when: "fired.bond_kaiden_3", text: "큰형의 말에서 떨어뜨려졌다던 그 어깨다." }
    - text: "\"세 자루 중에 맞는 붓은 어느 거였나요?\""
      effects: ["affinity.librarian += 3", "stat.지성 += 0.5"]
      lines:
        - 사서: "늘 마지막까지 살아남은 쪽 붓이 맞았지. 역사란 그런 거네."
        - 사서: "그래서 나는 붓보다 사람을 믿네. 붓은 끝까지 거짓말을 해도, 사람은 죽기 전에 한 번은 진실을 말하거든."
        - "노인이 카이든 쪽을 보지 않은 채 덧붙였다."
        - 사서: "…그러니 진실을 말할 사람을 죽게 두면 안 되는 게지."
    - text: 수업이 끝나고 카이든에게 말을 건다
      when: "affinity.kaiden >= 10"
      effects: ["trust.kaiden += 4", "affinity.kaiden += 3", "know.kaiden_palace = 1"]
      lines:
        - 카이든: "동정이라면 필요 없다."
        - 카이든@진지: "저 늙은이 말이 맞아. 붓은 이미 셋 준비돼 있다."
        - 카이든: "내 이름 옆엔 아마 '반역'이라고 적혀 있겠지. 형님들 붓에는."
        - when: "perk.고인물의기억 or perk.공략위키편집자"
          속마음: "(원작 그대로다. 카이든은 6년 뒤 내전 속에서 반역자 누명을 쓰고 처형된다.)"
        - 나: "그 붓, 다 쓰기 전에 꺾으면 되잖아."
        - "카이든이 처음으로 나를 똑바로 봤다. 그리고 아주 짧게, 코웃음 같은 웃음을 흘렸다."
        - 카이든: "…평민은 말이 쉽군. 그래도, 나쁘지 않은 소리다."

- id: cls_theology_2
  title: 신학 — 오만인가, 신앙인가
  on: auto
  free: true
  window: "1.6.3"
  lines:
    - "신학 토론 수업. 시스터 루나가 칠판에 한 문장을 적었다."
    - "── 구할 수 없는 사람을 구하려는 것은 신앙인가, 오만인가."
    - 시스터 루나: "정답은 없어요. 대신 오답은 있죠. '모르겠다'가 오답이에요. 오늘은 모두 한 번씩 말해야 해요."
    - "학생들이 차례로 일어난다. 대부분 '신앙'이라고 대답했다. 성당 옆 강의실에서 할 수 있는 가장 안전한 대답이니까."
    - when: "origin != '악역도련님' and (fate.edric == 'saved' or fate.edric == 'saved_by_teacher')"
      에드릭: "…오만이든 뭐든, 구해진 쪽은 고맙지. 그걸로 된 거 아냐?"
    - when: "origin != '악역도련님' and (fate.edric == 'saved' or fate.edric == 'saved_by_teacher')"
      나레이션: "강의실이 술렁였다. 벨모어가 도련님이 고맙다는 말을 했다."
    - when: "fate.edric == 'dead'"
      나레이션: "누군가 미궁에서 죽은 벨모어가 도련님 이야기를 꺼냈다가, 시스터 루나의 시선에 입을 다물었다."
    - when: "origin == '악역도련님'"
      나레이션: "몇몇이 힐끔 나를 본다. 미궁에서 살아 나온 벨모어가 도련님이 뭐라고 할지 궁금한 얼굴로."
    - "내 차례가 왔다."
    - 속마음: "(이건… 지금 내가 하는 일 그 자체다. 37개 엔딩 전부에서 누군가는 죽었다. 그걸 다 구하겠다는 건, 신앙일까 오만일까.)"
  choices:
    - text: "\"오만이에요. 그래도 할 거예요\""
      effects: ["affinity.luna += 6", "stat.의지 += 1"]
      lines:
        - "강의실이 다시 술렁였다."
        - 시스터 루나@웃음: "좋네요. 자기가 오만한 줄 아는 사람은 적어도 남 탓은 안 하거든요."
        - 시스터 루나: "그 대답, 졸업할 때까지 바꾸지 말아요."
    - text: "\"신앙이에요. 저는 아직 아무도 포기하지 않았으니까요\""
      effects: ["affinity.luna += 4", "stress -= 5"]
      lines:
        - 시스터 루나: "포기하지 않는 걸 신앙이라고 부르는 사람, 오랜만에 보네요."
        - 시스터 루나: "교회에선 그걸 고집이라고 불러요. 저는 신앙 쪽이 더 마음에 들지만요."
    - text: "\"구할 수 없는 사람인지는 해 봐야 알죠\""
      requires: "stat.지성 >= 16 or stat.의지 >= 16"
      effects: ["affinity.luna += 5", "stat.지성 += 0.5"]
      lines:
        - 시스터 루나: "…아. 문제의 전제를 걷어차네요."
        - 시스터 루나@웃음: "반칙인 거 알죠? 반칙도 점수는 줘요. 오늘만."
    - text: 세라의 대답을 기다린다
      when: "fate.sera == 'saved' or fate.sera == 'saved_quiet'"
      effects: ["affinity.sera += 5", "affinity.luna += 3"]
      lines:
        - "세라가 일어섰다. 손끝이 떨린다."
        - 세라: "저는… 구해진 적이 있어서, 잘 몰라요."
        - 세라: "그때 그 사람이 오만했대도, 저는 고마울 것 같아요. 그래서… 오만해도 괜찮다고 생각해요."
        - when: "fate.sera == 'saved'"
          나레이션: "자리에 앉으며 세라가 아주 잠깐 내 쪽을 봤다."
        - 시스터 루나: "……오늘 수업은 여기까지 해도 되겠네요."

# ================================================================ 수업 — 7월

- id: cls_sword_2
  title: 검술 — 지는 법
  on: auto
  free: true
  window: "1.7.1"
  slots: [밤, 주말]
  lines:
    - "무투대회 신청이 마감된 뒤. 가렌 교관이 1학년 전원을 연무장에 불러 모았다."
    - 가렌: "대회에 나가는 놈도, 안 나가는 놈도 들어라. 오늘은 이기는 법이 아니라 지는 법을 가르친다."
    - 학생들: "지는 법…?"
    - 가렌: "제대로 지는 놈은 다음에 다시 싸운다. 엉망으로 지는 놈은 다음이 없다."
    - "두 시간 동안 넘어지고, 굴렀다. 목검을 놓치는 법, 무릎을 꿇는 법, 그리고 일어나는 법."
    - when: "fired.bond_garen_1"
      속마음: "(새벽 수련 때 배운 것과 같다. 맞는 법, 넘어지는 법, 다시 일어나는 법.)"
    - "마지막에 가렌이 목검 끝으로 한 명씩 가리켰다."
    - 가렌: "카이든. 넌 질 줄을 모른다. 그게 네 약점이다."
    - 카이든: "……"
    - 가렌: "아렌. 넌 검이 대신 이겨 줄 거라 믿는다. 그것도 약점이다."
    - 가렌: "그리고 너."
  choices:
    - text: "\"제 약점은 뭔가요\""
      effects: ["affinity.garen += 4", "stat.의지 += 0.5"]
      branch:
        - when: "talent.겁쟁이"
          lines:
            - 가렌: "무서워한다."
            - 가렌: "…무서워하는 건 약점이 아니다. 무서워서 멈추는 게 약점이지. 넌 아직 안 멈췄다."
        - when: "stat.근력 >= stat.지성 + 10"
          lines:
            - 가렌: "힘을 믿는다. 힘은 배신한다. 반드시, 가장 필요할 때."
        - when: "stat.지성 >= stat.근력 + 10"
          lines:
            - 가렌: "생각이 많다. 칼끝이 머리보다 빨라야 할 때가 온다."
        - lines:
            - 가렌: "…아직 모르겠군."
            - 가렌: "그게 제일 위험하다. 자기 약점을 모르는 놈보다, 약점이 안 보이는 놈이."
    - text: 낙법 시범을 자청한다 (체질·민첩)
      check: { label: 낙법, value: "stat.체질 + stat.민첩 / 2 + luck", dc: 28 }
      success:
        lines:
          - "가렌의 목검에 다리가 걸리는 순간, 몸을 말아 굴렀다. 흙먼지 속에서 바로 일어섰다."
          - 가렌: "…그거다. 다들 봤나."
        effects: ["affinity.garen += 5", "reputation += 2", "stat.체질 += 0.5"]
      fail:
        lines:
          - "등부터 떨어졌다. 숨이 턱 막힌다."
          - 가렌: "그게 엉망으로 지는 거다. 다들 봤나."
          - "웃음소리가 터졌다. 그런데 가렌이 손을 내밀어 나를 일으켜 세웠다. 처음 있는 일이다."
        effects: ["affinity.garen += 3", "stress += 5"]
    - text: 카이든에게 다가간다
      when: "affinity.kaiden >= 10"
      effects: ["affinity.kaiden += 3", "trust.kaiden += 3"]
      lines:
        - 카이든@화남: "위로할 생각이면 관둬라."
        - 카이든: "…질 수 없는 사람도 있다. 황궁에선 한 번 지면 끝이니까."
        - 나: "여긴 황궁이 아니잖아."
        - "카이든이 대답 대신 목검을 들어 올렸다. 그리고, 일부러 한 번 넘어졌다. 어색하게."
        - 카이든: "……이렇게 하는 건가."

- id: cls_magic_2
  title: 마법학 — 학기 마지막 실습
  on: auto
  free: true
  window: "1.7.4"
  lines:
    - "1학기 마지막 마법학 수업. 창밖은 벌써 여름이다."
    - 엘베라: "오늘은 둘씩 짝을 지어요. 한 명은 결계를 치고, 한 명은 그걸 깨요."
    - 엘베라: "깨는 쪽은 상대를 다치게 하지 않을 만큼만. 치는 쪽은 상대를 믿을 만큼만. 둘 다 생각보다 어려워요."
    - 속마음: "(원작에선 엔딩 크레딧 직전에 '학기가 끝났다' 한 줄로 넘어가던 날이다.)"
  choices:
    - text: 미라벨과 짝을 한다 (내가 결계를 친다)
      when: "affinity.mirabel >= 5 or rival.mirabel"
      lines:
        - 미라벨: "내가 깨는 쪽이네. 버텨 봐. 3초면 충분하겠지만."
      check: { label: 결계 유지, value: "stat.마력제어 + stat.의지 / 2 + 8 * skill.방벽 + luck", dc: 32 }
      success:
        lines:
          - "미라벨의 세 번째 영창이 결계 표면에서 물보라처럼 흩어졌다. 미라벨이 지팡이를 내렸다."
          - 미라벨@당황: "…3초라고 한 건 취소할게."
          - 미라벨: "2학기엔 30초 안에 깨 줄 거야. 각오해."
        effects: ["affinity.mirabel += 5", "trust.mirabel += 3", "affinity.elvera += 3"]
      fail:
        lines:
          - "결계가 유리처럼 깨졌다. 미라벨이 손끝으로 내 이마를 툭 쳤다."
          - 미라벨: "2.8초. 과대평가했네. …방학 동안 연습해 와."
        effects: ["affinity.mirabel += 2"]
    - text: 리아나와 짝을 한다 (리아나가 결계를 친다)
      when: "affinity.liana >= 10"
      lines:
        - 리아나: "나 결계 진짜 못하는데… 살살 깨 줘?"
        - "리아나의 결계는 얇은 잎사귀 같았다. 그런데 이상하게 단단하다. 숲 냄새가 난다."
      check: { label: 다치지 않게 열기, value: "stat.마력제어 + stat.지성 / 2 + luck", dc: 28 }
      success:
        lines:
          - "결계에 손끝으로 작은 틈만 냈다. 그 틈으로 바람이 들어가 리아나의 머리카락을 흔든다."
          - 리아나@웃음: "간지러워! 이게 깨는 거야?"
          - 엘베라: "…이게 정답이에요. 다들 봐요. 부수는 게 아니라 여는 거예요."
        effects: ["affinity.liana += 5", "affinity.elvera += 4", "stat.마력제어 += 0.5"]
      fail:
        lines:
          - "힘 조절을 놓쳐 결계가 펑 터졌다. 리아나가 엉덩방아를 찧었다."
          - 리아나: "괜, 괜찮아! 진짜로."
          - "리아나는 웃으며 일어섰지만, 한 손이 잠깐 가슴께에 머물렀다."
          - when: "note.note_liana.known"
            속마음: "(…조심해야 한다. 이 아이의 심장은 생각보다 약하다.)"
        effects: ["affinity.liana += 3"]
    - text: 엘베라 교수에게 짝을 청한다
      lines:
        - 엘베라: "저랑요? 좋아요. 마음껏 깨 봐요. 봐주진 않을 거지만요."
      check: { label: 교수의 결계, value: "stat.마력제어 + stat.마력량 / 2 + luck", dc: 40 }
      success:
        lines:
          - "결계 표면에 머리카락 같은 금이 갔다. 엘베라의 눈썹이 아주 조금 올라갔다."
          - 엘베라: "…금이 갔네요. 이 결계에 금이 간 건, 한 오십 년 만인가요."
          - 엘베라@웃음: "방학 숙제 없음. 학생만요."
        effects: ["affinity.elvera += 6", "stat.마력제어 += 1"]
      fail:
        lines:
          - "있는 힘을 다 쏟아부었다. 결계는 물결 하나 일지 않았다."
          - 엘베라@웃음: "괜찮아요. 이걸 깨면 제가 곤란해져요."
          - 엘베라: "대신 학생 마력이 어디서 새는지는 잘 봤어요. 방학 동안 그쪽을 막아 봐요."
        effects: ["affinity.elvera += 3", "stat.마력제어 += 0.5"]

# ================================================================ 교수 인연 — 비스톨

- id: bond_bistol_1
  title: 비스톨 — 식은 커피
  on: 도서관
  priority: 1
  slots: [밤]
  when: "met.bistol and affinity.bistol >= 5 and fired.cls_alchemy_2"
  lines:
    - "미궁 실습이 끝난 뒤로 연금술 연구실 불이 꺼진 적이 없다는 소문이다. 상처약 주문이 밀려들었다고."
    - "폐관 직전의 열람실. 구석 자리에 누군가 엎드려 자고 있다. 책 더미 사이로 헝클어진 머리. 비스톨 교수다."
    - "팔꿈치 옆에는 식은 커피 잔. 그 옆에 펼쳐진 노트에는 빽빽한 배합식과, 몇 번이고 줄을 그어 지운 숫자들."
    - when: "bistol.gentle"
      속마음: "(화상 입은 학생에게 연고를 발라 주던 손이다. 지금은 펜을 쥔 채 굳어 있다.)"
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(원작 공식 교단 교주가 도서관 열람실에서 엎드려 자고 있다. 이런 장면은 원작에 없었다.)"
  choices:
    - text: 겉옷을 덮어 준다
      effects: ["affinity.bistol += 5"]
      lines:
        - "겉옷을 어깨에 걸쳐 주고 돌아서는데, 잠긴 목소리가 등 뒤에서 들렸다."
        - 비스톨: "…창문 닫고 가라. 밤바람은 몸에 안 좋아."
        - "그는 끝까지 고개를 들지 않았다. 대신 겉옷 깃을 조금 더 끌어당겼다."
    - text: 깨운다
      effects: ["affinity.bistol += 3", "trust.bistol += 3"]
      lines:
        - 나: "교수님, 폐관 시간이에요."
        - 비스톨@놀람: "──늦었나? 미안하다, 금방 갈──"
        - "벌떡 일어나던 비스톨이 나를 보고 멈췄다."
        - "누군가 다른 사람을 기다리던 얼굴이, 천천히 원래의 피곤한 얼굴로 돌아온다."
        - 비스톨: "…자네군. 아무것도 아니다. 꿈을 꿨어."
    - text: 펼쳐진 노트를 훑어본다 (지성)
      check: { label: 배합식 읽기, value: "stat.지성 + 10 * talent.직감 + luck", dc: 26 }
      success:
        lines:
          - "보존액이다. 살아 있는 조직을 상하지 않게 붙잡아 두는 배합. 연고 따위와는 차원이 다르다."
          - "기준 체중 칸에 적힌 숫자가 이상하게 작다. 다 큰 어른의 절반도 안 되는 무게."
          - 속마음: "(…어른의 몸이 아니다.)"
          - 비스톨: "남의 노트를 훔쳐보는 건 연금술사의 첫 번째 금기다."
          - "언제 깼는지, 비스톨이 노트를 덮고 있었다. 화난 목소리가 아니었다. 그냥 아주 지쳐 있었다."
        effects: ["know.bistol_formula = 1", "affinity.bistol += 1"]
      fail:
        lines:
          - "글씨가 너무 빽빽해서 한 줄도 읽지 못했다. 그때 노트가 탁 덮였다."
          - 비스톨: "읽지도 못할 걸 왜 보나. 가서 잠이나 자게."
        effects: ["affinity.bistol += 1"]

- id: bond_bistol_2
  title: 비스톨 — 두 그릇
  on: 아르바이트
  priority: 1
  when: "affinity.bistol >= 10 and fired.bond_bistol_1"
  lines:
    - "문 닫을 무렵의 식당. 마감 청소를 하던 참에 비스톨 교수가 들어와 구석 자리에 앉았다. 스튜 두 그릇."
    - when: "fired.enc_job_bistol"
      속마음: "(전에도 봤다. 한 그릇은 손도 대지 않고, 작은 숟가락을 옆에 놓아두던.)"
    - "오늘도 한 그릇 옆에는 아이용 작은 숟가락이 놓여 있다. 김이 천천히 식어 간다."
    - "그릇을 내려놓자 비스톨이 턱으로 맞은편 자리를 가리켰다. 앉으라는 건지, 그 자리는 안 된다는 건지 알 수 없다."
    - "주방에서 식당 아주머니가 손짓한다. ─ 앉아, 앉아. 쉬는 시간이야."
  choices:
    - text: 맞은편이 아니라 옆자리에 앉는다
      effects: ["affinity.bistol += 6", "trust.bistol += 4"]
      lines:
        - "비스톨이 아주 잠깐 놀란 얼굴을 했다. 그리고 아무 말 없이 빵 바구니를 내 쪽으로 밀었다."
        - 비스톨: "…거기가 맞다. 맞은편은, 비워 둬."
        - "우리는 말없이 스튜를 먹었다. 식은 그릇은 끝까지 그대로였다."
    - text: "\"그 그릇은 누구 몫이에요?\""
      effects: ["affinity.bistol += 2", "trust.bistol -= 2"]
      lines:
        - "숟가락이 멈췄다."
        - 비스톨: "약속한 사람 몫이다."
        - 비스톨: "늦는 사람이라. …아주 많이."
        - "그 뒤로 그는 한마디도 하지 않았다. 묻지 말걸 그랬다."
    - text: 빈 그릇 옆에 꿀과자를 하나 놓아둔다 (은화 5)
      requires: "money >= 5"
      effects: ["money -= 5", "affinity.bistol += 8", "trust.bistol += 5"]
      lines:
        - "주머니에 있던 꿀과자를 작은 숟가락 옆에 내려놓았다."
        - "비스톨이 그걸 오래 내려다봤다. 아주 오래."
        - 비스톨@슬픔: "……단 거라면 사족을 못 썼지."
        - 비스톨: "고맙네. 이건, 내가 전해 주지."

- id: bond_bistol_3
  title: 비스톨 — 되돌리는 연금술
  on: 마법실습
  priority: 1
  when: "affinity.bistol >= 16 and fired.bond_bistol_2"
  effects: ["stat.지성 += 1"]
  lines:
    - "복도 끝, 연금술 연구실 문이 반쯤 열려 있다. 안에서 비스톨이 손짓한다."
    - 비스톨: "들어오게. 남는 플라스크 정리 좀 도와."
    - "연구실은 생각보다 깔끔했다. 책상 위의 작은 액자 하나만 빼면."
    - "일곱 살쯤 된 소녀가 수줍게 웃고 있다. 액자 모서리가 손때로 닳아 반들거린다."
    - 비스톨: "자네, 연금술의 끝이 뭔지 아나."
    - 비스톨: "금을 만드는 것도, 불로장생도 아니야. 되돌리는 거지. 깨진 걸 붙이고, 시든 걸 피우고, 떠난 걸──"
    - "말이 끊겼다. 비스톨이 플라스크 하나를 불빛에 비춰 본다."
    - 비스톨: "젊을 땐 그런 연금술사들을 비웃었네. 다 미친놈들이라고."
    - 비스톨: "…요즘은, 그 사람들 마음을 알 것 같아."
    - when: "know.bistol_formula"
      속마음: "(그 노트. 어른의 절반도 안 되는 몸을 위한 보존액.)"
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(원작은 끝까지 이 사람이 왜 차원문을 열었는지 말해 주지 않았다. …정말 이유가 없었을까.)"
  plants:
    - { id: F06, notice: { value: "stat.지성 + 10 * talent.직감 + 10 * know.bistol_formula", dc: 20 } }
  choices:
    - text: "\"교수님은 그런 연금술사가 되지 마세요\""
      effects: ["bistol.warned = 1", "trust.bistol += 6", "affinity.bistol += 3"]
      lines:
        - 비스톨: "……"
        - 비스톨: "학생한테 그런 소리를 들을 줄은 몰랐군."
        - "그는 웃으려다 실패했다. 대신 플라스크를 조심스럽게 선반에 올렸다."
        - 비스톨: "기억해 두지. 자네가 그렇게 말했다는 거."
    - text: "\"되돌릴 수 있다면, 저라도 하고 싶을 것 같아요\""
      effects: ["bistol.empathy = 1", "affinity.bistol += 7"]
      lines:
        - 비스톨: "그렇지. 그게 사람이지."
        - "그의 눈이 처음으로 똑바로 나를 봤다. 반가움인지, 다른 무엇인지 모를 빛이었다."
        - 속마음: "(…방금 그 대답, 옳은 대답이었을까.)"
    - text: 액자 속 아이에 대해 묻는다
      requires: "trust.bistol >= 6"
      effects: ["trust.bistol += 4", "affinity.bistol += 4"]
      lines:
        - "비스톨이 대답 대신 액자를 집어 들었다. 손끝으로 유리 위의 먼지를 한 번 쓸었다."
        - "그리고 아주 조심스럽게, 액자를 엎어 놓았다."
        - 비스톨: "그 아이 이야기는 아직 못 하네."
        - 비스톨: "…언젠가 하게 된다면, 자네한테 하지."

# ================================================================ 교수 인연 — 시스터 루나

- id: bond_luna_1
  title: 시스터 루나 — 숨 쉬는 기도
  on: 성당
  priority: 1
  when: "met.luna and affinity.luna >= 12"
  lines:
    - "저녁 성당. 시스터 루나가 제단 촛대를 하나씩 닦고 있다. 걷어붙인 소매 아래로 오래된 흉터가 보인다."
    - 시스터 루나: "아, 마침 잘 왔어요. 그 촛대 좀 들어 줘요. 신은 사람을 공평하게 사랑하시는데, 촛대 무게는 공평하지 않거든요."
    - "촛대를 다 닦을 때까지 그녀는 아무것도 묻지 않았다. 마지막 촛대를 내려놓고서야 입을 열었다."
    - 시스터 루나: "요즘 얼굴이 쫓기는 사람 얼굴이에요. 시험 때문은 아닌 것 같고."
    - when: "talent.마왕의흔적"
      나레이션: "성수반 쪽으로 한 걸음 옮기자 가슴이 욱신거렸다. 시스터 루나가 아무렇지 않게 내 앞을 가로막고 섰다."
    - when: "talent.마왕의흔적"
      시스터 루나: "거긴 가지 말아요. 오늘 성수가 좀 독하게 나왔거든요. …제가 그렇다면 그런 거예요."
  branch:
    - when: "talent.마왕의흔적"
      effects: ["luna.covered = 1"]
  choices:
    - text: "\"해야 할 일이 너무 많아서요\""
      effects: ["affinity.luna += 5", "stat.의지 += 1", "stress -= 10"]
      lines:
        - 시스터 루나: "그럼 기도 하나 가르쳐 줄게요. 효과는 확실해요. 신이 안 들어 주셔도 효과가 있거든요."
        - 시스터 루나: "넷을 세며 들이쉬고, 넷을 세며 참고, 넷을 세며 내쉬어요. 끝에 '아멘'은 붙여도 되고 안 붙여도 돼요."
        - "따라 해 봤다. 가슴 안쪽에 얹혀 있던 무언가가 조금 내려앉았다."
        - 시스터 루나@웃음: "봐요. 신학은 생각보다 실용적인 학문이에요."
    - text: "\"시스터는 무서운 거 없어요?\""
      effects: ["affinity.luna += 4", "trust.luna += 4"]
      lines:
        - 시스터 루나: "많죠. 지금은 추기경님 서한이 제일 무섭고, 그다음이 다음 주 교수회의예요."
        - "농담처럼 말했는데, 눈은 웃지 않았다."
        - 시스터 루나: "무서운 게 있어야 기도도 하죠. 안 무서운 사람은 기도할 이유가 없어요."
    - text: 웃어넘긴다
      effects: ["affinity.luna += 2"]
      lines:
        - 시스터 루나: "그래요, 웃어요. 웃는 사람은 적어도 아직 안 진 거니까."

- id: bond_luna_2
  title: 시스터 루나 — 성인 아니면 이단
  on: 성당
  priority: 1
  when: "affinity.luna >= 22 and fired.bond_luna_1"
  lines:
    - "성당 뒤뜰. 시스터 루나가 빨래를 널고 있다. 하얀 수녀복들이 바람에 부풀어 오른다."
    - when: "kaiden.treat"
      시스터 루나: "그러고 보니 지난주에 황자님이 어깨를 보이러 오셨어요. 누가 보냈는지는 끝까지 말 안 하시더군요."
    - when: "kaiden.treat"
      시스터 루나@웃음: "의리 있는 분이에요. 누구랑 닮았네요."
    - when: "sera.warned"
      시스터 루나: "세라가 성녀 후보 시험을 미루고 싶다고 찾아왔어요. 누가 먼저 저한테 물어보라고 했다던데."
    - when: "sera.warned"
      시스터 루나: "잘했어요. 추기경 쪽 사람들은 사람을 안 봐요. 손등만 보죠."
    - when: "luna.covered"
      시스터 루나: "그리고 성수반 말인데요. 앞으로 미사 땐 제 오른쪽에 서요. 거기가 성수가 제일 안 튀는 자리예요."
    - 시스터 루나: "{{player.name}} 학생. 하나만 말해 둘게요."
    - 시스터 루나: "학생은 가끔 앞일을 다 아는 사람처럼 말해요. 표정도 그렇고요."
    - 시스터 루나: "교회는 그런 사람을 두 가지로 불러요. 성인, 아니면 이단."
    - 시스터 루나@웃음: "둘 다 오래 못 살았어요. 역사적으로."
    - 속마음: "(웃으면서 하는 말인데, 농담이 아니다.)"
  choices:
    - text: "\"시스터는 제가 어느 쪽 같아요?\""
      effects: ["affinity.luna += 5", "trust.luna += 3"]
      lines:
        - 시스터 루나: "저요? 저는 그냥, 수업 시간에 자주 창밖을 보는 학생 같아요."
        - 시스터 루나: "그러니까 둘 다 되지 말아요. 성인도 이단도 말고, 그냥 졸업하는 학생."
    - text: "\"조심할게요. 고마워요\""
      effects: ["trust.luna += 6", "affinity.luna += 3", "stat.의지 += 0.5"]
      lines:
        - 시스터 루나: "고맙다는 말은 졸업식 때 들을게요. 그때까지 둘 다 살아 있으면요."
        - when: "perk.고인물의기억 or perk.공략위키편집자"
          속마음: "(원작의 시스터 루나는 교회 숙청에 휘말려 죽는다. 졸업식은 보지 못한다.)"
    - text: "\"시스터도 뭔가 알고 있는 사람 같은데요\""
      requires: "trust.luna >= 4 or fs.F19.noticed"
      effects: ["trust.luna += 4", "affinity.luna += 4"]
      lines:
        - "빨래를 털던 손이 아주 잠깐 멈췄다."
        - 시스터 루나: "…그러니까 제가 아직 살아 있는 거예요. 아는 걸 다 말하지 않아서."
        - 시스터 루나@웃음: "학생도 그렇게 해요. 오래오래."
        - when: "fs.F19.noticed"
          속마음: "(성검은 고르지 않는다, 교회가 고른다. 그녀가 흘렸던 말이 떠오른다.)"

# ================================================================ 교수 인연 — 사서

- id: bond_librarian_1
  title: 사서 — 봄마다 하는 말
  on: 도서관
  priority: 1
  when: "affinity.librarian >= 8"
  lines:
    - "폐관 뒤의 도서관. 사서 노인이 등불 아래에서 낡은 책의 등을 꿰매고 있다. 바늘은 느리지만 한 번도 엇나가지 않는다."
    - 사서: "거기 서 있지 말고 앉게. 실 좀 잡아 주고."
    - "실을 잡아 주는 동안 노인은 올해 신입생 명부를 넘겼다. 이백 개의 이름."
    - 사서: "올해도 이름들이 곱구먼."
    - "명부를 덮으며, 노인이 아주 작게 덧붙였다. ─ 또 시작이구나."
    - when: "not fs.F02.noticed"
      속마음: "(…어디서 들은 말이다. 입학식 날, 강당 뒤편에서 성검을 보며.)"
  plants:
    - { id: F02, notice: { value: "stat.지성 / 2 + 15 * perk.고인물의기억 + 10", dc: 22 } }
  choices:
    - text: "\"입학식 날에도 그 말씀 하셨죠\""
      when: "fs.F02.noticed"
      effects: ["affinity.librarian += 4", "know.librarian_spring = 1"]
      lines:
        - "바늘이 멈췄다. 아주 잠깐."
        - 사서: "들었나. 귀가 밝군."
        - 사서: "봄마다 하는 말일세. 새 아이들이 오고, 똑같은 데서 넘어지고, 똑같은 데서 울고. 그걸 보면 절로 나오지. 또 시작이구나."
        - 사서: "…늙은이 혼잣말이야. 마음에 담지 말게."
        - 속마음: "(그날 그는 신입생들을 보고 있지 않았다. 성검을 보고 있었다.)"
    - text: 바느질을 배운다
      effects: ["affinity.librarian += 5", "stat.지성 += 0.5", "stat.의지 += 0.5"]
      lines:
        - 사서: "책은 등부터 상하네. 사람도 그렇지. 앞은 다들 신경 쓰는데, 등은 아무도 안 봐."
        - "노인의 손을 따라 몇 땀을 떴다. 삐뚤다. 노인은 고치지 않고 그대로 두었다."
        - 사서: "그 땀은 자네 걸로 남겨 두지. 이 책이 다음에 펼쳐질 때까지."
    - text: 아렌 이야기를 꺼낸다
      when: "aren.librarian"
      effects: ["affinity.librarian += 4", "affinity.aren += 2"]
      lines:
        - 사서: "아, 그 성검 든 아이. 왔다 갔네. 자네가 보냈다지."
        - 사서: "밤마다 검 속에서 누가 부른다더군. 그래서 말해 줬지. 검이 하는 말은 반만 들으라고. 나머지 반은 곁에 있는 사람 말을 들으라고."
        - 사서: "…잘 보냈네."

- id: bond_librarian_2
  title: 사서 — 지치거나, 혼자가 되거나
  art: library
  on: 도서관
  priority: 1
  when: "affinity.librarian >= 16 and fired.bond_librarian_1"
  lines:
    - "사서 노인이 서가 맨 위 칸을 지팡이로 가리켰다."
    - 사서: "저 파란 책 좀 꺼내 주게. 아니, 그 옆. 그래, 그거."
    - "먼지를 털자 표지의 금박 글씨가 드러났다. 지금은 아무도 못 읽는 옛 문자다. 노인은 그걸 신문 읽듯 술술 읽어 내려갔다."
    - 사서: "자네, 무언가를 바꾸려는 사람의 눈을 하고 있어."
    - "심장이 쿵 내려앉았다."
    - 사서: "놀랄 것 없네. 그런 눈은 가끔 있어. 아주 가끔."
    - 사서: "바꾸려는 사람은 대개 둘 중 하나로 끝나지. 지치거나, 혼자가 되거나."
    - 사서: "둘 다 되지 말게. 그게 내가 해 줄 수 있는 말의 전부야."
  choices:
    - text: "\"어르신은 어느 쪽이었어요?\""
      effects: ["affinity.librarian += 5", "librarian.advice = 1"]
      lines:
        - "노인이 책장을 넘기던 손을 멈췄다. 창밖을 오래 봤다."
        - 사서: "……둘 다였지."
        - 사서: "그러니 자네는 둘 다 되지 말라는 걸세."
        - 속마음: "(대사 세 줄짜리 NPC가 할 말이 아니다.)"
    - text: "\"혼자는 안 될 거예요. 같이 할 사람들이 있거든요\""
      when: "affinity.liana >= 20 or affinity.aren >= 20 or affinity.bruno >= 20 or affinity.kaiden >= 20 or affinity.mirabel >= 20 or affinity.finn >= 20"
      effects: ["affinity.librarian += 6", "stat.의지 += 1", "librarian.advice = 1"]
      lines:
        - 사서: "그래. 그게 답이네."
        - "노인이 웃었다. 주름이 깊게 접히는, 처음 보는 웃음이었다."
        - 사서: "옛날에도 그걸 아는 사람이 하나만 더 있었더라면…"
        - 사서: "아니, 아닐세. 늙으면 말이 헛나가."
    - text: 대답 대신 파란 책을 제자리에 꽂는다
      effects: ["affinity.librarian += 4", "stat.지성 += 1"]
      lines:
        - "파란 책을 원래 자리에 꽂았다. 노인이 천천히 고개를 끄덕였다."
        - 사서: "대답하지 않는 것도 대답이지. 젊은 사람치곤 현명하군."

# ================================================================ 교수 인연 — 엘베라 (3), 가렌 (3)

- id: bond_elvera_3
  title: 엘베라 — 태우지 않는 불
  on: 마법실습
  priority: 1
  when: "affinity.elvera >= 36 and fired.bond_elvera_2"
  lines:
    - "실습이 끝난 빈 실습실. 엘베라가 손바닥 위에 작은 불꽃을 띄워 놓고 있다."
    - "불꽃 바로 아래에 양피지가 놓여 있는데, 그을리지도 않는다."
    - 엘베라: "신기하죠? 불이라고 다 태우기만 하는 건 아니에요."
    - 엘베라: "저한테 처음 불을 가르쳐 주신 분은, 겨울이면 손바닥에 이런 불을 올려놓고 아이들 손을 녹여 주셨어요."
    - when: "elvera.shaken"
      엘베라: "학생이 전에 한 대답 말이에요. '누군가의 오랜 친구.' …오래 생각했어요."
    - when: "elvera.saw_mark"
      엘베라: "그리고 수정구 날, 학생 마력에 섞여 있던 붉은 실. 저 말고 본 사람은 없어요. 앞으로도 없게 할게요."
    - 엘베라: "그분은 지금… 아주 먼 곳에 계세요. 만날 수 없는 곳에."
    - when: "fs.F11.noticed"
      속마음: "(존칭을 붙일 뻔했던 이름. 불을 가르쳐 준 스승. …설마.)"
  choices:
    - text: "\"그 불, 저도 배울 수 있을까요?\""
      check: { label: 태우지 않는 불, value: "stat.마력제어 + stat.의지 / 2 + luck", dc: 34 }
      success:
        lines:
          - "손바닥 위에 불꽃이 맺혔다. 뜨겁지 않다. 양피지 끝이 그을리지 않았다."
          - 엘베라@웃음: "…그분이 보셨으면 좋아하셨을 거예요. 제 첫 시도보다 낫네요."
        effects: ["stat.마력제어 += 1.5", "affinity.elvera += 6", "know.warm_flame = 1"]
      fail:
        lines:
          - "불꽃이 양피지를 홀랑 태웠다. 엘베라가 웃음을 참으며 재를 털어 냈다."
          - 엘베라: "괜찮아요. 저는 삼십 년 걸렸어요."
        effects: ["stat.마력제어 += 0.5", "affinity.elvera += 4"]
    - text: "\"그분 이야기, 더 듣고 싶어요\""
      effects: ["trust.elvera += 6", "affinity.elvera += 4"]
      lines:
        - 엘베라: "……"
        - "엘베라가 불꽃을 쥐어 껐다. 손가락 사이로 연기가 한 줄기 피어올랐다."
        - 엘베라: "언젠가요. 학생이 졸업할 때쯤. 그때도 듣고 싶다면."
        - 엘베라@슬픔: "오백 년을 살면, 이야기를 꺼낼 때를 고르는 데도 오래 걸려요."
    - text: 조용히 불꽃을 바라본다
      effects: ["affinity.elvera += 5", "stress -= 10"]
      lines:
        - "둘이서 한참 불꽃을 봤다. 창밖으로 해가 졌다."
        - "불꽃은 끝까지 아무것도 태우지 않았다."

- id: bond_garen_3
  title: 가렌 — 다섯 개의 칼자국
  art: training_ground
  on: 훈련장
  priority: 1
  when: "affinity.garen >= 38 and fired.bond_garen_2"
  lines:
    - "새벽 수련이 끝난 뒤, 가렌이 말없이 훈련장 뒤편으로 걸어갔다. 따라오라는 말은 없었다. 오지 말라는 말도 없었다."
    - "잡초 사이에 낡은 나무 기둥 하나가 서 있다. 허리 높이에 칼자국 다섯 개가 나란히 새겨져 있다."
    - "넷은 이끼에 덮였고, 하나만 깨끗하다."
    - 가렌: "원정 떠나기 전날 밤에 새겼다. 한 사람씩."
    - 가렌: "매년 이맘때 와서 내 것만 닦는다. 나머지는… 닦을 사람이 없어서."
    - when: "fs.F23.noticed"
      속마음: "(20년 전, 지키지 못했다던 아이. 그리고 나머지 셋.)"
    - when: "finn.mentor == 'garen'"
      가렌: "…그 꼬마. 네가 데려왔지. 20년 만에 처음으로 뭘 가르치고 싶어졌다. 그건 고맙게 생각한다."
  choices:
    - text: 말없이 옆에서 목검을 휘두른다
      effects: ["affinity.garen += 6", "garen.praised = 1", "stat.근력 += 1"]
      lines:
        - "가렌은 한참 내 검을 지켜봤다."
        - 가렌: "…허리가 들어갔군."
        - "칭찬이었다. 입학하고 처음 듣는."
    - text: "\"그때 일, 언젠가 말씀해 주실 수 있어요?\""
      requires: "trust.garen >= 8"
      effects: ["trust.garen += 6", "affinity.garen += 4", "garen.promise = 1"]
      lines:
        - 가렌: "네가 졸업할 때까지 살아 있으면."
        - 가렌: "…그러니 살아 있어라. 그게 조건이다."
    - text: "\"교관님은 이번엔 안 돌아가세요\" (원작 지식으로 말한다)"
      when: "perk.고인물의기억 or perk.공략위키편집자"
      effects: ["trust.garen -= 4", "affinity.garen += 2", "garen.warned = 1"]
      lines:
        - "가렌의 눈이 가늘어졌다."
        - 가렌@진지: "…누가 죽는다고 했지."
        - 속마음: "(원작 5년차, 잿빛 장벽. 이 사람은 거기서 죽는다. 그리고 그 죽음이 아렌을 무너뜨린다.)"
        - 가렌: "헛소리 말고 검이나 들어. …내일 다섯 시."

- id: prof_corridor
  title: 교수 휴게실의 목소리
  on: [훈련장, 마법실습]
  pool: true
  chance: 0.5
  when: "affinity.garen >= 15 and affinity.elvera >= 15"
  lines:
    - "교무동 복도. 반쯤 열린 교수 휴게실 문틈으로 낮은 목소리가 새어 나온다."
    - 엘베라: "올해 또 성검이 반응했죠. 20년 만에."
    - 가렌: "…알고 있다."
    - 엘베라: "괜찮아요? 요즘 잠을 못 자는 얼굴이던데요."
    - "찻잔이 내려놓이는 소리."
    - 가렌: "이번엔 다르다. 다르게 할 거다."
    - 엘베라: "다르길 바라요. 저는 이 장면을 너무 많이 봤거든요."
    - 속마음: "(너무 많이…? 오백 년을 산 엘프라서? 아니면──)"
  choices:
    - text: 발소리를 죽이고 돌아선다
      effects: ["stat.지성 += 0.5"]
      lines: ["들은 건 들은 대로 남는다. 머릿속 노트 한쪽에 적어 두었다."]
    - text: 문을 두드린다
      effects: ["affinity.garen += 3", "affinity.elvera += 3"]
      lines:
        - "대화가 뚝 끊겼다. 문이 열리고, 엘베라가 아무 일 없다는 듯 웃는다."
        - 엘베라@웃음: "어머, 학생. 과제 질문이에요? 마침 가렌 교관님도 계시니 둘 다 물어봐요."
        - 가렌: "……"
        - "가렌은 찻잔만 내려다봤다. 아무 일 없었다는 얼굴이, 엘베라보다 한참 서툴렀다."

# ================================================================ 동아리 — 원예부 (온실)

- id: club_green_mandrake
  title: 맨드레이크 분갈이
  on: 온실
  pool: true
  lines:
    - "원예부장 선배가 귀마개 세 쌍을 작업대에 늘어놓았다. 4학년인데, 늘 흙 묻은 앞치마 차림이라 다들 학년을 자주 잊는다."
    - 원예부장: "오늘은 맨드레이크 분갈이. 뽑을 때 비명 지르니까 귀마개 꼭 해. 작년 신입은 이틀 누워 있었어."
    - 리아나: "숲에서는 노래 불러 주면서 뽑았는데…"
    - 원예부장: "그건 엘프 얘기고."
  choices:
    - text: 귀마개를 단단히 하고 뽑는다 (의지)
      check: { label: 비명 버티기, value: "stat.의지 + stat.체질 / 2 + luck", dc: 26 }
      success:
        lines:
          - "흙 속에서 주름진 얼굴이 튀어나와 입을 쩍 벌렸다. 귀마개 너머로도 머리가 울린다. 버텼다."
          - 원예부장: "오, 신입치고 안 쓰러졌네. 합격."
        effects: ["stat.의지 += 0.5", "affinity.liana += 2"]
      fail:
        lines:
          - "비명이 귀마개를 뚫고 들어왔다. 눈을 떠 보니 온실 천장이 보이고, 리아나가 부채질을 하고 있다."
          - 리아나: "괜찮아? 삼십 초 기절했어. 작년 선배보다는 짧대."
        effects: ["affinity.liana += 3", "fatigue += 10"]
    - text: 리아나와 같이 노래를 불러 주며 뽑는다
      requires: "affinity.liana >= 15 or talent.자연친화력"
      effects: ["affinity.liana += 6", "trust.liana += 2"]
      lines:
        - "리아나가 엘프어로 낮게 흥얼거렸다. 따라 불렀다. 가사는 모르지만 가락은 금방 몸에 익는다."
        - 나레이션:
            - "맨드레이크가 흙 밖으로 나오더니… 하품을 했다. 비명 대신."
            - { when: "talent.음치", text: "내가 따라 부르자 맨드레이크가 도로 흙 속으로 파고들었다. 리아나가 웃다가 주저앉았다. 결국 리아나 혼자 불렀다." }
        - 원예부장@놀람: "……이거 논문 써도 되냐?"
        - 리아나@웃음: "봐, 숲에서는 이렇게 한다니까."
    - text: 귀마개 없이 뽑아 본다 (원작에선 그냥 채집 아이템이었다)
      effects: ["fatigue += 15", "stress += 5", "affinity.liana += 2"]
      lines:
        - 속마음: "(원작에서 맨드레이크는 클릭 한 번이면 끝나는 채집물이었다. 비명 같은 건──)"
        - "──있었다."
        - "정신을 차렸을 땐 리아나가 젖은 수건을 내 이마에 올려 주고 있었다."
        - 원예부장: "신입. 다음부턴 선배 말 들어."

- id: club_green_night
  title: 밤의 온실
  on: 온실
  pool: true
  repeat: 2
  cooldown: 3
  slots: [밤]
  when: "affinity.liana >= 10"
  lines:
    - "밤의 온실. 유리 지붕 너머로 달빛이 쏟아진다."
    - "낮에는 꼭 닫혀 있던 하얀 꽃봉오리들이 하나둘 벌어지고 있다."
    - 리아나: "달맞이꽃이야. 밤에만 펴. 낮에만 오는 사람들은 이 꽃이 피는 줄도 몰라."
    - 리아나:
        - "…좀 나 같지 않아? 아, 아니다. 이상한 소리 했다."
        - { when: "affinity.liana >= 30", text: "너는 밤에 와서 다행이다. 낮에만 왔으면 이 꽃, 못 봤을 거야." }
  choices:
    - text: "\"밤에 피는 꽃도 꽃이야\""
      effects: ["affinity.liana += 5"]
      lines:
        - 리아나@웃음: "…응. 고마워."
        - "리아나가 고개를 숙였다. 달빛에 귀 끝이 반쯤 투명하게 빛났다."
    - text: 말없이 꽃이 피는 걸 같이 본다
      effects: ["affinity.liana += 4", "stress -= 10"]
      lines: ["꽃잎 하나가 펼쳐지는 데 백 번쯤 숨을 쉬었다. 리아나는 그 백 번을 같이 셌다."]
    - text: 꽃잎 하나를 말려 책갈피를 만들자고 한다
      when: "fired.bond_liana_2"
      effects: ["affinity.liana += 6", "trust.liana += 3"]
      lines:
        - 리아나: "내 월광초 책갈피 옆에 둘래."
        - 리아나@웃음: "두 장이면 덜 외롭겠다."

- id: club_green_wheat
  title: 원예부장의 밀
  on: 온실
  pool: true
  when: "time.month >= 4"
  effects: ["club.green_seed = 1"]
  lines:
    - "온실 맨 안쪽, 아무도 손대지 않는 화단. 원예부장이 쪼그려 앉아 밀싹에 물을 주고 있다."
    - 원예부장: "아, 이거? 내 졸업 작품. 마나를 거의 안 먹고도 자라는 밀이야."
    - 원예부장: "다들 쓸데없대. 마나가 넘쳐나는 세상에 왜 그런 걸 만드냐고."
    - 원예부장: "근데 할머니가 그랬거든. 땅이 지치는 해가 온다고. 그땐 이런 게 필요할 거라고."
    - 속마음: "(7년차. 세계수가 말라 죽고 대륙의 마나 농도가 떨어진다. 원작에선 기근 이벤트가 연달아 터졌다.)"
    - 속마음: "(원작엔 이 선배 이름조차 없었다. 그런데 지금, 멸망 하나를 미리 준비하고 있다.)"
  choices:
    - text: 교배 기록 정리를 돕는다 (지성)
      check: { label: 교배 기록, value: "stat.지성 + stat.마력제어 / 2 + luck", dc: 26 }
      success:
        lines:
          - "삼 년 치 기록을 표로 정리했다. 마나를 덜 먹는 쪽으로 이어지는 줄기가 한눈에 보인다."
          - 원예부장@놀람: "…너 원예부 말고 연금과 가라. 아니, 가지 마. 여기 있어."
        effects: ["stat.지성 += 0.5"]
      fail:
        lines:
          - "기록을 정리하다 두 장을 뒤섞었다. 원예부장이 한숨을 쉬며 다시 나눴다."
          - 원예부장: "괜찮아. 나도 첫해엔 씨앗 반을 쏟았어."
        effects: ["stress -= 3"]
    - text: "\"선배, 그거 꼭 완성하세요\""
      effects: ["stat.의지 += 0.5", "stress -= 5"]
      lines:
        - 원예부장: "…뭐야, 진지하게. 다들 웃던데."
        - 원예부장@웃음: "알았어. 너 하나 믿고 해 볼게."

- id: club_green_harvest
  title: 첫 이삭
  on: 온실
  pool: true
  when: "club.green_seed and time.month >= 6"
  lines:
    - "원예부장이 온실 문을 벌컥 열고 들어왔다. 손에 작은 이삭 하나를 쥐고."
    - 원예부장: "나왔어! 마나 거의 안 준 화단에서! 봐, 알이 찼어!"
    - "리아나가 박수를 쳤다. 이삭 하나에 셋이서 한참 호들갑을 떨었다."
    - 리아나: "숲에서도 이런 건 못 봤어. 땅한테 덜 기대는 식물이라니."
  choices:
    - text: 씨앗을 조금 나눠 달라고 한다
      effects: ["affinity.liana += 3", "stat.지성 += 0.5"]
      lines:
        - 원예부장: "가져가. 대신 어디 심었는지 꼭 적어 둬. 졸업하고 나면 너희가 이어 가야 하니까."
        - 속마음: "(작은 주머니 하나. 7년 뒤를 위한 첫 번째 보험이다.)"
    - text: 리아나에게 이삭을 건넨다
      effects: ["affinity.liana += 5", "trust.liana += 2"]
      lines:
        - 리아나: "나한테? …고마워. 숲에 편지 보낼 때 같이 넣어야지."
        - 리아나@웃음: "엄마 친구들이 깜짝 놀랄 거야. 인간 아카데미에서 이런 걸 만들었다고."

# ================================================================ 동아리 — 검술부

- id: club_sword_thousand
  title: 천 번 내려베기
  on: 검술부
  pool: true
  repeat: 2
  cooldown: 3
  lines:
    - 검술부장: "신입은 오늘 천 번이다. 내려베기 천 번. 세는 건 각자 양심에 맡긴다."
    - 나레이션:
        - "4학년 검술부장은 말이 짧고 목소리가 낮다. 졸업하면 기사단에 들어간다고 했다."
        - { when: "fired.club_sword_thousand >= 2", text: "또 천 번이다. 지난번보다 팔이 덜 떨린다. 아마도." }
    - "오백 번쯤에서 팔이 떨리기 시작했다. 옆에서 카이든은 숫자를 세지도 않고 휘두르고 있다."
  check: { label: 천 번, value: "stat.체질 + stat.의지 / 2 + luck", dc: 30 }
  success:
    lines:
      - "천 번째에 목검을 내렸다. 손바닥 물집이 터졌다."
      - 검술부장: "세다가 틀렸지. 천 열두 번이었다. 나도 셌다."
    effects: ["stat.근력 += 1", "stat.의지 += 0.5", "reputation += 2"]
  fail:
    lines:
      - "칠백 번째쯤에 목검이 손에서 빠졌다. 주워 들고 끝까지 했다. 숫자는… 아마 천 번쯤."
      - 카이든: "구백팔십일. 열아홉 개 모자란다."
      - "카이든이 셌다. 내 걸."
    effects: ["affinity.kaiden += 2", "stat.체질 += 0.5", "fatigue += 10"]

- id: club_sword_edric
  title: 검술부 문 앞의 에드릭
  on: 검술부
  pool: true
  when: "origin != '악역도련님' and (fate.edric == 'saved' or fate.edric == 'saved_by_teacher')"
  lines:
    - "검술부 연습장 입구에서 누군가 머뭇거리고 있다. 에드릭 벨모어다. 손에 구겨진 가입 신청서를 쥐고."
    - 선배: "벨모어가 도련님? 미궁에서 질질 끌려 나왔다던 그 도련님?"
    - "에드릭의 얼굴이 시뻘게진다. 예전 같으면 여기서 가문 이름이 튀어나왔을 것이다."
    - 에드릭: "……네. 그 도련님입니다. 검을, 다시 배우고 싶습니다."
  choices:
    - text: 에드릭 옆에 선다 ("제가 보증할게요")
      effects: ["affinity.edric += 6", "trust.edric += 4"]
      lines:
        - 선배: "D반이 벨모어를 보증한다고? 세상 많이 변했네."
        - 에드릭@화남: "쓸데없는 짓 하지 마."
        - 에드릭: "(작게) …고맙다."
    - text: 에드릭이 스스로 버티게 둔다
      effects: ["affinity.edric += 3", "stat.의지 += 0.5"]
      lines:
        - "에드릭은 고개를 숙인 채 한참 서 있었다. 선배가 혀를 차고 신청서를 받아 들었다."
        - 선배: "내일부터 바닥 청소다. 도련님이라고 봐주는 거 없어."
        - 에드릭: "…네."
        - 속마음: "(원작의 에드릭은 저런 대답을 할 줄 몰랐다.)"
    - text: 카이든에게 눈짓한다
      when: "affinity.kaiden >= 15"
      effects: ["affinity.edric += 4", "affinity.kaiden += 3"]
      lines:
        - "카이든이 귀찮다는 얼굴로 다가왔다."
        - 카이든: "받아 줘라. 미궁에서 살아 나온 놈이 미궁 근처에도 안 가 본 놈보단 낫다."
        - 선배: "…황자님이 그렇다면야."
        - "에드릭이 멍하니 카이든을 봤다. 카이든은 이미 돌아서 있었다."

- id: club_sword_rain
  title: 빗속의 연습
  on: 검술부
  pool: true
  chance: 0.6
  when: "time.month >= 5"
  lines:
    - "소나기. 다들 처마 밑으로 뛰어갔는데, 검술부장은 연습장 한가운데서 움직이지 않는다."
    - 검술부장: "전장에선 비 온다고 안 쉰다. 남을 놈은 남아."
    - "절반이 남았다. 카이든은 당연하다는 듯 그 절반에 서 있다."
  choices:
    - text: 빗속에 남는다 (민첩)
      check: { label: 빗속 대련, value: "stat.민첩 + stat.체질 / 2 + luck", dc: 30 }
      success:
        lines:
          - "젖은 흙에 발이 미끄러지는 감각을 익혔다. 미끄러지는 쪽으로 같이 흘러가면, 넘어지지 않는다."
          - 카이든: "나쁘지 않군. 비 오는 날엔 너랑 하지."
        effects: ["stat.민첩 += 1", "affinity.kaiden += 2"]
      fail:
        lines:
          - "세 번 미끄러졌다. 세 번 다 카이든 앞이었다."
          - 카이든: "일어나. 그게 연습이다."
        effects: ["stat.체질 += 0.5", "affinity.kaiden += 1", "fatigue += 10"]
    - text: 처마 밑에서 부원들의 발을 관찰한다 (지성)
      effects: ["stat.지성 += 1", "know.kaiden_shoulder = 1"]
      lines:
        - "젖은 땅은 버릇을 숨기지 못한다. 누가 어느 발에 체중을 싣는지 훤히 보인다."
        - "카이든은 미끄러질 때마다 왼쪽 어깨부터 감쌌다."
    - text: 수건을 챙겨다 준다
      effects: ["stat.매력 += 0.5", "reputation += 1"]
      lines:
        - 검술부장: "…신입. 이런 건 매니저가 하는 거다."
        - 검술부장: "고맙다."

# ================================================================ 동아리 — 신문부

- id: club_news_poll
  title: 교수님께 묻는다
  on: 신문부
  pool: true
  when: "time.month >= 4"
  lines:
    - 부장: "이번 호 특집은 '교수님께 묻는다'! 신입이 돌아. 질문은 하나야. ─ 학생 시절 제일 싫었던 과목은?"
    - "교무동을 한 바퀴 돌았다."
    - 가렌: "…없다."
    - 가렌: "(한참 뒤) 역사. 외울 게 많았다."
    - 엘베라: "학생 시절이요? 너무 오래전이라… 아, 인간 언어 문법이요. 존댓말이 너무 많았어요."
    - 비스톨: "꺼져."
    - 비스톨: "…연금술. 지금도 싫다."
    - 시스터 루나@웃음: "신학이요. 정답이 정해진 과목은 다 싫었어요. 이건 기사에 쓰지 말아요."
    - 사서: "나 때는 과목이란 게 없었네. 칼 쓰는 법 하나만 배웠지."
    - 속마음: "(…칼?)"
  choices:
    - text: 루나 교수의 대답까지 그대로 싣는다 (특종)
      effects: ["reputation += 6", "affinity.luna -= 3"]
      lines:
        - "신문이 동났다."
        - "다음 날 성당 앞에서 시스터 루나가 웃으며 손을 흔들었다. 웃는 얼굴인데 등골이 서늘했다."
    - text: 루나 교수의 대답은 빼고 싣는다
      effects: ["reputation += 2", "affinity.luna += 4"]
      lines:
        - "평범한 기사가 나갔다."
        - "다음 날 성당 앞을 지나는데, 시스터 루나가 작게 윙크했다."
    - text: 사서 노인에게 다시 가서 묻는다 ("칼이요?")
      effects: ["affinity.librarian += 3"]
      lines:
        - 사서: "늙은이 농담일세. 기사엔 '독서'라고 써 주게. 그게 사서답잖나."
        - "노인은 웃었다. 그런데 책장을 넘기는 손바닥, 손가락이 시작되는 자리에 오래된 굳은살이 줄지어 있었다. 펜으로는 생기지 않는 자리다."

- id: club_news_ghost
  title: 도서관 유령 잠복 취재
  art: library
  on: 신문부
  pool: true
  slots: [밤]
  when: "time.month >= 4"
  lines:
    - 부장: "제보 들어왔어. 밤마다 도서관 3층 창문에 불빛이 돌아다닌대. 유령이다, 유령. 오늘 밤 잠복!"
    - "자정 무렵. 도서관 3층 창문에 정말로 작은 불빛 하나가 움직인다."
  check: { label: 잠입, value: "stat.민첩 + stat.지성 / 2 + luck", dc: 28 }
  success:
    lines:
      - "그림자를 따라 서가 사이로 숨어들었다."
      - "불빛의 주인은 촛대를 든 사서 노인이었다. 한 권 한 권 책등을 손끝으로 쓸며 걷는다. 누군가의 이름을 확인하듯이."
      - 사서: "…신문부인가. 유령은 아니니 실망하겠군."
      - 사서: "잠이 안 오는 밤엔 책들 안부를 묻네. 늙으면 아는 이름이 책밖에 안 남거든."
      - 부장: "(속닥) 근데 우리 선배의 선배가 그러는데, 저 할아버지 그때도 저 얼굴이었대. 사십 년 전에도."
      - 속마음: "(원작에서 사서는 대사 세 줄짜리 NPC였다. 그 세 줄 어디에도 '사십 년 전에도 같은 얼굴' 같은 건 없었다.)"
    effects: ["affinity.librarian += 4", "intel += 1"]
  fail:
    lines:
      - "계단에서 발을 헛디뎠다. 우당탕. 불빛이 꺼졌다."
      - "다음 날 아침, 신문부실 문에 쪽지가 붙어 있었다."
      - "── 3층 계단 넷째 칸은 삐걱거리니 조심하게. 도서관."
      - 부장: "…유령이 친절하네."
    effects: ["stress += 5", "affinity.librarian += 1"]

- id: club_news_headline
  title: 마감 전야
  on: 신문부
  pool: true
  when: "time.month >= 5"
  lines:
    - "마감 전날 밤. 신문부실 책상 위에 원고 더미, 식은 차, 그리고 엎드려 자는 부장."
    - 부장: "(잠꼬대) …헤드라인… 헤드라인이 약해…"
    - "1면 기사 제목 칸이 아직 비어 있다. 무투대회 우승 후보 특집이다."
    - 속마음: "(원작 신문부 루트에선 이 제목 하나로 평판 수치가 바뀌었다. 그땐 그냥 숫자였는데.)"
  choices:
    - text: "\"카이든 황자, 3학년도 못 이긴다\" (안전한 제목)"
      effects: ["reputation += 2"]
      lines: ["무난하게 팔렸다. 카이든은 기사를 읽지도 않았다는 소문이다."]
    - text: "\"성검의 평민, 황자를 넘을 수 있나\" (자극적인 제목)"
      effects: ["reputation += 5", "affinity.aren += 2", "affinity.kaiden -= 2"]
      lines:
        - "신문이 오전에 동났다. 점심때 아렌이 쭈뼛거리며 찾아왔다."
        - 아렌@당황: "저기… 그 기사 쓴 거 너야? 덕분에 오늘만 결투 신청을 세 번 받았어."
        - 아렌@웃음: "…근데 좀 기분 좋더라. 누가 날 그렇게 봐 준 건 처음이라."
    - text: "\"아델하이트의 천재, 실기 무패 행진\""
      when: "rival.mirabel"
      effects: ["reputation += 3", "affinity.mirabel += 5"]
      lines:
        - "다음 날 도서관. 미라벨이 신문을 반으로 접어 내 앞에 내려놓았다."
        - 미라벨: "기사 봤어. 사실이니까 고맙다곤 안 할게."
        - "미라벨은 그 신문을 다시 집어 가방에 넣었다. 조심스럽게, 구겨지지 않게."
    - text: "\"D반에도 다크호스가 있다\" (나를 띄운다)"
      requires: "reputation >= 10"
      effects: ["reputation += 8", "stress += 5"]
      lines:
        - 부장: "(벌떡 일어나서) …뻔뻔한데 마음에 들어."
        - "다음 날부터 복도에서 모르는 얼굴들이 나를 힐끔거린다. 좋은 건지는 잘 모르겠다."
