          - 속마음: "(용사 후보라고 다들 어려워한다. 원작에선 다들 주인공 옆에 서고 싶어 했는데.)"
          - "아렌이 내 박자에 맞춰 돈다. 등에 닿는 체온이 묘하게 든든하다."
