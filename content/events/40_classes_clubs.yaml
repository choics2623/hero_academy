# 수업, 교수, 동아리 (1학년 1학기)
#
# 1) 수업 장면: 주중 수업. on: auto + free: true 라서 행동 슬롯을 쓰지 않는다.
#    한 주 창(window)으로 박아 두고, 같은 주의 메인 사건(priority 10)이 먼저 오면 다음 슬롯에 열린다.
# 2) 교수 인연: 비스톨, 시스터 루나, 사서, 엘베라(3단계), 가렌(3단계). 일회성이라 priority 1.
# 3) 동아리 풀: 원예부(온실), 검술부, 신문부의 선배·부원들과 마주치는 장면 (pool: true).

# ================================================================ 수업 — 3월

- id: cls_alchemy_1
  title: 연금술 — 첫 수업
  art: alchemy_lab
  on: auto
  free: true
  window: "1.3.3"
  effects: ["met.bistol = 1", "affinity.bistol += 2"]
  lines:
    - "지하 연금술 실습실. 돌계단을 열두 칸 내려가자 공기가 눅눅해졌다."
    - "천장이 낮다. 키 큰 학생들은 들보에 이마를 찧지 않으려고 고개를 숙인 채 걷는다."
    - "어디선가 유황 냄새가 난다. 그 밑에 오래 끓인 약초의 쌉싸름한 냄새가 깔려 있다."
    - "책상마다 작은 솥 하나, 알코올 등잔 하나, 유리 접시 하나."
    - "1학년들이 쭈뼛쭈뼛 자리를 찾아 앉았다. 의자 끄는 소리가 낮은 천장에 부딪혀 돌아온다."
    - when: "met.bruno or affinity.bruno > 0"
      나레이션: "옆자리에 커다란 그림자가 털썩 앉았다. 브루노다. 의자가 비명을 질렀다."
    - when: "met.bruno or affinity.bruno > 0"
      브루노@웃음: "(속닥) 여기 앉아도 되지? 아는 얼굴이 너밖에 없어서."
    - "종이 울렸는데도 교탁은 비어 있다."
    - "삼 분쯤 지나서야 준비실 문이 열렸다. 사람보다 하품 소리가 먼저 나왔다."
    - "교탁 앞에 선 교수는 눈 밑이 거뭇하다. 셔츠 단추가 한 칸씩 밀려 잠겨 있다."
    - "손에는 김 빠진 커피 잔. 소매 끝이 약품에 얼룩져 군데군데 색이 바랬다."
    - 비스톨: "비스톨이다. 연금술 담당."
    - "그게 자기소개의 전부였다. 그는 출석부를 펴지도 않고 교탁에 팔꿈치를 괴었다."
    - 비스톨: "첫 시간이니 규칙만 말하지. 하나. 솥 앞에서 졸지 마라. 터진다."
    - 비스톨: "둘. 재료를 맛보지 마라. 죽는다."
    - 비스톨@진지: "셋. 수업 중에 나를 깨우지 마라. …내가 터진다."
    - "아무도 웃지 않았다. 농담인지 확신할 수가 없어서."
    - 학생 A: "(속닥) …웃어야 돼? 말아야 돼?"
    - 학생 B: "(속닥) 몰라. 일단 숨만 쉬어."
    - 속마음: "(원작 연금술 수업은 미니게임이었다. 다들 스킵했지. 나도 했고.)"
    - 속마음: "(타이밍 맞춰 버튼 누르는 리듬 게임. 판정이 개떡 같아서 '연금술은 운빨'이라는 밈까지 돌았다.)"
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(그리고 저 사람이 원작 공식 심연교단 교주다. 8년차 봄, 미궁 최하층에서 차원문을 연다.)"
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(…셔츠 단추도 제대로 못 잠그는 사람이.)"
    - 비스톨: "오늘은 간단한 거다. 소금물에서 소금만 다시 걸러내. 종 칠 때까지."
    - 비스톨: "간단하다고 했지 쉽다고는 안 했다. 불이 세면 튀고, 약하면 해가 진다."
    - "그는 그 말만 남기고 준비실로 돌아가 버렸다. 문틈으로 의자 삐걱이는 소리가 들렸다."
    - "등잔에 불을 붙였다. 솥 안의 소금물이 작게 떨린다."
    - 속마음: "(자, 어떻게 한다.)"
  choices:
    - text: 교과서대로 약불에 천천히 졸인다
      check:
        type: 손재주
        dc: 쉬움
        mods:
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      success:
        lines:
          - "교과서 12쪽. '불꽃은 손가락 한 마디 높이로. 서두르지 말 것.'"
          - "심지를 낮추고 기다렸다. 솥 가장자리부터 하얀 테가 생기기 시작한다."
          - "옆자리들에서 '퍽', '앗 뜨거' 소리가 이어지는 동안, 물은 아주 천천히 줄었다."
          - "종이 울리기 직전, 유리 접시 바닥에 하얀 결정이 눈처럼 깔렸다."
          - "언제 나왔는지 비스톨이 내 접시 위로 고개를 숙이고 있었다."
          - "그가 결정 한 알을 집어 등잔 불빛에 비춰 보았다. 오래, 말없이."
          - 비스톨: "…교과서를 읽은 놈이 있군. 놀랍게도."
          - 비스톨: "이름은 됐다. 다음 시간에도 읽어 오면 그때 외우지."
          - 속마음: "(칭찬… 맞지? 이 사람 기준으로는 아마 극찬이다.)"
        effects: ["affinity.bistol += 3", "stat.지성 += 0.5"]
      fail:
        lines:
          - "교과서대로 했다. 분명히 약불이었다."
          - "그런데 옆에서 누가 '불이 안 붙어!' 하며 등잔을 흔드는 바람에 고개를 돌린 사이──"
          - "솥 안에서 타닥타닥 소리가 났다. 소금이 튀어 오른다."
          - "불 조절을 놓쳤다. 접시에 남은 건 갈색 얼룩뿐이다."
          - "비스톨이 지나가다 멈췄다. 접시를 내려다보는 눈이 반쯤 감겨 있다."
          - 비스톨: "그걸 소금이라고 부를 거면 식당 가서 불러."
          - 비스톨: "…그래도 접시는 안 깼군. 다음."
          - 속마음: "(원작에선 이럴 때 '다시 하기' 버튼이 있었는데.)"
        effects: ["affinity.bistol += 1"]
      great:
        lines:
          - "비스톨이 결정 몇 알을 빈 약병에 쓸어 담았다."
          - "병에 라벨을 붙인다. 삐뚤빼뚤한 글씨로. ── 견본. 1학년."
          - 비스톨: "다음 학년들한테 보여 줄 거다. 1학년도 이 정도는 한다고."
          - "그는 약병을 준비실 선반 맨 앞줄에 세워 두었다. 먼지 하나 없는 자리였다."
          - 속마음: "(원작 미니게임 최고 판정은 'PERFECT'였다. 그 글자가 지금, 약병 라벨로 붙었다.)"
        effects: ["affinity.bistol += 2"]
    - text: 마력으로 물만 날려 본다
      check:
        type: 마법
        dc: 보통
        mods:
          - { when: "talent.원소친화.화", value: 2, label: 불의 결 }
          - { when: "talent.속성부적합.화", value: -3, label: 불이 안 맞음 }
      success:
        lines:
          - 속마음: "(공략 게시판의 꼼수. 마력제어만 받쳐 주면 미니게임 자체를 건너뛸 수 있었다.)"
          - "등잔은 켜지 않았다. 대신 솥 위에 손바닥을 펴고, 숨을 골랐다."
          - "손끝으로 열을 모아 수면만 살짝 끓였다. 바닥까지 데우면 소금이 탄다. 겉만, 아주 얇게."
          - "김이 가늘게 피어오른다. 주변 학생들이 하나둘 고개를 돌렸다."
          - 학생 A@놀람: "(속닥) 저거 불 없이 하는 거야?"
          - "김이 걷히자 결정만 남는다. 등잔으로 한 것보다 알이 고르다."
          - "비스톨의 한쪽 눈썹이 올라갔다."
          - 비스톨: "편법이군. …편법도 결과가 나오면 기법이다. 이름."
          - 나: "{{player.name}}입니다."
          - "그는 출석부를 처음으로 펴고, 무언가를 짧게 적었다."
        effects: ["affinity.bistol += 4", "stat.마력제어 += 0.5"]
      fail:
        lines:
          - "등잔 대신 손바닥을 솥 위에 폈다. 열을 모은다. 조금만, 조금만 더──"
          - "손끝이 뜨거워졌다. 너무 뜨거워졌다."
          - "쨍. 유리 접시가 열을 못 이기고 갈라졌다."
          - "실습실이 조용해졌다. 수십 개의 시선이 내 책상에 꽂힌다."
          - "준비실 문이 열렸다. 아주 천천히."
          - "비스톨이 깨진 조각을 집어 들고 오래 한숨을 쉬었다."
          - 비스톨: "아무도 안 죽었군. 첫 시간치곤 선방이다."
          - 비스톨: "접시값은 안 받는다. 대신 다음 시간엔 등잔을 써라. 등잔은 안 깨지거든."
          - 속마음: "(게시판 꿀팁은 마력제어 수치가 받쳐 줄 때 얘기였다. …지금 내 수치 말고.)"
        effects: ["affinity.bistol += 2"]
      great:
        lines:
          - "결정이 접시 위에서 서리꽃처럼 가지를 뻗었다. 하나하나가 모서리까지 반듯하다."
          - 비스톨: "…이걸 등잔으로 하면 사흘 걸린다."
          - "그가 출석부에 적은 무언가 옆에, 작은 별표를 하나 그렸다."
          - 속마음: "(별표. 원작 출석부엔 없던 표시다. 좋은 뜻이길 빈다. 아마 좋은 뜻이다.)"
        effects: ["stat.마력제어 += 0.5"]
      fumble:
        lines:
          - "갈라진 접시 틈으로 소금물이 튀어 올라 앞머리에 닿았다."
          - "치익. 머리카락 타는 냄새가 낮은 천장 아래 퍼졌다."
          - 학생 B@놀람: "(속닥) 머리… 머리에서 연기 나…"
          - 비스톨: "…물 한 바가지 끼얹어 줄까, 아니면 그 머리도 정제해 줄까."
          - 속마음: "(앞머리 한 줌이 소금 결정처럼 빳빳해졌다. 일주일은 갈 것 같다.)"
        effects: ["stress += 5"]
    - text: 옆자리 브루노의 솥부터 봐준다 (벌써 보라색으로 끓고 있다)
      when: "met.bruno or affinity.bruno > 0"
      effects: ["affinity.bruno += 2"]
      lines:
        - "옆 솥에서 보글보글, 소금물이 낼 리 없는 소리가 났다."
        - "브루노의 솥이다. 소금물이 벌써 보라색으로 끓고 있다."
        - 브루노@당황: "어, 어어? 이거 원래 보라색 되는 거야? 소금물이었잖아!"
        - 나@당황: "뭘 넣었어?"
        - 브루노: "아무것도! 아, 아까 손 씻으려고… 옆에 있던 병 물을 좀…"
        - "병에는 해골 그림이 그려져 있었다."
        - when: "talent.만독불침"
          나레이션: "솥에서 매운 김이 올라왔다. 앞뒤 자리가 기침을 하는데, 나는 숨 한 번 막히지 않았다."
        - 속마음: "(해골 병. 원작 연금술 미니게임의 함정 재료다. 중화제가… 뭐였더라.)"
      check:
        type: 손재주
        dc: 쉬움
        mods:
          - { when: "affinity.bruno >= 10", value: 2, label: 브루노와 손발 }
      success:
        lines:
          - "생각났다. 소금이다. 내 솥의 소금물을 한 국자 떠서 브루노 솥에 부었다."
          - "등잔을 끄고, 솥을 불에서 내리고, 둘이서 부채질을 했다."
          - "보라색 거품이 천천히 가라앉는다. 매운 김도 걷혔다."
          - "결과물은 둘 다 없었지만, 실습실은 무사했다."
          - 비스톨: "…거기 둘. 다음 시간부턴 떨어져 앉아."
          - "그런데 지나가던 그가 브루노 솥 바닥을 한 번 들여다보고, 짧게 덧붙였다."
          - 비스톨: "소금으로 눌렀군. 교과서 87쪽이다. 1학년이 거기까지 읽을 리가 없는데."
          - 브루노@웃음: "(속닥) 그래도 재밌었다. 그치?"
          - 속마음: "(원작에선 이름 한 줄로 지나가던 수업이다. 같이 부채질할 사람이 있으니, 한 줄로는 안 끝나네.)"
        effects: ["affinity.bruno += 1", "affinity.bistol += 1"]
      fail:
        lines:
          - "솥을 불에서 내리려고 손잡이를 잡았다. 생각보다 뜨거웠다."
          - "움찔한 사이 솥이 기울었다. 보라색 거품이 책상 위로 쏟아졌다."
          - "거품이 손등을 덮었다. 아프진 않았다. 대신, 색이 들었다."
          - 브루노@당황: "어… 너 손이 보라색이야. 아, 나도 보라색이야."
          - "둘이서 수돗가에서 열 번을 씻었다. 색은 빠지지 않았다."
          - 비스톨: "사흘이면 빠진다. 그 사흘 동안 온 학교가 너희가 뭘 했는지 알게 되겠지."
          - 비스톨: "…다음 시간부턴 떨어져 앉아."
          - 브루노@웃음: "(속닥) 근데 이거 좀 멋있지 않냐? 보라색 의형제 같아."
          - 속마음: "(한 줄로 끝났으면 손이 보라색이 될 일도 없었겠지. …나쁘지 않다. 조금은.)"
        effects: ["stress += 3"]
    - text: 실 한 가닥을 솥에 드리워 결정을 키운다 (연금 서번트)
      when: "talent.서번트.연금"
      lines:
        - 속마음: "(교과서엔 없는 방법이다. 그런데 손이 먼저 안다. 이 몸은 솥 앞에서 이상하게 침착하다.)"
        - "앞치마 실밥 한 가닥을 뽑아 깃펜 끝에 묶었다."
        - "약불로 졸이다가, 소금물이 걸쭉해지는 순간 실을 수면에 드리웠다."
        - "숨을 참았다. 등잔 불꽃이 손가락 한 마디 높이에서 멈춰 있다."
      check:
        type: 손재주
        dc: 보통
      success:
        lines:
          - "실을 따라 결정이 맺혔다. 하나, 둘, 그리고 줄줄이."
          - "종이 울릴 즈음, 실 끝에 엄지만 한 소금 결정이 매달려 있었다."
          - "등잔 불빛이 결정 안에서 꺾여 무지개처럼 갈라진다."
          - 학생 A@놀람: "(속닥) 저거 보석이야? 소금이야?"
          - "준비실 문이 열렸다. 비스톨이 커피 잔을 든 채 멈춰 섰다."
          - 비스톨: "…누가 가르쳐 줬나."
          - 나: "그냥, 이렇게 하면 될 것 같아서요."
          - 비스톨: "그냥."
          - "그가 결정을 오래 들여다봤다. 처음으로 졸음기가 가신 눈이었다."
          - 비스톨: "이름. 그리고 다음 시간부턴 앞자리에 앉아."
          - 속마음: "(서번트. 한 분야에 몰빵한 대가로 나머지가 다 깎이는 재능이다. 오늘만큼은 남는 장사다.)"
        effects: ["affinity.bistol += 5", "stat.지성 += 0.5", "stat.마력제어 += 0.5"]
      fail:
        lines:
          - "실을 따라 결정이 맺혔다. 그런데 모양이 이상하다."
          - "한쪽으로만 자라더니, 실이 무게를 못 이기고 툭 끊어졌다."
          - "결정은 솥 바닥으로 가라앉아 다시 녹아 버렸다."
          - "비스톨이 어깨 너머로 그 과정을 처음부터 보고 있었다."
          - 비스톨: "실이 너무 가늘었다. 무명실을 써."
          - 비스톨: "…발상은 교과서보다 낫군. 이름."
          - 속마음: "(실패했는데 이름을 물었다. 이 사람의 채점 기준은 결과가 아니라 손인가 보다.)"
        effects: ["affinity.bistol += 3", "stat.마력제어 += 0.5"]

- id: cls_theology_1
  title: 신학 — 첫 질문
  art: chapel
  on: auto
  free: true
  window: "1.3.4"
  effects: ["met.luna = 1", "affinity.luna += 2"]
  lines:
    - "성당 옆 강의실. 아침 미사가 끝난 지 얼마 안 돼서 향 냄새가 복도에 남아 있다."
    - "스테인드글라스 빛이 책상 위에 비스듬히 눕는다. 파랑, 금색, 그리고 성검을 든 용사의 붉은 망토."
    - "의자가 딱딱하다. 앉은 지 오 분 만에 꼬리뼈가 항의를 시작했다."
    - "검은 수녀복의 교수가 출석부를 덮으며 웃는다."
    - "웃는 얼굴인데, 눈은 출석부보다 정확하게 우리를 세고 있다."
    - 시스터 루나@웃음: "신학 담당 루나예요. 시스터라고 불러도 되고 교수님이라고 불러도 돼요."
    - 시스터 루나: "졸면 둘 다 대답 안 해요."
    - "뒷줄에서 누군가 허리를 꼿꼿이 폈다."
    - 시스터 루나: "이 수업엔 교과서가 두 권 있어요. 교회가 쓴 책 한 권, 그리고 여러분 머리 한 개."
    - 시스터 루나: "시험은 앞의 걸로 봐요. 졸업은 뒤의 걸로 하고요."
    - when: "fate.sera == 'saved' or fate.sera == 'saved_quiet'"
      나레이션: "앞쪽 자리에 은발이 보인다. 세라다. 펜을 쥔 손등을 다른 손으로 감추듯 덮고 있다."
    - 시스터 루나: "자, 첫 질문. 천 년 전, 여신님은 왜 직접 마왕을 막지 않으셨을까요?"
    - "강의실이 조용해졌다."
    - "맨 앞줄 귀족 학생이 손을 들었다가 슬그머니 내렸다."
    - 학생 A: "(속닥) 저거 함정 질문이지?"
    - 학생 B: "(속닥) 신학 시간에 함정 아닌 질문도 있어?"
    - 시스터 루나@웃음: "속닥거리는 것도 대답으로 쳐 줄까요? 아, 안 되겠다. 오답이네요."
    - "두 학생이 동시에 입을 다물었다."
    - 속마음: "(원작 신학 수업은 선택지 세 개짜리 퀴즈였다. 정답은 늘 '여신의 뜻'.)"
    - 속마음: "(그런데 저 사람 표정은 그 답을 기다리는 얼굴이 아니다.)"
    - "시선이 내 쪽에서 멈췄다. 눈웃음이 반 뼘쯤 깊어진다."
    - 시스터 루나: "거기, 창가. 얼굴에 할 말이 쓰여 있네요."
    - 속마음: "(…들켰다.)"
  choices:
    - text: "\"여신의 뜻이니까요\" (교과서 정답)"
      effects: ["affinity.luna += 1", "stress -= 5"]
      lines:
        - 나: "여신의 뜻이니까요."
        - "몇몇이 안도의 숨을 쉬었다. 그래, 저게 정답이지."
        - 시스터 루나@웃음: "만점짜리 대답이네요. 시험에선 꼭 그렇게 쓰세요."
        - "그녀가 출석부를 다시 펴며, 아무렇지 않게 덧붙였다."
        - 시스터 루나: "…시험에서만요."
        - "웃음소리가 났다. 웃은 사람들도 왜 웃었는지 모르는 얼굴이었다."
        - 속마음: "(안전한 답. 원작에선 이걸로 '신앙 +1'을 받았다. 지금 받은 건… 숙제 같은 기분이다.)"
        - when: "talent.성흔"
          속마음: "(손등이 따끔했다. 정답을 말했는데, 성흔은 어쩐지 불만인 것 같다.)"
    - text: "\"막을 수 없었던 거 아닐까요\""
      lines:
        - 나: "…막을 수 없었던 거 아닐까요."
        - "누군가 숨을 들이켰다. 성당 옆 강의실에서 할 소리가 아니다."
        - "스테인드글라스 속 용사가 나를 내려다보는 것 같았다."
        - 시스터 루나@웃음: "어머. 근거는요? 이단도 근거가 있어야 이단이에요."
      check:
        type: 설득
        dc: 보통
        mods:
          - { when: "stress >= 60", value: -2, label: 긴장 }
      success:
        lines:
          - 나: "막을 수 있었다면 성검을 남길 필요가 없었으니까요. 사람 손에 쥐여 줄 필요도요."
          - "시스터 루나의 눈웃음이 반 뼘쯤 깊어졌다."
          - 시스터 루나: "흥미로운 이단이네요. 이름이 뭐예요?"
          - 나@당황: "{{player.name}}… 입니다."
          - "강의실이 얼어붙었다. 시스터 루나가 출석부에 뭔가를 적었다."
          - "펜 끝이 사각, 사각, 길게 움직였다. 이름 하나 적는 것치고는 너무 길게."
          - 학생 A@놀람: "(속닥) 쟤 이단 심문 가는 거 아냐…?"
          - 시스터 루나@웃음: "농담이에요. 반쯤은. 출석 체크했을 뿐이에요."
          - 시스터 루나: "그럼 막을 수 없었던 여신님은 대신 무얼 하셨을까요. 다음 시간까지 생각해 와요. 학생만."
          - 속마음: "(출석 체크가 저렇게 길 리가 없다.)"
        effects: ["affinity.luna += 4"]
      fail:
        lines:
          - 나: "그, 그러니까… 막을 수 있었으면 막았을 테니까요."
          - "말해 놓고 보니 근거가 아니라 같은 말의 반복이었다."
          - "뒷줄에서 웃음이 새어 나왔다. 앞줄 귀족 학생이 대놓고 코웃음을 쳤다."
          - 시스터 루나@웃음: "동어반복이네요. 이단치고는 성의가 없어요."
          - 시스터 루나: "그래도 질문을 피하진 않았네요. 이 교실에서 제일 흔한 죄가 침묵이거든요."
          - "그녀가 출석부에 무언가를 짧게 적었다. 이번엔 정말 짧게."
          - 속마음: "(원작 퀴즈엔 '근거를 대시오' 같은 후속 질문이 없었다.)"
          - 속마음: "(3,000시간 동안 단련한 건 선택지를 고르는 손가락뿐이었나.)"
        effects: ["affinity.luna += 2", "stress += 5"]
      great:
        lines:
          - 시스터 루나: "…다음 시간, 이 질문으로 토론 수업을 열어도 될까요?"
          - 시스터 루나@웃음: "학생 덕분에 교안을 하나 버리게 됐네요. 고마워요. 진심으로요."
          - 속마음: "(교안을 버리게 했다. 칭찬… 이겠지? 저 웃는 얼굴로는 확신할 수가 없다.)"
        effects: ["affinity.luna += 2", "stat.지성 += 0.5"]
    - text: "\"인간이 스스로 하길 바라신 거겠죠\""
      effects: ["affinity.luna += 3", "stat.의지 += 0.5"]
      lines:
        - 나: "인간이 스스로 하길 바라신 거겠죠."
        - "시스터 루나가 고개를 살짝 기울였다. 마음에 드는 장난감을 찾은 고양이 같은 각도로."
        - 시스터 루나: "그래서 성검을 남기셨다? 좋아요. 그럼 다음 질문."
        - 시스터 루나@진지: "그 성검을 누가 쥘지는, 누가 정하죠?"
        - "아무도 대답하지 않았다."
        - "누군가 '성검이 고르죠'라고 중얼거렸지만, 끝까지 손을 들지는 않았다."
        - "시스터 루나는 대답을 기다리지 않고 칠판으로 돌아섰다."
        - "분필이 칠판을 긁었다. ── 고르는 자는 누구인가."
        - when: "perk.고인물의기억 or perk.공략위키편집자"
          속마음: "(원작에선 '성검이 스스로 고른다'가 공식 설정이었다.)"
        - when: "perk.고인물의기억 or perk.공략위키편집자"
          속마음: "(그런데 저 질문, 꼭 다른 답을 아는 사람처럼 들린다.)"
        - 속마음: "(질문만 남기고 돌아서는 뒷모습이, 이상하게 쓸쓸해 보였다.)"
        - when: "talent.마왕의흔적"
          속마음: "(누가 정하느냐. 적어도 이 몸에 박힌 붉은 실은, 내가 정한 게 아니었다.)"
    - text: 세라를 슬쩍 본다 (손을 들까 말까 망설이고 있다)
      when: "fate.sera == 'saved' or fate.sera == 'saved_quiet'"
      effects: ["affinity.sera += 4", "affinity.luna += 3"]
      lines:
        - "앞쪽에서 은발이 움찔거린다. 세라다."
        - "손이 반쯤 올라갔다가, 내려갔다가, 다시 올라가려다 멈춘다."
        - 속마음: "(원작의 세라는 이 교실에 없었다. 3월 시험에서 떨어져 고향으로 돌아갔으니까.)"
        - "눈이 마주쳤다. 작게 고개를 끄덕여 보였다."
        - when: "talent.사람좋은얼굴"
          나레이션: "내 얼굴을 본 세라의 어깨에서 힘이 조금 빠졌다. 사람 좋은 얼굴은 이럴 때 쓰는 거다."
        - "세라가 작게 숨을 삼키고, 손을 들었다."
        - 세라: "여, 여신님은… 막으셨다고 생각해요. 사람의 손을 빌려서요."
        - 세라: "용사님의 손도, 그 곁에 있던 사람들의 손도… 전부 여신님 손이었던 거예요."
        - 시스터 루나: "……좋은 대답이에요. 아주."
        - "시스터 루나의 시선이 세라의 손등에 오래 머물렀다. 웃음기가 아주 잠깐 사라졌다."
        - "세라는 자리에 앉자마자 귀까지 빨개져서 책에 얼굴을 묻었다."

# ================================================================ 수업 — 4월

- id: cls_history_1
  title: 세계사 — 사서의 대강
  art: classroom
  on: auto
  free: true
  window: "1.4.3"
  lines:
    - "세계사 시간. 교실 문에 종이 한 장이 붙어 있다."
    - "── 담당 강사 봄 감기로 휴강. 대강: 도서관."
    - 학생 A@웃음: "휴강이네? 대강이 도서관이면… 자습?"
    - "기대는 오래가지 않았다. 종이 울리자 지팡이 소리가 복도를 따라 다가왔다."
    - "대신 들어온 사람은 도서관 사서 노인이었다. 지팡이를 짚고, 교과서 없이."
    - "등이 조금 굽었고, 하얀 수염이 가슴께까지 내려온다. 콧등에 걸친 둥근 안경, 기운 자국이 있는 회색 옷."
    - 학생들: "(속닥) 사서 할아버지가 수업을…?"
    - 학생 B: "(속닥) 저 할아버지 맨날 카운터에서 졸고 계시잖아."
    - 사서: "책을 오래 지키다 보면 이런 일도 맡게 되지."
    - "노인은 교탁 뒤에 서지 않았다. 창가 의자를 끌어다 앉았다. 봄볕이 무릎 위에 떨어졌다."
    - 사서: "교과서 3장. 천 년 전, 봉인 전쟁."
    - "책장 넘기는 소리가 났다. 노인은 교과서를 펴지 않았다. 창밖을 보며 이야기를 시작했다."
    - 사서: "그해 겨울은 길었네."
    - 사서: "칼데라 고개에 눈이 허리까지 쌓여서, 용사 일행은 말을 버리고 걸어서 넘었지."
    - 사서: "앞사람 발자국을 그대로 밟아야 했어. 한 발만 비껴도 눈이 사람을 삼켰거든."
    - "누군가 펜을 내려놓았다. 받아 적는 걸 잊은 얼굴이었다."
    - 사서: "마지막 밤에 다섯이 모닥불을 피웠어. 아무도 내일 이야기는 하지 않았네."
    - 사서: "다들 고향 이야기만 했지. 누구네 집 빵이 제일 맛있는지, 누구 동생이 제일 성가신지."
    - 사서: "…그런 걸로 밤새 싸웠어. 내일 죽을지도 모르는 사람들이."
    - "교실이 쥐 죽은 듯 조용하다. 창밖에서 새 한 마리가 울었다."
    - "교과서 어디에도 모닥불 이야기는 없다. '용사 일행이 칼데라 고개를 넘었다', 한 줄뿐이다."
    - 속마음: "(원작에선 세계사 수업 텍스트를 스킵 버튼 연타로 넘겼다. …이런 내용이었나?)"
    - 속마음: "(스킵 버튼 너머에 이런 이야기가 있었다면, 나는 3,000시간 동안 뭘 본 걸까.)"
    - "노인의 목소리는 낮고 느렸다. 책을 읽는 속도가 아니라, 기억을 더듬는 속도였다."
  plants:
    - { id: F15, notice: { value: "stat.지성 + 15 * talent.완전기억 + 10 * perk.고인물의기억", dc: 32 } }
  choices:
    - text: 한 줄도 놓치지 않고 받아 적는다
      check:
        type: 학식
        dc: 쉬움
        mods:
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      success:
        lines:
          - "펜을 다시 쥐었다. 고개, 눈, 말, 다섯, 모닥불."
          - "노인의 말은 느렸지만 쉬지 않았다. 손목이 저려 왔다."
          - "노트가 빼곡해졌다. 교과서보다 노트가 두꺼워질 것 같다."
          - "종이 울렸다. 노인이 지팡이를 짚고 일어서다가 내 책상 앞에서 멈췄다."
          - 사서: "적는 손이 바쁘군. 좋아. 적어 둔 건 잊어도 다시 찾을 수 있지."
          - 사서: "…잊는 건, 생각보다 금방이거든."
          - 속마음: "(기억 풍화. 원작 시스템 이름이 머릿속을 스쳤다. 노인은 꼭 그걸 아는 사람처럼 말했다.)"
        effects: ["stat.지성 += 0.5", "affinity.librarian += 2"]
      fail:
        lines:
          - "처음 몇 줄은 적었다. 칼데라, 눈, 말."
          - "받아 적다 보니 이야기에 빠져서 손이 멈춰 있었다."
          - "정신을 차렸을 땐 종이 울리고 있었다. 노트엔 '모닥불'이라는 글자 하나뿐."
          - "그런데 이상하게, 그 한 단어만으로 장면 전체가 떠올랐다. 눈 덮인 고개, 다섯 개의 그림자, 불꽃."
          - 학생 A@웃음: "(속닥) 너도 다 못 적었지? 나도. 근데 이거 시험엔 안 나오겠지?"
          - 속마음: "(안 나올 거다. 교과서에 없으니까. …그래서 더 잊으면 안 될 것 같다.)"
        effects: ["affinity.librarian += 1", "stress -= 5"]
      great:
        lines:
          - "노인이 내 노트를 한 장 넘겨 보았다. 안경 너머 눈이 아주 조금 커졌다."
          - 사서: "…눈 밟히는 소리까지 적었군. 사각, 사각."
          - 사서: "이 노트, 다 쓰면 도서관에 한 부 맡겨 주겠나. 교과서가 못 적은 걸 적었으니."
          - 속마음: "(내 필기가 도서관 장서가 된다. 원작 엔딩 크레딧보다 오래 남겠지.)"
        effects: ["affinity.librarian += 2"]
    - text: "\"그걸 어떻게 아세요? 교과서엔 없는데요\""
      effects: ["affinity.librarian += 3"]
      lines:
        - 나: "저, 그걸 어떻게 아세요? 교과서엔 없는데요."
        - "학생들의 시선이 나에게, 그리고 노인에게로 옮겨갔다."
        - "노인이 천천히 고개를 돌렸다. 봄볕 속에서 눈동자가 아주 옅은 회색으로 보였다."
        - 사서: "책이 다 적지 못한 걸 기억하는 게 사서의 일일세."
        - 사서: "도서관엔 교과서 말고도 책이 많네. 아무도 펴 보지 않는 책들이."
        - "그는 수염을 한 번 쓸고, 웃는 듯 마는 듯 덧붙였다."
        - 사서: "…그리고 늙으면 남의 이야기도 제 이야기처럼 하게 되지. 신경 쓰지 말게."
        - 속마음: "(그런데 아까부터 그는 '그랬다더군'이 아니라 '그랬지'라고 말하고 있다.)"
        - when: "talent.직감"
          속마음: "(직감이 말한다. 이 사람은 거짓말을 하는 게 아니다. 진실을 반만 말하고 있을 뿐이다.)"
        - 속마음: "(…늙은이 말버릇이겠지. 아마.)"
    - text: 옆자리 아렌을 본다 (창밖을 멍하니 보고 있다)
      art: cg_aren_caldera
      effects: ["affinity.aren += 2"]
      lines:
        - "옆자리 아렌이 창밖을 멍하니 보고 있다. 펜이 손가락 사이에서 멈춰 있다."
        - "조는 줄 알았는데, 눈은 또렷하다. 어딘가 아주 먼 데를 보는 눈."
        - 나: "(작게) 아렌?"
        - 아렌: "(작게) …칼데라 고개. 이상하다. 처음 듣는 이름인데."
        - 아렌: "거기 바람 소리를 아는 것 같아. 눈 밟히는 소리도."
        - 아렌@당황: "뽀드득이 아니라… 사각, 사각. 얼어붙은 눈은 그렇게 울거든. 어? 내가 그걸 어떻게 알지."
        - "아렌이 스스로도 이상한지 고개를 저었다."
        - 아렌@웃음: "고향 산이랑 헷갈렸나 봐. 양 치던 데도 겨울엔 눈이 많았으니까."
        - when: "talent.마력감응"
          속마음: "(아렌 쪽에서 희미한 마력의 떨림이 느껴진다. 성검이 아니라, 아렌 자신에게서.)"
        - 속마음: "(원작 아렌에겐 이런 대사가 없었다. 플레이어의 분신에게 기억 같은 건 필요 없었으니까.)"
        - 속마음: "(그런데 지금 이 녀석은, 아무도 넣어 준 적 없는 기억을 더듬고 있다.)"
      plants:
        - { id: F24, notice: { value: "stat.지성 + 10 * talent.직감 + 10 * perk.고인물의기억", dc: 22 } }

- id: cls_magic_1
  title: 마법학 — 수정구
  art: magic_lab
  on: auto
  free: true
  window: "1.4.4"
  effects: ["met.elvera = 1"]
  lines:
    - "마법학 실습실. 3층 꼭대기, 둥근 천장에 별자리 그림이 희미하게 남아 있다."
    - "창문을 다 열어 놓았는데도 공기가 어딘가 찌릿하다. 마법을 오래 쓴 방에는 정전기 같은 게 남는다고 했다."
    - "엘베라 교수가 교탁 위에 사람 머리만 한 수정구를 올려놓았다."
    - "연보랏빛 곱슬머리 사이로 긴 귀가 삐죽 나온 엘프. 오백 살이라는데, 얼굴만 보면 막 졸업한 조교 같다."
    - 엘베라@웃음: "오늘은 각자 마력의 결을 볼 거예요. 손을 얹으면 색이 떠올라요."
    - 엘베라: "색에 좋고 나쁨은 없어요. …라고 말해도 다들 비교하겠죠. 오백 년 동안 안 그런 반이 없었어요."
    - "웃음이 터졌다. 그리고 다들 정확히 그 말대로, 서로의 손을 흘끔거렸다."
    - "미라벨이 먼저 손을 얹었다. 망설임이 없다."
    - "수정구 안에서 짙은 자줏빛이 소용돌이친다. 감탄이 터졌다."
    - 학생 A@놀람: "와… 저거 봐. 엄청 진하다."
    - 미라벨: "아델하이트의 색이야. 외워 둬."
    - "손을 떼는 미라벨의 턱이 조금 올라가 있었다. 그런데 손끝은, 아주 약간 떨리고 있었다."
    - "몇 명이 더 지나갔다. 연한 파랑, 흙빛, 탁한 초록. 엘베라는 한 명 한 명에게 짧게 무언가를 말해 주었다."
    - "아렌 차례. 수정구는 거의 반응하지 않았다."
    - "대신 아렌 허리춤의 성검이 낮게 웅웅거렸다. 실습실 유리창이 같이 떨었다."
    - 아렌@당황: "어, 어? 왜 검이 대답해?"
    - "엘베라의 시선이 성검에 잠깐 머물렀다. 놀란 얼굴도, 반가운 얼굴도 아니었다."
    - 속마음: "(원작에선 캐릭터 생성 때 고른 속성을 확인시켜 주는 연출이었다. 그땐 그냥 예쁜 이펙트였는데.)"
    - 속마음: "(내 재능은 내가 골랐다. 거울 앞에서. 그러니 결과도 안다. …아마도.)"
    - "내 차례다."
    - "수정구 표면은 생각보다 차갑다. 손바닥 아래에서 무언가가 숨을 쉬는 것 같았다."
  branch:
    - when: "talent.마나탱크"
      art: cg_crystal_crack
      lines:
        - "손을 얹는 순간 수정구가 새하얗게 차올랐다."
        - "빛이 넘쳤다. 교실 벽이 하얗게 물들고, 다들 눈을 가렸다."
        - "──쩍. 금이 갔다."
        - "정적. 금 간 수정구에서 하얀 김이 피식 새어 나왔다."
        - 엘베라: "…괜찮아요. 수정구는 창고에 또 있어요. 이런 그릇은 또 없겠지만요."
        - 학생 B@놀람: "(속닥) 수정구 깨지는 거 처음 봐…"
        - 미라벨@화남: "……"
        - "미라벨이 아무 말 없이 내 손과 수정구를 번갈아 봤다. 입술을 꽉 깨문 채로."
        - 속마음: "(마나 탱크. 숫자로 볼 땐 그냥 +20이었다. 숫자가 아니라 이런 거였구나.)"
      effects: ["affinity.elvera += 4", "reputation += 3"]
    - when: "talent.마력폭주체질"
      lines:
        - "손을 얹자 심장이 쿵 뛰었다. 다들 보고 있다. 미라벨도, 아렌도."
        - "수정구 색이 빨강, 파랑, 초록으로 미친 듯이 바뀌다가── 펑."
        - "연기. 기침 소리. 누군가의 비명."
        - "연기가 걷히자 엘베라가 침착하게 소화 마법을 거두고 있었다. 앞머리 끝이 조금 그을려 있었다."
        - 엘베라: "감정이 마력보다 앞서 달리네요. 나쁜 게 아니에요. 고삐가 없을 뿐이죠."
        - 엘베라@웃음: "고삐는 만들면 돼요. 고삐 없는 말은 많이 봤지만, 끝내 못 길들인 말은 별로 없었어요."
        - 학생 A@당황: "(속닥) 다음부턴 앞자리 앉지 말아야겠다…"
        - 속마음: "(심장이 아직 쿵쾅거린다. 다음에 안 터뜨리려면, 이 쿵쾅거림부터 다뤄야 한다.)"
      effects: ["affinity.elvera += 3", "stress += 5"]
    - when: "talent.마나회로손상"
      lines:
        - "아무 일도 일어나지 않았다."
        - "수정구는 그냥 커다란 유리공이었다. 내 손바닥이 비쳐 보일 만큼 투명한."
        - "뒤에서 킥킥대는 소리."
        - 학생 B: "(속닥) 저거 고장 났나? 아니면…"
        - "엘베라가 다가와 수정구가 아니라 내 손목을 잡았다. 손가락이 차갑고 가벼웠다."
        - 엘베라: "회로가 상했다고 그릇이 없는 건 아니에요."
        - 엘베라@진지: "마력이 밖으로 못 나오면, 안에서 쓰면 돼요. 몸 안에서."
        - 속마음: "(투기 루트. 원작에서 회로 손상 빌드에만 열리던 숨은 길이다. 이걸 수업 중에 대놓고 말해 주다니.)"
        - "킥킥대던 소리가 언제부턴가 들리지 않았다."
      effects: ["affinity.elvera += 4", "stat.의지 += 0.5"]
    - when: "talent.마왕의흔적"
      art: cg_crystal_mark
      lines:
        - "손을 얹었다. 맑은 빛이 수정구 안에 고였다. 평범한, 아주 평범한 색."
        - "그 사이로 검붉은 실 한 가닥이 스쳤다가 사라졌다. 눈 깜짝할 사이였다."
        - "손바닥 아래가 잠깐 뜨거웠다. 가슴 어딘가가 욱신했다."
        - "아무도 못 봤다. 엘베라만 빼고."
        - "그녀의 눈이 아주 잠깐 커졌다가, 아무 일 없다는 듯 웃음으로 덮였다."
        - 엘베라@웃음: "깨끗한 색이네요. 다음 학생."
        - 속마음: "(…봤다. 저 사람은 봤다.)"
        - 속마음: "(마왕의 흔적. 엘프 교수에게 들키는 전개는 위키 어디에도 없었다.)"
      effects: ["elvera.saw_mark = 1", "affinity.elvera += 2"]
    - when: "talent.성흔"
      lines:
        - "손을 얹자 손등이 따끔했다."
        - "수정구가 금빛으로 물들었다. 따뜻한 빛이 교실 바닥까지 번진다."
        - "창가 쪽 학생 몇이 저도 모르게 손을 모았다. 성당에서 보던 빛이었다."
        - 엘베라: "…성당에 자주 가 봐요. 시스터 루나가 아주 좋아하겠네요."
        - 엘베라@진지: "다만 좋아할 사람이 시스터 루나만은 아닐 거예요. 그건 기억해 둬요."
        - 속마음: "(성흔. 원작에서 교회가 '관리'하던 재능이다. 칭찬처럼 들리는 경고였다.)"
      effects: ["affinity.elvera += 3"]
    - check:
        type: 마법
        dc: 쉬움
      success:
        lines:
          - "숨을 고르고, 손바닥에 마력을 조금만 흘렸다."
          - "맑은 청록빛이 수정구 안에서 천천히 돌았다. 흐트러짐이 없다."
          - "봄날 개울 같은 색이었다. 바닥까지 비치는."
          - 엘베라@웃음: "깨끗하네요. 이런 결은 다듬을수록 좋아져요."
          - 학생 A: "(속닥) D반치고 괜찮은데?"
          - 속마음: "(D반치고. 엑스트라의 숙명이다. 그래도 나쁘지 않다.)"
        effects: ["affinity.elvera += 4", "stat.마력제어 += 0.5"]
      fail:
        lines:
          - "힘을 줬다. 너무 줬나. 덜 줬나."
          - "회색 안개가 겨우 피어올랐다가 꺼졌다."
          - "미라벨이 코웃음을 쳤다. 들으라는 듯이 크게."
          - 엘베라: "안개도 색이에요. 아직 모양이 정해지지 않았다는 뜻이죠."
          - 엘베라@웃음: "모양이 안 정해졌다는 건, 뭐든 될 수 있다는 뜻이기도 하고요."
          - 속마음: "(위로인지 진심인지. 오백 살 엘프의 말은 늘 둘 다 같다.)"
        effects: ["affinity.elvera += 2"]
      great:
        lines:
          - "청록빛 소용돌이 한가운데에 은빛 알갱이 하나가 반짝였다. 별처럼."
          - 엘베라: "…어머. 심지가 있네요. 이건 가르쳐서 생기는 게 아닌데."
          - 속마음: "(D반 엑스트라의 결에 심지가 있다. 원작 데이터엔 없던 항목이다.)"
        effects: ["affinity.elvera += 2"]
  choices:
    - text: 미라벨에게 "자줏빛, 예쁘던데"라고 말한다
      effects: ["affinity.mirabel += 3"]
      lines:
        - "수업이 끝나고 짐을 챙기는 미라벨 옆으로 갔다."
        - 나: "아까 자줏빛, 예쁘던데."
        - 미라벨@놀람: "……뭐?"
        - 미라벨@당황: "…색 칭찬 들으려고 한 거 아니거든."
        - "미라벨이 고개를 홱 돌렸다. 귀 끝이 수정구보다 빨갰다."
        - 미라벨: "아델하이트의 색이라고 했잖아. 예쁜 게 당연하지. …당연한 걸 왜 말해."
        - "그녀는 가방을 휙 메고 나가 버렸다. 문 앞에서 한 번, 발걸음이 멈췄다가 다시 이어졌다."
        - 속마음: "(칭찬에 약하다. 원작 위키 미라벨 항목의 첫 줄이었지. 직접 보니 생각보다 더 약하다.)"
        - when: "origin == '몰락귀족'"
          속마음: "(무너진 가문의 색을 칭찬받는 기분. 나도 조금은 안다. 이 몸의 집안도 무너졌으니까.)"
    - text: "\"색으로 실력이 정해지는 건 아니잖아\""
      effects: ["trust.mirabel += 3", "affinity.mirabel += 1"]
      lines:
        - "미라벨 옆에서 누군가 '역시 명문가 색은 다르네' 하고 수군대고 있었다."
        - 나: "색으로 실력이 정해지는 건 아니잖아."
        - "수군대던 무리가 흩어졌다. 미라벨이 나를 똑바로 봤다. 기분 나쁜 눈이 아니었다."
        - 미라벨@진지: "맞아. 그러니까 실기에서 보여줄게."
        - when: "talent.마나회로손상"
          미라벨: "…수정구에 아무 색도 안 뜬 사람이 하는 말이라, 이상하게 설득력은 있네."
        - 미라벨: "색이 예쁘다고 이기는 거면, 우리 가문은 안 무너졌어."
        - "목소리가 반 톤 낮아졌다. 그리고 금세 원래대로 돌아왔다."
        - 미라벨@웃음: "기대해. 그때 가서 울지나 말고."
        - 속마음: "(호감도는 그대로인데 눈빛이 달라졌다. …아니, 숫자 말고. 이건 그냥, 인정이다.)"
    - text: 아렌에게 성검 이야기를 묻는다
      effects: ["affinity.aren += 3"]
      lines:
        - "아렌은 실습실 구석에서 성검을 무릎에 올려놓고 내려다보고 있었다."
        - 나: "아까 그거, 자주 그래?"
        - 아렌: "가끔 이래. 내 마력을 검이 먼저 먹어 버리는 것 같아."
        - 아렌: "밥 먹을 때도 그래. 배가 고픈데, 내가 고픈 건지 검이 고픈 건지 헷갈려."
        - 아렌@웃음: "…배고픈 검인가 봐."
        - "웃는데, 손가락은 칼집을 꽉 쥐고 있었다."
        - when: "talent.마력감응"
          나레이션: "가까이 서자 성검 쪽으로 공기가 빨려 드는 감각이 났다. 정말로 배가 고픈 것처럼."
        - 속마음: "(원작에선 그냥 '성검 보정'이라는 숫자 한 줄이었다. 배고픈 검이라니.)"
        - 속마음: "(그 숫자 뒤에서, 이 녀석은 혼자 이걸 견디고 있었던 걸까.)"
        - 아렌: "다음엔 검 빼고 해 보고 싶다. 내 색이 뭔지, 나도 궁금하거든."
    - text: 수정구에 남은 마력의 잔향을 더듬어 본다 (마력 감응)
      when: "talent.마력감응"
      lines:
        - "다들 짐을 챙기는 사이, 교탁의 수정구에 손끝을 댔다."
        - "아직 따뜻하다. 서른 명 분의 마력이 겹겹이 남아 있다."
        - 속마음: "(마력 감응. 원작에선 '타인의 재능 등급 표시'였던 재능이다.)"
        - 속마음: "(직접 느끼니 숫자가 아니라 냄새 같다. 사람마다 다른 냄새.)"
      check:
        type: 통찰
        dc: 보통
        mods:
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      success:
        lines:
          - "겹을 하나씩 벗겨 냈다. 연한 파랑, 흙빛, 탁한 초록."
          - "그리고 짙은 자줏빛. 미라벨의 것이다."
          - "그런데 그 자줏빛 밑에 다른 결이 깔려 있다. 억지로 짜낸 듯한, 끝이 갈라진 결."
          - 속마음: "(진하게 보이려고 바닥까지 긁어 쓴 마력이다. 손끝이 떨리던 이유가 이거였다.)"
          - 엘베라: "…보이나요?"
          - "언제 왔는지 엘베라가 옆에 서 있었다. 목소리가 낮았다."
          - 엘베라@진지: "그 아이는 늘 바닥까지 써요. 그렇게 안 하면 무너질 것 같은가 봐요."
          - 엘베라: "학생 같은 눈이 곁에 있으면 좋겠네요. 말은 하지 말고, 그냥 봐 줘요."
          - "복도로 나가니 미라벨이 벽에 기대 숨을 고르고 있었다. 눈이 마주치자 홱 고개를 돌렸다."
          - 속마음: "(못 본 척했다. 엘베라 말대로. 대신 다음 실습 땐 그 손끝을 보고 있을 거다.)"
        effects: ["affinity.elvera += 4", "trust.mirabel += 3"]
      fail:
        lines:
          - "겹을 벗겨 내려는데, 서른 개의 색이 한꺼번에 밀려들었다."
          - "머릿속이 물감 통에 빠진 것 같다. 속이 울렁거렸다."
          - "수정구에서 손을 떼고 교탁을 짚었다."
          - 엘베라: "어머. 한꺼번에 다 맡으면 그래요. 향수 가게에 처음 들어간 사람처럼."
          - "엘베라가 물 한 잔을 건넸다. 박하 잎이 한 장 떠 있었다."
          - 엘베라@웃음: "다음엔 하나씩. 제일 진한 것부터 벗겨 내요. 그건 가르쳐 줄 수 있어요."
          - 속마음: "(가르쳐 준다고 했다. 재능은 숫자가 아니라, 이렇게 배우는 거였다.)"
        effects: ["affinity.elvera += 3", "fatigue += 5"]

# ================================================================ 수업 — 5월

- id: cls_sword_1
  title: 검술 — 등을 맡길 사람
  art: training_ground
  on: auto
  free: true
  window: "1.5.1"
  lines:
    - "검술 실기. 연무장 흙바닥이 아침 이슬에 젖어 검게 번들거린다."
    - "5월인데 바람이 차다. 목검을 쥔 손가락 끝이 금방 곱았다."
    - "다들 목검을 들고 줄을 섰는데, 가렌 교관은 목검 대신 밧줄 한 다발을 바닥에 던졌다."
    - "털썩. 흙먼지가 일었다."
    - 가렌: "다음 주에 미궁이다."
    - "그 한마디에 연무장이 조용해졌다."
    - 가렌: "미궁에선 앞의 적보다 등 뒤가 더 많이 죽인다."
    - 가렌@진지: "오늘은 둘씩 묶는다. 등을 맡길 놈을 골라라."
    - "허리를 밧줄로 서로 묶고, 사방에서 날아드는 교관의 목검을 둘이서 막아내는 훈련이다."
    - 학생 A@당황: "(속닥) 등 맡길 놈이라니… 아직 반 애들 이름도 다 모르는데."
    - 가렌: "모르면 지금 알아라. 미궁에선 이름 물어볼 시간도 없다."
    - "다들 서로를 흘끔거린다. 친한 애들끼리 먼저 묶이고, 남은 애들 사이로 어색한 시선이 오간다."
    - when: "note.note_edric.known and origin != '악역도련님'"
      속마음: "(다음 주. 에드릭이 죽는 날이다. 원작에서 이 수업은 짝 선택 화면 하나로 끝났지.)"
    - when: "note.note_edric.known and origin != '악역도련님'"
      속마음: "(그때는 아무나 골랐다. 짝이 누구든, 에드릭은 혼자 3층으로 내려갔으니까.)"
    - when: "origin == '악역도련님'"
      속마음: "(다음 주가 원작 에드릭의 기일이다. 그러니까, 내 기일.)"
    - when: "origin == '악역도련님'"
      나레이션: "연무장 한가운데, 내 주위만 둥글게 비어 있다. 벨모어가 망나니와 묶이고 싶은 사람은 없다."
    - 속마음: "(누구와 묶일까. 이건 그냥 수업이 아니다. 다음 주의 예행연습이다.)"
    - "밧줄 끝을 손에 쥐었다. 거칠고, 생각보다 무겁다."
  choices:
    - text: 브루노와 묶는다
      when: "met.bruno or affinity.bruno > 0"
      check:
        type: 완력
        dc: 쉬움
        mods:
          - { when: "affinity.bruno >= 15", value: 2, label: 브루노와 호흡 }
      success:
        lines:
          - "브루노가 성큼 다가와 밧줄을 제 허리에 두 바퀴 감았다."
          - 브루노@웃음: "내가 앞! 넌 뒤! 덩치는 이럴 때 쓰는 거지."
          - when: "talent.거구"
            나레이션: "덩치 둘이 묶이니 밧줄이 한 뼘 모자랐다. 브루노가 자기 허리띠를 풀어 이었다."
          - "가렌의 목검이 사방에서 날아들었다. 정면은 브루노가 몸으로 받아냈다."
          - "등 뒤로 바람 소리. 몸을 틀어 막았다. 손바닥이 찡하게 울렸다."
          - "브루노가 앞을, 내가 뒤를 막았다. 가렌의 목검이 세 번 튕겨 나갔다."
          - 가렌: "…벽이 둘이군."
          - 브루노@웃음: "들었냐? 벽이래, 벽!"
          - 속마음: "(칭찬… 은 아니다. 가렌은 칭찬을 안 한다. 그냥 본 걸 말했을 뿐이다. 그래도.)"
        effects: ["affinity.bruno += 3", "affinity.garen += 4", "stat.체질 += 0.5"]
      fail:
        lines:
          - "브루노와 묶였다. 밧줄이 팽팽해지자 든든했다. 처음 삼십 초는."
          - "가렌의 목검이 오른쪽에서 날아왔다."
          - "브루노가 갑자기 오른쪽으로 도는 바람에 밧줄에 걸려 둘 다 나뒹굴었다."
          - "흙바닥에 얼굴을 묻은 채로, 위에서 브루노의 웃음소리가 들렸다."
