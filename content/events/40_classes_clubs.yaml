          - 가렌: "미궁에서도 미안하다고 할 건가."
          - 브루노@당황: "……아뇨."
          - 속마음: "(돌기 전에 말하기. 미궁에선 그거 하나로 살고 죽는다. 웃을 일이 아닌데, 브루노 얼굴을 보면 웃음이 난다.)"
        effects: ["affinity.bruno += 2", "affinity.garen += 1"]
      great:
        lines:
