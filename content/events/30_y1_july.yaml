        - 학생 A: "요즘 옆 반 애들이 우리 반 앞을 지나갈 때 목소리를 낮추더라. 처음 봤어."
        - "누군가 관중석 돌벽에 분필로 큼지막하게 써 놓았다. 「D반 4강!!」 느낌표가 세 개다."
