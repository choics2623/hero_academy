        - when: "affinity.kaiden >= 15"
          속마음: "(다음엔 여기까지 와 보라는 뜻이다. 원작에 없던 '다음'이 하나 생겼다.)"
        - "숟가락을 들었다. 옆구리의 멍은 아직 노랗게 남아 있다. 이상하게 그게 자랑스럽다."
