# 7월: 1학년 무투대회와 1학기 종업식
# 전술 네 가지 — 정면 승부(근력), 빈틈 공략(민첩·지성), 마법 견제(마력제어), 심리전(매력·의지)
# 상대마다 강한 전술과 약한 전술이 다르다. 공략 노트나 관찰로 알아낸 약점은 판정에 보너스가 된다.

- id: t_signup
  title: 무투대회 참가 신청
  on: auto
  at: "1.7.1.방과후"
  priority: 10
  announce: 무투대회 참가 신청
  lines:
    - "무투대회 참가 신청서 마감일. 접수처 앞에 줄이 길다."
    - when: "stat.근력 + stat.마력제어 + stat.민첩 < 70"
      속마음: "(지금 실력으로 나가도 될까…)"
    - when: "stat.근력 + stat.마력제어 + stat.민첩 >= 100"
      속마음: "(이 몸, 생각보다 많이 컸다.)"
  choices:
    - text: 참가한다
      effects: ["tourney.entered = 1"]
      lines: ["이름을 적었다. 접수원이 D반이라는 걸 보고 눈썹을 올린다."]
    - text: 관전만 한다
      effects: ["tourney.spectator = 1"]
      lines: ["이번엔 지켜보기로 했다. 원작이 어떻게 흘러가는지 확인하는 것도 공부다."]

# ---------------------------------------------------------------- 예선
- id: t_prelim
  title: 무투대회 예선
  on: auto
  at: "1.7.2.방과후"
  priority: 10
  announce: 무투대회 예선
  branch:
    - when: "tourney.entered"
      lines:
        - 진행자: "예선 3조! D반 대 C반!"
        - "상대는 덩치 큰 C반 남학생. 목검을 어깨에 걸치고 히죽 웃는다."
      choices:
        - text: 정면 승부 (근력)
          check: { label: 정면 승부, value: "stat.근력 + stat.민첩 / 2 + luck", dc: 28 }
          success: { lines: ["힘 대 힘. 상대의 목검이 먼저 튕겨 나갔다."], effects: ["tourney.round = 1"] }
          fail: { lines: ["힘에서 밀렸다. 예선 탈락."], effects: ["tourney.result = 'prelim'"] }
        - text: 빈틈을 노린다 (민첩·지성)
          check: { label: 빈틈 공략, value: "stat.민첩 + stat.지성 / 2 + 15 * talent.직감 + luck", dc: 26 }
          success: { lines: ["덩치가 크면 돌아서는 게 느리다. 등 뒤를 잡았다."], effects: ["tourney.round = 1"] }
          fail: { lines: ["파고들다가 어깨에 정통으로 맞았다. 예선 탈락."], effects: ["tourney.result = 'prelim'"] }
        - text: 마법으로 견제한다 (마력제어)
          check: { label: 마법 견제, value: "stat.마력제어 + stat.마력량 / 2 + luck", dc: 28 }
          success: { lines: ["발밑에 얼음을 깔았다. 상대가 미끄러지며 장외."], effects: ["tourney.round = 1"] }
          fail: { lines: ["영창이 늦었다. 예선 탈락."], effects: ["tourney.result = 'prelim'"] }
        - text: 심리전으로 흔든다 (매력·의지)
          check: { label: 심리전, value: "stat.매력 + stat.의지 / 2 + 10 * talent.혐오스러운분위기 + luck", dc: 28 }
          success:
            lines:
              - 나레이션:
                  - "\"네 왼발, 아까부터 떨리던데.\" 상대가 발을 내려다본 순간 끝났다."
                  - { when: "talent.혐오스러운분위기", text: "웃으면서 다가갔을 뿐인데 상대가 스스로 장외로 물러났다." }
            effects: ["tourney.round = 1"]
          fail: { lines: ["상대는 말을 듣지 않는 타입이었다. 예선 탈락."], effects: ["tourney.result = 'prelim'"] }
    - lines:
        - "관중석에서 예선을 지켜봤다. 아렌은 성검 없이 목검으로 아슬아슬하게 이겼다."
        - "카이든은 세 합 만에 상대를 장외로 보냈다."
      effects: ["stat.지성 += 1"]

# ---------------------------------------------------------------- 본선 8강
- id: t_quarter
  title: 무투대회 본선 8강
  on: auto
  at: "1.7.2.밤"
  priority: 10
  announce: 무투대회 본선 8강
  when: "tourney.round == 1"
  branch:
    - when: "rival.mirabel"
      lines:
        - 진행자: "8강! 아델하이트의 천재, 미라벨!"
        - 미라벨: "드디어 공식적으로 짓밟을 수 있겠네."
        - 속마음: "(마법 대결로는 불리하다. 거리를 좁혀야 한다.)"
      choices:
        - text: 정면 승부 (근력)
          check: { label: 정면 승부, value: "stat.근력 + stat.민첩 / 2 + luck", dc: 42 }
          success: { lines: ["영창이 끝나기 전에 거리를 좁혔다. 목검이 미라벨의 지팡이를 쳐냈다.", 미라벨: "…반칙이야, 이건."], effects: ["tourney.round = 2", "affinity.mirabel += 5"] }
          fail: { lines: ["다가가기도 전에 바람 마법에 날아갔다. 8강 탈락."], effects: ["tourney.result = 'quarter'"] }
        - text: 빈틈을 노린다 (민첩·지성)
          check: { label: 빈틈 공략, value: "stat.민첩 + stat.지성 / 2 + 15 * talent.직감 + luck", dc: 40 }
          success: { lines: ["대마법 영창 사이의 0.5초. 그 틈으로 뛰어들었다."], effects: ["tourney.round = 2", "affinity.mirabel += 5"] }
          fail: { lines: ["틈은 없었다. 미라벨은 영창을 둘로 쪼개 쓰고 있었다. 8강 탈락."], effects: ["tourney.result = 'quarter'"] }
        - text: 마법으로 맞선다 (마력제어)
          check: { label: 마법 대결, value: "stat.마력제어 + stat.마력량 / 2 + luck", dc: 50 }
          success: { lines: ["두 마법이 정면으로 부딪혔다. 먼저 무릎을 꿇은 건 미라벨이었다.", 미라벨: "말도 안 돼…"], effects: ["tourney.round = 2", "affinity.mirabel += 10", "trust.mirabel += 10"] }
          fail: { lines: ["마법 싸움에선 상대가 되지 않았다. 8강 탈락."], effects: ["tourney.result = 'quarter'"] }
        - text: 심리전으로 흔든다 (매력·의지)
          check: { label: 심리전, value: "stat.매력 + stat.의지 / 2 + 10 * (trust.mirabel >= 15) + luck", dc: 44 }
          success: { lines: ["\"아델하이트가 몰락한 이유, 알고 싶지 않아?\" 영창이 끊겼다."], effects: ["tourney.round = 2", "trust.mirabel -= 5"] }
          fail: { lines: [미라벨: "그런 말에 흔들릴 거면 여기 서지도 않았어.", "8강 탈락."], effects: ["tourney.result = 'quarter'"] }
    - lines:
        - 진행자: "8강! 대장장이의 아들, 브루노!"
        - 브루노: "친구라도 봐주는 거 없다!"
        - 속마음: "(힘으로는 못 이긴다. 브루노는 느리다.)"
      choices:
        - text: 정면 승부 (근력)
          check: { label: 정면 승부, value: "stat.근력 + stat.민첩 / 2 + luck", dc: 50 }
          success: { lines: ["힘 대 힘으로 브루노를 밀어냈다. 관중석이 뒤집혔다.", 브루노: "하하! 너 진짜 뭐 먹고 사냐!"], effects: ["tourney.round = 2", "affinity.bruno += 8"] }
          fail: { lines: ["브루노의 일격에 목검이 부러졌다. 8강 탈락.", 브루노: "괜찮냐? 미안!"], effects: ["tourney.result = 'quarter'", "affinity.bruno += 3"] }
        - text: 빈틈을 노린다 (민첩·지성)
          check: { label: 빈틈 공략, value: "stat.민첩 + stat.지성 / 2 + 15 * talent.직감 + luck", dc: 40 }
          success: { lines: ["크게 휘두른 뒤의 빈틈. 브루노의 옆구리에 목검을 댔다."], effects: ["tourney.round = 2", "affinity.bruno += 5"] }
          fail: { lines: ["너무 깊이 들어갔다. 브루노의 어깨에 튕겨 나갔다. 8강 탈락."], effects: ["tourney.result = 'quarter'"] }
        - text: 마법으로 견제한다 (마력제어)
          check: { label: 마법 견제, value: "stat.마력제어 + stat.마력량 / 2 + luck", dc: 40 }
          success: { lines: ["발을 묶는 마법. 브루노가 제자리에서 허우적댄다."], effects: ["tourney.round = 2", "affinity.bruno += 5"] }
          fail: { lines: ["마법을 힘으로 찢고 들어왔다. 8강 탈락."], effects: ["tourney.result = 'quarter'"] }
        - text: 심리전으로 흔든다 (매력·의지)
          check: { label: 심리전, value: "stat.매력 + stat.의지 / 2 + luck", dc: 44 }
          success: { lines: ["\"너희 할아버지 망치보다 내 검이 낫다\" 한마디에 브루노가 이성을 잃고 달려들었다. 피하기만 하면 됐다."], effects: ["tourney.round = 2", "affinity.bruno += 2"] }
          fail: { lines: [브루노: "응? 뭐라고? 잘 안 들려!", "통하지 않았다. 8강 탈락."], effects: ["tourney.result = 'quarter'"] }

# ---------------------------------------------------------------- 4강
- id: t_semi
  title: 무투대회 4강
  on: auto
  at: "1.7.3.방과후"
  priority: 10
  announce: 무투대회 4강
  when: "tourney.round == 2"
  lines:
    - 진행자: "4강! 제국의 3황자, 카이든 아스테라!"
    - 카이든: "여기까지 올 줄은 몰랐군. 하지만 여기까지다."
    - when: "know.kaiden_shoulder or note.note_kaiden_style.known"
      속마음: "(왼쪽 어깨. 오른쪽 아래가 빈다.)"
  choices:
    - text: 정면 승부 (근력)
      check: { label: 정면 승부, value: "stat.근력 + stat.민첩 / 2 + luck", dc: 60 }
      success: { lines: ["황자의 검을 정면으로 받아냈다. 두 번, 세 번. 카이든의 손목이 먼저 풀렸다.", 카이든: "……인정하지."], effects: ["tourney.round = 3", "affinity.kaiden += 10", "trust.kaiden += 10"] }
      fail: { lines: ["정석의 검. 한 치의 빈틈도 없었다. 4강 탈락.", 카이든: "나쁘지 않았다."], effects: ["tourney.result = 'semi'", "affinity.kaiden += 3"] }
    - text: 오른쪽 아래 빈틈을 노린다 (민첩·지성)
      check: { label: 빈틈 공략, value: "stat.민첩 + stat.지성 / 2 + 15 * talent.직감 + 15 * (know.kaiden_shoulder or note.note_kaiden_style.known) + luck", dc: 58 }
      success:
        lines:
          - "카이든이 왼쪽 어깨를 감싸는 순간, 오른쪽 아래로 파고들었다."
          - 카이든: "…어떻게 알았지?"
        effects: ["tourney.round = 3", "affinity.kaiden += 6", "trust.kaiden += 12"]
      fail: { lines: ["빈틈을 노린 걸 읽혔다. 4강 탈락."], effects: ["tourney.result = 'semi'"] }
    - text: 마법으로 견제한다 (마력제어)
      check: { label: 마법 견제, value: "stat.마력제어 + stat.마력량 / 2 + luck", dc: 58 }
      success: { lines: ["검과 마법을 번갈아 쓰자 카이든의 리듬이 무너졌다."], effects: ["tourney.round = 3", "affinity.kaiden += 6"] }
      fail: { lines: ["카이든은 마법을 베어냈다. 말 그대로. 4강 탈락."], effects: ["tourney.result = 'semi'"] }
    - text: 황자의 자존심을 건드린다 (매력·의지)
      check: { label: 심리전, value: "stat.매력 + stat.의지 / 2 + 10 * know.kaiden_palace + luck", dc: 60 }
      success:
        lines:
          - "\"형님들이 보고 계시겠네.\" 카이든의 검끝이 처음으로 흔들렸다."
        effects: ["tourney.round = 3", "trust.kaiden -= 10"]
      fail: { lines: [카이든: "그 말, 형님들한테서 백 번은 들었다.", "4강 탈락."], effects: ["tourney.result = 'semi'"] }

# ---------------------------------------------------------------- 결승 (내가 올라간 경우)
- id: t_final
  title: 무투대회 결승
  on: auto
  at: "1.7.3.밤"
  priority: 10
  announce: 무투대회 결승
  when: "tourney.round == 3"
  lines:
    - 진행자: "결승! 성검에 선택받은 평민, 아렌!"
    - "관중석이 터질 것 같다. 원작에서 이 자리에 섰던 건 카이든이었다."
    - 아렌:
        - "결승에서 보자고 했잖아."
        - { when: "aren.temper >= 1", text: "너랑 붙게 될 줄 알았어. 봐주지 마." }
        - { when: "aren.temper <= -1", text: "…비켜. 나는 이겨야 해." }
  choices:
    - text: 정면 승부 (근력)
      check: { label: 정면 승부, value: "stat.근력 + stat.민첩 / 2 + luck", dc: 66 }
      success: { lines: ["성검의 빛이 번쩍였지만, 목검이 먼저 닿았다."], effects: ["tourney.winner = 'me'", "tourney.result = 'win'"] }
      fail: { lines: ["아렌의 검에서 빛이 터졌다. 정신을 차렸을 땐 하늘이 보였다. 준우승."], effects: ["tourney.winner = 'aren'", "tourney.result = 'final'"] }
    - text: 빈틈을 노린다 (민첩·지성)
      check: { label: 빈틈 공략, value: "stat.민첩 + stat.지성 / 2 + 15 * talent.직감 + luck", dc: 64 }
      success: { lines: ["아렌은 성검을 쓸지 말지 망설였다. 그 반 박자를 찔렀다."], effects: ["tourney.winner = 'me'", "tourney.result = 'win'"] }
      fail: { lines: ["아렌은 빈틈마저 성검의 빛으로 메웠다. 준우승."], effects: ["tourney.winner = 'aren'", "tourney.result = 'final'"] }
    - text: 마법으로 견제한다 (마력제어)
      check: { label: 마법 견제, value: "stat.마력제어 + stat.마력량 / 2 + luck", dc: 66 }
      success: { lines: ["성검이 내 마법을 빨아들이려는 순간, 마법을 거뒀다. 아렌이 앞으로 고꾸라졌다."], effects: ["tourney.winner = 'me'", "tourney.result = 'win'"] }
      fail: { lines: ["성검이 마법을 통째로 삼켰다. 준우승."], effects: ["tourney.winner = 'aren'", "tourney.result = 'final'"] }
    - text: 성검의 목소리를 떠올리게 한다 (매력·의지)
      check: { label: 심리전, value: "stat.매력 + stat.의지 / 2 + 12 * note.note_aren_final.known + 8 * (aren.temper >= 1) + luck", dc: 60 }
      success:
        lines:
          - "\"성검이 뭐라고 속삭이지?\" 아렌의 눈이 흔들렸다. 그 순간 끝났다."
          - 속마음: "(공략 위키 그대로다. 미안, 아렌.)"
        effects: ["tourney.winner = 'me'", "tourney.result = 'win'", "aren.cold += 1"]
      fail: { lines: [아렌: "이제 그 목소리, 안 무서워.", "준우승."], effects: ["tourney.winner = 'aren'", "tourney.result = 'final'", "aren.kind += 1"] }

# ---------------------------------------------------------------- 결승 관전 (원작대로 카이든 vs 아렌)
- id: t_final_watch
  title: 무투대회 결승 — 관중석에서
  on: auto
  at: "1.7.3.밤"
  priority: 10
  when: "tourney.round != 3 and not tourney.winner"
  lines:
    - "결승. 카이든 대 아렌. 원작 그대로의 대진이다."
    - "아렌의 성검이 빛났지만, 카이든의 검이 한 수 빨랐다."
    - 진행자: "우승, 카이든 아스테라!"
    - "아렌이 무릎을 꿇은 채 이를 악문다."
  effects: ["tourney.winner = 'kaiden'"]
  choices:
    - text: 아렌에게 손을 내민다
      effects: ["affinity.aren += 8", "aren.kind += 1"]
      lines: [아렌: "…고마워. 다음엔 꼭 이길게. 너도 같이 강해지자."]
    - text: 카이든에게 축하를 건넨다
      effects: ["affinity.kaiden += 6"]
      lines: [카이든: "형님들은 이걸로도 만족 안 하겠지만. …고맙다."]
    - text: 조용히 자리를 뜬다
      effects: ["aren.cold += 1"]
      lines:
        - 속마음: "(원작대로. 아렌은 오늘부터 혼자 이를 악물고 강해진다. 그 끝이 흑화다.)"

- id: t_after
  title: 무투대회 뒤풀이
  on: auto
  at: "1.7.4.방과후"
  priority: 10
  when: "tourney.entered"
  branch:
    - when: "tourney.result == 'win'"
      lines:
        - "우승 메달이 생각보다 무겁다. 축하하러 온 사람들 사이로, 낯선 로브 차림의 사내가 나를 오래 바라보다 사라졌다."
        - 시스템: "⚠ 원작 이탈 — 1학년 무투대회 우승자가 바뀌었다. 누군가 나를 주시하기 시작했다."
      effects: ["reputation += 20", "sp += 3", "cult.watch = 1"]
    - when: "tourney.result == 'final'"
      lines:
        - "준우승. 아렌이 먼저 다가와 손을 내밀었다."
        - 아렌: "너 아니었으면 결승까지 못 왔을 거야."
      effects: ["reputation += 12", "sp += 2", "affinity.aren += 5"]
    - when: "tourney.result == 'semi'"
      lines: ["4강. D반 역사상 최고 성적이라고 담임이 말했다."]
      effects: ["reputation += 8", "sp += 1"]
    - lines: ["일찍 떨어졌다. 그래도 몸이 기억하는 게 있다. 다음엔 다를 것이다."]
      effects: ["stat.의지 += 2"]

# ---------------------------------------------------------------- 종업식
- id: y1_closing
  title: 1학기 종업식
  on: auto
  at: "1.7.4.주말"
  priority: 10
  announce: 1학기 종업식
  lines:
    - "1학기 종업식. 강당 창문으로 여름 햇살이 쏟아진다."
    - when: "fate.sera == 'saved' or fate.sera == 'saved_quiet'"
      나레이션: "신학과 줄에 은발의 세라가 서 있다. 원작이라면 여기 없었을 아이."
    - when: "fate.sera == 'dropped'"
      나레이션: "신학과 줄에 빈자리가 하나 있다."
    - when: "origin != '악역도련님' and fate.edric and fate.edric != 'dead'"
      나레이션: "에드릭이 투덜거리며 줄에 서 있다. 원작이라면 여기 없었을 녀석."
    - when: "origin == '악역도련님'"
      나레이션: "살아서 종업식을 맞았다. 원작의 에드릭은 오늘 여기 없었다."
    - when: "tourney.winner == 'me'"
      나레이션: "단상 위에서 무투대회 우승 메달을 받았다. 카이든과 아렌이 같은 표정으로 나를 본다."
    - when: "tourney.winner == 'aren'"
      나레이션: "단상 위의 아렌. 원작에서는 이 자리에 카이든이 섰다."
    - when: "affinity.liana >= 30"
      리아나: "방학 때 우리 마을에 놀러 올래? 보름달 뜨는 숲, 보여주고 싶어."
    - when: "finn.mentor == 'garen'"
      나레이션: "강당 뒤편, 청소부 옷을 입은 핀이 가렌 교관 옆에 서 있다."
    - 속마음: "(멸망까지 9년 7개월. 바꾼 것도, 놓친 것도 있다.)"
    - 시스템: "1학년 1학기 종료 — 여름방학 (다음 업데이트에서 이어집니다)"
