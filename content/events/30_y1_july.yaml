# 7월: 1학년 무투대회와 1학기 종업식
# 매 경기는 패턴 읽기 전투. 공략 노트나 관찰로 알아낸 정보가 있으면 상대의 다음 행동이 정확히 보인다.

- id: t_signup
  title: 무투대회 참가 신청
  art: campus
  on: auto
  at: "1.7.1.방과후"
  priority: 10
  announce: 무투대회 참가 신청
  lines:
    - "7월 첫 주. 행정동 앞마당에 매미 소리가 쏟아진다."
    - "달궈진 돌바닥에서 아지랑이가 핀다. 셔츠 등판이 금세 젖는다."
    - "무투대회 참가 신청서 마감일. 접수처 앞에 줄이 길다."
    - "행정동 계단 아래까지 늘어선 줄. 다들 신청서를 쥐고, 서로의 팔뚝을 곁눈질한다."
    - 학생 A: "B반 그 녀석도 나온대? 입학 시험 실기 2등 했다는."
    - 학생 B: "나오든 말든. 어차피 4강부턴 황자랑 성검이잖아."
    - "줄 맨 앞, 접수대 뒤에서 조교가 부채를 부치고 있다. 표정이 이미 지쳐 있다."
    - 조교: "다음! 이름, 반, 사용 무기. 마법 쓸 거면 속성까지. 빨리빨리!"
    - "줄이 한 칸 줄었다. 앞사람의 뒷목으로 땀이 흘러내린다."
    - 속마음: "(원작에서 무투대회 신청은 버튼 하나였다.)"
    - 속마음: "('참가하시겠습니까? 예 / 아니오'.)"
    - 속마음: "(그 버튼 하나 누르는 데 이렇게 땀이 날 줄은 몰랐다.)"
    - "그때 줄 옆으로 누군가 지나갔다. 줄을 서지 않고, 곧장 접수대로."
    - "카이든이다. 조교가 벌떡 일어나 고개를 숙인다."
    - 학생 A@화남: "황자는 줄도 안 서냐?"
    - 카이든@진지: "지난주에 이미 냈다. 대진 확인만 하러 왔다."
    - "카이든은 줄 쪽으로 눈길 한 번 주지 않고 돌아섰다."
    - when: "rival.kaiden"
      나레이션: "…아니. 내 앞에서 걸음이 반 박자 느려졌다."
    - when: "rival.kaiden"
      나레이션: "시선이 내 손의 신청서에 잠깐 머문다."
    - when: "rival.kaiden"
      카이든@웃음: "잊지 않았겠지. 기다린다고 했다. 빈칸으로 내면 실망이다."
    - "몇 사람 뒤에 아렌이 서 있다. 신청서를 두 손으로 꼭 쥐고, 입술을 달싹이며 무언가를 연습한다."
    - 아렌@당황: "이름 아렌, B반, 무기는… 목검. 성검 말고 목검. 목검…"
    - 속마음: "(성검 없이 나가려는 거다. 원작에서도 그랬다.)"
    - 속마음: "(그리고 결승에서 결국 성검이 깨어난다.)"
    - when: "affinity.aren >= 15"
      아렌@웃음: "아, 너도 왔구나! 다행이다. 혼자 서 있으니까 심장 터질 것 같았어."
    - when: "affinity.bruno >= 10"
      나레이션: "줄 저 앞에서 브루노가 커다란 손을 흔든다. 구겨진 신청서가 그 손에 들려 있다."
    - when: "affinity.bruno >= 10"
      브루노@웃음: "어이! 나 방금 냈다! 너도 내라, 빨리! 본선에서 붙자!"
    - when: "rival.mirabel"
      나레이션: "접수대 옆 그늘에서 미라벨이 부채질을 하며 이쪽을 본다. 신청서는 진작 낸 얼굴이다."
    - when: "rival.mirabel"
      미라벨@웃음: "D반도 줄 서 있네? 기념 참가라도 하려고?"
    - "줄이 줄어든다. 앞에 남은 사람이 셋, 둘, 하나."
    - "신청서를 내려다봤다. 이름 칸, 반 칸, 무기 칸."
    - when: "stat.근력 + stat.마력제어 + stat.민첩 < 70"
      속마음: "(지금 실력으로 나가도 될까…)"
    - when: "stat.근력 + stat.마력제어 + stat.민첩 < 70"
      속마음: "(예선 상대만 해도 C반 덩치들이다. 첫 판에 장외로 날아가면, 그대로 웃음거리다.)"
    - when: "stat.근력 + stat.마력제어 + stat.민첩 >= 70 and stat.근력 + stat.마력제어 + stat.민첩 < 100"
      속마음: "(애매하다. 예선은 넘을 수 있을 것 같다. 그다음은… 모르겠다.)"
    - when: "stat.근력 + stat.마력제어 + stat.민첩 >= 100"
      속마음: "(이 몸, 생각보다 많이 컸다.)"
    - when: "stat.근력 + stat.마력제어 + stat.민첩 >= 100"
      속마음: "(입학할 땐 목검 스무 번에 팔이 떨렸다. 지금 이 수치면, 원작 기준으로 4강권이다.)"
    - 속마음: "(참가하면 대진이 바뀐다. 원작의 결승, 카이든 대 아렌이 흔들린다.)"
    - 속마음: "(관전만 하면 원작대로다. 노트는 그대로 쓸모 있고, 나는 안전하다.)"
    - 조교: "다음! …다음 사람! 낼 거야, 말 거야?"
    - "펜 끝이 이름 칸 위에서 멈췄다. 잉크 한 방울이 맺힌다."
    - 속마음: "(이름 한 줄이, 이렇게 무겁다.)"
  choices:
    - text: 이름을 적는다 (참가한다)
      effects: ["tourney.entered = 1"]
      lines:
        - "펜 끝을 종이에 눌렀다. 맺혀 있던 잉크가 번진다."
        - "이름을 적었다. 접수를 보던 조교가 D반이라는 걸 보고 눈썹을 올린다."
        - 조교@놀람: "D반? …D반에서 나오는 건 몇 년 만인지 모르겠네."
        - 조교: "예선 3조. 다음 주 방과 후, 경기장."
        - 조교: "다치면 의무실, 죽으면… 안 죽게 해."
        - 학생 A: "D반이 나온대. 들었어?"
        - 학생 B@웃음: "예선 상대가 C반 그 덩치라며? 구경 가야겠다."
        - "웃음소리가 등에 꽂힌다. 이상하게 아프지 않다."
        - when: "affinity.aren >= 15"
          아렌@웃음: "나왔구나! 그럼… 결승에서 보자. 진짜로."
        - 속마음: "(원작 대진표에 없는 이름이 하나 들어갔다. 이제 이 토너먼트는, 내가 모르는 토너먼트다.)"
        - "행정동을 나서자 매미 소리가 다시 쏟아졌다."
        - "손바닥이 땀으로 축축했다. 펜을 쥐었던 모양 그대로."
    - text: 펜을 내려놓는다 (관전만 한다)
      effects: ["tourney.spectator = 1"]
      lines:
        - "펜을 내려놓았다. 줄에서 한 걸음 옆으로 비켜선다."
        - 조교: "안 내? 그럼 비켜. 다음!"
        - "뒷사람이 기다렸다는 듯 앞으로 나섰다."
        - "이번엔 지켜보기로 했다."
        - 속마음: "(원작이 어떻게 흘러가는지 확인하는 것도 공부다.)"
        - 속마음: "(내가 아는 결승이 정말 그대로 오는지.)"
        - 속마음: "(카이든의 어깨, 아렌의 성검. 관중석에서라면 전부 보인다.)"
        - when: "affinity.aren >= 15"
          아렌@슬픔: "안 나가? …그럼 관중석에서 응원해 줘. 엄청 크게."
        - "행정동 그늘을 빠져나오며 뒤를 돌아봤다. 줄은 아직도 길었다."
        - 속마음: "(겁이 나서 물러선 걸까, 전략일까. …아마 둘 다일 거다.)"

# ---------------------------------------------------------------- 예선
- id: t_prelim
  title: 무투대회 예선
  art: arena
  on: auto
  at: "1.7.2.방과후"
  priority: 10
  announce: 무투대회 예선
  branch:
    - when: "tourney.entered"
      lines:
        - "예선 날. 원형 경기장이 학생들로 꽉 찼다."
        - "돌계단 관중석마다 반 깃발이 펄럭인다."
        - "S반의 금색, A반의 은색. D반 깃발은 찾기도 어렵다."
        - "모래 바닥에서 열기가 올라온다. 땀과 먼지와, 누군가 몰래 파는 꼬치구이 냄새."
        - "대기석 나무 벤치에 앉아 목검을 쥐었다. 손잡이가 땀으로 미끄럽다."
        - when: "item.브루노목검"
          나레이션: "브루노가 깎아 준 목검이다. 참나무 심에 쇠 테. 손에 꼭 맞는다."
        - 조교: "무기 검사! 목검 끝에 쇠 박은 놈 없지? 마법 부여한 놈도? 걸리면 실격이다."
        - "조교가 내 목검을 받아 들고 이리저리 돌려 본다. 그러다 나를 한 번 더 본다."
        - 조교: "D반… 맞네. 다치기 전에 기권하는 것도 용기다. 알지?"
        - 속마음: "(심장 소리가 귀에서 들린다. 화면 너머로 수백 번 본 경기장인데.)"
        - 속마음: "(화면 속 관중석은 그냥 배경 그림이었다. 여기선 수천 명이 숨을 쉰다.)"
        - "옆자리의 C반 학생이 다리를 덜덜 떨고 있다. 나만 그런 게 아니라서, 조금 안심이 된다."
        - "앞 경기가 끝났다. 진 쪽이 들것에 실려 나간다."
        - "관중석이 와, 하고 끓어올랐다."
        - 진행자: "예선 3조! D반 대 C반!"
        - "이름이 불렸다. 다리가 저절로 일어선다."
        - 관중: "D반? D반이 나왔어? 누구야, 쟤?"
        - when: "affinity.liana >= 15"
          나레이션: "관중석 어딘가에서 익숙한 목소리가 들렸다."
        - when: "affinity.liana >= 15"
          리아나@웃음: "힘내! 다치지 마! 아, 아니, 이겨!"
        - when: "affinity.bruno >= 10"
          브루노@웃음: "가라! 평민 동의 자존심이다! 넘어지면 내가 업고 나온다!"
        - "모래를 밟고 경기장 한가운데로 나섰다."
        - "상대는 덩치 큰 C반 남학생. 목검을 어깨에 걸치고 히죽 웃는다."
        - "머리 하나는 더 크다. 팔뚝이 내 허벅지만 하다."
        - 남학생@웃음: "D반? 하하, 운 좋네. 첫 판부터 쉬운 상대 걸렸다."
        - 남학생: "걱정 마. 한 방에 끝내 줄게. 아프게 안 하려면 그게 낫잖아?"
        - "덩치가 목을 좌우로 꺾는다. 우두둑, 소리가 여기까지 들린다."
        - 속마음: "(C반 덩치. 원작에선 이름도 없는 예선용 상대였다. 패턴은 단순했다.)"
        - 속마음: "(크게 숨을 들이쉬면 다음은 몸통 박치기다. 그 숨을 강하게 끊어야 한다.)"
        - 속마음: "(…알고 있다. 머리로는.)"
        - "심판 교관이 손을 들었다. 경기장이 일순간 조용해진다."
        - 교관@진지: "장외, 또는 무기를 놓치면 패배. 시작!"
      battle:
        enemy: t_prelim
        win:
          lines:
            - "덩치가 크게 숨을 들이쉬는 순간, 파고들었다."
            - "목검 끝이 명치를 찔렀다. 들이쉰 숨이 그대로 터져 나온다."
            - "비틀거리는 거구의 발목을 쓸었다. 균형이 무너진다."
            - "덩치가 장외로 굴러떨어졌다. 관중석에서 휘파람이 터진다."
            - 남학생@놀람: "어, 어? 내가 왜 바닥에…"
            - 진행자@놀람: "D반, 본선 진출!"
            - 관중: "와아아아!"
            - "함성이 경기장 돌벽을 타고 몇 번이고 되돌아온다. 귀가 먹먹하다."
            - "D반 쪽 관중석에서 누군가 깃발을 흔든다. 작고 낡은 깃발이 미친 듯이 펄럭인다."
            - when: "affinity.liana >= 15"
              나레이션: "관중석의 리아나가 두 손을 번쩍 들고 깡충 뛰었다."
            - 속마음: "(이겼다. 예선 1승.)"
            - 속마음: "(원작이었으면 경험치 바 한 칸 차고 끝났을 승리다.)"
            - 속마음: "(그런데 왜 손이 떨리지. 왜 이렇게 웃음이 나지.)"
            - "대기석으로 돌아오는 길, 등 뒤에서 낮은 목소리가 들렸다."
            - 카이든@진지: "예선 따위로 웃지 마라. 본선은 다르다."
            - "돌아봤을 땐 카이든의 등만 보였다. 그래도, 본 거다. 이쪽 경기를."
          effects: ["tourney.round = 1", "reputation += 3"]
        lose:
          lines:
            - "덩치가 크게 숨을 들이쉬었다. 알고 있었다. 다음은 박치기다."
            - "알고 있었는데, 발이 반 박자 늦었다."
            - "바위가 어깨에 부딪힌 것 같았다. 몸이 뜨고, 손이 저절로 펴졌다."
            - "목검이 손에서 튕겨 나갔다."
            - "모래 위를 데굴데굴 구르는 목검. 관중석에서 탄식과 웃음이 동시에 터진다."
            - 진행자: "무기 이탈! C반 승리! D반, 예선 탈락!"
            - 남학생@웃음: "봐, 한 방이라고 했지? …야, 괜찮냐? 숨은 쉬어?"
            - "덩치가 의외로 손을 내밀었다."
            - "그 손을 잡고 일어섰다. 옆구리가 욱신거린다."
            - 속마음: "(패턴을 알아도 몸이 못 따라가면 소용없다. 원작에선 버튼 한 번이던 반응 속도가, 여기선 근육이다.)"
            - when: "affinity.liana >= 15"
              나레이션: "관중석의 리아나가 두 손으로 입을 막고 있다가, 내가 일어서자 크게 손을 흔들었다."
            - "대기석으로 돌아가는 길이 멀다. 신발 안으로 들어온 모래가 서걱거린다."
            - 속마음: "(예선 탈락. …그래도 오늘, 원작 대진표에 없던 이름이 한 번은 불렸다.)"
          effects: ["tourney.result = 'prelim'"]
    - lines:
        - "예선 날. 관중석 맨 윗줄에 자리를 잡았다."
        - "경기장 전체가 한눈에 들어오는 자리다."
        - "모래 바닥의 열기가 여기까지 올라온다. 꼬치구이 냄새, 땀 냄새, 함성."
        - 속마음: "(원작에서 예선은 전부 스킵이었다. '아렌이 예선을 통과했다' 텍스트 한 줄.)"
        - 속마음: "(그 한 줄이 실제로는 몇 시간짜리였을까. 오늘 확인한다.)"
        - 진행자: "예선 2조! B반 아렌 대 C반!"
        - "관중석이 술렁인다. 성검의 평민. 다들 보고 싶어 하던 이름이다."
        - "그런데 아렌이 들고 나온 건 성검이 아니라 목검이었다. 웃음이 번진다."
        - 학생 A: "성검 안 써? 무시하는 거야, 자신 없는 거야?"
        - "아렌의 자세는 서툴렀다. 발이 너무 넓고, 어깨에 힘이 잔뜩 들어가 있다."
        - "세 번 밀렸다. 네 번째에 무릎이 꺾였다. 다섯 번째—"
        - "아렌이 이를 악물고 버텼다. 그리고 상대의 목검이 빗나간 틈으로 몸통째 부딪혀 들어갔다."
        - "관중석에서 예선을 지켜봤다. 아렌은 성검 없이 목검으로 아슬아슬하게 이겼다."
        - "아렌이 모래 위에 주저앉아 웃는다. 숨을 헐떡이면서."
        - 속마음: "(성검 없이. 원작의 아렌은 성검에 기대다 무너졌다.)"
        - 속마음: "(지금 저 아이는, 아직 제 손으로 싸운다.)"
        - 진행자: "예선 5조! 제국의 3황자, 카이든 아스테라!"
        - "경기장 공기가 바뀌었다. 웃음도, 술렁임도 없다. 다들 숨을 죽인다."
        - "카이든은 목검을 오른손에 늘어뜨린 채 걸어 나왔다. 서두르지 않는다."
        - "한 합. 상대의 목검이 튕겨 나간다."
        - "두 합. 상대가 뒷걸음질 친다."
        - "세 합. 상대가 장외의 모래 위에 엉덩방아를 찧었다."
        - "카이든은 세 합 만에 상대를 장외로 보냈다. 왼쪽 어깨를 한 번도 쓰지 않고."
        - 관중: "……와."
        - "높은 자리에서 내려다보니 보인다. 막을 때도, 벨 때도, 왼팔은 몸에 붙인 채 오른손 하나로만."
        - 속마음: "(가까이서 보면 압도적이라 모른다. 위에서 보니까 보인다.)"
        - 속마음: "(저건 습관이 아니라, 아끼는 거다.)"
        - when: "note.note_kaiden_style.known"
          속마음: "(노트 그대로다. 어릴 적 다친 왼쪽 어깨.)"
        - when: "note.note_kaiden_style.known"
          속마음: "(강타 뒤에 오른쪽 아래가 빈다.)"
        - "해가 기울었다. 예선이 끝나고 관중석이 비어 간다."
        - 속마음: "(보는 것도 싸움이다. 오늘 본 걸 잊지 말자.)"
      effects: ["stat.지성 += 1", "know.kaiden_shoulder = 1"]

# ---------------------------------------------------------------- 본선 8강
- id: t_quarter
  title: 무투대회 본선 8강
  on: auto
  at: "1.7.2.밤"
  priority: 10
  announce: 무투대회 본선 8강
  when: "tourney.round == 1"
  branch:
    - when: "rival.mirabel"
      art: cg_t_mirabel
      lines:
        - "본선 8강은 원래 다음 주였다."
        - "예선이 끝나자마자 일정표가 바뀌었다."
        - "하루를 당긴다고. 그날 밤, 횃불 아래에서."
        - "밤의 경기장. 관중석 둘레에 횃불이 줄지어 타오르고, 머리 위엔 마법 조명이 떠 있다."
        - "낮의 열기가 식은 모래가 발바닥에 서늘하다. 관중석은 낮보다 더 꽉 찼다."
        - 속마음: "(원작에도 이랬나? …모르겠다. 원작에선 8강 자체가 스킵이었다.)"
        - "오후 예선의 근육통이 아직 팔뚝에 남아 있다. 쉴 틈도 없이 두 번째 경기다."
        - "횃불에서 송진 타는 냄새가 난다. 불똥이 튈 때마다 관중석의 그림자가 일렁인다."
        - 진행자: "8강! 아델하이트의 천재, 미라벨!"
        - "관중석 한쪽이 들썩였다. 마도과 지망생들이 지팡이 끝에 작은 불꽃을 피워 흔든다."
        - "미라벨이 걸어 나왔다. 낡았지만 손질이 완벽한 지팡이."
        - "몇 번이고 고쳐 쓴 흔적이 보인다."
        - "미라벨은 나를 위아래로 훑었다. 입꼬리가 천천히 올라간다."
        - 미라벨@진지: "드디어 공식적으로 짓밟을 수 있겠네."
        - 미라벨:
            - "D반이 여기까지 올라온 건 칭찬해 줄게. 여기까지만."
            - { when: "beat.mirabel_duel", text: "실습실에서 진 거, 아직 안 잊었어. 오늘은 기록에 남는 자리야." }
        - 나: "살살 해 줘."
        - 미라벨@화남: "살살? 아델하이트 사전에 그런 단어는 없어."
        - when: "trust.mirabel >= 15"
          미라벨@진지: "…그리고 봐주면 죽여. 진심으로 와."
        - when: "mirabel.ally or mirabel.clue"
          속마음: "(교단의 문양을 같이 쫓기로 한 사이다.)"
        - when: "mirabel.ally or mirabel.clue"
          속마음: "(그래도 지금 저 눈엔 그런 것 없다. 이기는 것만 있다.)"
        - 속마음: "(가문을 다시 일으키려면 일등이어야 한다. 이 아이에게 이건 그냥 대회가 아니다.)"
        - "미라벨이 지팡이를 들었다. 끝에 바람이 휘감긴다."
        - "관중석의 횃불이 일제히 한쪽으로 눕는다."
        - 속마음: "(마법 싸움으로는 불리하다. 붙어서 쳐야 한다.)"
        - 속마음: "(대마법 영창은 강타로 끊는다.)"
        - when: "trust.mirabel >= 15 or beat.mirabel_duel"
          속마음: "(습관은 안다. 방벽 다음엔 바람 칼날, 그다음엔 긴 영창.)"
        - when: "trust.mirabel >= 15 or beat.mirabel_duel"
          속마음: "(몇 번이고 봤다.)"
        - when: "skill.영창분할"
          속마음: "(그리고 몰리면, 영창을 둘로 쪼갤 거다. 나한테 가르쳐 준 바로 그 기술로.)"
        - "심판 교관이 두 사람 사이에서 손을 들었다. 관중석의 소음이 썰물처럼 빠져나간다."
        - 교관@진지: "8강 1경기. 시작!"
      battle:
        enemy: t_mirabel
        win:
          lines:
            - "미라벨의 영창이 끝나기 직전, 모래를 박차고 뛰어들었다."
            - "바람이 뺨을 베고 지나간다. 상관없다. 한 걸음 더."
            - "목검이 지팡이 손잡이를 쳤다. 딱, 하는 마른 소리."
            - "미라벨의 지팡이가 바닥을 굴렀다."
            - "지팡이는 모래 위를 굴러 장외선 앞에서 멈췄다. 경기장이 고요해졌다."
            - 진행자@놀람: "지, 지팡이 이탈! D반 승리! 4강 진출!"
            - 관중: "말도 안 돼!"
            - "미라벨은 빈손을 내려다보고 있었다. 손가락이 떨린다."
            - 미라벨@화남: "…말도 안 돼. 다음엔, 다음엔 절대."
            - "미라벨은 지팡이를 주워 들고 돌아섰다. 걸음이 빠르다. 어깨가 꼿꼿하다."
            - "그런데 장외선을 넘기 직전, 멈췄다. 돌아보지 않은 채로."
            - 미라벨@당황: "…4강에서 지면 용서 안 해. 나를 이긴 사람이 거기서 지면, 내가 뭐가 돼."
            - 속마음: "(아델하이트의 천재가 D반에 졌다. 내일 아침 신문 1면이다.)"
            - 속마음: "(미라벨은 그 기사를 끝까지 읽을 거다.)"
            - 속마음: "(지는 걸 죽기보다 싫어하는 아이가, 끝까지 등을 돌린 채 응원 비슷한 걸 했다.)"
          effects: ["tourney.round = 2", "affinity.mirabel += 8", "trust.mirabel += 8"]
        lose:
          lines:
            - "영창이 끝났다. 끊으러 뛰어든 발이 반 박자 늦었다."
            - "회오리에 휩쓸려 장외로 날아갔다. 8강 탈락."
            - "하늘과 땅이 몇 번 뒤집히고, 등이 모래에 박혔다. 입안에 모래가 서걱거린다."
            - 진행자: "장외! 미라벨, 4강 진출!"
            - "관중석이 터져 나갈 듯 환호한다. 누군가 쏘아 올린 불꽃이 밤하늘에서 터진다."
            - "그림자 하나가 나를 내려다봤다. 미라벨이다."
            - "숨이 가쁘다. 이마에 땀이 맺혀 있다."
            - 미라벨: "…그래도 여기까지 온 건 칭찬해 줄게."
            - 미라벨@당황: "착각하지 마. 칭찬이 아니라… 평가야. 객관적인 평가."
            - "미라벨이 손을 내밀다가, 멈칫하고, 결국 끝까지 내밀었다."
            - 속마음: "(8강 탈락. 대진표는 원작 쪽으로 돌아간다.)"
            - 속마음: "(…완전히는 아니다. 미라벨이 오늘 진땀을 흘렸다.)"
          effects: ["tourney.result = 'quarter'", "affinity.mirabel += 3"]
    - art: cg_t_bruno
      lines:
        - "본선 8강은 원래 다음 주였다."
        - "예선이 끝나자마자 일정표가 바뀌었다."
        - "하루를 당긴다고. 그날 밤, 횃불 아래에서."
        - "밤의 경기장. 관중석 둘레에 횃불이 줄지어 타오르고, 머리 위엔 마법 조명이 떠 있다."
        - "낮의 열기가 식은 모래가 발바닥에 서늘하다. 관중석은 낮보다 더 꽉 찼다."
        - 속마음: "(원작에도 이랬나? …모르겠다. 원작에선 8강 자체가 스킵이었다.)"
        - "오후 예선의 근육통이 아직 팔뚝에 남아 있다. 쉴 틈도 없이 두 번째 경기다."
        - "횃불에서 송진 타는 냄새가 난다. 불똥이 튈 때마다 관중석의 그림자가 일렁인다."
        - 진행자: "8강! 대장장이의 아들, 브루노!"
        - "관중석 한쪽에서 굵은 함성이 터졌다. 평민 동 학생들이 발을 구른다."
        - "브루노가 목검을 망치처럼 쥐고 걸어 나왔다. 어깨를 돌릴 때마다 우둑우둑 소리가 난다."
        - when: "origin != '악역도련님' and origin != '몰락귀족'"
          나레이션: "같은 방에서 매일 코를 고는 녀석이다. 아침마다 내 신발까지 털어 놓는 녀석이다."
        - 브루노@웃음:
            - "친구라도 봐주는 거 없다!"
            - { when: "origin == '악역도련님' and affinity.bruno < 10", text: "벨모어 도련님이라도 봐주는 거 없다!" }
        - 브루노: "할아버지가 그랬거든."
        - 브루노: "망치 앞에선 귀족도 평민도 친구도 없다고! 쇠만 있다고!"
        - when: "origin != '악역도련님' and origin != '몰락귀족' and affinity.bruno >= 10"
          나: "어젯밤 코 곤 거 사과부터 해."
        - when: "origin != '악역도련님' and origin != '몰락귀족' and affinity.bruno >= 10"
          브루노@당황: "그, 그건 경기랑 상관없잖아!"
        - when: "origin != '악역도련님' and origin != '몰락귀족' and affinity.bruno >= 10"
          관중: "하하하하!"
        - 속마음: "(브루노. 원작에선 6년 뒤 수도 습격에서 죽는다.)"
        - 속마음: "(그 전에, 오늘은 나를 죽일 기세다.)"
        - "브루노가 발을 한 번 굴렀다. 쿵. 모래가 발목까지 튀어 오른다."
        - 속마음: "(힘은 브루노가 위다. 발을 구르면 전력이 온다.)"
        - 속마음: "(그때는 받지 말고 끊어야 한다.)"
        - when: "affinity.bruno >= 20"
          속마음: "(같이 지낸 시간이 있다. 숨을 몰아쉬는 박자까지 안다.)"
        - when: "item.브루노목검"
          나레이션: "손 안의 목검을 내려다봤다. 브루노가 깎아 준 바로 그 목검이다."
        - when: "item.브루노목검"
          브루노@웃음: "오, 그거 들고 나왔냐! 내 작품으로 나를 친다고? 좋다, 품질 검사다!"
        - "심판 교관이 두 사람 사이에서 손을 들었다. 브루노가 씩 웃으며 목검을 고쳐 쥔다."
        - 교관@진지: "8강 3경기. 시작!"
      battle:
        enemy: t_bruno
        win:
          lines:
            - "브루노가 발을 굴렀다. 쿵. 숨을 몰아쉰다. 지금이다."
            - "받지 않았다. 내려찍기 전에, 그 들숨 한가운데로 목검을 밀어 넣었다."
            - "커다란 몸이 휘청인다. 한 번 더."
            - "브루노가 대자로 뻗었다. 그리고 웃었다."
            - "모래 위에 누운 채 하늘을 보며, 정말로 배를 잡고 웃는다."
            - 브루노@웃음: "하하! 너 진짜 뭐 먹고 사냐! 결승까지 가라!"
            - 진행자@놀람: "브루노 다운! D반, 4강 진출!"
            - 관중: "와아아아!"
            - "손을 내밀자 브루노가 덥석 잡았다. 일으켜 주려다 내가 끌려갈 뻔했다."
            - 브루노: "결승 가면 목검 새로 깎아 준다."
            - 브루노: "아니, 4강만 이겨도. 아니, 그냥 깎아 줄게!"
            - 브루노@진지: "…근데 진짜로 가라. 나 이긴 놈이 중간에 지면, 할아버지한테 할 말이 없다 아이가."
            - 속마음: "(진 사람이 이긴 사람 등을 떠민다. 원작 대회엔 이런 장면이 없었다.)"
          effects: ["tourney.round = 2", "affinity.bruno += 8"]
        lose:
          lines:
            - "브루노가 발을 굴렀다. 알고 있었다. 받으면 안 된다는 것도."
            - "그런데 몸이 먼저 목검을 들어 올렸다. 받고 말았다."
            - "브루노의 일격에 목검이 부러졌다. 8강 탈락."
            - "손목에서 팔꿈치까지 찌르르 저림이 올라온다. 부러진 목검 끝이 밤하늘로 빙글빙글 날아갔다."
            - 진행자: "무기 파손! 브루노, 4강 진출!"
            - 브루노@당황: "괜찮냐? 미, 미안! 너무 세게 쳤다!"
            - "이긴 사람답지 않게 브루노가 허둥지둥 달려왔다. 내 손목을 이리저리 돌려 본다."
            - 브루노: "안 부러졌지? 손목 말이다."
            - 브루노: "목검은… 목검은 내가 새로 깎아 줄게. 백 개라도!"
            - when: "item.브루노목검"
              브루노@슬픔: "…아, 그거 내가 깎아 준 거잖아. 내 작품을 내가 부쉈네. 하하… 하."
            - 속마음: "(8강 탈락. 손목이 아프다.)"
            - 속마음: "(그런데 웃음이 난다. 이 녀석 앞에서는 이상하게 분하지가 않다.)"
          effects: ["tourney.result = 'quarter'", "affinity.bruno += 5"]

# ---------------------------------------------------------------- 4강
- id: t_semi
  title: 무투대회 4강
  art: cg_t_kaiden
  on: auto
  at: "1.7.3.방과후"
  priority: 10
  announce: 무투대회 4강
  when: "tourney.round == 2"
  lines:
    - "4강 날 오후. 하늘이 쨍하다. 경기장 위로 구름 한 점 없다."
    - 삽화: waiting_room
    - "대기실 돌벽에 등을 기댔다. 바깥의 함성이 벽을 타고 둔하게 울린다."
    - "목검 손잡이에 천을 새로 감았다. 손이 떨려서 세 번을 다시 감았다."
    - "반대편 4강은 한 시간 전에 끝났다."
    - "아렌이 이겼다. 결승 자리 하나는 이미 정해졌다."
    - 속마음: "(4강. 원작 대진표라면 여기 서 있어야 할 이름은 내가 아니다.)"
    - 속마음: "(내가 밀어낸 누군가가 있다. 그리고 지금부터 상대할 사람은, 원작의 우승자다.)"
    - "대기실 문이 열렸다. 조교가 고개를 들이민다."
    - 조교: "D반, 나와. …황자님 상대로 4강이라니. 오래 살고 볼 일이네."
    - 삽화: cg_t_kaiden
    - "통로를 걸어 나가자 햇빛이 쏟아졌다."
    - "눈이 부시다. 함성이 벽처럼 덮쳐 온다."
    - 진행자: "4강! 제국의 3황자, 카이든 아스테라!"
    - "관중석 전체가 일어섰다. 귀족 학생들 쪽에서 황실 문장이 그려진 깃발이 오른다."
    - "카이든은 그 함성 속을 아무 표정 없이 걸어 나왔다. 목검 끝이 모래에 닿지 않게 비스듬히 들고."
    - 진행자: "그리고 그 상대! 예선부터 올라온 D반의 이변, {{player.name}}!"
    - 관중: "D반! D반! …황자님, 보여 주세요!"
    - "다섯 걸음 거리에서 마주 섰다."
    - "가까이서 보니 땀 한 방울 없다. 숨소리도 고르다."
    - when: "know.kaiden_palace"
      속마음: "(무투대회는 꼭 이겨야 한다. 노을 지던 도장에서 그가 한 말이다.)"
    - when: "know.kaiden_palace"
      속마음: "(내가 이기면, 이 사람은 형들 앞에 무슨 얼굴로 돌아가지.)"
    - when: "news.case_end == 'published'"
      나레이션: "관중석 어딘가에서 '어깨!' 하는 외침이 들렸다. 신문 1면에 실렸던 그 기사다."
    - when: "news.case_end == 'published'"
      카이든@화남: "그 기사가 틀렸다는 걸 증명하겠다고 했지. 지금 보여 주마."
    - when: "kaiden.secret"
      속마음: "(너와 나만 아는 걸로 해라. 그 비밀을, 나는 지금 칼처럼 쥐고 있다.)"
    - when: "kaiden.secret"
      속마음: "(그걸 노리면 배신일까. 알면서 봐주는 게, 이 사람한텐 더 큰 모욕일까.)"
    - when: "rival.kaiden"
      카이든@웃음: "약속은 지켰군. 여기까지 올라왔으니."
    - 카이든@진지: "평민이든 D반이든 상관없다. 모래 위엔 검만 있다."
    - "카이든이 검을 들었다. 정석 그 자체."
    - "교본의 삽화를 그대로 떼어 온 것 같은 자세."
    - when: "know.kaiden_shoulder or note.note_kaiden_style.known"
      나레이션: "그런데 왼팔이 몸에 붙어 있다. 아주 조금, 남들은 모를 만큼."
    - when: "know.kaiden_shoulder or note.note_kaiden_style.known"
      속마음: "(왼쪽 어깨. 강타를 쓸 때마다 어깨를 감싼다.)"
    - when: "know.kaiden_shoulder or note.note_kaiden_style.known"
      속마음: "(그 순간을 받아내면 빈틈이 생긴다.)"
    - when: "not know.kaiden_shoulder and not note.note_kaiden_style.known"
      속마음: "(원작 최강의 1학년. 정석의 검.)"
    - when: "not know.kaiden_shoulder and not note.note_kaiden_style.known"
      속마음: "(어딘가 버릇이 있을 텐데… 지금은 안 보인다.)"
    - "심판 교관이 두 사람 사이에서 손을 들었다. 경기장이 숨을 죽인다."
    - 교관@진지: "4강 1경기. 시작!"
  battle:
    enemy: t_kaiden
    win:
      lines:
        - "몇 번째 합이었을까. 카이든의 오른손이 왼쪽 어깨를 감싸며 검을 높이 끌어올렸다."
        - "내려베기. 받았다. 손목이 부러질 것 같은 무게. 그래도 받았다."
        - "카이든의 목검이 허공을 갈랐다. 그 틈으로 파고들었다."
        - "오른쪽 아래. 목검 끝이 옆구리에 닿기 직전에 멈췄다."
        - "경기장이 숨을 멈췄다."
        - 교관: "……유효타. 승자, D반."
        - 진행자@놀람: "이, 이변입니다! 황자가 4강에서…! D반이 결승으로!"
        - 관중: "……와아아아아!"
        - "함성이 한 박자 늦게 터졌다. 귀족석은 조용하고, 평민석은 미친 듯이 발을 구른다."
        - "카이든은 한동안 그 자리에 서 있었다. 목검을 쥔 손등에 핏줄이 섰다가, 천천히 풀린다."
        - 카이든@진지:
            - "……인정하지."
            - { when: "know.kaiden_shoulder", text: "……인정하지. 노린 게 아니라, 읽었군." }
        - when: "know.kaiden_palace"
          카이든: "형님들은 웃겠지. 셋째가 D반한테 졌다고."
        - when: "know.kaiden_palace"
          카이든: "상관없다. 오늘은… 처음으로 진짜 검을 맞았으니까."
        - 카이든@진지: "결승에서 지면 용서 안 한다."
        - "카이든이 돌아서서 걸어갔다."
        - "귀족석에서 누군가 혀를 차는 소리가 들렸다. 그는 돌아보지 않았다."
        - 속마음: "(원작의 우승자가 4강에서 떨어졌다. 대진표가, 원작이, 지금 한 칸 무너졌다.)"
        - 속마음: "(그리고 결승. 아렌이 기다린다.)"
      effects: ["tourney.round = 3", "affinity.kaiden += 10", "trust.kaiden += 10"]
    lose:
      lines:
        - "찌르기, 찌르기, 그리고 내려베기. 보여도 몸이 그 속도를 따라가지 못한다."
        - "정석의 검. 한 치의 빈틈도 없었다."
        - "목검이 손에서 날아갔다. 목 옆에 카이든의 검끝이 멈춰 있다."
        - "4강 탈락."
        - 진행자: "승자, 카이든 아스테라! 결승 진출!"
        - 관중: "카이든! 카이든!"
        - "카이든이 목검을 거두었다. 숨이 아주 조금 거칠다. 이마에 땀 한 방울."
        - 카이든: "나쁘지 않았다. 평민 중에선."
        - 카이든@진지: "…아니, 정정하지. 이번 대회에서 내 땀을 본 건 네가 처음이다."
        - when: "know.kaiden_palace"
          카이든: "결승은 내가 가져간다. 형님들 앞에 들고 갈 거다."
        - when: "note.note_tourney.known"
          속마음: "(원작대로라면 카이든은 결승에서 아렌을 꺾는다. 그리고 아렌은 처음 이를 악문다.)"
        - "대기실로 돌아가는 통로가 어둡다. 등 뒤의 함성이 멀어진다."
        - 속마음: "(4강. D반으로선 대단한 성적일 거다. 그래도, 분하다.)"
      effects: ["tourney.result = 'semi'", "affinity.kaiden += 4"]

# ---------------------------------------------------------------- 결승 (내가 올라간 경우)
- id: t_final
  title: 무투대회 결승
  art: cg_t_final
  on: auto
  at: "1.7.3.밤"
  priority: 10
  announce: 무투대회 결승
  when: "tourney.round == 3"
  lines:
    - "결승의 밤."
    - "경기장 둘레의 횃불이 두 배로 늘었다. 머리 위엔 마법 조명이 별처럼 떠 있다."
    - "관중석에 빈자리가 없다. 계단에 앉은 사람, 난간에 매달린 사람."
    - "교수들까지 귀빈석에 나와 있다."
    - "귀빈석 끝자리에 가렌 교관이 팔짱을 끼고 앉아 있다. 표정이 평소와 똑같다."
    - "그 옆의 엘베라 교수는 졸린 눈으로 부채를 부친다. 오백 년 동안 이런 밤을 몇 번이나 봤을까."
    - 삽화: waiting_room
    - "대기 통로 끝, 철창 너머로 모래가 보인다. 횃불 빛에 주황색으로 물든 모래."
    - 속마음: "(이 장면은 지금도 기억한다.)"
    - 속마음: "(성검이 깨어나고, 그래도 카이든이 이기고. 아렌이 모래를 움켜쥐던 컷.)"
    - 속마음: "(지금 저 통로 반대편엔, 그 아렌이 서 있다.)"
    - "철창이 올라갔다."
    - 삽화: cg_t_final
    - 진행자: "결승! 성검에 선택받은 평민, 아렌!"
    - "관중석이 터질 것 같다. 원작에서 이 자리에 섰던 건 카이든이었다."
    - "맞은편 통로에서 아렌이 걸어 나왔다."
    - "허리엔 성검. 손에 든 건 여전히 목검이다."
    - 진행자: "그리고, 예선부터 황자까지 쓰러뜨린 D반의 이변! {{player.name}}!"
    - 관중: "D반! D반! D반!"
    - "모래를 밟았다. 함성이 몸을 통과해 지나간다. 발바닥까지 떨린다."
    - when: "affinity.liana >= 15"
      나레이션: "관중석 앞줄, 리아나가 난간을 꼭 붙잡고 있다."
    - when: "affinity.liana >= 15"
      나레이션: "입 모양만 보인다. ─ 이겨."
    - when: "affinity.bruno >= 10"
      나레이션: "그 옆에서 브루노가 웃통을 벗어 흔들고 있다. 사감 선생님이 뒤에서 달려온다."
    - when: "rival.mirabel"
      나레이션: "마도과 쪽 관중석에서 미라벨이 팔짱을 낀 채 노려본다. 지면 용서 안 한다는 얼굴이다."
    - "귀빈석 아래 난간에 카이든이 홀로 기대 서 있다. 오후의 패배 따위 없었다는 듯 곧은 자세로."
    - "경기장 한가운데. 아렌과 마주 섰다. 다섯 걸음 거리."
    - "횃불 빛이 아렌의 얼굴에서 흔들린다."
    - "양 떼를 몰던 소년의 얼굴. 그런데 눈빛이 다르다."
    - 아렌@진지:
        - "결승에서 보자고 했잖아."
        - { when: "aren.temper >= 1", text: "너랑 붙게 될 줄 알았어. 봐주지 마." }
        - { when: "aren.temper <= -1", text: "…비켜. 나는 이겨야 해." }
    - when: "aren.temper >= 1"
      아렌@웃음: "솔직히 무서워. 근데 상대가 너라서 다행이야."
    - when: "aren.temper >= 1"
      아렌@웃음: "진짜로 싸워 볼 수 있잖아."
    - when: "aren.temper <= -1"
      아렌@화남: "다들 날 성검으로만 봐."
    - when: "aren.temper <= -1"
      아렌@화남: "이겨도 성검이 이긴 거라고 하겠지. 그래도 이겨야 해."
    - when: "aren.temper > -1 and aren.temper < 1"
      아렌: "이상하지. 반년 전엔 양 떼 몰던 애가 여기 서 있어. 너도 D반이었고."
    - "아렌의 허리춤에서 성검이 웅웅 울린다. 칼집 틈으로 빛이 샌다."
    - 아렌@당황: "…아, 쟤가 또. 신경 쓰지 마. 안 써. 목검으로 할 거야."
    - 속마음: "(쓰지 않으려 해도 쓰게 된다. 원작에서도 그랬다.)"
    - when: "note.note_aren_final.known"
      속마음: "(체력이 반쯤 깎이면 성검이 깨어난다. 그때부터가 진짜다.)"
    - when: "note.note_aren_final.known"
      속마음: "(성검의 목소리에 정신이 팔리면 동작이 굳는다.)"
    - when: "note.note_aren_final.known"
      속마음: "(위키에 적혀 있던 공략 한 줄. 그 틈이 유일한 길이다.)"
    - when: "aren.anchor"
      속마음: "(이상해지면 멈춰 달라던 부탁. 오늘은 그 약속의 연습이다.)"
    - 속마음: "(이기면 원작이 무너진다. 우승자가 바뀌고, 무언가가 나를 보기 시작할 거다.)"
    - 속마음: "(지면 아렌이 우승한다. 그것도 원작엔 없던 결말이다. 어느 쪽이든—)"
    - 속마음: "(…아니. 지금은 계산하지 말자.)"
    - 속마음: "(3,000시간 만에 처음으로, 공략 없이 싸워 보고 싶다.)"
    - "심판 교관이 두 사람 사이에 섰다."
    - "경기장이 거짓말처럼 조용해진다. 횃불 타는 소리만 들린다."
    - 교관@진지: "결승. 장외, 무기 이탈, 혹은 내가 멈출 때까지. …시작!"
  battle:
    enemy: t_aren
    win:
      art: cg_t_victory
      lines:
        - "성검의 빛이 경기장을 하얗게 삼켰다. 아렌의 눈동자가 금빛으로 흔들린다."
        - "목소리가 들리는 것 같았다. 아렌의 것이 아닌 목소리. ─ 베어라."
        - "그 순간, 아렌의 발이 굳었다. 반 박자."
        - "그 반 박자 안으로 뛰어들었다."
        - "목검과 빛이 부딪혔다. 손바닥이 타는 것 같다. 놓지 않았다."
        - "빛이 갈라졌다."
        - "성검의 빛이 사그라들었다. 아렌이 무릎을 꿇은 채 웃는다."
        - "아렌의 목검이 손에서 미끄러져 모래 위에 떨어졌다. 툭, 소리가 이상하게 크다."
        - "고요."
        - "수천 명이 동시에 숨을 멈춘 고요."
        - 아렌@웃음: "…졌다. 진짜로 졌어. 고마워, 봐주지 않아서."
        - 아렌: "성검이 진 게 아니라 내가 진 거야. 그러니까 괜찮아. 진짜 괜찮아."
        - 진행자@놀람: "우승! D반, {{player.name}}!"
        - 관중: "와아아아아아!"
        - "함성이 밤하늘을 찢었다. 횃불이 흔들리고, 누군가 던진 모자들이 모래 위로 쏟아진다."
        - "D반 깃발이, 작고 낡은 그 깃발이 관중석 맨 앞에서 미친 듯이 펄럭인다."
        - when: "affinity.liana >= 15"
          나레이션: "리아나가 난간 너머로 몸을 내밀고 손을 흔든다. 우는지 웃는지 모르겠다."
        - when: "affinity.bruno >= 10"
          브루노@웃음: "봤냐아아! {{if origin != '악역도련님' and origin != '몰락귀족'}}우리 방이{{else}}D반이{{/if}} 우승했다아아!"
        - "아렌에게 손을 내밀었다."
        - "아렌이 그 손을 잡고 일어선다. 손바닥이 뜨겁다."
        - 아렌@진지: "다음엔 내가 이길게. 그때도 봐주지 마."
        - "귀빈석 아래, 카이든이 난간에서 등을 뗐다."
        - "아무 말 없이 손뼉을 세 번 쳤다. 그리고 돌아섰다."
        - "귀빈석의 가렌 교관은 여전히 팔짱을 끼고 있다. 그런데 고개가, 아주 조금 끄덕였다."
        - 속마음: "(우승했다. 원작의 1학년 무투대회 우승자는 카이든이다.)"
        - 속마음: "(37개 엔딩 전부에서.)"
        - 속마음: "(그 고정값이, 지금, 바뀌었다.)"
        - 속마음: "(…3,000시간 동안 한 번도 못 바꾼 걸.)"
        - "밤하늘에 축포가 올라갔다. 터지는 불꽃 아래, 모래 위에 서서 한참 숨만 쉬었다."
      effects: ["tourney.winner = 'me'", "tourney.result = 'win'"]
    lose:
      art: cg_t_runnerup
      lines:
        - "성검이 칼집 안에서 울었다. 아렌의 목검에 빛이 번진다."
        - "받으려고 했다. 피하려고 했다. 둘 다 늦었다."
        - "빛이 터졌다."
        - "정신을 차렸을 땐 하늘이 보였다. 마법 조명이 별처럼 흔들린다."
        - "등 밑의 모래가 뜨겁다. 손에 아무것도 쥐어져 있지 않다."
        - 진행자: "우승! 성검의 평민, 아렌!"
        - 관중: "아렌! 아렌! 아렌!"
        - "준우승."
        - "함성이 멀리서 들린다. 물속에서 듣는 것처럼."
        - "그림자 하나가 조명을 가렸다. 아렌이다."
        - "숨이 턱까지 차 있다. 성검의 빛은 이미 꺼져 있다."
        - 아렌@웃음: "{{player.name}}, 일어날 수 있어? …너 아니었으면 나 여기까지 못 왔어."
        - 아렌@당황: "아까 그거… 성검이 멋대로 한 거야. 나 진짜 목검으로만 하려고 했는데."
        - 아렌@진지: "그러니까 이건 반쪽짜리 우승이야. 다음엔 성검 없이 이길게. 너한테."
        - "아렌의 손을 잡고 일어섰다. 다리가 후들거린다."
        - "함성이 이번엔 두 사람 모두에게 쏟아진다."
        - 관중: "D반도 잘했다!"
        - when: "affinity.liana >= 15"
          나레이션: "관중석의 리아나가 두 손을 모아 입에 대고 뭔가 외친다."
        - when: "affinity.liana >= 15"
          나레이션: "함성에 묻혀 들리지 않는다. 그래도 알 것 같다."
        - "귀빈석 아래의 카이든과 눈이 마주쳤다."
        - "그는 짧게 고개를 끄덕였다. 그게 전부였다."
        - 속마음: "(원작의 우승자는 카이든이었다. 오늘의 우승자는 아렌이다.)"
        - 속마음: "(내가 4강에서 카이든을 꺾지 않았다면 없던 결말.)"
        - 속마음: "(아렌은 이 결승에서 이를 악물지 않았다. 대신, 웃으며 내 손을 잡았다.)"
        - 속마음: "(…그거면 됐다. 정말로, 그거면 된 걸까.)"
        - "축포가 올라갔다. 불꽃이 아렌의 머리 위에서 터진다. 내 머리 위에서도."
      effects: ["tourney.winner = 'aren'", "tourney.result = 'final'", "aren.kind += 1"]

# ---------------------------------------------------------------- 결승 관전 (원작대로 카이든 vs 아렌)
- id: t_final_watch
  title: 무투대회 결승 — 관중석에서
  art: cg_t_watch
  on: auto
  at: "1.7.3.밤"
  priority: 10
  when: "tourney.round != 3 and not tourney.winner"
  lines:
    - "결승의 밤. 관중석은 발 디딜 틈도 없다."
    - "경기장 둘레의 횃불이 두 배로 늘었다. 머리 위엔 마법 조명이 별처럼 떠 있다."
    - when: "tourney.spectator"
      나레이션: "관중석 맨 윗줄. 예선 날과 같은 자리다."
    - when: "tourney.result == 'semi'"
      나레이션: "옆구리가 아직 욱신거린다. 오후에 저 황자의 검에 맞은 자리다."
    - when: "tourney.result == 'quarter' or tourney.result == 'prelim'"
      나레이션: "붕대 감은 손목을 무릎에 올려놓고 관중석 계단에 앉았다."
    - "결승. 카이든 대 아렌. 원작 그대로의 대진이다."
    - 속마음: "(이 장면만큼은 수십 번 봤다. 스킵 버튼도 안 눌렀다.)"
    - 속마음: "(어디서 성검이 빛나는지, 어디서 카이든이 반 걸음 들어가는지. 대사까지 외운다.)"
    - 진행자: "결승! 제국의 3황자, 카이든 아스테라! 그리고 성검의 평민, 아렌!"
    - 관중: "카이든! 카이든! …아렌! 아렌!"
    - "귀족석은 카이든의 이름을, 평민석은 아렌의 이름을 외친다. 함성이 경기장 한가운데서 부딪힌다."
    - "카이든은 오른손에 목검을 늘어뜨린 채 걸어 나왔다. 오후와 똑같은 걸음, 똑같은 표정."
    - "아렌은 허리에 성검을 찼다. 그런데 손에 든 건 이번에도 목검이다."
    - when: "affinity.aren >= 15"
      속마음: "(성검 말고, 내 힘으로 어디까지 가는지 보고 싶다고 했었다. 게시판 앞에서.)"
    - 속마음: "(원작에선 여기서 아렌이 성검을 뽑지 않는 이유가 설명되지 않았다. 그냥 연출이었다.)"
    - 속마음: "(이제 안다. 저건 연출이 아니라 고집이다.)"
    - "두 사람이 마주 섰다. 카이든은 정석의 자세로."
    - "아렌은 서툴지만 곧은 자세로."
    - "심판 교관의 손이 내려갔다. 경기장 전체가 숨을 들이켰다."
    - "첫 합. 카이든의 찌르기를 아렌이 몸으로 막았다."
    - "두 번째 합도. 세 번째 합도."
    - "아렌이 밀린다. 한 걸음, 두 걸음. 장외선이 가까워진다."
    - "그때, 아렌의 허리춤에서 칼집이 울었다."
    - "성검의 빛이 터졌다. 관중석이 일제히 일어선다."
    - "아렌의 성검이 빛났지만, 카이든의 검이 한 수 빨랐다."
    - "빛이 아렌의 목검으로 번지기 직전, 카이든이 반 걸음 들어가 손목을 쳤다."
    - 속마음: "(원작 그대로. 반 걸음. 저 반 걸음이 지금 둘의 차이다.)"
    - "빛을 머금은 목검이 모래 위에 꽂혔다. 빛이 꺼진다."
    - 진행자: "우승, 카이든 아스테라!"
    - 관중: "와아아아!"
    - "아렌이 무릎을 꿇은 채 이를 악문다."
    - "모래를 움켜쥔 손등에 핏줄이 섰다. 주먹 사이로 모래가 흘러내린다."
    - 속마음: "(원작의 그 컷이다. 아렌이 처음으로 이를 악무는 장면.)"
    - 속마음: "(커뮤니티에선 '아렌 각성 1단계'라고 불렀다. 멋진 장면이라고.)"
    - 속마음: "(지금은 안다. 저 악문 이의 끝에 무엇이 있는지.)"
    - "카이든은 승자의 자리에서 관중석을 올려다봤다. 귀족석 맨 위, 황실 사절석 쪽을."
    - "그 자리의 누군가가 형식적으로 손뼉을 쳤다. 카이든의 표정은 변하지 않았다."
    - when: "know.kaiden_palace"
      속마음: "(형들이 보낸 사람일 거다. 우승해도, 저 박수뿐이다.)"
    - when: "tourney.result == 'semi'"
      속마음: "(오후에 나를 이긴 검이다. 저 검에 아렌도 졌다.)"
    - "관중이 흩어지기 시작한다. 아렌은 아직 모래 위에 있다."
    - "카이든은 통로 쪽으로 걷는다."
    - 속마음: "(지금 내려가면, 둘 중 한 사람에게는 닿을 수 있다.)"
  effects: ["tourney.winner = 'kaiden'"]
  choices:
    - text: 모래 위로 내려가 아렌에게 손을 내민다
      effects: ["affinity.aren += 8", "aren.kind += 1"]
      lines:
        - "관중석 계단을 뛰어 내려갔다. 경비병의 제지를 피해 난간을 넘었다."
        - "모래 위. 아렌 앞에 섰다. 아렌이 고개를 들지 않는다."
        - 아렌@슬픔: "…보지 마. 지금 얼굴 엉망이야."
        - "말없이 손을 내밀었다."
        - "아렌이 한참 그 손을 내려다봤다. 모래투성이 주먹이 천천히 펴진다."
        - 아렌@슬픔: "성검이 빛났는데도 졌어. 성검이 있어도 안 되면, 나는 뭘 해야 해?"
        - 나: "같이 하자. 내일부터. 성검 말고, 너를 키우는 거."
        - "아렌이 내 손을 잡았다. 손바닥이 모래로 까끌까끌하다. 뜨겁다."
        - 아렌@진지: "…고마워. 다음엔 꼭 이길게. 너도 같이 강해지자."
        - "아렌이 일어섰다. 이를 악물던 턱이 풀려 있다."
        - 속마음: "(원작에서 아렌은 이 장면에서 혼자였다. 아무도 내려오지 않았다.)"
        - 속마음: "(악문 이 대신, 잡은 손. 이 차이가 몇 년 뒤에 무엇이 될지는 모른다.)"
    - text: 통로로 가서 카이든에게 축하를 건넨다
      effects: ["affinity.kaiden += 6"]
      lines:
        - 삽화: waiting_room
        - "통로 입구에서 카이든을 따라잡았다. 경기장의 함성이 등 뒤에서 멀어진다."
        - "횃불 하나뿐인 어두운 통로. 카이든이 돌벽에 기대어 왼쪽 어깨를 쥐고 있다."
        - "내 발소리에 그 손이 내려갔다."
        - 카이든@화남: "…뭐냐."
        - 나: "우승 축하해."
        - 카이든@놀람: "……."
        - "카이든이 나를 빤히 본다. 축하라는 말을 처음 듣는 사람처럼."
        - 카이든: "형님들은 이걸로도 만족 안 하겠지만. …고맙다."
        - 카이든@진지: "황궁에서 축하는 다음 수를 위한 인사다. 아무 계산 없는 건 오랜만이군."
        - "카이든이 통로 끝으로 걸어갔다. 어깨를 감싸지 않은 채로."
        - 속마음: "(원작의 우승자. 몇 년 뒤의 반역자.)"
        - 속마음: "(오늘 밤엔 그냥, 축하 한마디가 필요했던 소년.)"
    - text: 조용히 자리를 뜬다
      effects: ["aren.cold += 1"]
      lines:
        - "관중석을 빠져나왔다. 함성이 등 뒤로 멀어진다."
        - "경기장 바깥 돌담길. 여름밤 풀벌레 소리가 함성 대신 귀를 채운다."
        - "한 번 뒤를 돌아봤다. 아치 너머로, 모래 위에 혼자 남은 작은 그림자가 보인다."
        - "아무도 그쪽으로 내려가지 않는다."
        - 속마음: "(원작대로. 아렌은 오늘부터 혼자 이를 악물고 강해진다.)"
        - 속마음: "(그 끝이 흑화다.)"
        - 속마음: "(알면서도 발이 움직이지 않았다. 아니, 움직이지 않기로 했다.)"
        - 속마음: "(원작대로 흘러가야 노트가 맞는다.)"
        - 속마음: "(노트가 맞아야 나머지를 구한다. …그렇게 계산했다.)"
        - "반딧불 하나가 눈앞을 스쳐 갔다. 그 빛이 이상하게 차가워 보였다."
        - 속마음: "(계산은 맞다. 맞을 거다. 그런데 왜 이렇게 목이 마르지.)"

- id: t_after
  title: 무투대회 뒤풀이
  on: auto
  at: "1.7.4.방과후"
  priority: 10
  when: "tourney.entered"
  branch:
    - when: "tourney.result == 'win'"
      art: cg_t_medal
      lines:
        - "무투대회가 끝나고 한 주 뒤. 해 질 녘 경기장."
        - "축하연은 경기장 모래 위에서 열렸다. 급하게 쳐 놓은 천막, 식당에서 날라 온 고기 냄새."
        - "목에 건 우승 메달이 생각보다 무겁다."
        - "금빛 원판에 아카데미 문장과 올해 연도. 뒷면에 새긴 내 이름은 급하게 판 듯 획이 삐뚤다."
        - 학생 A@웃음: "D반 챔피언! 사과주 한 잔 받아!"
        - 학생 B: "결승 때 그거 어떻게 한 거야? 성검이 빛나는데 그 안으로 뛰어들었잖아!"
        - "모르는 얼굴들이 어깨를 두드린다."
        - "이름을 부른다. 처음 듣는 별명도 들린다."
        - when: "affinity.bruno >= 10"
          브루노@웃음: "챔피언이다! 비켜라, 비켜! 내가 제일 먼저 축하할 거다!"
        - when: "affinity.liana >= 15"
          리아나@웃음: "축하해! 결승 날 나 목 다 쉬었어. 들어 봐, 목소리 이상하지?"
        - when: "rival.mirabel"
          미라벨@당황: "…축하해."
        - when: "rival.mirabel"
          미라벨@당황: "나를 이긴 사람이 우승했으니까 결과적으로 내 평가도 오르는 거야. 그뿐이야."
        - when: "affinity.aren >= 10"
          아렌@웃음: "챔피언! 나 결승 다음 날부터 매일 새벽에 연습했어."
        - when: "affinity.aren >= 10"
          아렌@웃음: "다음 대회는 내 거야."
        - when: "fate.edric == 'saved' and origin != '악역도련님'"
          에드릭@당황: "흥, D반 주제에 우승이라니. …뭐, 축하는 해 줄게."
        - when: "fate.edric == 'saved' and origin != '악역도련님'"
          에드릭@당황: "날 구한 놈이 약하면 내 체면이 안 서니까."
        - when: "affinity.kaiden >= 15"
          나레이션: "천막 기둥에 기대 선 카이든과 눈이 마주쳤다. 카이든이 잔을 아주 조금 들어 보였다."
        - "웃음과 함성 속에서 메달을 만지작거렸다. 차갑던 금속이 손의 온기로 데워진다."
        - 속마음: "(이게 원작 이탈의 무게인가. 생각보다 무겁고, 생각보다 따뜻하다.)"
        - "그때였다."
        - "축하하러 온 사람들 사이로, 낯선 로브 차림의 사내가 서 있었다."
        - "천막 그늘, 사람들 틈. 아무도 그를 신경 쓰지 않는다."
        - "아무도 그를 보지 못하는 것처럼."
        - "후드 그림자 속에서 눈이 나를 보고 있다. 오래. 아주 오래."
