        - "담임은 그 말만 하고 돌아섰다. 그런데 계단을 오르는 발걸음이 평소보다 가벼웠다."
        - 속마음: "(D반. 원작에선 엑스트라를 몰아넣는 반이었다.)"
        - 속마음: "(배경 그래픽에도 제대로 안 나왔다.)"
        - 속마음: "(그 반이 지금, 관중석이 떠나가라 발을 구른다.)"
        - "돌아오는 길, 모르는 상급생이 어깨를 툭 쳤다."
        - 상급생: "카이든한테 진 4강 D반 맞지? 그 경기 좋더라."
        - 상급생: "진 쪽이 더 기억에 남는 경기는 드물어."
        - 속마음: "(4강. 내 이름은 대진표에 남았다. 원작에 없던 이름이.)"
