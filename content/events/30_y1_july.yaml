# ---------------------------------------------------------------- 종업식
- id: y1_closing
  title: 1학기 종업식
  art: cg_y1_closing
  on: auto
  at: "1.7.4.주말"
  priority: 10
  announce: 1학기 종업식
  lines:
    - "7월의 마지막 주말."
    - "1학기 종업식. 강당 창문으로 여름 햇살이 쏟아진다."
    - "높은 아치형 창마다 빛의 기둥이 비스듬히 내려와, 줄지어 선 학생들의 어깨에 얹힌다."
    - "먼지가 빛 속에서 천천히 돈다. 매미 소리가 창틀을 넘어 들어온다."
    - "D반 줄은 강당 맨 뒤, 기둥 그늘 아래다. 그래도 오늘은 덥지 않다."
    - "앞쪽으로 반마다 줄이 늘어서 있다. 맨 앞줄 어딘가에 자로 잰 듯 곧은 등이 보인다. 카이든이다."
    - "B반 줄 중간쯤에서는 아렌이 하품을 참느라 눈물을 글썽인다."
    - 속마음: "(빙의한 날부터 치면 반년. 원작 시간으로는 '1학기' 한 챕터.)"
    - "단상 위에서 학장의 훈화가 시작됐다."
    - 동기: "야, 훈화 40분 넘으면 내가 저녁 산다."
    - 동기@당황: "…넘을 거야. 작년엔 한 시간 했대."
    - "'올해 1학년은 유난히 일이 많았다'로 시작한 훈화는, 미궁 안전 수칙을 거쳐 기숙사 통금으로 흘러갔다."
    - 속마음: "(원작에서 이 훈화는 스킵 버튼 한 번이었다. 실제로 들으니 40분이다.)"
    - "앞줄 누군가가 선 채로 졸다가 휘청였다. 옆 사람이 붙잡아 준다."
    - when: "affinity.noel >= 10"
      나레이션: "상급생 줄 맨 끝, 노엘 선배가 기둥에 기대 대놓고 잔다. 술 냄새가 여기까지 난다."
    - when: "fate.edric == 'dead'"
      나레이션: "훈화 중간, 학장이 말을 멈췄다. 올해 미궁에서 잃은 학생을 위한 묵념."
    - when: "fate.edric == 'dead'"
      나레이션: "강당이 고요해졌다. 벨모어가의 아들. 미궁 3층. 사고사로 처리된 죽음."
    - when: "fate.edric == 'dead'"
      속마음: "(시체 주변에 피로 그린 원이 있었다는 소문. 나는 그게 사고가 아니라는 걸 안다.)"
    - "이어서 교수들의 짧은 인사. 가렌 교관은 단상에 올라 딱 한 마디를 했다."
    - 가렌@진지: "방학 동안 녹슬지 마라. 이상."
    - "강당에 웃음이 번졌다. 가렌은 웃지 않았다."
    - 엘베라@웃음: "여름은 짧아요. 오백 번쯤 겪어 보니 그렇더라고요."
    - 엘베라@웃음: "다들 즐겁게 보내세요."
    - "다들 농담인 줄 알고 웃었다. 나만 웃지 못했다."
