# 7월: 1학년 무투대회와 1학기 종업식
# 매 경기는 패턴 읽기 전투. 공략 노트나 관찰로 알아낸 정보가 있으면 상대의 다음 행동이 정확히 보인다.

- id: t_signup
  title: 무투대회 참가 신청
  on: auto
  at: "1.7.1.방과후"
  priority: 10
  announce: 무투대회 참가 신청
  lines:
    - "무투대회 참가 신청서 마감일. 접수처 앞에 줄이 길다."
    - when: "stat.근력 + stat.마력제어 + stat.민첩 < 70"
      속마음: "(지금 실력으로 나가도 될까…)"
    - when: "stat.근력 + stat.마력제어 + stat.민첩 >= 100"
      속마음: "(이 몸, 생각보다 많이 컸다.)"
  choices:
    - text: 참가한다
      effects: ["tourney.entered = 1"]
      lines: ["이름을 적었다. 접수원이 D반이라는 걸 보고 눈썹을 올린다."]
    - text: 관전만 한다
      effects: ["tourney.spectator = 1"]
      lines: ["이번엔 지켜보기로 했다. 원작이 어떻게 흘러가는지 확인하는 것도 공부다."]

# ---------------------------------------------------------------- 예선
- id: t_prelim
  title: 무투대회 예선
  on: auto
  at: "1.7.2.방과후"
  priority: 10
  announce: 무투대회 예선
  branch:
    - when: "tourney.entered"
      lines:
        - 진행자: "예선 3조! D반 대 C반!"
        - "상대는 덩치 큰 C반 남학생. 목검을 어깨에 걸치고 히죽 웃는다."
      battle:
        enemy: t_prelim
        win:
          lines: ["덩치가 장외로 굴러떨어졌다. 관중석에서 휘파람이 터진다.", 진행자: "D반, 본선 진출!"]
          effects: ["tourney.round = 1", "reputation += 3"]
        lose:
          lines: ["목검이 손에서 튕겨 나갔다. 예선 탈락."]
          effects: ["tourney.result = 'prelim'"]
    - lines:
        - "관중석에서 예선을 지켜봤다. 아렌은 성검 없이 목검으로 아슬아슬하게 이겼다."
        - "카이든은 세 합 만에 상대를 장외로 보냈다. 왼쪽 어깨를 한 번도 쓰지 않고."
      effects: ["stat.지성 += 1", "know.kaiden_shoulder = 1"]

# ---------------------------------------------------------------- 본선 8강
- id: t_quarter
  title: 무투대회 본선 8강
  on: auto
  at: "1.7.2.밤"
  priority: 10
  announce: 무투대회 본선 8강
  when: "tourney.round == 1"
  branch:
    - when: "rival.mirabel"
      lines:
        - 진행자: "8강! 아델하이트의 천재, 미라벨!"
        - 미라벨: "드디어 공식적으로 짓밟을 수 있겠네."
        - 속마음: "(마법 싸움으로는 불리하다. 붙어서 쳐야 한다. 대마법 영창은 강타로 끊는다.)"
      battle:
        enemy: t_mirabel
        win:
          lines: ["미라벨의 지팡이가 바닥을 굴렀다.", 미라벨: "…말도 안 돼. 다음엔, 다음엔 절대."]
          effects: ["tourney.round = 2", "affinity.mirabel += 8", "trust.mirabel += 8"]
        lose:
          lines: ["회오리에 휩쓸려 장외로 날아갔다. 8강 탈락.", 미라벨: "…그래도 여기까지 온 건 칭찬해 줄게."]
          effects: ["tourney.result = 'quarter'", "affinity.mirabel += 3"]
    - lines:
        - 진행자: "8강! 대장장이의 아들, 브루노!"
        - 브루노: "친구라도 봐주는 거 없다!"
        - 속마음: "(힘은 브루노가 위다. 발을 구르면 전력이 온다. 그때는 받지 말고 끊어야 한다.)"
      battle:
        enemy: t_bruno
        win:
          lines: ["브루노가 대자로 뻗었다. 그리고 웃었다.", 브루노: "하하! 너 진짜 뭐 먹고 사냐! 결승까지 가라!"]
          effects: ["tourney.round = 2", "affinity.bruno += 8"]
        lose:
          lines: ["브루노의 일격에 목검이 부러졌다. 8강 탈락.", 브루노: "괜찮냐? 미, 미안! 너무 세게 쳤다!"]
          effects: ["tourney.result = 'quarter'", "affinity.bruno += 5"]

# ---------------------------------------------------------------- 4강
- id: t_semi
  title: 무투대회 4강
  on: auto
  at: "1.7.3.방과후"
  priority: 10
  announce: 무투대회 4강
  when: "tourney.round == 2"
  lines:
    - 진행자: "4강! 제국의 3황자, 카이든 아스테라!"
    - when: "know.kaiden_shoulder or note.note_kaiden_style.known"
      속마음: "(왼쪽 어깨. 강타를 쓸 때마다 어깨를 감싼다. 그 순간을 받아내면 빈틈이 생긴다.)"
  battle:
    enemy: t_kaiden
    win:
      lines:
        - "카이든의 목검이 허공을 갈랐다. 그 틈으로 파고들었다."
        - 카이든: "……인정하지. 결승에서 지면 용서 안 한다."
      effects: ["tourney.round = 3", "affinity.kaiden += 10", "trust.kaiden += 10"]
    lose:
      lines: ["정석의 검. 한 치의 빈틈도 없었다. 4강 탈락.", 카이든: "나쁘지 않았다. 평민 중에선."]
      effects: ["tourney.result = 'semi'", "affinity.kaiden += 4"]

# ---------------------------------------------------------------- 결승 (내가 올라간 경우)
- id: t_final
  title: 무투대회 결승
  on: auto
  at: "1.7.3.밤"
  priority: 10
  announce: 무투대회 결승
  when: "tourney.round == 3"
  lines:
    - 진행자: "결승! 성검에 선택받은 평민, 아렌!"
    - "관중석이 터질 것 같다. 원작에서 이 자리에 섰던 건 카이든이었다."
    - 아렌:
        - "결승에서 보자고 했잖아."
        - { when: "aren.temper >= 1", text: "너랑 붙게 될 줄 알았어. 봐주지 마." }
        - { when: "aren.temper <= -1", text: "…비켜. 나는 이겨야 해." }
    - when: "note.note_aren_final.known"
      속마음: "(체력이 반쯤 깎이면 성검이 깨어난다. 그때부터가 진짜다.)"
  battle:
    enemy: t_aren
    win:
      lines:
        - "성검의 빛이 사그라들었다. 아렌이 무릎을 꿇은 채 웃는다."
        - 아렌: "…졌다. 진짜로 졌어. 고마워, 봐주지 않아서."
        - 진행자: "우승! D반, {{player.name}}!"
      effects: ["tourney.winner = 'me'", "tourney.result = 'win'"]
    lose:
      lines:
        - "빛이 터졌다. 정신을 차렸을 땐 하늘이 보였다. 준우승."
        - 아렌: "{{player.name}}, 일어날 수 있어? …너 아니었으면 나 여기까지 못 왔어."
      effects: ["tourney.winner = 'aren'", "tourney.result = 'final'", "aren.kind += 1"]

# ---------------------------------------------------------------- 결승 관전 (원작대로 카이든 vs 아렌)
- id: t_final_watch
  title: 무투대회 결승 — 관중석에서
  on: auto
  at: "1.7.3.밤"
  priority: 10
  when: "tourney.round != 3 and not tourney.winner"
  lines:
    - "결승. 카이든 대 아렌. 원작 그대로의 대진이다."
    - "아렌의 성검이 빛났지만, 카이든의 검이 한 수 빨랐다."
    - 진행자: "우승, 카이든 아스테라!"
    - "아렌이 무릎을 꿇은 채 이를 악문다."
  effects: ["tourney.winner = 'kaiden'"]
  choices:
    - text: 아렌에게 손을 내민다
      effects: ["affinity.aren += 8", "aren.kind += 1"]
      lines: [아렌: "…고마워. 다음엔 꼭 이길게. 너도 같이 강해지자."]
    - text: 카이든에게 축하를 건넨다
      effects: ["affinity.kaiden += 6"]
      lines: [카이든: "형님들은 이걸로도 만족 안 하겠지만. …고맙다."]
    - text: 조용히 자리를 뜬다
      effects: ["aren.cold += 1"]
      lines:
        - 속마음: "(원작대로. 아렌은 오늘부터 혼자 이를 악물고 강해진다. 그 끝이 흑화다.)"

- id: t_after
  title: 무투대회 뒤풀이
  on: auto
  at: "1.7.4.방과후"
  priority: 10
  when: "tourney.entered"
  branch:
    - when: "tourney.result == 'win'"
      lines:
        - "우승 메달이 생각보다 무겁다. 축하하러 온 사람들 사이로, 낯선 로브 차림의 사내가 나를 오래 바라보다 사라졌다."
        - 시스템: "⚠ 원작 이탈 — 1학년 무투대회 우승자가 바뀌었다. 누군가 나를 주시하기 시작했다."
      effects: ["reputation += 20", "sp += 3", "cult.watch = 1"]
    - when: "tourney.result == 'final'"
      lines:
        - "준우승. 아렌이 먼저 다가와 손을 내밀었다."
        - 아렌: "너 아니었으면 결승까지 못 왔을 거야."
      effects: ["reputation += 12", "sp += 2", "affinity.aren += 5"]
    - when: "tourney.result == 'semi'"
      lines: ["4강. D반 역사상 최고 성적이라고 담임이 말했다."]
      effects: ["reputation += 8", "sp += 1"]
    - lines: ["일찍 떨어졌다. 그래도 몸이 기억하는 게 있다. 다음엔 다를 것이다."]
      effects: ["stat.의지 += 2"]

# ---------------------------------------------------------------- 종업식
- id: y1_closing
  title: 1학기 종업식
  on: auto
  at: "1.7.4.주말"
  priority: 10
  announce: 1학기 종업식
  lines:
    - "1학기 종업식. 강당 창문으로 여름 햇살이 쏟아진다."
    - when: "fate.sera == 'saved' or fate.sera == 'saved_quiet'"
      나레이션: "신학과 줄에 은발의 세라가 서 있다. 원작이라면 여기 없었을 아이."
    - when: "fate.sera == 'dropped'"
      나레이션: "신학과 줄에 빈자리가 하나 있다."
    - when: "origin != '악역도련님' and fate.edric and fate.edric != 'dead'"
      나레이션: "에드릭이 투덜거리며 줄에 서 있다. 원작이라면 여기 없었을 녀석."
    - when: "origin == '악역도련님'"
      나레이션: "살아서 종업식을 맞았다. 원작의 에드릭은 오늘 여기 없었다."
    - when: "tourney.winner == 'me'"
      나레이션: "단상 위에서 무투대회 우승 메달을 받았다. 카이든과 아렌이 같은 표정으로 나를 본다."
    - when: "tourney.winner == 'aren'"
      나레이션: "단상 위의 아렌. 원작에서는 이 자리에 카이든이 섰다."
    - when: "affinity.liana >= 30"
      리아나: "방학 때 우리 마을에 놀러 올래? 보름달 뜨는 숲, 보여주고 싶어."
    - when: "finn.mentor == 'garen'"
      나레이션: "강당 뒤편, 청소부 옷을 입은 핀이 가렌 교관 옆에 서 있다."
    - 속마음: "(멸망까지 9년 7개월. 바꾼 것도, 놓친 것도 있다.)"
    - 시스템: "1학년 1학기 종료 — 여름방학 (다음 업데이트에서 이어집니다)"
