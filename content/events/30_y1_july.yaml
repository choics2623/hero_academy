        - when: "affinity.garen >= 20"
          가렌@진지: "발이 늦었다. 반 박자. …내일 다섯 시."
        - 속마음: "(원작의 엑스트라는 대회에서 떨어지면 그걸로 끝이었다. 다음 컷엔 나오지도 않았다.)"
        - 속마음: "(나는 다음 컷에도 나온다. 그러려고 여기 있다.)"
        - "다음엔 다를 것이다."
