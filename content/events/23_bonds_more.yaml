# 인연 이야기 (2): 브루노, 핀, 세라, 에드릭, 가렌, 엘베라, 노엘, 도로시

# ================================================================ 브루노
- id: bond_bruno_1
  title: 브루노 — 공방의 불
  on: [식당, 훈련장, 아르바이트]
  priority: 2
  when: "time.year == 1 and affinity.bruno >= 15"
  lines:
    - "밤늦게 연금과 공방에서 불빛이 샌다. 브루노가 몰래 화로를 지피고 있다."
    - 브루노@당황: "쉿! 연금과 애들한테 빌린 거야. 아니, 허락은… 내일 받을 거야."
    - 브루노: "마침 잘 왔다. 집게 좀 잡아줘. 이거 혼자 하면 손 다 데어."
  choices:
    - text: 집게를 잡는다 (근력)
      check: { label: 집게 잡기, value: "stat.근력 + stat.체질 / 2 + luck", dc: 24 }
      success:
        lines:
          - "망치 소리가 공방을 울렸다. 불꽃이 튈 때마다 브루노가 신나게 웃는다."
          - 브루노@웃음: "다 됐다! 참나무 심에 쇠 테를 두른 연습용 목검이야. 네 손에 맞춰서 깎았어."
          - 시스템: "아이템 획득 — 브루노의 목검 (전투: 공격력 +2)"
        effects: ["item.브루노목검 = 1", "affinity.bruno += 8", "trust.bruno += 6"]
      fail:
        lines:
          - "집게가 미끄러져 쇳물이 튀었다. 둘 다 펄쩍 뛰었다."
          - 브루노@웃음: "하하하! 괜찮아, 괜찮아. 다음에 다시 하자. 이번엔 내가 혼자 잡을게."
        effects: ["affinity.bruno += 5"]
    - text: 옆에서 구경한다
      effects: ["affinity.bruno += 4"]
      lines: ["브루노의 망치질은 대장간 그 자체였다. 쇠가 브루노 말을 듣는 것 같다."]

- id: bond_bruno_2
  title: 브루노 — 망치는 허리로
  on: [식당, 훈련장, 아르바이트]
  priority: 2
  when: "time.year == 1 and affinity.bruno >= 25 and fired.bond_bruno_1"
  lines:
    - 브루노: "너 강타 칠 때 팔로만 치더라. 그러면 막히면 끝이야."
    - 브루노: "망치질은 팔이 아니라 허리야. 내려칠 땐 상대 방패째로 박살 낸다는 생각으로."
    - "브루노가 빗자루를 망치처럼 쥐고 바닥을 내리쳤다. 마룻바닥에 금이 갔다."
    - 브루노@당황: "…이건 사감 선생님한테 비밀이다."
    - 시스템: "기술 습득 — 대장장이의 일격 (전투: 방어째로 부수는 강타)"
  effects: ["skill.대장장이 = 1", "affinity.bruno += 5"]

- id: bond_bruno_3
  title: 브루노 — 졸업하면
  on: [식당, 훈련장, 아르바이트]
  priority: 2
  when: "time.year == 1 and affinity.bruno >= 35 and fired.bond_bruno_2"
  lines:
    - 브루노@웃음: "졸업하면 수도로 갈 거야. 대장간 거리에 삼촌 가게가 있거든. 거기서 제국 최고의 대장장이가 될 거다!"
    - 브루노: "너도 와. 검 하나는 평생 공짜로 갈아줄게."
    - when: "note.note_tourney.known or perk.고인물의기억"
      속마음: "(6년 뒤, 수도 습격. 원작의 브루노는 바로 그 대장간 거리에서 죽는다.)"
  choices:
    - text: "\"수도 말고 고향에서 하는 건 어때?\""
      effects: ["bruno.home = 1", "trust.bruno += 6", "affinity.bruno += 4"]
      lines:
        - 브루노: "고향? 시골 대장간은 말편자밖에 안 쳐."
        - 브루노: "…근데 네가 그렇게 말하니까 이상하게 신경 쓰이네. 생각해 볼게."
    - text: "\"수도는 언젠가 위험해질 거야. 기억해 둬\""
      effects: ["bruno.warned = 1", "trust.bruno += 8"]
      lines:
        - 브루노@웃음: "점쟁이냐? 하하."
        - "웃던 브루노가 내 얼굴을 보고 웃음을 거뒀다."
        - 브루노@진지: "…알았어. 기억할게. 네 말이니까."
    - text: "\"꼭 놀러 갈게\""
      effects: ["affinity.bruno += 8"]
      lines: [브루노: "약속이다! 그때 내 첫 작품 보여줄게!"]

# ================================================================ 핀
- id: bond_finn_1
  title: 핀 — 빗자루
  on: 밤의연무장
  priority: 2
  when: "time.year == 1 and affinity.finn >= 15"
  lines:
    - "연습이 끝나고, 핀이 빗자루에 턱을 괴고 앉았다."
    - 핀: "고아원 나와서 여기서 청소해요. 밥이랑 잠자리 주니까요."
    - 핀: "검이요? 그냥… 빗자루 휘두르다 보니까. 학생들 연습하는 거 맨날 보잖아요."
    - 핀@슬픔: "근데 저 같은 게 검 들면 웃기잖아요."
  choices:
    - text: "\"하나도 안 웃겨. 넌 재능이 있어\""
      effects: ["affinity.finn += 6", "trust.finn += 4"]
      lines: [핀@당황: "재능 같은 거 몰라요. …근데 그 말, 기분은 좋네요."]
    - text: "\"제대로 가르쳐 줄 사람을 찾아줄게\""
      effects: ["finn.promise = 1", "trust.finn += 8", "affinity.finn += 4"]
      lines: [핀@놀람: "…정말요? 그런 사람이 저 같은 걸 봐줄까요."]
    - text: "\"넌 언젠가 검성이 될 거야\" (원작 데이터 그대로)"
      effects: ["trust.finn -= 3", "affinity.finn += 2"]
      lines:
        - 핀@화남: "…놀리지 마요."
        - 속마음: "(너무 앞서 나갔다. 데이터에 적힌 숫자는 이 아이한테 아직 아무 의미도 없다.)"

- id: bond_finn_2
  title: 핀 — 보법
  on: 밤의연무장
  priority: 2
  when: "time.year == 1 and affinity.finn >= 25 and fired.bond_finn_1"
  lines:
    - 핀: "저번에 보니까 피할 때 뒤로만 빠지더라고요. 그러면 계속 쫓겨요."
    - 핀: "빗자루질할 때처럼요. 앞으로 쓸면서 옆으로 빠지는 거예요. 이렇게."
    - "핀의 발이 바닥을 쓸 듯 미끄러지더니, 어느새 내 등 뒤에 서 있었다."
    - 핀@당황: "…아, 죄송해요. 버릇이라."
    - 시스템: "기술 습득 — 빗자루 보법 (전투: 회피 +15, 성공 시 반격 2배)"
  effects: ["skill.빗자루보법 = 1", "affinity.finn += 5"]

- id: bond_finn_3
  title: 핀 — 피
  on: 밤의연무장
  priority: 2
  when: "time.year == 1 and affinity.finn >= 35 and fired.bond_finn_2"
  lines:
    - "핀이 오늘은 목검을 들지 않았다. 연무장 구석에 앉아 한참 손을 내려다본다."
    - 핀: "여섯 살 때요. 마을에 마물이 들어왔어요. 전 헛간에 숨어 있었고요."
    - 핀@슬픔: "문틈으로 다 봤어요. 그래서 피를 보면… 몸이 굳어요. 머리는 움직이라는데 손이 안 움직여요."
    - 핀@슬픔: "이런 놈이 무슨 검을 해요."
  choices:
    - text: "\"천천히 해도 돼. 기다릴게\""
      effects: ["finn.trauma_talk = 1", "trust.finn += 12", "affinity.finn += 6"]
      lines:
        - 핀@놀람: "…기다려 준다고요? 저를요?"
        - "핀이 고개를 숙였다. 어깨가 조금 떨렸다."
    - text: "\"검을 잡으려면 언젠가 이겨내야 해\""
      effects: ["finn.trauma_talk = 1", "finn.pushed = 1", "trust.finn += 3", "affinity.finn += 4"]
      lines:
        - 핀@슬픔: "…알아요. 아는데요."
        - 속마음: "(맞는 말이 언제나 좋은 말은 아니다.)"
    - text: 아무 말 없이 등을 두드려 준다
      effects: ["affinity.finn += 8", "trust.finn += 8"]
      lines: ["핀이 처음으로 소리 내어 울었다. 연무장은 조용했다."]

# ================================================================ 세라 (시험에서 구한 경우)
- id: bond_sera_1
  title: 세라 — 엄마의 기도
  on: 성당
  priority: 2
  when: "time.year == 1 and affinity.sera >= 22 and (fate.sera == 'saved' or fate.sera == 'saved_quiet')"
  lines:
    - 나레이션:
        - "세라가 내 손등의 상처를 보더니 조용히 손을 겹쳤다."
        - { when: "fate.sera == 'saved_quiet'", text: "세라가 쭈뼛거리며 다가왔다. \"재시험 기회… 감독관님이 네가 말해줬다고 하셨어.\" 그리고 내 손등의 상처를 보더니 조용히 손을 겹쳤다." }
    - 세라: "다친 데 있으면 말해. 엄마가 가르쳐준 기도가 있어. 효과가 있을지는 모르지만."
    - "세라의 입술이 움직이자 손등이 따뜻해진다. 상처가 천천히 아물었다."
    - 세라@웃음: "…됐다. 나 이거 남한테 해준 거 처음이야."
    - 시스템: "기술 습득 — 치유의 기도 (전투: 체력 35% 회복)"
  effects: ["skill.치유기도 = 1", "affinity.sera += 6", "trust.sera += 6"]

- id: bond_sera_2
  title: 세라 — 교회의 편지
  on: 성당
  priority: 2
  when: "time.year == 1 and affinity.sera >= 32 and fired.bond_sera_1"
  lines:
    - 세라: "추기경님이 보낸 사람이 찾아왔어. 성녀 후보 시험을 보래."
    - 세라@슬픔: "다들 영광이라고 하는데… 이상하게 무서워. 그 사람 눈이 나를 안 보고 내 손등만 봤어."
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(추기경 그레고르. 원작에서 성녀를 '관리'하다 망가뜨린 사람이다.)"
  choices:
    - text: "\"교회를 너무 믿지 마. 특히 추기경 쪽은\""
      effects: ["sera.warned = 1", "trust.sera += 10", "affinity.sera += 4"]
      lines:
        - 세라@웃음: "…너도 그렇게 생각해? 나만 이상한 게 아니었구나."
        - 세라: "시험은 미룰게. 시스터 루나께 먼저 여쭤볼래."
    - text: "\"기회잖아. 해봐\""
      effects: ["sera.church = 1", "affinity.sera += 4"]
      lines: [세라: "그렇지? …응. 해볼게."]
    - text: "\"네가 원하는 대로 해. 난 네 편이야\""
      effects: ["affinity.sera += 8", "trust.sera += 6"]
      lines: [세라@웃음: "내 편… 그 말, 오래 기억할게."]

# ================================================================ 에드릭 (미궁에서 살아남은 경우)
- id: bond_edric_1
  title: 에드릭 — 엄마의 목소리
  on: [식당, 훈련장]
  priority: 2
  when: "time.year == 1 and origin != '악역도련님' and affinity.edric >= 25 and (fate.edric == 'saved' or fate.edric == 'saved_by_teacher')"
  lines:
    - 에드릭: "…그날 왜 혼자 3층 안쪽에 갔는지 물어봤지. 안 말해주려고 했는데."
    - 에드릭: "누가 불렀어. 내 이름을. 엄마 목소리로."
    - 에드릭@슬픔: "엄마는 5년 전에 죽었는데."
    - "에드릭이 컵을 쥔 손에 힘을 줬다. 컵에 금이 갔다."
  plants:
    - { id: F22, notice: { value: "stat.지성 + 10 * know.sacrifice", dc: 20 } }
  choices:
    - text: "\"또 그 목소리가 들리면 나한테 바로 말해\""
      effects: ["trust.edric += 10", "affinity.edric += 5", "edric.voice = 1"]
      lines: [에드릭@당황: "…너한테? 웃기네. …알았어."]
    - text: "\"교관한테 말해야 해\""
      effects: ["edric.report = 1", "trust.edric += 4", "affinity.edric -= 2"]
      lines: [에드릭@화남: "벨모어가 도련님이 유령 목소리 듣는다고? 다음 날 소문 다 나. …생각은 해볼게."]

- id: bond_edric_2
  title: 에드릭 — 살아남는 법
  on: [식당, 훈련장]
  priority: 2
  when: "time.year == 1 and origin != '악역도련님' and affinity.edric >= 32 and fired.bond_edric_1"
  lines:
    - 에드릭: "너 대련할 때 너무 정직하게 싸워. 귀족 검술 같은 거 따라 하지 마."
    - 에드릭: "살아남는 게 먼저야. 흙이든 모래든 눈에 뿌리고 보는 거지."
    - "에드릭이 주머니에서 모래를 한 줌 꺼내 보였다. 항상 들고 다니는 모양이다."
    - 에드릭@당황: "…이건 우리 둘만 아는 거다."
    - 시스템: "기술 습득 — 모래 뿌리기 (전투: 3턴 동안 적의 공격 반감)"
  effects: ["skill.모래뿌리기 = 1", "affinity.edric += 5"]

# ================================================================ 가렌
- id: bond_garen_1
  title: 가렌 — 새벽 수련
  on: 훈련장
  priority: 2
  when: "time.year == 1 and affinity.garen >= 20"
  lines:
    - "새벽 다섯 시. 가렌 교관이 혼자 연무장에 서 있다. 정말로 기다리고 있었다."
    - 가렌: "너는 힘으로만 버틴다. 그러다 부러진다."
    - 가렌: "버티는 법을 배워라. 맞는 법, 넘어지는 법, 다시 일어나는 법."
    - "해가 뜰 때까지 넘어지고 일어났다. 온몸이 멍투성이다. 이상하게 개운하다."
  effects: ["stat.체질 += 3", "stat.의지 += 2", "affinity.garen += 6", "fatigue += 20"]

- id: bond_garen_2
  title: 가렌 — 20년 전
  on: 훈련장
  priority: 2
  when: "time.year == 1 and affinity.garen >= 32 and fired.bond_garen_1"
  lines:
    - "수련이 끝나고, 가렌이 드물게 먼저 입을 열었다."
    - 가렌: "20년 전에도 성검이 반응한 아이가 있었다. 내 일은 그 아이를 지키는 거였지."
    - 가렌@슬픔: "지키지 못했다."
    - 가렌@진지: "…그래서 너희를 이렇게 굴린다. 이번엔 아무도 잃지 않으려고."
  plants:
    - { id: F23, notice: { value: "stat.지성 + stat.의지 / 2", dc: 20 } }
  choices:
    - text: "\"이번엔 지킬 수 있어요. 저도 도울게요\""
      effects: ["trust.garen += 10", "affinity.garen += 5"]
      lines: [가렌@웃음: "…건방진 소리. 내일 다섯 시."]
    - text: 아무것도 묻지 않는다
      effects: ["affinity.garen += 8"]
      lines: ["가렌은 한참 해를 보다가 말없이 목검을 정리했다."]

# ================================================================ 엘베라
- id: bond_elvera_1
  title: 엘베라 — 막는 법부터
  on: 마법실습
  priority: 2
  when: "time.year == 1 and affinity.elvera >= 20"
  lines:
    - 엘베라: "학생은 공격 마법만 연습하네요. 마법은 막는 것부터 배워야 해요."
    - 엘베라@슬픔: "제 스승은… 아니, 오래전 어떤 분은 그렇게 가르쳤어요. 막을 줄 알아야 지킬 수 있다고."
    - "엘베라가 손을 펼치자 공기가 유리처럼 굳었다. 그 안에서는 촛불조차 흔들리지 않는다."
    - 시스템: "기술 습득 — 엘베라의 방벽 (전투: 마법까지 거의 막는 방어)"
  effects: ["skill.방벽 = 1", "affinity.elvera += 5"]

- id: bond_elvera_2
  title: 엘베라 — 오래된 이름
  on: 마법실습
  priority: 2
  when: "time.year == 1 and affinity.elvera >= 30 and fired.bond_elvera_1"
  lines:
    - 엘베라: "학생, 이상한 질문 하나 해도 될까요."
    - 엘베라@진지: "'이그니스'라는 이름을 들으면 뭐가 떠올라요?"
  choices:
    - text: "\"마왕이요\""
      effects: ["affinity.elvera += 3"]
      lines: [엘베라@슬픔: "…그렇죠. 다들 그렇게 대답해요."]
    - text: "\"누군가의 오랜 친구\""
      when: "fs.F11.noticed"
      effects: ["elvera.shaken = 1", "trust.elvera += 10", "affinity.elvera += 6"]
      lines:
        - "엘베라의 손에서 분필이 떨어졌다."
        - 엘베라@놀람: "…재밌는 대답이네요. 정말로, 재밌는."
        - 엘베라@진지: "그 대답, 다른 사람 앞에서는 하지 마세요. 학생을 위해서요."
    - text: "\"잘 모르겠어요\""
      effects: ["affinity.elvera += 2"]
      lines: [엘베라: "그게 가장 정직한 대답일지도 모르겠네요."]

# ================================================================ 노엘
- id: bond_noel_1
  title: 노엘 — 모래 위의 룬
  on: [산책, 도시외출]
  priority: 2
  when: "time.year == 1 and affinity.noel >= 18"
  lines:
    - "노엘이 술병을 내려놓고 나뭇가지로 모래 위에 낯선 글자를 그린다. 획마다 희미한 빛이 남는다."
    - 노엘@진지: "고대 룬이야. 학교에선 안 가르치지. 가르칠 줄 아는 놈이 없거든."
    - 노엘@웃음: "외상 갚아준 값이다. 부적 두 장. 다치면 찢어."
    - 속마음: "(망국의 룬 마스터. 원작에선 1학년 말에 사라지고 다시는 안 나온다.)"
    - 시스템: "아이템 획득 — 노엘의 룬 부적 ×2 (전투: 체력 25% 회복)"
  effects: ["item.룬부적 += 2", "affinity.noel += 6", "trust.noel += 5"]

# ================================================================ 도로시
- id: bond_dorothy_1
  title: 도로시 — 시제품
  on: [식당, 아르바이트]
  priority: 2
  when: "time.year == 1 and affinity.dorothy >= 15 and found.dorothy"
  lines:
    - 도로시@웃음: "짠! 제 강장제 시제품이에요. 엄마 레시피에 제 비법을 섞었어요."
    - 도로시@당황: "효과는… 시든 화분이 벌떡 일어났으니까 사람도 일어나겠죠? 아마?"
    - "보라색 액체가 병 안에서 보글거린다. 냄새는 의외로 박하향이다."
    - 시스템: "아이템 획득 — 강장제 ×2 (전투: 체력 40% 회복)"
  effects: ["item.강장제 += 2", "affinity.dorothy += 6"]
