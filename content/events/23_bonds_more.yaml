# 인연 이야기 (2): 브루노, 핀, 세라, 에드릭, 가렌, 엘베라, 노엘, 도로시

# ================================================================ 브루노
- id: bond_bruno_1
  title: 브루노 — 공방의 불
  art: forge
  on: [식당, 훈련장, 아르바이트]
  priority: 2
  when: "time.year == 1 and affinity.bruno >= 15"
  lines:
    - "밤늦게 기숙사로 돌아가는 길. 연금과 공방 창문에서 주황색 불빛이 새어 나온다."
    - "이 시간에 불이 켜져 있을 리가 없다. 수업은 끝난 지 오래다."
    - "쇠 달구는 냄새. 그리고 풀무 소리. 푸욱, 푸욱."
    - "문틈으로 들여다보자 커다란 등이 보였다. 화로 앞에 쪼그려 앉은, 산만 한 등."
    - "브루노가 몰래 화로를 지피고 있다. 소매를 어깨까지 걷어붙이고, 이마엔 검댕을 묻힌 채."
    - "문이 삐걱 열리는 소리에 브루노가 펄쩍 뛰었다. 선반에 머리를 찧었다."
    - 브루노@당황: "아얏! 쉿! 쉿쉿!"
    - 브루노@당황: "연금과 애들한테 빌린 거야. 아니, 허락은… 내일 받을 거야. 아마."
    - 나: "그거 빌린 게 아니라 훔친 거 아냐?"
    - 브루노: "훔친 거 아니야! 불을 빌린 거지. 내일 아침까지 돌려놓으면 빌린 거야."
    - "브루노가 진지한 얼굴로 손가락을 꼽았다. 논리는 하나도 안 맞는데, 이상하게 납득이 간다."
    - "화로 안에서 쇠막대 하나가 벌겋게 익어 가고 있다. 모루 옆엔 깎다 만 참나무 막대."
    - 브루노: "학교 대장간은 학생 출입 금지래. 망치 들고 싶어서 손이 근질근질해서, 미치는 줄 알았어."
    - 브루노@웃음: "고향에선 매일 쳤거든. 아침에 한 번, 밥 먹고 한 번, 자기 전에 한 번. 할아버지가 그래야 손이 안 잊는대."
    - "브루노가 화로를 들여다봤다. 불빛이 넓적한 얼굴을 주황색으로 물들였다."
    - "기숙사에선 본 적 없는 얼굴이다. 집에 돌아온 사람의 얼굴."
    - 속마음: "(원작 브루노의 대사는 대부분 '하하!'와 '먹자!'였다. 대장장이 설정은 프로필 한 줄.)"
    - 속마음: "(그 한 줄이, 지금 망치를 쥐고 행복해하고 있다.)"
    - 브루노: "아, 마침 잘 왔다!"
    - 브루노: "집게 좀 잡아 줘. 이거 혼자 하면 손 다 데어. 아까 벌써 한 번 데었어. 봐, 여기."
    - "브루노가 내민 손바닥에 물집이 하나 동그랗게 부풀어 있다. 본인은 별일 아니라는 듯 웃는다."
    - 브루노: "쇠가 식기 전에 해야 돼. 빨리, 빨리."
    - "화로 속 쇠막대가 벌건 빛에서 주황빛으로 넘어가고 있다. 브루노가 망치를 들어 올렸다."
    - 속마음: "(무거워 보인다. 집게도, 저 쇠도, 실수하면 쏟아질 불티도.)"
  choices:
    - text: 집게를 잡는다 (근력)
      lines:
        - "집게를 받아 쥐었다. 손잡이가 생각보다 무겁고, 생각보다 뜨겁다."
      check: { label: 집게 잡기, value: "stat.근력 + stat.체질 / 2 + luck", dc: 24 }
      success:
        art: cg_bruno_forge
        lines:
          - "벌겋게 단 쇠막대를 집게로 물었다. 손잡이까지 열기가 올라온다. 팔뚝이 비명을 질렀다."
          - 브루노: "그대로! 그대로 버텨! 움직이지 마!"
          - "땅! 첫 번째 망치가 떨어졌다. 불티가 별처럼 튀었다."
          - "땅! 땅! 망치 소리가 공방 벽을 울렸다. 소리가 울릴 때마다 손목까지 진동이 타고 올라온다."
          - "브루노는 웃고 있었다. 불꽃이 튈 때마다 더 크게. 망치를 내리칠 때마다 노래하듯 숨을 내뱉었다."
          - 브루노@웃음: "좋아, 좋아! 너 손 안 떤다! 대장간 체질이네!"
          - "쇠막대가 길고 얇은 띠가 되었다. 브루노가 그걸 참나무 막대에 감고, 다시 두드리고, 물통에 담갔다."
          - "치이익. 하얀 김이 천장까지 솟았다."
          - "김이 걷히자 브루노가 그걸 두 손으로 내 앞에 내밀었다. 목검이다. 손잡이 부분에 쇠 테가 감겨 있다."
          - 브루노@웃음: "다 됐다! 참나무 심에 쇠 테를 두른 연습용 목검이야."
          - 브루노: "네 손에 맞춰서 깎았어. 너 검 쥐는 거 맨날 봤거든. 손잡이가 한 마디 짧아야 너한텐 딱이야."
          - "쥐어 봤다. 손에 착 감긴다. 처음 쥐는데, 오래 쓴 것 같다."
          - 브루노: "학교 와서 처음 친 거다. 잘 써. 부러지면 또 쳐 줄게."
          - 시스템: "아이템 획득 — 브루노의 목검 (전투: 공격력 +2)"
          - 속마음: "(원작에 '브루노의 목검' 같은 아이템은 없었다. 이 세계에서만 얻을 수 있는 첫 번째 장비다.)"
        effects: ["item.브루노목검 = 1", "affinity.bruno += 8", "trust.bruno += 6"]
      fail:
        lines:
          - "집게로 쇠막대를 물었다. 열기가 손잡이를 타고 올라온다. 팔이 떨렸다."
          - 브루노: "버텨! 조금만—"
          - "첫 망치가 떨어지는 순간, 집게가 미끄러졌다."
          - "쇠막대가 튕겨 나가 물통에 빠졌다. 치익! 뜨거운 물방울이 사방으로 튀었다."
          - "둘 다 펄쩍 뛰었다. 브루노는 선반에 머리를 또 찧었다."
          - 브루노@놀람: "앗뜨! 앗뜨뜨!"
          - "잠깐의 정적. 물통에서 김만 피어올랐다."
          - 브루노@웃음: "…하하하! 하하하하!"
          - "브루노가 배를 잡고 웃었다. 공방이 울렸다. 누가 들으면 어쩌려고."
          - 브루노: "괜찮아, 괜찮아. 우리 할아버지도 처음 집게 잡았을 때 쇳물을 신발에 쏟았대."
          - 브루노@웃음: "그 신발 아직 집에 있어. 구멍 난 채로."
          - 브루노@웃음: "다음에 다시 하자. 이번엔 내가 혼자 잡을게. 너는 망치나 구경해."
          - "다음이 있다는 말을, 브루노는 아무렇지 않게 했다."
        effects: ["affinity.bruno += 5"]
    - text: 옆에서 구경한다
      effects: ["affinity.bruno += 4"]
      lines:
        - 나: "…난 구경할게. 손 데기 싫어."
        - 브루노@웃음: "겁쟁이! 그래, 그럼 거기 서서 잘 봐."
        - "브루노는 집게를 왼손에, 망치를 오른손에 쥐었다. 혼자서 둘 다."
        - "땅. 땅. 망치가 떨어질 때마다 쇠가 조금씩 모양을 바꿨다. 밀가루 반죽처럼."
        - "브루노의 망치질은 대장간 그 자체였다. 쇠가 브루노 말을 듣는 것 같다."
        - "박자가 있었다. 세게, 약하게, 세게, 쉬고. 노래 같았다."
        - 브루노: "들려? 쇠가 대답하는 소리. 맑게 울리면 잘되고 있는 거고, 탁하면 화난 거야."
        - "귀를 기울였다. 맑았다. 쇠가 웃는 소리라는 게 있다면, 아마 이런 소리일 것이다."
        - when: "fs.F18.noticed"
          속마음: "(성검을 고친 적 있다는 할아버지의 망치. 허풍이 아니라면, 저 박자는 거기서 왔을 것이다.)"
        - "불티 하나가 브루노 팔뚝에 떨어졌다. 브루노는 털지도 않았다. 손이 망치에서 떨어지지 않았다."
        - 브루노@웃음: "다음엔 너도 잡아. 구경만 하면 손이 심심해서 못 참을걸."
        - "공방을 나설 때까지 망치 소리가 등 뒤에서 따라왔다. 그날 밤, 꿈에서도 그 박자가 들렸다."

- id: bond_bruno_2
  title: 브루노 — 망치는 허리로
  art: dorm_hall
  on: [식당, 훈련장, 아르바이트]
  priority: 2
  when: "time.year == 1 and affinity.bruno >= 25 and fired.bond_bruno_1"
  lines:
    - "저녁 먹고 돌아온 기숙사 복도. 벽등 몇 개가 깜빡거린다. 끝 창문으로 밤바람이 들어온다."
    - "복도 한가운데서 브루노가 빗자루를 들고 서 있었다. 청소 당번인 모양이다."
    - "그런데 쓸지는 않고, 빗자루를 망치처럼 쥐고 허공에 휘두르고 있다. 혼잣말을 하면서."
    - 브루노: "아니지, 아니지… 팔로 치니까 그렇지…"
    - "날 보자 브루노가 빗자루를 든 채 손을 흔들었다. 먼지가 확 일었다."
    - 브루노@웃음: "어, 마침 잘 왔다! 너 오늘 허수아비 칠 때 말이야."
    - 브루노: "너 강타 칠 때 팔로만 치더라."
    - 나: "…그럼 뭘로 쳐."
    - 브루노: "그러면 막히면 끝이야. 상대가 방패 들면 네 팔만 저려. 저번에 손목 털던 거 다 봤어."
    - "들켰다. 허수아비 방패를 치다가 손목이 시큰거렸던 걸."
    - 브루노: "대장간에서 제일 먼저 배우는 게 뭔지 알아? 망치 드는 법 아니야. 서는 법이야."
    - "브루노가 빗자루를 내려놓고 다리를 어깨너비로 벌렸다. 무릎을 살짝 굽힌다."
    - 브루노@진지: "망치질은 팔이 아니라 허리야."
    - 브루노: "발바닥에서 올라온 힘이 허리를 돌아서, 어깨를 지나서, 그다음에야 팔로 가."
    - 브루노: "팔은 마지막에 길만 알려 주는 거야. 힘은 땅에서 빌려 오는 거고."
    - "브루노가 커다란 손으로 내 허리를 붙잡아 비틀었다. 뼈가 우드득 소리를 냈다."
    - 나@당황: "아, 아파!"
    - 브루노@웃음: "참아! 할아버지는 나 이렇게 백 번 비틀었어. 일곱 살 때부터."
    - 브루노: "자, 쳐 봐. 저기 벽 말고. 허공에."
    - "허공에 주먹을 내질렀다. 발바닥, 허리, 어깨, 팔. 순서대로."
    - "…뭔가 달랐다. 힘이 팔에서 나오는 게 아니라, 몸 전체가 한 번에 앞으로 쏟아지는 느낌."
    - 브루노: "그거야! 그리고 마지막이 제일 중요해."
    - 브루노@진지: "내려칠 땐 상대 방패를 막는다고 생각하지 마. 방패째로 박살 낸다는 생각으로."
    - 브루노: "쇠도 그래. 망설이면서 치면 쇠가 알아. 그럼 휘어. 한 번에, 끝까지 쳐야 펴져."
    - "말하면서 신이 났는지, 브루노가 빗자루를 다시 망치처럼 쥐었다."
    - 브루노: "이렇게! 발바닥부터—"
    - "쿵."
    - "브루노가 빗자루로 바닥을 내리쳤다. 복도 전체가 울렸다. 벽등이 흔들렸다."
    - "그리고, 빠직."
    - "마룻바닥에 금이 갔다. 빗자루 끝에서부터 손가락 길이만큼."
    - "둘이서 그 금을 내려다봤다. 아무 말도 없이."
    - "복도 끝 방문이 하나 열렸다가, 무서운 걸 봤다는 듯 도로 닫혔다."
    - 브루노@당황: "…이건 사감 선생님한테 비밀이다."
    - 브루노: "내일 아침에 내가 고칠게. 망치만 있으면 금방… 아, 망치가 없구나."
    - 속마음: "(원작 브루노는 '괴력' 태그가 붙은 탱커 동료였다. 공격 기술은 몸통 박치기 하나.)"
    - 속마음: "(그 박치기 뒤에, 할아버지한테 백 번 허리를 비틀린 일곱 살짜리가 있었다.)"
    - 시스템: "기술 습득 — 대장장이의 일격 (전투: 방어째로 부수는 강타)"
    - "다음 날 아침, 복도 마룻바닥의 금 위에 깔개 하나가 덮여 있었다. 어제까지 브루노 방 앞에 있던 깔개였다."
  effects: ["skill.대장장이 = 1", "affinity.bruno += 5"]

- id: bond_bruno_3
  title: 브루노 — 졸업하면
  on: [식당, 훈련장, 아르바이트]
  priority: 2
  when: "time.year == 1 and affinity.bruno >= 35 and fired.bond_bruno_2"
  lines:
    - 삽화: canteen
    - "해가 다 넘어간 뒤. 식당 뒷문 계단에 브루노와 나란히 앉았다."
    - "주방 아주머니가 남은 빵을 한 바구니 내줬다. 브루노는 벌써 세 개째다."
    - "계단 아래로 기숙사 불빛이 하나둘 켜진다. 어디선가 누가 류트를 서툴게 뜯고 있다."
    - 브루노: "있잖아. 졸업하면 말이야."
    - "브루노가 네 번째 빵을 반으로 갈라 하나를 내게 내밀었다."
    - 브루노: "원래는 고향 대장간 이어받으려고 했거든. 할아버지 망치도 물려받고."
    - 브루노: "근데 삼촌이 편지를 보냈어. 수도로 오래. 대장간 거리에 삼촌 가게가 있거든."
    - 브루노@웃음: "수도 대장간 거리 알아? 망치 소리가 골목마다 다르대. 기사단 검도 거기서 치고, 황궁 문고리도 거기서 친대!"
    - 브루노@웃음: "졸업하면 수도로 갈 거야. 거기서 제국 최고의 대장장이가 될 거다! 간판은 내가 직접 칠 거야."
    - "브루노의 눈이 반짝였다. 기숙사 불빛보다 밝게."
    - 브루노: "돈 벌면 쌍둥이 동생들 신발도 사 주고. 걔네 맨날 맨발이야. 할아버지 허리도 고쳐 드리고."
    - 브루노: "너도 와. 검 하나는 평생 공짜로 갈아 줄게. 평생! 내가 늙어서 망치 못 들 때까지."
    - "빵이 목에 걸렸다."
    - 속마음: "(수도. 대장간 거리. 그 지명에서 이상하게 탄내가 나는 것 같았다.)"
    - when: "note.note_tourney.known or perk.고인물의기억"
      속마음: "(6년 뒤, 수도 습격. 원작의 브루노는 바로 그 대장간 거리에서 죽는다.)"
    - when: "note.note_tourney.known or perk.고인물의기억"
      속마음: "(사망 묘사는 한 줄이었다. 대장간 거리가 불탔고, 브루노는 망치를 쥔 채 발견되었다.)"
    - when: "note.note_tourney.known or perk.고인물의기억"
      속마음: "(그 한 줄을 읽고 나는 다음 장으로 넘겼다. 로딩 화면이 길다고 투덜대면서.)"
    - "브루노는 내 얼굴을 보지 못했다. 하늘을 보며 간판에 넣을 그림을 고민하고 있었다."
    - 브루노: "간판에 망치를 그릴까, 모루를 그릴까. 둘 다 그리면 너무 많나?"
    - 브루노@웃음: "너 그림 잘 그려? 아니, 됐다. 네 손 보니까 나랑 비슷하네."
    - "웃음소리가 계단을 타고 굴러 내려갔다."
    - "말해야 할까. 수도에 가지 말라고."
    - "6년 뒤의 일을, 무슨 근거로. 대장장이 아들의 꿈을, 무슨 자격으로."
    - "류트 소리가 한 소절을 틀리고, 처음부터 다시 시작했다."
    - 브루노: "왜 그래? 빵 맛없어?"
    - 브루노@진지: "…너 가끔 그런 얼굴 해. 나 볼 때. 엄청 먼 데를 보는 얼굴."
    - 속마음: "(먼 데를 보고 있는 게 맞다. 6년 뒤를.)"
  choices:
    - text: "\"수도 말고 고향에서 하는 건 어때?\""
      effects: ["bruno.home = 1", "trust.bruno += 6", "affinity.bruno += 4"]
      lines:
        - 나: "수도 말고… 고향에서 하는 건 어때?"
        - 브루노@놀람: "고향?"
        - 브루노: "시골 대장간은 말편자밖에 안 쳐. 낫이랑 호미랑. 기사단 검은 구경도 못 해."
        - 나: "할아버지 망치는 고향에 있잖아. 그리고 동생들도."
        - "브루노가 빵을 든 채 멈췄다."
        - 브루노: "…그건 그렇지. 할아버지 망치는 대장간 밖으로 안 나가. 집안 규칙이래."
        - 브루노: "근데 네가 그렇게 말하니까 이상하게 신경 쓰이네."
        - "브루노가 뒷머리를 긁었다. 커다란 손이 짧은 머리카락을 헝클어뜨렸다."
        - 브루노: "생각해 볼게. 진짜로. 졸업까지 시간 많으니까."
        - 속마음: "(시간은 많지 않다. 그래도 씨앗은 심었다. 6년 뒤에 싹이 나기를.)"
    - text: "\"수도는 언젠가 위험해질 거야. 기억해 둬\""
      effects: ["bruno.warned = 1", "trust.bruno += 8"]
      lines:
        - 나: "수도는 언젠가 위험해질 거야."
        - 브루노@웃음: "점쟁이냐? 하하. 도시 점쟁이 할머니도 그런 말은 안 하던데."
        - 나: "기억해 둬. 진지하게."
        - "웃던 브루노가 내 얼굴을 보고 웃음을 거뒀다."
        - "한참 말이 없었다. 류트 소리도 어느새 그쳐 있었다."
        - 브루노@진지: "…알았어."
        - 브루노: "왜냐고는 안 물을게. 물어도 말 못 할 얼굴이니까."
        - 브루노@진지: "기억할게. 네 말이니까."
        - "브루노가 주먹으로 자기 가슴을 두 번 쳤다. 대장장이들이 약속할 때 하는 거라고 했다."
        - 속마음: "(이유도 묻지 않고 믿어 주는 사람. 원작은 이런 사람을 한 줄로 죽였다.)"
    - text: "\"꼭 놀러 갈게\""
      effects: ["affinity.bruno += 8"]
      lines:
        - 나: "꼭 놀러 갈게."
        - 브루노@웃음: "진짜지? 약속이다!"
        - "브루노가 커다란 손을 내밀었다. 악수라기보다 내 손을 통째로 집어삼키는 쪽에 가까웠다."
        - 브루노: "그때 내 첫 작품 보여 줄게! 수도에서 친 첫 번째 검. 너한테 제일 먼저."
        - 브루노: "아니다, 그 검을 너 줄게. 첫 작품은 원래 제일 고마운 사람한테 주는 거래."
        - "브루노가 웃었다. 손이 뜨거웠다. 화로 앞에서 평생 산 사람의 체온."
        - 속마음: "(놀러 가겠다고 했다. 6년 뒤, 그 거리에.)"
        - when: "note.note_tourney.known or perk.고인물의기억"
          속마음: "(그때 그 거리가 남아 있으려면, 그 전에 해야 할 일이 너무 많다.)"
        - "남은 빵을 마저 먹었다. 맛이 잘 느껴지지 않았다."

# ================================================================ 핀
- id: bond_finn_1
  title: 핀 — 빗자루
  on: 밤의연무장
  priority: 2
  when: "time.year == 1 and affinity.finn >= 15"
  lines:
    - "밤의 연무장. 횃불 두 개가 바람에 흔들린다. 흙바닥 위로 그림자가 늘어났다 줄었다 한다."
    - "오늘 대련도 졌다. 핀의 목검은 매번 내가 막으려는 곳의 반 뼘 옆으로 왔다."
    - "숨을 몰아쉬며 바닥에 주저앉았다. 핀은 땀 한 방울 안 흘린 얼굴로 목검을 제자리에 걸었다."
    - "그리고 연습이 끝나면 늘 그렇듯, 벽에 세워 둔 빗자루를 집어 들었다."
    - "연무장을 다 쓸고 나서야, 핀이 빗자루에 턱을 괴고 내 옆에 앉았다."
    - 핀: "…오늘은 좀 나았어요. 세 번째 합은 거의 막았어요."
    - 나: "거의."
    - 핀@웃음: "거의요."
    - "핀이 웃었다. 횃불 그림자 속에서 웃는 얼굴이 생각보다 어렸다."
    - "한동안 둘 다 말이 없었다. 멀리서 기숙사 소등 종이 울렸다."
    - 나: "넌 언제부터 여기서 일했어?"
    - 핀: "…작년 겨울부터요."
    - 핀: "고아원 나와서 여기서 청소해요. 고아원은 클 만큼 크면 나가야 하거든요."
    - 핀: "여기선 밥이랑 잠자리 주니까요. 계단 밑 창고요. 따뜻해요. 주방 굴뚝이 벽 뒤로 지나가서."
    - 나: "검은? 누구한테 배웠어?"
    - 핀@당황: "검이요? 배, 배운 거 아니에요. 그냥…"
    - 핀: "빗자루 휘두르다 보니까요. 학생들 연습하는 거 맨날 보잖아요. 청소하면서."
    - 핀: "선배들이 이렇게 하면 교관님이 '틀렸다' 하시고, 저렇게 하면 '됐다' 하시고. 그걸 보다 보면… 빗자루가 따라 해요."
    - "핀이 빗자루를 가볍게 들어 허공을 그었다. 아무 힘도 안 들인 것 같은 동작."
    - "그런데 횃불이 한 박자 늦게 흔들렸다."
    - when: "perk.데이터마이너"
      속마음: "(검술 스탯 S. 데이터 파일 속 숫자 한 줄. 그 숫자가 '보다 보면 따라 해요'로 만들어진 거였다.)"
    - when: "not perk.데이터마이너"
      속마음: "(보고 따라 했다고? 저게? 원작 A반 검술 수석도 저렇게는 못 했다.)"
    - 속마음: "(원작에서 이 아이는 이름조차 없었다. '청소부'라는 회색 글씨 하나.)"
    - 핀: "근데요."
    - "핀이 빗자루를 무릎 위에 눕혔다. 손가락으로 솔 끝을 하나하나 만졌다."
    - 핀@슬픔: "저 같은 게 검 들면 웃기잖아요."
    - 핀: "학생들이 가끔 봐요. 청소부가 목검 들고 있으면. 웃어요. 뭐라고는 안 하는데, 웃어요."
    - 핀: "그래서 밤에만 해요. 아무도 없을 때. …학생은 빼고요."
    - "핀이 나를 힐끔 봤다. 금방 다시 바닥을 봤다."
    - 속마음: "(웃기다고 말해 달라는 게 아니다. 아니라고 말해 줄 사람을 찾는 눈이다.)"
  choices:
    - text: "\"하나도 안 웃겨. 넌 재능이 있어\""
      effects: ["affinity.finn += 6", "trust.finn += 4"]
      lines:
        - 나: "하나도 안 웃겨."
        - 나: "넌 재능이 있어. 오늘 나 몇 번 이겼는지 알아?"
        - 핀@당황: "재, 재능 같은 거 몰라요."
        - 핀: "재능은 귀족 도련님들이 갖고 태어나는 거잖아요. 저는 빗자루 갖고 태어났어요."
        - "핀이 농담처럼 말했다. 웃지는 않았다."
        - 나: "그 빗자루한테 오늘만 열두 번 졌어. 도련님들한테는 그렇게까지 안 져."
        - "핀이 입을 다물었다. 빗자루 솔을 만지던 손가락이 멈췄다."
        - 핀@웃음: "…근데 그 말, 기분은 좋네요."
        - 핀: "한 번만 더 해 줘요. 아니, 안 해도 돼요. 기억했어요."
        - "핀은 빗자루를 들고 일어나 연무장을 한 번 더 쓸었다. 이미 깨끗한 바닥을."
    - text: "\"제대로 가르쳐 줄 사람을 찾아줄게\""
      effects: ["finn.promise = 1", "trust.finn += 8", "affinity.finn += 4"]
      lines:
        - 나: "제대로 가르쳐 줄 사람을 찾아 줄게."
        - 핀@놀람: "…네?"
        - 나: "보고 따라 하는 것만으로 이 정도면, 제대로 배우면 어떻게 될지 궁금하잖아."
        - 핀: "그, 그런 사람이 어디 있어요. 교관님들은 학생만 가르치잖아요."
        - 핀: "저는 학생도 아니고, 돈도 없고, 글자도…"
        - "핀이 말끝을 흐렸다."
        - 핀@놀람: "…정말요? 그런 사람이 저 같은 걸 봐 줄까요."
        - 나: "봐 줄 거야. 한 번만 보면."
        - "핀은 대답하지 않았다. 대신 빗자루를 꼭 쥐었다. 손가락 마디가 하얘지도록."
        - 속마음: "(가렌 교관. 원작에 없던 사제 관계. 이어 줄 수만 있다면.)"
    - text: "\"넌 언젠가 검성이 될 거야\" (원작 데이터 그대로)"
      effects: ["trust.finn -= 3", "affinity.finn += 2"]
      lines:
        - 나: "넌 언젠가 검성이 될 거야."
        - "핀의 얼굴이 굳었다."
        - 핀@화남: "…놀리지 마요."
        - 핀: "검성은 이야기책에나 나오는 거예요. 고아원 선생님이 읽어 주던 책에요."
        - 핀: "청소부가 검성 되는 이야기는 없었어요. 한 권도."
        - "핀이 빗자루를 들고 일어났다. 등을 돌린 채 연무장 반대편 끝으로 가서 쓸기 시작했다."
        - "쓱, 쓱. 소리가 평소보다 거칠었다."
        - 속마음: "(너무 앞서 나갔다. 데이터에 적힌 숫자는 이 아이한테 아직 아무 의미도 없다.)"
        - 속마음: "(이 아이에게 필요한 건 예언이 아니라, 오늘 밤 한 판 더 하자는 말이었는데.)"

- id: bond_finn_2
  title: 핀 — 보법
  on: 밤의연무장
  priority: 2
  when: "time.year == 1 and affinity.finn >= 25 and fired.bond_finn_1"
  lines:
    - "밤의 연무장. 오늘은 바람이 세다. 횃불이 옆으로 누웠다가 다시 일어선다."
    - "대련 세 판. 세 판 다 졌다. 핀의 목검을 피하려고 뒤로 물러날 때마다, 목검이 끝까지 따라왔다."
    - "네 번째 판이 끝나자 핀이 목검을 내렸다. 뭔가 말하고 싶은데 망설이는 얼굴로 입술을 오물거린다."
    - 핀@당황: "저, 그… 이, 이런 말 해도 되는지 모르겠는데요."
    - 나: "해."
    - 핀: "저번에 보니까요… 피할 때 뒤로만 빠지더라고요."
    - 핀: "그러면 계속 쫓겨요. 뒤로 가면 상대는 앞으로 오면 되니까요. 상대가 더 편해요."
    - "정확한 지적이었다. 뒤로 빠질 때마다 벽에 몰렸던 게 떠올랐다."
    - 나: "그럼 어떻게 해?"
    - "핀이 연무장 구석에 세워 둔 빗자루를 가져왔다. 목검이 아니라."
    - 핀: "빗자루질할 때처럼요."
    - 핀: "빗자루는 앞으로 쓸잖아요. 근데 몸은 옆으로 빠져요. 안 그러면 쓴 먼지가 발에 걸리니까요."
    - "핀이 바닥을 쓸었다. 쓱. 빗자루가 앞으로 나가는 동안, 핀의 발이 미끄러지듯 옆으로 돌아 나갔다."
    - 핀: "앞으로 쓸면서, 옆으로 빠지는 거예요. 상대 쪽으로 반 걸음, 그다음 옆으로."
    - 나: "상대 쪽으로? 피하는데?"
    - 핀: "네. 무서운 쪽으로 반 걸음요. 그래야 상대가 휘두를 데가 없어져요."
    - 핀: "검은… 끝이 제일 무섭잖아요. 끝에서 멀어지려고 뒤로 가면, 계속 끝이랑 놀아야 돼요. 안쪽으로 들어가면 끝이 없어요."
    - 속마음: "(…검술 교본 고급편에나 나오는 이야기다. 그걸 청소부가 빗자루질하다 깨쳤다.)"
    - 핀: "목검 들어 보세요. 저 쳐 보세요."
    - "목검을 들었다. 핀은 빗자루를 든 채 내 앞에 섰다. 맨몸이나 다름없다."
    - "망설이다가, 그냥 쳤다. 정면으로."
    - "핀의 발이 바닥을 쓸 듯 미끄러졌다. 한 걸음 앞으로. 그리고—"
    - "사라졌다."
    - "목검이 허공을 갈랐다. 그리고 등 뒤에서, 빗자루 손잡이가 내 어깨를 톡 건드렸다."
    - "핀은 어느새 내 등 뒤에 서 있었다."
    - 핀@당황: "…아, 죄송해요. 버릇이라."
    - 핀: "청소할 때 학생들 사이로 지나다니다 보면, 이렇게 안 하면 부딪히거든요."
    - 나@놀람: "……"
    - 핀: "해 보세요. 처음엔 발이 꼬여요. 저도 처음에 양동이 엎었어요."
    - "해 봤다. 발이 꼬였다. 다시 했다. 또 꼬였다."
    - "열 번째쯤, 핀의 빗자루 끝을 피해 반 걸음 안쪽으로 들어가는 데 성공했다."
    - "핀이 눈을 깜빡였다. 그리고 웃었다. 빗자루로 얼굴을 반쯤 가리고."
    - 핀@웃음: "됐다. 됐어요. 방금 그거요."
    - 속마음: "(가르치는 걸 좋아한다. 본인은 모르겠지만, 가르칠 때는 말을 덜 더듬는다.)"
    - 속마음: "(원작 데이터엔 없던 정보다. 데이터에는 숫자만 있었으니까.)"
    - 시스템: "기술 습득 — 빗자루 보법 (전투: 회피 +15, 성공 시 반격 2배)"
    - 핀: "저, 내일도 오실 거죠? 이거 하루라도 안 하면 발이 까먹어요."
  effects: ["skill.빗자루보법 = 1", "affinity.finn += 5"]

- id: bond_finn_3
  title: 핀 — 피
  art: cg_finn_tears
  on: 밤의연무장
  priority: 2
  when: "time.year == 1 and affinity.finn >= 35 and fired.bond_finn_2"
  lines:
    - "밤의 연무장. 오늘은 횃불이 하나만 켜져 있다."
    - "핀이 와 있었다. 그런데 목검을 들지 않았다."
    - "연무장 구석, 무기 걸이 아래 그늘에 쪼그려 앉아 있다. 빗자루도 옆에 눕혀 둔 채."
    - "가까이 가서야 보였다. 핀은 자기 손을 내려다보고 있었다. 손바닥을, 손등을, 다시 손바닥을."
    - 나: "핀?"
    - 핀: "…아, 오셨어요."
    - 핀@슬픔: "오늘은 못 하겠어요. 죄송해요."
    - "옆에 앉았다. 흙바닥이 차가웠다. 핀의 손이 조금 떨리고 있었다."
    - when: "fs.F07.noticed"
      속마음: "(피를 보면 떨리던 손. 대련 중 내 손등에 맺힌 핏방울 하나에도.)"
    - 핀: "오늘 낮에요. 주방 뒤에서 닭 잡는 걸 봤어요. 그냥 닭이요. 매일 하는 거."
    - 핀: "근데… 손이 안 움직였어요. 빗자루를 떨어뜨렸어요. 주방 아저씨가 웃었어요."
    - "핀이 웃으려다 실패했다."
    - "한참 말이 없었다. 횃불 타는 소리만 들렸다."
    - 핀: "여섯 살 때요."
    - "핀이 그렇게 시작했다. 손바닥을 내려다본 채로."
    - 핀: "마을에 마물이 들어왔어요. 밤에요. 개들이 먼저 짖다가, 갑자기 다 조용해졌어요."
    - 핀: "엄마가 저를 헛간에 밀어 넣었어요. 짚더미 밑에. 소리 내지 말라고."
    - 핀@슬픔: "그리고 저는 헛간에 숨어서… 문틈으로 다 봤어요."
    - "핀은 거기서 멈췄다. 무엇을 봤는지는 말하지 않았다. 말하지 않아도 됐다."
    - 핀: "아침에 사람들이 왔을 때, 저는 아직 짚더미 밑에 있었어요. 나오라는데 못 나왔어요. 다리가 안 움직여서."
    - 핀: "그래서 피를 보면… 몸이 굳어요."
    - 핀@슬픔: "머리는 움직이라는데, 손이 안 움직여요. 그날 헛간에서처럼요."
    - "핀이 주먹을 쥐었다 폈다. 쥐었다, 폈다. 손가락이 말을 듣지 않는 듯 느렸다."
    - 핀: "검은요, 결국 베는 거잖아요. 베면 피가 나잖아요."
    - 핀@슬픔: "이런 놈이 무슨 검을 해요."
    - 속마음: "(원작 데이터 어디에도 이 이야기는 없었다. 검술 S, 이벤트 없음. 그 '없음' 속에 이게 있었다.)"
    - when: "perk.데이터마이너"
      속마음: "(원작대로라면 이 아이는 평생 청소부로 살다가, 8년 차 차원문 사건에 휘말려 죽는다. 이름도 없이.)"
    - "횃불이 툭, 꺼질 듯 흔들렸다."
    - "핀이 고개를 들어 나를 봤다. 대답을 기다리는 눈이 아니었다. 무슨 대답이 와도 상처받을 준비를 한 눈이었다."
  choices:
    - text: "\"천천히 해도 돼. 기다릴게\""
      effects: ["finn.trauma_talk = 1", "trust.finn += 12", "affinity.finn += 6"]
      lines:
        - 나: "천천히 해도 돼."
        - 나: "기다릴게. 손이 움직일 때까지."
        - 핀@놀람: "…기다려 준다고요? 저를요?"
        - 핀: "고아원에서도, 여기서도, 다들 빨리 하라고만 했어요. 빨리 쓸어라, 빨리 비켜라."
        - 핀: "기다려 준다는 사람은… 처음이에요."
        - "핀이 고개를 숙였다. 어깨가 조금 떨렸다."
        - "소리는 내지 않았다. 흙바닥에 동그란 얼룩이 두 개, 세 개 생겼다."
        - "그 옆에 그냥 앉아 있었다. 횃불이 다 탈 때까지."
        - 핀: "…내일은요. 목검만 잡아 볼게요. 휘두르지는 못해도."
        - 속마음: "(그거면 됐다. 오늘은.)"
    - text: "\"검을 잡으려면 언젠가 이겨내야 해\""
      effects: ["finn.trauma_talk = 1", "finn.pushed = 1", "trust.finn += 3", "affinity.finn += 4"]
      lines:
        - 나: "검을 잡으려면, 언젠가는 이겨내야 해."
        - 핀@슬픔: "…알아요."
        - 핀: "아는데요."
        - "핀의 목소리가 갈라졌다."
        - 핀@화남: "아는데, 안 되니까 이러는 거예요."
        - "핀이 손바닥으로 눈가를 문질렀다. 세게, 아프도록."
        - 핀: "…죄송해요. 학생 말이 맞아요. 이겨낼게요. 어떻게든요."
        - "핀은 일어나서 빗자루를 집었다. 연무장을 쓸기 시작했다. 아무것도 떨어져 있지 않은 바닥을."
        - 속마음: "(맞는 말이 언제나 좋은 말은 아니다.)"
        - 속마음: "(이 아이는 이제 혼자서 '이겨내려고' 할 것이다. 그게 제일 위험한 방법인데.)"
    - text: 아무 말 없이 등을 두드려 준다
      effects: ["affinity.finn += 8", "trust.finn += 8"]
      lines:
        - "아무 말도 하지 않았다. 대신 손을 뻗어 핀의 등을 두드렸다."
        - "한 번. 두 번. 천천히."
        - "핀의 등이 생각보다 얇았다. 어깨뼈가 손바닥에 그대로 느껴졌다."
        - 핀: "……"
        - "세 번째 두드렸을 때, 핀의 어깨가 무너졌다."
        - "핀이 처음으로 소리 내어 울었다."
        - "여섯 살짜리처럼 울었다. 헛간에서 울지 못한 만큼 울었다."
        - "연무장은 조용했다. 횃불만 타닥거렸다."
        - "한참 뒤, 울음이 딸꾹질로 바뀌었다. 핀이 소매로 얼굴을 닦으며 웃었다. 엉망인 얼굴로."
        - 핀@웃음: "…창피해요. 아무한테도 말하지 마요."

# ================================================================ 세라 (시험에서 구한 경우)
- id: bond_sera_1
  title: 세라 — 엄마의 기도
  art: cg_sera_prayer
  on: 성당
  priority: 2
  when: "time.year == 1 and affinity.sera >= 22 and (fate.sera == 'saved' or fate.sera == 'saved_quiet')"
  lines:
    - "해 질 녘 성당. 높은 창으로 들어온 빛이 기다란 줄이 되어 의자 사이에 내려앉았다."
    - "향 냄새와 촛농 냄새. 발소리가 돌바닥에 길게 울린다."
    - "성당 안은 바깥보다 서늘했다. 땀이 식으면서 손등의 상처가 더 따끔거렸다."
    - "오늘 실습에서 목검에 손등을 긁혔다. 별것 아닌 상처인데, 쓰라려서 자꾸 신경이 쓰인다."
    - "맨 앞줄에 은발이 보였다. 세라다. 기도를 마치고 막 일어서는 참이었다."
    - 나레이션:
        - "세라가 나를 알아보고 다가왔다. 그러다 내 손등의 상처에서 눈이 멈췄다."
        - { when: "fate.sera == 'saved_quiet'", text: "세라가 쭈뼛거리며 다가왔다. 무언가 할 말이 있는 얼굴이다. 그러다 내 손등의 상처에서 눈이 멈췄다." }
    - when: "fate.sera == 'saved_quiet'"
      세라: "재시험 기회… 감독관님이 네가 말해 줬다고 하셨어. 계속 고맙다고 하고 싶었는데, 말을 못 꺼냈어."
    - when: "fate.sera == 'saved'"
      세라: "시험 날엔 네가 날 붙잡아 줬지. 오늘은… 내 차례인가 봐."
    - 세라: "…손, 보여 줘."
    - "대답하기도 전에 세라가 내 손을 끌어당겼다. 그리고 조용히 자기 손을 겹쳤다. 차가운 손이었다."
    - 세라: "다친 데 있으면 말해. 엄마가 가르쳐 준 기도가 있어."
    - 세라@당황: "효과가 있을지는 모르지만. 동생들한테만 해 봤거든. 무릎 까졌을 때."
    - 세라: "우리 엄마는 마을 산파였어. 아기 받을 때마다 이 기도를 했대. 아프지 말고 오라고."
    - 세라: "글자를 몰라서 기도문을 다 외워서 했어. 그래서 교회 기도문이랑 조금 달라. 시스터 루나께는 비밀이야."
    - "세라가 눈을 감았다. 입술이 움직였다. 소리는 거의 나지 않았다."
    - "숨결 같은 기도. 단어보다 박자가 먼저 들린다. 자장가처럼."
    - "손등이 따뜻해진다. 겹친 손바닥 사이에서 희미한 빛이 새어 나왔다. 창으로 들어온 노을과 같은 색."
    - when: "know.sera_stigma"
      나레이션: "세라의 손등에 그 빛 무늬가 떠올랐다. 이번엔 사라지지 않고, 기도가 끝날 때까지 은은하게 빛났다."
    - "상처가 천천히 아물었다. 붉은 줄이 분홍색이 되고, 분홍색이 살색이 되었다."
    - "세라가 손을 뗐다. 그리고 내 손등을 뚫어지게 봤다. 자기가 한 일인데 믿기지 않는 얼굴."
    - 세라@놀람: "…됐다."
    - 세라@웃음: "됐어. 진짜로 됐어."
    - 나: "…따뜻하다."
    - 세라@당황: "그, 그래? 엄마 손은 훨씬 더 따뜻했는데."
    - "세라가 내 손등을 한 번 더 쓸었다. 흉터 하나 남지 않은 걸 확인하듯이."
    - 세라@웃음: "나 이거 남한테 해 준 거 처음이야. 가족 말고는."
    - "세라가 웃었다. 성당에서 처음 보는 웃음이었다. 늘 조심스럽게 입꼬리만 올리던 아이가."
    - 속마음: "(원작에서 세라는 반 배정 시험에서 쓰러져 고향으로 돌아간다. 그 뒤로 한 번도 등장하지 않는다.)"
    - 속마음: "(원작 성녀보다 높은 신성력. 그 설정이 알려진 뒤, 커뮤니티는 한동안 '세라 생존 루트'를 찾아 헤맸다.)"
    - 속마음: "(아무도 못 찾았다.)"
    - 속마음: "(못 찾은 게 아니었다. 시험장에서 손 한 번 내밀면 되는 거였다. 그 간단한 걸, 3,000시간 동안.)"
    - when: "fate.sera == 'saved_quiet'"
      속마음: "(나는 감독관에게 한마디 했을 뿐이다. 그 한마디가 이 손을 여기 남겼다.)"
    - 세라: "엄마가 그랬어. 기도는 신한테 하는 게 아니라, 아픈 사람한테 하는 거라고. 신은 옆에서 듣기만 하신대."
    - 세라@진지: "…교회에선 이런 말 하면 혼나겠지."
    - 시스템: "기술 습득 — 치유의 기도 (전투: 체력 35% 회복)"
    - 세라: "다치면 또 와. 아니, 다치지 마. 다치지 말고 그냥 와."
    - "성당 문을 나섰다. 손등이 아직 따뜻했다. 기도의 온기가 손바닥 모양 그대로 남아 있었다."
  effects: ["skill.치유기도 = 1", "affinity.sera += 6", "trust.sera += 6"]

- id: bond_sera_2
  title: 세라 — 교회의 편지
  on: 성당
  priority: 2
  when: "time.year == 1 and affinity.sera >= 32 and fired.bond_sera_1"
  lines:
    - "저녁 미사가 끝난 성당. 신자들이 빠져나가고 촛불만 남았다."
    - "세라가 맨 뒷줄에 혼자 앉아 있었다. 무릎 위에 봉투 하나를 올려놓고."
    - "두꺼운 양피지 봉투. 붉은 밀랍 봉인이 반쯤 뜯겨 있다. 봉인에 찍힌 문장이 촛불에 번들거린다."
    - "세라는 그 봉투를 펼치지도, 접지도 않고 그냥 보고만 있었다."
    - 세라: "…아, 왔구나."
    - "세라가 봉투를 슬쩍 뒤집어 놓았다. 그러다 마음을 바꿨는지, 다시 돌려 내 쪽으로 내밀었다."
    - 세라: "추기경님이 보낸 사람이 찾아왔어. 어제."
    - 세라: "성녀 후보 시험을 보래. 수도 대성당에서."
    - 나: "성녀 후보?"
    - 세라: "응. 다들 영광이라고 해. 기숙사 애들도, 신학과 선배들도. 마을에 편지 쓰면 엄마가 울 거래."
    - 세라@웃음: "기뻐서 울 거래."
    - "세라가 웃었다. 금방 웃음이 꺼졌다."
    - 세라@슬픔: "…근데 이상하게 무서워."
    - 세라: "찾아온 사람, 붉은 띠를 두르고 있었어. 말투는 엄청 친절했는데…"
    - 세라@슬픔: "그 사람 눈이 나를 안 봤어. 내 얼굴을 한 번도 안 봤어. 계속 내 손등만 봤어."
    - "세라가 자기 손등을 다른 손으로 덮었다. 숨기듯이."
    - 세라: "말할 때도 손등에 대고 말하는 것 같았어. 내가 아니라, 여기 있는 뭔가한테."
    - when: "know.sera_stigma"
      속마음: "(성흔. 손등에 떠오르던 빛 무늬. 교회는 이미 알고 있다.)"
    - when: "fest.with == 'sera'"
      세라: "봄 축제 때 천막 옆에 서 있던 사람 있잖아. 그 사람이랑 같은 띠였어."
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(추기경 그레고르. 원작에서 성녀를 '관리'하다 망가뜨린 사람이다.)"
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(원작의 성녀는 졸업할 즈음 웃지 않게 됐다. 위키엔 '성격 변화: 정상 사양'이라고 적혀 있었다.)"
    - 세라: "시스터 루나께는 아직 말 못 했어. 시스터는 분명 좋아하실 텐데… 아니, 모르겠다."
    - 세라: "엄마 기도는 아픈 사람한테 하는 거라고 했잖아. 성녀는… 누구한테 기도하는 걸까."
    - "촛불 하나가 꺼졌다. 가느다란 연기가 천장으로 올라갔다."
    - 세라: "너라면 어떻게 할 거야?"
    - 속마음: "(답을 안다. 하지만 이 아이가 나를 '답을 아는 사람'으로 보기 시작하면 안 된다.)"
  choices:
    - text: "\"교회를 너무 믿지 마. 특히 추기경 쪽은\""
      effects: ["sera.warned = 1", "trust.sera += 10", "affinity.sera += 4"]
      lines:
        - 나: "교회를 너무 믿지 마. 특히 추기경 쪽은."
        - "세라가 숨을 들이켰다. 성당 안에서 하기엔 위험한 말이었다. 둘 다 그걸 알았다."
        - "세라는 주위를 둘러봤다. 아무도 없었다. 촛불만."
        - 세라@놀람: "…너도 그렇게 생각해?"
        - 세라@웃음: "나만 이상한 게 아니었구나."
        - 세라: "신학생이 추기경님을 의심하면 안 되는 거잖아. 그래서 계속 내가 나쁜 애인 줄 알았어."
        - 나: "의심하는 거랑 믿음이 없는 건 다른 거야."
        - "세라가 그 말을 곱씹듯 입술을 달싹였다."
        - 세라: "시험은 미룰게. 시스터 루나께 먼저 여쭤볼래."
        - 세라: "시스터는 웃으면서 무서운 말을 하시지만, 거짓말은 안 하시거든."
        - 속마음: "(시스터 루나. 교회가 숨긴 용사 선정의 진실을 아는 사람. 원작에선 교회 숙청에 휘말려 죽는다.)"
        - 속마음: "(세라를 지키려면 그 사람도 지켜야 한다. 목록이 또 하나 늘었다.)"
    - text: "\"기회잖아. 해봐\""
      effects: ["sera.church = 1", "affinity.sera += 4"]
      lines:
        - 나: "기회잖아. 해 봐."
        - 세라: "…그렇지?"
        - "세라가 봉투를 내려다봤다. 붉은 봉인을 엄지로 쓸었다."
        - 세라: "엄마도 좋아하실 거고. 마을 성당 지붕도 고칠 수 있을지 몰라. 성녀 후보 가족한테는 지원금이 나온대."
        - 세라@웃음: "…응. 해 볼게."
        - "세라는 웃었다. 입꼬리가 아주 조금 늦게 따라 올라갔다."
        - "봉투를 품에 넣는 손이 떨렸다. 본인은 그걸 모르는 것 같았다."
        - 속마음: "(무서운 건 이유가 있어서다. 그 이유를, 나는 방금 지워 버렸다.)"
        - 속마음: "(추기경 쪽으로 가는 첫 계단. …아직 되돌릴 수 있을까.)"
    - text: "\"네가 원하는 대로 해. 난 네 편이야\""
      effects: ["affinity.sera += 8", "trust.sera += 6"]
      lines:
        - 나: "네가 원하는 대로 해."
        - 나: "시험을 보든 안 보든. 난 네 편이야."
        - 세라: "……"
        - "세라가 나를 봤다. 촛불이 은발 끝에서 흔들렸다."
        - 세라@웃음: "내 편…"
        - 세라: "다들 뭘 해야 한다고만 말했어. 영광이니까 해야 한다, 신학생이니까 해야 한다."
        - 세라: "내가 뭘 원하는지는 아무도 안 물어봤어. 나도 나한테 안 물어봤고."
        - 세라: "…생각해 볼게. 내가 뭘 원하는지부터."
        - 세라@웃음: "그 말, 오래 기억할게. 기도할 때마다 꺼내 볼래."
        - 속마음: "(결정은 이 아이의 몫이다. 그게 맞다. …맞는 거겠지.)"

# ================================================================ 에드릭 (미궁에서 살아남은 경우)
- id: bond_edric_1
  title: 에드릭 — 엄마의 목소리
  art: cg_edric_mother
  on: [식당, 훈련장]
  priority: 2
  when: "time.year == 1 and origin != '악역도련님' and affinity.edric >= 25 and (fate.edric == 'saved' or fate.edric == 'saved_by_teacher')"
  lines:
    - "밤늦은 식당. 불은 반쯤 꺼졌고, 주방에서 설거지 소리만 들린다."
    - "물이나 마시려고 내려왔더니 구석 자리에 누가 앉아 있다. 찻잔 하나를 앞에 두고. 차는 이미 식었다."
    - "에드릭이다. 혼자. 패거리도, 하인도 없이."
    - 에드릭@당황: "…뭐야. 너도 잠 못 자냐."
    - "에드릭이 맞은편 의자를 발로 밀어 줬다. 앉으라는 건지, 걸리적거린다는 건지."
    - "앉았다. 에드릭은 한참 찻잔만 돌렸다."
    - 에드릭: "요즘 잠을 못 자. 미궁 꿈을 꿔서."
    - when: "fate.edric == 'saved'"
      에드릭: "꿈에서는 네가 안 와. 그래서 매번 끝까지 가."
    - when: "fate.edric == 'saved_by_teacher'"
      에드릭: "꿈에서는 교관이 안 와. 그래서 매번 끝까지 가."
    - "에드릭이 쓴웃음을 지었다."
    - 에드릭: "…그날 왜 혼자 3층 안쪽에 갔는지, 네가 물어봤었지."
    - 에드릭: "안 말해 주려고 했는데."
    - "에드릭이 찻잔을 내려놓았다. 손가락이 잔 가장자리를 계속 맴돌았다."
    - 에드릭: "누가 불렀어. 내 이름을."
    - 에드릭: "통로 안쪽에서. '에드릭, 이리 오렴.' 하고."
    - 에드릭@슬픔: "엄마 목소리로."
    - "설거지 소리가 멎었다. 주방 불이 꺼졌다. 식당이 갑자기 넓어졌다."
    - 에드릭@슬픔: "엄마는 5년 전에 죽었는데."
    - 에드릭: "병이었어. 저택 동쪽 방에서. 아버지는 장례식에도 늦게 왔어. 사냥 중이었대."
    - 에드릭: "근데 그 목소리, 틀림없었어. 엄마는 내 이름 부를 때 끝을 올렸거든. 에드-릭, 이렇게. 그거까지 똑같았어."
    - 에드릭: "가면 안 된다는 거 알았어. 미궁이고, 3층이고, 엄마는 죽었으니까. 다 알았는데."
    - 에드릭: "…발이 먼저 갔어."
    - "에드릭이 찻잔을 쥔 손에 힘을 줬다."
    - "빠직."
    - "잔에 금이 갔다. 식은 차가 금 사이로 배어 나와 식탁에 번졌다."
    - "에드릭은 그걸 보지도 않았다."
    - 속마음: "(원작 기록. '에드릭 벨모어, 미궁 실습 중 단독 행동으로 사망. 사고로 처리.')"
    - 속마음: "(단독 행동. 그 한 단어 뒤에 죽은 엄마의 목소리가 있었다.)"
    - when: "fs.F04.noticed"
      속마음: "(피로 그린 원. 로브 입은 그림자. 사고가 아니었다. 부른 쪽이 있었다.)"
    - 에드릭@화남: "웃기지? 벨모어가 망나니가 엄마 목소리 듣고 질질 끌려갔다니."
    - 에드릭: "웃으려면 웃어. 다들 그럴 거니까."
    - "에드릭은 웃으라고 했지만, 눈은 웃지 말라고 하고 있었다."
  plants:
    - { id: F22, notice: { value: "stat.지성 + 10 * know.sacrifice", dc: 20 } }
  choices:
    - text: "\"또 그 목소리가 들리면 나한테 바로 말해\""
      effects: ["trust.edric += 10", "affinity.edric += 5", "edric.voice = 1"]
      lines:
        - 나: "또 그 목소리가 들리면, 나한테 바로 말해."
        - 에드릭@당황: "…너한테?"
        - 에드릭: "웃기네. 내가 왜 너한테. 너 D반이잖아. 나는 벨모어고."
        - 나: "D반이니까. 소문낼 데도 없어."
        - "에드릭이 입을 다물었다. 금 간 찻잔을 한참 내려다봤다."
        - 에드릭: "…밤중이어도?"
        - 나: "밤중이어도."
        - 에드릭@당황: "…알았어. 말할게. 귀찮게 해 줄 거야. 각오해."
        - "에드릭이 일어나 행주를 가져왔다. 번진 차를 직접 닦았다. 벨모어가 도련님이, 식당 식탁을."
        - 속마음: "(누군가 죽은 사람의 목소리로 이 아이를 불렀다. 그리고 그 누군가는, 아직 이 학교 안에 있다.)"
    - text: "\"교관한테 말해야 해\""
      effects: ["edric.report = 1", "trust.edric += 4", "affinity.edric -= 2"]
      lines:
        - 나: "교관한테 말해야 해. 미궁에서 누가 널 불렀다는 거잖아."
        - 에드릭@화남: "벨모어가 도련님이 유령 목소리 듣는다고?"
        - 에드릭: "다음 날 소문 다 나. 신문부 놈들이 제일 먼저 알 거고, 그다음엔 아버지 귀에 들어가."
        - 에드릭: "아버지가 뭐라고 할지 알아? '역시 그 여자 아들이군.' 그럴 거야."
        - "에드릭이 이를 악물었다. 금 간 찻잔이 손안에서 삐걱거렸다."
        - 나: "그래도. 혼자 끌어안고 있다가 또 들리면?"
        - "에드릭은 대답하지 않았다. 대신 한참 식탁만 노려봤다."
        - 에드릭: "…생각은 해 볼게. 생각만."
        - "에드릭은 찻잔을 두고 식당을 나갔다. 문 앞에서 한 번 멈췄다가, 돌아보지 않고 나갔다."
        - 속마음: "(맞는 말을 했다. 그런데 이 아이에게 맞는 말은 늘 아버지의 목소리로 들린다.)"

- id: bond_edric_2
  title: 에드릭 — 살아남는 법
  on: [식당, 훈련장]
  priority: 2
  when: "time.year == 1 and origin != '악역도련님' and affinity.edric >= 32 and fired.bond_edric_1"
  lines:
    - 삽화: training_ground
    - "오후 훈련장. 대련 시간이다. 상대는 B반 덩치였다."
    - "정석대로 막고, 정석대로 찔렀다. 정석대로 졌다. 목검이 손에서 튕겨 나가 흙바닥을 굴렀다."
    - "흙먼지를 털며 일어나는데, 누가 혀를 찼다. 쯧."
    - "에드릭이 울타리에 기대 서 있었다. 팔짱을 끼고, 한심하다는 얼굴로."
    - 에드릭: "봤다. 처음부터 끝까지."
    - 에드릭: "너 대련할 때 너무 정직하게 싸워."
    - 나: "…대련이니까."
    - 에드릭@화남: "대련이니까? 미궁에서도 그렇게 싸울래? 그 그림자 놈한테도 '대련이니까' 할래?"
    - "말문이 막혔다. 에드릭은 그날 이후로 '미궁'이라는 단어를 먼저 꺼낸 적이 없었다."
    - 에드릭: "귀족 검술 같은 거 따라 하지 마. 그거 다 보여 주려고 만든 거야. 누가 보는 앞에서 멋있게 이기려고."
    - 에드릭: "나 어릴 때부터 그거 배웠어. 검술 선생이 세 명이었어. 근데 미궁에선 하나도 쓸모없었어."
    - 에드릭@진지: "살아남는 게 먼저야."
    - 에드릭: "멋있게 죽는 것보다 추하게 사는 게 나아. 이건 내가 직접 겪어 봐서 알아."
    - "에드릭이 울타리에서 몸을 뗐다. 그리고 주머니에 손을 넣었다."
    - 에드릭: "흙이든 모래든, 눈에 뿌리고 보는 거지."
    - "에드릭이 주머니에서 모래를 한 줌 꺼내 보였다. 고운 모래다. 일부러 체에 거른 것처럼."
    - "항상 들고 다니는 모양이다."
    - 나: "…그걸 매일 들고 다녀?"
    - 에드릭@당황: "미궁 다녀온 다음부터. 주머니가 비어 있으면 잠이 안 와."
    - 에드릭: "강 모래야. 흙은 뭉쳐서 안 퍼지고, 자갈은 무거워서 안 날아가. 이게 제일 잘 퍼져. 몇 주 동안 실험했어."
    - "벨모어가 도련님이 몇 주 동안 모래를 실험했다. 상상하니 조금 웃겼다. 웃지는 않았다."
    - 에드릭: "던지는 게 아니야. 손목만 튕겨. 상대가 검을 들어 올리는 순간에. 그때 눈이 제일 크게 떠지거든."
    - 에드릭: "봐."
    - "에드릭이 허수아비 앞에 섰다. 손목이 아주 작게 튕겼다."
    - "모래가 부채꼴로 퍼졌다. 허수아비 머리 높이에서, 정확하게."
    - 에드릭: "사람이면 지금 눈 비비고 있다. 그동안 세 번은 찌를 수 있어."
    - 에드릭: "해 봐. 바람 방향 보고. 바람 거슬러 뿌리면 네 눈에 들어간다. 나 처음에 그랬어."
    - "해 봤다. 첫 번째는 내 눈에 들어갔다."
    - 에드릭@웃음: "하하! 봐, 내가 뭐랬어!"
    - "에드릭이 소리 내어 웃었다. 처음 듣는 웃음소리였다. 남을 비웃을 때와는 전혀 다른."
    - "세 번째쯤, 모래가 허수아비 얼굴에 제대로 퍼졌다."
    - 에드릭: "…그래. 그거야. 추하지? 그게 사는 거야."
    - 속마음: "(원작의 에드릭은 이런 걸 가르칠 시간이 없었다. 1권에서 죽었으니까.)"
    - 속마음: "(살아남은 에드릭은 살아남는 법을 가르친다. 그것도 모래로.)"
    - "에드릭이 주머니 모래를 반쯤 덜어 내 손바닥에 쏟아 줬다."
    - 에드릭@당황: "…이건 우리 둘만 아는 거다. 벨모어가 모래나 뿌리고 다닌다는 소문 나면 끝이야."
    - 시스템: "기술 습득 — 모래 뿌리기 (전투: 3턴 동안 적의 공격 반감)"
    - 에드릭: "다음 대련 때 써 봐. 이기면 저녁 사. 지면… 내가 산다. 불쌍하니까."
  effects: ["skill.모래뿌리기 = 1", "affinity.edric += 5"]

# ================================================================ 가렌
- id: bond_garen_1
  title: 가렌 — 새벽 수련
  on: 훈련장
  priority: 2
  when: "time.year == 1 and affinity.garen >= 20"
  lines:
    - "새벽 다섯 시. 기숙사 복도는 아직 캄캄하다. 새벽 공기가 폐 안쪽까지 차갑다."
    - "반쯤 감긴 눈으로 훈련장에 나갔다. 설마 했다."
    - "가렌 교관이 혼자 연무장 한가운데 서 있었다. 목검 두 자루를 들고. 어깨에 이슬이 앉아 있다."
    - "정말로 기다리고 있었다."
    - 가렌: "늦었다."
    - 나: "…다섯 시라고 하셔서."
    - 가렌: "다섯 시에 시작한다고 했다. 다섯 시에 오라고는 안 했다."
    - "목검 하나가 날아왔다. 받았다. 손바닥이 얼얼하다."
    - 가렌: "쳐라."
    - "쳤다. 막혔다. 다시 쳤다. 막혔다."
    - "다섯 번째에서 가렌의 목검이 내 목검을 걷어 올리더니, 그대로 정강이를 쓸었다."
    - "넘어졌다. 이슬 젖은 흙이 뺨에 붙었다."
    - 가렌: "일어나."
    - "일어났다. 쳤다. 넘어졌다."
    - "열 번쯤 반복했을 때, 가렌이 목검을 내렸다."
    - 가렌: "너는 힘으로만 버틴다."
    - 가렌: "막히면 더 세게 민다. 넘어지면 팔로 땅을 짚는다. 그러다 부러진다. 팔이든, 검이든, 너든."
    - "가렌이 내 손목을 잡아 비틀었다. 땅을 짚었던 손목이 시큰거렸다."
    - 가렌: "이 손목으로 3년 버틸 것 같나. 10년은."
    - "10년이라는 말에 심장이 한 번 쿵 내려앉았다. 가렌은 그냥 한 말이었다."
    - 가렌@진지: "버티는 법을 배워라."
    - 가렌: "맞는 법. 넘어지는 법. 다시 일어나는 법."
    - 가렌: "검술은 그다음이다. 쓰러지지 않는 놈만 다음 합이 있다."
    - "그리고 해가 뜰 때까지 넘어졌다."
    - "어깨로 떨어지는 법. 등을 둥글게 마는 법."
    - "땅을 치고 그 반동으로 일어나는 법. 목검을 놓쳐도 시선은 놓치지 않는 법."
    - "가렌은 시범을 한 번만 보였다. 그다음부터는 넘어뜨리기만 했다."
    - "스무 번째쯤부터 넘어지는 게 덜 아팠다. 서른 번째쯤부터는 넘어지면서 가렌의 발을 봤다."
    - 가렌: "……"
    - "가렌은 아무 말도 하지 않았다. 대신 다음 합이 조금 빨라졌다."
    - when: "talent.겁쟁이"
      속마음: "(무서웠다. 그런데 서른 번째쯤엔 넘어지는 게 덜 무서웠다. 이 사람은 그걸 노린 거다.)"
    - "동쪽 하늘이 하얘지고, 주황색이 되었다. 연무장 울타리 그림자가 길게 뻗었다."
    - 가렌: "오늘은 여기까지."
    - "온몸이 멍투성이다. 숨을 쉴 때마다 갈비뼈가 항의한다."
    - "그런데 이상하게 개운했다. 몸속 어딘가에 쌓여 있던 녹이, 넘어질 때마다 한 겹씩 떨어져 나간 것 같았다."
    - 속마음: "(원작에서 가렌 교관 새벽 수련은 '체질 +3' 버튼 하나였다. 누르면 화면이 어두워졌다 밝아졌다.)"
    - 속마음: "(그 암전 속에 이게 있었다. 서른 번 넘어지는 동안, 한 번도 칭찬하지 않는 사람.)"
    - 가렌: "내일도 다섯 시."
    - "가렌은 목검을 거두고 걸어갔다. 뒤돌아보지 않았다. 등이 넓었다."
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(5년 차, 잿빛 장벽. 이 등은 거기서 무너진다. …아직 5년 남았다. 아직.)"
  effects: ["stat.체질 += 3", "stat.의지 += 2", "affinity.garen += 6", "fatigue += 20"]

- id: bond_garen_2
  title: 가렌 — 20년 전
  art: cg_garen_past
  on: 훈련장
  priority: 2
  when: "time.year == 1 and affinity.garen >= 32 and fired.bond_garen_1"
  lines:
    - "새벽 수련이 끝났다. 오늘은 마흔 번쯤 넘어졌다. 그중 열 번은 넘어지자마자 일어났다."
    - "흙바닥에 대자로 누워 숨을 골랐다. 하늘 가장자리가 막 금빛으로 물들기 시작한다."
    - "가렌은 평소처럼 목검을 정리하지 않았다. 울타리에 기대 서서, 해가 올라오는 쪽을 보고 있었다."
    - "햇살이 비스듬히 들어와 가렌의 얼굴에 난 오래된 흉터를 비췄다."
    - "한참을 그러다가, 가렌이 드물게 먼저 입을 열었다."
    - 가렌: "아렌이라는 놈."
    - "의외의 이름이었다."
    - 가렌: "그놈이 성검을 들었을 때, 강당 뒤에서 봤다."
    - 가렌: "…20년 전에도 성검이 반응한 아이가 있었다."
    - "몸을 일으켜 앉았다. 가렌은 여전히 해를 보고 있었다."
    - 가렌: "농부 집 막내였다. 웃음이 많았다. 쓸데없이."
    - 가렌: "내 일은 그 아이를 지키는 거였지."
    - 가렌: "검을 가르쳤다. 아침마다, 여기서. 다섯 시에."
    - "다섯 시. 숨이 멎는 것 같았다."
    - 가렌@슬픔: "지키지 못했다."
    - "그 한마디뿐이었다. 어떻게, 어디서, 왜는 없었다."
    - "가렌의 목소리엔 높낮이가 없었다. 20년 동안 닳아서 매끈해진 돌 같은 목소리."
    - "해가 완전히 떠올랐다. 연무장에 빛이 쏟아졌다. 가렌은 눈을 찡그리지도 않았다."
    - 속마음: "(가렌 교관. 20년 전 실패한 용사 파티의 유일한 생존자. 원작 설정집 마지막 페이지의 한 줄.)"
    - 속마음: "(원작에서 이 사람은 이 이야기를 끝내 하지 않았다. 5년 차, 장벽 위에서 죽을 때까지.)"
    - 가렌@진지: "…그래서 너희를 이렇게 굴린다."
    - 가렌: "넘어지는 법, 일어나는 법. 그때 그걸 더 가르쳤어야 했다. 이기는 법 말고."
    - 가렌@진지: "이번엔 아무도 잃지 않으려고."
    - "가렌이 그제야 나를 봤다. 흙투성이로 앉아 있는 나를."
    - 가렌: "…쓸데없는 말을 했군. 잊어라."
    - "잊으라는 목소리가, 처음으로 아주 조금 흔들렸다."
    - 속마음: "(이번엔. 그 '이번'에 나도 들어 있다. 아렌도, 이 연무장에서 넘어지는 모든 애들도.)"
    - 속마음: "(그리고 그 '이번'의 끝에서, 원작은 이 사람을 데려간다.)"
  plants:
    - { id: F23, notice: { value: "stat.지성 + stat.의지 / 2", dc: 20 } }
  choices:
    - text: "\"이번엔 지킬 수 있어요. 저도 도울게요\""
      effects: ["trust.garen += 10", "affinity.garen += 5"]
      lines:
        - 나: "이번엔 지킬 수 있어요."
        - 나: "저도 도울게요. 교관님 혼자 다 지키지 않아도 되게."
        - "가렌이 나를 봤다. 오래. 무언가를 재는 눈으로."
        - 가렌: "…네가."
        - 가렌: "아침마다 마흔 번씩 넘어지는 놈이."
        - 나: "열 번은 바로 일어났잖아요."
        - "가렌의 입가가 움직였다. 아주 조금. 흉터 때문에 비뚤어진 건지, 웃은 건지 알 수 없었다."
        - 가렌@웃음: "…건방진 소리."
        - 가렌: "내일 다섯 시."
        - "가렌이 목검을 어깨에 걸치고 걸어갔다. 오늘따라 걸음이 조금 가벼워 보였다. 착각일지도 모른다."
        - 속마음: "(약속했다. 지킬 수 있다고. 이 사람 앞에서 한 약속은 무르기 어렵다.)"
    - text: 아무것도 묻지 않는다
      effects: ["affinity.garen += 8"]
      lines:
        - "묻고 싶은 게 많았다. 그 아이 이름, 어디였는지, 그날 무슨 일이 있었는지."
        - "묻지 않았다. 흙바닥에 앉은 채로, 같이 해를 봤다."
        - "가렌은 한참 해를 보다가, 말없이 목검을 정리했다."
        - "한 자루, 두 자루. 무기 걸이에 거는 손이 오늘따라 느렸다."
        - "마지막 목검을 걸고, 가렌이 걸음을 멈췄다. 등을 보인 채."
        - 가렌: "…묻지 않는군."
        - 가렌: "좋은 버릇이다. 전장에선 묻는 놈부터 죽는다."
        - "그리고 걸어갔다. 연무장 문을 나서기 직전, 아주 작게 덧붙였다."
        - 가렌: "고맙다."
        - 속마음: "(입학하고 처음 듣는 말이다. 칭찬은 아니었다. 그보다 드문 거였다.)"

# ================================================================ 엘베라
- id: bond_elvera_1
  title: 엘베라 — 막는 법부터
  on: 마법실습
  priority: 2
  when: "time.year == 1 and affinity.elvera >= 20"
  lines:
    - "마법 실습이 끝난 오후. 실습실 창으로 비스듬한 햇살이 들어와 떠다니는 분필 가루를 비춘다."
    - "다들 나간 뒤에도 남아서 공격 술식을 연습하고 있었다. 불꽃, 얼음 화살, 다시 불꽃."
    - "과녁 허수아비가 그을릴 때마다 조금 뿌듯했다."
    - 엘베라: "학생은 공격 마법만 연습하네요."
    - "돌아보니 엘베라 교수가 교탁에 걸터앉아 있었다. 언제부터 있었는지 모르겠다. 발소리가 없는 사람이다."
    - "찻잔을 두 손으로 감싸 쥐고, 느긋하게."
    - 엘베라: "불꽃이 예쁘네요. 그런데 다섯 번 쏘는 동안, 한 번도 뒤를 안 봤어요."
    - 나: "…뒤요?"
    - 엘베라: "제가 들어온 것도 몰랐죠. 제가 적이었으면, 학생은 지금쯤 과녁 옆에 누워 있을 거예요."
    - 엘베라@웃음: "그을린 채로요."
    - "웃는 얼굴로 무서운 말을 한다. 오백 년 산 사람의 여유다."
    - 엘베라: "마법은 막는 것부터 배워야 해요."
    - 엘베라: "요즘 아이들은 다들 공격부터 배우고 싶어 하죠. 시험도 과녁 맞히기고, 대회도 그렇고. 박수는 불꽃한테만 쏟아지니까."
    - 엘베라: "막는 마법엔 아무도 박수를 안 쳐요. 아무 일도 안 일어난 것처럼 보이거든요."
    - 엘베라: "그런데 아무 일도 안 일어나게 하는 게, 세상에서 제일 어려운 마법이에요."
    - "엘베라가 찻잔을 내려놓았다. 창밖을 봤다. 아주 먼 데를 보는 눈."
    - 엘베라@슬픔: "제 스승은… 아니."
    - "엘베라가 말을 멈췄다. 그리고 고쳐 말했다."
    - 엘베라: "오래전 어떤 분은 그렇게 가르쳤어요. 막을 줄 알아야 지킬 수 있다고."
    - 엘베라: "부수는 건 누구나 배워요. 지키는 걸 배우려는 사람은 드물죠. 그분은 그게 늘 아쉽다고 하셨어요."
    - when: "fs.F11.noticed"
      속마음: "(수업 중에 마왕의 이름에 존칭을 붙일 뻔했던 사람. 그 '어떤 분'이 혹시…)"
    - 속마음: "(엘베라 교수. 원작에선 끝까지 살아남지만 마지막에 행방불명. 그녀의 과거는 설정집에도 없었다.)"
    - 엘베라: "자, 손을 펴 봐요. 이렇게."
    - "엘베라가 손바닥을 펼쳤다. 그 위의 공기가, 굳었다."
    - "유리처럼. 아니, 유리보다 맑게. 햇살이 그 안에서 휘지도 않고 그대로 통과했다."
    - "엘베라가 다른 손으로 촛불을 하나 켜서, 그 굳은 공기 안에 넣었다."
    - "창문으로 바람이 들어왔다. 커튼이 펄럭였다. 내 앞머리가 날렸다."
    - "그 안에서는, 촛불조차 흔들리지 않았다."
    - 엘베라: "마력을 밖으로 쏘는 게 아니에요. 제자리에 붙잡아 두는 거예요. 물을 손바닥에 고이듯이."
    - 엘베라: "움켜쥐면 새요. 손바닥을 오목하게, 가만히."
    - "따라 해 봤다. 손바닥 위의 공기가 일렁이다가 흩어졌다. 다시. 흩어졌다."
    - "일곱 번째. 손바닥 위에 아주 얇은 막이 생겼다. 비눗방울처럼 흔들리는 막."
    - "엘베라가 손가락으로 그 막을 톡 쳤다. 깨지지 않았다."
    - 엘베라@웃음: "어머. 일곱 번이면 빠른 편이에요. 그분은 제가 백 번 넘게 실패하는 걸 웃으면서 보셨는데."
    - 속마음: "(원작 엘베라는 학생에게 기술을 직접 가르치는 이벤트가 없었다. 마법학 수업 보너스가 전부였다.)"
    - 시스템: "기술 습득 — 엘베라의 방벽 (전투: 마법까지 거의 막는 방어)"
    - 엘베라: "막는 법을 배운 학생은 오래 살아요. 오래 살아야 지킬 기회도 많아지죠."
    - "엘베라가 찻잔을 들고 나갔다. 촛불은 아직 그 자리에서, 흔들리지 않고 타고 있었다."
  effects: ["skill.방벽 = 1", "affinity.elvera += 5"]

- id: bond_elvera_2
  title: 엘베라 — 오래된 이름
  on: 마법실습
  priority: 2
  when: "time.year == 1 and affinity.elvera >= 30 and fired.bond_elvera_1"
  lines:
    - "흐린 오후의 마법학 실습실. 창밖 하늘이 낮게 내려앉았다. 비 냄새가 난다."
    - "오늘 수업은 '고대 문헌 속의 술식'. 칠판 가득 오래된 술식이 적혀 있다."
    - "엘베라 교수의 글씨는 길고 가늘다. 획 끝이 덩굴처럼 말려 올라간다."
    - "수업 중간, 엘베라가 칠판 구석에 고대 문자로 이름 하나를 적었다."
    - "그리고 아무 설명 없이 다음 술식으로 넘어갔다. 아무도 그걸 신경 쓰지 않았다."
    - "나만, 그 이름이 적히는 동안 엘베라의 분필이 한 번 멈췄다는 걸 봤다."
    - "종이 울렸다. 의자 끄는 소리, 가방 챙기는 소리. 학생들이 우르르 빠져나간다."
    - 엘베라: "학생, 잠깐만요."
    - "엘베라가 분필을 쥔 채 나를 불렀다. 칠판의 다른 글씨는 다 지웠는데, 구석의 그 이름만 남겨 두었다."
    - "실습실에 둘만 남았다. 엘베라가 창가로 걸어가 창틀의 화분 잎을 손끝으로 쓸었다."
    - 엘베라: "학생, 이상한 질문 하나 해도 될까요."
    - 엘베라: "대답 안 해도 돼요. 점수랑은 상관없어요. 그냥… 오래 산 사람의 버릇이에요."
    - 엘베라: "오백 년을 살면 같은 질문을 여러 번 하게 돼요. 묻는 사람은 그대로인데, 대답하는 사람이 바뀌니까."
    - 엘베라: "백 년 전엔 '재앙'이라고들 했어요. 이백 년 전엔 '불의 왕'. 그보다 전엔… 다들 그 이름을 입에 올리지도 않았죠."
    - 엘베라@웃음: "요즘 학생들은 뭐라고 할지, 궁금해서요."
    - "엘베라가 돌아섰다. 분필 끝으로 칠판 구석의 그 이름을 톡, 톡 두드렸다."
    - 엘베라@진지: "'이그니스'라는 이름을 들으면, 뭐가 떠올라요?"
    - "실습실이 조용했다. 창밖에서 첫 빗방울이 유리를 두드렸다."
    - "엘베라의 얼굴은 평소처럼 부드러웠다. 그런데 분필을 쥔 손가락 끝이 하얬다."
    - 속마음: "(이그니스. 봉인된 마왕. 원작의 최종 보스. 대사가 거의 없어서, 왜 인간을 증오하는지 아무도 모른다.)"
    - when: "fs.F11.noticed"
      속마음: "(그리고 이 사람은 수업 중에 그 이름 앞에서 한 번, 존칭을 붙일 뻔했다.)"
    - when: "elvera.saw_mark"
      속마음: "(수정구 날, 내 마력에 스쳤던 붉은 실. 이 사람은 그걸 봤다. 그래서 나한테 묻는 걸까.)"
    - 속마음: "(이 질문은 원작에 없었다. 원작 바깥의 질문이다.)"
    - 속마음: "(어떻게 대답하느냐에 따라, 이 사람이 나를 보는 눈이 달라질 것이다.)"
  choices:
    - text: "\"마왕이요\""
      effects: ["affinity.elvera += 3"]
      lines:
        - 나: "마왕이요."
        - 엘베라: "……"
        - "엘베라가 분필을 내려다봤다. 잠깐."
        - 엘베라@슬픔: "…그렇죠. 다들 그렇게 대답해요."
        - 엘베라: "교과서에도 그렇게 적혀 있고, 성교회 설교에도 그렇게 나오죠. 틀린 대답은 아니에요."
        - "엘베라가 칠판지우개를 들어 그 이름을 지웠다. 천천히. 한 획씩."
        - "빗소리가 굵어졌다. 지워진 자리에 분필 가루가 희미하게 남았다."
        - 엘베라@웃음: "고마워요. 이상한 질문에 대답해 줘서. 이제 가 봐요. 비 맞지 말고."
        - 속마음: "(정답을 말했는데, 오답을 낸 기분이다.)"
    - text: "\"누군가의 오랜 친구\""
      art: cg_elvera_ignis
      when: "fs.F11.noticed"
      effects: ["elvera.shaken = 1", "trust.elvera += 10", "affinity.elvera += 6"]
      lines:
        - 나: "…누군가의 오랜 친구."
        - "그 말이 입 밖으로 나오는 순간, 엘베라의 손에서 분필이 떨어졌다."
        - "분필이 바닥에 부딪혀 두 동강 났다. 딱. 실습실에 그 소리만 울렸다."
        - "엘베라는 분필을 줍지 않았다. 나를 보고 있었다. 처음 보는 생물을 보듯."
        - 엘베라@놀람: "…재밌는 대답이네요."
        - 엘베라: "정말로. 재밌는."
        - "엘베라의 입술이 웃었다. 눈은 웃지 않았다. 오백 년 묵은 무언가가 그 눈 속에서 천천히 몸을 일으켰다."
        - 엘베라: "어디서 그런 생각을 했어요? 책? 소문? 아니면…"
        - "엘베라가 말을 멈췄다. 묻지 않기로 한 얼굴이었다."
        - 엘베라@진지: "그 대답, 다른 사람 앞에서는 하지 마세요."
        - 엘베라@진지: "학생을 위해서요. 성교회는 그런 대답을 아주 싫어하거든요. 아주, 오래전부터."
        - "엘베라가 허리를 숙여 부러진 분필 두 조각을 주웠다. 손바닥에 올려놓고, 한참 내려다봤다."
        - 속마음: "(존칭. 오래전 어떤 분. 막는 법을 가르친 스승. …조각들이 맞물리기 시작한다.)"
        - 속마음: "(서른일곱 개 엔딩 어디에도 없던 조각이다. 이건 진엔딩 쪽 퍼즐이다.)"
    - text: "\"잘 모르겠어요\""
      effects: ["affinity.elvera += 2"]
      lines:
        - 나: "…잘 모르겠어요."
        - 엘베라: "모르겠어요?"
        - 나: "다들 마왕이라고 하는데, 왜 마왕이 됐는지는 아무도 말을 안 하잖아요."
        - "엘베라가 눈을 깜빡였다. 그리고 천천히, 정말로 천천히 웃었다."
        - 엘베라: "그게 가장 정직한 대답일지도 모르겠네요."
        - 엘베라: "오백 년 동안 그렇게 대답한 학생은… 손가락으로 셀 수 있을 만큼이었어요."
        - "엘베라는 칠판의 이름을 지우지 않았다. 그대로 둔 채, 찻잔을 들고 나갔다."
        - "빗소리 속에서 그 이름만 칠판 구석에 남았다."
        - 속마음: "(왜 인간을 증오하는가. 원작은 그 질문을 끝까지 하지 않았다. 나도 3,000시간 동안 하지 않았다.)"

# ================================================================ 노엘
- id: bond_noel_1
  title: 노엘 — 모래 위의 룬
  art: cg_noel_runes
  on: [산책, 도시외출]
  priority: 2
  when: "time.year == 1 and affinity.noel >= 18"
  lines:
    - "해 질 녘 호숫가. 물이 노을을 받아 구릿빛으로 출렁인다."
    - "모래밭 끝, 뒤집힌 보트 옆에 누가 앉아 있다. 술병을 끼고."
    - "노엘 선배다. 오늘은 누워 있지 않다. 그게 더 이상하다."
    - 노엘@웃음: "어이, 1학년. 거기 서 봐. 아니, 앉아. 아니, 서."
    - 노엘: "…아무튼 이리 와."
    - "가까이 가자 술 냄새가 났다. 그런데 눈은 맑았다. 취한 척하는 눈."
    - "노엘이 술병을 모래에 꽂아 세웠다. 그리고 나뭇가지를 하나 주웠다."
    - 노엘: "너한테 빚이 있잖아. 그 외상."
    - 노엘: "빚지고는 못 사는 성격이라서. …거짓말이다. 빚지고 잘 산다. 몇 년째 그러고 있다."
    - 노엘@웃음: "근데 너한테 진 빚은 좀 찜찜해. 1학년한테 술값 얻어먹은 4학년. 체면이 말이 아니잖아."
    - "노엘이 나뭇가지로 모래 위에 낯선 글자를 그리기 시작했다."
    - "직선과 곡선. 각진 획. 교과서에서 본 어떤 문자와도 닮지 않았다."
    - "그런데 획을 그을 때마다, 모래 위에 희미한 빛이 남았다."
    - "노을보다 푸른 빛. 반딧불처럼 깜빡이다가, 획이 이어지면 같이 이어졌다."
    - 노엘@진지: "고대 룬이야."
    - 노엘: "학교에선 안 가르치지. 가르칠 줄 아는 놈이 없거든. 교수들도 사전 들고 더듬더듬 읽는 게 전부야."
    - 나: "선배는 어떻게 알아요?"
    - 노엘: "나? 꿈에서 배웠다니까. 룬은 원래 꿈에서 배우는 거야."
    - "노엘이 웃었다. 대답하지 않는 방법으로 웃음을 쓰는 사람이다."
    - "노엘의 손이 마지막 획을 그었다. 그 순간 일곱 개의 글자가 한꺼번에 빛났다. 모래 위에서 둥근 고리를 이루며."
    - "그 빛이 한 번 숨을 쉬듯 부풀었다가, 가라앉았다."
    - when: "fs.F09.noticed"
      속마음: "(술잔 바닥의 문장. 왕관 쓴 까마귀. 그리고 지금 이 룬.)"
    - 속마음: "(망국의 룬 마스터. 커뮤니티 루머로만 떠돌던 설정이다. 별 하나짜리 정보.)"
    - 속마음: "(원작에선 1학년 말에 사라지고 다시는 안 나온다. 루머가 사실인지 확인한 사람은 없다.)"
    - 속마음: "(…지금, 내가 확인하고 있다.)"
    - "노엘이 품에서 누렇게 바랜 종이 두 장을 꺼냈다. 그 위에 모래 위의 룬을 손가락으로 옮겨 그렸다."
    - "손가락이 지나간 자리에 룬이 타들어 가듯 새겨졌다. 종이는 타지 않았다."
    - 노엘@웃음: "외상 갚아 준 값이다. 부적 두 장. 다치면 찢어."
    - 노엘: "상처를 덮어 줄 거야. 완전히는 아니고, 걸어서 보건실 갈 만큼은."
    - 노엘: "아, 그리고 술 마시고 찢지 마라. 숙취는 안 고쳐 준다. 내가 해 봤어."
    - "부적을 받았다. 종이가 따뜻했다. 사람 체온 정도로."
    - 노엘: "이거 누구한테 보여 주지 마. 교수들한테 특히."
    - 노엘@진지: "…룬을 아는 사람이 아직 살아 있다는 걸, 알면 안 되는 사람들이 있거든."
    - "노엘이 말해 놓고 아차 싶은 얼굴을 했다. 그러고는 모래에 꽂아 둔 술병을 뽑아 들이켰다."
    - 노엘@웃음: "농담이다. 취했어. 잊어."
    - "노엘이 발로 모래 위의 룬을 쓱쓱 지웠다. 빛이 꺼졌다. 호수의 노을도 거의 꺼져 있었다."
    - 시스템: "아이템 획득 — 노엘의 룬 부적 ×2 (전투: 체력 25% 회복)"
    - 속마음: "(이 사람이 짐을 싸서 사라지는 날까지, 남은 시간이 많지 않다.)"
  effects: ["item.룬부적 += 2", "affinity.noel += 6", "trust.noel += 5"]

# ================================================================ 도로시
- id: bond_dorothy_1
  title: 도로시 — 시제품
  art: kitchen
  on: [식당, 아르바이트]
  priority: 2
  when: "time.year == 1 and affinity.dorothy >= 15 and found.dorothy"
  lines:
    - "점심 러시가 끝난 식당 주방. 거대한 화덕이 아직 열기를 뿜고 있다."
    - "설거지통에 쌓인 그릇들, 천장에 매달린 마늘 다발, 바닥을 굴러다니는 감자 한 알."
    - "그리고 주방 맨 구석, 화덕 옆 작은 불 위에 올려진 냄비 하나. 보글, 보글."
    - "냄비 앞에서 도로시가 국자 대신 유리 막대를 들고 서 있다. 앞치마엔 보라색 얼룩이 별자리처럼 흩어져 있다."
    - "날 발견하자 도로시의 눈이 반짝였다. 먹잇감을 발견한 고양이처럼."
    - 도로시@웃음: "왔다! 딱 맞춰 왔어요! 운명이에요, 이건!"
    - 나: "…운명?"
    - 도로시: "방금 완성됐거든요. 그리고 마침 시식할 사람이 필요했거든요. 이게 운명이 아니면 뭐예요."
    - "도로시가 냄비 뚜껑을 열었다. 보랏빛 김이 확 올라왔다."
    - "냄비 안에서 보라색 액체가 보글거린다. 기포가 하나 터질 때마다 작은 별가루 같은 게 반짝였다."
    - 도로시@웃음: "짠! 제 강장제 시제품이에요."
    - 도로시: "엄마 레시피에 제 비법을 섞었어요. 엄마 거는 감기 기운 있을 때 먹는 생강 수프인데요, 거기에 제가…"
    - "도로시가 손가락을 하나씩 접었다."
    - 도로시: "온실 뒤에서 캔 쑥, 시장에서 산 마른 버섯, 이건 비밀인데 연금과 쓰레기통에서 주운 마정석 가루 조금, 그리고 꿀."
    - 나: "…쓰레기통?"
    - 도로시@당황: "버린 거니까 괜찮아요! 버린 건 주인이 없는 거예요. 엄마도 남은 채소는 수프에 넣잖아요."
    - 도로시: "그리고 이게 핵심인데요."
    - "도로시가 목소리를 낮췄다. 주방 문 쪽을 힐끔 봤다. 아주머니는 없다."
    - 도로시: "끓일 때 시계 방향으로 일곱 번, 반대로 세 번 저어요. 그러면 색이 바뀌어요. 이유는 몰라요. 근데 바뀌어요."
    - when: "talent.마력감응"
      나레이션: "냄비에서 마력이 일렁인다. 요리가 아니다. 제대로 된 연금 반응이다. 교과서에 없는 순서로."
    - when: "perk.데이터마이너"
      속마음: "(연금술 서번트. 미구현 DLC 데이터의 잠재 재능. 교과서보다 손이 먼저 아는 타입이다.)"
    - 도로시@당황: "효과는… 시든 화분이 벌떡 일어났으니까 사람도 일어나겠죠? 아마?"
    - 도로시: "화분이 일어났으면 사람도 일어나야 공평하잖아요."
    - 속마음: "(그 논리는 연금술이 아니라 희망이다.)"
    - when: "fs.F16.noticed"
      속마음: "(시든 걸 되살리는 약. 화분에 통했다. …세계수에도 통할까.)"
    - "도로시가 국자로 한 숟갈씩 떠서 작은 병 두 개에 나눠 담았다. 코르크 마개를 손바닥으로 탕탕 쳐서 막았다."
    - "보라색 액체가 병 안에서 아직도 보글거린다. 마개를 막았는데도."
    - "코를 대 봤다. 각오했는데, 의외로 박하 향이다. 시원하고, 조금 달다."
    - 도로시@웃음: "냄새 좋죠? 그게 제일 오래 걸렸어요. 처음엔 양말 냄새 났거든요."
    - 도로시: "두 병이에요. 실습 때 다치면 마셔요."
    - 도로시: "그리고 효과 있으면 꼭 말해 줘요. 없어도 말해 줘요. 배가 아파도요."
    - 도로시: "그게 다 기록이니까요. 기록이 쌓이면 연금술이 된대요. 책에서 봤어요. 창문 너머로요."
    - "도로시가 앞치마 주머니에서 수첩을 꺼냈다. 손때 묻은 수첩. 페이지마다 그림과 숫자가 빼곡하다."
    - "맞춤법은 틀렸고, 비율은 정확했다."
