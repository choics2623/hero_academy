# 상점가와 인연의 선물 (1학년 1학기)
#
# 1) 상점가 (활동 '상점가', 3월~7월 방과후·주말)
#    가게 네 곳이 pool로 무작위 경쟁한다. 들른 가게는 1주 쉬었다가 다시 열린다.
#    진열은 달마다 바뀐다 (선택지 when: time.month). 이미 가진 장비는 진열대에서 빠진다 (item.X < 1).
#    한 번 들르면 하나를 산다. 장비를 사면 빈 칸에 바로 찬다.
#      shop_general  잡화점 「작은 종」   소모품           3월 3종 → 7월 5종 (기사단 보급 강장제)
#      shop_tailor   재봉집 「바늘과 실」  옷·모자·신       봄 기본 → 축제철 멋 → 장마철 검은 옷·로브
#      shop_smith    대장간 골목         무기·장화·갑옷    첫 무기 → 기사단 중고 → 무투대회 철 상급품
#      shop_antique  골동품 노점         장신구, 예복      떠돌이 노점이라 달마다 물건이 갈린다
# 2) 인연의 선물 (gift_*): 인연이 깊어지면 그 사람이 장비를 하나 건넨다. on: auto, free: true.
#    선물 장비는 상점에서 팔지 않는다. 칸이 차 있으면 가방에 들어간다 (대사가 알아챈다).

# ================================================================ 잡화점
- id: shop_general
  title: 잡화점 「작은 종」
  on: 상점가
  pool: true
  repeat: true
  cooldown: 1
  lines:
    - 나레이션:
        - "상점가 초입, 처마가 낮은 잡화점. 문을 밀자 머리 위에서 작은 종이 딸랑 울렸다."
        - { when: "time.month == 5", text: "상점가 초입의 잡화점. 축제 철이라 처마에 색종이 고리가 걸렸다. 문을 밀자 작은 종이 딸랑 울렸다." }
        - { when: "time.month == 6", text: "장마에 젖은 상점가. 잡화점 처마 끝에서 빗물이 줄지어 떨어진다. 종이 젖은 소리로 딸랑 울렸다." }
        - { when: "time.month == 7", text: "한여름 상점가. 잡화점 문간에 뿌린 물이 금세 말라 간다. 종이 졸린 소리로 딸랑 울렸다." }
    - "선반이 천장까지 닿아 있다. 말린 약초 다발, 색색의 병, 양초, 실타래, 이름 모를 뿌리."
    - "계피와 밀랍과 먼지 냄새가 한데 섞여 있다. 숨을 들이쉬면 재채기가 날락 말락 한다."
    - "계산대 뒤에서 주인아주머니가 장부를 덮고 일어섰다. 팔뚝에 약초 가루가 하얗게 묻어 있다."
    - 주인@웃음:
        - "어머, 또 왔네. 단골 얼굴은 종소리만 들어도 알아요."
        - { when: "fired.shop_general <= 1", text: "어서 와요! 아카데미 학생이구나. 교복 보면 알지. 신입생?" }
    - when: "talent.혐오스러운분위기"
      나레이션: "아주머니가 나를 보고 반 걸음 물러섰다가, 장사꾼의 웃음을 억지로 끌어올렸다."
    - 주인: "학생들은 다 비슷한 걸 찾아. 잠 못 자서 오고, 시험 때문에 오고, 실습에서 다쳐서 오고."
    - 주인@웃음: "그러니까 우리 가게 선반이 학교 성적표야. 뭐가 팔리는지 보면 그 주에 학교에서 무슨 일 있었는지 다 알지."
    - 주인:
        - "삼월엔 피로회복차가 제일 잘 나가. 신입생들 얼굴이 다들 누렇거든."
        - { when: "time.month == 4", text: "사월엔 연고가 나가. 실기 수업 시작했지? 무릎 까진 애들이 줄을 서." }
        - { when: "time.month == 5", text: "미궁 실습 간다며? 강장제랑 연고가 동났다가 겨우 들어왔어. 시험 앞둔 애들은 향을 찾고." }
        - { when: "time.month == 6", text: "시험 기간이지? 진정 허브가 동이 나. 향 피워 놓고 자는 애들도 반이고." }
        - { when: "time.month == 7", text: "무투대회 철이라 강장제가 불티나. 학교가 애들을 너무 굴려, 아주." }
    - when: "time.month >= 6"
      주인@진지: "…그리고 이건 큰 소리로 말하면 안 되는데. 계산대 밑에 좋은 게 몇 병 있어."
    - when: "(found.dorothy or affinity.dorothy > 0) and time.roll < 0.4"
      나레이션: "약초 선반 앞에서 주황색 단발이 마른 버섯 봉지를 하나씩 코에 대 보고 있다. 도로시다. 나를 보더니 검지를 입술에 댔다."
    - when: "(found.dorothy or affinity.dorothy > 0) and time.roll < 0.4"
      속마음: "(엄마 몰래 실험 재료를 사러 온 모양이다. 못 본 걸로 하자.)"
    - when: "talent.대식가"
      나레이션: "계산대 옆 유리병에 꿀 생강 사탕이 가득하다. 눈을 뗄 수가 없다."
    - when: "talent.대식가"
      주인@웃음: "그건 파는 거 아니고 손님 주는 거야. 하나만. …알았어, 두 개."
    - 속마음: "(원작의 잡화점은 '회복 아이템' 탭이었다. 가격은 고정, 재고는 무한, 주인은 일러스트 한 장.)"
    - 속마음: "(진짜 잡화점 주인은 학생들 얼굴색으로 학사 일정을 맞힌다.)"
    - 속마음: "(주머니 사정을 생각하자. 지금 제일 급한 게 뭐지?)"
  choices:
    - text: 피로회복차 한 봉지 — 은화 5 (피로 -20)
      requires: "money >= 5"
      effects: ["money -= 5", "item.피로회복차 += 1"]
      lines:
        - 주인: "보리랑 대추. 볶은 건 오늘 아침이야. 냄새 맡아 봐."
        - "봉지를 코에 댔다. 구수한 냄새가 코끝에서 뒷머리까지 번졌다."
        - 주인@웃음: "일어나서 마셔요. 자기 전에 마시면 밤새 화장실 가느라 못 자."
        - 속마음: "(공략 위키에 없던 정보다. 피로회복차의 숨은 패널티, 야간 화장실.)"
    - text: 진정 허브 묶음 — 은화 6 (스트레스 -15)
      requires: "money >= 6"
      effects: ["money -= 6", "item.진정허브 += 1"]
      lines:
        - 주인: "라벤더랑 레몬밤. 베개 옆에 두면 돼. 먹는 거 아니야. 작년에 먹은 학생이 있었어."
        - "다발을 받아 들었다. 보랏빛 꽃대 사이에서 레몬 껍질 같은 냄새가 올라온다."
        - 주인@진지: "시험 기간엔 두 다발씩 사 가는 애들도 있어. 그런 애들은 꼭 하나를 친구 주더라."
        - "가방에 넣자 가방 안이 금세 향기로 찼다."
    - text: 강장제 — 은화 12 (전투 중 체력 회복)
      requires: "money >= 12"
      effects: ["money -= 12", "item.강장제 += 1"]
      lines:
        - 주인: "약재상 거리에선 열다섯 받지? 우린 열둘. 대신 흥정은 없어."
        - 주인: "쓴 거 알지? 코 막고 한 번에. 혀에 오래 두면 하루 종일 쓴맛이 따라다녀."
        - "갈색 병을 흔들자 바닥에 가라앉은 박하 잎이 빙글 돌았다."
        - when: "fired.town_haggle"
          속마음: "(곰 쓸개 강장제랑 똑같은 박하 잎이다. 그 떠돌이 상인, 여기서 떼어 갔구나.)"
        - 주인@웃음: "다치기 전에 사 두는 학생이 오래 살아. 다치고 나서 사러 오는 학생은 다리를 절면서 오거든."
    - text: 상처 연고 — 은화 8 (전투 중 체력 회복 · 피로 -8)
      when: "time.month >= 4 and time.month <= 5"
      requires: "money >= 8"
      effects: ["money -= 8", "item.상처연고 += 1"]
      lines:
        - 주인: "쑥이랑 돼지기름. 냄새는 지독한데 잘 들어."
        - "뚜껑을 열자 초록 연고에서 쑥 냄새가 코를 찔렀다. 눈물이 찔끔 났다."
        - 주인@웃음: "실습 끝나고 바르면 다음 날 덜 쑤셔. 바르고 바로 누우면 이불에 냄새 배니까 조심하고."
    - text: 집중의 향 — 은화 14 (지성·의지 조금)
      when: "time.month >= 5"
      requires: "money >= 14"
      effects: ["money -= 14", "item.집중의향 += 1"]
      lines:
        - 주인: "송진이랑 박하, 그리고 마정석 가루 아주 조금. 태우면 머리 뒤가 시원해져."
        - 주인@진지: "근데 향이 공부를 대신 해 주진 않아. 향 피워 놓고 자는 애들이 반이야."
        - "향 세 개를 종이에 싸 받았다. 손끝에 송진 냄새가 오래 남았다."
        - 속마음: "(원작의 '집중의 향'은 지성 +1짜리 소모품이었다. 실제로는 반이 피워 놓고 잔단다.)"
    - text: 기사단 보급 강장제 — 은화 28 (전투 중 체력 크게 회복)
      when: "time.month >= 6"
      requires: "money >= 28"
      effects: ["money -= 28", "item.기사단강장제 += 1"]
      lines:
        - "아주머니가 계산대 밑에서 은빛 병을 꺼냈다. 병목의 황실 기사단 봉인이 반쯤 긁혀 있다."
        - 주인@진지: "어디서 왔는지는 묻지 마요. 나도 안 물어봤으니까."
        - 주인: "보통 강장제 세 병 몫이야. 진짜 위험할 때 마셔. 아깝다고 아끼다 죽지 말고."
        - 속마음: "(기사단 보급품이 뒷문으로 흘러나오는 세상. 원작에서 장벽 수비대는 보급이 모자라 무너졌다.)"
        - 속마음: "(설마 이 병 하나도 그 조각일까. …지금은 그냥 고맙게 받자.)"
    - text: 구경만 하고 나간다
      lines:
        - 주인@웃음: "구경도 손님이야. 다음엔 지갑 들고 와요."
        - "문을 나서자 종이 다시 딸랑 울렸다. 들어올 때보다 조금 아쉬운 소리였다."

# ================================================================ 재봉집
- id: shop_tailor
  title: 재봉집 「바늘과 실」
  on: 상점가
  pool: true
  repeat: true
  cooldown: 1
  lines:
    - 나레이션:
        - "상점가 중간, 창에 천 견본이 주렁주렁 걸린 재봉집. 문을 열자 가위 소리가 사각사각 났다."
        - { when: "time.month == 5", text: "재봉집 창에 축제용 리본과 얇은 여름 천이 걸리기 시작했다. 문을 열자 가위 소리가 사각사각 났다." }
        - { when: "time.month == 6", text: "재봉집 문간에 젖은 우산이 셋 꽂혀 있다. 빗소리 사이로 가위 소리가 사각사각 났다." }
        - { when: "time.month == 7", text: "재봉집 안은 다리미 화로 때문에 한증막 같다. 그 열기 속에서도 가위 소리는 지치지 않는다." }
    - "벽마다 천 두루마리가 기대 서 있다. 무명, 모직, 비단, 무두질한 가죽."
    - "작업대 앞에 허리가 굽은 할머니가 앉아 있다. 입에 시침핀을 대여섯 개 문 채로."
    - 노파:
        - "(핀을 문 채로) 또 왔네. 거기 서. 그새 어깨가 넓어졌나 보자."
        - { when: "fired.shop_tailor <= 1", text: "(핀을 문 채로) 어서 와. 거기 서. 움직이지 말고." }
    - "할머니가 핀을 하나씩 뽑아 바늘꽂이에 꽂더니, 줄자를 휙 던져 내 어깨에 걸었다."
    - 노파: "어깨, 소매, 허리. 다 쟀다. 옷은 사람보다 정직해. 얼마나 굶었는지, 얼마나 굴렀는지 다 보여."
    - when: "stat.근력 >= 22 or stat.체질 >= 22"
      노파: "…어깨랑 소매통이 단단하네. 훈련장 열심히 다니는구먼."
    - when: "talent.키작음"
      노파@웃음: "기성복은 다 길겠네. 걱정 마. 단은 공짜로 줄여 줄게."
    - when: "talent.거구"
      노파@당황: "…천이 두 배 들겠네. 값은 그대로야. 내 손해지 뭐."
    - when: "talent.귀공자의품격 or origin == '몰락귀족'"
      노파: "목 세우는 거 보니 귀한 집에서 컸구먼. 기성복을 입혀도 맞춤처럼 보이겠어."
    - when: "equip.한벌옷 == '사제복'"
      노파: "그 사제복, 내가 지은 거야. 뒤 단추 하나 짝짝이인 거 보이지? 그래서 싸게 판 거고."
    - when: "equip.윗옷 == '검은망토'"
      노파@진지: "그 망토 입고 밤에 쏘다니지 마. 경비병한테 붙잡혀도 내가 판 거라고 하지 말고."
    - when: "equip.윗옷 == '도로시앞치마'"
      노파@웃음: "주머니 열두 개짜리 앞치마? 바느질은 엉망인데 정성은 대단하네. 누가 지었는지 몰라도."
    - 노파:
        - "봄엔 기본부터야. 셔츠 한 장, 바지 한 벌. 기본이 후줄근하면 뭘 걸쳐도 후줄근해."
        - { when: "time.month == 5", text: "축제 달이라 멋 부리는 것들이 들어왔어. 베레모, 광낸 구두. 학생 지갑이 제일 헐거워지는 달이지." }
        - { when: "time.month == 6", text: "장마철엔 검은 옷이 잘 나가. 얼룩이 안 보이거든. 마탑에서 주문한 로브도 남는 걸 몇 벌 걸어 놨어." }
        - { when: "time.month == 7", text: "여름이야. 별무늬 고깔이 들어왔어. 마법과 애들은 더워 죽겠다면서도 꼭 그걸 쓰더라." }
    - when: "affinity.mirabel >= 10 and time.roll < 0.4"
      나레이션: "창가 진열대 앞에서 미라벨이 진홍 비단 두루마리를 오래 보고 있었다. 눈이 마주치자 아무것도 안 본 척 가게를 나갔다."
    - 속마음: "(원작의 재봉집은 '외형 변경' 메뉴였다. 능력치는 하나도 안 올랐다.)"
    - 속마음: "(이 세계에선 옷이 사람을 조금 바꾼다. 적어도 이 할머니는 그렇게 믿는다.)"
    - 속마음: "(뭘 살까. 줄자가 아직 어깨에 걸려 있다.)"
  choices:
    - text: 풀 먹인 무명 셔츠 — 은화 7 (설득 · 체력)
      when: "time.month <= 4 and item.무명셔츠 < 1"
      requires: "money >= 7"
      effects: ["money -= 7", "item.무명셔츠 += 1"]
      lines:
        - 노파: "풀은 내가 직접 쒔어. 쌀풀이야. 비 맞으면 흐물흐물해지니까 조심하고."
        - "셔츠를 몸에 대 봤다. 깃이 빳빳하게 선다. 등이 저절로 펴졌다."
        - 노파@웃음: "봐. 옷이 사람을 세워. 사람이 옷을 세우는 날까진 옷한테 기대."
    - text: 무릎 기운 면바지 — 은화 6 (인내 · 체력)
      when: "time.month == 3 and item.면바지 < 1"
      requires: "money >= 6"
      effects: ["money -= 6", "item.면바지 += 1"]
      lines:
        - 노파: "무릎은 미리 두 겹 대 놨어. 학생들은 꼭 무릎부터 해 먹거든."
        - "바지를 받아 들었다. 무릎이 두툼하다. 넘어질 일이 많을 거라는 걸 할머니도 아는 모양이다."
        - 속마음: "(이 할머니, 아카데미 커리큘럼을 나보다 잘 안다.)"
    - text: 가죽 머리띠 — 은화 8 (기민·완력 · 회피)
      when: "time.month <= 4 and item.가죽머리띠 < 1"
      requires: "money >= 8"
      effects: ["money -= 8", "item.가죽머리띠 += 1"]
      lines:
        - 노파: "훈련장 애들이 사 가는 거야. 이마에 땀 흐르면 눈 감잖아. 눈 감으면 맞고."
        - "머리띠를 이마에 질끈 묶었다. 시야 위쪽이 단정하게 정리되는 느낌이다."
        - 노파@웃음: "제법 검 좀 쓰는 얼굴이 되네. 얼굴만."
    - text: 순례자 샌들 — 은화 7 (인내·신성 · 체력)
      when: "time.month == 3 and item.순례자샌들 < 1"
      requires: "money >= 7"
      effects: ["money -= 7", "item.순례자샌들 += 1"]
      lines:
        - 노파: "성당 앞 순례객들이 신는 거야. 밑창에 짚을 덧대서 오래 걸어도 발바닥이 안 타."
        - "샌들 끈을 묶어 봤다. 가볍다. 발가락 사이로 바람이 지나간다."
        - 노파@진지: "성지까지 걸어간 사람들은 다 이걸 신었대. 돌아온 사람은 반이지만."
        - 속마음: "(마지막 말은 못 들은 걸로 하자.)"
    - text: 여행자의 기름 먹인 외투 — 은화 15 (인내·교감 · 한벌옷)
      when: "time.month <= 4 and item.여행자외투 < 1"
      requires: "money >= 15"
      effects: ["money -= 15", "item.여행자외투 += 1"]
      lines:
        - 노파: "밀랍이랑 기름을 열 번 먹였어. 비가 구슬처럼 굴러떨어져."
        - "외투를 걸쳤다. 무릎까지 내려온다. 소매 끝에서 마른 풀과 오래된 길 냄새가 났다."
        - 노파: "북쪽 상인이 팔고 간 거야. 그 사람은 이걸 입고 산을 셋 넘었대. 학생은 몇 개 넘을지 몰라도."
    - text: 가죽 덧댄 승마 바지 — 은화 18 (기민 · 회피)
      when: "time.month >= 4 and time.month <= 5 and item.승마바지 < 1"
      requires: "money >= 18"
      effects: ["money -= 18", "item.승마바지 += 1"]
      lines:
        - 노파: "기사과 애들이 말 탈 때 입는 거. 근데 요즘은 뛰는 애들이 더 사 가."
        - "허벅지 안쪽에 덧댄 가죽이 매끈하다. 다리를 굽혀 봐도 천이 당기지 않는다."
        - 노파@웃음: "도망칠 때도 좋아. 펄럭이지 않으니까 안 잡혀."
    - text: 사냥꾼 가죽 조끼 — 은화 20 (교감·기민 · 회피)
      when: "time.month >= 4 and time.month <= 5 and item.사냥꾼조끼 < 1"
      requires: "money >= 20"
      effects: ["money -= 20", "item.사냥꾼조끼 += 1"]
      lines:
        - 노파: "숲 사람들이 입는 사슴 가죽이야. 사람 냄새를 덮어 줘서 짐승한테 다가가도 안 도망간대."
        - "조끼에서 솔잎 냄새가 났다. 주머니에 손을 넣자 마른 풀씨가 손끝에 묻어 나왔다."
        - when: "affinity.liana >= 10"
          속마음: "(리아나가 보면 좋아하겠다. 아니면 '사슴한테 미안하잖아' 하고 볼을 부풀리거나.)"
        - 노파: "풀씨는 덤이야. 털어도 털어도 또 나와. 숲이 원래 그렇게 생겨먹었어."
    - text: 깃털 베레모 — 은화 22 (설득·기만 · 전투 설득)
      when: "time.month >= 5 and time.month <= 6 and item.깃털베레모 < 1"
      requires: "money >= 22"
      effects: ["money -= 22", "item.깃털베레모 += 1"]
      lines:
        - 노파: "자주색. 꿩 깃털. 비스듬히 써. 똑바로 쓰면 촌스러워."
        - "베레모를 비스듬히 눌러썼다. 할머니가 손가락으로 각도를 두 번 고쳐 줬다."
        - 노파@웃음: "됐다. 이제 거짓말을 해도 다들 반쯤은 믿겠네."
        - 속마음: "(칭찬인지 경고인지 모르겠다.)"
    - text: 광낸 가죽 구두 — 은화 20 (설득·기만 · 전투 설득)
      when: "(time.month == 5 or time.month == 7) and item.광낸구두 < 1"
      requires: "money >= 20"
      effects: ["money -= 20", "item.광낸구두 += 1"]
      lines:
        - 노파: "무도회용이야. 굽 소리가 또각 나야 사람들이 돌아봐."
        - "구두에 얼굴이 비쳤다. 할머니가 천에 침을 묻혀 한 번 더 문질렀다. …침이었다."
        - 노파@진지: "구두는 매일 닦아. 구두가 더러우면 말이 아무리 좋아도 아무도 안 믿어."
    - text: 수련 사제복 — 은화 32 (신성·정신력 · 체력, 한벌옷)
      when: "time.month >= 5 and time.month <= 6 and item.사제복 < 1"
      requires: "money >= 32"
      effects: ["money -= 32", "item.사제복 += 1"]
      lines:
        - 노파: "성당에서 주문한 것 중에 단추를 잘못 단 거야. 뒤 단추 하나가 짝짝이지. 그래서 싸."
        - "흰 사제복을 받아 들었다. 밀랍 냄새가 배어 있다. 들고만 있어도 숨이 느려진다."
        - when: "talent.성흔"
          나레이션: "소매에 손을 넣는 순간, 손등이 아주 잠깐 따뜻해졌다."
        - 노파@진지: "입고 나쁜 짓 하지 마. 옷이 다 기억해."
    - text: 소리 없는 검은 바지 — 은화 20 (은밀 · 회피)
      when: "time.month >= 6 and item.검은천바지 < 1"
      requires: "money >= 20"
      effects: ["money -= 20", "item.검은천바지 += 1"]
      lines:
        - 노파: "천을 열두 번 빨아 길들였어. 무릎을 굽혀도 사각 소리가 안 나."
        - "바지를 손으로 비벼 봤다. 정말로 아무 소리도 안 난다. 손바닥만 부드럽다."
        - 노파@진지: "뭐에 쓸 건지는 안 물을게. 통금 넘는 데 쓰는 거면, 사감한텐 내가 판 거 아니라고 해."
    - text: 검은 후드 망토 — 은화 28 (은밀·기만 · 회피)
      when: "time.month >= 6 and item.검은망토 < 1"
      requires: "money >= 28"
      effects: ["money -= 28", "item.검은망토 += 1"]
      lines:
        - "할머니가 작업대 밑에서 검은 망토를 꺼냈다. 등불 빛이 망토에 닿자마자 먹혀 들어갔다."
        - 노파: "모직에 숯물을 세 번 들였어. 밤에 입으면 그림자랑 구분이 안 돼."
        - 노파@진지: "원래는 팔기 싫었는데. 장마철엔 검은 거 아니면 안 팔리니까."
        - 속마음: "(원작에서 이런 망토는 뒷골목 상점 한정이었다. 재봉집 할머니가 숯물을 들이고 있었을 줄이야.)"
    - text: 견습 마법사 로브 — 은화 35 (마법·학식 · 마법 공격·마나, 한벌옷)
      when: "time.month >= 6 and item.마법사로브 < 1"
      requires: "money >= 35"
      effects: ["money -= 35", "item.마법사로브 += 1"]
      lines:
        - 노파: "마탑 주문분에서 남은 거야. 소매 안쪽 은실 보이지? 술식 보조선이래. 난 그냥 무늬인 줄 알았어."
        - "로브를 걸치고 손을 들었다. 소매 안쪽 은실이 잠깐 빛을 머금었다가 꺼졌다."
        - when: "talent.마나탱크 or talent.섬세한제어"
          나레이션: "아니, 꺼지지 않았다. 은실을 따라 빛이 손목에서 팔꿈치까지 천천히 흘렀다."
        - when: "talent.마나탱크 or talent.섬세한제어"
          노파@놀람: "…저게 저렇게 빛나는 건 처음 보네. 무늬가 아니었구먼."
        - 노파: "소매 길이는 맞네. 마법사들은 소매가 길면 불붙어. 짧으면 팔이 타고."
    - text: 별무늬 고깔모자 — 은화 26 (마법·학식 · 마나)
      when: "time.month == 7 and item.별무늬고깔 < 1"
      requires: "money >= 26"
      effects: ["money -= 26", "item.별무늬고깔 += 1"]
      lines:
        - 노파: "마법과 애들은 한여름에도 이걸 써. 머리에 마력이 고인다나."
        - "고깔을 써 봤다. 끝이 저절로 한쪽으로 꺾였다. 할머니가 혀를 찼다."
        - 노파@웃음: "꺾이는 쪽에 마력이 고인대. 학생은 왼쪽이네. 왼쪽 사람들은 고집이 세지."
    - text: 구경만 하고 나온다
      lines:
        - 노파: "옷은 사는 날보다 입는 날이 중요해. 사고 싶을 때 와."
        - "줄자가 어깨에서 스르륵 걷혔다. 문을 나서도 가위 소리가 등 뒤를 따라왔다."

# ================================================================ 대장간 골목
- id: shop_smith
  title: 대장간 골목
  art: forge
  on: 상점가
  pool: true
  repeat: true
  cooldown: 1
  lines:
    - 나레이션:
        - "상점가 끝에서 골목 하나를 꺾자 공기가 달라졌다. 쇠 냄새, 숯 냄새, 그리고 망치 소리."
        - { when: "time.month == 6", text: "대장간 골목은 비가 와도 화로가 꺼지지 않는다. 처마 밑으로 김이 피어오르고, 망치 소리가 빗소리를 누른다." }
        - { when: "time.month == 7", text: "한여름의 대장간 골목. 골목 전체가 화로 같다. 숨을 쉬면 쇳가루 맛이 난다." }
    - "골목 양쪽으로 무기와 갑옷 가게가 늘어서 있다. 처마마다 칼, 창, 투구, 장화가 매달려 흔들린다."
    - "그중 한 가게 앞, 앞치마를 두른 청년이 진열대를 닦다 말고 손을 흔들었다."
    - 점원@웃음:
        - "또 오셨네요! 저번 거 잘 쓰고 계세요? 부러지면 말씀하세요. 사부님이 고쳐요. 유료로."
        - { when: "fired.shop_smith <= 1", text: "어서 오세요! 아카데미 학생이죠? 학생 할인은 없는데요, 학생 친절은 있어요!" }
    - "청년의 팔뚝에 화상 자국이 점점이 박혀 있다. 손이 잠시도 가만있지 않는다."
    - 점원: "저는 견습이라 망치는 못 잡고 팔기만 해요. 사부님 말로는 파는 것도 수련이래요."
    - 점원@웃음: "물건을 알아야 팔 수 있대서 다 써 봤어요. 다 써 봐서 다 다쳤어요."
    - when: "talent.천생신력"
      점원@당황: "아, 손님. 진열품은 살살 들어 주세요. 저번에 어떤 분이 창 자루를 그냥 쥐었는데 휘었거든요."
    - when: "equip.무기 == '브루노목검'"
      점원@놀람: "잠깐, 그 목검 좀 봐도 돼요? …손잡이 쇠 테 망치 자국이 정직하네요. 망설인 자국이 하나도 없어요."
    - when: "equip.무기 == '브루노목검'"
      점원: "남부 시골 대장간 솜씨 같은데요. 사부님이 보면 이 사람 데려오라고 할 거예요."
    - when: "equip.신발 == '브루노장화'"
      점원: "그 장화 쇠코는 누가 쳤어요? 학생 솜씨치곤 너무 반듯한데요. 비늘 자국이 고르게 박혔어요."
    - when: "equip.윗옷 == '견습기사흉갑'"
      점원@웃음: "흉갑 잘 맞네요! 그 칼자국은 원래 있던 거예요. 제가 낸 거 아니에요."
    - when: "affinity.bruno >= 10 and time.roll < 0.4"
      나레이션: "골목 저쪽 대장간 앞에 커다란 등이 쪼그려 앉아 있다. 브루노가 남의 가게 모루를 넋 놓고 구경하고 있다."
    - 점원:
        - "신입생 철엔 다들 첫 무기를 찾아요. 비싼 거 말고 손에 맞는 거부터 사세요. 사부님 말이에요."
        - { when: "time.month == 5", text: "이번 달엔 기사단 훈련소에서 흉갑이랑 철모가 좀 나왔어요. 새로 맞추면서 헌 걸 내놨대요. 미궁 실습 철이라 금방 나갈 거예요." }
        - { when: "time.month == 6", text: "장마라 녹 슨다고 다들 안 사요. 그래서 좋은 게 남아 있어요. 마정석 지팡이요. 지팡이는 녹이 안 슬거든요." }
        - { when: "time.month == 7", text: "무투대회 철이라 좋은 건 다 꺼내 놨어요. 기사단 훈련용 장검, 사슬 셔츠. 저도 아직 못 써 봤어요. 비싸서." }
    - 속마음: "(원작 무기 상점은 수치표였다. 공격력 +2, 가격 28.)"
    - 속마음: "(이 세계에선 견습생이 다 써 보고, 다 다친 다음에 판다.)"
    - 속마음: "(뭘 쥐어 볼까.)"
  choices:
    - text: 참나무 지팡이 — 은화 12 (마법 · 마법 공격)
      when: "time.month <= 4 and item.참나무지팡이 < 1"
      requires: "money >= 12"
      effects: ["money -= 12", "item.참나무지팡이 += 1"]
      lines:
        - 점원: "목공방 아저씨가 깎은 거예요. 옹이를 일부러 남겼대요. 옹이에 마력이 고인다고."
        - "지팡이를 쥐었다. 손때 묻은 자리가 손바닥에 꼭 맞는다. 옹이 근처가 미지근하다."
        - 점원@웃음: "저도 휘둘러 봤는데 마력이 없어서 그냥 몽둥이였어요. 그래도 몽둥이로도 좋아요."
    - text: 사냥용 단검 — 은화 15 (은밀·기민 · 공격·회피)
      when: "time.month <= 4 and item.사냥용단검 < 1"
      requires: "money >= 15"
      effects: ["money -= 15", "item.사냥용단검 += 1"]
      lines:
        - 점원: "외날이라 칼집에서 뽑을 때 소리가 안 나요. 사냥꾼들이 짐승 깨우지 말라고 이렇게 만든대요."
        - "단검을 뽑아 봤다. 정말로 쉭, 하는 소리조차 없다."
        - 점원@진지: "아카데미에서 날 선 거 들고 다니면 혼나죠? 칼집째로 차세요. 칼집이 반은 무기예요."
    - text: 가죽 장화 — 은화 12 (은밀·기민 · 방어)
      when: "time.month <= 4 and item.가죽장화 < 1"
      requires: "money >= 12"
      effects: ["money -= 12", "item.가죽장화 += 1"]
      lines:
        - 점원: "옆집 구둣방 거예요. 밑창을 두 번 기워서 발소리가 작아요."
        - "장화를 신고 가게 바닥을 걸어 봤다. 돌바닥인데도 발소리가 거의 안 난다."
        - 점원@웃음: "제가 이거 신고 사부님 몰래 간식 훔쳐 먹었는데 안 들켰어요. 품질 보증이에요."
    - text: 대장장이 작업 바지 — 은화 14 (완력·손재주 · 방어)
      when: "time.month <= 5 and item.작업바지 < 1"
      requires: "money >= 14"
      effects: ["money -= 14", "item.작업바지 += 1"]
      lines:
        - 점원: "제가 입는 거랑 같은 거예요. 불티가 튀어도 구멍이 안 나요. 그을리기만 해요."
        - "두꺼운 범포 바지다. 허리 고리에 망치든 뭐든 걸 수 있을 것 같다."
        - 점원: "처음엔 뻣뻣해요. 한 달 입으면 몸에 붙고, 두 달 입으면 바지가 사람을 입어요."
    - text: 연습용 세이버 — 은화 28 (기민·완력 · 공격)
      when: "time.month >= 4 and time.month != 6 and item.연습용세이버 < 1"
      requires: "money >= 28"
      effects: ["money -= 28", "item.연습용세이버 += 1"]
      lines:
        - "점원이 진열대 위에서 가느다란 세이버를 내렸다. 날은 죽였는데, 쥐는 순간 손목이 저절로 꺾였다."
        - 점원: "귀족 자제들 연습용이에요. 가볍고 빨라요. 근데 강타를 정면으로 받으면 휘니까 조심하세요."
        - "허공에 한 번 그어 봤다. 공기가 짧게 울었다."
        - when: "affinity.kaiden >= 15"
          속마음: "(카이든의 연습검이랑 같은 계열이다. 저쪽 손잡이엔 황실 문장이 박혀 있겠지만.)"
    - text: 사냥꾼 장화 — 은화 24 (기민·교감 · 회피)
      when: "time.month >= 5 and time.month <= 6 and item.사냥꾼장화 < 1"
      requires: "money >= 24"
      effects: ["money -= 24", "item.사냥꾼장화 += 1"]
      lines:
        - 점원: "사슴 가죽에 끈을 종아리까지 감아요. 젖은 낙엽 위에서도 안 미끄러져요."
        - "끈을 감아올렸다. 발목이 단단히 잡힌다. 숲길을 달려도 될 것 같다."
        - 점원@웃음: "엘프분들도 사 가요. 원래 맨발이 편하다던데, 요즘은 돌길이 많아서요."
    - text: 견습 기사 철모 — 은화 24 (위압·인내 · 방어·체력)
      when: "time.month >= 5 and time.month <= 6 and item.견습철모 < 1"
      requires: "money >= 24"
      effects: ["money -= 24", "item.견습철모 += 1"]
      lines:
        - 점원: "기사단 훈련소에서 나온 거예요. 안에 펠트를 덧대서 맞아도 머리가 안 울려요. 조금만 울려요."
        - "철모를 썼다. 바깥 소리가 한 겹 멀어진다. 대신 내 숨소리가 크게 들린다."
        - 점원: "쓰면 좀 용감해진대요. 앞이 좁아져서 무서운 게 덜 보이거든요."
    - text: 견습 기사 흉갑 — 은화 34 (인내·완력 · 방어·체력)
      when: "time.month >= 5 and time.month <= 6 and item.견습기사흉갑 < 1"
      requires: "money >= 34"
      effects: ["money -= 34", "item.견습기사흉갑 += 1"]
      lines:
        - "점원이 흉갑을 두 팔로 안아 내왔다. 왼쪽 가슴에 깊은 칼자국이 하나 나 있다."
        - 점원@진지: "이거, 막아 낸 자국이에요. 뚫린 자국이 아니라. 그래서 사부님이 안 펴고 그냥 뒀어요."
        - 점원: "이걸 입었던 견습 기사는 살았대요. 운 좋은 흉갑이에요."
        - "흉갑을 둘렀다. 무겁다. 그런데 가슴 앞에 벽이 하나 생긴 것 같아서, 숨이 이상하게 편하다."
    - text: 징 박은 군화 — 은화 30 (위압·완력 · 공격·방어)
      when: "time.month >= 6 and item.징박은군화 < 1"
      requires: "money >= 30"
      effects: ["money -= 30", "item.징박은군화 += 1"]
      lines:
        - 점원: "밑창에 쇠징을 박았어요. 걸을 때마다 돌바닥이 울어요. 상대가 그 소리부터 듣죠."
        - "군화를 신고 한 발 굴렀다. 쾅. 진열대의 투구들이 일제히 떨었다."
        - 점원@당황: "아, 가게 안에선 살살요. 사부님 낮잠 주무세요."
    - text: 마정석 박힌 지팡이 — 은화 58 (마법 · 마법 공격·마나)
      when: "time.month >= 6 and item.마정석지팡이 < 1"
      requires: "money >= 58"
      effects: ["money -= 58", "item.마정석지팡이 += 1"]
      lines:
        - "점원이 진열장 열쇠를 꺼냈다. 유리 안에 흑단 지팡이가 누워 있다. 끝에 주먹만 한 푸른 돌이 물려 있다."
        - 점원@진지: "이 골목에서 제일 비싼 거예요. 장마철 아니었으면 벌써 팔렸을 거예요."
        - "지팡이를 쥐자 마정석 속에서 푸른 안개가 천천히 돌기 시작했다. 손바닥에 맥박 같은 떨림이 전해진다."
        - when: "stat.마력량 >= 25 or talent.마나탱크"
          점원@놀람: "어, 어? 돌이 이렇게 빨리 도는 건 처음 봐요. 손님 마력이 엄청 많은가 봐요."
        - 속마음: "(원작 1학년 상점의 최상급 지팡이. 그땐 이걸 사려고 아르바이트 버튼을 서른 번 눌렀다.)"
    - text: 기사단 훈련용 장검 — 은화 52 (완력·위압 · 공격·방어)
      when: "time.month == 7 and item.훈련용장검 < 1"
      requires: "money >= 52"
      effects: ["money -= 52", "item.훈련용장검 += 1"]
      lines:
        - "점원이 장검을 두 손으로 받쳐 들고 왔다. 칼집에서 반쯤 뽑자 묵직한 강철이 화로 빛에 붉게 번들거렸다."
        - 점원: "날은 안 세웠어요. 근데 무게는 진짜예요. 기사단 훈련소에서 열 사람이 쓰다 나온 거래요."
        - "손잡이 가죽이 손에 감긴다. 열 사람의 손이 길들인 자리에 내 손이 겹친다."
        - 점원@진지: "이거 들고 무투대회 나가는 학생들이 있어요. 이기는 학생도, 지는 학생도요. 검은 공평해요."
    - text: 사슬 셔츠 — 은화 55 (인내·위압 · 방어·체력)
      when: "time.month == 7 and item.사슬셔츠 < 1"
      requires: "money >= 55"
      effects: ["money -= 55", "item.사슬셔츠 += 1"]
      lines:
        - 점원: "고리가 삼천 개예요. 사부님이 겨우내 엮었어요. 저는 고리 세는 걸 도왔고요. 이천 개쯤에서 잠들었지만."
        - "사슬 셔츠를 걸쳤다. 쏴아, 빗소리 같은 쇳소리가 났다. 어깨가 무겁게 가라앉는다."
        - 점원@웃음: "처음엔 무거운데 사흘이면 익숙해져요. 벗으면 몸이 날아갈 것 같대요."
    - text: 구경만 하고 나온다
      lines:
        - 점원@웃음: "구경도 수련이래요! 사부님 말이에요. 또 오세요!"
        - "골목을 빠져나오는 동안 망치 소리가 등을 떠밀었다. 땅, 땅, 따당."

# ================================================================ 골동품 노점
- id: shop_antique
  title: 돌다리 밑 골동품 노점
  on: 상점가
  pool: true
  repeat: true
  cooldown: 1
  lines:
    - 나레이션:
        - "상점가 맨 끝, 수로를 건너는 돌다리 아래. 낡은 양탄자 한 장 위에 온갖 물건이 쏟아져 있다."
        - { when: "time.month == 6", text: "돌다리 아래 노점은 장마에도 문을 닫지 않는다. 양탄자 위에 기름천을 덮고, 그 아래서 물건들이 반짝인다." }
        - { when: "time.month == 7", text: "돌다리 아래는 상점가에서 제일 시원한 자리다. 수로 물 냄새 사이로 낡은 쇠와 향 냄새가 섞여 온다." }
    - "반지, 목걸이, 녹슨 열쇠, 멈춘 시계, 깨진 거울, 누군가의 초상화가 든 로켓."
    - "양탄자 뒤에 앉은 상인은 나이를 짐작할 수 없다. 손가락 열 개에 반지가 열한 개다."
    - 상인@웃음:
        - "또 왔구먼. 물건들이 자네를 기억하네. 나는 자네 지갑을 기억하고."
        - { when: "fired.shop_antique <= 1", text: "어서 오시게, 어린 학자 양반. 여기 물건들은 다 주인이 있었다네. 지금은 다음 주인을 기다리지." }
    - 상인: "이 노점은 한곳에 오래 안 있어. 물건도 마찬가지고. 이번 달에 본 건 다음 달엔 없을 수도 있지."
    - 상인@웃음: "그러니 마음에 들면 오늘 사게. 내일은 다른 사람 목에 걸려 있을 테니."
    - when: "talent.마력감응"
      나레이션: "양탄자 위 물건 몇 개에서 희미한 마력이 맥박처럼 뛴다. 대부분은 가짜고, 몇 개는 진짜다."
    - when: "talent.직감"
      나레이션: "구석의 은 로켓에서 눈을 떼기가 어렵다. 이유 없이 목덜미가 서늘하다. …저건 사면 안 된다."
    - when: "talent.마왕의흔적"
      상인@놀람: "…허. 물건들이 자네를 무서워하는구먼. 이런 손님은 오랜만이야."
    - when: "equip.장신구1 == '노엘룬반지' or equip.장신구2 == '노엘룬반지'"
      상인@진지: "그 놋쇠 반지. 팔 생각 있으면 은화 오십 주지. …없다고? 현명하군. 그런 건 파는 게 아니야."
    - when: "equip.장신구1 == '미라벨브로치' or equip.장신구2 == '미라벨브로치'"
      상인: "날개 부러진 새 브로치라. 경매장에서 그 문양을 본 적이 있는데. 어느 집안이었더라."
    - when: "equip.장신구1 == '미라벨브로치' or equip.장신구2 == '미라벨브로치'"
      속마음: "(이 사람 앞에선 브로치를 옷깃 안으로 넣어 두자.)"
    - 상인:
        - "이번 달 물건은 북쪽에서 왔네. 북쪽 사람들은 물건을 오래 쓰지. 그래서 이야기가 많아."
        - { when: "time.month == 5", text: "이번 달엔 경매장에서 흘러나온 게 좀 있지. 몰락한 집안 물건은 늘 싸게 나와. 슬픈 일이지만 장사는 장사야." }
        - { when: "time.month == 6", text: "남쪽 숲에서 정령 방울이 하나 왔다네. 바람 없이도 울지. 울 때마다 값이 오르네." }
        - { when: "time.month == 7", text: "이 회중시계는 세 시 십칠 분에 멈췄지. 그래도 시간은 잘 알려 줘. 이상하지?" }
    - when: "time.month == 5 and affinity.mirabel >= 15"
      속마음: "(몰락한 집안의 경매 물건. 미라벨 앞에선 이 노점 얘기를 꺼내지 말자.)"
    - 속마음: "(원작엔 없던 노점이다. 아니, 있었는데 배경 그림이었다. 클릭이 안 되는.)"
    - 속마음: "(진짜와 가짜 사이에서, 뭘 고를까.)"
  choices:
    - text: 얇은 가죽 장갑 — 은화 10 (손재주·은밀)
      when: "(time.month <= 4 or time.month == 6) and item.가죽장갑 < 1"
      requires: "money >= 10"
      effects: ["money -= 10", "item.가죽장갑 += 1"]
      lines:
        - 상인: "도둑 장갑이라고들 부르지. 아, 오해 말게. 전 주인은 자물쇠 장인이었어. 도둑이 아니라."
        - "장갑을 껴 봤다. 손가락 끝까지 얇아서 맨손이나 다름없다. 바늘 하나도 집을 수 있겠다."
        - 상인@웃음: "물론 그 장인이 밤에 뭘 했는지는 나도 모르지."
    - text: 늑대 이빨 목걸이 — 은화 12 (위압·교감 · 공격)
      when: "(time.month <= 4 or time.month == 7) and item.늑대이빨목걸이 < 1"
      requires: "money >= 12"
      effects: ["money -= 12", "item.늑대이빨목걸이 += 1"]
      lines:
        - 상인: "북쪽 늑대야. 개들이 이걸 보면 꼬리를 내려. 고양이는 코웃음 치고."
        - "가죽끈에 꿴 송곳니가 손바닥에 묵직하다. 끝이 아직 날카롭다."
        - when: "talent.짐승의혈통"
          나레이션: "이빨을 쥔 손에 낯선 맥박이 뛰었다. 이빨이 아니라 내 피가 무언가를 알아본 것 같다."
        - 상인@진지: "짐승한테 겁을 주는 물건은 짐승한테 존중도 받지. 둘은 같은 거야."
    - text: 은 성표 목걸이 — 은화 20 (신성·정신력 · 체력)
      when: "time.month <= 5 and item.은성표 < 1"
      requires: "money >= 20"
      effects: ["money -= 20", "item.은성표 += 1"]
      lines:
        - 상인: "순례자가 노잣돈 대신 맡기고 간 거야. 찾으러 온다더니 삼 년째 안 오는구먼."
        - "성표를 쥐었다. 엄지 자리가 반들반들 닳아 있다. 누군가 아주 오래 쥐고 기도한 자국이다."
        - when: "affinity.sera >= 15"
          속마음: "(세라라면 이 엄지 자국을 보고 뭐라고 할까. 기도는 아픈 사람한테 하는 거라고 했지.)"
        - 상인@슬픔: "찾으러 오면 돌려줘야 하니 그때까지 잘 쓰게. …아마 안 오겠지만."
    - text: 도서관 안경 — 은화 22 (학식·통찰 · 간파)
      when: "time.month <= 5 and item.도서관안경 < 1"
      requires: "money >= 22"
      effects: ["money -= 22", "item.도서관안경 += 1"]
      lines:
        - 상인: "아카데미 도서관 분실물 상자에서 흘러나왔다더군. 어떻게 흘러나왔는지는 묻지 말게."
        - "철사테 안경을 써 봤다. 옆에 굴러다니는 낡은 책 표지의 글자들이 갑자기 줄을 맞춰 섰다."
        - when: "affinity.librarian >= 10"
          속마음: "(…사서 할아버지 안경이랑 테가 똑같다. 설마.)"
        - 상인@웃음: "도서관 귀신이 아직 붙어 있을지도 모르지. 글 읽기 좋아하는 귀신이면 손해 볼 건 없잖나."
    - text: 까마귀 깃털 부적 — 은화 25 (위압·정신력 · 마법 공격)
      when: "time.month >= 4 and time.month <= 6 and item.까마귀깃털부적 < 1"
      requires: "money >= 25"
      effects: ["money -= 25", "item.까마귀깃털부적 += 1"]
      lines:
        - "상인이 검은 깃털 세 개를 붉은 실로 묶은 부적을 집어 들었다. 그리고 집어 든 손을 바지에 문질렀다."
        - 상인@진지: "북쪽 마을에서 악몽 쫓는 데 쓰는 거야. 악몽이 이걸 보면 다른 집으로 간다지."
        - 상인: "다른 집으로 간 악몽이 어떻게 되는지는 아무도 몰라."
        - when: "talent.마왕의흔적 or talent.몸주인의잔재"
          나레이션: "부적을 받자 깃털이 바람도 없이 한 번 떨었다. 그리고 잠잠해졌다. 무언가를 인정한 것처럼."
        - 속마음: "(파는 사람이 손을 닦는 부적. 원작에선 '저주 저항 +5' 한 줄이었다.)"
    - text: 마정석 반지 — 은화 30 (마법 · 마법 공격·마나)
      when: "time.month >= 5 and item.마정석반지 < 1"
      requires: "money >= 30"
      effects: ["money -= 30", "item.마정석반지 += 1"]
      lines:
        - 상인: "마탑 견습생이 시험 떨어지고 술값으로 판 거야. 반지는 죄가 없지."
        - "반지를 끼고 마력을 아주 조금 흘려 봤다. 손가락 마디가 미지근해지고, 푸른 돌 속에서 빛이 한 바퀴 돌았다."
        - 상인@웃음: "봐, 반지가 자네를 좋아하네. 전 주인은 저렇게 못 돌렸어. 그러니 떨어졌겠지."
    - text: 낡은 귀족 예복 — 은화 45 (설득·위압 · 전투 설득, 한벌옷)
      when: "time.month >= 5 and item.귀족예복 < 1"
      requires: "money >= 45"
      effects: ["money -= 45", "item.귀족예복 += 1"]
      lines:
        - "상인이 양탄자 뒤 궤짝에서 진홍 예복을 꺼냈다. 가슴께 문장을 뜯어낸 자리만 색이 진하다."
        - 상인: "경매장에서 왔어. 어느 집 건지는 문장을 뜯을 때 같이 떨어져 나갔지."
        - when: "fired.bond_mirabel_1"
          속마음: "(저택은 경매에 넘어갔다고, 미라벨이 말했었다. …이건 아델하이트 것이 아니길.)"
        - 상인@진지: "옷은 집안이 망해도 어깨선을 기억해. 입으면 사람이 서. 남이 보기에도, 자기가 보기에도."
        - "예복을 걸쳤다. 낡았는데도 어깨가 저절로 펴진다. 남의 집안 자존심을 빌려 입은 기분이다."
    - text: 정령 방울 발찌 — 은화 42 (교감 · 회피)
      when: "time.month >= 6 and item.정령방울 < 1"
      requires: "money >= 42"
      effects: ["money -= 42", "item.정령방울 += 1"]
      lines:
        - "상인이 은방울 세 개가 달린 발찌를 손바닥에 올렸다. 바람이 없는데 방울 하나가 딸랑 울렸다."
        - 상인@웃음: "봐, 또 울었네. 값 오른 거야. 방금 은화 마흔둘이 됐어."
        - 상인: "숲에서 길 잃으면 이걸 흔들게. 누가 대답할 거야. 대답하는 게 누군지는 장담 못 하지만."
        - when: "talent.자연친화력"
          나레이션: "발찌를 받자 방울 세 개가 한꺼번에 울렸다. 상인이 입을 벌렸다. ─ 값을 더 올렸어야 했는데."
    - text: 멈춘 회중시계 — 은화 46 (통찰·학식 · 간파)
      when: "time.month == 7 and item.멈춘회중시계 < 1"
      requires: "money >= 46"
      effects: ["money -= 46", "item.멈춘회중시계 += 1"]
      lines:
        - "은 회중시계. 뚜껑을 열자 바늘이 세 시 십칠 분에 멈춰 있다."
        - 상인: "태엽을 감아도 안 가. 그런데 이상하지. 귀에 대면 째깍 소리가 나."
        - "귀에 대 봤다. 째깍. 째깍. 멈춘 시계에서 소리가 난다."
        - 상인@진지: "이걸 갖고 있으면 남들이 놓치는 걸 보게 된다더군. 시간이 멈춘 자리에서 보는 거지."
        - 속마음: "(3,000시간 동안 시간 정지 버그를 수십 번 봤다. 이건 버그가 아니다.)"
    - text: 물건들을 구경만 하고 일어난다
      lines:
        - 상인@웃음: "물건들이 서운해하겠군. 다음 달엔 다른 놈들이 자네를 기다릴 거야."
        - "돌다리 위로 올라와 돌아봤다. 노점은 그새 다리 그림자 속으로 반쯤 가라앉아 있었다."

# ================================================================ 인연의 선물
# ---------------------------------------------------------------- 브루노: 쇠코 장화
- id: gift_bruno
  title: 브루노 — 쇠코 장화
  art: forge
  on: auto
  free: true
  priority: 0
  slots: [밤]
  when: "time.year == 1 and fired.bond_bruno_2 and affinity.bruno >= 34"
  lines:
    - "밤. 기숙사로 돌아가는 길에 연금과 공방 창이 또 주황색으로 물들어 있다."
    - "땅, 땅, 따당. 이젠 박자만 들어도 누군지 안다."
    - "문을 밀자 화로 열기가 얼굴을 덮쳤다. 쇠 냄새, 숯 냄새, 그리고 가죽 그을리는 냄새."
    - "브루노가 모루 앞에 쪼그려 앉아 있다. 망치 대신 작은 정을 들고 무언가를 톡톡 두드리는 중이다."
    - 브루노@놀람: "어! 딱 맞춰 왔다! 거기 서 봐. 아니, 발 좀 들어 봐."
    - 나: "…발?"
    - 브루노: "왼발. 아니 오른발. 아니 둘 다. 신발 벗어 봐."
    - "영문도 모르고 신발을 벗었다. 브루노가 끈을 내 발에 둘러 길이를 재더니, 끈에 매듭을 지었다."
    - 브루노@웃음: "역시. 내 눈대중 맞았네. 한 치도 안 틀렸어."
    - "브루노가 모루 옆의 천을 걷었다. 장화 한 켤레가 나왔다."
    - "튼튼한 가죽 장화다. 그런데 앞코에 거무스름한 쇠판이 씌워져 있다. 망치 자국이 물고기 비늘처럼 촘촘하다."
    - 브루노: "저번에 말했지? 우리 할아버지, 처음 집게 잡았을 때 쇳물을 신발에 쏟았다고."
    - 브루노: "그 얘기 하고 나서 계속 생각났어. 네 발. 너 맨날 허수아비 앞에서 발을 질질 끌잖아."
    - 브루노@진지: "그러다 뭐 떨어뜨리면 발가락 날아가. 쇠든, 검이든, 마물 발톱이든."
    - 브루노: "장화는 시장에서 제일 튼튼한 걸로 샀고. 쇠는 내가 쳤어. 사흘 밤 걸렸다."
    - 브루노@웃음: "이거 신으면 쇳물을 쏟아도 발가락 열 개 다 무사하다. 내가 장담해."
    - "신어 봤다. 묵직하다. 그런데 발이 장화 안에서 헛돌지 않는다. 바닥을 딛는 느낌이 단단하다."
    - "발끝으로 모루 다리를 툭 차 봤다. 텅. 쇠가 쇠를 받는 소리가 났다. 하나도 안 아프다."
    - when: "equip.신발"
      브루노@당황: "아, 너 신발 있었지. …뭐 어때. 비 오는 날 신어. 아니면 싸우러 가는 날."
    - when: "talent.천생신력 or talent.거구"
      브루노@웃음: "너 힘이면 이걸로 문짝도 차서 열겠다. 문짝 값은 내가 안 낸다?"
    - when: "synergy.철인"
      브루노: "넌 맞아도 맞아도 일어나는 놈이잖아. 그런 놈 발은 더 단단해야지."
    - 속마음: "(원작에서 브루노가 만든 장비는 하나도 없었다. 대장장이 설정이 붙은 동료였는데도.)"
    - 속마음: "(그 설정 한 줄이 지금 내 발가락 열 개를 지키고 있다.)"
    - 나: "얼마야?"
    - 브루노@화남: "돈 얘기 하면 도로 벗긴다."
    - 브루노: "대신 졸업하고 수도 오면… 아니다. 그건 나중에 하자."
    - when: "bruno.warned"
      브루노@진지: "…위험한 데 갈 때 꼭 신어. 네가 그랬잖아. 언젠가 위험해진다고."
    - when: "bruno.warned"
      속마음: "(내가 던진 경고가 쇠코 장화가 되어 돌아왔다.)"
    - "브루노가 다시 모루 앞에 앉았다. 망치를 들기 전에, 손바닥으로 모루를 한 번 쓸었다."
    - "공방을 나서는데 새 장화 굽이 돌바닥을 텅, 텅 울렸다. 등 뒤의 망치 소리와 박자가 맞았다."
  effects: ["item.브루노장화 += 1", "affinity.bruno += 3", "trust.bruno += 2"]

# ---------------------------------------------------------------- 리아나: 꽃매듭 부적
- id: gift_liana
  title: 리아나 — 꽃매듭
  art: greenhouse
  on: auto
  free: true
  priority: 0
  slots: [방과후]
  when: "time.year == 1 and fired.bond_liana_1 and affinity.liana >= 25"
  lines:
    - "방과후. 온실 앞을 지나는데 유리문이 안에서 벌컥 열렸다."
    - 리아나@웃음: "잡았다! 마침 찾으러 가려던 참이야."
    - "리아나가 소매를 붙들고 나를 온실 안으로 끌어당겼다. 습한 공기와 흙냄새가 한꺼번에 감겼다."
    - "작업대 위에 마른 꽃이 종류별로 늘어서 있다. 들국화, 은방울꽃, 이름 모를 파란 풀꽃."
    - "그 옆에 실타래 세 개. 초록, 흰색, 그리고 머리카락처럼 가는 은색."
    - 리아나: "앉아 봐. 손 내밀고. 아니, 왼손."
    - "리아나가 내 손목에 마른 줄기를 대 보더니, 실을 감기 시작했다. 입으로는 노래를 흥얼거리면서."
    - "숲의 노래다. 이번엔 숨기지 않는다."
    - "손가락이 실을 감고, 꼬고, 매듭을 짓는다. 매듭 하나에 노래 한 소절."
    - 리아나: "숲에선 먼 길 떠나는 사람한테 이걸 묶어 줘. 꽃매듭."
    - 리아나: "길을 잃으면 꽃이 바람 냄새로 집 쪽을 알려 준대. 짐승들도 이 냄새 나는 사람은 안 건드리고."
    - 리아나@당황: "…라고 엄마가 그랬어. 진짜인지는 몰라. 반반?"
    - "마지막 매듭에서 리아나가 노래를 멈췄다. 손톱만 한 꽃잎 하나를 매듭 안에 끼워 넣는다."
    - "은빛이 도는 꽃잎. 창으로 든 노을이 닿자 결을 따라 희미한 빛이 흘렀다."
    - when: "fired.bond_liana_2"
      나@놀람: "그거, 월광초…"
    - when: "fired.bond_liana_2"
      리아나@웃음: "부스러기야. 책갈피 모서리에서 떨어진 거. 버리긴 아까워서."
    - when: "fired.bond_liana_2"
      속마음: "(거짓말이다. 그 책갈피는 모서리가 닳도록 쓰다듬기만 했지, 부스러기 하나 흘린 적 없을 것이다.)"
    - when: "not fired.bond_liana_2"
      속마음: "(은빛 꽃잎. 월광초다. 원작 아이템 도감에서 본 바로 그 빛.)"
    - "리아나가 매듭을 내 손목에 묶고, 끝을 이로 끊었다. 귀 끝이 빨갛다."
    - 리아나@웃음: "자. 이제 너도 숲 사람이야. 반쯤."
    - when: "talent.자연친화력 or synergy.야인"
      나레이션: "매듭이 묶이자마자 온실 덩굴 하나가 내 쪽으로 슬그머니 고개를 돌렸다. 리아나가 볼을 부풀렸다. ─ 치사해. 걔들 나한텐 저렇게 안 해."
    - when: "talent.혐오스러운분위기"
      리아나: "이거 차고 있으면 고양이들도 너 안 피할 거야. …아마. 반반."
    - when: "equip.장신구1 and equip.장신구2"
      리아나@당황: "아, 벌써 이것저것 차고 있구나. 그럼… 주머니에 넣어 둬. 냄새는 주머니에서도 나니까."
    - 속마음: "(원작 리아나 루트 보상은 '엘프의 축복' 버프 아이콘 하나였다.)"
    - 속마음: "(손목에 감기는 무게가 이렇게 가벼우면서 무거운 줄은 몰랐다.)"
    - 나: "고마워. 소중히 할게."
    - 리아나@웃음: "소중히 말고, 막 차고 다녀. 매듭은 닳아야 효험이 있대."
    - 리아나: "닳으면 또 묶어 줄게. 몇 번이든."
    - "몇 번이든. 리아나는 그 말을 아무렇지 않게 했다."
    - when: "note.note_liana.known"
      속마음: "(몇 번이든. 그 '몇 번'이 스무 살 전에 끝나지 않게.)"
    - "온실을 나서자 손목에서 마른 꽃 냄새가 올라왔다. 바람이 불 때마다 조금씩 진해졌다."
  effects: ["item.리아나꽃부적 += 1", "affinity.liana += 3", "trust.liana += 2"]

# ---------------------------------------------------------------- 미라벨: 고물이라는 브로치
- id: gift_mirabel
  title: 미라벨 — 날개 부러진 새
  art: library
  on: auto
  free: true
  priority: 0
  slots: [방과후]
  when: "time.year == 1 and fired.bond_mirabel_1 and affinity.mirabel >= 24"
  lines:
    - "방과후 도서관. 창가 자리에 앉자마자 무언가가 책상 위로 날아와 굴렀다."
    - "작고 차가운 것. 손바닥으로 덮어 멈췄다."
    - "은 브로치다. 날개를 편 새 문양인데, 한쪽 날개가 떨어져 나가 있다."
    - 미라벨@화남: "버리려던 거야."
    - "맞은편 서가 사이에서 미라벨이 나타났다. 팔짱을 끼고, 시선은 천장 어딘가에 둔 채로."
    - 미라벨: "짐 정리하다 나왔어. 고물이야. 날개도 부러졌고, 은 함량도 낮고."
    - 미라벨: "고물상에 넘기면 은화 두 닢이나 받으려나. 그것도 귀찮아서."
    - 나: "그래서 나한테 던졌어?"
    - 미라벨@당황: "던진 게 아니라 굴린 거야. 차이가 커."
    - "브로치를 뒤집었다. 뒷면에 아주 작은 글씨가 새겨져 있다. 닳아서 반쯤 지워진 이름. 아델하이트."
    - "날개가 떨어져 나간 자리에 새끼손톱만 한 마정석이 박혀 있다. 빛을 받자 안쪽에서 보랏빛이 천천히 돌았다."
    - 속마음: "(고물이 아니다. 영창 보조용 마정석이다. 마법 명가가 자기 집 마법사들에게 쥐여 주던 물건.)"
    - when: "perk.데이터마이너"
      속마음: "(원작 데이터 파일에 이름만 있고 획득처가 없던 아이템. 미구현인 줄 알았다.)"
    - 미라벨: "…그거, 영창 박자 맞출 때 쓰는 거야. 마력을 흘리면 박자에 맞춰 떨려."
    - 미라벨@화남: "고물이라도 기능은 있으니까 설명해 주는 거야. 착각하지 마."
    - when: "fired.bond_mirabel_2"
      미라벨: "영창 분할 할 때 쪼갠 자리에서 떨리면 맞게 한 거야. 넌 아직 반 박자 늦거든."
    - when: "synergy.마도사 or talent.마도학재능"
      미라벨: "…네 마력 흐름이면 이거 제대로 울릴 거야. 그래서 준 건 아니고."
    - when: "equip.장신구1 and equip.장신구2"
      미라벨@화남: "뭘 그렇게 주렁주렁 달고 다녀. 하나 빼. …아니, 됐어. 주머니에라도 넣어 둬. 버리지만 마."
    - 나: "이거 너희 집안 거잖아. 경매에 안 넘어간 거."
    - "미라벨의 손가락이 팔짱 안에서 움찔했다."
    - 미라벨@슬픔: "…압류 목록에 안 오른 건 몇 개 안 돼. 그날 내가 옷 속에 숨겨서 나온 것들뿐이야."
    - 미라벨@화남: "그러니까 고물이라고. 날개 부러진 새는 아무도 안 사."
    - 속마음: "(그 몇 개 중 하나를 나한테 굴렸다. 고물이라는 말을 방패처럼 들고.)"
    - 속마음: "(원작에서 미라벨이 누군가에게 가문 물건을 건네는 장면은 없었다. 4학년에 사라질 때까지.)"
  effects: ["item.미라벨브로치 += 1"]
  choices:
    - text: "\"고마워. 잘 쓸게\""
      effects: ["affinity.mirabel += 4"]
      lines:
        - 나: "고마워. 잘 쓸게."
        - 미라벨@당황: "…쓰라고 준 거니까 당연히 써야지. 고맙다는 말은 필요 없어."
        - "미라벨이 몸을 돌렸다. 귀 끝이 머리카락만큼 빨갰다."
        - 미라벨: "부러뜨리면 죽어. 고물이어도."
        - "구두 소리가 서가 사이로 멀어졌다. 평소보다 반 박자 빨랐다."
    - text: "\"날개는 언젠가 다시 붙이자. 가문이랑 같이\""
      effects: ["affinity.mirabel += 2", "trust.mirabel += 5"]
      lines:
        - 나: "날개는 언젠가 다시 붙이자. 가문이랑 같이."
        - 미라벨@놀람: "……"
        - "미라벨이 처음으로 나를 똑바로 봤다. 입술이 무언가 쏘아붙일 모양을 만들었다가, 그냥 다물렸다."
        - 미라벨@슬픔: "…은세공사한테 물어봤었어. 날개 하나 새로 다는 데 은화 백 닢이래."
        - 미라벨: "백 닢이면 아델하이트 이름을 하루 더 버틸 수 있어. 그래서 안 붙였어."
        - 미라벨@진지: "언젠가, 라고 했지. 그 말 기억해 둘게. 빈말이면 죽어."
        - 속마음: "(빈말로 만들지 않으려면, 이 아이가 4학년에 혼자 사라지지 않게 해야 한다.)"

# ---------------------------------------------------------------- 세라: 기도 매듭
- id: gift_sera
  title: 세라 — 서른세 개의 기도
  art: chapel
  on: auto
  free: true
  priority: 0
  slots: [방과후]
  when: "time.year == 1 and fired.bond_sera_1 and affinity.sera >= 31"
  lines:
    - "방과후 성당 앞 계단. 해가 기울어 계단 반쪽만 따뜻하다."
    - "세라가 그 따뜻한 반쪽에 앉아 있다. 무릎 위에 흰 실타래를 올려놓고."
    - "손가락이 쉬지 않고 움직인다. 실을 감고, 고리를 만들고, 그 사이로 끝을 통과시킨다."
    - "입술도 움직인다. 소리 없이."
    - 세라@놀람: "아, 왔구나. 잠깐만. 이거 하나만 마저 하고."
    - "세라가 매듭 하나를 꽉 조였다. 그리고 실 끝을 이로 끊었다. 신학생답지 않은 동작이었다."
    - 세라@당황: "…시스터 루나께는 비밀이야. 가위를 안 가져와서."
    - "세라가 만든 것을 두 손으로 내밀었다. 흰 실로 엮은 팔찌. 작은 매듭이 일정한 간격으로 이어져 있다."
    - 세라: "기도 매듭이야. 엄마가 아기 받으러 갈 때마다 이걸 손목에 감았어."
    - 세라: "매듭 하나에 기도 하나. 서른세 개."
    - 세라: "글자를 몰라도 기도는 셀 수 있으니까. 손가락으로 매듭을 하나씩 넘기면서."
    - 세라@웃음: "교회 묵주는 은이나 나무 구슬로 만드는데, 우리 마을엔 그런 게 없었어. 실은 있었고."
    - "팔찌를 받았다. 가볍다. 그런데 손바닥 위에서 이상하게 따뜻하다. 볕에 앉아 있던 세라의 무릎처럼."
    - when: "know.sera_stigma"
      나레이션: "매듭 사이사이에서, 그날 세라의 손등에 떠올랐던 빛과 같은 결이 희미하게 느껴졌다."
    - 나: "서른세 개 다… 기도를 넣은 거야?"
    - 세라: "응. 하나는 네가 다치지 않게. 하나는 다쳐도 금방 낫게. 하나는 잠 잘 자게."
    - 세라@당황: "…그다음부터는 좀 이상한 것도 있어. 시험 잘 보게, 식당에서 고기 많이 받게, 그런 거."
    - 세라@웃음: "서른세 개는 생각보다 많더라."
    - "웃음이 터졌다. 세라도 따라 웃었다. 계단 아래를 지나던 신학생 둘이 놀란 얼굴로 돌아봤다."
    - when: "synergy.성직자 or talent.성흔"
      세라@진지: "너도 기도가 닿는 사람이잖아. 이걸 차면 조금 더 멀리 닿을 거야."
    - when: "talent.마왕의흔적"
      세라@진지: "…이상하지. 너한테 줄 매듭을 묶는데, 매듭이 자꾸 차가워지려고 했어. 그래서 전부 두 번씩 기도했어."
    - when: "talent.마왕의흔적"
      속마음: "(세라의 신성력이 이 몸 안의 무언가를 느꼈다. 그리고 그걸 밀어내는 대신, 두 번 기도했다.)"
    - when: "sera.warned"
      세라: "시스터 루나께 여쭤봤어. 성녀 시험은 서두르지 않아도 된대. …네 말이 맞았어."
    - when: "sera.church"
      세라: "다음 달엔 수도에 가. 시험 보러. 이건… 내가 없는 동안 대신 기도해 줄 거야."
    - when: "equip.장신구1 and equip.장신구2"
      세라@웃음: "손목이 벌써 꽉 찼네. 그럼 주머니에 넣어 둬. 기도는 주머니 속에서도 들려."
    - 속마음: "(원작에서 세라는 시험장에서 쓰러져 고향으로 돌아갔다. 이 매듭을 묶을 손은 원작에 없었다.)"
    - 속마음: "(서른세 번의 기도. 그중 하나는 식당 고기에 관한 거지만.)"
    - "세라가 계단에서 일어나 치맛자락을 털었다."
    - 세라: "다치지 마. 그래도 다치면, 매듭을 하나씩 넘겨. 내가 옆에서 같이 세는 것처럼."
    - "저녁 종이 울렸다. 세라가 성당 안으로 들어갔다. 문이 닫히기 전에 한 번 돌아보고 손을 흔들었다."
    - "손목에 감은 매듭을 엄지로 넘겨 봤다. 하나, 둘. 세 번째에서 괜히 웃음이 났다."
  effects: ["item.세라묵주 += 1", "affinity.sera += 3", "trust.sera += 2"]

# ---------------------------------------------------------------- 핀: 빗자루 단봉
- id: gift_finn
  title: 핀 — 고마어요
  art: training_ground
  on: auto
  free: true
  priority: 0
  slots: [밤]
  when: "time.year == 1 and fired.bond_finn_1 and affinity.finn >= 24"
  lines:
    - "밤의 연무장. 오늘은 핀이 먼저 와 있었다. 그런데 목검도 빗자루도 들고 있지 않다."
    - "대신 등 뒤에 무언가를 감추고, 횃불 아래서 발끝으로 모래를 파고 있다."
    - 핀@당황: "아, 오, 오셨어요."
    - 나: "뭐 숨겼어?"
    - 핀@당황: "수, 숨긴 거 아니에요. 그냥… 등 뒤에 있는 거예요."
    - "핀이 한참 우물쭈물하다가, 결국 두 손으로 내밀었다. 팔뚝 길이의 나무 막대."
    - "아니, 막대가 아니다. 손잡이 쪽엔 손가락 홈이 파여 있고, 끝은 둥글게 다듬어져 있다. 촛농으로 문질러 반들반들하다."
    - 핀: "빗자루 자루예요. 지난주에 부러졌거든요. 계단에서 학생이 밟아서."
    - 핀: "버리라는데 못 버리겠어서… 밤마다 깎았어요. 주방 칼로요. 아, 칼은 돌려놨어요."
    - 핀@웃음: "목검은 길어서 안쪽으로 들어가면 거추장스럽잖아요. 이건 짧으니까, 반 걸음 안쪽에서 쓰기 좋아요."
    - when: "fired.bond_finn_2"
      핀: "보법 할 때요. 들어가서, 톡. 이렇게요."
    - "핀이 단봉을 쥐고 반 걸음 미끄러지듯 들어와 내 옆구리를 톡 건드렸다. 횃불이 한 박자 늦게 흔들렸다."
    - "단봉을 받아 쥐었다. 가볍다. 손가락 홈이 내 손에 맞는다. 대련할 때 핀은 내 손을 계속 보고 있었던 모양이다."
    - "손잡이 끝에 무언가 새겨져 있다. 삐뚤빼뚤한 글자 몇 개."
    - "횃불에 비춰 읽었다. ─ 고마어요."
    - 핀@당황: "아, 그, 그거 틀린 거 알아요! '워'를 어떻게 쓰는지 까먹어서… 칼이 미끄러져서…"
    - when: "item.핀의쪽지"
      속마음: "(냅킨 쪽지와 똑같은 철자다. 이 아이는 아직 '고마워요'를 끝까지 써 본 적이 없다.)"
    - when: "not item.핀의쪽지"
      속마음: "(글을 모른다던 아이다. 이 네 글자를 새기려고 몇 번이나 칼을 멈췄을까.)"
    - 속마음: "(원작에서 이 아이 이름은 '청소부'였다. 청소부가 깎은 무기라니. 어떤 위키에도 없는 장비다.)"
    - when: "equip.무기 == '브루노목검'"
      핀@당황: "아… 브루노 형 목검이 있으시구나. 그거 좋은 거예요. 그럼 이건… 그냥 갖고만 계세요."
    - when: "equip.무기 and equip.무기 != '브루노목검'"
      핀: "벌써 좋은 거 쓰시죠. 이건… 짐에 넣어 두셔도 돼요. 진짜로요."
    - when: "synergy.그림자 or talent.고양이반사신경 or talent.키작음"
      핀@웃음: "그리고 발이 빠르시니까요. 긴 것보다 짧은 게 더 맞을 거예요."
    - 속마음: "(뭐라고 해 줘야 할까. 이 아이는 칭찬을 받으면 빗자루 뒤로 숨는다.)"
  effects: ["item.핀단봉 += 1"]
  choices:
    - text: "\"'워'는 이렇게 쓰는 거야\" (모래에 써 준다)"
      effects: ["affinity.finn += 3", "trust.finn += 4"]
      lines:
        - "모래 위에 손가락으로 글자를 썼다. 고, 마, 워, 요."
        - "핀이 쪼그려 앉아 한참 들여다봤다. 그리고 단봉 끝으로 옆에 따라 썼다."
        - "워. 획 하나가 삐져나갔다. 핀이 손바닥으로 지우고 다시 썼다. 세 번째에 반듯해졌다."
        - 핀@웃음: "…됐다. 이제 안 까먹어요."
        - 핀: "다음 건 다시 깎을게요. 맞는 글자로요."
        - 나: "이건 이대로 둘래."
        - 핀@당황: "왜, 왜요? 틀렸잖아요."
        - 나: "처음 거니까."
        - "핀이 대답 대신 빗자루를 집어 들고 연무장을 쓸기 시작했다. 모래 위의 글자만 피해서."
    - text: "\"틀린 게 더 좋아\""
      effects: ["affinity.finn += 5"]
      lines:
        - 나: "틀린 게 더 좋아."
        - 핀@놀람: "…네?"
        - 나: "고마어요. 이게 네 글씨잖아. 맞춤법 맞는 글씨는 아무나 쓰는 거고."
        - "핀이 입을 벌렸다가 다물었다. 횃불 그림자 속에서도 귀가 빨개지는 게 보였다."
        - 핀@웃음: "…그럼 다음엔 더 틀리게 쓸게요."
        - 나: "그건 아니고."
        - "핀이 소리 내서 웃었다. 빗자루 뒤로 숨지 않고, 손으로 입을 가리고."

# ---------------------------------------------------------------- 도로시: 조수 1호의 앞치마
- id: gift_dorothy
  title: 도로시 — 조수 1호
  art: kitchen
  on: auto
  free: true
  priority: 0
  slots: [방과후]
  when: "time.year == 1 and fired.bond_dorothy_1 and affinity.dorothy >= 24"
  lines:
    - "방과후. 식당 뒷문을 지나는데 주방 창문으로 보라색 연기가 한 줄기 새어 나온다."
    - "익숙한 연기다. 오늘은 박하에 탄 설탕 냄새가 섞였다."
    - 도로시@웃음: "거기! 지나가는 조수 씨! 잠깐만요!"
    - "창문이 벌컥 열리고 주황색 단발이 튀어나왔다. 두건이 반쯤 벗겨져 있다."
    - 나: "…언제부터 내가 조수였어?"
    - 도로시: "시제품 첫 시식한 날부터요! 기록에 그렇게 적었어요. 조수 1호."
    - "주방 안으로 끌려 들어갔다. 화덕 옆 구석, 도로시의 실험 냄비 자리."
    - "의자 위에 두꺼운 천이 개켜져 있다. 도로시가 그걸 확 펼쳤다."
    - "앞치마다. 갈색 범포에 주머니가 다닥다닥 붙어 있다. 큰 것, 작은 것, 병 하나가 딱 들어갈 만한 길쭉한 것."
    - 도로시@웃음: "짠! 조수 1호 전용 실험 앞치마예요!"
    - 도로시: "주머니 열두 개! 세어 봐요. 열두 개예요. 엄마 헌 앞치마 두 장을 뜯어서 이어 붙였어요."
    - 도로시: "이건 병 주머니, 이건 약초 주머니, 이건 비밀 주머니. 비밀 주머니는 비밀이라 설명 못 해요."
    - "가슴께에 보라색 얼룩이 별자리처럼 흩어져 있다. 도로시 앞치마와 똑같은 무늬로."
    - 도로시@당황: "아, 얼룩은 일부러 그런 거 아니에요. 실험하다가… 근데 안 빠지더라고요. 그래서 이제 무늬라고 해요."
    - 도로시: "그리고 이 천, 불이 안 붙어요! 제가 시험해 봤어요. 세 번. 화덕에 대고."
    - 나: "…세 번?"
    - 도로시@웃음: "두 번은 붙었어요. 그래서 세 번째엔 약을 발랐죠. 그게 됐어요!"
    - when: "talent.서번트.연금"
      나레이션: "앞치마를 두르자 손끝이 근질거렸다. 주머니 속 약초 냄새만으로 비율이 머릿속에 떠오른다."
    - when: "synergy.학자 or talent.집중력 or talent.완전기억"
      도로시: "너 기록 잘하잖아요. 이 주머니에 수첩 넣어요. 손바닥 크기로 맞췄어요."
    - when: "equip.한벌옷"
      도로시@당황: "어, 위아래 한 벌로 입었네요. 그럼 실험할 때만이라도 바꿔 입어요! 약속!"
    - when: "equip.윗옷"
      도로시: "지금 입은 거 위에 걸쳐도… 아, 안 되나? 그럼 실험할 때만이라도요!"
    - 속마음: "(원작에서 도로시는 이름조차 없는 '식당 딸'이었다. 그 아이가 지금 나한테 직함을 줬다. 조수 1호.)"
    - 속마음: "(원작 연금술 미니게임엔 장비 칸이 없었다. 있었으면 3,000시간 중 천 시간은 거기 썼을 거다.)"
    - 도로시: "대신 조건이 있어요. 효과 있는 거 발견하면 저한테 제일 먼저 알려 주기."
    - 도로시@진지: "그리고… 엄마가 앞치마 두 장 어디 갔냐고 물으면, 모른다고 하기."
    - "주방 밖에서 아주머니 발소리가 들렸다. 도로시가 앞치마를 내 품에 확 밀어 넣었다."
    - 도로시@당황: "빨리! 숨겨요! 입어요! 입는 게 제일 잘 숨기는 거예요!"
    - "얼떨결에 앞치마를 둘렀다. 주머니 열두 개가 일제히 덜컥거렸다. 그중 하나에서 박하 사탕이 굴러 나왔다."
  effects: ["item.도로시앞치마 += 1", "affinity.dorothy += 3"]

# ---------------------------------------------------------------- 노엘: 놋쇠 반지
- id: gift_noel
  title: 노엘 — 놋쇠 반지
  art: dorm_hall
  on: auto
  free: true
  priority: 0
  slots: [밤]
  when: "time.year == 1 and met.noel and affinity.noel >= 10"
  lines:
    - "밤. 기숙사 복도 끝 창문이 열려 있다. 찬 바람과 함께 술 냄새가 들어온다."
    - "창틀에 누가 걸터앉아 있다. 한쪽 다리는 바깥 허공에 걸친 채로. 3층이다."
    - 노엘@웃음: "어이, 1학년. 소리 지르지 마. 사감 깬다."
    - 나: "선배, 거기 3층이에요."
    - 노엘: "알아. 그래서 경치가 좋지. 2층에선 담장밖에 안 보여."
    - "노엘이 술병을 흔들어 보였다. 바닥에 한 모금쯤 남았다."
    - 노엘: "마침 잘 왔다. 손 좀 줘 봐. 왼손."
    - "망설이다 손을 내밀었다. 노엘이 주머니를 뒤적이더니, 내 검지에 무언가를 쑥 밀어 넣었다."
    - "반지다. 검게 변한 놋쇠. 투박하고 가볍다. 손가락에서 반 바퀴 헛돌았다."
    - 노엘: "카드 판에서 땄어. 상대가 은화 대신 걸더라. 쓸모없는 고물이라고."
    - 노엘@웃음: "근데 나한텐 너무 작아. 새끼손가락에도 안 들어가. 그러니까 너 가져."
    - "반지를 빼서 창밖 달빛에 비춰 봤다. 안쪽에 가는 긁힘이 있다. 일곱 개. 직선과 각진 곡선."
    - "긁힘이 달빛을 받아 아주 잠깐, 푸르게 깜빡였다."
    - when: "fired.bond_noel_1"
      속마음: "(모래 위에 그리던 그 룬이다. 카드 판에서 땄다는 반지 안쪽에, 노엘의 손톱 자국으로.)"
    - when: "not fired.bond_noel_1"
      속마음: "(긁힘이 아니다. 글자다. 교과서에서 본 어떤 문자와도 닮지 않은.)"
    - when: "noel.rune_seen"
      속마음: "(도서관 사전 여백에서 본 글씨와 같은 손이다. 작고, 날카롭고, 술 취한 사람의 손이 아닌.)"
    - 노엘: "그거 끼고 있으면 거짓말 들을 때 손가락이 따끔해."
    - 노엘@웃음: "농담이야. …반쯤."
    - 나: "나머지 반은요?"
    - 노엘: "나머지 반은 진짜로 따끔해. 그러니까 연애할 땐 빼."
    - "노엘이 술병을 비웠다. 빈 병을 창틀에 세워 놓고 한참 달을 봤다."
    - 노엘@진지: "1학년. 이 학교엔 웃으면서 거짓말하는 놈들이 생각보다 많아."
    - 노엘: "교수 중에도. 교회 쪽에도. 학생 중에도."
    - 노엘: "그 반지가 따끔하면 그 자리에서 따지지 마. 그냥 '아 그래요' 하고 나와. 알았지?"
    - 속마음: "(망국의 룬 마스터. 원작에선 1학년 말에 사라진다. 이 반지는 그 전에 남겨 두는 무언가일까.)"
    - when: "talent.직감 or talent.마력감응"
      나레이션: "반지를 다시 끼자 손가락 마디가 미지근해졌다. 반지가 아니라, 반지를 낀 손이 무언가를 듣기 시작한 느낌이다."
    - when: "equip.장신구1 and equip.장신구2"
      노엘@웃음: "손가락이 벌써 꽉 찼네. 사치스러운 1학년이구만. 주머니에라도 넣고 다녀."
    - 노엘@웃음: "자, 가서 자. 나는 여기서 달이랑 얘기 좀 더 하고."
    - 나: "떨어지지 마요."
    - 노엘: "몇 년째 안 떨어졌어. 내가 떨어지는 건 시험뿐이야."
    - "복도를 걸어 나오다 돌아봤다. 노엘은 창틀에 앉아 달을 보며 무언가를 중얼거리고 있었다."
    - "들리지 않는 말이었다. 그런데 반지 낀 손가락이, 아주 조금 따끔했다."
  effects: ["item.노엘룬반지 += 1", "affinity.noel += 3", "trust.noel += 2"]
