# 만남 풀: 활동을 할 때마다 이 중 하나가 무작위로 일어난다 (pool: true).
# cooldown = 한 번 일어나면 몇 주 쉬는가, chance = 후보가 될 확률.
# 조건 있는 일회성 이벤트(priority 1 이상)가 있으면 그쪽이 먼저다.

# ================================================================ 훈련장
- id: enc_train_bruno
  title: 브루노와 팔씨름
  on: 훈련장
  pool: true
  repeat: 3
  cooldown: 2
  when: "met.bruno or affinity.bruno > 0"
  lines:
    - 나레이션:
        - "해가 기운 훈련장. 목검을 내려놓자 손바닥이 얼얼하다."
        - { when: "time.month == 6", text: "장맛비가 그친 훈련장. 젖은 모래 냄새가 올라온다. 손바닥이 얼얼하다." }
        - { when: "time.month == 7", text: "해가 져도 훈련장 모래가 뜨끈하다. 목검을 내려놓자 손바닥이 얼얼하다." }
    - "물통 쪽으로 걸어가는데, 등 뒤에서 땅이 울리는 발소리가 다가왔다."
    - 브루노@웃음:
        - "어이! 한 판 하자. 지는 사람이 저녁 사기!"
        - { when: "fired.enc_train_bruno >= 2", text: "어이! 오늘도 한 판 하자. 지는 사람이 저녁 사기! 저번 판은 잊고!" }
    - "브루노가 소매를 어깨까지 걷어붙이며 씩 웃는다. 팔뚝이 내 종아리만 하다."
    - 나@당황: "…그 팔로 팔씨름을 하자고?"
    - 브루노: "아이고, 겁먹지 마라. 대장간에선 이게 인사야. 손 맞잡아 보면 사람 다 안다 카더라."
    - "브루노가 장비 창고 앞에 나와 있던 낡은 책상을 번쩍 들어 훈련장 한가운데로 옮겼다. 혼자서."
    - "구경거리를 눈치챈 동기들이 하나둘 모여든다."
    - 학생 A: "브루노한테 걸렸네. 쟤 어제 2학년 선배도 넘겼대."
    - 학생 B: "난 브루노한테 저녁 한 끼 건다."
    - 속마음: "(원작의 브루노는 '근력 +3' 버프를 주는 동료 NPC였다. 팔씨름 미니게임 같은 건… 없었다.)"
    - "책상에 팔꿈치를 대고 손을 맞잡았다. 굳은살투성이 손바닥이 화로처럼 뜨겁다."
    - 브루노@진지: "봐주는 거 없다. 셋 세면 시작이다. 하나, 둘──"
    - 속마음: "(손목을 안으로 말고, 팔이 아니라 등으로 당긴다. …어디서 본 공략인지는 묻지 말자.)"
  check: { label: 팔씨름, value: "stat.근력 + luck", dc: 30 }
  success:
    lines:
      - "브루노의 팔뚝에 핏줄이 섰다. 내 팔도 덜덜 떨린다. 책상이 끼익 울었다."
      - "한 치. 또 한 치."
      - "브루노의 팔이 천천히 넘어갔다."
      - "손등이 책상에 닿았다. 구경꾼들 사이에서 '어?' 하는 소리가 났다."
      - "브루노가 눈을 끔뻑인다. 한 번, 두 번."
      - 브루노@놀람: "…너 뭐 먹고 사냐?"
      - 브루노@웃음: "하하하! 졌다, 졌어! 참말로 졌다! 저녁은 내가 산다. 감자 스튜 곱빼기다!"
      - "브루노가 내 손목을 잡고 위로 번쩍 들어 올렸다. 이긴 사람보다 진 사람이 더 신났다."
      - 학생 B: "…내 저녁."
      - "그날 저녁, 브루노는 스튜를 세 그릇 먹으며 팔씨름 얘기를 다섯 번 했다. 내가 이긴 얘기를."
      - 속마음: "(지고도 저렇게 웃을 수 있는 놈이다.)"
      - when: "perk.고인물의기억 or perk.공략위키편집자"
        속마음: "(원작은 이 웃음을 6년 차 수도 습격에서 꺼 버렸다. 이번엔 그렇게 두지 않는다.)"
    effects: ["affinity.bruno += 6", "stat.근력 += 1"]
  fail:
    lines:
      - "셋을 세는 순간, 쇠기둥에 팔을 건 기분이 들었다. 꿈쩍도 안 한다."
      - "이를 악물고 버텼다. 버틴다고 생각했다."
      - "책상이 먼저 부서질 뻔했다. 다리 하나가 비명처럼 삐걱거렸다."
      - "쿵. 손등이 책상에 박혔다. 구경꾼들이 와아 웃음을 터뜨린다."
      - 브루노@웃음: "오, 제법 버텼다! 셋까지 센 놈은 니가 처음이다."
      - 나@슬픔: "…손목이 아직 붙어 있는지 모르겠어."
      - 브루노: "붙어 있다, 붙어 있어. 대장간 집게보다 살살 잡았다 아이가."
      - "약속은 약속이다. 저녁은 내가 샀다. 브루노는 스튜를 세 그릇 먹었다."
      - 속마음: "(은화가 줄었다. 팔은 욱신거린다. …그런데 이상하게 기분은 나쁘지 않다.)"
      - 브루노: "다음에 또 하자! 그땐 니가 이길 수도 있지. 아마도!"
    effects: ["affinity.bruno += 4", "money -= 3"]

- id: enc_train_kaiden
  title: 혼자 남은 카이든
  on: 훈련장
  pool: true
  repeat: 2
  cooldown: 3
  when: "time.month >= 4"
  lines:
    - "해 질 녘 훈련장. 다들 돌아간 모래 위로 그림자만 길게 누웠다."
    - "카이든이 혼자 같은 동작을 수백 번 반복하고 있다."
    - "내려베기. 거두기. 다시 내려베기. 목검이 공기를 가를 때마다 짧은 바람 소리가 난다."
    - "땀이 턱 끝에서 떨어져 모래에 동그란 자국을 낸다. 자국이 이미 수십 개다."
    - when: "time.month >= 6"
      나레이션: "무투대회가 가까워서일까. 목검을 쥔 손등에 붕대가 감겨 있다. 피가 배어 나왔다."
    - "훈련장 담장 그늘에 서서 그 모습을 한참 봤다. 카이든은 나를 알아채지 못한 것 같다."
    - 속마음: "(원작 위키의 카이든 항목. '오만한 3황자. 재능만 믿는 악역 라이벌.')"
    - 속마음: "(그 문장을 쓴 사람은 이 장면을 한 번도 못 봤을 거다. 원작엔 이런 장면이 없었으니까.)"
    - "물을 마시러 가지도, 숨을 고르지도 않는다. 누가 시킨 것도 아닌데."
    - 속마음: "(말을 걸까. 아니면 이 기회에 저 검을 눈에 새겨 둘까.)"
  choices:
    - text: 말을 건다
      effects: ["affinity.kaiden += 5", "trust.kaiden += 3"]
      lines:
        - 나: "매일 이렇게 늦게까지 해?"
        - "목검이 허공에서 멈췄다. 카이든이 천천히 고개를 돌린다. 젖은 앞머리 아래 눈빛이 차갑다."
        - 카이든: "황자가 노력하는 게 그렇게 신기한가."
        - 나@당황: "아니, 신기하다기보다는…"
        - 카이든: "다들 그렇게 보더군. 황족은 태어날 때부터 검을 잘 쥐는 줄 알지."
        - 카이든@진지: "손바닥 껍질은 황족이라고 덜 벗겨지지 않는다."
        - 나레이션:
            - "그는 대답 대신 다시 검을 휘둘렀다."
            - { when: "trust.kaiden >= 10", text: "잠시 뒤, 그가 낮게 덧붙였다. \"형님들은 내가 실패하길 바라거든.\"" }
        - "내려베기. 거두기. 바람 소리가 다시 일정하게 이어진다."
        - "돌아서려는데, 등 뒤에서 목소리가 짧게 날아왔다."
        - 카이든: "…내일도 이 시간이다. 구경할 거면 목검이라도 들고 와라."
        - 속마음: "(초대장인지 경고인지 모르겠다. 아마 이 사람한테는 둘이 같은 말일 거다.)"
    - text: 멀리서 동작을 관찰한다 (지성)
      check: { label: 동작 관찰, value: "stat.지성 + stat.민첩 / 2 + luck", dc: 28 }
      success:
        lines:
          - "담장 그늘에 몸을 숨기고 카이든의 검만 봤다. 백 번. 이백 번."
          - "같은 동작이다. 완벽하게 같다. 그래서 오히려 다른 한 군데가 눈에 걸린다."
          - "왼쪽 어깨를 쓸 때마다 반 박자씩 늦는다. 오른쪽 아래가 빈다."
          - "아주 잠깐이다. 숨 한 번 쉴 틈도 안 되는."
          - "카이든이 검을 내리고 왼쪽 어깨를 손으로 감쌌다. 아무도 안 본다고 믿는 얼굴로."
          - 속마음: "(공략 게시판에선 '카이든전은 오른쪽 아래'가 상식이었다. 화면 너머로 외운 공식이었다.)"
          - 속마음: "(그 공식이 지금 눈앞에서 땀을 흘리며, 아픈 어깨를 혼자 감싸고 있다.)"
          - "들키기 전에 조용히 훈련장을 빠져나왔다. 눈 안쪽에 그 반 박자가 남았다."
        effects: ["know.kaiden_shoulder = 1", "stat.민첩 += 1"]
      fail:
        lines:
          - "담장 그늘에 숨어 카이든의 검을 눈으로 좇았다."
          - "내려베기. 거두기. 백 번째나 첫 번째나 똑같다."
          - "완벽해 보인다. 빈틈이 보이지 않는다."
          - 속마음: "(원작에선 상대 정보 창 하나 열면 끝이었는데. 맨눈으로는 아무것도 안 보인다.)"
          - "보는 것만으로 목덜미가 땀에 젖었다. 저 박자를 몇 년이나 반복했을까."
          - "해가 완전히 졌다. 카이든은 끝까지 한 번도 멈추지 않았다."
          - "돌아오는 길, 그 바람 소리가 귀에서 떠나지 않았다."

- id: enc_train_garen
  title: 가렌의 자세 교정
  on: 훈련장
  pool: true
  repeat: 3
  cooldown: 2
  when: "met.garen"
  effects: ["affinity.garen += 5", "stat.근력 += 1", "stat.민첩 += 1"]
  lines:
    - "훈련장 구석에서 허수아비를 상대로 내려베기를 반복했다. 백 번을 넘기자 팔이 제멋대로 흔들린다."
    - "등 뒤로 모래 밟는 소리가 났다. 발소리가 없는 사람인데, 오늘은 일부러 낸 것 같다."
    - "가렌 교관이 말없이 다가와 내 팔꿈치를 툭 쳐서 내렸다."
    - 가렌: "다시."
    - "다시 휘둘렀다. 교관의 목검 끝이 이번엔 내 옆구리를 짚었다."
    - 가렌:
        - "힘으로 휘두르지 마라. 허리로."
        - { when: "stat.근력 >= 30", text: "…제법이군. 이제 허리만 고치면 된다." }
        - { when: "stat.근력 >= 30 and fired.enc_train_garen >= 3", text: "다음 주부터 새벽에도 나와라. 따로 봐주지." }
    - "대답할 틈도 없이 교관이 자기 목검을 들었다. 팔은 거의 움직이지 않았다."
    - "허리가 반 바퀴 돌았을 뿐인데, 허수아비 어깨가 퍽 소리를 내며 꺼졌다."
    - 속마음: "(원작에선 '가렌 교관과 훈련' 버튼을 누르면 근력 +1, 민첩 +1이 뜨고 끝이었다.)"
    - 속마음: "(그 숫자 두 개 안에 이런 게 들어 있었구나.)"
    - "따라 해 봤다. 허리를 먼저 돌리고, 팔은 따라오게."
    - "목검이 이상하게 가볍다. 허수아비가 아까보다 크게 흔들렸다."
    - 가렌: "……."
    - "교관은 칭찬하지 않았다. 고개를 끄덕이지도 않았다."
    - "그냥 내 옆에 서서, 내가 쉰 번을 더 휘두를 때까지 떠나지 않았다."
    - "쉰한 번째에 팔꿈치가 다시 올라갔다. 목검 끝이 말없이 그 팔꿈치를 눌렀다."
    - when: "stat.근력 >= 30 and fired.enc_train_garen >= 3"
      속마음: "(새벽에 따로. 원작의 가렌이 따로 불러낸 학생은 아렌 하나뿐이었는데.)"
    - "해가 지자 가렌은 한마디도 없이 돌아섰다. 흉터 많은 등이 훈련장 문 너머로 사라진다."
    - "손바닥에 그 쉰 번이 고스란히 남았다."

- id: enc_train_aren
  title: 늦게까지 남은 아렌
  on: 훈련장
  pool: true
  repeat: 3
  cooldown: 2
  when: "fired.y1_entrance"
  lines:
    - "저녁 종이 울린 지 한참 지난 훈련장. 등불 하나 아래서 누군가 목검을 휘두르고 있다."
    - "아렌이 혼자 남아 목검을 휘두르고 있다. 성검을 쥘 때와는 딴판으로 어설프다."
    - "발이 꼬이고, 검 끝이 자꾸 모래를 긁는다. 입학식 날 대강당을 하얗게 물들이던 소년이라고는 믿기지 않는다."
    - "헛스윙. 목검이 손에서 빠져 모래 위를 굴렀다. 아렌이 그걸 한참 내려다본다."
    - 아렌@슬픔: "성검은 저절로 움직이는데… 나는 왜 이 모양일까."
    - "혼잣말이었다. 그러다 나를 발견하고 화들짝 놀라 목검을 주워 든다."
    - 아렌@당황: "어, 언제부터 있었어? 방금 거… 못 본 걸로 해 줘요. 아니, 해 줘."
    - 아렌: "성검을 들면 몸이 알아서 움직여. 근데 그건 내가 하는 게 아니잖아. 검이 하는 거지."
    - 아렌: "그래서 목검으로 연습하는데… 보다시피."
    - "아렌이 물집 잡힌 손바닥을 펴 보였다. 양치기 지팡이를 쥐던 손이다. 검을 쥐는 법은 아직 모른다."
    - 속마음: "(원작의 아렌은 이런 말을 하지 않았다. 대사를 고르는 건 플레이어였으니까.)"
    - 속마음: "(이제 이 녀석은 자기 말을 한다. 그리고 그 말을 듣는 건, 화면 밖이 아니라 나다.)"
  choices:
    - text: 같이 연습한다
      effects: ["affinity.aren += 6", "aren.kind += 0.5", "stat.근력 += 1"]
      lines:
        - "말없이 목검을 하나 집어 들고 아렌 맞은편에 섰다."
        - 아렌@놀람: "…같이 해 주게?"
        - 나: "혼자 휘두르면 재미없잖아. 내가 막을 테니까 쳐 봐."
        - "첫 일격은 엉망이었다. 두 번째도. 열 번째쯤부터 목검 부딪히는 소리가 제법 맑아졌다."
        - "등불 아래 두 그림자가 엇갈렸다 떨어졌다를 되풀이했다."
        - 아렌@웃음: "고마워. 혼자 하면 자꾸 성검 생각만 나거든."
        - 아렌: "근데 너랑 하니까… 이건 그냥 내 팔이 하는 거라서. 그게 좋아."
        - "기숙사로 돌아가는 길, 아렌은 새로 잡힌 물집을 훈장처럼 자랑했다."
        - 속마음: "(검이 아니라 사람과 부딪혀 본 손. 원작 아렌에겐 없던 물집이다.)"
    - text: "\"성검에 기대지 말고 기본기부터\"라고 조언한다"
      requires: "stat.지성 >= 16 or note.note_tourney.known"
      effects: ["affinity.aren += 4", "aren.boost += 1"]
      lines:
        - 나: "성검에 기대지 말고 기본기부터 해. 발, 허리, 그다음이 팔이야."
        - 나: "검이 알아서 움직이는 동안 네 몸은 아무것도 안 배워. 검이 안 움직이는 날이 오면?"
        - "아렌의 얼굴에서 웃음기가 빠졌다. 성검 이야기에서만 짓는 얼굴이다."
        - 아렌@진지: "…검이 안 움직이는 날."
        - 아렌: "…기본기. 맞아. 그렇게 할게."
        - "아렌이 목검을 고쳐 쥐었다. 이번엔 발부터 움직인다. 느리지만, 검 끝이 모래를 긁지 않았다."
        - 속마음: "(원작의 아렌은 3학년이 되어서야 이걸 깨닫는다.)"
        - 속마음: "(그것도 피를 한참 흘린 다음에. 이번엔 피 대신 물집으로 배우면 된다.)"
        - 아렌@웃음: "발부터, 허리, 그다음 팔. …양 몰 때랑 비슷하네. 양도 앞발부터 돌려야 하거든."
    - text: 그냥 지나간다
      effects: ["aren.cold += 0.5"]
      lines:
        - "못 본 척 지나쳤다. 지금은 내 훈련만으로도 벅차다."
        - 속마음: "(아렌은 주인공이다. 혼자서도 어떻게든 강해진다. 원작에선 그랬다.)"
        - "훈련장 문을 나서는데, 등 뒤에서 목검이 다시 모래에 떨어지는 소리가 났다."
        - "주워 드는 소리. 다시 휘두르는 소리."
        - "뒤에서 목검 부딪히는 소리가 오래도록 들렸다."
        - "기숙사 창문을 닫을 때까지도. 상대는 허수아비뿐이었을 텐데."

- id: enc_train_injury
  title: 무리한 대가
  on: 훈련장
  pool: true
  repeat: true
  cooldown: 3
  chance: 0.6
  when: "fatigue >= 60"
  lines:
    - "며칠째 쉬지 않고 훈련장에 나왔다. 아침에 일어나면 종아리가 돌덩이 같다."
    - "오늘도 몸을 풀자마자 숨이 턱에 찼다. 목검이 평소보다 두 배는 무겁다."
    - "모래가 발목을 붙잡는 것 같다. 귀에서 웅웅 소리가 난다."
    - 동기: "야, 너 얼굴 하얗다. 좀 쉬어!"
    - 속마음: "(피로가 쌓이면 부상 확률이 오른다. 원작에선 그게 숫자로 보였는데.)"
    - 속마음: "(여기선 숫자 대신 무릎이 말해 준다. 그만하라고.)"
    - "한 번만 더. 딱 한 번만 더 하고 쉬자."
    - "발을 내딛는 순간, 시야 가장자리가 하얗게 번쩍였다."
    - "피로가 쌓인 다리가 꼬였다."
  check: { label: 부상 회피, value: "stat.체질 + stat.민첩 / 2 - 30 * mod.injury + luck", dc: 26 }
  success:
    lines:
      - "땅이 기울었다. 반사적으로 목검을 모래에 꽂아 몸을 지탱했다."
      - "넘어지기 직전에 버텼다. 무릎이 바닥에서 한 뼘 위에서 멈췄다."
      - "심장이 귀에서 뛴다. 손이 떨린다."
      - 속마음: "(방금 넘어졌으면 발목이었다. 무투대회 전에 발목이 나가면 끝이다.)"
      - "오늘은 여기까지 하자."
      - "물통의 물을 머리에 통째로 끼얹었다. 그제야 귀의 웅웅 소리가 멎는다."
      - "목검을 거두고 한참 그늘에 앉아 있었다. 바람이 땀을 다 식혀 줄 때까지."
  fail:
    lines:
      - "땅이 기울었다. 짚을 데를 찾았지만 손이 허공을 긁었다."
      - "우드득. 몸 안에서 들으면 안 되는 소리가 났다."
      - 나레이션:
          - "발목을 접질렀다. 며칠은 절뚝거리겠다."
          - { when: "talent.무통증", text: "발목이 이상한 각도로 꺾였는데 아프지 않다. 그게 더 무섭다." }
      - "근처에 있던 동기가 달려와 의무실까지 어깨를 빌려줬다."
      - 삽화: infirmary
      - 의무관: "또 쉬라는 말 안 듣는 학생이군. 그런 애들이 꼭 여기 와. 발목은 얼음물에 담가."
      - 의무관@진지: "몸은 장부 같은 거야. 빌려 쓴 만큼 반드시 받아 가."
      - 속마음: "(원작에선 '부상' 아이콘 하나였다. 아이콘은 이렇게 욱신거리지 않았다.)"
      - when: "talent.무통증"
        속마음: "(아프지 않으니까 멈출 줄을 몰랐다. 이 몸은 그게 문제다.)"
      - "기숙사 계단을 한 칸씩 올랐다. 오늘 밤은 길 것 같다."
    effects: ["fatigue += 15", "stress += 10 * (1 + mod.stress)"]

- id: enc_train_senior
  title: 선배의 대련 신청
  on: 훈련장
  pool: true
  repeat: 2
  cooldown: 3
  when: "stat.근력 >= 25"
  lines:
    - "훈련장 한가운데서 허수아비를 상대로 내려베기를 하던 참이었다."
    - "그늘에 앉아 있던 상급생 몇이 이쪽을 가리키며 수군거린다. 그중 하나가 일어섰다."
    - "어깨가 넓다. 검술부 3학년 표식이 달린 훈련복. 목검 손잡이가 손때로 새카맣다."
    - 선배: "1학년 중에 힘 좀 쓴다는 게 너냐? 한 판 붙자."
    - 나@당황: "…저요?"
    - 선배@웃음: "허수아비가 불쌍해서 그런다. 그 정도 힘이면 사람한테 써 봐야지."
    - when: "fired.enc_train_senior >= 2"
      선배: "저번엔 재밌었지. 오늘은 처음부터 진심으로 간다."
    - "말이 끝나기도 전에 구경꾼이 모여들었다. 누가 모래 위에 목검으로 커다란 원을 그었다."
    - 상급생: "원 밖으로 밀리거나 목검 놓치면 지는 거다. 머리는 치지 말고."
    - 학생 A: "3학년이 1학년한테 대련을? 저거 신고식이잖아."
    - 학생 B: "근데 저 1학년, 요즘 맨날 훈련장에 있던 애 아냐?"
    - "선배가 몸을 푼다. 목검을 등 뒤로 크게 젖혔다가, 통째로 휘두른다. 바람이 뺨까지 왔다."
    - 속마음: "(큰 걸 좋아하는 타입이다. 등 뒤로 젖히면, 그다음은 통째로 휘두르기.)"
    - 속마음: "(평범하게 칠 때는 어깨에 먼저 힘이 들어간다. 버릇이 정직하다. 원작 잡몹보다도.)"
    - 속마음: "(…보이는 것과 피할 수 있는 건 다른 문제지만.)"
    - "원 안으로 들어섰다. 모래가 발바닥 아래서 서걱인다."
    - 선배@진지: "자, 와라. 1학년."
  battle:
    enemy: senior
    win:
      lines:
        - "선배의 휘두르기가 허공을 갈랐다. 그 틈으로 파고들어 손목을 쳤다."
        - "딱. 맑은 소리."
        - "선배의 목검이 바닥을 굴렀다. 원 밖까지 굴러가서야 멈췄다."
        - "한순간 조용했다. 그리고 주변에 구경꾼이 몰려들었다."
        - 학생들: "1학년이 3학년을 이겼어!"
        - "선배가 저린 손목을 털며 나를 내려다봤다. 화난 얼굴이 아니다."
        - 선배@놀람: "…하. 젖히는 순간 들어오다니. 그거 누가 가르쳐 줬냐."
        - 나: "보이길래요."
        - 선배@웃음: "보이길래, 라. 건방진 놈. 마음에 든다."
        - 선배: "검술부 놈들한테 말해 둘게. 올해 1학년 중에 진짜가 하나 있다고."
        - 속마음: "(이름이 퍼진다. 원작이라면 '평판 상승' 효과음 하나로 끝났을 순간이다.)"
        - "목검을 쥔 손이 아직 떨린다. 이번엔 피로 때문이 아니다."
      effects: ["reputation += 8", "stat.근력 += 2"]
    lose:
      lines:
        - "젖히는 동작을 읽었다. 읽었는데, 몸이 따라가지 못했다."
        - "통째로 날아온 일격을 목검으로 받았다. 손바닥이 찢어질 듯 울렸다."
        - "목검을 놓쳤다. 원 밖에 떨어지는 소리가 유난히 크다."
        - 학생들: "역시 3학년이지."
        - "주저앉은 내 위로 그림자가 드리웠다. 선배가 손을 내밀고 있다."
        - "손을 잡고 일어서자, 선배가 어깨를 두드린다. 생각보다 세게."
        - 선배: "나쁘지 않아. 2학년 되면 다시 붙자."
        - 선배@웃음: "마지막에 내 젖히는 거 보고 들어오려던 거, 봤다. 눈은 벌써 3학년이야. 몸이 1학년이지."
        - "선배가 원 밖의 내 목검을 주워, 손잡이 쪽으로 돌려 내밀었다."
        - 속마음: "(보이는데 못 따라간다. 3,000시간 동안 화면 앞에선 한 번도 없던 일이다.)"
        - 속마음: "(여기선 손가락이 아니라 이 몸이 움직여야 하니까.)"
        - "손바닥이 얼얼하다. 그 얼얼함이 이상하게 오래 남았다."
      effects: ["stat.민첩 += 1"]

# ================================================================ 도서관
- id: enc_lib_librarian
  title: 사서 노인
  on: 도서관
  pool: true
  repeat: 3
  cooldown: 2
  effects: ["affinity.librarian += 4"]
  branch:
    - when: "fired.enc_lib_librarian >= 3"
      lines:
        - "비 오는 오후. 도서관 창에 빗줄기가 비스듬히 그어진다. 열람실이 유난히 따뜻하다."
        - "사서 노인이 난로 옆 의자에서 차를 끓이고 있었다. 나를 보더니 말없이 잔을 하나 더 꺼낸다."
        - 사서: "앉게. 이런 날 책만 보면 눈이 상해."
        - "보리차 냄새가 난다. 잔 가장자리의 이가 하나 빠져 있다. 아주 오래 쓴 잔이다."
        - 나: "어르신은 이 도서관에 오래 계셨어요?"
        - 사서: "글쎄. 세는 걸 그만둔 지 오래라."
        - "노인이 창밖의 비를 본다. 창이 아니라, 아주 먼 곳을 보는 눈이다."
        - 사서: "비가 오면 길 생각이 나. 젊을 땐 많이 걸었거든."
        - 사서@웃음: "칼데라 고개를 넘으면 은빛 숲이 나오지. 거기 여관 주인이 술을 잘 담가."
        - 사서: "꿀을 넣은 사과술인데, 한 잔이면 고개 넘느라 언 발이 다 녹아. 일행이 한 통을 다 비웠지."
        - "노인이 소리 없이 웃었다. 어제 일을 떠올리는 사람처럼."
        - 속마음: "(칼데라 고개… 천 년 전 지명이다. 지금은 잿빛 장벽 너머의 땅인데.)"
        - when: "perk.고인물의기억 or perk.공략위키편집자"
          속마음: "(위키 고대 지명 문서에서 본 이름이다. '현재 위치: 장벽 외곽. 접근 불가.')"
        - 나: "…그 여관, 아직 있어요?"
        - "노인의 웃음이 멎었다. 잔을 내려놓는 손이 아주 조금 느렸다."
        - 사서: "……아니. 없겠지. 다 오래전 얘기일세."
        - 사서@슬픔: "늙으면 책에서 읽은 것과 겪은 것이 섞여. 신경 쓰지 말게."
        - "빗소리만 남았다. 차가 다 식을 때까지 노인은 다시 입을 열지 않았다."
        - 속마음: "(책에서 읽었다고 하기엔, 술맛까지 기억하고 있었다.)"
        - "돌아가는 길에 우산을 빌려줬다. 손잡이가 닳아 반들거리는, 아주 낡은 우산이었다."
      plants:
        - { id: F15, notice: { value: "stat.지성 + 15 * talent.완전기억 + 10 * perk.고인물의기억", dc: 30 } }
    - when: "fired.enc_lib_librarian >= 2"
      lines:
        - "폐관 한 시간 전. 열람실엔 나와 사서 노인뿐이다. 펜 끝이 종이를 긁는 소리만 들린다."
        - "노인은 대출 창구에 앉아 반납된 책을 한 권씩 펼쳐 본다. 접힌 귀퉁이를 펴고, 끼워진 낙엽을 빼낸다."
        - "책 한 권을 반납하러 갔다. 노인이 장부에 이름을 적다 말고 고개를 들었다."
        - "흐린 눈이다. 그런데 이상하게, 그 눈에 붙잡힌 것처럼 움직일 수가 없다."
        - 사서: "이번 주에만 네 번째군. 1학년이 이렇게 자주 오는 건 드문 일이야."
        - 나: "시험이 다가와서요."
        - 사서: "시험 공부하는 아이들은 시험 범위만 찾지. 자네는 연대기와 지도만 찾더군."
        - 사서: "꼭 어디서 무슨 일이 터질지 맞춰 보는 사람처럼."
        - "숨이 멎었다."
        - 사서@진지: "자네 눈은… 처음 이 학교에 온 사람 눈이 아니군."
        - 속마음: "(…들켰나?)"
        - 속마음: "(아니, 그럴 리가 없다. NPC가 빙의를 알아채는 시스템 같은 건 원작에 없었다.)"
        - 나@당황: "그, 그게 무슨…"
        - 사서: "길을 이미 한 번 걸어 본 사람 눈이야. 그런 눈은 늘 발밑이 아니라 저 앞을 보지."
        - "노인이 반납 도장을 꾹 찍었다. 쿵. 그 소리에 겨우 숨이 돌아왔다."
        - 사서@웃음: "늙은이 헛소리일세. 앞만 보다 넘어지지 말라는 얘기야."
        - "도서관을 나와서도 한참 등이 서늘했다."
        - 속마음: "(원작에 없던 시스템. …원작에 없던 게, 이 세계엔 너무 많다.)"
    - lines:
        - "해가 기운 도서관 이층. 창으로 들어온 빛이 먼지를 금가루처럼 띄운다."
        - "책을 찾으러 서가 깊숙이 들어갔다가, 사다리 위의 사서 노인과 눈이 마주쳤다."
        - "노인이 낡은 책 한 권을 품에 안고 사다리를 내려온다. 한 칸, 한 칸. 서두르는 법이 없다."
        - 사서: "찾는 책이 있나."
        - 나: "대륙사 개론 2권이요. 아무리 찾아도 안 보여서요."
        - 사서: "3번 서가, 아래서 넷째 칸. 1권 뒤에 숨어 있을 걸세. 다들 1권만 빼 가고 2권은 밀어 넣거든."
        - "정말로 거기 있었다. 1권 뒤에, 등을 돌린 채로."
        - 속마음: "(원작에서 이 사람은 대사 세 줄짜리 NPC였다. '조용히 하게', '대출은 일주일', '책은 제자리에'.)"
        - 속마음: "(그런데 이 노인은 서가 수천 칸을 머릿속에 통째로 넣고 있다.)"
        - "노인은 품에 안은 책 표지를 소매로 닦고 있었다. 너무 닳아 제목이 보이지 않는다."
        - 나: "그 책은 많이 낡았네요."
        - 사서: "나보다 어리네. 이래 봬도."
        - "농담인지 아닌지 알 수 없는 얼굴이다. 노인이 책을 서가에 꽂으며 중얼거렸다."
        - 사서@슬픔: "책은 사람보다 오래 산다네. 사람이 책보다 오래 살면, 그건 저주지."
        - 나: "…네?"
        - "무슨 뜻이냐고 묻기도 전에, 노인은 다시 사다리를 오르고 있었다."
        - "창밖에서 저녁 종이 울렸다. 노인의 굽은 등이 서가 그림자 속으로 사라졌다."
        - 속마음: "(대사 세 줄짜리 NPC치고는… 너무 무거운 한 줄이다.)"

- id: enc_lib_mirabel
  title: 도서관의 미라벨
  on: 도서관
  pool: true
  repeat: 3
  cooldown: 2
  when: "time.month >= 4"
  lines:
    - "도서관 2층, 마도학 서가 옆 창가 자리. 늘 비어 있던 그 자리에 책으로 쌓은 탑이 서 있다."
    - "고급 마법서를 산더미처럼 쌓아둔 자리. 미라벨이다."
    - "『삼중 술식의 구조』, 『바람 계열 영창 단축론』, 『마탑 연합 논문집 47호』. 1학년이 볼 책이 아니다."
    - "미라벨은 깃펜을 입에 문 채 양피지에 술식을 그리고 있다. 지우고, 다시 그리고, 또 지운다."
    - "책을 찾느라 그 옆을 지나가는데, 날카로운 목소리가 발목을 잡았다."
    - 미라벨:
        - "뭘 봐. 이 책 네 수준엔 안 맞을 텐데."
        - { when: "rival.mirabel", text: "또 너야? …이 술식, 넌 어떻게 풀었는데." }
    - when: "rival.mirabel"
      나레이션: "미라벨이 턱으로 양피지를 가리켰다. 묻는 게 아니라 시험하는 얼굴이다."
    - when: "not rival.mirabel"
      나레이션: "그렇게 말하면서도 미라벨의 시선은 양피지에서 떨어지지 않는다. 같은 자리를 벌써 세 번째 지우고 있다."
    - "양피지를 내려다봤다. 바람 계열 3단 술식. 두 번째 고리에서 마력 흐름이 엉켜 있다."
    - 속마음: "(이거, 원작 마도과 퀘스트에 나오던 술식이다. 정답 루트가 두 개였지. 아마.)"
    - 속마음: "(아마, 가 문제다. 3,000시간 동안 그 퀘스트는 공략 보고 깼으니까.)"
    - 나: "두 번째 고리, 순서를 뒤집어 보면 어때?"
    - 미라벨@화남: "…뒤집어? 그럼 영창이 꼬이잖아. 설명해 봐. 말이 되면 들어 줄게."
  check: { label: 술식 토론, value: "stat.지성 + stat.마력제어 / 2 + luck", dc: 34 }
  success:
    lines:
      - "펜을 빌려 양피지 귀퉁이에 고리를 다시 그렸다. 둘째와 셋째를 맞바꾸고, 흐름을 바깥에서 안으로."
      - "미라벨이 눈을 가늘게 뜨고 선을 따라간다. 입술이 소리 없이 영창을 짚는다."
      - "그녀의 손끝에서 작은 바람이 한 바퀴, 깔끔하게 돌았다."
      - 미라벨@놀람: "……돌았어."
      - 미라벨@당황: "…그런 해석도 있네. 인정하긴 싫지만."
      - 나: "방금 인정한 거지?"
      - 미라벨@화남: "안 했어. 기록에 남기지 마."
      - "그러면서 미라벨은 내 그림을 자기 양피지에 정성껏 옮겨 그렸다. 귀퉁이에 작게, 내 이름 첫 글자까지."
      - 속마음: "(칭찬 한 마디에 귀까지 빨개진다. 원작 일러스트엔 이런 표정이 없었는데.)"
      - "폐관 종이 울릴 때까지 미라벨은 다음 술식을 내 쪽으로 밀어 왔다. 말은 한마디도 없이."
    effects: ["affinity.mirabel += 6", "trust.mirabel += 4", "stat.지성 += 1"]
  fail:
    lines:
      - "자신 있게 설명을 시작했다. 셋째 줄쯤에서 내 말이 스스로 꼬이기 시작했다."
      - "미라벨이 팔짱을 끼고 끝까지 들었다. 끝까지 들어 주는 게 더 아프다."
      - 미라벨: "그렇게 뒤집으면 마력이 역류해서 시전자 손이 날아가. 3학년 교재 첫 장에 있는 얘기야."
      - 나@당황: "…아."
      - 미라벨: "역시. 다음엔 예습하고 와."
      - "미라벨이 책탑 맨 아래에서 한 권을 빼서 내 쪽으로 밀었다. 『술식 기초 — 개정판』."
      - 미라벨@화남: "빌려주는 거 아니야. 원래 거기 놓여 있던 거야."
      - 속마음: "(공략은 외웠는데 이론은 안 외웠다. 고인물의 맹점이다.)"
      - "표지 안쪽에 단정한 글씨로 이름이 적혀 있었다. ── 미라벨 폰 아델하이트."
      - "여백마다 주석이 빼곡했다. 앞쪽 글씨는 삐뚤빼뚤하다. 아주 어릴 때부터 몇 년에 걸쳐 쓴 주석이다."
    effects: ["affinity.mirabel += 2"]

- id: enc_lib_study
  title: 몰입
  on: 도서관
  pool: true
  repeat: true
  cooldown: 1
  lines:
    - 나레이션:
        - "열람실 창가 자리. 오늘은 마법 이론서를 펼쳤다."
        - { when: "time.month == 6", text: "열람실 창가 자리. 장맛비가 유리창을 두드린다. 오늘은 마법 이론서를 펼쳤다." }
        - { when: "time.month == 7", text: "열람실 창가 자리. 매미 소리가 창을 넘어온다. 오늘은 마법 이론서를 펼쳤다." }
    - "첫 장은 늘 지루하다. 마력의 정의, 술식의 분류, 3대 학파의 역사."
    - 속마음: "(원작에선 '도서관에서 공부한다' 버튼 한 번이면 지성 +1이었다. 3초.)"
    - 속마음: "(그 3초짜리 버튼 안에 이렇게 많은 글자가 들어 있었을 줄이야.)"
    - "그런데 열 장쯤 넘기자, 글자가 머리에 들러붙기 시작했다."
    - "원작에서 숫자로만 보던 것들에 이유가 붙는다."
    - "바람 계열은 왜 영창이 짧은지. 치유 마법은 왜 신관만 쓰는지."
    - "옆자리 학생이 일어서고, 다른 학생이 앉고, 그 학생도 일어섰다."
    - "창으로 들어온 빛이 책상 위를 천천히 기어가다가, 서가 끝에서 사라졌다."
    - "사서 노인이 등불을 하나씩 켜며 지나갔다. 내 자리 앞에서 아주 잠깐 걸음이 느려졌다."
    - 나레이션:
        - "문득 고개를 드니 창밖이 어둡다. 꽤 많이 읽었다."
        - { when: "talent.완전기억", text: "오늘 읽은 책 세 권이 머릿속 서가에 그대로 꽂혔다." }
        - { when: "talent.집중력", text: "시간 가는 줄 몰랐다. 노트가 빼곡하다." }
    - "목을 돌리자 뚝뚝 소리가 났다. 엉덩이에 감각이 없다."
    - when: "talent.산만함"
      나레이션: "…노트 여백의 낙서가 본문보다 많다. 그래도 읽긴 읽었다."
    - "노트를 훑었다. 내 글씨인데, 오늘 아침의 나보다 아는 게 많은 사람의 글씨 같다."
    - 속마음: "(원작 지식은 정답지다. 그런데 정답지가 틀리기 시작하면, 그땐 진짜로 공부한 것만 남는다.)"
    - "읽던 책을 반납하고, 다음 권을 빌렸다. 사서 노인이 말없이 도장을 찍어 준다."
    - "도서관 계단을 내려오자 밤공기가 머리를 식혀 준다. 머릿속이 꽉 찬 서가처럼 묵직하다."
  effects: ["stat.지성 += 1"]

- id: enc_lib_bistol
  title: 비스톨 교수의 대출 목록
  on: 도서관
  pool: true
  when: "time.month >= 4"
  lines:
    - "폐관 직전, 대출 창구 앞. 반납할 책을 들고 줄을 섰다."
    - "앞사람은 헝클어진 회색 머리에 얼룩진 실험복 차림이다. 약품 냄새가 훅 끼친다."
    - "대출 창구에서 비스톨 교수와 마주쳤다."
    - "교수는 책 대여섯 권을 한꺼번에 빌리는 중이었다. 사서 노인이 장부에 적는 동안 손가락으로 창구를 톡톡 두드린다."
    - "내가 뒤에 선 걸 알아챘는지, 그가 고개를 돌렸다. 그리고 황급히 책을 품에 감춘다."
    - "너무 서두른 탓에 맨 위의 한 권이 미끄러졌다. 바닥에 떨어진 책을 내가 먼저 주웠다."
    - "책등에 적힌 제목이 언뜻 보였다. 『사자(死者) 소생 이론 — 금기의 역사』."
    - "표지 귀퉁이에 금서 서가의 붉은 딱지가 붙어 있다."
    - 비스톨@당황: "…연구 자료일 뿐이네."
    - "그가 책을 낚아채듯 받아 들었다. 손끝이 얼음처럼 차갑다."
    - 비스톨: "연금술은 생명을 다루는 학문이야. 금기의 역사를 알아야 금기를 피하지. 그뿐이네."
    - 나: "…네."
    - "아무도 묻지 않았는데, 그는 설명을 덧붙였다. 설명이 길수록 변명처럼 들린다."
    - 사서: "반납은 이 주 뒤일세, 교수. 지난번처럼 넉 달씩 품고 있지 말고."
    - 비스톨: "……알겠습니다."
    - "교수가 책 더미를 끌어안고 서둘러 문을 나섰다. 굽은 등이 복도 끝 어둠으로 사라진다."
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(심연교단 교주. 원작 공식 설정이다. 그런데 위키 어디에도 '왜'는 적혀 있지 않았다.)"
    - 속마음: "(죽은 사람을 되살리는 이론. 저 사람은 누구를 되살리고 싶은 걸까.)"
    - "사서 노인이 장부를 덮으며 혼잣말처럼 중얼거렸다."
    - 사서: "저 책을 빌려 간 사람들은 다들 같은 얼굴이었지. 뭔가를 너무 오래 붙잡고 있는 얼굴."
  effects: ["met.bistol = 1"]
  plants:
    - { id: F17, notice: { value: "stat.지성 + 10 * talent.직감", dc: 24 } }

- id: enc_lib_forbidden
  title: 금서 열람증
  on: 도서관
  pool: true
  when: "stat.지성 >= 28"
  lines:
    - "오늘도 도서관 문이 열리자마자 들어왔다. 늘 앉는 창가 자리에 가방을 내려놓는데, 마른기침 소리가 났다."
    - "사서 노인이 등 뒤에 서 있다. 언제 왔는지 발소리도 없었다."
    - 사서: "자네, 매일 오는군."
    - 나@당황: "…시끄럽게 했나요?"
    - 사서: "아니. 너무 조용해서 탈이지. 서가를 다 읽어 치울 기세야."
    - "노인이 소매 속에서 무언가를 꺼냈다. 손때 묻은 청동 패. 가장자리에 열쇠 모양이 새겨져 있다."
    - 사서: "…이걸 주지. 금서 서가 열람증일세."
    - 사서@진지: "금서라고 다 위험한 책은 아니네. 대개는 누군가 잊히길 바란 책이지."
    - 사서: "읽되, 너무 오래 펼쳐 두지는 말게."
    - 속마음: "(금서 서가 열람증. 원작에선 3학년 마도과 퀘스트 보상이었다. 1학년이 받을 물건이 아니다.)"
    - 속마음: "(이 노인은 원작보다 후하다. 아니면, 나를 뭔가로 보고 있다.)"
    - "열람증을 대자 지하 서가의 쇠창살 문이 소리 없이 열렸다. 차가운 공기와 오래된 가죽 냄새."
    - "금서 서가에는 제국 초기 연대기가 있었다."
    - "『아스테라 건국기』. 금박이 다 벗겨진 두꺼운 책. 마왕 봉인 직후의 기록이다."
    - "봉인 전쟁의 경과, 동원된 병력, 성검 에테르의 이름. 꼼꼼한 기록이 이어지다가──"
    - "초대 용사의 이름이 적힌 쪽만 찢겨 있다."
    - "찢긴 자리가 깨끗하다. 실수로 찢어진 게 아니다. 칼로 도려낸 것처럼."
    - 속마음: "(원작에서도 초대 용사의 이름은 한 번도 나오지 않았다. 커뮤니티 정설은 '개발진이 이름 짓기 귀찮았다'.)"
    - 속마음: "(…정말 귀찮아서였을까.)"
    - "책을 덮고 고개를 드니, 쇠창살 너머에서 사서 노인이 등불을 들고 서 있었다."
    - 사서: "찾던 걸 찾았나."
    - 나: "…아니요. 찾던 게 없어서요."
    - 사서: "그렇지. 금서 서가는 원래 그런 곳일세. 있는 것보다 없는 게 더 많아."
  effects: ["know.library_access = 1", "stat.지성 += 2", "affinity.librarian += 6"]

# ================================================================ 마법 실습실
- id: enc_magic_elvera
  title: 엘베라 교수의 개인 지도
  on: 마법실습
  pool: true
  repeat: 3
  cooldown: 2
  when: "met.elvera"
  effects: ["affinity.elvera += 5", "stat.마력제어 += 1"]
  lines:
    - "실습이 끝난 마법 실습실. 다들 빠져나가고, 바닥엔 그을음 자국만 남았다."
    - "혼자 남아 불꽃 띄우기를 연습하는데, 자꾸 불꽃이 손끝에서 일그러진다."
    - "뒤에서 은방울 같은 웃음소리가 났다. 엘베라 교수가 창틀에 걸터앉아 있다."
    - 엘베라: "너무 꽉 쥐고 있네요. 손에 힘 빼 봐요."
    - "교수가 창틀에서 내려와 내 손바닥 아래에 자기 손바닥을 받쳤다. 서늘하고 마른 손이다."
    - 엘베라:
        - "마력은 물이에요. 움켜쥐면 새어 나가죠."
        - { when: "talent.마나탱크", text: "그릇이 크네요. 이렇게 큰 그릇은… 오래전 한 사람 이후 처음이에요." }
        - { when: "talent.마력폭주체질", text: "감정이 흔들리면 마력도 흔들려요. 숨부터 고르세요." }
        - { when: "fired.enc_magic_elvera >= 3", text: "그분도 처음엔 이렇게 서툴렀는데. …아니에요, 옛날 얘기예요." }
    - when: "fired.enc_magic_elvera >= 3 and not talent.마나탱크 and not talent.마력폭주체질"
      나레이션: "'그분'이라고 말할 때, 엘베라의 눈이 창밖 먼 곳을 향했다. 오백 년 너머 어딘가를."
    - when: "talent.마나탱크"
      속마음: "(오래전 한 사람. 오백 살 엘프의 '오래전'은 대체 언제일까.)"
    - 엘베라: "손바닥을 오목하게. 샘물 뜨듯이. 담는 거예요, 쥐는 게 아니라."
    - "시키는 대로 손을 오므렸다. 일그러지던 불꽃이 둥글게 가라앉는다."
    - "작은 등불 같은 불꽃이 손바닥 위에서 조용히 흔들렸다."
    - 엘베라@웃음: "그거예요. 봐요, 마력이 학생 손을 싫어한 게 아니었어요. 학생이 마력을 못 믿었던 거지."
    - 엘베라: "무서웠죠? 꽉 쥐지 않으면 마력이 손을 떠나 버릴 것 같아서."
    - 나: "…조금요."
    - 엘베라@진지: "다들 그래요. 놓치기 싫은 걸 가진 사람일수록 더."
    - 속마음: "(원작의 엘베라는 수업 화면 왼쪽에 서 있는 일러스트였다. 대사는 '오늘의 실습을 시작하죠' 하나.)"
    - 속마음: "(이렇게 손을 받쳐 주는 사람인 줄은 몰랐다.)"
    - "불꽃이 꺼질 때까지 교수는 말없이 지켜봤다. 창밖으로 노을이 번진다."
    - 엘베라: "오늘은 여기까지. 물은 하루에 너무 많이 길으면 우물이 마르거든요."
    - "실습실을 나서는데, 손바닥에 그 서늘한 감촉이 아직 남아 있었다."

- id: enc_magic_mirabel_duel
  title: 실기 대결
  on: 마법실습
  pool: true
  repeat: 2
  cooldown: 3
  when: "rival.mirabel or affinity.mirabel >= 10"
  lines:
    - "실기 수업이 끝난 마법 실습실. 조교가 결계석을 걷으려는데, 미라벨이 그 앞을 막아섰다."
    - 미라벨: "결계, 아직 걷지 마세요. 쓸 데가 있어서요."
    - "그리고 지팡이 끝으로 나를 가리켰다. 남아 있던 학생들의 시선이 한꺼번에 쏠린다."
    - 미라벨: "실습용 결계 안에서 한 판. 마법이든 뭐든 써도 좋아. 어차피 내가 이기니까."
    - when: "fired.enc_magic_mirabel_duel >= 2"
      미라벨@화남: "저번 판은 계산에 넣지 마. 그날은 바람이 안 좋았어. …실내였지만."
    - 조교: "…다치면 둘 다 엘베라 교수님께 혼나는 거 알지? 결계는 실습용이야. 죽진 않아."
    - 조교: "아마도."
    - "푸른 결계막이 반구 모양으로 솟아올랐다. 공기가 팽팽하게 조여든다."
    - "결계 안에 마주 섰다. 미라벨이 머리를 질끈 묶는다. 장난기라곤 한 톨도 없는 눈이다."
    - 학생 A: "미라벨이 D반이랑 붙는다고? 저거 공개 처형이야."
    - 학생 B: "쉿. 미라벨이 먼저 신청했대. 먼저."
    - 속마음: "(미라벨 폰 아델하이트. 원작 1학년 마법 실기 최강. 바람 계열.)"
    - 속마음: "(지팡이 끝에 바람이 돌면 칼날이 온다. 영창이 길어지면 그다음이 크다. 그 틈을 끊어야 한다.)"
    - 속마음: "(…알고 있어도, 화면 밖에서 보는 바람은 훨씬 빠르겠지.)"
    - "미라벨이 지팡이를 들어 올렸다. 끝에서 공기가 가늘게 울기 시작한다."
    - 미라벨@진지: "아델하이트의 이름으로. ──시작."
  battle:
    enemy: mirabel_duel
    win:
      lines:
        - "영창이 끝나기 직전, 그 반 박자 틈으로 파고들었다."
        - "결계가 깨지는 소리. 유리 천 장이 한꺼번에 금 가는 소리."
        - "푸른 막이 조각조각 흩어지며 빛가루가 되어 내린다."
        - "미라벨이 무릎을 짚고 숨을 몰아쉰다."
        - "묶었던 머리가 반쯤 풀려 땀에 젖은 이마에 붙었다."
        - "실습실이 조용했다. 아무도 박수를 치지 않았다. 다들 미라벨의 얼굴만 본다."
        - 미라벨@화남: "……한 번 더."
        - 나: "결계가 없잖아."
        - 미라벨@화남: "그럼 다음 주에. 결계석은 내가 챙겨 올 거야. 도망가면 죽여."
        - "미라벨이 지팡이를 짚고 일어섰다. 다리가 떨리는데, 등은 꼿꼿하다."
        - 속마음: "(지고 나서 울지도, 핑계를 대지도 않는다. 다음 날짜부터 잡는다.)"
        - 속마음: "(원작 공략 대상 중에 제일 귀찮고, 제일 무서운 성격이다. …마음에 든다.)"
      effects: ["affinity.mirabel += 8", "trust.mirabel += 5", "reputation += 5"]
    lose:
      lines:
        - "영창의 마지막 음절이 떨어졌다. 회오리가 결계 안을 가득 채운다."
        - "발이 바닥에서 떨어졌다가, 결계막에 등을 부딪치고 미끄러졌다. 숨이 한 번 끊긴다."
        - "눈을 떴을 때, 지팡이 끝이 코앞에 있었다."
        - 미라벨: "아델하이트를 이기려면 백 년은 이르지."
        - "미라벨이 지팡이를 거두었다. 그러고는 아주 잠깐, 시선을 피했다."
        - 미라벨@당황: "…그래도 영창 끊은 건 인정해. 세 번째 고리에서. 거기서 끊긴 거 처음이야."
        - 미라벨: "아버지 말고는."
        - "말해 놓고 아차 싶었는지, 미라벨이 휙 돌아서 결계석을 줍기 시작했다."
        - 속마음: "(가문 이야기만 나오면 목소리가 낮아진다. 그 낮은 목소리가, 승리 선언보다 오래 귀에 남는다.)"
        - "등이 욱신거린다. 그런데 이상하게, 진 것 같지가 않다."
      effects: ["affinity.mirabel += 4", "stress += 5"]

- id: enc_magic_backfire
  title: 마력 폭주
  on: 마법실습
  pool: true
  repeat: true
  cooldown: 3
  chance: 0.7
  when: "talent.마력폭주체질"
  lines:
    - "마법 실습실. 오늘 과제는 손끝에 촛불만 한 불꽃을 30초 동안 유지하는 것."
    - "옆자리 학생들이 하나둘 성공한다. 작고 얌전한 불꽃들."
    - "숨을 고르고 마력을 끌어올렸다. 손끝이 뜨거워진다."
    - "그 순간, 가슴 안쪽에서 무언가가 덜컥 열렸다."
    - 속마음: "(마력폭주체질. 원작에선 '마법 실습 시 일정 확률로 실패'라는 한 줄짜리 디버프였다.)"
    - 속마음: "(한 줄짜리가 아니었다. 이건 둑이 터지는 느낌이다.)"
    - "손끝의 불꽃이 갑자기 부풀어 오른다."
    - 학생 A: "야, 야, 저거 커진다!"
    - "주변 의자들이 일제히 뒤로 밀려났다. 불꽃이 주먹만 해지고, 머리통만 해진다."
  check: { label: 폭주 억제, value: "stat.의지 + stat.마력제어 / 2 + luck", dc: 28 }
  success:
    lines:
      - "이를 악물었다. 넷을 세며 들이쉬고, 넷을 세며 내쉬었다."
      - "머리통만 하던 불꽃이 떨면서, 천천히, 손톱만 하게 줄어든다."
      - "이를 악물고 눌러 담았다. 불꽃이 얌전해졌다. 조금 감이 온다."
      - "터진 둑의 문짝을 손으로 하나씩 닫는 느낌. 어디를 밀어야 닫히는지 알 것 같다."
      - 학생 B: "…방금 그거 일부러 키웠다 줄인 거야?"
      - 나: "…응. 일부러."
      - 속마음: "(거짓말이다. 그래도 다음엔 정말 일부러 할 수 있을 것 같다.)"
    effects: ["stat.마력제어 += 2"]
  fail:
    lines:
      - "누르려 할수록 커진다. 손끝이 아니라 팔꿈치까지 불길이 감겼다."
      - "펑."
      - "실습실 커튼이 반쯤 탔다. 시커먼 연기가 천장으로 말려 올라간다."
      - "학생들이 비명을 지르며 흩어지는 사이, 엘베라 교수가 손가락을 튕겼다. 불길이 촛불처럼 꺼졌다."
      - "엘베라 교수가 웃음을 참는다. 어깨가 미세하게 떨린다."
      - 엘베라@웃음: "이 실습실 커튼은 해마다 한 번씩 타요. 올해는 학생 차례였네요."
      - 나@당황: "…죄송합니다."
      - 엘베라: "괜찮아요. 넘친다는 건 그릇이 크다는 뜻이기도 하니까. 대신 오늘 남아서 커튼 꿰매요."
      - "그날 밤 손끝이 바늘에 찔려 너덜너덜해졌다. 마법보다 바느질이 어렵다."
    effects: ["fatigue += 10", "stress += 10"]

- id: enc_magic_aren
  title: 마법이 서툰 아렌
  on: 마법실습
  pool: true
  when: "time.month >= 4"
  lines:
    - "마법 실습실 맨 뒷줄. 다들 손끝에 불꽃을 띄우는데, 한 자리만 조용하다."
    - "아렌이 불꽃 하나 못 띄우고 끙끙대고 있다."
    - "손가락을 쫙 폈다가, 주먹을 쥐었다가, 손끝을 노려봤다가. 이마에 땀이 맺혀 있다."
    - "피식. 연기 한 줄기가 올라오고 끝이다."
    - 학생 A: "용사님이 불꽃 하나를 못 띄우네."
    - "킥킥대는 소리. 아렌의 귀 끝이 빨개진다. 못 들은 척 다시 손을 편다."
    - "옆자리로 옮겨 앉자, 아렌이 한숨처럼 웃었다."
    - 아렌@당황: "성검이 마력을 다 빨아가는 것 같아."
    - 아렌: "검을 쥐고 있을 땐 몸 안에 뭐가 막 흘러. 근데 놓으면… 텅 비어. 마른 우물처럼."
    - 아렌@슬픔: "용사라면서 불꽃 하나 못 띄우면, 다들 뭐라고 생각할까."
    - 속마음: "(원작의 아렌은 마법 스탯이 처참했다. '아렌은 검만 써라'가 공략의 기본이었다.)"
    - 속마음: "(그 공략대로 키워진 아렌은, 성검이 없으면 아무것도 못 하는 용사가 됐다.)"
  choices:
    - text: 요령을 알려준다
      requires: "stat.마력제어 >= 18"
      effects: ["affinity.aren += 8", "aren.kind += 0.5", "aren.boost += 1"]
      lines:
        - 나: "밀어내려고 하지 마. 우물이 말랐으면, 바닥에 고인 것부터 떠."
        - 나: "손끝 말고 배꼽 밑. 거기 남은 거 있어. 아주 조금이라도."
        - "아렌이 눈을 감았다. 미간이 찌푸려졌다가, 천천히 풀린다."
        - "손끝에서 연기가 아니라 빛이 새어 나왔다. 쌀알만 한 빛."
        - "아렌의 손끝에 작은 불꽃이 맺혔다."
        - 아렌@웃음: "됐다! 됐어! 너 진짜 대단하다."
        - "아렌이 불꽃을 든 채 벌떡 일어나 뒷줄 쪽으로 흔들어 보였다. 불꽃이 바로 꺼졌다."
        - 아렌@웃음: "…아. 그래도 됐어. 한 번 됐으면 두 번도 되겠지?"
        - "킥킥대던 뒷줄이 조용했다. 누군가 작게 박수를 쳤다."
        - 속마음: "(성검 없이 해낸 첫 불꽃. 원작 아렌한텐 없던 경험치다.)"
    - text: 응원만 한다
      effects: ["affinity.aren += 3"]
      lines:
        - 나: "괜찮아. 처음엔 다 그래. 나도 첫날엔 연기만 났어."
        - 아렌@놀람: "진짜? 너도?"
        - 나: "…거짓말 조금 섞였어."
        - 아렌@웃음: "하하, 그래도 고마워. 조금 섞인 거면 괜찮아."
        - "아렌은 수업이 끝날 때까지 손끝을 노려봤다. 불꽃은 끝내 뜨지 않았다."
        - "그래도 종이 울릴 때, 아렌의 얼굴은 수업 시작 때보다 밝았다."
        - when: "stat.마력제어 < 18"
          속마음: "(요령을 알려 줄 수 있으면 좋았을 텐데. 내 실력으론 아직 남을 가르칠 단계가 아니다.)"
        - when: "stat.마력제어 >= 18"
          속마음: "(알려 줄 수도 있었다. 그런데 오늘은, 혼자 해 보고 싶어 하는 얼굴이었다.)"

# ================================================================ 성당
- id: enc_chapel_luna
  title: 시스터 루나
  on: 성당
  pool: true
  repeat: 3
  cooldown: 2
  effects: ["affinity.luna += 5", "met.luna = 1"]
  branch:
    - when: "fired.enc_chapel_luna >= 2"
      lines:
        - 나레이션:
            - "비 오는 오후의 성당. 시스터 루나가 제단 앞에서 성검이 수놓인 휘장을 개고 있다."
            - { when: "fired.enc_chapel_luna >= 3", text: "다시 찾은 성당. 시스터 루나가 제단 앞에서 그 휘장을 또 개고 있다. 성검이 수놓인 휘장이다." }
        - 시스터 루나@웃음: "마침 잘 왔어요. 이쪽 끝 좀 잡아 줘요. 혼자 개면 성검이 꼭 반으로 접히거든요."
        - "휘장 양 끝을 맞잡았다. 금실로 수놓인 성검 에테르가 우리 사이에서 접혔다 펴졌다 한다."
        - 시스터 루나: "올해 성검이 반응했죠. 양치기 소년한테."
        - 나: "아렌이요."
        - 시스터 루나: "네, 그 아이. 다들 기적이라고 하더군요. 신께서 용사를 고르셨다고."
        - "휘장을 마지막으로 접으며, 그녀가 아무렇지 않게 말했다."
        - 시스터 루나: "성검이 용사를 고른다고들 하죠. 글쎄요. 성검은 고르지 않아요. 교회가 고르죠."
        - "빗소리가 갑자기 커진 것 같았다."
        - "시스터 루나가 개어 놓은 휘장을 품에 안고, 웃는 얼굴 그대로 나를 봤다."
        - 시스터 루나: "…방금 건 못 들은 걸로 해요."
        - 시스터 루나@웃음: "신학 교수가 하면 안 되는 말 목록이 있거든요. 방금 게 3번이에요."
        - 나@당황: "…1번이랑 2번은 뭔데요?"
        - 시스터 루나: "그건 아직 학생 학점으론 못 들어요."
        - 속마음: "(원작에서 용사 선정은 '성검의 의지'였다. 설정집 어디에도 교회가 고른다는 말은 없었다.)"
        - 속마음: "(그럼 아렌은? 대강당을 하얗게 물들인 그 빛은?)"
        - when: "fired.enc_chapel_luna >= 3"
          시스터 루나: "그리고 지난번에도 말했지만, 못 들은 걸로 해요. 두 번 들었으면 두 번 잊어요."
        - "그녀는 휘장을 성물 궤짝에 넣고 자물쇠를 채웠다. 철컥. 대화도 같이 잠겼다."
        - 시스터 루나: "비 그치면 가요. 감기 걸리면 기도도 못 해요."
        - "빗소리가 잦아들 때까지 맨 뒷줄에 앉아 있었다. 제단 위 성검 그림이 아까보다 낯설어 보였다."
      plants:
        - { id: F19, notice: { value: "stat.지성 + stat.의지 / 2", dc: 26 } }
    - lines:
        - "저녁 미사가 끝난 성당. 신자들이 빠져나간 의자 사이로 향 연기가 낮게 깔려 있다."
        - "스테인드글라스 너머 노을이 붉은 물처럼 바닥에 고였다."
        - "맨 뒷줄에 앉아 아무것도 하지 않았다. 아무것도 안 해도 되는 곳이 필요했다."
        - "촛대 사이를 오가던 수녀복 하나가 내 앞에서 멈췄다."
        - "시스터 루나. 신학 교수이자 이 성당을 지키는 사람. 늘 웃는 얼굴이다."
        - 시스터 루나: "기도하러 왔어요? 아니면 도망치러?"
        - 나@당황: "…둘 중에 고르면 혼나나요?"
        - 시스터 루나@웃음: "혼나는 건 교수회의에서 제가 나는 걸로 충분해요."
        - 시스터 루나: "둘 다 괜찮아요. 여긴 그러라고 있는 곳이니까."
        - "그녀가 한 칸 띄우고 옆에 앉았다. 가까이서 보니 웃는 눈 밑에 피곤이 짙다."
        - 시스터 루나: "신은 도망쳐 온 사람한테 더 너그러우세요. 경전엔 안 적혀 있지만, 제 경험상 그래요."
        - when: "perk.고인물의기억 or perk.공략위키편집자"
          속마음: "(시스터 루나. 원작에선 교회 숙청 이벤트에서 이름 한 줄로 퇴장하는 사람이다.)"
        - when: "perk.고인물의기억 or perk.공략위키편집자"
          속마음: "(그 한 줄 전에, 이렇게 웃는 사람이었구나.)"
        - when: "not perk.고인물의기억 and not perk.공략위키편집자"
          속마음: "(원작에선 신학 수업 화면에만 나오던 사람이다. 수업 밖의 얼굴은 처음 본다.)"
        - 시스터 루나: "자, 저는 촛대 마저 닦을게요. 다 쉬면 나갈 때 문만 살살 닫아 줘요. 경첩이 늙었거든요."
        - "그녀가 일어나 다시 촛대 사이로 걸어갔다. 콧노래가 성가인지 유행가인지 헷갈린다."
        - "한참을 더 앉아 있었다. 머릿속 연표가 아주 잠깐 조용해졌다."
        - "나갈 때 문을 닫자, 경첩은 정말로 늙은 소리를 냈다."

- id: enc_chapel_sera
  title: 성당의 세라
  on: 성당
  pool: true
  repeat: 3
  cooldown: 2
  when: "fate.sera == 'saved' or fate.sera == 'saved_quiet'"
  effects: ["affinity.sera += 6"]
  branch:
    - when: "fired.enc_chapel_sera >= 3"
      art: cg_sera_stigma
      lines:
        - "늦은 기도 시간. 성당 안에는 촛불 몇 개와 세라 하나뿐이다."
        - "세라는 제단 앞에 무릎을 꿇고 두 손을 모은 채 움직이지 않았다. 은발이 촛불 빛에 젖어 있다."
        - "방해하지 않으려고 문가에 섰다. 세라의 기도는 길었다. 입술만 소리 없이 움직인다."
        - "세라가 기도를 마치고 일어서는데, 손등에 희미한 빛 무늬가 떠올랐다 사라진다."
        - "촛불 빛이 아니다. 피부 안쪽에서 새어 나오는 빛. 꽃잎 같기도, 날개 같기도 한 무늬."
        - "세라가 나를 발견하고 흠칫했다. 그리고 반사적으로 손을 소매 속에 감췄다."
        - 세라@당황: "어… 언제부터 거기 있었어?"
        - 나: "방금. 그 손…"
        - "세라가 잠깐 망설이더니, 소매를 걷고 손등을 내밀었다. 빛은 이미 사라졌다. 하얀 손등일 뿐이다."
        - 세라@진지: "아, 이거? 어릴 때부터 가끔 이래. 아무한테도 말하지 마."
        - 세라: "기도를 오래 하면 따뜻해지면서 빛이 나. 엄마는 신의 축복이라고 했고, 마을 신부님은 피부병이라고 했어."
        - 세라@웃음: "나는 신부님 말이 더 맞는 것 같아. 축복은 좀 거창하잖아."
        - 속마음: "(성흔. 원작의 성녀보다 강한 빛.)"
        - when: "note.note_sera.known"
          속마음: "(원작에선 이 빛을 아무도 보지 못했다. 이 아이는 3월 시험장에서 쓰러져 고향으로 돌아갔으니까.)"
        - 속마음: "(교회가 알면 이 아이를 가만두지 않는다. 성녀로 떠받들든, 도구로 쓰든.)"
        - 세라: "…표정이 왜 그래. 그렇게 무서운 거야?"
        - 나: "아니. 그냥… 정말로 아무한테도 말하지 마. 특히 높은 사람들한테는."
        - "세라가 나를 오래 봤다. 그러다 천천히 고개를 끄덕였다."
        - 세라: "응. 너한테만 보여 준 거야. 그러니까 너도 지켜 줘."
        - "세라가 새끼손가락을 내밀었다가, 쑥스러운지 금방 거둬들였다. 대신 촛불 하나를 내 손에 쥐여 줬다."
        - 세라@웃음: "이건 네 몫. 같이 켜 줘. 아무도 안 다치게 해 달라는 기도야."
        - "둘이 나란히 촛불을 켰다. 세라의 손등은 다시 빛나지 않았다. 그래도 따뜻해 보였다."
        - 속마음: "(지켜야 할 비밀이 하나 늘었다. 이 세계에서 비밀은, 목숨이랑 같은 무게다.)"
      effects: ["know.sera_stigma = 1"]
    - when: "fate.sera == 'saved'"
      lines:
        - "오후의 성당. 세라가 맨 앞줄에서 기도서를 소리 내어 읽고 있다. 목소리가 작고 맑다."
        - "내 발소리에 세라가 고개를 들었다. 기도서를 덮고 옆자리를 손바닥으로 쓸어 준다."
        - 세라@웃음: "왔구나. 앉아. 여기 의자가 제일 덜 삐걱거려."
        - "나란히 앉았다. 스테인드글라스 빛이 세라의 은발 위에서 일곱 색으로 갈라진다."
        - "한참 아무 말도 하지 않았다. 세라가 손가락으로 기도서 모서리를 만지작거린다."
        - 세라: "있지. 시험 날 말이야."
        - 세라@슬픔: "시험 때 고마웠어. 나, 여기 남아도 되는 사람인지 아직 모르겠지만."
        - 나: "남아도 되는 사람이야."
        - 세라: "그날 너 점수 깎였잖아. 나 부축하느라. 그거 생각하면 아직도 밤에 잠이 안 와."
        - 세라: "내가 뭐라고. 그냥 은발에, 마을 신부님 추천서 한 장 들고 온 애인데."
        - when: "note.note_sera.known"
          속마음: "(원작에선 그 추천서 한 장 들고 왔다가, 그대로 돌아간 아이다.)"
        - 나: "점수는 다시 따면 돼. 그날 떨어졌으면 넌 다시 못 왔잖아."
        - "세라가 놀란 듯 나를 봤다. 그러다 고개를 숙이고 작게 웃었다."
        - 세라@웃음: "…그런 말은 어디서 배워? 신학 교재에도 없던데."
        - 세라: "그럼 열심히 할게. 남아도 되는 사람이 되도록."
        - "세라가 다시 기도서를 폈다. 이번엔 목소리가 조금 더 컸다."
        - 속마음: "(원작 연표에서 지워졌던 이름 하나가, 지금 내 옆에서 기도서를 읽고 있다.)"
    - lines:
        - "오후의 성당. 세라가 제단 꽃병의 물을 갈고 있다. 흰 백합이 고개를 숙이고 있다."
        - "세라가 나를 알아보고 가볍게 목례했다. 같은 반이지만 말을 섞은 적은 별로 없다."
        - 세라: "기도하러 왔어? 저쪽 자리가 조용해. 햇빛도 덜 들고."
        - "자리를 권하고 돌아서려던 세라가, 꽃병을 든 채 멈춰 섰다."
        - 세라: "저기… 혹시 그날 시험장에 있었어? 반 배정 시험."
        - 나@당황: "…응. 있었지. 다들 있었잖아."
        - 세라: "그렇지. 바보 같은 질문이네."
        - 세라@슬픔: "나 그날 쓰러질 뻔했거든. 그런데 감독관님이 갑자기 재시험을 시켜 주셨어. 누가 말씀드렸대."
        - 세라: "재시험 기회를 누가 만들어줬는지 몰라. 언젠가 꼭 감사 인사를 하고 싶은데."
        - 세라: "감독관님은 끝까지 안 알려 주셨어. 본인이 원하지 않았다고만."
        - 속마음: "(바로 앞에 있다고 말할까. …아니.)"
        - 속마음: "(원작에선 그 인사를 받을 사람도, 할 사람도 없었다. 지금은 둘 다 여기 있다. 그거면 됐다.)"
        - 나: "…그 사람도, 네가 남아서 다행이라고 생각할 거야."
        - 세라@웃음: "그러면 좋겠다. 그 사람 몫까지 기도하고 있거든. 매일."
        - "세라가 백합을 제단에 올려놓았다. 꽃잎 하나가 내 쪽으로 떨어졌다."
        - "기도하는 척 눈을 감았다. 누군가 나를 위해 매일 기도한다는 게, 이상하게 무거웠다."

- id: enc_chapel_dropped
  title: 떠난 사람의 자리
  art: cg_sera_note
  on: 성당
  pool: true
  when: "fate.sera == 'dropped'"
  lines:
    - "평일 오후의 성당. 텅 빈 의자들 위로 먼지가 빛 속을 천천히 떠다닌다."
    - "맨 뒷줄에 앉으려다, 등받이 틈에 끼워진 무언가에 손이 닿았다."
    - "성당 맨 뒷자리에 작은 쪽지가 끼워져 있다."
    - "접힌 자국이 여러 번 난 종이. 몇 번이고 폈다 접었다 한 흔적이다."
    - "조심스럽게 펼쳤다. 단정하고 작은 글씨."
    - "── 여기서 신학을 배우고 싶었어요. 세라."
    - "그게 전부였다. 날짜도, 받는 사람도 없었다."
    - "시험이 끝난 날, 고향으로 돌아가기 전에 들렀던 모양이다. 아무도 없는 시간에, 맨 뒷자리에."
    - "앞자리에 앉을 자격은 없다고 생각했을까."
    - 속마음: "(원작대로 흘러가게 둔 대가다.)"
    - 속마음: "(원작에도 이 쪽지가 있었을까. 있었다 해도, 나는 이 의자를 한 번도 들여다본 적이 없다.)"
    - when: "note.note_sera.known"
      속마음: "(원작 성녀보다 강한 신성력. 그 빛은 지금쯤 어느 시골 마을에서, 아무도 모르게 꺼져 가고 있겠지.)"
    - "쪽지를 다시 접어 원래 자리에 꽂아 두었다. 버릴 수도, 가져갈 수도 없었다."
    - "제단 쪽에서 시스터 루나가 이쪽을 보고 있었다. 무엇을 봤는지 아는 얼굴이다."
    - 시스터 루나@슬픔: "…그 자리, 치우지 말아 달라고 부탁받았어요. 그래서 안 치우고 있어요."
    - "그녀는 그 이상 아무것도 묻지 않았다. 나도 아무것도 말하지 않았다."
    - "성당을 나서는데 발이 무거웠다. 그날 시험장에서, 나는 내 점수를 골랐다."
    - 속마음: "(살아남으려고 고른 선택이었다. …그 선택에도 누군가의 이름이 붙어 있다는 걸, 이제 안다.)"
  effects: ["stress += 10"]

- id: enc_chapel_quiet
  title: 고요
  on: 성당
  pool: true
  repeat: true
  cooldown: 1
  lines:
    - "수업이 끝난 늦은 오후. 성당 문을 밀자 오래된 나무와 밀랍 냄새가 밀려 나왔다."
    - "발소리가 높은 천장까지 올라갔다가, 한참 뒤에야 내려온다."
    - "의자 등받이마다 손때가 반질반질하다. 수백 년 치 기도가 묻은 자국이다."
    - 나레이션:
        - "아무도 없는 성당. 스테인드글라스 빛이 바닥에 고인다."
        - { when: "talent.마왕의흔적", text: "성수반 근처에 가자 가슴이 욱신거렸다. 서둘러 자리를 떴다." }
        - { when: "talent.성흔", text: "제단 앞에 서자 손등이 따뜻해진다." }
    - 나레이션:
        - "빛 웅덩이 하나 옆 의자에 앉았다. 파랑과 빨강이 무릎 위에서 섞인다."
        - { when: "talent.마왕의흔적", text: "성당 뒤 돌계단에 주저앉았다. 셔츠 속 가슴께가 아직 화끈거린다." }
        - { when: "talent.성흔", text: "손등을 내려다봤다. 아무것도 보이지 않는데, 누가 손을 잡아 주는 것처럼 따뜻하다." }
    - 나레이션:
        - "기도문은 모른다. 원작에서 성당은 '의지 +1, 스트레스 -10' 버튼이었으니까."
        - { when: "talent.마왕의흔적", text: "원작에서 성당은 '의지 +1, 스트레스 -10' 버튼이었다. 이 몸에게는 아니다." }
        - { when: "talent.성흔", text: "제단 위 촛불 하나가, 바람도 없는데 이쪽으로 기울었다." }
    - 속마음:
        - "(그래도 이 고요는 버튼보다 낫다.)"
        - { when: "talent.마왕의흔적", text: "(이 몸 안에 무언가가 있다. 성수가 싫어하는 무언가가.)" }
        - { when: "talent.성흔", text: "(원작의 성녀가 이런 느낌이었을까. 아니, 원작은 이런 느낌까지는 그려 주지 않았다.)" }
    - 나레이션:
        - "눈을 감았다. 머릿속에서 늘 돌아가던 연표가 아주 잠깐 멈춘다."
        - { when: "talent.마왕의흔적", text: "눈을 감았다. 돌계단의 냉기가 화끈거리는 가슴을 조금씩 식혀 준다." }
        - { when: "talent.성흔", text: "눈을 감았다. 손등의 온기가 천천히 가슴까지 번져 온다." }
    - "멀리서 오르간 연습 소리가 들린다. 한 소절에서 자꾸 틀리고, 다시 처음부터 친다."
    - "세 번째쯤에야 그 소절이 무사히 넘어갔다. 나도 모르게 숨을 내쉬었다."
    - 나레이션:
        - "성당 문이 한 번 열렸다 닫히는 소리. 발소리는 끝내 들어오지 않았다."
        - { when: "talent.마왕의흔적", text: "등 뒤에서 성당 문이 열렸다 닫혔다. 아무도 나오지 않았다." }
    - 나레이션:
        - "스테인드글라스 빛이 조금씩 바닥을 기어가, 내 신발 끝에서 멈췄다."
        - { when: "talent.마왕의흔적", text: "계단 아래로 성당 첨탑의 그림자가 조금씩 길어진다. 내 신발 끝까지 닿았다." }
    - 속마음:
        - "(10년. 남은 날을 세는 일을, 여기서만은 잠깐 쉬어도 될 것 같다.)"
        - { when: "talent.마왕의흔적", text: "(들어가지 못하는 곳에서 들리는 소리가, 이상하게 다정하다.)" }
    - "저녁 종이 울렸다. 일어서는데 몸이 조금 가벼워져 있었다."
    - "옷깃에 밴 향 냄새가 기숙사까지 따라왔다."

# ================================================================ 식당
- id: enc_canteen_bruno
  title: 브루노의 고향 이야기
  on: 식당
  pool: true
  repeat: 2
  cooldown: 2
  when: "met.bruno or affinity.bruno > 0"
  effects: ["affinity.bruno += 5"]
  branch:
    - when: "fired.enc_canteen_bruno >= 2"
      lines:
        - "점심 식당. 브루노가 식탁에 쟁반 대신 천 보따리를 올려놓고 있다."
        - 브루노@웃음: "봐 봐! 집에서 소포 왔다. 할머니가 보낸 육포랑, 할아버지 편지."
        - "편지는 한 줄이었다. ── 밥 잘 먹고, 쇠 함부로 두드리지 마라."
        - 브루노: "할아버지 말투가 원래 이래. 망치보다 말이 짧아."
        - "육포를 나눠 씹는데, 브루노가 묻지도 않은 할아버지 자랑을 시작했다."
        - 브루노@웃음: "우리 할아버지 망치는 말이야, 할아버지의 할아버지 때부터 내려온 거래. 성검을 고친 적도 있대!"
        - 나: "성검을?"
        - 브루노: "그래! 쇠머리에 아무도 못 읽는 글자가 새겨져 있어. 손잡이는 몇 번을 갈았는데 쇠머리는 그대로래."
        - 브루노: "할아버지가 술 드시면 꼭 그 얘기를 해. 빛나는 검을 두드렸더니 망치가 노래를 불렀다나."
        - "브루노가 웃으며 어깨를 으쓱였다. 그러다 웃음이 조금 작아졌다."
        - 브루노: "다들 허풍이라고 하지만."
        - 브루노@진지: "…나는 믿어. 할아버지가 거짓말하는 거 한 번도 못 봤거든. 술 드셨을 때 빼고."
        - when: "perk.고인물의기억 or perk.데이터마이너"
          속마음: "(성검을 다시 벼릴 수 있는 혈통. 원작 설정집 맨 뒤쪽, 각주 한 줄이었다.)"
        - when: "perk.고인물의기억 or perk.데이터마이너"
          속마음: "(그 각주가 지금 내 앞에서 육포를 씹고 있다.)"
        - when: "not perk.고인물의기억 and not perk.데이터마이너"
          속마음: "(성검을 고친 망치. 허풍이라기엔, 쇠머리 글자 얘기가 너무 구체적이다.)"
        - 나: "나도 믿어."
        - 브루노@놀람: "…진짜? 너는 안 웃네."
        - 브루노@웃음: "하하, 역시 니는 다르다! 육포 하나 더 먹어라. 아니, 두 개."
        - "짜고, 질기고, 이상하게 따뜻한 맛이었다. 브루노는 편지를 접어 가슴 주머니에 넣었다."
      plants:
        - { id: F18, notice: { value: "stat.지성 + 10 * perk.고인물의기억", dc: 22 } }
    - lines:
        - "저녁 식당. 감자 스튜 냄새와 수다 소리가 천장까지 가득 찼다."
        - "쟁반을 들고 두리번거리는데, 저쪽에서 커다란 손이 붕붕 흔들린다. 브루노다."
        - 브루노@웃음: "여기, 여기! 자리 맡아 놨다. 덩치값 하느라 의자 두 개 맡는 건 일도 아니지."
        - "브루노의 쟁반엔 빵이 다섯 개 쌓여 있다. 그중 두 개를 말없이 내 쟁반으로 옮겨 놓는다."
        - 브루노: "먹어. 니 팔목 보니까 망치 한 번 들면 부러지겠다."
        - "스튜를 반쯤 비웠을 때, 브루노가 숟가락을 흔들며 말을 꺼냈다."
        - 브루노: "우리 동네는 남쪽 끝 시골이야. 대장간이 마을에 딱 하나. 우리 집."
        - 브루노: "새벽마다 할아버지가 풀무 밟는 소리로 하루가 시작돼. 쿵, 쉭. 쿵, 쉭. 그게 내 자장가였다."
        - 나: "그럼 아카데미엔 왜 왔어?"
        - 브루노@당황: "…할아버지가 가라 카더라. 대장장이도 세상 넓은 걸 봐야 쇠를 안다고."
        - 브루노@웃음: "근데 와 보니까 다들 마법이니 검술이니 하는데, 나는 훈련장 목검 휘어진 것만 보여. 몇 개 몰래 펴 놨다."
        - 브루노@웃음: "졸업하면 고향 대장간 이어받을 거야. 너 검 하나는 공짜로 쳐줄게!"
        - 나: "진짜?"
        - 브루노: "대장장이 약속은 쇠에 새기는 거다. 손바닥 내 봐."
        - "브루노가 내 손바닥을 이리저리 뒤집어 보더니, 엄지로 손가락 길이를 잰다."
        - 브루노@진지: "손잡이는 이만큼. 무게는 칼끝 쪽으로 조금. …됐다. 다 외웠다."
        - when: "perk.고인물의기억 or perk.공략위키편집자"
          속마음: "(원작의 브루노는 6년 뒤 수도 대장간 거리에서 죽는다. 고향 대장간 얘기는, 원작엔 없었다.)"
        - 속마음: "(공짜 검. …받으려면 그때까지 둘 다 살아 있어야 한다.)"

- id: enc_canteen_dorothy
  title: 배식대 뒤의 냄비
  on: 식당
  pool: true
  repeat: 2
  cooldown: 2
  lines:
    - "늦은 점심. 배식이 끝난 식당은 반쯤 비어 있다. 의자 끄는 소리만 띄엄띄엄 들린다."
    - "물을 뜨러 배식대 쪽으로 갔다가, 코끝을 찌르는 냄새에 걸음이 멈췄다. 스튜 냄새가 아니다."
    - "배식대 뒤에서 앞치마를 두른 소녀가 정체불명의 냄비를 젓고 있다. 보라색 연기."
    - "연기가 천장에 닿더니 동그란 고리가 되어 흩어진다. 식당 연기가 할 수 있는 동작이 아니다."
    - "소녀는 국자 대신 유리 막대로 냄비를 젓다가, 작은 공책에 뭔가를 휘갈겨 적는다. 콧노래까지 부른다."
    - "주방 안쪽에서 식당 아주머니의 목소리가 들렸다. ── 도로시! 냄비 불 줄였니?"
    - "소녀가 화들짝 놀라 냄비 뚜껑을 덮었다. 그리고 그제야 나를 발견했다."
  branch:
    - when: "talent.마력감응 or perk.데이터마이너"
      lines:
        - when: "talent.마력감응"
          나레이션: "냄비에서 마력이 일렁인다. 저건 요리가 아니라 연금약이다."
        - when: "talent.마력감응"
          나레이션: "그것도 아주 섬세한 배합이다. 마력의 결이 실처럼 가늘고 고르다."
        - when: "perk.데이터마이너"
          속마음: "(DLC 데이터에 있던 연금술 서번트… 도로시?)"
        - when: "perk.데이터마이너"
          속마음: "(미구현 NPC 폴더의 일러스트 한 장. '연금술 적성: S', 그리고 '식당 딸'이라는 메모.)"
        - 도로시@당황: "아, 이, 이거 보셨어요? 아니 그러니까 이건…"
        - "소녀가 냄비 앞을 두 팔로 가리고 섰다. 연기가 팔 사이로 새어 나온다."
        - 나: "그거, 약이지? 연금약."
        - "소녀의 눈이 동그래졌다. 그러다 반짝, 하고 빛났다."
        - 도로시@웃음: "아, 이거요? 시든 화분 살리는 약이요. 엄마한텐 비밀이에요!"
        - 도로시: "저 도로시예요. 식당 딸. 이걸 알아본 사람은 처음이에요."
        - 도로시@놀람: "어떻게 알았어요? 냄새? 색깔? 아니면 연기 모양?"
        - 도로시@웃음: "다음에 완성되면 보여 줄게요! 대신 엄마한텐 진짜, 진짜 비밀!"
        - when: "perk.데이터마이너"
          속마음: "(세계수를 치유할 약의 열쇠. 데이터 속 그 한 줄이, 식당 냄비 앞에서 콧노래를 부르고 있다.)"
        - when: "not perk.데이터마이너"
          속마음: "(원작에서 식당 딸은 대사도 없는 배경이었다. 그 배경이 지금, 실을 뽑듯 마력을 다루고 있다.)"
      effects: ["found.dorothy = 1", "affinity.dorothy += 5"]
    - lines:
        - 도로시@놀람: "아, 이거 먹는 거 아니에요!"
        - "소녀가 냄비 앞을 두 팔로 막아섰다. 보라색 연기가 그 팔 사이로 새어 나온다."
        - 도로시@당황: "그러니까… 이건 새로 개발 중인 소스예요. 아직 맛이 덜 들어서. 네, 소스."
        - "소스에서 날 리 없는 박하와 쇳가루 냄새가 났다."
        - 나: "…알았어. 안 먹을게."
        - 도로시@웃음: "현명한 손님이에요! 대신 오늘 디저트 하나 더 드릴게요. 입막음… 아니, 서비스요."
        - "꿀과자 하나가 쟁반 위에 올라왔다. 소녀는 다시 냄비 쪽으로 돌아서서 콧노래를 이어 갔다."
        - 속마음: "(배식대 뒤의 식당 딸. 원작에선 배경 일러스트 속 뒤통수가 전부였는데.)"
        - 속마음: "(…소스라고 하기엔, 연기가 너무 동그랗다.)"
      effects: ["affinity.dorothy += 2"]

- id: enc_canteen_rumor
  title: 식당의 소문
  on: 식당
  pool: true
  repeat: true
  cooldown: 2
  lines:
    - "점심시간의 식당. 의자 끄는 소리, 숟가락 소리, 웃음소리가 한데 섞여 천장에서 웅웅 울린다."
    - "빈자리를 찾아 앉고 보니, 옆 테이블이 유난히 시끄럽다. 2학년 몇이 머리를 맞대고 있다."
    - 속마음: "(식당은 소문 게시판이다. 원작 위키엔 주마다 바뀌는 '식당 소문 정리' 문서까지 있었다.)"
    - 학생 A: "야, 그거 들었어?"
    - 학생 B: "뭘? 또 무슨 소린데."
    - "숟가락을 든 채로 귀가 저절로 그쪽으로 기울었다."
    - 학생들:
        - "올해 무투대회는 카이든 황자가 우승이래. 3학년도 못 이긴다던데."
        - { when: "fate.edric == 'dead'", text: "벨모어 도련님 말이야… 사고가 아니라는 소문이 있어." }
        - { when: "fate.edric == 'saved'", text: "벨모어 도련님이 미궁에서 누구한테 구해졌대. 요즘 사람이 달라졌다더라." }
        - { when: "fate.sera == 'dropped'", text: "시험장에서 쓰러졌던 은발 애, 결국 고향 갔대." }
        - { when: "exam.rank == 'top'", text: "중간고사 상위권에 D반이 있었대. 이름이 {{player.name}}였나?" }
        - { when: "reputation >= 20", text: "저기 {{player.name}} 아냐? 요즘 자주 들리는 이름." }
    - 학생 B: "에이, 어디서 주워들은 건데."
    - 학생 A: "신문부 애가 그러던데? 걔네 귀 하나는 밝잖아."
    - 속마음:
        - "(원작대로라면 맞는 말이다. 원작대로라면.)"
        - { when: "fate.edric == 'dead'", text: "(사고가 아니라는 걸 아는 사람이, 이 식당에 몇이나 될까.)" }
        - { when: "fate.edric == 'saved'", text: "(누구한테 구해졌는지는, 소문이 아직 모르는 모양이다.)" }
        - { when: "fate.sera == 'dropped'", text: "(…그 이름이 이제 소문으로만 남았다.)" }
        - { when: "exam.rank == 'top'", text: "(D반 이름이 상위권 소문에 오른다. 원작이었다면 버그 리포트감이다.)" }
        - { when: "reputation >= 20", text: "(들리는 이름이 된다는 건 좋은 일일까. 귀가 있는 건 학생들만이 아닐 텐데.)" }
    - 학생 B: "쉿, 목소리 낮춰. 옆에서 듣잖아."
    - "두 사람이 동시에 나를 힐끔 봤다. 나는 스튜만 열심히 떴다. 아주 열심히."
    - "옆 테이블 이야기는 금세 다음 주 실습 과제 불평으로 넘어갔다."
    - "소문은 그렇게 한 바퀴 돌고, 스튜 김과 함께 천장으로 흩어졌다."
    - "내 스튜는 다 식어 있었다."

- id: enc_canteen_edric
  title: 쭈뼛대는 에드릭
  on: 식당
  pool: true
  repeat: 2
  cooldown: 2
  when: "origin != '악역도련님' and (fate.edric == 'saved' or fate.edric == 'saved_by_teacher')"
  effects: ["affinity.edric += 6"]
  lines:
    - "저녁 식당. 혼자 창가 자리에서 스튜를 뜨고 있는데, 맞은편에 그림자가 졌다."
    - "에드릭 벨모어다. 남들과 똑같은 나무 쟁반을 들고, 어색하게 서 있다."
    - "예전 같으면 하인이 의자를 빼 줬을 것이다. 졸졸 따라다니던 패거리도 오늘은 보이지 않는다."
    - 에드릭@당황:
        - "…여기 앉아도 되냐. 다른 데 자리가 없어서. 진짜로."
        - { when: "fate.edric == 'saved'", text: "그때… 고마웠다. 두 번은 말 안 한다." }
    - when: "fate.edric == 'saved'"
      나레이션: "말을 뱉어 놓고 에드릭은 내 대답도 기다리지 않고 털썩 앉았다. 귀 끝이 새빨갛다."
    - when: "fate.edric == 'saved'"
      나: "…한 번이면 충분해."
    - when: "fate.edric == 'saved_by_teacher'"
      나레이션: "식당을 둘러봤다. 빈자리가 열 개는 넘는다. 에드릭도 그걸 아는 얼굴이다."
    - when: "fate.edric == 'saved_by_teacher'"
      나: "…앉아."
    - "에드릭이 의자를 끌어당겨 앉았다. 앉는 자세만은 반듯하다."
    - "숟가락을 쥐는 손끝까지 몸에 밴 예법이다. 그 예법으로 덜 익은 감자를 뜬다."
    - "한동안 둘 다 말이 없었다. 스튜 뜨는 소리만 났다."
    - 에드릭: "…이거, 맛없지 않냐. 감자가 반은 덜 익었어."
    - 나: "그럼 왜 먹어?"
    - 에드릭@화남: "배고프니까 먹지! …저택에선 이런 거 안 먹었다고. 요리사가 셋이었어."
    - 에드릭: "근데 이상하게, 혼자 먹던 은 접시보다 이게 낫네."
    - "말해 놓고 본인이 더 놀랐는지, 에드릭이 스튜에 얼굴을 묻듯 고개를 숙였다."
    - 속마음: "(원작의 에드릭은 이 식당에서 아렌의 식판을 엎는 악역이었다. 한 달 뒤엔 미궁 3층에서 시체로 나왔고.)"
    - 속마음: "(그런데 지금은 덜 익은 감자에 투덜대고 있다.)"
    - when: "fate.edric == 'saved_by_teacher'"
      에드릭: "…그날 교관을 부른 게 누군지, 아직도 모르겠어. 알면 고맙다고 해야 하나. 귀찮게."
    - when: "fate.edric == 'saved_by_teacher'"
      속마음: "(말할까 하다 그만뒀다. 이 녀석한테 지금 필요한 건 빚이 아니라 밥 친구다.)"
    - 에드릭: "내일도… 자리 없으면 여기 앉는다. 진짜로 자리 없을 때만."
    - "빈 그릇을 들고 일어서는 에드릭의 뒷모습이, 처음 봤을 때보다 조금 덜 뻣뻣했다."

# ================================================================ 교정 산책
- id: enc_walk_liana
  title: 뒷산의 활 연습
  art: back_hill
  on: 산책
  pool: true
  repeat: 2
  cooldown: 2
  when: "affinity.liana > 0"
  lines:
    - "교정 뒷산으로 이어지는 오솔길. 바람이 불 때마다 나뭇잎이 은빛 뒷면을 뒤집는다."
    - "공터 쪽에서 탁, 탁, 일정한 소리가 들려왔다."
    - "뒷산 공터. 리아나가 나무 표적에 활을 쏘고 있다."
    - "시위를 당기고, 숨을 내쉬고, 놓는다. 화살이 매번 표적 한가운데 같은 자리에 꽂힌다."
    - "리아나의 뾰족한 귀가 쫑긋 움직였다. 돌아보지도 않고 웃는다."
    - 리아나@웃음: "발소리 들었어. 너 걸음은 금방 알아. 왼발을 조금 끌거든."
    - 나@당황: "…그런 것까지 들려?"
    - 리아나: "숲에선 발소리로 누가 오는지 알아야 살아. 엄마가 그랬어."
    - "리아나가 활을 내밀었다. 손잡이에 감긴 가죽이 반들반들하다. 오래 쓴 활이다."
    - 리아나: "해볼래? 숨을 내쉬면서 놓는 거야."
    - 리아나: "당길 땐 어깨 말고 등으로."
    - 리아나: "놓을 땐 손가락을 펴는 게 아니라, 그냥 놓아 주는 거야. 새를 날려 보내듯이."
    - "활을 받아 들었다. 생각보다 무겁다. 시위가 손가락 마디를 파고든다."
    - "리아나가 뒤에서 내 팔꿈치를 살짝 들어 올려 준다. 풀 냄새가 났다."
    - 속마음: "(원작에서 궁술은 타이밍 미니게임이었다. 화살표가 가운데 올 때 버튼.)"
    - 속마음: "(버튼은 없다. 숨을 내쉬면서… 놓는다.)"
  check: { label: 활쏘기, value: "stat.민첩 + stat.의지 / 2 + luck", dc: 30 }
  success:
    lines:
      - "숨을 끝까지 내쉬는 순간, 손가락이 저절로 풀렸다."
      - "쉭. 바람을 가르는 소리가 생각보다 가볍다."
      - "화살이 표적 한가운데 박혔다."
      - "리아나의 화살 바로 옆. 손가락 하나 들어갈 틈도 없이."
      - 리아나@놀람: "와, 초보 맞아?"
      - 리아나@웃음: "거짓말. 몰래 배우고 왔지? 아니면 너 엘프 피 섞였어?"
      - 나: "…운이 좋았어."
      - 리아나: "운도 실력이래. 이것도 엄마가 한 말."
      - "리아나가 두 화살을 같이 뽑아 들고 한참 들여다보더니, 내 화살을 돌려줬다. 기념이래."
      - 속마음: "(손끝에 시위 자국이 붉게 남았다. 지우고 싶지 않은 자국이다.)"
    effects: ["affinity.liana += 7", "stat.민첩 += 1"]
  fail:
    lines:
      - "숨을 내쉬는 걸 잊었다. 놓는 순간 시위가 팔뚝 안쪽을 철썩 때렸다."
      - "윽. 화살이 표적 근처에도 가지 않고 옆으로 휘었다."
      - "화살이 엉뚱한 나무에 박혔다. 나뭇가지에 앉아 있던 새들이 일제히 날아올랐다."
      - "리아나가 배를 잡고 웃는다. 풀밭에 주저앉아서도 웃는다."
      - 리아나@웃음: "새, 새를 날려 보내랬지, 새를 쫓으라고는 안 했어…!"
      - 나@당황: "…시위가 팔을 때렸어. 진짜 아파."
      - 리아나: "아, 미안. 보여 줘. …빨개졌네. 처음엔 다 그래. 나도 일곱 살 때 울었어."
      - "리아나가 소매에서 꺼낸 풀잎을 손바닥으로 비벼 팔뚝에 대 줬다. 화끈거림이 가라앉는다."
      - 리아나@웃음: "다음엔 숨부터 내쉬어. 그리고 저 나무한텐 사과하고."
    effects: ["affinity.liana += 5"]

- id: enc_walk_cat
  title: 호숫가의 고양이
  art: lake
  on: 산책
  pool: true
  repeat: 2
  cooldown: 3
  lines:
    - "호숫가 산책로. 물 냄새 섞인 바람이 갈대를 쓸고 지나간다."
    - "물가 바위 위에 얼룩 고양이 한 마리가 늘어져 있다. 한쪽 귀 끝이 조금 찢어졌다."
    - "고양이가 실눈을 뜨고 나를 본다. 손님을 평가하는 여관 주인 같은 눈이다."
    - 속마음: "(원작 호숫가엔 고양이가 없었다. 리아나 이벤트의 배경일 뿐이었지.)"
    - 나레이션:
        - "호숫가에서 얼룩 고양이가 하품을 한다. 쓰다듬게 해줬다."
        - { when: "talent.자연친화력", text: "얼룩 고양이가 무릎 위로 올라와 잠들었다. 일어날 수가 없다." }
        - { when: "talent.혐오스러운분위기", text: "얼룩 고양이가 나를 보더니 털을 세우고 호수로 뛰어들었다. …고양이가 수영을 한다." }
        - { when: "talent.짐승의혈통", text: "고양이가 나를 보고 정중하게 고개를 숙였다. 기분 탓인가." }
    - 나레이션:
        - "손바닥 아래로 따뜻한 등뼈가 오르내린다. 가르릉 소리가 손끝으로 전해진다."
        - { when: "talent.자연친화력", text: "숨 쉴 때마다 작은 몸이 오르내린다. 다리가 저려 온다. 그래도 움직일 수 없다." }
        - { when: "talent.혐오스러운분위기", text: "고양이는 건너편 갈대숲에 기어올라 몸을 털더니, 이쪽을 노려본다. 사과해야 하나." }
        - { when: "talent.짐승의혈통", text: "고양이가 꼬리를 앞발 위에 말아 올리고 내 발치에 앉는다. 보고를 마친 기사처럼." }
    - 나레이션:
        - "그런데 배 아래 털이 듬성듬성하다. 생각보다 몸이 홀쭉하다."
        - { when: "talent.자연친화력", text: "그런데 무릎에 얹힌 몸이 생각보다 가볍다. 배 아래 털이 듬성듬성하다." }
        - { when: "talent.혐오스러운분위기", text: "젖은 털이 몸에 달라붙으니, 생각보다 훨씬 홀쭉한 몸이다." }
    - 나레이션:
        - "고양이가 자꾸 호숫가 끝, 낡은 보트 창고 쪽을 돌아본다."
        - { when: "talent.자연친화력", text: "자면서도 고양이 귀가 자꾸 호숫가 끝, 낡은 보트 창고 쪽으로 돌아간다." }
        - { when: "talent.혐오스러운분위기", text: "노려보던 고양이가 갈대숲을 따라 호숫가 끝, 낡은 보트 창고 쪽으로 사라졌다." }
        - { when: "talent.짐승의혈통", text: "고양이가 호숫가 끝, 낡은 보트 창고 쪽을 한 번 보고 다시 나를 본다. 뭔가 말하려는 얼굴이다." }
    - 속마음: "(어디 급한 데라도 있나.)"
    - "갈대 사이에서 물새 한 마리가 푸드득 날아올랐다. 고양이 귀가 그쪽으로 홱 돌아갔다가, 다시 보트 창고 쪽으로 돌아온다."
    - "호수 위로 바람이 지나갔다. 물비늘이 반짝이며 흩어진다."
    - 나레이션:
        - "고양이가 손바닥에 이마를 한 번 비비고, 꼬리를 물음표처럼 세운 채 보트 창고 쪽으로 걸어갔다."
        - { when: "talent.자연친화력", text: "종이 울리자 고양이가 기지개를 켜고 무릎에서 내려갔다. 보트 창고 쪽으로, 뒤도 안 돌아보고." }
        - { when: "talent.혐오스러운분위기", text: "젖은 발자국만 갈대숲 쪽으로 이어져 있다. 다음엔 조금 더 웃는 얼굴로 와야겠다." }
        - { when: "talent.짐승의혈통", text: "고양이가 한 번 더 고개를 숙이고 보트 창고 쪽으로 걸어갔다. 몇 걸음마다 뒤를 돌아보며." }
    - "벤치에 앉아 한참 호수를 봤다. 10년 뒤를 생각하지 않은 건 오랜만이었다."
    - 속마음: "(원작에 없던 게 이 세계엔 너무 많다. 대부분은 이렇게, 작고 따뜻한 것들이다.)"
    - 속마음: "(스트레스 -5. 원작이라면 그렇게 떴겠지. 숫자보다는 조금 더 좋았다.)"
  effects: ["stress -= 5"]

- id: enc_walk_quarrel
  title: 또 싸우는 두 사람
  on: 산책
  pool: true
  when: "fired.y1_duel"
  lines:
    - "수업이 끝난 중앙 광장. 분수대 물소리 너머로 날 선 목소리가 들린다."
    - "분수대 앞. 카이든과 아렌이 또 으르렁대고 있다."
    - "주변으로 구경꾼이 반원을 그렸다. 다들 한 발씩 물러서서, 그러면서도 떠나지는 않는다."
    - "아렌의 교복 소매가 젖어 있다. 누가 먼저 부딪쳤는지는 몰라도, 분수대 물이 튄 모양이다."
    - 카이든: "결투 결과에 불만이 있나 보군."
    - 아렌@진지: "불만은 없어. 다음엔 안 진다는 것뿐이야."
    - 카이든@화남: "다음? 성검 없이 목검 한 자루로 나한테 닿을 수나 있을 것 같나."
    - 아렌@화남: "성검 얘기는 네가 먼저 꺼냈어. 나는 목검으로 하자고 했고."
    - 학생 A: "또 시작이네. 결투 이후로 둘이 마주치기만 하면 저래."
    - 학생 B: "누가 좀 말려 봐. 황자랑 용사 후보잖아. 아무도 못 끼지."
    - "그때 두 사람의 시선이 동시에 나를 향했다. 구경꾼 맨 앞줄에 서 있던 탓이다."
    - 속마음: "(원작에선 이 둘이 무투대회 결승까지 서로를 미워한다. 아렌은 그 미움으로 이를 악물고.)"
    - 속마음: "(여기서 내가 뭐라고 하든, 둘 중 하나의 하루가 바뀐다.)"
  choices:
    - text: 아렌 편을 든다
      effects: ["affinity.aren += 5", "affinity.kaiden -= 2", "aren.kind += 0.5"]
      lines:
        - 나: "목검으로 하자는 쪽이 더 당당해 보이는데."
        - "구경꾼 사이에서 '오' 하는 소리가 났다. 카이든의 눈썹이 꿈틀했다."
        - 카이든:
            - "…평민끼리 편을 먹는군. 좋다. 무투대회에서 둘 다 보자."
            - { when: "origin == '악역도련님' or origin == '몰락귀족'", text: "…귀족이 평민 편을 드는군. 좋다. 무투대회에서 둘 다 보자." }
        - "카이든이 망토를 휙 젖히고 돌아섰다. 구경꾼들이 알아서 길을 텄다."
        - "아렌이 젖은 소매를 짜며 나를 봤다. 아까의 날 선 표정이 풀려 있다."
        - 아렌@웃음: "…또 너구나. 고마워."
        - 아렌: "근데 나 진짜 목검으로 이길 수 있을까? 아, 아니. 이길 거야. 이길 거라고 말해 버렸으니까."
        - 속마음: "(그래. 성검이 아니라 네 팔로. 그 말을 잊지 마.)"
    - text: 카이든 편을 든다
      effects: ["affinity.kaiden += 5", "affinity.aren -= 2"]
      lines:
        - 나: "결투는 끝났어. 할 말이 있으면 다음 결투에서 하면 되잖아."
        - "아렌의 얼굴이 굳었다. 카이든 쪽으로 기운 말이라는 걸 다 알아들은 얼굴이다."
        - 카이든:
            - "평민 중에도 말이 통하는 자가 있군."
            - { when: "origin == '악역도련님'", text: "벨모어 쪽에도 말이 통하는 자가 있었군. 의외다." }
            - { when: "origin == '몰락귀족'", text: "몰락했어도 귀족은 귀족이군. 말이 통해." }
        - "카이든이 턱을 들고 돌아섰다. 지나가며 내 어깨 옆에서 아주 잠깐 걸음을 늦췄다."
        - 카이든: "…무투대회. 너도 나와라. 그래야 재밌겠군."
        - "아렌은 아무 말 없이 반대쪽으로 걸어갔다. 젖은 소매에서 물이 뚝뚝 떨어졌다."
        - 속마음: "(틀린 말은 안 했다. 그런데 아렌의 뒷모습이 원작의 그 장면이랑 너무 닮았다.)"
    - text: "\"무투대회에서 붙으면 되잖아\""
      effects: ["affinity.aren += 2", "affinity.kaiden += 2"]
      lines:
        - 나: "무투대회에서 붙으면 되잖아."
        - "분수대 물소리만 들렸다."
        - "둘이 동시에 나를 쳐다봤다. 그리고 동시에 고개를 돌렸다."
        - 카이든: "……흥. 당연한 소리를."
        - 아렌@당황: "…그, 그래. 무투대회."
        - "카이든이 먼저 걸음을 옮겼고, 아렌이 반대쪽으로 갔다. 구경꾼들이 김빠진 얼굴로 흩어진다."
        - 학생 A: "뭐야, 저게 끝이야?"
        - 속마음: "(끝이다. 오늘은. 둘 다 칼 대신 날짜를 쥐고 돌아갔다.)"

- id: enc_walk_noel
  title: 벤치의 술주정뱅이 선배
  art: lake
  on: 산책
  pool: true
  repeat: 2
  cooldown: 3
  slots: [밤]
  effects: ["affinity.noel += 6", "met.noel = 1"]
  branch:
    - when: "fired.enc_walk_noel >= 2"
      lines:
        - "밤의 호숫가. 그 벤치에 오늘도 같은 사람이 누워 있다. 술병이 하나 늘었다."
        - 노엘@웃음: "또 너냐. 한 잔 할래? …아, 1학년이지."
        - 노엘: "1학년한테 술 권했다고 사감한테 걸리면 이번엔 진짜 퇴학이야. 퇴학은 낙제보다 멋이 없어."
        - "노엘이 몸을 일으켜 벤치 한쪽을 비워 줬다. 앉으라는 뜻이다."
        - "옆에 앉자 노엘이 품에서 작은 은잔을 꺼내 자기 술을 따랐다."
        - "후줄근한 차림새에 비해 잔이 너무 고급스럽다."
        - "그가 내민 은잔 바닥에 낯선 문장이 새겨져 있다. 왕관을 쓴 까마귀."
        - "까마귀의 눈에는 붉은 돌이 박혀 있다. 테두리가 닳아 뭉툭하다. 아주 오래된 잔이다."
        - 나: "이 잔, 어디서 났어요?"
        - 노엘@웃음: "주웠어. 술집 뒷골목에서. 아니, 전당포였나. 아니, 고향이었나."
        - 노엘: "취하면 기억이 섞여. 그게 술의 장점이지."
        - "노엘이 잔을 비우고, 엄지로 까마귀 문장을 한 번 쓸었다. 오래된 버릇 같은 손길이다."
        - 노엘@진지: "…이 새는 말이야, 둥지가 없어진 다음에도 같은 자리로 날아온대. 멍청하지."
        - 노엘@웃음: "아, 방금 그거 좀 시인 같았지? 잊어. 술이 한 말이야."
        - 속마음: "(왕관을 쓴 까마귀. 제국 귀족 문장 목록 어디에도 없는 문양이다.)"
        - when: "perk.데이터마이너"
          속마음: "(아니, 본 적 있다. 데이터 폴더 구석, '사용처 없음'으로 분류된 아이콘들 사이에서.)"
        - "노엘이 은잔을 다시 품에 넣고 벤치에 드러누웠다. 잔이 든 쪽 가슴에 손을 얹은 채로."
        - 노엘: "통금이다, 1학년. 가. 나 같은 선배 되지 말고."
      plants:
        - { id: F09, notice: { value: "stat.지성 + 10 * perk.데이터마이너", dc: 24 } }
    - lines:
        - "밤 산책. 기숙사 통금까지 한 시간. 호숫가 길에 등불이 듬성듬성 켜져 있다."
        - "호수 위에 달이 둘이다. 하나는 하늘에, 하나는 물 위에."
        - "벤치 쪽에서 노랫소리가 들렸다. 음정이 반쯤 녹아 있다."
        - "호숫가 벤치에 4학년 선배가 술병을 안고 누워 있다."
        - "넥타이는 머리에 묶었고, 신발 한 짝은 벤치 아래 굴러가 있다. 4학년 망토는 이불 대신이다."
        - 노엘@웃음: "어이, 1학년. 거기 서서 구경하면 관람료 받는다."
        - 나@당황: "…괜찮으세요? 통금 시간 다 됐는데요."
        - 노엘: "통금은 졸업할 사람들이나 지키는 거야. 나는 졸업을 못 하거든. 그러니까 통금도 없지."
        - 노엘@웃음: "논리적이지? 논리학 수업에서 배웠어. 아, 그 수업도 낙제했구나."
        - 노엘: "노엘이다. 이름은 안 외워도 돼. 다들 내년이면 잊어."
        - "선배가 술병으로 하늘을 가리켰다."
        - 노엘@웃음: "별이 예쁘지? 졸업 못 한 지 2년째인데 별은 여전히 예뻐."
        - 노엘: "1학년 때도 이 벤치에서 봤어. 그땐 저 별자리 이름을 다 외웠는데. 지금은 반만 기억나."
        - 노엘: "나머지 반은 술이 가져갔지. 공평한 거래야."
        - "노엘이 실눈을 뜨고 나를 봤다. 취한 눈인데, 아주 잠깐 맑았다."
        - 노엘@진지: "…너, 별 보면서 날짜 세는 얼굴이다. 1학년이 벌써 그러면 못써."
        - 속마음: "(노엘. 만년 꼴찌 술주정뱅이 4학년. 원작에선 1학년 말에 낙제하고 사라진다.)"
        - when: "perk.고인물의기억 or perk.공략위키편집자 or perk.데이터마이너"
          속마음: "(커뮤니티 루머 게시판에 이 선배 얘기가 하나 있었다. 근거 없는, 그래서 아무도 안 믿던.)"
        - "노엘이 다시 눈을 감고 노래를 이어 갔다. 처음 듣는 말로 된 노래였다."

- id: enc_walk_stars
  title: 별 보기
  art: cg_liana_stars
  on: 산책
  priority: 1
  slots: [밤]
  when: "affinity.liana >= 25"
  lines:
    - "기숙사 불이 하나둘 꺼지는 시간. 호숫가 언덕을 올랐다."
    - "풀잎에 이슬이 내려 발목이 젖는다. 벌레 소리가 발걸음을 따라 멎었다가 다시 울린다."
    - when: "time.month == 7"
      나레이션: "풀숲 여기저기서 반딧불이가 떠오른다. 별이 땅에서 하늘로 올라가는 것 같다."
    - "호숫가 언덕. 리아나가 먼저 와 있었다."
    - "리아나는 풀밭에 등을 대고 누워 하늘을 보고 있었다. 머리카락이 풀 위에 흩어져 있다."
    - 리아나@웃음: "왔네. 늦었어. 별 벌써 백 개 셌어."
    - "옆에 누웠다. 풀이 차갑다. 하늘이 생각보다 가깝다."
    - 속마음: "(원작 CG '호숫가의 별'. 리아나 이벤트 일러스트 중 다운로드 수 1위였다.)"
    - 속마음: "(화면 속에선 리아나만 보였다. 여기선, 리아나가 보는 하늘이 보인다.)"
    - 리아나: "저기, 저 밝은 거 세 개. 숲에서는 '사슴뿔'이라고 불러. 사람들은 다른 이름으로 부르더라."
    - 나: "뭐라고 부르는데?"
    - 리아나@웃음: "몰라. 사람 이름은 어려워. 별 이름은 다 숲 이름으로 기억할래."
    - 리아나@웃음: "숲에서는 별이 더 많이 보였어. 엄마랑 매일 밤 셌거든."
    - 리아나: "엄마가 먼저 '하나' 하면 내가 '둘'. 번갈아 세다가 먼저 잠드는 사람이 지는 거야."
    - 리아나: "나는 맨날 졌어. 엄마는 내가 잠들면 이마에 손을 얹고 나머지를 혼자 셌대."
    - "리아나의 목소리가 조금 낮아졌다. 손가락으로 허공에 별과 별을 잇는다."
    - 리아나: "엄마는 숨이 차면 별을 셌어. 하나, 둘, 셋. 그러면 숨이 돌아온대."
    - "허공을 긋던 손가락이 멈췄다."
    - 리아나@슬픔: "엄마도 심장이 약했어. …나도 닮았대."
    - "풀벌레 소리만 남았다. 무슨 말을 해야 할지 몰라 하늘만 봤다."
    - when: "note.note_liana.known"
      속마음: "(이 아이를 2학년 여름에 잃을 수는 없다.)"
    - when: "not note.note_liana.known"
      속마음: "(가볍게 넘기려는 목소리였다. 그래서 더 무겁게 들렸다.)"
    - when: "fs.F05.noticed"
      속마음: "(계단에서 가슴을 짚던 모습이 떠오른다. 계단이 가팔라서가 아니었구나.)"
    - 리아나@웃음: "에이, 표정 봐. 별 보러 와서 그런 얼굴 하면 별이 숨어."
    - 리아나: "나 아직 멀쩡해. 활도 쏘고, 화분도 갈고, 너 놀리기도 하고."
    - 나: "…그럼 다음에도 같이 세자. 별."
    - "리아나가 고개를 돌려 나를 봤다. 별빛이 그 눈 안에 고여 있다."
    - 리아나@놀람: "…같이?"
    - 리아나@웃음: "좋아. 그럼 내가 '하나'. 너는 '둘'. 먼저 잠들면 지는 거야."
    - 리아나: "하나."
    - 나: "둘."
    - "그날 밤, 우리는 백까지 셌다. 먼저 잠든 건 리아나였다."
    - "숨소리가 고르다. 이마에 손을 얹을까 하다가, 대신 나머지 별을 혼자 셌다."
    - 속마음: "(백하나, 백둘. 2학년 여름까지 남은 날을 세는 것보다는, 이게 낫다.)"
    - "통금 종이 울리기 직전에 깨웠다. 리아나는 끝까지 자기가 이겼다고 우겼다."
  effects: ["affinity.liana += 8", "trust.liana += 8"]

# ================================================================ 식당 아르바이트
- id: enc_job_rush
  title: 점심 러시
  on: 아르바이트
  pool: true
  repeat: true
  cooldown: 1
  lines:
    - "앞치마 끈을 두 번 감아 묶었다. 몇 번을 해도 이 시간은 적응이 안 된다."
    - "배식 시작 종이 울리기도 전에 문밖이 웅성거린다."
    - "배식 줄이 식당 밖까지 늘어섰다."
    - "오늘 메뉴는 고기 스튜. 한 달에 두 번 나오는 날이다. 줄 선 학생들 눈빛부터 다르다."
    - "주방에서 식당 아주머니가 국자를 두 개 쥐고 소리쳤다. ── 오늘은 빵이랑 스튜 둘 다 맡아!"
    - 나@당황: "두, 둘 다요?"
    - "── 둘 다! 손이 두 개잖아!"
    - 학생 A: "아직이에요? 다음 수업 늦는데!"
    - 학생 B: "고기 두 덩이 넣어 줘요, 두 덩이!"
    - 속마음: "(원작 아르바이트는 버튼 한 번에 은화 +12였다. 그 버튼 뒤에서 이런 전쟁이 벌어지고 있었다니.)"
    - "국자를 쥐었다. 손바닥에 땀이 찬다."
  check: { label: 주문 처리, value: "stat.민첩 + stat.체질 / 2 + luck", dc: 28 }
  success:
    lines:
      - "한 손으로 빵을 집고, 한 손으로 스튜를 떴다. 고기는 정확히 한 덩이 반."
      - "쟁반이 오고, 접시가 가고, 다음 쟁반이 온다. 어느새 박자가 생겼다."
      - "접시가 춤을 췄다. 줄이 눈에 띄게 줄어든다."
      - 학생 B: "와, 오늘 배식 빠르다. 누구야?"
      - "마지막 학생까지 받아 낸 뒤, 주방 벽에 등을 대고 주저앉았다. 팔이 내 팔 같지 않다."
      - "식당 아주머니가 은화 몇 닢을 더 쥐여줬다."
      - "── 손이 빠르네. 우리 딸보다 낫다. 그 애는 냄비만 들여다보지."
      - 속마음: "(우리 딸… 배식대 뒤에서 늘 뭔가를 끓이던 그 아이 말인가.)"
    effects: ["money += 6"]
  fail:
    lines:
      - "빵을 집으면 스튜가 넘치고, 스튜를 뜨면 빵이 떨어졌다."
      - "줄이 줄지 않는다. 문밖에서 원성이 들려온다."
      - "서두르다 팔꿈치로 냄비 손잡이를 쳤다."
      - "스튜를 엎었다. 오늘의 고기 스튜가, 오늘의 바닥 스튜가 되었다."
      - "식당이 한순간 조용해졌다. 그리고 탄식이 쏟아졌다."
      - "── 괜찮아, 괜찮아. 안 데었지? …근데 그 스튜 값은 오늘 일당에서 뺀다."
      - "오늘 일당에서 깎였다."
      - 속마음: "(숫자로 보면 은화 몇 닢인데, 바닥을 닦는 무릎은 숫자가 아니었다.)"
    effects: ["money -= 4", "stress += 5"]

- id: enc_job_dorothy
  title: 도로시의 실험
  art: kitchen
  on: 아르바이트
  pool: true
  repeat: 3
  cooldown: 1
  effects: ["affinity.dorothy += 6"]
  branch:
    - when: "found.dorothy and fired.enc_job_dorothy >= 2"
      lines:
        - "마감 뒤의 주방. 설거지통 앞에서 소매를 걷는데, 누가 등 뒤에서 앞치마 끈을 잡아당겼다."
        - 도로시@웃음: "잠깐만요, 잠깐만! 설거지는 이따가! 이것 좀 봐요!"
        - "도로시가 창가에서 화분 하나를 두 손으로 받쳐 들고 왔다. 금 간 토분이다."
        - 도로시: "이거 기억나요? 뒷마당 쓰레기 더미에 버려져 있던 거. 완전히 말라 죽은 제라늄."
        - "흙 위로 손톱만 한 연둣빛 싹이 고개를 내밀고 있다. 하나, 둘, 셋."
        - 도로시@웃음: "봐요! 말라 죽은 화분에 제 약을 줬더니 새싹이 났어요!"
        - 나: "…죽은 거였잖아. 뿌리까지 바싹 말라 있었는데."
        - 도로시: "그쵸? 그쵸! 엄마도 그랬어요. 죽은 건 죽은 거라고."
        - 도로시: "근데 뿌리 아주 깊은 데에, 아주 조금 남아 있었나 봐요. 약이 그걸 찾아서 깨운 거예요. 제 생각엔."
        - "도로시가 싹을 손가락 끝으로 살짝 건드린다. 갓 태어난 동생을 만지듯이."
        - when: "talent.마력감응"
          나레이션: "싹 주위로 희미한 초록 마력이 맴돈다. 꺼져 가던 생명을 붙잡아 끌어올리는 마력이다."
        - 속마음: "(시든 걸 되살리는 약… 세계수에도 통할까?)"
        - 속마음: "(아니, 성급하다. 화분 하나와 대륙을 떠받치는 나무는 다르다. 그래도──)"
        - when: "perk.데이터마이너"
          속마음: "(DLC 데이터의 그 메모. '도로시 — 세계수 루트 핵심.' 구현되지 않은 한 줄이 지금 싹을 틔웠다.)"
        - 도로시@당황: "…왜 그렇게 봐요? 이상한 약 아니에요. 진짜로. 시든 화분 전용이에요."
        - 나: "아니. 대단해서."
        - 도로시@놀람: "……대, 대단해요? 제가요?"
        - 도로시@웃음: "헤헤. 그 말 처음 들어 봐요. 엄마는 맨날 '냄비 태우지 마라'만 하거든요."
        - "도로시가 화분을 창가 제일 볕 좋은 자리에 올려놓았다. 그날 밤 설거지는 둘이서 금방 끝났다."
      plants:
        - { id: F16, notice: { value: "stat.지성 + 15 * talent.마력감응", dc: 24 } }
    - when: "not found.dorothy"
      lines:
        - "주방 뒷문으로 들어서자 김과 기름 냄새가 한꺼번에 얼굴을 덮친다."
        - "식당 아주머니는 앞치마 하나를 던져 주고 곧장 배식대로 사라졌다. 설명은 그게 전부였다."
        - "어디서부터 손대야 하나 두리번거리는데, 화덕 구석에서 누가 고개를 쏙 내밀었다."
        - "앞치마를 두른 또래 소녀다. 코끝에 검댕이 묻었고, 손에는 국자 대신 유리 막대를 쥐고 있다."
        - 도로시: "새로 온 알바죠? 저 도로시예요. 이 냄비는 건드리지 마세요."
        - "냄비에서 보라색 거품이 올라온다."
        - "거품이 터질 때마다 박하 냄새와 쇳가루 냄새가 번갈아 난다. 요리 냄새는 아니다."
        - 나: "…그거 오늘 저녁 메뉴야?"
        - 도로시@당황: "아뇨! 아뇨아뇨아뇨. 이건 메뉴가 아니라, 그러니까… 제 거예요. 개인 냄비."
        - 도로시@웃음: "대신 나머지 냄비는 다 써도 돼요! 감자는 저기, 칼은 여기. 엄마는 칼질 느린 사람 싫어해요."
        - "도로시가 감자 한 자루를 내 앞에 쿵 내려놓고, 다시 보라색 냄비로 돌아갔다."
        - "감자를 깎는 내내, 등 뒤에서 콧노래와 함께 유리 막대가 냄비를 긁는 소리가 났다."
        - "가끔 도로시가 '아!' 하고 공책에 뭔가를 적었다. 그때마다 거품 색이 조금씩 달라졌다."
        - 속마음: "(식당 아주머니의 딸. 원작에선 배식대 뒤 일러스트 한 장이 전부였던 아이.)"
        - when: "perk.데이터마이너"
          속마음: "(…아니, 미구현 데이터에 이름이 있었다. 도로시. 연금술 서번트.)"
        - 속마음: "(저 냄비, 아무리 봐도 수상하다.)"
      effects: ["found.dorothy = 1"]
    - lines:
        - "저녁 장사가 끝난 주방. 산더미 같은 접시를 마지막 한 장까지 헹궜다."
        - "손가락이 퉁퉁 불었다. 허리를 펴자 뼈마디가 우두둑 운다."
        - "도로시가 화덕 옆에서 약초 바구니를 끌어안고 왔다. 쑥, 박하, 이름 모를 은빛 잎사귀."
        - 도로시: "설거지 끝나면 재료 손질 좀 도와줄래요? 약초 다듬는 건 제가 할게요."
        - 나: "그럼 난 뭘 하는데?"
        - 도로시@웃음: "감자요! 약초는 제 거, 감자는 엄마 거. 엄마 거 먼저 끝내야 제 거 할 수 있거든요."
        - "결국 나는 감자를 깎고, 도로시는 약초를 다듬었다. 서로 등을 맞대고."
        - 도로시: "이 은빛 잎은 손으로 찢어야 해요. 칼이 닿으면 약효가 도망가거든요. 엄마는 미신이래요."
        - 도로시: "그래서 실험해 봤어요. 칼로 썬 거랑 손으로 찢은 거, 따로 달여서 화분 두 개에 줬죠."
        - 나: "결과는?"
        - 도로시@웃음: "손으로 찢은 쪽 화분이 꽃을 피웠어요. 다른 쪽은 그냥 살아만 있었고요."
        - "은빛 잎을 찢는 도로시의 손끝이 이상하게 정확하다. 결을 따라, 한 번에."
        - 속마음: "(가설을 세우고, 비교하고, 기록한다. 이 아이는 식당 냄비 앞에서 실험을 하고 있다.)"
        - "마지막 감자를 깎았을 때, 바구니의 약초도 딱 맞춰 끝나 있었다."
        - 도로시@웃음: "봐요, 둘이 하니까 금방이죠? 다음에도 같은 조예요!"

- id: enc_job_bistol
  title: 혼자 저녁을 먹는 교수
  on: 아르바이트
  pool: true
  when: "time.month >= 4"
  lines:
    - "문 닫을 시간의 식당. 의자를 하나씩 탁자 위로 뒤집어 올리고 있었다."
    - "마지막 등불을 끄려는데, 문에 달린 종이 딸랑 울렸다."
    - "문 닫을 시간에 비스톨 교수가 들어와 구석에 앉았다."
    - "실험복 소매에 약품 얼룩이 그대로다. 눈 밑이 거뭇하다. 며칠은 못 잔 얼굴이다."
    - "주방에서 식당 아주머니가 고개를 내밀더니, 아무 말 없이 화덕에 다시 불을 지폈다. 익숙한 일인 듯하다."
    - 비스톨: "스튜 두 그릇."
    - 나: "…두 그릇이요?"
    - 비스톨: "두 그릇이라고 했네."
    - "그는 스튜 두 그릇을 시켰다. 한 그릇에는 손도 대지 않고, 작은 숟가락을 옆에 놓아둔다."
    - "아이 손에 맞을 만한 나무 숟가락이다. 교수의 품에서 나왔다. 늘 가지고 다니는 모양이다."
    - "비스톨은 자기 몫을 천천히 먹었다. 맞은편 그릇에서 김이 오르다가, 식어 가다가, 멎었다."
    - "그동안 그는 한 번도 맞은편 그릇을 보지 않았다. 일부러 안 보는 것 같았다."
    - "식사가 끝날 무렵, 교수가 조끼 주머니에서 낡은 회중시계를 꺼냈다."
    - "시간을 보는 줄 알았다. 그런데 그는 시계 뚜껑 안쪽만 한참 들여다봤다."
    - "등불에 비친 뚜껑 안쪽에 작은 그림이 언뜻 보였다. 어린아이 얼굴 같았다."
    - when: "fs.F06.noticed"
      속마음: "(연구실 벽의 초상화. 일곱 살쯤 된 소녀. …같은 얼굴일까.)"
    - 비스톨: "……계산."
    - "은화를 탁자에 놓고 그는 일어섰다. 손대지 않은 스튜는 그대로 두고."
    - "문 앞에서 그가 멈췄다. 돌아보지 않고 말한다."
    - 비스톨: "그 그릇, 버리지 말고 뒷마당 고양이한테나 주게. …다 먹고 가는 손님이 아니라서."
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(원작의 비스톨은 교단 교주다. 교주가 매일 밤 아이 숟가락을 챙겨 다닌다는 설정은, 어디에도 없었다.)"
    - 속마음: "(두 그릇. 한 사람. 오지 않는 손님.)"
    - "식은 스튜를 들고 뒷마당으로 나갔다. 고양이는 오지 않았다. 한참을 기다렸다."
  effects: ["met.bistol = 1"]
  plants:
    - { id: F06, notice: { value: "stat.지성 + 10 * talent.직감", dc: 22 } }

# ================================================================ 주말 도시 외출
- id: enc_city_grim
  title: 단골 정보상
  on: 도시외출
  pool: true
  repeat: 3
  cooldown: 2
  when: "money >= 10"
  effects: ["money -= 10", "intel += 1", "affinity.grim += 5"]
  lines:
    - "주말의 도시. 시장 소음이 한 블록만 들어가도 거짓말처럼 사라진다."
    - 삽화: back_alley
    - "빨랫줄이 하늘을 가린 뒷골목. 늘 같은 자리, 늘 같은 등불 아래에 그가 있다."
    - "정보상 그림. 낡은 장부를 무릎에 펴 놓고, 손가락으로 은화 한 닢을 굴리고 있다."
    - 그림:
        - "또 왔군. 앉지는 마. 여긴 손님 의자가 없어."
        - { when: "intel >= 2", text: "단골 왔군. 앉지는 마. 단골이라고 의자가 생기진 않아." }
    - "은화 열 닢을 장부 위에 올려놓았다. 그림이 한 닢씩 이로 깨물어 보고서야 주머니에 넣는다."
    - 그림: "값은 받았으니 물건을 주지. 오늘 시세로 제일 쓸모 있는 걸로."
    - 속마음: "(그림. 원작에선 '정보 구매' 메뉴 하나짜리 상인이었다. 대사는 무작위 세 개.)"
    - when: "note.note_grim.known"
      속마음: "(그리고 황제가 암살되는 밤, 황궁 근처에 있던 사람. 이 사람이 파는 소문 중 몇 개는, 소문이 아니다.)"
  branch:
    - when: "not know.kaiden_shoulder and time.month >= 5"
      lines:
        - 그림: "무투대회가 다가오니 다들 3황자 얘기만 찾더군. 마침 좋은 게 들어왔어."
        - 그림: "무투대회? 카이든 황자, 왼쪽 어깨가 성치 않다더군. 어릴 때 말에서 떨어졌대."
        - 나: "황족 부상을 어떻게 알아?"
        - 그림@웃음: "황궁 마구간지기도 술은 마시거든. 술값은 내가 냈고."
        - 그림: "덕분에 검을 쥐면 왼쪽 어깨를 감싸는 버릇이 있대. 오른쪽 아래가 빈다는 소리지."
        - 그림@진지: "어디서 들었는지는 말하지 마. 황족 약점을 파는 놈은 오래 못 살아. 사는 놈도."
        - 속마음: "(원작 공략엔 '어깨' 두 글자뿐이었다. 그 두 글자 뒤에 마구간지기의 술값이 있었구나.)"
        - when: "know.kaiden_palace"
          속마음: "(형들이 자기 실패를 기다린다던 카이든의 얼굴이 떠오른다. 약점이 은화 몇 닢에 팔리는 세계다.)"
        - "은화 열 닢짜리 정보가 손바닥 위에서 이상하게 무거웠다."
      effects: ["know.kaiden_shoulder = 1"]
    - when: "not know.cult_early"
      lines:
        - 그림: "학생이니까 학교 얘기가 좋겠군. 학교 지하 얘기."
        - 그림: "아카데미 미궁 3층. 밤마다 로브 입은 놈들이 드나든다는 얘기가 있어."
        - 나: "…밤에? 미궁은 밤엔 봉쇄되잖아."
        - 그림: "그러니까 이상한 거지. 열쇠가 있는 놈들이란 소리니까."
        - 그림@진지: "로브 등에 뭘 그려 놨다던데, 그걸 봤다는 놈은 다음 날부터 술집에 안 나와."
        - 그림: "이사 갔대. 어디로 갔는지는 아무도 모르고."
        - "그림이 손가락 사이로 굴리던 은화를 멈췄다."
        - 그림: "충고는 덤이다. 3층은 낮에 가. 그리고 혼자 가지 마."
        - when: "note.note_cult_mark.known"
          속마음: "(교단 문양. 원작에선 가을에야 처음 나오는 건데. 벌써 소문이 돌고 있다고?)"
        - 속마음: "(심연교단. 8년 차 봄, 미궁 최하층에서 차원문을 여는 놈들. 시작은 늘 이런 소문이었다.)"
      effects: ["know.cult_early = 1"]
    - lines:
        - 그림: "오늘은 장사가 시원찮아. 새 소식이 없거든. 대신 오래된 소식의 뒷얘기를 주지."
        - 그림@웃음: "황궁 뒷문 검은 마차, 아직도 다녀. 이번엔 문장이 보였다는 놈이 있는데… 그건 비싸."
        - 나: "얼마나?"
        - 그림: "네 주머니에 든 것보다 조금 더. 늘 그렇지."
        - 그림@진지: "그리고 그 문장 얘기를 사 간 손님 둘 중 하나는 다시 안 왔어. 비싼 데는 이유가 있는 거야."
        - "그림이 장부를 덮었다. 오늘 장사는 끝났다는 뜻이다."
        - 속마음: "(검은 마차. 원작에선 '문장 없는 마차'에서 끝났다. 문장이 보였다는 소문은 원작에 없었다.)"
        - 속마음: "(원작보다 한 걸음 더 들어간 소문. 그 한 걸음 값이, 내 주머니보다 조금 더.)"
      plants:
        - { id: F10, notice: { value: "stat.지성 + 10 * note.note_grim.known", dc: 20 } }

- id: enc_city_market
  title: 주말 시장
  on: 도시외출
  pool: true
  repeat: true
  cooldown: 1
  lines:
    - "주말의 시장 거리. 노점 천막이 끝도 없이 이어진다."
    - "노점이 늘어선 시장. 향신료 냄새와 호객 소리."
    - "구운 밤 냄새, 생선 비린내, 말린 꽃 냄새가 한 걸음마다 바뀐다."
    - 상인: "골라, 골라! 북부산 털장갑! 여름에 사면 반값!"
    - 아이: "엄마, 저거! 저 설탕 새 사 줘!"
    - "인파에 떠밀리다 약재 노점 앞에서 겨우 멈췄다. 유리병들이 햇빛을 받아 반짝인다."
    - "갈색 병, 초록 병, 수상한 보라색 병. 병마다 손글씨 꼬리표가 달려 있다."
    - 속마음: "(원작 상점 화면. 아이템 아이콘 몇 칸과 가격표가 전부였다.)"
    - 속마음: "(그 몇 칸 뒤에 이 냄새와 소음이 있었다. 지갑 사정만은 원작이랑 똑같지만.)"
    - when: "money < 5"
      속마음: "(…주머니가 가볍다. 구경이라도 하자.)"
    - 상인: "학생! 아카데미 학생이지? 망토 보면 알아. 실습 전날엔 다들 이거 하나씩 사 가더라고!"
  choices:
    - text: 강장제를 산다 (은화 15, 전투 중 체력 회복)
      requires: "money >= 15"
      effects: ["money -= 15", "item.강장제 += 1"]
      lines:
        - "작은 갈색 병을 집어 들었다. 흔들자 바닥에 가라앉은 약초 찌꺼기가 회오리친다."
        - 상인: "이거 한 병이면 사흘 밤샘도 거뜬하지! 싸움판에서도 효과 직빵이야."
        - 상인: "기사단 견습들도 이거 사 간다고. 쓰러지기 직전에 한 모금이면 벌떡!"
        - "뚜껑을 살짝 열어 냄새를 맡았다. 쓰다. 쓴 게 냄새로도 느껴진다."
        - 속마음: "(전투 중 회복 아이템. 원작에선 단축키 3번 자리였다. 쓸 일이 없으면 제일 좋겠지만.)"
        - "은화 열다섯 닢을 건넸다. 병이 주머니 속에서 묵직하게 자리를 잡는다."
    - text: 피로회복제를 그 자리에서 마신다 (은화 10)
      requires: "money >= 10"
      effects: ["money -= 10", "fatigue -= 35"]
      lines:
        - 상인: "그 자리에서 마시게? 학생, 그거 한 번에 다 마시면 안──"
        - "말이 끝나기도 전에 병을 비웠다."
        - "쓴맛과 함께 눈이 번쩍 뜨인다."
        - "혀가 오그라들고, 귀가 뜨겁고, 발끝까지 피가 도는 게 느껴진다. 무겁던 어깨가 거짓말처럼 가볍다."
        - 상인: "…다 마셨네. 오늘 밤엔 잠 못 잘 거야. 난 말했어."
        - 속마음: "(피로 -35. 숫자로 보면 깔끔한데, 심장은 깔끔하지 않게 뛴다.)"
    - text: 꿀과자를 산다 (은화 5, 스트레스 해소)
      requires: "money >= 5"
      effects: ["money -= 5", "stress -= 20"]
      lines:
        - "노점 할머니가 기름종이에 꿀과자를 싸 준다. 손바닥만 한 과자가 아직 따끈하다."
        - 노파: "공부하느라 고생이 많지. 식기 전에 먹어."
        - "한 입 베어 물었다. 바삭한 겉이 부서지고, 안에서 꿀이 흘러나온다."
        - "달다. 세상이 조금 괜찮아 보인다."
        - "분수대 가장자리에 앉아 천천히 먹었다. 비둘기가 부스러기를 노리고 모여든다."
        - 속마음: "(10년 뒤에 세상이 망한다. …그래도 꿀과자는 맛있다. 이건 원작에 없던 정보다.)"
        - "마지막 부스러기는 비둘기 몫으로 남겨 두었다."
    - text: 구경만 한다
      effects: ["stat.매력 += 0.5"]
      lines:
        - "아무것도 사지 않고 천천히 걸었다. 호객을 웃으며 피하는 요령이 붙는다."
        - 상인: "학생, 구경만 하면 섭섭하지! …그래, 다음에 와!"
        - "골목 끝 악사가 류트를 뜯는다. 지나가던 사람들이 동전을 던진다. 나는 박수를 보탰다."
        - "실을 고르는 노부부, 생선 값을 깎는 하녀, 망토를 고쳐 입는 견습 기사."
        - "얼굴을 하나하나 보다 보니, 이 사람들도 다 10년 뒤를 살아야 하는 사람들이라는 게 실감 났다."
        - 속마음: "(원작에서 '시민'은 배경 스프라이트였다. 여기선 다들 이름이 있다. 내가 모를 뿐.)"

- id: enc_city_bookshop
  title: 고서점, 다시
  art: bookshop
  on: 도시외출
  pool: true
  when: "book.seen and not gift.manual and not book.left"
  lines:
    - "시장 뒷길, 간판 글씨가 반쯤 지워진 고서점. 문을 열자 종이 먼지가 햇빛 속에서 춤춘다."
    - "주인 노인은 오늘도 카운터에서 졸고 있다. 고개가 끄덕일 때마다 안경이 코끝으로 미끄러진다."
    - "발이 저절로 구석 서가로 향했다."
    - "고서점의 『마력 순환 소고』는 아직 그 자리에 있다."
    - "표지가 닳은 얇은 책. 입학 전 그날 이후로 한 번도 움직이지 않은 것 같다."
    - "먼지 위에 그날의 내 손자국만 남아 있다."
    - "책을 집어 드는 소리에 주인 노인이 깼다."
    - 서점 주인: "그 책? 요즘 찾는 사람이 늘어서 말이야. 은화 예순 닢."
    - 나@놀람: "예순이요? 전엔 마흔이었잖아요."
    - 서점 주인: "그땐 찾는 사람이 없었지. 값은 찾는 사람 수만큼 오르는 법이야."
    - when: "note.note_manual.known"
      속마음: "(원작에서 아렌이 2학년 겨울에 얻는 비급. 이걸 사면 아렌은 이 기연을 영영 잃는다.)"
    - when: "not note.note_manual.known"
      속마음: "(이 책, 왠지 사면 안 될 것 같기도 하고, 꼭 사야 할 것 같기도 하다.)"
    - 속마음: "(책 한 권. 그런데 이 한 권이 누군가의 10년을 바꾼다. 손이 떨린다.)"
  choices:
    - text: 산다 (은화 60)
      art: cg_manual
      requires: "money >= 60"
      hint: 아렌은 이 기연을 얻지 못하게 된다
      effects: ["money -= 60", "gift.manual = 'me'", "skill.마력순환 = 1", "stat.마력제어 += 5"]
      lines:
        - "은화 예순 닢을 세어 카운터에 올려놓았다. 주머니가 텅 빈 소리를 낸다."
        - 서점 주인: "…허, 진짜로 사네. 젊은 사람이 통이 크군."
        - "책을 펼치자, 손끝에서 미지근한 무언가가 팔을 타고 올라왔다. 글자가 아니라 흐름이 읽힌다."
        - "몸 안의 마력이 처음으로 한 방향으로 돈다. 막혀 있던 수로가 뚫리는 느낌."
        - 속마음: "(미안, 아렌. 2학년 겨울까지 기다릴 여유가 나한텐 없다.)"
        - 시스템: "⚠ 원작 이탈 — 아렌은 이 비급을 얻지 못한다."
        - "서점을 나서는데, 등 뒤에서 노인이 다시 졸기 시작하는 소리가 났다."
        - 속마음: "(2학년 겨울, 원작의 아렌이 이 문을 열면 저 구석 서가는 비어 있을 것이다.)"
    - text: 그냥 둔다
      effects: ["book.left = 1"]
      lines:
        - "책을 원래 자리에 돌려놓았다. 먼지 위의 손자국 옆에, 손자국이 하나 더 생겼다."
        - 서점 주인: "안 사나? 다음엔 더 오를 텐데."
        - 나: "…이 책은 주인이 따로 있는 것 같아서요."
        - 서점 주인: "책 주인은 돈 내는 사람이지. …뭐, 그런 말 하는 손님은 오랜만이군."
        - "노인이 그 책 위에 다른 책 한 권을 얹어 가렸다. 아무나 집어 가지 못하게, 라는 듯이."
        - 속마음: "(원작대로 흘러가게 두자. 2학년 겨울, 아렌이 이 문을 열 때까지.)"
        - "서점 종이 등 뒤에서 딸랑 울렸다. 이상하게 마음이 가벼웠다."

- id: enc_city_herbalist
  title: 약재상
  on: 도시외출
  pool: true
  priority: 1
  when: "know.moonherb and not know.moonherb_where"
  lines:
    - "약재 골목 맨 끝. 말린 뿌리와 열매가 천장까지 매달린 좁은 가게."
    - "문턱을 넘자 쓴 냄새, 단 냄새, 흙냄새가 한꺼번에 코를 찔렀다."
    - "카운터 너머, 돋보기를 쓴 약재상이 약초를 저울에 달고 있다. 손등까지 초록 물이 들었다."
    - 약재상: "어서 와. 뭘 찾나. 감기? 배앓이? 아니면 시험 기간 졸음?"
    - 나: "월광초요. 혹시 있나 해서요."
    - "저울 위의 손이 멈췄다. 약재상이 돋보기를 이마로 밀어 올리며 나를 다시 봤다."
    - 약재상@놀람: "월광초? 허, 그건 돈 주고 못 사. 가을 보름밤에 실바니엘 국경 숲에서만 피거든."
    - 약재상: "젊은 사람이 그 이름을 어디서 들었어? 요즘은 약재상들도 잘 몰라."
    - 나: "…아는 사람이 어릴 때 먹었대요."
    - "약재상이 한참 나를 보다가, 선반 맨 위 칸에서 먼지 쌓인 도감을 꺼내 펼쳤다."
    - "은빛 꽃잎을 가진 작은 꽃 그림. 꽃잎 끝이 초승달처럼 둥글게 말려 있다."
    - 약재상: "이게 월광초야. 보름달 빛을 받아야 꽃잎이 열려. 숨찬 데, 가슴 두근거리는 데 이만한 게 없지."
    - 약재상: "하루만 지나도 시들어. 직접 따서 그날 달여야 해."
    - 약재상@진지: "말린 걸 파는 놈이 있으면 사기꾼이야. 말리면 그냥 은빛 지푸라기거든."
    - "가게 안이 조용해졌다. 저울추가 흔들리다 멈췄다."
    - 속마음: "(1학년 10월 보름. 첫 실전 토벌 바로 다음 날이다.)"
    - 속마음: "(토벌에서 돌아와 쉬지도 못하고, 하룻밤을 꼬박 걸어 국경 숲까지. 원작이라면 행동 슬롯 하나였다.)"
    - when: "note.note_liana.known"
      속마음: "(그걸 놓치면 2학년 봄이 마지막. 그다음은 2학년 여름이다. 리아나의 여름.)"
    - 약재상: "그 아는 사람, 많이 아픈가 보군."
    - 나: "…아직은 괜찮아요. 아직은."
    - 약재상@웃음: "그럼 됐네. 아직이라는 말은 아직 늦지 않았다는 뜻이야. 가을 보름, 잊지 말게."
  effects: ["know.moonherb_where = 1"]

- id: enc_city_noel
  title: 술집의 외상
  art: tavern
  on: 도시외출
  pool: true
  when: "met.noel and money >= 20"
  lines:
    - "해 질 녘의 도시. 술집 골목에 하나둘 등불이 켜진다."
    - "'졸린 곰' 간판 아래에서 누가 소리를 지르고 있다."
    - "술집 앞. 노엘 선배가 주인에게 멱살을 잡혀 있다."
    - "주인은 노엘보다 머리 하나는 작은데, 기세는 세 배다. 앞치마에 맥주 거품이 말라붙었다."
    - 주인: "석 달! 석 달 치 외상이야! 오늘은 못 넘어가!"
    - 노엘@웃음: "외상 좀 그어주면 어때서! 나중에 왕이 되면 다 갚는다니까!"
    - 주인: "왕? 지난달엔 대마법사 된다며! 그 전달엔 해적왕이었고!"
    - 노엘: "꿈이 큰 게 죄야? 사장님, 꿈은 원래 외상으로 꾸는 거라고."
    - "구경꾼들이 킬킬 웃는다. 다들 익숙한 광경이라는 얼굴이다."
    - 학생 A: "또 노엘 선배네. 저러다 진짜 경비대 불려 가겠다."
    - "노엘이 멱살을 잡힌 채로 고개를 돌렸다. 그리고 나와 눈이 마주쳤다."
    - 노엘@웃음: "오, 1학년! 마침 잘 왔다. 너 혹시 은화 스무 닢 있냐? 농담이야. 반쯤."
    - "웃고 있는데, 눈은 웃지 않았다. 그 눈이 아주 잠깐, 내 주머니가 아니라 내 얼굴을 봤다."
    - 속마음: "(원작에도 있던 장면이다. 원작에선 가을이었는데. 이 세계는 원작보다 조금씩 빠르다.)"
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(원작에선 술값을 내줘도 고맙다는 한마디뿐이었다. 그래서 다들 그냥 지나쳤다. …정말 그뿐이었을까.)"
    - 속마음: "(은화 스무 닢. 내 일주일 치 생활비다.)"
  choices:
    - text: 외상을 대신 갚아준다 (은화 20)
      effects: ["money -= 20", "affinity.noel += 12", "trust.noel += 10"]
      lines:
        - "주머니에서 은화 스무 닢을 세어 주인 손에 쥐여 줬다."
        - 주인@놀람: "…어? 학생이 이 녀석 외상을?"
        - "주인이 은화를 한 번, 나를 한 번, 노엘을 한 번 보더니 멱살을 놓았다."
        - 주인: "…됐다. 오늘 치는 이걸로 친다. 너, 이런 후배 둔 거 복인 줄 알아."
        - "주인이 술집 안으로 들어가자, 골목에 노엘과 나만 남았다."
        - "노엘이 한참 말이 없었다. 술 냄새 섞인 숨을 길게 내쉬고, 머리에 묶었던 넥타이를 풀어 목에 다시 맸다."
        - 노엘@진지: "…너 진짜 이상한 1학년이다. 이 빚은 기억해두지."
        - 노엘: "나는 빚은 안 잊어. 다른 건 다 잊어도. 그게 우리… 아니, 내 버릇이야."
        - "노엘이 등을 돌려 골목 안쪽으로 걸어갔다. 취한 사람치고는 걸음이 똑바르다."
        - 속마음: "(우리, 라고 했다가 고쳤다. 누구를 말하려던 걸까.)"
    - text: 못 본 척한다
      lines:
        - "못 본 척 고개를 돌렸다. 스무 닢은 큰돈이다. 그리고 남의 술값이다."
        - "등 뒤에서 노엘의 웃음소리가 들렸다. 맞는 소리보다 웃음소리가 더 컸다."
        - 노엘@웃음: "그래, 그래! 현명한 1학년이다! 나 같은 선배는 못 본 척하는 게 맞아!"
        - "골목을 빠져나올 때까지 그 웃음이 따라왔다. 그러다 뚝 끊겼다."
        - "돌아보지 않았다. 돌아보면 무슨 얼굴을 하고 있을지 알 것 같아서."
        - 속마음: "(원작대로라면 저 선배는 학년말에 짐을 싸서 사라진다. 아무도 이유를 모른 채.)"
