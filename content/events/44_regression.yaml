# 회귀: 죽으면 그 달 1주차 첫 칸으로 돌아온다 (docs/08 5절).
# loop.count = 몇 번째 회귀인가, died.<원인> = 그 원인으로 죽은 적이 있다, loop.just = 방금 돌아왔다.

- id: loop_wake
  title: 다시, 이 아침
  on: auto
  when: "loop.just"
  priority: 50
  free: true
  repeat: true
  effects: ["loop.just = 0", "stress += 8"]
  lines:
    - when: "loop.count == 1"
      나레이션: "숨이 들어왔다."
    - when: "loop.count >= 2"
      나레이션: "숨이 들어왔다. 또."
    - "폐가 찢어질 것처럼 크게, 한 번."
    - "천장이 보인다. 아는 천장이다."
    - "손을 들어 본다. 손가락이 다섯 개. 피도, 흙도, 아무것도 묻어 있지 않다."
    - when: "loop.count == 1"
      속마음: "(……뭐야.)"
    - when: "loop.count == 1"
      속마음: "(분명히 죽었다. 차가웠던 것도, 소리가 멀어지던 것도 기억난다.)"
    - when: "loop.count >= 2"
      속마음: "({{loop.count}}번째다. 세는 게 의미가 있는지는 모르겠지만.)"
    - "창밖에서 새가 운다. 어제도, 아니, 그 '어제'에도 이 새는 똑같은 박자로 울었다."
    - when: "loop.count == 1"
      속마음: "(달력. 달력부터.)"
    - when: "loop.count == 1"
      나레이션: "벽에 걸린 달력을 본다. 이번 달 첫 주. 내가 마지막으로 본 날짜보다 몇 주나 앞이다."
    - when: "loop.count >= 2"
      나레이션: "달력은 볼 필요도 없다. 이번 달 첫 주, 첫날 아침이다."
    - when: "loop.count == 1"
      속마음: "(세이브 포인트. …월초 자동 저장.)"
    - when: "loop.count == 1"
      속마음: "(《에테르 크로니클》에 회귀 시스템 같은 건 없었다. 죽으면 게임 오버, 타이틀 화면이었지.)"
    - when: "loop.count == 1"
      속마음: "(타이틀 화면 대신 이 아침이라는 거다.)"
    - when: "loop.count >= 3"
      속마음: "(익숙해지면 안 되는 것에 익숙해지고 있다.)"
    - when: "loop.last == '미궁그림자'"
      나레이션: "옆구리를 더듬는다. 멀쩡하다. 그런데 그 자리가 아직 차갑다. 로브 자락 아래에서 나온 칼끝의 온도."
    - when: "loop.last == '미궁그림자'"
      속마음: "(혼자 들어갔다. 혼자 졌다. 3층 안쪽은 혼자 갈 곳이 아니었다.)"
    - when: "loop.last == '미궁심연'"
      나레이션: "발밑을 본다. 바닥이 있다. 단단한, 나무 바닥이."
    - when: "loop.last == '미궁심연'"
      속마음: "(계단은 끝나지 않았다. 아래로, 아래로. 발을 헛디딘 다음엔 바닥이 오지 않았다.)"
    - when: "loop.last == '폐광붕괴'"
      나레이션: "숨을 들이쉬자 흙먼지 맛이 난다. 착각이다. 방 안 공기는 깨끗하다."
    - when: "loop.last == '폐광붕괴'"
      속마음: "(썩은 버팀목. 위키 댓글에도 있었지. '욕심부리면 묻힘'. 묻혔다.)"
    - when: "loop.last == '뒷골목칼침'"
      나레이션: "등 뒤가 서늘하다. 반사적으로 벽에 등을 붙이고 나서야, 여기가 내 방이라는 걸 안다."
    - when: "loop.last == '뒷골목칼침'"
      속마음: "(뒷골목 칼침 엔딩. 37개 중에 제일 시시하다고 욕하던 그거. …시시하지 않았다.)"
    - when: "loop.last == '기숙사지붕추락'"
      나레이션: "몸이 저절로 침대 난간을 붙잡는다. 손바닥이 젖어 있다. 기와의 이슬이 아니라, 식은땀이다."
    - when: "loop.last == '기숙사지붕추락'"
      속마음: "(삼 층. 생각보다 길었다. 떨어지는 동안 별이 참 많았다.)"
    - when: "loop.last == '보트창고익사'"
      나레이션: "기침이 터진다. 물은 나오지 않는다. 폐 속은 말라 있다. 그런데 귀 안쪽에서 아직 물소리가 웅웅거린다."
    - when: "loop.last == '보트창고익사'"
      속마음: "(혼자 들어가지 말았어야 했다. 고양이들은… 이번엔, 같이 구한다.)"
    - "머릿속 어딘가가 묵직하다. 지난 몇 주의 기억이 통째로, 하나도 빠짐없이 들어 있다."
    - "누가 무슨 말을 할지. 어느 길 모퉁이에서 무엇이 기다리는지."
    - 속마음: "(기억은 남았다. 내가 본 미래도, 내가 고른 길도.)"
    - 속마음: "(그거면 됐다. 이번엔 다르게 고르면 된다.)"
    - when: "loop.count >= 2"
      속마음: "(…그 말을 지난번에도 했던 것 같지만.)"
    - "일어서자 다리가 잠깐 휘청였다. 몸은 아무 일도 없었다는데, 마음이 그걸 믿지 않는다."
    - when: "talent.강철멘탈"
      나레이션: "그래도 손은 떨리지 않는다. 떨려야 할 손이 조용한 게, 오히려 조금 무섭다."
    - when: "talent.겁쟁이"
      나레이션: "이가 딱딱 부딪힌다. 이불을 머리끝까지 끌어올리고 싶은 걸 겨우 참는다."
    - when: "talent.몸주인의잔재"
      나레이션: "가슴 안쪽에서 낯선 감정 하나가 웅크린다. 이 몸의 원래 주인도, 지금 같이 떨고 있는 것 같다."
    - 시스템: "[ 회귀 {{loop.count}}회 · 기억의 파편으로 본 미래는 다시 보인다 ]"
    - "멸망까지 남은 시간은 줄지 않았다. 다만 이 한 달을, 한 번 더 산다."
