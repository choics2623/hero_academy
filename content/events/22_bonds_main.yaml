        - 아렌: "그런가? 난 대출 카드 쓸 때만 봐서…"
        - "아렌이 고개를 갸웃했다. 그러다 무언가 떠오른 듯 눈을 크게 떴다."
        - 아렌: "아, 입학식 날. 성검이 빛났을 때 강당 뒤에 그 할아버지 서 계셨어. 다들 나만 보는데, 그분은 검을 보고 있었어."
        - 속마음: "(입학식 날, 성검을 보며 '또 시작이구나'라고 했던 사람이다.)"
