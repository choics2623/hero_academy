# 인연 이야기 (1): 리아나, 아렌, 카이든, 미라벨
# 호감도가 일정 이상이면 그 사람을 만날 수 있는 활동에서 순서대로 열린다 (priority 2).
# 인연이 깊어지면 그 사람에게 배운 전투 기술을 쓸 수 있다.

# ================================================================ 리아나
- id: bond_liana_1
  title: 리아나 — 숲의 노래
  art: cg_liana_song
  on: [온실, 산책]
  priority: 2
  when: "time.year == 1 and affinity.liana >= 15"
  lines:
    - "해 질 무렵. 온실 유리 지붕이 주황빛으로 달아올라 있다."
    - "문을 열자 젖은 흙냄새와 풀 비린내가 훅 밀려왔다. 바깥보다 한 계절쯤 따뜻한 공기."
    - "그리고, 노랫소리."
    - "처음 듣는 말이다. 단어 끝이 전부 둥글게 말려 올라가는, 물 흐르는 것 같은 가락."
    - "온실 맨 안쪽. 리아나가 말라비틀어진 덩굴 앞에 쪼그려 앉아 있다."
    - "두 손으로 덩굴 밑동을 감싸고, 눈을 감은 채 엘프어로 노래를 부르고 있다."
    - 속마음: "(엘프어다. 원작에선 엘프어 대사가 전부 '…♪' 한 줄로 처리됐었는데.)"
    - "한 걸음 다가섰다. 하필 발밑에 떨어져 있던 마른 잎이 바스락, 소리를 냈다."
    - "노래가 뚝 끊겼다."
    - 리아나@놀람: "히익!"
    - "리아나가 뒤로 넘어갈 뻔하다가 겨우 버텼다. 뾰족한 귀 끝이 순식간에 새빨개진다."
    - 리아나@당황: "어, 언제부터 있었어? 들었어? 설마 다 들었어?"
    - 나: "…두 번째 소절부터."
    - 리아나@당황: "그럼 거의 다잖아…!"
    - "리아나가 손으로 얼굴을 가리려다, 손바닥이 흙투성이인 걸 보고 손등으로 바꿨다. 귀는 가려지지 않았다."
    - 리아나: "부끄럽게, 진짜… 엄마가 가르쳐 준 노래야. 숲에선 다들 이렇게 해."
    - 리아나: "식물한테 불러 주면 힘을 낸대. 뿌리가 노래를 듣고, 아, 누가 날 기다리는구나, 하고."
    - "리아나가 손끝으로 덩굴 줄기를 톡 건드렸다. 부서질 것처럼 말라 있다."
    - 리아나: "효과는… 반반? 살아날 때도 있고, 끝내 안 일어날 때도 있고."
    - 리아나@웃음: "그래도 안 부르는 것보단 낫잖아. 아무도 불러 주지 않으면, 얘도 기다릴 이유가 없으니까."
    - "그렇게 말하는 리아나의 옆얼굴이 잠깐, 아주 잠깐, 덩굴만큼 메말라 보였다."
    - 속마음: "(원작 OST 17번, 「숲의 노래」. 가사 없는 허밍 버전만 있던 곡이다.)"
    - when: "note.note_liana.known"
      속마음: "(그 곡이 나오는 장면은 하나뿐이었다. 2학년 여름, 리아나의 장례식.)"
    - "리아나가 무릎에 묻은 흙을 털었다. 그러고는 쪼그려 앉은 채로 나를 올려다본다."
    - 리아나: "근데 있잖아. 나만 들킨 건 불공평해."
    - 리아나@웃음: "너는? 고향에 두고 온 노래 같은 거 없어?"
    - 리아나: "엄마가 불러 줬다거나, 친구들이랑 불렀다거나. 누구나 하나쯤은 있잖아."
    - when: "origin == '숲고아'"
      리아나: "아, 너 숲에서 왔댔지. 혹시 이 노래 알아? …모르는구나. 숲마다 노래가 다르니까."
    - "온실 천장에서 물방울 하나가 떨어져 잎을 두드렸다. 톡."
    - 속마음: "(고향의 노래. 이 몸의 고향 말고, 진짜 내 고향.)"
    - 속마음: "(그런 걸 마지막으로 떠올린 게 언제였더라.)"
  choices:
    - text: 어릴 때 듣던 노래를 흥얼거린다 (이 세계에는 없는 노래)
      effects: ["affinity.liana += 6", "trust.liana += 6", "liana.song = 1"]
      lines:
        - "눈을 감았다. 기억 밑바닥에서 가락 하나가 올라왔다."
        - "엄마가 설거지를 하면서 흥얼거리던 노래. 가사는 반쯤 잊었다. 3,000시간 동안 게임 음악만 들었으니까."
        - "원래 세계의 노래를 조용히 흥얼거렸다. 이 몸의 목소리로 부르니 낯설다. 남의 옷을 입고 집에 돌아온 것 같다."
        - when: "talent.음치"
          나레이션: "…음이 자꾸 엉뚱한 데로 미끄러졌다. 그래도 끝까지 불렀다. 리아나는 웃지 않았다."
        - when: "talent.몸주인의잔재"
          나레이션: "목이 한 번, 낯선 가락 쪽으로 꺾이려 했다. 이 몸의 원래 주인이 알던 노래인가."
        - when: "talent.몸주인의잔재"
          나레이션: "억지로 내 노래로 되돌렸다. 이것만큼은 내 것이어야 했다."
        - "마지막 소절이 끝나도 리아나는 한동안 아무 말이 없었다."
        - 리아나: "처음 듣는 가락이야. 슬픈데… 따뜻해."
        - 리아나: "어디 노래야? 제국 노래는 아니지? 실바니엘 것도 아니고."
        - 속마음: "(여기엔 없는 곳의 노래다. 뭐라고 대답해야 할까.)"
        - 나@슬픔: "…아주 먼 곳."
        - 리아나: "아주 먼 곳."
        - "리아나가 그 말을 입 안에서 한 번 굴렸다. 더 묻지 않았다."
        - 리아나@웃음: "그럼 언젠가 거기도 데려가 줘. 약속."
        - 속마음: "(갈 수 없는 곳이다. 나도, 이 아이도.)"
        - when: "note.note_liana.known"
          속마음: "(그리고 원작대로라면, 이 아이의 '언젠가'는 너무 짧다.)"
        - "리아나가 덩굴에 대고 내 노래의 첫 소절을 따라 흥얼거렸다. 음이 반쯤 틀렸다. 그게 이상하게 좋았다."
    - text: "\"네 노래를 더 듣고 싶어\""
      check:
        type: 설득
        dc: 쉬움
        mods:
          - { when: "origin == '숲고아'", value: 2, label: 숲 출신 }
          - { when: "affinity.liana >= 25", value: 2, label: 가까운 사이 }
      lines:
        - 리아나@당황: "에에? 방금 그렇게 부끄러워했는데?"
        - 나: "그러니까. 이번엔 대놓고 들을게."
        - when: "origin == '숲고아'"
          나: "숲에선 다들 이렇게 한다며. 나도 숲 애야. 부끄러울 거 없잖아."
        - 리아나@당황: "더 부끄럽잖아, 그거…!"
      success:
        effects: ["affinity.liana += 8", "trust.liana += 3"]
        lines:
          - "리아나가 한참 입술을 오물거리다가, 결국 덩굴 쪽으로 돌아앉았다. 등을 보이는 게 최대한의 양보인 모양이다."
          - 리아나: "…한 번만이야. 진짜 한 번."
          - "노래가 다시 시작됐다. 아까보다 작고, 아까보다 조심스러운 목소리."
          - "유리 지붕의 노을이 천천히 보랏빛으로 식어 갔다. 노래는 그 속도에 맞춰 흘렀다."
          - "그때였다. 바스러질 것 같던 덩굴 끝에서, 연두색 싹 하나가 고개를 들었다."
          - "손톱만 한 잎이 노래 박자에 맞춰 떨리듯 펴진다."
          - 리아나@놀람: "어…?"
          - "노래가 끊겼다. 리아나가 싹에 코가 닿을 만큼 얼굴을 들이댔다."
          - 리아나@웃음: "봐! 봤지? 반반이라고 했지? 오늘은 이긴 쪽이야!"
          - 리아나@웃음: "관객이 있어서 힘을 냈나 봐. 얘도, 나도."
          - 속마음: "(호감도 이벤트 CG… 아니. 이건 그냥, 리아나가 이긴 날이다.)"
      great:
        effects: ["affinity.liana += 2"]
        lines:
          - "싹 옆에서 두 번째 잎이 뒤따라 고개를 들었다. 리아나가 숨을 들이켰다."
          - 리아나@웃음: "둘이야! 너 혹시 행운 같은 거 몰고 다녀? 다음에도 와. 꼭."
      fail:
        effects: ["affinity.liana += 4", "trust.liana += 2"]
        lines:
          - "리아나가 입술을 오물거리다가, 결국 고개를 세차게 저었다."
          - 리아나@당황: "아, 안 돼. 오늘은 무리. 심장이 입으로 튀어나올 것 같아."
          - "리아나가 물뿌리개를 집어 들고 괜히 옆 화분에 물을 주기 시작했다."
          - "이미 흙이 축축하게 젖어 있는 화분이다."
          - 나: "그거 아까도 줬잖아."
          - 리아나@당황: "얘는 물을 좋아해!"
          - "한동안 물 떨어지는 소리만 들렸다."
          - "그러다 작게, 아주 작게. 물소리에 숨기듯 허밍이 흘러나왔다."
          - "가사 없는 가락. 아까 그 노래의 첫 소절이다."
          - "덩굴은 끝내 움직이지 않았다. 그래도 리아나의 귀 끝은 노을보다 빨갰다."
          - 리아나: "…이건 노래 아니야. 그냥 숨 쉬는 거야. 들은 걸로 치지 마."
          - 속마음: "(호감도 이벤트 실패… 아니. 이건 그냥, 다음 기회가 남은 날이다.)"
      fumble:
        effects: ["stress += 2"]
        lines:
          - "온실을 나서려는데, 리아나가 허둥지둥 돌아서다 물뿌리개 주둥이를 내 쪽으로 기울였다."
          - "철벅. 신발 속까지 시원해졌다."
          - 리아나@당황: "아! 미, 미안! 너도 물 좋아해?"
          - 나: "…좋아하게 될 것 같아."
    - text: "\"식물한테 노래라니, 근거가 있어?\""
      effects: ["affinity.liana += 2", "trust.liana += 3"]
      lines:
        - 리아나@놀람: "근거?"
        - "리아나가 눈을 동그랗게 떴다."
        - "그러고는 온실 천장에 매달린 마석 등을 가리켰다. 저절로 빛나는 돌을."
        - 리아나: "마법이 있는 세상에서 근거 따지는 사람, 처음 봐."
        - 나: "마법은 술식이 있잖아. 노래는…"
        - 리아나: "엄마가 그랬어. 영창은 원래 노래였대. 사람들이 가락을 잊어버려서 주문이 된 거래."
        - 속마음: "(…게임 시스템으로 치면 '원예부 활동 시 식물 성장 +5%'. 근거는 있었다. 숫자로.)"
        - 리아나: "그리고 근거 없으면 어때. 엄마는 매일 불렀어. 효과가 반반이어도."
        - "리아나가 볼을 살짝 부풀렸다. 화가 난 건 아니고, 지기 싫은 얼굴이다."
        - 리아나@웃음: "…근데 그런 점이 좀 웃기다, 너."
        - 리아나: "다음에 싹 나면 데려와서 보여 줄게. 그땐 인정해야 돼."
        - when: "talent.마도학재능 or synergy.학자 >= 1"
          속마음: "(잠깐. 마도학 개론 각주에 그런 학설이 있었다. '영창 가창 기원설'. 소수설이지만.)"
        - when: "talent.마도학재능 or synergy.학자 >= 1"
          나: "…지금 인정할게. 영창이 노래에서 왔다는 학설, 교재 각주에 한 줄 있어."
        - when: "talent.마도학재능 or synergy.학자 >= 1"
          리아나@놀람: "진짜? 엄마 얘기가 책에 나온다고? …각주라도 이긴 거다, 나!"
        - "온실을 나서는데 등 뒤에서 노래가 다시 시작됐다. 아까보다 조금 더 큰 목소리로. 들으라는 듯이."
      branch:
        - when: "talent.마도학재능 or synergy.학자 >= 1"
          effects: ["trust.liana += 2"]
    - text: 말라붙은 덩굴 밑동에 같이 손바닥을 얹는다 (자연 친화력)
      when: "talent.자연친화력"
      check:
        type: 교감
        dc: 보통
        mods:
          - { when: "origin == '숲고아'", value: 2, label: 숲의 기억 }
          - { when: "fatigue >= 70", value: -2, label: 피로 }
      lines:
        - "대답 대신 덩굴 앞에 쪼그려 앉았다. 리아나가 하던 것처럼, 두 손으로 밑동을 감쌌다."
        - "마른 껍질이 손바닥에 까슬하다. 그 안쪽 깊은 데서, 무언가가 웅크리고 있다."
        - 리아나@놀람: "…너?"
        - 속마음: "(이 몸은 정령과 짐승이 먼저 알아본다. 식물이라고 다를까.)"
        - "숨을 고르고, 손바닥 안쪽으로 마음을 밀어 넣었다. 기다리는 사람이 아직 있다고."
      success:
        effects: ["affinity.liana += 9", "trust.liana += 6"]
        lines:
          - "손바닥 밑에서, 아주 희미하게, 맥박 같은 것이 한 번 뛰었다."
          - 리아나@놀람: "어, 어…?"
          - "리아나가 반사적으로 노래를 다시 시작했다. 이번엔 부끄러워할 틈도 없이."
          - "노래가 내 손바닥을 지나 덩굴 속으로 흘러 들어가는 게 느껴졌다. 물길처럼."
          - "마른 줄기 마디마디에서 연두색 눈이 하나, 둘, 셋 터져 나왔다."
          - 리아나@웃음: "봤어? 봤지? 셋이야! 혼자 부를 땐 하나도 겨우였는데!"
          - 리아나: "너, 숲의 말을 알아듣는구나. 엄마가 그런 사람은 백 명에 하나라고 했어."
          - "리아나가 흙투성이 손으로 내 손등을 꼭 쥐었다. 덩굴 대신."
          - 속마음: "(원작에선 '동물 호감 +' 한 줄짜리 재능이었다. 이런 연출은 어디에도 없었다.)"
          - 속마음: "(노래하는 사람이 하나 더 있으면, 기다릴 이유도 하나 더 생긴다.)"
      great:
        effects: ["affinity.liana += 2", "stat.매력 += 1"]
        lines:
          - "그날 밤, 리아나가 기숙사 복도를 뛰어와 알려 주었다. 덩굴 끝에 흰 꽃봉오리가 맺혔다고."
          - 리아나@웃음: "이름 붙여도 돼? '둘이 부른 노래'. …길다. 그냥 '노래'로 할래."
      fail:
        effects: ["affinity.liana += 6", "trust.liana += 4"]
        lines:
          - "한참을 그렇게 있었다. 손바닥이 덩굴의 차가움에 물들 때까지."
          - "아무것도 돌아오지 않았다. 유리 지붕 안의 흙은 숲의 흙보다 낯을 가렸다."
          - "리아나가 옆에 쪼그려 앉아 내 손등을 내려다봤다."
          - 리아나: "…너, 숲에서 이런 거 해 봤구나. 손 모양이 엄마랑 똑같아."
          - 나: "대답이 없네."
          - 리아나@웃음: "당연하지. 처음 보는 사람한테 바로 대답하는 덩굴이 어딨어."
          - 리아나: "숲에서도 그래. 몇 번은 찾아가야 마음을 열어 줘."
          - "리아나가 내 손 위에 자기 손을 겹쳤다. 흙이 묻은, 서늘한 손."
          - 리아나: "다음엔 같이 부르자. 그럼 얘도 두 배로 기다릴 이유가 생기잖아."
          - 속마음: "(판정 실패. …라고 적기엔, 손등이 너무 따뜻하다.)"

- id: bond_liana_2
  title: 리아나 — 마지막 월광초
  on: [온실, 산책]
  priority: 2
  when: "time.year == 1 and affinity.liana >= 25 and fired.bond_liana_1"
  lines:
    - "해가 기울기 시작한 온실. 유리 벽에 말라붙은 빗방울 자국이 노을에 반짝인다."
    - "리아나가 작업대에 두꺼운 식물도감을 펼쳐 놓고 앉아 있다. 공부하는 줄 알았는데, 페이지는 아까부터 그대로다."
    - "도감 사이에 끼워 둔 무언가를 보고 있다."
    - 리아나: "아, 왔어? 앉아. 그 의자, 다리 하나 흔들리니까 조심하고."
    - "옆에 앉자 리아나가 잠깐 망설이다가 도감을 내 쪽으로 밀었다."
    - "손때 묻은 책갈피. 얇은 천 사이에 은빛이 도는 마른 꽃잎이 눌려 있다."
    - "빛이 비스듬히 닿자 꽃잎 결을 따라 희미한 광채가 흘렀다. 마르고도 빛을 다 잃지 않은 꽃."
    - 리아나: "월광초야. 보름달 뜨는 밤에만 피는 꽃."
    - 리아나@슬픔: "고향에서 마지막으로 딴 거. 엄마가 돌아가신 해 가을에."
    - "리아나의 손가락이 책갈피 가장자리를 쓸었다. 몇 번이나 그렇게 쓸었는지, 천 모서리가 닳아 있다."
    - 리아나: "엄마랑 둘이 땄어. 엄마는 그때 벌써 많이 아팠는데, 그래도 숲에 가겠다고 고집 부렸어."
    - 리아나: "올해 건 네가 따라고. 내년부턴 혼자 따야 하니까, 길 잘 봐 두라고."
    - "리아나가 웃었다. 웃는 얼굴인데, 목소리 끝이 조금 갈라졌다."
    - 리아나@웃음: "근데 그다음 해엔 못 갔어. 아카데미 입학 준비하느라. …핑계지만."
    - 리아나: "이거 달여 먹으면 숨이 덜 차거든. 어릴 때부터 엄마가 가을마다 달여 줬어."
    - "말해 놓고 아차 싶었는지, 리아나가 손을 휘휘 저었다."
    - 리아나@웃음: "아, 별거 아냐! 그냥 체질이 좀 그래. 계단 많은 데 가면 좀 헉헉대는 정도?"
    - when: "note.note_liana.known"
      속마음: "(별거 아닌 게 아니다. 2학년 여름, 이 아이는 그 '체질' 때문에 죽는다.)"
    - when: "fs.F05.noticed"
      속마음: "(계단 중간에서 가슴을 짚던 손. 그게 '좀 헉헉대는 정도'였을 리가 없다.)"
    - 속마음: "(월광초 탕약. 공략 위키 '리아나 생존 루트' 항목의 첫 줄에 적혀 있던 이름.)"
    - 속마음: "(그 항목 편집 기록의 절반이 내 아이디였다. 그리고 나는 한 번도 그 루트를 끝까지 가 본 적이 없다.)"
    - "온실 문틈으로 바람이 들어왔다. 책갈피가 살짝 들렸다. 리아나가 얼른 손바닥으로 눌렀다."
    - 리아나: "…이건 못 먹어. 마지막 거라서. 먹으면 진짜 없어지잖아."
    - 리아나@슬픔: "가끔 꺼내 보기만 해. 엄마 손 냄새가 날 것 같아서. 진짜로 나는 건 아닌데."
    - "도감을 덮는 소리가 온실 안에 작게 울렸다."
    - 속마음: "(지금 무슨 말을 해야 한다. 너무 많이 알아도 안 되고, 너무 모르는 척해도 안 된다.)"
  next: bond_liana_2_teach
  choices:
    - text: "\"가을 보름에 같이 따러 가자\""
      art: cg_liana_pinky
      effects: ["promise.liana = 1", "affinity.liana += 8", "trust.liana += 8", "mood.liana.희망 = 1"]
      lines:
        - 리아나@놀람: "…같이?"
        - "리아나가 나를 빤히 봤다. 농담인지 아닌지 재는 눈이다."
        - 리아나: "국경 숲은 멀어. 하룻밤은 꼬박 걸어야 해. 길도 험하고, 밤엔 늑대도 나와."
        - 나: "그러니까 같이 가자는 거지."
        - when: "origin == '숲고아'"
          나: "숲길은 나도 좀 걸어 봤어. 밤에 늑대 피해 가는 법도."
        - when: "origin == '숲고아'"
          리아나@놀람: "아, 맞다. 너 숲 애였지. …그럼 내가 길 잃어도 네가 찾아 주겠네."
        - when: "talent.짐승의혈통"
          속마음: "(늑대라면 걱정 없다. 이 몸의 피 냄새를 맡으면, 놈들이 먼저 길을 비킨다.)"
        - 리아나: "…진짜? 진짜로?"
        - "대답 대신 고개를 끄덕였다. 리아나의 입꼬리가 천천히, 참으려다 실패한 것처럼 올라갔다."
        - 리아나@웃음: "그래도… 응. 약속이야."
        - "리아나가 새끼손가락을 내밀었다. 손톱 밑에 흙이 끼어 있다."
        - 리아나@웃음: "새끼손가락. 숲에서는 이거 걸고 어기면 다음 봄에 꽃이 안 핀대."
        - "새끼손가락을 걸었다. 노을이 유리 지붕을 지나 두 손가락 위에 내려앉았다."
        - 속마음: "(가을 보름. 머릿속 달력에 동그라미를 친다. 이번 회차에서 가장 굵은 동그라미 중 하나다.)"
      branch:
        - when: "origin == '숲고아' or talent.짐승의혈통"
          effects: ["trust.liana += 2"]
    - text: "\"약재상한테 들었어. 가을 보름, 국경 숲에서만 핀다며\""
      art: cg_liana_pinky
      when: "know.moonherb_where"
      effects: ["promise.liana = 1", "affinity.liana += 6", "trust.liana += 12", "mood.liana.희망 = 1"]
      lines:
        - 리아나@놀람: "…약재상?"
        - "리아나가 고개를 번쩍 들었다."
        - 리아나: "너… 그걸 일부러 알아봤어? 도시까지 가서? 나 때문에?"
        - 나: "지나가다 물어본 거야."
        - 리아나: "거짓말. 약재상 같은 데, 지나가다 들르는 데가 아니잖아."
        - "리아나가 한참 책갈피만 내려다봤다. 손가락이 천 모서리를 쥐었다 놓았다 했다."
        - 리아나@슬픔: "엄마 말고는, 아무도 그 꽃 이름을 기억해 준 적 없었는데."
        - 리아나: "하루만 지나도 시들어. 그날 따서 그날 달여야 해. 그것까지 들었어?"
        - when: "talent.완전기억"
          속마음: "(약재상의 말은 토씨 하나까지 기억한다. 뿌리는 버리고, 꽃잎만, 달이 지기 전에.)"
        - "고개를 끄덕이자 리아나가 웃었다. 이번엔 목소리가 갈라지지 않았다."
        - 리아나@웃음: "그럼 같이 가. 가을 보름. 길은 내가 알아. 엄마가 보여 줬으니까."
        - 리아나: "고마워. …진짜로."
        - "리아나가 새끼손가락을 내밀었다. 걸었다. 생각보다 꽉 쥐었다."
        - 속마음: "(1학년 10월 보름. 첫 실전 토벌 바로 다음 날이다. 몸이 두 개였으면 좋겠다.)"
    - text: 책갈피를 조심스럽게 돌려준다
      check:
        type: 손재주
        dc: 쉬움
        mods:
          - { when: "origin == '숲고아'", value: 2, label: 약초 손질 }
          - { when: "fatigue >= 70", value: -2, label: 떨리는 손 }
      lines:
        - "책갈피를 두 손으로 받쳐 들었다. 숨만 세게 쉬어도 바스러질 것 같은 꽃잎이다."
      success:
        effects: ["affinity.liana += 5", "trust.liana += 4"]
        lines:
          - "꽃잎이 접히지 않게, 천천히 도감 사이에 되돌려 놓았다."
          - "리아나가 그 손을 가만히 보고 있었다."
          - 리아나: "…다들 그냥 손가락으로 집어 들거든. 마른 꽃이니까."
          - 리아나@웃음: "소중히 다뤄 줘서 고마워. 이거 아무한테나 안 보여 주는 거야."
          - 리아나: "엄마 말고 이걸 본 사람, 네가 두 번째야. 아니, 세 번째. 숲의 무녀님도 봤으니까."
          - "리아나가 도감을 가슴에 꼭 안았다."
          - 속마음: "(가을 보름, 국경 숲. 목까지 올라온 말을 삼켰다. 다음 기회가 있을까.)"
          - 속마음: "(…아니. 기회는 내가 만들면 된다. 그게 이번 회차의 규칙이다.)"
      fail:
        effects: ["affinity.liana += 3", "trust.liana += 3"]
        lines:
          - "도감 사이에 밀어 넣는 순간, 손끝이 반 박자 늦었다."
          - "바삭. 아주 작은 소리. 꽃잎 가장자리에서 은빛 부스러기 하나가 떨어졌다."
          - "숨이 멎었다. 손톱만도 못한 조각이 작업대 나뭇결 위에서 희미하게 빛났다."
          - 나@당황: "…미안. 내가—"
          - 리아나: "괜찮아."
          - "리아나가 손가락 끝으로 그 부스러기를 조심스럽게 찍어 올렸다."
          - 리아나: "원래 가장자리부터 부스러져. 해마다 조금씩. 네 탓 아니야."
          - "리아나가 부스러기를 책갈피 천 사이에 함께 끼워 넣었다. 하나도 버리지 않겠다는 듯이."
          - 리아나@웃음: "봐. 아직 다 여기 있어."
          - "웃는 얼굴이었다. 그런데 도감을 덮는 손이 아까보다 조금 오래 머뭇거렸다."
          - 속마음: "(가을 보름, 국경 숲. 목까지 올라온 말을 또 삼켰다. 지금 꺼내면 사과처럼 들릴 것 같아서.)"
          - 속마음: "(…다음엔 손 말고 말로 지켜 주자. 그 꽃을.)"

- id: bond_liana_2_teach
  title: 리아나 — 바람 읽기
  art: back_hill
  lines:
    - "온실을 나서자 리아나가 갑자기 손뼉을 쳤다."
    - 리아나: "아 맞다! 너 저번에 활 쏠 때 바람을 하나도 못 읽더라."
    - 리아나@웃음: "화살이 옆 나무에 박혔잖아. 그 나무, 아직도 구멍 나 있어."
    - 나@당황: "…그건 바람 탓이었어."
    - 리아나: "그러니까. 바람 탓이니까 바람을 읽어야지. 따라와."
    - "리아나에게 소매를 붙들려 뒷산 활터까지 올라갔다. 해가 능선에 반쯤 걸려 있다."
    - "쓰러진 통나무 너머로 과녁이 서 있다. 그 뒤로 숲이 바람에 한쪽으로 쏠렸다가 돌아온다."
    - "리아나는 활을 들지 않았다. 대신 내 앞에 서서, 두 손바닥으로 내 눈을 덮었다."
    - 리아나: "눈 감아. …아, 이미 내가 감겼구나."
    - 리아나: "바람은 귀로 듣는 게 아니야. 피부로 듣는 거야."
    - 리아나: "목덜미, 손등, 귓바퀴. 바람이 제일 먼저 닿는 데."
    - "리아나의 손바닥은 서늘했다. 그 너머로 아무것도 보이지 않는다."
    - 리아나: "…지금 바람이 어느 쪽에서 와?"
    - 나: "…왼쪽?"
    - 리아나: "땡. 그건 내가 숨 쉰 거야."
    - "리아나가 킥킥 웃었다. 그 숨결이 다시 왼쪽 뺨에 닿았다."
    - 리아나: "다시. 나 말고. 나무들이 숨 쉬는 쪽."
    - "숨을 골랐다. 귀를 비우고, 피부에만 마음을 모았다."
    - "처음엔 아무것도 없었다. 그러다 목덜미 오른쪽 뒤에서, 아주 가는 실 같은 서늘함이 지나갔다."
    - "그 실이 귓바퀴를 감고 앞으로 흘러간다. 숲이 쏠리기 반 박자 전에."
    - 나: "오른쪽 뒤. 그리고… 곧 세진다."
    - "말이 끝나자마자 숲이 쏴아, 하고 한쪽으로 누웠다."
    - 리아나@놀람: "…와."
    - "리아나가 손을 뗐다. 노을이 눈을 찔렀다. 리아나가 나를 신기한 동물 보듯 보고 있다."
    - 리아나@웃음: "그거야. 바람이 오기 직전의 결. 숲에선 사냥꾼도 짐승도 그걸로 살아."
    - 리아나@진지: "사람도 똑같아. 누가 움직이기 직전엔 공기가 먼저 움직여. 칼을 들기 전에, 숨을 들이쉬기 전에."
    - "다시 눈을 감았다. 상대가 움직이기 직전의, 그 결. 목덜미에 닿는 공기의 결이 또렷하게 느껴졌다."
    - when: "talent.자연친화력"
      나레이션: "숲의 바람이 유난히 다정하게 손등을 핥고 지나갔다. 리아나가 볼을 부풀렸다. ─ 너, 바람이랑 원래 친했지?"
    - when: "talent.짐승의혈통"
      나레이션: "바람에 실린 냄새까지 읽혔다. 젖은 이끼, 멀리 지나간 사슴의 흔적."
    - when: "talent.짐승의혈통"
      리아나@놀람: "…너 지금 코 킁킁댔지? 냄새도 맡아? 숲 사냥꾼들도 그건 못 하는데."
    - 리아나: "엄마가 가르쳐 준 거야. 이건 노래보다 확실해. 반반 아니고, 거의 다."
    - 속마음: "(원작 리아나의 패시브, '숲의 감각'. 동료 전용이라 플레이어는 절대 배울 수 없던 기술이다.)"
    - 속마음: "(배울 수 없던 걸 배웠다. 이 세계는 시스템이 아니라 사람으로 돌아간다.)"
    - 시스템: "기술 습득 — 바람 읽기 (전투: 간파 +25)"
    - 리아나@웃음: "자, 이제 화살. 이번에도 옆 나무 맞히면 저녁은 네가 사."
  effects: ["skill.바람읽기 = 1"]

- id: bond_liana_3
  title: 리아나 — 엄마의 심장
  art: cg_liana_heart
  on: 산책
  slots: [밤]
  priority: 2
  when: "time.year == 1 and affinity.liana >= 35 and fired.bond_liana_2"
  lines:
    - "밤 산책. 기숙사 뒤편 길을 따라 호숫가까지 내려왔다."
    - "풀숲에서 반딧불이 몇 개가 떠올랐다가 꺼진다. 물 냄새가 서늘하다."
    - "호숫가 바위 옆에 누가 웅크리고 앉아 있다. 무릎을 끌어안고, 등을 둥글게 만 채."
    - "리아나다."
    - "숨소리가 들린다. 너무 크게, 너무 빠르게."
    - "들이쉴 때마다 어깨가 들썩이고, 내쉴 때마다 무언가에 걸린다."
    - "발소리에 리아나가 고개를 들었다. 달빛 아래 얼굴이 종이처럼 하얗다."
    - 리아나@슬픔: "…왔네."
    - 리아나@웃음: "잠깐만. 금방 괜찮아져. 진짜야. 늘 이래."
    - "웃는다. 이마에 식은땀이 맺혀 있는데도."
    - 속마음: "(보건실. 의무관. …지금 데려가겠다고 하면, 이 아이는 괜찮다는 말만 반복할 것이다.)"
    - "두 걸음 떨어진 자리에 섰다. 아무 말도 하지 않았다."
    - "호수 위로 바람이 지나갔다. 리아나의 숨소리와 물결 소리가 번갈아 들렸다."
    - "한참 뒤에야, 숨이 조금 느려졌다."
    - "그리고 한참을 더 지나서야 리아나가 입을 열었다."
    - 리아나: "엄마도 이랬어."
    - 리아나@슬픔: "처음엔 계단이었어. 그다음엔 언덕. 그다음엔 숲길. 마지막엔… 숨 쉬는 것도."
    - 리아나: "마지막 겨울엔 침대에서 창밖만 봤어. 숲이 보이는 창. 내가 매일 아침 커튼을 열어 줬어."
    - "리아나가 무릎 위에 턱을 괴었다. 호수에 비친 달이 물결에 부서졌다가 다시 모인다."
    - 리아나: "나도 그렇게 될 거래."
    - 리아나@진지: "숲의 무녀님이 그랬어. 엄마 장례식 날. 이 아이도 같은 심장을 가졌다고. 스무 살을 못 넘긴다고."
    - "목소리가 너무 담담했다. 몇 번이나 혼자 소리 내어 연습해 본 문장처럼."
    - when: "talent.허약한심장"
      나레이션: "내 가슴 안에서도 무언가가 한 번 크게 엇박자를 쳤다. 이 몸의 심장도, 남 얘기가 아니다."
    - when: "note.note_liana.known"
      속마음: "(무녀의 예언은 틀렸다. 너무 후하게. 원작의 리아나는 스무 살 근처에도 가지 못한다.)"
    - when: "note.note_liana.known"
      속마음: "(숲 합숙. 마수의 습격. 길어지는 전투. 버티지 못하는 심장. 위키에 내 손으로 적어 넣은 문장들이다.)"
    - 리아나@웃음: "그래서 아카데미에 왔어."
    - 리아나: "숲에 있으면 다들 날 유리병처럼 대하거든. 뛰지 마라, 무리하지 마라, 활은 왜 쏘냐."
    - 리아나: "그 전에 하고 싶은 거 다 해 보려고. 활도 쏘고, 친구도 사귀고, 축제도 가고… 바다도 보고."
    - 리아나@웃음: "웃기지? 시간 정해진 사람이 제일 바쁘게 산다니까."
    - "리아나가 웃었다. 이번엔 진짜로 웃으려고 애쓰는 게 보였다."
    - "반딧불이 하나가 리아나의 무릎에 내려앉았다가, 다시 날아올랐다."
    - 속마음: "(원작에선 2학년 봄, 호감도를 끝까지 채워야 겨우 보던 대사다.)"
    - 속마음: "(그때 주인공의 대답은 선택지 세 개 중 하나였다. 셋 다, 아무것도 바꾸지 못했다.)"
  choices:
    - text: "\"안 웃겨. 그리고 그 예언, 내가 틀리게 만들 거야\""
      check:
        type: 설득
        dc: 보통
        mods:
          - { when: "promise.liana", value: 2, label: 보름의 약속 }
          - { when: "trust.liana >= 20", value: 2, label: 쌓인 신뢰 }
      lines:
        - "웃음이 리아나의 얼굴에서 천천히 내려앉았다."
        - 리아나@놀람: "…틀리게 만든다고?"
        - 나: "응. 무녀님이 틀렸다고, 네가 직접 말하러 가게 만들 거야."
      success:
        effects: ["trust.liana += 12", "affinity.liana += 8", "liana.resolve = 1", "mood.liana.희망 = 1"]
        lines:
          - "리아나가 한참 나를 봤다. 달빛이 그 눈 속에서 흔들렸다."
          - 리아나@놀람: "…너 가끔 진짜 이상한 말 해. 꼭 다 알고 있는 사람처럼."
          - 리아나: "어떻게 그렇게 자신 있게 말해? 무녀님은 백 년 넘게 숲을 지킨 분인데."
          - 속마음: "(알고 있으니까.)"
          - 속마음: "(무녀가 모르는 것까지. 이 세계가 어떻게 끝나는지, 서른일곱 번이나 봤으니까.)"
          - "리아나가 무릎에 얼굴을 반쯤 묻었다. 어깨가 한 번 떨렸다."
          - 리아나@웃음: "…그래도 좋다. 그 말."
          - 리아나: "거짓말이어도 좋아. 오늘은 그 말 믿고 잘래."
          - 속마음: "(거짓말로 만들지 않을 것이다. 이번만큼은.)"
      great:
        effects: ["affinity.liana += 2"]
        lines:
          - "리아나가 새끼손가락을 슬쩍 내밀었다가, 쑥스러운지 도로 거두려 했다."
          - "그 손가락을 붙잡아 걸었다. 반딧불이 하나가 두 손 위에 앉았다가 날아갔다."
          - 리아나@웃음: "…걸었다. 이제 못 물러. 숲에선 이거 어기면 봄이 안 온대."
      fail:
        effects: ["trust.liana += 6", "affinity.liana += 5", "liana.resolve = 1"]
        lines:
          - "리아나가 나를 봤다. 그리고 아주 천천히, 다시 웃었다. 아까와 같은 웃음으로."
          - 리아나: "…고마워. 진짜로."
          - 리아나@슬픔: "근데 그 말, 숲에서도 많이 들었어. 방법이 있을 거라고, 포기하지 말라고."
          - 리아나: "그러고는 다들 나를 유리병처럼 대했어. 그 말을 한 사람들이 제일 먼저."
          - "목까지 차오른 말이 있었다. 원작, 위키, 생존 루트. 어느 것도 입 밖에 낼 수 없는 말."
          - 나: "…난 유리병 취급 안 해."
          - 리아나: "응. 그건 알아. 넌 나한테 바람 읽는 거 배우겠다고 뒷산까지 끌려왔잖아."
          - "리아나가 작게 웃었다. 이번엔 조금 진짜였다."
          - 리아나: "예언 얘기는… 나중에 다시 해. 네가 정말 틀리게 만들면, 그때 믿을게."
          - 속마음: "(말로는 안 된다. 증명해야 한다.)"
          - 속마음: "(그렇다면 증명하면 된다. 서른일곱 번의 엔딩이 전부 그 재료다.)"
    - text: 아무 말 없이 옆에 앉는다
      effects: ["affinity.liana += 10", "trust.liana += 8"]
      lines:
        - "대답 대신 리아나 옆에 앉았다. 바위가 차가웠다."
        - "리아나는 내가 뭐라고 말하길 기다리는 것 같았다. 말하지 않았다."
        - "괜찮아질 거라는 말도, 힘내라는 말도. 이 아이는 그런 말을 평생 들어 왔을 테니까."
        - when: "talent.눈치없음"
          나레이션: "…사실 '힘내'가 목구멍까지 올라왔었다. 이를 악물고 삼켰다."
        - when: "talent.허약한심장"
          나레이션: "리아나의 숨에 내 숨을 맞췄다. 엇박자로 뛰는 심장이 어떤 건지, 이 몸도 조금은 안다."
        - "한참 뒤, 어깨에 작은 무게가 실렸다."
        - "리아나가 내 어깨에 머리를 기댔다. 귀 끝이 목덜미를 간질였다."
        - 리아나: "…조금만. 조금만 이러고 있을게."
        - "호수 위로 달이 높이 떴다. 반딧불이가 물 위에 제 그림자를 떨어뜨리며 날았다."
        - "어깨에 닿은 숨소리가 천천히, 아주 천천히 고르게 돌아왔다."
        - 리아나: "…말 안 해 줘서 고마워. 다들 뭐라도 말하려고 하거든. 그게 더 힘들어."
        - 속마음: "(말하지 않은 게 아니다. 못 했다. 무슨 말을 해도 거짓말이 될까 봐.)"
      branch:
        - when: "talent.허약한심장"
          effects: ["trust.liana += 3"]
    - text: "\"월광초가 있잖아. 약속, 아직 유효해\""
      when: "promise.liana"
      effects: ["trust.liana += 10", "affinity.liana += 6", "liana.hope = 1", "mood.liana.희망 = 1"]
      lines:
        - "리아나가 고개를 들었다."
        - 리아나: "…월광초."
        - 나: "가을 보름. 새끼손가락까지 걸었잖아. 어기면 다음 봄에 꽃이 안 핀다며."
        - "리아나가 풉, 하고 웃음을 터뜨렸다. 그 바람에 숨이 또 엉켜 잠깐 기침을 했다."
        - 리아나@웃음: "그걸 기억하고 있었어?"
        - 리아나: "…응. 가을 보름."
        - "리아나가 새끼손가락을 들어 달에 비춰 봤다. 그날 약속을 건 손가락을."
        - 리아나: "엄마 약을 먹으면 겨울이 덜 무서웠어. 숨이 차도, 아 봄까지는 괜찮겠구나, 하고."
        - 리아나@웃음: "나 그때까지 꼭 버틸게. 너도 잊어버리면 안 돼. 절대로."
        - 속마음: "(잊을 리가 없다. 이번 회차의 달력에서 가장 굵게 칠한 날이다.)"
        - when: "note.note_liana.known"
          속마음: "(월광초는 시작일 뿐이다. 그다음 여름까지, 이 아이의 심장을 붙잡아 둘 것.)"
    - text: 들썩이는 등에 손을 얹고, 소리 없이 기도한다 (성흔)
      when: "talent.성흔"
      check:
        type: 신성
        dc: 보통
        mods:
          - { when: "skill.치유기도", value: 3, label: 세라의 기도 }
          - { when: "stress >= 60", value: -2, label: 흐트러진 맘 }
      lines:
        - "말 대신 리아나 옆에 무릎을 꿇었다. 아직 조금 들썩이는 등에, 손바닥을 가만히 얹었다."
        - 리아나@놀람: "…뭐 해?"
        - "대답하지 않았다. 소매 아래 성흔이 미지근하게 달아올랐다."
        - 속마음: "(성흔은 병을 고치지 못한다. 원작에서 몇 번이고 시험해 봤다. 그래도, 숨 한 번쯤은.)"
      success:
        effects: ["trust.liana += 10", "affinity.liana += 10", "mood.liana.희망 = 1"]
        lines:
          - "손바닥 아래로 빛이 스몄다. 반딧불이보다 희미하고, 달빛보다 따뜻한."
          - "엉켜 있던 숨이 한 올씩 풀리듯 길어졌다. 들이쉬고, 내쉬고. 걸리는 데 없이."
          - 리아나@놀람: "……어."
          - "리아나가 자기 가슴께를 짚었다. 처음 만져 보는 물건처럼."
          - 리아나: "숨이… 끝까지 쉬어져. 이거 몇 달 만이야."
          - 리아나@슬픔: "엄마한테도 이런 게 있었으면 좋았을 텐데."
          - "그 말을 하고는 리아나가 얼른 웃었다. 이번 웃음엔 식은땀이 없었다."
          - 리아나@웃음: "무녀님 기도보다 따뜻하다. 이건 비밀로 해 줄게. 교회가 알면 너 데려갈 거야."
          - 속마음: "(고친 게 아니다. 숨 한 번을 빌려준 것뿐이다.)"
          - 속마음: "(그래도 빌려줄 수 있다는 걸 알았다. 그 여름까지, 몇 번이고.)"
      great:
        effects: ["stat.의지 += 1"]
        lines:
          - "빛이 사그라든 뒤에도 손바닥 모양의 온기가 등에 남아 있었다고, 리아나가 며칠 뒤 말해 주었다."
          - 리아나@웃음: "그날 밤엔 꿈도 안 꾸고 잤어. 엄마 돌아가시고 처음으로."
      fail:
        effects: ["trust.liana += 7", "affinity.liana += 7"]
        lines:
          - "빛이 손끝에서 깜박였다. 한 번, 두 번. 그리고 꺼졌다."
          - "기도가 닿을 곳을 찾지 못하고 흩어진다. 손바닥만 괜히 뜨겁다."
          - 속마음: "(집중이 안 된다. 이 아이의 숨소리가 너무 가까워서.)"
          - "그런데 리아나가 등을 조금 뒤로 기댔다. 내 손바닥 쪽으로."
          - 리아나: "…따뜻하다. 손이."
          - 나: "기도하려고 했는데. 잘 안 됐어."
          - 리아나@웃음: "알아. 손 엄청 떨렸어. 기도하는 사람 손이 원래 그렇게 떨려?"
          - 리아나: "근데 됐어. 따뜻한 걸로 충분해. 엄마도 아플 땐 손만 잡아 달랬어."
          - "한참 그렇게 있었다. 숨소리는 기도 없이도, 천천히 고르게 돌아왔다."
          - 속마음: "(신성력보다 손바닥 하나가 나을 때도 있다. 원작엔 그런 수치가 없었다.)"

# ================================================================ 아렌
- id: bond_aren_1
  title: 아렌 — 양치기의 성검
  art: cg_aren_shepherd
  on: [훈련장, 식당, 마법실습]
  priority: 2
  when: "time.year == 1 and affinity.aren >= 15"
  lines:
    - "훈련이 끝난 저녁. 식당 창으로 들어온 노을이 긴 식탁 위에 비스듬히 누워 있다."
    - "하루 종일 휘두른 목검 탓에 팔이 숟가락 무게도 버겁다. 감자 스튜에서 김이 오른다."
    - "맞은편 의자가 끄익, 끌렸다."
    - 아렌: "여기 앉아도 돼? …아, 이미 앉았다. 미안."
    - "아렌이 식판을 내려놓았다. 빵 두 개, 스튜, 그리고 사과 하나. 손바닥엔 물집이 터진 자국이 여럿이다."
    - "아렌은 한동안 말없이 빵만 뜯었다. 먹지는 않고, 뜯기만."
    - when: "origin == '악역도련님'"
      아렌: "…벨모어가 사람이랑 밥 먹는다고 하면 우리 마을 사람들 기절할 거야. 아, 나쁜 뜻은 아니고."
    - 아렌: "있잖아."
    - 아렌: "나 원래 양치기였어. 산 중턱 마을에서. 양 마흔두 마리."
    - 아렌@웃음: "이름도 다 지어 줬어. 제일 말 안 듣는 놈이 '대장'이었고."
    - "아렌이 웃었다. 빵 부스러기가 식탁에 떨어졌다."
    - 아렌: "검은커녕 몽둥이도 제대로 못 휘둘렀지. 늑대 오면 소리 지르고 돌 던지는 게 다였어."
    - 아렌: "근데 입학식 날, 그 검이…"
    - "아렌의 손이 무의식적으로 허리춤을 더듬었다. 거기 무언가가 있어야 한다는 듯이."
    - 아렌@슬픔: "성검이 나를 골랐대. 다들 용사님, 용사님 하는데…"
    - "아렌이 목소리를 낮췄다. 옆 식탁 아이들이 힐끔거렸기 때문이다."
    - 아렌@슬픔: "솔직히 무서워."
    - 아렌: "아침에 일어나면 제일 먼저 생각해. 오늘은 검이 마음을 바꾸지 않았을까. 다른 애를 고르지 않았을까."
    - 아렌: "그러면 안심이 될 것 같기도 하고, 아닌 것 같기도 하고. 모르겠어."
    - 아렌: "내가 뭘 잘해서 고른 게 아니잖아. 그냥 검이 그랬을 뿐이지."
    - 아렌: "검술 시간엔 다들 나만 봐. 용사님은 얼마나 잘하나. 그리고 내가 넘어지면… 실망하는 얼굴."
    - "아렌이 손바닥을 펴 보였다. 터진 물집 위에 또 물집이 잡혀 있다."
    - 아렌@웃음: "그래서 밤에 남아서 연습해. 실망하는 얼굴 덜 보려고. 웃기지."
    - 속마음: "(원작의 아렌은 이 불안을 아무에게도 말하지 못했다.)"
    - 속마음: "(말할 수 없었다. 원작의 아렌은 플레이어의 분신이었고, 분신에게는 불안을 털어놓을 대사가 없었으니까.)"
    - 속마음: "(나도 그랬다. 3,000시간 동안 이 녀석한테 무섭냐고 물어본 적이 한 번도 없다.)"
    - "스튜가 식어 간다. 아렌은 대답을 기다리지 않는 척하면서, 사실은 기다리고 있다."
  choices:
    - text: "\"검이 골랐든 말든, 매일 남아서 연습하는 건 너야\""
      effects: ["aren.kind += 1", "affinity.aren += 8", "trust.aren += 6"]
      lines:
        - "아렌의 손이 빵 위에서 멈췄다."
        - 나: "그 물집은 검이 잡아 준 거 아니잖아. 네가 잡은 거지."
        - when: "talent.병약 or talent.저질체력"
          나: "나도 몸이 약해서 남들 두 배는 굴러. 그래도 늘어난 건 다 내 거더라. 검이 준 게 아니라."
        - 아렌@놀람: "……그런 말 처음 들어 봐."
        - "아렌이 자기 손바닥을 내려다봤다. 처음 보는 물건을 보듯이."
        - 아렌: "다들 성검 얘기만 했거든. 검이 골랐으니까, 검이 지켜 줄 거니까."
        - 아렌: "근데 이건… 내 거네. 이 물집은."
        - "아렌이 웃었다. 눈가가 조금 젖어 있었다. 본인은 모르는 것 같다."
        - 아렌@웃음: "고마워. 내일도 남아서 연습할래. 너도 와."
        - 아렌: "같이 하면 덜 무서울 것 같아. 실망하는 얼굴 대신, 네 얼굴 보면 되니까."
        - 속마음: "(원작에 없던 문장이다. 이 녀석의 성격이, 지금 한 칸 움직였다.)"
        - "식은 스튜를 둘이서 마저 먹었다. 이상하게 아까보다 맛있었다."
      branch:
        - when: "talent.병약 or talent.저질체력"
          effects: ["trust.aren += 2"]
    - text: "\"성검이 골랐으면 이유가 있겠지. 믿어\""
      effects: ["aren.arrogant += 1", "affinity.aren += 6"]
      lines:
        - 아렌@놀람: "이유?"
        - 나: "성검이 아무나 고르겠어? 천 년 동안 딱 몇 명만 골랐다며."
        - "아렌의 얼굴이 조금씩 밝아졌다. 듣고 싶던 말을 들은 얼굴이다."
        - 아렌@웃음: "그렇겠지? 그렇겠지! 성검이 틀릴 리 없지."
        - 아렌: "그래, 내가 모르는 뭔가가 나한테 있는 거야. 검은 그걸 알아본 거고."
        - when: "talent.마력감응"
          속마음: "(틀린 말은 아니다. 이 녀석의 마력은 감응으로도 바닥이 안 보인다. 그래서 더 위험하다.)"
        - "아렌이 빵을 한입 크게 베어 물었다. 손바닥의 물집은 더 이상 쳐다보지 않았다."
        - 아렌: "고마워. 괜히 쫄았네. 용사가 이러면 안 되지."
        - 속마음: "(원작의 아렌도 그렇게 믿었다. 그리고 성검에 기대다 무너졌다.)"
        - 속마음: "(검을 믿으라는 말은, 자기를 믿지 말라는 말과 반쯤 같다.)"
    - text: "\"무서운 게 정상이야. 안 무서운 놈이 이상한 거지\""
      check:
        type: 설득
        dc: 쉬움
        mods:
          - { when: "talent.겁쟁이", value: 3, label: 겁쟁이의 말 }
          - { when: "origin == '숲고아'", value: 2, label: 늑대를 앎 }
      lines:
        - 아렌@놀람: "…정상?"
        - 나: "갑자기 세상 구하라고 검을 쥐여 줬는데, 안 무서우면 그게 이상한 거지."
      success:
        effects: ["aren.kind += 0.5", "trust.aren += 8", "affinity.aren += 6"]
        lines:
          - "아렌이 눈을 끔뻑였다. 한 번, 두 번."
          - 아렌: "용사가 무서워해도 돼?"
          - 나: "양치기는 늑대 무서워하잖아. 그래도 양 지키러 나가고."
          - when: "talent.겁쟁이"
            나: "나도 매일 무서워. 겁쟁이 전문가가 하는 말이니까 믿어도 돼."
          - when: "origin == '숲고아'"
            나: "숲에서 자란 애들은 다 알아. 늑대 안 무서워하는 놈이 제일 먼저 물려."
          - "아렌이 입을 벌렸다가 다물었다. 그러다 갑자기 웃음을 터뜨렸다."
          - 아렌@웃음: "하하… 그럼 카이든은 이상한 놈이네. 걔는 하나도 안 무서워 보이던데."
          - 속마음: "(카이든도 무서워한다. 그 녀석은 숨기는 데 익숙할 뿐이다.)"
          - 아렌: "…무서워도 되는구나. 그 말 들으니까 숨이 좀 쉬어진다."
          - "아렌이 식은 스튜를 단숨에 비웠다. 맛없는 것도 남기지 않는, 양치기 시절 그대로의 먹는 법이었다."
      fail:
        effects: ["aren.kind += 0.5", "trust.aren += 4", "affinity.aren += 3"]
        lines:
          - "아렌이 눈을 끔뻑였다. 그리고 애매하게 웃었다."
          - 아렌: "정상이라고 해도… 무서운 건 무서운 거잖아."
          - 나: "그, 그렇지. 그러니까 무서워해도 된다는 거지."
          - 아렌: "무서워해도 되는데, 무서운 건 그대로고?"
          - "말이 꼬였다. 위로를 하려다 숙제를 하나 더 얹어 준 꼴이다."
          - 속마음: "(공략 위키 대사집엔 이 상황의 정답이 없다. 원작의 이 녀석은 이런 말을 한 적이 없으니까.)"
          - "아렌이 풉, 하고 웃었다. 내가 당황하는 걸 처음 보는 얼굴이다."
          - 아렌@웃음: "너도 이런 얘기는 서툴구나. 다행이다. 나만 서툰 줄 알았어."
          - 아렌: "근데 이상하게, 말해 놓으니까 좀 낫다. 무서운 걸 누가 알고 있다는 게."
          - "아렌이 식은 스튜를 마저 비웠다. 남기지 않는, 양치기 시절 그대로의 먹는 법이었다."

- id: bond_aren_2
  title: 아렌 — 성검의 목소리
  on: [훈련장, 식당, 마법실습]
  priority: 2
  when: "time.year == 1 and affinity.aren >= 25 and fired.bond_aren_1"
  lines:
    - "아렌이 나를 찾아온 건 해가 질 무렵이었다."
    - "눈 밑이 퀭하다. 며칠 잠을 못 잔 얼굴. 입술 끝이 터서 하얗게 일어나 있다."
    - 아렌: "잠깐… 시간 돼? 사람 없는 데서."
    - 삽화: training_ground
    - "아렌을 따라 훈련장 뒤편 우물가로 갔다. 두레박 줄이 바람에 삐걱거렸다."
    - "아렌은 우물 턱에 걸터앉아 한참 자기 손등만 문질렀다."
    - 아렌@슬픔: "요즘 밤마다 누가 불러."
    - 나: "누가?"
    - 아렌: "모르겠어. 근데… 성검 안에서."
    - "아렌이 나를 힐끔 봤다. 웃을까 봐 겁내는 눈이다. 웃지 않았다."
    - 아렌: "처음엔 꿈인 줄 알았어. 근데 깨어 있어도 들려. 성검 근처만 지나가도 머릿속이 웅웅거려."
    - 아렌: "목소리가 말해. '아직 멀었다.'"
    - 아렌: "'더 강해져라.'"
    - "아렌이 침을 삼켰다. 목울대가 크게 움직였다."
    - 아렌@진지: "'다 베어라.'"
    - when: "talent.마왕의흔적"
      나레이션: "그 말에, 내 안 깊은 곳의 검은 무언가가 반갑다는 듯 한 번 꿈틀거렸다. 소름이 돋았다."
    - "두레박 줄이 삐걱, 하고 멎었다. 바람이 그쳤다."
    - 아렌: "…다 베라는 게 뭘까. 마물? 마족? 아니면…"
    - "아렌은 문장을 끝내지 않았다."
    - 아렌: "목소리가 화난 것 같지는 않아. 그게 더 무서워. 꼭… 아주 오래 기다린 사람처럼 말해."
    - 아렌@당황: "이상한 소리지? 미친 사람 같지?"
    - 아렌: "다른 사람한테 말하면 용사님이 미쳤다고 소문날 거야. 그럼 다들… 그 얼굴 할 거고."
    - 속마음: "(원작에 이런 장면은 없었다. 아니… 흑화 직전의 독백에 비슷한 말이 있었던가.)"
    - 속마음: "(마검 엔딩의 마지막 독백. 화면이 붉어서 자막을 제대로 못 읽었다. '…베어라'로 끝났던 것 같은데.)"
    - 속마음: "(스킵 버튼을 눌렀었다. 서른 번째쯤 본 엔딩이라서.)"
    - "아렌이 손등을 너무 세게 문질러서 피부가 벌겋게 일어났다."
    - "그 손이 떨리고 있었다."
    - when: "talent.마력감응"
      나레이션: "벌건 손등 위로, 아렌의 것이 아닌 마력이 희미하게 엉겨 있었다. 차갑고, 아주 오래된 결."
    - when: "talent.직감"
      속마음: "(뒷목이 저릿하다. 이 대화는 아무렇게나 넘기면 안 된다. 몸이 먼저 안다.)"
  plants:
