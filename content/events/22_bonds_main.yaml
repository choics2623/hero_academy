          - "아렌은 한참 우물 속을 내려다봤다. 깊은 곳에서 물이 아주 작게 출렁였다."
          - 아렌@웃음: "내 생각대로… 응. 해 볼게."
          - 아렌: "목소리가 들리면 네 말을 떠올릴게. 목소리보다 네 말이 더 크게 들리게."
          - 아렌: "그러니까 너, 자주 말 걸어 줘야 해. 시끄럽게."
          - 속마음: "(닻. 원작엔 없던 단어다. 이 녀석을 이쪽에 붙잡아 둘 무게.)"
      fail:
        effects: ["aren.kind += 0.5", "aren.anchor += 1", "affinity.aren += 3"]
        lines:
