          - "아렌이 처음으로 언성을 높였다. 그러고는 스스로 놀란 듯 입을 다물었다."
          - 아렌@슬픔: "…미안. 너한테 화낼 일이 아닌데."
          - 아렌: "듣지 말라는 거, 나도 해 봤어. 귀를 막아도 머릿속에서 울려. 잠들기 직전에 제일 크게."
          - 속마음: "(너무 쉽게 말했다. 3,000시간 동안 화면 밖에서 구경만 하던 버릇이다.)"
          - "한동안 둘 다 말이 없었다. 두레박 줄만 다시 삐걱거렸다."
          - 아렌: "그래도… 네 생각대로 하라는 말은 좋았어. 그 부분만."
          - 아렌@웃음: "그 부분만 기억해 둘게. 목소리 들리면, 그 부분만 크게 틀어 놓을게."
    - text: "\"도서관 사서 할아버지한테 물어봐. 뭔가 알 것 같아\""
