# 인연 이야기 (1): 리아나, 아렌, 카이든, 미라벨
# 호감도가 일정 이상이면 그 사람을 만날 수 있는 활동에서 순서대로 열린다 (priority 2).
# 인연이 깊어지면 그 사람에게 배운 전투 기술을 쓸 수 있다.

# ================================================================ 리아나
- id: bond_liana_1
  title: 리아나 — 숲의 노래
  on: [온실, 산책]
  priority: 2
  when: "time.year == 1 and affinity.liana >= 15"
  lines:
    - "온실 문을 열자 낯선 노랫소리가 들린다. 리아나가 시든 덩굴에 대고 엘프어로 노래를 부르고 있다."
    - "내 발소리에 노래가 뚝 끊겼다. 리아나의 귀 끝이 빨개진다."
    - 리아나: "어, 들었어? 부끄럽게… 엄마가 가르쳐준 노래야. 식물한테 불러주면 힘을 낸대."
    - 리아나: "효과는… 반반? 그래도 안 부르는 것보단 낫잖아."
    - 리아나: "너는? 고향에 두고 온 노래 같은 거 없어?"
  choices:
    - text: 어릴 때 듣던 노래를 흥얼거린다 (이 세계에는 없는 노래)
      effects: ["affinity.liana += 6", "trust.liana += 6", "liana.song = 1"]
      lines:
        - "원래 세계의 노래를 조용히 흥얼거렸다. 이 몸의 목소리로 부르니 낯설다."
        - 리아나: "처음 듣는 가락이야. 슬픈데 따뜻해. 어디 노래야?"
        - 속마음: "(여기엔 없는 곳의 노래다. 뭐라고 대답해야 할까.)"
        - 나: "…아주 먼 곳."
        - 리아나: "그럼 언젠가 거기도 데려가 줘. 약속."
    - text: "\"네 노래를 더 듣고 싶어\""
      effects: ["affinity.liana += 8", "trust.liana += 3"]
      lines:
        - 리아나: "에에? …한 번만이야."
        - "리아나가 다시 노래를 시작했다. 시든 덩굴 끝에서 정말로 연두색 싹이 고개를 들었다."
        - 리아나: "봐! 반반이라고 했지? 오늘은 이긴 쪽이야."
    - text: "\"식물한테 노래라니, 근거가 있어?\""
      effects: ["affinity.liana += 2", "trust.liana += 3"]
      lines:
        - 리아나: "마법이 있는 세상에서 근거 따지는 사람 처음 봐."
        - 리아나: "…근데 그런 점이 좀 웃기다, 너."

- id: bond_liana_2
  title: 리아나 — 마지막 월광초
  on: [온실, 산책]
  priority: 2
  when: "time.year == 1 and affinity.liana >= 25 and fired.bond_liana_1"
  lines:
    - "리아나가 손때 묻은 책갈피를 보여준다. 은빛이 도는 마른 꽃잎이 끼워져 있다."
    - 리아나: "월광초야. 고향에서 마지막으로 딴 거. 엄마가 돌아가신 해 가을에."
    - 리아나: "이거 달여 먹으면 숨이 덜 차거든. …아, 별거 아냐. 그냥 체질이 좀 그래."
    - when: "note.note_liana.known"
      속마음: "(별거 아닌 게 아니다. 2학년 여름, 이 아이는 그 '체질' 때문에 죽는다.)"
  next: bond_liana_2_teach
  choices:
    - text: "\"가을 보름에 같이 따러 가자\""
      effects: ["promise.liana = 1", "affinity.liana += 8", "trust.liana += 8", "mood.liana.희망 = 1"]
      lines:
        - 리아나: "…진짜? 국경 숲은 멀어. 하룻밤은 꼬박 걸어야 해."
        - 리아나: "그래도… 응. 약속이야. 새끼손가락."
    - text: "\"약재상한테 들었어. 가을 보름, 국경 숲에서만 핀다며\""
      when: "know.moonherb_where"
      effects: ["promise.liana = 1", "affinity.liana += 6", "trust.liana += 12", "mood.liana.희망 = 1"]
      lines:
        - 리아나: "너… 그걸 일부러 알아봤어? 나 때문에?"
        - "리아나가 한참 책갈피만 내려다봤다."
        - 리아나: "고마워. 진짜로."
    - text: 책갈피를 조심스럽게 돌려준다
      effects: ["affinity.liana += 5", "trust.liana += 4"]
      lines: [리아나: "소중히 다뤄줘서 고마워. 이거 아무한테나 안 보여주거든."]

- id: bond_liana_2_teach
  title: 리아나 — 바람 읽기
  lines:
    - 리아나: "아 맞다, 너 저번에 활 쏠 때 바람을 하나도 못 읽더라."
    - 리아나: "귀로 듣는 게 아니야. 피부로 듣는 거야. 눈 감아 봐. …지금 바람이 어느 쪽에서 와?"
    - "눈을 감자 목덜미에 닿는 공기의 결이 느껴졌다. 상대가 움직이기 직전의, 그 결."
    - 시스템: "기술 습득 — 바람 읽기 (전투: 간파 +25)"
  effects: ["skill.바람읽기 = 1"]

- id: bond_liana_3
  title: 리아나 — 엄마의 심장
  on: 산책
  slots: [밤]
  priority: 2
  when: "time.year == 1 and affinity.liana >= 35 and fired.bond_liana_2"
  lines:
    - "밤의 호숫가. 리아나가 무릎을 끌어안고 앉아 있다. 숨소리가 고르지 않다."
    - 리아나: "…왔네. 잠깐만. 금방 괜찮아져."
    - "한참 뒤에야 리아나가 입을 열었다."
    - 리아나: "엄마도 이랬어. 처음엔 계단, 그다음엔 언덕, 마지막엔 숨 쉬는 것도."
    - 리아나: "나도 그렇게 될 거래. 숲의 무녀가 그랬어. 스무 살을 못 넘긴대."
    - 리아나: "그래서 아카데미에 왔어. 그 전에 하고 싶은 거 다 해보려고. 웃기지?"
  choices:
    - text: "\"안 웃겨. 그리고 그 예언, 내가 틀리게 만들 거야\""
      effects: ["trust.liana += 12", "affinity.liana += 8", "liana.resolve = 1", "mood.liana.희망 = 1"]
      lines:
        - 리아나: "…너 가끔 진짜 이상한 말 해. 꼭 다 알고 있는 사람처럼."
        - 속마음: "(알고 있으니까.)"
        - 리아나: "그래도 좋다. 그 말."
    - text: 아무 말 없이 옆에 앉는다
      effects: ["affinity.liana += 10", "trust.liana += 8"]
      lines:
        - "리아나가 내 어깨에 머리를 기댔다. 호수 위로 달이 떴다."
        - "숨소리가 천천히 고르게 돌아왔다."
    - text: "\"월광초가 있잖아. 약속, 아직 유효해\""
      when: "promise.liana"
      effects: ["trust.liana += 10", "affinity.liana += 6", "liana.hope = 1", "mood.liana.희망 = 1"]
      lines:
        - 리아나: "…응. 가을 보름."
        - 리아나: "나 그때까지 꼭 버틸게. 너도 잊어버리면 안 돼."

# ================================================================ 아렌
- id: bond_aren_1
  title: 아렌 — 양치기의 성검
  on: [훈련장, 식당, 마법실습]
  priority: 2
  when: "time.year == 1 and affinity.aren >= 15"
  lines:
    - "훈련이 끝난 저녁. 아렌이 식판을 들고 내 앞에 앉는다."
    - 아렌: "있잖아. 나 원래 양치기였어. 검은커녕 몽둥이도 제대로 못 휘둘렀지."
    - 아렌: "근데 성검이 나를 골랐대. 다들 용사님, 용사님 하는데… 솔직히 무서워."
    - 아렌: "내가 뭘 잘해서 고른 게 아니잖아. 그냥 검이 그랬을 뿐이지."
    - 속마음: "(원작의 아렌은 이 불안을 아무에게도 말하지 못했다.)"
  choices:
    - text: "\"검이 골랐든 말든, 매일 남아서 연습하는 건 너야\""
      effects: ["aren.kind += 1", "affinity.aren += 8", "trust.aren += 6"]
      lines:
        - 아렌: "……그런 말 처음 들어봐."
        - 아렌: "고마워. 내일도 남아서 연습할래. 너도 와."
    - text: "\"성검이 골랐으면 이유가 있겠지. 믿어\""
      effects: ["aren.arrogant += 1", "affinity.aren += 6"]
      lines:
        - 아렌: "그렇겠지? 성검이 틀릴 리 없지."
        - 속마음: "(원작의 아렌도 그렇게 믿었다. 그리고 성검에 기대다 무너졌다.)"
    - text: "\"무서운 게 정상이야. 안 무서운 놈이 이상한 거지\""
      effects: ["aren.kind += 0.5", "trust.aren += 8", "affinity.aren += 6"]
      lines: [아렌: "하하… 그럼 카이든은 이상한 놈이네."]

- id: bond_aren_2
  title: 아렌 — 성검의 목소리
  on: [훈련장, 식당, 마법실습]
  priority: 2
  when: "time.year == 1 and affinity.aren >= 25 and fired.bond_aren_1"
  lines:
    - "아렌이 눈 밑이 퀭한 얼굴로 나타났다."
    - 아렌: "요즘 밤마다 누가 불러. 성검 안에서."
    - 아렌: "'아직 멀었다. 더 강해져라. 다 베어라.' …다 베라는 게 뭘까."
    - 아렌: "이상한 소리지? 미친 사람 같지?"
    - 속마음: "(원작에 이런 장면은 없었다. 아니… 흑화 직전의 독백에 비슷한 말이 있었던가.)"
  plants:
    - { id: F20, notice: { value: "stat.지성 + 15 * perk.고인물의기억", dc: 24 } }
  choices:
    - text: "\"그 목소리, 듣지 마. 네 생각대로 해\""
      effects: ["aren.kind += 1", "aren.anchor += 1", "affinity.aren += 6"]
      lines: [아렌: "내 생각대로… 응. 해볼게. 목소리보다 네 말이 더 크게 들리게."]
    - text: "\"도서관 사서 할아버지한테 물어봐. 뭔가 알 것 같아\""
      effects: ["aren.librarian = 1", "affinity.aren += 5"]
      lines:
        - 아렌: "사서 할아버지? 그 맨날 졸고 계신 분?"
        - 속마음: "(입학식 날, 성검을 보며 '또 시작이구나'라고 했던 사람이다.)"
    - text: "\"더 강해지라는 건 맞는 말 아냐?\""
      effects: ["aren.cold += 1", "affinity.aren += 3"]
      lines:
        - 아렌: "…그런가. 그렇겠지."
        - 속마음: "(방금 그건, 실수였을지도 모른다.)"

- id: bond_aren_3
  title: 아렌 — 지붕 위의 약속
  on: [훈련장, 식당, 마법실습]
  priority: 2
  when: "time.year == 1 and affinity.aren >= 35 and fired.bond_aren_2"
  lines:
    - "기숙사 지붕 위. 아렌이 별을 보며 누워 있다. 내가 올라오자 옆자리를 툭툭 친다."
    - 아렌: "만약에 말이야. 내가 이상해지면… 성검 목소리만 듣고 이상한 짓 하면."
    - 아렌: "네가 때려서라도 멈춰줘. 너라면 할 수 있을 것 같아."
    - 속마음: "(원작의 아렌은 동료를 잃고 마검의 용사가 된다. 그를 멈출 사람은 아무도 없었다.)"
  choices:
    - text: "\"약속할게. 근데 그럴 일 없게 만들 거야\""
      effects: ["aren.anchor += 2", "trust.aren += 15", "affinity.aren += 6", "aren.kind += 1"]
      lines:
        - 아렌: "하하, 든든하다."
        - 시스템: "아렌과 약속을 맺었다 — 원작에 없던 버팀목이 생겼다."
    - text: "\"그런 소리 하지 마. 넌 안 이상해져\""
      effects: ["affinity.aren += 6", "trust.aren += 6"]
      lines: [아렌: "…응. 그래. 그렇겠지."]

# ================================================================ 카이든
- id: bond_kaiden_1
  title: 카이든 — 황자의 질문
  on: [검술부, 훈련장]
  priority: 2
  when: "time.year == 1 and affinity.kaiden >= 15"
  lines:
    - "카이든이 목검을 내려놓고 나를 빤히 본다."
    - 카이든: "궁금한 게 있다. D반이 왜 그렇게까지 하지? 졸업해도 변방 경비대가 고작일 텐데."
  choices:
    - text: "\"살아남으려고\""
      effects: ["trust.kaiden += 8", "affinity.kaiden += 5"]
      lines:
        - 카이든: "살아남는다… 황궁에서 자란 나보다 절실한 말이군."
        - 카이든: "나도 그렇다. 살아남으려고 검을 든다."
    - text: "\"널 이기려고\""
      effects: ["affinity.kaiden += 8", "rival.kaiden = 1"]
      lines:
        - 카이든: "…하. 좋다. 기다리지. 무투대회에서."
        - "카이든이 처음으로 웃었다. 이를 드러내고."
    - text: "\"황자님께 잘 보이려고요\""
      effects: ["affinity.kaiden -= 3"]
      lines: [카이든: "아첨이라면 형님들 주변에 넘쳐난다. 실망이군."]

- id: bond_kaiden_3
  title: 카이든 — 어깨
  on: [검술부, 훈련장]
  priority: 2
  when: "time.year == 1 and affinity.kaiden >= 35 and fired.bond_kaiden_1 and know.kaiden_shoulder"
  lines:
    - "카이든이 연습 후 혼자 왼쪽 어깨를 주무르고 있다. 내가 다가가자 손을 내렸다."
    - 카이든: "봤나. …어차피 너는 이미 알고 있었지. 대련 때 정확히 그쪽을 노렸으니."
    - 카이든: "어릴 때 낙마했다. 아니, 떨어진 게 아니라 떨어뜨려졌지. 큰형의 말에서."
    - 카이든: "황궁에선 약점을 보이면 끝이다. 그러니 이건 너와 나만 아는 걸로 해라."
  next: bond_kaiden_3_teach
  choices:
    - text: 비밀을 지키겠다고 약속한다
      effects: ["trust.kaiden += 15", "affinity.kaiden += 6", "kaiden.secret = 1"]
      lines: [카이든: "…그래. 너라면 믿을 수 있을 것 같군."]
    - text: "\"시스터 루나라면 고칠 수 있을지도 몰라\""
      effects: ["trust.kaiden += 8", "affinity.kaiden += 8", "kaiden.treat = 1"]
      lines:
        - 카이든: "신관에게 보이라고? 교회는 황궁보다 입이 가볍다."
        - 카이든: "…하지만 생각해 보지. 고맙다."

- id: bond_kaiden_3_teach
  title: 카이든 — 검의 리듬
  lines:
    - 카이든: "보답이다. 어깨를 감싸는 대신 찾아낸 방법이지."
    - 카이든: "검은 힘이 아니라 리듬이다. 상대가 막는 박자 사이로 밀어 넣는다. 이렇게."
    - "카이든의 목검이 내 방어 사이로 미끄러져 들어왔다. 막았다고 생각한 순간 이미 닿아 있었다."
    - 시스템: "기술 습득 — 검의 리듬 (전투: 방어 중인 적도 뚫는 공격)"
  effects: ["skill.검의리듬 = 1"]

# ================================================================ 미라벨
- id: bond_mirabel_1
  title: 미라벨 — 아델하이트
  on: [도서관, 마법실습]
  priority: 2
  when: "time.year == 1 and affinity.mirabel >= 15"
  lines:
    - "폐관 직전의 도서관. 미라벨만 남아 낡은 가문 마법서를 베끼고 있다."
    - 미라벨: "…뭘 봐. 구경났어?"
    - "한참 침묵이 흐른 뒤, 미라벨이 펜을 내려놓았다."
    - 미라벨: "3년 전에 우리 가문이 무너졌어. 아버지는 반역죄로 갇히고, 어머니는 사라졌어."
    - 미라벨: "다시 일으킬 거야. 그러려면 일등이어야 해. 어디서든, 뭐든."
  choices:
    - text: "\"도와줄까?\""
      effects: ["affinity.mirabel += 5", "trust.mirabel += 3"]
      lines: [미라벨: "필요 없어. …마음만 받을게."]
    - text: "\"일등 말고 다른 방법은 없어?\""
      effects: ["trust.mirabel += 8", "affinity.mirabel += 3"]
      lines:
        - 미라벨: "있으면 진작 했지."
        - 미라벨: "…그런데 그런 걸 물어본 사람은 네가 처음이야."
    - text: "\"나도 이름 때문에 짊어진 게 있어\""
      when: "origin == '몰락귀족' or origin == '악역도련님'"
      effects: ["affinity.mirabel += 8", "trust.mirabel += 8"]
      lines:
        - 미라벨: "…그렇구나. 너도."
        - "미라벨이 베끼던 책을 반쯤 내 쪽으로 밀어주었다."

- id: bond_mirabel_2
  title: 미라벨 — 영창 분할
  on: [도서관, 마법실습]
  priority: 2
  when: "time.year == 1 and affinity.mirabel >= 25 and fired.bond_mirabel_1"
  lines:
    - 미라벨: "네 영창, 쓸데없이 길어. 옆에서 보기 답답해서 알려주는 거야. 착각하지 마."
    - 미라벨: "영창은 문장이 아니라 박자야. 둘로 쪼개서 반만 외우고, 나머지 반은 마력으로 메워."
    - "미라벨이 지팡이로 허공에 두 개의 고리를 그렸다. 반쪽짜리 주문이 맞물려 하나가 된다."
    - 미라벨: "아델하이트 비전이야. 바깥에 소문내면 죽인다."
    - 시스템: "기술 습득 — 영창 분할 (전투: 마나 2로 쓰는 마법)"
  effects: ["skill.영창분할 = 1", "affinity.mirabel += 5", "trust.mirabel += 5"]

- id: bond_mirabel_3
  title: 미라벨 — 문장 반지
  on: [도서관, 마법실습]
  priority: 2
  when: "time.year == 1 and affinity.mirabel >= 35 and fired.bond_mirabel_2"
  lines:
    - "미라벨이 목에 건 줄을 꺼낸다. 끝에 금이 간 문장 반지가 매달려 있다."
    - 미라벨: "그날 밤, 아버지가 이걸 쥐여줬어. 저택에 검은 로브를 입은 사람들이 들이닥치기 직전에."
    - 미라벨: "로브 등에는 이상한 문양이 있었어. 원 안에 뒤집힌 눈 같은 거."
  plants:
    - { id: F21, notice: { value: "stat.지성 + 10 * fs.F03.noticed", dc: 20 } }
  choices:
    - text: "\"그 문양, 미궁 3층 벽에서 봤어\""
      when: "fs.F03.noticed or know.cult_early"
      effects: ["mirabel.clue = 1", "trust.mirabel += 12", "affinity.mirabel += 5"]
      lines:
        - 미라벨: "……뭐?"
        - "미라벨의 얼굴에서 핏기가 가셨다. 그리고 천천히, 눈빛이 날카로워졌다."
        - 미라벨: "아카데미 안에 그놈들이 있다는 거네. 고마워. 정말로."
        - 속마음: "(원작에서 미라벨은 4학년에야 이걸 알고, 혼자 쫓다가 사라진다. 이번엔 다르다.)"
    - text: "\"같이 찾아보자\""
      effects: ["affinity.mirabel += 8", "trust.mirabel += 6", "mirabel.ally = 1"]
      lines: [미라벨: "…혼자 하려고 했는데. 그래, 둘이 낫겠지."]
    - text: 아는 걸 말하지 않는다 (지금은 이르다)
      effects: ["trust.mirabel += 2"]
      lines:
        - 속마음: "(지금 말하면 미라벨은 혼자 미궁으로 뛰어들 것이다.)"
        - 미라벨: "…들어줘서 고마워. 이거 아무한테도 말한 적 없어."
