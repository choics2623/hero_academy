          속마음: "(또, 라는 말. 처음이 아니라는 말.)"
        - 아렌: "…알았어. 내일 가 볼게. 졸고 계시면 깨워도 되나?"
        - 아렌@웃음: "혼자 끙끙대는 것보단 낫겠지. 고마워."
        - 속마음: "(원작에서 사서는 대사 세 줄짜리 NPC였다. 그 세 줄에 아렌이 말을 건 적은 한 번도 없다.)"
    - text: "\"더 강해지라는 건 맞는 말 아냐?\""
      effects: ["aren.cold += 1", "affinity.aren += 3"]
      lines:
        - 아렌: "…어?"
        - 나: "목소리가 하는 말, 틀린 건 없잖아. 강해져야 하는 건 맞고."
        - when: "talent.강철멘탈"
          속마음: "(내 기준으론 맞는 말이었다. 웬만한 일엔 흔들리지 않는 놈의 기준으로. 이 녀석은 내가 아니다.)"
        - "아렌이 나를 봤다. 아주 잠깐, 무언가가 그 눈 속에서 꺼졌다."
        - 아렌@진지: "…그런가. 그렇겠지."
        - 아렌: "맞아. 무서워할 시간에 하나라도 더 휘두르는 게 낫지."
        - "아렌이 우물 턱에서 일어났다. 손등 문지르던 걸 멈추고, 주먹을 쥐었다."
        - 아렌: "고마워. 정신 차렸어. 가서 연습할게."
        - "아렌은 돌아보지 않고 훈련장으로 걸어갔다. 등이 지나치게 꼿꼿했다."
        - 속마음: "(방금 그건, 실수였을지도 모른다.)"
        - 속마음: "(목소리에게 맞장구를 쳐 준 사람이 하나 늘었다. 그게 나였다.)"

- id: bond_aren_3
  title: 아렌 — 지붕 위의 약속
  art: cg_aren_rooftop
  on: [훈련장, 식당, 마법실습]
  priority: 2
  when: "time.year == 1 and affinity.aren >= 35 and fired.bond_aren_2"
  lines:
    - "저녁 무렵, 아렌이 지나가면서 쪽지를 하나 쥐여 주고 갔다."
    - "── 오늘 밤. 기숙사 지붕. 3층 창고 창문으로."
    - "자정 가까이. 3층 창고 창문을 넘자 차가운 기왓장이 손바닥에 닿았다."
    - when: "talent.거구"
      나레이션: "기왓장 하나가 내 무게에 끼익, 비명을 질렀다. 숨을 참고 한 장씩 골라 디뎠다."
    - when: "talent.고양이반사신경 or talent.키작음"
      나레이션: "몸이 가볍게 기와를 타고 올랐다. 이 몸은 땅보다 지붕 위가 편한 모양이다."
    - "밤바람이 귓불을 스쳤다. 아래로 기숙사 마당이, 그 너머로 호수와 숲이 달빛에 잠겨 있다."
    - "아렌은 지붕 꼭대기에 대자로 누워 별을 보고 있었다. 내가 기어오르자 옆자리를 툭툭 쳤다."
    - 아렌@웃음: "왔다! 여기, 여기. 기와 안 미끄러운 데."
    - "옆에 누웠다. 하늘이 쏟아질 것처럼 가까웠다."
    - 아렌: "고향에선 양 지키느라 밤새 별 봤어. 저건 '양치기 지팡이'. 저건 '늑대 눈'."
    - 아렌: "학교에선 다들 다른 이름으로 부르더라. 천문학 시간에 틀렸다고 혼났어."
    - 아렌@웃음: "근데 난 우리 마을 이름이 더 좋아."
    - "한참 둘이서 별만 셌다. 아렌이 가리키는 별을 따라가다 보니 목이 뻐근했다."
    - "그러다 아렌의 손가락이 허공에서 멈췄다."
    - 아렌: "…목소리, 요즘도 들려."
    - when: "aren.anchor >= 1"
      아렌: "근데 네 말 떠올리면 좀 작아져. 진짜야. 효과 있어."
    - when: "aren.librarian"
      아렌: "사서 할아버지한테도 가 봤어. 아무 말씀 없이 한참 날 보시더니, 차 한 잔 주셨어. 그게 다야."
    - 아렌: "가끔 생각해. 내가 목소리 말을 다 들어 버리면 어떻게 될까."
    - "아렌이 몸을 일으켜 앉았다. 무릎을 세우고, 그 위에 팔을 걸쳤다. 달빛이 옆얼굴을 반으로 갈랐다."
    - 아렌@진지: "만약에 말이야."
    - 아렌@진지: "내가 이상해지면… 성검 목소리만 듣고 이상한 짓 하면."
    - 아렌: "네가 때려서라도 멈춰 줘."
    - 나: "……"
    - 아렌: "농담 아니야. 카이든한테 부탁할까도 했는데, 걔는 진짜로 날 죽일 것 같아서."
    - 아렌@웃음: "너라면 할 수 있을 것 같아. 이상하게, 넌 가끔 내가 어떻게 될지 아는 사람처럼 날 봐."
    - 속마음: "(…들켰나.)"
    - 속마음: "(원작의 아렌은 동료를 잃고 마검의 용사가 된다. 그를 멈출 사람은 아무도 없었다.)"
    - 속마음: "(엔딩 화면 속의 그는 늘 혼자였다. 서른 번 넘게 본 장면이다.)"
    - "아렌이 대답을 기다린다. 별빛이 그 눈동자 속에서 떨렸다."
    - "멀리서 부엉이가 한 번 울었다."
  choices:
    - text: "\"약속할게. 근데 그럴 일 없게 만들 거야\""
      effects: ["aren.anchor += 2", "trust.aren += 15", "affinity.aren += 6", "aren.kind += 1"]
      lines:
        - 나: "약속할게."
        - 아렌@놀람: "진짜?"
        - 나: "근데 그럴 일 없게 만들 거야. 때릴 일 안 생기게."
        - "아렌이 나를 빤히 보다가 웃음을 터뜨렸다. 지붕 기와가 덜그럭거렸다."
        - 아렌@웃음: "하하, 든든하다. 둘 다 해 주는 거야? 때리는 것도, 안 때리는 것도?"
        - 나: "순서대로. 안 때리는 게 먼저."
        - when: "talent.천생신력"
          아렌@웃음: "근데 너 진짜로 세게 때릴 거잖아. 그 팔로. …안 때리는 게 먼저, 꼭이다?"
        - when: "talent.마왕의흔적"
          속마음: "(이상해질지 모르는 건 이 녀석만이 아니다. 내 안에도 검은 게 있다. 그래도 약속은 약속이다.)"
        - 아렌: "좋아. 그럼 나도 약속할게. 이상해지기 전에, 꼭 너한테 먼저 말할게."
        - "아렌이 주먹을 내밀었다. 굳은살 박인 손가락 마디가 달빛에 하얗다."
        - "주먹을 맞부딪쳤다. 생각보다 세게 와서 손이 얼얼했다."
        - 시스템: "아렌과 약속을 맺었다 — 원작에 없던 버팀목이 생겼다."
        - 속마음: "(서른일곱 개의 엔딩 어디에도 없던 약속이다. 지켜야 할 게 하나 늘었다.)"
        - "아렌은 다시 누워 별을 셌다. 그리고 금방 잠들었다. 지붕 위에서, 코까지 골면서."
    - text: "\"그런 소리 하지 마. 넌 안 이상해져\""
      effects: ["affinity.aren += 6", "trust.aren += 6"]
      lines:
        - 나: "그런 소리 하지 마. 넌 안 이상해져."
        - 아렌: "……"
        - "아렌의 입꼬리가 조금 올라갔다가, 그대로 멈췄다."
        - 아렌@슬픔: "…응. 그래. 그렇겠지."
        - 아렌: "다들 그렇게 말해. 용사님은 괜찮을 거라고. 성검이 지켜 줄 거라고."
        - 아렌: "너는… 다르게 말해 줄 줄 알았는데. 아, 아니야. 고마워. 진짜로."
        - "아렌은 다시 누웠다. 별을 셌지만, 아까처럼 이름을 붙이지는 않았다."
        - when: "talent.눈치없음"
          나레이션: "그 입꼬리가 왜 멈췄는지, 그때는 몰랐다. 기숙사로 돌아와 이불을 덮고서야 알았다."
        - 속마음: "(위로를 했다. 그런데 아렌이 원한 건 위로가 아니라 약속이었다.)"
        - 속마음: "(괜찮을 거라는 말은, 혼자 해결하라는 말과 같은 소리로 들린다. 나도 알면서.)"

# ================================================================ 카이든
- id: bond_kaiden_1
  title: 카이든 — 황자의 질문
  on: [검술부, 훈련장]
  priority: 2
  when: "time.year == 1 and affinity.kaiden >= 15"
  lines:
    - "연습이 끝났다. 하나둘 빠져나간 자리에 땀 냄새와 흙먼지만 남았다."
    - "손바닥이 화끈거린다. 목검 손잡이에 감은 천이 땀에 젖어 미끄럽다."
    - "남은 건 둘이다. 나, 그리고 카이든."
    - "카이든은 벽에 기대 목검을 천으로 닦고 있었다. 나무 검인데도, 진검 다루듯."
    - "그러다 손을 멈추고 목검을 무기 걸이에 내려놓았다."
    - "그리고 나를 빤히 본다. 위아래로, 값을 매기듯."
    - 카이든: "궁금한 게 있다."
    - 나: "…황자님이 D반한테?"
    - 카이든: "그래서 궁금한 거다."
    - "카이든이 팔짱을 꼈다. 왼팔이 오른팔보다 아주 조금 늦게 올라갔다."
    - 카이든@진지: "D반이 왜 그렇게까지 하지."
    - 카이든: "매일 마지막까지 남는다. 손바닥 껍질이 벗겨져도 붕대 감고 다시 쥔다. 봤다."
    - 카이든: "졸업해 봐야 변방 경비대가 고작일 텐데. 장벽 끝 망루에서 평생 눈이나 맞겠지."
    - "비꼬는 말투가 아니었다. 정말로 셈이 안 맞아서 묻는 얼굴이다."
    - 카이든: "황궁에선 다들 이유가 있어서 움직인다. 줄을 서려고, 줄을 끊으려고. 이유 없는 노력은 없다."
    - 카이든: "네 이유는 뭐지."
    - "잠깐 말이 끊겼다. 카이든이 시선을 창 쪽으로 돌렸다."
    - 카이든: "대답하기 싫으면 관둬라. 억지로 듣고 싶은 건 아니다."
    - 카이든: "…아니. 듣고 싶다. 정정하지."
    - when: "know.kaiden_palace"
      속마음: "(형들은 내가 실패하길 기다린다고 했었다. 이 녀석은 이유 없는 노력이라는 걸 본 적이 없는 거다.)"
    - 속마음: "(원작 카이든 호감도 첫 이벤트. 선택지는 셋이었고, 공략 위키 기준 정답은 '널 이기려고'였다.)"
    - 속마음: "(…이 녀석은 공략 위키를 읽지 않았다.)"
    - "창밖에서 저녁 종이 울렸다. 카이든은 움직이지 않았다. 대답을 들을 때까지 기다릴 생각인 것 같다."
  choices:
    - text: "\"살아남으려고\""
      effects: ["trust.kaiden += 8", "affinity.kaiden += 5"]
      lines:
        - 나: "살아남으려고."
        - 카이든@놀람: "……"
        - "카이든의 눈썹이 아주 조금 올라갔다. 예상한 대답 목록에 없던 말이다."
        - 카이든: "살아남는다. 학교에서?"
        - 나: "학교에서도. 학교 밖에서도. 앞으로 십 년 동안."
        - "말해 놓고 아차 싶었다. 너무 구체적이었다."
        - when: "origin == '엑스트라'"
          속마음: "(이름 없는 엑스트라는 원작에서 제일 먼저 죽는다. 죽어도 아무도 이름을 모르니까.)"
        - "카이든은 십 년이라는 말을 따져 묻지 않았다. 대신 한참 바닥만 봤다."
        - 카이든@진지: "…황궁에서 자란 나보다 절실한 말이군."
        - 카이든: "나도 그렇다. 살아남으려고 검을 든다. 남들은 황자가 취미로 칼질한다고 하지만."
        - 카이든: "황궁에선 검을 못 쓰는 황자가 제일 먼저 사고를 당한다. 말에서 떨어진다든가."
        - "카이든이 무기 걸이에서 목검을 다시 집었다. 그리고 손잡이를 내 쪽으로 내밀었다."
        - 카이든: "한 판 더. 살아남는 법은 연습해서 손해 볼 일이 없다."
    - text: "\"널 이기려고\""
      effects: ["affinity.kaiden += 8", "rival.kaiden = 1"]
      lines:
        - 나: "널 이기려고."
        - when: "talent.겁쟁이"
          나레이션: "말해 놓고 무릎이 후들거렸다. 겁쟁이가 황자에게 선전포고를 했다."
        - "연습장이 조용해졌다. 창밖의 까마귀까지 입을 다문 것 같았다."
        - "카이든이 나를 봤다. 처음으로, 위아래가 아니라 정면으로."
        - 카이든: "…하."
        - 카이든@웃음: "하하. 좋다."
        - "카이든이 웃었다. 입꼬리만 비트는 비웃음이 아니라, 처음으로 이를 드러내고."
        - 속마음: "(원작에 카이든이 이를 보이며 웃는 CG가 있었나? …없었다. 단 한 장도.)"
        - 카이든: "황궁에선 다들 날 이기고 싶어 하면서, 앞에선 져 준다. 대놓고 말한 놈은 네가 처음이다."
        - when: "talent.겁쟁이"
          카이든: "다리는 떨리는군. 그래도 말은 끝까지 했다. 그게 더 마음에 든다."
        - 카이든@진지: "기다리지. 무투대회에서."
        - 카이든: "그 전에 지치거나 겁먹으면, 그땐 실망하겠다."
        - "카이든이 목검을 어깨에 걸치고 나갔다. 문 앞에서 한 번, 고개만 돌렸다."
        - 카이든: "내일도 남아라. 이길 상대는 가까이서 보는 게 좋다."
    - text: "\"황자님께 잘 보이려고요\""
      effects: ["affinity.kaiden -= 3"]
      lines:
        - 나: "황자님께 잘 보이려고요."
        - "카이든의 얼굴에서 표정이 빠져나갔다. 문이 닫히듯이."
        - 카이든@화남: "…아첨이라면 형님들 주변에 넘쳐난다."
        - when: "talent.귀공자의품격"
          카이든: "귀족 교육은 받았군. 고개 숙이는 각도까지 정확하다. 그래서 더 역겹다."
        - 카이든: "황궁 복도에 가면 매일 듣는 말이다. 잘 보이려고, 눈에 들려고. 그런 놈들이 제일 먼저 등을 찌르지."
        - 카이든: "실망이군. 검은 정직해 보였는데."
        - "카이든이 목검을 집어 들고 돌아섰다. 발소리가 일정했다. 화가 나도 흐트러지지 않는 걸음."
        - 속마음: "(공략 위키에는 '호감도 -3, 비추천'이라고만 적혀 있었다.)"
        - 속마음: "(숫자 -3이 이런 얼굴이었구나.)"
    - text: 대답 대신 무기 걸이에서 목검을 집어 든다 (검사)
      when: "synergy.검사 >= 1 or talent.서번트.검"
      check:
        type: 기민
        dc: 보통
        mods:
          - { when: "count.검술부 + count.훈련장 >= 8", value: 2, label: 쌓인 연습 }
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      lines:
        - "대답 대신 일어섰다. 무기 걸이에서 목검 한 자루를 빼 들었다."
        - "카이든의 눈썹이 한쪽만 올라갔다."
        - 카이든: "…말로 하기 싫다는 건가."
        - 나: "검은 정직하다며. 그럼 검한테 물어봐."
        - "카이든이 입꼬리를 비틀었다. 내려놓았던 목검을 다시 집어 들었다."
        - 속마음: "(이 녀석의 대련 패턴은 3,000시간 내내 봤다. 문제는 이 몸이 그걸 따라가느냐다.)"
      success:
        effects: ["affinity.kaiden += 8", "trust.kaiden += 6", "rival.kaiden = 1"]
        lines:
          - "첫 합. 카이든의 목검이 곧장 목을 향해 왔다. 생각보다 몸이 먼저 비켜섰다."
          - "두 번째, 세 번째. 받아넘길 때마다 손목이 저릿했다. 그래도 물러서지 않았다."
          - "네 번째 합에서, 내 목검 끝이 카이든의 소매를 스쳤다."
          - "카이든이 뒤로 한 걸음 물러났다. 자기 소매를 내려다본다."
          - 카이든: "……"
          - 카이든@웃음: "하. 대답은 들었다."
          - 카이든: "살아남으려는 검이 아니군. 이기려는 검이다. 끝까지 앞으로 나온다."
          - 카이든@진지: "무투대회까지 그 검, 무디게 만들지 마라. 내가 직접 확인할 테니."
          - "카이든이 목검을 걸이에 걸었다. 평소보다 조금 세게. 걸이가 덜컹 흔들렸다."
          - 속마음: "(원작의 이 이벤트엔 선택지가 셋뿐이었다. 네 번째 대답은, 검이었다.)"
      great:
        effects: ["affinity.kaiden += 2", "stat.민첩 += 1"]
        lines:
          - 카이든: "…내일도 남아라. 아니, 모레도. 매일."
          - "명령조였다. 그런데 처음으로, 부탁처럼 들렸다."
      fail:
        effects: ["affinity.kaiden += 5", "trust.kaiden += 3", "rival.kaiden = 1", "fatigue += 5"]
        lines:
          - "첫 합. 카이든의 목검이 보이지 않았다. 손목에 불이 붙은 것 같았다."
          - "목검이 손에서 빠져나가 흙바닥을 굴렀다. 두 바퀴 반."
          - "카이든의 목검 끝이 내 목젖 앞에 멈춰 있었다. 숨 한 번 쉴 시간이었다."
          - 카이든: "…그게 대답인가."
          - 나@당황: "…원래는 좀 더 멋있게 끝날 예정이었어."
          - "카이든이 코로 짧게 숨을 내쉬었다. 웃음인지 한숨인지 모를 소리."
          - 카이든: "말로 했으면 덜 아팠을 텐데."
          - "카이든이 내 목검을 주워 손잡이 쪽으로 내밀었다."
          - 카이든@진지: "그래도 대답은 들었다. 질 걸 알면서 덤비는 놈은, 이유가 있는 놈이지."
          - 카이든: "무투대회 전까진 좀 더 버틸 줄 알게 돼서 와라. 그 전에 지치면 실망한다."
          - 속마음: "(손목이 욱신거린다. 패턴을 아는 것과 막아 내는 건 다른 문제였다.)"
      fumble:
        effects: ["stress += 3"]
        lines:
          - "그날 밤, 손목에 붕대를 감고 식당에 갔다. 아렌이 눈을 반짝이며 달려왔다."
          - 아렌: "너 카이든한테 덤볐다며? 한 합 만에 날아갔다며? 목검이 두 바퀴 반 굴렀다며?"
          - 속마음: "(바퀴 수까지 소문이 났다. 이 학교 정보망은 원작보다 빠르다.)"

- id: bond_kaiden_3
  title: 카이든 — 어깨
  art: cg_kaiden_shoulder
  on: [검술부, 훈련장]
  priority: 2
  when: "time.year == 1 and affinity.kaiden >= 35 and fired.bond_kaiden_1 and know.kaiden_shoulder"
  lines:
    - "해 질 녘. 허수아비들의 그림자가 흙바닥 위에 길게 누워 있다."
    - "다들 돌아간 뒤였다. 무기 걸이 쪽에서 낮은 숨소리가 들린다."
    - "카이든이다. 벤치에 혼자 앉아, 오른손으로 왼쪽 어깨를 꾹꾹 누르고 있다."
    - "주무르는 게 아니라 짓누르는 것에 가깝다. 손가락 마디가 하얗다."
    - "얼굴은 무표정한데, 관자놀이의 핏줄이 뛴다."
    - "발소리를 들었는지 카이든이 손을 내렸다. 아무 일 없었다는 듯, 천천히."
    - 카이든: "봤나."
    - "질문이 아니었다."
    - 카이든: "…어차피 너는 이미 알고 있었지."
    - 카이든@진지: "대련 때 정확히 그쪽을 노렸으니. 오른쪽 아래. 왼팔이 늦는 박자에."
    - 카이든: "우연이라고 하기엔 세 번이나 같은 데를 쳤다."
    - 속마음: "(공략 노트의 한 줄. '왼쪽 어깨를 감싸며 싸운다. 오른쪽 아래로 빈틈.' 나는 그걸 그대로 써먹었다.)"
    - 속마음: "(나한테는 공략이다. 이 녀석에게는 상처고.)"
    - "카이든이 옆자리를 턱짓으로 가리켰다. 앉으라는 뜻이다."
    - "앉았다. 벤치가 차가웠다. 한동안 둘 다 말이 없었다."
    - "카이든이 먼저 입을 열었다. 허수아비 쪽을 본 채로."
    - 카이든: "어릴 때다. 황족 사냥 대회. 말을 처음 받은 해였지. 회색 조랑말."
    - 카이든@화남: "낙마했다. …아니, 떨어진 게 아니라 떨어뜨려졌지."
    - 카이든: "큰형의 말이 내 말 옆구리를 들이받았다. 실수였다고 했다. 큰형은 웃고 있었고."
    - "카이든의 목소리에는 높낮이가 없었다. 남의 이야기를 읽는 것처럼."
    - 카이든: "어깨뼈가 빠졌다. 궁정 의사는 제대로 맞추지 않았다. 누가 시켰는지는 모른다. 알고 싶지도 않고."
    - 카이든: "그 뒤로 왼팔을 머리 위로 올리면, 여기가 비명을 지른다."
    - when: "talent.무통증"
      속마음: "(아픔을 모르는 이 몸으로는 짐작도 안 가는 말이다. 매일 비명을 들으며 검을 쥔다는 게.)"
    - "카이든이 왼쪽 어깨를 손끝으로 톡 쳤다. 아무렇지 않은 척하는 손끝이 조금 떨렸다."
    - when: "know.kaiden_palace"
      속마음: "(형들이 자기가 실패하길 기다린다고 했었다. 그 기다림은 어릴 때 이미 시작됐던 거다.)"
    - 카이든@진지: "황궁에선 약점을 보이면 끝이다."
    - 카이든: "형님들이 알면 무투대회에서 내 상대는 전부 오른쪽 아래만 노리겠지. 그리고 황궁엔 '3황자는 불구'라는 말이 돌 거다."
    - 카이든: "그러니 이건 너와 나만 아는 걸로 해라."
    - "명령조였다. 그런데 끝이 아주 조금 흔들렸다. 부탁하는 법을 배워 본 적 없는 사람의 부탁."
    - 속마음: "(원작의 카이든은 이 이야기를 누구에게도 하지 않았다. 처형대에 오르는 날까지.)"
    - 속마음: "(반역자 누명, 내전, 처형. 전부 아직 먼 훗날의 일이다. 지금 이 녀석은 그냥 어깨가 아픈 학생이다.)"
  next: bond_kaiden_3_teach
  choices:
    - text: 비밀을 지키겠다고 약속한다
      effects: ["trust.kaiden += 15", "affinity.kaiden += 6", "kaiden.secret = 1"]
      lines:
        - 나: "아무한테도 말 안 해."
        - 카이든: "……"
        - 나: "신문부가 와서 물어도. 교관이 물어도."
        - "카이든이 고개를 돌려 나를 봤다. 거짓말을 찾는 눈. 한참 찾다가, 못 찾은 모양이다."
        - 카이든@진지: "…그래."
        - 카이든: "너라면 믿을 수 있을 것 같군. 이상한 일이다. 황궁에선 형제도 못 믿는데."
        - when: "origin == '악역도련님'"
          카이든: "…그것도 벨모어를. 형님들이 알면 내가 미쳤다고 하겠군."
        - 카이든: "어기면 그땐 황자의 이름으로 너를 벤다."
        - "농담인지 아닌지 알 수 없는 얼굴이었다. 그런데 그 말을 하고 나서, 카이든의 어깨가 아주 조금 내려갔다."
        - "무거운 걸 내려놓은 사람처럼."
        - 속마음: "(이 비밀을 지키는 것. 그게 이 녀석과 나 사이의 첫 번째 계약이다.)"
    - text: "\"시스터 루나라면 고칠 수 있을지도 몰라\""
      check:
        type: 설득
        dc: 보통
        mods:
          - { when: "affinity.luna >= 20", value: 2, label: 루나와 친분 }
          - { when: "trust.kaiden >= 20", value: 2, label: 황자의 신뢰 }
      lines:
        - 나: "시스터 루나한테 보여 봐. 고칠 수 있을지도 몰라."
        - 카이든@놀람: "신관에게 보이라고?"
        - 카이든@화남: "교회는 황궁보다 입이 가볍다. 추기경 귀에 들어가는 순간, 황궁 전체가 안다."
        - 나: "시스터 루나는 추기경 쪽 사람 아니야. 그건 확실해."
        - "카이든이 눈을 가늘게 떴다."
        - 카이든: "…교회 내부 사정을 1학년이 어떻게 알지."
        - 속마음: "(위키에서. 라고 말할 수는 없다.)"
        - 나: "성당에 자주 가서. 그냥, 느낌이야."
        - when: "affinity.luna >= 20"
          나: "추기경 얘기만 나오면 웃으면서 독설하는 분이야. 그쪽 사람이면 그럴 리가 없지."
      success:
        effects: ["trust.kaiden += 8", "affinity.kaiden += 8", "kaiden.treat = 1"]
        lines:
          - "카이든은 한동안 말이 없었다. 그러다 자기 왼쪽 어깨를 내려다봤다. 처음 보는 물건처럼."
          - 카이든: "고친다는 생각은… 해 본 적이 없다. 감추는 생각만 했지."
          - 카이든: "…생각해 보지. 고맙다."
          - "고맙다는 말이 서툴렀다. 자주 써 본 적 없는 단어인 게 분명했다."
      fail:
        effects: ["trust.kaiden += 4", "affinity.kaiden += 4"]
        lines:
          - "카이든은 대답하지 않았다. 대신 왼쪽 어깨를 옷깃으로 더 깊이 덮었다."
          - 카이든: "느낌으로 황족의 몸을 맡기라는 건가."
          - 나: "…그렇게 들리면, 그래."
          - 카이든@진지: "안 된다. 지금은."
          - "단호했다. 그런데 화가 난 목소리는 아니었다."
          - 카이든: "날 위해서 한 말이라는 건 안다. 그래서 거절하기가 더 불편하군."
          - "카이든이 한참 허수아비 쪽만 봤다. 그림자가 아까보다 한 뼘 길어져 있었다."
          - 카이든: "…고친다는 생각은 해 본 적이 없었다. 그 말은 기억해 두지."
          - 속마음: "(설득 실패. 하지만 문이 닫힌 건 아니다. 손잡이에 손이 한 번 갔을 뿐.)"

- id: bond_kaiden_3_teach
  title: 카이든 — 검의 리듬
  art: training_ground
  lines:
    - "카이든이 벤치에서 일어섰다. 무기 걸이에서 목검 두 자루를 빼 들고, 하나를 내게 던졌다."
    - "얼떨결에 받았다. 손바닥이 얼얼하다."
    - 카이든: "보답이다."
    - 나: "…보답?"
    - 카이든: "황족은 빚을 지지 않는다. 비밀을 하나 받았으니, 하나 준다."
    - 카이든: "어깨를 감싸는 대신 찾아낸 방법이지. 왼팔을 못 쓰니, 힘으로는 형님들을 못 이긴다."
    - "카이든이 목검을 오른손 하나로 가볍게 쥐었다. 힘을 뺀 손목."
    - 카이든@진지: "검은 힘이 아니라 리듬이다."
    - 카이든: "누구나 막는 데 박자가 있다. 막고, 숨 쉬고, 다시 막는다. 하나, 둘. 하나, 둘."
    - 카이든: "상대가 막는 박자 사이로 밀어 넣는다. 둘과 하나 사이. 숨 쉬는 그 틈."
    - 카이든: "막아 봐."
    - "목검을 들어 올렸다. 카이든의 첫 번째 찌르기. 막았다. 두 번째. 막았다."
    - "세 번째가 온다는 걸 알았다. 막을 준비를 했다. 숨을 들이쉬었다."
    - "그 순간."
    - "카이든의 목검이 내 방어 사이로 미끄러져 들어왔다. 막았다고 생각한 순간, 이미 명치에 닿아 있었다."
    - 카이든: "숨 쉬었지. 지금."
    - 나@놀람: "…어떻게 알았어."
    - 카이든: "어깨가 올라갔다. 사람은 숨을 들이쉴 때 어깨가 올라간다. 방어가 반 박자 늦어지지."
    - 카이든: "다시. 이번엔 네가 친다. 내 숨을 봐라."
    - "카이든의 숨을 봤다. 어깨를, 가슴을, 목덜미를. 막고, 숨 쉬고, 막고."
    - when: "synergy.검사 >= 1 or talent.서번트.검"
      나레이션: "몸이 먼저 박자를 알아들었다. 열 번째쯤부터는 맞기 직전에 숨을 참는 버릇이 생겼다."
    - "열 번 넘게 맞았다. 스무 번째쯤, 목검 끝이 카이든의 방어 안쪽으로 미끄러져 들어갔다. 소매를 스쳤다."
    - 카이든: "……"
    - 카이든@웃음: "…그거다."
    - 카이든: "나는 그걸 익히는 데 3년 걸렸다. 넌 반나절이군. 기분 나쁘다."
    - "말과 달리, 카이든의 입꼬리가 올라가 있었다."
    - 속마음: "(원작 카이든 전용 기술, '검의 리듬'. 관통 판정. 적으로 만날 때마다 그렇게 짜증 나던 그 기술이다.)"
    - 속마음: "(이걸 만들려고 이 녀석은 혼자 3년을 휘둘렀다. 아픈 어깨를 숨기면서.)"
    - 시스템: "기술 습득 — 검의 리듬 (전투: 방어 중인 적도 뚫는 공격)"
    - 카이든: "이걸로 언젠가 나를 이기면, 그땐 인정하지. 다른 놈한테 먼저 쓰면 용서 안 한다."
    - "해가 완전히 넘어갔다. 카이든이 목검 두 자루를 걸이에 나란히 걸었다."
    - "그리고 왼쪽 어깨를 한 번 크게 돌리며 나갔다. 숨기지 않고."
  effects: ["skill.검의리듬 = 1"]

# ================================================================ 미라벨
- id: bond_mirabel_1
  title: 미라벨 — 아델하이트
  art: cg_mirabel_library
  on: [도서관, 마법실습]
  priority: 2
  when: "time.year == 1 and affinity.mirabel >= 15"
  lines:
    - "폐관 종이 울렸다. 도서관 등불이 하나씩 꺼져 간다."
    - "사서 노인이 열쇠 꾸러미를 짤랑이며 서가 사이를 돈다. 먼지가 등불 빛 속에서 천천히 떠다닌다."
    - "가방을 챙기다 보니, 열람실 맨 안쪽에 아직 불빛 하나가 남아 있다."
    - "미라벨이다. 혼자 남아, 가죽 표지가 다 해진 낡은 마법서를 펜으로 베끼고 있다."
    - "책등에 가문 문장이 박혀 있다. 반쯤 벗겨진 금박."
    - "펜 끝이 종이를 긁는 소리만 일정하다. 잉크병은 거의 바닥이다."
    - 미라벨@화남: "…뭘 봐. 구경났어?"
    - "고개도 들지 않고 한 말이었다."
    - 미라벨: "폐관이야. 가. 사서 할아버지한테는 내가 알아서 말할게."
    - "가지 않았다. 맞은편 의자에 가방을 내려놓았다. 미라벨의 펜이 아주 잠깐 멈췄다가, 다시 움직였다."
    - "한참 침묵이 흘렀다. 등불이 하나 더 꺼졌다."
    - "사서 노인이 우리 쪽을 한 번 보더니, 열쇠를 주머니에 넣고 다른 서가로 걸어갔다. 못 본 척해 주는 걸음이다."
    - "이윽고 미라벨이 펜을 내려놓았다. 손가락에 잉크가 까맣게 배어 있다."
    - 미라벨: "아델하이트 가문 마법서야. 원본은 압류됐어. 이건 학교 서고에 남아 있던 필사본."
    - 미라벨: "이것도 언제 치워질지 몰라. 그래서 베끼는 거야. 한 글자도 안 빼고."
    - "미라벨이 해진 표지를 손바닥으로 덮었다. 누가 뺏으려는 것도 아닌데."
    - 미라벨@슬픔: "3년 전에 우리 가문이 무너졌어."
    - 미라벨: "아버지는 반역죄로 갇혔어. 재판은 사흘 만에 끝났고, 증거는 한 번도 공개되지 않았어."
    - 미라벨: "어머니는… 사라졌어. 그날 밤에. 아무도 어디 갔는지 몰라."
    - "목소리가 낮았다. 평소의 날 선 말투가 아니라, 바닥에 깔리는 목소리."
    - "등불 심지가 탁, 하고 튀었다."
    - 미라벨: "저택은 경매에 넘어갔어. 하인들은 흩어졌고. 남은 건 나랑 이름 하나."
    - 미라벨: "아델하이트. 이제는 다들 비웃을 때만 부르는 이름."
    - 속마음: "(원작 설정집, 미라벨 항목. '3년 전 가문 몰락.' 두 줄짜리 문장이었다.)"
    - 속마음: "(그 두 줄 뒤에 이런 목소리가 있는 줄은 몰랐다.)"
    - 미라벨@진지: "다시 일으킬 거야."
    - 미라벨: "그러려면 일등이어야 해. 어디서든, 뭐든. 실기도, 필기도, 마탑 추천도."
    - 미라벨: "일등이 아닌 아델하이트는 아무도 안 봐. 이등은 그냥 몰락한 집 딸이야."
    - "미라벨이 다시 펜을 쥐었다. 잉크병에 펜촉을 담갔다. 바닥을 긁는 소리가 났다."
    - 속마음: "(그리고 4학년, 이 아이는 가문의 원수를 쫓다 사라진다. 원작의 거의 모든 루트에서.)"
  choices:
    - text: "\"도와줄까?\""
      effects: ["affinity.mirabel += 5", "trust.mirabel += 3"]
      lines:
        - 나: "도와줄까?"
        - 미라벨@당황: "…뭐?"
        - "미라벨이 펜을 든 채 굳었다. 예상하지 못한 공격을 받은 얼굴이다."
        - 미라벨@당황: "필요 없어. 아델하이트는 남의 손 안 빌려."
        - 나: "베끼는 거라도. 손 두 개면 두 배 빠르잖아."
        - 미라벨: "남의 필체가 섞이면 안 돼. 이건… 아버지 글씨를 따라 쓰는 거야."
        - "말해 놓고 미라벨이 입술을 깨물었다. 너무 많이 말했다는 얼굴."
        - 미라벨: "…마음만 받을게."
        - when: "talent.완전기억"
          나: "그럼 베끼진 않을게. 한 번 읽고 외워만 둘게. 이 책이 치워지면, 내가 기억하고 있을게."
        - when: "talent.완전기억"
          미라벨@놀람: "…통째로? 허세도 정도껏— 아니. 너 진짜로 할 수 있는 얼굴이네."
        - "미라벨이 잉크병을 흔들었다. 거의 비었다."
        - "가방에서 내 잉크병을 꺼내 책상 위에 올려놓았다. 미라벨은 아무 말도 하지 않았다. 돌려주지도 않았다."
      branch:
        - when: "talent.완전기억"
          effects: ["trust.mirabel += 3"]
    - text: "\"일등 말고 다른 방법은 없어?\""
      effects: ["trust.mirabel += 8", "affinity.mirabel += 3"]
      lines:
        - 나: "일등 말고, 다른 방법은 없어?"
        - "미라벨이 고개를 들었다. 오늘 처음으로 나를 똑바로 봤다."
        - 미라벨@화남: "있으면 진작 했지."
        - 미라벨: "돈도 없고, 사람도 없고, 이름엔 반역자 딱지가 붙었어. 남은 게 실력뿐인데, 실력은 일등이어야 보여."
        - 나: "그래도. 혼자 일등 하는 거 말고."
        - when: "origin == '평민장학생'"
          나: "나도 장학금 끊기면 끝인 평민이야. 일등 말고 살 길, 나도 찾는 중이고."
        - 미라벨: "……"
        - "미라벨이 뭔가 쏘아붙이려다 그만두었다. 입술이 몇 번 달싹였다."
        - 미라벨@당황: "…그런데 그런 걸 물어본 사람은 네가 처음이야."
        - 미라벨: "다들 '힘내' 아니면 '포기해'였거든. 다른 길을 물어본 사람은 없었어."
        - 미라벨: "생각해 볼게. 답이 나오면 너한테 제일 먼저… 아니, 착각하지 마. 그냥 생각해 본다는 거야."
    - text: "\"나도 이름 때문에 짊어진 게 있어\""
      when: "origin == '몰락귀족' or origin == '악역도련님'"
      effects: ["affinity.mirabel += 8", "trust.mirabel += 8"]
      lines:
        - 나: "나도 이름 때문에 짊어진 게 있어."
        - 미라벨: "…너도?"
        - when: "origin == '몰락귀족'"
          나레이션: "몰락한 집안의 셋째. 이름은 있는데 돈이 없고, 빚 문서만 두툼한 집안."
        - when: "origin == '악역도련님'"
          나레이션: "벨모어. 이 이름을 들으면 다들 눈을 피한다. 이 몸의 원래 주인이 쌓아 올린 이름이다."
        - "미라벨이 나를 오래 봤다. 비웃음을 준비하던 눈이 천천히 풀렸다."
        - 미라벨@슬픔: "…그렇구나. 너도."
        - 미라벨: "이름은 무거워. 내가 고른 것도 아닌데, 평생 들고 다녀야 하잖아."
        - "미라벨이 베끼던 책을 반쯤 내 쪽으로 밀어 주었다. 등불 빛이 두 사람 사이에 고르게 떨어졌다."
        - 미라벨: "읽어도 돼. 아델하이트 비전만 빼고. …거긴 손가락으로 가려 둘 거야."
        - 속마음: "(원작에서 이 책은 미라벨 루트 보상 아이템이었다. 손가락으로 가려진 채로 보게 될 줄은 몰랐다.)"
    - text: '일어나 귀족의 예를 갖춰 "아델하이트 영애"라 부른다 (귀공자의 품격)'
      when: "talent.귀공자의품격"
      check:
        type: 설득
        dc: 보통
        mods:
          - { when: "origin == '몰락귀족'", value: 3, label: 같은 처지 }
          - { when: "fatigue >= 70", value: -2, label: 흐트러진 자세 }
      lines:
        - "의자에서 일어났다. 등을 펴고, 손을 가슴에 얹었다."
        - "이 몸이 기억하는 각도로 허리를 숙였다. 같은 급의 가문을 대할 때 쓰는 예, 였던 것 같다."
        - 나: "아델하이트 영애. 늦은 시각에 실례가 많습니다."
        - "펜 끝이 종이 위에서 멈췄다. 잉크 한 방울이 번졌다."
      success:
        effects: ["affinity.mirabel += 8", "trust.mirabel += 8"]
        lines:
          - 미라벨@놀람: "……"
          - "미라벨이 천천히 고개를 들었다. 처음 보는 얼굴이었다. 날도, 독도 없는."
          - 미라벨: "…그 호칭, 3년 만에 들어."
          - 미라벨@슬픔: "다들 '아델하이트 그 집 딸'이라고 해. 영애라고 불러 준 사람은, 그날 밤 이후로 없었어."
          - "미라벨이 일어나 치맛자락을 살짝 집었다. 잉크 묻은 손가락으로, 완벽한 각도의 답례."
          - 미라벨: "…예를 받았으니 예로 갚아야지. 아델하이트는 받은 걸 잊지 않아."
          - "자리에 앉은 미라벨이 해진 책을 반쯤 내 쪽으로 돌려 주었다."
          - 미라벨@당황: "착각하지 마. 예의 바른 사람한테 등불 빛을 나눠 주는 것뿐이야."
          - 속마음: "(원작에서 '영애'라는 호칭은 미라벨 루트 마지막 장에서야 나온다. 가문 복권 엔딩의 첫 대사.)"
          - 속마음: "(그 단어 하나를 3년이나 기다린 아이였다.)"
      great:
        effects: ["affinity.mirabel += 2"]
        lines:
          - 미라벨: "…이름. 네 이름 다시 말해 봐. 이번엔 제대로 외워 둘게."
          - "미라벨이 공책 귀퉁이에 내 이름을 적었다. 반듯한, 아버지를 닮은 글씨로."
      fail:
        effects: ["affinity.mirabel += 5", "trust.mirabel += 4"]
        lines:
          - "미라벨이 고개를 들었다. 그리고 눈살을 찌푸렸다."
          - 미라벨@화남: "…너무 깊어. 그 각도는 윗가문한테 하는 거야."
          - 미라벨: "지금 아델하이트한테 그렇게 숙이면, 다들 비꼬는 걸로 봐. 몰락한 집에 절하는 척."
          - 나@당황: "…그런 뜻은 아니었어."
          - "미라벨이 한참 내 얼굴을 봤다. 비웃음을 찾는 눈. 찾지 못한 모양이다."
          - 미라벨: "…알아. 얼굴 보면 알아. 그래서 더 짜증 나."
          - "미라벨이 펜을 잉크병에 담갔다. 바닥 긁는 소리가 났다."
          - 미라벨@당황: "그렇게 부르려고 한 사람은 오랜만이야. 틀렸지만."
          - 미라벨: "다음엔 제대로 해. 틀린 예법은 안 받아 줄 거니까."
          - 속마음: "(몇 도였더라. 3,000시간 동안 귀족 예법 미니게임은 늘 스킵했다.)"

- id: bond_mirabel_2
  title: 미라벨 — 영창 분할
  art: cg_mirabel_chant
  on: [도서관, 마법실습]
  priority: 2
  when: "time.year == 1 and affinity.mirabel >= 25 and fired.bond_mirabel_1"
  lines:
    - "마법 실습이 끝난 실습실. 다들 나간 뒤에도 혼자 남아 불꽃 술식을 반복하고 있었다."
    - "영창이 길다. 한 번 외우는 데 숨이 두 번 찬다. 중간에 혀가 꼬이면 처음부터 다시."
    - "열네 번째 실패. 손끝의 불꽃이 피식, 하고 꺼졌다. 탄내가 났다."
    - "등 뒤에서 한숨 소리가 났다. 아주 길고, 아주 노골적인."
    - "미라벨이 문틀에 기대 서 있었다. 팔짱을 끼고."
    - 미라벨@화남: "…열네 번."
    - 나@당황: "세고 있었어?"
    - 미라벨: "세기 싫어도 세져. 그렇게 크게 틀리면."
    - "미라벨이 실습실 안으로 들어왔다. 구두 굽 소리가 또각또각 다가왔다."
    - 미라벨@당황: "네 영창, 쓸데없이 길어. 옆에서 보기 답답해서 알려 주는 거야. 착각하지 마."
    - 미라벨: "교과서대로 외우지? 첫 글자부터 끝 글자까지."
    - 나: "그게 영창이잖아."
    - 미라벨: "그건 영창을 '읽는' 거고."
    - 미라벨@진지: "영창은 문장이 아니라 박자야."
    - "미라벨이 지팡이를 들었다. 지팡이 끝이 허공에 가볍게 원을 그린다."
    - 미라벨: "둘로 쪼개. 앞의 반만 입으로 외우고, 나머지 반은 마력으로 메워."
    - 미라벨: "입으로 말하는 반쪽이 뼈대야. 마력으로 채우는 반쪽이 살이고. 뼈대만 정확하면 살은 몸이 알아서 붙여."
    - "미라벨이 지팡이로 허공에 두 개의 고리를 그렸다. 반쪽짜리 고리 두 개."
    - "반쪽 주문 두 개가 허공에서 천천히 다가가더니, 딸깍 소리가 날 것처럼 맞물려 하나가 된다."
    - "고리 안에서 자줏빛 불꽃이 피었다. 영창은 단어 다섯 개였다."
    - 속마음: "(영창 분할. 원작에선 미라벨 전용 패시브였다. '마나 소모 감소'라는 설명 한 줄.)"
    - 속마음: "(그 한 줄 뒤에 이런 손놀림이 있었다.)"
    - 미라벨: "해 봐. 앞 반쪽만. 나머지는 손끝으로 밀어 넣는다는 느낌으로."
    - "앞 반쪽을 외웠다. 숨이 남는다. 남은 숨을 손끝으로 밀었다."
    - "첫 번째는 고리가 어긋나 연기만 났다. 미라벨이 이마를 짚었다."
    - 미라벨@화남: "박자! 쪼갠 데서 쉬지 마. 이어지는 데서 숨을 넘겨."
    - "두 번째. 고리 두 개가 흔들리며 다가가더니, 맞물렸다."
    - "손끝에 불꽃이 맺혔다. 작고, 단단하다. 마력이 아까의 반도 안 들었다."
    - when: "talent.무영창소질"
      나레이션: "…사실 앞 반쪽도 입 밖에 안 내도 될 것 같았다. 미라벨이 알면 화낼 테니 말하지 않았다."
    - when: "talent.마나회로손상"
      나레이션: "밀어 넣은 반쪽이 금 간 회로를 긁고 지나갔다. 그래도 고리는 맞물렸다."
    - when: "talent.마나회로손상"
      속마음: "(마력이 반만 드는 술식. 회로가 망가진 이 몸에겐 이게 구원이다.)"
    - 미라벨@놀람: "…한 번 만에?"
    - "미라벨의 눈이 동그래졌다가, 금세 가늘어졌다."
    - 미라벨@화남: "아, 아니야. 두 번 만이지. 첫 번째는 망했잖아. 나는 첫 번째에 했어."
    - 미라벨: "아버지한테 배울 때 나는 일곱 살이었으니까, 그것도 당연한 거고."
    - when: "rival.mirabel"
      나레이션: "라이벌에게 비전을 가르쳐 주는 라이벌. 미라벨도 그 모순을 아는지 귀 끝이 빨갰다."
    - "미라벨이 문 쪽으로 걸어가다 멈췄다. 돌아보지 않고 말했다."
    - 미라벨@화남: "아델하이트 비전이야. 바깥에 소문내면 죽인다."
    - 미라벨: "…그리고 다음 실기에서 그걸로 날 이기려고 하면, 두 배로 죽일 거야."
    - 시스템: "기술 습득 — 영창 분할 (전투: 마나 2로 쓰는 마법)"
    - 속마음: "(가문의 비전을, 가문 밖의 사람에게. 미라벨에게 그게 얼마나 무거운 일인지 안다.)"
  effects: ["skill.영창분할 = 1", "affinity.mirabel += 5", "trust.mirabel += 5"]

- id: bond_mirabel_3
  title: 미라벨 — 문장 반지
  art: cg_mirabel_ring
  on: [도서관, 마법실습]
  priority: 2
  when: "time.year == 1 and affinity.mirabel >= 35 and fired.bond_mirabel_2"
  lines:
    - "노을 지는 도서관. 창가 자리에 비스듬한 빛이 길게 들어와 있다."
    - "미라벨이 그 빛 속에 앉아 있었다. 책은 펼쳐 놓았지만, 읽고 있지 않다."
    - "맞은편에 앉자 미라벨이 펜을 굴리던 손을 멈췄다. 오늘은 '뭘 봐'가 없다."
    - 미라벨: "…왔네."
    - "잠깐의 침묵. 미라벨이 무언가를 결심하는 얼굴로 숨을 들이쉬었다."
    - "미라벨이 목에 건 가는 은줄을 끌어냈다. 옷깃 안에 숨겨 두었던 것."
    - "끝에 반지 하나가 매달려 있다. 가문 문장이 새겨진 인장 반지. 문장 한가운데로 금이 가 있다."
    - "노을빛이 그 금을 따라 붉게 흘렀다."
    - 미라벨: "아델하이트 당주의 반지야. 원래는 아버지 손가락에 있어야 하는 거."
    - 미라벨@슬픔: "그날 밤, 아버지가 이걸 쥐여 줬어."
    - 미라벨: "자다가 깼어. 아버지가 내 방에 들어와 있었어. 잠옷 차림 그대로, 맨발로."
    - 미라벨: "아무 말도 없이 이걸 내 손에 쥐여 주고는, 옷장에 들어가 있으라고 했어. 무슨 소리가 나도 나오지 말라고."
    - "미라벨의 엄지가 반지의 금을 쓸었다. 몇 번이나 그렇게 쓸었는지, 금 가장자리가 반들반들하다."
    - 미라벨: "그 직후였어. 검은 로브를 입은 사람들이 들이닥친 게."
    - 미라벨: "옷장 문틈으로 봤어. 열 명쯤. 아무도 말을 안 했어. 발소리도 거의 없었어."
    - 미라벨: "황실 기사단이 온 건 다음 날 아침이야. 반역 혐의로 아버지를 잡으러."
    - 미라벨@진지: "근데 이상하지. 기사단이 왔을 땐 집이 이미 다 뒤집혀 있었어. 아버지 서재부터."
    - 미라벨: "아무도 내 말을 안 믿었어. 검은 로브는 기록에 한 줄도 안 남았어. 겁먹은 애가 헛것을 봤다고."
    - "미라벨이 반지를 쥔 손에 힘을 줬다. 손가락 마디가 하얗다."
    - 미라벨: "로브 등에는 이상한 문양이 있었어."
    - "미라벨이 펜을 집어 책 여백에 무언가를 그렸다. 펜촉이 몇 번 멈칫했다."
    - 미라벨: "원 안에… 뒤집힌 눈 같은 거. 이렇게."
    - "종이 위의 문양을 보는 순간, 등줄기가 서늘해졌다."
    - 속마음: "(이 문양을 모를 리 없다. 원작 후반 내내 화면 구석에 박혀 있던 그것. 심연교단.)"
    - when: "fs.F03.noticed"
      속마음: "(그리고 미궁 3층, 횃불 아래 벽면에서도 봤다. 불과 얼마 전에.)"
    - 속마음: "(아델하이트를 무너뜨린 게 교단이었다는 건, 원작에선 3학년 마탑 사건에서야 밝혀진다.)"
    - 미라벨: "이 그림, 아무한테도 보여 준 적 없어. 보여 줘 봤자 또 헛것이라고 할 테니까."
    - 미라벨@슬픔: "가끔은 나도 헛것이었나 싶어. 어린애가 옷장 안에서 무서워서 본 꿈."
    - 미라벨: "근데 이 금은 꿈이 아니잖아."
    - "미라벨이 반지를 들어 노을에 비췄다. 금 사이로 붉은빛이 새어 나왔다."
    - 속마음: "(문장 반지. 미라벨 구원 루트의 필수 유물. 그게 지금 내 눈앞에서 흔들리고 있다.)"
    - 속마음: "(무엇을, 어디까지 말해야 할까.)"
  plants:
    - { id: F21, notice: { value: "stat.지성 + 10 * fs.F03.noticed", dc: 20 } }
  choices:
    - text: "\"그 문양, 미궁 3층 벽에서 봤어\""
      when: "fs.F03.noticed or know.cult_early"
      effects: ["mirabel.clue = 1", "trust.mirabel += 12", "affinity.mirabel += 5"]
      lines:
        - 나: "그 문양. 미궁 3층 벽에서 봤어."
        - 미라벨@놀람: "……뭐?"
        - "미라벨의 손에서 반지가 미끄러졌다. 은줄에 걸려 가슴께에서 흔들렸다."
        - "미라벨의 얼굴에서 핏기가 가셨다. 그리고 천천히, 눈빛이 날카로워졌다."
        - 미라벨: "미궁 실습 때? 3층 어디? 정확히."
        - 나: "횃불 아래 벽면. 안쪽 통로로 꺾이는 데."
        - when: "talent.완전기억"
          나: "왼쪽에서 세 번째 횃불. 바닥에서 허리 높이. 원 지름은 손바닥 두 개쯤."
        - when: "talent.완전기억"
          미라벨@놀람: "…그걸 다 기억해? 너 대체 머리가 어떻게 생겨 먹은 거야."
        - "미라벨이 여백에 그린 문양을 오래 내려다봤다. 펜을 쥔 손이 떨리다가, 멈췄다."
        - 미라벨@진지: "아카데미 안에 그놈들이 있다는 거네."
        - 미라벨: "헛것이 아니었어. 3년 동안… 아무도 안 믿어 줬는데."
        - 미라벨: "고마워. 정말로."
        - "미라벨이 반지를 다시 옷깃 안에 넣었다. 심장 바로 위에."
        - 속마음: "(원작에서 미라벨은 4학년에야 이걸 알고, 혼자 쫓다가 사라진다. 이번엔 다르다.)"
        - 속마음: "(…다르게 만들어야 한다. 알려 준 이상, 이 아이가 혼자 뛰어들지 않게.)"
    - text: "\"같이 찾아보자\""
      check:
        type: 설득
        dc: 쉬움
        mods:
          - { when: "trust.mirabel >= 20", value: 2, label: 쌓인 신뢰 }
          - { when: "rival.mirabel", value: 2, label: 라이벌의 인정 }
      lines:
        - 나: "같이 찾아보자. 그 로브."
        - 미라벨@놀람: "…같이?"
        - 미라벨: "위험할 수도 있어. 기사단도 못 찾은 사람들이야. 아니, 안 찾은 건지도 모르고."
        - 나: "그러니까 둘이 낫지."
      success:
        effects: ["affinity.mirabel += 8", "trust.mirabel += 6", "mirabel.ally = 1"]
        lines:
          - "미라벨이 입을 열었다가 닫았다. 반지를 쥔 손이 천천히 풀렸다."
          - 미라벨@웃음: "…혼자 하려고 했는데."
          - 미라벨: "그래. 둘이 낫겠지. 하나는 망보고, 하나는 뒤지고."
          - 미라벨@당황: "망은 네가 봐. 머리 쓰는 건 내가 할 테니까. …불만 있어?"
          - "불만은 없었다. 미라벨이 웃는 걸 이렇게 가까이서 본 건 처음이었으니까."
          - 속마음: "(혼자 쫓다 사라지는 아이. 그 '혼자'를 지금 하나 지웠다.)"
      fail:
        effects: ["affinity.mirabel += 4", "trust.mirabel += 4", "mirabel.ally = 1"]
        lines:
          - "미라벨이 입을 열었다가 닫았다. 반지를 쥔 손이 풀리지 않았다."
          - 미라벨@진지: "…둘이 낫다는 건 알아. 계산은 나도 할 줄 알아."
          - 미라벨: "근데 그 계산에, 네가 다치는 경우는 안 들어 있잖아."
          - "미라벨이 반지를 옷깃 안으로 밀어 넣었다. 문을 닫듯이."
          - 나: "그럼 그 경우까지 넣어서 다시 계산해."
          - 미라벨@당황: "…말은 잘해."
          - "한참 침묵이 흘렀다. 창밖에서 저녁 종이 울렸다."
          - 미라벨: "좋아. 대신 조건이 있어. 뭘 찾든 나한테 먼저 말할 것. 혼자 움직이지 말 것."
          - 미라벨@화남: "…그건 내가 할 소리 아니냐고? 시끄러워."
          - 속마음: "(반쯤 허락받았다. 미라벨에게 '반쯤'은 대체로 전부라는 뜻이다.)"
    - text: 아는 걸 말하지 않는다 (지금은 이르다)
      check:
        type: 기만
        dc: 보통
        mods:
          - { when: "fs.F03.noticed", value: -2, label: 생생한 기억 }
          - { when: "origin == '악역도련님'", value: 2, label: 도련님의 가면 }
      lines:
        - 속마음: "(지금 말하면 미라벨은 혼자 미궁으로 뛰어들 것이다.)"
        - 속마음: "(내일 아침, 아니 오늘 밤에라도. 이 아이는 그런 사람이다.)"
        - "입 안까지 올라온 말을 삼켰다. 대신 여백의 문양을 오래 눈에 새겼다."
        - 나: "…잘 기억해 둘게. 그 문양."
      success:
        effects: ["trust.mirabel += 2"]
        lines:
          - "미라벨은 내 얼굴을 한참 보다가, 반지를 다시 옷깃 안에 넣었다."
          - 미라벨@슬픔: "…들어 줘서 고마워. 이거 아무한테도 말한 적 없어."
          - 미라벨: "헛것이라고 안 해서, 고마워."
          - "그 말이 가슴에 걸렸다. 나는 그게 헛것이 아니라는 걸 아는 사람이다. 그리고 말하지 않았다."
          - 속마음: "(언젠가 말해야 한다. 이 아이가 혼자 뛰어들지 않을 만큼 단단해졌을 때. 그때가 너무 늦지 않기를.)"
      fail:
        effects: ["trust.mirabel -= 1", "stress += 3"]
        lines:
          - "미라벨의 눈이 가늘어졌다."
          - 미라벨: "…방금 뭐 삼켰어."
          - 나: "뭐?"
          - 미라벨@진지: "문양 보는 순간 네 얼굴. 처음 보는 사람 얼굴이 아니었어."
          - "심장이 한 번 크게 뛰었다. 표정을 고르는 데 반 박자 늦었다."
          - 나: "…무서운 그림이라서 그래."
          - "미라벨이 내 얼굴을 뜯어봤다. 거짓말을 찾는 눈. 찾은 것 같기도, 못 찾은 것 같기도 한."
          - 미라벨: "좋아. 지금은 안 물을게."
          - 미라벨@화남: "근데 기억해. 아델하이트는 빚을 잊지 않아. 숨긴 것도."
          - "미라벨이 반지를 옷깃 안에 넣었다. 그날은 미라벨이 먼저 자리를 떴다."
          - 속마음: "(반쯤 들켰다. 이 아이 앞에선 3,000시간짜리 포커페이스도 소용이 없다.)"
          - 속마음: "(언젠가 말해야 한다. 그때 이 의심이 신뢰로 바뀌어 있기를.)"
