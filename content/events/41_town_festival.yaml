            - 나레이션:
                - "── 희한하네. 그림자가 둘이야. 하나는 이 몸 것, 하나는… 아주 먼 데서 왔구먼."
                - { when: "talent.몸주인의잔재", text: "── 희한하네. 그림자가 둘이야. 먼 데서 온 그림자랑, 원래 있던 그림자. 원래 있던 쪽이 자네를 보고 있구먼. 기다렸다는 얼굴로." }
            - "── 열 번째 겨울에 큰불이 보여. 그런데… 이상하지. 이 패는 처음부터 다시 섞여 있어. 누가 몇 번이고 다시 섞은 것처럼."
            - 속마음: "(그리고 세계는, 다시 처음으로. ……시장 점쟁이 대사로는 너무 정확하잖아.)"
          effects: ["money -= 3", "stat.의지 += 0.5", "stress += 3"]
    - text: 사양한다
      effects: ["stress -= 3"]
      lines: ["── 앞날이 무서운 게지. 현명해. 노파가 낄낄 웃으며 카드를 섞었다. 몇 번이고, 몇 번이고."]

- id: town_lostchild
  title: 길 잃은 아이
  on: 도시외출
  pool: true
  lines:
    - "생선 좌판 옆에서 다섯 살쯤 된 여자아이가 울고 있다. 엄마를 부르는데, 시장이 너무 시끄러워 아무도 못 듣는다."
  choices:
    - text: 쪼그려 앉아 달랜다 (매력)
      check: { label: 달래기, value: "stat.매력 + 12 * talent.사람좋은얼굴 + 8 * talent.미모 - 15 * talent.혐오스러운분위기 + luck", dc: 24 }
      success:
        lines:
          - 나레이션:
              - "눈높이를 맞추고 이름을 물었다. 아이가 훌쩍이며 대답했다. 빵집 딸 루시. 엄마는 빵을 판다."
              - { when: "talent.자연친화력", text: "눈높이를 맞추자 비둘기 한 마리가 내 머리 위에 내려앉았다. 아이가 울다 말고 깔깔 웃었다. 빵집 딸 루시라고 했다." }
          - "손을 잡고 빵집 수레를 찾아갔다. 아이 엄마가 달려와 아이를 끌어안고, 내 품에 갓 구운 빵을 한 아름 안겼다."
        effects: ["stress -= 10", "reputation += 2", "fatigue -= 5"]
      fail:
        lines:
          - 나레이션:
              - "말을 걸자 아이가 더 크게 울었다. 지나가던 사람들이 나를 수상하게 쳐다본다."
              - { when: "talent.혐오스러운분위기", text: "눈이 마주치자 아이가 울음을 뚝 그쳤다. 너무 무서워서. 그리고 세 배로 울었다." }
          - "결국 경비병이 와서 아이를 데려갔다. 경비병이 가기 전에 나를 한참 위아래로 훑어봤다."
        effects: ["stress += 5"]
    - text: 아이를 번쩍 들어 어깨에 태운다 (근력)
      requires: "stat.근력 >= 15 or talent.거구"
      effects: ["stress -= 10", "stat.매력 += 0.5", "reputation += 2"]
      lines:
        - "아이를 번쩍 들어 어깨에 태웠다. 울음이 뚝 그쳤다."
        - "높은 데서 두리번거리던 아이가 소리쳤다. ── 엄마! 저기 엄마!"
        - "빵 수레 쪽에서 여자가 달려왔다. 아이는 내려오기 싫다고 내 머리카락을 꽉 쥐고 버텼다."
    - text: 경비대 초소에 데려다준다
      effects: ["stress -= 3"]
      lines: ["경비대 초소에 아이를 맡겼다. 경비병이 고개를 끄덕였다. 오늘만 세 번째라고 했다."]

# ================================================================ 출신별 과거
# ---------------------------------------------------------------- 평민 장학생
- id: home_commoner_letter
  title: 빵집에서 온 편지
  art: dorm_room
  on: auto
  free: true
  window: "1.4"
  chance: 0.25
  when: "origin == '평민장학생'"
  lines:
    - "기숙사 우편함에 두툼한 편지가 꽂혀 있다. 이 몸의 어머니다. 봉투에서 밀가루 냄새가 난다."
    - "── 밥은 잘 먹고 다니니. 빵집은 그럭저럭이다. 미나가 매일 저녁 다락방 창에서 아카데미 첨탑 쪽으로 손을 흔든단다. 그러면 너한테 닿는다고."
    - "── 장학금은 성적이 떨어지면 끊긴다고 들었다. 무리하지는 말고, 그래도 떨어지지는 말고."
    - "── 그런데 얘야. 지난번 편지 글씨가 좀 달라졌더구나. 바빠서 그런 거지?"
    - 속마음: "(…이 몸의 글씨체까지는 흉내 내지 못했다.)"
    - when: "talent.몸주인의잔재"
      나레이션: "편지를 쥔 손가락이 저절로 떨렸다. 이 몸이 기억하는 새벽 빵 굽는 냄새가 코끝을 스쳤다."
  choices:
    - text: 용돈을 아껴 편지에 동봉한다 (은화 10)
      requires: "money >= 10"
      effects: ["money -= 10", "stress -= 10", "home.sent = 1"]
      lines: ["은화 열 닢을 편지지에 싸 넣었다. 미나에게 사탕이라도 사 주라고 적었다."]
    - text: 옛 편지를 보며 이 몸의 글씨로 긴 답장을 쓴다
      effects: ["stress -= 5", "stat.지성 += 0.5"]
      lines: ["서랍 속 옛 편지를 펴 놓고 이 몸의 글씨를 따라 썼다. 획 하나하나가 남의 이름을 빌려 쓰는 것 같았다."]
    - text: 바쁘다고 짧게 쓴다
      effects: ["stress += 3"]
      lines: ["'잘 지내요. 바빠요.' 두 줄을 쓰고 봉투를 닫았다. 미안한 마음은 봉투에 넣지 못했다."]

- id: home_commoner_father
  title: 시장의 아버지
  on: 도시외출
  priority: 1
  window: { from: "1.5.4", to: "1.7.2" }
  when: "origin == '평민장학생'"
  lines:
    - "시장 입구에서 밀가루 포대를 수레에 싣던 사내가 허리를 펴다 나를 발견했다. 이 몸의 아버지다."
    - "── 어이구, 우리 장학생! 얼굴이 반쪽이 됐네."
    - 나레이션:
        - "아버지는 손을 바지에 닦고 내 어깨를 두드렸다. 밀가루가 하얗게 묻었다."
        - { when: "exam.rank == 'top'", text: "── 게시판 소문 들었다. 상위권이라며? 빵집 손님들한테 벌써 다 자랑했다. 아버지는 손을 바지에 닦고 내 어깨를 두드렸다." }
        - { when: "exam.rank == 'low'", text: "아버지는 성적 얘기를 꺼내지 않았다. 대신 어깨를 두드리는 손이 조금 더 오래 머물렀다." }
  branch:
    - when: "home.sent"
      lines:
        - "── 그리고 이거. 네 엄마가 돌려주란다. 보내 준 은화. 미나 사탕은 엄마가 사 줬으니까, 이건 네 밥값이래."
      effects: ["money += 10"]
  choices:
    - text: 아버지와 국밥을 먹는다
      effects: ["stress -= 15", "stat.의지 += 1", "fatigue -= 5"]
      lines:
        - "시장 골목 국밥집. 아버지는 자기 그릇의 고기를 전부 내 그릇으로 옮겼다."
        - "── 너 어릴 때 왼손으로 숟가락 쥐다 엄마한테 혼났던 거 기억나냐. 요샌 오른손으로 잘 먹네."
        - 속마음: "(이 몸은 왼손잡이였다.)"
        - "아버지는 더 묻지 않았다. 국밥이 식을 때까지 빵집 얘기만 했다."
    - text: 수레에 밀가루 포대를 같이 싣는다
      effects: ["stat.근력 += 1", "stress -= 8", "fatigue += 5"]
      lines:
        - "포대 열두 개를 같이 실었다. 아버지가 허리를 두드리며 웃었다."
        - "── 아카데미가 사람을 만드는구나. 작년엔 포대 하나 들다 주저앉던 놈이."
    - text: 바쁘다고 둘러대고 자리를 뜬다
      effects: ["stress += 5"]
      lines: ["── 그래, 그래. 바쁘지. 아버지는 웃으며 손을 흔들었다. 모퉁이를 돌 때까지 그 손이 내려가지 않았다."]

# ---------------------------------------------------------------- 몰락 귀족 3남
- id: home_noble_collector
  title: 채권자의 대리인
  on: 도시외출
  priority: 1
  window: { from: "1.4", to: "1.7" }
  when: "origin == '몰락귀족' and debt > 0"
  lines:
    - "시장 한복판에서 누군가 내 이름 앞에 가문 이름을 붙여 불렀다. 요즘은 아무도 그렇게 부르지 않는데."
    - "검은 정장, 반질반질한 장부. 제국 상업 은행의 채권 대리인이다."
    - "── 도련님. 가문 채무 건으로 왔습니다. 남은 원금이 은화 {{debt}}닢, 이자는 지난달부터 두 배로 붙고 있지요."
    - "── 큰형님은 장벽에, 둘째 형님은 행방이 묘연하시고. 서명하실 분이 도련님밖에 안 남았더군요."
    - when: "talent.몸주인의잔재"
      나레이션: "장부를 보자 이 몸의 위장이 꼬였다. 이 사람 얼굴을 기억하는 몸이다."
  choices:
    - text: 계약서 조항을 따진다 (지성·매력)
      check: { label: 채무 협상, value: "stat.지성 + stat.매력 / 2 + 10 * talent.귀공자의품격 + 8 * talent.달변 + luck", dc: 32 }
      success:
        lines:
          - "계약서 조항을 하나하나 짚었다. 이자율 변경에는 채무자 서명이 필요하다고 적혀 있다. 아무도 서명한 적이 없다."
          - "── …법학 공부를 하셨군요. 좋습니다. 이자는 원래대로, 원금 일부는 졸업 후 상환으로 미뤄 드리지요."
          - 속마음: "(3,000시간 중에 경제 이벤트 텍스트만 몇 시간을 읽었다. 이런 데서 쓸 줄이야.)"
        effects: ["debt -= 30", "stress -= 10", "stat.지성 += 0.5"]
      fail:
        lines:
          - "── 도련님, 법은 돈 있는 쪽 편입니다. 다음 달에 다시 뵙지요. 그때는 이자가 조금 더 붙어 있을 겁니다."
        effects: ["debt += 10", "stress += 10"]
    - text: 가진 돈으로 일부를 갚는다 (은화 20)
      requires: "money >= 20"
      effects: ["money -= 20", "debt -= 30", "stress -= 5"]
      lines: ["── 성의는 확인했습니다. 이자분은 이걸로 덮어 드리지요. 대리인이 장부에 줄 하나를 그었다."]
    - text: 인파 속으로 도망친다
      effects: ["stress += 5", "stat.민첩 += 0.5"]
      lines:
        - "대답 대신 생선 수레 뒤로 뛰었다. 대리인은 뛰지 않았다. 뛰지 않아도 된다는 듯이."
        - "── 은행은 기다릴 줄 압니다, 도련님!"

- id: home_noble_brother
  title: 장벽에서 온 편지
  art: dorm_room
  on: auto
  free: true
  window: { from: "1.5", to: "1.6" }
  chance: 0.15
  when: "origin == '몰락귀족'"
  lines:
    - "잿빛 장벽 수비대 인장이 찍힌 편지. 큰형이다. 글씨가 군인답게 각져 있다."
    - "── 막내 보아라. 아카데미는 버틸 만하냐. 가문 이름 따윈 신경 쓰지 마라. 그건 이미 은행 장부 속에나 있다."
    - "── 여기는 밤마다 결계가 운다. 늙은 병사들은 바람 소리라는데, 바람은 저렇게 박자를 맞춰 울지 않는다."
    - "── 둘째 소식은 나도 모른다. 혹시 도시에서 보거든, 형이 화 안 났다고 전해라."
    - 나레이션:
        - "── 살아남는 법을 배워라. 검이든 마법이든 도망이든. 그게 우리 가문에 남은 유일한 가훈이다."
        - { when: "debt <= 0", text: "── 살아남는 법을 배워라. 그리고 빚을 정리했다는 소식은 들었다. 네가? 아버지가 편지를 들고 한참 우셨다. …잘했다, 막내." }
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(5년차 잿빛 장벽 대전투. 원작에서 이름 없는 귀족 장교들이 무더기로 쓰러지는 전투다. 이름 없는… 형도 거기 있을까.)"
  choices:
    - text: "\"형도 살아남아\"라고만 답장을 쓴다"
      effects: ["stress -= 10", "stat.의지 += 1"]
      lines: ["짧게 썼다. 형이 좋아할 말은 그것뿐이라는 걸, 이 몸은 알고 있었다."]
    - text: 결계가 운다는 이야기를 자세히 묻는다
      effects: ["stat.지성 += 1", "stress += 3"]
      lines:
        - "답장에 질문을 빼곡히 적었다. 언제부터, 하룻밤에 몇 번, 어떤 박자로."
        - 속마음: "(원작의 장벽은 9년차에 무너진다. 그런데 벌써 우는 소리가 난다면… 봉인은 생각보다 오래전부터 삐걱대고 있었던 거다.)"

# ---------------------------------------------------------------- 악역 도련님 (에드릭 벨모어)
- id: home_villain_maid
  title: 벨모어가의 바구니
  art: dorm_hall
  on: auto
  free: true
  window: "1.4"
  chance: 0.25
  when: "origin == '악역도련님'"
  lines:
    - "기숙사 현관에 벨모어가 하녀복을 입은 소녀가 바구니를 안고 서 있다. 열다섯쯤 됐을까."
    - "소녀의 왼쪽 손목에 누렇게 바랜 멍 자국이 있다."
    - 속마음: "(원작의 에드릭이 비튼 손목이다. 1권 회상 장면에 딱 한 컷 나왔던.)"
  branch:
    - when: "servant.trust >= 2"
      lines:
        - "── 도련님! 집사님이 도시락 전해 드리래요. 요리장님이 도련님 좋아하시는 걸로…"
        - "소녀가 말을 하다 말고 얼굴을 붉혔다. 예전 같으면 상상도 못 했을 수다다."
        - "── 저택 사람들 요즘 도련님 얘기만 해요. 사람이 달라지셨다고."
    - when: "servant.trust >= 1"
      lines:
        - "── 집사님이… 전해 드리라고 하셨습니다."
        - "소녀는 바구니를 내밀고 고개를 숙인 채 한 걸음 물러섰다. 그래도 도망치지는 않았다."
    - lines:
        - "소녀는 바구니를 내밀다가 내 눈과 마주치자 바구니를 떨어뜨렸다. 사과가 계단을 굴러 내려갔다."
        - "── 죄, 죄송합니다! 죄송합니다, 도련님…!"
        - "소녀의 무릎이 꺾이려 한다. 맞을 준비를 하는 사람의 자세다."
  choices:
    - text: "\"손목은… 괜찮아?\""
      effects: ["servant.trust += 1", "stress -= 5", "edric.reformed += 1"]
      lines:
        - "소녀가 손목을 소매로 가리며 눈을 크게 떴다."
        - "── …네? 아, 네. 이제 안 아파요."
        - 나: "그때 일, 미안했어. 변명은 안 할게."
        - "소녀는 한참 대답하지 못했다."
      branch:
        - when: "servant.trust >= 2 and not servant.warning"
          lines:
            - "돌아서던 소녀가 멈칫하더니, 작은 목소리로 덧붙였다."
            - "── 집사님이요… 도련님이 혹시 이런 말씀을 하시면 꼭 전하라고 했어요. 미궁에 가시거든 3층 안쪽은 피하시래요. 요즘 흉한 소문이 돈대요."
            - 속마음: "(원작의 에드릭에게는 아무도 해 주지 않은 말이다.)"
          effects: ["servant.warning = 1"]
        - lines: ["돌아가는 길에 소녀는 두 번 돌아봤다."]
    - text: 고맙다고 하고 바구니를 받는다
      effects: ["servant.trust += 0.5"]
      lines: ["바구니를 받으며 고맙다고 했다. 소녀가 제 귀를 의심하는 얼굴로 인사하고 돌아갔다."]
    - text: 말없이 바구니만 받는다
      lines: ["소녀는 안도한 얼굴로 돌아갔다. 원작의 에드릭이 늘 그랬듯이."]

- id: home_villain_father
  title: 벨모어 백작의 마차
  art: academy_gate
  on: auto
  free: true
  window: { from: "1.5.3", to: "1.6.4" }
  chance: 0.2
  when: "origin == '악역도련님' and fired.y1_labyrinth and fate.edric != 'dead'"
  lines:
    - "정문 앞에 벨모어가 문장이 박힌 검은 마차가 섰다. 학생들이 수군대며 길을 비킨다."
    - "마차 창이 반만 내려갔다. 이 몸의 아버지, 벨모어 백작. 내리지는 않는다."
    - 나레이션:
        - "── 미궁에서 쓰러졌다고 들었다. 벨모어의 이름으로 그런 추태를."
        - { when: "fate.edric == 'alive'", text: "── 미궁 실습에서 혼자 멀쩡히 걸어 나왔다지. 남들이 쓰러질 때 서 있는 것. 그게 벨모어다." }
    - when: "fate.edric == 'alive_scarred'"
      나레이션: "가슴의 흉터가 당긴다. 백작의 시선이 잠깐 그 자리에 머물렀다가 비켜 갔다."
    - "── 그리고. 3층에서 무슨 목소리를 들었다는 얘기가 있던데."
    - "백작의 목소리가 아주 조금 낮아졌다."
    - "── 그 얘기는 아무한테도 하지 마라. 아무한테도."
    - 속마음: "(그날 통로 안쪽에서 나를 부르던 목소리. …이 몸이 기억한다. 5년 전에 죽은 어머니 목소리였다.)"
  plants:
    - { id: F22, notice: { value: "stat.지성 + 15 * talent.몸주인의잔재", dc: 20 } }
  choices:
    - text: "\"어머니 목소리였어요\""
      effects: ["stat.의지 += 1", "stress += 5"]
      lines:
        - "마차 안이 조용해졌다. 백작의 손이 지팡이 손잡이를 하얗게 쥐었다."
        - "── …네 어미는 봄 축제를 좋아했다. 내가 못 가게 했지. 천한 곳이라고."
        - "── 마부, 출발해."
        - "창이 올라갔다. 대답은 끝내 듣지 못했다. 하지만 대답이 없다는 것도 대답이었다."
    - text: "\"걱정해 주셔서 감사합니다, 아버지\""
      effects: ["stress -= 5"]
      lines:
        - 나레이션:
            - "백작이 처음으로 나를 똑바로 봤다. 원작의 에드릭이라면 대들거나 울었을 것이다."
            - { when: "edric.reformed >= 1", text: "백작이 처음으로 나를 똑바로 봤다. ─ 하인들이 편지를 쓰더군. 네가 사과를 하고 다닌다고. 원작의 에드릭이라면 평생 듣지 못했을 말이다." }
        - "── …몸조심해라. 벨모어의 이름은 지금 너 하나다."
    - text: 고개를 숙이고 침묵한다
      effects: ["stress += 8"]
      lines: ["마차는 대답을 기다리지 않고 떠났다. 원작의 에드릭은 어머니가 죽은 뒤로 5년 내내 이렇게 고개를 숙였을 것이다."]

# ---------------------------------------------------------------- 이름 없는 엑스트라
- id: home_extra_luggage
  title: 여관에서 온 짐
  art: dorm_room
  on: auto
  free: true
  window: { from: "1.3.2", to: "1.4.4" }
  chance: 0.15
  when: "origin == '엑스트라'"
  lines:
    - "기숙사로 작은 짐 꾸러미가 왔다. 입학 전에 묵었던 아카데미 앞 싸구려 여관에서 보낸 것이다."
    - "삐뚤빼뚤한 쪽지가 붙어 있다. ─ 손님 방 침대 밑에서 나왔수. 손님 물건 맞지?"
    - "꾸러미 안에는 낡은 털장갑 한 짝, 다 닳은 연필 세 자루, 그리고 손바닥만 한 찢어진 종잇조각."
    - "종잇조각에는 이 몸의 글씨로 반 줄이 적혀 있다. ── …열 번째 겨울이 오기 전에, 이번엔 반드시…"
    - "뒤는 찢겨 나갔다."
    - "쪽지 맨 아래에 여관 주인이 한 줄을 더 적어 놓았다. ─ 근데 손님, 입학 전날 밤에 밤새 누구랑 얘기하던데. 방엔 아무도 없었고. 괜찮수?"
  plants:
    - { id: F14, notice: { value: "stat.지성 + 15 * talent.몸주인의잔재 + 10 * item.일기장", dc: 22 } }
  choices:
    - text: 종잇조각을 일기장의 찢긴 자리에 대 본다
      when: "item.일기장"
      effects: ["stat.지성 += 1"]
      lines:
        - "일기장 마지막 장의 찢긴 자국에 종잇조각을 대 봤다. 결이 맞지 않는다. 같은 장이 아니다."
        - 속마음: "(그럼 이 몸의 주인이 찢어 낸 장은… 하나가 아니었다.)"
    - text: 털장갑을 껴 본다
      effects: ["stress -= 5"]
      lines:
        - "작은 장갑이다. 손가락 끝이 몇 번이나 기워져 있다. 누군가 이 몸에게 떠 준 장갑."
        - when: "talent.몸주인의잔재"
          나레이션: "장갑을 끼자 이유 없이 눈물이 났다. 이 몸은 이걸 떠 준 사람을 기억한다. 나는 모른다."
        - 속마음: "(엑스트라에게도 장갑을 떠 준 누군가가 있었다. 원작은 그걸 한 번도 보여 준 적이 없다.)"
    - text: 전부 트렁크 깊숙이 넣어 둔다
      effects: ["stress += 3"]
      lines: ["트렁크를 닫았다. 종잇조각의 반 줄이 눈꺼풀 안쪽에 남았다."]

- id: home_extra_rollcall
  title: 출석부의 물음표
  art: classroom
  on: auto
  free: true
  window: { from: "1.5", to: "1.6" }
  slots: [방과후]
  chance: 0.3
  when: "origin == '엑스트라'"
  lines:
    - "검술 수업 출석 확인. 교관 조수가 이름을 부르다 내 차례에서 멈췄다."
    - "── 어… 이건 누구지? 이런 학생 있었나?"
    - 나레이션:
        - "교실 여기저기서 고개를 갸웃한다. 몇 달째 같은 교실을 쓰는데, 아무도 내 이름을 모른다."
        - { when: "reputation >= 15", text: "교실 여기저기서 고개를 갸웃하다가, 누군가 말했다. ─ 걔잖아, 요즘 여기저기서 이름 들리는. 조수가 그제야 출석부에 동그라미를 쳤다." }
    - 속마음: "(이름 없는 엑스트라. 원작에서 이 몸은 대사 한 줄 없이 배경에 서 있다가 사라지는 '학생 C'였다.)"
  choices:
    - text: 손을 들고 이름을 또박또박 말한다
      effects: ["reputation += 3", "stat.매력 += 0.5"]
      lines:
        - 나: "{{player.name}}입니다. D반."
        - "조수가 출석부에 이름을 고쳐 적었다. 맨 뒷자리 몇 명이 내 이름을 따라 중얼거렸다."
        - 속마음: "(배경에서 한 발짝. 원작은 이런 걸 '이탈'이라고 부르겠지.)"
    - text: 그냥 두기로 한다
      effects: ["stat.지성 += 0.5", "stress -= 3"]
      lines:
        - "조수는 고개를 갸웃하다가 출석부에 '?'를 그리고 넘어갔다."
        - 속마음: "(보이지 않는다는 건, 아무도 막지 않는다는 뜻이다. 엑스트라의 특권이지.)"

# ---------------------------------------------------------------- 숲 출신 고아
- id: home_forest_owl
  title: 창틀의 부엉이
  art: dorm_room
  on: auto
  free: true
  window: "1.4"
  chance: 0.25
  when: "origin == '숲고아'"
  lines:
    - "기숙사 창틀에 부엉이 한 마리가 앉아 있다. 왼쪽 깃털 끝이 하얗다. 이 몸이 '옹이'라고 부르던 녀석이다."
    - "부엉이 발목에 끈 뭉치가 묶여 있다. 글이 아니라 매듭이다. 숲지기 할멈은 글을 모른다."
    - "머리가 읽기 전에 손가락이 먼저 매듭을 읽었다. 이 몸의 손가락이."
    - "── 밥 먹어라. 사람 많은 데선 등을 벽에 대고 자라. 봄 숲 가장자리 나무들이 속부터 마른다. 신경 쓰지 말고 공부나 해라."
    - when: "affinity.bruno >= 5"
      나레이션: "뒤에서 브루노가 비명을 질렀다. ─ 부, 부엉이! 방에 부엉이! 옹이가 날아올라 브루노 머리 위에 앉았다. 브루노가 그대로 굳었다."
  choices:
    - text: 매듭으로 답장을 엮는다
      effects: ["stress -= 10", "stat.의지 += 0.5"]
      lines:
        - "끈을 엮었다. 잘 지낸다, 밥 먹는다, 친구가 생겼다. 손가락이 알아서 움직였다."
        - "옹이가 답장을 발목에 매달고 숲 쪽으로 날아갔다. 날갯소리가 하나도 나지 않았다."
    - text: "'나무가 속부터 마른다'는 매듭을 다시 짚어 본다"
      effects: ["stat.지성 += 1"]
      lines:
        - 나레이션:
            - "같은 매듭을 몇 번이고 다시 짚었다. 할멈이 굳이 적어 보낸 건, 신경이 쓰인다는 뜻이다."
            - { when: "perk.고인물의기억 or perk.공략위키편집자", text: "같은 매듭을 몇 번이고 다시 짚었다. 세계수 고사는 원작에서 4년차부터다. 그런데 숲 가장자리는 벌써 마르고 있다." }
        - 속마음: "(1학년 봄에 마르는 숲 같은 건 원작에 없었다. …아니면 원작은 숲 가장자리까지는 보여 주지 않았던 걸까.)"

- id: home_forest_trail
  title: 몸이 기억하는 숲길
  art: forest
  on: 산책
  priority: 1
  window: { from: "1.5", to: "1.7" }
  when: "origin == '숲고아'"
  lines:
    - "뒷산 깊숙이 들어갔다. 발이 저절로 낙엽이 덜 쌓인 쪽을 고른다. 짐승 길이다."
    - "나는 3,000시간 동안 모니터 앞에 앉아 있었는데, 이 몸의 다리는 바람 냄새로 방향을 안다."
    - "덤불에 피 묻은 털 한 줌. 작은 짐승이 다친 채 이쪽으로 간 흔적이다."
  check: { label: 흔적 추적, value: "stat.민첩 + stat.지성 / 2 + 10 * talent.자연친화력 + 10 * talent.짐승의혈통 + luck", dc: 28 }
  success:
    lines:
      - "쓰러진 고목 아래, 사냥꾼 덫에 다리가 걸린 여우 새끼가 이빨을 드러낸다."
      - "할멈이 가르쳐 준 대로 낮게 휘파람을 불었다. 여우가 이빨을 거뒀다. 덫을 풀어 주자 절뚝이며 덤불로 사라졌다."
      - "이 휘파람을 어디서 배웠는지, 나는 모른다. 입술이 기억하고 있었다."
    effects: ["stat.민첩 += 1", "stress -= 10"]
  fail:
    lines:
      - "흔적은 개울에서 끊겼다. 몸은 기억하는데, 머리가 따라가지 못했다."
      - "돌아오는 길에 길을 잃을 뻔했다. 숲 출신 체면이 말이 아니다."
    effects: ["fatigue += 10"]
  branch:
    - when: "affinity.liana >= 15"
      art: cg_liana_forest
      lines:
        - "숲 입구에서 리아나와 마주쳤다. 리아나가 내 소매에 붙은 여우 털을 떼어 냈다."
        - 리아나: "너한테서 우리 마을 숲 냄새가 나. …이상하지. 너랑 있으면 고향에 온 것 같아."
      effects: ["affinity.liana += 4"]

# ================================================================ 고인물의 기억
- id: vet_arena
  title: 고인물의 기억 — 경기장
  art: arena
  on: 훈련장
  priority: 1
  window: { from: "1.6.3", to: "1.7.1" }
  lines:
    - "훈련장 너머 원형 경기장에 무투대회 깃발이 올라가고 있다. 인부들이 관중석 나무판을 새로 깐다."
    - "관중석 계단 셋째 칸이 삐걱거렸다. 그 소리에 머릿속에서 무언가가 딸깍 켜졌다."
    - 속마음: "(이 구도. 원작 무투대회 결승 배경 그대로다. 관중석 셋째 칸, 깃발 일곱 개, 왼쪽 위 금 간 석상.)"
    - 속마음: "(처음 결승에 갔을 때 저 석상 디테일을 구경하다가 카이든의 강타에 맞아 죽었지. 그 뒤로 그 패턴을 수백 번 봤다.)"
  branch:
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      lines:
        - 속마음: "(공격, 공격, 강타, 방어. 강타 직전엔 왼쪽 어깨가 먼저 올라간다. 위키에 '어깨 보고 방어'라고 처음 적은 것도 나였다.)"
        - 시스템: "기억 정리 — 카이든의 강타 예비 동작"
      effects: ["know.kaiden_shoulder = 1", "stat.지성 += 0.5"]
    - check: { label: 기억 더듬기, value: "stat.지성 + 10 * talent.완전기억 - 10 * talent.망각증 + luck", dc: 26 }
      success:
        lines:
          - 속마음: "(…그래, 어깨다. 강타 직전에 왼쪽 어깨가 먼저 올라간다. 그걸 보고 막아야 했어.)"
          - 시스템: "기억 정리 — 카이든의 강타 예비 동작"
        effects: ["know.kaiden_shoulder = 1"]
      fail:
        lines:
          - 속마음: "(공격, 강타, 그다음이 뭐였더라. 3,000시간을 했는데 기억이 안 난다. 이 몸의 머리가 내 기억을 다 담지 못하는 건가.)"
        effects: ["stress += 5"]

- id: vet_wiki_elvera
  title: 고인물의 기억 — 편집 전쟁
  on: 마법실습
  priority: 1
  when: "fs.F11.noticed and time.month >= 4"
  lines:
    - "엘베라 교수가 칠판에 봉인의 역사를 적는다. '마왕 이그니스' ─ 분필이 그 이름 앞에서 아주 잠깐 멈춘다."
    - 속마음: "(첫 수업 때도 그랬다. '이그니스… 님'.)"
    - 속마음: "(위키 '엘베라' 문서 토론 탭, 편집 이력 412개. 한쪽은 '번역 오류다', 한쪽은 '의도된 복선이다'. 나는 후자였다.)"
    - 속마음: "(결국 관리자가 문서를 잠갔다. 마지막 편집 요약은 이랬다. ─ 「제작진 답변 없음. 영원히 없을 듯.」)"
    - when: "perk.공략위키편집자"
      속마음: "(그 관리자가 나였지.)"
  choices:
    - text: 수업이 끝나고 봉인의 역사에 대해 질문한다
      effects: ["affinity.elvera += 4", "stat.지성 += 0.5"]
      lines:
        - 엘베라: "봉인의 역사? 좋은 질문이에요. 교과서엔 '용사가 마왕을 봉인했다', 한 줄이죠."
        - 엘베라@진지: "하지만 학생. 역사는 이긴 쪽이 쓰고, 오래 산 쪽이 고쳐 써요. 둘 다 너무 믿지는 마세요."
        - "엘베라는 웃으며 책을 덮었다. 그 웃음 끝이 조금 쓸쓸했다."
    - text: "노트 귀퉁이에 적는다 — '오역 아님. 직접 확인.'"
      effects: ["stat.지성 += 1"]
      lines:
        - "노트에 작게 적었다. 413번째 편집. 이번엔 아무도 되돌리지 못한다."
        - 속마음: "(3,000시간 만에 처음으로, 출처가 '직접 확인'인 정보다.)"

- id: vet_speedrun
  title: 고인물의 기억 — 최적 동선
  on: 식당
  priority: 1
  when: "perk.최적동선 or perk.공략위키편집자"
  lines:
    - "점심시간 식당. 배식 줄이 입구까지 늘어섰다."
    - 속마음: "(원작 any% 스피드런 루트. 식당 줄은 배식대 왼쪽 기둥과 세 번째 식탁 사이로 비스듬히 들어가면 충돌 판정이 없어서 건너뛸 수 있다.)"
    - 속마음: "(내 기록은 4시간 12분. 세계 2위. 1위는 '망각_공식'이라는 계정이었다. 영상도, 해설도, 댓글도 없이 기록만 올라와 있던.)"
    - 속마음: "(…지금 생각하니 이상한 이름이다.)"
  choices:
    - text: 기둥과 식탁 사이로 비스듬히 파고든다 (민첩)
      check: { label: 줄 건너뛰기, value: "stat.민첩 + 10 * talent.고양이반사신경 + luck", dc: 30 }
      success:
        lines:
          - "몸을 비틀어 기둥과 식탁 사이로 미끄러졌다. 정신을 차리니 배식대 맨 앞이다. 아무도 눈치채지 못했다."
          - 속마음: "(…됐다. 이게 왜 되는 거야.)"
        effects: ["fatigue -= 10", "stress -= 5"]
      fail:
        lines:
          - "기둥과 식탁 사이에는 충돌 판정이 있었다. 정확히는, 쟁반을 든 소녀가 있었다."
          - "감자 스튜가 하늘을 날았다."
          - 도로시@웃음: "으악! …괜찮아요, 괜찮아요. 이거 실험하다 망한 스튜였어요. 오히려 고마워요."
        effects: ["stress += 5", "affinity.dorothy += 2"]
    - text: 얌전히 줄을 선다
      effects: ["stat.의지 += 0.5"]
      lines:
        - "줄을 섰다. 앞사람 뒤통수를 보며 30분을 기다렸다."
        - 속마음: "(현실에는 리셋 버튼이 없다. 동선을 짜는 건 시간을 아끼려는 게 아니라, 실수를 줄이려는 거다.)"

- id: vet_ending
  title: 고인물의 기억 — 서른일곱 번째
  art: cg_vet_37
  on: 산책
  slots: [밤]
  priority: 1
  window: { from: "1.4", to: "1.7" }
  lines:
    - "호숫가 언덕. 아카데미의 불빛이 물에 거꾸로 비친다."
    - "이 각도를 안다. 서른일곱 번째 엔딩의 마지막 컷. 저 첨탑이 불타고, 호수가 붉었다."
    - 속마음: "(37번 엔딩 「다시 처음으로」. 스태프 롤도 없이 문장 하나만 떴다. 그리고 세계는, 다시 처음으로.)"
    - 속마음: "(그날 밤 커뮤니티엔 '진엔딩은 없다'는 글이 백 개쯤 올라왔다. 나는 댓글을 달지 않았다. 그냥 다시 1회차를 시작했다.)"
    - when: "fest.with and fest.with != 'alone'"
      속마음: "(…그런데 이 호숫가엔 축제 날 띄운 등불 조각이 아직 걸려 있다. 원작의 마지막 컷엔 없던 거다.)"
  choices:
    - text: 지금까지 바꾼 것을 손꼽아 센다
      effects: ["stat.의지 += 1.5", "stress -= 10"]
      lines:
        - 나레이션:
            - "손가락을 접어 본다. 아직 하나도 접히지 않는다. 원작은 아직, 거의 그대로다."
            - { when: "world.collapse >= 5", text: "손가락을 접어 본다. 원작에 없던 장면이 몇 개 생겼다. 원작 붕괴도 {{world.collapse}}%." }
            - { when: "world.collapse >= 5 and (fate.sera == 'saved' or fate.sera == 'saved_quiet')", text: "손가락을 접어 본다. 세라는 학교에 남았다. {{if fate.edric and fate.edric != 'dead'}}에드릭도 살아 있다. {{/if}}원작 붕괴도 {{world.collapse}}%." }
        - 속마음: "(작다. 하지만 원작엔 없던 숫자다.)"
    - text: 서른일곱 개의 엔딩 이름을 하나씩 떠올린다
      effects: ["stat.지성 += 1", "stress += 5"]
      lines:
        - "1번 「성검의 무덤」, 4번 「시든 숲의 무녀」, 12번 「황제 없는 겨울」, 19번 「마탑의 마녀」, 26번 「마검의 용사」……"
        - "서른일곱 개를 다 세는 데 한참이 걸렸다. 전부 누군가의 이름이 묘비에 새겨진 채 끝났다."
        - "마지막으로, 마음속 목록 맨 아래에 빈칸 하나를 그렸다."
        - 속마음: "(38번. 아직 아무도 본 적 없는 엔딩.)"
    - text: 남은 날을 센다
      effects: ["stat.의지 += 0.5", "stress += 3"]
      lines:
        - "{{if time.month == 4}}멸망까지 9년 10개월{{elif time.month == 5}}멸망까지 9년 9개월{{elif time.month == 6}}멸망까지 9년 8개월{{else}}멸망까지 9년 7개월{{/if}}."
        - 속마음: "(3,000시간 중에 이 세계에서 보낸 시간은 겨우 몇 달. 게임에선 한 학기가 두 시간이었는데.)"

- id: vet_meme
  title: 고인물의 기억 — 에휴 테크트리
  on: 식당
  pool: true
  when: "time.month >= 4"
  lines:
    - "옆 식탁 학생들이 시간표를 펼쳐 놓고 한숨을 쉰다."
    - 학생들: "에테르 공학에 고대 룬학에 신학까지… 에휴, 이게 무슨 테크트리야."
    - "숟가락을 떨어뜨렸다. 터져 나오는 웃음을 참을 수가 없었다."
    - 속마음: "(에휴 테크트리. 에테크. 커뮤니티가 이 게임을 부르던 이름. 이 세계 사람 입에서 들으니 배가 아프다.)"
    - 속마음:
        - "(리아나 2학년 여름 국룰. 브루노 '망치는 허리로' 짤. 카이든 어깨 탈골설. …다 같이 웃던 밈이었는데, 여기선 하나도 안 웃기다.)"
        - { when: "perk.데이터마이너", text: "(데이터마이닝 밈도 있었지. '청소부 검술 S = 개발자 손가락 미끄러짐'. …그 청소부는 진짜로 있었다.)" }
    - "옆 식탁 학생들이 수상하다는 듯 나를 본다."
  choices:
    - text: "\"아니, 에휴 테크트리라는 말이 너무 찰져서\""
      effects: ["reputation += 2", "vet.meme = 1", "stress -= 5"]
      lines:
        - 학생들: "…에휴 테크트리? 푸하, 그거 좋다. 에휴 테크트리!"
        - "다음 날, 그 말은 기숙사 전체에 퍼져 있었다."
        - 속마음: "(이 세계에 밈 하나를 수출했다.)"
    - text: 사레 걸린 척 기침을 한다
      effects: ["stress -= 3"]
      lines: ["콜록콜록. 학생들이 관심을 끊었다. 웃음은 스튜와 함께 꾹꾹 삼켰다."]
