        - 아이: "학교 쪽으로 가던데요. 미궁이 학교에 있죠?"
        - 나: "…로브 안쪽에 뭐 그려져 있진 않았어?"
        - 아이: "보려고 했는데, 노려봐서 못 봤어요. 눈이 엄청 차가웠어요."
        - 속마음: "(피 굳는 약… 피로 그리는 문양이 번지지 않게 하려는 건가.)"
        - 속마음: "(원작 설정집엔 이런 디테일이 없었다. 화면 밖의 세계는 생각보다 촘촘하다.)"
      effects: ["know.cult_early = 1", "intel += 1"]
    - lines:
        - 아이@진지: "뒷골목 그림 아저씨 알죠?"
        - 아이: "요즘 그 아저씨가 학교 학생들 얘기를 자꾸 물어요. 누가 어디 가는지, 누구랑 다니는지."
        - 아이: "당신 얘기도요."
        - 나@놀람: "…내 얘기?"
        - 아이: "조심해요. 그 아저씨는 물어본 걸 꼭 어디다 팔거든요."
        - 속마음: "(그림이 나를 사들이고 있다. 정보상에게 정보가 되는 건, 별로 좋은 신호가 아니다.)"
      effects: ["intel += 1"]
  choices:
    - text: 꼬치를 하나 사 준다 (은화 2)
      requires: "money >= 2"
      effects: ["money -= 2", "stress -= 5"]
      lines:
        - "근처 꼬치 노점에서 꼬치를 하나 사서 내밀었다."
        - "토비는 꼬치를 세 입에 먹어 치웠다. 막대까지 핥았다."
        - 아이@웃음: "다음에도 뭐 들리면 알려 줄게요. 공짜로."
        - 아이: "공짜는 처음 해 보는 거예요. 기분 이상하네."
        - "토비가 남은 꼬치 막대를 귀 뒤에 꽂았다. 연필처럼."
        - "토비는 짝짝이 신발로 한 바퀴 빙글 돌더니 인파 속으로 사라졌다."
    - text: 고맙다고만 한다
      lines:
        - 나: "고마워, 토비."
        - 아이@당황: "…이름 기억하네."
        - "토비가 코를 훔치며 인파 속으로 사라졌다."
        - "토비가 한 번 돌아보더니 손을 흔들었다. 엄지에 붕대가 감겨 있다. 새 붕대다."
        - "빵 값이 붕대가 된 모양이다."
        - "짝짝이 신발 소리가 한참 들렸다. 탁, 찰박. 탁, 찰박."

- id: town_temple
  title: 성교회 구호소
  art: church_kitchen
  on: 도시외출
  pool: true
  lines:
    - "시장 뒤편, 성교회 구호소. 낡은 석조 건물 앞에 김이 오르는 큰 솥이 걸려 있다."
    - "무료 급식 줄이 골목 끝까지 늘어섰다. 누더기를 걸친 노인, 아기를 업은 여자, 맨발의 아이들."
    - "늙은 수녀 혼자 국자를 들고 있다. 허리는 굽었는데 국자질은 정확하다. 한 그릇에 한 국자, 건더기 셋."
    - "솥에서 양파와 보리 냄새가 난다. 고기 냄새는 나지 않는다."
    - 수녀@웃음: "천천히들 오세요. 오늘은 넉넉해요. …아마도."
    - "줄 중간의 노인이 수녀에게 고개를 숙인다. ─ 시스터, 오늘도 덕분에 삽니다."
    - "솥 바닥이 보이기 시작한 걸, 수녀만 모르는 척하고 있다."
    - when: "fate.sera == 'saved' or fate.sera == 'saved_quiet'"
      나레이션: "수녀 옆에서 앞치마를 두른 은발 소녀가 빵을 나눈다. 세라다."
    - when: "fate.sera == 'saved' or fate.sera == 'saved_quiet'"
      나레이션: "나를 보고 눈을 동그랗게 떴다. 빵을 든 손이 허공에서 멈췄다."
    - when: "fate.sera == 'dropped'"
      나레이션: "줄 끝에 은발이 보인 것 같았다. 다시 보니 아니었다. 그 아이는 고향으로 돌아갔다."
    - when: "fate.sera == 'dropped'"
      속마음: "(원작대로다. 원작대로 둔 건, 나다.)"
    - "줄 끝의 아이 하나가 빈 그릇을 두 손으로 받쳐 들고, 까치발로 솥 쪽을 본다."
    - "그릇 바닥에 금이 가 있다. 아이는 국물이 새지 않게 손바닥으로 그 금을 받치고 있다."
    - 속마음: "(원작의 구호소는 '선행' 버튼이 달린 배경이었다. 냄새까지 있는 줄은 몰랐다.)"
    - 속마음: "(그냥 지나치기엔 줄이 너무 길다.)"
  choices:
    - text: 소매를 걷고 배식을 돕는다
      effects: ["fatigue += 10", "stat.의지 += 1", "stat.매력 += 0.5", "stress -= 5"]
      lines:
        - "소매를 걷고 솥 앞에 섰다. 수녀가 놀란 얼굴로 국자를 내줬다."
        - 수녀: "학생, 아카데미 사람이우? 손 데지 않게 조심해요."
        - 나레이션:
            - "국자를 받았다. 해가 질 때까지 스튜를 펐다."
            - { when: "talent.혐오스러운분위기", text: "내가 국자를 받자 줄이 반으로 줄었다." }
        - 나레이션:
            - "고맙다는 말을 백 번쯤 들었다."
            - { when: "talent.혐오스러운분위기", text: "…그래도 남은 사람들은 배불리 먹었다. 마지막 할머니가 내 손을 꼭 잡아 줬다." }
        - "팔이 저리고, 허리가 뻐근하고, 앞치마에 스튜 얼룩이 지도처럼 번졌다."
        - "마지막 그릇을 받은 건 아까 까치발을 들던 아이였다. 건더기를 하나 더 얹어 줬다. 수녀가 못 본 척했다."
        - 수녀@웃음: "여신께서 오늘 손 하나를 더 보내 주셨네. 고마워요."
      branch:
        - when: "fate.sera == 'saved' or fate.sera == 'saved_quiet'"
          lines:
            - "솥을 씻으러 뒷마당으로 가자, 세라가 소매를 걷고 따라왔다."
            - 세라@웃음: "너도 왔구나. 둘이 하니까 금방이네."
            - "세라가 솥 바닥을 박박 문질렀다. 손등이 붉다. 성흔 말고, 뜨거운 물 때문에."
            - 세라: "…나, 여기서 처음으로 쓸모 있다는 기분이 들었어."
            - 세라@진지: "성흔이니 시험이니 하는 거 말고. 그냥, 그릇 하나에 국 한 국자."
            - 세라@웃음: "다음 주에도 올 거야? …아, 그냥 물어본 거야."
          effects: ["affinity.sera += 4"]
    - text: 헌금함에 은화 10닢을 넣는다
      requires: "money >= 10"
      effects: ["money -= 10", "stress -= 10", "reputation += 2"]
      lines:
        - "헌금함에 은화 열 닢을 넣었다. 동전이 함 바닥에 떨어지는 소리가 묵직했다."
        - "늙은 수녀가 헌금함을 힐끗 보더니, 국자를 내려놓고 다가왔다."
        - 수녀: "고맙네, 학생."
        - "수녀가 목소리를 낮췄다. 줄 선 사람들이 듣지 못하게."
        - 수녀@진지: "그런데 그 함은 매주 붉은 띠 두른 분들이 대성당으로 걷어 가. 여기 남는 건 절반도 안 돼."
        - 수녀: "다음엔 차라리 빵을 사 오게. 빵은 아무도 걷어 가지 않으니까."
        - "수녀는 그 말을 하고, 아무 일 없다는 듯 웃는 얼굴로 다시 국자를 들었다."
        - when: "perk.고인물의기억 or perk.공략위키편집자"
          속마음: "(붉은 띠. 추기경 그레고르의 사람들.)"
        - when: "perk.고인물의기억 or perk.공략위키편집자"
          속마음: "(원작의 교회는 위에서부터 썩어 있었다.)"
    - text: 지나간다
      lines:
        - "줄 옆을 지나쳤다. 스튜 냄새가 등 뒤로 따라왔다."
        - "줄 끝에서 꼬마 하나가 빈 그릇을 들고 나를 봤다."
        - "까치발을 들던 그 아이다. 그릇이 아직 텅 비어 있다."
        - "걸음이 조금 무거워졌다."
        - "시장 소음 속으로 들어서자 스튜 냄새는 금방 사라졌다. 그 눈빛은 사라지지 않았다."
        - 속마음: "(원작에선 이 버튼을 안 누르면 그냥 배경이었다. 배경은, 사람을 쳐다보지 않았다.)"

- id: town_haggle
  title: 떠돌이 상인의 강장제
  on: 도시외출
  pool: true
  lines:
    - "시장 끝 공터. 마차를 개조한 노점이 서 있다. 지붕에 '북부 직송'이라고 쓴 깃발이 펄럭인다."
    - "마차 선반에 크고 작은 병들이 빽빽하다. 초록, 갈색, 정체 모를 보라색."
    - "떠돌이 상인이 병 하나를 높이 들고 흔들며 외친다."
    - 상인:
        - "북부 설산 곰 쓸개로 담근 강장제! 한 병에 은화 스물! 싸움판에서 쓰러져도 벌떡 일어나!"
        - { when: "talent.귀공자의품격", text: "오, 귀하신 분이 오셨네! 북부 설산 곰 쓸개 강장제, 귀족 나리께는 특별히 은화 스물! 원래 서른인데!" }
    - 상인@웃음: "이거 한 병이면 사흘 밤을 새도 끄떡없어! 장벽 수비대도 몰래 사 간다니까!"
    - "구경꾼 몇이 귀가 솔깃한 얼굴이다. 상인이 병을 햇빛에 비추자 액체가 금빛으로 반짝였다."
    - 손님: "정말 장벽 수비대가 사 가요?"
    - 상인@웃음: "그럼! 수비대장이 직접 와서 열 병을 사 갔지. 이름은 비밀이고!"
    - 속마음: "(시장 강장제가 은화 열다섯인데. 곰 쓸개는 무슨.)"
    - 속마음: "(병 바닥에 가라앉은 건 박하 잎이다. 원작 아이템 설명대로라면 효과는 그냥 강장제랑 같다. 가격만 빼고.)"
    - 속마음: "(깎아 볼까, 그냥 살까. 아니면 구경만 할까.)"
  choices:
    - text: 흥정한다 (매력·지성)
      lines:
        - 나: "그 곰, 북부 어디 출신이에요?"
        - 상인@놀람: "…응? 곰 출신을 묻는 손님은 처음인데."
      check: { label: 흥정, value: "stat.매력 + stat.지성 / 2 + 8 * talent.달변 + 8 * talent.혐오스러운분위기 - 8 * talent.말더듬 + luck", dc: 30 }
      success:
        lines:
          - 나레이션:
              - "곰 쓸개의 출처를 꼬치꼬치 캐묻고, 옆 노점 가격을 들먹이고, 돌아서는 척을 세 번 했다."
              - { when: "talent.혐오스러운분위기", text: "아무 말 없이 병만 오래 쳐다봤다. 상인의 이마에 땀이 맺히기 시작했다." }
          - 나: "옆 노점에선 열다섯에 팔던데요. 곰 그림도 없이."
          - 상인@당황: "그, 그건 남부 곰이지! 북부 곰은 쓸개가 두 배야!"
          - 나: "그럼 쓸개 하나만 주세요. 반값에."
          - "상인이 입을 벌렸다가 닫았다. 구경꾼들이 킥킥거렸다."
          - 상인: "아이고, 졌다 졌어! 은화 여덟! 대신 어디 가서 이 가격 말하지 마!"
          - 속마음: "(이겼다. …그런데 살까, 말까.)"
        choices:
          - text: 산다 (은화 8)
            requires: "money >= 8"
            effects: ["money -= 8", "item.강장제 += 1"]
            lines:
              - "은화 여덟 닢을 세어 건넸다. 상인이 한숨을 쉬며 병을 내밀었다."
              - "병을 받아 들고 마개를 살짝 열어 냄새를 맡았다."
              - "곰 쓸개 냄새는 안 나고 박하 냄새가 난다. 오히려 다행이다."
              - "마차 뒤에서 상인의 한숨 소리가 한 번 더 들렸다."
              - 상인@슬픔: "다음 손님한텐 꼭 스물 받는다. 꼭."
          - text: 이긴 걸로 만족하고 돌아선다
            effects: ["stress -= 10"]
            lines:
              - 나: "잘 생각해 볼게요."
              - 상인@화남: "뭐, 뭐야! 깎아 달래서 깎아 줬더니!"
              - "상인의 원망 어린 시선을 등으로 받으며 걸었다."
              - "공터를 벗어날 때까지 '깎아 줬더니!'가 세 번 더 들렸다."
              - "기분이 좋다. 3,000시간 동안 NPC 상점은 늘 정가였다."
      fail:
        lines:
          - 상인@웃음: "학생, 내가 장사 하루 이틀 한 줄 알아?"
          - 상인: "북부 설산에서 남부 사막까지, 흥정하는 손님은 다 만나 봤어. 은화 스물, 한 푼도 못 깎아."
          - "돌아서는 척을 했다. 한 걸음, 두 걸음."
          - "상인은 붙잡지 않았다. 휘파람까지 불었다."
          - "세 걸음째에 알았다. 진짜로 돌아서야 한다는 걸."
          - 속마음: "(원작에선 흥정에 실패해도 다시 말 걸면 리셋됐는데. 현실은 창피함이 리셋되지 않는다.)"
        effects: ["stress += 3"]
    - text: 정가에 산다 (은화 20)
      requires: "money >= 20"
      effects: ["money -= 20", "item.강장제 += 1"]
      lines:
        - "은화 스무 닢을 세어 건넸다. 상인의 눈이 반달처럼 휘었다."
        - 상인@웃음: "현명한 선택! 이건 덤이야. 곰 그림이 찍힌 나무 딱지. 행운을 부르지!"
        - "나무 딱지의 곰은 아무리 봐도 개처럼 생겼다."
        - "병을 흔들어 봤다. 금빛 액체 속에서 박하 잎이 빙글 돌았다."
        - 속마음: "(바가지인 줄 알면서 산다. 이 세계 경제에 기부했다고 치자.)"
    - text: 그냥 지나간다
      lines:
        - "구경만 하고 지나쳤다."
        - 상인@화남: "어이, 학생! 장벽에서 쓰러져 봐야 이 맛을 알지!"
        - "공터를 벗어날 때까지 상인의 외침이 따라왔다. 곰 쓸개, 곰 쓸개, 곰 쓸개."
        - "그 장벽에 정말로 서게 될 날이 올 거라는 걸, 상인은 모른다."

- id: town_smithy
  title: 대장간 거리
  art: forge
  on: 도시외출
  pool: true
  when: "affinity.bruno >= 10"
  lines:
    - "브루노가 도시 대장간 거리를 보여 주겠다며 앞장섰다."
    - "골목에 들어서자 공기가 달라졌다. 쇠 냄새, 숯 냄새, 땀 냄새. 귀가 먼저 시끄럽다."
    - "망치 소리가 골목마다 다른 박자로 울린다. 땅, 땅, 따당. 텅, 텅."
    - 브루노@웃음: "들려? 이게 대장간 거리 노래야."
    - 브루노: "저 집은 칼날이 좋고, 저 집은 편자가 좋고, 저 집은…"
    - 브루노@당황: "…망치질이 엉망이야. 소리만 들어도 알아. 쉿, 못 들은 걸로 해."
    - "골목 끝, 다 쓰러져 가는 대장간. 수염이 반쯤 그을린 노인 대장장이가 모루 앞에 앉아 있다."
    - "노인이 브루노 허리춤의 작은 칼을 보더니 망치를 내려놓았다."
    - 주인@놀람: "그 칼등의 망치 자국."
    - 주인: "혹시 남부 시골, 망치를 대대로 물려받는다는 대장간 영감네 손주냐?"
    - 브루노@놀람: "우리 할아버지를 아세요?"
    - 주인@웃음: "알다마다. 젊을 때 그 양반 풀무를 밟았지. 꼬박 3년을."
    - 주인@진지: "한번은 교회에서 온 검을 고쳤어. 빛이 나는 검이었지."
    - 주인: "교회 사람들이 와서는, 본 걸 전부 잊으라더군. 그래서 잊었지. 이렇게 떠드는 걸 보면 덜 잊었나 보다만."
    - when: "perk.고인물의기억 or perk.데이터마이너"
      속마음: "(원작 설정집 구석의 한 줄짜리 문장이, 지금 눈앞에서 수염을 쓰다듬으며 말을 하고 있다.)"
    - when: "perk.고인물의기억 or perk.데이터마이너"
      속마음: "(빛이 나는 교회의 검. 성검을 다시 벼릴 수 있는 혈통이라던 그 설정이, 여기서 이어진다.)"
    - when: "bruno.warned"
      브루노: "…수도 대장간 거리도 이렇게 생겼을까. 네가 언젠가 위험해진다고 했던 데 말이야."
    - when: "bruno.warned"
      나레이션: "브루노가 웃지 않고 골목 끝 하늘을 올려다봤다. 금세 다시 웃었지만."
    - 주인: "그래서, 영감 손주가 여긴 웬일이냐. 풀무질이라도 배우러 왔냐?"
    - 속마음: "(브루노 얼굴이 환하다. 풀무를 밟아 줄까, 할아버지 이야기를 더 들을까.)"
  plants:
    - { id: F18, notice: { value: "stat.지성 + 10 * perk.고인물의기억", dc: 20 } }
  choices:
    - text: 노인 대신 풀무를 밟는다 (체질)
      lines:
        - 나: "제가 풀무를 밟을게요."
        - 주인@웃음: "허, 학생이? 좋지. 다리 풀리면 말하고."
      check: { label: 풀무 밟기, value: "stat.체질 + stat.근력 / 2 + luck", dc: 28 }
      success:
        lines:
          - "풀무를 밟았다. 한 번, 두 번. 바람이 화로 속으로 밀려 들어간다."
          - "화로가 붉어지고, 주황이 되고, 하얗게 달아올랐다."
          - "노인이 브루노에게 망치를 쥐여 주고 턱짓했다. 한 번 쳐 보라고."
          - "브루노의 망치가 떨어질 때마다 쇠가 노래했다. 노인의 눈이 가늘어졌다."
          - 주인@진지: "허리로 치는구나. 영감 그대로야."
          - 브루노@웃음: "들었냐? 할아버지 그대로래!"
          - "브루노가 땀범벅인 얼굴로 나를 돌아봤다. 나도 땀범벅이었다. 다리가 후들거렸다."
          - 주인@웃음: "풀무 밟는 놈도 쓸 만하군. 둘 다 언제든 와라."
        effects: ["affinity.bruno += 6", "trust.bruno += 4", "stat.체질 += 1", "stat.근력 += 0.5", "fatigue += 10"]
      fail:
        lines:
          - "풀무를 세 번 밟고 다리가 풀렸다."
          - "화로는 겨우 주황빛에서 멈췄다. 쇠가 시무룩해 보인다."
          - "노인이 혀를 차며 브루노를 불렀다."
          - 주인: "손주야, 네 친구 다리는 장식이냐?"
          - "브루노는 풀무를 밟으면서 동시에 망치질을 했다. 한 발은 풀무에, 두 손은 망치에."
          - "노인이 처음으로 소리 내어 웃었다. 수염이 들썩였다."
          - 주인@웃음: "영감도 젊을 땐 그랬지. 미친 놈 집안이야, 너희는."
        effects: ["affinity.bruno += 4", "fatigue += 15"]
    - text: 할아버지 이야기를 더 묻는다
      effects: ["affinity.bruno += 5", "stat.지성 += 0.5"]
      lines:
        - 나: "브루노 할아버지 이야기, 더 듣고 싶어요."
        - "노인이 화로 옆 의자를 끌어다 앉았다. 오래된 이야기를 꺼낼 때의 자세다."
        - 주인: "그 양반 망치는 대대로 물려받은 거야. 손잡이를 갈아 끼운 게 열한 번째라더군."
        - 주인@진지: "쇠머리는 한 번도 안 바꿨고. 그 쇠머리에 글자가 새겨져 있지."
        - 주인: "아무도 못 읽는 글자. 영감도 못 읽었어. 그래도 꼭 그걸 쓰다듬고 나서야 망치를 들더군."
        - 브루노@놀람: "그거… 할아버지가 맨날 쓰다듬는 거, 그냥 버릇인 줄 알았는데."
        - 브루노: "…방학 때 집에 가면 할아버지한테 물어봐야겠다. 아저씨가 안부 전한다고."
        - 주인@웃음: "안부 말고, 내 풀무 값 3년 치 떼먹은 거나 갚으라고 전해."
        - 속마음: "(원작의 브루노는 이 망치 이야기를 끝내 다 하지 못하고 죽었다. 이번엔 끝까지 듣게 할 거다.)"

- id: town_grim_menu
  title: 그림의 가격표
  art: back_alley
  on: 도시외출
  pool: true
  repeat: 2
  cooldown: 3
  lines:
    - "시장 뒤편, 햇빛이 반쯤만 드는 골목. 젖은 돌바닥에서 썩은 양배추 냄새가 난다."
    - "벽에 붙은 수배 전단 몇 장이 바람에 펄럭인다. 그중 하나는 얼굴 부분이 찢겨 나갔다."
    - 나레이션:
        - "뒷골목 등불 아래. 정보상 그림이 낡은 장부를 펼쳐 놓고 있다."
        - { when: "not fired.grim_1 and fired.town_grim_menu <= 1", text: "뒷골목 등불 아래. 처음 보는 사내가 낡은 장부를 펼쳐 놓고 있다. 소문을 판다고 했다. 이름은 그림." }
    - "후드 그늘 아래로 금빛 눈이 번뜩였다. 수염이 까슬한 턱이 장부 쪽으로 기울어 있다."
    - "장부엔 숫자와 이름이 빼곡하다. 내가 다가가자 그림은 장부를 덮지 않고, 손바닥으로 가렸다."
    - "골목 끝에서 누군가 이쪽을 힐끔 보고는 사라졌다. 그림이 그쪽으로 눈길도 주지 않고 장부에 한 줄을 적었다."
    - 그림:
        - "오늘의 가격표다. 싼 건 싼 값을 하고, 비싼 건 비싼 값을 하지."
        - { when: "intel >= 2 and (fired.grim_1 or fired.town_grim_menu >= 2)", text: "단골 왔군. 오늘의 가격표다. 단골은 비싼 것도 조금 싸게 해 주지." }
        - { when: "intel >= 2 and not fired.grim_1 and fired.town_grim_menu <= 1", text: "학교 소문을 꽤 주워듣고 다니는 얼굴이군. 오늘의 가격표다. 그런 손님은 비싼 것도 조금 싸게 해 주지." }
    - 그림@웃음: "가격은 정직하게 붙였어. 정직한 건 가격뿐이지만."
    - "그림이 등불 심지를 손톱으로 툭 쳤다. 불빛이 커지면서 장부 위 이름 몇 개가 드러났다가, 다시 그늘로 숨었다."
    - 속마음: "(그림. 원작에선 뒷골목 상점 NPC였다. 대화 선택지는 '구매'와 '나가기' 둘뿐.)"
    - when: "note.note_grim.known"
      속마음: "(그리고 황제 암살의 밤, 황궁 근처에 있던 사람. 커뮤니티 공략에서 본 정보다.)"
    - 속마음: "(저 장부 어딘가에 내 이름도 있을까.)"
    - 속마음: "(오늘은 무엇에 은화를 쓸까.)"
  choices:
    - text: 싼 소문을 산다 (은화 5)
      requires: "money >= 5"
      effects: ["money -= 5", "affinity.grim += 2"]
      lines:
        - "은화 다섯 닢을 장부 위에 올렸다. 그림이 동전을 손끝으로 쓸어 담았다."
        - "그림이 동전 하나를 어금니로 깨물어 봤다. 진짜다. 만족한 얼굴이다."
      branch:
        - when: "not know.kaiden_shoulder"
          lines:
            - 그림: "3황자 말이야. 검술은 완벽한데 왼쪽 어깨를 감싸고 싸운대. 대련해 본 놈들 얘기야."
            - 그림: "다들 지고 나서야 알았다더군."
            - 그림@웃음: "알았어도 졌겠지만. 아는 거랑 막는 건 다르니까."
            - 속마음: "(카이든의 어깨. 원작 공략의 기본 중 기본. 그걸 은화 다섯 닢에 다시 산다.)"
          effects: ["know.kaiden_shoulder = 1"]
        - lines:
            - 그림: "신학과 시스터 루나가 추기경 쪽 사람을 성당 문 앞에서 돌려보냈다더군. 웃는 얼굴로."
            - 그림@진지: "그 여자, 오래 못 버틸 거야."
            - 그림: "웃으면서 거절하는 사람은 둘 중 하나야. 아주 강하거나, 곧 부러지거나."
            - 속마음: "(원작의 시스터 루나는 교회 숙청에 휘말려 죽는다. 웃는 얼굴 그대로.)"
    - text: 비싼 소문을 산다 (은화 25)
      when: "intel < 2"
      requires: "money >= 25"
      effects: ["money -= 25", "intel += 2", "affinity.grim += 4"]
      lines:
        - "은화 스물다섯 닢을 세어 올렸다. 그림이 장부를 덮고, 처음으로 몸을 앞으로 기울였다."
        - 그림: "검은 마차 얘기, 좀 더 깊이 들어간 거다."
        - 그림: "바퀴 자국을 따라가 본 놈이 있어. 비 온 다음 날, 진흙에 남은 걸로."
        - 그림: "황궁 뒷문에서 나와서, 한 번은 대성당 뒷골목으로, 한 번은 2황자궁 담벼락으로 갔대."
        - 나: "…같은 마차가 두 군데를?"
        - 그림@진지: "장난질이거나, 둘 다거나. 나라면 아무도 안 믿어."
        - 그림: "그 바퀴 자국 따라간 놈은 그 뒤로 안 보여. 이것도 가격에 포함이다."
        - 속마음: "(교회냐 2황자냐. 커뮤니티가 10년 동안 싸우던 그 떡밥이다. 원작은 끝내 답을 주지 않았다.)"
      plants:
        - { id: F10, notice: { value: "stat.지성 + 10 * note.note_grim.known", dc: 18 } }
    - text: 비싼 소문을 산다 (단골가 은화 18)
      when: "intel >= 2"
      requires: "money >= 18"
      effects: ["money -= 18", "intel += 2", "affinity.grim += 4"]
      lines:
        - "은화 열여덟 닢을 올렸다. 그림이 세어 보지도 않고 쓸어 담았다. 단골의 특권이다."
        - 그림: "검은 마차 얘기, 좀 더 깊이 들어간 거다. 단골이니까 해 주는 얘기야."
        - 그림: "바퀴 자국을 따라가 본 놈이 있어. 비 온 다음 날, 진흙에 남은 걸로."
        - 그림: "황궁 뒷문에서 나와서, 한 번은 대성당 뒷골목으로, 한 번은 2황자궁 담벼락으로 갔대."
        - 나: "…같은 마차가 두 군데를?"
        - 그림@진지: "장난질이거나, 둘 다거나. 나라면 아무도 안 믿어."
        - 그림: "그 바퀴 자국 따라간 놈은 그 뒤로 안 보여. 단골한테만 여기까지 말해 주는 거다."
        - 속마음: "(교회냐 2황자냐. 커뮤니티가 10년 동안 싸우던 그 떡밥이다. 원작은 끝내 답을 주지 않았다.)"
      plants:
        - { id: F10, notice: { value: "stat.지성 + 10 * note.note_grim.known", dc: 18 } }
    - text: 내 정보를 판다 — 미궁 3층의 문양
      when: "(know.cult_early or fs.F03.noticed) and trust.grim < 8"
      effects: ["money += 15", "intel += 1", "trust.grim += 4", "affinity.grim += 3"]
      lines:
        - 나: "오늘은 사러 온 게 아니야."
        - 나: "미궁 3층. 벽에 그려진 문양 이야기, 얼마 쳐줄래?"
        - "그림의 손이 멈췄다. 장부 위에서 펜이 잉크 한 방울을 떨어뜨렸다."
        - 그림@진지: "……학생, 그건 어디서 들었지?"
        - 나: "그건 가격표에 없는 질문인데."
        - "그림이 나를 오래 봤다. 그러다 입꼬리만 비틀어 웃었다."
        - 그림: "은화 열다섯."
        - 그림@진지: "그리고 충고 하나는 공짜다. 그 얘기는 나 말고 아무한테도 팔지 마."
        - 그림: "그쪽 손님들은 값을 피로 치르거든."
    - text: 그냥 간다
      lines:
        - "장부에서 눈을 떼고 돌아섰다."
        - 그림@웃음: "구경은 공짜지. 다음엔 지갑을 들고 와."
        - 나: "지갑은 늘 들고 와. 열지 않을 뿐이지."
        - 그림@웃음: "그런 손님이 제일 비싼 손님이지."
        - "골목을 나설 때까지 등 뒤에서 펜 소리가 들렸다. 무언가 적고 있다. 아마 내 이름을."

- id: town_fortune
  title: 점쟁이 노파
  on: 도시외출
  pool: true
  lines:
    - "시장 끝, 사람 발길이 뜸해지는 모퉁이."
    - "별 무늬가 수놓인 보라색 천막이 있다. 천막 앞에 말린 약초 다발과 짐승 뼈가 매달려 달그락거린다."
    - "안에서 향 냄새가 흘러나온다. 달고, 무겁고, 조금 탄 냄새."
    - "천막 그늘 속에서 눈이 탁한 노파가 손짓한다."
    - 노파@웃음: "학생, 은화 세 닢이면 앞날을 봐 주지."
    - 노파: "앞날이 궁금하지 않은 얼굴이구먼. 그런 얼굴이 제일 궁금해하더라."
    - "노파의 손가락이 탁자 위 카드 더미를 톡톡 두드린다. 손톱 끝의 금박이 반쯤 벗겨져 있다."
    - "천막 기둥에 걸린 작은 종이, 바람도 없는데 딸랑 울렸다."
    - "천막 안쪽 어둠 속에서 고양이 눈 두 개가 나를 보고 있다."
    - 속마음: "(시장 점쟁이. 원작에선 운세 문구 열 개 중 하나를 뽑아 주는 NPC였다. 대부분 '오늘은 행운이 따릅니다'.)"
    - 속마음: "(앞날이라면 내가 노파보다 잘 안다. …아마도.)"
  choices:
    - text: 점을 본다 (은화 3)
      requires: "money >= 3"
      lines:
        - "천막 안 의자에 앉았다. 의자 다리 하나가 짧아 몸이 기우뚱했다."
        - "노파는 동전을 받지 않고 탁자 위에 두라고 손짓했다. 그리고 카드를 섞었다."
      branch:
        - when: "talent.마왕의흔적"
          lines:
            - "노파가 첫 장을 뒤집기도 전에 카드를 떨어뜨렸다."
            - "카드가 바닥에 흩어졌다. 전부 뒷면이 위로."
            - "노파가 의자째 뒤로 물러난다. 탁한 눈이 내 얼굴이 아니라 그림자를 보고 있다."
            - 노파@놀람: "가, 가게. 돈은 안 받을 테니 그냥 가."
            - 노파@화남: "자네 그림자에서 장벽 너머 냄새가 나."
            - 속마음: "(마왕의 흔적. 이 몸에 깃든 마기를, 시장 점쟁이가 알아본다. 원작의 엑스트라 NPC가 이렇게 예민했던가.)"
          effects: ["stress += 5"]
        - lines:
            - "노파가 카드 열 장을 펼쳤다. 모서리가 둥글게 닳은 카드."
            - "첫 장을 뒤집다 말고 손을 멈춘다."
            - 노파@진지:
                - "희한하네. 그림자가 둘이야. 하나는 이 몸 것, 하나는… 아주 먼 데서 왔구먼."
                - { when: "talent.몸주인의잔재", text: "희한하네. 그림자가 둘이야. 먼 데서 온 그림자랑, 원래 있던 그림자." }
            - when: "talent.몸주인의잔재"
              노파: "원래 있던 쪽이 자네를 보고 있구먼. 기다렸다는 얼굴로."
            - "노파가 남은 장들을 차례로 뒤집었다. 불타는 탑, 시든 나무, 부러진 검."
            - 속마음: "(…장난이겠지. 열 장 중에 아무거나 뒤집은 것뿐이다.)"
            - 노파@진지: "열 번째 겨울에 큰불이 보여."
            - 노파: "그런데… 이상하지. 이 패는 처음부터 다시 섞여 있어."
            - 노파: "누가 몇 번이고, 몇 번이고 다시 섞은 것처럼."
            - 속마음: "(그리고 세계는, 다시 처음으로. ……시장 점쟁이 대사로는 너무 정확하잖아.)"
          effects: ["money -= 3", "stat.의지 += 0.5", "stress += 3"]
    - text: 사양한다
      effects: ["stress -= 3"]
      lines:
        - 나: "괜찮아요. 앞날은 제가 알아서 볼게요."
        - 노파@웃음: "앞날이 무서운 게지. 현명해."
        - "노파가 낄낄 웃으며 카드를 섞었다."
        - "몇 번이고, 몇 번이고."
        - "천막을 나와서도 카드 섞는 소리가 한참 귀에 남았다. 사락, 사락."
        - 속마음: "(처음부터 다시 섞는 소리. …괜히 신경 쓰인다.)"

- id: town_lostchild
  title: 길 잃은 아이
  on: 도시외출
  pool: true
  lines:
    - "생선 좌판 옆. 얼음 위에 누운 고등어들이 은빛으로 번들거린다."
    - "그 옆에서 다섯 살쯤 된 여자아이가 울고 있다."
    - "양 갈래로 땋은 머리가 반쯤 풀렸다. 한 손엔 반쯤 먹은 빵 꼬투리."
    - 아이@슬픔: "엄마아… 엄마아아!"
    - "엄마를 부르는데, 시장이 너무 시끄러워 아무도 못 듣는다. 다들 바쁘게 아이 옆을 지나친다."
    - "생선 장수가 힐끔 보더니 손님 쪽으로 몸을 돌렸다. 바쁜 날이다."
    - "아이의 빵 꼬투리에서 부스러기가 떨어진다. 비둘기 두 마리가 그걸 노리고 아이 발치를 맴돈다."
    - 아이@슬픔: "엄마가… 여기 있으라고 했는데… 여기 없어…"
    - "아이는 '여기'가 어디인지 모르는 얼굴이었다. 시장은 어디나 비슷하게 생겼다."
    - 속마음: "(미아 이벤트. 원작에선 '도와준다'를 누르면 화면이 넘어가고 평판이 올랐다.)"
    - 속마음: "(여긴 버튼이 없다. 어떻게 달래야 하지.)"
  choices:
    - text: 쪼그려 앉아 달랜다 (매력)
      lines:
        - "아이 앞에 쪼그려 앉았다. 눈높이가 맞자 아이가 울음을 멈추고 나를 쳐다봤다."
        - 나: "안녕. 엄마 찾는 중이야?"
      check: { label: 달래기, value: "stat.매력 + 12 * talent.사람좋은얼굴 + 8 * talent.미모 - 15 * talent.혐오스러운분위기 + luck", dc: 24 }
      success:
        lines:
          - 나레이션:
              - "눈높이를 맞추고 이름을 물었다. 아이가 훌쩍이며 대답했다."
              - { when: "talent.자연친화력", text: "눈높이를 맞추자 비둘기 한 마리가 내 머리 위에 내려앉았다. 아이가 울다 말고 깔깔 웃었다." }
          - 아이: "…루시. 빵집 딸 루시. 엄마는 빵 팔아요."
          - "루시의 손을 잡았다. 작은 손이 끈적하다. 빵 꼬투리를 꼭 쥐고 있던 손이다."
          - "빵 냄새를 따라 시장 골목을 걸었다. 루시가 '저기!' 할 때마다 방향을 틀었다."
          - "빵 수레 앞에서 앞치마 두른 여자가 사방을 두리번거리고 있었다."
          - "아이 엄마가 달려와 아이를 끌어안았다. 그리고 내 품에 갓 구운 빵을 한 아름 안겼다."
          - "── 고마워요, 학생. 정말 고마워요. 이거 다 가져가요, 다!"
          - 아이@웃음: "안녕! 다음에 또 길 잃으면 또 와!"
          - 속마음: "(그건 좀 곤란한데.)"
        effects: ["stress -= 10", "reputation += 2", "fatigue -= 5"]
      fail:
        lines:
          - 나레이션:
              - "말을 걸자 아이가 더 크게 울었다. 지나가던 사람들이 나를 수상하게 쳐다본다."
              - { when: "talent.혐오스러운분위기", text: "눈이 마주치자 아이가 울음을 뚝 그쳤다. 너무 무서워서. 그리고 세 배로 울었다." }
          - 나@당황: "어, 아니, 나는 그냥… 엄마 찾아 주려고…"
          - "변명할수록 시선이 늘었다. 누군가 '유괴범 아냐?' 하고 속삭였다."
          - "결국 경비병이 와서 아이를 데려갔다."
          - 경비병@진지: "학생. 학생증 좀 봅시다."
          - "경비병은 가기 전에 나를 한참 위아래로 훑어봤다. 학생증을 세 번 확인했다."
          - 속마음: "(선의만으로는 안 되는 일이 있다. 원작은 그걸 버튼 하나로 생략했다.)"
        effects: ["stress += 5"]
    - text: 아이를 번쩍 들어 어깨에 태운다 (근력)
      requires: "stat.근력 >= 15 or talent.거구"
      effects: ["stress -= 10", "stat.매력 += 0.5", "reputation += 2"]
      lines:
        - "아이를 번쩍 들어 어깨에 태웠다. 생각보다 가볍다."
        - "울음이 뚝 그쳤다. 대신 내 머리카락을 양손으로 꽉 쥐었다. 아프다."
        - 아이@놀람: "와… 높다…"
        - "높은 데서 두리번거리던 아이가 소리쳤다."
        - 아이@웃음: "엄마! 저기 엄마!"
        - "빵 수레 쪽에서 앞치마 두른 여자가 달려왔다."
        - "아이는 내려오기 싫다고 내 머리카락을 꽉 쥐고 버텼다. 엄마가 웃으면서 손가락을 하나씩 떼어 냈다."
        - 속마음: "(정수리가 얼얼하다. 그래도 웃음이 나왔다.)"
    - text: 경비대 초소에 데려다준다
      effects: ["stress -= 3"]
      lines:
        - 나: "같이 경비대 초소에 가자. 거기서 엄마 찾아 줄 거야."
        - "아이 손을 잡고 초소까지 걸었다. 아이는 가는 내내 훌쩍였다."
        - "경비대 초소에 아이를 맡겼다. 경비병이 익숙한 듯 아이에게 사탕부터 쥐여 줬다."
        - 경비병: "오늘만 세 번째요. 주말엔 애들이 비둘기처럼 흩어져."
        - "초소 창 너머로 아이가 손을 흔들었다. 사탕을 문 채, 울음은 그쳐 있었다."
        - 속마음: "(제일 확실한 방법을 골랐다. 그런데 손이 허전하다.)"

# ================================================================ 출신별 과거
# ---------------------------------------------------------------- 평민 장학생
- id: home_commoner_letter
  title: 빵집에서 온 편지
  art: dorm_room
  on: auto
  free: true
  window: "1.4"
  chance: 0.25
  when: "origin == '평민장학생'"
  lines:
    - "저녁 무렵 기숙사 우편함. 두툼한 편지가 한 통 꽂혀 있다."
    - "봉투가 불룩하다. 모서리가 닳았고, 하얀 가루가 묻어 있다."
    - "코에 대 봤다. 밀가루 냄새가 난다. 그리고 아주 희미하게, 탄 버터 냄새."
    - "이 몸의 어머니다."
    - "복도 어딘가에서 누군가 편지를 소리 내어 읽는다. 다들 이맘때면 집에서 편지를 받는 모양이다."
    - "방으로 돌아와 침대에 걸터앉았다. 봉투를 뜯는 손이 이상하게 조심스럽다."
    - "── 밥은 잘 먹고 다니니."
    - "── 빵집은 그럭저럭이다. 새로 들인 화덕이 말썽이라 아버지가 매일 화덕이랑 싸운다."
    - "── 미나가 매일 저녁 다락방 창에서 아카데미 첨탑 쪽으로 손을 흔든단다. 그러면 너한테 닿는다고."
    - "창밖을 봤다. 아카데미 첨탑이 어둠 속에 서 있다. 그 반대편 어딘가에, 그 다락방이 있다."
    - 속마음: "(미나. 이 몸의 여동생. 나는 얼굴도 모른다.)"
    - "── 장학금은 성적이 떨어지면 끊긴다고 들었다."
    - "── 무리하지는 말고, 그래도 떨어지지는 말고."
    - "편지 여백에 삐뚤빼뚤한 글씨가 덧붙어 있다. ─ 빨리 와. 미나가."
    - "글자 옆에 서툰 그림이 있다. 빵 하나와, 막대기 사람 둘. 하나는 키가 크다."
    - "그리고 맨 마지막 줄."
    - "── 그런데 얘야. 지난번 편지 글씨가 좀 달라졌더구나. 바빠서 그런 거지?"
    - "편지를 넘기던 손이 멈췄다."
    - 속마음: "(…이 몸의 글씨체까지는 흉내 내지 못했다.)"
    - 속마음: "(어머니들은 안다. 원작엔 이 사람이 없었다. 그래도 화면 밖에서 누군가는 이 아이를 기다리고 있었다.)"
    - when: "talent.몸주인의잔재"
      나레이션: "편지를 쥔 손가락이 저절로 떨렸다."
    - when: "talent.몸주인의잔재"
      나레이션: "이 몸이 기억하는 새벽 빵 굽는 냄새가 코끝을 스쳤다. 화덕 앞에서 졸던 새벽들이."
    - 속마음: "(답장을 써야 한다. 무엇을, 어떻게.)"
  choices:
    - text: 용돈을 아껴 편지에 동봉한다 (은화 10)
      requires: "money >= 10"
      effects: ["money -= 10", "stress -= 10", "home.sent = 1"]
      lines:
        - "지갑을 열었다. 이번 달 용돈이 얼마 남지 않았다."
        - "그래도 은화 열 닢을 꺼내 편지지에 쌌다."
        - "편지 끝에 적었다. 미나에게 사탕이라도 사 주라고."
        - "망설이다 한 줄을 더 적었다. 밥 잘 먹고 있어요."
        - "봉투가 조금 더 무거워졌다. 은화 무게만큼은 아닌 것 같았다."
        - 속마음: "(남의 가족에게 보내는 돈. …아니, 이제 남이 아니다. 그렇게 정하기로 했다.)"
    - text: 옛 편지를 보며 이 몸의 글씨로 긴 답장을 쓴다
      effects: ["stress -= 5", "stat.지성 += 0.5"]
      lines:
        - "서랍 속 옛 편지 묶음을 꺼냈다. 이 몸이 입학 전에 썼다가 부치지 못한 답장 초안도 섞여 있다."
        - "초안을 펴 놓고 이 몸의 글씨를 따라 썼다."
        - "ㄹ을 둥글게 말고, 받침을 작게. 획 하나하나가 남의 이름을 빌려 쓰는 것 같았다."
        - "빵집 이야기를 물었다. 화덕 이야기를 물었다. 미나에게 첨탑에서 손을 마주 흔들겠다고 적었다."
        - "다 쓰고 나니 촛불이 반쯤 타 있었다."
        - 속마음: "(3,000시간 동안 한 번도 안 해 본 일이다. 이 세계 사람한테 편지를 쓰는 것.)"
    - text: 바쁘다고 짧게 쓴다
      effects: ["stress += 3"]
      lines:
        - "'잘 지내요. 바빠요.'"
        - "두 줄을 쓰고 봉투를 닫았다."
        - "밀가루 냄새가 나는 편지를 서랍에 넣었다. 다시 꺼내 읽지는 않았다."
        - "미안한 마음은 봉투에 넣지 못했다."
        - "창밖의 첨탑을 보지 않으려고 커튼을 쳤다."
        - 속마음: "(진짜로 바쁘다. 멸망까지 10년이니까. …그런 말을 이 사람들한테 할 수는 없다.)"

- id: home_commoner_father
  title: 시장의 아버지
  on: 도시외출
  priority: 1
  window: { from: "1.5.4", to: "1.7.2" }
  when: "origin == '평민장학생'"
  lines:
    - "시장 입구. 짐수레들이 줄지어 들어오고, 마부들이 서로 길을 비키라고 고함친다."
    - "그 소란 속에서 밀가루 포대를 수레에 싣던 사내가 허리를 펴다 나를 발견했다."
    - "아직 이름도 부르지 않았는데, 사내의 얼굴이 활짝 펴졌다."
    - "넓은 어깨, 하얗게 센 눈썹, 밀가루가 내려앉은 앞치마. 이 몸의 아버지다."
    - "얼굴을 보는 순간, 가슴 한쪽이 먼저 반응했다. 반갑다고."
    - "── 어이구, 우리 장학생! 얼굴이 반쪽이 됐네."
    - "── 아카데미 밥이 그렇게 맛없냐?"
    - 나레이션:
        - "아버지는 손을 바지에 닦고 내 어깨를 두드렸다. 밀가루가 하얗게 묻었다."
        - { when: "exam.rank == 'top'", text: "── 게시판 소문 들었다. 상위권이라며? 빵집 손님들한테 벌써 다 자랑했다. 아버지는 손을 바지에 닦고 내 어깨를 두드렸다." }
        - { when: "exam.rank == 'low'", text: "아버지는 성적 얘기를 꺼내지 않았다. 대신 어깨를 두드리는 손이 조금 더 오래 머물렀다." }
    - 나: "…아버지."
    - "입에서 말이 나왔다. 처음 불러 보는 말인데, 혀가 이미 알고 있었다."
    - "── 그래, 그래. 아버지다. 몇 달 만이라고 얼굴도 까먹었냐?"
    - "옆 좌판 채소 장수가 끼어들었다. ─ 빵집 양반, 그게 그 장학생이야? 아이고, 많이 컸네!"
    - "── 컸지! 아카데미 물이 좋아. 아, 너무 쳐다보지 마. 우리 애 닳는다."
    - "아버지가 껄껄 웃었다. 웃을 때 눈가 주름이 세 겹으로 접힌다. 거울 속 이 몸의 웃는 얼굴과 똑같이."
    - "생선 장수, 빵 바구니 든 아낙, 지나가던 짐꾼까지 아버지에게 인사를 건넨다. 시장 사람들은 다 이 사람을 아는 모양이다."
    - 속마음: "(까먹은 게 아니라 처음 보는 거다. …그 말은 평생 못 하겠지.)"
  branch:
    - when: "home.sent"
      lines:
        - "아버지가 앞치마 주머니를 뒤적이더니 작은 천 꾸러미를 꺼냈다."
        - "── 그리고 이거. 네 엄마가 돌려주란다. 보내 준 은화."
        - "── 미나 사탕은 엄마가 사 줬으니까, 이건 네 밥값이래. 엄마 말 안 들으면 나도 혼난다."
        - "꾸러미 안에는 은화 열 닢과, 알사탕 하나가 들어 있었다. 사탕은 미나가 넣은 게 틀림없다."
      effects: ["money += 10"]
  choices:
    - text: 아버지와 국밥을 먹는다
      effects: ["stress -= 15", "stat.의지 += 1", "fatigue -= 5"]
      lines:
        - "── 마침 잘 됐다. 배고프지? 따라와라."
        - 삽화: tavern
        - "시장 골목 국밥집. 김이 서린 창, 기름때 낀 나무 탁자, 왁자한 장꾼들."
        - "아버지는 국밥 두 그릇을 시키더니, 자기 그릇의 고기를 전부 내 그릇으로 옮겼다."
        - 나: "아버지도 드세요."
        - "── 나는 아까 먹었다. 빵집 주인이 빵으로 배 채우지 뭘로 채우냐."
        - "거짓말이다. 아버지의 배가 꾸르륵 울었다. 둘 다 못 들은 척했다."
        - "── 너 어릴 때 왼손으로 숟가락 쥐다 엄마한테 혼났던 거 기억나냐."
        - "── 요샌 오른손으로 잘 먹네."
        - "숟가락이 그릇 가장자리에서 멈췄다."
        - 속마음: "(이 몸은 왼손잡이였다.)"
        - "아버지는 더 묻지 않았다. 국밥이 식을 때까지 빵집 얘기만 했다. 화덕 얘기, 미나 얘기, 단골 할머니 얘기."
        - "헤어질 때, 아버지가 내 어깨에 묻은 밀가루를 털어 줬다. 자기가 묻힌 건데."
    - text: 수레에 밀가루 포대를 같이 싣는다
      effects: ["stat.근력 += 1", "stress -= 8", "fatigue += 5"]
      lines:
        - 나: "제가 실을게요."
        - "── 됐다, 됐어. 장학생 손에 굳은살 박이면 못 쓴다."
        - "말리는 아버지를 지나쳐 포대를 들었다. 생각보다 무겁다. 밀가루가 코를 찌른다."
        - "포대 열두 개를 같이 실었다. 마지막 포대를 올리자 수레가 끼익 내려앉았다."
        - "아버지가 허리를 두드리며 웃었다."
        - "── 아카데미가 사람을 만드는구나. 작년엔 포대 하나 들다 주저앉던 놈이."
        - "── 네 엄마한테 자랑해야겠다. 우리 애가 포대를 들었다고. 성적보다 이걸 더 좋아할걸."
        - 속마음: "(작년의 이 아이는 포대 하나에 주저앉았다. 지금의 나는 그 아이의 팔로 들었다. …누구 칭찬인지 모르겠다.)"
    - text: 바쁘다고 둘러대고 자리를 뜬다
      effects: ["stress += 5"]
      lines:
        - 나: "죄송해요, 지금 좀 바빠서…"
        - "── 그래, 그래. 바쁘지. 장학생이 바빠야지."
        - "아버지는 웃으며 손을 흔들었다."
        - "모퉁이를 돌 때까지 그 손이 내려가지 않았다."
        - "── 그래도 밥은 꼭 먹어라! 다음 달엔 집에 한번 오고! 미나가 기다린다!"
        - "시장 소음 사이로 그 목소리가 한참 따라왔다."
        - 속마음: "(돌아보지 않았는데도 알았다. 이 몸의 등이, 그 손을 기억하고 있었다.)"

# ---------------------------------------------------------------- 몰락 귀족 3남
- id: home_noble_collector
  title: 채권자의 대리인
  on: 도시외출
  priority: 1
  window: { from: "1.4", to: "1.7" }
  when: "origin == '몰락귀족' and debt > 0"
  lines:
    - "시장 한복판, 향신료 좌판 앞."
    - "누군가 내 이름 앞에 가문 이름을 붙여 불렀다. 요즘은 아무도 그렇게 부르지 않는데."
    - "귀족 동 사람들조차 이 가문 이름은 입에 올리지 않는다. 빚이 옮을까 봐."
    - "돌아보자 검은 정장의 사내가 서 있다. 반질반질한 장부를 옆구리에 끼고."
    - "구두에 먼지 하나 없다. 시장 바닥에서 저 구두를 유지하는 것도 재주다."
    - "제국 상업 은행의 채권 대리인이다."
    - "사내가 모자를 살짝 들었다. 정중한 인사다. 사람을 장부의 한 줄로 대하는 사람들 특유의 정중함."
    - "── 도련님. 가문 채무 건으로 왔습니다."
    - "사내가 장부를 펼쳤다. 숫자가 빽빽하다."
    - "── 남은 원금이 은화 {{debt}}닢. 이자는 지난달부터 두 배로 붙고 있지요."
    - "── 큰형님은 장벽에, 둘째 형님은 행방이 묘연하시고."
    - "── 서명하실 분이 도련님밖에 안 남았더군요."
    - "사내가 웃었다. 입만. 눈은 장부의 숫자처럼 차갑다."
    - "주변 상인들이 흥미로운 구경거리라도 생긴 듯 귀를 기울인다."
    - 상인: "…저 학생, 귀족이었어? 그런데 왜 우리 가게에서 제일 싼 것만 사 가?"
    - "웃음이 번졌다. 얼굴이 화끈거렸다."
    - when: "talent.몸주인의잔재"
      나레이션: "장부를 보자 이 몸의 위장이 꼬였다."
    - when: "talent.몸주인의잔재"
      나레이션: "이 사람 얼굴을 기억하는 몸이다. 저택 현관에서, 아버지 서재 앞에서, 몇 번이고."
    - 속마음: "(몰락 귀족 3남. 원작에선 '가문 빚 이벤트'라는 이름으로 묶여 있던 몇 줄의 텍스트.)"
    - 속마음: "(텍스트로 읽을 땐 그냥 숫자였다. 지금은 그 숫자가 내 이름을 부른다.)"
    - 속마음: "(따질까, 갚을까, 도망칠까.)"
  choices:
    - text: 계약서 조항을 따진다 (지성·매력)
      lines:
        - 나: "계약서 좀 보여 주시죠. 원본으로."
        - "사내의 눈썹이 아주 조금 올라갔다. 그래도 장부 사이에서 계약서를 꺼냈다."
      check: { label: 채무 협상, value: "stat.지성 + stat.매력 / 2 + 10 * talent.귀공자의품격 + 8 * talent.달변 + luck", dc: 32 }
      success:
        lines:
          - "계약서 조항을 하나하나 짚었다. 글씨가 작다. 일부러 작게 쓴 글씨다."
          - "열네 번째 조항. 이자율 변경에는 채무자 서명이 필요하다고 적혀 있다."
          - 나: "여기, 서명이 없네요. 아버지 서명도, 형님들 서명도."
          - "아무도 서명한 적이 없다. 사내의 입꼬리가 처음으로 굳었다."
          - "── …법학 공부를 하셨군요."
          - "── 좋습니다. 이자는 원래대로, 원금 일부는 졸업 후 상환으로 미뤄 드리지요."
          - 속마음: "(3,000시간 중에 경제 이벤트 텍스트만 몇 시간을 읽었다. 이런 데서 쓸 줄이야.)"
          - "사내가 장부를 덮고 모자를 들어 인사했다. 다음엔 더 작은 글씨를 쓰겠다는 얼굴로."
        effects: ["debt -= 30", "stress -= 10", "stat.지성 += 0.5"]
      fail:
        lines:
          - "조항을 따져 봤지만, 글씨는 너무 작고 문장은 너무 길었다."
          - "세 번째 조항에서 길을 잃었다. 사내는 기다려 주지 않았다."
          - "── 도련님, 법은 돈 있는 쪽 편입니다."
          - "── 다음 달에 다시 뵙지요. 그때는 이자가 조금 더 붙어 있을 겁니다."
          - "사내가 장부에 무언가를 적었다. 펜 소리가 칼질 소리처럼 들렸다."
          - 속마음: "(게임에선 실패하면 다시 불러오면 됐다. 여기선 이자가 붙는다.)"
        effects: ["debt += 10", "stress += 10"]
    - text: 가진 돈으로 일부를 갚는다 (은화 20)
      requires: "money >= 20"
      effects: ["money -= 20", "debt -= 30", "stress -= 5"]
      lines:
        - "지갑을 열어 은화 스무 닢을 세었다. 손이 조금 떨렸다. 한 달을 아껴 모은 돈이다."
        - "사내가 동전을 하나하나 장부 위에 쌓았다. 탑이 생각보다 낮다."
        - "── 성의는 확인했습니다."
        - "── 이자분은 이걸로 덮어 드리지요."
        - "대리인이 장부에 줄 하나를 그었다. 긴 숫자 목록 중 겨우 한 줄."
        - 속마음: "(한 줄. 그래도 한 줄이다.)"
    - text: 인파 속으로 도망친다
      effects: ["stress += 5", "stat.민첩 += 0.5"]
      lines:
        - "대답 대신 생선 수레 뒤로 뛰었다."
        - "얼음 조각이 튀고 생선 장수가 욕을 했다. 뒤돌아보지 않고 골목으로 꺾었다."
        - "대리인은 뛰지 않았다. 뛰지 않아도 된다는 듯이."
        - "── 은행은 기다릴 줄 압니다, 도련님!"
        - "그 목소리가 골목 세 개를 지나도록 들렸다."
        - 속마음: "(도망친 건 몸이고, 빚은 제자리다. 알고 있다.)"

- id: home_noble_brother
  title: 장벽에서 온 편지
  art: dorm_room
  on: auto
  free: true
  window: { from: "1.5", to: "1.6" }
  chance: 0.15
  when: "origin == '몰락귀족'"
  lines:
    - "밤. 기숙사 책상 위에 편지 한 통이 놓여 있다. 사감이 낮에 넣어 둔 모양이다."
    - "잿빛 장벽 수비대 인장이 찍힌 편지. 봉투가 먼지와 그을음으로 회색이다."
    - "큰형이다. 글씨가 군인답게 각져 있다. 한 획도 망설임이 없다."
    - "봉투를 열자 마른 풀 냄새와 쇠 냄새가 났다. 장벽의 냄새일까."
    - "── 막내 보아라."
    - "── 아카데미는 버틸 만하냐. 가문 이름 따윈 신경 쓰지 마라. 그건 이미 은행 장부 속에나 있다."
    - "── 여기는 춥다. 5월인데도 아침이면 투구에 서리가 낀다. 장벽 너머의 바람은 계절을 모른다."
    - "── 그리고 밤마다 결계가 운다."
    - "── 늙은 병사들은 바람 소리라는데, 바람은 저렇게 박자를 맞춰 울지 않는다."
    - "── 둘째 소식은 나도 모른다. 혹시 도시에서 보거든, 형이 화 안 났다고 전해라."
    - "편지지 아래쪽에 지운 흔적이 있다. 몇 줄을 쓰다가 굵게 그어 버렸다. 읽을 수 있는 건 '아버지는' 세 글자뿐이다."
    - 나레이션:
        - "── 살아남는 법을 배워라. 검이든 마법이든 도망이든."
        - { when: "debt <= 0", text: "── 살아남는 법을 배워라. 그리고 빚을 정리했다는 소식은 들었다. 네가?" }
    - 나레이션:
        - "── 그게 우리 가문에 남은 유일한 가훈이다."
        - { when: "debt <= 0", text: "── 아버지가 편지를 들고 한참 우셨다. …잘했다, 막내." }
    - "── 추신. 아카데미 식당 스튜는 아직도 감자만 들어 있냐."
    - "편지 끝에 서명 대신 그림이 하나 있다. 서툰 솜씨로 그린 작은 검."
    - 속마음: "(형제끼리의 표시 같은 걸까. 이 몸은 이 그림을 안다. 나는 모른다. 그런데도 손가락이 그 검을 쓸어 본다.)"
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(5년차 잿빛 장벽 대전투.)"
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(원작에서 이름 없는 귀족 장교들이 무더기로 쓰러지는 전투다. 이름 없는… 형도 거기 있을까.)"
    - "창밖으로 바람이 불었다. 박자 없이. 다행이다."
    - "편지를 접어 베개 밑에 넣었다. 이 몸이 늘 그렇게 했던 것처럼, 손이 먼저 움직였다."
    - 속마음: "(답장을 써야 한다. 무엇을 물을까. 아니면, 무엇을 묻지 말까.)"
  choices:
    - text: "\"형도 살아남아\"라고만 답장을 쓴다"
      effects: ["stress -= 10", "stat.의지 += 1"]
      lines:
        - "펜을 들었다. 쓰고 싶은 말이 많았다. 그 장벽이 몇 년 뒤에 어떻게 되는지까지."
        - "다 지우고 한 줄만 남겼다."
        - "── 형도 살아남아."
        - "짧게 썼다. 형이 좋아할 말은 그것뿐이라는 걸, 이 몸은 알고 있었다."
        - "봉투 귀퉁이에 작은 검을 하나 그렸다. 형의 것보다 더 서툴게."
        - 속마음: "(이름 없는 장교 한 명. 그 한 명을 위해서라도, 장벽은 버텨야 한다.)"
    - text: 결계가 운다는 이야기를 자세히 묻는다
      effects: ["stat.지성 += 1", "stress += 3"]
      lines:
        - "답장에 질문을 빼곡히 적었다."
        - "언제부터 우는지. 하룻밤에 몇 번인지. 어떤 박자인지. 우는 곳이 장벽의 어느 구간인지."
        - "형은 귀찮아하겠지. 그래도 대답은 해 줄 사람이다. 각진 글씨로, 하나도 빼놓지 않고."
        - 속마음: "(원작의 장벽은 9년차에 무너진다.)"
        - 속마음: "(그런데 벌써 우는 소리가 난다면… 봉인은 생각보다 오래전부터 삐걱대고 있었던 거다.)"
        - "봉투를 봉하려다 알았다. 질문만 열네 개를 적고, 안부는 한 줄도 묻지 않았다."
        - "맨 위에 한 줄을 끼워 넣었다. ─ 형, 밥은 먹어?"
        - "마지막 줄에 덧붙였다. 결계가 우는 밤엔 투구를 쓰고 자라고."

# ---------------------------------------------------------------- 악역 도련님 (에드릭 벨모어)
- id: home_villain_maid
  title: 벨모어가의 바구니
  art: dorm_hall
  on: auto
  free: true
  window: "1.4"
  chance: 0.25
  when: "origin == '악역도련님'"
  lines:
    - "토요일 아침, 기숙사 현관."
    - "현관 바닥에 아침 햇살이 길게 누웠다. 주말이라 학생들이 느릿느릿 오간다."
    - "벨모어가 하녀복을 입은 소녀가 바구니를 안고 서 있다. 열다섯쯤 됐을까."
    - "바구니가 커서 소녀의 얼굴이 반쯤 가려져 있다."
    - "현관을 지나는 학생들이 소녀를 힐끔거린다. 앞치마에 수놓인 벨모어가 문장 때문이다."
    - "바구니 위에 덮인 천에서 갓 구운 빵 냄새가 난다. 저택 부엌의 냄새다."
    - "소녀는 바구니 손잡이를 너무 세게 쥐고 있었다. 손마디가 하얗다."
    - "그 왼쪽 손목에 누렇게 바랜 멍 자국이 있다."
    - "오래된 멍이다. 노랗게 빠져 가는 중인데도, 손가락 모양 그대로 남아 있다."
    - "학생 몇이 소녀와 나를 번갈아 본다. 벨모어가 도련님과 하녀. 소문거리의 냄새를 맡은 얼굴들이다."
    - "계단 몇 칸 위에서 걸음을 멈췄다. 소녀가 나를 올려다봤다. 들이쉰 숨을 내쉬지 못하고 있다."
    - 속마음: "(원작의 에드릭이 비튼 손목이다. 1권 회상 장면에 딱 한 컷 나왔던.)"
    - 속마음: "(그 컷 속의 에드릭은 웃고 있었다. 지금 그 얼굴이, 내 얼굴이다.)"
  branch:
    - when: "servant.trust >= 2"
      lines:
        - 하인@웃음: "도련님! 집사님이 도시락 전해 드리래요."
        - 하인: "요리장님이 도련님 좋아하시는 걸로… 꿀 바른 사과 파이랑, 훈제 오리랑…"
        - "소녀가 말을 하다 말고 얼굴을 붉혔다. 예전 같으면 상상도 못 했을 수다다."
        - 하인@당황: "아, 죄송해요. 말이 많았죠."
        - 하인: "저택 사람들 요즘 도련님 얘기만 해요. 사람이 달라지셨다고."
        - 하인@웃음: "정원사 할아버지는 도련님이 머리를 다치신 거라던데요. 아, 이것도 죄송해요!"
        - 속마음: "(머리를 다친 게 아니라 머릿속이 바뀌었다. …틀린 말은 아니네.)"
    - when: "servant.trust >= 1"
      lines:
        - 하인: "집사님이… 전해 드리라고 하셨습니다."
        - "소녀는 바구니를 내밀고 고개를 숙인 채 한 걸음 물러섰다."
        - "눈을 마주치지 않는다. 그래도 도망치지는 않았다."
        - "예전의 저택이었다면 이 소녀는 바구니를 문 앞에 두고 달아났을 것이다. 그런 얼굴이다."
        - 하인: "…저, 저택은 별일 없습니다. 도련님."
        - 속마음: "(한 걸음 물러섰지만, 도망치지는 않았다. 그 한 걸음의 차이가 서장의 사과였다.)"
    - lines:
        - "소녀가 바구니를 내밀다가 내 눈과 마주쳤다."
        - "바구니가 떨어졌다. 사과가 계단을 굴러 내려갔다. 데굴, 데굴, 데굴."
        - 하인@놀람: "죄, 죄송합니다! 죄송합니다, 도련님…!"
        - "소녀의 무릎이 꺾이려 한다. 고개가 먼저 숙여지고, 어깨가 움츠러든다."
        - "맞을 준비를 하는 사람의 자세다."
        - "현관의 학생들이 걸음을 멈췄다. 벨모어가 도련님이 하녀를 어떻게 하는지 보려고."
        - 속마음: "(원작대로라면 여기서 에드릭은 사과를 짓밟는다. 위키엔 '하녀 학대 연출'이라고만 적혀 있었다.)"
  choices:
    - text: "\"손목은… 괜찮아?\""
      effects: ["servant.trust += 1", "stress -= 5", "edric.reformed += 1"]
      lines:
        - 나: "손목은… 괜찮아?"
        - "소녀가 손목을 소매로 가리며 눈을 크게 떴다."
        - 하인@놀람: "…네? 아, 네. 이제 안 아파요."
        - "거짓말이다. 소매를 내리는 손짓이 너무 빠르다."
        - 나@진지: "그때 일, 미안했어. 변명은 안 할게."
        - "소녀는 한참 대답하지 못했다. 입술만 몇 번 달싹였다."
        - 하인: "…도련님이, 사과를…"
        - "현관에 바람이 불었다. 굴러간 사과 하나가 계단 끝에서 멈췄다."
      branch:
        - when: "servant.trust >= 2 and not servant.warning"
          lines:
            - "돌아서던 소녀가 멈칫하더니, 작은 목소리로 덧붙였다."
            - 하인@진지: "집사님이요… 도련님이 혹시 이런 말씀을 하시면 꼭 전하라고 했어요."
            - 하인: "미궁에 가시거든 3층 안쪽은 피하시래요."
            - 하인: "요즘 흉한 소문이 돈대요. 밤에 로브 입은 사람들이 드나든다고."
            - 속마음: "(원작의 에드릭에게는 아무도 해 주지 않은 말이다.)"
            - 속마음: "(사과 한 마디가 경고 한 마디가 되어 돌아온다. 원작은 이 계산을 끝내 보여 주지 않았다.)"
          effects: ["servant.warning = 1"]
        - lines:
            - "소녀는 고개를 꾸벅 숙이고 돌아갔다."
            - "돌아가는 길에 소녀는 두 번 돌아봤다."
            - "두 번째엔, 아주 조금 웃은 것 같았다."
    - text: 고맙다고 하고 바구니를 받는다
      effects: ["servant.trust += 0.5"]
      lines:
        - 나: "고마워. 집사님께도 잘 받았다고 전해 줘."
        - "바구니를 받았다. 생각보다 무겁다."
        - "소녀가 제 귀를 의심하는 얼굴을 했다."
        - 하인@당황: "…네, 네! 꼭 전할게요!"
        - "바구니 안엔 빵과 사과와, 작은 쪽지. ─ 끼니 거르지 마십시오. 집사."
        - "소녀는 인사를 세 번이나 하고 돌아갔다. 계단에서 한 번 넘어질 뻔했다."
    - text: 말없이 바구니만 받는다
      lines:
        - "말없이 바구니만 받았다."
        - "소녀는 안도한 얼굴로 돌아갔다. 맞지 않았다는 안도."
        - "원작의 에드릭이 늘 그랬듯이."
        - "현관의 학생들이 시시하다는 듯 흩어졌다."
        - "바구니는 그날 저녁까지 책상 위에서 식어 갔다."
        - 속마음: "(때리지 않았다. 그것만으로 안도하게 만든 게, 이 몸의 지난 몇 년이다.)"

- id: home_villain_father
  title: 벨모어 백작의 마차
  art: academy_gate
  on: auto
  free: true
  window: { from: "1.5.3", to: "1.6.4" }
  chance: 0.2
  when: "origin == '악역도련님' and fired.y1_labyrinth and fate.edric != 'dead'"
  lines:
    - "정문 앞이 웅성거린다."
    - "벨모어가 문장이 박힌 검은 마차가 섰다. 마차를 끄는 말 네 마리가 전부 검은색이다."
    - "학생들이 수군대며 길을 비킨다. 정문 경비병조차 한 걸음 물러섰다."
    - 학생 A: "벨모어 백작이 직접 왔대…"
    - 학생 B: "미궁 일 때문인가? 쉿, 들린다."
    - 마부: "도련님. 백작님께서 잠시 뵙자십니다."
    - "마부는 마차 문을 열지 않았다. 열라는 지시를 받지 못한 얼굴이다."
    - "마차 창이 반만 내려갔다."
    - "이 몸의 아버지, 벨모어 백작. 은빛이 섞인 검은 머리, 지팡이를 쥔 하얀 장갑."
    - "내리지는 않는다."
    - "마차 안에서 묵은 향 냄새가 흘러나왔다. 이 몸이 어릴 때부터 맡아 온, 서재의 냄새."
    - 나레이션:
        - "── 미궁에서 쓰러졌다고 들었다. 벨모어의 이름으로 그런 추태를."
        - { when: "fate.edric == 'alive'", text: "── 미궁 실습에서 혼자 멀쩡히 걸어 나왔다지. 남들이 쓰러질 때 서 있는 것. 그게 벨모어다." }
    - when: "fate.edric == 'alive_scarred'"
      나레이션: "가슴의 흉터가 당긴다. 백작의 시선이 잠깐 그 자리에 머물렀다가 비켜 갔다."
    - "── 그리고."
    - "── 3층에서 무슨 목소리를 들었다는 얘기가 있던데."
    - "백작의 목소리가 아주 조금 낮아졌다."
    - "── 그 얘기는 아무한테도 하지 마라. 아무한테도."
    - "창 너머 백작의 눈이 처음으로 흔들렸다. 아주 잠깐."
    - 속마음: "(그날 통로 안쪽에서 나를 부르던 목소리.)"
    - 속마음: "(…이 몸이 기억한다. 5년 전에 죽은 어머니 목소리였다.)"
    - 속마음: "(원작의 에드릭은 그 목소리를 따라갔다. 그리고 돌아오지 않았다.)"
    - 속마음: "(이 사람은 그 목소리를 알고 있다. 왜.)"
  plants:
    - { id: F22, notice: { value: "stat.지성 + 15 * talent.몸주인의잔재", dc: 20 } }
  choices:
    - text: "\"어머니 목소리였어요\""
      effects: ["stat.의지 += 1", "stress += 5"]
      lines:
        - 나: "어머니 목소리였어요."
        - "마차 안이 조용해졌다. 말들이 발을 구르는 소리만 들린다."
        - "백작의 손이 지팡이 손잡이를 하얗게 쥐었다. 장갑 위로 뼈마디가 솟았다."
        - "── …네 어미는 봄 축제를 좋아했다."
        - "── 내가 못 가게 했지. 천한 곳이라고."
        - "백작은 그 말을 하고 창밖이 아닌, 마차 천장을 봤다."
        - "── 마부, 출발해."
        - "창이 올라갔다. 대답은 끝내 듣지 못했다."
        - "하지만 대답이 없다는 것도 대답이었다."
        - 속마음: "(이 사람도 그 목소리를 들은 적이 있다. 틀림없이.)"
    - text: "\"걱정해 주셔서 감사합니다, 아버지\""
      effects: ["stress -= 5"]
      lines:
        - 나: "걱정해 주셔서 감사합니다, 아버지."
        - 나레이션:
            - "백작이 처음으로 나를 똑바로 봤다."
            - { when: "edric.reformed >= 1", text: "백작이 처음으로 나를 똑바로 봤다. ─ 하인들이 편지를 쓰더군. 네가 사과를 하고 다닌다고." }
        - 나레이션:
            - "원작의 에드릭이라면 대들거나 울었을 것이다."
            - { when: "edric.reformed >= 1", text: "원작의 에드릭이라면 평생 듣지 못했을 말이다." }
        - "백작의 입술이 한 번 열렸다 닫혔다."
        - "── …몸조심해라."
        - "── 벨모어의 이름은 지금 너 하나다."
        - "창이 올라가고 마차가 떠났다. 말발굽 소리가 평소보다 느렸다."
        - 속마음: "(걱정했다는 말은 하지 않는다. 그래도 왔다. 이 사람에겐 그게 최선인 모양이다.)"
    - text: 고개를 숙이고 침묵한다
      effects: ["stress += 8"]
      lines:
        - "고개를 숙였다. 아무 말도 하지 않았다."
        - "마차는 대답을 기다리지 않고 떠났다."
        - "마부만이 떠나기 전에 한 번 고개를 숙였다. 아주 짧게."
        - "흙먼지가 가라앉을 때까지 고개를 들지 않았다."
        - "원작의 에드릭은 어머니가 죽은 뒤로 5년 내내 이렇게 고개를 숙였을 것이다."
        - 속마음: "(이 몸의 목이 그 자세를 기억한다. 너무 익숙해서 아프다.)"

# ---------------------------------------------------------------- 이름 없는 엑스트라
- id: home_extra_luggage
  title: 여관에서 온 짐
  art: dorm_room
  on: auto
  free: true
  window: { from: "1.3.2", to: "1.4.4" }
  chance: 0.15
  when: "origin == '엑스트라'"
  lines:
    - "기숙사 사감이 작은 짐 꾸러미를 건네줬다. 끈으로 대충 묶은 꾸러미다."
    - 사감: "아카데미 앞 여관에서 왔다. 받는 사람이 '그 조용한 학생'이라고만 적혀 있더군. 용케 찾았지."
    - 속마음: "(받는 사람, 그 조용한 학생. 엑스트라다운 배송이다.)"
    - "입학 전에 묵었던 그 싸구려 여관이다. 이 세계에서 눈을 뜬 첫날의 천장이 떠올랐다."
    - "삐뚤빼뚤한 쪽지가 붙어 있다."
    - "── 손님 방 침대 밑에서 나왔수. 손님 물건 맞지?"
    - "꾸러미를 풀었다."
    - "먼지 냄새가 훅 올라왔다. 여관 침대 밑에서 몇 달을 묵은 냄새다."
    - "낡은 털장갑 한 짝. 다 닳은 연필 세 자루. 그리고 손바닥만 한 찢어진 종잇조각."
    - "종잇조각에는 이 몸의 글씨로 반 줄이 적혀 있다."
    - "── …열 번째 겨울이 오기 전에, 이번엔 반드시…"
    - "뒤는 찢겨 나갔다."
    - "찢긴 자리가 거칠다. 급하게, 혹은 화가 나서 찢은 자국이다."
    - "숨이 멎었다. 열 번째 겨울."
    - 속마음: "(멸망까지 10년. 그걸 아는 건 나뿐인 줄 알았다.)"
    - 속마음: "(이번엔, 이라고 썼다. 이번엔. 그럼 지난번이 있었다는 건가.)"
    - "쪽지 맨 아래에 여관 주인이 한 줄을 더 적어 놓았다."
    - "── 근데 손님, 입학 전날 밤에 밤새 누구랑 얘기하던데."
    - "── 방엔 아무도 없었고. 괜찮수?"
    - "등 뒤가 서늘했다. 입학 전날 밤. 일찍 잠든 밤이다. 누구와 이야기한 기억은 없다."
    - when: "talent.몸주인의잔재"
      나레이션: "가슴 한쪽이 욱신거렸다. 내가 잠든 사이, 이 몸은 누구에게 말을 걸었던 걸까."
    - 속마음: "(이 조각을 어떻게 해야 할까.)"
  plants:
    - { id: F14, notice: { value: "stat.지성 + 15 * talent.몸주인의잔재 + 10 * item.일기장", dc: 22 } }
  choices:
    - text: 종잇조각을 일기장의 찢긴 자리에 대 본다
      when: "item.일기장"
      effects: ["stat.지성 += 1"]
      lines:
        - "트렁크 밑바닥에서 일기장을 꺼냈다. 마지막 장의 찢긴 자국."
        - "종잇조각을 그 자국에 대 봤다."
        - "결이 맞지 않는다. 종이 색도 미묘하게 다르다. 같은 장이 아니다."
        - "일기장에 남은 한 줄이 눈에 들어왔다. ── 바깥의 누군가에게 닿기를."
        - 속마음: "(그럼 이 몸의 주인이 찢어 낸 장은… 하나가 아니었다.)"
        - 속마음: "(바깥의 누군가에게 닿기를. 이번엔 반드시. …나는 대체 누구의 편지를 받은 걸까.)"
    - text: 털장갑을 껴 본다
      effects: ["stress -= 5"]
      lines:
        - "털장갑을 집어 들었다. 작다. 손가락 끝이 몇 번이나 기워져 있다."
        - "기운 실 색이 자리마다 다르다. 회색, 갈색, 남색. 그때그때 있는 실로 기운 것이다."
        - "누군가 이 몸에게 떠 준 장갑."
        - "손을 넣어 봤다. 손가락 끝이 꽉 낀다. 몇 년 전, 더 작았던 손에 맞춘 장갑이다."
        - when: "talent.몸주인의잔재"
          나레이션: "장갑을 끼자 이유 없이 눈물이 났다."
        - when: "talent.몸주인의잔재"
          나레이션: "이 몸은 이걸 떠 준 사람을 기억한다. 나는 모른다."
        - 속마음: "(엑스트라에게도 장갑을 떠 준 누군가가 있었다. 원작은 그걸 한 번도 보여 준 적이 없다.)"
    - text: 전부 트렁크 깊숙이 넣어 둔다
      effects: ["stress += 3"]
      lines:
        - "꾸러미를 다시 묶었다. 장갑도, 연필도, 종잇조각도."
        - "트렁크 맨 아래에 넣고 그 위에 옷을 덮었다. 한 번 더 덮었다."
        - "트렁크를 닫았다."
        - "종잇조각의 반 줄이 눈꺼풀 안쪽에 남았다. 열 번째 겨울이 오기 전에."
        - "열 번째 겨울. 손가락으로 세어 봤다. 지금은 첫 번째 봄이다."
        - "그날 밤은 늦게까지 잠들지 못했다. 트렁크 쪽에서는 아무 소리도 나지 않았는데도."

- id: home_extra_rollcall
  title: 출석부의 물음표
  art: classroom
  on: auto
  free: true
  window: { from: "1.5", to: "1.6" }
  slots: [방과후]
  chance: 0.3
  when: "origin == '엑스트라'"
  lines:
    - "방과 후 검술 이론 보충. 계단식 강의실에 늦은 오후 햇살이 비스듬히 떨어진다."
    - "칠판엔 '검의 세 가지 거리'라는 글씨가 반쯤 지워진 채 남아 있다."
    - "창가 자리에 앉아 노트를 폈다. 늘 앉던 자리다. 아마 아무도 모르겠지만."
    - "교관이 늦는다며 조교가 대신 출석부를 펼쳤다."
    - 학생 B@웃음: "오, 교관님 없다. 오늘 일찍 끝나는 거 아냐?"
    - 조교@화남: "꿈 깨라. 출석부터 한다."
    - 조교: "이름 부르면 대답해라. 아론. 베르타. 카를."
    - "대답이 차례로 이어진다. 내 차례가 다가온다."
    - "조교가 이름을 부르다 내 차례에서 멈췄다."
    - 조교@당황: "어… 이건 누구지?"
    - 조교: "이런 학생 있었나? 출석부엔 있는데."
    - 나레이션:
        - "교실 여기저기서 고개를 갸웃한다."
        - { when: "reputation >= 15", text: "교실 여기저기서 고개를 갸웃하다가, 누군가 말했다." }
    - 나레이션:
        - "몇 달째 같은 교실을 쓰는데, 아무도 내 이름을 모른다."
        - { when: "reputation >= 15", text: "─ 걔잖아, 요즘 여기저기서 이름 들리는. 조수가 그제야 출석부에 동그라미를 쳤다." }
    - 속마음: "(이름 없는 엑스트라. 원작에서 이 몸은 대사 한 줄 없이 배경에 서 있다가 사라지는 '학생 C'였다.)"
    - 속마음: "(위키에도 문서가 없었다. 만들까 하다가 말았던 기억이 난다. 적을 정보가 한 줄도 없어서.)"
    - when: "reputation < 15"
      나레이션: "옆자리 학생이 나를 쳐다본다. 진심으로 처음 보는 얼굴이라는 듯이."
    - when: "reputation < 15"
      학생 A: "…너 원래 여기 앉았었어?"
    - 속마음: "(손을 들까, 말까.)"
  choices:
    - text: 손을 들고 이름을 또박또박 말한다
      effects: ["reputation += 3", "stat.매력 += 0.5"]
      lines:
        - "손을 들었다. 강의실의 시선이 한꺼번에 몰렸다. 등에 땀이 났다."
        - 나: "{{player.name}}입니다. D반."
        - "목소리가 생각보다 크게 울렸다. 계단식 강의실 맨 위까지."
        - 조교: "아, 그래. …{{player.name}}. 미안하다. 출석부 글씨가 번져서."
        - "조교가 출석부에 이름을 고쳐 적었다."
        - "맨 뒷자리 몇 명이 내 이름을 따라 중얼거렸다. 처음 듣는 단어를 외우듯이."
        - 속마음: "(배경에서 한 발짝. 원작은 이런 걸 '이탈'이라고 부르겠지.)"
        - "수업이 끝나고 복도에서, 누군가 처음으로 내 이름을 불렀다. 지우개 좀 빌려 달라고."
    - text: 그냥 두기로 한다
      effects: ["stat.지성 += 0.5", "stress -= 3"]
      lines:
        - "손을 들지 않았다. 숨도 조금 죽였다."
        - "조교는 고개를 갸웃하다가 출석부에 '?'를 그리고 넘어갔다."
        - 조교: "…다음. 다니엘."
        - "옆자리 학생도 금세 관심을 잃었다. 나는 다시 배경이 되었다."
        - "노트 귀퉁이에 작은 물음표를 하나 그렸다. 조교의 것과 똑같이."
        - 속마음: "(보이지 않는다는 건, 아무도 막지 않는다는 뜻이다. 엑스트라의 특권이지.)"
        - 속마음: "(물음표 하나. 원작의 눈에 걸리지 않는 사람. 그게 지금의 내 무기다.)"
        - "수업이 끝나고 복도를 걸었다. 아무도 부르지 않았다. 편했다. 조금 쓸쓸했다."

# ---------------------------------------------------------------- 숲 출신 고아
- id: home_forest_owl
  title: 창틀의 부엉이
  art: dorm_room
  on: auto
  free: true
  window: "1.4"
  chance: 0.25
  when: "origin == '숲고아'"
  lines:
    - "밤. 창틀을 톡, 톡 두드리는 소리에 눈을 떴다."
    - "달빛 아래, 창틀에 부엉이 한 마리가 앉아 있다. 둥근 눈이 호박색으로 빛난다."
    - "왼쪽 깃털 끝이 하얗다."
    - "입이 먼저 움직였다. ─ 옹이."
    - "이 몸이 '옹이'라고 부르던 녀석이다. 부르자 부엉이가 고개를 반 바퀴 돌렸다. 대답처럼."
    - "창을 열자 옹이가 안으로 폴짝 들어와 책상 위에 앉았다."
    - "숲 냄새가 따라 들어왔다. 이끼와 송진과 젖은 흙."
    - "부엉이 발목에 끈 뭉치가 묶여 있다."
    - "글이 아니라 매듭이다. 숲지기 할멈은 글을 모른다."
    - "끈을 풀어 손바닥에 올렸다. 굵은 매듭, 가는 매듭, 두 번 꼬인 매듭."
    - "머리가 읽기 전에 손가락이 먼저 매듭을 읽었다. 이 몸의 손가락이."
    - "── 밥 먹어라."
    - "── 사람 많은 데선 등을 벽에 대고 자라."
    - "── 봄 숲 가장자리 나무들이 속부터 마른다."
    - "── 신경 쓰지 말고 공부나 해라."
    - "매듭 끝에 마른 솔잎 하나가 끼워져 있다. 숲 냄새를 같이 보낸 거다."
    - 속마음: "(할멈. 이 몸을 키운 숲지기. 원작엔 이름도 대사도 없는 사람이다.)"
    - 속마음: "(그런 사람이 매듭 넷으로 이만큼을 말한다. 밥, 잠, 나무, 그리고 걱정.)"
    - when: "affinity.bruno >= 5"
      나레이션: "뒤에서 브루노가 비명을 질렀다. ─ 부, 부엉이! 방에 부엉이!"
    - when: "affinity.bruno >= 5"
      나레이션: "옹이가 날아올라 브루노 머리 위에 앉았다. 브루노가 그대로 굳었다."
    - when: "affinity.bruno >= 5"
      브루노@당황: "치, 친구야… 이거 물어? 물지? 물 것 같은데…"
    - 속마음: "(답장을 엮을까. 아니면… 세 번째 매듭이 자꾸 마음에 걸린다.)"
  choices:
    - text: 매듭으로 답장을 엮는다
      effects: ["stress -= 10", "stat.의지 += 0.5"]
      lines:
        - "책상 서랍에서 끈을 꺼냈다. 손가락이 알아서 움직였다."
        - "굵은 매듭 하나. 잘 지낸다."
        - "가는 매듭 둘. 밥 먹는다."
        - "그리고 처음 보는 모양의 매듭. 손가락이 잠깐 망설이다 엮었다. 친구가 생겼다."
        - 속마음: "(할멈은 이 매듭을 처음 받아 볼 거다. 이 몸은 친구를 만들어 본 적이 없었던 모양이다.)"
        - "옹이가 답장을 발목에 매달고 창밖으로 날아갔다."
        - "날갯소리가 하나도 나지 않았다. 달 쪽으로, 숲 쪽으로."
    - text: "'나무가 속부터 마른다'는 매듭을 다시 짚어 본다"
      effects: ["stat.지성 += 1"]
      lines:
        - 나레이션:
            - "같은 매듭을 몇 번이고 다시 짚었다. 할멈이 굳이 적어 보낸 건, 신경이 쓰인다는 뜻이다."
            - { when: "perk.고인물의기억 or perk.공략위키편집자", text: "같은 매듭을 몇 번이고 다시 짚었다. 세계수 고사는 원작에서 4년차부터다. 그런데 숲 가장자리는 벌써 마르고 있다." }
        - "속부터 마른다. 겉은 멀쩡하고, 속부터."
        - "끈을 쥔 손에 땀이 뱄다."
        - 속마음: "(1학년 봄에 마르는 숲 같은 건 원작에 없었다. …아니면 원작은 숲 가장자리까지는 보여 주지 않았던 걸까.)"
        - 속마음: "(세계수가 마르면 봉인이 약해진다. 봉인이 약해지면, 그다음은.)"
        - "옹이가 고개를 갸웃했다. 답장을 기다리는 눈치다."
        - "결국 매듭 하나만 엮어 보냈다. ─ 마른 나무, 더 알려 줘."

- id: home_forest_trail
  title: 몸이 기억하는 숲길
  art: forest
  on: 산책
  priority: 1
  window: { from: "1.5", to: "1.7" }
  when: "origin == '숲고아'"
  lines:
    - "주말 오후, 뒷산 깊숙이 들어갔다. 산책로가 끝나는 곳에서 몇 걸음 더."
    - "기숙사에선 한 번도 맡지 못한 냄새가 난다. 썩은 잎과 새순이 한데 섞인 냄새."
    - "숨을 깊게 들이쉬자 어깨에서 힘이 빠졌다. 이 몸이 오랜만에 집에 온 것처럼."
    - "숲 공기는 기숙사와 다르다. 축축하고, 차갑고, 살아 있다."
    - "새소리가 바뀌는 지점이 있다. 거기서부터가 진짜 숲이라고, 누가 가르쳐 줬다. 아마 할멈이."
    - "발이 저절로 낙엽이 덜 쌓인 쪽을 고른다. 짐승 길이다."
    - "도토리 껍데기가 깨진 자리, 이끼가 밟혀 눌린 자리. 눈이 그걸 읽기 전에 발이 먼저 피해 간다."
    - "나는 3,000시간 동안 모니터 앞에 앉아 있었다."
    - "그런데 이 몸의 다리는 바람 냄새로 방향을 안다. 비탈에선 발끝이 먼저 땅을 더듬는다."
    - "나무껍질의 긁힌 자국. 사슴이 뿔을 간 자리다. 손가락이 저절로 그 높이를 재고 있었다."
    - "어딘가에서 딱따구리가 나무를 두드린다. 딱, 딱, 딱. 할멈이 오두막 문을 두드리던 박자와 같다."
    - 속마음: "(이런 건 원작 스탯 어디에도 없었다. '숲 출신' 한 줄이 이 모든 걸 뜻했을 줄이야.)"
    - "덤불에 피 묻은 털 한 줌."
    - "손가락으로 집어 들었다. 아직 따뜻하다."
    - "붉은 갈색. 작은 짐승이 다친 채 이쪽으로 간 흔적이다. 핏방울이 아직 마르지 않았다."
    - when: "talent.짐승의혈통"
      나레이션: "코끝이 먼저 반응했다. 피 냄새. 작은 짐승, 다친 지 반나절."
    - 속마음: "(쫓아가 볼까. 이 몸을 믿고.)"
  check: { label: 흔적 추적, value: "stat.민첩 + stat.지성 / 2 + 10 * talent.자연친화력 + 10 * talent.짐승의혈통 + luck", dc: 28 }
  success:
    lines:
      - "핏방울을 따라 개울을 건넜다. 이끼 낀 바위, 꺾인 고사리."
      - "쓰러진 고목 아래에서 낑낑대는 소리가 났다."
      - "사냥꾼 덫에 다리가 걸린 여우 새끼가 이빨을 드러낸다. 털이 전부 곤두섰다."
      - "할멈이 가르쳐 준 대로 낮게 휘파람을 불었다. 두 음. 내려가는 음."
      - "여우가 이빨을 거뒀다. 귀가 천천히 눕는다."
      - "덫의 이를 벌렸다. 쇠가 손가락을 물려고 했지만, 손이 어디를 눌러야 하는지 알고 있었다."
      - "여우가 절뚝이며 덤불로 사라졌다. 한 번 돌아봤다."
      - "이 휘파람을 어디서 배웠는지, 나는 모른다. 입술이 기억하고 있었다."
      - 속마음: "(이 몸은 이 숲의 아이였다. 나는 그 아이의 기억을 빌려 쓰는 중이다.)"
    effects: ["stat.민첩 += 1", "stress -= 10"]
  fail:
    lines:
      - "핏방울을 따라 개울까지 갔다."
      - "흔적은 거기서 끊겼다. 물살이 냄새를 지워 버렸다."
      - "몸은 기억하는데, 머리가 따라가지 못했다. 다리는 이쪽이라는데, 눈은 저쪽이라고 한다."
      - "돌아오는 길에 길을 잃을 뻔했다. 해가 기울 때까지 같은 바위를 세 번 지났다."
      - "숲 출신 체면이 말이 아니다."
      - "바짓단이 온통 도깨비바늘투성이다. 하나씩 떼어 내다 포기했다."
      - "숲은 이 몸을 기억하는데, 나는 아직 숲에 서툴다."
      - 속마음: "(할멈이 봤으면 혀를 찼겠지. …그 얼굴이 떠오르는 것 같아서, 조금 웃었다.)"
    effects: ["fatigue += 10"]
  branch:
    - when: "affinity.liana >= 15"
      art: cg_liana_forest
      lines:
        - "숲 입구로 내려오자, 약초 바구니를 든 리아나와 마주쳤다."
        - 리아나@놀람: "어? 너 산에서 내려와? 혼자?"
        - "리아나가 다가와 내 소매에 붙은 여우 털을 떼어 냈다. 손끝으로 비벼 보더니 코에 댔다."
        - 리아나: "너한테서 우리 마을 숲 냄새가 나."
        - 리아나@웃음: "…이상하지. 너랑 있으면 고향에 온 것 같아."
        - "리아나가 바구니에서 들꽃 한 송이를 꺼내 내 귀에 꽂았다. 숲에서 하는 인사라고 했다."
      effects: ["affinity.liana += 4"]

# ================================================================ 고인물의 기억
- id: vet_arena
  title: 고인물의 기억 — 경기장
  art: arena
  on: 훈련장
  priority: 1
  window: { from: "1.6.3", to: "1.7.1" }
  lines:
    - "훈련장 너머, 원형 경기장에서 망치 소리가 들린다."
    - "무투대회 깃발이 하나씩 올라가고 있다. 인부들이 관중석 나무판을 새로 깐다. 톱밥 냄새가 바람에 날린다."
    - "훈련을 마친 다리가 이끄는 대로 경기장 안에 들어섰다. 아무도 막지 않았다."
    - 상급생: "1학년, 거기 칠 안 말랐다! 셋째 칸은 밟지 마!"
    - "관중석 계단을 올랐다. 경고를 듣기도 전에 셋째 칸에 발을 디뎠다. 삐걱, 소리가 났다."
    - "그 소리에 머릿속에서 무언가가 딸깍 켜졌다."
    - 속마음: "(이 구도.)"
    - 속마음: "(원작 무투대회 결승 배경 그대로다. 관중석 셋째 칸, 깃발 일곱 개, 왼쪽 위 금 간 석상.)"
    - "고개를 들었다. 깃발이 일곱 개. 왼쪽 위 석상에 금이 가 있다. 실금 하나까지 똑같다."
    - 속마음: "(처음 결승에 갔을 때 저 석상 디테일을 구경하다가 카이든의 강타에 맞아 죽었지.)"
    - 속마음: "(그 뒤로 그 패턴을 수백 번 봤다.)"
    - "모래 깔린 경기장 바닥. 해가 기울어 그림자가 길다."
    - "저 한가운데 두 사람이 마주 서 있던 장면을, 수백 번 봤다."
    - 속마음: "(결승 BGM 「검과 검 사이」까지 들리는 것 같다. 전주가 길어서 늘 스킵했던.)"
    - "눈을 감았다. 화면 속 카이든의 움직임을 떠올린다."
  branch:
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      lines:
        - "떠올릴 필요도 없었다. 손가락이 먼저 기억했다. 컨트롤러 버튼을 누르던 순서."
        - 속마음: "(공격, 공격, 강타, 방어.)"
        - 속마음: "(강타 직전엔 왼쪽 어깨가 먼저 올라간다. 위키에 '어깨 보고 방어'라고 처음 적은 것도 나였다.)"
        - "눈을 떴다. 텅 빈 모래 위에서, 보이지 않는 카이든의 왼쪽 어깨가 올라가는 게 보이는 것 같았다."
        - 시스템: "기억 정리 — 카이든의 강타 예비 동작"
        - 속마음: "(…원작대로라면. 원작이 아직 원작이라면.)"
      effects: ["know.kaiden_shoulder = 1", "stat.지성 += 0.5"]
    - lines:
        - "그런데 떠오르지 않는다. 장면은 선명한데, 순서가 흐릿하다."
        - "머리를 쥐어짜듯 기억을 더듬었다."
      check: { label: 기억 더듬기, value: "stat.지성 + 10 * talent.완전기억 - 10 * talent.망각증 + luck", dc: 26 }
      success:
        lines:
          - "공격. 공격. 그리고—"
          - 속마음: "(…그래, 어깨다. 강타 직전에 왼쪽 어깨가 먼저 올라간다. 그걸 보고 막아야 했어.)"
          - "손바닥에 땀이 배어 있었다. 화면 앞에서 수백 번 졌던 그 손이다."
          - 시스템: "기억 정리 — 카이든의 강타 예비 동작"
          - 속마음: "(3,000시간이 헛것은 아니었다.)"
        effects: ["know.kaiden_shoulder = 1"]
      fail:
        lines:
          - "공격. 강타. 그다음은…"
          - 속마음: "(공격, 강타, 그다음이 뭐였더라. 3,000시간을 했는데 기억이 안 난다.)"
          - 속마음: "(이 몸의 머리가 내 기억을 다 담지 못하는 건가.)"
          - "관중석에 앉아 한참 머리를 감쌌다. 인부 하나가 어디 아프냐고 물었다."
          - 속마음: "(기억은 풍화된다. 원작 지식은 영원하지 않다. …적어 둬야 한다. 전부.)"
        effects: ["stress += 5"]

- id: vet_wiki_elvera
  title: 고인물의 기억 — 편집 전쟁
  on: 마법실습
  priority: 1
  when: "fs.F11.noticed and time.month >= 4"
  lines:
    - "마법 이론 수업. 창으로 들어온 햇살 속에서 분필 가루가 반짝이며 떠다닌다."
    - "엘베라 교수가 느긋한 손놀림으로 칠판에 봉인의 역사를 적는다."
    - 엘베라: "천 년 전. 초대 용사가 성검 에테르로 마왕을 봉인했어요. 여기까진 다들 알죠?"
    - "학생들이 하품 섞인 대답을 한다. 교과서 첫 장에 나오는 이야기다."
    - "엘베라가 다음 줄을 적는다. '마왕 이그니스'."
    - "분필이 그 이름 앞에서 아주 잠깐 멈춘다."
    - "숨 한 번 쉴 정도의 틈. 아무도 눈치채지 못했다. 나만 빼고."
    - 속마음: "(첫 수업 때도 그랬다. '이그니스… 님'.)"
    - 속마음: "(위키 '엘베라' 문서 토론 탭, 편집 이력 412개.)"
    - 속마음: "(한쪽은 '번역 오류다', 한쪽은 '의도된 복선이다'. 나는 후자였다.)"
    - 속마음: "(결국 관리자가 문서를 잠갔다.)"
    - 속마음: "(마지막 편집 요약은 이랬다. ─ 「제작진 답변 없음. 영원히 없을 듯.」)"
    - when: "perk.공략위키편집자"
      속마음: "(그 관리자가 나였지.)"
    - "엘베라가 분필을 내려놓고 돌아섰다. 웃는 얼굴이다. 500년 묵은 느긋한 웃음."
    - 엘베라@웃음: "자, 오늘은 여기까지. 봉인 술식의 구조는 다음 시간에 해요."
    - 속마음: "(그 '제작진'보다 답을 더 잘 아는 사람이, 지금 눈앞에서 분필을 내려놓는다.)"
  choices:
    - text: 수업이 끝나고 봉인의 역사에 대해 질문한다
      effects: ["affinity.elvera += 4", "stat.지성 += 0.5"]
      lines:
        - "학생들이 빠져나간 뒤, 교탁 앞으로 갔다."
        - 나: "교수님, 봉인의 역사에 대해 질문이 있어요."
        - 엘베라@웃음: "봉인의 역사? 좋은 질문이에요."
        - 엘베라: "교과서엔 '용사가 마왕을 봉인했다', 한 줄이죠. 그 한 줄을 쓰려고 몇 사람이 죽었는지는 안 나와요."
        - 엘베라@진지: "하지만 학생. 역사는 이긴 쪽이 쓰고, 오래 산 쪽이 고쳐 써요."
        - 엘베라: "둘 다 너무 믿지는 마세요."
        - "엘베라는 웃으며 책을 덮었다. 그 웃음 끝이 조금 쓸쓸했다."
        - 엘베라: "오래 산 쪽이 하는 말이니까, 이것도 반만 믿고요."
        - 속마음: "(오래 산 쪽이 고쳐 쓴다. 이 사람은 무엇을 고쳐 썼을까.)"
    - text: "노트 귀퉁이에 적는다 — '오역 아님. 직접 확인.'"
      effects: ["stat.지성 += 1"]
      lines:
        - "노트 귀퉁이에 작게 적었다."
        - "── 이그니스 앞에서 멈춤. 오역 아님. 직접 확인."
        - "펜 끝이 종이를 긁는 소리가 유난히 크게 들렸다."
        - "413번째 편집. 이번엔 아무도 되돌리지 못한다."
        - 속마음: "(3,000시간 만에 처음으로, 출처가 '직접 확인'인 정보다.)"
        - "고개를 들자 엘베라와 눈이 마주쳤다. 엘베라가 아주 살짝 고개를 기울였다. 그리고 다시 웃었다."
        - 속마음: "(…봤을까.)"

- id: vet_speedrun
  title: 고인물의 기억 — 최적 동선
  on: 식당
  priority: 1
  when: "perk.최적동선 or perk.공략위키편집자"
  lines:
    - "점심시간 식당. 문을 열자마자 스튜 냄새와 소음이 한꺼번에 덮쳐 온다."
    - "배식 줄이 입구까지 늘어섰다. 맨 끝에 서면 앉을 때쯤 수업 종이 칠 것이다."
    - "배가 울었다. 아침을 걸렀다."
    - "앞쪽에서 누군가 '감자 스튜 또야?' 하고 투덜댄다. 매일 들리는 투덜거림이다."
    - "줄을 따라 시선이 배식대까지 미끄러졌다. 기둥, 식탁, 배식대. 그 각도."
    - 속마음: "(원작 any% 스피드런 루트.)"
    - 속마음: "(식당 줄은 배식대 왼쪽 기둥과 세 번째 식탁 사이로 비스듬히 들어가면 충돌 판정이 없어서 건너뛸 수 있다.)"
    - 속마음: "(내 기록은 4시간 12분. 세계 2위.)"
    - 속마음: "(1위는 '망각_공식'이라는 계정이었다. 영상도, 해설도, 댓글도 없이 기록만 올라와 있던.)"
    - 속마음: "(…지금 생각하니 이상한 이름이다.)"
    - 속마음: "(망각. 개발사 이름이다. 공식 계정이 스피드런을? 그때는 다들 사칭이라고 웃어넘겼다.)"
    - "왼쪽 기둥과 세 번째 식탁 사이. 사람 하나가 겨우 지나갈 틈이 보인다. 화면에서 본 그대로."
    - "그 틈 앞 식탁엔 아무도 앉지 않는다. 기둥 그림자 때문에 어둡고 비좁은 자리다."
    - 속마음: "(현실에도 충돌 판정 버그가 있을까.)"
  choices:
    - text: 기둥과 식탁 사이로 비스듬히 파고든다 (민첩)
      lines:
        - "숨을 들이쉬고, 몸을 반쯤 비틀었다. 기둥과 식탁 사이로."
        - 속마음: "(각도는 손가락이 기억한다. 아니, 이번엔 어깨가 기억해야 한다.)"
      check: { label: 줄 건너뛰기, value: "stat.민첩 + 10 * talent.고양이반사신경 + luck", dc: 30 }
      success:
        lines:
          - "몸을 비틀어 기둥과 식탁 사이로 미끄러졌다."
          - "누군가의 팔꿈치를 스치고, 누군가의 쟁반 아래를 지나."
          - "정신을 차리니 배식대 맨 앞이다. 아무도 눈치채지 못했다."
          - "배식 아주머니가 눈을 깜빡이며 국자를 들었다. 언제 왔냐는 얼굴이다."
          - 속마음: "(…됐다. 이게 왜 되는 거야.)"
          - 속마음: "(이 세계, 정말로 그 게임이다. 버그까지 포함해서.)"
        effects: ["fatigue -= 10", "stress -= 5"]
      fail:
        lines:
          - "기둥과 식탁 사이에는 충돌 판정이 있었다."
          - "정확히는, 쟁반을 든 소녀가 있었다."
          - "주황색 단발이 눈앞에서 휙 돌았다. 두건 끝이 코를 스쳤다."
          - "감자 스튜가 하늘을 날았다."
          - "느리게. 아주 느리게. 스튜 덩어리가 천장 등불 빛을 받아 반짝였다."
          - "철퍽."
          - 도로시@웃음: "으악! …괜찮아요, 괜찮아요. 이거 실험하다 망한 스튜였어요. 오히려 고마워요."
          - 도로시@놀람: "근데 방금 어떻게 들어왔어요? 기둥이랑 식탁 사이로? 거기 사람 못 지나가는데."
          - 속마음: "(못 지나간다. 이제 알았다.)"
        effects: ["stress += 5", "affinity.dorothy += 2"]
    - text: 얌전히 줄을 선다
      effects: ["stat.의지 += 0.5"]
      lines:
        - "얌전히 줄 맨 끝에 섰다."
        - "앞사람 뒤통수를 보며 30분을 기다렸다."
        - "그 사이 앞사람이 머리를 몇 번 긁는지 셌다. 일곱 번."
        - 속마음: "(현실에는 리셋 버튼이 없다.)"
        - 속마음: "(동선을 짜는 건 시간을 아끼려는 게 아니라, 실수를 줄이려는 거다.)"
        - "스튜는 조금 식어 있었다. 그래도 맛있었다."

- id: vet_ending
  title: 고인물의 기억 — 서른일곱 번째
  art: cg_vet_37
  on: 산책
  slots: [밤]
  priority: 1
  window: { from: "1.4", to: "1.7" }
  lines:
    - "호숫가 언덕에 올라선 순간, 눈앞의 풍경이 무언가와 겹쳤다."
    - "이 각도를 안다."
    - "서른일곱 번째 엔딩의 마지막 컷. 저 첨탑이 불타고, 호수가 붉었다."
    - "검은 해 아래, 무너진 지붕들 사이로 붉은 물이 출렁이던 그 화면."
    - "눈을 깜빡였다."
    - 삽화: lake
    - "밤의 호숫가 언덕. 아카데미의 불빛이 물에 거꾸로 비친다. 첨탑, 시계탑, 기숙사 창 몇 개."
    - "바람이 없다. 물이 거울처럼 가만하다. 첨탑은 불타지 않는다."
    - "풀에 맺힌 이슬이 바짓단을 적신다. 차갑다. 이건 진짜다."
    - 속마음: "(37번 엔딩 「다시 처음으로」. 스태프 롤도 없이 문장 하나만 떴다.)"
    - 속마음: "(그리고 세계는, 다시 처음으로.)"
    - 속마음: "(그날 밤 커뮤니티엔 '진엔딩은 없다'는 글이 백 개쯤 올라왔다.)"
    - 속마음: "(나는 댓글을 달지 않았다. 그냥 다시 1회차를 시작했다.)"
    - 속마음: "(그리고 눈을 떴더니, 여기였다.)"
    - when: "fest.with and fest.with != 'alone'"
      속마음: "(…그런데 이 호숫가엔 축제 날 띄운 등불 조각이 아직 걸려 있다. 원작의 마지막 컷엔 없던 거다.)"
    - when: "fest.with and fest.with != 'alone'"
      나레이션: "물가 갈대에 걸린 종이 등 하나. 젖어서 글씨는 번졌지만, 누군가의 소원이었던 것."
    - when: "fest.with == 'alone'"
      나레이션: "언덕 아래로 축제 날 혼자 앉았던 둑이 보인다. 그날의 불꽃이 아직 눈꺼풀 안쪽에 남아 있다."
    - 속마음: "(지금, 여기서 할 수 있는 게 뭘까.)"
  choices:
    - text: 지금까지 바꾼 것을 손꼽아 센다
      effects: ["stat.의지 += 1.5", "stress -= 10"]
      lines:
        - "손을 펴고 하나씩 꼽아 보기로 했다. 원작과 달라진 것들을."
        - 나레이션:
            - "손가락을 접어 본다. 아직 하나도 접히지 않는다. 원작은 아직, 거의 그대로다."
            - { when: "world.collapse >= 5", text: "손가락을 접어 본다. 원작에 없던 장면이 몇 개 생겼다. 원작 붕괴도 {{world.collapse}}%." }
            - { when: "world.collapse >= 5 and (fate.sera == 'saved' or fate.sera == 'saved_quiet')", text: "손가락을 접어 본다. 세라는 학교에 남았다. {{if fate.edric and fate.edric != 'dead'}}에드릭도 살아 있다. {{/if}}원작 붕괴도 {{world.collapse}}%." }
        - "접은 손을 한참 내려다봤다."
        - 속마음: "(작다. 하지만 원작엔 없던 숫자다.)"
        - "손을 쥐었다 폈다. 손가락 열 개. 10년."
        - 속마음: "(한 해에 하나씩만 접어도, 끝에는 주먹이 된다.)"
    - text: 서른일곱 개의 엔딩 이름을 하나씩 떠올린다
      effects: ["stat.지성 += 1", "stress += 5"]
      lines:
        - "눈을 감고 엔딩 목록을 떠올렸다. 위키 엔딩 문서의 표 한 장."
        - "1번 「성검의 무덤」, 4번 「시든 숲의 무녀」, 12번 「황제 없는 겨울」, 19번 「마탑의 마녀」, 26번 「마검의 용사」……"
        - "하나하나 이름을 부를 때마다 장면이 따라왔다. 무덤, 시든 나무, 빈 옥좌, 불타는 탑."
        - "서른일곱 개를 다 세는 데 한참이 걸렸다. 전부 누군가의 이름이 묘비에 새겨진 채 끝났다."
        - "어떤 이름은 여러 묘비에 겹쳐 새겨져 있었다. 리아나. 가렌. 브루노."
        - "마지막으로, 마음속 목록 맨 아래에 빈칸 하나를 그렸다."
        - 속마음: "(38번. 아직 아무도 본 적 없는 엔딩.)"
        - 속마음: "(제목은 아직 없다. 내가 붙일 거다.)"
    - text: 남은 날을 센다
      effects: ["stat.의지 += 0.5", "stress += 3"]
      lines:
        - "손가락으로 날짜를 셌다. 입학식에서 지금까지. 그리고 지금부터 끝까지."
        - "{{if time.month == 4}}멸망까지 9년 10개월{{elif time.month == 5}}멸망까지 9년 9개월{{elif time.month == 6}}멸망까지 9년 8개월{{else}}멸망까지 9년 7개월{{/if}}."
        - "숫자로 말하니 길다. 날로 세면 삼천오백 일쯤."
        - 속마음: "(3,000시간 중에 이 세계에서 보낸 시간은 겨우 몇 달.)"
        - 속마음: "(게임에선 한 학기가 두 시간이었는데.)"
        - "호수 위로 바람이 한 줄 지나갔다. 거꾸로 비친 아카데미가 흔들렸다가, 다시 가만해졌다."
        - 속마음: "(시간은 이제 스킵되지 않는다. 그게 무섭고, 그게 다행이다.)"

- id: vet_meme
  title: 고인물의 기억 — 에휴 테크트리
  on: 식당
  pool: true
  when: "time.month >= 4"
  lines:
    - "저녁 식당. 스튜를 한 숟갈 뜨는데, 옆 식탁이 시끄럽다."
    - "학생 몇이 다음 학기 시간표를 펼쳐 놓고 머리를 맞대고 있다. 하나같이 얼굴이 어둡다."
    - 학생 A: "에테르 공학에 고대 룬학에 신학까지…"
    - 학생 B: "선택 과목이 이게 뭐야. 하나 들으면 다른 하나가 막히고."
    - 학생들: "에휴, 이게 무슨 테크트리야."
    - "숟가락을 떨어뜨렸다. 쨍그랑."
    - "터져 나오는 웃음을 참을 수가 없었다. 어깨가 들썩이고, 코로 스튜 냄새가 역류했다."
    - 속마음: "(에휴 테크트리. 에테크. 커뮤니티가 이 게임을 부르던 이름.)"
    - 속마음: "(이 세계 사람 입에서 들으니 배가 아프다.)"
    - 속마음:
        - "(리아나 2학년 여름 국룰. 브루노 '망치는 허리로' 짤. 카이든 어깨 탈골설. …다 같이 웃던 밈이었는데, 여기선 하나도 안 웃기다.)"
        - { when: "perk.데이터마이너", text: "(데이터마이닝 밈도 있었지. '청소부 검술 S = 개발자 손가락 미끄러짐'. …그 청소부는 진짜로 있었다.)" }
    - "웃음이 잦아들자, 이상하게 목이 메었다."
    - 속마음: "(같이 웃던 사람들은 지금 화면 너머에 있다. 아마 아직도, 진엔딩을 찾으면서.)"
    - "옆 식탁 학생들이 수상하다는 듯 나를 본다."
    - 학생 B@당황: "…쟤 왜 웃어? 우리 보고 웃는 거야?"
    - 속마음: "(변명을 해야 한다. 뭐라고 하지.)"
  choices:
    - text: "\"아니, 에휴 테크트리라는 말이 너무 찰져서\""
      effects: ["reputation += 2", "vet.meme = 1", "stress -= 5"]
      lines:
        - 나: "아니, 미안. 에휴 테크트리라는 말이 너무 찰져서."
        - 학생 A@놀람: "…에휴 테크트리?"
        - 학생 A@웃음: "푸하, 그거 좋다. 에휴 테크트리!"
        - 학생 B@웃음: "에휴 테크트리! 우리 시간표 이름 그걸로 하자!"
        - "옆 식탁이 숟가락으로 식판을 두드리며 웃었다. 그 웃음이 우리 식탁까지 번졌다."
