              - { when: "talent.혐오스러운분위기", text: "아무 말 없이 병만 오래 쳐다봤다. 상인의 이마에 땀이 맺히기 시작했다." }
          - 상인: "아이고, 졌다 졌어! 은화 여덟! 대신 어디 가서 이 가격 말하지 마!"
        choices:
          - text: 산다 (은화 8)
            requires: "money >= 8"
            effects: ["money -= 8", "item.강장제 += 1"]
            lines: ["병을 받아 들었다. 곰 쓸개 냄새는 안 나고 박하 냄새가 난다. 오히려 다행이다."]
          - text: 이긴 걸로 만족하고 돌아선다
            effects: ["stress -= 10"]
