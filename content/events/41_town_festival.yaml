# 축제, 도시와 주말, 고향과 출신, 고인물의 기억 (1학년 1학기)
#
# 1) 봄 축제: 5월 3주차 주말 (그날 앓아누우면 4주차 주말). 함께할 사람은 그동안 쌓은 인연에 따라 열린다.
#    fest_spring → fest_<사람> → fest_finale (불꽃) 순서로 이어진다.
#    fest.with = 함께한 사람 ('alone' 포함), fest.moment = 그 사람과 기억에 남을 장면을 만들었다 (인연 메모가 읽는다)
# 2) 주말 도시 외출 만남 풀 (town_*)
# 3) 출신별 과거: 편지, 방문, 몸이 기억하는 것 (home_*)
# 4) 고인물의 기억: 원작을 3,000시간 한 사람만 떠올리는 것 (vet_*)

# ================================================================ 봄 축제
- id: fest_spring
  title: 봄 축제
  art: festival
  on: auto
  window: { from: "1.5.3.주말", to: "1.5.4.주말" }
  slots: [주말]
  priority: 1
  announce: 봄 축제
  effects: ["stress -= 15"]
  lines:
    - "토요일 아침. 눈을 뜨기도 전에 북소리가 먼저 귀를 두드렸다."
    - "둥, 둥, 둥. 기숙사 창틀이 그 박자에 맞춰 가늘게 떨린다."
    - "창을 열자 달큰한 냄새가 밀려든다. 설탕 녹는 냄새, 버터 냄새, 숯불에 기름 떨어지는 냄새."
    - 나레이션:
        - "기지개를 켜자 등허리가 뻐근하다. 한 주 내내 몸을 혹사한 대가다."
        - { when: "fired.y1_labyrinth", text: "기지개를 켜자 미궁에서 부딪힌 어깨가 아직 욱신거린다. 그래도 오늘은 아무도 검을 들지 않는다." }
        - { when: "talent.병약", text: "기지개를 켜다 기침이 터졌다. 이마를 짚어 봤다. 다행히 열은 없다. 오늘만큼은 앓아누울 수 없다." }
    - "복도로 나가자 기숙사가 통째로 들떠 있다. 누군가는 셔츠를 다리고, 누군가는 거울 앞에서 머리를 세 번째 빗는다."
    - 동기@웃음: "야, 빨리 나와! 늦으면 사과사탕 다 팔린대!"
    - "창밖으로 첫 등불 줄이 걸리는 게 보였다. 사다리를 탄 인부가 이쪽을 향해 손을 흔든다."
    - "복도 끝에서 누군가 고함을 친다. ─ 정문 열렸다! 축제다!"
    - "루미에르 아카데미 봄 축제. 1년에 단 하루, 학교가 도시를 향해 정문을 활짝 여는 날이다."
    - "정문에서 중앙 광장까지 등불 줄이 이어진다."
    - "거미줄처럼 하늘을 가로지른 줄이, 바람이 불 때마다 한꺼번에 출렁인다."
    - "그 아래로 노점 천막이 꽃처럼 피어 있다. 빨강, 노랑, 연두. 꽃밭에 천을 덮어 놓은 것 같다."
    - "꼬치 굽는 연기, 설탕 녹는 냄새, 어딘가에서 둥둥 울리는 북소리."
    - "교복 사이로 도시 사람들이 섞여 든다. 장바구니를 든 아낙, 아버지 목에 올라탄 아이, 꼬치를 문 경비병."
    - "기숙사 문을 나서자마자 사과사탕 노점 주인이 길을 막았다."
    - 상인@웃음: "학생! 첫 손님이니까 맛보기는 공짜! 올해 사과는 남부산이야, 이가 시릴 만큼 달아!"
    - "얇게 썬 사과 조각에 붉은 설탕 옷이 입혀져 있다. 깨물자 바삭, 하고 유리 깨지는 소리가 났다."
    - 나레이션:
        - "달다. 혀끝이 저릴 만큼."
        - { when: "talent.대식가", text: "달다. 그리고 한 조각으로는 어림도 없다. 정신을 차려 보니 지갑을 열고 있었다." }
        - { when: "talent.혐오스러운분위기", text: "상인이 웃으며 내밀다가 내 얼굴을 보고 웃음을 거뒀다. 그래도 사과 조각은 무사히 내 손에 떨어졌다. 달다." }
    - 학생 A@웃음: "야, 오늘은 반 배지 안 달아도 된대. 교칙에 진짜 그렇게 써 있대."
    - 학생 B: "그러니까 1년에 하루, S반이랑 D반이 같은 줄에서 사과사탕 사는 날이지."
    - 학생 A: "그래 봤자 S반 놈들은 줄 맨 앞에 서 있겠지만."
    - "웃음이 터졌다. 오늘만큼은 S반도 D반도 없다. 꼬치 줄 앞에선 다들 똑같이 침을 삼킨다."
    - "광장으로 걸어가는 길. 노점 하나하나가 저마다의 목소리로 손님을 부른다."
    - 점원@웃음: "구운 옥수수요! 버터 듬뿍! 한 번 맛보면 내년까지 생각나요!"
    - 상인: "학생, 행운의 매듭 팔찌 하나 사 가! 연인한테 묶어 주면 10년은 간다니까!"
    - 속마음: "(10년이라. 장사꾼 입에서 나오니 묘하게 불길하다.)"
    - "유리구슬 노점 앞에서 꼬마 둘이 구슬 하나를 두고 가위바위보를 한다. 이긴 아이가 진 아이에게 구슬을 굴려 준다."
    - "한쪽에선 기사과 상급생들이 팔씨름 판을 벌였다. 구경꾼들이 은화를 걸고 고함을 친다."
    - when: "fired.y1_labyrinth"
      나레이션: "불과 몇 주 전, 미궁 3층의 피 냄새를 맡던 얼굴들이 지금은 솜사탕을 뜯고 있다."
    - when: "fired.y1_labyrinth"
      나레이션: "얼마 전 미궁 실습이 거짓말 같다. 다들 오늘은 웃고 있다."
    - when: "fate.edric == 'dead' and origin != '악역도련님'"
      나레이션: "광장 구석, 벨모어가 문장이 그려진 등불 하나에 검은 리본이 묶여 있다. 그 앞에 서는 사람은 없다."
    - when: "fate.edric == 'dead' and origin != '악역도련님'"
      속마음: "(원작에도 저 등불이 있었을까. 화면 구석의 배경이라, 한 번도 눈여겨본 적이 없다.)"
    - when: "origin == '악역도련님'"
      학생들: "벨모어 도련님도 축제에 오네… 미궁에서 살아 나왔다더니."
    - when: "origin == '악역도련님'"
      나레이션: "내가 지나가자 줄이 저절로 갈라진다. 꼬마 하나가 엄마 치맛자락 뒤로 숨었다."
    - when: "origin == '악역도련님'"
      속마음: "(벨모어가 문장 하나로 이 정도다. 원작의 에드릭이 몇 년에 걸쳐 쌓아 올린 평판이다.)"
    - when: "origin == '악역도련님' and fate.edric == 'alive_scarred'"
      나레이션: "인파에 떠밀릴 때마다 가슴의 흉터가 당긴다. 그래도 왔다. 원작의 에드릭은 이 축제를 보지 못했으니까."
    - when: "vet.meme"
      학생들: "야, 저 줄 봐. 에휴 테크트리다, 에휴 테크트리!"
    - when: "vet.meme"
      속마음: "(…내가 퍼뜨린 밈이 축제 인파 속을 돌아다닌다. 이 세계에 조금 미안해진다.)"
    - "광장 한가운데 나무 단상. 깃털 모자를 쓴 사내가 확성 마법이 걸린 나팔을 입에 댔다."
    - 진행자@웃음: "루미에르의 봄에 오신 여러분, 환영합니다!"
    - 진행자: "해가 지면 호수 위로 마탑 연합이 후원하는 불꽃이 올라갑니다! 좋은 자리는 일찍 잡으세요!"
    - 진행자@웃음: "그 전까지는 마음껏 먹고, 마음껏 웃으세요! 오늘 하루는 시험도 미궁도 없습니다!"
    - 관중: "와아아!"
    - "함성에 등불 줄이 흔들린다. 어디선가 꽃잎이 한 움큼 머리 위로 쏟아졌다."
    - "손바닥에 꽃잎 하나가 내려앉았다. 연분홍. 진짜 꽃잎이다. 화면 속 파티클이 아니라."
    - "고개를 들자 본관 옥상 난간에서 원예부원들이 꽃잎 바구니를 뒤집고 있다. 다들 웃고 있다."
    - 속마음: "(이벤트 CG 한 장, 대사 다섯 줄. 스킵하면 10초. 그게 내가 아는 봄 축제의 전부였다.)"
    - 속마음: "(그런데 지금은 누가 떨어뜨린 꼬치 막대를 밟았고, 누가 내 어깨를 치고 지나갔고, 배가 고프다.)"
    - when: "talent.대식가"
      나레이션: "배에서 천둥 같은 소리가 났다. 옆 사람이 북소리인 줄 알고 단상 쪽을 돌아봤다."
    - "광장 한가운데 서서 천천히 한 바퀴 둘러봤다."
    - "등불 아래로 수많은 얼굴이 지나간다. 그중 몇은, 이제 아는 얼굴이다."
    - when: "affinity.liana >= 8"
      나레이션: "원예부 천막. 연두빛 머리칼 사이로 뾰족한 귀가 보인다. 리아나가 꼬마들 머리에 들꽃 화관을 씌워 주고 있다."
    - when: "affinity.aren >= 8"
      나레이션: "사과사탕 노점 앞에 꼬마들이 바글바글하다. 그 한가운데서 모래색 머리 하나가 허우적거린다. 아렌이다."
    - when: "met.bruno or affinity.bruno > 0"
      나레이션: "힘자랑 천막 앞. 머리띠를 질끈 맨 브루노가 나를 발견하고 두 팔을 붕붕 휘두른다."
    - when: "rival.mirabel or affinity.mirabel >= 6"
      나레이션: "호숫가 불꽃 무대 뒤편. 붉은 머리 타래를 늘어뜨린 미라벨이 팔짱을 끼고 발사대를 노려보고 있다."
    - when: "affinity.kaiden >= 8"
      나레이션: "꼬치 노점 앞에서 회색 후드를 쓴 누군가가 주인과 실랑이 중이다. 후드 틈으로 백금빛 머리카락이 삐져나왔다."
    - when: "(fate.sera == 'saved' or fate.sera == 'saved_quiet') and affinity.sera >= 5"
      나레이션: "광장 끝 성교회 천막. 하얀 성가복을 입은 신입생들 맨 앞줄에 은발이 보인다. 세라가 악보를 꼭 쥐고 있다."
    - when: "found.dorothy or affinity.dorothy > 0"
      나레이션: "학생 식당 노점 뒤에서 보라색 연기가 피어오른다. 두건을 쓴 주황색 단발, 도로시가 몰래 냄비를 젓고 있다."
    - when: "origin != '악역도련님' and (fate.edric == 'saved' or fate.edric == 'saved_by_teacher')"
      나레이션: "고리 던지기 노점 앞에서 누가 '불량이잖아!' 하고 소리친다. 검은 머리에 비싼 옷. 에드릭이다."
    - when: "found.finn"
      나레이션: "그리고 인파 가장자리. 다들 버리고 간 꼬치 막대를, 잿빛 머리의 소년이 묵묵히 쓸어 담고 있다. 핀이다."
    - "물론, 아무에게도 가지 않아도 된다. 혼자 걸어도 축제는 축제다."
    - 속마음:
        - "(원작의 봄 축제. 호감도가 제일 높은 캐릭터가 알아서 찾아와 불꽃을 같이 보는 이벤트였다.)"
        - { when: "perk.공략위키편집자", text: "(원작의 봄 축제. 위키의 '축제 CG 해금 조건' 표를 만든 게 나였다. 호감도 1위가 알아서 찾아오는, 선택지 없는 이벤트.)" }
    - "잠깐 그 자리에 서서 기다려 봤다."
    - "아무도 화면을 하얗게 번지며 나타나지 않는다. 인파가 그냥 나를 밀고 지나갈 뿐이다."
    - 속마음: "(그래. 여긴 그런 데가 아니다.)"
    - "북소리가 다시 빨라진다. 등불 줄이 머리 위에서 출렁인다."
    - 속마음: "(호감도 순위 말고. 오늘, 누구 옆에서 불꽃을 보고 싶은지로.)"
    - 속마음: "(이번엔 내가 고른다.)"
  choices:
    - text: 원예부 천막의 리아나에게 간다
      when: "affinity.liana >= 8"
      next: fest_liana
    - text: 아이들에게 둘러싸인 아렌을 구하러 간다
      when: "affinity.aren >= 8"
      next: fest_aren
    - text: 힘자랑 천막 앞에서 손을 흔드는 브루노에게 간다
      when: "met.bruno or affinity.bruno > 0"
      next: fest_bruno
    - text: 불꽃 무대 뒤에서 팔짱 낀 미라벨에게 간다
      when: "rival.mirabel or affinity.mirabel >= 6"
      next: fest_mirabel
    - text: 꼬치 노점에서 실랑이 중인 회색 후드에게 간다
      when: "affinity.kaiden >= 8"
      next: fest_kaiden
    - text: 성가대 천막의 세라에게 간다
      when: "(fate.sera == 'saved' or fate.sera == 'saved_quiet') and affinity.sera >= 5"
      next: fest_sera
    - text: 식당 노점에서 수상한 냄비를 젓는 도로시에게 간다
      when: "found.dorothy or affinity.dorothy > 0"
      next: fest_dorothy
    - text: 고리 던지기 앞에서 씩씩대는 에드릭에게 간다
      when: "origin != '악역도련님' and (fate.edric == 'saved' or fate.edric == 'saved_by_teacher')"
      next: fest_edric
    - text: 쓰레기 자루를 끌고 가는 핀을 돕는다
      when: "found.finn"
      next: fest_finn
    - text: 혼자 걷는다
      next: fest_alone

# ---------------------------------------------------------------- 리아나: 소원 등
- id: fest_liana
  title: 봄 축제 — 소원 등
  art: cg_liana_wish
  next: fest_finale
  effects: ["fest.with = 'liana'", "affinity.liana += 4"]
  lines:
    - 삽화: festival
    - "원예부 천막은 광장 동쪽, 버드나무 그늘 아래 있다."
    - "천막 기둥마다 들꽃 다발이 매달려 있다. 민들레, 제비꽃, 이름 모를 하얀 꽃."
    - "흙냄새가 축제의 설탕 냄새를 살짝 밀어낸다. 여기만 공기가 조금 서늘하다."
    - "리아나가 들꽃 화관을 팔고 있다. 정확히는, 팔지 않고 나눠 주고 있다."
    - "꼬마 하나가 동전을 내밀자, 리아나는 동전 대신 그 손에 제비꽃 한 송이를 쥐여 줬다."
    - 리아나@웃음: "왔구나! 하나 써 봐. 오늘은 공짜야. 부장님한텐 비밀."
    - 원예부장: "리아나! 화관 몇 개 팔았어? 장부에 꼭 적어!"
    - 리아나@당황: "네에! 지, 지금 세고 있어요!"
    - "리아나가 혀를 쏙 내밀더니, 바구니에서 제일 큰 화관을 골라 내 머리에 얹었다."
    - 리아나: "음. 잘 어울린다. 토끼풀이 너한테 딱이야."
    - 나: "토끼풀이 어울린다는 건 칭찬이야?"
    - 리아나@웃음: "당연하지. 토끼풀은 밟혀도 다시 일어나거든. 엄마가 제일 좋아한 풀이야."
    - when: "talent.자연친화력"
      나레이션: "화관을 쓰자 시들어 가던 꽃잎이 도로 고개를 들었다."
    - when: "talent.자연친화력"
      나레이션: "리아나가 볼을 부풀린다. ─ 반칙이야, 그거."
    - "한참을 천막에서 꽃을 나눠 줬다. 리아나가 엮고, 내가 씌웠다."
    - "아이들이 화관을 쓰고 뛰어갈 때마다 리아나의 귀 끝이 기분 좋게 까딱거렸다."
    - 속마음: "(엘프 귀는 감정 모션이 따로 있었다. 기쁠 때 두 번 까딱. …방금 세 번 까딱했다.)"
    - "해가 기울자 리아나가 내 소매를 끌었다."
    - 리아나: "있잖아, 호수에 소원 등 띄우러 가자. 해 지기 직전에 띄워야 제일 멀리 간대."
    - "호수로 내려가는 언덕 계단. 종이 등을 든 사람들이 줄지어 내려간다."
    - "중간쯤에서 리아나가 멈춰 섰다. 한 손이 가슴께에 가 있다."
    - "숨소리가 얕다. 짧게, 짧게. 계단 열몇 칸에 낼 소리가 아니다."
    - 리아나@웃음: "…사람이 많아서 그래. 금방 괜찮아져. 진짜야."
    - "리아나는 웃으면서 다시 걸음을 뗐다. 내 소매를 쥔 손에 힘이 조금 더 들어가 있었다."
    - when: "note.note_liana.known"
      속마음: "(위키의 한 줄. '리아나: 계단을 오를 때 가슴을 짚는 모션 있음 — 복선'. 그 모션이 지금 내 소매 끝에 매달려 있다.)"
    - 삽화: cg_liana_wish
    - "물가에 닿자 버드나무 아래에 종이 등 노점이 있었다. 리아나가 등 두 개를 사서 하나를 내게 내밀었다."
    - "리아나는 등을 무릎에 올려놓고 붓으로 무언가 적더니, 손바닥으로 꾹 가렸다."
    - 리아나@당황: "보면 안 돼. 소원은 말하면 안 이루어진대."
    - 리아나: "너도 써. 대충 쓰면 안 돼. 호수 신령님이 글씨 못 알아보면 그냥 가라앉힌대."
    - 속마음: "(무슨 소원을 써야 할까. 이 세계에 와서 소원을 빌어 본 적이, 아직 없다.)"
  plants:
    - { id: F05, notice: { value: "stat.지성 + 25 * talent.직감 + 15 * talent.마력감응 - 20 * talent.눈치없음", dc: 30 } }
  choices:
    - text: "\"그럼 나도 네 소원이 이루어지게 빌게\""
      effects: ["affinity.liana += 4", "trust.liana += 5", "fest.moment = 1"]
      lines:
        - 나: "그럼 나도 네 소원이 이루어지게 빌게."
        - 리아나@놀람: "내 소원이 뭔지도 모르면서?"
        - 나: "몰라도 돼. 네가 그렇게 꼭 가릴 정도면, 좋은 소원이겠지."
        - "리아나가 한참 나를 봤다. 노을이 그 눈에 비쳐, 초록빛이 호박색으로 물든다."
        - "가렸던 손이 슬쩍 비켜났다. 동글동글한 글씨."
        - "── 내년 축제도 볼 수 있기를."
        - 리아나@웃음: "별거 아니지? 그래도 나한텐 큰 거야."
        - 리아나: "숲에서는 봄이 오는 게 당연했거든. 근데 여기 와서는… 이상하게 하나하나 세게 돼."
        - when: "note.note_liana.known"
          속마음: "(원작대로라면 그 소원은 이루어진다. 딱 한 번. 그다음 여름에 리아나는 없다.)"
        - "내 등에 같은 문장을 적었다. 내년 축제도."
        - "그리고 그 아래에 작은 글씨로 덧붙였다. 그다음 해도."
        - "두 등이 나란히 물 위로 떠났다. 바람이 둘을 같은 쪽으로 밀었다."
        - 리아나@웃음: "봐, 같이 간다. 신령님이 둘 다 읽었나 봐."
    - text: 내 등에 '리아나가 2학년 여름을 무사히 넘기기를'이라고 쓴다
      when: "note.note_liana.known"
      effects: ["affinity.liana += 2", "trust.liana -= 4", "mood.liana.불안 = 1"]
      lines:
        - "붓을 들었다. 손이 저절로 움직였다."
        - "── 리아나가 2학년 여름을 무사히 넘기기를."
        - 속마음: "(써 놓고 보니 너무 구체적이다. …괜찮다. 물에 띄우면 아무도 못 본다.)"
        - "등을 물에 띄우는 순간 바람이 불었다."
        - "내 등이 빙글 돌아 리아나 쪽으로 밀려간다. 하필이면 글씨가 위로 향한 채."
        - 리아나@놀람: "……2학년 여름?"
        - "리아나의 손에서 붓이 미끄러져 물에 떨어졌다."
        - 리아나@진지: "그때 무슨 일 있어? 너, 왜 그런 걸 소원으로 빌어?"
        - 나@당황: "그, 그냥… 합숙이 힘들다고 들어서."
        - 리아나: "…합숙이 힘들어서, 내가 무사히 넘기기를?"
        - "대답하지 못했다. 리아나는 웃으려다 그만두고, 떠내려가는 등을 오래 바라봤다."
        - "그 손이 다시 가슴께로 올라갔다가, 내 시선을 느끼고 내려갔다."
        - 속마음: "(아는 척을 너무 일찍 했다. 이 아이에게 나는 아직 그냥 원예부 동기다.)"
    - text: 들꽃으로 리아나의 화관을 하나 엮어 준다
      lines:
        - 나: "소원은 이따 쓸게. 그 전에, 잠깐만."
        - "물가 풀숲에서 들꽃을 한 줌 꺾었다. 토끼풀, 제비꽃, 하얀 별꽃."
        - 리아나@놀람: "어? 너 화관 엮을 줄 알아?"
        - 나: "아까 옆에서 백 개쯤 봤잖아."
      check: { label: 화관 엮기, value: "stat.마력제어 + stat.민첩 / 2 + 10 * talent.자연친화력 + luck", dc: 28 }
      success:
        lines:
          - "줄기를 꼬아 엮었다. 리아나가 하던 대로, 세 가닥을 하나로."
          - "마지막 매듭에 마력을 살짝 흘렸다. 꽃잎 끝이 은은하게 빛난다."
          - 리아나@놀람: "와…"
          - 리아나@웃음: "숲에서 엄마가 만들어 주던 거랑 똑같아. 매듭 끝에 빛 넣는 것까지."
          - 리아나: "그거 엘프 방식인데. 누구한테 배웠어?"
          - 나: "방금. 너한테."
          - "리아나는 자기가 쓰고 있던 화관을 벗고 내 걸 썼다."
          - 리아나@웃음: "어때? 하프엘프한테도 어울려?"
          - "불꽃이 끝날 때까지, 리아나는 그 화관을 벗지 않았다."
        effects: ["affinity.liana += 5", "trust.liana += 3", "fest.moment = 1"]
      fail:
        lines:
          - "줄기가 자꾸 끊어졌다. 세 가닥이 네 가닥이 되고, 네 가닥이 엉켰다."
          - "완성된 건 화관이라기보다 풀 뭉치에 가까웠다."
          - 리아나: "푸흡."
          - 리아나@웃음: "괜찮아, 마음은 전해졌어. …근데 진짜 엉망이다, 이거. 새 둥지 같아."
          - 나@당황: "새 둥지는 좀 심했다."
          - "리아나는 그래도 그걸 머리에 얹었다."
          - "풀잎이 귀에 걸려 엘프 귀가 간지럽다고 웃었다. 귀 끝이 까딱, 까딱."
          - 리아나: "이거 버리지 마. 기숙사 창가에 걸어 둘 거야."
        effects: ["affinity.liana += 3", "fest.moment = 1"]

# ---------------------------------------------------------------- 아렌: 용사님
- id: fest_aren
  title: 봄 축제 — 용사님
  art: cg_fest_aren
  next: fest_finale
  effects: ["fest.with = 'aren'", "affinity.aren += 4"]
  lines:
    - "사과사탕 노점 앞이 유난히 시끄럽다."
    - "꼬마 열댓 명이 누군가를 빙 둘러싸고 깡충깡충 뛰고 있다. 그 한가운데 모래색 머리가 허우적거린다."
    - 아이@웃음: "용사님! 성검 보여 주세요! 한 번만요! 진짜 한 번만!"
    - 아이: "용사님, 마왕 몇 마리 잡았어요? 백 마리? 천 마리?"
    - 아렌@당황: "어, 그게, 성검은 학교 보물고에 있어서… 아, 망토 잡아당기지 마…"
    - 아렌@당황: "그리고 마왕은 한 마리… 아니, 아직 한 마리도… 아무튼 안 잡았어!"
    - "꼬마들이 '에이—' 하고 야유를 보냈다. 그래도 놓아주지는 않는다."
    - "아렌이 인파 너머로 나를 발견했다. 구조 요청이 담긴 눈빛이다. 아주 절박한."
    - 속마음: "(용사 후보 아렌. 입학식 이후 학교 밖에서도 유명인이 됐다. 본인만 빼고 다 신났다.)"
    - "사과사탕 노점 주인에게 은화를 건넸다. 꼬마들 손에 사과사탕을 하나씩 쥐여 줬다."
    - 나: "얘들아, 용사님은 이제 마왕 잡으러 가셔야 해. 대신 사탕."
    - "사탕에 눈이 팔린 틈에 아렌의 손목을 잡아끌었다."
    - "수레 두 대 사이 좁은 틈에 숨자, 아렌이 털썩 주저앉았다."
    - 아렌: "살았다… 우리 마을 양털 깎기 축제엔 양밖에 없었는데."
    - 아렌@웃음: "양은 성검 보여 달라고 안 하잖아. 그냥 메에 하지."
    - 나: "메에 해 주지 그랬어."
    - 아렌@웃음: "했으면 더 따라왔을걸."
    - "아렌이 망토 끝을 털었다. 사탕 끈적이가 잔뜩 묻어 있다. 한숨 대신 웃음이 먼저 났다."
    - "숨을 고르던 아렌이 광장 너머 시계탑을 올려다봤다."
    - "해가 기울어 시계탑 첨탑 끝이 주황빛으로 물들어 있다. 커다란 분침이 덜컥, 한 칸 움직였다."
    - 아렌@진지: "…근데 이상하다."
    - 아렌: "저 시계탑, 처음 보는데. 꼭대기에서 불꽃 본 적이 있는 것 같아."
    - 아렌: "바람이 왼쪽에서 불어서 연기가 이쪽으로 왔었어. 눈이 매워서 울었는데, 누가 옆에서 웃었고."
    - 나@놀람: "…누가?"
    - 아렌@당황: "몰라. 꿈이었나? 하하, 나 오늘 사탕 너무 먹었나 봐."
    - 속마음: "(원작의 아렌은 1학년 봄 축제에 나오지 않는다. 그런 대사도 없었다.)"
    - 속마음: "(처음 보는 곳을 안다. 꿈처럼. …왜 지금 그 문장이 떠오르지. 그리고 세계는, 다시 처음으로.)"
    - 속마음: "(뭐라고 해 줘야 할까. 웃어넘길까, 아니면.)"
  plants:
    - { id: F41, notice: { value: "stat.지성 + 15 * perk.고인물의기억 + 10 * talent.직감", dc: 24 } }
  choices:
    - text: "\"전생에 와 봤나 보지\""
      effects: ["affinity.aren += 3", "aren.kind += 0.5", "fest.moment = 1"]
      lines:
        - 나: "전생에 와 봤나 보지."
        - 아렌@웃음: "전생? 하하, 전생에도 양치기였으면 어떡하지."
        - 나: "그럼 전생에도 양들이 성검 보여 달라고 했겠네."
        - 아렌@웃음: "메에, 메에. 용사님, 성검 좀. 메에."
        - "둘이서 수레 뒤에 쭈그려 앉아 한참 웃었다."
        - "꼬마 하나가 수레 틈으로 고개를 들이밀었다가, 양 흉내를 내는 용사님을 보고 실망한 얼굴로 돌아갔다."
        - 아렌: "전생이라. 그런 게 있으면… 나 거기서 뭐였을까."
        - 아렌@진지: "용사였으면 좋겠다. 아니, 용사 아니었으면 좋겠다. 모르겠다."
        - "농담처럼 넘겼지만, 아렌은 불꽃이 시작될 때까지 몇 번이고 시계탑 꼭대기를 올려다봤다."
        - 속마음: "(그 시선 끝에 뭐가 있는지, 나도 모른다. 3,000시간을 했는데도.)"
    - text: "\"용사님 소리, 많이 피곤하지?\""
      effects: ["affinity.aren += 4", "trust.aren += 6", "aren.kind += 1", "fest.moment = 1"]
      lines:
        - 나: "용사님 소리, 많이 피곤하지?"
        - "아렌의 웃음이 천천히 가라앉았다."
        - 아렌@슬픔: "…응."
        - 아렌: "다들 내가 뭘 할 수 있는지 아는 것처럼 말해. 마왕을 잡을 거래. 세상을 구할 거래."
        - 아렌@슬픔: "나는 모르는데. 어제는 목검 놓쳐서 내 발등 찍었는데."
        - 아렌: "고향 촌장님은 편지 첫 줄에 '용사님께'라고 써. 농담인 거 아는데, 그게 좀…"
        - "아렌은 말끝을 흐리고, 끈적한 손가락을 바지에 문질렀다."
        - 나: "여기선 그냥 사탕 잔뜩 묻은 양치기야."
        - 아렌@놀람: "…하하."
        - 아렌@웃음: "근데 너는 나를 그냥 아렌이라고 불러서 좋아."
        - "아렌이 먹다 남은 사과사탕을 반으로 쪼개 내밀었다. 손가락에 설탕이 잔뜩 묻어 있다."
        - 아렌: "반띵. 우리 마을에선 이게 친구 하자는 뜻이야. 방금 지어냈지만."
        - "사탕은 이가 시리게 달았다."
    - text: "\"용사니까 아이들한테 웃어 줘야지\""
      effects: ["affinity.aren += 1", "aren.arrogant += 0.5", "fest.parted = 1"]
      lines:
        - 나: "용사니까 아이들한테 웃어 줘야지."
        - 아렌@놀람: "…아."
        - 아렌: "…그런가. 그래야 용사지."
        - "아렌이 무릎을 털고 일어났다. 망토의 끈적이를 대충 손으로 훔친다."
        - 아렌@웃음: "그래. 용사가 수레 뒤에 숨어 있으면 안 되지. 꼬마들 실망하겠다."
        - "말은 밝았다. 웃는 얼굴도 밝았다. 너무 반듯하게 밝았다."
        - "아렌은 수레 뒤에서 나가 다시 꼬마들에게 둘러싸였다."
        - 아이@웃음: "용사님 돌아왔다! 성검! 성검!"
        - "인파 너머로 보이는 아렌의 웃는 얼굴이 조금 굳어 있었다."
        - 속마음: "(원작의 아렌은 늘 저 얼굴이었다. 플레이어가 고른 대사만 말하는, 반듯한 용사의 얼굴.)"
        - 속마음: "(…방금 그 대사를 고른 게, 나다.)"

# ---------------------------------------------------------------- 브루노: 힘자랑 종
- id: fest_bruno
  title: 봄 축제 — 힘자랑 종
  art: cg_fest_bruno
  next: fest_finale
  effects: ["fest.with = 'bruno'", "affinity.bruno += 4"]
  lines:
    - "광장 한가운데, 사람 키 세 배쯤 되는 나무 기둥이 서 있다."
    - "기둥 꼭대기에 놋쇠 종. 기둥을 따라 홈이 파여 있고, 아래 받침을 내려치면 쇠공이 홈을 타고 솟는다."
    - "힘자랑 천막이다. 구경꾼이 겹겹이 둘러섰다."
    - 상인@웃음: "자, 망치로 받침을 내려쳐서 종을 울리면 곰 인형! 기사과 3학년도 실패한 종이야!"
    - "천막 기둥에 매달린 곰 인형이 정말로 크다. 사람 몸통만 하다. 단추 눈 하나가 살짝 삐뚤다."
    - "방금 도전한 기사과 상급생이 망치를 내려놓고 어깨를 주무르며 물러난다. 쇠공은 기둥 3분의 2에서 멈췄다."
    - 상급생@화남: "…기둥에 기름칠한 거 아니야?"
    - 상인: "다음! 다음 용사 없나!"
    - "상급생이 투덜대며 사라지자, 구경꾼 사이에서 누가 킥킥 웃었다."
    - "그때 줄 끝에서 커다란 손이 하늘로 솟았다. 머리띠를 질끈 맨 브루노다."
    - 브루노:
        - "드디어 왔네! 내가 줄 서 있었어. 너 먼저 해 봐. 나는 마지막에 멋있게 할 거야."
        - { when: "origin == '악역도련님'", text: "어, 벨모어… 아니, 너. 오늘은 축제니까 봐준다! 너 먼저 해 봐. 나는 마지막에 멋있게 할 거야." }
    - 브루노@웃음: "아까 그 선배? 팔로만 쳤어. 소리만 들어도 알아. 땡, 이 아니라 퉁, 이잖아."
    - 브루노@웃음: "봐 봐, 저 기둥. 참나무에 쇠 띠 세 줄. 받침 스프링은 수레 판스프링을 재활용했고. 아저씨 솜씨 좋네."
    - 상인@놀람: "…학생 뭐 하는 사람이야?"
    - 브루노: "대장장이 아들이요!"
    - 브루노: "우리 동네 축제에도 이런 거 있었는데. 할아버지가 종을 다섯 번 연속으로 울려서 영영 출전 금지됐어."
    - 나: "다섯 번?"
    - 브루노@웃음: "다섯 번째에 종이 떨어졌거든. 그래서 금지."
    - 브루노: "요령은 하나야. 팔로 치면 반, 허리로 치면 전부. 할아버지가 그랬어."
    - when: "talent.천생신력"
      속마음: "(이 몸이라면… 종이 아니라 기둥이 부러질 수도 있겠는데.)"
    - when: "talent.키작음"
      상인@웃음: "학생, 망치 손잡이가 키 절반이네. 발판 갖다줄까?"
    - "상인이 망치를 내 쪽으로 내밀었다. 손잡이에 앞사람들 땀이 배어 반들반들하다."
    - "구경꾼들의 시선이 우리 쪽으로 쏠렸다. 덩치 큰 대장장이 아들과 그 친구. 누군가 은화를 걸기 시작했다."
    - 손님@웃음: "덩치 쪽에 은화 하나!"
    - 손님: "난 작은 쪽! 원래 이런 건 의외인 쪽이 이기는 거야!"
    - 속마음: "(원작의 힘자랑 미니게임은 타이밍 바였다. 초록 칸에 멈추면 끝. …현실엔 초록 칸이 없다.)"
    - 속마음: "(해 볼까. 아니면 브루노의 '멋있게'를 구경할까.)"
  choices:
    - text: 망치를 든다 (근력)
      lines:
        - "망치를 받아 들었다. 생각보다 무겁다. 손바닥에 나무 결이 거칠게 닿는다."
        - 브루노: "허리! 허리 잊지 마!"
        - "숨을 들이쉬고, 망치를 머리 위로 끌어올렸다."
      check: { label: 종 울리기, value: "stat.근력 + 5 * talent.천생신력 + 3 * talent.거구 + luck", dc: 30 }
      success:
        lines:
          - "땡!"
          - "놋쇠 종소리가 광장을 가로질렀다. 등불 줄이 그 소리에 맞춰 흔들린 것 같았다."
          - "한 박자 늦게 구경꾼들이 박수를 쳤다. 상인이 입을 떡 벌렸다."
          - 브루노@웃음: "봤냐! 내가 뭐랬어! 쟤가 내 친구라고!"
          - "브루노가 나를 번쩍 들어 올렸다. 발이 땅에서 떴다. 종보다 이쪽이 더 무섭다."
          - "곰 인형을 받았다. 브루노 몸통만 하다."
          - "브루노는 그걸 번쩍 들어, 옆에서 울던 꼬마에게 안겨 줬다. 풍선을 놓쳐서 울던 아이였다."
          - 브루노: "네가 딴 거지만, 쟤가 더 필요해 보여서. 괜찮지?"
          - 아이@웃음: "…곰! 곰이다!"
          - "꼬마는 자기보다 큰 곰을 질질 끌고 엄마에게 달려갔다. 브루노가 그 뒷모습을 보며 코 밑을 문질렀다."
        effects: ["affinity.bruno += 3", "stat.근력 += 0.5", "fest.moment = 1"]
      fail:
        lines:
          - "받침이 '퉁' 하고 울렸다."
          - "쇠공은 기둥 절반쯤에서 힘없이 떨어졌다. 구경꾼들 사이에서 '아이고' 소리가 났다."
          - 브루노@화남: "허리! 허리라니까! 팔로 치니까 그렇지!"
          - 나@당황: "허리로 쳤어. 내 허리가 팔만 했을 뿐이야."
          - 브루노@웃음: "푸하하! 그게 뭐야!"
          - "브루노가 대신 망치를 들었다. 어깨를 한 번 돌리고, 허리를 비튼다."
          - "쾅. 쇠공이 홈을 타고 솟아 종을 때렸다. 땡."
          - "곰 인형은 옆에서 울던 꼬마 품으로 갔다. 브루노가 망설임 없이 건넸다."
          - 브루노: "다음엔 네가 따서 줘. 그게 더 멋있으니까."
        effects: ["affinity.bruno += 2", "fest.moment = 1"]
    - text: 브루노를 응원한다
      effects: ["affinity.bruno += 3", "fest.moment = 1"]
      lines:
        - 나: "네가 해. 멋있게 하겠다며."
        - 브루노@웃음: "오, 기대해라."
        - 브루노: "잘 봐라. 이게 우리 할아버지한테 배운 망치질이다."
        - "브루노가 손바닥에 침을 퉤 뱉고 망치를 쥐었다."
        - "숨을 들이쉬고, 허리부터 몸을 비틀었다. 등 근육이 셔츠 너머로 꿈틀거린다."
        - "쾅."
        - "쇠공이 기둥을 타고 날아가 종을 들이받았다."
        - "종이 고리째 뜯겨 나가 하늘로 솟았다. 저녁 해를 받아 반짝, 반짝, 돌면서."
        - "광장이 조용해졌다. 모두가 고개를 젖히고 종을 눈으로 따라갔다."
        - "종은 천막 지붕에 떨어져, 데굴데굴 굴러, 상인 발치에 멈췄다. 땡."
        - "그리고 천막 주인이 비명을 질렀다."
        - 브루노@당황: "아, 아저씨! 제가 고칠게요! 저 대장장이 아들이에요! 진짜로요!"
        - "브루노는 불꽃이 시작되기 직전까지 종을 다시 달았다. 상품 곰 인형은 울던 꼬마에게 줬다."
        - 브루노@웃음: "봤지? 할아버지 피가 어디 안 간다니까. …종 값은 비밀로 해 줘."

# ---------------------------------------------------------------- 미라벨: 비틀린 술식
- id: fest_mirabel
  title: 봄 축제 — 비틀린 술식
  art: lake
  next: fest_finale
  effects: ["fest.with = 'mirabel'", "affinity.mirabel += 3"]
  lines:
    - "호숫가로 내려가자 축제 소리가 한 겹 멀어진다. 대신 물 냄새와, 무언가 타는 매캐한 냄새."
    - "물가에 나무 단을 높이 쌓은 불꽃 무대가 있다. 그 뒤편으로 발사대 열두 개가 하늘을 향해 비스듬히 누워 있다."
    - "마탑 연합 로브를 입은 마법사들이 발사대마다 분필로 술식을 새기고 있다. 서로 고함을 치면서."
    - "그 옆 버드나무 그늘에, 팔짱 낀 미라벨이 서 있다. 붉은 머리 타래가 바람에 살짝 흔들린다."
    - "미라벨은 마법사들의 손끝을 노려보고 있었다. 축제가 아니라 시험장에 온 사람처럼."
    - 미라벨:
        - "뭐야, 따라왔어? 불꽃 구경 온 거 아니야. 마탑 술식이 얼마나 조잡한지 확인하러 온 거지."
        - { when: "rival.mirabel", text: "D반이 여기까지 웬일이야. 불꽃 구경 온 거 아니야. 마탑 술식이 얼마나 조잡한지 확인하러 왔을 뿐이야." }
    - 나: "불꽃 무대 뒤까지 확인하러 오는 사람은 너밖에 없을 거야."
    - 미라벨@화남: "그러니까 내가 확인하는 거야. 아무도 안 하니까."
    - 미라벨: "저 사람들, 분필을 너무 세게 눌러. 술식은 새기는 게 아니라 얹는 거야."
    - 나: "얹는다?"
    - 미라벨@진지: "…설명해 줘도 모를 거야. 그냥 봐."
    - "── 시험 발사! 귀 막아! 마법사 하나가 외쳤다."
    - "첫 불꽃이 피융, 하고 솟았다."
    - "하늘에 닿기도 전에 지지직 꺼졌다. 연기만 한 줄 남는다. 마법사들이 당황해 서로를 본다."
    - "마법사 하나가 분필을 내던지며 욕을 했다. 다른 하나는 하늘에 대고 술식을 처음부터 다시 외운다."
    - 미라벨: "봐. 세 번째 고리가 비틀렸어."
    - 미라벨: "저대로 두면 본 공연 때 반은 불발이야. 마탑이 알면 웃겠네. …아, 쟤들이 마탑이지."
    - "미라벨이 코웃음을 쳤다. 그런데 그 코웃음이 길지 않았다."
    - "발사대를 보는 눈이, 조금 다른 걸 보고 있었다."
    - 미라벨@진지: "…예전엔 아델하이트가 이 축제 불꽃을 맡았어."
    - 미라벨: "아버지가 발사대에 서고, 나는 저택 발코니에서 봤지. 어머니 어깨 위에 올라앉아서."
    - 미라벨: "아버지는 마지막 불꽃을 쏘기 전에 꼭 발코니 쪽을 올려다봤어. 내가 보고 있나, 확인하려고."
    - 미라벨@슬픔: "그 마지막 불꽃은 늘 장미 모양이었어. 아델하이트의 장미."
    - "미라벨은 거기서 입을 다물었다. 호수 위로 물새 한 마리가 낮게 날아갔다."
    - "물가에 굴러다니던 분필 조각을 미라벨이 주워 들었다. 손끝으로 굴리다가, 꽉 쥐었다."
    - 미라벨@진지: "지금 저 위에 서 있는 건 아델하이트가 아니야. 그게 다야."
    - when: "origin == '몰락귀족'"
      속마음: "(가문이 무너진 뒤의 축제. 그 얼굴을 안다. 요즘 거울 속에서 매일 본다.)"
    - when: "perk.고인물의기억"
      속마음: "(원작 미라벨 루트의 회상 CG. 장미 불꽃 아래의 어린 미라벨. 그 CG가, 지금 이 얼굴 뒤편에 있다.)"
    - 속마음: "(위로는 싫어할 거다. 그렇다고 아무 말도 안 하기엔…)"
  choices:
    - text: "\"그럼 우리가 고치자\" (마력제어·지성)"
      lines:
        - 나: "그럼 우리가 고치자."
        - 미라벨@놀람: "…뭐?"
        - 미라벨@화남: "D반이 마탑 술식을 만진다고? …비켜. 고리는 내가 잡을 테니까 넌 마디나 봐."
      check: { label: 술식 보정, value: "stat.마력제어 + stat.지성 / 2 + 5 * skill.영창분할 + luck", dc: 30 }
      success:
        art: cg_fest_mirabel
        lines:
          - "마법사들이 한눈판 틈에 발사대 앞에 섰다."
          - "미라벨이 허공의 고리를 손끝으로 붙잡았다. 비틀린 마디가 눈에 보인다. 실이 엉킨 것처럼."
          - "내가 그 마디에 마력을 흘려 넣었다. 천천히. 미라벨의 박자에 맞춰서."
          - "딸깍. 술식이 맞물린다."
          - "두 번째 시험 발사. 불꽃이 하늘 꼭대기까지 곧게 솟았다."
          - "그리고 붉은 장미처럼, 활짝 피었다."
          - 미라벨@놀람: "……됐어. 진짜로 됐네."
          - "미라벨이 하늘을 올려다봤다. 장미 꽃잎이 불티가 되어 천천히 떨어진다."
          - 미라벨@당황: "착각하지 마. 내가 거의 다 한 거야. …그래도, 고마워."
          - "마탑 마법사 하나가 다가와 이름을 물었다."
          - "미라벨은 잠깐 망설였다. 그러고는 턱을 들고 또렷하게 말했다."
          - 미라벨@진지: "미라벨 폰 아델하이트."
          - "마법사가 그 이름을 수첩에 적었다. 미라벨은 펜 끝이 멈출 때까지 눈을 떼지 않았다."
        effects: ["affinity.mirabel += 5", "trust.mirabel += 6", "stat.마력제어 += 0.5", "fest.moment = 1"]
      fail:
        lines:
          - "마법사들이 한눈판 틈에 발사대 앞에 섰다. 미라벨이 고리를 붙잡고, 내가 마디에 마력을 흘렸다."
          - "마력이 엇나갔다. 딸깍 대신 퍽 소리가 났다."
          - "불꽃이 하늘 대신 호수로 날아갔다."
          - "물속에서 보글보글 터진다. 수면 아래가 분홍, 초록으로 번쩍였다. 물고기 떼가 놀라 튀어 올랐다."
          - "미라벨이 입을 막았다. 어깨가 떨린다. …웃고 있다."
          - 미라벨@웃음: "푸흡… 물고기 놀래키는 술식은 처음 봐. 아델하이트 문헌에도 없어."
          - 미라벨@웃음: "이름 붙여 줄까? 붕어 기절 술식."
          - 나@당황: "…특허 낼까."
          - "처음 보는, 꾸밈없는 웃음이었다."
          - "마법사들이 달려오는 소리에 둘이 동시에 버드나무 뒤로 숨었다. 미라벨은 숨어서도 한참을 웃었다."
        effects: ["affinity.mirabel += 4", "trust.mirabel += 3", "fest.moment = 1"]
    - text: "\"솜사탕 먹을래?\" (은화 2)"
      requires: "money >= 2"
      effects: ["money -= 2", "affinity.mirabel += 4", "trust.mirabel += 2", "fest.moment = 1"]
      lines:
        - 나: "솜사탕 먹을래?"
        - 미라벨@화남: "그런 평민 간식을 내가 왜…"
        - "근처 노점에서 분홍 솜사탕을 하나 사 왔다. 내밀었다."
        - 미라벨: "필요 없어."
        - "다시 내밀었다."
        - 미라벨: "필요 없다니까."
        - "세 번째에는 대답도 없이 고개만 돌렸다."
        - "네 번째에 미라벨이 낚아채듯 받았다. 그리고 아무 말 없이 끝까지 다 먹었다."
        - 미라벨@당황: "…맛있다고 한 적 없어. 입에 들러붙어서 끝까지 먹은 것뿐이야."
        - "입가에 분홍색 설탕이 묻어 있다. 말해 줄까 하다가 그만뒀다."
        - 속마음: "(콧대 높은 아델하이트의 입가에 솜사탕. 이건 위키 어디에도 없는 장면이다.)"
    - text: "\"아델하이트는 다시 저 위에 설 거야\""
      effects: ["affinity.mirabel += 2", "trust.mirabel += 4"]
      lines:
        - 나: "아델하이트는 다시 저 위에 설 거야."
        - 미라벨@화남: "…위로하는 거야? 필요 없어."
        - "미라벨은 고개를 돌렸다. 그래도 발사대에서 눈을 떼지는 않았다."
        - "한참 뒤에야 작은 목소리가 들렸다."
        - 미라벨@진지: "당연한 소리를 하네. 설 거야. 내가 세울 거니까."
        - 미라벨: "그때 발코니에서 볼 사람 중에… 너도 끼워 줄지 생각해 볼게. 맨 끝자리로."
        - "미라벨이 팔짱을 고쳐 꼈다. 귀 끝이 조금 붉었다. 노을 탓인지는 모르겠다."
        - "그 뒤로 미라벨은 아무 말도 하지 않았다. 대신 내가 옆에 남아 있는 것도 말리지 않았다."
        - when: "perk.고인물의기억"
          속마음: "(원작의 미라벨은 4학년에 사라진다. 그 발코니는 끝내 비어 있었다.)"

# ---------------------------------------------------------------- 카이든: 회색 후드
- id: fest_kaiden
  title: 봄 축제 — 회색 후드
  art: festival
  next: fest_finale
  effects: ["fest.with = 'kaiden'", "affinity.kaiden += 3"]
  lines:
    - "꼬치 노점 앞. 숯불 위에서 양념 바른 고기가 지글거린다. 연기에 눈이 맵다."
    - "그 연기 속에서 회색 후드를 눌러쓴 사람이 노점 주인과 실랑이를 벌이고 있다."
    - 상인@당황: "손님, 금화를 내시면 거스름돈이 없다니까요! 꼬치 하나에 동전 두 닢이에요!"
    - '???': "거스름돈은 필요 없다. 꼬치를 다오."
    - 상인@놀람: "금화 한 닢에 꼬치 하나요? 이런 걸 받았다간 경비대가 저를 도둑으로 압니다!"
    - "후드가 살짝 기울었다. 그 아래로 백금빛 머리카락이 삐져나오고, 금색 눈이 짜증스럽게 가늘어졌다."
    - "얼굴이 낯익다. 카이든이다."
    - 속마음: "(3황자가 축제 꼬치 노점에서 금화를 흔들고 있다. 원작 어떤 루트에도 없던 그림이다.)"
    - "동전 두 닢을 대신 냈다. 상인이 안도의 숨을 쉬며 꼬치를 내밀었다."
    - "카이든이 나를 노려봤다. 꼬치는 받았다."
    - 카이든@화남: "…아무한테도 말하지 마라. 근위대를 따돌리고 나왔다."
    - 나: "황자님이 담을 넘었다고?"
    - 카이든: "넘지 않았다. 마구간 문으로 나왔다. 넘는 것보다 품위 있지."
    - "카이든이 꼬치를 한 입 베어 물었다. 입가에 양념이 묻었다. 본인은 모른다."
    - 카이든: "황궁의 축제는 발코니에서 손을 흔드는 거다."
    - 카이든: "큰형이 가운데, 작은형이 그 옆, 나는 맨 끝."
    - 카이든@진지: "아래에선 내 얼굴이 보이지도 않지. 난간 장식에 반쯤 가려서."
    - 카이든: "어릴 때 한 번, 손을 너무 세게 흔들었다가 혼났다. 황족의 손은 손목까지만 움직이는 거라고."
    - "카이든이 손목만 까딱, 흔들어 보였다. 정확하고, 우아하고, 아무도 보지 않는 인사였다."
    - 카이든: "한 번쯤은 아래에서 보고 싶었다."
    - "카이든이 반쯤 남은 꼬치를 내려다봤다."
    - 카이든: "…꼬치가 이런 맛이었군."
    - "웃은 건 아니었다. 그래도 입꼬리가 아주 조금, 손목 인사만큼 움직였다."
    - "그때, 인파 너머로 은빛 갑옷이 번쩍였다. 황궁 근위대다."
    - "은빛 투구 셋이 노점 사이를 헤집는다. 사람들 얼굴을 하나하나 들여다보면서."
    - 카이든@화남: "…벌써 냄새를 맡았군."
    - 속마음: "(근위대에 넘기면 깔끔하다. 하지만 꼬치를 쥐고 있는 저 얼굴을 보면…)"
  choices:
    - text: 카이든의 팔을 잡고 인파 속으로 뛴다 (민첩·지성)
      lines:
        - 나: "이쪽."
        - "대답을 기다리지 않고 카이든의 팔을 잡았다. 카이든이 놀라 꼬치를 떨어뜨릴 뻔했다."
      check: { label: 근위대 따돌리기, value: "stat.민첩 + stat.지성 / 2 + luck", dc: 28 }
      success:
        art: cg_fest_kaiden
        lines:
          - "노점 사이 좁은 틈. 빨랫줄 아래. 성가대 천막 뒤."
          - "숯불 연기 속으로 뛰어들자 은빛 투구들이 우리를 놓쳤다."
          - "마지막으로 짐수레 사이에 몸을 구겨 넣었다. 근위대의 발소리가 바로 옆을 지나… 멀어졌다."
          - "숨을 몰아쉬던 카이든이 갑자기 웃음을 터뜨렸다."
          - "소리 내어. 황자답지 않게. 어깨까지 들썩이면서."
          - 카이든@웃음: "하… 하하. 황궁에서 도망친 건 처음이다."
          - 카이든@웃음: "이렇게 쉬운 거였나. 여태 왜 몰랐지."
          - "카이든은 떨어뜨릴 뻔한 꼬치를 끝까지 쥐고 있었다. 고기는 하나도 남지 않았는데."
          - 카이든@진지: "오늘 일은 빚으로 해 두지."
          - 카이든: "황족은 빚을 잊지 않는다. 좋은 쪽이든, 나쁜 쪽이든."
          - 속마음: "(원작에서 카이든이 웃는 CG는 딱 한 장이었다. 처형대 위에서.)"
        effects: ["affinity.kaiden += 5", "trust.kaiden += 8", "fest.moment = 1"]
      fail:
        lines:
          - "세 걸음도 못 가서 길이 막혔다."
          - "은빛 갑옷. 근위대장이 팔짱을 끼고 서 있다. 나를 보는 눈이 차갑다."
          - 기사@진지: "전하. 돌아가실 시간입니다."
          - "카이든은 잠깐 눈을 감았다. 그리고 후드를 벗었다. 백금빛 머리가 등불 아래 드러난다."
          - "주변 사람들이 숨을 들이켰다. 누군가 무릎을 꿇으려다 옆 사람에게 붙잡혔다."
          - "카이든은 아무 일 없다는 듯 근위대를 따라갔다."
          - "몇 걸음 가다 돌아보고, 입 모양으로만 말했다."
          - "── 꼬치값은 갚는다."
          - 속마음: "(손목 인사 대신, 입 모양. 이 사람이 할 수 있는 가장 큰 인사였을 거다.)"
        effects: ["affinity.kaiden += 2", "trust.kaiden += 4", "fest.parted = 1"]
    - text: 노점 뒤로 숨어 흥정하는 법을 가르쳐 준다
      effects: ["affinity.kaiden += 4", "trust.kaiden += 3", "fest.moment = 1"]
      lines:
        - "근위대를 피해 노점 뒤로 돌아 들어갔다. 천막 그늘이 카이든의 백금발을 가려 준다."
        - 카이든: "숨는 건 됐다. 이제 뭘 하지."
        - 나: "기왕 나왔으면 축제를 해야지. 일단, 흥정부터."
        - "사탕 노점 앞에 카이든을 세웠다."
        - 나: "먼저 비싸다고 하고, 돌아서는 척을 하는 거야."
        - 카이든@놀람: "황족이 물건값을 깎는다고?"
        - 카이든@진지: "…해 보지."
        - 카이든: "주인. 비싸다."
        - 상인@당황: "네? 아직 가격 말씀도 안 드렸는데요?"
        - "카이든은 진지하게 돌아섰다. 그리고 너무 진지하게 돌아선 나머지, 정말로 가 버렸다."
        - "주인이 반값을 외치며 쫓아왔다. 노점 다섯 개를 지나도록."
        - 카이든@진지: "…전쟁보다 어렵군."
        - "그러면서 반값 사탕 봉지를 소중히 품에 넣었다."
    - text: "\"돌아가시죠, 황자님\""
      effects: ["affinity.kaiden += 1", "trust.kaiden += 3", "fest.parted = 1"]
      lines:
        - 나: "돌아가시죠, 황자님."
        - "카이든이 나를 봤다. 금빛 눈에 무언가 스쳤다가 꺼졌다."
        - 카이든: "…현명하군. 재미는 없지만."
        - 카이든: "너 같은 자가 황궁에 셋만 있었어도, 나는 오늘 마구간 문을 나서지 않았겠지."
        - "카이든은 남은 꼬치를 마저 먹었다. 천천히, 끝까지."
        - "그리고 스스로 근위대 쪽으로 걸어갔다. 인파가 갈라졌다."
        - "꼬치 막대는 끝까지 손에 쥐고 있었다."
        - 속마음: "(옳은 말을 했다. 그런데 왜 저 등이 이렇게 작아 보이지.)"

# ---------------------------------------------------------------- 세라: 성가대
- id: fest_sera
  title: 봄 축제 — 성가대
  art: cg_fest_sera
  next: fest_finale
  effects: ["fest.with = 'sera'", "affinity.sera += 4"]
  lines:
    - "광장 끝 성교회 천막. 하얀 천에 빛의 여신을 뜻하는 금실 원이 수놓여 있다."
    - "천막 앞에 긴 의자가 놓이고, 노인들과 아이들이 줄지어 앉아 있다. 축제 소음이 여기서만 한 톤 낮다."
    - "천막 안에서 향 냄새와 밀랍 냄새가 흘러나온다. 축제의 설탕 냄새와 섞여 묘하게 달다."
    - "신학과 신입생들로 꾸린 성가대가 축제 개막 찬송을 준비하고 있다."
    - "맨 앞줄의 세라. 은발을 단정하게 묶고, 악보를 쥔 손이 하얗다."
    - "손끝이 떨려 악보가 사락사락 소리를 낸다. 옆자리 신입생이 걱정스럽게 세라를 힐끔거린다."
    - 수녀@웃음: "자, 숨 들이쉬고. 여신께선 틀린 음보다 닫힌 입을 더 슬퍼하신단다."
    - "첫 음이 울렸다. 세라의 입이 열리자 떨림이 멎었다."
    - "맑은 목소리가 광장의 소음을 가르고 올라간다. 꼬치 장수도, 뛰놀던 아이들도 잠깐 고개를 든다."
    - "둘째 소절에서, 세라의 손등에 희미한 빛 무늬가 떠올랐다."
    - "꽃잎 같기도, 가시관 같기도 한 무늬. 숨 한 번 쉴 동안 빛나다가 사라졌다."
    - when: "talent.성흔"
      나레이션: "내 손등도 따라서 뜨거워졌다. 같은 노래에 대답하듯이."
    - when: "talent.마력감응"
      나레이션: "공기의 결이 바뀌었다. 천막 안의 마력이 세라 쪽으로 쏠렸다가, 숨처럼 빠져나간다."
    - "천막 기둥 옆. 붉은 띠를 두른 교회 사람이 세라를 보고 있다."
    - "노래가 아니라, 세라의 손등을."
    - "그 사람은 박수도 치지 않았다. 작은 수첩에 무언가를 적을 뿐이다."
    - "붉은 띠 끝에 매달린 금빛 술이 흔들렸다. 대성당 사람들만 다는 장식이다."
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(붉은 띠. 추기경 그레고르 쪽 사람들이다.)"
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(원작에선 세라가 이 학교에 남지도 못했으니, 이런 장면도 없었다.)"
    - "찬송이 끝났다. 박수가 터지고, 성가대가 고개를 숙였다."
    - "세라가 고개를 들자마자 두리번거렸다. 그러다 나를 찾아내고, 종종걸음으로 왔다."
    - 세라@당황: "들었어? …틀리진 않았지? 손이 계속 떨려서."
    - 나: "노래 시작하니까 떨림이 멎던데."
    - 세라: "응… 이상하지. 노래할 땐 괜찮아. 끝나면 다시 떨려. 지금처럼."
    - 나: "그럼 계속 노래하면 되겠네."
    - 세라@웃음: "…하루 종일? 목이 남아나질 않겠다."
    - "세라가 작게 웃었다. 웃음 끝에 손가락이 또 떨렸다. 이번엔 숨기지 않았다."
    - "세라가 두 손을 마주 쥐었다. 손등의 무늬는 이제 보이지 않는다."
    - when: "fate.sera == 'saved'"
      세라@웃음: "시험장에서도 그랬잖아. 네가 붙잡아 줬을 때 떨림이 멎었어."
    - "천막 기둥 쪽을 다시 봤다. 붉은 띠는 아직 거기 있다. 이번엔, 나를 보고 있었다."
    - 속마음: "(말해야 할까. 저 붉은 띠가 아까부터 무엇을 보고 있었는지.)"
  choices:
    - text: "\"잘했어. 그리고 저 사람, 아까부터 널 보고 있었어\""
      effects: ["trust.sera += 6", "affinity.sera += 3", "fest.moment = 1"]
      lines:
        - 나: "잘했어. 진짜로."
        - 나@진지: "그리고… 저 사람. 아까부터 널 보고 있었어."
        - "세라가 붉은 띠 쪽을 돌아봤다. 그 사람은 이미 인파 속으로 사라진 뒤였다."
        - "기둥 옆에는 밟힌 꽃잎만 남아 있었다."
        - 세라@진지: "…요즘 자꾸 그래."
        - 세라: "성당에서도, 기숙사 앞에서도. 돌아보면 없어. 그런데 붉은 띠가 눈 끝에 남아."
        - 세라@슬픔: "내가 뭘 잘못했나 싶어서. 기도를 틀리게 했나, 성수를 쏟았나."
        - 나: "넌 아무것도 잘못 안 했어."
        - "세라가 고개를 들었다. 그리고 아주 작게 웃었다."
        - 세라@웃음: "말해 줘서 고마워. 혼자 착각하는 줄 알았거든."
        - 세라: "…다음에 또 보이면, 너한테 말해도 돼?"
    - text: 축제 노점을 같이 돌자고 한다
      effects: ["affinity.sera += 5", "stress -= 5", "fest.moment = 1"]
      lines:
        - 나: "성가대 끝났으면, 노점 구경 갈래?"
        - 세라@놀람: "나? 지금? …성가복 입고?"
        - 세라@웃음: "…응. 갈래."
        - 세라: "나, 축제 처음이야. 고향 마을은 추수 감사 미사가 전부였어."
        - "세라는 모든 노점 앞에서 멈췄다."
        - "유리구슬 앞에서 한 번. 말린 꽃 앞에서 한 번. 나무 피리 앞에서는 두 번."
        - "하나도 사지 않았다. 대신 전부를 아주 오래, 신기한 듯 들여다봤다."
        - 세라: "이 구슬, 안에 기포가 들어 있어. 별 같아."
        - "솜사탕 노점에서 세라가 처음으로 걸음을 오래 멈췄다. 하나를 사서 쥐여 줬다."
        - 세라@당황: "어, 이거… 구름을 먹는 거야? 먹어도 돼?"
        - 세라@웃음: "오늘은 기도 안 해도 될 것 같아. 이미 다 받은 기분이야."
    - text: 앙코르 찬송 때 뒷줄에 끼어 같이 부른다
      effects: ["affinity.sera += 4", "stat.의지 += 0.5"]
      lines:
        - "앙코르를 외치는 소리가 천막을 채웠다. 성가대가 다시 줄을 섰다."
        - "세라가 나를 보더니, 눈짓으로 뒷줄의 빈자리를 가리켰다."
        - 나@당황: "나? 난 성가 가사 모르는데."
        - 세라@웃음: "후렴만 따라 하면 돼. '빛이여, 빛이여' 두 번."
        - 나레이션:
            - "앙코르 찬송. 세라 옆에 서서 나지막이 따라 불렀다."
            - { when: "talent.음치", text: "앙코르 찬송. 세라 옆에 서서 따라 불렀다." }
        - 나레이션:
            - "세라가 놀란 눈으로 보더니 화음을 얹어 준다."
            - { when: "talent.음치", text: "첫 소절에서 성가대 전원이 동시에 나를 돌아봤다. 세라가 웃음을 참느라 악보로 얼굴을 가렸다." }
        - 나레이션:
            - "두 목소리가 겹쳐 천막 천장까지 올라갔다."
            - { when: "talent.음치", text: "수녀님이 지휘하던 손을 멈추고 잠시 하늘을 우러렀다. 여신께 무언가 여쭙는 얼굴로." }
        - "찬송이 끝났다. 세라의 손은 처음부터 끝까지 한 번도 떨리지 않았다."
        - 세라: "…너 덕분에 하나도 안 떨렸어."
        - when: "talent.음치"
          세라@웃음: "웃느라 떨 틈이 없었어. 진짜야, 칭찬이야."

# ---------------------------------------------------------------- 도로시: 무지개 레모네이드
- id: fest_dorothy
  title: 봄 축제 — 무지개 레모네이드
  art: cg_fest_dorothy
  next: fest_finale
  effects: ["fest.with = 'dorothy'", "affinity.dorothy += 4", "found.dorothy = 1"]
  lines:
    - "학생 식당 노점은 광장에서 줄이 제일 길다."
    - "커다란 솥에서 감자 스튜 김이 오른다. 식당 아주머니가 국자 하나로 그 줄을 상대하고 있다. 손이 안 보일 만큼 빠르다."
    - "그 솥 옆, 아주머니 등 뒤 그늘에 작은 냄비가 하나 더 걸려 있다. 아주 몰래."
    - "두건을 쓴 주황색 단발, 도로시가 그 냄비를 젓고 있다. 국자가 아니라 유리 막대로."
    - 도로시@웃음: "어서 와요! 무지개 레모네이드, 한 잔에 동전 세 닢!"
    - 도로시: "마실 때마다 색이 바뀌어요! 첫 모금은 노랑, 둘째는 분홍, 셋째는… 그날 기분 따라!"
    - "도로시가 목소리를 낮추고 엄마 쪽을 힐끔 봤다."
    - 도로시@당황: "엄마한텐 그냥 레몬즙이라고 했어요. 쉿."
    - 나: "레몬즙은 원래 색이 안 바뀌지 않아?"
    - 도로시@웃음: "그러니까 비밀이죠! 월계수 이슬이랑, 무지개 송어 비늘 가루랑, 제 비법 하나."
    - 속마음: "(송어 비늘 가루. 음료 재료로 듣기엔 좀 무서운 단어다.)"
    - "한 잔 받아 마셨다. 혀끝에서 노랗게 시다가, 목구멍에서 분홍빛으로 달아졌다. 정말로 색이 바뀌는 맛이다."
    - when: "talent.대식가"
      나레이션: "한 잔을 단숨에 비우고 두 잔을 더 시켰다. 도로시가 감동한 얼굴로 장부에 '단골 1호'라고 적었다."
    - "그때, 냄비가 보글거렸다."
    - "보글거림이 점점 커졌다. 보글, 보글, 부글부글."
    - "무지개색 거품이 냄비 가장자리를 넘기 시작한다. 거품이 닿은 식탁보가 무지개색으로 물들었다."
    - 도로시@당황: "어, 어어? 이렇게 많이 넣으면 안 되는 거였나?"
    - 도로시@놀람: "잠깐, 송어 비늘을 두 숟갈 넣었나 세 숟갈 넣었나…"
    - "등 뒤에서 아주머니의 국자 소리가 멈췄다. 아직 돌아보지는 않았다. 아직은."
    - 속마음: "(10초 안에 저 냄비를 어떻게든 해야 한다.)"
  check: { label: 냄비 진정시키기, value: "stat.민첩 + stat.마력제어 / 2 + luck", dc: 28 }
  success:
    lines:
      - "냄비 뚜껑을 낚아채 덮었다. 손잡이에 앞치마를 감아 냄비를 불에서 들어냈다."
      - "뚜껑이 들썩, 들썩. 그 틈으로 무지개 거품이 분수처럼 피어올랐다."
      - "거품은 공중에서 방울방울 흩어져, 저녁 햇살에 비눗방울처럼 반짝였다."
      - "구경하던 사람들이 박수를 쳤다. 공연인 줄 안 모양이다."
      - 손님@웃음: "아가씨, 그거 한 잔 줘요! 저 방울 나오는 거!"
      - "레모네이드는 해가 지기 전에 다 팔렸다. 마지막 잔은 아주머니가 마셨다. 아무 말 없이, 두 모금."
      - 도로시@웃음: "대박! 대박이에요!"
      - "도로시가 앞치마 주머니에서 동전을 한 움큼 꺼내 내 손에 쥐여 줬다."
      - 도로시: "이거 몫이에요. 공범이니까요."
      - 속마음: "(장난처럼 보이지만, 거품 하나하나가 정확히 같은 크기였다. 저건 진짜 연금술이다.)"
    effects: ["money += 6", "affinity.dorothy += 2", "fest.moment = 1"]
  fail:
    lines:
      - "뚜껑을 덮으려는 순간, 늦었다."
      - "펑."
      - "보라색 연기가 노점을 덮었다. 앞이 하나도 안 보인다. 누군가 기침을 하고, 누군가 웃는다."
      - "연기가 걷히자, 근처에 있던 사람들 전부에게서 포도 냄새가 났다."
      - 손님@놀람: "…어머, 내 머리에서 포도 냄새가 나."
      - "아주머니의 국자가 도로시 머리 위에서 멈췄다."
      - "도로시가 재빨리 내 뒤로 숨었다. 내 등이 방패가 됐다."
      - 도로시@당황: "공범! 공범은 같이 혼나는 거예요!"
      - 속마음: "(레몬즙으로 포도 냄새 연기를 만든다. 실패작치고는 너무 정교하다.)"
    effects: ["affinity.dorothy += 1"]
  choices:
    - text: "\"너 이거 장난 아니야. 진짜 연금술이야\""
      effects: ["affinity.dorothy += 4", "fest.moment = 1"]
      lines:
        - 나@진지: "도로시. 너 이거 장난 아니야. 진짜 연금술이야."
        - 도로시@놀람: "……진짜요?"
        - 도로시: "진짜로 그렇게 생각해요? 빈말 아니고요?"
        - "도로시가 앞치마 끝을 꽉 쥐었다. 주근깨 위로 볼이 빨개졌다."
        - 도로시@슬픔: "엄마는 장난 그만하고 국자나 잡으래요."
        - 도로시: "아카데미 연금과는 식당 딸은 시험도 못 본대요. 추천서가 있어야 한대요."
        - 도로시: "근데 저, 시든 걸 살리는 약을 만들고 싶어요."
        - 도로시@진지: "화분 말고, 더 큰 거요. 엄청 큰 거."
        - "도로시가 두 팔을 활짝 벌렸다. 나무 한 그루를 끌어안는 것처럼."
        - when: "perk.데이터마이너"
          속마음: "(DLC 데이터의 연금술 서번트. 이 아이는 자기가 방금 무슨 말을 했는지 모른다.)"
        - when: "perk.고인물의기억 or perk.공략위키편집자"
          속마음: "(아카데미 연금술이라면 비스톨 교수. 원작 공식 교주다.)"
        - when: "perk.고인물의기억 or perk.공략위키편집자"
          속마음: "(이 아이를 그쪽으로 보낼 수는 없다.)"
        - 도로시@웃음: "헤헤, 말해 버렸다. 비밀이에요. 공범한테만."
    - text: 앞치마를 두르고 스튜 배식을 돕는다
      effects: ["affinity.dorothy += 3", "fatigue += 8", "stat.체질 += 0.5"]
      lines:
        - "도로시 어머니가 말없이 앞치마를 하나 던져 줬다. 받아 보니 국자도 같이 감겨 있었다."
        - "해가 질 때까지 스튜를 펐다."
        - "한 국자, 한 그릇, 맛있게 드세요. 팔이 저리고 허리가 뻐근해졌다."
        - "도로시는 옆에서 빵을 썰며 쉬지 않고 떠들었다. 연금술, 엄마, 손님 흉, 다시 연금술."
        - 도로시: "엄마가 그러는데, 손이 빠르대요."
        - 도로시@웃음: "우리 엄마 칭찬 잘 안 해요. 저는 태어나서 두 번 들었어요."
        - when: "talent.대식가"
          나레이션: "배식하는 틈틈이 스튜를 세 그릇 비웠다. 아주머니가 그걸 보고 처음으로 웃었다."
        - "마지막 손님이 가고, 아주머니가 솥 바닥을 긁어 내 그릇에 담아 줬다. 제일 진한 데였다."
        - 속마음: "(원작에서 식당 아주머니는 '체력 회복' 버튼이었다. 이 스튜를 푸는 데 이만큼 팔이 아픈 줄은 몰랐다.)"

# ---------------------------------------------------------------- 에드릭: 고리 던지기
- id: fest_edric
  title: 봄 축제 — 고리 던지기
  art: festival
  next: fest_finale
  effects: ["fest.with = 'edric'", "affinity.edric += 4"]
  lines:
    - "고리 던지기 노점. 나무판 위에 말뚝 스무 개가 박혀 있고, 말뚝마다 상품이 걸려 있다."
    - "양철 브로치, 나무 피리, 유리구슬 목걸이. 제일 안쪽 말뚝엔 은도금 단검. 아무도 못 걸 것 같은 거리다."
    - "그 앞에 에드릭이 서 있다. 은화를 한 움큼 노점 판에 쏟아 놓고, 고리를 던지고 있다."
    - "휙. 땡그랑. 휙. 땡그랑. 하나도 안 걸린다."
    - 에드릭@화남: "이거 고리가 불량이잖아! 기둥이 기울었어!"
    - 에드릭@화남: "벨모어가를 뭘로 보고!"
    - "노점 주인 할머니가 움찔했다. 주름진 손이 앞치마 자락을 쥔다."
    - 노파@당황: "아이고, 도련님, 기울긴요… 우리 영감이 어제 새로 박은 건데…"
    - "주변 사람들이 수군거리기 시작했다. ─ 벨모어가 도련님 아냐? ─ 소문대로네."
    - "할머니 옆의 손자인 듯한 꼬마가 에드릭을 노려본다. 할머니가 얼른 꼬마 어깨를 붙잡았다."
    - when: "fate.edric == 'saved'"
      나레이션: "미궁 3층, 피의 원 한가운데서 떨던 얼굴이 떠오른다. 같은 얼굴이 지금은 고리를 노려보고 있다."
    - when: "fate.edric == 'saved_by_teacher'"
      나레이션: "교관에게 끌려 나오며 투덜대던 그 목소리다. 살아서, 여전히 시끄럽다."
    - "에드릭이 고리를 하나 더 집다가 나와 눈이 마주쳤다."
    - 에드릭@당황: "…뭘 봐. 아, 너구나."
    - "에드릭이 고리를 등 뒤로 감췄다. 늦었다. 다 봤다."
    - 나: "벨모어가는 고리 던지기도 귀족식으로 해?"
    - 에드릭@화남: "시, 시끄러워. 이건 그… 연습이야."
    - 나: "은화 스무 닢짜리 연습?"
    - 에드릭@당황: "…열여덟 닢이야."
    - "에드릭이 고개를 홱 돌렸다. 귀 끝이 빨갛다."
    - "에드릭이 은화 더미를 내려다봤다. 화가 가라앉자, 그 아래 있던 다른 게 드러났다."
    - 에드릭: "…평민 축제는 처음이야."
    - 에드릭: "아버지가 천한 데라고 못 가게 했거든. 등불도, 노점도, 사람 냄새도 천하다고."
    - 에드릭@슬픔: "엄마는… 오고 싶어 했는데."
    - "에드릭은 그 말을 해 놓고 스스로 놀란 얼굴을 했다. 그리고 고리를 다시 쥐었다. 손가락이 하얗다."
    - "노점 판 위에서 은화가 등불 빛에 반짝였다. 아무리 많아도, 걸리지 않는 고리 앞에선 쓸모가 없다."
    - when: "perk.고인물의기억 or note.note_edric.known"
      속마음: "(원작의 에드릭은 이 축제를 보지 못했다. 5월 미궁에서, 그걸로 끝이었으니까.)"
    - 속마음: "(가르쳐 줄까. 혼낼까. 아니면 못 본 척할까.)"
  choices:
    - text: 던지는 법을 알려 준다 (민첩·지성)
      lines:
        - 나: "손목에 힘 빼. 그렇게 던지면 고리가 돌아."
        - 에드릭@화남: "누가 가르쳐 달랬어? …어떻게 하는데."
      check: { label: 고리 던지기, value: "stat.민첩 + stat.지성 / 2 + luck", dc: 26 }
      success:
        art: cg_fest_edric
        lines:
          - "손목 힘을 빼고, 고리를 눕혀서, 기둥 너머를 보고 던지라고 했다."
          - "에드릭이 투덜거리며 따라 했다. 첫 번째, 빗나감. 두 번째, 말뚝을 맞고 튕김."
          - "세 번째 고리가 공중에서 납작하게 날아가, 말뚝에 걸렸다. 땡."
          - 에드릭@놀람: "걸렸다."
          - 에드릭@웃음: "걸렸어! 봤냐? 봤냐고!"
          - 노파@웃음: "아이고, 잘하셨네, 도련님!"
          - "상품은 양철 브로치 하나. 은화 스무 닢을 쓰고 얻은, 동전 한 닢짜리 브로치다."
          - "에드릭은 한참 그걸 내려다봤다. 작은 들꽃 모양이다."
          - "그러더니 옆 등불 노점에서 종이 등을 하나 사서, 브로치를 등 고리에 매달았다."
          - 에드릭@당황: "…엄마 거다. 호수에 띄울 거야."
          - 에드릭@화남: "웃지 마."
          - "웃지 않았다. 대신 등을 드는 걸 도왔다."
        effects: ["affinity.edric += 4", "trust.edric += 4", "fest.moment = 1"]
      fail:
        lines:
          - "에드릭도 나도 하나도 못 걸었다. 둘이서 은화만 날렸다."
          - "내 고리는 말뚝 사이를 빠져나가 할머니 발치까지 굴러갔다. 할머니가 웃음을 참았다."
          - 에드릭: "…불량 맞네. 너도 못 하잖아."
          - 나: "불량은 아니고, 우리가 못하는 거야."
          - 에드릭@화남: "그걸 꼭 말로 해야 돼?"
          - "그래도 에드릭은 처음으로, 남 탓을 하면서 웃었다."
          - 에드릭@웃음: "…큭. 둘 다 바보 같다."
          - "할머니가 위로 삼아 사탕 두 개를 쥐여 줬다. 에드릭은 그걸 귀족답지 않게 와작와작 씹었다."
        effects: ["affinity.edric += 3", "money -= 3", "fest.moment = 1"]
    - text: "\"할머니한테 먼저 사과해\""
      effects: ["affinity.edric += 2", "trust.edric += 6", "fest.moment = 1"]
      lines:
        - 나: "할머니한테 먼저 사과해."
        - 에드릭@놀람: "내, 내가 왜? 나는 벨모어…"
        - "눈을 피하지 않고 기다렸다. 주변의 수군거림이 조금 잦아들었다. 다들 보고 있다."
        - "에드릭의 입술이 몇 번 달싹였다. 벨모어, 라는 단어가 나왔다가 다시 들어갔다."
        - "입술을 깨물더니, 할머니 쪽으로 몸을 돌렸다."
        - 에드릭@당황: "…소리 질러서, 미안… 합니다."
        - "마지막 '합니다'가 거의 들리지 않았다. 그래도 할머니는 들은 모양이었다."
        - 노파@웃음: "아이고, 됐어요, 됐어. 젊은 양반이 사과도 할 줄 아네."
        - "할머니가 껄껄 웃으며 고리 다섯 개를 공짜로 쥐여 줬다."
        - "에드릭의 귀가 새빨개졌다."
        - 에드릭: "…이거 던질 거야. 너도 던져. 다섯 개니까 두 개 반씩."
    - text: 모른 척 지나간다
      effects: ["affinity.edric -= 2", "fest.parted = 1"]
      lines:
        - "못 본 척 고개를 돌렸다. 축제 인파가 금세 그 자리를 메웠다."
        - "등 뒤에서 에드릭의 고함이 한 번 더 들렸다. ─ 불량이라니까!"
        - "그리고 조용해졌다."
        - "몇 걸음 가다 돌아봤다."
        - "에드릭은 은화를 노점에 그대로 둔 채, 등불 하나만 사 들고 호수 쪽으로 걸어가고 있었다."
        - "어깨가 좁았다. 귀족 옷이 그 어깨에 비해 너무 커 보였다."
        - "등불을 든 손이 등불보다 더 흔들렸다. 그 불빛이 인파 너머로 작아졌다."
        - 속마음: "(구한 목숨이다. 그 뒤까지 책임질 생각은… 아직 없었다.)"

# ---------------------------------------------------------------- 핀: 빗자루와 시계탑
- id: fest_finn
  title: 봄 축제 — 빗자루와 시계탑
  art: festival
  next: fest_finale
  effects: ["fest.with = 'finn'", "affinity.finn += 4", "fatigue += 5"]
  lines:
    - "축제 인파 가장자리. 모두가 웃고 먹고 떠드는 동안, 한 사람만 일을 하고 있다."
    - "잿빛 머리의 소년이 자기 몸만 한 쓰레기 자루를 끌며 꼬치 막대를 쓸어 담는다. 핀이다."
    - "빗자루가 지나간 자리엔 막대 하나 남지 않는다. 쓸고, 모으고, 담고. 한 동작도 군더더기가 없다."
    - 핀@놀람: "어… 안녕하세요."
    - 핀: "축제 날이 제일 바빠요. 다들 버리기만 하고 줍는 사람은 없거든요."
    - 핀: "내일 아침까지 광장을 다 치워야 해요. 안 그러면 관리 영감님이 아침밥을 안 줘요."
    - "핀은 웃으면서 말했다. 불평이 아니라, 그냥 날씨 이야기처럼."
    - "청소 도구 수레에서 빗자루를 하나 빌렸다. 핀 옆에서 같이 쓸기 시작했다."
    - 핀@당황: "어, 저, 학생분이 그러시면 안 되는데요…"
    - "핀이 이상한 사람 보듯 나를 봤다. 그러다 내 빗자루질을 보고 입술을 깨물었다. 웃음을 참는 얼굴이다."
    - 핀: "…빗자루를 너무 세게 쥐셨어요. 쓰는 게 아니라 때리고 계세요."
    - 나: "가르쳐 줘."
    - 핀@당황: "네? 빗자루질을요? 그, 그러니까… 끝을 땅에 붙이고, 앞으로 밀면서 옆으로…"
    - "핀이 보여 주자 막대 열 개가 한 번에 쓸려 모였다. 빗자루 끝이 그리는 궤적이 너무 깨끗하다."
    - 속마음: "(새벽 연무장에서 본 그 궤적이다. 저 손에 쥔 게 빗자루가 아니라 검이었다면.)"
    - "그때, 바람이 확 불었다."
    - "뚝. 등불 장대 하나가 밑동에서 꺾였다. 등불 줄째로 기울어진다."
    - "그 아래, 솜사탕을 든 꼬마가 하늘을 보고 서 있다."
    - "핀의 빗자루가 움직였다."
    - "딱 한 번."
    - "장대가 옆으로 튕겨 나가, 꼬마 발치에서 한 뼘 떨어진 땅에 꽂혔다. 등불이 흔들리며 불티를 튀겼다."
    - "아무도 그게 빗자루질인 줄 몰랐다. 사람들은 바람이 장대를 밀어냈다고 했다."
    - "꼬마는 무사했다. 솜사탕도 무사했다."
    - "대신 쪼개진 장대 끝에 핀의 손바닥이 베였다. 피가 한 줄, 손목까지 흘렀다."
    - "핀이 제 손바닥을 내려다보고 굳었다."
    - "얼굴에서 핏기가 빠진다. 빗자루가 덜덜 떨린다. 장대를 쳐낼 땐 미동도 없던 손이."
    - 핀@슬픔: "아… 아, 아…"
    - 속마음: "(손을 감싸 줄까. 아니면, 방금 본 걸 말해야 할까.)"
  plants:
    - { id: F07, notice: { value: "stat.지성 + 10 * talent.직감 - 10 * talent.눈치없음", dc: 18 } }
  choices:
    - text: 손수건으로 손을 감싸 준다
      art: cg_fest_clocktower
      effects: ["affinity.finn += 4", "trust.finn += 6", "fest.moment = 1"]
      lines:
        - "손수건을 꺼내, 피가 보이지 않게 꼭 감쌌다."
        - "핀의 손이 차갑다. 떨림이 손수건 너머로 전해진다."
        - 나: "괜찮아. 안 보여. 이제 안 보여."
        - "몇 번 그렇게 말하자, 떨림이 조금씩 잦아들었다."
        - 핀@슬픔: "…고마워요."
        - 핀: "이상하죠. 장대는 하나도 안 무서웠는데, 이게 무서워요. 요만큼 난 피가."
        - "핀은 대답을 바라지 않는 얼굴이었다. 그래서 묻지 않았다."
        - "한참 뒤, 핀이 손수건 감긴 손을 쥐었다 폈다 해 보더니 고개를 들었다."
        - 핀@웃음: "보답할게요. 따라와요."
        - 핀: "아카데미에서 불꽃이 제일 잘 보이는 데 알아요. 아무도 몰라요."
        - "핀은 청소부 열쇠 꾸러미에서 녹슨 열쇠 하나를 골라 시계탑 문을 열었다."
        - "나선 계단 이백 몇 칸. 핀은 한 번도 쉬지 않고 올랐다. 나는 세 번 쉬었다."
        - "꼭대기. 거대한 톱니바퀴 옆으로 호수가 한눈에 내려다보인다."
        - 핀@웃음: "여기요. 제 자리예요. 이제 둘이 아는 자리네요."
    - text: "\"방금 그거, 검술이었어\""
      art: cg_fest_clocktower
      effects: ["affinity.finn += 3", "trust.finn += 2", "fest.moment = 1"]
      lines:
        - 나@진지: "핀. 방금 그거, 검술이었어."
        - 핀@당황: "아, 아니에요. 그냥 빗자루질이에요."
        - 핀: "쓸다 보니까 그렇게 된 거예요. 진짜예요. 장대가 그냥… 쓸 데에 있었어요."
        - "핀이 다친 손을 등 뒤로 숨겼다. 피 묻은 손을, 그리고 방금 그 동작을."
        - 속마음: "(장대가 쓸 데에 있었다. 천재들은 꼭 이런 식으로 말한다.)"
        - when: "perk.데이터마이너"
          속마음: "(검술 S. 숫자로만 보던 게 눈앞에서 움직이면 이런 느낌이구나.)"
        - "핀의 숨이 아직 고르지 않았다. 등 뒤에서 손이 떨리는 게 빗자루 끝으로 보였다."
        - "그리고 화제를 돌리듯 말했다."
        - 핀: "…불꽃 볼래요? 아무도 모르는 자리 있어요."
        - "핀은 청소부 열쇠로 시계탑 문을 열었다. 한 손으로. 다친 손은 여전히 등 뒤에 둔 채."
        - "꼭대기에서 호수가 한눈에 내려다보인다. 째깍째깍, 톱니바퀴 소리가 심장 소리처럼 울린다."
        - 핀: "여기선 아무도 저한테 뭐 하라고 안 해요. 그래서 좋아요."

# ---------------------------------------------------------------- 혼자 (그리고 노엘)
- id: fest_alone
  title: 봄 축제 — 혼자 걷는 길
  art: festival
  next: fest_finale
  effects: ["stress -= 5"]
  lines:
    - "혼자 걷기로 했다."
    - "인파에 떠밀려 광장을 한 바퀴 돌았다. 어깨에 부딪히고, 발을 밟히고, 사과를 받고, 다시 밀렸다."
    - 나레이션:
        - "꼬치 하나, 사과사탕 하나. 이 몸의 혀는 단 걸 좋아한다."
        - { when: "talent.대식가", text: "꼬치 여섯, 사과사탕 셋, 감자전 두 장. 노점 주인들이 내 얼굴을 외우기 시작했다." }
        - { when: "talent.혐오스러운분위기", text: "노점 앞에 서면 앞사람들이 슬금슬금 비켜 줬다. 줄을 서 본 적이 없다. 편하긴 하다." }
        - { when: "talent.병약", text: "인파 속에서 숨이 가빠 몇 번이나 벤치에 앉았다. 그래도 등불은 예쁘다." }
    - "노점마다 다른 소리가 난다. 기름 튀는 소리, 동전 소리, 흥정 소리, 잃어버린 아이 이름을 부르는 소리."
    - 속마음: "(원작에선 '혼자 보내기'를 고르면 화면이 암전되고 다음 날로 넘어갔다. 실제론 이렇게 시끄럽구나.)"
    - 속마음: "(암전 대신 꼬치 연기가 있다. 다음 날 대신 오늘 밤이 있다.)"
    - "사람 구경을 했다. D반 동기 둘이 사과사탕 하나를 두고 다툰다. S반 귀족 하나가 솜사탕을 몰래 먹다 들킨다."
    - "검술 조교 하나가 술잔을 들고 노래를 부른다. 수업 땐 '다시'라는 말밖에 안 하던 얼굴이다."
    - 속마음: "(배경 NPC들. 원작에선 똑같은 얼굴이 노점마다 복사돼 서 있었다. 여기선 다 다른 얼굴로 웃는다.)"
    - "광장 가장자리, 축제 날에만 문을 여는 임시 술집 천막. 노천 탁자 몇 개가 등불 아래 놓여 있다."
    - "그중 한 탁자에 누군가 류트를 끌어안고 엎드려 있다. 남색 머리가 탁자 위에 흩어졌다."
    - "술병 세 개가 그 머리를 호위하듯 둘러서 있다. 노엘 선배다."
    - "술 냄새가 한 걸음 밖에서도 난다. 그런데 류트 줄은 하나도 풀려 있지 않다. 이상하게 손질이 잘된 류트다."
    - when: "met.noel"
      나레이션: "호숫가 벤치에서 술병을 안고 별을 세던, 그 선배다."
    - "엎드린 채로 무언가 흥얼거리고 있다. 처음 듣는 가락이다."
    - "지나가려는데, 엎드린 머리가 말을 했다."
    - 노엘@웃음: "어, 1학년. 혼자냐?"
    - 노엘: "축제를 혼자 보다니, 뭘 좀 아는 놈이네."
    - 나: "선배는요. 혼자세요?"
    - 노엘@웃음: "나? 나는 혼자가 아니지. 얘네가 있잖아."
    - "노엘이 술병 셋을 차례로 쓰다듬었다. 하나는 비었고, 하나는 반쯤, 하나는 아직 마개도 안 땄다."
    - "노엘이 몸을 일으켜 은잔을 들어 올렸다."
    - "잔 바닥에 등불 빛이 비쳐, 새겨진 문양이 언뜻 보인다. 무언가 날개를 펼친 모양."
    - 노엘: "축제는 혼자 보는 게 제일이야. 둘이 보면 내년이 기다려지거든."
    - 노엘@진지: "기다리는 건 손해야. 안 올 수도 있으니까."
    - 나: "…그럼 선배는 왜 축제에 나왔어요?"
    - 노엘@웃음: "술을 싸게 팔잖아. 1년에 딱 하루."
    - "노엘은 그 말을 하고 잔을 비웠다. 농담인지 아닌지, 얼굴만 봐선 모르겠다."
    - 속마음: "(만년 꼴찌 4학년. 원작에선 1학년 말에 사라지는 사람. …같이 앉을까, 그냥 지나칠까.)"
  plants:
    - { id: F09, notice: { value: "stat.지성 + 10 * perk.데이터마이너", dc: 24 } }
  choices:
    - text: 노엘 옆에 앉아 술 한 잔 값을 낸다 (은화 5)
      art: cg_fest_noel
      requires: "money >= 5"
      effects: ["money -= 5", "affinity.noel += 6", "trust.noel += 4", "met.noel = 1", "fest.with = 'noel'", "fest.moment = 1"]
      lines:
        - 나: "선배, 한 잔 살게요."
        - "은화 다섯 닢을 탁자에 올려놓았다. 노엘이 동전과 내 얼굴을 번갈아 봤다."
        - 노엘@웃음: "이야, 후배가 술을 사네. 이 학교에 몇 년 있었는데 처음이다."
        - 노엘@웃음: "보통은 내가 외상을 지지. 오늘은 세상이 뒤집혔다."
        - "술집 주인이 새 병을 가져왔다. 노엘은 그걸 따지 않고, 류트를 고쳐 잡았다."
        - 노엘: "술값은 노래로 갚는 게 내 원칙이야. 원칙이 이거 하나뿐이지만."
        - "노엘이 노래를 시작했다. 처음 듣는 말이다."
        - "대륙 공용어도, 엘프어도 아니다. 혀를 굴리는 소리가 많고, 끝이 늘 내려간다."
        - "취한 목소리인데 음은 하나도 흔들리지 않았다."
        - 노엘: "망한 나라 노래야. 나라가 망하면 노래만 남거든."
        - 노엘@진지: "아무도 가사를 모르는 노래."
        - when: "perk.데이터마이너"
          속마음: "(이 가락… 미사용 음원 폴더에 있던 'kingdom_lament'다. 본편 어디에도 안 쓰인.)"
        - "옆 탁자 사람들까지 잔을 내려놓고 들었다. 노래가 끝나자 아무도 박수를 치지 않았다. 칠 수가 없었다."
    - text: "\"선배, 아까 그 노래 뭐예요?\""
      art: cg_fest_noel
      effects: ["affinity.noel += 4", "met.noel = 1", "fest.with = 'noel'", "fest.moment = 1"]
      lines:
        - 나: "선배, 아까 그 노래 뭐예요?"
        - 노엘: "노래? 아, 이거."
        - "노엘이 줄을 하나 튕겼다. 낮고 오래 남는 소리."
        - "그 소리가 축제 소음 사이로 가라앉았다. 이상하게도 묻히지 않았다."
        - 노엘@진지: "내가 너만 할 때 듣던 거."
        - 노엘: "그 뒤로 부를 사람이 다 없어져서, 이제 나만 알아."
        - "노엘은 줄을 하나 더 튕기려다 말았다. 손가락이 줄 위에 오래 머물렀다."
        - 나: "다 없어졌다는 건…"
        - 노엘@웃음: "…취했다. 방금 건 잊어."
        - 노엘: "1학년이 4학년 술주정 기억해서 좋을 거 없다. 시험에도 안 나와."
        - 속마음: "(시험엔 안 나온다. 대신 원작 커뮤니티 루머 게시판에 나왔다. '노엘 = 망국 왕자설'.)"
    - text: 인사만 하고 혼자 호숫가로 간다
      art: lake
      effects: ["stat.의지 += 1", "stress -= 10", "fest.with = 'alone'"]
      lines:
        - 나: "좋은 밤 되세요, 선배."
        - 노엘@웃음: "너도. 혼자 잘 놀아라."
        - "노엘은 다시 엎드렸다. 흥얼거림이 등 뒤로 멀어졌다."
        - "호숫가 끝, 아무도 없는 둑에 앉았다."
        - "축제 소리가 물 건너 멀리서 들린다. 북소리가 물결에 실려 와서, 발밑에서 찰랑거린다."
        - "물에 비친 등불이 흔들린다. 하늘의 것과 물의 것, 두 겹의 축제."
        - 속마음: "(이 세계 사람들은 이 축제가 앞으로 아홉 번 남았다는 걸 모른다.)"
        - 속마음: "(아홉 번. …아니, 열 번째도 보게 할 거다.)"
        - "풀 냄새 섞인 바람이 불었다. 혼자인 게, 생각보다 나쁘지 않았다."

# ---------------------------------------------------------------- 불꽃 (공통 마무리)
- id: fest_finale
  title: 봄 축제 — 불꽃
  art: cg_fest_fireworks
  effects: ["stat.매력 += 0.5", "stress -= 5"]
  lines:
    - "해가 완전히 졌다."
    - "서쪽 하늘에 마지막 주황빛이 한 줄 남았다가, 호수에 빨려 들어가듯 사라졌다."
    - "진행자의 신호에 맞춰 광장 등불이 하나씩 꺼진다. 정문 쪽부터, 차례로."
    - "어둠이 호수에서부터 차올랐다. 웅성거림이 잦아든다."
    - "물가의 개구리 울음이 갑자기 크게 들린다. 그만큼 사방이 조용해졌다."
    - "수천 명이 동시에 숨을 고르는 소리. 어딘가에서 칭얼대던 아기가 울음을 멈췄다."
    - "호수 위에 떠 있는 소원 등 수백 개만이 작은 불빛으로 남았다. 물 위에 별이 내려앉은 것 같다."
    - "누군가 속삭인다. ─ 곧이야. 그 속삭임이 물결처럼 번져 간다."
    # ---- 자리 잡기
    - when: "fest.with == 'aren' or fest.with == 'bruno' or fest.with == 'sera' or fest.with == 'dorothy' or fest.with == 'noel'"
      삽화: festival
    - when: "fest.with == 'finn'"
      삽화: clock_tower
    - when: "fest.with == 'liana' and not mood.liana.불안"
      나레이션: "호숫가 버드나무 아래. 리아나와 나란히 둑에 앉았다. 우리가 띄운 소원 등은 벌써 호수 한가운데쯤 가 있다."
    - when: "fest.with == 'liana' and not mood.liana.불안"
      리아나@웃음: "시작한다, 시작한다! 숨 참아. 첫 불꽃은 숨 참고 보는 거래."
    - when: "fest.with == 'liana' and mood.liana.불안"
      나레이션: "호숫가 버드나무 아래. 리아나와 둑에 앉았다. 둘 사이에 사람 하나 앉을 만한 틈이 있다."
    - when: "fest.with == 'liana' and mood.liana.불안"
      나레이션: "아까 떠내려간 내 등은 보이지 않는다. 다행인지 아닌지 모르겠다."
    - when: "fest.with == 'aren' and not fest.parted"
      나레이션: "수레 뒤에서 나와, 아렌과 광장 분수대 턱에 올라섰다. 꼬마들도 이제 하늘을 보느라 용사님을 잊었다."
    - when: "fest.with == 'aren' and not fest.parted"
      아렌@웃음: "여기 명당이다. 시계탑이 가려서 아무도 안 와. 근데 시계탑 옆으로 하늘이 딱 보여."
    - when: "fest.with == 'aren' and fest.parted"
      나레이션: "혼자 광장 가장자리에 섰다. 사람들 머리 너머로 하늘이 보인다."
    - when: "fest.with == 'bruno'"
      나레이션: "힘자랑 기둥 아래. 어느새 브루노 주변에 꼬마들이 모여 있다. 곰 인형 덕에 유명해진 모양이다."
    - when: "fest.with == 'bruno'"
      나레이션: "브루노는 양어깨에 꼬마를 하나씩 태우고, 나한테 기둥 옆자리를 내줬다."
    - when: "fest.with == 'bruno'"
      브루노@웃음: "여기가 명당이야. 기둥이 바람을 막아 주거든. 내가 아까 다 봐 뒀어."
    - when: "fest.with == 'mirabel'"
      나레이션: "불꽃 무대 뒤, 버드나무 그늘. 미라벨은 끝내 관람석으로 가지 않았다."
    - when: "fest.with == 'mirabel'"
      미라벨: "여기가 제일 잘 보여. 발사대가. …불꽃 말고 발사대."
    - when: "fest.with == 'kaiden' and not fest.parted"
      나레이션: "호숫가 언덕 위, 등불이 닿지 않는 풀밭. 근위대가 절대 찾지 않을 곳이라며 카이든이 고른 자리다."
    - when: "fest.with == 'kaiden' and not fest.parted"
      카이든: "황궁 사람들은 풀밭에 앉지 않는다. 옷이 더러워지니까."
    - when: "fest.with == 'kaiden' and not fest.parted"
      나레이션: "그러면서 카이든은 풀밭에 털썩 앉았다."
    - when: "fest.with == 'kaiden' and fest.parted"
      나레이션: "혼자 호숫가에 섰다. 숯불 양념 냄새가 아직 손끝에 배어 있다."
    - when: "fest.with == 'sera'"
      나레이션: "성교회 천막 앞 긴 의자. 성가대원들이 의자 위에 올라서서 하늘을 본다. 세라가 내 자리를 맡아 두었다."
    - when: "fest.with == 'sera'"
      세라@웃음: "여기. 수녀님이 오늘만 의자에 올라가도 된대. 오늘만."
    - when: "fest.with == 'dorothy'"
      나레이션: "식당 노점 뒤, 빈 스튜 솥 옆. 도로시가 뒤집은 양동이 두 개를 의자로 내놨다."
    - when: "fest.with == 'dorothy'"
      도로시@웃음: "특등석이에요! 엄마 잔소리는 불꽃 끝나고 몰아서 듣기로 했어요."
    - when: "fest.with == 'edric' and not fest.parted"
      나레이션: "호숫가. 에드릭이 물가에 쪼그려 앉아 종이 등 하나를 물에 띄웠다. 무엇을 적었는지는 보여 주지 않았다."
    - when: "fest.with == 'edric' and not fest.parted"
      나레이션: "등은 바람을 타고 천천히, 다른 수백 개의 등 사이로 섞여 들어갔다."
    - when: "fest.with == 'edric' and fest.parted"
      나레이션: "혼자 호숫가에 섰다. 불꽃 직전의 어둠 속에서 등불들이 물 위를 떠간다."
    - when: "fest.with == 'finn'"
      나레이션: "시계탑 꼭대기. 거대한 톱니바퀴 사이, 바람이 드나드는 창틀에 핀과 나란히 앉았다."
    - when: "fest.with == 'finn'"
      핀: "곧이에요. 시계가 아홉 번 치면 시작해요. 작년에도 그랬어요."
    - when: "fest.with == 'finn'"
      나레이션: "덩. 덩. 덩. 시계탑이 머리 바로 위에서 울었다. 온몸이 종소리로 떨렸다."
    - when: "fest.with == 'noel'"
      나레이션: "임시 술집 천막 앞 노천 탁자. 노엘은 의자를 호수 쪽으로 돌려 앉았다. 류트는 무릎 위에."
    - when: "fest.with == 'noel'"
      노엘@웃음: "불꽃은 앉아서 보는 거야. 서서 보는 건 젊은 애들이나 하지."
    - when: "fest.with == 'noel'"
      나: "선배도 젊잖아요."
    - when: "fest.with == 'noel'"
      노엘: "4학년을 세 번째 하면 늙어."
    - when: "fest.with == 'alone'"
      나레이션: "호숫가 끝, 아무도 없는 둑. 풀이 이슬에 젖기 시작했다."
    - when: "fest.with == 'alone'"
      나레이션: "혼자 무릎을 끌어안고 앉았다. 축제 소리가 물을 건너 조금 늦게 도착한다."
    # ---- 첫 불꽃
    - 진행자: "여러분! 루미에르의 봄을 하늘에 올립니다!"
    - 진행자@웃음: "다 같이! 셋!"
    - 관중: "둘!"
    - 관중: "하나!"
    - "진행자의 외침과 함께, 호수 위로 첫 불꽃이 솟았다."
    - "가느다란 금빛 실 한 가닥이 하늘을 꿰매며, 쉬익, 올라간다. 모두가 그 실 끝을 눈으로 따라갔다."
    - "펑. 하늘이 금빛으로 갈라지고, 한 박자 늦게 터진 소리가 가슴을 친다."
    - "갈비뼈 안쪽이 쿵 울렸다. 화면 너머로는 한 번도 느껴 본 적 없는 진동이다."
    - "두 번째, 세 번째. 초록 국화, 파란 버드나무, 붉은 별."
    - "불꽃이 터질 때마다 수천 개의 얼굴이 한꺼번에 금빛으로, 초록빛으로 물든다."
    - 관중: "와아아—!"
    - 나레이션:
        - "혼자 올려다보는 불꽃도 나쁘지 않다. 물 위에 한 번, 하늘에 한 번. 두 번씩 핀다."
        - { when: "fest.with == 'liana'", text: "리아나가 화관이 흘러내리는 것도 모르고 하늘을 본다. 불꽃이 터질 때마다 엘프 귀 끝이 움찔거린다." }
        - { when: "fest.with == 'liana' and mood.liana.불안", text: "리아나는 불꽃을 올려다보면서도 가끔 나를 곁눈질했다. 무언가 묻고 싶은데, 묻기 무서운 얼굴로." }
        - { when: "fest.with == 'aren'", text: "아렌이 입을 벌린 채 하늘을 본다. 성검에 선택받은 소년이 아니라, 처음 도시에 온 양치기의 얼굴이다." }
        - { when: "fest.with == 'aren' and fest.parted", text: "광장 한복판, 꼬마들에게 둘러싸인 아렌이 보인다. 불꽃이 터질 때마다 '용사님!' 하는 함성이 인다. 아렌은 웃고 있다. 조금 굳은 채로." }
        - { when: "fest.with == 'bruno'", text: "브루노가 불꽃이 터질 때마다 '오!' 하고 소리를 지른다. 주변 꼬마들이 따라 소리를 지른다." }
        - { when: "fest.with == 'mirabel'", text: "미라벨이 팔짱을 낀 채 '술식이 조잡해'라고 중얼거린다. 그런데 마지막 불꽃이 질 때까지 한 번도 눈을 떼지 않는다." }
        - { when: "fest.with == 'kaiden'", text: "카이든이 후드를 벗었다. 발코니도, 형님들도 없는 하늘을 처음 보는 사람처럼 올려다본다." }
        - { when: "fest.with == 'kaiden' and fest.parted", text: "카이든은 없다. 불꽃이 호수 건너 황궁 쪽 하늘까지 번진다. 지금쯤 그는 발코니 맨 끝에서, 아래가 아닌 위에서 이걸 보고 있을 것이다." }
        - { when: "fest.with == 'sera'", text: "세라가 두 손을 모은다. 기도인지 소원인지, 입술만 조용히 움직인다." }
        - { when: "fest.with == 'dorothy'", text: "도로시가 '저 초록은 구리 가루! 저 빨강은 불도마뱀 비늘 재!' 하고 불꽃마다 이름을 붙인다. 손등에 열심히 받아 적는다." }
        - { when: "fest.with == 'edric'", text: "에드릭이 등불 하나가 떠내려간 쪽을 본다. 아무도 안 본다고 생각하는지, 표정이 어린애 같다." }
        - { when: "fest.with == 'edric' and fest.parted", text: "호숫가 저편에 혼자 선 에드릭이 보인다. 불꽃이 터질 때마다 그 얼굴이 잠깐 밝아졌다가 다시 어두워진다." }
        - { when: "fest.with == 'finn'", text: "시계탑 꼭대기. 불꽃이 바로 눈앞에서 터진다. 핀이 다친 손을 가슴께에 꼭 쥔 채 숨도 쉬지 않는다." }
        - { when: "fest.with == 'noel'", text: "노엘이 술병으로 박자를 맞추며 불꽃 사이사이 낮게 흥얼거린다. 처음 듣는 말로 된 노래." }
    # ---- 불꽃 아래에서
    - when: "fest.with == 'liana' and not mood.liana.불안"
      리아나@놀람: "와… 숲에서는 별이 제일 밝은 건 줄 알았는데."
    - when: "fest.with == 'liana' and not mood.liana.불안"
      리아나@웃음: "저건 반칙이다. 별보다 시끄럽고, 별보다 빨리 져."
    - when: "fest.with == 'liana' and not mood.liana.불안"
      나레이션: "불꽃이 질 때마다 리아나가 작게 '아' 하고 아쉬워했다. 그러고는 다음 불꽃에 또 '와' 했다."
    - when: "fest.with == 'liana' and not mood.liana.불안"
      나레이션: "어느 순간, 리아나의 머리가 내 어깨에 가볍게 닿았다."
    - when: "fest.with == 'liana' and not mood.liana.불안"
      리아나: "…잠깐만. 언덕 내려오느라 좀 지쳐서. 금방 비킬게."
    - when: "fest.with == 'liana' and not mood.liana.불안"
