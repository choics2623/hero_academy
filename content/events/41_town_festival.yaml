    - "골목 끝, 수염이 반쯤 그을린 노인 대장장이가 브루노 허리춤의 작은 칼을 보더니 망치를 내려놓았다."
    - "── 그 칼등의 망치 자국. 혹시 남부 시골, 망치를 대대로 물려받는다는 대장간 영감네 손주냐?"
    - 브루노@놀람: "우리 할아버지를 아세요?"
