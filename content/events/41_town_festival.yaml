            - { when: "talent.혐오스러운분위기", text: "내가 국자를 받자 줄이 반으로 줄었다. …그래도 남은 사람들은 배불리 먹었다. 마지막 할머니가 내 손을 꼭 잡아 줬다." }
      branch:
        - when: "fate.sera == 'saved' or fate.sera == 'saved_quiet'"
          lines:
            - 세라@웃음: "너도 왔구나. 둘이 하니까 금방이네."
            - 세라: "…나, 여기서 처음으로 쓸모 있다는 기분이 들었어. 성흔이니 시험이니 하는 거 말고."
          effects: ["affinity.sera += 4"]
    - text: 헌금함에 은화 10닢을 넣는다
      requires: "money >= 10"
      effects: ["money -= 10", "stress -= 10", "reputation += 2"]
      lines:
        - "늙은 수녀가 헌금함을 힐끗 보더니, 낮은 목소리로 말했다."
        - "── 고맙네, 학생. 그런데 그 함은 매주 붉은 띠 두른 분들이 대성당으로 걷어 가. 여기 남는 건 절반도 안 돼."
        - "── 다음엔 차라리 빵을 사 오게. 빵은 아무도 걷어 가지 않으니까."
        - when: "perk.고인물의기억 or perk.공략위키편집자"
          속마음: "(붉은 띠. 추기경 그레고르의 사람들. 원작의 교회는 위에서부터 썩어 있었다.)"
    - text: 지나간다
      lines: ["줄 끝에서 꼬마 하나가 빈 그릇을 들고 나를 봤다. 걸음이 조금 무거워졌다."]

- id: town_haggle
  title: 떠돌이 상인의 강장제
