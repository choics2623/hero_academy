# 축제, 도시와 주말, 고향과 출신, 고인물의 기억 (1학년 1학기)
#
# 1) 봄 축제: 5월 3주차 주말 (그날 앓아누우면 4주차 주말). 함께할 사람은 그동안 쌓은 인연에 따라 열린다.
#    fest_spring → fest_<사람> → fest_finale (불꽃) 순서로 이어진다.
#    fest.with = 함께한 사람 ('alone' 포함), fest.moment = 그 사람과 기억에 남을 장면을 만들었다 (인연 메모가 읽는다)
# 2) 주말 도시 외출 만남 풀 (town_*)
# 3) 출신별 과거: 편지, 방문, 몸이 기억하는 것 (home_*)
# 4) 고인물의 기억: 원작을 3,000시간 한 사람만 떠올리는 것 (vet_*)

# ================================================================ 봄 축제
- id: fest_spring
  title: 봄 축제
  art: festival
  on: auto
  window: { from: "1.5.3.주말", to: "1.5.4.주말" }
  slots: [주말]
  priority: 1
  announce: 봄 축제
  effects: ["stress -= 15"]
  lines:
    - "루미에르 아카데미 봄 축제."
    - "정문에서 중앙 광장까지 등불 줄이 이어지고, 노점 천막이 꽃처럼 피어 있다."
    - "꼬치 굽는 연기, 설탕 녹는 냄새, 어딘가에서 둥둥 울리는 북소리. 오늘만큼은 S반도 D반도 없다."
    - when: "fired.y1_labyrinth"
      나레이션: "얼마 전 미궁 실습이 거짓말 같다. 다들 오늘은 웃고 있다."
    - when: "fate.edric == 'dead' and origin != '악역도련님'"
      나레이션: "광장 구석, 벨모어가 문장이 그려진 등불 하나에 검은 리본이 묶여 있다. 그 앞에 서는 사람은 없다."
    - when: "origin == '악역도련님'"
      학생들: "벨모어 도련님도 축제에 오네… 미궁에서 살아 나왔다더니."
    - when: "origin == '악역도련님' and fate.edric == 'alive_scarred'"
      나레이션: "인파에 떠밀릴 때마다 가슴의 흉터가 당긴다. 그래도 왔다. 원작의 에드릭은 이 축제를 보지 못했으니까."
    - when: "vet.meme"
      학생들: "야, 저 줄 봐. 에휴 테크트리다, 에휴 테크트리!"
    - 진행자: "해가 지면 호수 위로 마탑 연합이 후원하는 불꽃이 올라갑니다! 좋은 자리는 일찍 잡으세요!"
    - 속마음:
        - "(원작의 봄 축제. 호감도가 제일 높은 캐릭터가 알아서 찾아와 불꽃을 같이 보는 이벤트였다.)"
        - { when: "perk.공략위키편집자", text: "(원작의 봄 축제. 위키의 '축제 CG 해금 조건' 표를 만든 게 나였다. 호감도 1위가 알아서 찾아오는, 선택지 없는 이벤트.)" }
    - 속마음: "(이번엔 내가 고른다.)"
  choices:
    - text: 원예부 천막의 리아나에게 간다
      when: "affinity.liana >= 8"
      next: fest_liana
    - text: 아이들에게 둘러싸인 아렌을 구하러 간다
      when: "affinity.aren >= 8"
      next: fest_aren
    - text: 힘자랑 천막 앞에서 손을 흔드는 브루노에게 간다
      when: "met.bruno or affinity.bruno > 0"
      next: fest_bruno
    - text: 불꽃 무대 뒤에서 팔짱 낀 미라벨에게 간다
      when: "rival.mirabel or affinity.mirabel >= 6"
      next: fest_mirabel
    - text: 꼬치 노점에서 실랑이 중인 회색 후드에게 간다
      when: "affinity.kaiden >= 8"
      next: fest_kaiden
    - text: 성가대 천막의 세라에게 간다
      when: "(fate.sera == 'saved' or fate.sera == 'saved_quiet') and affinity.sera >= 5"
      next: fest_sera
    - text: 식당 노점에서 수상한 냄비를 젓는 도로시에게 간다
      when: "found.dorothy or affinity.dorothy > 0"
      next: fest_dorothy
    - text: 고리 던지기 앞에서 씩씩대는 에드릭에게 간다
      when: "origin != '악역도련님' and (fate.edric == 'saved' or fate.edric == 'saved_by_teacher')"
      next: fest_edric
    - text: 쓰레기 자루를 끌고 가는 핀을 돕는다
      when: "found.finn"
      next: fest_finn
    - text: 혼자 걷는다
      next: fest_alone

# ---------------------------------------------------------------- 리아나: 소원 등
- id: fest_liana
  title: 봄 축제 — 소원 등
  art: cg_liana_wish
  next: fest_finale
  effects: ["fest.with = 'liana'", "affinity.liana += 4"]
  lines:
    - "원예부 천막. 리아나가 들꽃 화관을 팔고 있다. 정확히는, 팔지 않고 나눠 주고 있다."
    - 리아나@웃음: "왔구나! 하나 써 봐. 오늘은 공짜야. 부장님한텐 비밀."
    - when: "talent.자연친화력"
      나레이션: "화관을 쓰자 시들어 가던 꽃잎이 도로 고개를 들었다. 리아나가 볼을 부풀린다. ─ 반칙이야, 그거."
    - "해가 기울자 리아나가 내 소매를 끌었다. 호수에 소원 등을 띄우러 가자고."
    - "호수로 내려가는 언덕 계단. 중간쯤에서 리아나가 멈춰 섰다. 한 손이 가슴께에 가 있다."
    - 리아나: "…사람이 많아서 그래. 금방 괜찮아져. 진짜야."
    - "물가에 닿자 리아나는 종이 등에 무언가를 적고 손바닥으로 가렸다."
    - 리아나: "보면 안 돼. 소원은 말하면 안 이루어진대."
  plants:
    - { id: F05, notice: { value: "stat.지성 + 25 * talent.직감 + 15 * talent.마력감응 - 20 * talent.눈치없음", dc: 30 } }
  choices:
    - text: "\"그럼 나도 네 소원이 이루어지게 빌게\""
      effects: ["affinity.liana += 4", "trust.liana += 5", "fest.moment = 1"]
      lines:
        - 리아나: "내 소원이 뭔지도 모르면서?"
        - 나: "몰라도 돼."
        - "리아나가 한참 나를 보더니, 가렸던 손을 슬쩍 치웠다. 동글동글한 글씨."
        - "── 내년 축제도 볼 수 있기를."
        - 리아나@웃음: "별거 아니지? 그래도 나한텐 큰 거야."
        - when: "note.note_liana.known"
          속마음: "(원작대로라면 그 소원은 이루어진다. 딱 한 번. 그다음 여름에 리아나는 없다.)"
    - text: 내 등에 '리아나가 2학년 여름을 무사히 넘기기를'이라고 쓴다
      when: "note.note_liana.known"
      effects: ["affinity.liana += 2", "trust.liana -= 4", "mood.liana.불안 = 1"]
      lines:
        - "등을 물에 띄우는 순간 바람이 불었다. 내 등이 리아나 쪽으로 밀려간다. 하필이면 글씨가 위로 향한 채."
        - 리아나@놀람: "……2학년 여름?"
        - 리아나: "그때 무슨 일 있어? 너, 왜 그런 걸 소원으로 빌어?"
        - "대답하지 못했다. 리아나는 웃으려다 그만두고, 떠내려가는 등을 오래 바라봤다."
        - 속마음: "(아는 척을 너무 일찍 했다. 이 아이에게 나는 아직 그냥 원예부 동기다.)"
    - text: 들꽃으로 리아나의 화관을 하나 엮어 준다
      check: { label: 화관 엮기, value: "stat.마력제어 + stat.민첩 / 2 + 10 * talent.자연친화력 + luck", dc: 28 }
      success:
        lines:
          - "줄기를 꼬아 엮고, 마지막 매듭에 마력을 살짝 흘렸다. 꽃잎 끝이 은은하게 빛난다."
          - 리아나@웃음: "와… 숲에서 엄마가 만들어 주던 거랑 똑같아."
          - "리아나는 자기가 쓰고 있던 화관을 벗고 내 걸 썼다. 불꽃이 끝날 때까지 벗지 않았다."
        effects: ["affinity.liana += 5", "trust.liana += 3", "fest.moment = 1"]
      fail:
        lines:
          - "줄기가 자꾸 끊어졌다. 완성된 건 화관이라기보다 풀 뭉치에 가까웠다."
          - 리아나: "푸흡. 괜찮아, 마음은 전해졌어. …근데 진짜 엉망이다, 이거."
          - "리아나는 그래도 그걸 머리에 얹었다. 풀잎이 귀에 걸려 엘프 귀가 간지럽다고 웃었다."
        effects: ["affinity.liana += 3", "fest.moment = 1"]

# ---------------------------------------------------------------- 아렌: 용사님
- id: fest_aren
  title: 봄 축제 — 용사님
  art: cg_fest_aren
  next: fest_finale
  effects: ["fest.with = 'aren'", "affinity.aren += 4"]
  lines:
    - "사과사탕 노점 앞. 꼬마 열댓 명이 아렌을 빙 둘러싸고 있다."
    - 학생들: "용사님! 성검 보여 주세요! 한 번만요! 진짜 한 번만!"
    - 아렌@당황: "어, 그게, 성검은 학교 보물고에 있어서… 아, 망토 잡아당기지 마…"
    - "아렌이 인파 너머로 나를 발견했다. 구조 요청이 담긴 눈빛이다."
    - "꼬마들 손에 사과사탕을 하나씩 쥐여 주고 아렌을 끌어냈다. 수레 사이에 숨자 아렌이 털썩 주저앉았다."
    - 아렌: "살았다… 우리 마을 양털 깎기 축제엔 양밖에 없었는데."
    - "아렌이 숨을 고르며 광장 너머 시계탑을 올려다봤다."
    - 아렌: "…근데 이상하다. 저 시계탑, 처음 보는데 꼭대기에서 불꽃 본 적이 있는 것 같아. 바람이 왼쪽에서 불어서 연기가 이쪽으로 왔었어."
    - 속마음: "(원작의 아렌은 1학년 봄 축제에 나오지 않는다. 그런 대사도 없었다.)"
  plants:
    - { id: F41, notice: { value: "stat.지성 + 15 * perk.고인물의기억 + 10 * talent.직감", dc: 24 } }
  choices:
    - text: "\"전생에 와 봤나 보지\""
      effects: ["affinity.aren += 3", "aren.kind += 0.5", "fest.moment = 1"]
      lines:
        - 아렌@웃음: "전생? 하하, 전생에도 양치기였으면 어떡하지."
        - "농담처럼 넘겼지만, 아렌은 불꽃이 시작될 때까지 몇 번이고 시계탑 꼭대기를 올려다봤다."
    - text: "\"용사님 소리, 많이 피곤하지?\""
      effects: ["affinity.aren += 4", "trust.aren += 6", "aren.kind += 1", "fest.moment = 1"]
      lines:
        - 아렌: "…응. 다들 내가 뭘 할 수 있는지 아는 것처럼 말해. 나는 모르는데."
        - 아렌@웃음: "근데 너는 나를 그냥 아렌이라고 불러서 좋아."
        - "아렌이 사과사탕 반쪽을 내밀었다. 손가락에 설탕이 잔뜩 묻어 있다."
    - text: "\"용사니까 아이들한테 웃어 줘야지\""
      effects: ["affinity.aren += 1", "aren.arrogant += 0.5", "fest.parted = 1"]
      lines:
        - 아렌: "…그런가. 그래야 용사지."
        - "아렌은 수레 뒤에서 나가 다시 꼬마들에게 둘러싸였다. 웃는 얼굴이 조금 굳어 있었다."

# ---------------------------------------------------------------- 브루노: 힘자랑 종
- id: fest_bruno
  title: 봄 축제 — 힘자랑 종
  art: cg_fest_bruno
  next: fest_finale
  effects: ["fest.with = 'bruno'", "affinity.bruno += 4"]
  lines:
    - "광장 한가운데 커다란 나무 기둥. 꼭대기에 놋쇠 종이 매달려 있다. 힘자랑 천막이다."
    - 상인: "자, 망치로 받침을 내려쳐서 종을 울리면 곰 인형! 기사과 3학년도 실패한 종이야!"
    - 브루노:
        - "드디어 왔네! 내가 줄 서 있었어. 너 먼저 해 봐. 나는 마지막에 멋있게 할 거야."
        - { when: "origin == '악역도련님'", text: "어, 벨모어… 아니, 너. 오늘은 축제니까 봐준다! 너 먼저 해 봐. 나는 마지막에 멋있게 할 거야." }
    - when: "talent.천생신력"
      속마음: "(이 몸이라면… 종이 아니라 기둥이 부러질 수도 있겠는데.)"
  choices:
    - text: 망치를 든다 (근력)
      check: { label: 종 울리기, value: "stat.근력 + 5 * talent.천생신력 + 3 * talent.거구 + luck", dc: 30 }
      success:
        lines:
          - "땡! 놋쇠 종소리가 광장을 가로질렀다. 구경꾼들이 박수를 친다."
          - 브루노@웃음: "봤냐! 내가 뭐랬어! 쟤가 내 친구라고!"
          - "곰 인형을 받았다. 브루노 몸통만 하다. 브루노는 그걸 번쩍 들어 옆에서 울던 꼬마에게 안겨 줬다."
          - 브루노: "네가 딴 거지만, 쟤가 더 필요해 보여서. 괜찮지?"
        effects: ["affinity.bruno += 3", "stat.근력 += 0.5", "fest.moment = 1"]
      fail:
        lines:
          - "받침이 '퉁' 하고 울렸다. 쇠공은 기둥 절반쯤에서 힘없이 떨어졌다."
          - 브루노: "허리! 허리라니까! 팔로 치니까 그렇지!"
          - "브루노가 대신 망치를 들었다. 쇠공이 종을 때리고, 곰 인형은 옆에서 울던 꼬마 품으로 갔다."
        effects: ["affinity.bruno += 2", "fest.moment = 1"]
    - text: 브루노를 응원한다
      effects: ["affinity.bruno += 3", "fest.moment = 1"]
      lines:
        - 브루노: "잘 봐라. 이게 우리 할아버지한테 배운 망치질이다."
        - "브루노가 숨을 들이쉬고, 허리부터 몸을 비틀었다."
        - "쾅. 쇠공이 기둥을 타고 날아가 종을 들이받았다. 종이 고리째 뜯겨 나가 하늘로 솟았다."
        - "광장이 조용해졌다. 그리고 천막 주인이 비명을 질렀다."
        - 브루노@당황: "아, 아저씨! 제가 고칠게요! 저 대장장이 아들이에요! 진짜로요!"
        - "브루노는 불꽃이 시작되기 직전까지 종을 다시 달았다. 상품 곰 인형은 울던 꼬마에게 줬다."

# ---------------------------------------------------------------- 미라벨: 비틀린 술식
- id: fest_mirabel
  title: 봄 축제 — 비틀린 술식
  art: lake
  next: fest_finale
  effects: ["fest.with = 'mirabel'", "affinity.mirabel += 3"]
  lines:
    - "호숫가 불꽃 무대 뒤편. 마탑에서 온 마법사들이 발사대에 술식을 새기고 있다. 그 옆에 팔짱 낀 미라벨이 서 있다."
    - 미라벨:
        - "뭐야, 따라왔어? 불꽃 구경 온 거 아니야. 마탑 술식이 얼마나 조잡한지 확인하러 온 거지."
        - { when: "rival.mirabel", text: "D반이 여기까지 웬일이야. 불꽃 구경 온 거 아니야. 마탑 술식이 얼마나 조잡한지 확인하러 왔을 뿐이야." }
    - "시험 발사. 첫 불꽃이 하늘에 닿기도 전에 지지직 꺼졌다. 마법사들이 당황한다."
    - 미라벨: "봐. 세 번째 고리가 비틀렸어. 저대로 두면 본 공연 때 반은 불발이야."
    - 미라벨@진지: "…예전엔 아델하이트가 이 축제 불꽃을 맡았어. 아버지가 발사대에 서고, 나는 저택 발코니에서 봤지. 어깨 위에 올라앉아서."
    - 미라벨: "지금 저 위에 서 있는 건 아델하이트가 아니야. 그게 다야."
  choices:
    - text: "\"그럼 우리가 고치자\" (마력제어·지성)"
      check: { label: 술식 보정, value: "stat.마력제어 + stat.지성 / 2 + 5 * skill.영창분할 + luck", dc: 30 }
      success:
        art: cg_fest_mirabel
        lines:
          - "미라벨이 고리를 붙잡고, 내가 비틀린 마디에 마력을 흘려 넣었다. 술식이 딸깍 맞물린다."
          - "두 번째 시험 발사. 불꽃이 하늘 꼭대기에서 붉은 장미처럼 활짝 피었다."
          - 미라벨@놀람: "……됐어. 진짜로 됐네."
          - 미라벨: "착각하지 마. 내가 거의 다 한 거야. …그래도, 고마워."
          - "마탑 마법사가 이름을 묻자, 미라벨은 잠깐 망설이다가 또렷하게 말했다. ─ 미라벨 폰 아델하이트."
        effects: ["affinity.mirabel += 5", "trust.mirabel += 6", "stat.마력제어 += 0.5", "fest.moment = 1"]
      fail:
        lines:
          - "마력이 엇나갔다. 불꽃이 하늘 대신 호수로 날아가 물속에서 보글보글 터졌다."
          - "미라벨이 입을 막았다. 어깨가 떨린다. …웃고 있다."
          - 미라벨@웃음: "푸흡… 물고기 놀래키는 술식은 처음 봐. 아델하이트 문헌에도 없어."
          - "처음 보는, 꾸밈없는 웃음이었다."
        effects: ["affinity.mirabel += 4", "trust.mirabel += 3", "fest.moment = 1"]
    - text: "\"솜사탕 먹을래?\" (은화 2)"
      requires: "money >= 2"
      effects: ["money -= 2", "affinity.mirabel += 4", "trust.mirabel += 2", "fest.moment = 1"]
      lines:
        - 미라벨: "그런 평민 간식을 내가 왜…"
        - "솜사탕을 내밀자 미라벨은 세 번 거절했고, 네 번째에 받았다. 그리고 아무 말 없이 끝까지 다 먹었다."
        - 미라벨@당황: "…맛있다고 한 적 없어. 입에 들러붙어서 끝까지 먹은 것뿐이야."
        - "입가에 분홍색 설탕이 묻어 있다. 말해 줄까 하다가 그만뒀다."
    - text: "\"아델하이트는 다시 저 위에 설 거야\""
      effects: ["affinity.mirabel += 2", "trust.mirabel += 4"]
      lines:
        - 미라벨: "…위로하는 거야? 필요 없어."
        - "미라벨은 고개를 돌렸다. 그래도 발사대에서 눈을 떼지는 않았다."
        - 미라벨: "당연한 소리를 하네. 설 거야. 내가 세울 거니까."

# ---------------------------------------------------------------- 카이든: 회색 후드
- id: fest_kaiden
  title: 봄 축제 — 회색 후드
  art: festival
  next: fest_finale
  effects: ["fest.with = 'kaiden'", "affinity.kaiden += 3"]
  lines:
    - "꼬치 노점 앞. 회색 후드를 눌러쓴 사람이 노점 주인과 실랑이를 벌이고 있다."
    - 상인: "손님, 금화를 내시면 거스름돈이 없다니까요! 꼬치 하나에 동전 두 닢이에요!"
    - "후드 아래 얼굴이 낯익다. 카이든이다."
    - "동전 두 닢을 대신 내자, 카이든이 나를 노려봤다. 꼬치는 받았다."
    - 카이든: "…아무한테도 말하지 마라. 근위대를 따돌리고 나왔다."
    - 카이든: "황궁의 축제는 발코니에서 손을 흔드는 거다. 큰형이 가운데, 작은형이 그 옆, 나는 맨 끝. 아래에선 내 얼굴이 보이지도 않지."
    - 카이든: "한 번쯤은 아래에서 보고 싶었다. …꼬치가 이런 맛이었군."
    - "그때, 인파 너머로 은빛 갑옷이 번쩍였다. 황궁 근위대다."
  choices:
    - text: 카이든의 팔을 잡고 인파 속으로 뛴다 (민첩·지성)
      check: { label: 근위대 따돌리기, value: "stat.민첩 + stat.지성 / 2 + luck", dc: 28 }
      success:
        art: cg_fest_kaiden
        lines:
          - "노점 사이 좁은 틈, 빨랫줄 아래, 성가대 천막 뒤. 근위대의 발소리가 멀어졌다."
          - "숨을 몰아쉬던 카이든이 갑자기 웃음을 터뜨렸다. 소리 내어, 황자답지 않게."
          - 카이든@웃음: "하… 하하. 황궁에서 도망친 건 처음이다. 이렇게 쉬운 거였나."
          - 카이든: "오늘 일은 빚으로 해 두지. 황족은 빚을 잊지 않는다."
        effects: ["affinity.kaiden += 5", "trust.kaiden += 8", "fest.moment = 1"]
      fail:
        lines:
          - "세 걸음도 못 가서 근위대장에게 길이 막혔다."
          - "카이든은 후드를 벗고 아무 일 없다는 듯 근위대를 따라갔다. 몇 걸음 가다 돌아보고, 입 모양으로만 말했다."
          - "── 꼬치값은 갚는다."
        effects: ["affinity.kaiden += 2", "trust.kaiden += 4", "fest.parted = 1"]
    - text: 노점 뒤로 숨어 흥정하는 법을 가르쳐 준다
      effects: ["affinity.kaiden += 4", "trust.kaiden += 3", "fest.moment = 1"]
      lines:
        - "근위대를 피해 노점 뒤로 돌아 들어간 뒤, 사탕 노점 앞에 카이든을 세웠다."
        - 나: "먼저 비싸다고 하고, 돌아서는 척을 하는 거야."
        - 카이든: "황족이 물건값을 깎는다고? …해 보지."
        - "카이든은 진지하게 돌아섰고, 너무 진지하게 돌아선 나머지 정말로 가 버렸다. 주인이 반값을 외치며 쫓아왔다."
        - 카이든@진지: "…전쟁보다 어렵군."
    - text: "\"돌아가시죠, 황자님\""
      effects: ["affinity.kaiden += 1", "trust.kaiden += 3", "fest.parted = 1"]
      lines:
        - 카이든: "…현명하군. 재미는 없지만."
        - "카이든은 남은 꼬치를 마저 먹고, 스스로 근위대 쪽으로 걸어갔다. 꼬치 막대는 끝까지 손에 쥐고 있었다."

# ---------------------------------------------------------------- 세라: 성가대
- id: fest_sera
  title: 봄 축제 — 성가대
  art: cg_fest_sera
  next: fest_finale
  effects: ["fest.with = 'sera'", "affinity.sera += 4"]
  lines:
    - "광장 끝 성교회 천막. 신학과 신입생들로 꾸린 성가대가 축제 개막 찬송을 부른다."
    - "맨 앞줄의 세라는 악보를 쥔 손이 하얗다. 노래가 시작되자 떨림이 멎었다."
    - "맑은 목소리가 광장의 소음을 가르고 올라간다. 둘째 소절에서, 세라의 손등에 희미한 빛 무늬가 떠올랐다가 사라졌다."
    - "천막 기둥 옆. 붉은 띠를 두른 교회 사람이 세라를 보고 있다. 노래가 아니라, 세라의 손등을."
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(붉은 띠. 추기경 그레고르 쪽 사람들이다. 원작에선 세라가 이 학교에 남지도 못했으니, 이런 장면도 없었다.)"
    - "찬송이 끝나자 세라가 내 쪽으로 종종걸음으로 왔다."
    - 세라: "들었어? …틀리진 않았지? 손이 계속 떨려서."
  choices:
    - text: "\"잘했어. 그리고 저 사람, 아까부터 널 보고 있었어\""
      effects: ["trust.sera += 6", "affinity.sera += 3", "fest.moment = 1"]
      lines:
        - "세라가 붉은 띠 쪽을 돌아봤다. 그 사람은 이미 인파 속으로 사라진 뒤였다."
        - 세라@진지: "…요즘 자꾸 그래. 성당에서도, 기숙사 앞에서도. 내가 뭘 잘못했나 싶어서."
        - 세라: "말해 줘서 고마워. 혼자 착각하는 줄 알았거든."
    - text: 축제 노점을 같이 돌자고 한다
      effects: ["affinity.sera += 5", "stress -= 5", "fest.moment = 1"]
      lines:
        - 세라: "나, 축제 처음이야. 고향 마을은 추수 감사 미사가 전부였어."
        - "세라는 모든 노점 앞에서 멈췄다. 유리구슬, 말린 꽃, 나무 피리. 하나도 사지 않고 전부 신기해했다."
        - 세라@웃음: "오늘은 기도 안 해도 될 것 같아. 이미 다 받은 기분이야."
    - text: 앙코르 찬송 때 뒷줄에 끼어 같이 부른다
      effects: ["affinity.sera += 4", "stat.의지 += 0.5"]
      lines:
        - 나레이션:
            - "앙코르 찬송. 세라 옆에 서서 나지막이 따라 불렀다. 세라가 놀란 눈으로 보더니 화음을 얹어 준다."
            - { when: "talent.음치", text: "앙코르 찬송. 세라 옆에 서서 따라 불렀다. 첫 소절에서 성가대 전원이 동시에 나를 돌아봤다. 세라가 웃음을 참느라 악보로 얼굴을 가렸다." }
        - 세라: "…너 덕분에 하나도 안 떨렸어."

# ---------------------------------------------------------------- 도로시: 무지개 레모네이드
- id: fest_dorothy
  title: 봄 축제 — 무지개 레모네이드
  art: cg_fest_dorothy
  next: fest_finale
  effects: ["fest.with = 'dorothy'", "affinity.dorothy += 4", "found.dorothy = 1"]
  lines:
    - "학생 식당 노점. 아주머니가 감자 스튜를 퍼 주는 옆에서, 도로시가 몰래 작은 냄비를 하나 더 걸어 놨다."
    - 도로시@웃음: "어서 와요! 무지개 레모네이드, 한 잔에 동전 세 닢! 마실 때마다 색이 바뀌어요!"
    - 도로시: "엄마한텐 그냥 레몬즙이라고 했어요. 쉿."
    - "냄비가 보글거리더니, 보글거림이 점점 커졌다. 무지개색 거품이 냄비 가장자리를 넘기 시작한다."
    - 도로시@당황: "어, 어어? 이렇게 많이 넣으면 안 되는 거였나?"
  check: { label: 냄비 진정시키기, value: "stat.민첩 + stat.마력제어 / 2 + luck", dc: 28 }
  success:
    lines:
      - "뚜껑을 덮고 냄비를 불에서 내렸다. 들썩이던 뚜껑 틈으로 무지개 거품이 분수처럼 피어올랐다."
      - "구경하던 사람들이 박수를 쳤다. 공연인 줄 안 모양이다. 레모네이드는 해가 지기 전에 다 팔렸다."
      - 도로시: "대박! 이거 몫이에요. 공범이니까요."
    effects: ["money += 6", "affinity.dorothy += 2", "fest.moment = 1"]
  fail:
    lines:
      - "펑. 보라색 연기가 노점을 덮었다. 연기가 걷히자 근처에 있던 사람들 전부에게서 포도 냄새가 났다."
      - "아주머니의 국자가 도로시 머리 위에서 멈췄다. 도로시가 재빨리 내 뒤로 숨었다."
    effects: ["affinity.dorothy += 1"]
  choices:
    - text: "\"너 이거 장난 아니야. 진짜 연금술이야\""
      effects: ["affinity.dorothy += 4", "fest.moment = 1"]
      lines:
        - 도로시@놀람: "……진짜요? 진짜로 그렇게 생각해요?"
        - 도로시: "엄마는 장난 그만하고 국자나 잡으래요. 아카데미 연금과는 식당 딸은 시험도 못 본대요."
        - 도로시: "근데 저, 시든 걸 살리는 약을 만들고 싶어요. 화분 말고, 더 큰 거요. 엄청 큰 거."
        - when: "perk.데이터마이너"
          속마음: "(DLC 데이터의 연금술 서번트. 이 아이는 자기가 방금 무슨 말을 했는지 모른다.)"
        - when: "perk.고인물의기억 or perk.공략위키편집자"
          속마음: "(아카데미 연금술이라면 비스톨 교수. 원작 공식 교주다. 이 아이를 그쪽으로 보낼 수는 없다.)"
    - text: 앞치마를 두르고 스튜 배식을 돕는다
      effects: ["affinity.dorothy += 3", "fatigue += 8", "stat.체질 += 0.5"]
      lines:
        - "도로시 어머니가 말없이 앞치마를 하나 던져 줬다. 해가 질 때까지 스튜를 펐다."
        - 도로시: "엄마가 그러는데, 손이 빠르대요. 우리 엄마 칭찬 잘 안 해요."
        - when: "talent.대식가"
          나레이션: "배식하는 틈틈이 스튜를 세 그릇 비웠다. 아주머니가 그걸 보고 처음으로 웃었다."

# ---------------------------------------------------------------- 에드릭: 고리 던지기
- id: fest_edric
  title: 봄 축제 — 고리 던지기
  art: festival
  next: fest_finale
  effects: ["fest.with = 'edric'", "affinity.edric += 4"]
  lines:
    - "고리 던지기 노점 앞. 에드릭이 은화를 한 움큼 내려놓고 고리를 던지고 있다. 하나도 안 걸린다."
    - 에드릭@화남: "이거 고리가 불량이잖아! 기둥이 기울었어! 벨모어가를 뭘로 보고!"
    - "노점 주인 할머니가 움찔한다. 주변 사람들이 수군거리기 시작했다."
    - 에드릭: "…뭘 봐. 아, 너구나."
    - 에드릭: "평민 축제는 처음이야. 아버지가 천한 데라고 못 가게 했거든. 엄마는… 오고 싶어 했는데."
  choices:
    - text: 던지는 법을 알려 준다 (민첩·지성)
      check: { label: 고리 던지기, value: "stat.민첩 + stat.지성 / 2 + luck", dc: 26 }
      success:
        art: cg_fest_edric
        lines:
          - "손목 힘을 빼고, 고리를 눕혀서, 기둥 너머를 보고 던지라고 했다. 에드릭의 세 번째 고리가 기둥에 걸렸다."
          - 에드릭@놀람: "걸렸다. 걸렸어! 봤냐?"
          - "상품은 양철 브로치 하나. 에드릭은 한참 그걸 내려다보다가, 등불 노점에서 등을 하나 사서 브로치를 매달았다."
          - 에드릭: "…엄마 거다. 호수에 띄울 거야. 웃지 마."
        effects: ["affinity.edric += 4", "trust.edric += 4", "fest.moment = 1"]
      fail:
        lines:
          - "에드릭도 나도 하나도 못 걸었다. 둘이서 은화만 날렸다."
          - 에드릭: "…불량 맞네. 너도 못 하잖아."
          - "그래도 에드릭은 처음으로, 남 탓을 하면서 웃었다."
        effects: ["affinity.edric += 3", "money -= 3", "fest.moment = 1"]
    - text: "\"할머니한테 먼저 사과해\""
      effects: ["affinity.edric += 2", "trust.edric += 6", "fest.moment = 1"]
      lines:
        - 에드릭: "내, 내가 왜? 나는 벨모어…"
        - "눈을 피하지 않고 기다렸다. 에드릭이 입술을 깨물더니 할머니 쪽으로 몸을 돌렸다."
        - 에드릭: "…소리 질러서, 미안… 합니다."
        - "할머니가 껄껄 웃으며 고리 다섯 개를 공짜로 쥐여 줬다. 에드릭의 귀가 새빨개졌다."
    - text: 모른 척 지나간다
      effects: ["affinity.edric -= 2", "fest.parted = 1"]
      lines:
        - "등 뒤에서 에드릭의 고함이 한 번 더 들렸다. 그리고 조용해졌다."
        - "돌아보니 에드릭은 은화를 노점에 그대로 둔 채, 등불 하나만 사 들고 호수 쪽으로 걸어가고 있었다."

# ---------------------------------------------------------------- 핀: 빗자루와 시계탑
- id: fest_finn
  title: 봄 축제 — 빗자루와 시계탑
  art: festival
  next: fest_finale
  effects: ["fest.with = 'finn'", "affinity.finn += 4", "fatigue += 5"]
  lines:
    - "축제 한복판에서 핀만 일을 하고 있다. 쓰레기 자루를 끌며 꼬치 막대를 쓸어 담는다."
    - 핀: "축제 날이 제일 바빠요. 다들 버리기만 하고 줍는 사람은 없거든요."
    - "빗자루를 하나 빌려 같이 쓸었다. 핀이 이상한 사람 보듯 나를 봤다."
    - "그때, 바람에 등불 장대 하나가 꺾였다. 장대가 꼬마 머리 위로 기울어진다."
    - "핀의 빗자루가 움직였다. 딱 한 번. 장대가 옆으로 튕겨 나가 땅에 꽂혔다. 아무도 그게 빗자루질인 줄 몰랐다."
    - "꼬마는 무사했다. 대신 쪼개진 장대 끝에 핀의 손바닥이 베였다. 피가 한 줄 흘렀다."
    - "핀이 제 손바닥을 내려다보고 굳었다. 빗자루가 덜덜 떨린다."
  plants:
    - { id: F07, notice: { value: "stat.지성 + 10 * talent.직감 - 10 * talent.눈치없음", dc: 18 } }
  choices:
    - text: 손수건으로 손을 감싸 준다
      art: cg_fest_clocktower
      effects: ["affinity.finn += 4", "trust.finn += 6", "fest.moment = 1"]
      lines:
        - "피가 보이지 않게 손수건으로 꼭 감쌌다. 핀의 떨림이 조금씩 잦아들었다."
        - 핀: "…고마워요. 이상하죠. 장대는 하나도 안 무서웠는데, 이게 무서워요."
        - 핀: "보답할게요. 따라와요. 아카데미에서 불꽃이 제일 잘 보이는 데 알아요."
        - "핀은 청소부 열쇠로 시계탑 문을 열었다. 꼭대기, 거대한 톱니바퀴 옆으로 호수가 한눈에 내려다보인다."
    - text: "\"방금 그거, 검술이었어\""
      art: cg_fest_clocktower
      effects: ["affinity.finn += 3", "trust.finn += 2", "fest.moment = 1"]
      lines:
        - 핀@당황: "아, 아니에요. 그냥 빗자루질이에요. 쓸다 보니까 그렇게 된 거예요."
        - "핀이 다친 손을 등 뒤로 숨겼다. 그리고 화제를 돌리듯 말했다."
        - 핀: "…불꽃 볼래요? 아무도 모르는 자리 있어요."
        - "핀은 청소부 열쇠로 시계탑 문을 열었다. 꼭대기에서 호수가 한눈에 내려다보인다."

# ---------------------------------------------------------------- 혼자 (그리고 노엘)
- id: fest_alone
  title: 봄 축제 — 혼자 걷는 길
  art: festival
  next: fest_finale
  effects: ["stress -= 5"]
  lines:
    - "혼자 걷기로 했다. 인파에 떠밀려 광장을 한 바퀴 돌았다."
    - 나레이션:
        - "꼬치 하나, 사과사탕 하나. 이 몸의 혀는 단 걸 좋아한다."
        - { when: "talent.대식가", text: "꼬치 여섯, 사과사탕 셋, 감자전 두 장. 노점 주인들이 내 얼굴을 외우기 시작했다." }
        - { when: "talent.혐오스러운분위기", text: "노점 앞에 서면 앞사람들이 슬금슬금 비켜 줬다. 줄을 서 본 적이 없다. 편하긴 하다." }
        - { when: "talent.병약", text: "인파 속에서 숨이 가빠 몇 번이나 벤치에 앉았다. 그래도 등불은 예쁘다." }
    - 속마음: "(원작에선 '혼자 보내기'를 고르면 화면이 암전되고 다음 날로 넘어갔다. 실제론 이렇게 시끄럽구나.)"
    - "광장 가장자리, 술집 앞 노천 탁자. 누군가 류트를 끌어안고 엎드려 있다. 노엘 선배다."
    - 노엘: "어, 1학년. 혼자냐? 축제를 혼자 보다니, 뭘 좀 아는 놈이네."
    - "노엘이 은잔을 들어 올렸다. 잔 바닥에 등불 빛이 비쳐, 새겨진 문양이 언뜻 보인다."
  plants:
    - { id: F09, notice: { value: "stat.지성 + 10 * perk.데이터마이너", dc: 24 } }
  choices:
    - text: 노엘 옆에 앉아 술 한 잔 값을 낸다 (은화 5)
      art: cg_fest_noel
      requires: "money >= 5"
      effects: ["money -= 5", "affinity.noel += 6", "trust.noel += 4", "met.noel = 1", "fest.with = 'noel'", "fest.moment = 1"]
      lines:
        - 노엘@웃음: "이야, 후배가 술을 사네. 이 학교에 몇 년 있었는데 처음이다."
        - "노엘이 류트를 고쳐 잡고 노래를 시작했다. 처음 듣는 말이다. 대륙 공용어도, 엘프어도 아니다."
        - 노엘: "망한 나라 노래야. 나라가 망하면 노래만 남거든. 아무도 가사를 모르는 노래."
        - when: "perk.데이터마이너"
          속마음: "(이 가락… 미사용 음원 폴더에 있던 'kingdom_lament'다. 본편 어디에도 안 쓰인.)"
    - text: "\"선배, 아까 그 노래 뭐예요?\""
      art: cg_fest_noel
      effects: ["affinity.noel += 4", "met.noel = 1", "fest.with = 'noel'", "fest.moment = 1"]
      lines:
        - 노엘: "노래? 아, 이거."
        - "노엘이 줄을 하나 튕겼다. 낮고 오래 남는 소리."
        - 노엘@진지: "내가 너만 할 때 듣던 거. 그 뒤로 부를 사람이 다 없어져서, 이제 나만 알아."
        - 노엘: "…취했다. 방금 건 잊어."
    - text: 인사만 하고 혼자 호숫가로 간다
      art: lake
      effects: ["stat.의지 += 1", "stress -= 10", "fest.with = 'alone'"]
      lines:
        - "호숫가 끝, 아무도 없는 둑에 앉았다. 축제 소리가 물 건너 멀리서 들린다."
        - 속마음: "(이 세계 사람들은 이 축제가 앞으로 아홉 번 남았다는 걸 모른다.)"

# ---------------------------------------------------------------- 불꽃 (공통 마무리)
- id: fest_finale
  title: 봄 축제 — 불꽃
  art: cg_fest_fireworks
  effects: ["stat.매력 += 0.5", "stress -= 5"]
  lines:
    - "해가 완전히 졌다. 진행자의 외침과 함께 호수 위로 첫 불꽃이 솟았다."
    - "펑. 하늘이 금빛으로 갈라지고, 한 박자 늦게 터진 소리가 가슴을 친다."
    - 나레이션:
        - "혼자 올려다보는 불꽃도 나쁘지 않다. 물 위에 한 번, 하늘에 한 번. 두 번씩 핀다."
        - { when: "fest.with == 'liana'", text: "리아나가 화관이 흘러내리는 것도 모르고 하늘을 본다. 불꽃이 터질 때마다 엘프 귀 끝이 움찔거린다." }
        - { when: "fest.with == 'liana' and mood.liana.불안", text: "리아나는 불꽃을 올려다보면서도 가끔 나를 곁눈질했다. 무언가 묻고 싶은데, 묻기 무서운 얼굴로." }
        - { when: "fest.with == 'aren'", text: "아렌이 입을 벌린 채 하늘을 본다. 성검에 선택받은 소년이 아니라, 처음 도시에 온 양치기의 얼굴이다." }
        - { when: "fest.with == 'aren' and fest.parted", text: "광장 한복판, 꼬마들에게 둘러싸인 아렌이 보인다. 불꽃이 터질 때마다 '용사님!' 하는 함성이 인다. 아렌은 웃고 있다. 조금 굳은 채로." }
        - { when: "fest.with == 'bruno'", text: "브루노가 불꽃이 터질 때마다 '오!' 하고 소리를 지른다. 주변 꼬마들이 따라 소리를 지른다." }
        - { when: "fest.with == 'mirabel'", text: "미라벨이 팔짱을 낀 채 '술식이 조잡해'라고 중얼거린다. 그런데 마지막 불꽃이 질 때까지 한 번도 눈을 떼지 않는다." }
        - { when: "fest.with == 'kaiden'", text: "카이든이 후드를 벗었다. 발코니도, 형님들도 없는 하늘을 처음 보는 사람처럼 올려다본다." }
        - { when: "fest.with == 'kaiden' and fest.parted", text: "카이든은 없다. 불꽃이 호수 건너 황궁 쪽 하늘까지 번진다. 지금쯤 그는 발코니 맨 끝에서, 아래가 아닌 위에서 이걸 보고 있을 것이다." }
        - { when: "fest.with == 'sera'", text: "세라가 두 손을 모은다. 기도인지 소원인지, 입술만 조용히 움직인다." }
        - { when: "fest.with == 'dorothy'", text: "도로시가 '저 초록은 구리 가루! 저 빨강은 불도마뱀 비늘 재!' 하고 불꽃마다 이름을 붙인다. 손등에 열심히 받아 적는다." }
        - { when: "fest.with == 'edric'", text: "에드릭이 등불 하나가 떠내려간 쪽을 본다. 아무도 안 본다고 생각하는지, 표정이 어린애 같다." }
        - { when: "fest.with == 'edric' and fest.parted", text: "호숫가 저편에 혼자 선 에드릭이 보인다. 불꽃이 터질 때마다 그 얼굴이 잠깐 밝아졌다가 다시 어두워진다." }
        - { when: "fest.with == 'finn'", text: "시계탑 꼭대기. 불꽃이 바로 눈앞에서 터진다. 핀이 다친 손을 가슴께에 꼭 쥔 채 숨도 쉬지 않는다." }
        - { when: "fest.with == 'noel'", text: "노엘이 술병으로 박자를 맞추며 불꽃 사이사이 낮게 흥얼거린다. 처음 듣는 말로 된 노래." }
    - 속마음:
        - "(원작 엔딩 서른일곱 개 중 열한 개에 이 불꽃이 회상으로 나온다. 전부 누군가 죽은 뒤였다.)"
        - { when: "fest.with == 'liana' and note.note_liana.known", text: "(이 불꽃을 내년에도, 그다음 해에도 보게 할 거다. 2학년 여름 따위에 뺏기지 않는다.)" }
        - { when: "fest.with == 'bruno' and perk.고인물의기억", text: "(6년 뒤 수도를 밝힐 건 불꽃이 아니라 불길이다. 그때도 이 녀석이 '오!' 하고 웃고 있게 하자.)" }
        - { when: "fest.with == 'kaiden' and perk.고인물의기억", text: "(원작의 카이든은 반역자로 처형된다. 그날 광장에도 사람이 이만큼 모였다고 했다.)" }
        - { when: "fest.with == 'mirabel' and perk.고인물의기억", text: "(4학년에 사라지는 아이. 원작에선 그 뒤로 불꽃 무대에 아델하이트라는 이름이 다시는 오르지 않는다.)" }
        - { when: "fest.with == 'finn' and perk.데이터마이너", text: "(스탯표 한 줄로만 존재하던 아이가, 불꽃을 보며 숨을 참는다.)" }
        - { when: "fest.with == 'alone'", text: "(혼자 보는 불꽃. 3,000시간 동안 늘 이렇게 봤다. 화면 너머에서.)" }

# ================================================================ 주말 도시 외출 (만남 풀)
- id: town_busker
  title: 분수대의 음유시인
  on: 도시외출
  pool: true
  lines:
    - "시장 분수대 앞. 깃털 모자를 쓴 음유시인이 류트를 뜯으며 노래한다."
    - "── 성검을 든 이는 돌아오지 않았네, 천 년을 기다린 숲은 아직 노래하네."
    - 속마음:
        - "(「초대 용사의 발라드」. 원작 타이틀 화면 음악이다. 길바닥에서 생음악으로 들으니 기분이 이상하다.)"
        - { when: "perk.데이터마이너 or perk.공략위키편집자", text: "(「초대 용사의 발라드」. 원작 타이틀 음악. 게임 파일엔 2절 가사가 있었는데, 본편에선 끝내 안 나왔다.)" }
  choices:
    - text: 모자에 동전을 던진다 (은화 2)
      requires: "money >= 2"
      effects: ["money -= 2", "stress -= 10", "stat.매력 += 0.5"]
      lines: ["음유시인이 모자를 들어 인사하고 한 소절을 더 불러 줬다. 이번엔 내 쪽을 보며."]
    - text: 후렴을 따라 부른다
      effects: ["stress -= 8"]
      branch:
        - when: "talent.음치"
          lines:
            - "후렴을 따라 불렀다. 음유시인의 류트 줄이 하나 끊어졌다."
            - "구경꾼들이 배를 잡고 웃는다. 음유시인이 체념한 얼굴로 내 박자에 류트를 맞춰 줬다. 어쩐지 박수가 제일 컸다."
          effects: ["reputation += 2"]
        - lines:
            - "후렴을 따라 불렀다. 지나가던 사람 몇이 걸음을 멈추고 같이 불렀다. 분수대 앞이 잠깐 합창단이 됐다."
          effects: ["stat.매력 += 0.5"]
    - text: "\"2절도 불러 주세요\""
      when: "perk.데이터마이너 or perk.공략위키편집자"
      effects: ["stat.지성 += 1"]
      lines:
        - "음유시인의 손이 멈췄다. 모자 그늘 아래로 나를 한참 봤다."
        - "── 2절을 아는 사람은 처음이군. 돌아가신 스승님만 부르던 건데."
        - "그가 목소리를 낮춰 불렀다. ── 용사는 칼을 내려놓고 책장을 넘기네, 끝나지 않는 이야기의 첫 장을 또다시."
        - 속마음: "(…게임 파일 속 가사랑 한 단어가 다르다. 파일에선 '책장'이 아니라 '하늘'이었다.)"

- id: town_pickpocket
  title: 소매치기
  on: 도시외출
  pool: true
  when: "money >= 8"
  lines:
    - "인파 속에서 누군가 어깨를 툭 치고 지나갔다. 허리춤이 가볍다."
    - "돈주머니가 없다. 열 걸음 앞, 맨발의 꼬마가 사람들 다리 사이로 빠져나가고 있다."
  choices:
    - text: 쫓아간다 (민첩)
      check: { label: 추격, value: "stat.민첩 + stat.체질 / 2 + 10 * talent.고양이반사신경 + luck", dc: 30 }
      success:
        art: back_alley
        lines:
          - "생선 수레를 뛰어넘고, 빨랫줄 아래를 숙여 지나, 막다른 골목에서 꼬마의 옷깃을 잡았다."
          - "열 살쯤 됐을까. 갈비뼈가 셔츠 위로 비친다. 꼬마가 돈주머니를 내밀며 눈을 질끈 감는다."
          - "── 경비대만은 안 돼요. 거기 가면 광산으로 보내요."
        choices:
          - text: 경비대에 넘긴다
            effects: ["reputation += 3", "town.thief = 'guard'"]
            lines: ["경비병이 꼬마의 팔을 거칠게 잡아끌었다. 꼬마는 끝까지 나를 돌아보지 않았다."]
          - text: 돈주머니만 돌려받고 빵 값을 쥐여 준다 (은화 3)
            effects: ["money -= 3", "stress -= 5", "town.thief = 'spared'"]
            lines:
              - "꼬마가 손바닥의 은화를 내려다보더니, 나를 올려다봤다."
              - "── …이상한 사람이다. 토비예요, 내 이름. 빚진 건 기억해요."
          - text: 다음엔 들키지 말라고 하고 그냥 보내 준다
            effects: ["money -= 8", "town.thief = 'spared'"]
            lines: ["꼬마는 돈주머니를 꼭 쥔 채 골목 끝으로 사라졌다. 사라지기 직전, 한 번 돌아봤다."]
      fail:
        lines:
          - "세 번째 모퉁이에서 놓쳤다. 생선 장수의 욕만 한 바가지 얻어먹었다."
        effects: ["money -= 8", "stress += 5"]
    - text: 포기한다
      effects: ["money -= 8"]
      lines: ["주머니가 가볍다. 마음까지 가벼워지진 않는다."]

- id: town_thief_return
  title: 짝짝이 신발
  on: 도시외출
  pool: true
  when: "town.thief == 'spared'"
  lines:
    - "시장 입구에서 누가 소매를 잡아당겼다. 그때 그 꼬마, 토비다. 오늘은 신발을 신었다. 짝짝이지만."
    - "── 빚 갚으러 왔어요. 돈은 없고, 대신 들은 거."
  branch:
    - when: "not know.cult_early"
      lines:
        - "── 뒷골목 약초 가게에 로브 쓴 사람들이 와요. 피 굳는 약을 자루째 사 가요. 학교 쪽으로 가던데요. 미궁이 학교에 있죠?"
        - 속마음: "(피 굳는 약… 피로 그리는 문양이 번지지 않게 하려는 건가.)"
      effects: ["know.cult_early = 1", "intel += 1"]
    - lines:
        - "── 뒷골목 그림 아저씨 알죠? 요즘 그 아저씨가 학교 학생들 얘기를 자꾸 물어요. 당신 얘기도요."
        - "── 조심해요. 그 아저씨는 물어본 걸 꼭 어디다 팔거든요."
      effects: ["intel += 1"]
  choices:
    - text: 꼬치를 하나 사 준다 (은화 2)
      requires: "money >= 2"
      effects: ["money -= 2", "stress -= 5"]
      lines: ["토비는 꼬치를 세 입에 먹어 치웠다. ── 다음에도 뭐 들리면 알려 줄게요. 공짜로."]
    - text: 고맙다고만 한다
      lines: ["토비가 코를 훔치며 인파 속으로 사라졌다. 짝짝이 신발 소리가 한참 들렸다."]

- id: town_temple
  title: 성교회 구호소
  art: church_kitchen
  on: 도시외출
  pool: true
  lines:
    - "시장 뒤편 성교회 구호소. 무료 급식 줄이 골목 끝까지 늘어섰다. 늙은 수녀 혼자 국자를 들고 있다."
    - when: "fate.sera == 'saved' or fate.sera == 'saved_quiet'"
      나레이션: "수녀 옆에서 앞치마를 두른 은발 소녀가 빵을 나눈다. 세라다. 나를 보고 눈을 동그랗게 떴다."
    - when: "fate.sera == 'dropped'"
      나레이션: "줄 끝에 은발이 보인 것 같았다. 다시 보니 아니었다. 그 아이는 고향으로 돌아갔다."
  choices:
    - text: 소매를 걷고 배식을 돕는다
