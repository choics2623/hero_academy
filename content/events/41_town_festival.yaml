        - "── 스승님은 이걸 부를 때마다 문을 잠갔지. 함부로 부르면 안 되는 노래라고."
        - "그는 구경꾼들이 흩어지길 기다렸다. 그리고 목소리를 낮춰 불렀다."
        - "── 용사는 칼을 내려놓고 책장을 넘기네,"
        - "── 끝나지 않는 이야기의 첫 장을, 또다시."
        - 속마음: "(…게임 파일 속 가사랑 한 단어가 다르다. 파일에선 '책장'이 아니라 '하늘'이었다.)"
        - 속마음: "(칼을 내려놓고 책장을 넘기는 용사. …왜 도서관이 떠오르지.)"

- id: town_pickpocket
  title: 소매치기
  on: 도시외출
  pool: true
  when: "money >= 8"
  lines:
    - "토요일 오후의 시장. 사람이 너무 많아 어깨와 어깨가 맞닿는다."
    - "향신료 좌판 앞에서 계피 냄새를 맡고 있을 때였다."
    - 상인@웃음: "학생, 계피 한 봉에 은화 하나! 겨울 내내 방이 따뜻해져!"
    - "계피로 방이 어떻게 따뜻해지냐고 물으려던 참이었다."
    - "누군가 어깨를 툭 치고 지나갔다. 가볍게, 미안하다는 듯이."
    - "허리춤이 가볍다."
    - "손을 뻗었다. 있어야 할 돈주머니가 없다. 끈만 깔끔하게 잘려 있다."
    - "열 걸음 앞, 맨발의 꼬마가 사람들 다리 사이로 빠져나가고 있다. 한 손에 낯익은 주머니."
    - "꼬마가 한 번 뒤를 돌아봤다. 눈이 마주쳤다. 꼬마가 씩 웃더니 더 빨리 달렸다."
    - 속마음: "(소매치기 이벤트. 원작에선 '도둑이야!' 한 줄 띄우고 돈이 깎이던… 아니, 지금 그게 문제가 아니다.)"
    - 속마음: "(쫓을까. 저 작은 등이 인파에 묻히기 전에.)"
  choices:
    - text: 쫓아간다 (민첩)
      lines:
        - "생각보다 몸이 먼저 튀어 나갔다."
        - 나: "거기 서!"
      check: { label: 추격, value: "stat.민첩 + stat.체질 / 2 + 10 * talent.고양이반사신경 + luck", dc: 30 }
      success:
        art: back_alley
        lines:
          - "생선 수레를 뛰어넘었다. 빨랫줄 아래를 숙여 지났다. 놀란 닭이 날개를 퍼덕였다."
          - "꼬마는 골목을 세 번 꺾었다. 네 번째 골목은 막혀 있었다."
          - "막다른 벽 앞에서 꼬마의 옷깃을 잡았다."
          - "열 살쯤 됐을까. 갈비뼈가 셔츠 위로 비친다. 발바닥이 새까맣다."
          - "꼬마가 돈주머니를 내밀며 눈을 질끈 감는다."
          - 아이@슬픔: "경비대만은 안 돼요."
          - 아이@슬픔: "거기 가면 광산으로 보내요. 형도 갔는데, 안 돌아왔어요."
          - "내민 손이 떨렸다. 주머니를 쥔 손가락에 굳은살과 상처가 엉켜 있다."
          - 속마음: "(원작엔 이 골목이 없었다. 화면 밖으로 사라지면 끝이었으니까. …어떻게 할까.)"
        choices:
          - text: 경비대에 넘긴다
            effects: ["reputation += 3", "town.thief = 'guard'"]
            lines:
              - "골목 입구를 지나던 경비병을 불렀다."
              - 경비병@진지: "또 너냐. 이번이 몇 번째지."
              - "경비병이 꼬마의 팔을 거칠게 잡아끌었다. 꼬마는 저항하지 않았다. 익숙한 사람처럼."
              - 경비병: "협조 감사합니다, 학생. 이런 놈들은 광산이 약이지."
              - "꼬마는 끝까지 나를 돌아보지 않았다."
              - 속마음: "(옳은 일을 했다. …옳은 일이 이렇게 입맛이 쓴 거였나.)"
          - text: 돈주머니만 돌려받고 빵 값을 쥐여 준다 (은화 3)
            effects: ["money -= 3", "stress -= 5", "town.thief = 'spared'"]
            lines:
              - "돈주머니를 받아 들고, 은화 세 닢을 꺼내 꼬마 손바닥에 올려놓았다."
              - 나: "빵 사 먹어. 훔친 돈 말고, 받은 돈으로."
              - "꼬마가 손바닥의 은화를 내려다보더니, 나를 올려다봤다."
              - 아이@놀람: "…이상한 사람이다."
              - 아이: "토비예요, 내 이름. 빚진 건 기억해요."
              - "토비는 은화를 꽉 쥐고 골목 끝으로 달려갔다. 맨발 소리가 찰박찰박 멀어졌다."
          - text: 다음엔 들키지 말라고 하고 그냥 보내 준다
            effects: ["money -= 8", "town.thief = 'spared'"]
            lines:
              - 나: "다음엔 들키지 마."
              - "꼬마가 눈을 떴다. 무슨 말인지 모르겠다는 얼굴이다."
              - "뒤로 물러서서 길을 비켜 줬다."
              - "꼬마는 돈주머니를 꼭 쥔 채 골목 끝으로 사라졌다. 사라지기 직전, 한 번 돌아봤다."
              - 속마음: "(은화 여덟 닢. 이 아이에겐 며칠치 밥값일 거다. …내 한 달 용돈이기도 하지만.)"
      fail:
        lines:
          - "생선 수레를 뛰어넘다가 발이 걸렸다."
          - "다시 일어났을 때 꼬마는 두 번째 모퉁이를 돌고 있었다."
          - "세 번째 모퉁이에서 놓쳤다. 골목이 다섯 갈래로 갈라져 있었다."
          - "숨을 몰아쉬며 돌아오는 길에, 생선 장수의 욕만 한 바가지 얻어먹었다."
          - 상인@화남: "학생! 내 고등어! 고등어가 다 바닥에 떨어졌잖아!"
          - 속마음: "(원작 소매치기 이벤트에 추격 미니게임이 없었던 이유를 알 것 같다.)"
        effects: ["money -= 8", "stress += 5"]
    - text: 포기한다
      effects: ["money -= 8"]
      lines:
        - "쫓지 않았다. 작은 등이 인파 속으로 녹아 사라졌다."
        - "잘린 끈을 손가락에 감아 봤다. 칼솜씨가 좋다. 이 일을 오래 한 손이다."
        - "향신료 상인이 혀를 찼다. ─ 저 녀석, 이번 달만 다섯 번째야. 학생도 당했구먼."
        - "허리춤에 남은 잘린 끈이 바람에 흔들렸다."
        - "주머니가 가볍다. 마음까지 가벼워지진 않는다."
        - 속마음: "(은화 여덟 닢이면 그 아이는 며칠 배가 부르겠지. …그렇게 생각하기로 했다.)"

- id: town_thief_return
  title: 짝짝이 신발
  on: 도시외출
  pool: true
  when: "town.thief == 'spared'"
  lines:
    - "시장 입구. 하늘이 맑아 골목마다 빨래 냄새가 날린다."
    - "누가 소매를 잡아당겼다. 아주 조심스럽게."
    - "돌아보자 낯익은 얼굴이 있었다. 그때 그 꼬마, 토비다."
