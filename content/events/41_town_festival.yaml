            - "노래가 끝나자 모르는 사람들끼리 박수를 쳐 주었다. 서로에게."
            - 속마음: "(타이틀 음악으로 들을 땐 몰랐다. 이 노래는 원래 같이 부르는 노래였다.)"
          effects: ["stat.매력 += 0.5"]
    - text: "\"2절도 불러 주세요\""
      when: "perk.데이터마이너 or perk.공략위키편집자"
      effects: ["stat.지성 += 1"]
      lines:
        - 나: "2절도 불러 주세요."
        - "음유시인의 손이 멈췄다. 류트 줄이 떨다가 잦아들었다."
