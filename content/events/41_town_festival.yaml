    - when: "perk.고인물의기억 or perk.데이터마이너"
      속마음: "(원작 설정집 구석의 한 줄짜리 문장이, 지금 눈앞에서 수염을 쓰다듬으며 말을 하고 있다.)"
    - when: "bruno.warned"
      브루노: "…수도 대장간 거리도 이렇게 생겼을까. 네가 언젠가 위험해진다고 했던 데 말이야."
