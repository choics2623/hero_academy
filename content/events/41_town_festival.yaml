    - text: 할아버지 이야기를 더 묻는다
      effects: ["affinity.bruno += 5", "stat.지성 += 0.5"]
      lines:
        - "── 그 양반 망치는 대대로 물려받은 거야. 손잡이를 갈아 끼운 게 열한 번째라더군. 쇠머리는 한 번도 안 바꿨고."
        - "── 쇠머리에 글자가 새겨져 있지. 아무도 못 읽는 글자. 영감도 못 읽었어."
        - 브루노: "…방학 때 집에 가면 할아버지한테 물어봐야겠다. 아저씨가 안부 전한다고."

