# 기숙사 생활 · 사이드 퀘스트 · 일상 만남 (1학년 1학기)
#
# 1) 기숙사의 밤 — 휴식에 걸린 만남 풀(pool). 쉬는 것도 생활이다.
#    룸메이트(출신별), 야식 작전, 기숙사 유령, 텅 빈 주말, 계단참의 울음, 편지, 천둥, 잠 못 드는 밤.
# 2) 사이드 퀘스트 — 3단계 연쇄 다섯 개. 플래그와 "나중의 방문"으로 잇는다 (한자리에서 next로 잇지 않는다).
#    다음 단계는 "다음 주 이후의 방문"에 열린다: 단계를 마칠 때 주차(time.month * 4 + time.week)를 *.wk에
#    적어 두고, 다음 단계 조건에서 그보다 커졌는지 본다. (핀의 쪽지만은 수업 뒤 첫 휴식 — count.휴식 스냅샷)
#      ① 도서관 밤의 발소리   libnight.step  도서관(밤) → 도서관(밤) → 도서관        보상: 사서 인연, 밤의 서가지기
#      ② 핀에게 글자 가르치기  finn.letters   식당 → 산책(호숫가) → 휴식(문틈의 쪽지)  보상: 핀 인연
#      ③ 도로시의 시제품 시험  dorothy.trial  식당/아르바이트 ×3                     보상: 강장제
#      ④ 호숫가 고양이        cat.step       enc_walk_cat 이후 산책 ×3 → 쥐 떼 전투
#      ⑤ 신문부의 사라진 기사  news.case      신문부 → 신문부 → 훈련장/검술부        보상: 카이든의 어깨 정보
# 3) 일상 만남 — 산책·식당·훈련장·도서관·마법실습·성당의 만남 풀 추가.

# ================================================================ 기숙사의 밤 (휴식)

- id: dorm_bruno_night
  title: 2층 침대의 밤
  on: 휴식
  pool: true
  window: { from: "1.3.2", to: "1.7" }
  slots: [밤]
  repeat: 3
  cooldown: 3
  chance: 0.6
  when: "origin != '악역도련님' and origin != '몰락귀족'"
  branch:
    - when: "fired.dorm_bruno_night >= 3"
      lines:
        - "불을 끄고 한참 지났다. 창틀 틈으로 밤바람이 가늘게 휘파람을 분다."
        - "천장의 나뭇결을 세다가, 겨우 잠이 들려는 참이었다."
        - "아래 칸에서 매트리스가 크게 꺼지는 소리. 브루노가 돌아눕는다. 한 번, 또 한 번."
        - 브루노: "…야. 자?"
        - 나: "…자려고 했어."
        - 브루노: "그럼 아직 안 잔 거네. 잘됐다."
        - "침대 기둥이 삐걱 울렸다. 브루노가 아래 칸에서 상체를 일으킨 모양이다."
        - 브루노@진지: "너 그거 알아? 너 자면서 이상한 말 해."
        - 나@당황: "…내가?"
        - 브루노: "응. 거의 매일 밤. 처음엔 기도문인 줄 알았어."
        - 브루노: "'세이브'. '로드'. 그리고 어젯밤엔 이랬어. '이번 회차는 다르게 간다'."
        - 브루노: "회차가 뭐야? 무슨 주문이야? 마도과 애들이 쓰는 거야?"
        - "숨이 턱 막혔다. 이불 속에서 손가락 끝이 차가워진다."
        - 속마음: "(…3,000시간의 습관이 잠꼬대로 새고 있었다.)"
        - 속마음: "(세이브도 로드도 없는 세계에서, 입버릇만 남아 있었다니.)"
        - 브루노: "아, 따지는 거 아니야. 그냥 궁금해서. 너 그 말 할 때마다 이를 갈더라."
        - "어둠 속에서 대답을 기다리는 숨소리가 들린다. 크고 느린 숨."
        - 속마음: "(뭐라고 해야 하지. 진실은 너무 무겁고, 거짓말은 너무 가볍다.)"
      choices:
        - text: "\"고향 사투리야\""
          effects: ["affinity.bruno += 2"]
          lines:
            - 나: "…고향 사투리야. 잘 자라는 뜻."
            - 브루노@놀람: "사투리? '세이브'가 잘 자라는 뜻이라고?"
            - 나: "응. '로드'는… 잘 일어나라는 뜻."
            - 브루노@웃음: "하하! 너네 고향 말 진짜 이상하다. 무슨 주문 같아."
            - 브루노: "그럼 나도 해 볼까. 세이브. …오, 왠지 든든한데?"
            - "브루노는 몇 번 더 '세이브, 세이브' 중얼거리더니, 금방 다시 코를 골았다."
            - "나는 한참 천장만 봤다."
            - 속마음: "(세이브. 이 세계에서 그 말이 진짜로 통한다면 얼마나 좋을까.)"
            - "창밖이 희뿌옇게 밝아 올 때까지, 눈을 감지 못했다."
        - text: "\"꿈에서 아주 긴 게임을 했어. 몇 번을 해도 지는 게임\""
          art: cg_bruno_fist
          effects: ["affinity.bruno += 4", "trust.bruno += 4"]
          lines:
            - 나: "…꿈에서 아주 긴 게임을 했어."
            - 브루노: "게임? 주사위 같은 거?"
            - 나: "비슷해. 몇 번을 해도 지는 게임. 서른일곱 번을 했는데, 서른일곱 번 다 졌어."
            - "아래 칸이 잠시 조용해졌다."
            - 브루노: "몇 번을 해도 지는 게임? 그걸 왜 계속해."
            - 나@슬픔: "…이기고 싶어서."
            - "말하고 나니 목이 메었다. 꿈 이야기인 척하는 것도 쉽지 않다."
            - 브루노@진지: "그럼 이번엔 이기겠네."
            - 나: "왜?"
            - 브루노@웃음: "이번엔 내가 옆에 있으니까. 서른일곱 번 동안 나는 없었지?"
            - 속마음: "(…있었다. 원작에도 브루노는 있었다. 다만 내가 한 번도 이 침대 아래 칸을 들여다보지 않았을 뿐.)"
            - when: "perk.고인물의기억 or note.note_tourney.known"
              속마음: "(그리고 거의 매번, 6년차 겨울의 수도에서 망치를 쥔 채로 끝났다.)"
            - "아래 칸에서 커다란 주먹 하나가 쑥 올라왔다. 손등에 화상 자국이 군데군데 있는 주먹."
            - "몸을 기울여 주먹을 맞부딪쳤다. 쿵, 하고 침대가 울렸다."
            - 브루노: "약속했다. 서른여덟 번째는 이기는 거다."
        - text: 자는 척한다
          effects: ["affinity.bruno += 1"]
          lines:
            - "눈을 감고 숨을 길게 쉬었다. 자는 사람의 숨처럼."
            - 브루노: "…자냐."
            - "한참 대답이 없자, 브루노가 작게 한숨을 쉬었다."
            - 브루노: "그래, 자라."
            - "다시 눕는 소리. 그런데 코 고는 소리가 들려오지 않는다."
            - 브루노@슬픔: "회차가 뭔지는 몰라도."
            - 브루노: "너 요즘 너무 혼자 다 짊어진 얼굴이야. 밥 먹을 때도. 웃을 때도."
            - 브루노: "…무거우면 좀 내려놔. 나 힘 하나는 세잖아."
            - "자는 척하는 눈꺼풀 안쪽이 뜨거워졌다."
            - 속마음: "(대답하면 무너질 것 같아서, 끝까지 자는 척했다.)"
    - when: "fired.dorm_bruno_night >= 2"
      lines:
        - "자정 넘어 눈을 떴다. 눈꺼풀 너머가 이상하게 주황빛이다."
        - "책상에 촛불이 켜져 있다. 심지가 거의 다 탔다."
        - "브루노가 커다란 몸을 의자에 구겨 넣고 앉아 교과서를 노려보고 있다. 의자가 비명을 지르는 중이다."
        - "『마법학 개론』. 거꾸로다."
        - 나: "…브루노. 책."
        - 브루노@당황: "아, 깼냐? 미안. 불빛 때문에 깼지?"
        - 나: "책이 거꾸로야."
        - "브루노가 책을 내려다보더니, 천천히 뒤집었다. 그리고 다시 노려봤다. 별 차이가 없는 얼굴이다."
        - 브루노: "…어느 쪽으로 봐도 모르겠어. 시험 생각하니까 잠이 안 와서."
        - 브루노: "대장장이 아들이 마법진은 무슨 마법진이냐고, 다들 웃잖아."
        - 브루노@슬픔: "망치는 쥐면 손이 알아서 움직이는데, 글자는 쥘 데가 없어."
        - "브루노가 굳은살 박인 손바닥을 펴 보였다. 촛불 아래서 손금보다 화상 자국이 더 많다."
        - 속마음: "(손이 아는 걸 머리가 모를 뿐이다. 다리만 놓아 주면 된다.)"
        - 속마음: "(공략 위키를 쓰던 버릇이 이런 데서 쓸모가 있을지도 모른다.)"
      choices:
        - text: 같이 공부한다 (지성)
          check: { label: 벼락치기 과외, value: "stat.지성 + stat.매력 / 2 + luck", dc: 26 }
          success:
            lines:
              - "의자를 하나 더 끌어와 옆에 앉았다. 촛불을 새것으로 갈았다."
              - 나: "브루노. 풀무 알지?"
              - 브루노: "당연하지. 눈 감고도 밟아."
              - "마법진을 대장간 풀무에 빗대 설명했다. 바람이 들어가는 구멍, 불이 세지는 자리, 열이 빠지는 굴뚝."
              - "바깥 원은 화로의 벽. 안쪽 선은 바람길. 가운데 문자는 불씨."
              - 브루노@놀람: "…어? 잠깐. 이거 그냥 풀무잖아?"
              - 브루노@화남: "왜 책엔 이렇게 어렵게 써 놨어! 처음부터 풀무라고 하면 될 걸!"
              - 나: "쉿. 옆방 깬다."
              - 브루노: "(소리 죽여) 왜 책엔 이렇게 어렵게 써 놨어…!"
              - "그 뒤로는 브루노가 혼자 달렸다. 바람길을 하나 더 내면 어떻게 되냐고, 굴뚝을 두 개로 하면 되냐고."
              - "새벽닭이 울 무렵, 브루노는 마법진 세 개를 혼자 그렸다. 셋 다 맞았다."
              - 브루노@웃음: "너 선생 해라. 진짜로. 내가 첫 제자 할게."
              - 속마음: "(손이 먼저 아는 녀석이다. 길만 알려 주면, 나보다 빨리 간다.)"
            effects: ["affinity.bruno += 5", "stat.지성 += 0.5", "fatigue += 5"]
          fail:
            lines:
              - "의자를 끌어와 같이 앉았다. 처음 한 시간은 좋았다."
              - "두 번째 시간부터 글자가 헤엄치기 시작했다. 촛불이 두 개로 보였다."
              - 브루노: "…그래서 이 원이 뭐라고?"
              - 나: "그러니까 이 원은… 원이야."
              - 브루노@웃음: "명쾌하다."
              - "그 뒤의 기억이 없다."
              - "아침. 목이 뻐근하다. 둘 다 교과서를 베고 잠들어 있었다."
              - "고개를 들자 브루노 뺨에 마법진이 거꾸로 찍혀 있다. 잉크가 덜 마른 쪽을 베고 잔 모양이다."
              - 브루노@당황: "왜 그렇게 봐? …뭐 묻었어?"
              - 나: "응. 시험 범위가."
              - 브루노: "이거 시험 때까지 안 지워지면 커닝이냐?"
              - "아침 식당에서 동기들이 브루노의 뺨을 보고 줄줄이 웃음을 터뜨렸다. 브루노는 하루 종일 뺨을 문질렀다."
            effects: ["affinity.bruno += 3", "fatigue += 5"]
        - text: "\"자. 내일 아침에 같이 보자\""
          effects: ["affinity.bruno += 2"]
          lines:
            - 나: "브루노. 자. 내일 아침에 같이 보자."
            - 브루노: "아침? 아침엔 훈련 있잖아."
            - 나: "훈련 끝나고 아침 먹으면서. 밤에 보는 글자는 다 거꾸로 보여."
            - 브루노@웃음: "…그래서 거꾸로였구나. 책 탓이 아니었어."
            - "브루노가 책을 덮었다. 표지를 손바닥으로 한 번 쓸고, 베개 옆에 소중하게 놓는다."
            - 브루노: "…그래. 내일 아침. 약속이다."
            - "후, 촛불이 꺼졌다. 침대가 크게 한 번 꺼지는 소리."
            - "1분도 안 돼서 코 고는 소리가 들렸다."
            - 속마음: "(이렇게 쉽게 잠드는 것도 재능이다. …부럽다.)"
    - lines:
        - "불을 끈 지 한참. 기숙사 전체가 잠든 시간이다."
        - "아래 칸에서 삐걱, 삐걱. 침대가 브루노의 무게를 견디느라 앓는 소리를 낸다."
        - 브루노: "…너 자?"
        - 나: "아직."
        - 브루노@당황: "다행이다. 나 이 침대가 너무 짧아. 발이 허공에 떠 있어."
        - "고개를 내밀어 보니 정말이다. 브루노의 커다란 발이 침대 끝에서 반 뼘쯤 튀어나와 있다."
        - 브루노: "고향에선 대장간 바닥에서 잤거든. 화로 옆이 제일 따뜻해."
        - 브루노: "쇠 식는 소리 알아? 치이이— 하다가, 틱. 틱. 그 소리 들으면서 자면 꿈도 안 꿔."
        - 브루노: "여긴 너무 조용해. 조용하니까 오히려 잠이 안 와."
        - 속마음: "(원작에서 기숙사는 세이브 포인트였다. 룸메이트는 '휴식' 버튼 옆 초상화 한 장이었고.)"
        - 속마음: "(그 초상화가 지금 발이 시리다고 투덜거리고 있다.)"
        - 브루노: "너는? 졸업하면 뭐 할 거야?"
        - "어둠 속에서 질문이 천장까지 올라왔다. 대답을 기다리는 숨소리."
        - 속마음: "(졸업하면. 4년 뒤. 그 뒤로도 6년이 더 남는다.)"
      choices:
        - text: "\"세상이 망하는 걸 막을 거야\""
          effects: ["affinity.bruno += 4", "trust.bruno += 3"]
          lines:
            - 나: "세상이 망하는 걸 막을 거야."
            - "말하고 나서 아차 싶었다. 너무 진지하게 나왔다."
            - "아래 칸이 조용해졌다. 하나, 둘, 셋."
            - "그러다 브루노가 크게 웃었다. 벽이 울렸다. 옆방에서 누가 벽을 쿵 쳤다."
            - 브루노@웃음: "크게 나오네! 좋아, 좋아. 그런 녀석이 룸메이트라 다행이다."
            - 브루노: "그럼 난 네 검을 쳐 줄게. 세상 구하는 검. 이 브루노 님이 직접."
            - 브루노: "날이 무디면 갈아 주고, 부러지면 다시 벼려 주고. 평생 공짜로."
            - 속마음: "(농담인 줄 아는 게 낫다. 지금은.)"
            - 속마음: "(…웃어 줘서 다행이다. 안 웃었으면, 나도 못 웃었을 거다.)"
            - when: "bruno.warned"
              나레이션: "웃음 끝에 브루노가 작게 덧붙였다. \"…수도가 위험해진다던 거. 그것도 그 얘기야?\""
            - when: "bruno.warned"
              나레이션: "대답하지 못했다. 브루노도 더 묻지 않았다. 대신 침대 기둥을 주먹으로 가볍게 두 번 쳤다."
            - "웃음소리가 잦아들고, 이윽고 코 고는 소리가 그 자리를 채웠다."
        - text: "\"그냥, 살아남는 거\""
          effects: ["affinity.bruno += 3"]
          lines:
            - 나: "…그냥, 살아남는 거."
            - 브루노: "살아남는 거?"
            - 나: "응. 졸업하고, 그다음 해도, 그다음 해도. 끝까지."
            - "브루노가 잠시 생각하는 소리가 들렸다. 생각할 때 콧김이 세지는 녀석이다."
            - 브루노@진지: "그거 중요하지. 대장장이도 첫째는 손가락 안 잘리는 거야."
            - 브루노: "할아버지가 그랬어. 명검은 오래 산 대장장이만 친다고. 일찍 죽은 천재보다 오래 산 둔재가 낫대."
            - 브루노@웃음: "그러니까 너도 오래 살아. 나도 오래 살 거니까. 늙어서 같이 술 마시자."
            - 속마음: "(늙어서. 원작의 누구도 하지 못한 말이다. 그 세계에는 늙을 시간이 없었으니까.)"
            - "코 고는 소리가 들릴 때까지, 그 말을 몇 번이고 되씹었다."
        - text: "\"너는?\""
          effects: ["affinity.bruno += 3"]
          lines:
            - 나: "너는?"
            - 브루노: "나? 나는 정해져 있지."
            - 브루노@웃음: "제국 최고의 대장장이. 할아버지 망치를 물려받아서, 할아버지보다 좋은 검을 칠 거야."
            - 브루노: "그리고 쌍둥이 동생들 신발 사 주기. 걔네 맨날 맨발로 뛰어다니거든."
            - 브루노: "발바닥이 내 손바닥보다 두꺼워. 돌멩이 밟아도 안 아프대. 근데 겨울엔 발이 터. 빨갛게."
            - "목소리가 점점 느려진다. 말과 말 사이가 길어진다."
            - 브루노: "가죽 신발… 바닥에… 징 박은 걸로… 오래 신게…"
            - "문장 중간에, 코 고는 소리로 바뀌었다."
            - "어둠 속에서 혼자 웃었다. 쌍둥이의 신발 치수는 끝내 듣지 못했다."

- id: dorm_lonely_room
  title: 혼자 쓰는 방
  on: 휴식
  pool: true
  window: { from: "1.3.2", to: "1.7" }
  slots: [밤]
  chance: 0.6
  when: "origin == '악역도련님' or origin == '몰락귀족'"
  branch:
    - when: "origin == '악역도련님'"
      lines:
        - "벨모어가가 잡아 둔 1인실. 침대는 넓고, 벽은 두껍고, 밤은 길다."
        - "벽난로 위에 은촛대가 셋. 커튼은 벨벳이다. 기숙사 방이 아니라 작은 저택 같다."
        - "책상 위엔 본가에서 보낸 과자 상자가 뜯지도 않은 채 쌓여 있다."
        - "문밖에는 본가에서 따라온 하인이 서 있다. 밤새 저 자리에 서 있을 것이다."
        - "내가 기침만 해도 문이 열릴 것이다. 그리고 하인은 고개를 숙인 채, 내 눈을 보지 않을 것이다."
        - "벽 너머에서 웃음소리가 샌다. 옆방 평민 동기들이다."
        - 학생 A: "(벽 너머로) 야, 그래서 사감 선배 가발이 진짜로 날아갔다고?"
        - 브루노: "(벽 너머로) 진짜라니까! 바람에 훅! 내가 주워 줬잖아!"
        - "그중 제일 큰 목소리는 브루노다. 웃음이 벽을 타고 울린다."
        - 속마음: "(원작의 에드릭은 이 소리가 거슬린다며 벽을 걷어찼다.)"
        - 속마음: "(그 뒤로 옆방은 영영 조용해졌고, 에드릭은 그 조용한 방에서 5월까지 혼자 살았다.)"
        - "베개에 얼굴을 묻었다. 고급 거위털이라 소리가 하나도 안 난다."
        - 속마음: "(…넓은 방이 이렇게 추운 줄은 몰랐다.)"
      choices:
        - text: 벽을 똑똑 두드려 본다
          effects: ["dorm.signal = 1", "affinity.bruno += 4"]
          lines:
            - "손가락 마디로 벽을 두드렸다. 똑, 똑."
            - "웃음소리가 뚝 그쳤다. 긴 정적."
            - 학생 A: "(벽 너머로, 소곤소곤) …야, 벨모어다. 우리 이제 죽었다."
            - 학생 B: "(벽 너머로) 사과하러 가야 하나? 무릎 꿇어야 하나?"
            - "웃음이 나올 뻔했다. 다시 두드렸다. 이번엔 조금 더 가볍게. 똑, 똑."
            - "한참 뒤."
            - "…똑, 똑."
            - "벽 너머에서 대답이 왔다. 조심스럽게, 두 번."
            - 브루노: "(벽 너머로) …벨모어? 너도 잠 안 오냐?"
            - 나: "…응. 너무 조용해서."
            - 브루노@웃음: "(벽 너머로) 하하! 귀족 방은 조용하구나. 이쪽은 시끄러운 게 탈인데. 반 나눠 줄까?"
            - "그날 밤, 벽을 사이에 두고 한참 떠들었다."
            - "무슨 얘기를 했는지는 기억나지 않는다. 웃었던 것만 기억난다."
            - "문밖의 하인이 헛기침을 했다. 놀란 기침이었다. 이 방에서 웃음소리가 난 건 처음일 테니까."
        - text: 하인에게 오늘은 들어가 쉬라고 한다
          effects: ["stress -= 5", "edric.reformed += 0.5"]
          lines:
            - "문을 열었다. 하인이 반사적으로 허리를 숙인다. 얼굴이 하얗게 질려 있다."
            - 하인@당황: "도, 도련님. 필요하신 것이라도…"
            - 나: "오늘은 됐어. 가서 자."
            - "하인이 고개를 숙인 채 굳었다. 무슨 함정인지 찾는 눈이다."
            - 하인: "…제가 무슨 실수를 했습니까."
            - 나: "아니. 밤새 서 있으면 다리 아프잖아. 들어가 쉬어. 내일 아침도 늦게 와도 돼."
            - "긴 침묵. 복도의 마력등이 지직거렸다."
            - 속마음: "(이 사람은 얼마나 오래 이 자리에 서 있었을까. 에드릭이 잠들 때까지, 매일 밤.)"
            - "한참 뒤, 하인이 처음으로 고개를 숙이지 않고 대답했다."
            - 하인: "…편히 쉬십시오, 도련님."
            - "멀어지는 발소리가 처음엔 조심스럽다가, 계단 근처에서 조금 가벼워졌다."
            - when: "edric.reformed >= 1"
              속마음: "(조금씩이다. 에드릭 벨모어라는 이름의 무게를, 조금씩 덜어 낸다.)"
        - text: 벽을 걷어찬다
          effects: ["affinity.bruno -= 3", "stress += 3"]
          lines:
            - "발을 들어 벽을 걷어찼다."
            - "쿵."
            - "벽에 걸린 액자가 덜컥 흔들렸다. 웃음소리가 뚝 그쳤다."
            - 학생 A: "(벽 너머로, 아주 작게) …불 꺼. 빨리."
            - "옆방의 촛불이 꺼지는 기척. 그날 밤 웃음소리는 다시는 들리지 않았다."
            - "문밖의 하인이 숨을 죽이는 소리까지 들릴 만큼, 조용해졌다."
            - 속마음: "(조용해졌다. 원작대로.)"
            - "발끝이 얼얼하다. 두꺼운 벽은 꿈쩍도 안 했는데, 무언가 깨지는 소리가 난 것 같다."
            - 속마음: "(…하나도 안 시원하다.)"
    - lines:
        - "귀족 동 맨 끝 방. 가장 싸고, 가장 춥고, 가장 조용한 방이다."
        - "입학 첫 주엔 창문이 닫히지 않아 밤마다 바람이 들었다. 브루노가 망치 하나로 고쳐 준 뒤로는 잘 닫힌다."
        - "대신 너무 조용하다."
        - "옆방 귀족 자제들은 주말마다 가문 마차를 타고 본가에 간다. 짐 싣는 소리, 문장 박힌 마차 문이 닫히는 소리."
        - "이 방 앞에는 마차가 서지 않는다."
        - "책상 위에 형님이 보낸 편지가 펼쳐져 있다. 빚 이야기가 세 줄, 안부가 한 줄."
        - "촛불을 끄려다 창밖을 봤다. 마당 건너 평민 동은 아직 환하다."
        - "평민 동 3층 창가에서 등불 하나가 흔들린다. 좌우로, 크게, 세 번."
        - "잠깐 멈췄다가, 다시. 좌우로, 크게, 세 번."
        - 속마음: "(…브루노? 저 덩치가 창틀에 매달려서 뭘 하는 거야.)"
        - "등불 뒤로 커다란 그림자가 보인다. 창틀이 반쯤 가려질 만큼 큰 그림자. 틀림없다."
        - 속마음: "(원작엔 이런 장면이 없었다. 몰락 귀족 엑스트라와 대장장이 아들이 창문으로 신호를 주고받는 장면 같은 건.)"
        - 속마음: "(이 방향이면, 받는 사람은 하나뿐이다.)"
      choices:
        - text: 촛불을 들어 똑같이 세 번 흔든다
          effects: ["dorm.signal = 1", "affinity.bruno += 4"]
          lines:
            - "촛불을 들고 창가로 갔다. 손바닥으로 불꽃을 가리고, 좌우로 크게, 세 번."
            - "건너편 등불이 멈췄다."
            - "그리고 미친 듯이 흔들렸다. 위아래로, 좌우로, 빙글빙글. 좋아서 날뛰는 게 여기서도 보인다."
            - "너무 흔들었는지 등불이 꺼졌다. 다시 켜는 데 한참 걸렸다. 혼자 웃음이 터졌다."
            - "다시 켜진 등불이 천천히, 세 번 흔들렸다. 그리고 꺼졌다."
            - 속마음: "(잘 자, 라는 뜻이겠지. 아마.)"
            - "그날 밤은 오랜만에 깊게 잤다."
            - "다음 날 아침, 브루노가 식당에서 쟁반을 쾅 내려놓으며 의기양양하게 말했다."
            - 브루노@웃음: "우리 신호 정했다. 세 번은 '잘 자'. 두 번은 '배고파'."
            - 나: "한 번은?"
            - 브루노: "한 번은… 음. '도와줘'. 그건 안 쓰는 게 제일 좋은 거고."
            - 브루노@진지: "근데 쓰면, 나 바로 건너간다. 창문으로든 문으로든."
        - text: 커튼을 친다
          effects: ["affinity.bruno += 1"]
          lines:
            - "커튼을 쳤다. 두꺼운 천 너머로 등불 빛이 어른거린다."
            - 속마음: "(장난이겠지. 내가 대답할 필요는 없다.)"
            - "등불은 한참 더 흔들렸다. 커튼 틈으로 새어 든 빛이 벽 위에서 흔들렸다. 좌우로, 세 번. 또 세 번."
            - "그리고 꺼졌다."
            - "어둠 속에 누워 천장을 봤다. 조용하다. 원래 이 방은 조용했다."
            - "다음 날 아침, 브루노가 식당에서 시무룩하게 다가왔다."
            - 브루노@슬픔: "어젯밤에 신호 보냈는데. …자고 있었구나."
            - 브루노@웃음: "괜찮아! 오늘 밤에 또 보낼게. 일찍 자지 마라."
            - 속마음: "(…포기를 모르는 녀석이다.)"

- id: dorm_snack_raid
  title: 야식 작전
  on: 휴식
  pool: true
  window: { from: "1.3.2", to: "1.7" }
  slots: [밤]
  chance: 0.5
  lines:
    - "자정. 배 속에서 천둥이 친다."
    - "저녁 스튜는 너무 묽었다. 감자 세 조각, 당근 두 조각. 세어 가며 먹었는데도 금방 끝났다."
    - "누워 있어도 소용없다. 천장 얼룩이 빵 모양으로 보이기 시작했다."
    - 속마음: "(이 몸, 한창 클 때다. 위장이 하루 세 끼로는 부족하다고 파업 중이다.)"
    - 브루노:
        - "(아래 칸에서 속삭이며) 야, 너도 배고프지? 식당 주방에 오늘 남은 빵 바구니 있는 거 봤어."
        - { when: "origin == '몰락귀족'", text: "(귀족 동 창문을 톡톡 두드리며) 야, 너도 배고프지? 식당 주방에 오늘 남은 빵 바구니 있는 거 봤어." }
        - { when: "origin == '몰락귀족' and dorm.signal", text: "(건너편 창에서 등불이 두 번 흔들렸다. '배고파'. 잠시 뒤 창문을 톡톡) 주방에 남은 빵 바구니 있는 거 봤어. 가자!" }
        - { when: "origin == '악역도련님'", text: "(복도에서 마주치자 움찔하며) 벨, 벨모어… 너도 배고프냐? 주방에 남은 빵 있는 거 봤는데. …같이 갈래?" }
    - 브루노: "사감 선배가 복도 끝에서 졸고 있어. 지금이 기회야."
    - 브루노@웃음: "배식할 때 똑똑히 봤어. 바구니 하나 가득. 내일 아침이면 딱딱해져서 버린대."
    - 브루노: "버릴 걸 먹는 거니까 도둑질 아니야. …구조 작전이야. 빵 구조."
    - 속마음: "(원작엔 이런 미니 이벤트도 없었다. 기숙사는 세이브 포인트였을 뿐이니까.)"
    - 속마음: "(그런데 지금은 이게 이 세계에서 가장 중요한 퀘스트처럼 느껴진다. 배가 고프니까.)"
    - "꼬르륵. 대답은 내 배가 먼저 했다."
  choices:
    - text: 작전에 합류한다
      check: { label: 사감 몰래 지나가기, value: "stat.민첩 + stat.지성 / 2 + 5 * talent.고양이반사신경 + luck", dc: 27 }
      success:
        lines:
          - 삽화: dorm_hall
          - "맨발로 복도에 나섰다. 바닥이 얼음장 같다."
          - "브루노가 앞장섰다. 저 덩치가 고양이처럼 걷는다. 할아버지 낮잠을 깨우지 않으려고 익힌 걸음이라고 했다."
          - "삐걱이는 셋째 계단을 건너뛰었다. 다섯째 계단도. 브루노가 손가락으로 하나하나 짚어 준다."
          - "계단 아래, 사감 선배가 의자에 기대 고개를 꾸벅이고 있다. 입가에 침이 반짝인다."
          - "숨도 안 쉬고 그 의자 뒤를 지났다. 사감 선배가 '음냐' 하고 고개를 돌렸다. 심장이 목까지 튀어 올랐다."
