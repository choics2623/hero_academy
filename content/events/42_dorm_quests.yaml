    - "잉크 한 방울이 종이 귀퉁이에 떨어졌다. 들꽃 하나가 까맣게 피었다."
    - 속마음: "(이 세계에서 내 편지를 받을 사람이 있던가. 이 몸에게는. 그리고 나에게는.)"
    - "창밖에서 누군가 우편 마차가 왔다고 외치는 소리가 들렸다. 펜촉이 다시 마르기 시작했다."
    - "펜을 들었다 놓았다, 세 번. 들꽃 편지지는 세 장 남았다."
