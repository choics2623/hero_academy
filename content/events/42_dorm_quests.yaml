# 기숙사 생활 · 사이드 퀘스트 · 일상 만남 (1학년 1학기)
#
# 1) 기숙사의 밤 — 휴식에 걸린 만남 풀(pool). 쉬는 것도 생활이다.
#    룸메이트(출신별), 야식 작전, 기숙사 유령, 텅 빈 주말, 계단참의 울음, 편지, 천둥, 잠 못 드는 밤.
# 2) 사이드 퀘스트 — 3단계 연쇄 다섯 개. 플래그와 "나중의 방문"으로 잇는다 (한자리에서 next로 잇지 않는다).
#    다음 단계는 "다음 주 이후의 방문"에 열린다: 단계를 마칠 때 주차(time.month * 4 + time.week)를 *.wk에
#    적어 두고, 다음 단계 조건에서 그보다 커졌는지 본다. (핀의 쪽지만은 수업 뒤 첫 휴식 — count.휴식 스냅샷)
#      ① 도서관 밤의 발소리   libnight.step  도서관(밤) → 도서관(밤) → 도서관        보상: 사서 인연, 밤의 서가지기
#      ② 핀에게 글자 가르치기  finn.letters   식당 → 산책(호숫가) → 휴식(문틈의 쪽지)  보상: 핀 인연
#      ③ 도로시의 시제품 시험  dorothy.trial  식당/아르바이트 ×3                     보상: 강장제
#      ④ 호숫가 고양이        cat.step       enc_walk_cat 이후 산책 ×3 → 쥐 떼 전투
#      ⑤ 신문부의 사라진 기사  news.case      신문부 → 신문부 → 훈련장/검술부        보상: 카이든의 어깨 정보
# 3) 일상 만남 — 산책·식당·훈련장·도서관·마법실습·성당의 만남 풀 추가.

# ================================================================ 기숙사의 밤 (휴식)

- id: dorm_bruno_night
  title: 2층 침대의 밤
  on: 휴식
  pool: true
  window: { from: "1.3.2", to: "1.7" }
  slots: [밤]
  repeat: 3
  cooldown: 3
  chance: 0.6
  when: "origin != '악역도련님' and origin != '몰락귀족'"
  branch:
    - when: "fired.dorm_bruno_night >= 3"
      lines:
        - "불을 끄고 한참 뒤. 아래 칸에서 브루노가 몸을 뒤척인다."
        - 브루노: "야. 너 그거 알아? 너 자면서 이상한 말 해."
        - 브루노: "'세이브', '로드', 그리고… '이번 회차는 다르게 간다'. 회차가 뭐야? 무슨 주문이야?"
        - 속마음: "(…3,000시간의 습관이 잠꼬대로 새고 있었다.)"
      choices:
        - text: "\"고향 사투리야\""
          effects: ["affinity.bruno += 2"]
          lines:
            - 브루노@웃음: "사투리? 너네 고향 말 진짜 이상하다. 하하."
            - "브루노는 금방 다시 코를 골았다. 나는 한참 천장만 봤다."
        - text: "\"꿈에서 아주 긴 게임을 했어. 몇 번을 해도 지는 게임\""
          effects: ["affinity.bruno += 4", "trust.bruno += 4"]
          lines:
            - 브루노: "몇 번을 해도 지는 게임? 그걸 왜 계속해."
            - 나: "…이기고 싶어서."
            - 브루노: "그럼 이번엔 이기겠네. 이번엔 내가 옆에 있으니까."
            - "아래 칸에서 커다란 주먹 하나가 쑥 올라왔다. 주먹을 맞부딪쳤다."
        - text: 자는 척한다
          effects: ["affinity.bruno += 1"]
          lines:
            - 브루노: "…자냐. 그래, 자라."
            - 브루노: "회차가 뭔지는 몰라도. 너 요즘 너무 혼자 다 짊어진 얼굴이야."
    - when: "fired.dorm_bruno_night >= 2"
      lines:
        - "자정 넘어 눈을 떴다. 책상에 촛불이 켜져 있다."
        - "브루노가 커다란 몸을 웅크리고 앉아 교과서를 노려보고 있다. 『마법학 개론』. 거꾸로다."
        - 브루노@당황: "아, 깼냐? 미안. 시험 생각하니까 잠이 안 와서."
        - 브루노: "망치는 쥐면 손이 알아서 움직이는데, 글자는 쥘 데가 없어."
      choices:
        - text: 같이 공부한다 (지성)
          check: { label: 벼락치기 과외, value: "stat.지성 + stat.매력 / 2 + luck", dc: 26 }
          success:
            lines:
              - "마법진을 대장간 풀무에 빗대 설명했다. 바람이 들어가는 구멍, 불이 세지는 자리."
              - 브루노@놀람: "…어? 이거 그냥 풀무잖아? 왜 책엔 이렇게 어렵게 써 놨어!"
              - "새벽닭이 울 무렵, 브루노는 마법진 세 개를 혼자 그렸다."
            effects: ["affinity.bruno += 5", "stat.지성 += 0.5", "fatigue += 5"]
          fail:
            lines:
              - "둘 다 교과서를 베고 잠들었다. 아침에 보니 브루노 뺨에 마법진이 거꾸로 찍혀 있다."
              - 브루노: "이거 시험 때까지 안 지워지면 커닝이냐?"
            effects: ["affinity.bruno += 3", "fatigue += 5"]
        - text: "\"자. 내일 아침에 같이 보자\""
          effects: ["affinity.bruno += 2"]
          lines:
            - 브루노: "…그래. 내일 아침. 약속이다."
            - "촛불이 꺼지고, 1분도 안 돼서 코 고는 소리가 들렸다."
    - lines:
        - "불을 끈 지 한참. 아래 칸에서 삐걱, 삐걱."
        - 브루노: "…너 자? 나 침대가 너무 짧아. 발이 허공에 떠 있어."
        - 브루노: "고향에선 대장간 바닥에서 잤거든. 화로 옆이 제일 따뜻해. 쇠 식는 소리 들으면서."
        - 브루노: "너는? 졸업하면 뭐 할 거야?"
      choices:
        - text: "\"세상이 망하는 걸 막을 거야\""
          effects: ["affinity.bruno += 4", "trust.bruno += 3"]
          lines:
            - "아래 칸이 조용해졌다. 그러다 브루노가 크게 웃었다. 벽이 울렸다."
            - 브루노@웃음: "크게 나오네! 좋아. 그럼 난 네 검을 쳐줄게. 세상 구하는 검."
            - 속마음: "(농담인 줄 아는 게 낫다. 지금은.)"
            - when: "bruno.warned"
              나레이션: "웃음 끝에 브루노가 작게 덧붙였다. \"…수도가 위험해진다던 거. 그것도 그 얘기야?\""
        - text: "\"그냥, 살아남는 거\""
          effects: ["affinity.bruno += 3"]
          lines:
            - 브루노: "그거 중요하지. 대장장이도 첫째는 손가락 안 잘리는 거야."
        - text: "\"너는?\""
          effects: ["affinity.bruno += 3"]
          lines:
            - 브루노: "나? 제국 최고의 대장장이. 그리고 쌍둥이 동생들 신발 사 주기. 걔네 맨날 맨발로 뛰어다니거든."
            - "목소리가 점점 느려지더니, 문장 중간에 코 고는 소리로 바뀌었다."

- id: dorm_lonely_room
  title: 혼자 쓰는 방
  on: 휴식
  pool: true
  window: { from: "1.3.2", to: "1.7" }
  slots: [밤]
  chance: 0.6
  when: "origin == '악역도련님' or origin == '몰락귀족'"
  branch:
    - when: "origin == '악역도련님'"
      lines:
        - "벨모어가가 잡아 둔 1인실. 침대는 넓고, 벽은 두껍고, 밤은 길다."
        - "문밖에는 본가에서 따라온 하인이 서 있다. 내가 기침만 해도 문이 열릴 것이다."
        - "벽 너머에서 웃음소리가 샌다. 옆방 평민 동기들이다. 그중 제일 큰 목소리는 브루노."
        - 속마음: "(원작의 에드릭은 이 소리가 거슬린다며 벽을 걷어찼다. 그 뒤로 옆방은 영영 조용해졌고.)"
      choices:
        - text: 벽을 똑똑 두드려 본다
          effects: ["dorm.signal = 1", "affinity.bruno += 4"]
          lines:
            - "웃음소리가 뚝 그쳤다. 긴 정적."
            - "…똑, 똑."
            - "벽 너머에서 대답이 왔다. 조심스럽게, 두 번."
            - 브루노: "(벽 너머로) …벨모어? 너도 잠 안 오냐?"
            - "그날 밤, 벽을 사이에 두고 한참 떠들었다. 무슨 얘기를 했는지는 기억나지 않는다. 웃었던 것만 기억난다."
        - text: 하인에게 오늘은 들어가 쉬라고 한다
          effects: ["stress -= 5", "edric.reformed += 0.5"]
          lines:
            - 나: "오늘은 됐어. 가서 자."
            - "하인이 믿을 수 없다는 얼굴로 나를 본다. 무슨 함정인지 찾는 눈이다."
            - "한참 뒤, 처음으로 고개를 숙이지 않고 대답했다. ─ \"…편히 쉬십시오, 도련님.\""
            - when: "edric.reformed >= 1"
              속마음: "(조금씩이다. 에드릭 벨모어라는 이름의 무게를, 조금씩 덜어 낸다.)"
        - text: 벽을 걷어찬다
          effects: ["affinity.bruno -= 3", "stress += 3"]
          lines:
            - "쿵."
            - "웃음소리가 뚝 그쳤다. 그날 밤 다시는 들리지 않았다."
            - 속마음: "(조용해졌다. 원작대로. …하나도 안 시원하다.)"
    - lines:
        - "귀족 동 맨 끝 방. 브루노가 고쳐 준 창문은 이제 잘 닫힌다. 대신 너무 조용하다."
        - "옆방 귀족 자제들은 주말마다 가문 마차를 타고 본가에 간다. 이 방 앞에는 마차가 서지 않는다."
        - "마당 건너 평민 동 3층 창가에서 등불 하나가 흔들린다. 좌우로, 크게, 세 번."
        - 속마음: "(…브루노? 저 덩치가 창틀에 매달려서 뭘 하는 거야.)"
      choices:
        - text: 촛불을 들어 똑같이 세 번 흔든다
          effects: ["dorm.signal = 1", "affinity.bruno += 4"]
          lines:
            - "건너편 등불이 미친 듯이 흔들렸다. 좋아서 날뛰는 게 여기서도 보인다."
            - "다음 날 아침, 브루노가 식당에서 의기양양하게 말했다. \"우리 신호 정했다. 세 번은 '잘 자'. 두 번은 '배고파'.\""
        - text: 커튼을 친다
          effects: ["affinity.bruno += 1"]
          lines:
            - "등불은 한참 더 흔들리다가 꺼졌다."
            - "다음 날 브루노가 시무룩하게 말했다. \"어젯밤에 신호 보냈는데. …자고 있었구나.\""

- id: dorm_snack_raid
  title: 야식 작전
  on: 휴식
  pool: true
  window: { from: "1.3.2", to: "1.7" }
  slots: [밤]
  chance: 0.5
  lines:
    - "자정. 배 속에서 천둥이 친다. 저녁 스튜는 너무 묽었다."
    - 브루노:
        - "(아래 칸에서 속삭이며) 야, 너도 배고프지? 식당 주방에 오늘 남은 빵 바구니 있는 거 봤어."
        - { when: "origin == '몰락귀족'", text: "(귀족 동 창문을 톡톡 두드리며) 야, 너도 배고프지? 식당 주방에 오늘 남은 빵 바구니 있는 거 봤어." }
        - { when: "origin == '몰락귀족' and dorm.signal", text: "(건너편 창에서 등불이 두 번 흔들렸다. '배고파'. 잠시 뒤 창문을 톡톡) 주방에 남은 빵 바구니 있는 거 봤어. 가자!" }
        - { when: "origin == '악역도련님'", text: "(복도에서 마주치자 움찔하며) 벨, 벨모어… 너도 배고프냐? 주방에 남은 빵 있는 거 봤는데. …같이 갈래?" }
    - 브루노: "사감 선배가 복도 끝에서 졸고 있어. 지금이 기회야."
    - 속마음: "(원작엔 이런 미니 이벤트도 없었다. 기숙사는 세이브 포인트였을 뿐이니까.)"
  choices:
    - text: 작전에 합류한다
      check: { label: 사감 몰래 지나가기, value: "stat.민첩 + stat.지성 / 2 + 5 * talent.고양이반사신경 + luck", dc: 27 }
      success:
        lines:
          - "삐걱이는 셋째 계단을 건너뛰고, 졸고 있는 사감 선배의 의자 뒤를 숨도 안 쉬고 지났다."
          - "주방. 빵 바구니. 그리고 아직 온기가 남은 스튜 냄비."
        branch:
          - when: "found.dorothy"
            lines:
              - "냄비 앞에 먼저 온 사람이 있었다. 앞치마 차림의 도로시가 국자를 든 채 굳어 있다."
              - 도로시@당황: "…저, 저는 실험 중이었어요. 야식 아니에요. 진짜로."
              - 도로시@웃음: "…좋아요, 공범끼리 비밀. 엄마가 내일 팔려던 꿀빵인데, 하나씩만이에요!"
              - "주방 바닥에 셋이 쪼그려 앉아 꿀빵을 먹었다. 살면서 먹은 것 중 제일 맛있었다."
            effects: ["stress -= 8", "affinity.bruno += 4", "affinity.dorothy += 4"]
          - lines:
              - "주방 바닥에 쪼그려 앉아 식은 빵을 스튜에 찍어 먹었다. 브루노가 소리 죽여 웃다가 사레가 들렸다."
              - "살면서 먹은 것 중 제일 맛있었다."
            effects: ["stress -= 8", "affinity.bruno += 4"]
      fail:
        lines:
          - "셋째 계단이 삐걱— 울었다."
          - 선배: "거기 둘. 이 시간에 복도에서 뭐 하나. 이름."
          - "벌점. 내일 새벽 다섯 시, 기숙사 복도 걸레질."
          - "새벽. 양동이를 들고 나가니, 먼저 와서 바닥을 닦고 있는 청소부 소년이 있었다."
          - 핀@놀람: "…학생이 왜 걸레를 들고 있어요?"
          - 나: "야식 먹으려다 걸렸어."
          - 핀@웃음: "아. …그럼 저쪽 끝부터 해요. 거기가 제일 덜 더러워요."
        effects: ["fatigue += 10", "met.finn = 1", "affinity.finn += 3", "affinity.bruno += 2"]
    - text: 말린다 (자야 내일 훈련을 한다)
      effects: ["affinity.bruno += 1", "stress -= 3"]
      lines:
        - 브루노: "에이, 재미없는 놈."
        - "한 시간 뒤, 빵 반쪽이 머리맡에 쑥 놓였다. 커다란 손이 엄지를 들어 보이고 사라졌다."

- id: dorm_ghost
  title: 3층 세탁실의 유령
  on: 휴식
  pool: true
  window: { from: "1.4", to: "1.7" }
  slots: [밤]
  chance: 0.5
  lines:
    - "요즘 기숙사에 도는 소문이 있다."
    - 학생들: "3층 끝 세탁실 말이야. 자정만 되면 안에서 흐느끼는 소리랑 쇠사슬 끄는 소리가 난대."
    - 학생들: "백 년 전에 졸업 시험 떨어진 선배가 거기서… 아무튼 그 선배 유령이래."
    - "그리고 지금, 자정. 복도 끝에서 정말로 소리가 난다. 달그락. 끄으으."
    - when: "talent.겁쟁이"
      나레이션: "이불을 정수리까지 끌어올렸다. 발가락이 이불 밖으로 나왔다. 다시 넣었다."
  choices:
    - text: 직접 확인하러 간다
      check: { label: 담력, value: "stat.의지 - 5 * talent.겁쟁이 + 5 * talent.강철멘탈 + luck", dc: 22 }
      success:
        lines:
          - "세탁실 문을 열었다. 달빛 아래, 빨랫감 더미 위에 사람이 누워 있다."
          - "가슴 위에 빈 술병 세 개. 뒤척일 때마다 서로 부딪혀 달그락거린다. 쇠사슬 소리의 정체다."
          - "흐느끼는 소리라고 생각했던 건—코 고는 소리였다."
          - 노엘@당황: "…으음? 누구야. 사감이면 나 여기 없다."
          - 노엘: "기숙사비가 좀 밀려서 방에서 쫓겨났거든. 세탁실 따뜻하다? 비밀이야. 유령은 비밀 유지가 생명이라고."
        effects: ["met.noel = 1", "affinity.noel += 4", "noel.laundry = 1"]
      fail:
        lines:
          - "세탁실 문고리를 잡는 순간, 안에서 '끄으으으' 하는 소리가 바로 귓가에서 났다."
          - "정신을 차려 보니 내 방 침대 위였다. 어떻게 돌아왔는지 기억이 없다."
          - "다음 날 아침, 소문이 하나 늘어 있었다. ─ 1학년 하나가 유령 보고 맨발로 계단을 세 칸씩 뛰어 내려갔대."
        effects: ["stress += 5"]
    - text: 이불을 뒤집어쓴다
      effects: ["stress += 2"]
      lines:
        - 속마음: "(원작엔 기숙사 유령 같은 건 없었다. …없었던 거 맞지? 기숙사 맵은 들어가 본 적도 없잖아.)"
        - "달그락. 끄으으. 소리는 새벽까지 이어졌다. 이상하게 박자가 일정했다. 코 고는 사람처럼."

- id: dorm_homesick
  title: 텅 빈 주말
  on: 휴식
  pool: true
  window: { from: "1.3.2", to: "1.7" }
  slots: [주말]
  chance: 0.6
  lines:
    - "주말 오후. 다들 본가에 가거나 시내로 나가서 기숙사가 텅 비었다."
    - "창으로 들어온 햇빛 속에서 먼지가 천천히 돈다. 시계 소리가 너무 크다."
    - "문득, 컵라면 냄새가 그리워졌다."
    - "모니터 불빛. 새벽 세 시의 편의점. ‘밥은 먹고 하냐’라고 묻던 문자. 답장을 안 했던 것 같다."
    - 속마음: "(3,000시간 동안 이 세계를 들여다봤다. 이제 이 세계 안에서는, 그쪽을 들여다볼 방법이 없다.)"
    - when: "talent.몸주인의잔재"
      나레이션: "가슴 한쪽이 같이 아프다. 이 몸도 누군가를 그리워하고 있다. 내가 모르는 누군가를."
    - when: "item.일기장"
      나레이션: "몸 주인의 일기장을 펼쳤다. 찢긴 마지막 장 자리가 오늘따라 더 비어 보인다."
  choices:
    - text: 원래 세계의 일을 노트 뒷장에 적는다
      effects: ["stat.의지 += 1", "stress -= 5"]
      lines:
        - "집 주소. 엄마 전화번호. 즐겨 먹던 라면 이름. 3,000시간짜리 세이브 파일 이름."
        - "적고 나니 손이 떨렸다. 잊어버릴까 봐 무서웠다는 걸, 적고 나서야 알았다."
    - text: 창을 열고 운동장을 내려다본다
      effects: ["stress -= 8"]
      lines:
        - "텅 빈 운동장에서 누군가 혼자 목검을 휘두르고 있다. 주말에도."
        - 나레이션:
            - "멀어서 누군지는 모르겠다. 그래도 저 사람도 집에 안 간 거다."
            - { when: "affinity.aren >= 10", text: "아렌이다. 양치기 마을은 아카데미에서 너무 멀다. 저 녀석도 집에 못 간 거다." }
            - { when: "found.finn", text: "빗자루를 든 작은 그림자. 핀이다. 저 아이는 돌아갈 집이 없다." }
        - when: "cat.friend"
          나레이션: "창틀에 얼룩 고양이가 폴짝 올라와 앉았다. 기숙사 3층까지 어떻게 올라왔는지는 모르겠다. 같이 운동장을 내려다봤다."
        - "조금 덜 외로워졌다."
    - text: 낮잠을 잔다
      effects: ["fatigue -= 10"]
      lines:
        - "꿈에서 PC방 의자에 앉아 있었다. 화면 속에 이 기숙사 방이 보였다. 침대 위에 누가 자고 있었다."
        - "깨고 나니 베개가 젖어 있었다."

- id: dorm_crying
  title: 계단참의 울음소리
  on: 휴식
  pool: true
  window: { from: "1.4", to: "1.7" }
  slots: [밤]
  chance: 0.5
  lines:
    - "물을 마시러 나왔다가 계단참에서 멈췄다. 누가 울고 있다. 소리를 죽이느라 어깨만 들썩인다."
    - "주근깨투성이 얼굴. D반 맨 뒷자리에 앉는 녀석이다. 이름이… 토마스."
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(토마스. 원작에선 대사 한 줄 없이 10월 첫 토벌에서 죽는 D반 엑스트라. 아렌이 처음으로 동료를 잃는 장면의, 그 '동료'.)"
    - when: "not perk.고인물의기억 and not perk.공략위키편집자"
      속마음: "(토마스… 어디서 들어 본 이름인데. 위키 어딘가에서.)"
    - when: "origin == '악역도련님'"
      나레이션: "토마스가 나를 보고 숨을 들이켰다. 울음이 뚝 그쳤다. 벨모어가 망나니 앞에서 우는 건 위험한 일이니까."
  choices:
    - text: 말없이 옆에 앉는다
      effects: ["thomas.comforted = 1", "stress -= 3"]
      lines:
        - "계단에 나란히 앉았다. 한참 아무 말도 하지 않았다."
        - "\"…집에서 편지가 왔어.\" 토마스가 코를 훌쩍였다. \"소가 죽었대. 내 학비 때문에 팔기로 했던 소.\""
        - "\"나 같은 게 아카데미 와서 뭐 하나 싶어서. D반에서도 제일 느린데.\""
        - "어깨를 한 번 툭 쳤다. 그걸로 충분했던 모양이다. 토마스가 소매로 얼굴을 문질렀다."
        - when: "origin == '악역도련님'"
          나레이션: "\"…벨모어가 도련님이 이런 사람인 줄 몰랐어.\" 나도 몰랐다."
    - text: "\"울 거면 방에서 울어. 사감 온다\""
      effects: ["thomas.comforted = 1"]
      lines:
        - "토마스가 화들짝 놀라 일어섰다."
        - "\"고, 고마워.\" 무뚝뚝한 말을 경고로 알아들은 모양이다. 토마스는 계단을 뛰어 올라가다 한 번 돌아봤다."
    - text: 못 본 척 지나간다
      lines:
        - "물컵을 들고 방으로 돌아왔다. 울음소리는 오래 이어졌다."
        - when: "perk.고인물의기억 or perk.공략위키편집자"
          속마음: "(원작대로라면, 저 아이에게 남은 시간은 반년도 안 된다.)"

- id: dorm_letter
  title: 편지 쓰는 날
  on: 휴식
  pool: true
  window: { from: "1.3.2", to: "1.7" }
  slots: [방과후, 주말]
  chance: 0.5
  lines:
    - "매점에서 편지지를 샀다. 은화 한 닢짜리, 가장자리에 들꽃이 찍힌 종이."
    - "펜을 들었는데, 누구에게 써야 할지 모르겠다."
    - when: "cat.kitten == 'dorm'"
      나레이션: "트렁크 위에서 얼룩 새끼 고양이가 펜 끝을 쫓아 앞발을 휘두른다."
  choices:
    - text: 이 몸의 가족에게 쓴다
      branch:
        - when: "origin == '평민장학생'"
          lines:
            - "주소는 손이 먼저 썼다. 이 몸이 기억하는 주소다."
            - "── 어머니, 아버지께. 밥 잘 먹고 있어요. 친구도 생겼어요. 덩치가 산만 한데 착해요."
            - 속마음: "(얼굴도 모르는 사람들에게 '보고 싶어요'라고 썼다. 거짓말인데, 쓰고 나니 거짓말 같지가 않다.)"
          effects: ["stress -= 8"]
        - when: "origin == '몰락귀족'"
          lines:
            - "── 형님께. 빚 문제는 제가 졸업하면 어떻게든 하겠습니다. 그러니 가보는 더 팔지 마세요."
            - "마지막 줄을 지우고 다시 썼다. ── 그러니 형님도 밥은 거르지 마세요."
          effects: ["stress -= 5"]
        - when: "origin == '악역도련님'"
          lines:
            - "── 아버지께."
            - "거기서 펜이 멈췄다. 원작의 에드릭이 이 사람에게 무슨 말을 했었는지, 아무 기억도 없다."
            - "결국 받는 사람을 바꿨다. ── 집안의 늙은 하인에게. 그동안 미안했다고. 3층 안쪽 이야기, 고마웠다고."
            - when: "not servant.warning"
              나레이션: "고마웠다는 말은 지웠다. 아직 고마워할 일을 만들지 못했으니까. 대신 미안하다고 두 번 썼다."
          effects: ["stress -= 5", "edric.reformed += 0.5"]
        - when: "origin == '숲고아'"
          lines:
            - "숲에는 주소가 없다. 넓은 나뭇잎 한 장에 펜으로 꾹꾹 눌러 썼다. ── 잘 지내. 여기도 나무는 있어."
            - "창밖에 나뭇잎을 내밀었다. 바람이 기다렸다는 듯 채 갔다."
          effects: ["stress -= 8"]
        - lines:
            - "이 몸에게는 편지를 보낼 사람이 없다. 눈을 뜬 여관의 주인이 전부였다."
            - "그래서 여관 주인에게 썼다. ── 외상 방값, 아직 남았죠? 갚을게요."
            - 속마음: "(이게 이 몸의 유일한 인간관계라니. …엑스트라답다.)"
          effects: ["stress -= 3"]
    - text: 10년 뒤의 나에게 쓴다
      effects: ["letter.future = 1", "stat.의지 += 1"]
      lines:
        - "── 10년 뒤의 나에게."
        - "── 이 편지를 읽고 있다면, 세계는 아직 있는 거다. 그럼 잘한 거야."
        - "── 못 읽고 있다면… 아니다. 그런 건 쓰지 말자."
        - "봉투를 봉해 트렁크 맨 밑바닥에 넣었다. 뜯을 날을 정해 두는 것만으로, 숨쉬기가 조금 편해졌다."
    - text: 부칠 곳 없는 편지를 쓴다 (원래 세계로)
      effects: ["stress -= 10"]
      lines:
        - "── 엄마. 나 게임 속에 들어왔어. 웃기지."
        - "── 밥은 잘 먹어. 여기 감자 스튜 진짜 맛있다. 엄마 된장찌개보다는 아니고."
        - "한 장을 꽉 채우고 나서, 촛불에 끝을 댔다. 재가 창밖으로 날아갔다."
        - 속마음: "(어디로든 가겠지. 이 세계가 게임이라면, 바깥도 어딘가 있을 테니까.)"

- id: dorm_storm
  title: 천둥 치는 밤
  on: 휴식
  pool: true
  window: { from: "1.4", to: "1.7" }
  slots: [밤]
  chance: 0.5
  lines:
    - "자정 무렵, 하늘이 찢어졌다."
    - "번쩍. 창밖의 첨탑이 하얗게 떠올랐다가 사라진다. 기숙사 마력등이 일제히 꺼졌다."
    - "번개가 칠 때마다 눈꺼풀 안쪽에 같은 그림이 겹친다. 붉은 하늘. 무너진 첨탑. 서른일곱 번 본 엔딩 일러스트."
    - when: "letter.future"
      나레이션: "트렁크 밑바닥의 편지가 생각났다. 10년 뒤의 나에게. 그 봉투를 뜯을 날까지."
    - when: "cat.kitten == 'dorm'"
      나레이션: "침대 밑에서 새끼 고양이가 가늘게 울었다. 손을 넣자 손가락을 꼭 물고 놓지 않는다."
    - when: "dorm.signal"
      나레이션: "천둥이 칠 때마다 건너편에서 브루노의 신호가 온다. 괜찮냐고. 한 번도 빠짐없이."
  choices:
    - text: 휴게실에 모인 애들과 괴담 대회를 연다
      check: { label: 괴담 대회, value: "stat.매력 + stat.지성 / 2 + luck", dc: 26 }
      success:
        lines:
          - "촛불 하나를 가운데 두고 둘러앉았다. 내 차례가 왔다."
          - 나: "…어떤 게임이 있었대. 엔딩이 서른일곱 개인데, 전부 같은 문장으로 끝나."
          - 나: "'그리고 세계는, 다시 처음으로.'"
          - "번쩍. 천둥. 누군가 비명을 질렀다. 그리고 박수가 터졌다. 오늘 밤 우승이다."
          - 속마음: "(제일 무서운 건, 이게 지어낸 얘기가 아니라는 거지만.)"
        effects: ["reputation += 3", "stress -= 5"]
      fail:
        lines:
          - "에테크 커뮤니티 최고의 괴담을 들려줬다. 아무도 이해하지 못했다. '세이브 파일'부터 설명해야 했다."
          - "결국 우승은 '사감 선배의 가발' 이야기가 차지했다."
        effects: ["stress -= 3"]
    - text: 아래 칸의 브루노를 살핀다
      when: "origin != '악역도련님' and origin != '몰락귀족'"
      effects: ["affinity.bruno += 4"]
      lines:
        - "아래 칸이 이상하게 조용하다. 내려다보니 브루노가 이불을 머리끝까지 뒤집어쓰고 떨고 있다."
        - 브루노@당황: "…웃지 마. 어릴 때 대장간 굴뚝에 벼락이 떨어졌거든. 화로가 터져서… 할아버지가 다치셨어."
        - "그 큰 등이 천둥 칠 때마다 움찔한다. 아래 칸으로 내려가 등을 맞대고 앉았다."
        - 브루노: "…고맙다. 이거 아무한테도 말하지 마라. 특히 카이든."
    - text: 온실로 뛰어간다 (화분이 걱정된다)
      when: "club == '원예부' or affinity.liana >= 15"
      effects: ["affinity.liana += 5", "fatigue += 10"]
      lines:
        - "온실 유리 지붕 한 칸이 바람에 날아가 있었다. 쏟아지는 빗물 아래에서 누군가 맨손으로 화분을 옮기고 있다."
        - 리아나@놀람: "너, 너 왜 왔어? 다 젖었잖아!"
        - "말 대신 화분을 들었다. 리아나가 몇 번이나 멈춰 서서 숨을 골랐다. 무거운 건 전부 내가 들었다."
        - "새벽까지 화분 마흔 개를 옮겼다. 하나도 죽지 않았다."
        - when: "liana.song"
          나레이션: "마지막 화분을 내려놓고, 리아나가 작게 노래를 불렀다. 그날 내가 흥얼거렸던, 이 세계에 없는 노래였다."
        - 리아나@웃음: "…고마워. 혼자였으면 반은 죽었을 거야."
    - text: 창가에서 번개를 센다
      effects: ["stat.의지 += 0.5"]
      lines:
        - "번쩍. 하나. 둘. 셋. 쿠르릉."
        - "숫자를 세다 보니 숨이 고르게 돌아왔다. 번개는 번개일 뿐이다. 아직은."

- id: dorm_timeline
  title: 잠 못 드는 밤의 연표
  art: rooftop
  on: 휴식
  pool: true
  window: { from: "1.5", to: "1.7" }
  slots: [밤]
  chance: 0.5
  lines:
    - "잠이 오지 않는다. 담요를 챙겨 기숙사 지붕으로 올라갔다."
    - "달빛 아래 종이를 펼쳤다. 머릿속에만 있던 걸 처음으로 꺼내 적는다. 10년짜리 연표."
    - "── 1학년 3월. 세라, 반 배정 시험 탈락."
    - when: "fate.sera == 'saved' or fate.sera == 'saved_quiet'"
      나레이션: "그 줄에 선을 긋고, 옆에 작게 적었다. 생존."
    - "── 1학년 5월. 에드릭 벨모어, 미궁 3층에서 사망."
    - 나레이션:
        - "그 줄은 그대로 두었다. 아직은."
        - { when: "fate.edric == 'dead'", text: "그 줄은 그대로 두었다. 지울 수가 없었다." }
        - { when: "fate.edric and fate.edric != 'dead'", text: "그 줄에도 선을 그었다. 펜 끝이 조금 떨렸다." }
        - { when: "origin == '악역도련님' and fate.edric and fate.edric != 'dead'", text: "내 이름 위에 선을 그었다. 이상한 기분이다. 내 사망 예정일에 줄을 긋는다는 건." }
    - "── 2학년 여름, 리아나. 5년차, 가렌 교관. 6년차 겨울, 황제 암살. 8년차 봄, 차원문. 9년차 가을, 마왕."
    - "── 10년차. 그리고 세계는, 다시 처음으로."
    - when: "world.collapse >= 10"
      속마음: "(벌써 몇 줄이 어긋났다. 원작이 내 노트를 따라 주지 않는 날이 온다. 그날부터가 진짜다.)"
  choices:
    - text: 끝까지 정리한다
      effects: ["stat.지성 += 1", "fatigue += 5"]
      lines:
        - "동이 틀 때까지 썼다. 사건마다 날짜, 장소, 필요한 것, 막을 방법."
        - "'막을 방법' 칸의 절반은 비어 있다. 그래도 빈칸이 어디인지 아는 것과 모르는 것은 다르다."
    - text: 종이를 태운다 (누가 보면 끝이다)
      effects: ["stress -= 5"]
      lines:
        - "성냥을 그었다. 불꽃 속에서 10년이 오그라든다."
        - 나레이션:
            - "머릿속에만 있으면 된다. 지금까지도 그랬으니까."
            - { when: "talent.망각증", text: "머릿속에만 있으면 된다. …이 머리가 잘 잊는다는 게 문제지만." }
            - { when: "talent.완전기억", text: "머릿속에만 있으면 된다. 이 머리는 한 글자도 잊지 않는다." }
    - text: 종이를 접어 지붕 기와 밑에 숨긴다
      effects: ["stress -= 3", "stat.의지 += 0.5"]
      lines:
        - "기와 한 장을 들어 그 밑에 끼웠다. 이 세계에서 나만 아는 장소가 하나 생겼다."

# ================================================================ 사이드 퀘스트 ① 도서관 밤의 발소리

- id: lib_night_1
  title: 도서관 밤의 발소리
  on: 도서관
  pool: true
  window: { from: "1.3.2", to: "1.7" }
  slots: [밤]
  lines:
    - "폐관 종이 울린 지 한참. 책상에 엎드려 깜빡 잠들었던 모양이다."
    - "촛불은 꺼졌고, 창으로 들어온 달빛만 서가 사이에 길게 누워 있다. 문은 밖에서 잠겼다."
    - "또각. 또각."
    - "누군가 서가 사이를 걷는다. 아주 느리게. 길을 다 외운 사람처럼, 한 번도 멈추지 않고."
    - 속마음: "(원작 도서관 맵은 밤엔 들어갈 수조차 없었다. 잠긴 문 너머에서 이런 소리가 났다고?)"
    - when: "talent.겁쟁이"
      나레이션: "다리가 의자에 붙어 버린 것 같다."
  choices:
    - text: 발소리를 따라간다
      check: { label: 숨죽이고 따라가기, value: "stat.민첩 + stat.의지 / 2 + luck", dc: 26 }
      success:
        lines:
          - "서가 세 줄을 건넜다. 금서 서가 앞, 흔들리는 등불 하나가 모퉁이를 돌아 사라진다."
          - "등불이 머물던 열람대에 지도책이 펼쳐져 있다. 누렇게 바랜 종이, 지금은 없는 나라들의 이름."
          - "그 위로, 누군가 손가락으로 길을 짚어 내려간 자국이 먼지 위에 선명하다."
        effects: ["libnight.step = 1", "libnight.wk = time.month * 4 + time.week", "stat.지성 += 0.5"]
      fail:
        lines:
          - "모퉁이를 돌다 사다리를 걷어찼다. 쾅. 책 세 권이 머리 위로 쏟아졌다."
          - "발소리가 멈췄다. 그리고 다시는 들리지 않았다."
          - "창문으로 기어 나와 기숙사까지 뛰었다. 등 뒤가 계속 서늘했다."
        effects: ["libnight.step = 1", "libnight.wk = time.month * 4 + time.week", "stress += 5"]
    - text: 숨을 죽이고 기다린다
      effects: ["libnight.step = 1", "libnight.wk = time.month * 4 + time.week", "stress -= 3"]
      lines:
        - "발소리가 다가온다. 내 자리 바로 뒤에서 멈췄다. 숨을 참았다."
        - "…아무 일도 없었다. 어깨 위로 담요 한 장이 덮였을 뿐."
        - "고개를 들었을 땐 아무도 없었다. 담요에서 오래된 종이 냄새가 났다."
    - text: 창문으로 빠져나간다
      effects: ["stress += 3"]
      lines:
        - 속마음: "(도서관 유령 같은 건 없다. 없어야 한다. 원작에 없었으니까.)"
        - "창틀을 넘는 순간, 등 뒤에서 발소리가 아주 잠깐 멈춘 것 같았다."

- id: lib_night_2
  title: 밤의 서가
  art: library
  on: 도서관
  window: { from: "1.3.2", to: "1.7" }
  slots: [밤]
  when: "libnight.step == 1 and time.month * 4 + time.week > libnight.wk"
  lines:
    - "그날 이후로 도서관에 올 때마다 귀가 서가 쪽으로 쏠렸다. 오늘은 작정하고 남았다."
    - "폐관 종. 자물쇠 잠기는 소리. 달이 창 한가운데 걸릴 때까지."
    - "또각. 또각."
    - "이번엔 보인다. 흔들리는 등불, 그리고 그 등불을 든 굽은 등."
    - "사서 노인이다."
    - "노인은 서가 사이를 천천히 걸으며 책등을 하나씩 손끝으로 쓸어 본다. 아이 머리를 쓰다듬듯이."
    - "그러다 창가의 빈 의자 앞에서 멈춰 섰다."
    - 사서: "오늘은 비가 오려나 보군. 칼데라 고개 너머 은빛 숲에도 비가 오겠지. 자네는 비 오는 날을 제일 좋아했지."
    - "의자는 비어 있다. 노인은 대답을 들은 것처럼, 아주 조금 웃었다."
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(칼데라 고개. 지도에서 사라진 지명이다. …원작에서 이 사람은 대사 세 줄짜리 NPC였다. 그 세 줄 바깥에서, 매일 밤 이러고 있었던 거야?)"
    - when: "not perk.고인물의기억 and not perk.공략위키편집자"
      속마음: "(원작에서 이 사람은 대사 세 줄짜리 NPC였다. 그 세 줄 바깥에서, 매일 밤 이러고 있었던 거야?)"
    - when: "aren.librarian"
      나레이션: "성검의 목소리 일로 아렌이 이 노인을 찾아왔었다는 게 떠올랐다. 노인은 그때 뭐라고 대답했을까."
  plants:
    - { id: F15, notice: { value: "stat.지성 + 15 * talent.완전기억 + 10 * perk.고인물의기억", dc: 30 } }
  check: { label: 들키지 않기, value: "stat.민첩 + stat.지성 / 2 + luck", dc: 27 }
  success:
    lines:
      - "노인은 끝내 이쪽을 돌아보지 않았다. 등불이 금서 서가 안쪽으로 사라질 때까지, 숨소리 하나 내지 않았다."
    effects: ["libnight.step = 2", "libnight.wk = time.month * 4 + time.week", "stat.지성 += 0.5"]
  fail:
    lines:
      - "발밑에서 마룻바닥이 삐걱 울었다."
      - "등불이 멈췄다. 노인은 돌아보지 않은 채로 말했다."
      - 사서: "…거기 서 있지 말고 돌아가 자게. 바닥이 차네. 문은 열어 두었네."
      - "그게 다였다. 등불은 다시 걷기 시작했다."
    effects: ["libnight.step = 2", "libnight.wk = time.month * 4 + time.week", "libnight.caught = 1"]

- id: lib_night_3
  title: 밤의 서가지기
  on: 도서관
  window: { from: "1.3.2", to: "1.7" }
  when: "libnight.step == 2 and time.month * 4 + time.week > libnight.wk"
  effects: ["libnight.step = 3"]
  lines:
    - "대출 창구. 반납할 책을 내밀자, 사서 노인이 책 대신 내 손목을 툭 짚었다."
    - 사서:
        - "요 며칠, 밤마다 서가 뒤에서 숨소리가 나더군. 쥐치고는 숨이 길었어."
        - { when: "libnight.caught", text: "그날 밤 바닥이 찼을 텐데. 감기는 안 걸렸나." }
    - 속마음: "(…처음부터 알고 있었구나.)"
    - 사서: "밤에 걷는 건 늙은이 버릇일세. 잠이 안 오면 걷고, 걷다 보면 책들이 말을 걸지."
    - 사서: "자네도 잠이 안 오는 얼굴이야. 늘 뭔가를 세고 있는 눈이지. 남은 날짜 같은 걸."
    - "심장이 한 박자 늦게 뛰었다."
  choices:
    - text: "\"빈 의자에게… 누구랑 이야기하신 거예요?\""
      effects: ["affinity.librarian += 8"]
      lines:
        - "노인이 한참 창가 쪽을 바라봤다."
        - 사서: "오래된 친구들일세. 이제는 책 속에만 있는."
        - 사서: "책은 사람보다 오래 살지. 그래서 나는 책 곁에 있네. 여기 있으면, 그 친구들도 아직 어딘가 있는 것 같거든."
        - 속마음: "(묻고 싶은 게 산더미였다. 노인의 눈을 보고, 하나도 묻지 못했다.)"
    - text: "\"밤에 서가 정리, 제가 도울게요\""
      effects: ["affinity.librarian += 6", "libnight.keeper = 1", "stat.지성 += 1"]
      lines:
        - 사서: "…허. 젊은 녀석이 잠을 반납하겠다고."
        - "노인이 창구 밑에서 낡은 놋쇠 등불을 꺼내 내 앞에 놓았다. 손잡이가 반질반질하게 닳아 있다."
        - 사서: "밤에 올 거면 이걸 들고 오게. 어둠 속에서 책을 더듬는 건 책한테 실례야."
        - 시스템: "밤의 서가지기 — 밤에 도서관에 가면 가끔 서가 정리를 돕게 된다."
    - text: 아무것도 묻지 않고 고개를 숙인다
      effects: ["affinity.librarian += 10"]
      lines:
        - 사서: "…좋은 학생이군. 묻지 않는 것도 재주야."
        - "노인이 반납 도장을 쾅 찍었다. 그 소리가 이상하게 따뜻했다."

- id: lib_night_keeper
  title: 밤의 서가 정리
  on: 도서관
  pool: true
  slots: [밤]
  repeat: 3
  cooldown: 2
  when: "libnight.keeper"
  effects: ["affinity.librarian += 2", "stat.지성 += 1", "fatigue += 5"]
  branch:
    - when: "fired.lib_night_keeper >= 3"
      lines:
        - "놋쇠 등불을 들고 노인과 나란히 서가를 걸었다. 오늘은 둘 다 말이 없다."
        - "창가의 빈 의자 앞을 지날 때, 노인이 발을 멈추지 않았다. 처음이다."
        - 사서: "…자네가 있으니 오늘은 덜 적적하다는군."
        - "누가, 라고는 묻지 않았다."
    - when: "fired.lib_night_keeper >= 2"
      lines:
        - "반납 수레 맨 밑에 동화책 한 권이 끼어 있다. 『용사님과 일곱 별』."
        - "노인이 그 책을 받아 들더니, 다른 책보다 오래 표지를 쓸었다. 그리고 아주 낮은 칸, 아이 키 높이에 꽂았다."
        - 사서: "용사 이야기는 아이들 손이 닿는 데 있어야 해. 어른들 손이 닿는 데 두면, 다들 고쳐 쓰려고 하거든."
    - lines:
        - "등불 아래, 반납 수레의 책을 제자리에 꽂는다. 노인은 제목만 듣고도 서가 번호를 댄다. 수천 권을."
        - 사서: "마도학 3번 서가, 위에서 둘째 칸. …자네 지금 거꾸로 꽂았네."
        - "새벽이 되니 손끝이 먹물투성이다. 머릿속은 이상하게 맑다."

# ================================================================ 사이드 퀘스트 ② 핀에게 글자 가르치기

- id: finn_letters_1
  title: 앞사람과 같은 걸로
  on: 식당
  pool: true
  window: { from: "1.3.2", to: "1.7" }
  lines:
    - "배식 줄이 한산해진 식당. 빗자루를 벽에 세워 둔 청소부 소년이 배식 줄 맨 끝에 선다."
    - when: "found.finn"
      나레이션: "핀이다. 밤의 연무장에서 칼날 같던 눈이, 여기서는 바닥만 본다."
    - "소년은 메뉴판을 한참 올려다보다가, 앞사람이 받은 것과 똑같은 걸 달라고 했다."
    - "어제도 그랬다. 그제도."
    - 속마음: "(…메뉴판을 못 읽는구나.)"
    - "오늘 앞사람이 받은 건 매운 고추 스튜였다. 소년이 한 숟갈 뜨더니, 얼굴이 순식간에 시뻘게진다."
  choices:
    - text: 물을 가져다주고, 메뉴판을 읽어 준다
      effects: ["met.finn = 1", "affinity.finn += 3"]
      lines:
        - 핀@당황: "고, 고마워요. 이게 이렇게 매운 건 줄 몰라서… 앞사람이 맛있게 먹길래."
        - "메뉴판을 소리 내어 읽어 줬다. 감자 스튜, 고추 스튜, 보리빵, 오늘의 수프."
        - 핀: "…눈치챘어요? 저 글자 몰라요. 고아원에선 빗자루 잡는 법만 가르쳐 줬거든요."
        - 핀: "괜찮아요. 앞사람 따라 하면 되니까. 가끔 이렇게 매운 게 걸리지만."
      choices:
        - text: "\"글자, 내가 가르쳐 줄까?\""
          effects: ["finn.letters = 1", "finn.letters_wk = time.month * 4 + time.week", "affinity.finn += 4"]
          lines:
            - 핀@놀람: "…저를요? 학생이, 청소부한테요?"
            - "소년이 한참 숟가락만 내려다봤다."
            - 핀: "놀리는 거 아니면… 네. 배우고 싶어요. 메뉴판 정도는."
            - 핀: "청소 끝나는 시간에 호숫가 모래밭에 있을게요. 종이는 비싸니까요."
            - when: "finn.promise"
              속마음: "(제대로 가르쳐 줄 사람을 찾아 주겠다고 했었지. 검만 말한 건 아니었다.)"
        - text: "\"앞사람 따라 하는 것도 요령이지\""
          effects: ["affinity.finn += 1"]
          lines:
            - 핀: "그쵸? …그쵸."
            - "소년은 웃었지만, 메뉴판 쪽은 다시 올려다보지 않았다."
    - text: 못 본 척한다
      lines:
        - "소년은 스튜를 끝까지 다 먹었다. 눈물을 닦아 가며, 한 숟갈도 남기지 않고."

- id: finn_letters_2
  title: 호숫가의 글자 수업
  on: 산책
  window: { from: "1.3.2", to: "1.7" }
  when: "finn.letters == 1 and time.month * 4 + time.week > finn.letters_wk"
  lines:
    - "청소가 끝나는 시간의 호숫가. 핀이 빗자루 대신 나뭇가지를 들고 기다리고 있었다."
    - 핀: "진짜 왔네요. …안 올 줄 알았어요."
    - "젖은 모래 위에 첫 글자를 썼다. 핀이 그 옆에 따라 쓴다. 비뚤비뚤하다. 물결이 와서 둘 다 지웠다. 다시 썼다."
    - when: "found.finn"
      나레이션: "그런데 획을 긋는 손목만은 이상할 만큼 곧다. 밤의 연무장에서 보던 검 끝처럼, 망설임이 없다."
  check: { label: 글자 가르치기, value: "stat.지성 + stat.매력 / 2 + 5 * talent.사람좋은얼굴 + luck", dc: 26 }
  success:
    lines:
      - "해가 기울 무렵, 핀이 혼자서 한 단어를 썼다. 아무도 불러 주지 않으면 아무도 몰랐을 단어."
      - "── 핀."
      - 핀@놀람: "이게… 제 이름이에요? 이렇게 생겼어요?"
      - "핀은 모래 위의 제 이름을 한참 내려다봤다. 물결이 지울까 봐, 손바닥으로 둘레에 작은 둑을 쌓았다."
    effects: ["finn.letters = 2", "finn.letters_at = count.휴식", "affinity.finn += 5", "trust.finn += 3", "stat.매력 += 0.5"]
  fail:
    lines:
      - "핀의 나뭇가지가 자꾸 엉뚱한 쪽으로 간다. 세 번째로 지우고 나서, 핀이 가지를 내던졌다."
      - 핀@화남: "역시 안 돼요. 저 같은 건 원래 머리가—"
      - "그 말을 끝까지 하게 두지 않았다. 모래 위에 크게 썼다."
      - 핀: "…그게 뭔데요."
      - 나: "네 이름. 오늘은 이것만 외우자."
      - "핀이 한참 그 글자를 노려보다가, 던졌던 가지를 다시 주웠다."
    effects: ["finn.letters = 2", "finn.letters_at = count.휴식", "affinity.finn += 3", "trust.finn += 3"]

- id: finn_letters_3
  title: 문틈의 쪽지
  art: dorm_room
  on: 휴식
  window: { from: "1.3.2", to: "1.7" }
  when: "finn.letters == 2 and count.휴식 >= finn.letters_at + 1"
  effects: ["finn.letters = 3", "affinity.finn += 8", "trust.finn += 4", "stress -= 5"]
  lines:
    - "방으로 돌아오니 문틈에 종이가 끼워져 있다. 식당 냅킨을 반듯하게 네 번 접은 것."
    - "펼치자 삐뚤빼뚤한 글씨가 나왔다. 몇 번이나 지웠다 다시 쓴 자국이 냅킨에 보풀처럼 일어나 있다."
    - "── 고마어요. 핀."
    - "'워'가 아니라 '어'다. 그래도 읽을 수 있다. 충분히."
    - when: "origin != '악역도련님' and origin != '몰락귀족'"
      브루노: "그거 뭐야? 연애편지? …아, 그 청소부 꼬마? 아까 문 앞에서 한참 서성이더라. 노크는 안 하고."
    - 속마음: "(원작 데이터에는 검술 S, 이벤트 없음. 그게 이 아이에 대한 기록의 전부였다.)"
    - 속마음: "(이벤트가 없던 아이가, 처음으로 자기 이름을 썼다. 나한테.)"
  choices:
    - text: 몸 주인의 일기장, 찢긴 장 자리에 끼워 둔다
      when: "item.일기장"
      effects: ["item.핀의쪽지 = 1"]
      lines:
        - "찢겨 나간 마지막 장 자리에 쪽지를 끼웠다. 빈자리가 조금 덜 비어 보인다."
    - text: 지갑 안쪽에 넣어 둔다
      effects: ["item.핀의쪽지 = 1"]
      lines:
        - "은화보다 안쪽 칸에 넣었다. 잃어버리면 안 되는 쪽에."
    - text: 답장을 써서 청소부 창고 문틈에 끼워 둔다
      effects: ["trust.finn += 4"]
      lines:
        - "── '고마워요'의 '워'는 이렇게 써. 다음 수업은 '검'이야."
        - "다음 날, 내 방 문틈에 냅킨이 하나 더 끼워져 있었다. ── 워. 워. 워. 워. 검?"

# ================================================================ 사이드 퀘스트 ③ 도로시의 시제품 시험

- id: dorothy_trial_1
  title: 시식 부탁
  on: [식당, 아르바이트]
  pool: true
  window: { from: "1.3.2", to: "1.7" }
  repeat: 2
  cooldown: 2
  when: "(found.dorothy or affinity.dorothy > 0) and not dorothy.trial"
  lines:
    - 도로시@웃음: "마침 잘 왔어요! 손님, 아니 실험… 아니, 손님!"
    - "도로시가 앞치마 주머니에서 작은 유리병을 꺼낸다. 초록색과 분홍색 두 층으로 나뉜 액체. 흔들어도 안 섞인다."
    - 도로시: "졸음 쫓는 물약이에요. 엄마 몰래 만든 3번 시제품. 1번이랑 2번은… 묻지 마요."
    - 속마음: "(에테크 연금술 미니게임. 비율 하나만 틀려도 '수상한 액체'가 나오던 그 지옥. 실물로 보니 더 수상하다.)"
  choices:
    - text: 마신다
      check: { label: 시제품 3번, value: "stat.체질 + 10 * talent.만독불침 + luck", dc: 24 }
      success:
        lines:
          - "박하 맛이 정수리까지 치솟았다. 눈이 번쩍 뜨인다. 세상이 지나치게 선명하다. 벽의 나뭇결이 하나하나 다 보인다."
          - 도로시@놀람: "효과 있어요?! 진짜로?! 적어야지, 적어야지!"
        effects: ["dorothy.trial = 1", "dorothy.trial_wk = time.month * 4 + time.week", "affinity.dorothy += 4", "fatigue -= 10"]
      fail:
        lines:
          - "삼키는 순간 딸꾹질이 터졌다. 딸꾹. 딸꾹할 때마다 입에서 분홍색 거품이 하나씩 떠오른다."
          - 도로시@당황: "어… 부작용 칸에 '거품'이라고 적을게요. 미안해요, 정말로!"
          - "거품은 저녁때까지 나왔다. 식당 아이들이 줄을 서서 구경했다."
        effects: ["dorothy.trial = 1", "dorothy.trial_wk = time.month * 4 + time.week", "affinity.dorothy += 3", "stress += 3"]
    - text: "\"화분에 먼저 줘 보자\""
      effects: ["dorothy.trial = 1", "dorothy.trial_wk = time.month * 4 + time.week", "affinity.dorothy += 4", "stat.지성 += 0.5"]
      lines:
        - 도로시: "…천재예요? 왜 그 생각을 못 했지."
        - "창가의 시든 제라늄에 한 방울. 잎이 벌떡 일어서더니—좌우로 흔들흔들 춤을 췄다. 정확히 30초 동안."
        - 도로시: "음. 사람한텐 아직 이른 걸로."
    - text: 정중히 사양한다
      effects: ["affinity.dorothy += 1"]
      lines:
        - 도로시: "에이. 다음엔 꼭이에요! 실험 대상… 아니, 시식단은 늘 모자라거든요."

- id: dorothy_trial_2
  title: 비율의 문제
  on: [식당, 아르바이트]
  window: { from: "1.3.2", to: "1.7" }
  when: "dorothy.trial == 1 and time.month * 4 + time.week > dorothy.trial_wk"
  lines:
    - "배식대 뒤에서 도로시가 머리를 쥐어뜯고 있다. 앞에 놓인 종이에는 줄 그은 숫자들이 빼곡하다."
    - 도로시@슬픔: "4번부터 9번까지 전부 실패예요. 이번엔 뭉친 근육에 바르는 연고였는데… 바르면 근육이 더 뭉쳐요."
    - 도로시: "순서가 틀린 것 같은데 모르겠어요. 엄마 레시피엔 전부 '적당히'라고만 써 있고."
    - 속마음: "(에테크 연금술의 기본. 뿌리, 잎, 꽃 순서. 마력은 불을 끈 다음에. 3,000시간 중 300시간은 이 화면이었다.)"
  check: { label: 연금 비율 맞추기, value: "stat.지성 + stat.마력제어 / 2 + 5 * perk.공략위키편집자 + luck", dc: 28 }
  success:
    lines:
      - "뿌리부터 넣고, 잎이 떠오를 때 꽃을 넣는다. 마력은 불을 끈 다음. 도로시가 숨을 참고 내 손만 본다."
      - "탁하던 냄비 속이 투명한 호박색으로 맑아졌다."
      - 도로시@놀람: "…됐다. 됐어요! 어떻게 알았어요? 연금과 다녀요?"
      - 나: "…게임에서 봤어."
      - 도로시: "게임? 무슨 게임이 연금술을 가르쳐요? 나도 할래요!"
    effects: ["dorothy.trial = 2", "dorothy.trial_wk = time.month * 4 + time.week", "affinity.dorothy += 5", "stat.지성 += 0.5"]
  fail:
    lines:
      - "순서는 맞았는데 불이 셌다. 냄비가 '퐁' 소리를 내며 천장에 보라색 얼룩을 남겼다."
      - 도로시@웃음: "그래도 이번 건 덜 뭉쳐요! 방향은 맞았어요. 나머진 제가 해 볼게요."
      - "식당 아주머니가 천장을 올려다보며 한숨을 쉬었다. 도로시가 내 등 뒤로 숨었다."
    effects: ["dorothy.trial = 2", "dorothy.trial_wk = time.month * 4 + time.week", "affinity.dorothy += 3"]

- id: dorothy_trial_3
  title: 공동 개발자
  on: [식당, 아르바이트]
  window: { from: "1.3.2", to: "1.7" }
  when: "dorothy.trial == 2 and time.month * 4 + time.week > dorothy.trial_wk"
  effects: ["dorothy.trial = 3", "item.강장제 += 1", "affinity.dorothy += 8"]
  lines:
    - 도로시@웃음: "짜잔! 완성이에요. 10번 시제품, 정식 이름은 '도로시 강장제'!"
    - "손바닥만 한 병에 손글씨 라벨. 그 아래에 조그맣게 적혀 있다. ── 공동 개발자: {{player.name}}."
    - 도로시: "실습에서 다치면 마셔요. 한 병뿐이니까 아껴 쓰고요."
    - 시스템: "아이템 획득 — 강장제 (전투: 체력 40% 회복)"
    - 도로시: "그리고 있잖아요, 어제 연금술 교수님이 식당에 오셨거든요. 제 냄비 냄새를 맡더니 '재능이 있군. 언제 연구실에 한번 와라' 하셨어요!"
    - 도로시@웃음: "비스톨 교수님이요! 진짜 연구실이래요!"
    - 속마음: "(비스톨. 원작에서 그 연구실에 드나들던 학생들이 마지막에 어디에 서 있었는지, 나는 안다.)"
    - when: "perk.데이터마이너"
      속마음: "(DLC 데이터의 도로시 분기. '비스톨의 제자' 플래그가 켜진 도로시의 일러스트는, 웃고 있지 않았다.)"
  choices:
    - text: "\"연구실엔 혼자 가지 마\""
      effects: ["dorothy.bistol_warned = 1", "trust.dorothy += 5"]
      lines:
        - 도로시@놀람: "네? 왜요? …표정이 무서워요."
        - 도로시: "…알았어요. 가더라도 같이 가요. 약속. 새끼손가락."
    - text: "\"잘됐다. 축하해\""
      effects: ["affinity.dorothy += 2"]
      lines:
        - 도로시: "헤헤. 엄마한텐 아직 비밀이에요!"
        - 속마음: "(…지금은 아무 일도 일어나지 않았다. 아직은.)"

# ================================================================ 사이드 퀘스트 ④ 호숫가 고양이 (enc_walk_cat에서 이어짐)

- id: cat_1
  title: 얼룩 고양이의 선물
  on: 산책
  pool: true
  window: { from: "1.3.2", to: "1.7" }
  when: "fired.enc_walk_cat"
  lines:
    - 나레이션:
        - "호숫가. 그 얼룩 고양이가 다가와 내 발치에 무언가를 툭 떨어뜨린다. 죽은 쥐다. 엄청 크다."
        - { when: "talent.혐오스러운분위기", text: "호숫가. 그 얼룩 고양이가 멀찍이서 무언가를 툭 떨어뜨리고 물러선다. 죽은 쥐다. 선물인지 경고인지 모르겠다." }
        - { when: "talent.짐승의혈통", text: "호숫가. 그 얼룩 고양이가 내 발치에 죽은 쥐를 내려놓고, 아주 정중하게 앉는다. 부탁하는 얼굴이다." }
    - "그런데 고양이 배가 홀쭉하다. 젖이 불어 있다. 귀 끝이 찢어져 있다."
    - 속마음: "(새끼가 있다. 그런데 사냥한 쥐를 먹지 않고 들고 왔다는 건—)"
    - "고양이가 몇 걸음 가다 돌아보고, 또 몇 걸음 가다 돌아본다. 호숫가 끝, 낡은 보트 창고 쪽이다."
  choices:
    - text: 따라간다
      effects: ["cat.step = 1", "cat.wk = time.month * 4 + time.week"]
      lines:
        - "보트 창고 바닥 판자 틈새. 안쪽에서 새끼 고양이들의 가는 울음소리가 들린다."
        - "그리고 그보다 훨씬 많은, 무언가가 긁는 소리."
        - "판자 아래 지하 저장고에서 동굴 쥐 떼가 끓고 있다. 어미 혼자 감당할 숫자가 아니다."
        - 속마음: "(고양이 퀘스트라. 원작에 이런 게 있었으면 위키에 '보상: 없음'이라고 적었겠지. …없어도 할 거지만.)"
    - text: 쥐만 치워 주고 돌아선다
      lines:
        - "고양이는 한참 나를 보다가, 혼자 보트 창고 쪽으로 걸어갔다. 꼬리가 축 처져 있었다."

- id: cat_2
  title: 밤의 보트 창고
  on: 산책
  window: { from: "1.3.2", to: "1.7" }
  slots: [밤]
  when: "cat.step == 1 and time.month * 4 + time.week > cat.wk"
  lines:
    - "밤. 식당에서 몰래 챙긴 생선 꼬리를 들고 보트 창고를 다시 찾았다."
    - "어미 고양이가 판자 위에서 꼬리를 바짝 세우고 있다. 지난번보다 긁는 소리가 크다. 판자 틈 아래로 빨간 눈이 수십 개."
    - "생선 꼬리를 내려놓자 어미가 처음으로 내 손등에 머리를 비볐다. 그러고는 먹지 않고 새끼들에게 물고 갔다."
  check: { label: 저장고 살피기, value: "stat.지성 + stat.민첩 / 2 + 10 * talent.짐승의혈통 + 5 * talent.자연친화력 + luck", dc: 24 }
  success:
    lines:
      - "등불을 낮추고 판자 틈을 따라 기었다. 쥐들이 드나드는 구멍을 찾았다. 호수로 이어지는 낡은 배수구다."
      - 속마음: "(저걸 막고 싸우면 지원이 끊긴다. 레이드 기본이지.)"
    effects: ["cat.step = 2", "cat.wk = time.month * 4 + time.week", "cat.plan = 1"]
  fail:
    lines:
      - "어둠 속에서 쥐 한 마리가 튀어나와 손등을 물고 달아났다. 쥐 떼의 숫자만 확인했다. 많다."
    effects: ["cat.step = 2", "cat.wk = time.month * 4 + time.week", "stress += 3"]
  choices:
    - text: 브루노에게 도움을 청하기로 한다
      when: "met.bruno or affinity.bruno > 0"
      effects: ["cat.ally = 'bruno'"]
      lines:
        - "다음 날 아침 이야기했더니, 브루노가 소매부터 걷어붙였다."
        - 브루노@웃음: "고양이 구출 작전? 하하, 그런 거 좋아해! 판자랑 망치는 내가 챙긴다."
    - text: 리아나에게 도움을 청하기로 한다
      when: "affinity.liana >= 10"
      effects: ["cat.ally = 'liana'"]
      lines:
        - 리아나@놀람: "새끼 고양이? 몇 마리? …나도 갈래. 쑥이랑 박하를 태우면 쥐들이 싫어해. 챙겨 갈게."
    - text: 아렌에게 도움을 청하기로 한다
      when: "affinity.aren >= 10"
      effects: ["cat.ally = 'aren'"]
      lines:
        - 아렌: "양 우리 쥐잡이는 고향에서 내 담당이었어! …근데 성검으로 쥐 잡아도 되나? 성검이 삐지려나."
    - text: 혼자 해치운다
      lines:
        - 속마음: "(쥐 떼 하나에 파티를 짤 필요는 없다. …튜토리얼 몹이잖아.)"

- id: cat_3
  title: 보트 창고 아래
  on: 산책
  window: { from: "1.3.2", to: "1.7" }
  when: "cat.step == 2 and time.month * 4 + time.week > cat.wk"
  lines:
    - "결전의 날. …이라고 하기엔 상대가 쥐다."
    - 속마음: "(3,000시간 고인물의 아카데미 첫 퀘스트 보스가 쥐 떼라니. 위키 편집자 동료들이 알면 웃겠다.)"
    - when: "cat.ally == 'bruno'"
      브루노: "배수구는 내가 판자로 막는다. 너는 안으로!"
    - when: "cat.ally == 'liana'"
      리아나: "연기 피울게. 쥐들이 구석으로 몰리면, 그때야."
    - when: "cat.ally == 'aren'"
      아렌: "성검은 두고 왔어. 목검이면 충분하겠지?"
    - when: "cat.plan"
      나레이션: "그날 밤 봐 둔 배수구부터 돌로 막았다. 도망칠 구멍도, 지원 올 구멍도 없다."
    - "판자를 들어 올렸다. 빨간 눈이 일제히 이쪽을 향했다."
  battle:
    enemy: rats
    ally: "cat.ally"
    win:
      lines:
        - "마지막 쥐가 비명을 지르며 어둠 속으로 흩어졌다. 저장고가 조용해졌다."
        - "어미 고양이가 새끼들을 한 마리씩 물고 나와 내 발 앞에 나란히 내려놓는다. 하나, 둘, 셋, 넷."
        - "그리고 마지막으로 내 손등을 핥았다. 까끌까끌하다."
      effects: ["cat.step = 3", "cat.friend = 1", "stress -= 10"]
      branch:
        - when: "cat.ally == 'bruno'"
          lines:
            - 브루노@웃음: "봤냐? 넷 다 살았어! 이름은 내가 지을래. 망치, 모루, 집게, 풀무!"
          effects: ["affinity.bruno += 5"]
        - when: "cat.ally == 'liana'"
          lines:
            - 리아나@웃음: "넷 다 무사해. 엄마가 그랬어. 작은 생명 하나 지키는 손이, 큰 것도 지킨대."
          effects: ["affinity.liana += 5"]
        - when: "cat.ally == 'aren'"
          lines:
            - 아렌@웃음: "고향 생각난다. …나, 용사보다 이런 게 더 잘 맞는 것 같아."
          effects: ["affinity.aren += 5"]
        - lines:
            - "혼자서 해냈다. 손등은 엉망이지만, 넷 다 살았다."
      next: cat_3_kittens
    lose:
      lines:
        - "쥐 떼에 밀려 판자 위로 굴러 나왔다. 손등이 엉망이다."
        - "그때 어미 고양이가 혼자서 저장고로 뛰어들었다."
        - "새벽이 되어서야 소리가 그쳤다. 어미는 상처투성이로 기어 나왔다. 입에 새끼를 물고. 하나, 둘, 셋, 넷."
        - 속마음: "(…고양이 혼자서도 해냈다. 나는 시간을 벌었을 뿐이다. 그거면 됐나.)"
      effects: ["cat.step = 3", "cat.friend = 1", "stress += 5"]

- id: cat_3_kittens
  title: 네 마리
  lines:
    - "새끼 한 마리가 내 바짓단을 물고 놓지 않는다. 어미는 그걸 보고도 말리지 않는다."
    - "어미가 나를 한 번, 새끼를 한 번 보고는 천천히 눈을 감았다. 맡긴다는 뜻 같았다."
  choices:
    - text: 기숙사에 몰래 데려간다
      effects: ["cat.kitten = 'dorm'"]
      lines:
        - "주머니에 쏙 들어가는 크기다. 사감 선배한테 들키면 끝이다. …그래도."
    - text: 핀에게 맡긴다 (청소부 창고는 따뜻하다)
      when: "met.finn or affinity.finn > 0"
      effects: ["cat.kitten = 'finn'", "affinity.finn += 3"]
      lines:
        - 핀@웃음: "…저요? 창고 보일러 옆이 따뜻해요. 쥐도 잡아 주겠네요. 서로 좋네요."
    - text: 어미 곁에 둔다
      effects: ["cat.kitten = 'lake'"]
      lines:
        - "새끼를 어미 곁에 내려놓았다. 다섯 마리가 줄지어 갈대숲으로 사라졌다."

# ================================================================ 사이드 퀘스트 ⑤ 신문부의 사라진 기사

- id: news_case_1
  title: 사라진 원고
  on: 신문부
  pool: true
  window: { from: "1.4.3", to: "1.7.1" }
  lines:
    - "동아리방 문을 열자, 부장이 서랍을 통째로 뽑아 바닥에 엎어 놓고 있다."
    - 부장: "없어. 없다고! 이번 호 1면, '1학년 무투대회 우승 후보 완전 분석'. 원고가 통째로 사라졌어!"
    - 부장: "어젯밤에 분명히 서랍에 넣고 잠갔어. 자물쇠는 멀쩡하고. 이건 밀실 사건이야!"
    - 속마음: "(원작엔 신문부 서브 퀘스트 같은 건 없었다. …아니, 있었는데 보상이 쓰레기라 아무도 안 했던가.)"
  check: { label: 현장 조사, value: "stat.지성 + 10 * talent.직감 + luck", dc: 26 }
  success:
    lines:
      - "자물쇠가 아니라 창문이다. 걸쇠가 안쪽에서 들려 있다. 창틀에 금실 한 올이 걸려 있다."
      - "그리고 희미한 냄새. 검에 바르는 기름 냄새다."
    effects: ["news.case = 1", "news.wk = time.month * 4 + time.week", "news.clue = 1"]
  fail:
    lines:
      - "책상 밑, 서랍 뒤, 휴지통까지 뒤졌다. 나온 건 부장이 숨겨 둔 과자 봉지뿐이었다."
      - 부장: "그건 증거물 아니야. 내려놔."
    effects: ["news.case = 1", "news.wk = time.month * 4 + time.week"]

- id: news_case_2
  title: K의 쪽지
  on: 신문부
  window: { from: "1.4.3", to: "1.7.1" }
  when: "news.case == 1 and time.month * 4 + time.week > news.wk"
  lines:
    - "잠긴 동아리방. 부장 책상 위에 쪽지 한 장이 놓여 있었다."
    - "반듯하고 각진 필체. 종이가 비싸다. 귀족 동 문구점에서나 파는 물건이다."
    - "── 그 기사는 나가지 않는다. 원고는 태웠다. 사과는 하지 않겠다. ─K"
    - 부장@화남: "K? 요즘 누가 이니셜로 서명을 해! 이건 언론 탄압이야, 탄압!"
    - 부장: "하필 원고 3쪽이 제일 비싼 정보였는데. '카이든 황자, 왼쪽 어깨 부상설'."
    - 나레이션:
        - "무투대회 우승 후보 분석. 어깨 부상설. 그리고 K."
        - { when: "news.clue", text: "금실, 검 기름, 귀족 종이, 어깨 부상설. 그리고 K. 1학년 우승 후보 중에 이니셜이 K인 사람은 한 명뿐이다." }
    - 속마음: "(…이유는 그거 하나뿐이다.)"
  choices:
    - text: "\"범인한테 직접 물어볼게요\""
      effects: ["news.case = 2"]
      lines:
        - 부장: "범인을 안다고? 누군데? …말 안 해? 기자 정신 좋네. 특종 물어 와!"
    - text: "\"덮죠. 이 기사는 안 나가는 게 낫겠어요\""
      effects: ["news.case = 3", "stress -= 3"]
      lines:
        - 부장: "…너까지? 하아. 알았어. 이번 호 1면은 '식당 스튜 감자 함량 조사'로 간다."
        - 속마음: "(누군가에겐 활자 하나가 칼이 된다. 원작의 카이든은 그 칼에 여러 번 찔렸다.)"

- id: news_case_3
  title: K의 사정
  on: [훈련장, 검술부]
  window: { from: "1.4.3", to: "1.7.1" }
  when: "news.case == 2"
  effects: ["news.case = 3", "know.kaiden_shoulder = 1"]
  lines:
    - "다들 돌아간 해 질 녘의 훈련장 구석. 카이든이 혼자 검을 닦고 있다. 검 기름 냄새."
    - 나: "신문부 원고. 네가 가져갔지."
    - 카이든@진지: "가져간 게 아니라 회수했다. 내 이야기였으니까."
    - when: "origin == '악역도련님'"
      카이든: "벨모어가 신문부 심부름이라니. 세상 많이 변했군."
    - 카이든: "왼쪽 어깨. 그 기사가 나가면 무투대회에서 모두가 그쪽만 노린다. 형님들 귀에도 들어가고."
    - 카이든: "황궁에서 약점은 소문이 아니다. 칼이지."
    - when: "kaiden.secret"
      속마음: "(이미 비밀을 지키겠다고 약속했었다. 그 약속이 활자로 깨질 뻔한 셈이다.)"
  choices:
    - text: 기사를 묻겠다고 약속한다
      effects: ["news.case_end = 'buried'", "trust.kaiden += 8", "affinity.kaiden += 4"]
      lines:
        - 카이든: "…빚을 졌군. 황족은 빚을 잊지 않는다. 좋은 쪽으로도, 나쁜 쪽으로도."
        - "부장에게는 원고가 영영 사라졌다고만 전했다. 부장은 일주일 내내 '밀실의 K'를 저주했다."
    - text: 어깨 이야기는 빼고 다시 쓰자고 제안한다
      requires: "stat.매력 >= 16"
      effects: ["news.case_end = 'rewritten'", "affinity.kaiden += 5", "trust.kaiden += 5", "reputation += 3"]
      lines:
        - 카이든: "어깨를 빼면 쓸 게 없을 텐데."
        - 나: "새벽마다 혼자 남아서 같은 동작을 수백 번 하는 황자. 그걸 쓰지."
        - 카이든@당황: "그, 그건 쓰지 마라."
        - "기사는 실렸다. 그 주 내내 카이든은 신문부 동아리방 앞을 멀리 돌아서 다녔다. 귀가 조금 빨갰다."
    - text: "\"기사는 나가. 그게 신문이야\""
      effects: ["news.case_end = 'published'", "reputation += 5", "intel += 1", "affinity.kaiden -= 3", "trust.kaiden += 3"]
      lines:
        - "카이든이 한참 나를 노려봤다. 그리고 검을 칼집에 넣었다."
        - 카이든: "…좋다. 대신 무투대회에서, 그 기사가 틀렸다는 걸 증명해 주지."
        - "기사는 1면에 실렸다. 식당 곳곳에서 어깨 이야기가 들렸다. 카이든은 남들 앞에서 단 한 번도 어깨를 감싸지 않았다."

# ================================================================ 일상 만남

- id: amb_canteen_mirabel
  title: 가장 싼 메뉴
  on: 식당
  pool: true
  window: { from: "1.4", to: "1.7" }
  when: "fired.mirabel_clash or affinity.mirabel >= 5"
  lines:
    - "식당 구석 창가. 미라벨이 혼자 앉아 있다. 쟁반 위엔 보리빵 한 조각과 맑은 수프. 식당에서 제일 싼 메뉴다."
    - "그런데 수프를 뜨는 손놀림만은 황궁 만찬처럼 반듯하다. 숟가락이 그릇에 한 번도 닿지 않는다."
    - 미라벨@화남:
        - "뭘 봐. 검소함은 귀족의 미덕이야. 너희는 모르겠지만."
        - { when: "origin == '몰락귀족'", text: "…뭘 봐. 너도 오늘 그 메뉴잖아. 같은 처지끼리 쳐다보지 말자." }
        - { when: "origin == '악역도련님'", text: "벨모어. 네 쟁반엔 접시가 일곱 개네. 보기만 해도 체하겠어." }
  choices:
    - text: 디저트를 슬쩍 밀어 준다
      effects: ["affinity.mirabel += 4", "trust.mirabel += 2"]
      lines:
        - 미라벨: "…필요 없어. 동정은 사양이야."
        - "미라벨은 끝까지 디저트 쪽을 보지 않았다."
        - "내가 일어설 때, 접시는 비어 있었다."
    - text: 맞은편에 앉아 술식 이야기를 꺼낸다
      requires: "stat.지성 >= 18"
      effects: ["affinity.mirabel += 3", "trust.mirabel += 4", "stat.지성 += 0.5"]
      lines:
        - 미라벨: "…그 술식은 그렇게 푸는 게 아니야. 봐."
        - "미라벨이 빵 부스러기로 식탁 위에 마법진을 그리기 시작했다. 수프가 식는 줄도 모르고."
        - when: "trust.mirabel >= 15"
          나레이션: "한참 뒤 미라벨이 중얼거렸다. \"…우리 집 식탁에서도 아버지랑 이렇게 했었어.\""
    - text: 못 본 척 지나간다
      effects: ["trust.mirabel += 1"]
      lines:
        - "등 뒤에서 숟가락이 그릇에 닿는 소리가 아주 작게 들렸다. 처음이었다."
        - 속마음: "(못 본 척해 주는 것도 예의다. 저 애한테는 특히.)"

- id: amb_train_edric
  title: 혼자 남은 도련님
  on: 훈련장
  pool: true
  repeat: 2
  cooldown: 3
  when: "origin != '악역도련님' and (fate.edric == 'saved' or fate.edric == 'saved_by_teacher')"
  branch:
    - when: "fired.amb_train_edric >= 2"
      lines:
        - "오늘도 훈련장 구석에 에드릭이 있다. 그런데 자세가 다르다. 발부터 움직인다."
        - "허수아비 목이 깔끔하게 날아갔다. 에드릭이 자기 손을 한참 내려다본다."
        - 에드릭@웃음: "됐다. 됐어! 내가, 내 손으로!"
        - 에드릭: "…봤냐? 아니, 못 본 걸로 해. 고맙다는 말은 안 한다. 대신 저녁 산다. 귀족 테이블 말고, 아무 데서나."
      effects: ["affinity.edric += 5", "trust.edric += 3", "stat.근력 += 0.5"]
    - lines:
        - "훈련장 구석. 에드릭이 허수아비를 상대로 목검을 휘두르고 있다. 혼자서. 시중드는 하인도, 졸졸 따라다니던 패거리도 없이."
        - "보기에만 화려한 귀족 검술. 허수아비는 멀쩡하고 에드릭만 숨이 차다."
        - 에드릭@당황: "…뭘 봐. 가르쳐 달라는 거 아니다."
        - 에드릭: "미궁에서 그 꼴을 당하고 나니까 말이야. 패거리 놈들, 병문안 온 놈이 하나도 없더라."
      choices:
        - text: 발 위치부터 고쳐 준다
          check: { label: 가르치기, value: "stat.근력 / 2 + stat.지성 / 2 + stat.매력 / 2 + luck", dc: 24 }
          success:
            lines:
              - 에드릭: "발? 검이 아니라 발이라고? …웃기네. 해 보지 뭐."
              - "세 번째 휘두름에서 허수아비 어깨가 움푹 들어갔다. 에드릭이 입을 다물었다."
            effects: ["affinity.edric += 5", "stat.민첩 += 0.5"]
          fail:
            lines:
              - 에드릭@화남: "됐어! 네가 뭔데 가르쳐!"
              - "에드릭은 씩씩대며 돌아섰다. 그리고 내가 안 보는 줄 알고, 발 위치를 몰래 고쳤다."
            effects: ["affinity.edric += 2"]
        - text: 말없이 옆에서 같이 휘두른다
          effects: ["affinity.edric += 4", "stat.근력 += 0.5"]
          lines:
            - "한참을 나란히 휘둘렀다. 어느 순간부터 에드릭이 슬쩍 내 자세를 따라 하기 시작했다."
            - 에드릭: "…따라 하는 거 아니다. 우연이야."
        - text: "\"패거리 없으니까 편하지?\""
          effects: ["affinity.edric += 3", "trust.edric += 2"]
          lines:
            - 에드릭: "편하긴 개뿔."
            - 에드릭: "…조금은."

- id: amb_chapel_sera
  title: 촛대 스무 개
  on: 성당
  pool: true
  repeat: 2
  cooldown: 3
  window: { from: "1.4", to: "1.7" }
  when: "fate.sera == 'saved' or fate.sera == 'saved_quiet'"
  lines:
    - "제단 옆. 세라가 소매를 걷어붙이고 은촛대를 닦고 있다. 스무 개가 넘는다."
    - 세라: "시스터 루나께서 일을 주셨어. 한 주에 은화 두 닢. 고향 동생들한테 보내려고."
    - 세라: "우리 마을 성당은 지붕이 새. 비 오는 날엔 기도하다가 정수리에 빗방울이 떨어져. 그래도 다들 거기서 기도해."
    - when: "know.sera_stigma"
      나레이션: "촛대를 쥔 세라의 손등이 가끔 희미하게 빛난다. 본인은 모르는 척한다. 나도 모르는 척한다."
  choices:
    - text: 걸레를 들고 같이 닦는다
      effects: ["affinity.sera += 4", "stat.의지 += 0.5"]
      lines:
        - "둘이 하니 금방이었다. 세라가 마지막 촛대에 불을 붙였다."
        - 세라@웃음: "같이 하니까 꼭 기도하는 것 같다. 이상하지?"
    - text: "\"기도할 때 뭘 빌어?\""
      effects: ["affinity.sera += 5", "trust.sera += 2"]
      lines:
        - 세라: "…아무도 안 다치게 해 달라고. 내가 아는 사람들 전부."
        - 세라: "그 목록에 너도 있어. 요즘은."
        - 속마음: "(원작의 세라는 여기 없었다. 목록에 올라갈 사람도, 목록을 쓸 사람도.)"
    - text: 은화 두 닢을 몰래 헌금함에 넣는다
      requires: "money >= 2"
      effects: ["money -= 2", "affinity.sera += 2", "stress -= 5"]
      lines:
        - "세라는 못 봤다. 시스터 루나는 봤다. 시스터 루나가 한쪽 눈을 찡긋했다."

- id: amb_lib_noel
  title: 룬 사전을 베고 자는 선배
  on: 도서관
  pool: true
  repeat: 2
  cooldown: 3
  when: "met.noel or affinity.noel > 0"
  lines:
    - "도서관 맨 안쪽, 아무도 안 오는 고문서 서가. 노엘 선배가 두꺼운 책을 베개 삼아 자고 있다."
    - "책등의 제목이 보인다. 『고대 룬 문자 대사전 — 3권』. 페이지 가장자리에 침 자국."
    - when: "noel.laundry"
      나레이션: "세탁실 유령은 낮에는 여기서 자는 모양이다."
    - 사서: "노엘 군. 그 책은 베개가 아닐세."
    - 노엘: "(눈도 안 뜨고) …베개가 아니면 이렇게 편할 리가 없죠."
    - 사서: "3권은 다음 주까지 반납하게. 2권처럼 침으로 붙여 오지 말고."
  choices:
    - text: 깨운다
      effects: ["affinity.noel += 4"]
      lines:
        - 노엘@당황: "으아. …아, 너냐. 1학년이 왜 이런 구석까지 와."
        - 노엘: "공부? 아니. 이건 수면 학습이야. 룬은 원래 꿈에서 배우는 거라고. 진짜야."
    - text: 펼쳐진 쪽을 슬쩍 들여다본다
      check: { label: 여백 읽기, value: "stat.지성 + 10 * perk.데이터마이너 + luck", dc: 26 }
      success:
        lines:
          - "펼쳐진 쪽 여백에 연필 메모가 빼곡하다. 사전의 해설을 고쳐 쓴 메모. 고친 쪽이 맞다."
          - 속마음: "(학교에서도 안 가르치는 고대 룬을, 만년 꼴찌가 사전보다 정확하게 안다.)"
        effects: ["noel.rune_seen = 1", "affinity.noel += 2", "stat.지성 += 0.5"]
      fail:
        lines:
          - "글씨가 너무 작다. 노엘이 몸을 뒤척여 책을 덮어 버렸다. 침 자국 쪽으로."
        effects: ["affinity.noel += 1"]
    - text: 담요를 덮어 주고 간다
      effects: ["affinity.noel += 3"]
      lines:
        - "담요를 덮어 주자, 노엘이 잠결에 웅얼거렸다."
        - 노엘: "…성문… 닫지 마…"
        - 속마음: "(잠꼬대치고는 목소리가 너무 어렸다. 열 살쯤 된 아이처럼.)"

- id: amb_magic_dorothy
  title: 창밖의 청강생
  on: 마법실습
  pool: true
  repeat: 2
  cooldown: 3
  when: "found.dorothy or affinity.dorothy >= 5"
  lines:
    - 나레이션:
        - "실습 중에 창밖이 자꾸 신경 쓰인다. 창틀 아래로 앞치마 끈이 보였다 사라졌다 한다."
        - { when: "fired.amb_magic_dorothy >= 2", text: "오늘도 창틀 아래로 앞치마 끈이 보인다. 이제는 거의 고정석이다." }
    - "도로시다. 장바구니를 든 채 까치발을 하고, 엘베라 교수의 칠판을 손바닥에 베끼고 있다."
    - 도로시@당황: "(입 모양으로) 쉿! 쉿! 재료 사러 가는 길이었어요. 진짜로요!"
    - when: "trust.dorothy >= 5"
      나레이션: "그러다 나를 알아보고, 창 너머로 새끼손가락을 들어 보였다. 약속, 이라는 입 모양."
  choices:
    - text: 필기 노트를 빌려준다
      effects: ["affinity.dorothy += 5"]
      lines:
        - 도로시@웃음: "진짜요? 이거 엘베라 교수님 수업 필기예요? 성물이다, 성물…"
        - "다음 날 돌려받은 노트에는 내 필기보다 도로시의 주석이 더 많았다. 대부분 맞았다."
    - text: 창문을 살짝 열어 둔다
      effects: ["affinity.dorothy += 4", "affinity.elvera += 2"]
      lines:
        - "바람을 타고 엘베라 교수의 목소리가 창밖으로 흘러 나갔다."
        - "교수가 창 쪽을 한 번 보았다. 그리고 아무 말 없이, 목소리를 조금 키웠다."
    - text: 모른 척한다
      lines:
        - "도로시는 수업이 끝날 때까지 창밖에 있었다. 종이 울리자 장바구니를 들고 식당 쪽으로 뛰어갔다."

- id: amb_walk_aren
  title: 처음 보는데 익숙한
  on: 산책
  pool: true
  window: { from: "1.3.2", to: "1.7" }
  when: "affinity.aren > 0"
  lines:
    - "뒷산 오솔길. 아렌이 손가락을 입에 물고 휘파람을 분다. 산비둘기들이 우르르 내려앉는다. 양치기의 휘파람이다."
    - when: "cat.kitten == 'lake'"
      나레이션: "길가 갈대숲에서 얼룩 고양이 다섯 마리가 줄지어 지나갔다. 아렌이 손가락으로 셌다. 하나, 둘, 셋, 넷, 다섯."
    - 아렌: "아, 왔어? 고향 생각나서. …있잖아, 이상한 거 하나 보여 줄까?"
    - "갈림길에서 아렌이 왼쪽을 가리켰다."
    - 아렌: "여기 처음 와 보는데… 이쪽으로 가면 무너진 돌탑이 있을 것 같아. 이끼 낀 거."
    - "왼쪽으로 갔다. 이끼 낀 돌탑이 무너져 있었다."
    - 아렌@당황: "…봤지? 나 가끔 이래. 꿈에서 본 것 같은 곳이 진짜로 있어."
    - 속마음: "(원작에 이런 대사는 없었다. 아렌은 플레이어의 분신이었으니까. 분신은 데자뷔를 겪지 않는다.)"
  plants:
    - { id: F40, notice: { value: "stat.지성 + 10 * talent.직감 + 10 * perk.고인물의기억", dc: 26 } }
  choices:
    - text: "\"나도 가끔 그래\""
      effects: ["affinity.aren += 4", "aren.kind += 0.5"]
      lines:
        - 아렌@웃음: "진짜? 다행이다. 나만 이상한 줄 알았어."
        - 속마음: "(거짓말은 아니다. 이 세계 전부가, 나한테는 처음 보는데 익숙하니까.)"
    - text: "\"꿈에서 또 뭘 봤어?\""
      effects: ["affinity.aren += 3", "trust.aren += 3"]
      lines:
        - 아렌: "음… 하늘이 빨갰어. 엄청 넓은 데서 누가 울고 있었고. 나는 칼을 들고 서 있었는데, 손이 안 움직였어."
        - 아렌: "아, 몰라. 그냥 꿈이야. 성검 받고 나서 별 꿈을 다 꾼다니까."
        - 속마음: "(붉은 하늘. 서른일곱 개 엔딩 중 서른 개가 넘는 엔딩의 마지막 배경.)"
    - text: 웃어넘긴다
      effects: ["affinity.aren += 2"]
      lines:
        - 아렌: "그치? 기분 탓이겠지. 아, 배고프다. 식당 가자."

- id: amb_walk_finn
  title: 꽃잎과 빗자루
  on: 산책
  pool: true
  repeat: 2
  cooldown: 3
  window: { from: "1.3.2", to: "1.7" }
  lines:
    - 나레이션:
        - "가로수길. 청소부 소년이 떨어진 꽃잎을 쓸고 있다. 바람이 불 때마다 꽃잎이 다시 흩어진다."
        - { when: "time.month >= 5", text: "가로수길. 청소부 소년이 송홧가루 내려앉은 돌바닥을 쓸고 있다. 바람이 불 때마다 노란 먼지가 다시 인다." }
    - 나레이션:
        - "그런데 이상하다. 바람이 불어도, 소년이 쓴 자리에는 아무것도 다시 쌓이지 않는다."
        - { when: "found.finn", text: "핀의 빗자루는 바람보다 한 박자 빠르다. 떨어지는 것이 바닥에 닿기도 전에 한 줄로 모인다." }
    - when: "cat.kitten == 'finn'"
      나레이션: "소년의 발치에서 얼룩 새끼 고양이가 빗자루 끝을 쫓아 뛰어다닌다. 그새 많이 컸다."
    - when: "finn.letters >= 3"
      나레이션: "빗자루 손잡이에 칼로 새긴 서툰 글씨가 있다. ── 핀."
  choices:
    - text: 빗자루를 하나 빌려 시합을 건다
      check: { label: 빗자루 시합, value: "stat.민첩 + luck", dc: 26 }
      success:
        lines:
          - "둘이 동시에 쓸기 시작했다. 길 끝에 도착했을 때, 내 쪽 길도 꽤 깨끗했다."
          - 핀@놀람: "…학생, 빗자루 좀 쓰시네요. 손목이 좋아요."
        effects: ["met.finn = 1", "affinity.finn += 4", "stat.민첩 += 0.5"]
      fail:
        lines:
          - "내가 쓴 자리에만 꽃잎 무덤이 생겼다. 바람이 내 쪽으로만 부는 것 같다."
          - 핀@웃음: "빗자루는 힘으로 하는 게 아니에요. 바람이 가는 데 먼저 가 있으면 돼요."
          - 속마음: "(…그거, 검술 얘기 아냐?)"
        effects: ["met.finn = 1", "affinity.finn += 3"]
    - text: "\"청소, 힘들지 않아?\""
      effects: ["met.finn = 1", "affinity.finn += 3"]
      lines:
        - 핀: "청소요? 좋아요. 쓸면 깨끗해지잖아요."
        - 핀: "세상에 그런 일 별로 없어요. 하면 한 만큼 되는 일."

- id: amb_canteen_thomas
  title: 주근깨 토마스
  on: 식당
  pool: true
  window: { from: "1.4", to: "1.7" }
  when: "thomas.comforted"
  lines:
    - "식당 저쪽에서 누가 손을 크게 흔든다. D반 토마스다. 주근깨 가득한 얼굴이 활짝 웃고 있다."
    - "토마스가 쟁반을 들고 와 맞은편에 털썩 앉았다."
    - "\"그날 밤 고마웠어. 집에서 답장 왔어! 이웃집에서 송아지를 빌려주기로 했대. 갚는 건 내가 졸업하고 하면 된대.\""
    - "토마스는 수다쟁이였다. 우는 날만 빼면."
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(10월, 첫 실전 토벌. 원작의 토마스는 거기서 돌아오지 못한다. 이름도 대사도 없이, 아렌의 회상 속에서만.)"
  choices:
    - text: 같이 밥을 먹는다
      effects: ["stress -= 5"]
      lines:
        - "토마스네 마을 소들의 이름을 전부 들었다. 열두 마리. 죽은 소의 이름은 '감자'였다고 한다."
        - "그렇게 웃으며 밥을 먹은 게 오랜만이었다."
    - text: "\"너, 저녁마다 나랑 같이 뛰자\""
      effects: ["stat.체질 += 0.5", "fatigue += 5"]
      lines:
        - "\"나랑? 나 D반에서 제일 느린데.\" 토마스가 눈을 동그랗게 떴다."
        - "\"그러니까.\""
        - 속마음: "(가을까지. 조금이라도 빨리 달릴 수 있게.)"
