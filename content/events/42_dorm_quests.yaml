            - "봉투 겉면에 벨모어가 문장을 찍지 않았다. 그냥, 이름만 썼다."
            - 속마음: "(이 편지를 받은 하인이 웃을지, 무서워할지. 그건 지금부터의 내가 정한다.)"
          effects: ["stress -= 5", "edric.reformed += 0.5"]
        - when: "origin == '숲고아'"
          lines:
