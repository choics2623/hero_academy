            - "── 공부는 어려워요. 그래도 해 볼게요. 장학금 안 끊기게."
            - "펜이 멈췄다. 마지막 줄에 뭘 써야 할지 한참 고민했다."
            - "── 보고 싶어요."
            - 속마음: "(얼굴도 모르는 사람들에게 '보고 싶어요'라고 썼다.)"
            - 속마음: "(거짓말인데, 쓰고 나니 거짓말 같지가 않다. 이 손이 기억하는 건지, 내가 그런 건지.)"
            - "봉투를 붙이고 우편함까지 걸어갔다. 돌아오는 길이 이상하게 가벼웠다."
          effects: ["stress -= 8"]
        - when: "origin == '몰락귀족'"
          lines:
            - "── 형님께."
            - "형님의 얼굴은 이 몸이 기억한다. 늘 장부를 들여다보느라 미간에 주름이 진 얼굴."
            - "── 빚 문제는 제가 졸업하면 어떻게든 하겠습니다."
            - "── 그러니 가보는 더 팔지 마세요. 할아버님의 검도, 어머님의 은수저도."
