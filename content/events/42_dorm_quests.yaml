            - "창밖으로 손을 뻗어 넓은 나뭇잎 한 장을 땄다."
            - "잎맥을 피해 펜으로 꾹꾹 눌러 썼다."
            - "── 잘 지내. 여기도 나무는 있어."
            - "── 다들 줄 맞춰 서 있어서, 좀 답답해 보이지만."
            - "창밖에 나뭇잎을 내밀었다. 바람이 기다렸다는 듯 채 갔다."
            - "나뭇잎은 기숙사 지붕을 넘어, 숲이 있는 쪽으로 날아갔다. 그렇게 보였다."
            - "손가락에 풀물 냄새가 남았다. 이 몸이 아는 냄새였다."
            - 속마음: "(이 몸이 그리워하는 것들을, 나는 그리워할 수가 없다. 그래서 대신 써 준다.)"
          effects: ["stress -= 8"]
        - lines:
            - "펜을 들고 한참 앉아 있었다. 이 몸에게는 편지를 보낼 사람이 없다."
            - "가족도, 고향 친구도. 눈을 뜬 여관의 주인이 전부였다."
            - "첫날 아침, 거울 앞에 한참 서 있는 나를 보고 그 주인은 '숙취냐' 하며 꿀물을 내줬다."
            - "그래서 여관 주인에게 썼다."
            - "── 외상 방값, 아직 남았죠? 갚을게요."
            - "── 그리고 그날 꿀물, 고마웠어요."
            - "봉투 겉면에 여관 이름을 적었다. 간판에 졸고 있는 고양이가 그려져 있던 것까지 기억난다."
            - "우편 마차에 편지를 넘기며 마부에게 동전 한 닢을 더 쥐여 줬다. 잃어버리지 말아 달라고."
            - 속마음: "(이게 이 몸의 유일한 인간관계라니. …엑스트라답다.)"
            - 속마음: "(그래도 0은 아니다. 숫자만 보던 고인물로서 말하자면, 0과 1은 하늘과 땅 차이다.)"
          effects: ["stress -= 3"]
    - text: 10년 뒤의 나에게 쓴다
      effects: ["letter.future = 1", "stat.의지 += 1"]
      lines:
        - "새 종이를 꺼냈다. 맨 위에 또박또박 썼다."
        - "── 10년 뒤의 나에게."
        - "펜이 한참 멈춰 있었다. 10년 뒤. 이 세계가 마지막으로 맞는 해."
        - "── 이 편지를 읽고 있다면, 세계는 아직 있는 거다. 그럼 잘한 거야."
        - "── 누가 곁에 남았는지는 묻지 않을게. 읽는 네가 제일 잘 알 테니까."
        - "── 못 읽고 있다면…"
        - "펜을 멈췄다. 그 줄을 지웠다."
        - "── 아니다. 그런 건 쓰지 말자."
        - "── 대신 이것만. 오늘 저녁 스튜는 맛있었다. 10년 뒤에도 그 식당이 있으면 좋겠다."
        - "봉투를 봉하고, 겉면에 뜯을 날을 적었다. 10년 뒤의 봄."
        - "트렁크 맨 밑바닥에 넣었다. 옷가지 아래, 가장 깊은 곳에."
        - "뜯을 날을 정해 두는 것만으로, 숨쉬기가 조금 편해졌다."
        - 속마음: "(약속이다. 그날 이 봉투를 뜯는 손이, 내 손이기를.)"
    - text: 부칠 곳 없는 편지를 쓴다 (원래 세계로)
      effects: ["stress -= 10"]
      lines:
        - "마지막 한 장이 남았다. 들꽃 무늬가 제일 예쁘게 찍힌 장."
        - "── 엄마."
        - "그 두 글자를 쓰는 데 한참 걸렸다. 이 세계의 손으로 쓰니 글씨가 낯설다."
        - "── 나 게임 속에 들어왔어. 웃기지. 엄마가 그만 좀 하라던 그 게임."
        - "── 밥은 잘 먹어. 여기 감자 스튜 진짜 맛있다. 엄마 된장찌개보다는 아니고."
        - "── 친구도 생겼어. 진짜 사람 같은 사람들이야. 아니, 진짜 사람이야."
        - "── 문자 답장 못 해서 미안해."
        - "한 장을 꽉 채웠다. 뒷면까지."
        - "다 쓰고 나서, 촛불에 끝을 댔다. 들꽃이 하나씩 주황빛으로 오그라들었다."
        - "재가 창밖으로 날아갔다. 하늘 쪽으로."
        - 속마음: "(어디로든 가겠지. 이 세계가 게임이라면, 바깥도 어딘가 있을 테니까.)"
        - 속마음: "(…닿지 않아도 괜찮다. 쓰는 동안은, 거기 있었으니까.)"

- id: dorm_storm
  title: 천둥 치는 밤
  on: 휴식
  pool: true
  window: { from: "1.4", to: "1.7" }
  slots: [밤]
  chance: 0.5
  lines:
    - "저녁부터 바람이 이상했다. 창틀이 쉬지 않고 덜컹거렸다."
    - "자정 무렵, 하늘이 찢어졌다."
    - "번쩍."
    - "창밖의 첨탑이 하얗게 떠올랐다가 사라진다. 한 박자 늦게, 쿠르릉. 침대가 떨린다."
    - "기숙사 마력등이 일제히 꺼졌다. 복도 어딘가에서 누가 비명을 지르고, 누가 웃는다."
    - "빗줄기가 유리창을 때린다. 손바닥으로 두드리는 소리 같다."
    - "어디선가 덜 닫힌 창문 하나가 바람에 쾅, 쾅 부딪힌다."
    - "번개가 칠 때마다 눈꺼풀 안쪽에 같은 그림이 겹친다."
    - "붉은 하늘. 무너진 첨탑. 서른일곱 번 본 엔딩 일러스트."
    - 속마음: "(저 첨탑이다. 엔딩 일러스트에서 무너지던 첨탑. 3,000시간 동안 화면으로만 봤던.)"
    - when: "letter.future"
      나레이션: "트렁크 밑바닥의 편지가 생각났다. 10년 뒤의 나에게. 그 봉투를 뜯을 날까지."
    - when: "cat.kitten == 'dorm'"
      나레이션: "침대 밑에서 새끼 고양이가 가늘게 울었다. 손을 넣자 손가락을 꼭 물고 놓지 않는다."
    - when: "dorm.signal"
      나레이션: "천둥이 칠 때마다 건너편에서 브루노의 신호가 온다. 괜찮냐고. 한 번도 빠짐없이."
    - "번쩍. 쿠르릉."
    - 속마음: "(그냥 비다. 그냥 천둥이다. 그날은 아직 멀었다.)"
  choices:
    - text: 휴게실에 모인 애들과 괴담 대회를 연다
      check: { label: 괴담 대회, value: "stat.매력 + stat.지성 / 2 + luck", dc: 26 }
      success:
        lines:
          - "휴게실에 촛불 하나가 켜져 있다. 잠 못 든 애들이 담요를 두르고 옹기종기 모여 있다."
          - 학생 A: "괴담 대회 하자. 제일 무서운 얘기 한 사람이 내일 아침 디저트 다 먹기."
          - "세탁실 유령, 미궁 깊은 층의 우는 갑옷, 사감 선배의 사라진 눈썹. 차례가 돌았다."
          - "그리고 내 차례가 왔다. 촛불이 내 쪽으로 밀려왔다."
          - 나@진지: "…어떤 게임이 있었대."
          - 나: "엔딩이 서른일곱 개야. 다들 진짜 결말을 찾으려고 몇 년을 했대. 몇천 시간을."
          - 나: "그런데 서른일곱 개가 전부, 같은 문장으로 끝나."
          - "누군가 침을 꿀꺽 삼켰다."
          - 나: "'그리고 세계는, 다시 처음으로.'"
          - "번쩍. 천둥. 누군가 비명을 질렀다. 촛불이 꺼졌다."
          - "어둠 속에서 몇 초. 그리고 박수가 터졌다."
          - 학생 B: "뭐야, 소름 돋았어! 다시 처음으로래. 으아, 내 팔 봐!"
          - "오늘 밤 우승이다. 내일 아침 디저트는 내 것이다."
          - 속마음: "(제일 무서운 건, 이게 지어낸 얘기가 아니라는 거지만.)"
        effects: ["reputation += 3", "stress -= 5"]
      fail:
        lines:
          - "휴게실에 촛불 하나. 담요를 두른 애들이 둘러앉아 괴담을 돌린다."
          - "내 차례. 에테크 커뮤니티 최고의 괴담을 꺼냈다. '세이브 파일이 스스로 덮어써지는 밤'."
          - 나: "…그래서 세이브 파일을 열었더니, 내가 저장한 적 없는 날짜가 있었던 거야."
          - 학생 A: "…세이브 파일이 뭔데?"
          - 나: "어, 그러니까. 인생을 저장해 두는… 일기장 같은 거?"
          - 학생 B: "일기장이 왜 혼자 써져? 그거 그냥 동생이 쓴 거 아냐?"
          - "설명하면 할수록 아무도 무서워하지 않았다. 천둥마저 타이밍을 놓쳤다."
          - "결국 우승은 '사감 선배의 가발' 이야기가 차지했다. 그건 좀 무서웠다."
          - 속마음: "(문화 차이다. …세계 차이인가.)"
        effects: ["stress -= 3"]
    - text: 아래 칸의 브루노를 살핀다
      when: "origin != '악역도련님' and origin != '몰락귀족'"
      effects: ["affinity.bruno += 4"]
      lines:
        - "번개가 칠 때마다 아래 칸이 이상하게 조용하다. 늘 코를 골던 녀석인데."
        - "몸을 기울여 내려다봤다."
        - "번쩍. 하얀 빛에 비친 브루노가 이불을 머리끝까지 뒤집어쓰고 떨고 있다. 그 큰 덩치가 공처럼 말려 있다."
        - 나: "…브루노?"
        - 브루노@당황: "…웃지 마."
        - "쿠르릉. 이불 덩어리가 움찔했다."
        - 브루노: "어릴 때 대장간 굴뚝에 벼락이 떨어졌거든. 화로가 터져서… 할아버지가 다치셨어."
        - 브루노@슬픔: "할아버지 팔에 아직 흉터 있어. 망치 쥐는 팔에. 나는 그때 화로 옆에서 자고 있었고."
        - 브루노: "할아버지가 나 덮어 주느라 다친 거야."
        - "그 큰 등이 천둥 칠 때마다 움찔한다."
        - 속마음: "(원작의 브루노는 늘 웃는 얼굴이었다. 웃는 초상화 한 장뿐이었으니까.)"
        - "아래 칸으로 내려가 등을 맞대고 앉았다. 브루노의 등은 넓고, 뜨겁고, 떨리고 있었다."
        - "번개를 하나, 둘 세었다. 천둥이 조금씩 멀어졌다. 등 뒤의 떨림도 조금씩 잦아들었다."
        - 브루노: "…고맙다."
        - 브루노@당황: "이거 아무한테도 말하지 마라. 특히 카이든."
        - 나: "왜 하필 카이든이야."
        - 브루노: "걔가 알면 평생 놀릴 거야. 표정 하나 안 바꾸고. 그게 더 열받아."
    - text: 온실로 뛰어간다 (화분이 걱정된다)
      art: cg_liana_storm
      when: "club == '원예부' or affinity.liana >= 15"
      effects: ["affinity.liana += 5", "fatigue += 10"]
      lines:
        - 속마음: "(온실. 유리 지붕. 이 바람이면—)"
        - "생각보다 몸이 먼저 움직였다. 우비도 없이 빗속으로 뛰어나갔다."
        - "온실 유리 지붕 한 칸이 바람에 날아가 있었다. 뚫린 구멍으로 빗물이 폭포처럼 쏟아진다."
        - "그 아래에서 누군가 맨손으로 화분을 옮기고 있다. 흠뻑 젖은 머리카락 사이로 뾰족한 귀 끝이 보인다."
        - 리아나@놀람: "너, 너 왜 왔어? 다 젖었잖아!"
        - 나: "너도 젖었잖아."
        - "말 대신 화분을 들었다. 무거운 흙 화분. 리아나는 혼자 이걸 몇 개나 옮긴 걸까."
        - "번개가 칠 때마다 온실 안이 하얗게 번쩍인다. 잎사귀들이 바람에 비명을 지른다."
        - "리아나가 몇 번이나 멈춰 서서 숨을 골랐다. 어깨가 크게 오르내린다."
        - 리아나@웃음: "괜찮아, 괜찮아. 비 맞아서 추워서 그래."
        - 속마음: "(웃는 얼굴이 너무 빨리 나온다. …무거운 건 전부 내가 들었다.)"
        - "새벽까지 화분 마흔 개를 옮겼다. 깨진 유리 아래를 비우고, 안쪽 선반으로."
        - "하나도 죽지 않았다."
        - when: "liana.song"
          나레이션: "마지막 화분을 내려놓고, 리아나가 작게 노래를 불렀다. 그날 내가 흥얼거렸던, 이 세계에 없는 노래였다."
        - 리아나@웃음: "…고마워. 혼자였으면 반은 죽었을 거야."
        - 리아나: "다음에 폭풍 오면 또 와 줄 거야? …농담이야. 다음엔 내가 먼저 지붕을 고쳐 둘게."
        - "동이 텄다. 젖은 옷에서 흙냄새와 풀냄새가 났다. 돌아가는 길, 발은 무거웠다. 마음은 아니었다."
    - text: 창가에서 번개를 센다
      effects: ["stat.의지 += 0.5"]
      lines:
        - "창가에 의자를 끌어다 앉았다. 유리창에 이마를 댔다. 차갑다."
        - "번쩍."
        - "하나. 둘. 셋."
        - "쿠르릉."
        - "세 박자. 번개는 저 산 너머쯤에 떨어졌다. 원래 세계에서 배운 셈법이 여기서도 통한다."
        - "번쩍. 하나. 둘. 셋. 넷. 쿠르릉."
        - "조금 멀어졌다."
        - "숫자를 세다 보니 숨이 고르게 돌아왔다. 붉은 하늘의 잔상도 흐려졌다."
        - 속마음: "(번개는 번개일 뿐이다. 아직은.)"
        - 속마음: "(그날이 오면 하늘이 정말 붉어진다. 그 전에, 셀 수 있는 건 다 세어 두자. 남은 날짜든, 할 일이든.)"
        - "새벽 무렵 비가 그쳤다. 마지막 천둥은 여덟을 세고서야 울렸다."

- id: dorm_timeline
  title: 잠 못 드는 밤의 연표
  art: cg_timeline
  on: 휴식
  pool: true
  window: { from: "1.5", to: "1.7" }
  slots: [밤]
  chance: 0.5
  lines:
    - "잠이 오지 않는다. 몇 번을 돌아누워도."
    - "담요를 챙겨 창밖으로 나갔다. 창틀을 밟고 올라서면 기숙사 지붕이다. 입학 첫 주에 봐 둔 길."
    - "기와가 아직 낮의 온기를 품고 있다. 바람은 차다. 담요를 어깨까지 끌어 올렸다."
    - "아카데미가 발아래 펼쳐져 있다. 첨탑, 도서관 돔, 호수에 비친 달."
    - 속마음: "(로딩 화면의 그 구도다. 몇천 번을 본. 이렇게 조용한 줄은 몰랐다.)"
    - "달빛 아래 종이를 펼쳤다."
    - "머릿속에만 있던 걸 처음으로 꺼내 적는다. 10년짜리 연표."
    - "── 1학년 3월. 세라, 반 배정 시험 탈락."
    - when: "fate.sera == 'saved' or fate.sera == 'saved_quiet'"
      나레이션: "그 줄에 선을 긋고, 옆에 작게 적었다. 생존."
    - "── 1학년 5월. 에드릭 벨모어, 미궁 3층에서 사망."
    - 나레이션:
        - "그 줄은 그대로 두었다. 아직은."
        - { when: "fate.edric == 'dead'", text: "그 줄은 그대로 두었다. 지울 수가 없었다." }
        - { when: "fate.edric and fate.edric != 'dead'", text: "그 줄에도 선을 그었다. 펜 끝이 조금 떨렸다." }
        - { when: "origin == '악역도련님' and fate.edric and fate.edric != 'dead'", text: "내 이름 위에 선을 그었다. 이상한 기분이다. 내 사망 예정일에 줄을 긋는다는 건." }
    - when: "thomas.comforted and (perk.고인물의기억 or perk.공략위키편집자)"
      나레이션: "── 1학년 10월. 첫 실전 토벌. 토마스. 계단참에서 울던 얼굴이 떠올라, 그 이름은 천천히 적었다."
    - "── 2학년 여름, 리아나."
    - "그 이름을 쓸 때 펜촉이 종이를 긁었다. 너무 세게 눌렀다."
    - "── 5년차, 가렌 교관. 6년차 겨울, 황제 암살. 7년차, 세계수."
    - "── 8년차 봄, 차원문. 9년차 가을, 마왕."
    - "── 10년차."
    - "펜이 멈췄다. 마지막 줄은 매번 같다."
    - "── 그리고 세계는, 다시 처음으로."
    - when: "world.collapse >= 10"
      속마음: "(벌써 몇 줄이 어긋났다. 원작이 내 노트를 따라 주지 않는 날이 온다. 그날부터가 진짜다.)"
    - "종이 한 장에 10년이 다 들어갔다. 생각보다 짧다."
    - 속마음: "(한 장. 서른일곱 번의 멸망이, 종이 한 장이다.)"
  choices:
    - text: 끝까지 정리한다
      effects: ["stat.지성 += 1", "fatigue += 5"]
      lines:
        - "종이를 한 장 더 꺼냈다. 그리고 또 한 장."
        - "사건마다 칸을 나눴다. 날짜. 장소. 필요한 것. 막을 방법."
        - 나레이션:
            - "── 리아나. 2학년 여름, 숲 합숙. 필요한 것: ……"
            - { when: "know.moonherb", text: "── 리아나. 2학년 여름, 숲 합숙. 필요한 것: 월광초. 그리고 그 자리에 내가 있을 것." }
        - "── 가렌 교관. 5년차, 잿빛 장벽. 필요한 것: ……"
        - "그 칸에서 펜이 오래 머물렀다."
        - "동쪽 하늘이 희끄무레해질 때까지 썼다. 손가락이 잉크로 까맣다."
        - "'막을 방법' 칸의 절반은 비어 있다."
        - "그래도 빈칸이 어디인지 아는 것과 모르는 것은 다르다."
        - 속마음: "(공략 위키도 처음엔 빈칸투성이였다. 누군가 한 칸씩 채웠다. 이번엔 내가 채운다.)"
        - "첫 새가 울었다. 종이를 접어 품에 넣고, 기와를 밟고 내려왔다."
    - text: 종이를 태운다 (누가 보면 끝이다)
      effects: ["stress -= 5"]
      lines:
        - 속마음: "(누가 이걸 보면 끝이다. 미친 사람이거나, 교단 첩자거나, 예언자거나.)"
        - "성냥을 그었다. 작은 불꽃이 바람에 흔들린다. 손바닥으로 감쌌다."
        - "종이 귀퉁이에 불을 댔다."
        - "불꽃 속에서 10년이 오그라든다. 마왕이 먼저 타고, 차원문이 타고, 리아나의 이름이 탄다."
        - "마지막 줄. '다시 처음으로'가 까맣게 말려 들어갔다."
        - "재가 바람을 타고 호수 쪽으로 날아갔다."
        - 나레이션:
            - "머릿속에만 있으면 된다. 지금까지도 그랬으니까."
            - { when: "talent.망각증", text: "머릿속에만 있으면 된다. …이 머리가 잘 잊는다는 게 문제지만." }
            - { when: "talent.완전기억", text: "머릿속에만 있으면 된다. 이 머리는 한 글자도 잊지 않는다." }
        - "손끝에 남은 그을음을 바지에 닦았다. 연표는 사라지고, 무게만 남았다."
    - text: 종이를 접어 지붕 기와 밑에 숨긴다
      effects: ["stress -= 3", "stat.의지 += 0.5"]
      lines:
        - "종이를 네 번 접었다. 손바닥만 해졌다."
        - "들뜬 기와 한 장을 찾았다. 조심스럽게 들어 올리자, 그 밑에 마른 이끼와 작은 틈."
        - "그 틈에 종이를 끼우고 기와를 다시 덮었다. 손바닥으로 꾹 눌렀다."
        - "아무도 모를 것이다. 비가 와도 젖지 않을 자리다."
        - "이 세계에서 나만 아는 장소가 하나 생겼다."
        - 속마음: "(세이브 포인트다. 진짜 세이브는 안 되지만.)"
        - "잠이 안 오는 밤이면 여기로 올라오자. 기와 밑의 10년을 확인하러."
        - "담요를 두르고 한참 더 앉아 있었다. 호수의 달이 조금씩 기울었다."

# ================================================================ 사이드 퀘스트 ① 도서관 밤의 발소리

- id: lib_night_1
  title: 도서관 밤의 발소리
  on: 도서관
  pool: true
  window: { from: "1.3.2", to: "1.7" }
  slots: [밤]
  lines:
    - "눈을 떴다. 뺨에 책장이 달라붙어 있다."
    - "폐관 종이 울린 지 한참 된 모양이다. 책상에 엎드려 깜빡 잠들었던 것이다."
    - "촛불은 꺼졌고, 창으로 들어온 달빛만 서가 사이에 길게 누워 있다."
    - "밤의 도서관은 낮과 다르다. 천장이 더 높고, 서가가 더 깊다. 종이 냄새가 진해졌다."
    - "출입문으로 가서 손잡이를 당겼다. 덜컥. 밖에서 잠겼다."
    - 속마음: "(…갇혔다. 아침까지.)"
    - "자리로 돌아와 앉았다. 차라리 아침까지 자 버리자고 생각한 순간."
    - "또각."
    - "숨이 멎었다."
    - "또각. 또각."
    - "누군가 서가 사이를 걷는다. 아주 느리게."
    - "길을 다 외운 사람처럼, 한 번도 멈추지 않고. 모퉁이에서도 머뭇거리지 않고."
    - "서가 저편에서 희미한 불빛이 흔들린다. 나타났다가, 책장 뒤로 사라졌다가, 다시 나타난다."
    - 속마음: "(원작 도서관 맵은 밤엔 들어갈 수조차 없었다. '폐관 시간입니다', 메시지 한 줄.)"
    - 속마음: "(그 한 줄 너머에서, 이런 소리가 나고 있었다고?)"
    - when: "talent.겁쟁이"
      나레이션: "다리가 의자에 붙어 버린 것 같다."
    - "발소리가 서가 한 줄을 돌아, 다시 멀어진다. 규칙적이다. 무언가를 순찰하듯이."
    - 속마음: "(따라갈까. 아니면—)"
  choices:
    - text: 발소리를 따라간다
      check: { label: 숨죽이고 따라가기, value: "stat.민첩 + stat.의지 / 2 + luck", dc: 26 }
      success:
        lines:
          - "신발을 벗어 손에 들었다. 양말 바닥으로 마룻바닥의 결이 느껴진다."
          - "서가와 서가 사이, 달빛이 닿지 않는 그늘만 골라 디뎠다."
          - "한 줄. 두 줄. 세 줄."
          - "금서 서가 앞. 쇠사슬이 걸린 서가다. 낮에는 사서의 허락 없이 아무도 들어가지 못한다."
          - "흔들리는 등불 하나가 그 모퉁이를 돌아 사라진다. 짧게 비친 옷자락. 회색이다."
          - "모퉁이까지 따라갔을 때, 거기엔 아무도 없었다."
          - "대신 등불이 머물던 열람대에 책 한 권이 펼쳐져 있다. 커다란 지도책이다."
          - "누렇게 바랜 종이. 지금은 없는 나라들의 이름. 낯선 해안선, 지금보다 훨씬 넓은 숲."
          - "그 위로, 누군가 손가락으로 길을 짚어 내려간 자국이 먼지 위에 선명하다."
          - "산맥을 넘어, 강을 따라, 지도 맨 끝까지. 몇 번이고 같은 길을 짚은 듯 자국이 깊다."
          - 속마음: "(누가 이렇게 오래된 지도를, 이렇게 여러 번 들여다봤을까. 다시 갈 수도 없는 길을.)"
          - "새벽녘, 문 쪽에서 딸깍 소리가 났다. 밖에서 잠겼던 문이 어느새 열려 있었다."
        effects: ["libnight.step = 1", "libnight.wk = time.month * 4 + time.week", "stat.지성 += 0.5"]
      fail:
        lines:
          - "신발을 벗고 일어섰다. 서가 사이로 한 발, 두 발."
          - "불빛이 모퉁이를 돈다. 서둘러 따라 돌았다."
          - "모퉁이 뒤에 서가용 사다리가 세워져 있었다. 보지 못했다."
          - "쾅."
          - "쓰러진 사다리가 맨 윗칸을 긁었다. 책 세 권이 머리 위로 쏟아졌다. 그중 하나는 법전이었다."
          - 속마음: "(아파. 진짜 아파. 『제국 법전 주해 제4권』은 흉기다.)"
          - "발소리가 멈췄다."
          - "그리고 다시는 들리지 않았다. 불빛도 사라졌다. 숨소리 하나 없는 정적."
          - "그 정적이 발소리보다 무서웠다."
          - "창문 걸쇠를 풀고 기어 나와 기숙사까지 뛰었다. 등 뒤가 계속 서늘했다."
          - "이불을 덮고 나서야 생각났다. 쏟아진 책들을 제자리에 꽂지 않고 왔다."
        effects: ["libnight.step = 1", "libnight.wk = time.month * 4 + time.week", "stress += 5"]
    - text: 숨을 죽이고 기다린다
      effects: ["libnight.step = 1", "libnight.wk = time.month * 4 + time.week", "stress -= 3"]
      lines:
        - "책상에 엎드린 그대로, 자는 척했다. 눈을 감고, 숨을 길게."
        - "발소리가 가까워진다. 또각. 또각. 서가 하나 건너. 바로 옆 줄."
        - "등불의 온기가 감은 눈꺼풀 너머로 느껴졌다. 주황빛."
        - "발소리가 내 자리 바로 뒤에서 멈췄다."
        - "숨을 참았다. 심장 소리가 도서관 전체에 울리는 것 같다."
        - "……."
        - "아무 일도 없었다."
        - "어깨 위로 무언가 사락, 덮였을 뿐. 담요 한 장."
        - "발소리가 다시 멀어졌다. 서두르지 않고, 처음과 같은 박자로."
        - "한참 뒤 고개를 들었을 땐 아무도 없었다. 등불의 잔상만 눈앞에 둥둥 떠 있다."
        - "담요에서 오래된 종이 냄새가 났다. 그리고 아주 희미하게, 마른 꽃 냄새."
        - 속마음: "(…유령이 담요를 덮어 주진 않겠지.)"
        - "아침에 문은 열려 있었다. 담요를 개어 열람대에 올려 두고 나왔다."
    - text: 창문으로 빠져나간다
      effects: ["stress += 3"]
      lines:
        - 속마음: "(도서관 유령 같은 건 없다. 없어야 한다. 원작에 없었으니까.)"
        - 속마음: "(…원작에 없는 것들이 요즘 너무 많긴 하지만.)"
        - "가방을 끌어안고 창가로 갔다. 걸쇠가 녹슬어 있다. 손톱으로 긁어 겨우 풀었다."
        - "창틀에 무릎을 올렸다. 밤바람이 확 들이친다."
        - "창틀을 넘는 순간, 등 뒤에서 발소리가 아주 잠깐 멈춘 것 같았다."
        - "돌아보지 않았다. 화단에 뛰어내려 기숙사까지 달렸다."
        - "방에 돌아와 숨을 고르며 창밖을 봤다. 도서관 꼭대기 창 하나에 작은 불빛이 흔들리고 있었다."
        - "불빛은 한참 그 자리에 있다가, 천천히 꺼졌다."

- id: lib_night_2
  title: 밤의 서가
  art: cg_librarian_chair
  on: 도서관
  window: { from: "1.3.2", to: "1.7" }
  slots: [밤]
  when: "libnight.step == 1 and time.month * 4 + time.week > libnight.wk"
  lines:
    - "그날 이후로 도서관에 올 때마다 귀가 서가 쪽으로 쏠렸다."
    - "낮의 도서관은 평범하다. 책장 넘기는 소리, 마른기침, 졸음을 참는 하품."
    - "대출 창구의 사서 노인은 오늘도 꾸벅꾸벅 졸고 있다. 안경이 코끝에 걸려 위태롭다."
    - 속마음: "(원작의 사서. 말을 걸면 '조용히 하게'만 되풀이하던 노인.)"
    - "오늘은 작정하고 남았다. 열람실 맨 안쪽, 기둥 뒤 자리."
    - "폐관 종. 학생들이 하나둘 빠져나간다. 자물쇠 잠기는 소리."
    - "촛불을 끄고 기다렸다. 달이 창 한가운데 걸릴 때까지."
    - "다리가 저려 올 무렵."
    - "또각. 또각."
    - "왔다."
    - "이번엔 보인다. 흔들리는 등불, 그리고 그 등불을 든 굽은 등."
    - "사서 노인이다."
    - "낮의 그 졸던 노인이 맞나 싶다. 허리는 굽었는데, 걸음에 흔들림이 없다."
    - "노인은 서가 사이를 천천히 걸으며 책등을 하나씩 손끝으로 쓸어 본다. 아이 머리를 쓰다듬듯이."
    - "가끔 어떤 책 앞에서는 조금 오래 머문다. 입술이 달싹인다. 제목을 읽는 게 아니라, 인사를 하는 것처럼."
    - "그러다 창가의 빈 의자 앞에서 멈춰 섰다."
    - "낡은 나무 의자다. 등받이 모서리가 손때로 반질반질하다. 낮에는 아무도 앉지 않는 자리."
    - "노인이 의자 옆에 등불을 내려놓고, 창밖을 봤다."
    - 사서: "오늘은 비가 오려나 보군."
    - 사서: "칼데라 고개 너머 은빛 숲에도 비가 오겠지."
    - 사서: "자네는 비 오는 날을 제일 좋아했지. 다들 투덜거릴 때 혼자 웃었어."
    - "의자는 비어 있다."
    - "노인은 대답을 들은 것처럼, 아주 조금 웃었다."
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(칼데라 고개. 지도에서 사라진 지명이다.)"
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(…원작에서 이 사람은 대사 세 줄짜리 NPC였다. 그 세 줄 바깥에서, 매일 밤 이러고 있었던 거야?)"
    - when: "not perk.고인물의기억 and not perk.공략위키편집자"
      속마음: "(원작에서 이 사람은 대사 세 줄짜리 NPC였다. 그 세 줄 바깥에서, 매일 밤 이러고 있었던 거야?)"
    - when: "aren.librarian"
      나레이션: "성검의 목소리 일로 아렌이 이 노인을 찾아왔었다는 게 떠올랐다. 노인은 그때 뭐라고 대답했을까."
    - "노인이 등불을 다시 들었다. 의자 등받이를 한 번 쓸고, 이쪽으로 걸음을 옮긴다."
    - 속마음: "(지금 움직이면 들킨다. 숨을 죽여야 한다.)"
  plants:
    - { id: F15, notice: { value: "stat.지성 + 15 * talent.완전기억 + 10 * perk.고인물의기억", dc: 30 } }
  check: { label: 들키지 않기, value: "stat.민첩 + stat.지성 / 2 + luck", dc: 27 }
  success:
    lines:
      - "기둥 뒤에 등을 붙이고 숨을 아주 얕게 쉬었다. 들이쉬는 숨도, 내쉬는 숨도 소리 나지 않게."
      - "등불이 기둥 바로 옆을 지나갔다. 주황빛이 내 발끝을 핥고 지나갔다."
      - "노인은 끝내 이쪽을 돌아보지 않았다."
      - "등불이 금서 서가 안쪽으로 사라질 때까지, 숨소리 하나 내지 않았다."
      - "금서 서가 쪽에서 쇠사슬 풀리는 소리가 났다. 그리고 아주 오래, 책장 넘기는 소리."
      - "새벽, 문은 어김없이 열려 있었다. 빈 의자에 달빛이 앉아 있었다."
      - 속마음: "(저 사람은 몇 년째, 아니 몇십 년째 저렇게 밤을 걷고 있었을까.)"
    effects: ["libnight.step = 2", "libnight.wk = time.month * 4 + time.week", "stat.지성 += 0.5"]
  fail:
    lines:
      - "노인이 바로 앞을 지나는 순간, 저린 다리가 저절로 움찔했다."
      - "발밑에서 마룻바닥이 삐걱 울었다."
      - "등불이 멈췄다."
      - "심장도 멈췄다. 정확히는 멈춘 것 같았다."
      - "노인은 돌아보지 않은 채로 말했다."
      - 사서: "…거기 서 있지 말고 돌아가 자게. 바닥이 차네."
      - 사서: "문은 열어 두었네. 오른쪽 문이야. 왼쪽은 삐걱거려."
      - "그게 다였다. 꾸짖지도, 묻지도 않았다."
      - "등불은 다시 걷기 시작했다. 처음과 똑같은 박자로."
      - "오른쪽 문은 정말로 열려 있었다. 소리 없이."
      - 속마음: "(…언제부터 알고 있었던 거지.)"
    effects: ["libnight.step = 2", "libnight.wk = time.month * 4 + time.week", "libnight.caught = 1"]

- id: lib_night_3
  title: 밤의 서가지기
  on: 도서관
  window: { from: "1.3.2", to: "1.7" }
  when: "libnight.step == 2 and time.month * 4 + time.week > libnight.wk"
  effects: ["libnight.step = 3"]
  lines:
    - "낮의 도서관. 반납할 책 세 권을 안고 대출 창구 앞에 섰다."
    - "사서 노인은 오늘도 졸고 있다. 안경이 코끝에 걸려 있다. 밤의 그 노인과 같은 사람이라는 게 믿기지 않는다."
    - "책을 내밀었다."
    - "노인의 손이 책 대신 내 손목을 툭 짚었다. 마른 나뭇가지 같은 손가락. 생각보다 힘이 있다."
    - "안경 너머로 눈이 떠졌다. 졸던 사람의 눈이 아니다."
    - 사서:
        - "요 며칠, 밤마다 서가 뒤에서 숨소리가 나더군. 쥐치고는 숨이 길었어."
        - { when: "libnight.caught", text: "그날 밤 바닥이 찼을 텐데. 감기는 안 걸렸나." }
    - 속마음: "(…처음부터 알고 있었구나.)"
    - "등줄기에 식은땀이 흘렀다. 폐관 뒤에 숨어 든 학생. 금서 서가 앞을 기웃거린 학생. 벌점으로 끝나면 다행이다."
    - 나@당황: "그, 그게. 도서관에서 잠들었다가 갇혀서—"
    - 사서: "첫날은 그랬겠지. 둘째 날은?"
    - 나: "……."
    - "노인이 안경을 벗어 소매로 닦았다. 서두르지 않는다. 이 사람에게는 서두를 일이 없어 보인다."
    - 사서: "밤에 걷는 건 늙은이 버릇일세. 잠이 안 오면 걷고, 걷다 보면 책들이 말을 걸지."
    - 사서: "젊을 땐 많이 걸었네. 아주 멀리까지. 이제는 서가 사이가 내 길이야."
    - "노인이 안경을 다시 썼다. 그리고 나를 똑바로 봤다."
    - 사서@진지: "자네도 잠이 안 오는 얼굴이야."
    - 사서: "늘 뭔가를 세고 있는 눈이지. 남은 날짜 같은 걸."
    - "심장이 한 박자 늦게 뛰었다."
    - 속마음: "(남은 날짜. 10년에서 하루씩 빼고 있는 걸, 이 사람이 어떻게.)"
    - 속마음: "(원작에서 대사 세 줄짜리였던 사람이, 지금 내 속을 들여다보고 있다.)"
    - "창구 너머 도서관은 평화롭다. 누군가 책장을 넘기고, 누군가 하품을 한다."
    - "노인은 대답을 재촉하지 않는 얼굴로, 반납 도장을 손에 쥔 채 기다린다."
    - 속마음: "(무엇을 물어야 하지. 아니, 물어도 되는 걸까.)"
  choices:
    - text: "\"빈 의자에게… 누구랑 이야기하신 거예요?\""
      effects: ["affinity.librarian += 8"]
      lines:
        - 나: "…창가의 빈 의자요. 누구랑 이야기하신 거예요?"
        - "노인의 손이 도장 위에서 멈췄다."
        - "한참 창가 쪽을 바라봤다. 낮의 햇빛 속에서 그 의자는 그냥 낡은 의자다."
        - 사서: "오래된 친구들일세. 이제는 책 속에만 있는."
        - 나: "친구들… 이요?"
        - 사서: "하나는 비를 좋아했고, 하나는 노래를 지독히 못했고, 하나는 늘 길을 잃었지."
        - "노인의 입가에 아주 옅은 웃음이 걸렸다. 오래된 농담을 떠올리는 사람의 웃음."
        - 사서@슬픔: "책은 사람보다 오래 살지. 그래서 나는 책 곁에 있네."
        - 사서: "여기 있으면, 그 친구들도 아직 어딘가 있는 것 같거든."
        - 속마음: "(묻고 싶은 게 산더미였다. 그 친구들이 누군지. 언제 적 이야기인지. 칼데라 고개가 어디인지.)"
        - 속마음: "(노인의 눈을 보고, 하나도 묻지 못했다.)"
        - "노인이 도장을 쾅 찍었다. 반납 완료."
        - 사서: "다음엔 낮에 오게. 낮의 도서관도 나쁘지 않아."
    - text: "\"밤에 서가 정리, 제가 도울게요\""
      effects: ["affinity.librarian += 6", "libnight.keeper = 1", "stat.지성 += 1"]
      lines:
        - 나: "…밤에 서가 정리, 제가 도울게요."
        - "말해 놓고 나도 놀랐다. 노인도 놀란 얼굴이었다. 안경이 코끝에서 한 번 미끄러졌다."
        - 사서: "…허. 젊은 녀석이 잠을 반납하겠다고."
        - 나: "어차피 잠이 안 오는 얼굴이라면서요."
        - "노인이 처음으로 소리 내어 웃었다. 마른기침 같은 웃음."
        - 사서@웃음: "말대꾸도 할 줄 아는군. 좋아."
        - "노인이 창구 밑에서 무언가를 꺼내 내 앞에 놓았다. 낡은 놋쇠 등불이다."
        - "손잡이가 반질반질하게 닳아 있다. 수많은 손이 오랫동안 쥐었던 것처럼."
        - 사서: "밤에 올 거면 이걸 들고 오게. 어둠 속에서 책을 더듬는 건 책한테 실례야."
        - 사서: "규칙은 하나. 금서 서가 쇠사슬은 내가 풀 때만 넘어가게."
        - 나: "…네."
        - "등불을 들어 보았다. 생각보다 무겁다. 유리 안쪽에 그을음 하나 없다. 매일 닦은 등불이다."
        - 속마음: "(이 등불을 전에 쥐었던 손은 누구였을까.)"
        - 시스템: "밤의 서가지기 — 밤에 도서관에 가면 가끔 서가 정리를 돕게 된다."
    - text: 아무것도 묻지 않고 고개를 숙인다
      effects: ["affinity.librarian += 10"]
      lines:
        - "입을 열었다가, 다시 닫았다."
        - "물을 수 있는 건 많았다. 왜 밤에 걷는지. 빈 의자는 누구인지. 남은 날짜를 어떻게 알았는지."
        - 속마음: "(그런데 이 사람도 나에게 묻지 않았다. 왜 밤에 숨어 있었는지, 무엇을 세고 있는지.)"
        - "말없이 고개를 숙였다. 깊이."
        - "노인이 잠시 나를 내려다봤다. 안경 너머의 눈이 조금 부드러워졌다."
        - 사서: "…좋은 학생이군."
        - 사서: "묻지 않는 것도 재주야. 요즘 젊은이들한테는 드문 재주지."
        - 사서: "물어야 할 때가 오면, 그때는 묻게. 대답할 수 있는 건 대답해 주지."
        - "노인이 반납 도장을 쾅 찍었다."
        - "그 소리가 이상하게 따뜻했다. 오래된 집의 문이 닫히는 소리 같았다."
        - "창구를 떠나며 돌아보니, 노인은 다시 꾸벅꾸벅 졸고 있었다. 입가에 웃음이 남아 있었다."
        - 속마음: "(이 세계에 나보다 많이 아는 사람이 있다. 무섭고, 조금 안심이 된다.)"

- id: lib_night_keeper
  title: 밤의 서가 정리
  on: 도서관
  pool: true
  slots: [밤]
  repeat: 3
  cooldown: 2
  when: "libnight.keeper"
  effects: ["affinity.librarian += 2", "stat.지성 += 1", "fatigue += 5"]
  branch:
    - when: "fired.lib_night_keeper >= 3"
      lines:
        - "밤. 놋쇠 등불에 불을 붙이고 도서관 문을 밀었다. 오른쪽 문. 소리 없이 열린다."
        - "노인은 이미 서가 사이에 있었다. 내 등불을 보고 고개만 한 번 끄덕인다."
        - "놋쇠 등불을 들고 노인과 나란히 서가를 걸었다. 오늘은 둘 다 말이 없다."
        - "수레를 밀고, 책을 꽂고, 다음 서가로. 바퀴 구르는 소리와 발소리뿐이다."
        - "등불 두 개가 서가 사이에 그림자를 겹겹이 만든다. 노인의 그림자는 굽었고, 내 그림자는 길다."
        - "등불 심지를 조금 낮췄다. 노인이 그걸 보고 고개를 끄덕였다. 기름 아끼는 법은 이 사람에게 배웠다."
        - 속마음: "(이 침묵이 편하다. 말하지 않아도 되는 사이라는 게, 이런 거구나.)"
        - "창가의 빈 의자 앞을 지났다."
        - "노인이 발을 멈추지 않았다."
        - "처음이다. 늘 그 앞에서 멈춰 섰는데."
        - "나도 모르게 노인을 봤다. 노인은 앞만 보며 걷고 있다."
        - "서가 끝에 다다랐을 때, 노인이 혼잣말처럼 말했다."
        - 사서: "…자네가 있으니 오늘은 덜 적적하다는군."
        - "누가, 라고는 묻지 않았다."
        - "돌아보니 빈 의자에 달빛이 앉아 있었다. 어쩐지 웃고 있는 것 같았다."
        - 속마음: "(언젠가 저 의자 주인의 이름을 듣게 될까. 그날까지 이 등불을 들고 있자.)"
        - "새벽 종이 울렸다. 노인이 내 등불의 심지를 손끝으로 눌러 껐다. ─ 잘 자게."
    - when: "fired.lib_night_keeper >= 2"
      lines:
        - "밤의 서가 정리. 이제는 손이 먼저 서가 번호를 찾는다."
        - "반납 수레 바퀴가 삐걱거린다. 노인이 기름칠은 다음 주에 하자고 했다. 지난주에도 그랬다."
        - "반납 수레 맨 밑에 동화책 한 권이 끼어 있다. 모서리가 닳고, 표지에 아이 손자국이 묻은 책."
        - "『용사님과 일곱 별』."
        - 속마음: "(이 세계 아이들이라면 다 아는 동화다. 천 년 전 용사가 마왕을 봉인하는 이야기.)"
        - "노인이 그 책을 받아 들었다. 그리고 다른 책보다 오래 표지를 쓸었다."
        - "손가락이 표지 그림 속 용사의 얼굴 위에서 잠시 멈췄다. 금박이 다 벗겨진 자리."
        - 나: "그 책, 좋아하세요?"
        - 사서: "…좋아하지는 않네. 틀린 데가 많아서."
        - 나: "동화가 틀릴 수도 있어요?"
        - 사서: "동화는 다 틀리지. 그래서 동화야."
        - "노인은 그 책을 아주 낮은 칸에 꽂았다. 아이 키 높이."
        - 사서: "용사 이야기는 아이들 손이 닿는 데 있어야 해."
        - 사서: "어른들 손이 닿는 데 두면, 다들 고쳐 쓰려고 하거든."
        - 속마음: "(틀린 데가 많다니. 동화를 두고 할 말은 아니다. …아니면, 할 말인가.)"
        - "그날 밤, 그 낮은 칸 앞을 지날 때마다 노인의 걸음이 아주 조금 느려졌다."
    - lines:
        - "밤. 놋쇠 등불을 들고 도서관에 왔다. 노인이 반납 수레를 내 쪽으로 밀어 준다."
        - "등불 아래, 반납 수레의 책을 제자리에 꽂는다."
        - "노인은 제목만 듣고도 서가 번호를 댄다. 수천 권을. 한 번도 틀리지 않고."
        - 나: "『중급 원소 변환론』."
        - 사서: "마도학 3번 서가, 위에서 둘째 칸. 왼쪽에서 열넷째."
        - 나: "『실바니엘 약초 도감』."
        - 사서: "박물 7번, 맨 아래 칸. 그 책은 무거우니 허리 말고 무릎을 굽히게."
        - "꽂고 돌아서는데, 노인이 등불을 들어 내 손끝을 비췄다."
        - 사서: "…자네 지금 거꾸로 꽂았네."
        - 나@당황: "아."
        - "책을 바로 꽂았다. 노인이 콧소리로 웃었다."
        - 사서@웃음: "처음엔 다들 그러지. 책등이 보이게, 제목이 바로 서게. 사람 얼굴 보듯이."
        - "그 뒤로는 한 권도 거꾸로 꽂지 않았다. 노인은 아무 말도 안 했지만, 등불을 조금 내 쪽으로 들어 주었다."
        - "새벽이 되니 손끝이 먹물투성이다. 허리가 뻐근하다."
        - "그런데 머릿속은 이상하게 맑다. 책 냄새를 오래 맡으면 생각이 가라앉는다."
        - 속마음: "(원작의 '도서관' 버튼은 지성 +1이었다. 그 숫자 뒤에 이런 밤이 있는 줄은 몰랐다.)"

# ================================================================ 사이드 퀘스트 ② 핀에게 글자 가르치기

- id: finn_letters_1
  title: 앞사람과 같은 걸로
  on: 식당
  pool: true
  window: { from: "1.3.2", to: "1.7" }
  lines:
    - "점심시간이 끝나 가는 식당. 배식 줄이 한산해졌다."
    - "남은 스튜 냄새와 설거지 김이 섞여 공기가 눅눅하다."
    - "빗자루를 벽에 세워 둔 청소부 소년이 배식 줄 맨 끝에 선다. 학생들이 다 먹고 나서야 오는 모양이다."
    - when: "found.finn"
      나레이션: "핀이다. 밤의 연무장에서 칼날 같던 눈이, 여기서는 바닥만 본다."
    - "소년은 메뉴판을 한참 올려다봤다. 입술이 달싹인다. 눈이 글자 위를 헤매다가, 결국 미끄러진다."
    - "그리고 앞사람이 받은 것과 똑같은 걸 달라고 했다."
    - "쟁반을 받아 드는 손등에, 빗자루 자루에 쓸린 굳은살이 보인다."
    - "어제도 그랬다. 그제도."
    - 속마음: "(…메뉴판을 못 읽는구나.)"
    - 속마음: "(고아원 출신. 이 세계에서 글자는, 먹고살 걱정 없는 집 아이들의 것이다.)"
    - "오늘 앞사람이 받은 건 매운 고추 스튜였다. 이 식당에서 제일 매운, 도전 메뉴."
    - "소년이 빈자리에 앉아 한 숟갈 떴다."
    - "얼굴이 순식간에 시뻘게진다. 귀 끝까지."
    - "그런데도 숟가락을 내려놓지 않는다. 두 번째 숟갈. 눈물이 그렁그렁하다."
    - 속마음: "(남기면 안 된다고 배운 얼굴이다. 밥을 남기는 게 죄였던 곳에서 자란.)"
  choices:
    - text: 물을 가져다주고, 메뉴판을 읽어 준다
      effects: ["met.finn = 1", "affinity.finn += 3"]
      lines:
        - "물 한 컵을 가져다 소년 앞에 놓았다."
        - "소년이 고개를 들었다. 놀란 눈. 그리고 컵을 낚아채 단숨에 비웠다."
        - 핀@당황: "고, 고마워요. 이게 이렇게 매, 매운 건 줄 몰라서…"
        - 핀: "앞사람이 맛있게 먹길래."
        - "한 컵 더 가져다주고, 소년 옆에 앉았다. 메뉴판을 손가락으로 짚으며 소리 내어 읽었다."
        - 나: "감자 스튜. 고추 스튜. 보리빵. 오늘의 수프. 이 불꽃 표시는 '맵다'는 뜻이고."
        - "소년의 눈이 내 손가락을 따라 움직인다. 한 글자도 놓치지 않으려는 눈이다."
        - 핀: "…눈치챘어요? 저 글자 몰라요."
        - 핀@슬픔: "고아원에선 빗자루 잡는 법만 가르쳐 줬거든요. 글자는 원장님 아들만 배웠어요."
        - 핀@웃음: "괜찮아요. 앞사람 따라 하면 되니까. 가끔 이렇게 매운 게 걸리지만."
        - "웃는데, 숟가락 쥔 손가락 마디가 하얗다."
        - 속마음: "(괜찮다고 웃는 사람치고, 괜찮은 사람은 없었다.)"
      choices:
        - text: "\"글자, 내가 가르쳐 줄까?\""
          effects: ["finn.letters = 1", "finn.letters_wk = time.month * 4 + time.week", "affinity.finn += 4"]
          lines:
            - 나: "글자, 내가 가르쳐 줄까?"
            - 핀@놀람: "…저를요?"
            - 핀: "학생이, 청소부한테요? 왜요?"
            - "대답을 고르는 사이, 소년이 먼저 고개를 숙였다. 숟가락만 내려다본다."
            - 핀: "그, 그런 거 하면 학생이 놀림받아요. 청소부랑 논다고."
            - 나: "놀리라지 뭐. 나 D반이야. 이미 놀림받아."
            - "소년이 푸흡, 하고 웃음을 터뜨렸다. 그러다 매운 기운에 다시 사레가 들렸다."
            - "물을 마시고, 한참 숨을 고르고, 소년이 작게 말했다."
            - 핀: "놀리는 거 아니면… 네. 배우고 싶어요. 메뉴판 정도는."
            - 핀: "청소 끝나는 시간에 호숫가 모래밭에 있을게요. 종이는 비싸니까요."
            - when: "finn.promise"
              속마음: "(제대로 가르쳐 줄 사람을 찾아 주겠다고 했었지. 검만 말한 건 아니었다.)"
            - "소년이 빈 그릇을 들고 일어섰다. 매운 스튜를 끝까지 다 비웠다."
            - "빗자루를 집어 들고 나가는 뒷모습이, 올 때보다 반 뼘쯤 커 보였다."
        - text: "\"앞사람 따라 하는 것도 요령이지\""
          effects: ["affinity.finn += 1"]
          lines:
            - 나: "앞사람 따라 하는 것도 요령이지."
            - 핀: "그쵸? …그쵸."
            - "소년은 웃었다. 아까보다 조금 빨리 웃었다."
            - "그리고 남은 스튜를 묵묵히 떠먹었다. 메뉴판 쪽은 다시 올려다보지 않았다."
            - "빈 그릇을 반납하고, 빗자루를 들고 나갔다."
            - 속마음: "(…방금 뭔가를 하나 놓친 것 같다.)"
            - "식당 문이 닫혔다. 메뉴판의 글자들이 오늘따라 크게 보였다."
    - text: 못 본 척한다
      lines:
        - "시선을 돌렸다. 남의 식사에 끼어들 이유는 없다."
        - "내 접시만 봤다. 감자를 세 조각으로 자르고, 하나씩 천천히 먹었다."
        - "숟가락 소리가 저쪽에서 멈췄다가, 다시 이어졌다. 훌쩍이는 소리도."
        - "소년은 스튜를 끝까지 다 먹었다."
        - "눈물을 소매로 닦아 가며, 코를 훌쩍여 가며. 한 숟갈도 남기지 않고."
        - "빈 그릇을 반납하면서 소년이 배식대에 꾸벅 인사했다. 잘 먹었습니다."
        - "그리고 빗자루를 들고 나갔다. 메뉴판 앞을 지날 때는 고개를 숙이고."
        - 속마음: "(내일도 저 아이는 앞사람과 같은 걸 시키겠지.)"
        - 속마음: "(…모든 걸 다 챙길 수는 없다. 10년은 짧다.)"
        - "식탁 위에 매운 고추 냄새만 오래 남았다."
        - "메뉴판을 올려다봤다. 감자 스튜, 고추 스튜, 보리빵. 나한테는 그냥 글자다. 저 아이한테는 벽이다."

- id: finn_letters_2
  title: 호숫가의 글자 수업
  art: lake
  on: 산책
  window: { from: "1.3.2", to: "1.7" }
  when: "finn.letters == 1 and time.month * 4 + time.week > finn.letters_wk"
  lines:
    - "청소가 끝나는 시간의 호숫가. 해가 서쪽 숲 위에 한 뼘쯤 걸려 있다."
    - "물결이 모래밭을 핥았다가 물러난다. 갈대가 바람에 사각거린다."
    - "핀이 빗자루 대신 나뭇가지를 들고 모래밭에 쪼그려 앉아 있었다."
    - "나를 보더니 벌떡 일어선다. 모래 묻은 손을 바지에 닦는다. 두 번, 세 번."
    - 핀@놀람: "지, 진짜 왔네요."
    - 핀: "…안 올 줄 알았어요. 학생들은 다 바쁘잖아요."
    - 나: "약속했잖아."
    - "핀이 뭐라고 대답하려다 말고, 나뭇가지 하나를 내밀었다. 끝이 칼로 뾰족하게 깎여 있다. 미리 준비한 모양이다."
    - "물기가 남은 단단한 모래를 골랐다. 손바닥으로 판판하게 고르고, 첫 글자를 썼다."
    - 나: "이건 'ㄱ'. 기역. 낫처럼 생겼지."
    - 핀: "낫… 낫은 알아요. 고아원 뒷밭에서 썼어요."
    - "핀이 그 옆에 따라 쓴다. 비뚤비뚤하다. 낫이 아니라 부러진 지팡이 같다."
    - "물결이 와서 둘 다 지웠다."
    - 핀@당황: "아."
    - 나: "괜찮아. 다시."
    - "다시 썼다. 또 지워졌다. 또 썼다."
    - "열 번쯤 반복했을 때, 이상한 게 눈에 들어왔다."
    - when: "found.finn"
      나레이션: "그런데 획을 긋는 손목만은 이상할 만큼 곧다. 밤의 연무장에서 보던 검 끝처럼, 망설임이 없다."
    - when: "not found.finn"
      나레이션: "모양은 엉망인데, 긋는 기세만은 이상하게 시원하다. 빗자루로 바닥을 쓸듯, 한 번에 끝까지 간다."
    - 속마음: "(글자를 가르치는 건 처음이다. 위키 문서는 수백 개 썼어도, 남의 손을 잡고 가르쳐 본 적은 없다.)"
    - "해가 숲에 닿았다. 모래밭이 주황빛으로 물들었다."
  check: { label: 글자 가르치기, value: "stat.지성 + stat.매력 / 2 + 5 * talent.사람좋은얼굴 + luck", dc: 26 }
  success:
    art: cg_finn_name
    lines:
      - "자음 다섯 개. 모음 세 개. 핀은 한 번 본 모양을 두 번 틀리지 않았다."
      - 속마음: "(빠르다. 검만이 아니다. 이 아이는 '보고 따라 하는' 데 천재다. 그걸로 지금까지 살아온 거다.)"
      - "해가 기울 무렵, 마지막으로 하나를 가르쳤다. 오늘 수업의 목표."
      - "모래 위에 천천히 썼다. 핀이 숨을 죽이고 본다."
      - 나: "따라 써 봐."
      - "핀이 나뭇가지를 고쳐 쥐었다. 한 획. 두 획. 망설이다가, 마지막 획."
      - "핀이 혼자서 한 단어를 썼다. 아무도 불러 주지 않으면 아무도 몰랐을 단어."
      - "── 핀."
      - 핀@놀람: "이게… 제 이름이에요? 이렇게 생겼어요?"
      - 나: "응. 그게 너야."
      - "핀은 모래 위의 제 이름을 한참 내려다봤다. 입술이 달싹인다. 핀. 핀."
      - "물결이 밀려왔다. 핀이 화들짝 놀라 손바닥으로 이름 둘레에 작은 둑을 쌓았다."
      - "물결이 둑 앞에서 멈추고 물러났다. 이름은 무사했다."
      - 핀@웃음: "…안 지워졌어요."
      - "해가 다 질 때까지, 핀은 그 둑을 지켰다. 나는 옆에 앉아 있었다."
    effects: ["finn.letters = 2", "finn.letters_at = count.휴식", "affinity.finn += 5", "trust.finn += 3", "stat.매력 += 0.5"]
  fail:
    lines:
      - "그런데 오늘은 손이 말을 듣지 않는다. 핀의 나뭇가지가 자꾸 엉뚱한 쪽으로 간다."
      - "'ㄴ'을 쓰라면 'ㄱ'이 나오고, 'ㅏ'를 쓰라면 'ㅓ'가 나온다. 거울에 비친 것처럼."
      - "세 번째로 지우고 나서, 핀이 가지를 내던졌다. 가지가 물에 떨어져 동동 떴다."
      - 핀@화남: "역시 안 돼요!"
      - 핀: "저 같은 건 원래 머리가—"
      - "그 말을 끝까지 하게 두지 않았다."
      - "내 나뭇가지로 모래 위에 크게 썼다. 핀의 키만큼 크게."
      - 핀: "…그게 뭔데요."
      - 나: "네 이름. 오늘은 이것만 외우자."
      - "핀이 숨을 멈췄다. 한참 그 글자를 노려봤다. 원수를 보듯이. 아니, 처음 보는 거울을 보듯이."
      - "그러다 신발을 벗고 물에 들어가, 던졌던 가지를 주워 왔다."
      - 핀@슬픔: "…한 번만 더요. 이번엔 안 던질게요."
      - "해가 질 때까지 그 이름 하나를 썼다. 스무 번. 서른 번."
      - "마지막 것은 조금 덜 비뚤었다."
    effects: ["finn.letters = 2", "finn.letters_at = count.휴식", "affinity.finn += 3", "trust.finn += 3"]

- id: finn_letters_3
  title: 문틈의 쪽지
  art: dorm_room
  on: 휴식
  window: { from: "1.3.2", to: "1.7" }
  when: "finn.letters == 2 and count.휴식 >= finn.letters_at + 1"
  effects: ["finn.letters = 3", "affinity.finn += 8", "trust.finn += 4", "stress -= 5"]
  lines:
    - "수업을 마치고 기숙사로 돌아왔다. 다리가 무겁다. 아무 생각 없이 눕고 싶다."
    - "방문 앞에서 멈췄다. 문틈에 무언가 끼워져 있다."
    - "하얀 종이. 식당 냅킨이다. 반듯하게 네 번 접은 것."
    - "모서리가 칼로 자른 듯 맞춰져 있다. 접는 데만 한참 걸렸을 것이다."
    - "펼쳤다."
    - "삐뚤빼뚤한 글씨가 나왔다. 숯 조각으로 꾹꾹 눌러 쓴 글씨."
    - "몇 번이나 지웠다 다시 쓴 자국이 냅킨에 보풀처럼 일어나 있다. 어떤 자리는 너무 문질러서 구멍이 나기 직전이다."
    - "── 고마어요. 핀."
    - "'워'가 아니라 '어'다."
    - "틀린 게 아니다. 아직 배우지 않은 글자다. 배운 것만으로, 어떻게든 쓴 편지다."
    - "그래도 읽을 수 있다. 충분히."
    - "냅킨 귀퉁이에 작게, 지우다 만 글자가 하나 더 있다. 'ㄱ'. 낫 모양."
    - 속마음: "(첫날 배운 글자다. 그것까지 써 보고 싶었던 거구나.)"
    - when: "origin != '악역도련님' and origin != '몰락귀족'"
      브루노: "그거 뭐야? 연애편지? …아, 그 청소부 꼬마? 아까 문 앞에서 한참 서성이더라. 노크는 안 하고."
    - when: "origin != '악역도련님' and origin != '몰락귀족'"
      브루노@웃음: "세 번 왔다 갔어. 손을 들었다 내렸다 하면서. 내가 '들어와' 하려니까 도망가더라."
    - when: "origin == '몰락귀족'"
      나레이션: "귀족 동 맨 끝 방까지, 그 아이가 혼자 찾아왔다. 청소부가 귀족 동 복도를 걷는 게 얼마나 눈치 보이는 일인지 안다."
    - when: "origin == '악역도련님'"
      하인: "청소부 아이가 한참 서 있다 갔습니다, 도련님. 쫓아낼까 하다가… 그냥 두었습니다."
    - "냅킨을 들고 침대에 걸터앉았다. 한참 그 다섯 글자만 봤다."
    - "이 세계에 와서 처음 받은 편지다. 식당 냅킨에, 숯 글씨."
    - 속마음: "(원작 데이터에는 검술 S, 이벤트 없음. 그게 이 아이에 대한 기록의 전부였다.)"
    - 속마음: "(이벤트가 없던 아이가, 처음으로 자기 이름을 썼다. 나한테.)"
    - "창밖에서 빗자루 쓰는 소리가 들렸다. 쓱, 쓱. 일정한 박자."
    - "내다보니, 기숙사 마당 끝에서 작은 그림자가 바닥을 쓸고 있다. 이쪽은 보지 않는다. 일부러."
    - "창문을 열고 냅킨을 들어 흔들었다."
    - "빗자루가 뚝 멈췄다. 소년의 귀가 새빨개지는 게 여기서도 보였다."
    - 핀@당황: "(돌아보지 않고, 크게) …글씨, 이상하죠! 다음엔 더 잘 쓸게요!"
    - "그리고 빗자루를 든 채 마당 끝으로 도망쳤다. 빗자루 끝이 땅에 한 번도 안 닿았다."
    - 속마음: "(이상하지 않아. 세상에서 제일 잘 쓴 '고마어요'다.)"
    - 속마음: "(이걸 어디에 둘까. 아무 데나 둘 수는 없다.)"
  choices:
    - text: 몸 주인의 일기장, 찢긴 장 자리에 끼워 둔다
      when: "item.일기장"
      effects: ["item.핀의쪽지 = 1"]
      lines:
        - "트렁크를 열고, 맨 아래에서 일기장을 꺼냈다. 이 몸의 원래 주인이 쓰던 것."
        - "가죽 표지가 손에 익었다. 매일 펼쳐 보지는 않지만, 매일 밤 거기 있는지 확인한다."
        - "마지막 장을 폈다. 찢겨 나간 자리. 종이 끝이 들쭉날쭉하다. 급하게 뜯은 것처럼."
        - 속마음: "(무엇이 적혀 있었는지 나는 모른다. 이 몸의 주인이 마지막에 무엇을 남기려 했는지.)"
        - "그 자리에 쪽지를 끼웠다. 네 번 접힌 냅킨이 빈자리에 딱 들어갔다."
        - "찢긴 장 자리가 조금 덜 비어 보인다."
        - when: "talent.몸주인의잔재"
          나레이션: "가슴 한쪽이 따뜻해졌다. 이 몸도, 이게 마음에 드는 모양이다."
        - "일기장을 덮었다. 전보다 아주 조금 두꺼워졌다."
        - 속마음: "(언젠가 찢긴 장에 무엇이 있었는지 알게 되더라도, 이 쪽지는 여기 둘 거다.)"
        - "트렁크를 닫는 손이 조심스러워졌다. 이 안에 이제 두 사람의 글씨가 있다."
        - "아니, 세 사람인가. 이 몸의 주인과, 핀과, 그 둘을 읽는 나."
    - text: 지갑 안쪽에 넣어 둔다
      effects: ["item.핀의쪽지 = 1"]
      lines:
        - "지갑을 꺼냈다. 은화 몇 닢과 동전 한 줌이 든, 낡은 가죽 지갑."
        - "은화보다 안쪽 칸을 열었다. 잃어버리면 안 되는 쪽."
        - "냅킨을 한 번 더 반듯하게 접어 넣었다. 핀이 접은 자국을 따라서."
        - "지갑이 아주 조금 두꺼워졌다. 손에 쥐어 보니 묵직하다. 은화 한 닢보다 무겁다."
        - 속마음: "(돈이 떨어질 때마다 지갑을 열겠지. 그때마다 이걸 보겠지.)"
        - 속마음: "(가난한 날마다 이 쪽지가 '고마어요'라고 말해 줄 거다. 나쁘지 않다.)"
        - "다음 날 아침, 식당에서 핀과 마주쳤다. 핀은 빗자루를 꼭 쥐고 고개를 푹 숙였다."
        - "지갑을 꺼내, 안쪽 칸을 살짝 열어 보였다. 네 번 접힌 하얀 냅킨."
        - "핀의 귀가 새빨개졌다. 그리고 빗자루를 들고 도망치듯 사라졌다."
        - "식당 문 뒤에서 핀이 한 번 고개를 내밀었다가, 쏙 들어갔다. 입꼬리가 올라가 있었다."
    - text: 답장을 써서 청소부 창고 문틈에 끼워 둔다
      effects: ["trust.finn += 4"]
      lines:
        - "책상에 앉아 공책을 한 장 뜯었다. 들꽃 편지지 말고, 그냥 공책 종이."
        - 속마음: "(비싼 종이를 쓰면 저 아이는 부담스러워할 거다.)"
        - "또박또박, 핀이 읽을 수 있게 크게 썼다."
        - "── '고마워요'의 '워'는 이렇게 써."
        - "── ㅇ, ㅜ, ㅓ. 셋을 합치면 '워'. 우와, 할 때의 그 소리."
        - "── 다음 수업은 '검'이야."
        - "밤이 깊어 청소부 창고까지 걸어갔다. 별관 뒤편, 보일러실 옆 작은 문."
        - "문틈에 종이를 끼웠다. 안쪽에서 고른 숨소리가 들린다. 자고 있다."
        - "다음 날 아침."
        - "내 방 문틈에 냅킨이 하나 더 끼워져 있었다."
        - "── 워. 워. 워. 워. 검?"
        - "'워'가 네 번. 갈수록 반듯해진다. 마지막 '검'에는 물음표가 붙어 있다. 기대에 찬 물음표다."
        - 속마음: "(물음표까지 배웠구나. …물음표는 안 가르쳤는데.)"
        - "웃음이 터졌다. 냅킨을 들고 한참 웃었다."

# ================================================================ 사이드 퀘스트 ③ 도로시의 시제품 시험

- id: dorothy_trial_1
  title: 시식 부탁
  on: [식당, 아르바이트]
  pool: true
  window: { from: "1.3.2", to: "1.7" }
  repeat: 2
  cooldown: 2
  when: "(found.dorothy or affinity.dorothy > 0) and not dorothy.trial"
  lines:
    - "점심 배식이 끝난 식당. 설거지통에서 김이 오르고, 앞치마 차림의 사람들이 바쁘게 오간다."
    - "배식대 뒤에서 누군가 고개를 쑥 내밀었다. 머리엔 두건, 뺨엔 밀가루."
    - 도로시@웃음: "마침 잘 왔어요! 손님, 아니 실험… 아니, 손님!"
    - 나: "방금 실험이라고—"
    - 도로시: "손님이라고 했어요. 분명히."
    - "도로시가 배식대를 돌아 나오더니 주위를 두리번거렸다. 식당 아주머니는 주방 안쪽에서 냄비를 닦고 있다."
    - "확인을 마친 도로시가 앞치마 주머니에서 작은 유리병을 꺼냈다."
    - "초록색과 분홍색, 두 층으로 나뉜 액체. 흔들어도 안 섞인다. 오히려 흔들수록 경계선이 선명해진다."
    - 도로시: "졸음 쫓는 물약이에요. 엄마 몰래 만든 3번 시제품."
    - 나: "1번이랑 2번은?"
    - 도로시@당황: "…묻지 마요."
    - 도로시: "1번은 엄마 행주가 녹았고요, 2번은… 식당 고양이가 사흘 동안 안 잤어요. 그건 성공인가?"
    - 속마음: "(에테크 연금술 미니게임. 비율 하나만 틀려도 '수상한 액체'가 나오던 그 지옥.)"
    - 속마음: "(화면 속에서도 수상했는데, 실물로 보니 더 수상하다. 병이 미세하게 떨리고 있다.)"
    - 도로시: "그러니까 이번엔 사람이 필요해요! 딱 한 모금이면 돼요. 제 계산으로는요."
    - "도로시가 눈을 반짝이며 병을 내밀었다. 거절하기 어려운 눈이다. 거절해야 할 것 같은 병이다."
  choices:
    - text: 마신다
      check: { label: 시제품 3번, value: "stat.체질 + 10 * talent.만독불침 + luck", dc: 24 }
      success:
        lines:
          - "병을 받아 들었다. 코르크를 뽑자 박하 냄새가 확 끼쳤다. 그 밑에, 뭔가 설명할 수 없는 냄새."
          - 속마음: "(체질이 받쳐 주길. 아니면 운이라도.)"
          - "눈을 질끈 감고 한 모금 마셨다."
          - "박하 맛이 정수리까지 치솟았다."
          - "눈이 번쩍 뜨인다. 세상이 지나치게 선명하다."
          - "벽의 나뭇결이 하나하나 다 보인다. 식당 반대편 학생의 숟가락에 붙은 보리알까지."
          - "어젯밤의 피로가 정수리로 증발해 나가는 느낌이다."
          - 도로시@놀람: "효과 있어요?! 진짜로?! 눈동자가 커졌어요!"
          - 도로시@웃음: "적어야지, 적어야지! 3번, 효과 있음. 부작용은요? 어디 이상한 데 없어요?"
          - 나: "…벽에 나뭇결이 너무 잘 보여."
          - 도로시: "'세상이 지나치게 선명함'. 좋아요, 좋아요!"
          - "도로시가 손바닥만 한 공책에 정신없이 적었다. 표지에 '실험 일지 (엄마 금지)'라고 쓰여 있다."
        effects: ["dorothy.trial = 1", "dorothy.trial_wk = time.month * 4 + time.week", "affinity.dorothy += 4", "fatigue -= 10"]
      fail:
        lines:
          - "병을 받아 들었다. 코르크를 뽑자 박하 냄새. 그 밑에, 뭔가 설명할 수 없는 냄새."
          - "눈을 질끈 감고 한 모금 마셨다."
          - "…아무 일도 없다."
          - 도로시: "어때요? 졸음 쫓겼어요?"
          - 나: "글쎄, 별로— 딸꾹."
          - "딸꾹질이 터졌다."
          - "딸꾹. 입에서 분홍색 거품이 하나 떠올랐다. 동그랗고, 반짝이고, 천천히 천장으로 올라간다."
          - "딸꾹. 하나 더."
          - 도로시@당황: "어… 어어. 부작용 칸에 '거품'이라고 적을게요. 미안해요, 정말로!"
          - "거품은 저녁때까지 나왔다. 딸꾹질 한 번에 하나씩."
          - "식당 아이들이 줄을 서서 구경했다. 누군가는 거품을 잡으러 뛰어다녔다. 거품에서는 박하 향이 났다."
          - 도로시: "(공책에 적으며) '지속 시간: 반나절. 향기: 좋음. 인기: 많음.' …이거 팔면 되겠는데요?"
          - 속마음: "(이 애는 진짜 연금술사다. 실패에서도 뭔가를 건진다.)"
        effects: ["dorothy.trial = 1", "dorothy.trial_wk = time.month * 4 + time.week", "affinity.dorothy += 3", "stress += 3"]
    - text: "\"화분에 먼저 줘 보자\""
      effects: ["dorothy.trial = 1", "dorothy.trial_wk = time.month * 4 + time.week", "affinity.dorothy += 4", "stat.지성 += 0.5"]
      lines:
        - 나: "…화분에 먼저 줘 보자."
        - 도로시: "화분이요?"
        - 나: "사람이 먹을 거면 다른 데 먼저 시험해 보는 거야. 기본이지."
        - "도로시가 입을 떡 벌렸다. 병을 쥔 손이 허공에서 멈췄다."
        - 도로시@놀람: "…천재예요? 왜 그 생각을 못 했지."
        - 도로시: "아니, 엄마 행주에 시험한 게 그거였는데… 행주는 살아 있는 게 아니잖아요."
        - "창가에 시든 제라늄 화분이 있다. 잎이 누렇게 처져 있다."
        - "도로시가 숨을 참고 한 방울 떨어뜨렸다."
        - "잎이 벌떡 일어섰다."
        - "그러더니 좌우로 흔들흔들, 춤을 췄다. 바람도 안 부는데. 박자까지 탄다."
        - "정확히 30초. 도로시가 손가락으로 셌다."
        - "제라늄은 춤을 멈추더니, 다시 축 처졌다. 지친 것 같다."
        - 도로시@진지: "음. 사람한텐 아직 이른 걸로."
        - 도로시@웃음: "그래도 봤어요? 춤췄어요! 화분이! 이건 기록해야 돼요!"
    - text: 정중히 사양한다
      effects: ["affinity.dorothy += 1"]
      lines:
        - 나: "…미안. 오늘은 사양할게. 오후에 실습이 있어서."
        - 도로시@슬픔: "에이."
        - "도로시가 병을 다시 앞치마 주머니에 넣었다. 아쉬움이 얼굴에 한가득이다."
        - 도로시: "다음엔 꼭이에요! 실험 대상… 아니, 시식단은 늘 모자라거든요."
        - 도로시: "엄마는 절대 안 먹어 줘요. 식당 아저씨들은 냄새만 맡고 도망가고."
        - "배식대 뒤로 돌아가던 도로시가 한 번 돌아봤다."
        - 도로시@웃음: "아, 그리고 오늘 스튜 감자는 제가 깎았어요. 그건 실험 아니에요. 안심하고 드세요!"
        - 속마음: "(…그렇게 말하니까 오히려 불안하다.)"
        - "배식대 뒤에서 도로시가 몇 번이나 병을 꺼내 흔들어 봤다. 두 색의 경계선은 여전히 선명했다."

- id: dorothy_trial_2
  title: 비율의 문제
  art: kitchen
  on: [식당, 아르바이트]
  window: { from: "1.3.2", to: "1.7" }
  when: "dorothy.trial == 1 and time.month * 4 + time.week > dorothy.trial_wk"
  lines:
    - "저녁 배식이 끝나 가는 식당. 주방 문이 반쯤 열려 있다."
    - "배식대 뒤에서 도로시가 머리를 쥐어뜯고 있다. 두건이 반쯤 벗겨졌다."
    - "앞에 놓인 종이에는 줄 그은 숫자들이 빼곡하다. 4, 5, 6… 9번까지. 전부 줄이 그어져 있다."
    - 나: "도로시?"
    - 도로시@슬픔: "아, 왔어요…? 저 지금 연금술사 은퇴 고민 중이에요."
    - 도로시: "4번부터 9번까지 전부 실패예요. 이번엔 뭉친 근육에 바르는 연고였는데."
    - 도로시: "바르면 근육이 더 뭉쳐요. 엄마 어깨에 발라 봤다가… 엄마가 하루 종일 나무 인형처럼 걸었어요."
    - 도로시: "순서가 틀린 것 같은데 모르겠어요. 엄마 레시피엔 전부 '적당히'라고만 써 있고."
    - "도로시가 낡은 레시피 공책을 펼쳐 보였다. 정말이다. '약초 적당히. 불 적당히. 적당히 저어 줄 것.'"
    - 도로시@화남: "'적당히'가 대체 얼마예요! 연금술에 '적당히'는 없어요!"
    - "화덕 위에 작은 냄비가 올려져 있다. 탁한 녹갈색 액체가 보글거린다. 쑥 냄새와 쇠 냄새."
    - "옆에 재료가 늘어서 있다. 말린 뿌리, 잎 한 줌, 노란 꽃잎."
    - 속마음: "(에테크 연금술의 기본. 뿌리, 잎, 꽃 순서. 마력은 불을 끈 다음에.)"
    - 속마음: "(3,000시간 중 300시간은 이 화면이었다. 레시피 표를 위키에 정리하느라 밤을 새운 적도 있다.)"
    - 도로시: "…왜 그렇게 냄비를 봐요? 뭐 알아요?"
    - 속마음: "(손이 근질거린다. 화면 속에서 수천 번 한 일이다. 진짜 손으로 하면 어떨까.)"
  check: { label: 연금 비율 맞추기, value: "stat.지성 + stat.마력제어 / 2 + 5 * perk.공략위키편집자 + luck", dc: 28 }
  success:
    lines:
      - "소매를 걷었다. 도로시가 냄비를 새로 씻어 왔다."
      - 나: "처음부터 다시. 뿌리 먼저."
      - "말린 뿌리를 넣고 물이 끓기를 기다렸다. 뿌리 색이 우러나 물이 연한 갈색이 된다."
      - 나: "잎은 뿌리 색이 다 빠지고 나서. …지금."
      - "잎을 넣었다. 잎이 가라앉았다가, 하나둘 떠오른다."
      - 나: "떠오를 때 꽃. 그리고 불 끄고."
      - "도로시가 숨을 참고 내 손만 본다. 국자를 쥔 손이 덜덜 떨린다."
      - "불을 끄고, 냄비 위에 손을 얹었다. 실습 시간에 배운 대로, 아주 약한 마력을 흘려 넣었다."
      - "탁하던 냄비 속이 천천히 맑아졌다. 투명한 호박색. 냄비 바닥이 비칠 만큼."
      - 도로시@놀람: "…됐다."
      - 도로시@웃음: "됐어요! 됐어요! 어떻게 알았어요? 연금과 다녀요? 아니, 1학년은 전공 없잖아요!"
      - 나: "…게임에서 봤어."
      - 도로시: "게임? 무슨 게임이 연금술을 가르쳐요? 나도 할래요! 어디서 팔아요?"
      - 속마음: "(…이 세계엔 안 팔아.)"
    effects: ["dorothy.trial = 2", "dorothy.trial_wk = time.month * 4 + time.week", "affinity.dorothy += 5", "stat.지성 += 0.5"]
  fail:
    lines:
      - "소매를 걷었다. 뿌리 먼저, 잎, 꽃. 순서는 기억하고 있다."
      - "뿌리를 넣고, 잎을 넣고, 꽃을 넣었다. 냄비 속이 조금씩 맑아진다."
      - 도로시: "오, 오오…!"
      - "그런데 화덕 불이 너무 셌다. 게임에선 '불 세기' 막대가 있었는데, 진짜 화덕엔 막대가 없다."
      - "냄비가 부르르 떨었다."
      - "'퐁.'"
      - "냄비 뚜껑이 날아올라 천장에 부딪혔다. 천장에 보라색 얼룩이 남았다. 꽃 모양이다."
      - 도로시@웃음: "그래도 이번 건 덜 뭉쳐요! 냄새가 달라요! 방향은 맞았어요."
      - 도로시: "나머진 제가 해 볼게요. 불 조절은 제가 더 잘해요. 십 년째 이 화덕이랑 싸웠거든요."
      - "식당 아주머니가 주방 문간에 나타났다. 천장을 올려다보며 길게 한숨을 쉬었다."
      - "도로시가 재빨리 내 등 뒤로 숨었다."
      - 속마음: "(…공범이 됐다.)"
    effects: ["dorothy.trial = 2", "dorothy.trial_wk = time.month * 4 + time.week", "affinity.dorothy += 3"]

- id: dorothy_trial_3
  title: 공동 개발자
  art: cg_dorothy_label
  on: [식당, 아르바이트]
  window: { from: "1.3.2", to: "1.7" }
  when: "dorothy.trial == 2 and time.month * 4 + time.week > dorothy.trial_wk"
  effects: ["dorothy.trial = 3", "item.강장제 += 1", "affinity.dorothy += 8"]
  lines:
    - "식당 문을 열자마자 무언가가 앞을 막아섰다."
    - 도로시@웃음: "짜잔!"
    - "도로시가 두 손으로 병 하나를 높이 들고 있다. 전쟁에서 이긴 장군이 깃발을 든 자세다."
    - 도로시: "완성이에요! 10번 시제품! 정식 이름은 '도로시 강장제'!"
    - "손바닥만 한 갈색 병. 코르크 마개에 빨간 실이 감겨 있다. 안에서 호박색 액체가 은은하게 빛난다."
    - "병에 손글씨 라벨이 붙어 있다. 도로시 강장제. 그 아래에 조그맣게 적혀 있다."
    - "── 공동 개발자: {{player.name}}."
    - 나: "…이거, 내 이름?"
    - 도로시: "당연하죠! 순서 알려 준 게 누군데요. 연금술은 정직해야 해요. 엄마가 그랬어요. 아, 그건 요리 얘기였나."
    - 도로시: "그 순서대로 하니까 연고가 됐고요, 거기다 꿀이랑 박하를 넣었더니 마시는 약이 됐어요!"
    - 도로시: "실습에서 다치면 마셔요. 한 병뿐이니까 아껴 쓰고요."
    - 시스템: "아이템 획득 — 강장제 (전투: 체력 40% 회복)"
    - "병을 받아 들었다. 따뜻하다. 방금까지 도로시가 품에 안고 있었던 모양이다."
    - 속마음: "(에테크의 강장제 아이콘은 빨간 병이었다. 상점가 은화 다섯 닢. 이건 값을 매길 수가 없다.)"
    - 도로시: "그리고 있잖아요! 들어 봐요. 이게 진짜 큰 소식이에요."
    - "도로시가 목소리를 낮추고 바짝 다가왔다. 눈이 반짝반짝하다."
    - 도로시: "어제 연금술 교수님이 식당에 오셨거든요. 늘 스튜 두 그릇 시키시는 그 교수님."
    - 도로시: "제 냄비 냄새를 맡더니, 한참 서 계시다가 이러셨어요."
    - 도로시@진지: "'재능이 있군. 언제 연구실에 한번 와라.'"
    - "도로시가 교수 흉내를 냈다. 피곤한 눈, 낮은 목소리. 꽤 닮았다."
    - 도로시@웃음: "비스톨 교수님이요! 진짜 연구실이래요! 진짜 연금술사의 진짜 연구실!"
    - 도로시: "거기 가면 진짜 증류기가 있겠죠? 엄마 냄비 말고, 유리로 된 거! 마력로도!"
    - "도로시가 제자리에서 폴짝 뛰었다. 앞치마 주머니에서 숟가락이 떨어졌다."
    - 속마음: "(비스톨.)"
    - 속마음: "(원작에서 그 연구실에 드나들던 학생들이 마지막에 어디에 서 있었는지, 나는 안다.)"
    - when: "perk.데이터마이너"
      속마음: "(DLC 데이터의 도로시 분기. '비스톨의 제자' 플래그가 켜진 도로시의 일러스트는, 웃고 있지 않았다.)"
    - "손에 쥔 강장제 병이 갑자기 차갑게 느껴졌다."
    - 도로시: "…왜요? 표정이 왜 그래요?"
  choices:
    - text: "\"연구실엔 혼자 가지 마\""
      effects: ["dorothy.bistol_warned = 1", "trust.dorothy += 5"]
      lines:
        - 나: "도로시. 연구실엔 혼자 가지 마."
        - "생각보다 목소리가 낮게 나왔다."
        - 도로시@놀람: "네? 왜요?"
        - 도로시: "…표정이 무서워요. 무슨 일 있어요?"
        - 속마음: "(원작의 교주라고 말할 수는 없다. 증거도 없고, 믿을 리도 없고, 무엇보다 이 아이를 위험하게 만든다.)"
        - 나: "…그냥. 좋은 스승은 서두르지 않아. 처음 본 날 연구실로 부르는 사람은, 조금 더 지켜봐도 돼."
        - "도로시가 한참 나를 봤다. 웃음기가 가신 얼굴. 처음 보는 표정이다."
        - 도로시: "…알았어요."
        - 도로시: "가더라도 같이 가요. 혼자는 안 가요. 약속."
        - "도로시가 새끼손가락을 내밀었다. 손끝에 작은 화상 자국. 화덕이랑 싸운 십 년의 흔적."
        - "새끼손가락을 걸었다. 도로시가 엄지까지 꾹 눌러 도장을 찍었다."
        - 도로시@웃음: "도장까지 찍었으니까 진짜 약속이에요. 연금술사가 약속을 어기면 냄비가 터진대요."
        - 속마음: "(그런 속설은 처음 듣는다. …방금 지어낸 거겠지. 그래도, 지켜 줬으면.)"
    - text: "\"잘됐다. 축하해\""
      effects: ["affinity.dorothy += 2"]
      lines:
        - 속마음: "(…지금 막으면 이유를 대야 한다. 댈 수 있는 이유가 없다.)"
        - "목구멍까지 올라온 말을 삼켰다."
        - 나: "…잘됐다. 축하해."
        - 도로시@웃음: "헤헤. 고마워요!"
        - 도로시: "엄마한텐 아직 비밀이에요! 엄마는 제가 연금술 하는 거 싫어하거든요. 식당 딸은 식당 일 하라고."
        - 도로시: "근데 교수님이 재능 있다고 하셨잖아요. 그럼 엄마도 언젠간 인정하겠죠?"
        - "도로시가 배식대로 뛰어갔다. 콧노래를 부르면서. 국자를 지휘봉처럼 휘두르면서."
        - "강장제 병을 주머니에 넣었다. 묵직하다."
        - 속마음: "(…지금은 아무 일도 일어나지 않았다. 아직은.)"
        - 속마음: "(아직은, 이라는 말을 요즘 너무 자주 한다.)"

# ================================================================ 사이드 퀘스트 ④ 호숫가 고양이 (enc_walk_cat에서 이어짐)

- id: cat_1
  title: 얼룩 고양이의 선물
  art: lake
  on: 산책
  pool: true
  window: { from: "1.3.2", to: "1.7" }
  when: "fired.enc_walk_cat"
  lines:
    - "오후의 호숫가. 물 위에 햇빛이 잘게 부서져 있다. 물새 한 마리가 수면을 차고 날아오른다."
    - "산책로 끝 벤치에 앉아 숨을 돌리는데, 발치에서 바스락 소리가 났다."
    - 나레이션:
        - "그 얼룩 고양이가 다가와 내 발치에 무언가를 툭 떨어뜨린다. 죽은 쥐다. 엄청 크다."
        - { when: "talent.혐오스러운분위기", text: "그 얼룩 고양이가 멀찍이서 무언가를 툭 떨어뜨리고 물러선다. 죽은 쥐다. 선물인지 경고인지 모르겠다." }
        - { when: "talent.짐승의혈통", text: "그 얼룩 고양이가 내 발치에 죽은 쥐를 내려놓고, 아주 정중하게 앉는다. 부탁하는 얼굴이다." }
    - "고양이가 앞발로 쥐를 내 쪽으로 쓱 밀었다. 받으라는 듯이."
    - 속마음: "(고양이의 선물. 원래 세계에서 들은 적 있다. '너는 사냥을 못 하니 내가 먹여 살린다'는 뜻이라던가.)"
    - "그런데 고양이를 다시 보니, 뭔가 이상하다."
    - "배가 홀쭉하다. 갈비뼈가 털 너머로 셀 수 있을 만큼 드러나 있다."
    - "그런데 젖이 불어 있다. 귀 끝은 찢어져 있다. 새로 난 상처다. 아직 피가 맺혀 있다."
    - 속마음: "(새끼가 있다. 그런데 사냥한 쥐를 먹지 않고 들고 왔다는 건—)"
    - 속마음: "(자기 배를 채울 여유도 없을 만큼 급하다는 거다. 아니면, 이 쥐가 뭔지 보여 주려는 거거나.)"
    - "쥐를 내려다봤다. 들쥐가 아니다. 털이 거칠고 눈이 붉다. 앞니가 지나치게 길다."
    - "고양이 발바닥에 진흙이 말라붙어 있다. 물가 쪽, 어둡고 축축한 데서 온 진흙이다."
    - "고양이가 몇 걸음 가다 돌아본다."
    - "또 몇 걸음 가다 돌아본다. 따라오라는 듯이. 꼬리 끝이 초조하게 까딱인다."
    - "호숫가 끝, 낡은 보트 창고 쪽이다."
    - 속마음: "(퀘스트 마커 같은 건 없다. 대신 고양이가 돌아본다.)"
  choices:
    - text: 따라간다
      effects: ["cat.step = 1", "cat.wk = time.month * 4 + time.week"]
      lines:
        - "고양이를 따라 호숫가를 걸었다. 고양이는 내가 따라오는지 세 걸음마다 확인한다."
        - "보트 창고. 지붕이 반쯤 내려앉고, 문짝이 한쪽 경첩에만 매달려 있다. 몇 년째 아무도 쓰지 않은 곳이다."
        - "안은 어둡고 축축하다. 썩은 나무 냄새, 물비린내."
        - "고양이가 바닥 판자 틈새 앞에서 멈췄다. 그리고 낮게, 길게 울었다."
        - "쪼그려 앉아 귀를 기울였다."
        - "판자 아래에서 가는 울음소리가 들린다. 미우, 미우. 새끼 고양이들이다. 여럿이다."
        - "그리고 그보다 훨씬 많은, 무언가가 긁는 소리."
        - "사각사각사각. 바닥 전체가 그 소리로 웅웅 울린다."
        - "판자 틈으로 들여다봤다. 판자 아래는 지하 저장고다. 그 어둠 속에서 동굴 쥐 떼가 끓고 있다."
        - "수십 마리. 붉은 눈이 어둠 속에서 점점이 빛난다."
        - "새끼들 울음은 저장고 한쪽 구석, 나무 상자 위에서 들린다. 쥐들이 그 상자 밑을 맴돌고 있다."
        - 속마음: "(어미 혼자 감당할 숫자가 아니다. 저 귀의 상처도, 그래서 생긴 거다.)"
        - 속마음: "(고양이 퀘스트라. 원작에 이런 게 있었으면 위키에 '보상: 없음'이라고 적었겠지. …없어도 할 거지만.)"
        - "고양이가 내 바짓단에 머리를 한 번 비볐다. 처음이다."
    - text: 쥐만 치워 주고 돌아선다
      lines:
        - "쥐를 나뭇가지로 집어 갈대숲 너머로 던졌다."
        - 나: "선물은 고마운데, 이건 못 받아."
        - "고양이는 쥐가 날아간 쪽을 보지도 않았다. 나만 보고 있었다."
        - 속마음: "(뭔가 원하는 눈이다. 하지만 고양이 사정까지 챙길 여유는—)"
        - "벤치에서 일어나 기숙사 쪽으로 걸었다."
        - "몇 걸음 가다 돌아봤다. 고양이는 아직 그 자리에 앉아 있었다."
        - "고양이는 한참 나를 보다가, 혼자 보트 창고 쪽으로 걸어갔다. 꼬리가 축 처져 있었다."
        - 속마음: "(…괜찮겠지. 고양이는 강하니까.)"
        - "그날 밤, 이상하게 호숫가 쪽 바람 소리가 신경 쓰였다."

- id: cat_2
  title: 밤의 보트 창고
  art: lake
  on: 산책
  window: { from: "1.3.2", to: "1.7" }
  slots: [밤]
  when: "cat.step == 1 and time.month * 4 + time.week > cat.wk"
  lines:
    - "밤. 저녁 식사 때 식당에서 몰래 챙긴 생선 꼬리를 손수건에 싸서 들고 나왔다."
    - "밤의 호숫가는 낮과 딴판이다. 물은 검고, 갈대는 키가 커 보이고, 달빛이 물 위에 길을 낸다."
    - "등불을 낮게 들고 보트 창고를 다시 찾았다."
    - "어미 고양이가 판자 위에서 꼬리를 바짝 세우고 있다. 털을 곤두세운 채, 판자 아래를 노려보면서."
    - "지난번보다 긁는 소리가 크다. 사각사각이 아니라, 바득바득."
    - "판자 틈 아래로 빨간 눈이 수십 개. 지난번보다 많다."
    - 속마음: "(늘었다. 며칠 만에. 저장고 어딘가로 계속 들어오고 있다.)"
    - "새끼들의 울음소리는 들린다. 아직. 지난번보다 가늘다."
    - "손수건을 풀어 생선 꼬리를 내려놓았다."
    - "어미가 생선 냄새에 고개를 돌렸다. 나를 한참 보더니, 다가와 처음으로 내 손등에 머리를 비볐다."
    - "까끌한 털. 떨리는 몸. 얼마나 굶었는지 손끝으로 느껴진다."
    - "그러고는 생선을 먹지 않고 물었다. 판자 틈으로 쏙 들어가 새끼들에게 가져갔다."
    - 속마음: "(…자기는 안 먹고.)"
    - 속마음: "(좋아. 이건 퀘스트가 아니다. 작전이다. 정찰부터 하자.)"
  check: { label: 저장고 살피기, value: "stat.지성 + stat.민첩 / 2 + 10 * talent.짐승의혈통 + 5 * talent.자연친화력 + luck", dc: 24 }
  success:
    lines:
      - "등불을 낮추고 판자 틈을 따라 기었다. 무릎이 축축한 흙에 젖는다."
      - "쥐들은 빛을 싫어한다. 등불이 닿는 쪽에서 우르르 물러선다. 물러서는 방향이 일정하다."
      - "그 방향을 따라갔다. 저장고 벽 아래, 돌 틈."
      - "쥐들이 드나드는 구멍을 찾았다. 호수로 이어지는 낡은 배수구다. 쇠창살이 녹슬어 떨어져 나가 있다."
      - "귀를 대 보니 물소리와 함께 긁는 소리가 계속 올라온다. 저기로 계속 들어오는 거다."
      - 속마음: "(저걸 막고 싸우면 지원이 끊긴다. 레이드 기본이지.)"
      - 속마음: "(무한 리젠 몹은 리젠 포인트부터. 3,000시간이 이런 데서 쓰인다.)"
      - "배수구 위치를 머릿속에 새기고 물러났다. 판자 위의 어미가 그걸 다 지켜보고 있었다."
    effects: ["cat.step = 2", "cat.wk = time.month * 4 + time.week", "cat.plan = 1"]
  fail:
    lines:
      - "등불을 낮추고 판자 틈에 얼굴을 댔다. 어둠 속이 잘 보이지 않는다."
      - "조금 더 가까이—"
      - "어둠 속에서 쥐 한 마리가 튀어나와 손등을 콱 물고 달아났다."
      - 나@화남: "아얏!"
      - "등불이 굴렀다. 불빛이 판자 아래를 한 바퀴 휩쓸었다. 그 짧은 순간에 본 것."
      - "쥐 떼의 숫자만 확인했다. 많다. 셀 수 없을 만큼."
      - "손등에 이빨 자국 두 개. 피가 송골송골 맺혔다. 손수건으로 감았다."
      - 속마음: "(어디로 들어오는지는 못 찾았다. …정면 승부밖에 없나.)"
    effects: ["cat.step = 2", "cat.wk = time.month * 4 + time.week", "stress += 3"]
  choices:
    - text: 브루노에게 도움을 청하기로 한다
      when: "met.bruno or affinity.bruno > 0"
      effects: ["cat.ally = 'bruno'"]
      lines:
        - 속마음: "(혼자는 무리다. 손이 하나 더 필요하다. 아니, 아주 큰 손이.)"
        - "다음 날 아침, 식당에서 브루노에게 이야기했다. 보트 창고, 새끼 고양이, 쥐 떼."
        - "다 듣기도 전에 브루노가 소매부터 걷어붙였다. 숟가락을 쥔 채로."
        - 브루노@웃음: "고양이 구출 작전? 하하, 그런 거 좋아해!"
        - 브루노: "우리 대장간에도 고양이 있었어. 화로 옆에서만 자는 놈. 털이 까매서 이름이 '숯'이었지."
        - 브루노@진지: "판자랑 망치는 내가 챙긴다. 구멍 막는 건 대장장이 전문이야."
        - 브루노: "언제 가? 오늘? 지금? 아, 수업. …수업 끝나고 바로!"
        - 속마음: "(든든하다. 쥐 떼 상대로는 과한 전력이지만.)"
    - text: 리아나에게 도움을 청하기로 한다
      when: "affinity.liana >= 10"
      effects: ["cat.ally = 'liana'"]
      lines:
        - 속마음: "(쥐를 쫓는 데는 숲 사람의 지혜가 낫다.)"
        - "다음 날, 온실에서 리아나에게 이야기했다. 리아나가 물뿌리개를 든 채로 굳었다."
        - 리아나@놀람: "새끼 고양이? 몇 마리? 어미는? 다쳤어?"
        - 나: "귀가 찢어졌어. 많이 말랐고."
        - 리아나@슬픔: "…혼자서 얼마나 버텼을까."
        - "리아나가 물뿌리개를 내려놓았다. 그리고 선반에서 마른 풀 다발 두 개를 꺼냈다."
        - 리아나@진지: "나도 갈래. 쑥이랑 박하를 태우면 쥐들이 싫어해. 챙겨 갈게. 연기로 한쪽에 몰 수 있어."
        - 리아나: "숲에서는 그렇게 해. 죽이는 것보다 쫓는 게 먼저. 엄마가 그랬어."
    - text: 아렌에게 도움을 청하기로 한다
      when: "affinity.aren >= 10"
      effects: ["cat.ally = 'aren'"]
      lines:
        - 속마음: "(양치기 출신이다. 짐승 다루는 건 나보다 낫겠지.)"
        - "다음 날, 훈련장에서 아렌에게 이야기했다. 아렌의 눈이 반짝 빛났다."
        - 아렌@웃음: "쥐잡이? 양 우리 쥐잡이는 고향에서 내 담당이었어!"
        - 아렌: "겨울에 쥐가 사료 창고를 털면 양들이 굶거든. 쥐구멍 찾는 건 자신 있어."
        - "그러다 아렌이 자기 손바닥을 내려다봤다."
        - 아렌@당황: "…근데 성검으로 쥐 잡아도 되나? 성검이 삐지려나."
        - 나: "목검 가져와."
        - 아렌: "그게 낫겠다. 성검한테는 비밀로 하자."
    - text: 혼자 해치운다
      lines:
        - 속마음: "(쥐 떼 하나에 파티를 짤 필요는 없다.)"
        - 속마음: "(…튜토리얼 몹이잖아. 3,000시간 고인물이 쥐한테 지원군을 부르면 위키 동료들이 웃는다.)"
        - "어미 고양이를 내려다봤다. 고양이도 나를 올려다봤다."
        - 나: "내가 할게. 너는 새끼들 옆에 있어."
        - "고양이가 알아들은 것처럼 판자 틈으로 들어갔다."
        - "기숙사로 돌아오는 길, 목검을 어디 뒀더라 생각했다. 등불 기름도."
        - 속마음: "(혼자가 편하다. 원작에서도 솔로 플레이가 제일 손에 익었다.)"
        - 속마음: "(…솔로 루트의 엔딩이 어땠는지는, 지금은 생각하지 말자.)"

- id: cat_3
  title: 보트 창고 아래
  art: lake
  on: 산책
  window: { from: "1.3.2", to: "1.7" }
  when: "cat.step == 2 and time.month * 4 + time.week > cat.wk"
  lines:
    - "결전의 날."
    - "…이라고 하기엔 상대가 쥐다."
    - "해 질 녘의 보트 창고. 물비린내와 썩은 나무 냄새. 그리고 바닥 아래에서 올라오는, 바득바득 긁는 소리."
    - "어미 고양이가 판자 위에 앉아 기다리고 있었다. 내가 오자 일어서서 꼬리를 세운다."
    - "판자 틈으로 새끼들 울음이 새어 나온다. 지난번보다 더 가늘다. 오늘을 넘기면 늦을지도 모른다."
    - 속마음: "(3,000시간 고인물의 아카데미 첫 퀘스트 보스가 쥐 떼라니. 위키 편집자 동료들이 알면 웃겠다.)"
    - 속마음: "(웃으라지. 저 아래에서 새끼들이 울고 있다.)"
    - when: "cat.ally == 'bruno'"
      브루노: "배수구는 내가 판자로 막는다. 너는 안으로!"
    - when: "cat.ally == 'bruno'"
      브루노@웃음: "봐, 판자 세 장에 못 스무 개. 쥐 할아버지가 와도 못 뚫어."
    - when: "cat.ally == 'liana'"
      리아나: "연기 피울게. 쥐들이 구석으로 몰리면, 그때야."
    - when: "cat.ally == 'liana'"
      리아나@진지: "새끼들 있는 쪽으로는 연기 안 가게 할게. 바람은 내가 볼게."
    - when: "cat.ally == 'aren'"
      아렌: "성검은 두고 왔어. 목검이면 충분하겠지?"
    - when: "cat.ally == 'aren'"
      아렌@웃음: "고향에선 쥐 잡을 때 휘파람 불었어. 양들 놀라지 말라고. …여기선 안 불어도 되겠지?"
    - when: "not cat.ally"
      속마음: "(혼자다. 목검 한 자루, 등불 하나. 충분하다. …충분해야 한다.)"
    - when: "cat.plan"
      나레이션: "그날 밤 봐 둔 배수구부터 돌로 막았다. 도망칠 구멍도, 지원 올 구멍도 없다."
    - "등불을 판자 모서리에 걸었다. 기름은 가득 채워 왔다. 길어져도 꺼지지 않게."
    - "목검을 고쳐 쥐었다. 손바닥에 땀이 찬다. 쥐 상대인데도."
    - 속마음: "(떼로 덤비는 놈들은 패턴이 단순하다. 한구석에 몰려들었다가, 한꺼번에 덮친다.)"
    - 속마음: "(몰려드는 그 순간을 세게 쳐서 흩으면 된다.)"
    - "어미 고양이가 내 옆에 섰다. 귀를 뒤로 젖히고, 낮게 으르렁거린다."
    - 삽화: cellar
    - "판자를 들어 올렸다."
    - "빨간 눈이 일제히 이쪽을 향했다."
    - "수십 개의 눈. 수십 개의 이빨. 그리고 어둠 저편, 상자 위에서 가늘게 우는 소리."
  battle:
    enemy: rats
    ally: "cat.ally"
    win:
      lines:
        - "마지막 쥐가 비명을 지르며 어둠 속으로 흩어졌다."
        - "저장고가 조용해졌다. 내 숨소리와, 등불 심지 타는 소리뿐."
        - "목검을 쥔 손이 덜덜 떨린다. 손등은 할퀸 자국투성이다. 그래도 서 있다."
        - "어미 고양이가 먼저 움직였다. 상자 위로 뛰어올라, 어둠 속으로 고개를 들이밀었다."
        - "그리고 새끼들을 한 마리씩 물고 나왔다."
        - "내 발 앞에 나란히 내려놓는다. 하나. 둘. 셋. 넷."
        - "눈도 제대로 못 뜬 새끼들이 서로의 몸 위로 기어오르며 미우미우 운다. 넷 다 살아 있다."
        - "어미가 마지막으로 내 손등을 핥았다. 상처 난 자리만 골라서."
        - "까끌까끌하다. 따끔하다. 그리고 따뜻하다."
        - 속마음: "(보상: 없음. …위키에 그렇게 적을 사람은, 이 퀘스트를 안 해 본 사람이다.)"
      effects: ["cat.step = 3", "cat.friend = 1", "stress -= 10"]
      branch:
        - when: "cat.ally == 'bruno'"
          lines:
            - "배수구 쪽에서 브루노가 판자를 밀고 기어 나왔다. 머리에 거미줄이 잔뜩이다."
            - 브루노@웃음: "봤냐? 넷 다 살았어! 하나도 안 빠져나갔어, 내 판자 덕분에!"
            - "브루노가 새끼 하나를 손바닥에 올렸다. 그 큰 손바닥 위에서 새끼가 콩알만 하다."
            - 브루노: "이름은 내가 지을래. 망치, 모루, 집게, 풀무!"
            - 나: "…전부 대장간 도구잖아."
            - 브루노@진지: "대장간 도구가 제일 튼튼한 이름이야. 오래 살라고."
          effects: ["affinity.bruno += 5"]
        - when: "cat.ally == 'liana'"
          lines:
            - "연기가 걷힌 저장고 입구에서 리아나가 쑥 다발을 내려놓았다. 눈가가 연기로 빨갛다."
            - 리아나@놀람: "넷…? 넷 다야?"
            - "리아나가 무릎을 꿇고 새끼들을 내려다봤다. 손을 뻗었다가, 어미의 눈치를 보고 거뒀다."
            - 리아나@웃음: "넷 다 무사해. 다행이다. 정말 다행이야."
            - 리아나: "엄마가 그랬어. 작은 생명 하나 지키는 손이, 큰 것도 지킨대."
            - "리아나가 내 손등의 할퀸 자국을 보고, 주머니에서 연고를 꺼냈다. 온실 냄새가 나는 연고였다."
          effects: ["affinity.liana += 5"]
        - when: "cat.ally == 'aren'"
          lines:
            - "아렌이 목검을 어깨에 걸치고 숨을 몰아쉬었다. 이마에 땀이 번들거린다."
            - 아렌: "후아. 양 우리보다 많았어. 훨씬."
            - "아렌이 쪼그려 앉아 새끼들을 셌다. 손가락으로. 하나, 둘, 셋, 넷."
            - 아렌@웃음: "고향 생각난다. 봄마다 새끼 양이 태어나면 이렇게 셌거든."
            - 아렌: "…나, 용사보다 이런 게 더 잘 맞는 것 같아."
            - 속마음: "(그 말을 성검이 듣지 않았으면 좋겠다. …아니, 들었으면 좋겠다.)"
          effects: ["affinity.aren += 5"]
        - lines:
            - "혼자서 해냈다."
            - "손등은 엉망이지만, 넷 다 살았다."
            - "판자 위에 털썩 주저앉았다. 새끼 하나가 비틀비틀 기어와 내 신발 끈을 물었다."
            - 속마음: "(솔로 클리어. …생각보다 외롭지 않다. 고양이가 다섯이나 있으니까.)"
      next: cat_3_kittens
    lose:
      lines:
        - "쥐 떼가 한 덩어리가 되어 덮쳐 왔다."
        - "목검을 휘둘렀다. 하나를 쳐 내면 셋이 기어오른다. 발목, 종아리, 손등."
        - "등불이 굴러떨어져 꺼졌다. 어둠 속에 이빨 소리만 가득하다."
        - "정신을 차려 보니 판자 위로 굴러 나와 있었다. 손등이 엉망이다. 바짓단은 너덜너덜하다."
        - 속마음: "(졌다. 쥐한테. 3,000시간 고인물이.)"
        - "그때 어미 고양이가 혼자서 저장고로 뛰어들었다."
        - "말릴 틈도 없었다. 털을 곤두세우고, 찢어진 귀를 뒤로 젖히고, 어둠 속으로."
        - "저장고 안에서 비명과 울음과 긁는 소리가 뒤엉켰다."
        - "판자 위에 엎드려 그 소리를 들었다. 아무것도 할 수 없었다."
        - "새벽이 되어서야 소리가 그쳤다."
        - "어미는 상처투성이로 기어 나왔다. 한쪽 다리를 절며. 입에 새끼를 물고."
        - "한 마리 내려놓고, 다시 들어가고. 또 한 마리. 하나, 둘, 셋, 넷."
        - "넷을 다 꺼내 놓고서야, 어미가 그 옆에 쓰러지듯 누웠다. 새끼들이 어미 배로 파고들었다."
        - "어미가 한참 뒤에야 고개를 들어 나를 봤다. 원망하는 눈이 아니었다. 그래서 더 아팠다."
        - "손수건을 찢어 어미의 다리를 감쌌다. 어미는 가만히 있었다."
        - 속마음: "(…고양이 혼자서도 해냈다. 나는 시간을 벌었을 뿐이다.)"
        - 속마음: "(그거면 됐나. …됐다고 하자. 넷 다 살았으니까.)"
      effects: ["cat.step = 3", "cat.friend = 1", "stress += 5"]

- id: cat_3_kittens
  title: 네 마리
  art: cg_kittens
  lines:
    - "새끼들이 어미 배에 파고들어 젖을 찾는다. 넷이 엉켜 꼬물거린다."
    - "등불을 다시 켜고 보니, 넷 다 어미를 닮아 얼룩덜룩하다. 얼룩 무늬가 조금씩 다를 뿐."
    - "그런데 그중 한 마리가, 젖 대신 내 바짓단을 물고 놓지 않는다."
    - "제일 작은 녀석이다. 이빨도 안 난 입으로 바짓단을 꽉 물고, 네 다리로 버틴다."
    - "살살 떼어 놓았다. 다시 기어 와서 물었다. 떼어 놓았다. 또 물었다."
    - "어미는 그걸 보고도 말리지 않는다."
    - "어미가 나를 한 번, 새끼를 한 번 보고는 천천히 눈을 감았다."
    - "고양이가 눈을 천천히 감는 건 믿는다는 뜻이라고, 어디선가 들었다."
    - 속마음: "(맡긴다는 뜻 같았다. …고양이 말은 모르지만, 그렇게 보였다.)"
    - 속마음: "(어디에 둬야 이 녀석이 안전할까.)"
  choices:
    - text: 기숙사에 몰래 데려간다
      effects: ["cat.kitten = 'dorm'"]
      lines:
        - "새끼를 들어 올렸다. 손바닥에 쏙 들어온다. 따뜻하고, 심장이 엄청 빨리 뛴다."
        - "주머니에 넣었다. 주머니에 쏙 들어가는 크기다. 머리만 빼꼼 내민다."
        - 속마음: "(기숙사 규칙, 동물 반입 금지. 사감 선배한테 들키면 끝이다.)"
        - 속마음: "(…그래도.)"
        - "어미에게 고개를 숙였다. 어미가 한 번 더 눈을 천천히 감았다."
        - "돌아오는 길, 주머니 속에서 작은 몸이 꼼지락거렸다. 그러다 잠들었다. 주머니가 따뜻해졌다."
        - when: "origin != '악역도련님' and origin != '몰락귀족'"
          브루노@놀람: "…야. 네 주머니가 울었어. 방금 '미우' 했어."
        - when: "origin != '악역도련님' and origin != '몰락귀족'"
          브루노@웃음: "…사감한테는 비밀이다. 내 이불 반 줄게. 나 원래 반만 써."
        - when: "origin == '악역도련님'"
          나레이션: "문 앞의 하인이 내 주머니를 보고 눈을 크게 떴다. 그리고 못 본 척, 다음 날 아침 우유 한 접시를 가져왔다."
        - when: "origin == '몰락귀족'"
          나레이션: "귀족 동 맨 끝 방. 조용하던 방에 작은 숨소리가 하나 늘었다."
    - text: 핀에게 맡긴다 (청소부 창고는 따뜻하다)
      when: "met.finn or affinity.finn > 0"
      effects: ["cat.kitten = 'finn'", "affinity.finn += 3"]
      lines:
        - "다음 날 아침, 새끼를 품에 안고 청소부 창고를 찾았다. 별관 뒤편, 보일러실 옆 작은 문."
        - "핀이 빗자루를 든 채 문을 열었다. 내 품 안의 것을 보고, 눈이 동그래졌다."
        - 핀@놀람: "…고, 고양이요?"
        - 나: "보트 창고에서 구했어. 기숙사는 들키면 끝이라서. 네가 맡아 줄 수 있어?"
        - 핀@당황: "…저요? 저, 저 같은 게 키워도 돼요?"
        - "핀이 손을 내밀었다가, 거뒀다가, 다시 내밀었다. 새끼가 핀의 손가락 냄새를 맡더니, 그 손바닥 위로 기어갔다."
        - 핀@웃음: "…창고 보일러 옆이 따뜻해요. 쥐도 잡아 주겠네요. 서로 좋네요."
        - when: "finn.letters < 2"
          핀: "이름은… 저 글자 모르는데. 이름 지어도 쓸 줄 모르는데."
        - when: "finn.letters >= 2"
          핀: "이름은… 제가 쓸 수 있는 글자로 지을게요. 아직 몇 개 몰라서, 짧은 이름이 되겠지만."
        - "핀이 새끼를 품에 안고 한참 서 있었다. 빗자루를 쥐던 손이, 이번엔 아주 조심스럽게 무언가를 쥐고 있었다."
    - text: 어미 곁에 둔다
      effects: ["cat.kitten = 'lake'"]
      lines:
        - "새끼를 살며시 바짓단에서 떼어, 어미 곁에 내려놓았다."
        - 나: "네 엄마 곁이 제일 안전해."
        - "새끼가 미우 울었다. 어미가 그 새끼의 머리를 핥았다. 한 번, 두 번."
        - "어미가 일어섰다. 새끼들이 그 뒤를 비틀비틀 따른다."
        - "다섯 마리가 줄지어 갈대숲으로 사라졌다."
        - "사라지기 직전, 어미가 한 번 돌아봤다. 바짓단을 물던 녀석도 돌아봤다."
        - 속마음: "(호숫가에 오면 또 만나겠지. 이 세계에서 나를 기억해 줄 고양이가 다섯.)"
        - "갈대가 바람에 사각거렸다. 쥐 긁는 소리가 아닌, 그냥 갈대 소리."

# ================================================================ 사이드 퀘스트 ⑤ 신문부의 사라진 기사

- id: news_case_1
  title: 사라진 원고
  on: 신문부
  pool: true
  window: { from: "1.4.3", to: "1.7.1" }
  lines:
    - "방과후 신문부 동아리방. 문을 열자마자 종이 더미가 발밑으로 쏟아졌다."
    - "부장이 서랍을 통째로 뽑아 바닥에 엎어 놓고 있다. 안경은 머리 위에 올라가 있다. 본인은 모르는 것 같다."
    - 부장@화남: "없어. 없다고!"
    - 나: "…뭐가요?"
    - 부장: "이번 호 1면! '1학년 무투대회 우승 후보 완전 분석'! 원고가 통째로 사라졌어!"
    - 부장: "한 달 동안 훈련장 구석에 숨어서 모은 거야. 누가 몇 시에 나오는지, 어느 발을 먼저 딛는지, 누가 왼손잡이인지."
    - 부장@슬픔: "매점 앞에 줄 설 기사였다고…"
    - 부장: "어젯밤에 분명히 이 서랍에 넣고 잠갔어. 열쇠는 내 목에 걸려 있고. 봐!"
    - "부장이 목에 건 열쇠를 흔들었다. 자물쇠를 살펴보니 멀쩡하다. 긁힌 자국도 없다."
    - 부장@진지: "자물쇠는 멀쩡하고 원고만 사라졌어. 이건 밀실 사건이야!"
    - 부장: "범인은 이 안에 있다! …라고 하고 싶은데, 어젯밤 동아리방엔 아무도 없었어."
    - 속마음: "(원작엔 신문부 서브 퀘스트 같은 건 없었다. …아니, 있었는데 보상이 쓰레기라 아무도 안 했던가.)"
    - 속마음: "(위키 '신문부' 항목은 세 줄이었다. 내가 썼다. 성의 없게.)"
    - 부장: "신입! 너 눈 좋지? 현장 좀 봐 봐. 기자의 눈으로!"
    - "동아리방을 둘러봤다. 책상 셋, 인쇄용 활자 상자, 벽에 붙은 오래된 1면들. 그리고 창문 하나."
    - "창밖으로 훈련장이 내려다보인다. 해 질 녘이면 목검 부딪는 소리가 여기까지 올라온다."
    - 부장: "어서! 단서가 식기 전에!"
  check: { label: 현장 조사, value: "stat.지성 + 10 * talent.직감 + luck", dc: 26 }
  success:
    lines:
      - "자물쇠가 멀쩡하다면, 범인은 자물쇠로 들어오지 않았다."
      - "창문으로 갔다. 걸쇠가 걸려 있다. 그런데 걸쇠 고리가 안쪽에서 살짝 들려 있다. 밖에서 얇은 걸 넣어 들어 올린 자국."
      - "창틀을 손끝으로 훑었다. 무언가가 걸렸다."
      - "금실 한 올. 손가락 길이만 하다. 교복 장식 실보다 훨씬 굵고 반짝인다."
      - "코를 가까이 댔다. 희미한 냄새."
      - "검에 바르는 기름 냄새다. 훈련장에서 매일 맡는 냄새. 그중에서도 비싼 쪽."
      - 부장@놀람: "…너 지금 냄새 맡은 거야? 개야? 아니, 칭찬이야. 기자는 개 코가 필요해!"
      - 속마음: "(금실, 비싼 검 기름. 범인은 돈 많은 검사다. 그리고 창문으로 드나들 만큼 몸이 가볍다.)"
      - 부장: "증거물이다. 봉투에 넣어! 날짜 적고!"
    effects: ["news.case = 1", "news.wk = time.month * 4 + time.week", "news.clue = 1"]
  fail:
    lines:
      - "책상 밑을 봤다. 먼지 뭉치."
      - "서랍 뒤를 봤다. 깨진 펜촉 두 개, 지난 학기 영수증."
      - "휴지통까지 뒤졌다. 구겨진 초고들 사이에서 무언가 바스락거렸다."
      - "꺼내 보니 과자 봉지다. 반쯤 남은 꿀 과자."
      - 부장@당황: "그건 증거물 아니야. 내려놔."
      - 나: "…부장님 거예요?"
      - 부장: "기자의 비상식량이야. 내려놔. 천천히."
      - "결국 아무것도 찾지 못했다. 창밖에서 저녁 종이 울렸다."
      - 속마음: "(밀실은 무슨. 그냥 어디 흘린 거 아냐?)"
    effects: ["news.case = 1", "news.wk = time.month * 4 + time.week"]

- id: news_case_2
  title: K의 쪽지
  on: 신문부
  window: { from: "1.4.3", to: "1.7.1" }
  when: "news.case == 1 and time.month * 4 + time.week > news.wk"
  lines:
    - "며칠 뒤. 동아리방 문은 잠겨 있었다. 부장이 맡겨 둔 열쇠로 열었다."
    - "아무도 없다. 오후 햇살이 활자 상자 위에 비스듬히 누워 있다."
    - "그런데 부장 책상 위에, 어제는 없던 것이 있다."
    - "쪽지 한 장. 잉크병이 문진처럼 반듯하게 눌러 놓았다."
    - "반듯하고 각진 필체. 획 하나하나가 칼로 그은 것처럼 곧다."
    - "종이가 비싸다. 손끝에 결이 느껴진다. 귀족 동 문구점에서나 파는 물건이다."
    - "── 그 기사는 나가지 않는다."
    - "── 원고는 태웠다."
    - "── 사과는 하지 않겠다. ─K"
    - "문이 벌컥 열렸다. 부장이 숨을 몰아쉬며 들어오더니, 내 손의 쪽지를 낚아챘다."
    - "읽는 동안 부장의 얼굴이 붉어졌다가, 하얘졌다가, 다시 붉어졌다."
    - 부장@화남: "K? 요즘 누가 이니셜로 서명을 해! 소설이야? 이건 언론 탄압이야, 탄압!"
    - 부장: "태웠대. 태웠다잖아! 내 한 달!"
    - 부장@슬픔: "하필 원고 3쪽이 제일 비싼 정보였는데. '카이든 황자, 왼쪽 어깨 부상설'."
    - 부장: "훈련 끝나고 혼자 어깨 주무르는 걸 두 번이나 봤다고. 내 기자 인생 최고의 특종이었어."
    - 나레이션:
        - "무투대회 우승 후보 분석. 어깨 부상설. 그리고 K."
        - { when: "news.clue", text: "금실, 검 기름, 귀족 종이, 어깨 부상설. 그리고 K. 1학년 우승 후보 중에 이니셜이 K인 사람은 한 명뿐이다." }
    - 속마음: "(…이유는 그거 하나뿐이다.)"
    - 속마음: "(황족에게 약점은 소문으로 끝나지 않는다. 원작의 카이든이 어떤 끝을 맞았는지 생각하면.)"
    - 부장: "신입. 너 표정이 뭔가 아는 표정인데."
  choices:
    - text: "\"범인한테 직접 물어볼게요\""
      effects: ["news.case = 2"]
      lines:
        - 나: "범인한테 직접 물어볼게요."
        - 부장@놀람: "범인을 안다고? 누군데?"
        - 나: "……."
        - 부장: "…말 안 해? 취재원 보호?"
        - "부장이 나를 위아래로 훑어보더니, 갑자기 씩 웃었다."
        - 부장@웃음: "기자 정신 좋네. 좋아. 특종 물어 와! 대신 1면은 내 거다."
        - "부장이 쪽지를 증거물 봉투에 넣어 내게 내밀었다."
        - 속마음: "(…해 질 녘 훈련장. 거기라면 혼자 있을 거다.)"
    - text: "\"덮죠. 이 기사는 안 나가는 게 낫겠어요\""
      effects: ["news.case = 3", "stress -= 3"]
      lines:
        - 나: "덮죠. 이 기사는 안 나가는 게 낫겠어요."
        - 부장@놀람: "…너까지?"
        - 나: "범인이 누구든, 이렇게까지 하는 데는 이유가 있을 거예요. 어깨 이야기는 누군가한테 칼이 될 수도 있어요."
        - "부장이 한참 쪽지를 내려다봤다. 그러다 길게 한숨을 쉬었다."
        - 부장: "하아. …기자로서는 분한데, 사람으로서는 할 말이 없네."
        - 부장: "알았어. 이번 호 1면은 '식당 스튜 감자 함량 조사'로 간다."
        - 부장@웃음: "이것도 특종이야. 감자가 지난 학기보다 두 조각 줄었거든. 학생들의 분노를 대변한다!"
        - 속마음: "(누군가에겐 활자 하나가 칼이 된다. 원작의 카이든은 그 칼에 여러 번 찔렸다.)"
        - "쪽지는 부장 몰래 접어서 주머니에 넣었다. 언젠가 돌려줄 일이 있을 것 같아서."

- id: news_case_3
  title: K의 사정
  art: training_ground
  on: [훈련장, 검술부]
  window: { from: "1.4.3", to: "1.7.1" }
  when: "news.case == 2"
  effects: ["news.case = 3", "know.kaiden_shoulder = 1"]
  lines:
    - "해 질 녘의 훈련장. 다들 돌아가고 허수아비들만 긴 그림자를 끌고 서 있다."
    - "모래 바닥에 발자국이 어지럽다. 그중 한 줄이 훈련장 맨 구석, 무기 거치대 옆으로 이어진다."
    - "카이든이 혼자 검을 닦고 있다."
    - "천에 기름을 묻혀, 칼날을 따라 길게. 한 번. 또 한 번. 서두르지 않는 손."
    - "바람을 타고 냄새가 왔다. 검 기름 냄새. 동아리방 창틀의 그 냄새."
    - "소매 끝에 금실 장식. 한 올이 풀려 있다."
    - 속마음: "(증거가 이렇게 친절해도 되나.)"
    - "카이든은 내가 다가오는 걸 알고도 고개를 들지 않았다."
    - 나: "신문부 원고. 네가 가져갔지."
    - "천이 멈췄다. 카이든이 천천히 고개를 들었다."
    - 카이든@진지: "가져간 게 아니라 회수했다. 내 이야기였으니까."
    - when: "origin == '악역도련님'"
      카이든: "벨모어가 신문부 심부름이라니. 세상 많이 변했군."
    - 나: "창문 걸쇠, 금실, 검 기름. 그리고 K."
    - 카이든: "…서명은 실수였다. 사과는 하지 않겠다고 써 놓고 이름까지 숨기면, 비겁해 보여서."
    - 속마음: "(그래서 이니셜은 썼다. 정직한 건지, 서툰 건지.)"
    - 카이든: "왼쪽 어깨."
    - "카이든이 검을 거치대에 세웠다. 오른손이 왼쪽 어깨 쪽으로 가려다, 허공에서 멈췄다."
    - 카이든@화남: "그 기사가 나가면 무투대회에서 모두가 그쪽만 노린다. 1학년 전원이."
    - 카이든: "그건 상관없다. 노려도 이긴다."
    - 카이든@진지: "문제는 형님들 귀에도 들어간다는 거다. 황궁은 아카데미 신문도 읽는다. 한 줄도 빼놓지 않고."
    - 카이든: "황궁에서 약점은 소문이 아니다. 칼이지."
    - "목소리는 낮았다. 화가 난 목소리가 아니라, 오래 생각해 온 사람의 목소리."
    - when: "kaiden.secret"
      속마음: "(이미 비밀을 지키겠다고 약속했었다. 그 약속이 활자로 깨질 뻔한 셈이다.)"
    - 속마음: "(원작의 카이든은 결국 반역자 누명을 쓰고 처형된다. 누명이란 건, 늘 소문 한 줄에서 시작한다.)"
    - 카이든: "…그래서. 신문부 심부름꾼은 뭘 하러 왔지. 원고를 돌려 달라고? 이미 재다."
    - 속마음: "(어떻게 할까. 이 황자에게, 그리고 부장에게.)"
  choices:
    - text: 기사를 묻겠다고 약속한다
      effects: ["news.case_end = 'buried'", "trust.kaiden += 8", "affinity.kaiden += 4"]
      lines:
        - 나: "기사는 묻을게. 부장한테는 원고가 영영 사라졌다고만 할게."
        - 카이든@놀람: "……."
        - "카이든이 처음으로 나를 똑바로 봤다. 무언가를 재는 눈이다."
        - 카이든: "대가는."
        - 나: "없어."
        - 카이든: "황궁에서 대가 없는 호의는 제일 비싼 거다."
        - 나: "여긴 아카데미야."
        - "카이든이 짧게 숨을 내쉬었다. 웃음인지 한숨인지 모를 소리."
        - 카이든@진지: "…빚을 졌군."
        - 카이든: "황족은 빚을 잊지 않는다. 좋은 쪽으로도, 나쁜 쪽으로도."
        - "카이든이 다시 천을 들어 검을 닦기 시작했다. 대화는 끝났다는 뜻이다. 그런데 손이 아까보다 느리다."
        - "부장에게는 원고가 영영 사라졌다고만 전했다."
        - "부장은 일주일 내내 '밀실의 K'를 저주했다. 동아리방 문에 'K를 찾습니다' 벽보까지 붙였다."
        - 속마음: "(미안해요, 부장님. 그 K는 앞으로도 영영 못 찾을 거예요.)"
    - text: 어깨 이야기는 빼고 다시 쓰자고 제안한다
      requires: "stat.매력 >= 16"
      effects: ["news.case_end = 'rewritten'", "affinity.kaiden += 5", "trust.kaiden += 5", "reputation += 3"]
      lines:
        - 나: "어깨 이야기는 빼고, 기사를 다시 쓰자."
        - 카이든: "어깨를 빼면 쓸 게 없을 텐데. 부장이 노린 건 그거 하나였다."
        - 나: "있어. 더 좋은 거."
        - 카이든: "…뭐지."
        - 나: "새벽마다 혼자 남아서 같은 동작을 수백 번 하는 황자."
        - 나: "다들 재능이라고 하잖아. 황족이라 처음부터 잘하는 거라고. 그게 아니라는 걸 쓰는 거지."
        - "카이든의 손에서 천이 툭 떨어졌다."
        - 카이든@당황: "그, 그건 쓰지 마라."
        - 나: "왜? 사실인데."
        - 카이든@당황: "사실이니까 쓰지 말라는 거다. …그런 걸 누가 읽어."
        - 나: "1학년 전원. 그리고 황궁도."
        - "카이든이 입을 다물었다. 반박할 말을 찾는 얼굴. 끝내 찾지 못했다."
        - "기사는 실렸다. 제목은 '새벽 다섯 시의 훈련장'."
        - "그 주 내내 카이든은 신문부 동아리방 앞을 멀리 돌아서 다녔다. 귀가 조금 빨갰다."
        - "매점 앞에서 신문을 읽던 1학년들이, 카이든이 지나가면 조용해졌다. 비웃는 조용함이 아니었다."
        - 속마음: "(활자는 칼이 될 수도 있지만, 갑옷이 될 수도 있다.)"
    - text: "\"기사는 나가. 그게 신문이야\""
      effects: ["news.case_end = 'published'", "reputation += 5", "intel += 1", "affinity.kaiden -= 3", "trust.kaiden += 3"]
      lines:
        - 나: "기사는 나가. 그게 신문이야."
        - "카이든이 한참 나를 노려봤다. 해가 그의 등 뒤로 넘어간다. 얼굴이 그늘에 잠긴다."
        - 카이든@화남: "원고는 태웠다고 했을 텐데."
        - 나: "부장은 다 외우고 있어. 기자는 그런 사람들이야."
        - "긴 침묵. 허수아비의 그림자가 우리 사이를 가로질렀다."
        - "카이든이 검을 칼집에 넣었다. 철컥. 소리가 크게 울렸다."
        - 카이든@진지: "…좋다."
        - 카이든: "대신 무투대회에서, 그 기사가 틀렸다는 걸 증명해 주지. 1학년 전원 앞에서."
        - "카이든은 등을 돌려 훈련장을 나갔다. 걸음에 흔들림이 없었다."
        - "기사는 1면에 실렸다. '카이든 황자, 왼쪽 어깨 부상설'."
        - "식당 곳곳에서 어깨 이야기가 들렸다. 누군가는 그쪽을 노리겠다고 떠들었다."
        - "카이든은 남들 앞에서 단 한 번도 어깨를 감싸지 않았다. 단 한 번도."
        - 속마음: "(진실을 쓰는 게 신문이다. 그게 맞다. …그런데 왜 이렇게 씁쓸하지.)"

# ================================================================ 일상 만남

- id: amb_canteen_mirabel
  title: 가장 싼 메뉴
  on: 식당
  pool: true
  window: { from: "1.4", to: "1.7" }
  when: "fired.mirabel_clash or affinity.mirabel >= 5"
  lines:
    - "점심시간의 식당. 수저 소리, 웃음소리, 누군가 쟁반을 엎는 소리."
    - "그 소란에서 한 발짝 떨어진 구석 창가에, 미라벨이 혼자 앉아 있다."
    - "쟁반 위엔 보리빵 한 조각과 맑은 수프. 식당에서 제일 싼 메뉴다."
    - "그런데 수프를 뜨는 손놀림만은 황궁 만찬처럼 반듯하다. 등은 꼿꼿하고, 팔꿈치는 식탁에 닿지 않는다."
    - "숟가락이 그릇에 한 번도 닿지 않는다. 소리 하나 없이."
    - 속마음: "(몰락한 아델하이트가. 그 몰락의 이유는 원작에서도 한참 뒤에야 나온다. 지금 저 애에게 남은 건, 예법뿐이다.)"
    - "시선을 느꼈는지, 미라벨이 숟가락을 내려놓고 이쪽을 봤다. 눈썹이 한쪽만 올라간다."
    - 미라벨@화남:
        - "뭘 봐. 검소함은 귀족의 미덕이야. 너희는 모르겠지만."
        - { when: "origin == '몰락귀족'", text: "…뭘 봐. 너도 오늘 그 메뉴잖아. 같은 처지끼리 쳐다보지 말자." }
        - { when: "origin == '악역도련님'", text: "벨모어. 네 쟁반엔 접시가 일곱 개네. 보기만 해도 체하겠어." }
    - "말투는 날카로운데, 쟁반을 팔로 슬쩍 가리는 게 보였다."
  choices:
    - text: 디저트를 슬쩍 밀어 준다
      effects: ["affinity.mirabel += 4", "trust.mirabel += 2"]
      lines:
        - "내 쟁반의 사과 파이를 미라벨 쪽으로 슬쩍 밀었다. 말없이."
        - 미라벨@화남: "…뭐야, 이거."
        - 나: "배불러서."
        - 미라벨: "필요 없어. 동정은 사양이야. 아델하이트는 남의 접시에 손대지 않아."
        - "미라벨은 끝까지 디저트 쪽을 보지 않았다. 고개를 창 쪽으로 돌리고 수프만 떴다."
        - "나는 내 식사를 마저 하고 일어섰다."
        - "일어서면서 힐끗 봤다. 접시는 비어 있었다. 부스러기 하나 없이."
        - 미라벨@당황: "…보지 마. 버리면 아까우니까 먹은 거야. 그뿐이야."
        - 속마음: "(귀 끝이 빨갛다. 칭찬에 약한 줄은 알았는데, 친절에도 약하다.)"
    - text: 맞은편에 앉아 술식 이야기를 꺼낸다
      requires: "stat.지성 >= 18"
      effects: ["affinity.mirabel += 3", "trust.mirabel += 4", "stat.지성 += 0.5"]
      lines:
        - "쟁반을 들고 미라벨 맞은편에 앉았다. 미라벨의 눈이 가늘어졌다."
        - 미라벨: "누가 앉으래."
        - 나: "오늘 마법학 과제. 삼중 순환 술식, 두 번째 고리에서 막혔어."
        - "미라벨의 숟가락이 멈췄다. 눈빛이 바뀌었다. 먹잇감을 본 매의 눈."
        - 미라벨@진지: "…그 술식은 그렇게 푸는 게 아니야. 봐."
        - "미라벨이 빵 부스러기를 집어 식탁 위에 마법진을 그리기 시작했다."
        - 미라벨: "두 번째 고리는 첫 번째의 역순이야. 다들 정순으로 그리니까 막히는 거지. 교과서 그림이 틀렸어."
        - 미라벨: "여기서 마력을 꺾고, 여기서 다시 감아. 실을 꼬듯이. 알겠어?"
        - "설명은 길었다. 빵 부스러기가 모자라 내 빵까지 뜯어 갔다. 수프가 식는 줄도 몰랐다."
        - 속마음: "(원작 공략 게시판에서도 미라벨의 술식 해설은 늘 정답이었다. 다들 '미라벨 쌤'이라고 불렀다.)"
        - when: "trust.mirabel >= 15"
          나레이션: "한참 뒤 미라벨이 중얼거렸다. \"…우리 집 식탁에서도 아버지랑 이렇게 했었어.\""
        - "종이 울렸다. 미라벨이 식은 수프를 내려다보고, 아차 하는 얼굴을 했다."
        - 미라벨@당황: "…너 때문에 식었잖아. 다음엔 밥 다 먹고 물어."
        - 속마음: "(다음엔, 이라고 했다.)"
    - text: 못 본 척 지나간다
      effects: ["trust.mirabel += 1"]
      lines:
        - "시선을 거두고, 쟁반을 들고 반대편 자리로 갔다."
        - "등 뒤에서 아무 소리도 나지 않는다. 미라벨이 내가 멀어지는 걸 지켜보는 기척만."
        - "자리에 앉아 스튜를 떴다. 식당의 소란이 다시 귀에 들어온다."
        - "그 소란 사이로, 등 뒤에서 숟가락이 그릇에 닿는 소리가 아주 작게 들렸다."
        - "달그락."
        - "처음이었다. 저 애가 소리를 내며 먹는 건."
        - 속마음: "(못 본 척해 주는 것도 예의다. 저 애한테는 특히.)"
        - 속마음: "(아무도 안 볼 때만, 저 애는 조금 편하게 먹는다.)"

- id: amb_train_edric
  title: 혼자 남은 도련님
  on: 훈련장
  pool: true
  repeat: 2
  cooldown: 3
  when: "origin != '악역도련님' and (fate.edric == 'saved' or fate.edric == 'saved_by_teacher')"
  branch:
    - when: "fired.amb_train_edric >= 2"
      lines:
        - "해 질 녘 훈련장. 오늘도 구석에 에드릭이 있다."
        - "그런데 뭔가 다르다. 처음엔 몰랐다. 몇 번 휘두르는 걸 보고서야 알았다."
        - "자세가 다르다. 발부터 움직인다. 검이 아니라 발이 먼저."
        - "땀에 젖은 앞머리가 이마에 달라붙어 있다. 셔츠 소매는 걷어 올렸고, 손바닥엔 물집이 잡혀 있다."
        - 속마음: "(벨모어가 도련님 손에 물집. 원작 일러스트에선 반지만 잔뜩 끼고 있던 손이다.)"
        - "에드릭이 숨을 들이켰다. 한 발 내딛고, 허리를 틀고—"
        - "허수아비 목이 깔끔하게 날아갔다."
        - "짚이 사방으로 흩어졌다. 에드릭이 자기 손을 한참 내려다본다."
        - 에드릭@놀람: "……."
        - 에드릭@웃음: "됐다. 됐어! 내가, 내 손으로!"
        - "에드릭이 목검을 하늘로 치켜들었다. 그러다 나와 눈이 마주쳤다. 목검이 천천히 내려왔다."
        - 에드릭@당황: "…봤냐?"
        - 나: "봤어."
        - 에드릭: "아니, 못 본 걸로 해. 벨모어가 체면이 있지. 허수아비 하나에 소리나 지르고."
        - 에드릭: "고맙다는 말은 안 한다."
        - 에드릭: "대신 저녁 산다. 귀족 테이블 말고, 아무 데서나. 네가 먹는 거."
        - "에드릭이 날아간 허수아비 목을 주워, 제자리에 올려놓으며 중얼거렸다."
        - 에드릭: "…패거리 놈들한테 자랑할 데도 없네. 너한테 하는 수밖에."
        - 속마음: "(원작의 에드릭은 5월의 미궁에서 끝났다. 이 에드릭은 지금, 허수아비 목을 고쳐 달고 있다.)"
      effects: ["affinity.edric += 5", "trust.edric += 3", "stat.근력 += 0.5"]
    - lines:
        - "해 질 녘 훈련장. 다들 저녁 먹으러 가서 텅 비었다."
        - "구석에서 목검 소리가 난다. 퍽. 퍽. 허수아비를 치는 소리치고는 힘이 없다."
        - "에드릭이다. 허수아비를 상대로 목검을 휘두르고 있다. 혼자서."
        - "시중드는 하인도, 졸졸 따라다니던 패거리도 없이."
        - "보기에만 화려한 귀족 검술. 손목을 꺾고, 칼끝을 돌리고, 망토 자락까지 계산한 동작."
        - "허수아비는 멀쩡하고 에드릭만 숨이 차다."
        - 속마음: "(벨모어가 가문 검술. 위키엔 '보여 주기용, 실전성 없음'이라고 적혀 있었다.)"
        - "에드릭이 나를 발견했다. 목검이 허공에서 멈췄다."
        - 에드릭@당황: "…뭘 봐. 가르쳐 달라는 거 아니다."
        - 에드릭: "미궁에서 그 꼴을 당하고 나니까 말이야."
        - 에드릭@슬픔: "패거리 놈들, 병문안 온 놈이 하나도 없더라. 의무실에 사흘 누워 있었는데."
        - "에드릭이 목검을 다시 들었다. 이번엔 아까보다 세게 휘둘렀다. 허수아비는 여전히 멀쩡했다."
      choices:
        - text: 발 위치부터 고쳐 준다
          check: { label: 가르치기, value: "stat.근력 / 2 + stat.지성 / 2 + stat.매력 / 2 + luck", dc: 24 }
          success:
            lines:
              - 나: "검 말고 발. 오른발이 너무 앞에 있어. 반 뼘만 뒤로."
              - 에드릭@화남: "발? 검이 아니라 발이라고? …웃기네."
              - "투덜거리면서도, 에드릭이 발을 반 뼘 뒤로 뺐다."
              - 나: "그리고 무릎. 조금 굽혀. 망토는 잊어. 지금 망토 없잖아."
              - 에드릭: "…해 보지 뭐."
              - "한 번. 허수아비가 흔들렸다. 두 번. 짚이 튀었다."
              - "세 번째 휘두름에서 허수아비 어깨가 움푹 들어갔다."
              - "에드릭이 입을 다물었다. 움푹 들어간 자리를 한참 봤다."
              - 에드릭: "……한 번 더 봐 줘. 아니, 봐 달라는 건 아니고. 그냥 거기 서 있어."
            effects: ["affinity.edric += 5", "stat.민첩 += 0.5"]
          fail:
            lines:
              - 나: "검 말고 발. 오른발이 너무 앞에—"
              - 에드릭@화남: "됐어! 네가 뭔데 가르쳐!"
              - "에드릭이 목검을 바닥에 내리꽂았다. 모래가 튀었다."
              - 에드릭: "벨모어가 검술을 누가 가르쳐. 됐다고."
              - "에드릭은 씩씩대며 돌아섰다. 훈련장 반대편 허수아비로 갔다."
              - "그리고 내가 안 보는 줄 알고, 발 위치를 몰래 고쳤다. 반 뼘 뒤로."
              - 속마음: "(…듣긴 들었구나.)"
            effects: ["affinity.edric += 2"]
        - text: 말없이 옆에서 같이 휘두른다
          effects: ["affinity.edric += 4", "stat.근력 += 0.5"]
          lines:
            - "말없이 옆 허수아비 앞에 섰다. 거치대에서 목검을 하나 집어 들었다."
            - 에드릭: "…뭐 하는 거야."
            - "대답하지 않고 휘둘렀다. 퍽. 퍽. 일정한 박자로."
            - "한참을 나란히 휘둘렀다. 해가 지고, 훈련장 마력등이 하나둘 켜졌다."
            - "어느 순간부터 옆에서 들리는 박자가 내 박자와 겹쳤다."
            - "곁눈질로 보니, 에드릭이 슬쩍 내 자세를 따라 하고 있다. 발 위치까지."
            - "눈이 마주쳤다. 에드릭이 화들짝 고개를 돌렸다."
            - 에드릭@당황: "…따라 하는 거 아니다. 우연이야."
            - 나: "그래."
            - 에드릭: "진짜 우연이야."
            - "그 우연은 마력등이 다 켜질 때까지 계속됐다."
        - text: "\"패거리 없으니까 편하지?\""
          effects: ["affinity.edric += 3", "trust.edric += 2"]
          lines:
            - 나: "패거리 없으니까 편하지?"
            - 에드릭@화남: "편하긴 개뿔."
            - "에드릭이 목검을 휘둘렀다. 허수아비가 아니라 허공을."
            - 에드릭: "밥 먹을 때 옆자리가 비어 있어. 복도 걸을 때 뒤가 조용해. 그게 얼마나 이상한지 알아?"
            - "에드릭이 한참 말이 없었다. 목검 끝이 땅에 닿았다."
            - 에드릭: "…조금은."
            - 나: "응?"
            - 에드릭@당황: "조금은 편하다고. 걔들 비위 안 맞춰도 되니까. 됐냐?"
            - 속마음: "(패거리를 이끌던 게 아니라, 패거리에게 끌려다녔던 거구나.)"

- id: amb_chapel_sera
  title: 촛대 스무 개
  on: 성당
  pool: true
  repeat: 2
  cooldown: 3
  window: { from: "1.4", to: "1.7" }
  when: "fate.sera == 'saved' or fate.sera == 'saved_quiet'"
  lines:
    - "오후의 성당. 스테인드글라스를 지난 빛이 바닥에 색색의 웅덩이를 만든다."
    - "향 냄새. 촛농 냄새. 그리고 어디선가 금속을 닦는 냄새."
    - "제단 옆. 세라가 소매를 걷어붙이고 은촛대를 닦고 있다."
    - "스무 개가 넘는다. 닦은 것과 안 닦은 것이 두 줄로 서 있다. 안 닦은 줄이 훨씬 길다."
    - "은발이 흘러내리자 세라가 손등으로 쓸어 넘겼다. 이마에 까만 얼룩이 생겼다. 본인은 모른다."
    - 세라@웃음: "아, 왔구나."
    - 세라: "시스터 루나께서 일을 주셨어. 한 주에 은화 두 닢. 고향 동생들한테 보내려고."
    - 세라: "우리 마을 성당은 지붕이 새. 비 오는 날엔 기도하다가 정수리에 빗방울이 떨어져."
    - 세라@진지: "그래도 다들 거기서 기도해. 지붕이 새는 건 하늘이 가까워서라고, 신부님이 그러셨어."
    - when: "know.sera_stigma"
      나레이션: "촛대를 쥔 세라의 손등이 가끔 희미하게 빛난다. 본인은 모르는 척한다. 나도 모르는 척한다."
    - 속마음: "(원작의 세라는 3월에 탈락해 고향으로 돌아갔다. 지붕 새는 그 성당으로.)"
  choices:
    - text: 걸레를 들고 같이 닦는다
      effects: ["affinity.sera += 4", "stat.의지 += 0.5"]
      lines:
        - "걸레를 하나 집어 들고 세라 옆에 앉았다."
        - 세라@놀람: "어, 너는 안 해도—"
        - 나: "둘이 하면 반이잖아."
        - "세라가 잠시 나를 보다가, 작게 웃었다. 그리고 촛대 하나를 건넸다."
        - "말없이 닦았다. 문지를수록 은이 거울처럼 빛을 되찾는다. 거기 내 얼굴이 비친다."
        - "성당은 조용하다. 걸레 문지르는 소리와, 가끔 촛대를 내려놓는 소리뿐."
        - "둘이 하니 금방이었다. 세라가 마지막 촛대에 불을 붙였다."
        - "스무 개의 불꽃이 나란히 흔들렸다."
        - 세라@웃음: "같이 하니까 꼭 기도하는 것 같다. 이상하지?"
        - 속마음: "(이상하지 않다. 기도할 줄은 모르지만, 이게 기도라면 할 수 있을 것 같다.)"
    - text: "\"기도할 때 뭘 빌어?\""
      effects: ["affinity.sera += 5", "trust.sera += 2"]
      lines:
        - 나: "기도할 때 뭘 빌어?"
        - "세라의 손이 멈췄다. 촛대를 무릎 위에 내려놓고, 한참 제단 쪽을 봤다."
        - 세라: "…아무도 안 다치게 해 달라고."
        - 세라: "내가 아는 사람들 전부. 엄마, 동생들, 신부님, 마을 사람들. 하나씩 이름을 불러."
        - 세라@진지: "이름을 부르다 보면 기도가 길어져. 그래서 무릎이 늘 아파."
        - "세라가 다시 촛대를 들었다. 그리고 닦으면서, 지나가듯 말했다."
        - 세라: "그 목록에 너도 있어. 요즘은."
        - "걸레를 쥔 손이 멈췄다. 세라는 이쪽을 보지 않는다. 귀 끝만 조금 붉다."
        - 속마음: "(원작의 세라는 여기 없었다. 목록에 올라갈 사람도, 목록을 쓸 사람도.)"
        - 속마음: "(누군가의 기도 목록에 이름이 있다는 건, 이런 기분이구나.)"
    - text: 은화 두 닢을 몰래 헌금함에 넣는다
      requires: "money >= 2"
      effects: ["money -= 2", "affinity.sera += 2", "stress -= 5"]
      lines:
        - "세라가 촛대를 들고 제단 뒤로 간 사이, 헌금함 앞에 섰다."
        - "은화 두 닢을 꺼냈다. 세라가 한 주 내내 촛대를 닦아야 버는 돈."
        - "소리 나지 않게, 한 닢씩 넣었다."
        - 속마음: "(지붕을 고치기엔 턱없이 모자라겠지만. 빗방울 몇 개쯤은 막을 수 있을지도.)"
        - "세라는 못 봤다."
        - "시스터 루나는 봤다. 기둥 옆에서 성경을 들고 서 있다가."
        - "시스터 루나가 한쪽 눈을 찡긋했다. 그리고 손가락을 입술에 댔다."
        - 시스터 루나@웃음: "(입 모양으로) 비밀이에요."
        - "세라가 돌아왔을 때, 나는 시치미를 떼고 촛대 하나를 닦고 있었다."

- id: amb_lib_noel
  title: 룬 사전을 베고 자는 선배
  on: 도서관
  pool: true
  repeat: 2
  cooldown: 3
  when: "met.noel or affinity.noel > 0"
  lines:
    - "도서관 맨 안쪽, 고문서 서가. 먼지 냄새가 짙어서 아무도 오지 않는 구역이다."
    - "그런데 오늘은 코 고는 소리가 들린다."
    - "노엘 선배다. 열람대에 엎드려, 두꺼운 책을 베개 삼아 자고 있다. 입이 반쯤 열려 있다."
    - "책등의 제목이 보인다. 『고대 룬 문자 대사전 — 3권』."
    - "펼쳐진 페이지 가장자리에 침 자국이 번져 있다. 서가 그늘에는 빈 술병 하나가 숨겨져 있다."
    - when: "noel.laundry"
      나레이션: "세탁실 유령은 낮에는 여기서 자는 모양이다."
    - "또각. 또각. 사서 노인이 반납 수레를 밀고 다가왔다."
    - "노인이 노엘 앞에서 멈췄다. 한숨도 쉬지 않고, 깨우지도 않고, 그냥 내려다봤다."
    - 사서: "노엘 군. 그 책은 베개가 아닐세."
    - 노엘: "(눈도 안 뜨고) …베개가 아니면 이렇게 편할 리가 없죠."
    - 사서: "3권은 다음 주까지 반납하게. 2권처럼 침으로 붙여 오지 말고."
    - 노엘@웃음: "(여전히 눈 감고) 2권은 침이 아니라 술이었어요. 향이 좋았죠."
    - "노인이 고개를 젓고 수레를 밀며 사라졌다. 서가 그늘의 술병은 못 본 척 지나갔다."
    - 속마음: "(고대 룬 문자 사전. 시험에도 안 나오는 책을, 만년 꼴찌가 왜 베고 잘까.)"
  choices:
    - text: 깨운다
      effects: ["affinity.noel += 4"]
      lines:
        - "어깨를 톡톡 쳤다. 반응이 없다. 조금 세게 흔들었다."
        - 노엘@당황: "으아. …아, 사감? 아니구나."
        - "노엘이 침 자국 묻은 뺨을 문지르며 눈을 비볐다. 나를 알아보는 데 한참 걸렸다."
        - 노엘: "…아, 너냐. 1학년이 왜 이런 구석까지 와. 여긴 먼지랑 나밖에 없어."
        - 나: "선배는 여기서 뭐 해요?"
        - 노엘@웃음: "공부."
        - 나: "자고 있던데요."
        - 노엘: "그러니까 공부. 이건 수면 학습이야. 룬은 원래 꿈에서 배우는 거라고. 진짜야."
        - 노엘: "옛날 사람들은 룬을 꿈에서 받아 적었대. 깨어 있으면 안 보인다나."
        - "노엘이 하품을 하고, 사전을 다시 베개처럼 정돈했다."
        - 노엘: "그러니까 1학년, 내 학습을 방해하지 말 것. 졸업이 걸렸어. …몇 년째지만."
        - 속마음: "(농담인지 진담인지 모르겠다. 이 사람 말은 늘 그렇다.)"
    - text: 펼쳐진 쪽을 슬쩍 들여다본다
      check: { label: 여백 읽기, value: "stat.지성 + 10 * perk.데이터마이너 + luck", dc: 26 }
      success:
        lines:
          - "노엘의 팔 아래로 펼쳐진 쪽을 조심스럽게 들여다봤다."
          - "여백에 연필 메모가 빼곡하다. 작고 날카로운 글씨. 술 취한 사람의 글씨가 아니다."
          - "사전의 해설을 하나하나 고쳐 쓴 메모다. 화살표, 줄 긋기, 그리고 '틀림. 이 획은 위가 아니라 아래로.'"
          - "옆 페이지의 비문 탁본과 대조해 봤다. 사전이 틀리고, 메모가 맞다."
          - 속마음: "(학교에서도 안 가르치는 고대 룬을, 만년 꼴찌가 사전보다 정확하게 안다.)"
          - 속마음: "(커뮤니티에 노엘 루머가 하나 돌았었다. 근거 없는 소리라고 다들 웃어넘겼는데.)"
          - "노엘이 잠결에 몸을 뒤척였다. 재빨리 물러났다."
        effects: ["noel.rune_seen = 1", "affinity.noel += 2", "stat.지성 += 0.5"]
      fail:
        lines:
          - "노엘의 팔 아래로 펼쳐진 쪽을 들여다봤다."
          - "여백에 뭔가 빼곡하게 적혀 있다. 그런데 글씨가 너무 작다. 개미가 기어간 자국 같다."
          - "조금 더 가까이—"
          - "노엘이 몸을 뒤척여 책을 덮어 버렸다. 침 자국 쪽으로."
          - 노엘: "(잠꼬대) …남의 책 훔쳐보면… 눈에 다래끼 난다…"
          - 속마음: "(…자는 거 맞아?)"
        effects: ["affinity.noel += 1"]
    - text: 담요를 덮어 주고 간다
      effects: ["affinity.noel += 3"]
      lines:
        - "서가 끝 의자에 걸린 담요를 가져왔다. 사서 노인이 늘 걸어 두는 도서관 담요."
        - "노엘의 어깨에 덮어 주었다. 술 냄새와 오래된 종이 냄새가 섞여 올라왔다."
        - "담요를 덮어 주자, 노엘이 잠결에 웅얼거렸다."
        - 노엘@슬픔: "…성문… 닫지 마…"
        - "손이 멈췄다."
        - 노엘: "…아직… 다 안 들어왔어…"
        - "노엘의 손가락이 사전 모서리를 꽉 쥐었다. 그리고 천천히 풀렸다. 숨소리가 다시 고르게 돌아왔다."
        - 속마음: "(잠꼬대치고는 목소리가 너무 어렸다. 열 살쯤 된 아이처럼.)"
        - 속마음: "(무슨 성문일까. 누가 다 안 들어왔다는 걸까.)"
        - "발소리를 죽이고 고문서 서가를 빠져나왔다. 등 뒤의 코 고는 소리가 오늘따라 조금 슬펐다."

- id: amb_magic_dorothy
  title: 창밖의 청강생
  on: 마법실습
  pool: true
  repeat: 2
  cooldown: 3
  when: "found.dorothy or affinity.dorothy >= 5"
  lines:
    - "마법 실습실. 엘베라 교수가 칠판에 원소 순환 도식을 그리고 있다. 분필 소리가 느긋하다."
    - 나레이션:
        - "실습 중에 창밖이 자꾸 신경 쓰인다. 창틀 아래로 앞치마 끈이 보였다 사라졌다 한다."
        - { when: "fired.amb_magic_dorothy >= 2", text: "오늘도 창틀 아래로 앞치마 끈이 보인다. 이제는 거의 고정석이다." }
    - "교수가 돌아서서 설명할 때마다 창틀 아래로 무언가 쏙 숨는다. 교수가 칠판을 보면, 다시 쏙 올라온다."
    - "도로시다. 장바구니를 든 채 까치발을 하고, 엘베라 교수의 칠판을 손바닥에 베끼고 있다."
    - "손바닥이 모자라 손목까지 잉크가 번졌다. 장바구니 속 대파가 바람에 흔들린다."
    - 속마음:
        - "(식당 집 딸이 마법 수업을 훔쳐 듣는다. 저건 구경꾼의 눈이 아니다. 배우는 사람의 눈이다.)"
        - { when: "perk.데이터마이너", text: "(DLC 데이터의 숨은 인재. 원작에선 식당 배경의 실루엣이었다. 그 실루엣이 지금 수업을 훔쳐 듣는다.)" }
    - "눈이 마주쳤다."
    - 도로시@당황: "(입 모양으로) 쉿! 쉿! 재료 사러 가는 길이었어요. 진짜로요!"
    - "장바구니를 흔들어 보인다. 대파가 증거라는 듯이."
    - when: "trust.dorothy >= 5"
      나레이션: "그러다 나를 알아보고, 창 너머로 새끼손가락을 들어 보였다. 약속, 이라는 입 모양."
  choices:
    - text: 필기 노트를 빌려준다
      effects: ["affinity.dorothy += 5"]
      lines:
        - "수업이 끝나고, 창가로 가서 필기 노트를 창밖으로 내밀었다."
        - 도로시@놀람: "…네? 이걸 왜 저한테."
        - 나: "손바닥에 다 안 들어가잖아. 손목까지 번졌어."
        - 도로시@웃음: "진짜요? 진짜 빌려줘요? 이거 엘베라 교수님 수업 필기예요?"
        - 도로시: "성물이다, 성물… 내일 꼭 돌려줄게요. 한 장도 안 접고요!"
        - "도로시가 노트를 장바구니 맨 위, 대파 위에 소중히 올려놓고 뛰어갔다."
        - "다음 날 돌려받은 노트에는 내 필기보다 도로시의 주석이 더 많았다."
        - "'이 순환은 국 끓일 때 불 줄이는 거랑 같음.' '교수님 여기서 웃으셨음 (중요?).'"
        - "'역순으로 하면 폭발? 실험해 볼 것.'"
        - "대부분 맞았다. 마지막 줄 옆에는 '실험 금지'라고 적어서 돌려줬다."
    - text: 창문을 살짝 열어 둔다
      effects: ["affinity.dorothy += 4", "affinity.elvera += 2"]
      lines:
        - "창가 자리로 슬쩍 옮겨 앉았다. 교수가 칠판을 보는 사이, 창문 걸쇠를 풀었다."
        - "창문을 손가락 한 마디만큼 열었다."
        - "바람을 타고 엘베라 교수의 목소리가 창밖으로 흘러 나갔다."
        - "창틀 아래의 두건이 움찔하더니, 귀를 창 쪽으로 바짝 댔다."
        - "교수가 설명을 멈추고 창 쪽을 한 번 보았다. 긴 귀 끝이 아주 조금 움직였다."
        - 속마음: "(들켰다.)"
        - "교수는 아무 말도 하지 않았다."
        - "대신 칠판 쪽으로 돌아서며, 목소리를 조금 키웠다. 분필 글씨도 평소보다 크게, 창 쪽 가장자리까지 넓게."
        - "창틀 아래에서 '흡' 하고 숨 들이켜는 소리가 났다."
        - 속마음: "(오백 년을 산 교수에게는, 창밖의 학생 하나쯤 이미 오래전에 보였겠지.)"
    - text: 모른 척한다
      lines:
        - "칠판으로 시선을 돌렸다. 남의 비밀까지 챙길 여유는 없다."
        - "수업은 계속됐다. 창틀 아래의 두건도 계속 오르락내리락했다."
        - "교수가 창 쪽을 볼 때마다 두건이 쏙 사라졌다. 나만 그걸 보고 있었다."
        - "도로시는 수업이 끝날 때까지 창밖에 있었다. 한 시간 내내 까치발로."
        - "종이 울리자 장바구니를 들고 식당 쪽으로 뛰어갔다. 잉크 묻은 손바닥을 소중히 오므린 채."
        - "엘베라 교수는 수업이 끝나고도 칠판을 지우지 않은 채 나갔다."
        - "원소 순환 도식은 해가 질 때까지 그대로 남아 있었다. 창밖에서도 보이는 자리에."
        - 속마음: "(장바구니 속 대파는 다 시들었겠다.)"

- id: amb_walk_aren
  title: 처음 보는데 익숙한
  art: forest
  on: 산책
  pool: true
  window: { from: "1.3.2", to: "1.7" }
  when: "affinity.aren > 0"
  lines:
    - "뒷산 오솔길. 나뭇잎 사이로 햇빛이 조각조각 떨어진다. 흙냄새가 진하다."
    - "어디선가 휘파람 소리가 들렸다. 길게, 짧게, 다시 길게."
    - "산비둘기들이 우르르 내려앉는다. 그 한가운데 아렌이 손가락을 입에 물고 서 있다. 양치기의 휘파람이다."
    - when: "cat.kitten == 'lake'"
      나레이션: "길가 갈대숲에서 얼룩 고양이 다섯 마리가 줄지어 지나갔다. 아렌이 손가락으로 셌다. 하나, 둘, 셋, 넷, 다섯."
    - 아렌@웃음: "아, 왔어? 고향 생각나서. 비둘기들이 양보다 말을 잘 들어."
    - 아렌: "…있잖아, 이상한 거 하나 보여 줄까?"
    - "아렌을 따라 오솔길을 올랐다. 갈림길이 나왔다. 오른쪽은 잘 닦인 길, 왼쪽은 덤불에 반쯤 묻힌 길."
    - "아렌이 왼쪽을 가리켰다."
    - 아렌@진지: "여기 처음 와 보는데… 이쪽으로 가면 무너진 돌탑이 있을 것 같아. 이끼 낀 거."
    - 아렌: "탑 옆에 구부러진 소나무도 있고. 거기서 보면 아카데미 첨탑이 나무 사이로 보여."
    - "왼쪽으로 갔다. 덤불을 헤치고, 열 걸음, 스무 걸음."
    - "이끼 낀 돌탑이 무너져 있었다. 그 옆에 구부러진 소나무. 나무 사이로 아카데미 첨탑."
    - "아렌이 말한 그대로다."
    - 아렌@당황: "…봤지? 나 가끔 이래. 꿈에서 본 것 같은 곳이 진짜로 있어."
    - 속마음: "(원작에 이런 대사는 없었다. 아렌은 플레이어의 분신이었으니까. 분신은 데자뷔를 겪지 않는다.)"
  plants:
    - { id: F40, notice: { value: "stat.지성 + 10 * talent.직감 + 10 * perk.고인물의기억", dc: 26 } }
  choices:
    - text: "\"나도 가끔 그래\""
      effects: ["affinity.aren += 4", "aren.kind += 0.5"]
      lines:
        - 나: "나도 가끔 그래."
        - 아렌@놀람: "진짜?"
        - 나: "처음 보는 곳인데 이미 아는 것 같은 거. 다음에 뭐가 있을지 아는 거."
        - 아렌@웃음: "진짜? 다행이다. 나만 이상한 줄 알았어."
        - 아렌: "마을에선 이런 말 하면 다들 이상하게 봤거든. 양치기 아들이 점쟁이냐고."
        - "아렌이 돌탑에 걸터앉아 다리를 흔들었다. 아까보다 어깨가 가벼워 보인다."
        - 속마음: "(거짓말은 아니다. 이 세계 전부가, 나한테는 처음 보는데 익숙하니까.)"
    - text: "\"꿈에서 또 뭘 봤어?\""
      art: cg_aren_dream
      effects: ["affinity.aren += 3", "trust.aren += 3"]
      lines:
        - 나: "꿈에서 또 뭘 봤어?"
        - "아렌이 돌탑에 걸터앉았다. 한참 첨탑 쪽을 보다가 입을 열었다."
        - 아렌@진지: "음… 하늘이 빨갰어."
        - 아렌: "엄청 넓은 데였어. 바람이 뜨거웠고. 누가 울고 있었어. 누군지는 몰라."
        - 아렌: "나는 칼을 들고 서 있었는데, 손이 안 움직였어. 아무리 움직이려고 해도."
        - "아렌이 자기 손바닥을 내려다봤다. 주먹을 쥐었다 폈다."
        - 아렌@웃음: "아, 몰라. 그냥 꿈이야. 성검 받고 나서 별 꿈을 다 꾼다니까."
        - 속마음: "(붉은 하늘. 서른일곱 개 엔딩 중 서른 개가 넘는 엔딩의 마지막 배경.)"
        - 속마음: "(그 배경 한가운데 서 있던 건, 늘 아렌이었다.)"
    - text: 웃어넘긴다
      effects: ["affinity.aren += 2"]
      lines:
        - 나: "기분 탓이겠지. 산은 다 비슷하잖아."
        - 아렌: "그치? 기분 탓이겠지."
        - "아렌이 웃었다. 그런데 돌아서기 전에, 돌탑을 한 번 더 돌아봤다."
        - 아렌@웃음: "아, 배고프다. 식당 가자. 오늘 감자 스튜래."
        - "내려가는 길, 아렌은 휘파람을 불었다. 아까와 다른 가락이었다. 처음 듣는데, 어딘가 슬픈."
        - 속마음: "(그 가락은 어디서 배웠냐고, 묻지 못했다.)"

- id: amb_walk_finn
  title: 꽃잎과 빗자루
  art: garden_path
  on: 산책
  pool: true
  repeat: 2
  cooldown: 3
  window: { from: "1.3.2", to: "1.7" }
  lines:
    - 나레이션:
        - "가로수길. 청소부 소년이 떨어진 꽃잎을 쓸고 있다. 바람이 불 때마다 꽃잎이 다시 흩어진다."
        - { when: "time.month >= 5", text: "가로수길. 청소부 소년이 송홧가루 내려앉은 돌바닥을 쓸고 있다. 바람이 불 때마다 노란 먼지가 다시 인다." }
    - "오후 수업을 마친 학생들이 그 길을 지나간다. 아무도 소년을 보지 않는다."
    - "쓱. 쓱. 빗자루 소리가 일정하다. 소년은 한 번도 허리를 펴지 않는다."
    - "발자국이 지나간 자리를, 소년이 다시 쓴다. 불평 한마디 없이."
    - 나레이션:
        - "그런데 이상하다. 바람이 불어도, 소년이 쓴 자리에는 아무것도 다시 쌓이지 않는다."
        - { when: "found.finn", text: "핀의 빗자루는 바람보다 한 박자 빠르다. 떨어지는 것이 바닥에 닿기도 전에 한 줄로 모인다." }
    - "다시 봤다. 바람이 분다. 흩날린 것들이, 소년이 지나간 자리만 피해 간다."
    - 속마음: "(바람을 읽고 있다. 다음에 어디로 떨어질지 알고, 먼저 가 있는 거다.)"
    - when: "cat.kitten == 'finn'"
      나레이션: "소년의 발치에서 얼룩 새끼 고양이가 빗자루 끝을 쫓아 뛰어다닌다. 그새 많이 컸다."
    - when: "finn.letters >= 3"
      나레이션: "빗자루 손잡이에 칼로 새긴 서툰 글씨가 있다. ── 핀."
    - "소년이 인기척에 고개를 들었다. 빗자루를 꼭 쥔다."
    - 핀@당황: "아, 학, 학생. 길 막았어요? 비킬게요."
  choices:
    - text: 빗자루를 하나 빌려 시합을 건다
      check: { label: 빗자루 시합, value: "stat.민첩 + luck", dc: 26 }
      success:
        lines:
          - 나: "빗자루 하나 더 있어?"
          - 핀@놀람: "…네? 창고에 있긴 한데요."
          - 나: "시합하자. 길 끝까지 누가 더 깨끗하게 쓰나."
          - "핀이 눈을 깜빡였다. 그러다 창고에서 빗자루를 하나 가져왔다. 자기 것보다 좋은 걸로."
          - "둘이 동시에 쓸기 시작했다. 바람의 방향을 보고, 먼저 가 있기."
          - "길 끝에는 핀이 먼저 와 있었다. 그런데 돌아보니 내 쪽 길도 꽤 깨끗했다."
          - 핀@놀람: "…학생, 빗자루 좀 쓰시네요. 손목이 좋아요."
          - 핀@웃음: "다음에 또 해요. 이번엔 제가 왼손으로 할게요."
          - 속마음: "(왼손으로 해도 질 것 같다.)"
        effects: ["met.finn = 1", "affinity.finn += 4", "stat.민첩 += 0.5"]
      fail:
        lines:
          - 나: "빗자루 하나 더 있어? 시합하자."
          - "핀이 어리둥절한 얼굴로 빗자루를 하나 가져왔다."
          - "둘이 동시에 쓸기 시작했다."
          - "…내가 쓴 자리에만 작은 무덤이 생겼다. 쓸어 모은 게 바람에 도로 흩어진다. 바람이 내 쪽으로만 부는 것 같다."
          - 핀@웃음: "빗자루는 힘으로 하는 게 아니에요."
          - 핀: "바람이 가는 데 먼저 가 있으면 돼요. 그럼 알아서 모여요."
          - 속마음: "(…그거, 검술 얘기 아냐?)"
          - "핀이 내 빗자루를 받아 들고, 내가 만든 무덤을 세 번 만에 쓸어 냈다. 숨도 안 찬 얼굴로."
        effects: ["met.finn = 1", "affinity.finn += 3"]
    - text: "\"청소, 힘들지 않아?\""
      effects: ["met.finn = 1", "affinity.finn += 3"]
      lines:
        - 나: "청소, 힘들지 않아? 매일 이 길을 다."
        - 핀@놀람: "청소요?"
        - "핀이 고개를 갸웃했다. 그런 질문은 처음 받는다는 얼굴이다."
        - 핀@웃음: "좋아요. 쓸면 깨끗해지잖아요."
        - 핀: "세상에 그런 일 별로 없어요. 하면 한 만큼 되는 일."
        - 핀: "고아원에선… 아무리 해도 안 되는 일이 많았거든요. 여기선 쓸면 깨끗해져요. 그게 좋아요."
        - "핀이 다시 빗자루를 움직였다. 쓱. 쓱. 아까보다 조금 가벼운 박자."
        - 속마음: "(하면 한 만큼 되는 일. 이 아이에게 검이 그런 일이 될 수 있다면.)"

- id: amb_canteen_thomas
  title: 주근깨 토마스
  on: 식당
  pool: true
  window: { from: "1.4", to: "1.7" }
  when: "thomas.comforted"
  lines:
    - "저녁 식당. 쟁반을 들고 자리를 찾는데, 저쪽에서 누가 손을 크게 흔든다."
    - "D반 토마스다. 주근깨 가득한 얼굴이 활짝 웃고 있다. 계단참에서 울던 그 얼굴이."
    - "토마스가 쟁반을 들고 와 맞은편에 털썩 앉았다. 스튜가 조금 넘쳤다."
    - "\"그날 밤 고마웠어! 집에서 답장 왔어!\""
    - "\"이웃집에서 송아지를 빌려주기로 했대. 갚는 건 내가 졸업하고 하면 된대. 졸업하고! 나 이제 졸업해야 돼.\""
    - "토마스가 숟가락을 흔들며 웃었다. 스튜 국물이 튀었다."
    - "토마스는 수다쟁이였다. 우는 날만 빼면."
    - "수업 이야기, 기숙사 이야기, D반 누가 누구를 좋아한다는 이야기. 숨 쉴 틈 없이."
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(10월, 첫 실전 토벌. 원작의 토마스는 거기서 돌아오지 못한다. 이름도 대사도 없이, 아렌의 회상 속에서만.)"
    - "\"너 왜 그렇게 봐? 내 얼굴에 뭐 묻었어?\""
  choices:
    - text: 같이 밥을 먹는다
      effects: ["stress -= 5"]
      lines:
        - "그냥 웃으면서 숟가락을 들었다."
        - "토마스네 마을 소들의 이름을 전부 들었다. 열두 마리."
        - "\"얼룩이, 점박이, 큰뿔이, 작은뿔이… 그리고 감자.\""
        - "\"죽은 소 이름이 '감자'였어. 감자처럼 동글동글해서. 내가 지었어.\""
        - "토마스가 잠깐 숟가락을 멈췄다. 그리고 다시 웃었다."
        - "\"이번에 빌리는 송아지 이름은 뭐로 할까. 너도 하나 생각해 봐.\""
        - 나: "…스튜."
        - "토마스가 스튜를 뿜었다. 옆자리 학생이 질겁하며 쟁반을 들고 도망갔다."
        - "그렇게 웃으며 밥을 먹은 게 오랜만이었다."
    - text: "\"너, 저녁마다 나랑 같이 뛰자\""
      effects: ["stat.체질 += 0.5", "fatigue += 5"]
      lines:
        - 나: "너, 저녁마다 나랑 같이 뛰자."
        - "\"나랑? 나 D반에서 제일 느린데.\" 토마스가 눈을 동그랗게 떴다."
        - 나: "그러니까."
        - "\"…그러니까?\""
        - 나: "제일 느리니까, 제일 많이 빨라질 수 있잖아."
        - "토마스가 한참 나를 봤다. 숟가락이 입 앞에서 멈춰 있다."
        - "\"…너 이상한 애다. 좋은 쪽으로.\""
        - "그날 저녁부터 운동장을 돌았다. 토마스는 첫날 세 바퀴 만에 주저앉았다."
        - "둘째 날은 네 바퀴. 셋째 날은 네 바퀴 반."
        - 속마음: "(가을까지. 조금이라도 빨리 달릴 수 있게.)"
        - 속마음: "(그날이 오면, 반 걸음이라도 더 멀리 달아날 수 있게.)"
