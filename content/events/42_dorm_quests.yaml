            - "── 그러니 형님도 밥은 거르지 마세요. 장부는 밥 먹고 봐도 안 도망갑니다."
            - 속마음: "(몰락 귀족 엑스트라. 원작의 설정은 한 줄이었다. 그 한 줄 뒤에, 장부를 붙든 사람이 있었다.)"
            - "봉투에 가문 인장을 찍으려다 멈췄다. 밀랍도 돈이다. 그냥 풀로 붙였다."
            - "우편함에 넣기 전에 한 번 더 읽었다. 형님 미간의 주름이 하나쯤은 펴지기를."
          effects: ["stress -= 5"]
        - when: "origin == '악역도련님'"
          lines:
            - "── 아버지께."
            - "거기서 펜이 멈췄다."
            - "벨모어 백작. 원작의 에드릭이 이 사람에게 무슨 말을 했었는지, 아무 기억도 없다."
            - 속마음: "(원작은 이 부자가 마주 앉은 장면을 한 번도 보여 주지 않았다. 대사 한 줄도.)"
            - "펜촉에서 잉크가 뚝 떨어졌다. '아버지께' 옆에 까만 얼룩이 번진다."
            - "종이를 구겨 버렸다. 은화 한 닢짜리 들꽃이 구겨졌다."
            - "새 종이를 꺼냈다. 결국 받는 사람을 바꿨다."
            - "── 집안의 늙은 하인에게. 그동안 미안했다고. 3층 안쪽 이야기, 고마웠다고."
            - when: "not servant.warning"
