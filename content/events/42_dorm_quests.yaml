- id: dorm_ghost
  title: 3층 세탁실의 유령
  on: 휴식
  pool: true
  window: { from: "1.4", to: "1.7" }
  slots: [밤]
  chance: 0.5
  lines:
    - "요즘 기숙사에 도는 소문이 있다. 식당에서도, 세면장에서도, 다들 목소리를 낮춘다."
    - 학생 A: "3층 끝 세탁실 말이야. 자정만 되면 안에서 흐느끼는 소리가 난대."
    - 학생 B: "쇠사슬 끄는 소리도. 달그락, 달그락."
    - 학생 A: "백 년 전에 졸업 시험 떨어진 선배가 거기서… 아무튼, 그 선배 유령이래."
    - 학생 B: "그래서 시험 기간만 되면 더 크게 운대. 자기 대신 떨어질 사람 찾느라고."
    - 속마음: "(에테크 커뮤니티 괴담 게시판에도 '아카데미 7대 불가사의'가 있었다. 세탁실은 없었다.)"
    - "그리고 지금, 자정."
    - "목이 말라 눈을 떴다. 기숙사는 쥐 죽은 듯 조용하다."
    - "복도 끝에서 정말로 소리가 난다."
    - "달그락."
    - "끄으으으."
    - "…달그락."
    - when: "talent.겁쟁이"
      나레이션: "이불을 정수리까지 끌어올렸다. 발가락이 이불 밖으로 나왔다. 다시 넣었다."
    - when: "talent.겁쟁이"
      나레이션: "이번엔 정수리가 나왔다. 이불이 짧은 건지, 내가 떨고 있는 건지 모르겠다."
    - 속마음: "(유령 같은 건 없다. 이 게임엔 언데드 몹은 있어도, 기숙사 유령 설정은 없었다.)"
    - 속마음: "(…없었던 거, 맞지?)"
  choices:
    - text: 직접 확인하러 간다
      check: { label: 담력, value: "stat.의지 - 5 * talent.겁쟁이 + 5 * talent.강철멘탈 + luck", dc: 22 }
      success:
        art: cg_noel_ghost
        lines:
          - "맨발로 복도를 걸었다. 소리가 가까워질수록 발바닥이 차가워진다."
          - "세탁실 문틈으로 푸른 달빛이 새어 나온다. 숨을 한 번 고르고, 문을 열었다."
          - "달빛 아래, 빨랫감 더미 위에 사람이 누워 있다. 기숙사 이불 세 장을 둘둘 말고."
          - "가슴 위에 빈 술병 세 개. 뒤척일 때마다 서로 부딪혀 달그락거린다. 쇠사슬 소리의 정체다."
          - "흐느끼는 소리라고 생각했던 건—"
          - "끄으으으. 푸우."
          - "코 고는 소리였다."
          - 속마음: "(…유령이 아니라 주정뱅이였다.)"
          - "인기척에 그 사람이 한쪽 눈을 떴다. 헝클어진 머리, 풀린 넥타이. 4학년 배지."
          - 노엘@당황: "…으음? 누구야. 사감이면 나 여기 없다."
          - 나: "…사감 아니에요. 1학년이에요."
          - 노엘@웃음: "아, 다행이다. 1학년은 안 무서워. 사감이 무섭지."
          - 노엘: "기숙사비가 좀 밀려서 방에서 쫓겨났거든. 세탁실 따뜻하다? 보일러 관이 바로 벽 뒤로 지나가."
          - 노엘: "비밀이야. 유령은 비밀 유지가 생명이라고."
          - 노엘: "그리고 소문 하나 바로잡자면, 나는 백 년 전에 떨어진 게 아니야. 몇 년째 떨어지는 중이지."
          - 속마음: "(노엘. 원작에서 학년말에 짐을 싸서 사라지는 만년 꼴찌 선배. 지금 보니 그냥, 잘 곳이 없는 사람이다.)"
        effects: ["met.noel = 1", "affinity.noel += 4", "noel.laundry = 1"]
      fail:
        lines:
          - 삽화: dorm_hall
          - "맨발로 복도를 걸었다. 세탁실 문까지 열 걸음. 아홉. 여덟."
          - "소리가 멈췄다. 정확히, 내가 멈춘 순간에."
          - 속마음: "(…왜 멈춰. 왜 하필 지금 멈추는 건데.)"
          - "문고리를 잡았다. 차갑다. 쇠가 이렇게 차가울 수 있나."
          - "그 순간, 문 바로 안쪽에서 '끄으으으으' 하는 소리가 귓가에서 났다."
          - "정신을 차려 보니 내 방 침대 위였다. 이불을 머리끝까지 쓰고 있었다."
          - "어떻게 돌아왔는지 기억이 없다. 발바닥이 새까맣다."
          - "다음 날 아침, 식당에 소문이 하나 늘어 있었다."
          - 학생 A: "들었어? 어젯밤에 1학년 하나가 유령 보고 맨발로 계단을 세 칸씩 뛰어 내려갔대."
          - 학생 B: "비명도 안 지르고. 소리 없이. 그게 더 무섭대."
          - 속마음: "(…그거, 나다.)"
        effects: ["stress += 5"]
    - text: 이불을 뒤집어쓴다
      effects: ["stress += 2"]
      lines:
        - "이불을 머리끝까지 뒤집어썼다."
        - 속마음: "(원작엔 기숙사 유령 같은 건 없었다. …없었던 거 맞지?)"
        - 속마음: "(생각해 보니 기숙사 맵은 들어가 본 적도 없잖아. 휴식 버튼만 눌렀으니까.)"
        - "달그락. 끄으으. 달그락. 끄으으."
        - "소리는 새벽까지 이어졌다. 양을 세 보려 했는데, 양들이 자꾸 쇠사슬을 끌었다."
        - "그런데 듣다 보니 이상하다. 박자가 너무 일정하다."
        - "들이쉬고, 끄으으. 내쉬고, 달그락."
        - 속마음: "(…이거, 코 고는 소리 아냐?)"
        - "확인할 용기는 끝내 나지 않았다. 대신 그 박자에 맞춰 숨을 쉬다가, 어느새 잠들었다."

- id: dorm_homesick
  title: 텅 빈 주말
  art: cg_homesick
  on: 휴식
  pool: true
  window: { from: "1.3.2", to: "1.7" }
  slots: [주말]
  chance: 0.6
