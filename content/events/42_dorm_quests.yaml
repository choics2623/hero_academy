        - "일어나 앉았다. 노트를 뒤집어 맨 뒷장을 폈다."
        - "펜 끝이 종이 위에서 한참 머뭇거렸다. 그러다 쓰기 시작했다."
        - "── 집 주소. 동, 호수까지."
        - "── 엄마 전화번호. 이 세계에서는 아무 의미 없는 숫자 열한 개."
        - "── 즐겨 먹던 라면 이름. 편의점 이름. 단골 PC방 자리 번호."
        - "── 3,000시간짜리 세이브 파일 이름."
        - "다 적고 나니 손이 떨렸다."
        - "잊어버릴까 봐 무서웠다는 걸, 적고 나서야 알았다."
        - 속마음: "(시간이 지나면 기억은 풍화된다. 원작 지식도, 저쪽 세계의 기억도.)"
        - "노트를 덮고 베개 밑에 넣었다. 이상하게 그 베개가 조금 따뜻했다."
    - text: 창을 열고 운동장을 내려다본다
      effects: ["stress -= 8"]
      lines:
        - 나레이션:
            - "창문을 열었다. 꽃 냄새 섞인 바람이 커튼을 부풀렸다."
            - { when: "time.month >= 6", text: "창문을 열었다. 눅눅한 여름 바람이 커튼을 부풀렸다." }
        - "텅 빈 운동장. 흙바닥에 아침 훈련의 발자국만 어지럽게 남아 있다."
        - "그 한가운데서, 누군가 혼자 목검을 휘두르고 있다. 주말에도."
        - 나레이션:
            - "멀어서 누군지는 모르겠다. 그래도 저 사람도 집에 안 간 거다."
            - { when: "affinity.aren >= 10", text: "아렌이다. 양치기 마을은 아카데미에서 너무 멀다. 저 녀석도 집에 못 간 거다." }
            - { when: "found.finn", text: "빗자루를 든 작은 그림자. 핀이다. 저 아이는 돌아갈 집이 없다." }
        - "휘두르고, 멈추고, 다시 휘두른다. 박자가 일정하다. 혼자 있는 사람의 박자다."
        - when: "cat.friend"
          나레이션: "창틀에 얼룩 고양이가 폴짝 올라와 앉았다. 기숙사 3층까지 어떻게 올라왔는지는 모르겠다. 같이 운동장을 내려다봤다."
        - "창틀에 턱을 괴고, 그 박자를 한참 세었다."
        - "조금 덜 외로워졌다."
        - 속마음: "(이 넓은 아카데미에서, 집에 못 간 사람이 나 하나는 아니다.)"
    - text: 낮잠을 잔다
      effects: ["fatigue -= 10"]
      lines:
        - "커튼을 치고 누웠다. 시계 소리를 세다가 잠이 들었다."
        - "꿈에서 PC방 의자에 앉아 있었다. 익숙한 쿠션의 꺼짐. 번들거리는 W키."
        - "화면 속에 이 기숙사 방이 보였다. 창문, 책상, 좁은 침대."
        - "침대 위에 누가 자고 있었다. 웅크린 채, 베개를 꼭 끌어안고."
        - "마우스를 쥔 손이 움직이지 않았다. 클릭하면 그 사람이 깰 것 같아서."
        - 속마음: "(…저건 나다. 화면 안의 나를, 화면 밖의 내가 보고 있다.)"
        - "모니터 옆에 놓인 휴대폰이 울렸다. '밥은 먹고 하냐.'"
        - "답장을 하려고 손을 뻗었는데—"
        - "깼다. 방 안이 주황빛이다. 해가 기울었다."
        - "베개가 젖어 있었다."
        - "피로는 조금 풀렸다. 다른 무언가는, 조금 더 무거워졌다."

- id: dorm_crying
  title: 계단참의 울음소리
  art: dorm_hall
  on: 휴식
  pool: true
  window: { from: "1.4", to: "1.7" }
  slots: [밤]
  chance: 0.5
  lines:
    - "새벽 한 시. 목이 말라 잠이 깼다."
    - "물컵을 들고 복도로 나왔다. 마력등이 절반쯤 꺼져 있어 복도가 유난히 길어 보인다."
    - "계단참에 다다랐을 때, 소리가 들렸다."
    - "훌쩍. 끅."
    - "발이 멈췄다. 맨발에 닿는 돌계단이 차다."
    - "누가 울고 있다. 소리를 죽이느라 어깨만 들썩인다. 무릎에 얼굴을 묻고, 손에는 구겨진 편지 한 장."
    - "창으로 든 달빛이 그 얼굴을 비췄다. 주근깨투성이 얼굴."
    - "D반 맨 뒷자리에 앉는 녀석이다. 수업 때마다 제일 늦게 필기를 끝내던. 이름이… 토마스."
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(토마스. 원작에선 대사 한 줄 없이 10월 첫 토벌에서 죽는 D반 엑스트라.)"
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(아렌이 처음으로 동료를 잃는 장면의, 그 '동료'.)"
    - when: "not perk.고인물의기억 and not perk.공략위키편집자"
      속마음: "(토마스… 어디서 들어 본 이름인데. 위키 어딘가에서.)"
    - when: "origin == '악역도련님'"
      나레이션: "토마스가 나를 보고 숨을 들이켰다. 울음이 뚝 그쳤다. 벨모어가 망나니 앞에서 우는 건 위험한 일이니까."
    - "토마스가 소매로 얼굴을 북북 문질렀다. 들킨 걸 알면서도 어깨의 떨림이 멈추지 않는다."
    - "편지 귀퉁이가 눈물에 젖어 번져 있다. 삐뚤빼뚤한, 시골 학당에서 배운 글씨."
    - 속마음: "(못 본 척하면 된다. 엑스트라의 눈물까지 다 닦아 줄 수는 없다.)"
    - 속마음: "(…그런데 발이 안 떨어진다.)"
  choices:
    - text: 말없이 옆에 앉는다
      effects: ["thomas.comforted = 1", "stress -= 3"]
      lines:
        - "계단에 나란히 앉았다. 물컵을 둘 사이에 내려놓았다."
        - "한참 아무 말도 하지 않았다. 창밖에서 바람이 나뭇가지를 흔든다."
        - "토마스가 물컵을 힐끔 보더니, 한 모금 마셨다. 내 컵인데."
        - "\"…집에서 편지가 왔어.\""
        - "토마스가 코를 훌쩍였다. 구겨진 편지를 무릎 위에서 폈다 접었다 한다."
        - "\"소가 죽었대. 내 학비 때문에 팔기로 했던 소.\""
        - "\"팔기 전날 밤에 그냥… 누워서 안 일어났대. 늙었으니까. 그래도.\""
        - "\"그 소 등에 타고 마을 학당 다녔거든. 아버지가 그 소 팔아서 나 아카데미 보낸다고 했을 때, 나 울었어.\""
        - "\"근데 이제 팔지도 못하게 됐잖아. 나 같은 게 아카데미 와서 뭐 하나 싶어서.\""
        - "\"D반에서도 제일 느린데.\""
        - 속마음: "(위로의 말이 몇 개 떠올랐다. 전부 가벼웠다.)"
        - "어깨를 한 번 툭 쳤다."
        - "그걸로 충분했던 모양이다. 토마스가 소매로 얼굴을 문지르고, 길게 숨을 내쉬었다."
        - "\"…고마워. 들어 줘서.\""
        - when: "origin == '악역도련님'"
          나레이션: "\"…벨모어가 도련님이 이런 사람인 줄 몰랐어.\" 나도 몰랐다."
    - text: "\"울 거면 방에서 울어. 사감 온다\""
      effects: ["thomas.comforted = 1"]
      lines:
        - 나: "울 거면 방에서 울어. 사감 온다."
        - "말이 생각보다 퉁명스럽게 나왔다."
        - "토마스가 화들짝 놀라 일어섰다. 편지가 계단 아래로 굴러떨어졌다."
        - "주워서 내밀었다. 토마스가 받아 들고, 나를 한참 봤다."
        - "\"고, 고마워.\""
        - 속마음: "(…고맙다고? 지금 그 말에?)"
        - "무뚝뚝한 말을 경고로 알아들은 모양이다. 사감에게 들키지 않게 해 준 고마운 사람으로."
        - "토마스는 계단을 뛰어 올라가다가, 중간에 한 번 돌아봤다. 눈가는 빨갛고, 입꼬리는 조금 올라가 있었다."
        - 속마음: "(착한 녀석이다. 그래서 더 마음에 걸린다.)"
    - text: 못 본 척 지나간다
      lines:
        - "발소리를 죽이고 계단참을 지나쳤다. 토마스는 나를 보지 못했다. 아니, 못 본 척해 주었는지도 모른다."
        - "물을 받아 방으로 돌아왔다."
        - "누웠다. 물컵은 그대로 책상 위에 있다. 마시지 않았다."
        - "울음소리는 계단을 타고 오래 이어졌다. 그러다 어느 순간 끊겼다."
        - "끊긴 뒤의 조용함이 더 오래 귀에 남았다."
        - when: "perk.고인물의기억 or perk.공략위키편집자"
          속마음: "(원작대로라면, 저 아이에게 남은 시간은 반년도 안 된다.)"
        - 속마음: "(모든 사람을 구할 수는 없다. 그건 3,000시간 동안 배운 거다.)"
        - 속마음: "(…그런데 왜 이렇게 목이 마르지.)"
        - "아침. 토마스는 아무 일도 없었다는 얼굴로 맨 뒷자리에 앉아 있었다. 눈만 조금 부어 있었다."

- id: dorm_letter
  title: 편지 쓰는 날
  on: 휴식
  pool: true
  window: { from: "1.3.2", to: "1.7" }
  slots: [방과후, 주말]
  chance: 0.5
  lines:
    - "매점에서 편지지를 샀다. 은화 한 닢짜리, 가장자리에 들꽃이 찍힌 종이."
    - "매점 아주머니가 '연애편지?' 하고 웃었다. 아니라고 했는데도 들꽃 무늬 쪽을 더 권했다."
    - "책상 앞에 앉았다. 창으로 들어온 볕이 종이 위에 네모나게 내려앉는다."
