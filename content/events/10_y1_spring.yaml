        lines:
          - "압력판을 하나하나 피해 통로를 빠져나갔다. 체력이 넉넉히 남았다."
          - "징검다리를 건너듯 한 칸, 두 칸. 발밑에서 아무 소리도 나지 않았다."
          - "마지막 판을 넘자, 등 뒤에서 참았던 숨이 한꺼번에 터졌다."
          - when: "lab.partner == 'liana'"
            리아나@웃음: "봐! 우리 둘이 하면 미궁도 별거 아니네."
          - when: "lab.partner == 'bruno'"
            브루노@놀람: "와, 한 대도 안 맞았다. 너 여기 와 본 적 있냐?"
          - when: "lab.partner == 'aren'"
            아렌@웃음: "대단하다… 어떻게 그게 다 보여? 나였으면 첫 칸에서 죽었어."
          - 속마음: "(3,000시간짜리 눈이다. 공략보다 습관이 먼저 움직였다.)"
        effects: ["lab.clean = 1"]
      fail:
        lines:
          - "발밑에서 딸깍 소리. 쏟아진 화살을 겨우 피했다."
          - "바닥에 몸을 던졌다. 화살 깃이 머리카락을 스치며 맞은편 벽에 박힌다."
          - "타다닥, 타다닥. 빗소리 같은 소리가 한참 이어지다 멎었다."
          - "일어나 보니 무릎이 까졌고, 심장이 귀에서 뛴다."
          - when: "lab.partner == 'bruno'"
            브루노@당황: "괜찮냐?! 아이고, 참말로 화살 비가 오네!"
          - 속마음: "(원작에선 체력 바가 조금 깎이고 끝이었다. 체력 바가 깎인다는 게 이런 거였구나.)"
        effects: ["fatigue += 20", "stress += 10"]
      great:
        lines:
          - "마지막 판 옆, 벽 아래 틈에 무언가 반짝였다. 앞 조가 떨어뜨린 은화 몇 닢."
          - 속마음: "(함정 통로의 숨은 보상. 원작에도 있던 위치다. 여기만은 배치가 같았다.)"
        effects: ["money += 5"]
    - text: 힘으로 밀고 나간다
      lines:
        - "통로 입구에 부서진 나무 문짝 하나가 기대어 있다. 앞 조가 버리고 간 것 같다."
        - 속마음: "(살피는 건 시간이 걸린다. 그럼 맞으면서 가는 수밖에.)"
        - when: "lab.partner == 'bruno'"
          브루노@웃음: "오, 그거 좋다! 문짝은 내가 받칠게. 넌 바짝 붙어!"
      check:
        type: 완력
        dc: 보통
        mods:
          - { when: "lab.partner == 'bruno'", value: 5, label: 브루노의 등 }
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      success:
        lines:
          - "방패처럼 문짝을 뜯어 들고 화살비를 뚫고 지나갔다."
          - "딸깍, 딸깍, 딸깍. 밟는 족족 함정이 터지고, 화살이 문짝에 북처럼 박힌다."
          - "팔이 저리고 어깨가 비명을 지른다. 그래도 멈추지 않았다."
          - "통로 끝에 닿았을 때, 문짝은 고슴도치가 되어 있었다."
          - when: "lab.partner == 'bruno'"
            브루노@웃음: "하하하! 봤냐! 이게 대장장이식 함정 해제다!"
          - when: "lab.partner == 'liana'"
            리아나@놀람: "…무식한데 멋있다. 아니, 무식해."
          - 속마음: "(근력이 곧 공략이다. 원작 커뮤니티의 오래된 격언이다.)"
        effects: ["lab.clean = 1", "stat.근력 += 1"]
      fail:
        lines:
          - "화살 하나가 어깨를 스쳤다. 따끔하다."
          - "문짝이 생각보다 무거웠다. 반쯤 왔을 때 팔이 내려갔고, 그 틈으로 화살이 들어왔다."
          - "교복 어깨가 찢어지고 붉은 줄이 그어졌다. 깊지는 않다."
          - when: "lab.partner == 'aren'"
            아렌@당황: "피, 피 나! 괜찮아? 붕대, 붕대 어디 있지?"
          - "통로 끝에 주저앉아 숨을 골랐다. 남은 힘이 반도 안 된다."
          - 속마음: "(3층은 아직인데. 벌써 이러면 곤란하다.)"
        effects: ["fatigue += 25"]
      fumble:
        lines:
          - "주저앉고 나서야 알았다. 화살 하나가 종아리에 박혀 있었다. 깃털만 삐죽 나와 있다."
          - "조교가 달려와 화살을 뽑았다. 비명이 통로 끝까지 울렸다. 내 비명이었다."
          - 조교: "뼈는 안 다쳤다. 3층까지 갈 거면 이 악물어."
        effects: ["fatigue += 10", "stress += 5"]
    - text: 마법으로 함정을 해제한다
      requires: "stat.마력제어 >= 18"
      lines:
        - "바닥에 손바닥을 댔다. 돌은 차갑고, 압력판 밑 장치가 마력으로 희미하게 울린다."
        - 속마음: "(압력판도 결국 돌이다. 돌을 굳히면 밟아도 안 눌린다.)"
        - when: "lab.partner == 'aren'"
          아렌: "내 마력 좀 보탤게. 성검이 다 빨아가서 얼마 안 되지만…"
      check:
        type: 마법
        dc: 보통
        mods:
          - { when: "lab.partner == 'aren'", value: 4, label: 아렌의 마력 }
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      success:
        lines:
          - "마력을 흘려 압력판을 한꺼번에 굳혔다."
          - "손바닥에서 퍼진 빛이 이음매를 따라 거미줄처럼 번지더니, 돌바닥 전체가 한 덩어리가 됐다."
          - "그 위를 걸어서 지나갔다. 그냥, 걸어서."
          - when: "lab.partner == 'aren'"
            아렌@놀람: "…이게 돼? 이게 되는 거였어?"
          - when: "lab.partner == 'random'"
            동기@놀람: "너 D반 맞아? 진짜로?"
          - 속마음: "(1학년이 쓰면 이런 반응이구나. 솔직히, 기분 좋다.)"
        effects: ["lab.clean = 1", "stat.마력제어 += 1"]
      fail:
        lines:
          - "마력이 엇나가 함정이 한꺼번에 발동했다. 다 같이 엎드렸다."
          - "굳히려던 마력이 오히려 압력판 서른 개를 한꺼번에 눌러 버렸다."
          - "통로 전체에서 화살이 쏟아졌다. 머리 위로 바람 소리가 한참 지나갔다."
          - when: "lab.partner == 'liana'"
            리아나@당황: "……다음엔 나한테 먼저 물어봐 줄래?"
          - "먼지를 털고 일어나니 다들 머리에 돌가루를 뒤집어쓰고 있었다."
          - 속마음: "(마력 제어가 아직 이 몸에 안 붙었다. 머리는 아는데 손이 모른다.)"
        effects: ["fatigue += 20", "stress += 10"]
    - text: 이음매만 골라 디디며 소리 없이 건넌다
      when: "synergy.그림자 >= 1 or talent.짐승의혈통 or talent.고양이반사신경"
      lines:
        - "횃불을 조원에게 맡겼다. 빛이 없어도 된다. 바닥의 결이 발바닥으로 읽힌다."
        - "판과 판 사이, 손가락 한 마디 너비의 이음매. 거기만 디디면 아무것도 눌리지 않는다."
        - when: "talent.짐승의혈통"
          나레이션: "코끝에 기름 냄새가 걸린다. 화살 장치에 바른 기름이다. 냄새가 진한 판은 피하면 된다."
        - 속마음: "(원작에선 이런 루트가 없었다. 이 몸이라서 보이는 길이다.)"
      check:
        type: 기민
        dc: 보통
        mods:
          - { when: "lab.partner == 'liana'", value: 2, label: 리아나의 귀 }
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      success:
        lines:
          - "발끝, 발끝, 뒤꿈치는 들고. 고양이가 담장을 걷듯 통로를 건넜다."
          - "끝에 닿아 돌아보니, 함정은 하나도 깨어나지 않았다."
          - "조원들을 손짓으로 불렀다. 내가 디딘 자리만 그대로 밟고 오라고."
          - when: "lab.partner == 'bruno'"
            브루노@당황: "이음매? 내 발이 이음매보다 세 배는 큰데? …아, 발끝으로. 발끝으로."
          - when: "lab.partner == 'aren'"
            아렌@놀람: "소리가 하나도 안 났어. 너 원래 그렇게 걸어?"
          - when: "lab.partner == 'liana'"
            리아나@웃음: "발소리가 나보다 작아. 하프엘프 체면이 말이 아니네."
          - when: "lab.partner == 'random'"
            동기@놀람: "…너 혹시 도둑 집안이야? 아, 아냐. 칭찬이야."
          - 속마음: "(가장 조용한 공략법. 3층을 위해 힘은 한 방울도 안 썼다.)"
        effects: ["lab.clean = 1", "stat.민첩 += 1"]
      fail:
        lines:
          - "열한 번째 이음매에서 뒤꿈치가 반 치 미끄러졌다. 딸깍."
          - "몸을 비틀어 바닥에 붙였다. 화살 두 개가 등 위를 스치고 지나갔다."
          - "다행히 화살은 그 두 개뿐이었다. 나머지 판은 끝까지 잠잠했다."
          - when: "lab.partner == 'liana'"
            리아나@당황: "거의 다 왔는데! …괜찮아? 소리 하나도 안 내다가 갑자기 딸깍이라니."
          - "교복 등판에 구멍 두 개. 바람이 숭숭 들어온다."
          - 속마음: "(이 정도면 싸게 막았다. 몸은 아는데, 아직 발이 덜 익었다.)"
        effects: ["fatigue += 15", "stress += 5"]

- id: lab_floor3
  title: 미궁 3층 — 횃불 아래의 문양
  art: labyrinth
  lines:
    - "3층으로 내려가는 계단 중간에서 공기가 바뀌었다."
    - "축축한 냉기 대신, 미지근하고 끈적한 공기. 오래된 동전 같은 쇠 냄새."
    - "벽을 짚으며 내려가는데, 돌이 이상하게 미지근하다. 사람 체온처럼."
    - "아무도 말을 하지 않았다. 발소리만 계단에 부딪혀 두 배로 돌아온다."
    - when: "lab.clean"
      나레이션: "2층을 깔끔하게 넘긴 덕에 다리는 아직 가볍다. 그런데 이상하게, 그게 위안이 안 된다."
    - when: "not lab.clean"
      나레이션: "2층에서 깎인 체력에 무릎이 시큰거린다. 계단 한 칸 한 칸이 무겁다."
    - when: "talent.겁쟁이"
      나레이션: "숨 쉴 때마다 쇠 냄새가 폐 끝까지 들어온다. 다리가 계단을 거부한다."
    - when: "died.미궁그림자 or died.미궁심연"
      속마음: "(이 계단. 이 미지근한 벽. 몸이 먼저 기억하고 식은땀을 흘린다.)"
    - "올라오던 다른 조와 계단참에서 엇갈렸다. 다들 얼굴이 하얗다."
    - 학생 B: "(지나가며) 3층 벽에 이상한 거 있어. 보지 마. 보면 꿈에 나와."
    - "횃불이 이유 없이 한쪽으로 기운다. 바람은 불지 않는데."
    - "모퉁이를 돌자, 횃불 빛이 벽의 한 곳에서 멈췄다."
    - "3층. 횃불 아래 벽면에 낯선 문양이 그려져 있다."
    - "원 안에 뒤집힌 눈. 검붉은 선이 돌벽에 스며들 듯 말라붙어 있다."
    - "안료라기엔 색이 너무 탁하다. 가까이 가자 쇠 냄새가 진해졌다."
    - when: "talent.마력감응"
      나레이션: "문양 앞에서 피부가 따끔거렸다. 입학식 날 성검 옆을 지날 때와 정반대다. 차갑고, 배고픈 감각."
    - when: "talent.직감"
      나레이션: "머릿속에서 경보가 울린다. 이 그림 앞에 오래 서 있지 마라."
    - when: "lab.partner == 'liana'"
      리아나@진지: "…싫어. 이거 싫어. 벽 안쪽에서 아무 소리도 안 나. 죽은 것처럼."
    - when: "lab.partner == 'bruno'"
      브루노@당황: "뭐야 이거. 낙서치곤 너무 기분 나쁜데. 지우고 갈까?"
    - when: "lab.partner == 'aren'"
      아렌@진지: "이 그림… 처음 보는데, 이상하게 보면 안 될 걸 본 것 같아."
    - when: "lab.partner == 'random'"
      동기@당황: "야, 야. 이거 그냥 선배들 장난이지? 그치?"
    - when: "note.note_cult_mark.known"
      속마음: "(교단 문양? 원작에선 가을에 처음 나오는 건데. 벌써?)"
    - when: "note.note_cult_mark.known"
      속마음: "(공략 노트와 다르다. 원작보다 빠르다. …내가 뭘 건드려서일까.)"
    - when: "know.cult_early"
      속마음: "(들었던 얘기가 있다. 3층에서 로브 입은 사람들이 뭔가를 그리고 다닌다고.)"
    - when: "not note.note_cult_mark.known and not know.cult_early"
      속마음: "(튜토리얼 던전에 이런 그림이 있었던가? 기억에 없다.)"
    - "손끝으로 건드려 보려다 멈췄다. 이건 건드리면 안 되는 종류다."
    - "문양 아래 바닥에, 무언가를 질질 끈 자국이 통로 안쪽으로 이어져 있다."
    - when: "perk.데이터마이너"
      속마음: "(3층 맵 데이터에서 안쪽 통로는 '미사용 구역'이었다. …전혀 미사용이 아니네.)"
    - "3층 계단참의 조교는 하품을 하고 있었다. 이 벽 쪽으로는 눈길도 주지 않는다."
    - 조교: "3층 도착 확인. 표식 찍고 올라가. 안쪽 통로는 출입 금지다. 줄 쳐 놨지?"
    - 나: "조교님. 저 벽 그림, 원래 있던 거예요?"
    - 조교: "그거? 지난주 점검 땐 없었는데. 선배들 장난이겠지."
    - 조교@당황: "…근데 저거, 물로 안 지워지더라. 아무튼 장난이야. 장난."
    - 속마음: "(물로 안 지워지는 장난. 그런 장난은 없다.)"
    - "천장에서 물방울 하나가 목덜미로 떨어졌다. 미지근했다."
    - "안쪽 통로 입구엔 낡은 밧줄 하나가 대충 걸쳐져 있다. 허리만 숙이면 넘어갈 높이."
    - "도착 표식은 벽에 박힌 쇠판이었다. 조 번호를 새긴 나무패를 거기 걸면 된다."
    - "나무패를 걸었다. 덜컥, 쇠판이 울리는 소리가 통로 안쪽까지 길게 퍼져 나갔다."
    - "그리고 아주 잠깐, 통로 안쪽에서 무언가 대답하듯 울린 것 같았다."
    - when: "lab.partner == 'liana'"
      리아나: "…빨리 올라가자. 여기 오래 있으면 귀가 아파."
    - when: "lab.partner == 'bruno'"
      브루노: "올라가자. 여기 공기, 불 꺼진 화로 냄새 같아. 기분 나빠."
    - when: "lab.partner == 'aren'"
      아렌: "…올라가자. 왠지 여기 오래 있으면 안 될 것 같아."
    - when: "lab.partner == 'random'"
      동기: "표식 찍었지? 찍었지? 그럼 가자, 빨리!"
    - "다른 조들이 도착 표식을 찍고 하나둘 계단을 오른다. 웃음소리가 위로 멀어진다."
    - 속마음: "(3층 찍고 귀환. 원작 튜토리얼은 여기서 끝났다. 클리어 화면, 보상 상자, 다음 날 아침.)"
    - 속마음: "(그런데 그 '다음 날 아침'에, 누군가는 돌아오지 않았다.)"
    - "횃불이 또 기울었다. 이번엔 분명히, 통로 안쪽을 향해서."
  plants:
    - { id: F03, notice: { value: "stat.지성 + 15 * know.cult_early", dc: 22 } }
  branch:
    - when: "origin == '악역도련님'"
      next: lab_edric_self
    - next: lab_edric_other

- id: lab_edric_other
  title: 혼자 들어간 에드릭
  art: blood_circle
  lines:
    - "도착 표식을 찍고 돌아서는데, 시야 끝에 검은 머리가 스쳤다."
    - "에드릭 벨모어. 혼자다. 조원은 어디 갔는지 보이지 않는다."
    - "그가 밧줄을 들어 올리고, 허리를 숙여 그 아래로 들어갔다."
    - "에드릭이 혼자 안쪽 통로로 들어간다. 아무도 말리지 않는다."
    - "걸음이 이상했다. 서두르지도 망설이지도 않는, 누가 부르는 쪽으로 가는 걸음."
    - "고개를 조금 기울이고 있었다. 무언가에 귀를 기울이는 사람처럼."
    - 학생 A: "벨모어 또 혼자 잘난 척이네. 냅둬, 혼나 봐야 알지."
    - when: "edric.hostile"
      나레이션: "식당에서 나를 노려보던 붉은 눈이, 지금은 나를 스쳐 가면서도 나를 보지 않았다."
    - when: "edric.contact"
      나레이션: "식당에서 말을 걸었던 그 녀석이다. 이름을 부르면 돌아볼까. 목소리가 목에 걸린다."
    - when: "note.note_edric.known"
      속마음: "(원작에선 저기서 시체로 발견된다.)"
    - when: "note.note_edric.known"
      속마음: "(원작에선 딱 한 줄이었다. 다음 날 아침 게시판 공지. 스킵하면 1초.)"
    - when: "not note.note_edric.known"
      속마음: "(출입 금지라던 통로다. 저 녀석, 왜 혼자…)"
    - when: "lab.partner == 'bruno'"
      브루노@당황: "어? 저 도련님, 거기 들어가면 안 되는 데 아냐?"
    - when: "lab.partner == 'aren'"
      아렌@진지: "저 사람… 식당에서 봤던 그 사람이지? 혼자 저기 가면 위험할 텐데."
    - when: "lab.partner == 'liana'"
      리아나@진지: "저 안쪽, 소리가 이상해. 누가 속삭이는 소리. …사람 목소리가 아닌 것 같아."
    - when: "lab.partner == 'random'"
      동기: "야, 우리 올라가자. 괜히 엮이지 말고."
    - "통로 안쪽에서 바람이 불어왔다. 미지근하고, 쇠 냄새가 났다."
    - "조교는 여전히 계단참에서 하품을 하고 있다. 위로 올라가는 발소리들이 멀어진다."
    - when: "lab.partner == 'random'"
      속마음: "(동기 둘은 벌써 계단 쪽이다. 따라 들어가면, 저 안에서는 나 혼자다.)"
    - when: "lab.partner == 'random'"
      속마음: "(혼자 싸워서 지면 거기서 끝이다. 저 원은 쓰러진 사람을 그냥 두지 않을 거다.)"
    - when: "talent.직감"
      나레이션: "목덜미가 차갑게 곤두선다. 저 통로 끝에서 진 사람은, 돌아오지 못한다."
    - when: "died.미궁그림자"
      속마음: "(기억난다. 혼자 들어갔다가, 저 원 위에서 눈을 감았다. 손끝이 아직 차갑다.)"
    - when: "talent.마왕의흔적"
      나레이션: "안쪽의 속삭임에 가슴 안쪽이 욱신거린다. 성검 앞에서와 정반대로. 무언가 반가워하듯이."
    - 속마음: "(따라가면 원작에 없던 싸움이 기다린다. 가만히 있으면 원작대로 끝난다. …시간이 없다.)"
  choices:
    - text: 따라간다
      art: cg_blood_circle
      lines:
        - "밧줄 아래로 몸을 숙였다. 횃불 하나를 쥐고, 통로 안쪽으로 뛰었다."
        - "통로는 생각보다 길었다. 벽의 문양이 점점 촘촘해지고, 쇠 냄새가 점점 진해진다."
        - "모퉁이를 돌자 횃불이 필요 없어졌다. 바닥이 스스로 빛나고 있었다."
        - "통로 끝, 바닥에 피로 그린 원. 로브 입은 그림자가 에드릭의 목덜미를 쥐고 있다."
        - "검붉은 원은 맥박처럼 밝아졌다 어두워졌다 한다. 그 한가운데, 에드릭이 무릎을 꿇고 있다."
        - "눈은 뜨고 있는데 아무것도 보고 있지 않다. 입술만 작게 움직인다. 누군가를 부르는 것처럼."
        - "그림자의 얼굴은 보이지 않았다. 후드 안쪽엔 어둠만 고여 있다."
        - "그림자가 천천히 고개를 돌렸다. 나를 봤다. 아니, 나를 재고 있었다."
        - '???': "……하나 더."
        - when: "lab.partner == 'bruno' or lab.partner == 'aren' or lab.partner == 'liana'"
          나레이션: "조원이 내 뒤를 따라 뛰어들었다."
        - when: "lab.partner == 'random'"
          나레이션: "뒤를 돌아봤다. 동기 둘의 횃불은 이미 계단 위로 멀어지고 있었다."
        - when: "lab.partner == 'bruno'"
          브루노@화남: "뭐야 저건! 야, 그 손 놔!"
        - when: "lab.partner == 'aren'"
          아렌@진지: "…저 사람, 구해야 하는 거지? 맞지? 그럼 구하자."
        - when: "lab.partner == 'liana'"
          리아나@진지: "활은 내가 쏠게. 너는 앞만 봐."
        - when: "lab.clean"
          나레이션: "2층 함정을 깔끔하게 넘긴 덕에 숨이 차지 않는다."
        - when: "not lab.clean"
          나레이션: "2층에서 깎인 체력이 다리를 무겁게 한다. 그래도 물러설 수 없다."
        - 속마음: "(튜토리얼 던전에 이런 몹은 없었다. 이건 원작에 없는 전투다.)"
        - "그림자가 에드릭을 원 안에 내려놓았다. 로브 자락 아래로 단검이 번뜩인다."
      plants:
        - { id: F04, notice: { value: "stat.지성", dc: 12 } }
      battle:
        enemy: cult_shadow
