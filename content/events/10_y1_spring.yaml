        effects: ["stress += 5"]
    - text: 마법 실기
      art: magic_lab
      lines:
        - "둘째 날. 마법 실습실 천장 아래 표적 다섯 개가 둥둥 떠 있다."
        - "표적은 천천히, 제멋대로 움직인다. 엘베라가 창가에서 차를 마시며 지켜본다."
        - 엘베라@웃음: "다섯 개 다 맞히면 만점. 실습실 태우면 영점이에요. 작년엔 영점이 둘이었죠."
        - when: "synergy.마도사 >= 1"
          나레이션: "표적이 움직이기 전에 마력의 결이 먼저 흔들린다. 어디로 꺾일지 손끝이 안다."
