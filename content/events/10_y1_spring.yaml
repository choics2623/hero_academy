          - "진흙에 발이 잠겨 반 박자 늦었다. 그 반 박자에, 목이 어깨가 됐다."
          - "남은 허수아비 셋은 순서대로 쳤다. 이미 늦은 순서였다."
          - 가렌: "다음."
          - "그 한마디가 열 마디 꾸중보다 무거웠다."
          - 속마음: "(진흙 탓은 하지 말자. 가렌은 아마 진흙 위에서 싸워 온 사람일 테니까.)"
      great:
