    - 속마음: "(이게 원작대로 흘러가게 둔다는 거구나. 화면 밖에선 이런 얼굴이었구나.)"
    - "마차가 언덕 아래로 사라졌다. 바람에 벚꽃잎만 남았다."
    - 속마음: "(하나를 놓쳤다. …다음 건 놓치지 않는다.)"

- id: y1_dorm
  title: 기숙사 배정
  art: dorm_room
  on: auto
  at: "1.3.1.주말"
  priority: 10
  lines:
    - "입학 첫 주의 주말. 기숙사 배정표가 붙는 날이다."
    - "트렁크 바퀴가 복도마다 덜컹거린다. 어디선가 누가 벌써 훌쩍이고 있다."
    - "기숙사는 두 동. 언덕 위의 귀족 동과, 그 아래 평민 동."
    - 속마음: "(원작에선 기숙사 배정이 텍스트 한 줄이었다. '당신은 평민 동에 배정되었습니다.' 끝.)"
  branch:
    - when: "origin == '악역도련님'"
      lines:
        - "벨모어가가 미리 잡아둔 1인실. 하인까지 딸려 있다."
        - "문을 열자 장미 향이 훅 끼친다. 본가에서 보낸 침구, 은촛대, 벽에 걸린 가문 문장."
        - "방 두 개를 합친 크기다. 벽을 튼 자리가 아직 새하얗다."
        - 하인: "도련님, 짐은 모두 풀어 두었습니다. 찻물도 데워 두었고요."
        - "하인은 나와 눈을 맞추지 않는다. 대답을 마치자마자 문 옆으로 물러나 벽처럼 선다."
        - when: "servant.trust >= 2"
          나레이션: "그래도 찻잔을 내려놓는 손이, 예전처럼 떨리지는 않는다."
        - 속마음: "(이러니까 미움받지.)"
        - 속마음: "(원작의 에드릭은 이 방에서 1학기를 다 못 채웠다. 5월에 죽었으니까.)"
        - "복도로 나왔다. 지나가던 평민 동기들이 나를 보고 일제히 벽에 붙는다."
        - "옆방 덩치 큰 평민 학생이 복도에서 나를 보고 움찔한다. 브루노라고 했던가."
        - "어깨가 문틀에 꽉 찰 만큼 큰 덩치. 그 덩치가 트렁크를 끌어안고 한 걸음 물러선다."
        - 브루노@당황: "어, 어… 안녕하십니까. 아니, 안녕… 하세요?"
        - 속마음: "(원작의 에드릭이라면 여기서 '비켜, 평민' 했겠지.)"
        - 나: "…안녕. 옆방이지? 잘 부탁해."
        - "브루노의 눈이 동그래졌다. 트렁크를 놓칠 뻔했다."
        - 브루노@놀람: "어? 어. 그, 그래. 잘 부탁… 해."
        - "그는 방에 들어가자마자 문을 닫았다. 문 너머에서 쿵, 무언가 넘어지는 소리."
        - 브루노: "(문 너머로) 벨모어가 인사했어… 나한테 인사했다고…!"
        - 속마음: "(첫 대화치고는 나쁘지 않다. 적어도 트렁크는 무사하니까.)"
        - "그날 밤, 넓은 방은 지나치게 조용했다. 벽 너머 웃음소리만 가끔 새어 들었다."
      effects: ["met.bruno = 1"]
    - when: "origin == '몰락귀족'"
      lines:
        - "귀족 동 맨 끝 방. 창문이 잘 안 닫힌다."
        - "복도 끝으로 갈수록 카펫이 얇아지더니, 내 방 앞에선 아예 맨 나무 바닥이다."
        - "침대 하나, 책상 하나. 그리고 3월 바람이 그대로 들이치는 창 하나."
        - "옆방 하인이 짐을 나르며 내 문패를 흘끗 본다. 가문 이름에서 눈이 잠깐 멈춘다."
        - 속마음: "(몰락한 가문의 이름은, 이름이 없는 것보다 무겁다.)"
        - "창틀을 아무리 밀어도 한 뼘이 남는다. 경첩이 녹슬어 비틀렸다."
        - "밤이면 얼어 죽겠다 싶어 씨름하는데, 아래에서 목소리가 올라왔다."
        - 브루노: "거기! 그거 그렇게 밀면 안 돼! 경첩 나간다!"
        - "창밖 마당에서 덩치 큰 소년이 손나팔을 하고 있다. 평민 동 교복이다."
        - "대답할 새도 없이 그가 사라졌다가, 잠시 뒤 내 방 문을 두드렸다. 손에 망치를 들고."
        - 브루노@웃음: "브루노야. 평민 동. 지나가다 보니까 창문이랑 싸우고 있길래."
        - 브루노: "귀족 동에 망치 들고 와도 되나? …뭐, 걸리면 그때 생각하지."
        - "그는 경첩을 뜯어 녹을 손바닥으로 문지르고, 망치로 세 번 두드렸다."
        - "창문이 딸깍, 하고 처음으로 제대로 닫혔다."
        - "창문을 고쳐준 건 지나가던 평민 동의 덩치, 브루노였다."
        - 나: "고마워. 사례는… 지금은 줄 게 없는데."
        - 브루노@웃음: "사례는 무슨! 대장장이 아들이 녹슨 경첩 보고 그냥 가면 할아버지한테 혼나."
        - 브루노: "다음에 밥이나 같이 먹자. 귀족 동 밥은 맛있냐? 평민 동은 맨날 감자다."
        - 속마음: "(브루노. 원작에선 6년차 수도 습격 때… 아니, 지금 그 생각은 하지 말자.)"
        - "망치를 어깨에 걸치고 휘파람을 불며 돌아가는 넓은 등을, 창 너머로 오래 봤다."
      effects: ["affinity.bruno += 5"]
    - lines:
        - "평민 동 2인실. 룸메이트는 덩치 큰 소년이다."
        - "문을 열자마자 방의 절반이 사람이었다. 정확히는, 사람 등이었다."
        - "2층 침대 아래 칸에 쪼그려 앉은 덩치가 침대 다리를 붙잡고 끙끙대고 있다."
        - "침대가 기울어 있다. 다리 하나가 짧다."
        - 브루노@놀람: "어! 왔냐! 잠깐만, 이것만 하고. 이 침대가 절름발이야."
        - "그는 주머니에서 쇳조각을 꺼내 침대 다리 밑에 끼우고, 주먹으로 쾅 내리쳤다."
        - "침대가 수평이 됐다. 그리고 방 전체가 한 번 흔들렸다."
        - 브루노@웃음: "브루노야! 대장장이 아들. 너 팔 힘 좋냐? 내일 망치 좀 들어줄래?"
        - 나: "망치? 기숙사에서 뭘 두드리게."
        - 브루노: "창틀, 문고리, 옷걸이. 여기 쇠붙이는 죄다 엉망이더라. 참말로."
        - when: "origin == '숲고아'"
          브루노: "근데 너한테서 나무 냄새 난다. 숲에서 왔냐? 좋은 냄새네."
        - when: "origin == '엑스트라'"
          브루노: "이름이 뭐라고? …어, 미안. 방금 들었는데 까먹었다. 한 번만 더."
        - when: "origin == '평민장학생'"
          브루노: "장학생이라며? 머리 좋은 놈이랑 한 방 쓰네. 숙제는 내가 망치로 갚을게."
        - "그는 아래 칸을 차지하고 누웠다. 발이 침대 밖으로 한 뼘 삐져나왔다."
        - 브루노: "위 칸 써. 내가 위로 가면 침대가 무너진다. 대장장이로서의 판단이야."
        - "트렁크를 풀었다. 창밖 언덕 위로 귀족 동의 불빛이 줄지어 있다."
        - 속마음: "(브루노. 원작에선 그냥 '힘 센 친구 1'이었다. 이렇게 시끄러운 줄은 몰랐다.)"
        - "불을 끄자 1분도 안 돼서 아래 칸에서 코 고는 소리가 났다. 침대가 그 박자에 맞춰 삐걱인다."
        - 속마음: "(…10년 동안 이 소리를 들으며 자야 하나.)"
        - "이상하게, 싫지 않았다."
      effects: ["affinity.bruno += 10"]

- id: y1_first_class
  title: 첫 실기 수업
  art: classroom
  on: auto
  at: "1.3.2.방과후"
  priority: 10
  announce: 첫 실기 수업
  effects: ["met.garen = 1", "met.elvera = 1"]
  lines:
    - 삽화: training_ground
    - "입학 둘째 주. 아침 안개가 아직 연무장 바닥에 깔려 있다."
    - "반 배정 결과는 D반이었다. 시험 점수와 상관없이, 처음부터 정해져 있던 자리처럼."
    - "1교시 검술. 흉터투성이 교관이 목검을 바닥에 내리꽂는다."
    - "쿵. 목검이 흙바닥에 손가락 두 마디만큼 박혔다. 잡담이 뚝 끊긴다."
    - "짧게 깎은 회색 머리. 얼굴을 가로지르는 오래된 흉터."
    - 가렌@진지: "가렌이다. 검을 쥐는 법부터 다시 배운다. 너희가 아는 건 전부 틀렸다."
    - 학생 A: "(속닥) 전부요? 저 기사 집안인데…"
    - 가렌: "전부."
    - "그 한마디에 기사 집안 학생이 입을 다물었다."
    - 속마음: "(가렌 교관. 원작에선 5년차 장벽 전투에서 죽는다. 아렌이 무너지는 첫 계단이다.)"
    - 속마음: "(위키 별명은 '칭찬 미구현 NPC'. 대사 데이터에 칭찬 문장이 하나도 없었다.)"
    - "가렌은 한 시간 내내 목검 쥐는 법만 시켰다. 휘두르기는 한 번도 없었다."
    - "손바닥에 물집이 잡힐 무렵 종이 울렸다."
    - 삽화: classroom
    - "2교시 마법학. 계단식 강의실에 봄볕이 비스듬히 든다."
    - "은발의 엘프 교수가 칠판에 대륙사를 적는다. 분필 소리가 느긋하다."
    - "길고 뾰족한 귀 끝에서 작은 귀걸이가 흔들린다. 몇몇 학생이 넋을 놓고 본다."
    - 엘베라@웃음: "엘베라예요. 마법학이요. 나이는 묻지 마세요. 나도 세다가 잊어버렸으니까."
    - "웃음이 터졌다. 농담인지 아닌지는 아무도 몰랐다."
    - 엘베라: "마법은 역사부터예요. 왜 마법이 지금 모양이 됐는지 알아야 하니까요."
    - 엘베라: "천 년 전, 마왕 이그니스… 님, 아니. 이그니스가 봉인되었죠."
    - "교실이 잠깐 웅성거렸다. 엘베라는 아무 일 없다는 듯 수업을 이어간다."
    - 학생 B: "(속닥) 방금 '님'이라고 했지?"
    - 학생 A: "(속닥) 잘못 들었겠지. 엘프는 말끝이 길잖아."
    - 속마음: "(…님? 못 들은 척하자. 엘프식 말버릇일 수도 있으니까.)"
    - "분필이 칠판 위에서 잠깐 멈췄다가, 다시 움직였다."
    - 엘베라: "자, 오늘은 시범을 보여줄 학생이 필요해요. 가렌 교관님도 검술 시범을 원하시던데."
    - "언제 왔는지, 강의실 뒷문에 가렌이 팔짱을 끼고 서 있다."
    - 가렌: "한 명. 아침에 물집 제일 적게 잡힌 놈."
    - "앞줄의 백금발은 미동도 없다. 3황자 카이든. 자원할 생각도, 피할 생각도 없는 얼굴."
    - "그 뒷줄, 밀짚색 머리의 아렌은 손바닥 물집을 감추느라 바쁘다."
    - 속마음: "(손을 들까, 지켜볼까. 첫 수업의 인상은 1년 내내 따라다닌다.)"
  plants:
    - { id: F11, notice: { value: "stat.지성 + 15 * perk.고인물의기억", dc: 22 } }
  choices:
    - text: 검술 시범에 자원한다
      lines:
        - "손을 들었다. 가렌의 눈이 나를 훑는다. 위에서 아래로, 한 번."
        - 가렌: "나와. 연무장으로."
        - "반 전체가 우르르 창밖 연무장으로 따라 나왔다. 엘베라 교수까지 찻잔을 들고."
        - "목검을 받아 허수아비 앞에 섰다. 아침에 배운 대로, 엄지를 감고."
        - when: "origin == '몰락귀족'"
          나레이션: "어릴 적 가문 기사에게 배운 자세가 손목에 남아 있다. 녹슬었지만, 아직 있다."
      check:
        type: 완력
        dc: 보통
        mods:
          - { when: "origin == '몰락귀족'", value: 2, label: 가문 검술 }
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      success:
        lines:
          - "허수아비의 어깨가 쩍 소리를 내며 갈라졌다."
          - "연무장이 조용해졌다. 구경하던 누군가 휘파람을 불다 말았다."
          - 가렌@진지: "…자세는 엉망인데 힘은 있군. 이름."
          - 나: "{{if origin == '악역도련님'}}에드릭 벨모어입니다{{else}}{{player.name}}입니다{{/if}}."
          - 가렌: "외우진 않는다. 쓸 만하면 저절로 외워진다."
          - 속마음: "(칭찬 미구현 NPC가 이름을 물었다. 위키에 올리면 편집 전쟁 난다.)"
        effects: ["affinity.garen += 8", "reputation += 5"]
      fail:
        lines:
          - "목검이 손에서 미끄러졌다. 웃음소리."
          - "목검은 데굴데굴 굴러 구경하던 엘베라 교수의 발치에서 멈췄다. 엘베라가 공손히 주워 돌려준다."
          - "웃음소리가 더 커졌다."
          - 가렌: "기본부터다. 내일 아침 다섯 시."
          - 나@당황: "다섯 시요? 해도 안 뜨는데요."
          - 가렌: "그러니까 다섯 시다."
          - 속마음: "(첫 수업부터 새벽 보충 플래그. 자랑은 아니다.)"
        effects: ["affinity.garen += 3", "stress += 5"]
      great:
        lines:
          - "한 박자 늦게, 허수아비의 머리가 데구루루 굴러떨어졌다. 아무도 숨을 쉬지 않았다."
          - 가렌: "…내일 아침 다섯 시. 너는 보충이 아니라 시범 조교다."
          - 속마음: "(칭찬인지 벌인지 모르겠다. 아마 둘 다다.)"
        effects: ["affinity.garen += 2"]
      fumble:
        lines:
          - "엘베라가 돌려준 목검을 받다가, 또 놓쳤다. 이번엔 손바닥이 아니라 손목에서."
          - "목검이 빙글빙글 날아 연무장 담장을 넘어갔다. 담장 너머에서 닭이 울었다."
          - 가렌: "주워 와라. 닭한테 사과하고."
        effects: ["stress += 3"]
    - text: 마법 시범에 자원한다
      lines:
        - "손을 들었다. 엘베라가 반가운 듯 눈을 가늘게 뜬다."
        - 엘베라: "좋아요. 손끝에 불꽃 하나. 크지 않아도 돼요. 예쁘기만 하면."
        - "숨을 들이쉬고, 몸 안의 마력을 손끝 한 점으로 모았다."
        - when: "talent.마력폭주체질"
          속마음: "(이 몸은 긴장하면 마력이 날뛴다. 작게. 작게. 예쁘게.)"
      check:
        type: 마법
        dc: 보통
        mods:
          - { when: "stress >= 50", value: -2, label: 긴장 }
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      success:
        lines:
          - 나레이션:
              - "손끝에 작은 불꽃이 깔끔하게 맺혔다."
              - { when: "talent.마나탱크", text: "불꽃 대신 화염 기둥이 천장을 그을렸다. 엘베라가 박수를 친다." }
              - { when: "talent.무영창소질", text: "주문을 떠올리기도 전에 손끝에 불꽃이 피었다. 엘베라의 눈썹이 올라간다." }
          - 엘베라@웃음: "흥미로운 마력이네요. 수업 끝나고 잠깐 남을래요?"
          - "강의실이 웅성거렸다. 첫날부터 교수의 '남으세요'는, 칭찬일까 경고일까."
          - "엘베라는 내 손을 한참 들여다봤다. 손금이 아니라, 그 너머를 보는 눈이었다."
          - 속마음: "(원작에서 엘베라 개인 지도는 한참 뒤에야 열렸는데. 시작이 빠르다.)"
        effects: ["affinity.elvera += 8", "reputation += 5"]
      fail:
        lines:
          - "불꽃이 피식 꺼졌다."
          - "연기 한 줄기가 코앞에서 꼬불꼬불 올라갔다. 누군가 킥 웃었다."
          - "얼굴이 화끈거렸다. 손끝엔 그을음만 까맣게 남았다."
          - 엘베라: "괜찮아요. 처음엔 다 그래요."
          - 엘베라@웃음: "나도 처음엔 앞머리를 태웠어요. 아주 오래전 일이지만."
          - 속마음: "(아주 오래전이 몇백 년 전인지는 묻지 않기로 했다.)"
        effects: ["affinity.elvera += 3"]
      great:
        lines:
          - "불꽃이 손끝에서 꽃잎처럼 다섯 장으로 갈라졌다. 엘베라가 찻잔을 내려놓았다."
          - 엘베라@놀람: "……어머. 이 모양은 오랜만에 보네요. 아주, 오랜만에."
        effects: ["affinity.elvera += 2"]
      fumble:
        lines:
          - "꺼진 줄 알았던 불씨 하나가 앞줄 학생의 앞머리로 튀었다."
          - 학생 A@놀람: "앗, 뜨거! 내 앞머리!"
          - "엘베라가 손가락을 튕기자 연기가 사라졌다. 앞머리 한 줌과 함께."
          - 엘베라@웃음: "봐요. 다들 처음엔 앞머리를 태운다니까요. 남의 것이든, 자기 것이든."
        effects: ["stress += 3"]
    - text: 조용히 관찰한다
      lines:
        - "손을 들지 않았다. 의자 깊숙이 등을 붙이고 강의실을 둘러봤다."
        - when: "origin == '엑스트라'"
          속마음: "(아무도 나를 안 본다. 그러니 나는 전부를 볼 수 있다. 엑스트라의 특권이다.)"
      check:
        type: 통찰
        dc: 쉬움
        mods:
          - { when: "origin == '엑스트라'", value: 2, label: 배경의 눈 }
      success:
        lines:
          - "다른 학생들의 시범을 지켜봤다. 아렌은 검을 쥐는 손이 떨렸다."
          - "성검 앞에서처럼, 어쩔 줄 모르는 손이었다."
          - "카이든은 교관보다 자세가 좋았다. 가렌이 아무 말도 하지 않은 게 그 증거였다."
          - "마법 시범에선 붉은 머리 소녀가 손가락 하나로 불꽃 세 개를 띄웠다. 표정 하나 안 바꾸고."
          - 속마음: "(미라벨 폰 아델하이트. 원작 공략 대상. 첫 등장부터 콧대가 하늘을 찌른다.)"
          - 속마음: "(위키로 알던 걸 눈으로 다시 확인한다. 원작과 같은 것, 다른 것.)"
          - "노트 귀퉁이에 적었다. ─ 아렌: 손 떨림. 카이든: 빈틈 없음. 빨간 머리: 위험."
        effects: ["stat.지성 += 2"]
      fail:
        lines:
          - "시범을 지켜보려 했다. 그런데 엘베라 교수의 귀걸이가 자꾸 눈에 걸린다."
          - "흔들, 흔들. 저 귀걸이도 몇백 년 됐을까. 그럼 저 귀는…"
          - "정신을 차려 보니 시범은 이미 끝나 있었다. 박수 소리만 들었다."
          - 학생 B: "(속닥) 방금 봤어? 빨간 머리 애, 손가락 하나로 불꽃 세 개."
          - 나: "…어. 봤지. 당연히."
          - 속마음: "(못 봤다. 3,000시간짜리 눈이 귀걸이 하나에 졌다.)"
          - "노트 귀퉁이엔 '귀걸이'라고만 적혀 있었다."
        effects: ["stat.지성 += 1"]
      great:
        lines:
          - "하나가 더 보였다. 카이든이 목검을 내려놓을 때, 왼팔을 쓰지 않았다."
          - "아주 잠깐, 오른손이 왼쪽 어깨를 감쌌다가 떨어졌다. 아무도 못 봤을 것이다."
          - "노트에 한 줄을 더 적었다. ─ 카이든: 왼쪽 어깨?"
          - 속마음: "(공략 노트에 있던 버릇이다. 벌써 저랬구나.)"
        effects: ["know.kaiden_shoulder = 1"]

# ---------------------------------------------------------------- 4월: 동아리와 결투

- id: y1_club_fair
  title: 동아리 박람회
  art: campus
  on: auto
  at: "1.4.1.방과후"
  priority: 10
  announce: 동아리 박람회
  lines:
    - "4월 첫 주. 벚꽃이 반쯤 지고, 연두색 잎이 그 자리를 채우기 시작했다."
    - "중앙 광장에 동아리 천막이 늘어섰다. 하나만 고를 수 있다."
    - "천막마다 깃발이 펄럭이고, 상급생들이 목이 쉬어라 신입생을 부른다."
    - "구운 감자를 나눠 주는 천막, 마법으로 비눗방울을 띄우는 천막, 북을 치는 천막."
    - 상급생: "미궁 탐사부! 지도 그리는 법 알려준다! 살아서 돌아오는 법도!"
    - 선배: "마법 연구회는 실력순이야. 자신 없으면 그냥 지나가."
    - 속마음: "(원작에선 메뉴 화면에서 버튼 하나로 끝났다. 이렇게 시끄러운 줄은 몰랐다.)"
    - 속마음: "(동아리는 1년짜리 선택이다. 누구를 매주 만나느냐가 여기서 정해진다.)"
    - "광장 가장자리, 유리 온실 앞에 작은 천막. 손글씨 팻말이 비뚤게 꽂혀 있다."
    - "─ 원예부. 아무나 환영. 진짜 아무나."
    - "천막 뒤에서 하프엘프 소녀가 화분을 안고 서성인다. 지나가는 사람마다 말을 걸려다 만다."
    - "광장 한복판엔 사람이 가장 많은 천막. 검술부. 3황자 카이든이 팔짱을 끼고 서 있다."
    - "황자를 구경하러 온 줄인지 입부하러 온 줄인지 모를 줄이 길다."
    - "분수대 옆, 잉크 냄새 나는 천막에서 안경 쓴 상급생이 손짓한다. 신문부다."
    - 부장: "거기 너! 소문 좋아해? 소문 만드는 건?"
    - 속마음: "(셋 중 하나. 결국 누구 곁에 설지 고르는 일이다.)"
  choices:
    - text: 원예부 (온실에 하프엘프 소녀가 있다)
      effects: ["club = '원예부'", "affinity.liana += 5"]
      lines:
        - "온실 천막 앞에 서자, 소녀가 안고 있던 화분을 떨어뜨릴 뻔했다."
        - "연둣빛 도는 머리카락 사이로, 뾰족한 귀 끝이 빨갛게 물들어 있다."
        - 리아나@놀람: "어, 어? 입부? 진짜로? 구경 말고?"
        - 리아나@웃음: "어서 와! 신입 부원이 진짜 올 줄은 몰랐어."
        - 리아나: "나 리아나야. 1학년. 부원은… 나랑 3학년 원예부장님 둘뿐이야."
        - when: "talent.자연친화력"
          나레이션: "온실의 덩굴이 내 쪽으로 슬그머니 고개를 돌린다. 리아나가 눈을 동그랗게 뜬다."
        - 리아나: "온실은 좀 덥고, 흙도 묻고, 벌레도 가끔 나와. 그래도 괜찮지?"
        - when: "note.note_liana.known"
          속마음: "(리아나. 거의 모든 루트에서 2학년 여름에 죽는 아이.)"
        - 속마음: "(웃는 얼굴이 원작 일러스트보다 훨씬 서툴다. 그래서 더 진짜 같다.)"
        - "입부 명부에 이름을 적었다. 두 줄짜리 명부의 세 번째 줄이었다."
      branch:
        - when: "origin == '숲고아'"
          lines:
            - "명부를 덮자 리아나가 코를 킁킁거렸다. 그러더니 눈이 동그래졌다."
            - 리아나@놀람: "…너한테서 숲 냄새 나. 진짜 숲. 이끼랑, 비 온 다음 날 냄새."
            - 나: "숲에서 컸어. 꽤 오래."
            - 리아나@웃음: "그럼 우리 비슷한 데서 왔네! 같은 숲은 아니겠지만, 비슷한 데!"
            - "리아나가 온실 구석에서 제일 잘 자란 화분 하나를 골라 내 품에 안겼다."
            - 리아나: "입부 선물. 숲 사람한테는 아무 화분이나 못 주지."
          effects: ["affinity.liana += 2"]
    - text: 검술부 (3황자 카이든이 있다)
      effects: ["club = '검술부'", "affinity.kaiden += 3"]
      lines:
        - "검술부 줄 끝에 섰다. 줄은 생각보다 빨리 줄었다. 절반은 카이든 얼굴만 보고 갔으니까."
        - 검술부장: "입부 시험은 없어. 대신 첫 달에 절반이 그만둬."
        - when: "talent.천생신력 or talent.거구"
          검술부장@놀람: "…너는 안 그만두겠다. 목검 말고 통나무 휘둘러 볼래? 그게 더 어울리겠는데."
        - when: "synergy.검사 >= 1"
          나레이션: "걸이에 걸린 목검들을 보자 손바닥이 근질거린다. 어느 게 균형이 좋은지 손이 먼저 안다."
        - "명부를 내밀자 카이든이 내 이름과 교복을 차례로 흘끗 본다."
        - 카이든:
            - "평민도 받아준다니, 검술부도 많이 변했군."
            - { when: "origin == '악역도련님'", text: "벨모어가 검을 든다니, 검술부도 많이 변했군." }
            - { when: "origin == '몰락귀족'", text: "이름만 남은 가문까지 받아준다니, 검술부도 많이 변했군." }
        - 검술부장@당황: "황자 전하, 신입한테 그렇게 말씀하시면…"
        - 카이든@진지: "사실을 말했을 뿐이다. 검은 출신을 묻지 않는다. 그러니 나도 더는 안 묻지."
        - "카이든은 그 말만 남기고 연습장으로 걸어갔다. 등이 꼿꼿하다."
        - 속마음: "(카이든 아스테라. 원작 대부분의 루트에서 반역자로 처형되는 황자.)"
        - 속마음: "(그런 사람이 '검은 출신을 묻지 않는다'고 했다. 원작에 저런 대사가 있었던가.)"
    - text: 신문부 (소문이 모이는 곳)
      effects: ["club = '신문부'"]
      lines:
        - "잉크 냄새 나는 천막 안으로 들어서자 안경 쓴 부장이 벌떡 일어났다."
        - 부장@웃음: "어서 와. 오늘부터 기자다. 첫 취재는… 무투대회 우승 후보 조사!"
        - 나: "입부 서류는요?"
        - 부장: "서류? 그건 기사 다 쓰고 생각하자. 신문부는 마감이 먼저야."
        - "부장이 내 손에 수첩과 연필 한 자루, 그리고 '기자' 완장을 쥐여 준다."
        - 부장: "소문은 식당에서, 진실은 제보함에서. 제보함은 매주 비우고."
        - 속마음: "(신문부. 원작에선 소문 시스템이 열리는 동아리다. 정보는 이 게임에서 제일 비싼 아이템이고.)"
        - 속마음: "(무투대회 우승 후보라. 답은 이미 안다. 카이든이다. …원작대로라면.)"
        - when: "talent.달변"
          부장@웃음: "너 말 잘하게 생겼다. 인터뷰 담당 확정! 거절은 마감 뒤에 받을게."
      branch:
        - when: "talent.완전기억"
          lines:
            - "부장이 지난 호 신문 뭉치를 책상에 쌓아 두고 나갔다. 표지만 훑을 생각이었다."
            - "정신을 차려 보니 3년 치 제보 목록이 머릿속에 줄 맞춰 들어와 있었다."
            - 부장@놀람: "…너 방금 그거 다 읽은 거야? 넘기기만 한 줄 알았는데."
            - 속마음: "(완전기억. 이 동아리에선 거의 치트다.)"
          effects: ["intel += 1"]

- id: y1_duel
  title: 카이든과 아렌의 결투
  art: cg_kaiden_glove
  on: auto
  at: "1.4.2.방과후"
  priority: 10
  lines:
    - "4월 둘째 주의 오후. 중앙 광장 분수대 앞."
    - "햇살이 따뜻해서 학생들이 잔디에 앉아 빵을 먹고 있다. 평화로운 오후였다."
    - "그 평화가 흰 장갑 하나로 깨졌다."
    - "중앙 광장. 카이든이 아렌의 발 앞에 장갑을 던진다."
    - "툭. 장갑이 흙먼지를 일으키며 아렌의 낡은 구두 앞에 떨어진다."
    - 학생들: "결투다…! 3황자가 결투를 신청했어!"
    - "빵을 먹던 학생들이 순식간에 둥글게 원을 만든다."
    - 카이든@화남: "성검이 반응했다고 용사라도 된 줄 아나, 평민."
    - 아렌@당황: "저, 저는 용사라고 한 적 없는데요. 다들 그렇게 부르는 거지…"
    - 카이든: "그러니까. 남들이 부르니 그런 줄 알고 있겠지."
    - 카이든@진지: "성검은 장식이 아니다. 그걸 쥘 자격이 있는지, 검으로 증명해라."
    - "아렌이 장갑을 내려다본다. 주먹이 쥐어졌다 펴졌다 한다."
    - 아렌@진지: "…검으로요. 알겠어요. 줍겠습니다."
    - "아렌이 장갑을 집어 들었다. 원 안의 공기가 팽팽해진다."
    - when: "origin == '악역도련님'"
      속마음: "(원작에서 이 결투를 부추긴 게 에드릭, 즉 나였지.)"
    - when: "origin == '악역도련님'"
      속마음: "(원작의 에드릭은 카이든 귀에 '평민 주제에 성검이라니요' 하고 속삭였다. 지금 내 입은 다물려 있다.)"
    - 속마음: "(카이든 대 아렌. 원작 1권의 명장면이다.)"
    - 속마음: "(그리고 아렌의 성격이 처음으로 기우는 장면. 여기서 누가 손을 내미느냐가 갈림길이다.)"
    - "누군가 목검 두 자루를 던져 줬다. 카이든은 한 손으로, 아렌은 두 손으로 받았다."
    - "자세부터 달랐다. 카이든은 교본 그 자체였고, 아렌은 양치기 지팡이를 쥔 것 같았다."
    - 속마음: "(끼어들까, 지켜볼까. 아렌이 어떤 사람이 될지가 이 한 판에 걸려 있다.)"
  choices:
    - text: 둘 사이에 끼어들어 말린다
      requires: "stat.의지 >= 12"
      effects: ["aren.kind += 1", "affinity.kaiden -= 3"]
      lines:
        - "원 안으로 걸어 들어갔다. 구경꾼들의 숨소리가 멎는다."
        - "두 목검 사이에 섰다. 카이든의 검끝이 내 코앞에서 멈췄다."
        - 카이든@화남: "비켜라. 네 결투가 아니다."
        - 나@진지: "검 쥔 지 한 달 된 사람이랑 십 년 된 사람의 결투가, 증명이 됩니까?"
        - when: "club == '검술부'"
          나레이션: "카이든의 눈썹이 아주 조금 움직였다. 도장에서 매일 보던 얼굴이라는 걸 알아본 눈이다."
      check:
        type: 설득
        dc: 보통
        mods:
          - { when: "club == '검술부'", value: 3, label: 검술부원 }
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      success:
        lines:
          - 나: "자격을 보고 싶으면 무투대회에서 보세요. 거기선 아무도 안 말립니다."
          - "카이든의 금빛 눈이 가늘어졌다. 한참 나를 보더니, 목검을 내렸다."
          - 카이든: "흥. 배짱은 있군."
          - "그는 장갑을 주워 들고 원 밖으로 걸어 나갔다. 학생들이 홍해처럼 갈라진다."
          - 아렌@웃음: "…고마워. 너, 이름이 뭐야?"
          - when: "origin == '악역도련님'"
            아렌@놀람: "잠깐, 그 문장… 벨모어가? 벨모어가 왜 날 도와줘?"
          - 나: "{{if origin == '악역도련님'}}에드릭. …그냥, 그러고 싶었어{{else}}{{player.name}}. 너랑 같은 1학년{{/if}}."
          - 아렌@웃음: "나는 아렌. 양 치다 왔어. …방금 진짜 무서웠어. 다리가 아직 떨려."
          - 속마음: "(원작엔 없던 장면이다. 아렌의 웃는 얼굴이, 원작보다 조금 빨리 왔다.)"
        effects: ["affinity.aren += 10", "trust.kaiden += 5"]
      fail:
        lines:
          - 카이든: "증명은 검으로 한다. 입으로 하는 게 아니라."
          - "카이든의 목검이 움직였다. 보지도 못했다. 어깨에 가볍게 닿았을 뿐인데, 무릎이 꺾였다."
          - "흙바닥에 한쪽 무릎을 꿇었다. 구경꾼들 사이에서 웃음이 샜다."
          - 카이든@진지: "말로 막을 수 있는 건 여기까지다. …흥. 김이 샜군."
          - "카이든은 장갑을 주워 들고 원 밖으로 나갔다. 결투는 그렇게 흐지부지 끝났다."
          - "아렌이 다가와 손을 내밀었다. 손바닥이 굳은살투성이였다."
          - 아렌@당황: "괜찮아? 나 대신 맞은 거잖아. …너, 이름이 뭐야?"
          - 나: "{{if origin == '악역도련님'}}에드릭. …무릎은 괜찮아{{else}}{{player.name}}. 무릎은 괜찮아{{/if}}."
          - 아렌@웃음: "나는 아렌. 다음엔 내가 대신 맞을게. 그럼 공평하지?"
          - 속마음: "(폼은 안 났다. 그래도 결투는 멈췄고, 아렌은 혼자가 아니었다.)"
        effects: ["affinity.aren += 7", "stress += 5"]
      great:
        lines:
          - "그날 저녁, 본관 복도에서 카이든과 엇갈렸다. 그가 먼저 걸음을 멈췄다."
          - 카이든: "…무투대회에서 보자고 했지. 너도 나와라. 말로 끝내지 말고."
          - 속마음: "(황자가 먼저 대회 얘기를 꺼냈다. 원작 텍스트에 없는 문장이다.)"
        effects: ["trust.kaiden += 3"]
    - text: 지켜본다
      art: cg_aren_alone
      effects: ["aren.cold += 1"]
      lines:
        - "원 바깥에 그대로 서 있었다. 다른 학생들처럼."
        - when: "synergy.검사 >= 1"
          속마음: "(세 합이면 끝난다. 손목이 먼저 계산했다. 계산이 맞는 게 싫다.)"
        - when: "talent.눈치없음"
          속마음: "(…근데 다들 왜 이렇게 심각하지? 연습 대련 아닌가.)"
        - "결투는 길지 않았다. 세 합. 카이든의 목검이 아렌의 손목을 쳤고, 아렌의 목검이 흙바닥을 굴렀다."
        - "네 번째 합은 없었다. 카이든은 등을 돌렸다."
        - 카이든: "이게 성검이 고른 검인가. 실망이군."
        - "아렌은 지고, 아무도 손을 내밀지 않았다. 원작대로."
        - "학생들이 하나둘 흩어진다. 웃는 소리, 혀 차는 소리, 금방 잊는 소리."
        - "해 질 녘까지, 아렌은 혼자 그 자리에 앉아 있었다. 흙 묻은 목검을 무릎에 올려놓고."
        - 아렌@슬픔: "……"
        - "그러다 이를 악물었다. 턱에 힘줄이 섰다."
        - 속마음: "(이 장면에서 아렌은 처음으로 이를 악문다.)"
        - 속마음: "(원작에선 BGM이 깔리는 멋진 장면이었다. 화면 밖에서 보니, 그냥 혼자 우는 애다.)"
    - text: 카이든 편을 든다
      effects: ["aren.arrogant += 1", "affinity.kaiden += 10", "affinity.aren -= 5"]
      lines:
        - 나: "황자 말이 맞아. 검은 검으로 증명하는 거지."
        - "원 안의 시선이 일제히 나에게 쏠렸다."
        - "카이든이 처음으로 나를 똑바로 봤다. 입꼬리가 아주 조금 올라간다."
        - 카이든: "보는 눈이 있군."
        - when: "talent.귀공자의품격"
          나레이션: "가볍게 고개를 숙이자, 카이든도 같은 각도로 턱을 당겼다. 같은 예법을 배운 사람끼리의 인사."
        - "결투는 세 합 만에 끝났다. 흙바닥을 구른 아렌의 목검이 내 발치에서 멈췄다."
        - "아렌이 고개를 들어 나를 봤다."
        - 아렌@슬픔: "……"
        - "그 눈엔 원망도 없었다. 그냥, '너도 그렇구나' 하는 눈이었다."
        - 속마음: "(힘이 곧 자격이라는 말을, 아렌도 오늘 배웠다. 언젠가 그 말이 아렌의 입에서 다시 나올 거다.)"
    - text: (에드릭으로서) 부추기지 않고 자리를 뜬다
      when: "origin == '악역도련님'"
      effects: ["edric.reformed += 1", "aren.kind += 1"]
      lines:
        - "카이든이 원 밖을 한 번 훑었다. 누군가를 찾는 눈이다."
        - 속마음: "(원작에서 저 눈이 찾던 건 에드릭이었다. 등을 떠밀어 줄 사람.)"
        - "나는 등을 돌렸다. 구경꾼들 사이를 빠져나와 광장을 벗어났다."
        - "뒤에서 목검 부딪는 소리가 두어 번 났다. 그리고 금방 잠잠해졌다."
        - "결투는 시시하게 끝났다. 누군가 부추기지 않으면 카이든도 거기까지였다."
        - "저녁에 들으니, 카이든이 두 합 만에 목검을 거두고 '오늘은 됐다'고 했단다."
        - "아렌은 졌지만, 흙바닥을 구르지는 않았다고."
        - 속마음: "(에드릭 벨모어가 하지 않은 일 하나. 누군가에겐 상처 하나가 덜 생긴 일이다.)"

- id: edric_bully
  title: 식당의 에드릭
  on: 식당
  window: "1.4"
  priority: 1
  when: "origin != '악역도련님'"
  lines:
    - "점심시간의 학생 식당. 감자 스튜 냄새와 수백 개의 숟가락 소리."
    - "식판을 받아 들고 자리를 찾는데, 와장창 소리가 났다."
    - "식당 구석. 에드릭 벨모어가 아렌의 식판을 엎었다."
    - "스튜가 아렌의 교복 바지에 튀었다. 빵 한 덩이가 굴러와 내 발치에서 멈춘다."
    - "단정히 빗어 넘긴 검은 머리, 붉은 눈. 귀에 단 보석 귀걸이가 반짝인다."
    - 에드릭@화남: "평민 주제에 귀족 테이블 근처에서 밥을 먹어?"
    - 아렌@당황: "빈자리가 여기밖에 없어서… 귀족 테이블인 줄 몰랐어요."
    - 에드릭: "몰랐어? 그럼 이제 알았겠네. 꺼져."
    - "에드릭 뒤에서 귀족 자제 둘이 킥킥댄다. 정작 에드릭은 웃지 않는다."
    - "식당이 조용해졌다. 다들 숟가락을 든 채 구경만 한다."
    - when: "note.note_edric.known"
      속마음: "(한 달 뒤 미궁에서 죽을 녀석이다.)"
    - when: "note.note_edric.known"
      속마음: "(원작 위키의 에드릭 항목은 세 줄이었다. 악역. 괴롭힘. 사망.)"
    - "그런데 이상했다. 식판을 엎은 손이, 아주 조금 떨리고 있었다."
    - 속마음: "(끼어들면 에드릭의 적이 된다. 말을 걸면… 저 녀석이 어떤 얼굴을 할지 모르겠다.)"
  choices:
    - text: 막아선다
      effects: ["affinity.edric -= 10", "edric.hostile = 1", "met.edric = 1"]
      lines:
        - "빵을 주워 들고, 아렌과 에드릭 사이에 섰다."
        - 나: "밥 먹는 데 귀족 평민이 어디 있어. 식판 다시 받아 와, 아렌."
        - when: "affinity.bruno >= 15"
          나레이션: "등 뒤에서 의자 끄는 소리. 브루노가 식판을 내려놓고 일어섰다. 말없이, 크게."
      check:
        type: 위압
        dc: 보통
        mods:
          - { when: "affinity.bruno >= 15", value: 2, label: 브루노가 뒤에 }
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      success:
        lines:
          - "에드릭의 붉은 눈이 나를 훑었다. 교복 휘장, 신발, 얼굴 순서로."
          - 에드릭@화남: "넌 또 뭐야? …두고 보자."
          - "에드릭은 의자를 한 번 걷어차고 식당을 나갔다. 귀족 자제 둘이 허겁지겁 따라간다."
          - 아렌@웃음: "고마워. 근데… 너 괜찮아? 저 사람 벨모어가잖아."
          - 나: "괜찮아. 저쪽이 더 안 괜찮을걸."
          - 속마음: "(에드릭에게 적으로 찍혔다. 한 달 뒤 저 녀석을 구하려 할 때, 이게 발목을 잡을지도.)"
        effects: ["affinity.aren += 5"]
      fail:
        lines:
          - "에드릭의 붉은 눈이 나를 훑었다. 그리고, 웃었다. 처음 보는 웃음이었다."
          - 에드릭: "평민 편 드는 영웅 놀이? 그럼 같이 먹어."
          - "그가 남은 스튜 그릇을 기울였다. 미지근한 감자가 내 교복 앞섶을 타고 흘렀다."
          - "귀족 자제 둘이 손뼉을 치며 웃었다. 식당 여기저기서 킥킥 소리가 샜다."
          - 에드릭@화남: "다음엔 그릇째다. 두고 보자."
          - "에드릭은 의자를 걷어차고 나갔다. 나가는 손이, 아까보다 더 떨리고 있었다."
          - 아렌@당황: "괜, 괜찮아? 내 손수건… 아, 이것도 스튜 묻었다."
          - "둘이 나란히 스튜 범벅이 된 채 식판을 다시 받으러 갔다. 배식 아주머니가 국자를 든 채 웃었다."
          - 속마음: "(폼은 안 났다. 그래도 아렌 옆엔 섰다.)"
        effects: ["affinity.aren += 3", "stress += 5"]
      great:
        lines:
          - "식당 여기저기서 박수가 몇 번 터졌다가, 다들 머쓱하게 멈췄다."
          - 학생 A: "(속닥) 벨모어한테 저렇게 말하는 사람 처음 봐."
        effects: ["reputation += 3"]
    - text: 에드릭에게 말을 건다
      requires: "stat.매력 >= 13 or talent.귀공자의품격"
      effects: ["edric.contact = 1"]
      lines:
        - "아렌 쪽이 아니라, 에드릭 쪽으로 걸어갔다."
        - 나: "벨모어. 스튜 맛없지? 여긴 맨날 감자야."
      check:
        type: 설득
        dc: 쉬움
        mods:
          - { when: "stress >= 60", value: -2, label: 굳은 얼굴 }
      success:
        lines:
          - "에드릭의 표정이 굳었다. 욕을 하려던 입이 그대로 멈췄다."
          - 에드릭@당황: "…뭐야. 나한테 먼저 말 거는 놈은 처음이네."
          - 나: "그래? 그럼 내가 처음이네."
          - 에드릭: "…흥. 이상한 놈."
          - "에드릭은 그 말만 남기고 자리를 떴다. 귀족 자제 둘은 두고, 혼자서."
          - "그 틈에 아렌은 조용히 식판을 다시 받으러 갔다."
          - 속마음: "(이 녀석, 사실 그냥 외로운 거였구나.)"
          - 속마음: "(떨리던 손. 아무도 먼저 말을 걸어 주지 않는 벨모어가 도련님.)"
        effects: ["affinity.edric += 10"]
      fail:
        lines:
          - "에드릭의 표정이 굳었다. 그리고 금세 비웃음으로 바뀌었다."
          - 에드릭@화남: "뭐야. 동정이냐? 네가, 나한테?"
          - 나: "동정 아니야. 그냥 감자가 맛없어서."
          - 에드릭: "……이상한 놈. 꺼져."
          - "에드릭은 귀족 자제들을 끌고 식당을 나갔다. 문 앞에서, 아주 잠깐 뒤를 돌아봤다."
          - "그 틈에 아렌은 조용히 식판을 다시 받으러 갔다."
          - 속마음: "(문은 닫혔다. 그런데 손잡이는 아직 쥐고 있다. 그런 얼굴이었다.)"
        effects: ["affinity.edric += 4"]
      great:
        lines:
          - "다음 날 점심. 에드릭이 내 맞은편에 식판을 내려놓았다. 말없이."
          - 에드릭: "…감자. 오늘도."
          - 나: "오늘도."
          - "대화는 그게 전부였다. 그래도 그 녀석은 끝까지 그 자리에서 먹었다."
        effects: ["affinity.edric += 3"]
    - text: 모른 척한다
      lines:
        - "숟가락을 들었다. 스튜를 한 입 떠먹었다. 아무 맛도 나지 않았다."
        - when: "talent.겁쟁이"
          나레이션: "숟가락을 쥔 손이 떨렸다. 겁이 나서였다. 그게 더 비참했다."
        - "아무도 움직이지 않았다."
        - "아렌은 말없이 바닥에 쏟아진 감자를 손으로 주워 식판에 담았다."
        - "에드릭은 그걸 내려다보다가, 흥 하고 돌아섰다. 웃지는 않았다."
        - "식당은 금방 다시 시끄러워졌다. 아무 일도 없었다는 듯이."
        - 속마음: "(원작에서도 이 장면엔 아무도 없었다. 나도 그 '아무도' 중 하나가 됐다.)"

- id: liana_greenhouse_1
  title: 온실의 리아나
  art: cg_liana_greenhouse
  on: 온실
  priority: 1
  lines:
    - "방과후의 원예부 온실. 유리 지붕을 통과한 햇빛이 초록빛으로 데워져 있다."
    - "흙냄새, 젖은 이끼 냄새, 어딘가에서 꽃이 피는 단 냄새."
    - "문을 열자 습기가 훅 끼쳐서 눈을 두어 번 깜빡였다."
    - 나레이션:
        - "리아나가 시든 화분 앞에 쪼그려 앉아 있다."
        - { when: "talent.혐오스러운분위기", text: "리아나가 나를 보고 움찔한다. 화분 뒤로 반쯤 숨었다." }
    - "가는 손가락으로 흙을 조심조심 헤집는다. 갈색으로 말라 버린 잎이 바스락 떨어진다."
    - 나: "그거, 무슨 꽃이야?"
    - 리아나@놀람: "아, 왔구나! 미안, 인사도 못 했네."
    - 리아나: "은방울덩굴. 숲에선 바위틈에서도 잘 자라는 애야."
    - 리아나@슬픔: "이 아이, 아무리 해도 안 살아나. 숲에선 이런 적 없었는데."
    - 리아나: "물도 줬고, 햇빛 드는 데로 옮겨 봤고, 말도 걸어 봤어. …말 거는 건 웃지 마."
    - "리아나가 마른 잎 하나를 손바닥에 올려놓는다. 바스러질까 봐 숨도 크게 못 쉰다."
    - 리아나@슬픔: "여기 흙은 숲 흙이랑 달라. 너무 조용해. 아무 소리도 안 나."
    - 나: "흙에서 소리가 나?"
    - 리아나@웃음: "응. 숲에선 나. 뿌리끼리 수다 떠는 소리. …진짜야. 하프엘프 귀에만 들려서 그렇지."
    - 속마음: "(리아나. 원작 공략 대상 중, 엔딩까지 살아남는 루트가 거의 없는 아이.)"
    - 속마음: "(그런 아이가 지금, 화분 하나 때문에 울상이다.)"
    - 속마음: "(뭐라도 해 주고 싶다. 흙을 같이 갈든, 아니면 다른 방법이든.)"
  choices:
    - text: 같이 흙을 갈아준다
      effects: ["affinity.liana += 8", "trust.liana += 3"]
      lines:
        - "소매를 걷고 옆에 쪼그려 앉았다."
        - "화분을 엎어 굳은 흙을 손으로 부수고, 리아나가 건넨 부엽토를 섞었다."
        - "손톱 밑에 흙이 낀다. 차갑고, 조금 축축하고, 이상하게 기분이 좋다."
        - when: "talent.천생신력"
          나레이션: "굳은 흙을 부수다 화분 가장자리까지 쪼갰다. 리아나가 말없이 새 화분을 가져왔다."
        - 리아나: "뿌리는 건드리지 말고… 응, 그렇게. 아기 머리 쓰다듬듯이."
        - "흙을 다시 채우고 둘이 동시에 손을 털었다. 손끝이 잠깐 스쳤다."
        - 리아나@웃음: "…고마워. 너 손이 따뜻하다."
        - 리아나: "흙이 좋아하는 손이야. 엄마가 그런 손은 귀하다고 했어."
        - "덩굴은 여전히 시들어 있었다. 그래도 리아나는 화분을 볕 드는 자리로 옮기며 콧노래를 불렀다."
        - 속마음: "(호감도가… 아니, 그런 말로 부르기엔 저 콧노래가 너무 진짜다.)"
      branch:
        - when: "origin == '숲고아'"
          lines:
            - "손을 털다 말고, 부엽토 한 줌을 코에 대 봤다."
            - 나: "이거, 낙엽이 덜 삭았어. 숲에선 이끼를 한 겹 덮어서 한 달은 묵혀."
            - 리아나@놀람: "…너, 숲 사람이야? 그걸 어떻게 알아?"
            - 나: "숲에서 컸어. 흙 냄새는 잘 안 잊혀."
            - 리아나@웃음: "그럼 다음엔 네가 가르쳐 줘. 약속이야. 새끼손가락."
            - "흙 묻은 새끼손가락 두 개가 걸렸다. 리아나의 귀 끝이 빨개졌다."
          effects: ["affinity.liana += 2"]
    - text: 마력을 조금 흘려 넣어본다
      requires: "talent.자연친화력 or stat.마력제어 >= 15"
      lines:
        - "흙 위에 손바닥을 얹었다. 숨을 고르고, 실처럼 가는 마력을 뿌리 쪽으로 흘려보낸다."
        - when: "talent.자연친화력"
          나레이션: "손바닥 아래서 무언가 대답했다. 목마른 뿌리가 물을 찾듯 마력을 끌어당긴다."
      check:
        type: 마법
        dc: 보통
        mods:
          - { when: "talent.자연친화력", value: 4, label: 숲의 손 }
      success:
        lines:
          - "시든 잎 끝에 연두색이 번진다."
          - "연두색은 잎맥을 따라 천천히 올라가더니, 덩굴 끝에서 작은 싹 하나를 밀어 올렸다."
          - 리아나@놀람: "어, 어떻게 한 거야? 너 혹시… 엘프 피 섞였어?"
          - 나: "아니. 그냥, 얘가 목말라 보여서."
          - 리아나: "목말라 보여서…"
          - "리아나가 화분과 내 얼굴을 번갈아 봤다. 초록 눈이 반짝인다."
          - 리아나@웃음: "너, 원예부 들어오길 진짜 잘했다. 아니, 우리 원예부가 잘했다!"
          - 속마음: "(원작에서 이 화분은 끝까지 안 살아났다. 배경 소품이었으니까.)"
        effects: ["affinity.liana += 12", "trust.liana += 5", "liana.impressed = 1"]
      fail:
        lines:
          - "마력이 실이 아니라 물줄기처럼 쏟아졌다."
          - "덩굴이 움찔 떨더니, 잎 끝 하나가 까맣게 그을렸다."
          - 리아나@놀람: "앗, 앗! 뜨거워해! 손 떼, 손!"
          - "얼른 손을 뗐다. 탄 냄새가 온실의 단 냄새 사이로 퍼진다."
          - 나@당황: "…미안. 목말라 보여서 물을 준다는 게, 끓는 물을 부었네."
          - 리아나@웃음: "푸흡. 그 말 뭐야. …근데 봐, 뿌리 쪽 흙은 살짝 따뜻해졌어."
          - 리아나: "마음은 전해졌대. 다음엔 반만 줘. 아니, 반의반."
          - 속마음: "(마력 조절. 머리는 아는데 손이 아직 모른다.)"
        effects: ["affinity.liana += 6", "trust.liana += 3"]
      great:
        lines:
          - "싹이 하나 더 올라왔다. 그 끝에 쌀알만 한 하얀 꽃봉오리가 맺혔다."
          - 리아나@놀람: "꽃까지? 이 아이, 숲에서도 여름에나 꽃 피우는데…"
          - "리아나가 꽃봉오리 앞에서 숨을 참았다. 바람이라도 불면 날아갈까 봐."
        effects: ["affinity.liana += 2"]

- id: liana_greenhouse_2
  title: 리아나의 고향 이야기
  on: 온실
  priority: 1
  when: "fired.liana_greenhouse_1 and rank.liana >= 1"
  lines:
    - "비 갠 오후의 온실. 유리 지붕 위로 빗방울이 아직 굴러 내린다."
    - "리아나가 물뿌리개를 내려놓고, 은방울덩굴 화분 옆에 무릎을 끌어안고 앉았다."
    - 리아나: "있잖아. 너는 고향이 어디야?"
    - 나: "…멀리. 설명하기 어려운 곳."
    - 리아나@웃음: "뭐야, 비밀이야? 그럼 내 얘기부터 할게."
    - 리아나: "실바니엘 국경에 있는 작은 마을에서 왔어. 보름달이 뜨면 숲이 은색으로 빛나."
    - 리아나: "나무껍질도, 이끼도, 개울물도 전부. 꼭 숲 전체가 숨을 참고 있는 것 같아."
    - "리아나의 눈이 유리 지붕 너머, 여기선 보이지 않는 숲을 보고 있다."
    - "유리에 맺힌 물방울 하나가 리아나의 손등에 떨어졌다. 리아나가 그걸 손가락으로 굴린다."
    - 리아나: "엄마는 숲지기였어. 하프엘프인 나보다 숲 말을 훨씬 잘 알아들었지."
    - 리아나@슬픔: "거기선 월광초라는 꽃이 피는데… 엄마가 그걸 달여서 나한테 먹이곤 했어."
    - 리아나: "엄청 써. 혀가 저릴 만큼. 그래도 그거 먹은 밤엔 숨이 덜 찼어."
    - "말을 하다 말고, 리아나가 아차 하는 얼굴로 웃었다."
    - 리아나@웃음: "아, 어릴 때 얘기야. 감기를 자주 앓았거든. 지금은 멀쩡해."
    - "그 웃음이 너무 빨랐다."
    - when: "note.note_liana.known"
      속마음: "(월광초. 리아나의 심장을 고칠 수 있는 약재.)"
    - when: "note.note_liana.known"
      속마음: "(감기가 아니다. 원작에서 이 아이의 심장은 2학년 여름을 넘기지 못했다.)"
    - when: "not note.note_liana.known"
      속마음: "(감기라기엔, 숨이 찼다는 말이 너무 익숙하게 나왔다.)"
    - 나: "월광초. 이름 예쁘다."
    - 리아나@웃음: "그치? 꽃은 더 예뻐. 달빛을 먹고 피거든. 아침이 되면 시들어 버려."
    - 리아나: "아카데미 온 지 한 달인데, 아직 밤마다 숲 소리가 그리워. 너무 조용하면 잠이 안 와."
    - 리아나: "언젠가 보여줄게. 보름달 뜨는 숲, 진짜 예쁘다니까."
    - 리아나@웃음: "자, 이번엔 네 차례야. 너네 고향엔 뭐가 피어?"
    - 나: "…회색 건물. 밤에도 안 꺼지는 불빛. 꽃은, 잘 기억이 안 나."
    - 리아나: "뭐야 그게. 무서운 데네."
    - 리아나@웃음: "그래도 네가 거기서 왔으면, 나쁜 데는 아니었겠지."
    - 속마음: "(3,000시간을 모니터 불빛 앞에서 보낸 곳이다. 나쁜 데였는지는, 나도 모르겠다.)"
    - "리아나가 화분의 싹을 손끝으로 톡 건드렸다. 비 냄새가 온실 안으로 스며들었다."
    - 속마음: "(월광초. 그 이름을 마음속 노트 맨 앞장에 적어 두었다.)"
  effects: ["affinity.liana += 6", "know.moonherb = 1"]

- id: kaiden_sword
  title: 검술부의 카이든
  art: sword_club
  on: 검술부
  window: { from: "1.4", to: "1.7" }
  priority: 1
  lines:
    - "검술부 도장. 나무 바닥에 땀 냄새와 송진 냄새가 배어 있다."
    - "해 질 녘. 다른 부원들은 하나둘 목검을 걸어 두고 나갔다."
    - "남은 건 둘. 나와, 도장 한가운데서 같은 동작만 반복하는 카이든."
    - "백금발이 땀에 젖어 이마에 붙었다. 목검이 공기를 가르는 소리가 일정하다. 휙, 휙, 휙."
    - "카이든이 동작을 멈추고 나를 돌아봤다."
    - 카이든: "지켜봤다. 다들 사흘이면 목검을 내려놓던데, 넌 아직 있군."
    - 카이든:
        - "평민 중엔 그래도 네가 제일 낫군. 한 판 해라."
        - { when: "origin == '악역도련님'", text: "벨모어 치곤 그래도 네가 제일 낫군. 한 판 해라." }
        - { when: "origin == '몰락귀족'", text: "이름만 남은 가문 치곤 그래도 네가 제일 낫군. 한 판 해라." }
    - 나: "황자 전하랑요? 다치면 누가 책임집니까."
    - 카이든@진지: "다치는 놈이 책임진다. 검술부 규칙이다. 방금 내가 정했다."
    - "목검 하나가 공중을 날아왔다. 받아 들자 손바닥이 찌르르 울린다."
    - when: "know.kaiden_shoulder or note.note_kaiden_style.known"
      속마음: "(왼쪽 어깨. 강타를 쓸 때마다 감싼다. 그 순간 오른쪽 아래가 빈다.)"
    - when: "not know.kaiden_shoulder and not note.note_kaiden_style.known"
      속마음: "(교본 같은 검이다. 빈틈이 안 보인다. 그럼, 보일 때까지 버틴다.)"
    - 속마음: "(원작에선 대련 미니게임이었다. 패턴만 외우면 됐지. 지금은 손목이 먼저 외워야 한다.)"
    - "카이든이 검을 세웠다. 정석대로, 검끝이 내 미간을 겨눈다."
    - 카이든: "와라."
  battle:
    enemy: kaiden_spar
    win:
      lines:
        - "마지막 합. 카이든의 목검이 허공을 갈랐고, 내 목검이 그의 옆구리 앞에서 멈췄다."
        - "도장이 조용해졌다. 둘의 거친 숨소리만 남았다."
        - "카이든이 한참 내 목검 끝을 내려다봤다."
        - 카이든@화남: "…다음엔 진심으로 하겠다."
        - 나: "방금 건 진심 아니었습니까?"
        - 카이든: "……진심이었다. 그러니까 다음엔 더 진심으로 하겠다는 거다."
        - "대련 내내 카이든은 왼쪽 어깨를 감싸고 있었다."
        - "목검을 걸이에 걸 때도 그는 오른손만 썼다. 왼팔은 옆구리에 붙인 채로."
        - 속마음: "(숨기는 거다. 황자의 다친 어깨는, 보여 주는 순간 남의 칼이 된다.)"
        - 카이든: "오늘 일은 떠벌리지 마라. …내일도 남아라."
      effects: ["affinity.kaiden += 8", "trust.kaiden += 8", "know.kaiden_shoulder = 1"]
    lose:
      lines:
        - "목검이 손에서 튕겨 나갔다. 도장 바닥을 굴러 벽에 부딪힌다."
        - "카이든의 검끝이 내 목 앞에 멈춰 있었다. 숨 한 번 흐트러지지 않은 얼굴."
        - 카이든: "역시 이 정도인가. …그래도 마지막 한 수는 나쁘지 않았다."
        - "그가 손을 내밀었다. 잡고 일어서자 손아귀가 생각보다 단단했다."
        - 카이든@진지: "검은 거짓말을 안 한다. 넌 아직 약하고, 아직 안 꺾였다. 둘 다 사실이다."
        - "돌아서는 카이든의 왼쪽 어깨가 미세하게 처져 있었다."
        - "목검을 걸이에 걸 때, 그는 왼팔을 쓰지 않았다."
        - 속마음: "(이긴 쪽이 어깨를 감싸고, 진 쪽은 손목이 얼얼하다. …다음엔 저 어깨를 본다.)"
      effects: ["affinity.kaiden += 3", "know.kaiden_shoulder = 1", "stress += 5 * (1 + mod.stress)"]

- id: newspaper_rumor
  title: 신문부의 제보
  on: 신문부
  priority: 1
  repeat: 2
  cooldown: 2
  effects: ["intel += 1"]
  lines:
    - "신문부 동아리방. 잉크 냄새와 식은 차 냄새, 마감에 쫓기는 사람 특유의 냄새."
    - "부장이 책상 세 개를 이어 붙인 위에 엎드려 자고 있다. 뺨에 활자가 찍혔다."
    - "구석의 나무 제보함을 열었다. 이번 주 담당은 나다."
  branch:
    - when: "not know.cult_early"
      lines:
        - "대부분은 시시한 쪽지다. 기숙사 식단 불만, 고백 대신 전해 달라는 편지, 고양이 실종."
        - "그 사이에 접힌 모양이 다른 쪽지가 한 장 있었다. 여러 번 접었다 편 자국."
        - "제보함에 쪽지가 하나 있다. ─ 미궁 3층에서 로브 입은 사람을 봤어요."
        - "글씨가 떨린다. 쓰다가 몇 번 멈춘 듯, 잉크가 군데군데 뭉쳐 있다."
        - "이름은 없다. 뒷면에 작게, '선배들한테 말했는데 아무도 안 믿어요'."
        - 나: "부장님. 이거 보셨어요?"
        - 부장: "(엎드린 채) 으음… 미궁 유령 얘기? 매년 봄마다 와. 신입 겁주는 괴담이야."
        - 부장: "그런 건 기사 못 써. 증거가 없잖아. 증거가."
        - "부장은 다시 코를 골았다."
        - 속마음: "(로브. 미궁 3층. 원작에서 교단 흔적이 처음 나오는 건 1학년 가을이다.)"
        - 속마음: "(아직 봄인데. …그냥 괴담이면 좋겠다.)"
        - "쪽지를 접어 수첩 사이에 끼웠다. 버리기엔 글씨가 너무 떨리고 있었다."
      effects: ["know.cult_early = 1"]
    - lines:
        - "제보함엔 쪽지가 수북하다. 무투대회가 가까워지자 다들 정보통이 된 모양이다."
        - 부장@웃음: "(벌떡 일어나며) 우승 후보 기사! 다 됐어? 마감 이틀 남았어!"
        - "무투대회 우승 후보 취재. 카이든 황자가 왼쪽 어깨에 붕대를 감고 다닌다는 제보."
        - "쪽지 주인은 자기가 검술부원이라고 적었다. 탈의실에서 봤다고."
        - 부장: "오, 이거다. 황자의 부상! 이거면 1면이야."
        - 나: "…확인도 안 된 얘기잖아요."
        - 부장: "그러니까 네가 확인해 와. 기자는 발로 뛰는 거야. 난 머리로 뛰고."
        - when: "note.note_kaiden_style.known"
          속마음: "(왼쪽 어깨. 원작 공략에 있던 내용이다. 어릴 적 낙마로 다친 어깨.)"
        - 속마음: "(황자가 다친 어깨를 숨긴다. 형제가 있는 황궁에선, 약점이 곧 칼이니까.)"
        - "쪽지 내용을 수첩에 옮겨 적었다. 1면에 실을지는 나중에 생각하기로 했다."
        - 속마음: "(정보는 이 게임에서 제일 비싼 아이템이다. 그리고 제일 위험한 아이템이기도 하다.)"
      effects: ["know.kaiden_shoulder = 1"]

- id: finn_night
  title: 밤의 연무장
  on: 밤의연무장
  priority: 1
  repeat: 3
  cooldown: 1
  effects: ["affinity.finn += 8"]
  lines:
    - "밤의 연무장. 달빛이 흙바닥에 하얗게 고여 있다."
    - "소등 종이 울린 지 한참. 풀벌레 소리와, 바람 가르는 소리."
    - "연무장 한구석, 빗자루 대신 낡은 목검을 쥔 소년이 혼자 움직이고 있다."
  branch:
    - when: "fired.finn_night >= 2"
      lines:
        - "오늘은 핀이 먼저 대련을 하자고 했다. 처음 있는 일이다."
        - 핀@웃음: "오, 오늘은… 진짜로 해 봐요. 봐주지 말고요."
        - "핀의 목검은 빨랐다. 막는 게 아니라, 막을 자리를 미리 알고 거기 가 있는 검."
        - "세 합, 네 합. 숨이 턱까지 찬다."
        - "대련 중 핀의 목검이 내 손등을 스쳤다. 피가 한 방울 맺힌다."
        - 나: "아, 괜찮아. 긁힌 거야."
        - "핀은 대답하지 않았다. 내 손등의 붉은 점만 보고 있었다."
        - "핀의 손이 눈에 띄게 떨린다. 목검을 떨어뜨렸다."
        - "달그락. 목검이 흙바닥에 굴렀다. 핀은 줍지 않았다."
        - "숨소리가 이상하다. 얕고 빠르다. 눈동자가 내 손등에 못 박힌 채 움직이지 않는다."
        - 나: "핀?"
        - 핀@당황: "…미, 미안해요. 오늘은 여기까지."
        - "핀은 목검도 두고, 빗자루만 집어 들고 어둠 속으로 뛰어갔다."
        - 속마음: "(방금, 칼날 같던 아이가 한순간에 어린애가 됐다.)"
        - when: "perk.데이터마이너"
          속마음: "(데이터에 적혀 있던 건 스탯뿐이었다. 이 떨림은 어디에도 없었다.)"
        - "손등의 피가 말라 갈 때까지, 핀이 두고 간 목검을 들고 서 있었다."
      plants:
        - { id: F07, notice: { value: "stat.지성 + 10 * talent.직감 - 10 * talent.눈치없음", dc: 18 } }
    - lines:
        - "내 발소리에 소년이 움찔하며 목검을 등 뒤로 감췄다. 그러다 나인 걸 알고 어깨를 늘어뜨린다."
        - 핀@웃음: "또 왔어요? …좋아요. 한 번만 더."
        - 핀@당황: "아, 아무한테도 말하면 안 돼요. 청소부가 목검 만지는 거 걸리면… 쫓겨나요."
        - "핀이 목검 걸이에서 제일 낡은 걸 하나 더 꺼내 내게 던졌다."
        - "대련이라기보단 놀이에 가까웠다. 핀은 웃으면서 피했고, 내 목검은 매번 허공만 쳤다."
        - "핀의 검은 빗자루였을 때보다 훨씬 날카롭다."
        - "발이 바닥을 쓸듯 미끄러지고, 손목이 빗자루를 털듯 꺾인다. 청소하던 동작이 그대로 검이 됐다."
        - 나: "그거, 누구한테 배웠어?"
        - 핀@당황: "배, 배운 거 아니에요. 학생들 연습하는 거… 청소하면서 맨날 봐서요."
        - when: "perk.데이터마이너"
          속마음: "(보는 것만으로 이게 된다고. 데이터에 S가 박혀 있던 이유가 있다.)"
        - when: "not perk.데이터마이너"
          속마음: "(보는 것만으로 이게 된다고? 이건 노력이 아니라 재능이다.)"
        - "달이 기울 때까지 목검 부딪는 소리가 이어졌다. 핀은 한 번도 지친 기색이 없었다."
        - 핀@웃음: "내일도… 오면 좋겠어요. 아, 아니, 와도 되고 안 와도 되고요."

# ---------------------------------------------------------------- 5월: 미궁 실습 (3층까지 이어지는 연속 장면)

- id: y1_labyrinth
  title: 미궁 실습
  art: labyrinth
  on: auto
  at: "1.5.2.방과후"
  priority: 10
  announce: 미궁 실습 (3층까지)
  lines:
    - "5월 둘째 주. 아카데미 본관 지하, 훈련용 미궁 입구."
    - "돌계단 아래에서 차갑고 축축한 바람이 올라온다. 이끼와 녹슨 쇠 냄새."
    - "횃불을 든 1학년들이 입구 앞 광장에 웅성웅성 모여 있다. 웃음소리가 평소보다 크다. 다들 무서운 거다."
    - "훈련용 미궁 실습. 조를 짜서 3층까지 내려갔다 돌아오는 것이 과제다."
    - 가렌@진지: "규칙은 세 개다. 조원을 버리지 마라. 3층 아래로 가지 마라. 해 지기 전에 올라와라."
    - 가렌: "어긴 놈은 미궁이 알아서 벌을 준다. 난 치우는 것까지만 한다."
    - "웃는 학생은 없었다."
    - 엘베라: "층마다 계단참에 조교가 있어요. 위험하면 신호탄을 쏘세요. 빨간 게 '살려 주세요'예요."
    - 학생 A: "파란 건요?"
    - 엘베라@웃음: "파란 건 '배고파요'. 농담이에요. 파란 건 없어요."
    - "입구 옆 바위에 누군가 칼끝으로 새긴 낙서가 보인다. ─ 3층 안쪽엔 가지 마."
    - 속마음: "(미궁 실습. 원작에선 튜토리얼 던전이었다. 다들 눈 감고도 깼지.)"
    - when: "note.note_edric.known and origin != '악역도련님'"
      속마음: "(오늘이다. 에드릭이 죽는 날.)"
    - when: "origin == '악역도련님'"
      속마음: "(오늘이다. 원작의 내가 죽는 날.)"
    - when: "note.note_edric.known and origin != '악역도련님'"
      나레이션: "광장 저편, 에드릭 벨모어가 혼자 서 있다. 늘 따라다니던 귀족 자제들도 오늘은 다른 조다."
    - when: "note.note_edric.known and origin != '악역도련님'"
      속마음: "(위키의 한 줄. '미궁 3층 안쪽에서 시체로 발견. 사고사로 처리.' 그 한 줄이 지금 저기서 숨 쉬고 있다.)"
    - when: "origin == '악역도련님'"
      나레이션: "내 주위로 세 걸음씩 비어 있다. 아무도 벨모어와 같은 조가 되고 싶어 하지 않는다."
    - when: "origin == '악역도련님'"
      속마음: "(원작의 에드릭은 이날 혼자였다. 그래서 아무도 그가 사라진 걸 몰랐다.)"
    - when: "talent.겁쟁이"
      나레이션: "계단 아래 어둠을 보는 것만으로 무릎이 시큰하다. 손에 쥔 횃불이 덜덜 떨린다."
    - when: "talent.마력감응"
      나레이션: "계단 아래에서 끈적한 마력이 올라온다. 튜토리얼 던전의 공기가 아니다."
    - when: "died.미궁그림자 or died.미궁심연"
      속마음: "(이 광장. 이 바람. 한 번 봤다. 그리고 한 번, 저 아래에서 끝났다.)"
    - when: "died.미궁그림자"
      속마음: "(이번엔 혼자 내려가지 않는다. 등 뒤를 맡길 사람부터 구한다.)"
    - 조교: "조 편성 시작! 두세 명씩! 남는 사람은 조교가 묶어 준다!"
    - "학생들이 우르르 흩어진다. 아는 얼굴을 찾는 눈들이 바쁘다."
    - 속마음: "(누구와 내려갈까. 미궁에선 등 뒤를 맡길 사람이 곧 목숨이다.)"
  next: lab_floor2
  choices:
    - text: 브루노와 조를 짠다
      when: "met.bruno or affinity.bruno > 0"
      effects: ["lab.partner = 'bruno'", "affinity.bruno += 3"]
      lines:
        - "광장에서 제일 큰 덩치를 찾는 건 어렵지 않았다."
        - when: "origin == '악역도련님'"
          브루노@당황: "어? 벨모어… 나랑? 진짜?"
        - when: "origin == '악역도련님'"
          브루노: "…그래, 뭐. 미궁에선 귀족이고 평민이고 없지. 등 넓은 놈이 최고야."
        - 브루노@웃음: "길 막히면 내가 벽을 부술게!"
        - 나: "훈련용 미궁 벽 부수면 수리비 나온다."
        - 브루노: "…그럼 살살 부술게."
        - when: "talent.천생신력 or talent.거구"
          브루노@웃음: "아, 너도 힘 좀 쓰지? 그럼 벽은 반반씩 부수자. 수리비도 반반!"
        - "브루노가 대장간에서 가져왔다는 쇠막대를 어깨에 걸쳤다. 횃불보다 그게 더 든든해 보인다."
        - 속마음: "(힘으로는 1학년에서 손꼽힌다. 함정 앞에선 저 등이 방패다.)"
    - text: 아렌과 조를 짠다
      when: "affinity.aren >= 10"
      effects: ["lab.partner = 'aren'", "affinity.aren += 3"]
      lines:
        - "아렌이 사람들 사이에서 두리번거리고 있었다. '용사님'과 조를 하겠다는 애들 사이에서, 대답도 못 하고."
        - "내가 다가가자 아렌의 얼굴이 확 밝아졌다."
        - 아렌@웃음: "같이 가자. …솔직히 좀 무서웠거든."
        - 아렌: "다들 용사님이랑 가면 안전하대. 근데 나 3층은커녕 1층도 처음이에요. 아, 처음이야."
        - 나: "나도 처음이야. 그럼 둘 다 처음이네."
        - 아렌@웃음: "그거 좋다. 둘 다 처음이면 누가 틀려도 안 창피하잖아."
        - when: "talent.마력감응"
          나레이션: "아렌 옆에 서자 피부가 따끔거린다. 성검이 남기고 간 잔향 같은 것."
        - 속마음: "(원작 주인공과 같은 조. 원작에선 내가 아렌이었으니, 나랑 내가 조를 짠 셈인가.)"
    - text: 리아나와 조를 짠다
      when: "affinity.liana >= 15"
      effects: ["lab.partner = 'liana'", "affinity.liana += 3"]
      lines:
        - "리아나가 활을 등에 메고 광장 구석에 서 있었다. 손을 들자 바로 달려왔다."
        - 리아나: "어두운 데는 내 귀가 쓸모 있을 거야."
        - 리아나@웃음: "돌 속 빈 데, 물 흐르는 데, 뭐가 기어 다니는 데. 다 들려."
        - 리아나: "…마지막 건 안 들렸으면 좋겠지만."
        - when: "origin == '숲고아'"
          리아나@웃음: "숲 사람 둘이면 어둠도 덜 무섭겠다. 넌 냄새로, 난 소리로."
        - "리아나가 미궁 입구를 내려다본다. 귀 끝이 쫑긋 섰다."
        - when: "note.note_liana.known"
          속마음: "(계단이 많은 곳이다. 무리하지 않게 내가 봐야 한다.)"
        - 속마음: "(하프엘프의 귀. 원작에서도 함정 감지는 리아나가 최고였다.)"
    - text: 남은 사람들과 조를 짠다
      effects: ["lab.partner = 'random'"]
      lines:
        - "망설이는 사이 조가 다 짜였다. 조교가 남은 사람들을 손가락으로 묶는다."
        - "이름도 모르는 동기 둘과 조가 됐다."
        - when: "origin == '악역도련님'"
          나레이션: "동기 둘은 내 얼굴을 보자마자 조교에게 조를 바꿔 달라고 했다. 거절당했다."
        - 동기: "…잘 부탁해. 우리 그냥 3층 찍고 바로 올라오자. 응?"
        - 동기: "난 횃불만 들게. 싸우는 건 못 해."
        - 속마음: "(이름 없는 조. 원작 기준으로는 화면에 뜨지도 않는 조다.)"
        - 속마음: "(이 둘은 무슨 일이 생기면 나를 두고 올라갈 거다. 그건 기억해 두자.)"
        - "횃불 세 개가 계단 아래 어둠 속으로 내려갔다."
      branch:
        - when: "talent.카리스마 or talent.사람좋은얼굴"
          lines:
            - "계단을 내려가다 동기 하나가 슬쩍 내 소매를 잡았다."
            - 동기: "…너랑 같은 조라 다행이다. 왠지 모르게."
            - "다른 하나도 고개를 끄덕였다. 횃불 세 개의 간격이 조금 좁아졌다."
          effects: ["stress -= 5"]

- id: lab_floor2
  title: 미궁 2층 — 압력판 통로
  art: labyrinth
  lines:
    - "1층은 싱거웠다. 박쥐 몇 마리와, 거꾸로 걸린 화살표 표지판뿐."
    - "2층으로 내려가는 계단은 길고 가팔랐다. 공기가 한 단계 더 차가워진다."
    - 조교: "2층 통과 지점은 저 끝 문이다. 함정 조심하고. 다치면 신호탄."
    - "2층. 바닥에 압력판 함정이 촘촘히 깔린 통로다."
    - "횃불 빛이 닿는 곳마다 돌바닥 이음매가 미묘하게 어긋나 있다. 솟은 판, 가라앉은 판."
    - "벽 양쪽엔 손가락 굵기의 구멍이 일정한 간격으로 뚫려 있다. 화살 구멍이다."
    - "통로 끝까지 대략 서른 걸음. 앞 조가 남긴 발자국이 중간에서 뒤죽박죽 엉켜 있다."
    - 속마음: "(압력판 통로. 원작에선 정답 루트를 외워 3초 만에 지나갔다. 문제는, 여기 배치가 원작이랑 다르다는 거다.)"
    - when: "lab.partner == 'liana'"
      리아나: "잠깐. 저 앞 돌바닥, 소리가 비어 있어."
    - when: "lab.partner == 'liana'"
      리아나@진지: "세 번째 줄 왼쪽에서 두 번째. 그리고 그 앞에 하나 더. 디디지 마."
    - when: "lab.partner == 'bruno'"
      브루노: "그냥 확 밟고 지나가면 안 되나?"
    - when: "lab.partner == 'bruno'"
      브루노@웃음: "화살 몇 개쯤이야. 대장간 불똥보단 덜 아플걸?"
    - when: "lab.partner == 'aren'"
      아렌@당황: "저, 저거 다 함정이에요? 아니, 다 함정이야? 하나도 모르겠는데."
    - when: "lab.partner == 'aren'"
      아렌: "성검 들고 올 걸 그랬나. …아, 실습에 성검 금지지."
    - when: "lab.partner == 'random'"
      동기@당황: "우, 우리 그냥 돌아갈까? 2층에서 포기해도 점수 반은 준대."
    - "어딘가 앞쪽에서 딸깍 소리가 나고, 누군가의 비명이 짧게 울렸다. 다른 조다."
    - "잠시 뒤 붉은 신호탄 하나가 천장 근처에서 터졌다."
    - 속마음: "(살펴서 갈까, 밀고 갈까. 여기서 힘을 다 빼면 3층에서 모자란다.)"
  next: lab_floor3
  choices:
    - text: 함정을 살핀다
      lines:
        - "횃불을 바닥 가까이 낮췄다. 이음매의 그림자가 길게 늘어진다."
        - "솟은 판, 가라앉은 판, 먼지가 덜 쌓인 판. 하나씩 눈으로 짚어 간다."
        - when: "lab.partner == 'liana'"
          리아나: "내가 소리로 짚을게. 넌 눈으로 짚어. 둘이 맞으면 안전한 거야."
        - when: "talent.마력둔감"
          속마음: "(마법 장치가 섞여 있으면 이 몸은 못 느낀다. 눈만 믿어야 한다.)"
