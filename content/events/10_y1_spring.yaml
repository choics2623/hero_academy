    - 속마음: "(원작 텍스트는 '에드릭은 홀로 안쪽 통로로 향했다'. 이유는 한 줄도 없었다.)"
    - 속마음: "(이유가 이거였구나. 이걸 듣고 안 갈 수가 없었던 거야.)"
