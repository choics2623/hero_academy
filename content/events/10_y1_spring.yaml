          - { when: "fired.finn_night >= 1", value: 2, label: 밤의 연무장 }
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      success:
        lines:
          - "첫째, 목. 젖은 짚이 갈라지는 소리. 어깨, 허리, 무릎."
          - "마지막 목에서 발이 미끄러졌지만, 검이 먼저 들어갔다."
          - "가렌 교관이 고개를 한 번 끄덕였다."
          - "그게 전부였다. 그런데 뒤에서 기다리던 학생들이 웅성거렸다."
          - 학생 A: "(속닥) 방금 끄덕였지? 가렌 교관이 끄덕이는 거 처음 봐."
          - 속마음: "(칭찬 미구현 NPC의 끄덕임. 이건 업적이다.)"
        effects: ["mid.practical = 1", "affinity.garen += 3"]
      fail:
        lines:
