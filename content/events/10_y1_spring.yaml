# 1학년 1학기 메인 사건 (3월 ~ 6월). 7월 무투대회는 30_y1_july.yaml
# announce가 있는 이벤트는 화면의 "다가오는 일정"에 표시된다.

# ---------------------------------------------------------------- 3월: 입학

- id: y1_entrance
  title: 입학식
  art: cg_holy_sword
  on: auto
  at: "1.3.1.방과후"
  priority: 10
  announce: 입학식
  lines:
    - 삽화: academy_gate
    - "3월 첫 주. 왕립 루미에르 아카데미 정문."
    - "벚꽃잎이 바람을 타고 철문 창살 사이로 쏟아져 들어온다."
    - "새 교복의 빳빳한 깃이 목을 긁는다. 내 치수에 맞춘 옷인데 남의 옷 같다."
    - 속마음: "(타이틀 화면이다. 3,000시간 동안 매번 이 정문 위에 '새로 시작하기'가 떠 있었지.)"
    - 속마음: "(이번엔 버튼이 없다. 그냥 걸어 들어가면 된다.)"
    - 삽화: great_hall
    - "왕립 루미에르 아카데미 대강당. 신입생 이백 명이 숨을 죽이고 있다."
    - "샹들리에의 밀랍 냄새, 새 구두 가죽 냄새. 어디선가 마른침 삼키는 소리."
    - when: "origin == '평민장학생'"
      나레이션: "평민 장학생 줄. 다들 교복을 처음 입어 본 얼굴로 소매만 만지작거린다."
    - when: "origin == '몰락귀족'"
      나레이션: "귀족석 맨 끝자리. 옆자리 자제가 내 낡은 커프스를 흘끗 보더니 고개를 돌린다."
    - when: "origin == '엑스트라'"
      나레이션: "내 자리는 맨 뒷줄 기둥 뒤. 단상이 반쯤 가린다. 엑스트라다운 명당이다."
    - when: "origin == '숲고아'"
      나레이션: "사람 냄새가 너무 많다. 숲에선 이렇게 많은 숨소리를 한꺼번에 들은 적이 없다."
    - when: "origin == '악역도련님'"
      학생들: "저기 봐, 벨모어가 망나니야… 눈 마주치지 마."
    - when: "origin == '악역도련님'"
      나레이션: "내 양옆 자리만 비어 있다. 늦게 온 학생들이 빈자리를 보고도 서서 간다."
    - when: "origin == '악역도련님'"
      속마음: "(입학식부터 이 대접이었구나. 원작에선 화면 밖이라 몰랐다.)"
    - "단상 위에서 학장이 축사를 읽기 시작한다. 문장 하나가 숨 세 번만큼 길다."
    - 속마음: "(원작에선 여기서 스킵 버튼을 눌렀다. 학장 축사, 정확히 4분 30초.)"
    - 속마음: "(스킵이 안 된다. …현실도 패치가 필요하다.)"
    - "앞줄 남학생의 고개가 꾸벅 떨어졌다가 화들짝 들린다."
    - "축사가 끝나자 흰 옷의 신관 둘이 천을 덮은 받침대를 들고 올라온다."
    - "강당의 공기가 바뀌었다. 졸던 남학생도 허리를 편다."
    - 신관@진지: "성교회의 이름으로. 신입생은 한 사람씩 단상 앞을 지나가십시오."
    - "천이 걷힌다. 은빛 장검 한 자루가 붉은 벨벳 위에 누워 있다."
    - "성검 에테르. 천 년 전, 초대 용사가 마왕을 봉인할 때 쥐었다는 검."
    - 속마음: "(실물은 생각보다 작네. 일러스트 담당이 세 배는 부풀렸다.)"
    - "줄이 움직인다. 한 사람, 또 한 사람. 검은 아무 대답도 하지 않는다."
    - "누군가는 일부러 천천히 걷고, 누군가는 손끝을 뻗다가 신관에게 손등을 맞는다."
    - 학생 A: "올해도 꽝인가 봐."
    - 학생 B: "용사 후보 같은 건 옛날얘기지. 우리 아버지 때 이후론 없었대."
    - when: "talent.마력감응"
      나레이션: "검 가까이 갈수록 피부가 따끔거린다. 잠든 짐승 옆을 지나는 기분이다."
    - when: "talent.성흔"
      나레이션: "단상 앞을 지날 때 손등이 따뜻해졌다. 얼른 소매로 덮었다."
    - when: "talent.마왕의흔적"
      나레이션: "단상 세 걸음 앞에서 가슴 안쪽이 욱신거렸다. 숨을 참고 지나갔다."
    - 나레이션:
        - "내 차례가 지나갔다. 아무 일도 없었다. 당연하다. 이 몸은 엑스트라니까."
        - { when: "origin == '악역도련님'", text: "내 차례가 지나갔다. 아무 일도 없었다. 당연하다. 이 몸은 1권에서 죽는 악역이니까." }
    - "그리고 평민 장학생 줄의 끝. 밀짚색 머리가 부스스한 소년이 단상 앞에 선다."
    - "소매가 짧은 교복. 손등의 굳은살. 바깥바람에 오래 그을린 얼굴."
    - 속마음: "(왔다.)"
    - "소년이 지나가려는 순간, 받침대 위의 검이 낮게 울었다."
    - "우웅. 귀가 아니라 갈비뼈로 듣는 소리."
    - 삽화: cg_holy_sword
    - "단상 위 성검 에테르가 한 소년 앞에서 빛나기 시작한다."
    - "처음엔 촛불만 하던 빛이, 순식간에 강당을 하얗게 덮는다."
    - 아렌@놀람: "…검이, 빛나고 있어?"
    - 아렌@당황: "저, 저 아무것도 안 했는데요? 진짜로요, 손도 안 댔어요."
    - "신관 하나가 그 자리에 무릎을 꿇었다. 다른 하나는 강당 밖으로 뛰어나간다."
    - 학생들: "용사다…! 성검이 골랐어!"
    - "박수와 비명과 의자 끄는 소리가 한꺼번에 터진다."
    - 속마음: "(원작 명장면. 아렌이 용사 후보가 되는 순간.)"
    - 속마음: "(오프닝 영상으로 백 번은 봤다. 그런데 이렇게 시끄러운 장면이었나.)"
    - "그런데 그 순간, 내 몸도 아주 미세하게 떨렸다."
    - "손끝에서 시작해 등뼈를 타고 올라오는, 아주 작은 떨림."
    - "빛에 놀란 탓일까. 아니면 이 몸 어딘가가 저 검에 대답한 걸까."
    - 속마음: "(…기분 탓이다. 이 몸이 성검이랑 무슨 상관이라고.)"
    - "빛이 천천히 가라앉는다. 소년은 여전히 두 손을 든 채 어쩔 줄 몰라 서 있다."
    - 아렌@슬픔: "양 치다 왔는데… 이거, 뭐가 잘못된 거죠?"
    - 신관@진지: "잘못된 건 없습니다. 여신께서 고르셨습니다."
    - "소년의 얼굴이 더 하얘졌다. 기뻐하는 얼굴이 아니었다."
    - 속마음: "(원작 아렌은 대사가 없었다. 플레이어가 조종했으니까. 저런 얼굴도 처음 본다.)"
    - "환호 속에서, 나는 문득 강당 뒤편을 돌아봤다."
    - "강당 뒤편, 도서관 사서 노인이 기둥에 기댄 채 성검을 바라보고 있다."
    - "다들 아렌을 보는데, 노인만 검을 보고 있다. 지겨운 것을 보는 눈. 아니, 슬픈 것을 보는 눈인가."
    - "노인의 입술이 움직였다. 환호에 묻혀야 할 목소리가, 이상하게 또렷하게 들렸다."
    - 사서@진지: "또 시작이구나."
    - "노인은 그대로 돌아서 강당 문밖으로 사라졌다."
    - 속마음: "(원작에서도 저 노인이 저기 있었던가? 매번 스킵해서 기억이 없다.)"
    - "강당 밖에선 벚꽃이 아직 지고 있다."
    - "환호성이 등 뒤에서 멀어진다. 손끝의 떨림은 어느새 멎어 있었다."
    - 속마음: "(멸망까지 10년. 시계가 방금, 공식적으로 움직이기 시작했다.)"
  plants:
    - { id: F01, notice: { value: "stat.마력량 / 2 + 15 * talent.마력감응", dc: 20 } }
    - { id: F02, notice: { value: "stat.지성 / 2 + 15 * perk.고인물의기억", dc: 20 } }

- id: y1_exam
  title: 반 배정 시험
  art: exam_field
  on: auto
  at: "1.3.1.밤"
  priority: 10
  announce: 반 배정 시험
  effects: ["exam.score = stat.근력 + stat.마력량 + stat.지성"]
  lines:
    - "해가 진 뒤의 실기 시험장. 원형 경기장 둘레에 마력등이 줄지어 켜져 있다."
    - "흙바닥엔 레인이 그어져 있다. 한쪽은 마법 표적, 한쪽은 목검 대련 자리."
    - "마법 표적과 목검 대련이 동시에 진행된다."
    - "사방에서 불꽃 터지는 소리와 목검 부딪는 소리가 뒤섞인다."
    - "입학식의 흥분이 덜 가신 얼굴들이 저마다 손목을 풀고 있다."
    - "저녁을 거른 배가 꾸르륵 울었다. 긴장하면 배가 고파지는 체질인가, 이 몸."
    - 감독관@진지: "번호 부르면 레인으로. 표적 셋, 대련 한 판. 결과로 반을 나눈다."
    - 감독관: "쓰러지면 실격이다. 아카데미는 쓰러지는 놈을 가르치지 않는다."
    - 속마음: "(반 배정 시험. 원작에선 아렌 것만 플레이하고, 나머지는 결과 화면에 이름만 떴다.)"
    - 속마음:
        - "(그 결과 화면 D반 맨 아래 어딘가에, 이 몸의 이름도 있었겠지. 아무도 안 읽는 칸에.)"
        - { when: "origin == '악역도련님'", text: "(에드릭 벨모어의 반 배정 결과? 원작에 나온 적도 없다. 1권에서 죽을 놈이니까.)" }
    - "내 레인 번호가 불렸다. 목검을 쥐자 손바닥에 땀이 밴다."
    - when: "talent.천생신력"
      나레이션: "몸을 풀다 표적 기둥을 짚었더니 기둥이 기울었다. 감독관이 못 본 척해 줬다."
    - when: "talent.겁쟁이"
      나레이션: "무릎이 제멋대로 떨린다. 대련 상대의 목검이 실제보다 두 배는 커 보인다."
    - "첫 표적. 둘째 표적. 숨을 고르는데—"
    - "옆 레인의 은발 소녀가 비틀거린다. 얼굴이 하얗게 질려 있다."
    - "땀에 젖은 은발이 이마에 들러붙었다. 지팡이를 쥔 손가락 마디가 새파랗다."
    - "표적을 향해 든 손이 떨린다. 손끝에 맺힌 빛이 켜졌다 꺼졌다 한다."
    - 세라@슬픔: "괜찮아… 괜찮아. 한 번만 더."
    - "혼잣말이었다. 누구에게도 들리지 않게 하려는 목소리."
    - "감독관은 반대편 레인을 보고 있다. 아무도 이쪽을 보지 않는다."
    - when: "note.note_sera.known"
      속마음: "(세라. 원작에선 여기서 쓰러져 탈락한다. 원작 성녀보다 신성력이 높은 아이인데.)"
    - when: "note.note_sera.known"
      속마음: "(원작에서 이 아이 장면은 딱 하나였다. 쓰러지는 장면. 그리고 탈락자 명단의 이름.)"
    - when: "not note.note_sera.known"
      속마음: "(저 애, 곧 쓰러지겠는데.)"
    - "소녀의 무릎이 한 번 꺾였다가 겨우 버틴다."
    - when: "talent.마력감응"
      나레이션: "소녀의 마력이 바닥을 긁고 있다. 우물 밑바닥을 두레박이 헛도는 소리처럼."
    - when: "talent.성흔"
      나레이션: "소매 안쪽에서 손등이 뜨거워졌다. 옆 레인의 꺼질 듯한 빛과, 이상하게 같은 온도다."
    - "내 레인에선 대련 상대가 목검을 든 채 나를 기다리고 있다."
    - 속마음: "(레인을 벗어나면 내 점수가 깎인다. …그래도.)"
  choices:
    - text: 세라를 부축한다 (내 점수가 깎인다)
      art: cg_sera_exam
      effects: ["fate.sera = 'saved'", "exam.score -= 10"]
      lines:
        - "레인 줄을 넘었다. 목검을 내려놓을 틈도 없이 뛰었다."
        - "소녀의 무릎이 꺾인다. 세 걸음. 두 걸음."
      check:
        type: 기민
        dc: 쉬움
        mods:
          - { when: "talent.겁쟁이", value: -2, label: 떨리는 무릎 }
      success:
        lines:
          - "소녀가 앞으로 고꾸라지는 순간, 겨우 어깨를 받아냈다."
          - "가볍다. 너무 가볍다. 교복 너머로 열이 끓는 게 느껴진다."
          - 나@진지: "숨 쉬어. 천천히. 나 보고. 하나, 둘."
          - 세라@슬픔: "고, 고마워… 나 때문에 너까지…"
          - when: "origin == '악역도련님'"
            세라@놀람: "그 문장… 벨모어? 벨모어가 왜 나를…"
          - 나: "말하지 마. 숨부터."
          - 감독관@화남: "거기 둘! 레인 이탈이면 감점이—"
          - "감독관이 소녀의 얼굴을 보더니 말을 삼켰다."
          - 감독관@진지: "…흠. 회복할 때까지 기다려주지. 너는 감점이다."
          - "소녀가 내 소매를 꼭 쥐었다. 떨림이 조금씩 잦아든다."
          - "숨을 되찾은 소녀가 다시 레인에 섰다. 손끝의 빛이, 이번엔 꺼지지 않았다."
          - "하얀 빛이 표적 한가운데 꽂혔다. 감독관이 말없이 무언가를 적는다."
          - 세라@웃음: "…세라. 내 이름. 너는? 꼭 갚을게."
          - 시스템: "⚠ 원작 이탈 — 세라가 시험을 통과한다."
          - 속마음: "(내 점수는 깎였다. 괜찮다. 탈락자 명단에서 이름 하나가 지워졌으니까.)"
        effects: ["affinity.sera += 15", "trust.sera += 10"]
      fail:
        lines:
          - "한 걸음이 모자랐다. 소녀가 흙바닥에 먼저 닿았다."
          - "은발이 흙먼지에 흩어진다. 팔꿈치가 쓸려 붉은 줄이 났다."
          - "무릎을 꿇고 겨우 상체를 일으켜 안았다. 몸이 불덩이다."
          - 나@당황: "미안. 늦었어. 숨 쉬어, 천천히."
          - 세라@슬픔: "……괜찮아. 넘어지는 건, 익숙해."
          - 감독관@화남: "거기 둘! 레인 이탈에, 시험장 바닥에 드러눕기까지?"
          - "감독관은 쓰러진 소녀를 내려다보고 혀를 찼다. 그래도 실격이라고는 하지 않았다."
          - 감독관: "…일어설 수 있으면 다시 쏴라. 너는 감점 두 배다."
          - "소녀가 내 어깨를 짚고 일어섰다. 다리가 떨리는데도, 손끝의 빛은 꺼지지 않았다."
          - "빛이 표적 가장자리에 꽂혔다. 한가운데는 아니었다. 그래도 꽂혔다."
          - 세라@웃음: "…세라야. 팔꿈치 까진 건 비밀로 해 줘. 꼭 갚을게."
          - 시스템: "⚠ 원작 이탈 — 세라가 시험을 통과한다."
          - 속마음: "(멋있게 받아 내진 못했다. 그래도 명단에서 이름 하나는 지웠다.)"
        effects: ["affinity.sera += 12", "trust.sera += 10", "exam.score -= 5"]
      great:
        lines:
          - "세라의 빛은 표적을 꿰뚫고도 꺼지지 않았다. 경기장 반대편까지 하얗게 번진다."
          - "반대편 레인의 학생들이 일제히 돌아봤다. 감독관의 펜이 멈췄다."
          - 세라@놀람: "…이런 거, 처음이야. 네가 잡아 줘서 그런가."
        effects: ["affinity.sera += 3"]
    - text: 감독관에게 조용히 알린다
      requires: "stat.매력 >= 12 or talent.귀공자의품격"
      effects: ["fate.sera = 'saved_quiet'"]
      lines:
        - "레인을 벗어나지 않은 채 손을 들어 감독관을 불렀다."
        - 나: "옆 레인 학생, 상태가 이상합니다. 열이 있어 보여요."
      check:
        type: 설득
        dc: 쉬움
        mods:
          - { when: "note.note_sera.known", value: 2, label: 원작 지식 }
      success:
        lines:
          - "감독관이 귀찮다는 얼굴로 돌아봤다가, 소녀를 보고 표정이 굳는다."
          - when: "talent.귀공자의품격"
            나레이션: "몸에 밴 예법이 목소리를 낮고 단정하게 만들었다. 감독관이 자세를 고쳐 선다."
          - 감독관@진지: "…그래. 저 학생은 재시험으로 처리하지."
          - "조교 둘이 달려와 소녀를 부축해 의무실 쪽으로 데려간다."
          - "소녀는 누가 감독관을 불렀는지 끝내 몰랐다. 고개를 돌릴 힘도 없어 보였다."
          - 감독관: "너. 네 레인으로. 남 걱정할 시간에 표적이나 맞혀."
          - 속마음: "(세라는 누가 도와줬는지 모를 것이다. 그래도 괜찮아.)"
          - 속마음: "(이름도 안 남기고 퀘스트 완료. 위키에 적을 수도 없는 공략이다.)"
          - 시스템: "⚠ 원작 이탈 — 세라가 재시험 기회를 얻는다."
          - "다시 목검을 쥐었다. 손바닥의 땀은 어느새 말라 있었다."
        effects: ["affinity.sera += 5"]
      fail:
        lines:
          - 감독관@화남: "남 걱정할 시간에 네 표적이나 맞혀. 다음 번호!"
          - "감독관은 돌아보지도 않았다. 옆 레인의 소녀가 또 한 번 휘청인다."
          - 속마음: "(말이 안 먹힌다. 이대로면 원작대로다.)"
          - when: "talent.말더듬"
            나@당황: "교, 교관님! 지, 지금 안 보시면—"
          - 나: "교관님! 지금 안 보시면, 저 학생 쓰러집니다!"
          - "목소리가 생각보다 크게 나갔다. 경기장 절반이 이쪽을 돌아봤다."
          - "그제야 감독관이 소녀를 봤다. 혀를 차며 조교 둘을 손짓으로 불렀다."
          - 감독관@진지: "…재시험이다. 그리고 너. 시험장에서 소리 지른 값은 감점이다."
          - "조교들이 소녀를 부축해 데려간다. 소녀가 아주 잠깐, 소리가 난 쪽을 돌아봤다."
          - 시스템: "⚠ 원작 이탈 — 세라가 재시험 기회를 얻는다."
          - 속마음: "(조용히 하려던 일이 시끄러워졌다. 그래도, 결과는 같다.)"
        effects: ["affinity.sera += 3", "exam.score -= 3", "stress += 3"]
    - text: 레인 줄 너머로 손을 뻗어, 손등의 온기를 나눈다
      when: "talent.성흔"
      art: cg_sera_exam
      effects: ["fate.sera = 'saved'"]
      lines:
        - "레인 줄은 넘지 않았다. 대신 줄 너머로 손을 뻗었다."
        - "소녀의 손목을 잡았다. 열이 끓는데, 손끝만 얼음 같다."
        - "소매 안쪽에서 손등이 뜨거워진다. 무언가 깨어나는 감각."
        - 속마음: "(성흔을 들키면 곤란하다. 그래도 지금 이 손을 놓을 수는 없다.)"
      check:
        type: 신성
        dc: 쉬움
      success:
        lines:
          - "손등의 온기가 손목을 타고 소녀에게 흘러갔다. 촛불을 옮겨 붙이듯이."
          - "소녀의 손가락에 핏기가 돌아온다. 꺼질 듯하던 숨이 길어진다."
          - 세라@놀람: "……따뜻해. 이거, 기도할 때랑 같은 온도야."
          - when: "origin == '악역도련님'"
            세라@놀람: "벨모어가… 왜 이런 손을 가졌어?"
          - 나: "쉿. 표적. 지금이야."
          - "소녀가 고개를 끄덕였다. 들어 올린 손끝의 빛이 이번엔 흔들리지 않는다."
          - "하얀 빛이 표적 한가운데 꽂혔다. 감독관은 끝내 이쪽을 보지 않았다."
          - "레인 줄은 한 번도 넘지 않았다. 내 점수도 그대로다."
          - 세라@웃음: "…세라. 내 이름이야. 이 온기, 잊지 않을게."
          - 시스템: "⚠ 원작 이탈 — 세라가 시험을 통과한다."
          - 속마음: "(원작에 이런 장면은 없었다. 성흔을 이렇게 쓰는 법은 공략에도 없었다.)"
        effects: ["affinity.sera += 18", "trust.sera += 12"]
      fail:
        lines:
          - "온기가 손목에서 멈췄다. 흘려보내는 법을 이 몸은 아직 모른다."
          - "소녀의 무릎이 꺾였다. 결국 줄을 넘어 어깨를 받아냈다."
          - 감독관@화남: "거기! 레인 이탈이다. 감점!"
          - "그래도 손은 놓지 않았다. 맞닿은 손바닥만, 이상하게 따뜻했다."
          - 세라@슬픔: "…미안해. 너까지 감점이라니."
          - 나: "숨 쉬어. 하나, 둘. 그리고 쏴."
          - "숨을 고른 소녀의 빛이 표적에 꽂혔다. 감독관이 말없이 무언가를 적는다."
          - 세라@웃음: "…세라. 꼭 갚을게. 그리고, 네 손… 따뜻했어."
          - 시스템: "⚠ 원작 이탈 — 세라가 시험을 통과한다."
        effects: ["affinity.sera += 15", "trust.sera += 10", "exam.score -= 10"]
      great:
        lines:
          - "손을 놓기 직전, 소녀의 손등에서도 희미한 빛이 새어 나왔다. 내 것과 똑같은 모양."
          - "소녀가 얼른 손을 소매 안으로 감췄다. 눈이 마주쳤다. 둘 다 아무 말도 하지 않았다."
        effects: ["affinity.sera += 3"]
    - text: 내 시험에 집중한다
      effects: ["exam.score += 5"]
      lines:
        - "시선을 내 레인으로 돌렸다."
        - 속마음: "(미안. 지금은 나도 살아남아야 해.)"
        - "대련 상대가 목검을 들어 올린다. 그 너머, 옆 레인에서 숨 넘어가는 소리가 작게 들렸다."
        - "돌아보지 않았다."
        - "목검이 부딪쳤다. 한 합, 두 합. 손목이 저릿하다."
        - when: "talent.강철멘탈"
          나레이션: "심장은 끝까지 고요했다. 그 고요가, 조금 무서웠다."
        - "등 뒤에서 무언가 흙바닥에 쓰러지는 소리. 조교들이 뛰어가는 발소리."
        - 감독관: "옆 레인 실격. 다음."
        - 나레이션:
            - "내 목검이 상대의 목검을 쳐 냈다. 깔끔한 한 판이었다."
            - { when: "synergy.검사 >= 1", text: "생각보다 몸이 먼저 움직였다. 상대의 목검이 흙바닥을 굴렀다. 깔끔한 한 판이었다." }
            - { when: "talent.천생신력 or talent.거구", text: "내 목검이 상대의 목검을 부러뜨렸다. 감독관이 눈썹을 올린다. 너무 깔끔한 한 판이었다." }
        - "시험이 끝나고 레인을 나서다, 흙바닥에 떨어진 은색 머리핀 하나를 봤다."
        - "끝내 줍지 않았다."
        - 속마음: "(…원작대로다.)"
        - "마력등 불빛이 흔들린다. 손바닥의 땀이 식어 차갑다."

- id: sera_dropped_news
  title: 탈락자 명단
  art: campus
  free: true
  lines:
    - "주말이 지난 아침. 본관 앞 게시판에 사람들이 몰려 있다."
    - "반 배정 결과표 옆에, 그보다 훨씬 짧은 종이 한 장."
    - "게시판에 탈락자 명단이 붙었다. 맨 위에 적힌 이름은 세라."
    - 학생 A: "시험 때 쓰러진 은발 애 있잖아. 결국 떨어졌대."
    - 학생 B: "신학과 지망이었다던데. 아깝네."
    - 학생 A: "아깝긴. 쓰러지는 애를 어떻게 데리고 다녀. 실전에서 짐 되지."
    - "학생들은 금방 자기 반 결과로 관심을 돌렸다."
    - "나만 그 짧은 종이 앞에 오래 서 있었다."
