      fumble:
        lines:
          - "돌아서다 진흙에 미끄러졌다. 짚으려던 손이 허수아비 받침대를 밀었다."
          - "허수아비 다섯 개가 도미노처럼 차례로 쓰러졌다. 진흙이 튀었다. 가렌의 바지에."
