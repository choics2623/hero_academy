            - "그림자는 바닥에 녹아들 듯 물러나, 통로 끝 벽의 틈으로 스며들었다."
            - "바닥의 피의 원이 식어 간다. 통로는 그냥 차갑고 축축한 돌 통로로 돌아왔다."
            - "에드릭은 원 한가운데 쓰러진 채 아직 눈을 뜨지 않았다. 숨은 쉬고 있다."
            - "벽의 틈은 사람 하나 겨우 지나갈 너비다. 그 너머로 돌계단이 아래로 이어진다."
            - "훈련용 미궁 지도엔 없는 계단이다. 그림자의 발소리가 아직 아래에서 울린다."
            - 속마음: "(가렌의 두 번째 규칙. 3층 아래로 가지 마라. 저 틈은, 아래로 이어진다.)"
            - 속마음: "(쫓으면 뭔가 알아낼지도 모른다. 대신 발 한 번 헛디디면, 위키에 새 줄이 생긴다. 내 이름으로.)"
