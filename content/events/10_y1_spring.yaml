          - "다음 기억은 발밑의 미지근한 감촉이다. 언제 밧줄을 넘었는지 모르겠다."
          - "검붉은 빛. 로브 자락. 가슴에 박히는 차가운 무언가."
          - "정신을 차렸을 땐 피로 그린 원 한가운데 쓰러져 있었다. 가슴에 깊은 상처."
          - "숨 쉴 때마다 갈비뼈 사이로 불이 붙는다. 손을 대 보니 미끈하다."
          - 가렌@화남: "벨모어! 눈 떠! 의무관, 이쪽이다!"
          - when: "lab.partner == 'bruno' or lab.partner == 'aren' or lab.partner == 'liana'"
            나레이션: "흐린 시야 끝에서, 조원이 울면서 신호탄을 쏘아 올리는 게 보였다. 붉은 빛."
          - "통로를 울리는 군화 소리. 횃불 여러 개. 누군가 나를 들어 올린다."
          - "교관들이 들이닥치지 않았다면 원작대로 죽었을 것이다."
          - 의무관: "출혈이 심해. 흉터는 남을 거다. …살아 있는 게 기적이야."
          - 속마음: "(살았다. 원작의 에드릭은 못 한 것. 대가는 가슴의 흉터 하나.)"
          - 속마음: "(그 목소리… 아직도 귀에 남아 있다.)"
        effects: ["fate.edric = 'alive_scarred'", "stat.체질 -= 5", "stress += 30"]
        plants:
          - { id: F04, notice: { value: "stat.지성", dc: 10 } }

- id: edric_death_news
  title: 에드릭 벨모어의 죽음
  art: campus
  free: true
  lines:
    - 삽화: canteen
    - "다음 날 아침. 에드릭 벨모어가 미궁 3층에서 시체로 발견됐다는 소식이 돈다."
    - "아침 식당이 이상하게 조용하다. 숟가락 소리마저 조심스럽다."
    - 학생 A: "벨모어가 도련님 말이야. 출입 금지 통로에 혼자 들어갔대."
    - 학생 B: "그러게 왜 혼자… 조원도 없었다며."
    - 학생 A: "조원이 있었어도 안 따라갔겠지. 누가 그 도련님을."
    - "아무도 울지 않았다. 대신 다들, 조금씩 목소리를 낮췄다."
    - when: "fs.F04.seen"
      나레이션: "스튜를 한 숟갈도 뜨지 못했다. 눈을 감으면 검붉은 빛과, 미끄러지던 소매 끝이 보인다."
    - when: "not fs.F04.seen"
      나레이션: "스튜를 내려다봤다. 어제 통로 앞에서 움직이지 않던 내 발이 떠올랐다."
    - 삽화: campus
    - "점심 무렵 본관 게시판에 공지가 붙었다."
    - "사고사로 처리됐다. 원작대로."
    - "공지는 짧았다. 실습 중 안전 수칙 위반. 출입 금지 구역 무단 진입. 애도를 표함."
    - 속마음: "(원작에서 본 그 공지 그대로다. 토씨 하나 다르지 않다.)"
    - 속마음:
        - "(그때는 '아, 그 악역 죽었구나' 하고 넘겼다. 지금은 그게 잘 안 된다.)"
        - { when: "fired.edric_bully", text: "(그때는 '아, 그 악역 죽었구나' 하고 넘겼다. 지금은… 식판을 엎던 그 손이 떨리던 게 생각난다.)" }
    - "하지만 시체 주변 바닥에 피로 그린 원이 있었다는 소문이 있다."
    - 학생 B: "(속닥) 의무실 조교한테 들었는데, 바닥에 뭘 그려 놨대. 빨갛게, 동그랗게."
    - 학생 A: "(속닥) 그만해. 밥 먹는데."
    - "소문은 저녁이 되기 전에 사라졌다. 누가 지운 것처럼 깨끗하게."
    - 속마음: "(사고가 아니다. 사고는 바닥에 원을 그리지 않는다.)"
    - "창밖으로, 벨모어가의 검은 마차가 정문을 빠져나가는 게 보였다. 휘장이 내려져 있었다."
    - 속마음: "(멸망까지 10년. 첫 번째 원작 사망자가, 원작대로 죽었다.)"
  plants:
    - { id: F04, notice: { value: "stat.지성 + 10 * know.cult_early", dc: 22 } }

# ---------------------------------------------------------------- 6월: 중간고사 (필기 + 실기)

- id: y1_midterm
  title: 중간고사
  art: exam_hall
  on: auto
  at: "1.6.1.방과후"
  priority: 10
  announce: 중간고사
  lines:
    - "6월 첫 주. 장마가 시작됐다. 창문마다 빗줄기가 사선으로 그어진다."
    - "중간고사 주간. 첫날은 필기, 둘째 날은 실기 한 과목을 골라 치른다."
    - "필기 시험장. 줄지은 책상, 교탁 위의 모래시계. 문 앞엔 젖은 우산이 산처럼 쌓였다."
    - "누군가 다리를 떨고, 누군가 손톱을 깨문다. 잉크병 뚜껑 여는 소리가 사방에서 난다."
    - when: "talent.산만함"
      나레이션: "빗소리가 너무 크다. 창밖 웅덩이에 떨어지는 빗방울을 세다가 겨우 정신을 차렸다."
    - when: "talent.완전기억"
      나레이션: "눈을 감자 그동안 읽은 책들이 쪽수째로 넘어간다. 머릿속 서가는 정리가 끝나 있다."
    - 감독관@진지: "시험지 뒤집지 마. 모래시계가 뒤집히면 시작이다. 옆 사람 답안지가 보이면, 눈을 감아라."
    - 감독관: "부정행위는 즉시 퇴학이다. 작년엔 셋 나갔다."
    - "앞쪽 자리에 붉은 리본이 보인다. 미라벨이 깃펜 끝을 고르며 등을 꼿꼿이 펴고 있다."
    - when: "rival.mirabel"
      미라벨@진지: "(돌아보지도 않고) 이번엔 숫자로 확인시켜 줄게. D반이 어디까지인지."
    - when: "affinity.bruno >= 10"
      나레이션: "옆줄의 브루노가 엄지를 들어 보였다. 손등에 잉크로 '할 수 있다'라고 써 놨다."
    - 속마음: "(원작 중간고사는 미니게임이었다. 퀴즈 열 개, 제한 시간 60초. 위키에 정답표가 있었다.)"
    - 속마음: "(문제는, 이 세계의 시험지는 위키를 안 읽었다는 거다.)"
    - "모래시계가 뒤집혔다. 사각사각, 수백 자루 깃펜이 한꺼번에 움직인다."
    - "제1문. 천 년 전 봉인을 유지하는 마나의 근원을 쓰시오. ─ 세계수 유그드."
    - "제7문. 마력 순환의 세 단계와, 각 단계에서 일어나는 폭주의 징후를 서술하시오."
    - "제12문에서 손이 멈췄다."
    - when: "synergy.학자 >= 1"
      나레이션: "멈춘 손 대신 머리가 움직였다. 읽었던 책의 쪽수, 각주, 여백의 낙서까지 차례로 떠오른다."
  check:
    type: 학식
    dc: 보통
    mods:
      - { when: "count.도서관 >= 4", value: 2, label: 도서관 공부 }
      - { when: "fatigue >= 70", value: -3, label: 피로 }
      - { when: "stress >= 60", value: -2, label: 시험 불안 }
  great:
    lines:
      - "검토를 세 번 하고도 모래가 남았다. 답안지 뒷면에 제7문의 도식을 하나 더 그려 넣었다."
      - "결과 발표 날 돌려받은 답안지엔, 그 도식 옆에 별표가 하나 그려져 있었다. 엘베라의 글씨로."
    effects: ["stat.지성 += 1"]
  fumble:
    lines:
      - "답안지를 걷어 갈 때야 봤다. 잉크병이 엎어져 3번부터 6번까지가 까만 호수가 돼 있었다."
      - 감독관: "……읽을 수 있는 데까지만 채점한다."
    effects: ["stress += 5"]
  success:
    lines:
      - "필기는 막힘없이 풀었다."
      - "깃펜이 생각보다 앞서 달렸다. 모래가 절반쯤 남았을 때 마지막 줄에 마침표를 찍었다."
      - "검토를 두 번 하고도 시간이 남았다. 창밖 빗소리가 그제야 들렸다."
      - when: "rival.mirabel"
        나레이션: "답안지를 내고 나오는데, 미라벨이 아직 쓰고 있었다. 깃펜 끝이 부러질 듯 눌려 있다."
      - 속마음: "(위키 없이도 된다. 이 몸, 생각보다 공부를 했구나. 아니, 내가 했지.)"
      - 속마음: "(내일은 실기다. 검이냐, 마법이냐, 아니면 기도냐.)"
    effects: ["mid.written = 1"]
  fail:
    lines:
      - "필기 마지막 문제를 비워 냈다."
      - "모래가 다 떨어지는 소리가 이렇게 큰 줄 몰랐다. 마지막 칸이 하얗게 남았다."
      - "답이 혀끝까지 왔는데. 감독관이 시험지를 걷어 가는 순간에야 떠올랐다."
      - 속마음: "(원작엔 정답표가 있었다는 핑계는, 여기선 안 통한다.)"
      - "젖은 우산을 펴며 생각했다. 내일은, 몸으로 하는 거다."
      - 속마음: "(검이냐, 마법이냐, 아니면 기도냐. 하나는 확실하게 잡아야 한다.)"
  next: midterm_result
  choices:
    - text: 검술 실기
      art: training_ground
      lines:
        - "둘째 날. 비가 그친 훈련장 바닥이 질척하다."
        - "허수아비 다섯 개. 가렌이 팔짱을 끼고, 채점표도 없이 서 있다."
        - 가렌: "다섯 개. 목, 어깨, 허리, 무릎, 목. 순서대로. 시작."
        - 속마음: "(가렌은 점수를 적지 않는다. 다 기억한다. 위키 별명 두 번째, '걸어 다니는 녹화 장치'.)"
        - when: "equip.무기 == '브루노목검'"
          나레이션: "브루노가 깎아 준 목검의 손잡이가 손바닥에 착 감긴다. 이니셜이 엄지에 걸린다."
      check:
        type: 완력
