          - { when: "affinity.elvera >= 15", value: 2, label: 엘베라의 조언 }
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      success:
        lines:
          - "숨을 고르고, 손끝에 마력을 실처럼 모았다. 하나. 둘."
          - "표적 다섯 개를 모두 맞혔다."
          - "마지막 표적이 터지며 흩어진 빛가루가, 비 갠 창으로 든 햇살에 반짝였다."
          - 엘베라@웃음: "예쁘게 맞히네요. 서두르지 않는 마력이에요. 요즘 애들 중엔 드물죠."
          - when: "rival.mirabel"
            미라벨@화남: "(옆 레인에서) …다섯 개는 나도 맞혔어. 나는 4초 더 빨랐고."
          - 속마음: "(엘베라 교수의 '요즘 애들'은 몇 세기 기준일까.)"
        effects: ["mid.practical = 1", "affinity.elvera += 3"]
      fail:
        lines:
          - "표적 두 개를 놓쳤다."
          - "셋째 표적이 갑자기 방향을 꺾었다. 불꽃이 표적 대신 천장 들보를 그을렸다."
          - "다섯째는 맞히긴 했다. 표적이 아니라 그 옆 화분을."
          - "깨진 화분에서 흙이 쏟아졌다. 실습실에 잠깐, 온실 냄새가 났다."
          - 엘베라: "괜찮아요. 화분은 원예부에서 새로 받으면 돼요. …아마도."
          - 속마음:
              - "(움직이는 표적은 원작 미니게임에서도 제일 짜증 나는 패턴이었다.)"
              - { when: "club == '원예부'", text: "(…리아나한테 뭐라고 하지.)" }
      great:
        lines:
          - "흩어진 빛가루를 손끝으로 모아, 작은 새 모양으로 띄웠다. 시험 범위엔 없는 동작이다."
          - "빛의 새가 실습실을 한 바퀴 돌고 창밖으로 사라졌다. 엘베라의 찻잔이 멈췄다."
          - 엘베라@진지: "……그건 누구한테 배웠어요?"
          - 나: "그냥, 해 보고 싶어서요."
          - 엘베라@웃음: "그래요. 옛날에 꼭 그렇게 말하던 사람이 있었죠. 아주 옛날에."
        effects: ["affinity.elvera += 2"]
      fumble:
        lines:
          - "놓친 불꽃 하나가 커튼 끝을 핥았다. 커튼이 순식간에 주황색이 됐다."
          - "엘베라가 찻잔의 차를 커튼에 끼얹었다. 치익. 홍차 냄새와 탄내가 섞였다."
          - 엘베라@웃음: "영점은 아니에요. 커튼은 원래 바꾸려던 참이었으니까. …아마도."
        effects: ["stress += 5"]
    - text: 신학 실기
      art: chapel
      when: "talent.성흔 or stat.의지 >= 18"
      lines:
        - "둘째 날. 비에 씻긴 성당에 촛대 스무 개가 원을 그리며 서 있다."
        - "시스터 루나가 제단 옆에서 웃고 있다. 시험관의 얼굴이 아니라, 구경꾼의 얼굴로."
        - 시스터 루나@웃음: "기도문 하나 외우면 돼요. 쉽죠? 다만 촛불이 듣고 있다는 걸 잊지 말아요."
        - when: "talent.마왕의흔적"
          나레이션: "성당 문턱을 넘자 가슴 안쪽이 욱신거린다. 촛불 스무 개가 일제히 나를 보는 것 같다."
      check:
        type: 신성
        dc: 보통
        mods:
          - { when: "count.성당 >= 3", value: 2, label: 성당 기도 }
          - { when: "affinity.sera >= 20", value: 2, label: 세라의 기도문 }
          - { when: "stress >= 60", value: -2, label: 흔들린 마음 }
      success:
        lines:
          - "기도문 첫 줄을 입에 올리자, 성당 안의 소리가 하나씩 꺼져 갔다. 빗소리, 숨소리, 내 심장 소리."
          - "기도문이 끝나자 촛불이 일제히 흔들렸다."
          - "바람은 없었다. 스무 개의 불꽃이 같은 쪽으로, 나를 향해 고개를 숙였다."
          - when: "talent.성흔"
            나레이션: "손등이 뜨거웠다. 소매 안쪽에서 희미한 빛이 새어 나오다 사라졌다."
          - 시스터 루나: "……어머. 이건 채점표에 쓸 칸이 없네요."
          - "시스터 루나는 웃고 있었다. 그런데 그 웃음이 아주 잠깐, 늦게 따라왔다."
        effects: ["mid.practical = 1", "affinity.luna += 5"]
      fail:
        lines:
          - "기도문 중간에 말이 꼬였다."
          - "'빛의 여신이시여'가 '빛의 여시니시여'가 됐다. 촛불 하나가 픽 꺼졌다."
          - "다시 처음부터 외웠다. 이번엔 촛불 둘이 꺼졌다. 혀가 굳으니 마음도 굳었다."
          - 시스터 루나@웃음: "여신님도 웃으셨겠네요. 웃음도 기도예요. 점수는 아니지만."
          - 속마음: "(원작 신학 실기는 버튼 연타였다. 혀로 하는 연타는 처음이다.)"
      great:
        lines:
          - "촛불들은 고개를 숙인 채 한참을 그대로 있었다. 기도가 끝났는데도."
          - 시스터 루나@진지: "…학생. 시험 끝나고도 성당에 자주 와요. 이건 부탁이에요."
          - "웃는 얼굴이었다. 그런데 눈은 웃지 않았다. 처음 보는 얼굴이었다."
        effects: ["affinity.luna += 2"]
    - text: 연금 실기 (희망자만)
      when: "talent.서번트.연금 or synergy.학자 >= 1"
      art: alchemy_lab
      lines:
        - "둘째 날. 실기 과목 목록 맨 아래에 누가 손글씨로 한 줄을 덧붙여 놨다. ─ 연금 (희망자만)."
        - "지하 연금술 실습실. 유황 냄새와 식은 커피 냄새. 응시자는 나 하나다."
        - "비스톨 교수가 눈 밑을 문지르며 플라스크 세 개를 내밀었다."
        - 비스톨: "상처약 기초 조합. 쑥을 빻아 증류수에. 끓이지 말고 데우기만. 호박색이 되면 통과."
        - 비스톨: "희망자가 있을 줄은 몰랐네. 덕분에 나도 오늘 시험 감독이군."
        - 속마음: "(원작 중간고사 실기는 검·마법·신학 셋뿐이었다. 연금은 회색으로 잠긴 '준비 중' 버튼이었는데.)"
      check:
        type: 손재주
        dc: 보통
        mods:
          - { when: "fired.cls_alchemy_2", value: 2, label: 상처약 수업 }
          - { when: "fatigue >= 70", value: -3, label: 피로 }
      success:
        lines:
          - "쑥을 빻고, 증류수를 붓고, 불꽃을 손톱만큼 줄였다."
          - "액체가 초록에서 연두로, 연두에서 노랑으로. 그리고 꿀을 녹인 듯한 호박색에서 멈췄다."
          - "비스톨이 플라스크를 등불에 비춰 봤다. 오래, 아무 말 없이."
          - 비스톨@진지: "…거품 하나 없군. 손이 먼저 아는 타입이야. 드물지."
          - 비스톨: "통과. 그리고 이건 버리기 아까우니 가져가서 마시게. 피곤할 때 한 모금."
          - "비스톨은 그 말만 하고 커피 잔으로 돌아섰다. 칭찬한 걸 후회하는 등이었다."
          - 속마음: "(원작의 교단 교주에게 받은 첫 칭찬. 위키에 올릴 수 없는 업적이 또 늘었다.)"
        effects: ["mid.practical = 1", "affinity.bistol += 3", "fatigue -= 10"]
      fail:
        lines:
          - "불꽃을 줄인다는 게 한 박자 늦었다. 플라스크 안에서 뽀글, 거품이 올라왔다."
          - "호박색이 되기 직전에 탁한 갈색이 됐다. 냄새가 쑥이 아니라 탄 빵이다."
          - 비스톨: "끓였군. 데우라고 했는데."
          - 나@당황: "…반쯤은 데웠습니다."
          - 비스톨@진지: "연금술에 반쯤은 없네. 반쯤 약이면, 나머지 반은 독이야."
          - "비스톨은 갈색 플라스크를 개수대에 비웠다. 그리고 잠깐, 빈 개수대를 내려다봤다."
          - 비스톨: "…그래도 손놀림은 나쁘지 않았어. 기말엔 데우기만 하게."
          - 속마음: "(원작의 교단 교주한테 위로를 받았다. 이상한 하루다.)"
        effects: ["affinity.bistol += 1"]

- id: midterm_result
  title: 중간고사 결과
  art: campus
  lines:
    - "시험이 끝나고 사흘 뒤. 장맛비가 잠깐 그친 아침."
    - "본관 앞 게시판에 결과가 붙었다. 우산을 든 학생들이 어깨를 부딪치며 몰려든다."
    - "이름을 찾는 눈들. 환호, 한숨, 누군가 우산을 바닥에 내동댕이치는 소리."
    - 속마음: "(원작에선 결과 화면에 등급이 떴다. 효과음도 등급마다 달랐지.)"
    - "사람들 틈을 비집고 들어가, 게시판 앞에 섰다. 심장이 시험 때보다 더 뛴다."
  branch:
    - when: "mid.written and mid.practical"
      lines:
        - "결과 게시판 상위권에 내 이름이 있다. 장학금 은화 30닢."
        - "한 번 더 확인했다. 맞다. 맨 위에서 손가락 두 마디 거리."
        - 학생 A: "D반이 왜 저기 있어? 잘못 붙인 거 아냐?"
        - 학생 B: "아니래. 필기도 실기도 다 통과했대."
        - { when: "origin == '악역도련님'", 학생들: "벨모어가… 공부를 했다고?" }
        - { when: "rival.mirabel", 미라벨@화남: "…다음엔 안 져." }
        - when: "rival.mirabel"
          나레이션: "미라벨은 자기 이름 대신 내 이름을 한참 노려보다가 돌아섰다."
        - when: "affinity.bruno >= 10"
          브루노@웃음: "(인파 너머에서) 야! 너 위에 있다, 위에! 오늘 저녁은 네가 사라!"
        - "행정실 창구에서 은화 서른 닢이 든 주머니를 받았다. 생각보다 묵직하다."
        - when: "origin == '몰락귀족'"
          속마음: "(서른 닢. 가문 빚에 비하면 한 방울이다. 그래도 내 손으로 번 첫 방울이다.)"
        - 속마음: "(원작에 없던 이름이 게시판 위쪽에 있다. 작은 이탈이다. 기분 좋은 쪽의.)"
      effects: ["exam.rank = 'top'", "sp += 2", "money += 30", "reputation += 10"]
    - when: "mid.written or mid.practical"
      lines:
        - "위에서 세다가 지쳐서, 아래에서부터 셌다. 그게 더 빨랐다."
        - "중간쯤. 나쁘지 않다."
        - "필기와 실기 중 하나는 해냈고, 하나는 놓쳤다."
        - 학생 B: "야, 너 몇 등? …아, 나보다 위네. 됐다, 말하지 마."
        - when: "affinity.liana >= 15"
          리아나@웃음: "중간이면 딱 좋은 거야. 화분도 처음부터 너무 크면 뿌리가 숨 막혀."
        - 속마음: "(원작으로 치면 C등급, 효과음 '띠링'. 나쁘지 않다. 좋지도 않고.)"
        - 속마음: "(무투대회까지 한 달. 놓친 하나를 메워야 한다.)"
      effects: ["exam.rank = 'mid'", "sp += 1"]
    - lines:
        - "아래에서부터 찾았다. 금방 찾았다."
        - "하위권. 담임이 면담을 잡았다."
        - 삽화: classroom
        - "면담실. 담임 교관은 내 성적표를 한참 보더니, 한숨 대신 차를 한 잔 따라 줬다."
        - 교관: "D반이니까 이 정도면 됐다고 생각하나? 아니면 아직 시작을 안 한 건가?"
        - 나: "…아직 시작을 안 한 겁니다."
        - 교관: "그럼 시작해라. 무투대회 신청서는 다음 달에 나온다."
        - 속마음: "(무투대회까지 한 달. 이대로는 안 된다.)"
        - 삽화: rain_courtyard
        - "면담실을 나서자 장맛비가 다시 쏟아졌다. 우산이 없었다. 그냥 맞으며 걸었다."
      effects: ["exam.rank = 'low'", "stress += 15"]

- id: liana_stairs
  title: 계단의 리아나
  art: cg_liana_stairs
  on: 온실
  window: "1.6"
  priority: 2
  when: "affinity.liana >= 20"
  lines:
    - "6월. 장마 틈에 해가 난 오후."
    - "온실로 가는 길은 본관 뒤편의 돌계단이다. 마흔두 칸. 비에 젖어 반질반질하다."
    - "계단 위로 리아나의 뒷모습이 보였다. 물뿌리개를 든 채, 한 칸씩 올라가고 있다."
    - "온실로 가는 계단. 리아나가 중간에 멈춰 서서 가슴을 짚는다."
    - "물뿌리개가 기울어 물이 계단으로 졸졸 흘러내린다. 리아나는 그것도 모르고 있다."
    - "어깨가 들썩인다. 숨을 들이쉬는데, 공기가 끝까지 들어가지 않는 것처럼."
    - "계단을 두 칸씩 뛰어올라 옆에 섰다."
    - 나: "리아나?"
    - 리아나@놀람: "아! 깜짝이야. 언제 왔어?"
    - "리아나가 가슴에서 손을 떼며 얼른 웃었다. 너무 빨리."
    - 리아나@웃음: "아, 괜찮아. 계단이 좀 가팔라서 그래."
    - 리아나: "오늘 습해서 그런가 봐. 하프엘프는 습기에 약하거든. …방금 지어낸 말이야."
    - "웃는 입술이 하얗다. 이마에 땀이 맺혀 있다. 스무 칸 계단에 흘릴 땀이 아니다."
    - when: "talent.직감"
      나레이션: "머릿속에서 무언가 경고한다. 이건 계단 탓이 아니다."
    - when: "talent.마력감응"
      나레이션: "리아나 안의 마력이 불규칙하게 깜빡인다. 꺼질 듯 말 듯한 등불처럼."
    - when: "note.note_liana.known"
      속마음: "(원작에도 있던 장면이다. 이 계단, 이 웃음. 그땐 그냥 지나가는 일상 컷인 줄 알았다.)"
    - when: "note.note_liana.known"
      속마음: "(2학년 여름. 전투가 길어지면, 이 심장이 버티지 못한다.)"
    - "리아나가 물뿌리개를 고쳐 들었다. 손끝이 조금 떨린다."
    - 리아나@웃음: "가자. 오늘 맨드레이크 분갈이해야 해. 걔네 소리 지르면 귀 막아."
    - 속마음: "(뭐라고 해야 할까. 이 웃음을 그대로 믿어 줘야 할까, 아니면.)"
  plants:
    - { id: F05, notice: { value: "stat.지성 + 25 * talent.직감 + 15 * talent.마력감응 - 20 * talent.눈치없음", dc: 28 } }
  choices:
    - text: 보건실에 같이 가자고 한다
      lines:
        - 나: "온실 말고 의무실부터 가자. 같이 가 줄게."
        - 리아나@당황: "에이, 무슨 의무실이야. 계단 좀 올랐다고."
        - 나: "얼굴이 하얘. 거울 보여 줄까?"
      check:
        type: 설득
        dc: 보통
        mods:
          - { when: "trust.liana >= 5", value: 2, label: 리아나의 믿음 }
          - { when: "club == '원예부'", value: 2, label: 원예부 동료 }
      success:
        lines:
          - "리아나가 입술을 깨물었다. 잠깐, 웃음이 사라졌다."
          - 리아나@웃음: "괜찮다니까. …그래도, 고마워."
          - "리아나는 결국 의무실에 가지 않았다. 대신 남은 계단을 내 소매를 잡고 올라갔다."
          - "소매를 쥔 손가락이 생각보다 차가웠다."
          - 속마음: "(억지로 끌고 갈 수는 없다. 아직은, 이 아이가 숨기고 싶어 하니까.)"
        effects: ["affinity.liana += 3", "trust.liana += 2"]
      fail:
        lines:
          - 리아나@웃음: "거울은 됐어. 내 얼굴 내가 알아. 봐, 멀쩡하지?"
          - "리아나가 보란 듯이 남은 계단을 두 칸씩 뛰어올랐다."
          - "꼭대기에서 돌아서서 손을 흔든다. 다른 손은 난간을 놓지 못하고 있었다."
          - 나: "리아나!"
          - 리아나: "괜찮다니까! 빨리 와, 맨드레이크 기다려!"
          - "따라 올라가니 리아나는 온실 문에 기대 숨을 고르고 있었다. 내가 오자 얼른 허리를 폈다."
          - 속마음: "(밀어붙였더니 더 숨긴다. 이 아이한테는, 이 방법이 아니었다.)"
        effects: ["affinity.liana += 1", "trust.liana += 1", "stress += 3"]
      great:
        lines:
          - "온실 문 앞에서, 리아나가 소매를 놓으며 작게 말했다."
          - 리아나: "…다음에 또 이러면, 그땐 같이 가 줘. 의무실."
          - "대답 대신 고개를 끄덕였다. 리아나가 웃었다. 이번 웃음은 빠르지 않았다."
        effects: ["trust.liana += 2"]
    - text: "월광초 달인 약, 아직 먹어?"
      when: "know.moonherb"
      effects: ["affinity.liana += 5", "trust.liana += 5"]
      lines:
        - "리아나의 걸음이 멈췄다. 물뿌리개 손잡이를 쥔 손에 힘이 들어간다."
        - when: "talent.완전기억"
          나레이션: "비 갠 날 온실에서 들은 말을, 토씨 하나 안 틀리고 기억하고 있었다."
        - 리아나@슬픔: "어떻게 기억했어? …요즘은 못 먹었어. 아카데미엔 월광초가 없거든."
        - 리아나: "약재상에도 없어. 달빛 받는 그날 밤에 따서 달여야 하거든. 말린 건 소용없대."
        - 리아나@웃음: "그래서 그냥 참고 있어. 겨울엔 좀 낫더라. 여름이 문제지."
        - "리아나가 계단 아래를 내려다봤다. 마흔두 칸 중 스물두 칸."
        - 리아나: "네가 기억해 줘서 좋다. 엄마 얘기, 아무한테도 안 했었거든."
        - 속마음: "(가을 보름, 숲에서 구해야 한다.)"
        - 속마음: "(달빛 받는 그 하룻밤뿐이다. 이번엔 잊으면 안 된다.)"
      branch:
        - when: "origin == '숲고아'"
          lines:
            - 나: "월광초라면 나도 봤어. 숲 깊은 데, 물 고인 바위 옆에 피더라."
            - 리아나@놀람: "…정말? 너네 숲에도 있었어?"
            - 나: "보름에만. 아침이면 꽃잎이 접혀 있어서, 처음엔 다른 풀인 줄 알았어."
            - 리아나@웃음: "맞아, 맞아! 그거야. …여기서 그걸 아는 사람을 만날 줄은 몰랐어."
            - "리아나의 숨이 아까보다 조금 길어졌다. 웃음 때문인지, 숲 이야기 때문인지."
          effects: ["trust.liana += 2"]
    - text: "너 심장 안 좋지? (원작 지식으로 말한다)"
      when: "note.note_liana.known"
      effects: ["trust.liana -= 8", "mood.liana.불안 = 1", "secret.liana = 1"]
      lines:
        - 나: "너, 심장 안 좋지?"
        - "말이 먼저 나갔다. 계단 위의 공기가 얼어붙었다."
        - 리아나@놀람: "……그걸 네가 어떻게 알아?"
        - 리아나@진지: "아무한테도 안 했어. 엄마 얘기도, 숲 무녀님 얘기도. 원예부장님한테도."
        - "초록 눈이 나를 똑바로 본다. 처음 보는 눈이다. 경계하는 짐승의 눈."
        - 나@당황: "그, 그게. 그냥… 숨 쉬는 게 이상해 보여서."
        - 리아나: "……그래. 그렇구나."
        - "리아나는 웃었다. 그런데 그 웃음은, 아까 계단에서의 웃음보다 한 칸 멀었다."
        - 속마음: "(실수했다. 아직 들은 적 없는 얘기였어.)"
        - 속마음: "(정답을 아는 것과, 그걸 말해도 되는 건 다른 문제다.)"
      branch:
        - when: "talent.달변 or talent.사람좋은얼굴"
          lines:
            - 나: "…미안. 무례했지. 우리 할머니가 꼭 그렇게 숨을 쉬셨거든. 그래서 겁이 났어."
            - "리아나의 어깨에서 힘이 조금 빠졌다."
            - 리아나: "……할머니. 그렇구나. 그럼, 걱정해서 그런 거네."
            - 속마음: "(반은 거짓말이다. 그래도 이 아이가 덜 무서워한다면, 그 반은 내가 짊어진다.)"
          effects: ["trust.liana += 3"]
    - text: 모른 척한다
      lines:
        - 나: "가자. 맨드레이크가 기다리겠다."
        - 리아나@웃음: "응! 오늘은 소리 안 지르게 살살 뽑을 거야."
        - when: "talent.직감"
          속마음: "(직감이 소리친다. 이 아이를 혼자 앞서 걷게 두지 마.)"
        - "리아나가 앞장서 계단을 올랐다. 한 칸, 한 칸. 아까보다 조금 천천히."
        - "나는 그 뒤를 한 칸 떨어져 따라갔다. 넘어지면 받을 수 있는 거리에서."
        - 속마음: "(모른 척해 주는 것도 대답일 수 있다. …그렇게 믿기로 했다.)"

- id: bistol_portrait
  title: 비스톨 교수의 보충 수업
  art: alchemy_lab
  on: 마법실습
  window: "1.6"
  priority: 1
  when: "stat.마력제어 < 25"
  lines:
    - 삽화: magic_lab
    - "마법 실습실. 엘베라 교수가 출장 중이라 오늘은 대리 감독이 들어왔다."
    - "눈 밑이 거뭇한 남자가 교탁에 기대 하품을 한다. 연금술의 비스톨 교수다."
    - "과제는 마력으로 물방울 하나를 공중에 띄워 두는 것. 10분 동안."
    - "내 물방울은 3분 만에 터졌다. 두 번째는 1분. 세 번째는 띄우지도 못했다."
    - "어느새 비스톨이 등 뒤에 서 있었다. 식은 커피 냄새와 유황 냄새가 섞여 있다."
    - 비스톨: "마력 제어가 이 모양이라니. 보충 수업이다. 내 연구실로 와."
    - 나: "지금요?"
    - 비스톨: "지금. 나도 하기 싫네. 그러니 빨리 끝내지."
    - 삽화: alchemy_lab
    - "지하 연구실. 계단을 내려갈수록 공기가 무겁고 따뜻해진다."
    - "책상 위엔 식은 커피 잔 세 개와 펼친 책 일곱 권. 증류기에서 무언가 똑, 똑 떨어진다."
    - 비스톨: "앉게. 이 플라스크에 마력을 넣어서, 끓이지 말고 색만 바꿔 봐. 파랑에서 초록으로."
    - "플라스크를 쥐었다. 마력을 넣으면 끓고, 빼면 색이 안 변한다. 그 사이 어딘가."
    - 비스톨@진지: "힘을 주지 마. 마력은 쥐는 게 아니야. 흘려보내는 거지. 수도꼭지처럼."
    - "열 번째 만에 액체가 연두색이 됐다. 비스톨은 칭찬 대신 하품을 했다."
    - "그가 커피를 데우러 등을 돌린 사이, 고개를 들었다."
    - "연구실 벽에 일곱 살쯤 된 소녀의 초상화가 걸려 있다. 액자 모서리가 닳도록 손때가 묻었다."
    - "밀짚모자를 쓰고 웃는 아이. 앞니 하나가 빠져 있다. 그린 사람이 아이를 많이 아꼈다는 게 붓질에서 보인다."
    - "연구실의 모든 게 먼지를 뒤집어썼는데, 그 액자만은 먼지 한 톨 없다."
    - "액자 아래 선반엔 토끼가 그려진 작은 찻잔 하나가 엎어져 있다."
    - when: "perk.고인물의기억 or perk.공략위키편집자"
      속마음: "(비스톨 교수. 원작 공식 심연교단 교주. …그런 사람의 연구실에, 이런 그림이.)"
    - 속마음: "(원작 연구실 배경에 이 액자가 있었던가. 늘 스킵하던 장면이라 기억이 흐리다.)"
    - 비스톨: "…뭘 보나. 수업이나 듣게."
    - "목소리가 낮았다. 화난 목소리가 아니었다. 문을 닫는 목소리였다."
    - "그는 액자 쪽으로 몸을 틀어, 내 시선을 등으로 가렸다."
    - 비스톨: "다시. 이번엔 초록에서 노랑으로. 끓이면 처음부터다."
    - "보충 수업은 해가 질 때까지 이어졌다. 플라스크 열두 개가 연두색, 노란색으로 줄을 섰다."
    - 비스톨@진지: "…됐군. 내일부턴 실습실에서 물방울 터뜨리지 말게. 거기 청소도 내가 하니까."
    - "연구실을 나서며 마지막으로 돌아봤다. 비스톨은 액자 앞에 서 있었다. 식은 커피 잔을 든 채."
    - 속마음:
        - "(피곤한 어른의 뒷모습이, 이상하게 오래 남았다.)"
        - { when: "perk.고인물의기억 or perk.공략위키편집자", text: "(이 사람이 원작에서 무엇이 되는지 안다. 그런데 지금 이 뒷모습은, 그냥 피곤한 어른이다.)" }
  effects: ["stat.마력제어 += 3", "met.bistol = 1"]
  plants:
    - { id: F06, notice: { value: "stat.지성 + 10 * talent.직감", dc: 20 } }

- id: library_ritual
  title: 금서 서가의 기록
  art: cg_forbidden_book
  on: 도서관
  window: { from: "1.6", to: "1.7" }
  priority: 1
  when: "fs.F04.seen"
  lines:
    - 삽화: library
    - "장맛비가 그치지 않는 오후. 습기 먹은 종이 냄새가 도서관에 가득하다."
    - "시험이 끝난 도서관은 텅 비었다. 서가 사이 사다리가 혼자 삐걱인다."
    - "금서 서가는 도서관 가장 안쪽, 쇠창살 문 너머에 있다. 오늘은 그 문이 반쯤 열려 있었다."
    - "금서 서가 근처에서 펼쳐진 채 버려진 책을 발견했다. 『고대 제물 의식 연구』."
    - "누군가 읽다가 급히 자리를 뜬 것 같다. 의자는 뒤로 밀려나 있고, 촛농이 아직 무르다."
    - "가죽 표지가 갈라진 낡은 책. 펼쳐진 쪽은 손때로 누렇게 변해 있다."
    - "읽으려던 게 아니었다. 그런데 펼쳐진 쪽의 삽화가 눈에 들어왔다."
    - 삽화: cg_forbidden_book
    - "삽화 속 문양. 미궁에서 본 피의 원과 똑같다."
    - "원의 가장자리를 따라 적힌 고대어. 원 한가운데에 누운 사람의 윤곽."
    - "옆 장의 본문을 손가락으로 따라 읽었다. 고대어가 반쯤 섞인 딱딱한 문장."
    - "─ 원은 피로 그린다. 제물은 산 채로, 그 한가운데에 눕힌다."
    - "다음 장부터는 누군가 먹으로 새카맣게 지워 놓았다."
    - 속마음:
        - "(사고가 아니었어. 에드릭은 제물로 바쳐질 뻔한 거야.)"
        - { when: "fate.edric == 'dead'", text: "(사고가 아니었어. 에드릭은 제물로 바쳐진 거야.)" }
        - { when: "origin == '악역도련님'", text: "(사고가 아니었어. 이 몸은… 나는 제물로 바쳐질 뻔한 거야.)" }
    - when: "fate.edric == 'dead'"
      속마음: "(공지 한 줄로 덮인 죽음. 원작 텍스트도, 이 세계의 게시판도, 똑같이 거짓말을 했다.)"
    - when: "fate.edric == 'saved'"
      속마음: "(그날 원 한가운데서 에드릭이 중얼거리던 것. 누군가를 부르던 입 모양.)"
    - 속마음: "(교단은 원작보다 빠르게 움직이고 있다. 그리고 그 원은, 한 번 쓰고 버릴 원이 아닐지도 모른다.)"
    - "등 뒤에서 마룻바닥이 삐걱였다."
    - "사서 노인이 서 있었다. 언제부터였는지 모르겠다. 등불 하나를 들고, 졸린 눈으로."
    - 사서@진지: "그 책은 원래 자리에 꽂아두게. …그런 책은 너무 오래 펼쳐두면 안 되네."
    - 나: "이 책, 누가 보던 건가요?"
    - 사서: "책은 누가 봤는지 말해 주지 않는다네. 그래서 사서가 있는 거고."
    - "그는 대답 없이 책을 받아 들었다. 덮는 손이 조심스러웠다. 상처를 덮는 손처럼."
    - 사서@슬픔: "비가 길군. 우산 없으면 저기 주인 없는 것 하나 가져가게."
    - "쇠창살 문이 닫히는 소리가 서가 사이로 오래 울렸다."
    - 속마음: "(사서는 누가 저 책을 펼쳤는지 알고 있다. 그리고 말하지 않기로 했다.)"
  pays: [F04]
  effects: ["know.sacrifice = 1"]

- id: mirabel_clash
  title: 미라벨의 시선
  on: 식당
  window: { from: "1.5", to: "1.6" }
  priority: 1
  lines:
    - "점심시간의 학생 식당. 밖에 비가 와서 평소보다 붐빈다."
    - "식판을 들고 자리를 찾다가, 창가 쪽 긴 테이블에 빈자리를 발견했다."
    - "앉자마자 주변 공기가 달라졌다. 은사 휘장을 단 학생들. 상위반 테이블이다."
    - "그 한가운데, 붉은 머리를 리본으로 묶은 소녀가 홍차 잔을 내려놓았다."
    - "꼿꼿한 등, 보라색 눈. 식판 위는 감자 스튜인데, 먹는 자세는 연회장이다."
    - 미라벨@진지: "D반은 식당도 따로 쓰면 좋겠네. 마력 냄새가 탁해."
    - "테이블 여기저기서 킥킥 웃음이 샌다. 누군가 코를 막는 시늉을 한다."
    - "미라벨 본인은 웃지 않았다. 그냥 사실을 말했다는 얼굴이다."
    - 속마음: "(미라벨 폰 아델하이트. 원작 공략 대상. 독설 대사만 모은 팬 영상이 조회수 백만이었다.)"
    - 속마음: "(…그런데 저 식판, 식당에서 제일 싼 메뉴다.)"
    - 속마음: "(받아칠까, 흘려들을까. 이 아이는 지는 걸 죽기보다 싫어한다. 그게 문이 될 수도 있다.)"
  choices:
    - text: 맞받아친다
      effects: ["rival.mirabel = 1"]
      lines:
        - "스튜를 한 숟갈 떠먹고, 천천히 숟가락을 내려놓았다."
        - 나@웃음: "그 탁한 마력한테 실기에서 지면 무슨 냄새가 날까."
      check:
        type: 위압
        dc: 보통
        mods:
          - { when: "exam.rank == 'top'", value: 3, label: 상위권 성적 }
          - { when: "reputation >= 20", value: 2, label: 평판 }
          - { when: "stress >= 60", value: -2, label: 흔들린 마음 }
      success:
        lines:
          - "테이블이 조용해졌다. 킥킥대던 학생이 숟가락을 떨어뜨렸다."
          - "미라벨의 보라색 눈이 처음으로 나를 봤다. 위아래로, 값을 매기듯."
          - 미라벨@화남: "…재밌네. 실기 시간에 보자."
          - 미라벨: "이름은 안 물어볼게. 이기고 나서 게시판에서 읽을 테니까."
          - "그녀가 식판을 들고 일어섰다. 스튜는 한 숟갈도 남기지 않았다."
          - 속마음: "(라이벌 플래그. 호감은 몰라도, 저 눈은 이제 나를 기억한다.)"
        effects: ["affinity.mirabel += 3", "trust.mirabel += 10"]
      fail:
        lines:
          - "테이블이 조용해졌다. 그리고, 누군가 푸핫 하고 웃음을 터뜨렸다."
          - "말끝이 떨렸다. 숟가락을 쥔 손도. 내 귀에도 들릴 만큼."
          - 미라벨@웃음: "냄새? 지금 나는 건 네 식은땀 냄새 같은데."
          - "웃음이 테이블 전체로 번졌다. 귀가 화끈거렸다."
          - 미라벨@진지: "그래도 대꾸는 했네. D반 치고는."
          - 미라벨: "실기 시간에 보자. 그때도 목소리 떨리나 보게."
          - "그녀가 식판을 들고 일어섰다. 스튜는 한 숟갈도 남기지 않았다."
          - 속마음: "(폼은 망했다. 그래도 저 눈에 '기억해 둘 이름' 칸이 하나 생긴 건 같다.)"
        effects: ["trust.mirabel += 4", "stress += 5"]
      great:
        lines:
          - "식당 문 앞에서 미라벨이 멈췄다. 돌아보지 않고 말했다."
          - 미라벨: "…감자 스튜, 나도 이게 제일 좋아. 오해하지 마. 싸서가 아니야."
          - 속마음: "(오해는 안 한다. 이미 알고 있으니까.)"
        effects: ["affinity.mirabel += 2"]
    - text: 무시한다
      lines:
        - "대꾸하지 않고 스튜를 먹었다. 감자가 오늘따라 퍽퍽하다."
        - when: "talent.강철멘탈"
          나레이션: "킥킥 소리가 귀에 닿기도 전에 미끄러져 나간다. 숟가락은 한 번도 멈추지 않았다."
        - when: "talent.대식가"
          나레이션: "오히려 한 그릇 더 받으러 일어났다. 상위반 테이블이 어이없다는 듯 조용해졌다."
        - "미라벨은 코웃음을 치고 지나갔다."
        - "지나가며 내 식판을 흘끗 봤다. 같은 감자 스튜. 그녀의 걸음이 아주 잠깐 멈췄다가, 다시 빨라졌다."
        - 학생 A: "(속닥) 저 D반, 반응도 안 하네. 재미없다."
        - 속마음: "(싸울 가치가 없어서가 아니다. 아직 싸울 때가 아닐 뿐.)"
    - text: 정중하게 사과한다
      requires: "talent.귀공자의품격"
      lines:
        - "자리에서 일어나, 귀족식으로 가볍게 고개를 숙였다."
        - 나: "실례했습니다. 상석인 줄 모르고 앉았군요. 자리를 옮기겠습니다."
        - "테이블이 술렁였다. D반 교복에 귀족 예법. 어울리지 않는 조합이다."
        - 미라벨: "…예법은 아는 모양이네. 아델하이트가에 대해 들어본 적은?"
      check:
        type: 학식
        dc: 쉬움
        mods:
          - { when: "origin == '몰락귀족'", value: 3, label: 귀족 족보 }
      success:
        lines:
          - 나: "불꽃의 가문이라고 들었습니다. 제국 축제의 불꽃을 대대로 맡았다고."
          - "미라벨의 눈이 아주 조금 커졌다. 그러다 금세 고개를 돌린다."
          - 미라벨@당황: "…'맡았다'. 과거형이네. 잘 아는구나."
          - "목소리가 반 톤 낮아져 있었다. 그녀는 더 말하지 않고 홍차 잔을 들었다."
          - 속마음: "(가문 이야기에선 목소리가 낮아진다. 원작 설정 그대로다. 눈앞에서 보니 훨씬 아프다.)"
        effects: ["affinity.mirabel += 5"]
      fail:
        lines:
          - 나: "물론입니다. 서부의… 포도주로 이름난 가문이라고."
          - "테이블의 공기가 한 번 더 얼었다. 이번엔 다른 방향으로."
          - 미라벨@화남: "그건 다른 집이야. 우린 불꽃이야. 축제의 불꽃."
          - 나@당황: "…실례했습니다. 두 번째 실례군요."
          - 미라벨: "예법은 외웠는데 족보는 안 외웠구나. 반쪽짜리네."
          - "그래도 그녀는 내가 자리를 옮기는 걸 막지 않았다. 대신 홍차 잔을 들어 얼굴을 가렸다."
          - "잔 너머로 입꼬리가 아주 조금 올라가 있었던 것 같다. 기분 탓일지도."
          - 속마음: "(위키에 '아델하이트 = 불꽃' 한 줄이 있었는데. 이 몸은 긴장하면 위키가 안 열린다.)"
        effects: ["affinity.mirabel += 2"]
      great:
        lines:
          - 나: "마지막 불꽃은 늘 장미 모양이었다고 들었습니다. 아델하이트의 장미."
          - "미라벨의 손에서 찻잔이 아주 작게 달그락거렸다."
          - 미라벨@당황: "……그건, 축제에 와 본 사람만 아는 건데."
          - "그녀는 그 뒤로 한참 아무 말도 하지 않았다. 홍차가 식을 때까지."
        effects: ["affinity.mirabel += 2", "trust.mirabel += 3"]

# ---------------------------------------------------------------- 반복 장면 (조건 없는 일상 묘사, 다른 이벤트가 없을 때)

- id: canteen_flavor
  on: 식당
  repeat: true
  lines:
    - 나레이션:
        - "오늘의 메뉴는 감자 스튜다."
        - { when: "talent.대식가", text: "세 그릇째. 배식 아주머니가 웃으며 한 국자 더 얹어준다." }
        - { when: "talent.혐오스러운분위기", text: "배식 아주머니가 국자를 떨어뜨렸다. \"아, 아니 그냥… 손이 미끄러져서.\"" }
        - { when: "talent.악명높은가문", text: "내 주변 자리만 비어 있다." }
        - { when: "talent.악명높은가문 and fate.edric == 'alive'", text: "주변 자리가 비어 있지만, 오늘은 누군가 옆에 앉았다. \"…미궁에서 살아 나왔다며?\"" }
    - 나레이션:
        - "옆 테이블에서 누가 누구를 좋아한다는 소문이 한창이다."
        - { when: "time.month == 3", text: "아직 서로 이름도 모르는 신입생들이 어색하게 마주 앉아 숟가락만 젓는다." }
        - { when: "time.month == 5", text: "창밖 신록이 눈부시다. 옆 테이블은 미궁 실습 이야기로 시끄럽다." }
        - { when: "time.month == 6", text: "장맛비가 유리창을 두드린다. 젖은 우산 냄새와 스튜 김이 뒤섞인다." }
        - { when: "time.month == 7", text: "옆 테이블에서 무투대회 대진표를 펼쳐 놓고 내기를 하고 있다." }
    - 나레이션:
        - "따뜻한 국물이 위에 닿자 어깨가 조금 풀린다."
        - { when: "fatigue >= 60", text: "숟가락을 든 채 꾸벅 졸았다. 스튜 표면에 비친 얼굴이 피곤하다." }
        - { when: "stress >= 50", text: "씹어도 맛이 안 난다. 머릿속이 다른 데 가 있다." }
        - { when: "money < 10", text: "빵은 두 개 대신 하나. 남은 은화를 세어 보니 손가락이 남는다." }
    - when: "time.roll < 0.5"
      속마음:
        - "(10년 뒤에도 이 식당이 있을까. …있게 만들어야지.)"
        - { when: "time.roll < 0.2", text: "(원작에선 식당 아이콘 누르면 체력 +10, 끝. 국물로 회복하는 건 처음이다.)" }
        - { when: "time.roll > 0.35", text: "(감자 스튜 연속 출장 중. 이 세계 영양사는 패치가 필요하다.)" }

- id: library_flavor
  on: 도서관
  repeat: true
  lines:
    - 나레이션:
        - "책장 넘기는 소리만 들린다."
        - { when: "talent.완전기억", text: "한 번 읽은 문장이 머릿속에 그대로 새겨진다." }
        - { when: "talent.산만함", text: "세 줄 읽고 창밖을 봤다. 다시 세 줄 읽고 창밖을 봤다." }
    - 나레이션:
        - "창가 자리에 햇빛이 비스듬히 눕는다. 먼지가 빛 속에서 천천히 돈다."
        - { when: "time.slot == '밤'", text: "등불 하나가 책상 위에 둥근 섬을 만든다. 그 밖은 온통 서가의 그림자다." }
        - { when: "time.month == 6", text: "빗소리가 창을 두드린다. 습기 먹은 책장이 무겁게 넘어간다." }
        - { when: "time.slot == '주말'", text: "주말 도서관은 텅 비었다. 대출 창구에서 사서 노인의 코 고는 소리가 들린다." }
    - 나레이션:
        - "공책 한 장이 빽빽해졌다."
        - { when: "fatigue >= 60", text: "글자가 둘로 보인다. 같은 문단을 세 번째 읽고 있다." }
        - { when: "talent.집중력", text: "고개를 드니 촛불이 한 뼘이나 줄어 있었다. 공책이 빽빽하다." }
        - { when: "time.roll < 0.25", text: "옆 서가에서 누가 책을 떨어뜨렸다. 쿵. 사서 노인이 한쪽 눈만 떴다가 감는다." }
    - when: "time.roll > 0.5"
      속마음:
        - "(원작에선 도서관 = 지성 +1 버튼이었다. 이렇게 조용한 곳인 줄 몰랐다.)"
        - { when: "talent.망각증", text: "(어제 읽은 게 뭐였더라. …공략 노트부터 다시 보자.)" }
        - { when: "perk.고인물의기억", text: "(원작 도서관의 책 제목은 전부 개발진 농담이었다. 여기 책은 끝까지 진짜로 쓰여 있다.)" }

- id: magic_flavor
  on: 마법실습
  repeat: true
  lines:
    - 나레이션:
        - "작은 불꽃을 손끝에 띄우는 연습을 했다."
        - { when: "talent.마력폭주체질", text: "불꽃이 튀었다. 교관이 한숨을 쉬며 소화 마법을 건다." }
        - { when: "talent.마나탱크", text: "불꽃이 아니라 화염 기둥이 솟았다. 주변 학생들이 물러선다." }
        - { when: "talent.마나회로손상", text: "아무것도 나오지 않는다. 손끝만 저릿하다." }
    - 나레이션:
        - "실습실 공기가 마력으로 미지근하다. 플라스크 속 빛이 천천히 숨 쉰다."
        - { when: "talent.섬세한제어", text: "불꽃 크기를 손톱만큼씩 조절해 봤다. 마력이 손끝에 착 붙는다." }
        - { when: "time.slot == '밤'", text: "밤의 실습실. 떠다니는 빛 구슬 몇 개만 남아 천장을 맴돈다." }
        - { when: "time.month == 6", text: "장마철 습기에 마법진 잉크가 번진다. 다들 젖은 소매 말리는 마법부터 연습 중이다." }
    - 나레이션:
        - "손끝이 저릿하다. 그래도 어제보다 불꽃이 오래 버텼다."
        - { when: "fatigue >= 60", text: "마력이 바닥을 긁는다. 눈앞이 하얘져서 책상을 짚었다." }
        - { when: "talent.무영창소질", text: "주문을 다 외우기도 전에 불꽃이 먼저 피었다. 옆자리 학생이 두 번 쳐다봤다." }
        - { when: "time.roll < 0.25", text: "옆자리에서 펑 소리. 누군가의 앞머리가 그을렸다. 다들 웃음을 참는다." }
