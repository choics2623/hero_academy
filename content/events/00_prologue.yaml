# 서장: 입학 전 한 달. 행동 8회로 기연을 골라야 한다.

- id: p_awaken
  title: 빙의
  art: cg_last_ending
  on: auto
  at: "0.2.1.오전"
  priority: 10
  lines:
    # ── 마지막 밤
    - "3,000시간째의 플레이. 37번째 배드 엔딩."
    - "모니터 속 하늘이 붉게 타고 있다. 첨탑이 하나씩, 소리도 없이 무너진다."
    - "불티가 화면 아래에서 위로 천천히 떠오른다. 이 그림만 서른일곱 번째 본다."
    - "새벽 세 시. 불 꺼진 원룸에서 빛나는 건 모니터 하나뿐이다."
    - "책상 구석엔 다 식은 컵라면. 국물 위로 기름이 하얗게 굳었다."
    - "휴대폰이 한 번 켜졌다 꺼진다. ── 엄마: 밥은 먹고 하냐."
    - "답장은 내일 하자. 그렇게 생각한 게 벌써 사흘째다."
    - "《에테르 크로니클》. 서비스 10년 차의 아카데미 육성 RPG."
    - "줄여서 '에테크'. 커뮤니티에선 '에휴 테크트리'의 줄임말이라고들 했다."
    - "엔딩은 서른일곱 개. 그 서른일곱 개가 전부, 배드 엔딩 아니면 노멀 엔딩이다."
    - 속마음: "(모든 길이 멸망으로 통하는 게임. 그걸 알면서 3,000시간을 갈아 넣었다.)"
    - "오늘 본 게 마지막 하나였다. 이걸로 엔딩 목록에 빈칸이 없다."
    - "이번엔 다를 줄 알았다. 한 번도 안 고른 선택지만 골라서 여기까지 왔으니까."
    - "화면 가득 마지막 문장이 떠오른다. ── 그리고 세계는, 다시 처음으로."
    - "서른일곱 개의 엔딩이 전부 이 문장으로 끝난다. 한 글자도 다르지 않게."
    - 속마음: "(그래. 처음으로 돌아가겠지. 그리고 또 다 죽겠지.)"
    - "마우스에서 손을 뗐다. 손바닥이 땀으로 끈적했다."
    - "오늘을 마지막으로 지우겠다고 정해 둔 밤이었다. 삭제 버튼 위치도 봐 두었다."
    - "연락이 끊긴 개발사 '망각'의 마지막 패치 노트. 그 맨 아래에 붙어 있던 한 줄."
    - "── 그 아이들을 모두 구할 수 있는 건, 이 세계 바깥의 누군가뿐입니다."
    - 속마음: "(바깥의 누군가는 3,000시간을 썼다고. 그래도 못 구했다고.)"
    # ── 시스템 메시지
    - "엔딩 크레딧이 올라가지 않았다."
    - "화면이 까맣게 꺼진다. 타이틀 화면도, 로딩 바도 없다."
    - "까만 화면 한가운데에 하얀 글자가 한 자씩 찍히기 시작했다."
    - 시스템: "[모든 결말을 확인했습니다. 37 / 37]"
    - 시스템: "[이 세계 바깥의 누군가를, 찾았습니다.]"
    - 속마음:
        - "(…뭐야. 히든 이벤트? 10년 동안 다들 클라이언트를 다 뜯어봤는데.)"
        - { when: "perk.데이터마이너", text: "(이런 텍스트는 없었다. 클라이언트 파일은 내가 한 줄도 빠짐없이 뜯어봤다.)" }
    - 시스템: "[다시 시작하시겠습니까?]"
    - "그 아래로 선택지 두 개가 떠오른다. [예] [아니요]"
    - "방이 이상할 만큼 조용하다. 냉장고 소리도, 창밖의 차 소리도 없다. 커서만 깜빡인다."
    - "손이 마우스로 갔다."
    - "무엇을 누르려 했는지는 지금도 모르겠다."
    - "다만 딸깍, 하는 소리는 분명히 들었다."
    # ── 어둠
    - "모니터가 꺼졌다. 창밖의 가로등이, 휴대폰 불빛이, 내 숨소리가 차례로 꺼졌다."
    - "어둠."
    - "떨어지는지 떠오르는지 알 수 없다. 몸이라는 게 있었는지도 모르겠다."
    - "아주 멀리서, 누군가 종이를 찢는 소리가 났다."
    - "???": "……닿았구나."
    - "???": "미안해. 그리고, 부탁해."
    - "대답하려고 입을 열었다. 입이 어디 있는지 알 수 없었다."
    # ── 깨어남
    - "눈을 뜨자 낯선 천장이 보인다."
    - "천장의 무늬를 멍하니 셌다. 하나, 둘, 셋. …내 방 천장엔 무늬가 없다."
    - 나레이션:
        - "삐걱거리는 다락방. 창밖으로 아카데미 첨탑이 보인다."
        - { when: "origin == '몰락귀족'", text: "곰팡이 핀 벽지와 빛바랜 가문 문장. 몰락한 귀족가의 방이다." }
        - { when: "origin == '악역도련님'", text: "지나치게 화려한 침대. 문밖에서 하인들이 숨죽여 속삭인다. ─ 도련님이 깨셨어." }
        - { when: "origin == '엑스트라'", text: "아카데미 근처 싸구려 여관. 침대 옆에 입학 통지서가 놓여 있다." }
        - { when: "origin == '숲고아'", text: "나무 냄새가 나는 오두막. 새들이 창틀에서 이쪽을 보고 있다." }
    - 나레이션:
        - "아래층에서 빵 굽는 냄새가 계단을 타고 올라온다. 이스트와 버터, 장작 연기."
        - { when: "origin == '몰락귀족'", text: "곰팡내 사이로 다 타 버린 밀랍 냄새가 남아 있다. 벽난로는 차갑다." }
        - { when: "origin == '악역도련님'", text: "장미 향수 냄새가 지독하다. 숨을 쉴 때마다 목이 따갑다." }
        - { when: "origin == '엑스트라'", text: "벽 너머에서 코 고는 소리. 문틈으로 김빠진 맥주 냄새가 스며든다." }
        - { when: "origin == '숲고아'", text: "송진 냄새와 젖은 흙냄새. 문틈으로 찬 숲바람이 새어 든다." }
    - "몸을 일으켰다. 가볍다. 아니, 가벼운 게 아니라 낯설다."
    - "팔을 뻗었다가, 손에서 눈을 뗄 수가 없었다."
    - "내 손이 아니다. 손가락 길이도, 손톱 모양도, 손등의 점 하나까지."
    - "마우스를 쥐던 자리에 박여 있던 굳은살이 없다."
    - "목이 칼칼하다. 헛기침을 한 번 했다."
    - 나@당황: "…아, 아. 뭐야, 이 목소리."
    - "내 목소리가 아니다. 남의 목에서 내 말이 나온다."
    - when: "talent.병약"
      나레이션: "기침이 멎지 않는다. 이 몸은 생각보다 약하다."
    - 나@놀람: "잠깐. 잠깐만. 여기 어디야."
    - "침대에서 굴러떨어지듯 내려왔다. 맨발에 닿은 바닥이 얼음장이다."
    - when: "talent.겁쟁이"
      나레이션: "무릎이 후들거려서, 한참 동안 침대 기둥을 붙잡고 서 있었다."
    - "꿈이다. 너무 오래 게임을 붙잡고 있어서 꾸는 꿈."
    - "볼을 꼬집었다. 아프다. 남의 볼인데, 아픈 건 나다."
    - 속마음: "(꿈에서 꼬집으면 안 아프다던데. 그 말 처음 한 사람 누구야.)"
    - 목소리:
        - "얘야, 일어났니? 늦잠 자도 된다곤 했다만, 수프 다 식는다!"
        - { when: "origin == '몰락귀족'", text: "막내야, 일어났으면 내려오너라. 은행에서… 또 편지가 왔다." }
        - { when: "origin == '악역도련님'", text: "도, 도련님. 아침 식사를… 들여도 되겠습니까?" }
        - { when: "origin == '엑스트라'", text: "손님! 아침은 따로 돈 받수! 먹을 거면 내려오고!" }
        - { when: "origin == '숲고아'", text: "일어났으면 물 길어 와라. 해가 중천이다." }
    - 나레이션:
        - "반사적으로 대답해 버렸다. ── 네, 지금 내려가요!"
        - { when: "origin == '몰락귀족'", text: "반사적으로 '네, 아버지'라고 대답했다. 아버지라는 말이 혀끝에 걸렸다." }
        - { when: "origin == '악역도련님'", text: "반사적으로 '네, 고마워요'라고 대답했다. 문밖에서 쟁반 떨어지는 소리가 났다." }
        - { when: "origin == '엑스트라'", text: "반사적으로 '안 먹어요'라고 대답했다. 주머니 사정은 몸이 먼저 아는 모양이다." }
        - { when: "origin == '숲고아'", text: "반사적으로 '네' 하고 대답했다. 문밖이 잠깐 조용했다. ─ …언제부터 그리 고분고분했누." }
    - "대답하고 나서야 소름이 돋았다. 저 목소리는 나를 안다. 나는 저 목소리를 모른다."
    # ── 창밖
    - "비틀거리며 창가로 갔다. 유리에 성에가 꼈다. 소매로 문질렀다."
    - 나레이션:
        - "지붕들 너머, 아침 안개 위로 하얀 첨탑이 솟아 있다."
        - { when: "origin == '몰락귀족'", text: "잡초가 무릎까지 자란 정원 너머, 아침 안개 위로 하얀 첨탑이 솟아 있다." }
        - { when: "origin == '악역도련님'", text: "얼어붙은 분수 너머, 도시의 지붕들 위로 하얀 첨탑이 솟아 있다." }
        - { when: "origin == '엑스트라'", text: "길 하나 건너, 손을 뻗으면 닿을 것 같은 거리에 하얀 첨탑이 서 있다." }
        - { when: "origin == '숲고아'", text: "헐벗은 나무 꼭대기들 너머, 아주 멀리 하얀 첨탑 끝이 보인다." }
    - "본 적 있는 실루엣이다. 3,000시간 동안, 타이틀 화면에서 매일 본."
    - 나@놀람: "…루미에르 아카데미?"
    - 나레이션:
        - "책상 위에 입학 통지서가 펼쳐져 있다. 금박 테두리에 아카데미의 봉랍."
        - { when: "origin == '평민장학생'", text: "책상 위에 입학 통지서가 펼쳐져 있다. 맨 윗줄에 굵게, '특별 장학생'." }
        - { when: "origin == '엑스트라'", text: "침대 옆의 입학 통지서를 집어 들었다. 금박 테두리에 아카데미의 봉랍." }
    - "── 왕립 루미에르 아카데미 신입생 입학식. 3월 첫째 주."
    - "통지서 귀퉁이에 누군가 날짜를 세며 가위표를 쳐 놓았다. 2월 첫째 주까지."
    - 속마음: "…에테크잖아. 그것도 입학 한 달 전."
    - 나@당황: "하. 하하. 진짜로?"
    - "웃음이 나왔다. 웃을 일이 아닌데, 멈추지 않았다."
    # ── 거울
    - "방 한쪽에 거울이 있다. 다가가기까지 한참 걸렸다."
    - 나레이션:
        - "모르는 얼굴이 나를 본다. 내가 눈을 깜빡이면, 그 얼굴도 깜빡인다."
        - { when: "talent.미모", text: "모르는 얼굴이 나를 본다. 지나치게 반듯해서, 남의 초상화를 보는 것 같다." }
        - { when: "talent.거구", text: "거울에 어깨가 다 들어오지 않는다. 허리를 숙여야 모르는 얼굴이 보인다." }
        - { when: "talent.키작음", text: "거울이 너무 높다. 발꿈치를 들어야 겨우, 모르는 얼굴의 눈이 보인다." }
    - "오른손을 들자 거울 속 얼굴이 왼손을 든다. 당연한 일인데 소름이 돋았다."
    - when: "talent.혐오스러운분위기"
      나레이션: "거울 속 얼굴은 어딘가 섬뜩하다. 웃어 보려 했지만 더 무서워졌다."
    - when: "origin == '악역도련님'"
      속마음: "(잠깐. 이 얼굴… 1권에서 죽는 에드릭 벨모어잖아?)"
    - when: "origin == '악역도련님'"
      속마음: "(1학년 5월, 미궁 3층에서 혼자 죽는 망나니. 원작은 그걸 사고라고 불렀다.)"
    - when: "origin != '악역도련님'"
      속마음: "(…모르는 얼굴이다. 위키의 캐릭터 문서 수백 개를 다 외웠는데.)"
    - when: "origin != '악역도련님'"
      속마음: "(일러스트도 없는 엑스트라. 학생 명부에 이름 한 줄로만 남는.)"
    - when: "perk.상태창"
      나레이션: "거울 속 얼굴 옆으로 반투명한 창이 떠올랐다. 수천 번 열어 본 그 창이다."
    - when: "perk.상태창"
      시스템: "[상태창] 근력 {{stat.근력}} · 마력량 {{stat.마력량}} · 지성 {{stat.지성}} · 매력 {{stat.매력}}"
    - when: "talent.몸주인의잔재"
      나레이션: "거울에서 눈을 돌리자, 손이 저절로 책상 서랍으로 뻗어 있었다. 내가 움직인 게 아니다."
    # ── 공황
    - "숨이 가빠진다. 방이 점점 좁아지는 것 같다."
    - "나가야 한다. 어디로든. 문 쪽으로 손을 뻗었다."
    - when: "talent.천생신력"
      나레이션: "문고리를 잡았더니 문고리가 빠졌다."
    - "그리고 그 자리에 멈춰 섰다."
    - 나@진지: "…나가서, 어디로 가는데."
    - "돌아갈 방이 없다. 식은 컵라면도, 답장 못 한 문자도, 저 너머 어딘가에 있다."
    - when: "talent.망각증"
      나레이션: "엄마한테 뭐라고 답장하려 했더라. 벌써 그게 흐릿하다."
    - "다리에 힘이 풀려 침대 끝에 주저앉았다."
    - when: "talent.강철멘탈"
      나레이션: "심장이 이상할 만큼 빨리 가라앉는다. 공포보다 계산이 먼저 돌기 시작한다."
    - 속마음: "(진정해. 진정하고, 생각해. 3,000시간 동안 내가 제일 잘한 게 그거잖아.)"
    # ── 이 세계
    - "눈을 감자, 위키 문서가 한 장씩 넘어가듯 떠오른다."
    - "대륙 아스테라. 천 년 전, 초대 용사가 성검 에테르로 마왕을 봉인한 세계."
    - "그리고 10년 뒤, 반드시 멸망하는 세계."
    - "6년차 겨울, 황제가 암살당하고 제국이 둘로 쪼개진다."
    - "7년차, 세계수 유그드가 말라 죽는다. 봉인을 떠받치던 힘도 같이 마른다."
    - "8년차 봄, 아카데미 지하 미궁에서 차원문이 열린다."
    - "9년차 가을, 봉인이 깨지고 마왕 이그니스가 눈을 뜬다."
    - "그 사이 어딘가에서, 동료를 잃은 주인공의 성검이 마검이 된다."
    - "DLC 데이터에만 있던 고대 용. 그리고 아무도 정체를 모르는, 10년의 끝."
    - "얼굴들이 하나씩 떠오른다."
    - "2학년 여름, 숲에서 죽는 하프엘프 소녀."
    - 나레이션:
        - "1학년 5월, 미궁 3층에서 시체로 발견되는 도련님."
        - { when: "origin == '악역도련님'", text: "1학년 5월, 미궁 3층에서 시체로 발견되는 도련님. ……지금의 나." }
    - "반 배정 시험장에서 쓰러져, 그대로 고향에 돌아가는 은발 소녀."
    - "장벽에서 죽는 교관. 수도 습격에서 죽는 대장장이 아들."
    - 속마음: "(서른일곱 번을 돌아도, 이 중 절반도 막지 못했다.)"
    - "원작 주인공은 한 명이고, 몸도 하나다."
    - "같은 주에 터지는 사건 두 개를 동시에 막을 수는 없었다. 시스템이 허락하지 않았다."
    - 속마음: "(그래서 진엔딩이 없었다. 그게 커뮤니티의 오래된 결론이었다.)"
    - 속마음:
        - "(3,000시간의 기억은 아직 선명하다. 아직은.)"
        - { when: "perk.고인물의기억", text: "(기억은 선명하다. 대사 한 줄, 선택지 하나까지 전부.)" }
        - { when: "perk.공략위키편집자", text: "(내가 쓴 공략 문서만 수백 개다. 기연이 어디 묻혀 있는지 눈 감고도 그린다.)" }
        - { when: "perk.데이터마이너", text: "(미구현 데이터까지 안다. 이벤트 없이 스탯만 박혀 있던 이름 없는 NPC들도.)" }
        - { when: "perk.최적동선", text: "(하루를 낭비 없이 쓰는 법이라면 자신 있다. 스피드런 기록 보유자니까.)" }
        - { when: "perk.감정안", text: "(아까부터 눈이 이상하다. 사람을 오래 보면, 그 위로 숫자가 겹쳐 보일 것 같다.)" }
    # ── 결심
    - "패치 노트의 그 한 줄이 다시 떠오른다. ── 이 세계 바깥의 누군가뿐입니다."
    - 속마음: "(주인공은 하나다. 하지만 지금 이 세계엔, 시스템 바깥의 변수가 하나 있다.)"
    - 속마음: "(…나.)"
    - 나@진지: "…좋아."
    - "주먹을 쥐었다. 남의 손인데, 쥐는 힘은 내 것이었다."
    - 속마음: "(서른일곱 번 졌다. 서른여덟 번째는, 화면 밖에서 한다.)"
    - "남은 시간은 10년. 아무것도 바꾸지 않으면, 세계는 멸망한다."
  next: p_diary

- id: p_diary
  title: 몸 주인의 일기장
  art: cg_diary
  lines:
    - "창밖이 희뿌옇게 밝아 온다. 방을 뒤지기 시작했다."
    - "이 몸이 누구인지 알려 줄 무언가가 필요했다. 무엇이든."
    - "옷 몇 벌, 낡은 신발, 침대 밑의 먼지. 책상 맨 아래 서랍만 뻑뻑하게 걸린다."
    - 나레이션:
        - "힘을 주어 당기자 서랍이 덜컹 열렸다."
        - { when: "talent.천생신력", text: "살짝 당겼는데 서랍이 통째로 빠져나왔다. 또." }
    - "서랍 속에 일기장이 있다. 이 몸의 원래 주인 것이다."
    - "가죽 표지가 손때로 반질반질하다. 모서리가 둥글게 닳았다."
    - 속마음: "(남의 일기를 읽는 건 실례다. …남의 몸을 쓰는 건 실례가 아니고?)"
    - "첫 장을 넘겼다."
    - 나레이션:
        - "── 장학생 합격. 엄마가 반죽을 하다 말고 울었다. 미나는 첨탑 쪽으로 손을 흔들었다."
        - { when: "origin == '몰락귀족'", text: "── 은행 사람이 또 왔다. 아버지는 서재 문을 잠갔다. 큰형은 오늘 장벽으로 떠났다." }
        - { when: "origin == '악역도련님'", text: "── 어머니 기일. 아버지는 묘 앞에서 한마디도 하지 않았다. 하인들은 나를 보면 숨는다." }
        - { when: "origin == '엑스트라'", text: "── 여관 천장의 얼룩을 셌다. 마흔세 개. 오늘 나와 말한 사람은 여관 주인 하나." }
        - { when: "origin == '숲고아'", text: "── 할멈은 글을 모른다. 그래서 여기 쓴다. 오늘 옹이가 들쥐를 물어 왔다." }
    - "평범한 하루들이 몇 장이나 이어진다. 날씨, 끼니, 누군가와 나눈 짧은 말."
    - when: "origin == '평민장학생'"
      나레이션: "글씨가 묘하게 왼쪽으로 누워 있다. 내 글씨와는 기울기부터 다르다."
    - when: "origin == '엑스트라'"
      나레이션: "── 아무도 내 이름을 기억하지 못한다. 그러니까 적어 둔다. 내가 여기 있었다고."
    - "그런데 중간부터, 글씨가 달라진다."
    - "획이 급해지고, 같은 단어를 몇 번이고 덧썼다. 펜 끝에 종이가 찢길 만큼."
    - "── 또 그 꿈. 붉은 하늘. 무너지는 첨탑."
    - "페이지를 넘기던 손이 멈췄다."
    - 속마음: "(…엔딩 일러스트다. 서른일곱 번 본, 바로 그 그림.)"
    - "── 날짜를 세어 봤다. 셀 때마다 숫자가 맞는다. 그래서 무섭다."
    - when: "origin == '악역도련님'"
      나레이션: "── 꿈에서 어머니가 불렀다. 아주 깊은 데서. 내려오라고."
    - when: "origin == '숲고아'"
      나레이션: "── 옹이가 밤새 울었다. 할멈 말로는, 부엉이는 다가오는 것을 보고 운다고 한다."
    - "── 아무도 믿지 않는다. 당연하다. 나도 내가 미쳤다고 생각한다."
    - "마지막 몇 장은 거의 비어 있다. 한 장에 한 줄, 그것도 아주 짧게."
    - "── 나로는 안 된다."
    - "── 바깥이 필요하다."
    - 속마음: "(바깥.)"
    - "마지막 장은 찢겨 나갔다. 남은 건 한 줄뿐이다."
    - "찢긴 자국이 반듯하다. 서두르지 않고, 자를 대고 천천히 뜯어낸 자국이다."
    - "그 아래, 남은 종이 귀퉁이에 꾹꾹 눌러쓴 글씨."
    - "── 바깥의 누군가에게 닿기를."
    - when: "talent.몸주인의잔재"
      속마음: "(가슴 한쪽이 아프다. 내 감정이 아닌 것 같은데.)"
    - when: "talent.몸주인의잔재"
      나레이션: "손끝이 찢긴 자리를 더듬는다. 무엇이 적혀 있었는지, 손가락만 기억하는 것 같다."
    - "어둠 속에서 들은 목소리가 귓가에 되살아났다. ……닿았구나."
    - 속마음: "(우연이겠지. 우연이어야 한다.)"
    - "일기장을 쥔 손끝이 차갑다. 창밖에서 첫 새가 울었다."
    - 속마음: "(이걸 가지고 다니면, 이 몸 주인의 무언가까지 같이 짊어지는 기분이다.)"
  plants:
    - { id: F14, notice: { value: "stat.지성 + 15 * talent.몸주인의잔재", dc: 18 } }
  choices:
    - text: 일기장을 챙긴다
      effects: ["item.일기장 = 1"]
      lines:
        - "일기장을 품에 넣었다. 언젠가 의미를 알게 될 것 같다."
        - "가죽 표지가 가슴께에 닿는다. 생각보다 따뜻하다."
        - "귀퉁이에 동그랗게 번진 얼룩이 있다. 오래전의 눈물 자국인지, 방금 내 손의 땀인지."
        - 속마음: "(당신이 누구였든. 찢어 간 장에 무엇이 적혀 있었든.)"
        - 속마음: "(당신이 부른 게 나라면, 적어도 끝까지 읽어는 줄게.)"
        - when: "talent.몸주인의잔재"
          나레이션: "가슴의 통증이 조금 가라앉았다. 이 몸이 안도하는 것 같다."
        - "옷깃을 여몄다. 문밖에서 나를 부르는 소리가 다시 들렸다."
    - text: 서랍에 도로 넣어둔다
      lines:
        - "남의 일기다. 지금은 덮어두자."
        - "일기장을 서랍 안쪽 깊숙이 밀어 넣고, 서랍을 닫았다."
        - "덜컹. 소리가 생각보다 크게 울렸다."
        - 속마음: "(내 인생 하나 감당하기도 벅차다. 남의 인생까지는, 아직.)"
        - when: "talent.몸주인의잔재"
          나레이션: "가슴 한쪽이 욱신거렸다. 서운하다는 듯이."
        - "서랍 손잡이에서 손을 떼는 데 시간이 조금 걸렸다."
        - 속마음: "(나중에. 정말로 필요해지면, 그때.)"

# ---------------------------------------------------------------- 폐광 (3단계 연속 스토리렛)

- id: mine_1
  title: 폐광 입구
  on: 폐광
  lines:
    - "마을 뒤 언덕길. 2월의 바람이 귓바퀴를 할퀸다."
    - "녹다 만 눈이 진창이 되어 발목까지 빠진다. 입김이 하얗게 흩어진다."
    - "길 끝, 무너진 목책 너머로 검은 구멍이 입을 벌리고 있다."
    - "썩은 나무 팻말. 붉은 페인트가 다 벗겨진 글씨. ── 출입 금지."
    - "마을 뒤 폐광. 원작에선 2학년 때 아렌이 영약을 얻는 곳이다."
    - 속마음: "(공략 위키에 '필수 기연'이라고 굵게 적혀 있던 곳. 화면으로는 백 번도 넘게 왔다.)"
    - "언덕 아래에서 나뭇짐을 진 노파가 걸음을 멈췄다."
    - 노파: "거기, 젊은이. 그 굴엔 들어가지 말어."
    - 노파@진지: "광부들 떠난 지 스무 해야. 지난가을엔 염소가 들어갔다가 뼈만 나왔지."
    - 나@당황: "뼈만요?"
    - 노파: "굴 쥐들 짓이래. 놈들은 개만 해. 배가 고프면 사람도 물어."
    - 노파:
        - "…뭐, 말려도 들어갈 얼굴이구먼. 젊은 것들은 다 그래."
        - { when: "talent.혐오스러운분위기", text: "…아, 아니다. 젊은이는 쥐들이 알아서 피하겠구먼. 알아서 하구려." }
        - { when: "talent.사람좋은얼굴", text: "…쯧, 착하게 생겨 가지고. 들어가더라도 해 지기 전엔 나와. 알았지?" }
    - "노파는 혀를 차며 언덕을 내려갔다. 몇 번이나 뒤를 돌아보면서."
    - "입구 앞에 섰다. 갱도 안에서 바람이 불어 나온다."
    - "겨울바람인데 이상하게 미지근하다. 축축한 땅속 냄새."
    - "녹슨 랜턴이 입구 기둥에 걸려 있다. 흔들어 보니 기름이 조금 남았다."
    - "불을 붙이자 버팀목들이 노랗게 떠오른다. 벽 곳곳에서 광석 부스러기가 반짝인다."
    - 속마음: "(그래픽보다 좁다. 화면에선 캐릭터가 성큼성큼 걸어 들어갔는데.)"
    - "몇 걸음 들어갔다. 발밑에서 무언가 바스락 부서진다. 작은 뼈다."
    - "안쪽에서 무언가 긁는 소리가 난다."
    - "사각. 사각사각. 한 마리가 아니다. 소리가 벽을 타고 사방으로 번진다."
    - "랜턴 불빛이 닿는 끝에서, 붉은 점 몇 쌍이 동시에 깜빡였다. 눈이다."
    - when: "talent.겁쟁이"
      속마음: "(…오늘은 입구까지만 보고 갈까.)"
    - when: "talent.마력감응"
      나레이션: "그 너머, 훨씬 깊은 곳에서 뜨거운 기운이 희미하게 맥박친다. 살아 있는 것처럼."
    - "붉은 눈들은 다가오지 않는다. 그저 보고 있다. 여기는 자기들 땅이라는 듯이."
    - 속마음: "(맨손으로는 무리다. 몽둥이라도 챙겨서 다시 오자.)"
    - "뒷걸음질로 입구까지 나왔다. 햇빛이 이렇게 반가운 줄 몰랐다."
    - "언덕을 내려오는 내내 뒷목이 근질거렸다. 저 안에서 무언가 아직 이쪽을 보고 있었다."
    - 속마음: "(다음엔 안쪽까지 간다. 10년 중의 하루를 썼으면, 그만큼은 건져야지.)"
  effects: ["mine.progress = 1"]

- id: mine_2
  title: 폐광의 마물
  art: mine
  on: 폐광
  when: "mine.progress == 1"
  repeat: 3
  lines:
    - 나레이션:
        - "다시 폐광. 이번엔 손에 단단한 참나무 몽둥이를 쥐었다."
        - { when: "fired.mine_2 >= 3", text: "세 번째 폐광. 이번에도 지면 이 굴은 포기해야 한다. 몽둥이를 고쳐 쥐었다." }
        - { when: "fired.mine_2 >= 2", text: "또 폐광이다. 지난번에 물린 발목이 아직 욱신거린다. 붕대를 한 번 더 조였다." }
    - "랜턴을 앞세우고 갱도로 들어간다. 지난번에 멈춘 자리를 지나, 더 깊이."
    - "기울어진 버팀목 아래를 지날 때, 머리 위에서 흙이 부슬부슬 떨어졌다."
    - "공기가 점점 미지근해진다. 곰팡이와 짐승 냄새가 짙어진다."
    - "갈림길. 왼쪽 갱도 바닥에 무언가를 끌고 간 자국이 길게 나 있다."
    - 속마음: "(위키 지도로는 왼쪽. 쥐 둥지를 지나야 맨 안쪽 갱도가 나온다.)"
    - "왼쪽으로 꺾자마자, 사각거리던 소리가 뚝 그쳤다."
    - "정적. 랜턴 심지 타는 소리만 들린다."
    - "굴 안쪽에서 동굴 쥐 떼가 튀어나온다!"
    - "개만 한 놈이 셋, 고양이만 한 놈이 열. 누런 앞니가 랜턴 불빛에 번들거린다."
    - 나@놀람: "농담이 아니었잖아…!"
    - "몽둥이를 쥔 손이 떨린다. 진짜 이빨, 진짜 냄새, 진짜 숨소리."
    - 속마음: "(에테크 전투는 패턴 싸움이다. 몸은 처음이어도 손은 기억한다.)"
    - 속마음: "(이빨을 드러내면 피한다. 한쪽 구석으로 몰려들면, 그때 세게 쳐서 흩어 놓는다.)"
    - when: "talent.혐오스러운분위기"
      나레이션: "작은 놈 몇 마리가 나를 보자마자 꼬리를 말고 달아났다. 남은 놈들은 더 사납다."
    - "제일 큰 놈이 몸을 낮췄다. 온다."
  battle:
    enemy: rats
    win:
      lines:
        - "쥐 떼가 비명을 지르며 흩어졌다."
        - { when: "talent.천생신력", 나레이션: "벽에 맞은 쥐가 벽째로 무너졌다." }
        - "몽둥이를 짚고 숨을 골랐다. 팔이 저리고, 손바닥 물집이 터졌다."
        - "제일 큰 놈이 바위틈 앞에서 마지막으로 이쪽을 노려보더니, 사라졌다."
        - 나@웃음: "하… 하하. 이겼다."
        - 속마음: "(튜토리얼 몹 상대로 이렇게 숨이 차다니. 화면 밖 전투는 체력부터 다르다.)"
        - "손을 내려다봤다. 떨리고 있다. 무서워서가 아니라, 살아 있어서."
        - "쥐 떼가 지키던 자리 너머로, 좁은 갱도가 아래로 이어진다."
        - "그 끝에서 희미한 붉은빛이 맥박치듯 깜빡였다."
        - 속마음: "(저기다. 오늘은 여기까지. 랜턴 기름이 바닥났다.)"
      effects: ["mine.progress = 2", "stat.근력 += 2"]
    lose:
      lines:
        - "랜턴이 바닥에 떨어져 굴렀다. 불이 꺼지기 직전, 붉은 눈 수십 쌍이 한꺼번에 덮쳐 왔다."
        - "발목에 이빨이 박혔다. 비명을 지른 건 내 목인데, 처음 듣는 목소리였다."
        - "어떻게 빠져나왔는지 모르겠다. 정신을 차리니 갱도 입구의 눈밭에 엎어져 있었다."
        - "물리고 할퀴어서 도망쳐 나왔다. 다음에 다시 와야겠다."
        - "소매를 걷자 이빨 자국이 줄지어 박혀 있다. 피가 눈 위에 점점이 떨어진다."
        - 속마음: "(게임에선 쓰러지면 마을에서 부활했다. 여기서도 그런지 시험해 볼 생각은 없다.)"
        - "언덕 아래에서 그 노파가 혀를 차더니, 깨끗한 천 한 장을 던져 주고 갔다."
        - 속마음: "(패턴은 봤다. 다음엔 안 진다.)"
      effects: ["fatigue += 15", "stress += 10 * (1 + mod.stress)"]

- id: mine_3
  title: 붉은 뿌리
  on: 폐광
  when: "mine.progress == 2"
  lines:
    - "익숙해진 언덕길. 오늘은 기름을 가득 채운 랜턴을 두 개 챙겼다."
    - "쥐 둥지를 지난다. 바위틈에서 붉은 눈 몇 쌍이 깜빡이다가, 나를 알아보고 쏙 들어간다."
    - 속마음: "(학습했구나. 나도, 너희도.)"
    - "갱도가 점점 좁아진다. 마지막 구간은 무릎으로 기어야 했다."
    - "벽이 따뜻하다. 손바닥을 대자, 바위 안쪽에서 무언가 천천히 뛰는 것 같다."
    - "그리고 갑자기, 천장이 높아졌다."
    - "가장 깊은 갱도. 바위틈에 핏빛 뿌리가 자라 있다."
    - "뿌리는 바위를 뚫고 나와 손가락처럼 뻗어 있다. 랜턴을 대자 속에서 붉은빛이 맥박친다."
    - "흙도 물도 없는 바위에서, 이것 하나만 살아 있다."
    - 속마음: "(붉은 뿌리. 체질을 끌어올리는 영약 재료다.)"
    - 속마음: "(원작에선 2학년의 아렌이 여기까지 온다. 1년 반이나 먼저 와 버렸다.)"
    - "손을 뻗었다. 뿌리는 생각보다 쉽게 바위에서 떨어졌다. 뚝, 하고."
    - "손바닥 위에서 아직 따뜻하다. 쓴 쇠 냄새가 코를 찌른다."
    - 속마음: "(날것은 독하다. 위키 댓글엔 '먹고 사흘 앓았다'는 증언이 줄줄이 달려 있었다.)"
    - when: "talent.만독불침"
      속마음: "(독성이 있다던데, 나한텐 상관없지.)"
    - when: "talent.병약"
      나레이션: "뿌리의 열기가 손바닥을 타고 오르자, 늘 차갑던 가슴께가 처음으로 따뜻해졌다."
    - "갱도 저편에서 쥐들이 웅성거리는 소리가 들려온다. 오래 머물 곳은 아니다."
    - 속마음: "(여기서 먹을까. 아니면 돈으로 바꿀까. 한 달은 짧고, 은화는 늘 모자라다.)"
  effects: ["mine.progress = 3", "item.붉은뿌리 = 1"]
  choices:
    - text: 그 자리에서 씹어 먹는다
      effects: ["item.붉은뿌리 = 0", "stat.체질 += 8"]
      lines:
        - "뿌리를 입에 넣었다. 생각할 틈을 주면 못 먹을 것 같았다."
        - "씹는 순간, 쇳물 같은 즙이 혀를 덮었다."
        - "눈물이 찔끔 났다. 삼켰다."
      branch:
        - when: "talent.병약"
          lines:
            - "쓴맛이 혀를 찌른다. 그런데… 숨쉬기가 조금 편해졌다."
            - "가슴 밑바닥에 늘 얹혀 있던 돌덩이가, 반쯤 녹아내린 것 같다."
            - "기침을 해 봤다. 한 번으로 끝났다."
            - 속마음: "(이 몸이 아프지 않은 숨을 쉬어 본 게, 언제였을까.)"
            - "갱도 바닥에 주저앉아 한참 숨만 쉬었다. 들이쉬고, 내쉬고."
          effects: ["sick.relief = 1"]
        - when: "talent.만독불침"
          lines:
            - "아무 맛도 안 난다. 몸속에서 열기만 퍼진다."
            - "위장이 독을 받아서, 그대로 녹여 버리는 느낌이다."
            - "열기가 손끝 발끝까지 번진다. 겨울 갱도 안인데 이마에 땀이 맺힌다."
            - 속마음: "(위키 댓글의 '사흘 앓았다'는 남의 얘기다. 재능 하나는 잘 골랐다.)"
            - "남은 즙까지 핥아 먹었다. 뼈 안쪽이 단단해지는 게 느껴진다."
          effects: ["stat.체질 += 3"]
        - lines:
            - "쓴맛과 함께 몸속이 뜨거워진다. 한동안 배가 아팠다."
            - "정확히는, 한동안이 아니라 반나절이었다."
            - "갱도를 기어 나오는 동안 세 번 멈춰 섰다. 자세한 건 기록하지 않겠다."
            - "그래도 열기가 빠져나간 자리에, 무언가 단단한 게 남았다."
            - 속마음: "(위키 댓글이 맞았다. …그리고 체질이 오른다는 것도 맞았다.)"
          effects: ["fatigue += 20"]
    - text: 약재상에 팔아 돈으로 바꾼다
      effects: ["item.붉은뿌리 = 0", "money += 30"]
      lines:
        - "뿌리를 천에 싸서 품에 넣었다. 품 안이 화로처럼 따뜻하다."
        - "마을 약재상. 말린 약초가 천장에 거꾸로 매달린 가게, 쓴 냄새가 코를 찌른다."
        - 약재상: "뭘 캐 왔다고? 폐광 쥐똥이면 안 사네."
        - "천을 펼치자 약재상의 말이 뚝 끊겼다."
        - "약재상 주인이 눈을 크게 뜨더니 은화를 세어 줬다."
        - 약재상@놀람: "허… 이게 아직 있었어? 광산 문 닫기 전에도 1년에 한 뿌리 나올까 말까 했는데."
        - 약재상@진지: "은화 서른. 더는 못 줘. 대신 어디서 캤는지는 안 묻겠네."
        - "은화 서른 닢이 손바닥 위에서 묵직하다."
        - 속마음: "(영약을 돈으로 바꿨다. 위키에 썼으면 욕을 바가지로 먹었겠지.)"
        - 속마음: "(그래도 한 달은 짧고, 은화로 살 수 있는 시간도 있다.)"

# ---------------------------------------------------------------- 고서점 (원작 주인공의 기연)

- id: book_1
  title: 고서점
  on: 고서점
  lines:
    - "도시 남쪽, 비탈진 골목 끝의 작은 고서점."
    - "문을 열자 머리 위에서 종이 딸랑 울렸다. 아무도 나와 보지 않는다."
    - "먼지 쌓인 서가. 주인 노인은 졸고 있다."
    - "카운터 뒤에서 노인이 돋보기를 코끝에 걸친 채 꾸벅인다. 무릎 위의 고양이도 같이 존다."
    - "천장까지 쌓인 책들. 등이 갈라진 마도서, 곰팡이 핀 연대기, 제목이 지워진 일기장."
    - "종이와 먼지와 오래된 아교 냄새. 숨을 쉴 때마다 목구멍이 간질거린다."
    - when: "talent.병약"
      나레이션: "먼지에 기침이 터졌다. 노인이 한쪽 눈을 떴다가, 도로 감았다."
    - 속마음: "(원작에선 메뉴 화면 하나였다. '고서점 ─ 구매 / 판매'. 이 냄새는 없었다.)"
    - "서가 사이를 천천히 걸었다. 책등을 훑은 손가락 끝에 먼지가 회색으로 묻어난다."
    - "구석에서 표지가 닳은 책 한 권이 눈에 들어온다. 『마력 순환 소고』."
    - "다른 책들 틈에 반쯤 거꾸로 꽂혀 있다. 누가 일부러 숨겨 둔 것처럼."
    - when: "note.note_manual.known"
      속마음: "(이거다. 원작에서 아렌이 2학년 겨울에 얻는 비급.)"
    - when: "not note.note_manual.known"
      속마음: "(낡은 책인데… 왠지 신경 쓰인다.)"
    - "꺼내서 펼쳐 봤다. 손글씨로 빽빽한 도식. 마력이 몸 안을 도는 길을 그린 그림이다."
    - "몇 줄 읽었을 뿐인데 명치 아래가 따끔거린다. 몸속 무언가가 도식을 따라 움직이려 한다."
    - when: "talent.마력감응"
      나레이션: "책장 사이로 미지근한 마력이 배어 나온다. 쓴 사람의 손 온기가 아직 남은 것처럼."
    - 속마음:
        - "(…이 도식, 어디서 본 것 같은데.)"
        - { when: "note.note_manual.known", text: "(읽으면 마력이 저절로 차오르는 몸이 된다. 싸움이 길어질수록 차이가 벌어지는 기연.)" }
    - "뒤표지를 뒤집어 봤다. 가격표가 없다."
    - 나: "저기요, 이 책…"
    - "노인은 대답 대신 코를 골았다. 고양이가 한쪽 눈을 떴다가 다시 감았다."
    - 나@당황: "…저기요?"
    - "코 고는 소리가 한 박자 커졌다."
    - 속마음: "(깨우면 값부터 올려 부를 얼굴이다. 오늘은 위치만 확인하자.)"
    - "책을 원래 자리에, 원래처럼 반쯤 거꾸로 꽂아 두었다."
    - 속마음:
        - "(다음엔 은화를 챙겨서 오자.)"
        - { when: "note.note_manual.known", text: "(산다면 2년 뒤 아렌의 몫을 빼앗는 거다. 두고 간다면, 원작대로 흘러간다.)" }
    - "문을 닫기 직전, 뒤에서 코 고는 소리가 뚝 멎은 것 같았다."
  effects: ["book.seen = 1"]

- id: book_2
  title: 마력 순환 비급
  on: 고서점
  when: "book.seen and not gift.manual and not book.left"
  lines:
    - "다시 고서점. 문을 열기도 전에 안에서 마른기침 소리가 들렸다."
    - "오늘은 주인 노인이 깨어 있다. 카운터에 장부를 펼쳐 놓고, 돋보기 너머로 나를 본다."
    - 서점 주인: "구석 서가 앞에서 한참 서 있다 간 손님이구먼. 졸아도 귀는 열려 있네."
    - 속마음: "(…자는 척이었어?)"
    - "구석 서가로 갔다. 『마력 순환 소고』는 그대로, 반쯤 거꾸로 꽂혀 있다."
    - "책을 카운터에 올려놓자 노인이 돋보기를 벗었다."
    - 서점 주인: "그 책? 은화 마흔 닢. 깎아줄 생각 없네."
    - 나@당황: "마흔이요? 이 낡은 책이?"
    - 서점 주인@진지: "낡았으니까 마흔이지. 새 책은 아무나 쓰네. 이건 한 사람이 평생 걸려 쓴 거야."
    - 서점 주인: "어느 늙은 마법사 유품을 정리할 때 딸려 온 놈인데, 이상하게 아무도 안 사 가더군."
    - 서점 주인@웃음: "임자를 기다리는 책이 있다고들 하지. 난 안 믿네. 그래도 값은 그 값이야."
    - when: "note.note_manual.known"
      속마음: "(원작에선 2학년 겨울의 아렌이 이 노인한테서 같은 말을 듣는다. 토씨 하나 안 틀리고.)"
    - when: "not note.note_manual.known"
      나레이션: "책장을 다시 넘겼다. 맨 뒷장의 순환 도식을 보는 순간, 기억이 맞물렸다."
    - when: "not note.note_manual.known"
      속마음: "(아렌이 2학년 겨울에 얻는 비급이다. 스크린샷으로 한 번 봤던, 바로 그 도식.)"
    - 속마음: "(이걸 내가 가지면, 2년 뒤의 아렌은 이 서가 앞에서 빈손으로 돌아간다.)"
    - "노인은 재촉하지 않는다. 고양이가 카운터로 올라와 책 위에 턱을 괴었다."
    - 속마음: "(원작 주인공의 기연 하나. 10년 뒤를 생각하면, 어느 쪽이 맞는 걸까.)"
  choices:
    - text: 산다 (은화 40)
      art: cg_manual
      requires: "money >= 40"
      hint: "아렌은 이 기연을 얻지 못하게 된다"
      effects: ["money -= 40", "gift.manual = 'me'", "skill.마력순환 = 1", "stat.마력제어 += 5"]
      lines:
        - "은화 마흔 닢을 카운터에 쌓았다. 짤랑. 한 달 치 생활비가 책 한 권이 됐다."
        - 서점 주인: "임자가 왔구먼. 책 상하게 굴지 말게."
        - "책을 펼친 순간, 도식의 선들이 눈 안으로 흘러 들어왔다."
        - "명치에서 시작한 열기가 갈비뼈를 따라 돌고, 등을 타고 올라 정수리에서 맴돈다."
        - "숨을 들이쉬자 몸속 마력이 한 바퀴, 제 길을 찾아 돌았다."
        - 속마음: "(미안, 아렌. 이건 내가 먼저 쓸게.)"
        - 시스템: "⚠ 원작 이탈 — 아렌은 이 비급을 얻지 못한다."
        - 속마음: "(세계가 한 칸 어긋나는 소리가 들린 것 같았다.)"
        - 속마음: "(대신 네 몫까지 강해질게. 네가 넘어질 자리에 먼저 가 있을 만큼.)"
    - text: "주인에게 부탁한다: 이 책을 찾는 평민 소년이 오면 싸게 주세요"
      requires: "stat.매력 >= 14 or talent.사람좋은얼굴"
      effects: ["gift.manual = 'aren_early'", "aren.boost += 1"]
      lines:
        - 나: "사지는 않을게요. 대신 부탁이 하나 있어요."
        - 서점 주인: "책은 안 사고 부탁만 한다? 요즘 젊은 것들은 참."
        - 나: "언젠가 이 책을 찾는 평민 소년이 올 거예요. 모래색 머리에, 눈이 아주 파란."
        - 나@진지: "그 애가 오면, 싸게 주세요. 꼭요."
        - 서점 주인@놀람: "…그 애가 누군데?"
        - 나: "언젠가 세상을 구할지도 모르는 애요. 지금은 그냥 양치기고요."
        - "노인이 돋보기도 없이 한참 나를 들여다봤다."
        - 서점 주인@웃음: "…별 부탁을 다 듣는군. 알았네."
        - 서점 주인: "장부 맨 뒷장에 적어 두지. 모래색 머리, 파란 눈, 양치기."
        - 속마음: "(원작보다 2년 빨리 아렌 손에 들어간다.)"
        - 시스템: "⚠ 원작 이탈 — 아렌의 성장이 원작보다 빨라진다."
        - 속마음: "(내가 다 할 필요는 없다. 주인공을 키우는 것도 공략이다.)"
    - text: 그냥 둔다
      effects: ["book.left = 1"]
      lines:
        - "책을 서가에, 원래처럼 반쯤 거꾸로 꽂았다."
        - 서점 주인: "안 사나? 하긴, 마흔이 싼 값은 아니지."
        - 나: "제 책이 아닌 것 같아서요."
        - 서점 주인@웃음: "허. 책을 고르는 게 아니라 책한테 골림받는 손님이구먼."
        - "원작대로 흘러가게 두자. 지금은."
        - 속마음: "(2학년 겨울, 이 서가 앞에 아렌이 설 것이다. 그때까지 이 책이 무사하기를.)"
        - "가게를 나서는데 고양이가 문간까지 따라 나와 한참 나를 배웅했다."

# ---------------------------------------------------------------- 뒷골목 정보상

- id: grim_1
  title: 정보상 그림
  on: 뒷골목
  effects: ["money -= 10", "affinity.grim += 10", "trust.grim += 5"]
  lines:
    - "해가 기우는 시장 뒤편. 생선 비린내와 하수구 냄새가 섞여 흐른다."
    - "골목은 들어갈수록 좁아진다. 젖은 돌바닥에 내 발소리만 울린다."
    - "막다른 벽 앞에 등불 하나. 그 아래 나무 상자에 누군가 걸터앉아 있다."
    - "후드를 깊이 눌러쓴 사내. 무릎 위에 낡은 장부를 펼쳐 놓았다."
    - "장부에서 눈을 떼지 않은 채, 사내가 먼저 입을 열었다."
    - 그림@웃음: "처음 보는 얼굴이군. 정보는 공짜가 아니야."
    - "후드 그늘 아래로 금빛 눈이 잠깐 번득였다. 턱에는 며칠 깎지 않은 수염."
    - when: "note.note_grim.known"
      속마음: "(그림. 황제 암살이 일어나는 밤, 황궁 근처에 있던 사람.)"
    - when: "not note.note_grim.known"
      속마음: "(정보상 그림. 원작에선 은화 몇 닢에 소문 한 줄을 팔던 뒷골목 상점 NPC다.)"
    - 나: "얼마예요?"
    - 그림: "은화 열 닢. 첫 거래는 내가 고른 얘기로 하지. 불만이면 돌아가."
    - "은화 열 닢을 장부 위에 올려놓았다. 그림이 한 닢씩 손톱으로 튕겨 소리를 듣는다."
    - 그림: "…진짜군. 요즘 애송이들은 납 섞은 걸 내밀더라고."
    - "동전이 장부 사이로 사라졌다. 손이 어떻게 움직였는지 보이지 않았다."
    - 속마음: "(…방금 그 손, 안 보였다. 상점 NPC의 손놀림이 아닌데.)"
    - "그림이 목소리를 낮췄다. 등불이 한 번 흔들렸다."
    - 그림: "요즘 밤마다 황궁 뒷문으로 검은 마차가 드나들어. 문장도 없는 마차가."
    - 그림@진지: "마부는 얼굴을 가렸고, 바퀴엔 헝겊을 감았어. 소리 안 나게."
    - 그림: "들어갈 땐 무겁고, 나올 땐 가벼워. 뭘 내려놓고 오는지는 아무도 몰라."
    - 나@당황: "그런 얘기를 왜 처음 보는 사람한테…"
    - 그림@웃음: "은화 열 닢어치니까. 의미는 손님이 알아서 붙여."
    - 속마음:
        - "(황궁. 6년 뒤 겨울, 황제가 암살당하는 곳이다.)"
        - { when: "note.note_grim.known", text: "(암살 진범은 원작에서 끝내 안 밝혀졌다. 그 실마리가 벌써 이 골목을 굴러다닌다.)" }
    - 그림: "단골이 되면 더 좋은 얘기도 있어. 값도 더 좋고."
    - "그림은 다시 장부로 고개를 숙였다. 대화가 끝났다는 뜻이다."
    - "골목을 빠져나오다 한 번 돌아봤다. 등불 아래 나무 상자는 비어 있었다."
    - 속마음: "(정보는 공짜가 아니다. 그리고 저 사람도, 보이는 게 전부가 아니다.)"
  plants:
    - { id: F10, notice: { value: "stat.지성 + 10 * note.note_grim.known", dc: 20 } }

- id: grim_2
  title: 뒷골목의 소문
  on: 뒷골목
  when: "fired.grim_1"
  repeat: 2
  effects: ["money -= 10", "intel += 1", "affinity.grim += 5"]
  lines:
    - 나레이션:
        - "다시 뒷골목. 등불 아래 나무 상자, 그 위의 후드."
        - { when: "fired.grim_2 >= 2", text: "또 뒷골목. 이제는 발이 먼저 길을 안다. 등불 아래, 같은 후드." }
    - 그림:
        - "또 왔군. 은화 열 닢."
        - { when: "fired.grim_2 >= 2", text: "자주 오는군. 단골 대접은 아직이야. 은화 열 닢." }
    - "은화를 장부 위에 올려놓았다. 이번엔 손놀림을 끝까지 지켜보려 했다."
    - "보지 못했다."
    - 속마음: "(저 손이 장부만 넘기며 살아왔을 리가 없다.)"
  branch:
    - when: "intel == 1"
      lines:
        - "그림이 장부를 덮었다. 표정이 조금 달라졌다."
        - 그림@진지: "학교 얘기 하나 해 주지. 손님, 곧 입학하지? 냄새가 나."
        - 그림: "아카데미 미궁 말이야. 3층 안쪽에서 로브 입은 놈들이 뭘 그리고 다닌다더군."
        - 나@놀람: "미궁 3층이요? 거긴 학생들 실습장인데…"
        - 그림: "야간 경비 하나가 봤대. 바닥에 둥근 무늬를. 분필 같은 걸로, 아주 정성껏."
        - 그림: "다음 날 가 보니 싹 지워져 있더래. 그 경비는 다음 주에 일을 그만뒀고."
        - 그림@웃음: "그만둔 건지, 그만두게 된 건지는 모르지."
        - 속마음: "(미궁 3층의 교단 문양. 원작에선 1학년 가을 토벌 무렵에야 처음 발견된다.)"
        - 속마음: "(지금은 입학 전 2월이다. 원작보다 반년도 더 빠르다.)"
        - "등골이 서늘해졌다. 원작이 보여 준 것보다, 일은 훨씬 먼저 시작되고 있었다."
        - 그림: "이 얘긴 아무한테나 안 팔아. 손님 눈이 이런 얘기를 찾는 눈이라서 판 거야."
        - 속마음: "(원작 지식이 늘 맞으리란 보장은 없다. 오늘 그걸 은화 열 닢에 샀다.)"
      effects: ["know.cult_early = 1"]
    - lines:
        - "그림이 장부를 몇 장 넘기다가, 한 곳에서 손가락을 멈췄다."
        - 그림: "오늘은 귀족 얘기. 벨모어가, 알지? 백작가."
        - 그림@웃음: "벨모어가 도련님? 하인들한테 미움받는 걸로 유명하지. 그런 놈은 꼭 혼자 죽더라고."
        - when: "origin == '악역도련님'"
          속마음: "(그 벨모어가 도련님이 지금 당신 앞에 서 있는데요.)"
        - when: "origin == '악역도련님'"
          그림@진지: "알고 하는 얘기야. 본인한테 팔 땐 값이 두 배인데, 오늘은 봐주지."
        - when: "origin == '악역도련님'"
          그림: "혼자 다니지 마, 도련님. 이게 은화 열 닢짜리 충고야."
        - when: "origin != '악역도련님'"
          그림: "하인들이 입을 닫으면 위험한 얘기도 안 들어가. '거기 가지 마세요' 해 줄 사람이 없는 거지."
        - when: "origin != '악역도련님'"
          속마음: "(에드릭 벨모어. 1학년 5월, 미궁 3층에서 혼자 죽는다. 원작은 그걸 사고라고 불렀다.)"
        - 그림: "사람은 미움받는 만큼 혼자가 되고, 혼자인 만큼 쉽게 사라져. 이 골목에서 배운 거야."
        - "그림이 장부를 덮었다. 오늘 장사는 끝이라는 뜻이다."
        - 속마음:
            - "(혼자 죽는다. 뒤집으면, 혼자 두지 않으면 된다는 얘기다.)"
            - { when: "origin == '악역도련님'", text: "(혼자 죽지 않는 법. 남은 시간 안에 그걸 배워야 한다.)" }

# ---------------------------------------------------------------- 새벽 연무장 (숨은 인재 발견)

- id: finn_dawn
  title: 빗자루를 든 소년
  on: 새벽연무장
  lines:
    - "해가 뜨기 전. 아카데미 외곽 연무장이 안개에 잠겨 있다."
    - "흙바닥에 서리가 하얗게 앉았다. 줄지어 선 나무 허수아비들이 안개를 뒤집어쓰고 있다."
    - "입학 전이라 학생은 하나도 없다. 정문 경비병도 창에 기대 졸고 있다."
    - 속마음:
        - "(원작에선 배경 그림으로만 나오던 곳이다. 그냥, 한번 와 보고 싶었다.)"
        - { when: "perk.데이터마이너", text: "(데이터 파일 속 그 NPC. 이벤트도 대사도 없이 스탯만 박혀 있던. 혹시나 해서 와 봤다.)" }
    - "그때, 안개 저편에서 쉭, 하는 소리가 났다."
    - "쉭. 쉭. 일정한 박자. 바람 소리가 아니다."
    - "청소부 소년이 빗자루를 검처럼 휘두르고 있다."
    - "앳된 얼굴. 잿빛 머리에 주근깨, 소매가 해진 작업복."
    - "빗자루 끝이 흙을 스치고, 허공에서 멈췄다가, 다시 내려앉는다."
    - "청소라기엔 동작이 너무 반듯하다."
  branch:
    - when: "perk.데이터마이너 or talent.마력감응"
      art: cg_finn_broom
      lines:
        - when: "talent.마력감응"
          나레이션: "등줄기에 칼날 같은 감각이 스친다."
        - when: "talent.마력감응"
          나레이션: "빗자루가 지나간 자리마다 공기가 얇게 베여 있다. 눈에는 안 보이는 선이."
        - when: "perk.데이터마이너"
          속마음: "(검술 스탯 S. 이벤트가 없던 미구현 NPC… 진짜 있었구나.)"
        - when: "perk.데이터마이너"
          속마음: "(외형 데이터도 없던 녀석이, 주근깨까지 달고 숨을 쉬고 있다.)"
        - "넋을 놓고 보다가 발밑의 마른 가지를 밟았다. 딱."
        - "빗자루가 멈췄다. 소년이 돌아본다. 회색 눈이 경계로 가늘어졌다."
        - 핀@당황: "…뭘 봐요. 청소 중인데."
        - 나: "아, 미안. 청소하던 거… 맞지?"
        - 핀@화남: "마, 맞아요. 바닥 쓸고 있었잖아요. 보, 보면 몰라요?"
        - "소년은 빗자루를 바로 쥐고 바닥을 박박 쓸기 시작했다. 아까와는 딴판인 어설픈 빗질이다."
        - 속마음: "(일부러 못하는 척한다. 잘하는 걸 들켰다가 혼나 본 애처럼.)"
        - 나: "이름이 뭐야?"
        - 핀: "…핀이요. 청소부요. 그게 다예요."
        - "핀은 빗자루를 끌고 안개 속으로 사라졌다. 발소리가 하나도 나지 않았다."
        - 속마음: "(찾았다. 아무도 몰랐던 재능. …그런데 이걸 찾은 게, 저 애한테도 좋은 일일까.)"
      effects: ["found.finn = 1", "affinity.finn += 5"]
    - lines:
        - "묘하게 자세가 좋다. 기분 탓일까."
        - "소년이 나를 발견하고 흠칫하더니, 빗자루를 고쳐 쥐고 바닥을 쓸기 시작했다."
        - "평범한 빗질이다. 아까 본 게 착각이었나 싶을 만큼."
        - 속마음: "(청소부 NPC. 원작엔 이름도 없던 배경 인물이다. …그런데 왜 자꾸 눈이 가지.)"
        - "해가 떠오르자 안개가 걷혔다. 소년은 어느새 사라지고 없었다."
        - "흙바닥엔 빗자루 자국만 남았다. 이상하게도 전부 같은 방향, 같은 길이로."

- id: finn_dawn_2
  title: 다시 본 소년
  on: 새벽연무장
  when: "fired.finn_dawn and not found.finn"
  lines:
    - "다시 새벽 연무장. 오늘은 안개가 옅고, 서리가 발밑에서 바삭거린다."
    - "오늘도 그 소년이다. 빗자루 끝이 정확히 같은 궤적을 그린다."
    - "허수아비 앞에서 비스듬히 한 발. 쓸고, 돌고, 다시 처음 자리로."
    - "몇 번을 반복해도 발자국이 어긋나지 않는다. 처음 찍힌 발자국을 그대로 밟는다."
    - 속마음: "(저번에 본 빗자루 자국. 그게 이거였구나.)"
    - "나무 기둥 뒤에 몸을 숨기고 숨을 죽였다."
    - "소년의 손끝, 발끝, 빗자루 끝을 차례로 눈으로 좇는다."
    - 속마음: "(집중해. 저건 그냥 청소가 아니다. 무언가 있다.)"
  check: { value: "stat.지성 + stat.민첩 + 20 * talent.직감", dc: 30 }
  success:
    art: cg_finn_broom
    lines:
      - "백 번째쯤에서 보였다. 빗자루 끝이 그리는 선 하나하나가 전부 베기다."
      - "내려치기, 올려 베기, 흘려 넘기기. 아무도 가르친 적 없을 손에서, 교본 첫 장의 기본기가."
      - 속마음: "(같은 궤적을 백 번. 저건 재능이다.)"
      - when: "talent.직감"
        나레이션: "머릿속에서 무언가 딸깍 맞물렸다. 저 아이를 놓치면 안 된다."
      - "나도 모르게 박수를 쳤다."
      - "빗자루가 우뚝 멈췄다. 소년이 화들짝 돌아본다."
      - 핀@놀람: "…아저씨도 검 해요?"
      - 나@당황: "아저씨…? 아니, 그보다. 검 안 해. 그냥 보고 있었어."
      - 핀@당황: "보, 봤어요? 어디서부터요?"
      - 나@웃음: "처음부터. 백 번 다."
      - "소년의 귀가 새빨개졌다. 빗자루를 등 뒤로 숨긴다. 숨겨지지 않는다."
      - 핀: "…아무한테도 말하지 마요. 청소부가 검 흉내 내면 쫓겨나요."
      - 나: "흉내 아니던데."
      - "소년은 대답 대신 고개를 푹 숙였다. 그래도 도망치지는 않았다."
      - 핀: "…핀이에요. 그쪽은요?"
      - "이름을 말해 주자, 핀은 입속으로 두 번 따라 했다."
      - 속마음: "(이름 없는 NPC가 아니다. 핀. 이 아이한테는 이름이 있다.)"
    effects: ["found.finn = 1", "affinity.finn += 5"]
  fail:
    lines:
      - "눈을 한 번 깜빡인 사이, 궤적을 놓쳤다."
      - "다시 찾았을 땐 빗자루가 그냥 빗자루로 돌아가 있었다."
      - "청소 수레 바퀴가 덜그럭거리는 소리."
      - "소년은 금방 사라졌다."
      - "연무장엔 쓸어 놓은 흙바닥과, 서리 녹는 냄새만 남았다."
      - 속마음: "(분명 뭔가 있었는데. 손가락 사이로 빠져나간 기분이다.)"

# ---------------------------------------------------------------- 집안 정리 (출신별)

- id: edric_servants
  title: 벨모어가의 하인들
  art: manor
  on: 집안정리
  when: "origin == '악역도련님'"
  repeat: 3
  lines:
    - "대리석 홀. 천장의 샹들리에가 아침 햇빛을 잘게 쪼갠다."
    - "붉은 카펫이 깔린 계단을 내려간다. 벽마다 벨모어가 조상들의 초상화가 나를 내려다본다."
    - 나레이션:
        - "하인들이 나를 보자마자 고개를 숙이고 굳는다."
        - { when: "servant.trust >= 1", text: "하인들이 고개를 숙인다. 여전히 굳어 있지만, 오늘은 숨을 참지는 않는다." }
        - { when: "servant.warning and servant.trust >= 2", text: "하인들이 고개를 숙인다. 계단 아래의 늙은 하인이, 아주 작게 목례를 보냈다." }
    - "젊은 하인 하나가 은쟁반을 든 채 벽에 등을 붙였다. 쟁반 위 찻잔이 달그락거린다."
    - "복도를 닦던 하녀가 걸레를 쥔 채 무릎을 꿇었다. 아무도 시키지 않았는데."
    - 속마음: "(원작의 에드릭은 하인들을 때렸다. 그러니 아무도 경고해주지 않은 거야.)"
    - 속마음: "(1권 회상 장면. 찻잔을 엎은 하인의 뺨을 때리던 에드릭. 그땐 '역시 악역'이라며 웃고 넘겼다.)"
    - "찻잔 소리가 멎지 않는다. 젊은 하인의 손이 떨리고 있다."
    - 하인:
        - "도, 도련님. 차를… 차를 내오라 하셨는지요…"
        - { when: "servant.trust >= 1", text: "도련님. 차… 드시겠습니까?" }
    - "계단 아래, 백발의 노인이 이쪽을 보고 있다. 이 저택에서 40년을 일했다는 늙은 하인이다."
    - "노인은 고개를 숙이지 않았다. 대신 아주 오래, 나를 살폈다."
    - 속마음: "(무섭다. 저 사람들이 나를 무서워하는 게, 무섭다.)"
    - 속마음: "(에드릭이 한 일을 내가 사과해도 되는 걸까. …아니, 지금은 내가 에드릭이다.)"
  choices:
    - text: 지난 일을 사과한다
      effects: ["servant.trust += 1"]
      lines:
        - "계단 중간에서 멈춰 섰다. 홀 안의 숨소리가 일제히 멎었다."
        - 나:
            - "…그동안, 미안했어."
            - { when: "servant.trust >= 1", text: "저번에 한 말, 진심이었어. 한 번 더 말할게. 미안했어." }
        - "고개를 숙였다. 벨모어가 도련님이, 하인들 앞에서."
        - "쨍그랑. 젊은 하인이 쟁반을 놓칠 뻔했다."
        - 나@진지: "변명은 안 할게. 앞으로는 안 그래. 그 말만 하고 싶었어."
      branch:
        - when: "servant.trust >= 2"
          lines:
            - "늙은 하인이 천천히 계단 아래까지 걸어왔다. 다른 하인들이 숨을 삼킨다."
            - "노인은 한참 내 얼굴을 들여다봤다. 무언가를 확인하듯이."
            - 늙은 하인:
                - "…같은 말씀을 두 번 하시는 걸 보니, 진심이신 모양입니다."
                - { when: "servant.warning", text: "…몇 번이고 같은 말씀이시군요. 그럼 저도 몇 번이고 말씀드리지요." }
            - 늙은 하인@진지: "…도련님. 미궁에 가시거든, 3층 안쪽은 피하십시오. 요즘 흉한 소문이 돕니다."
            - 나@놀람: "3층…? 무슨 소문인데?"
            - 늙은 하인: "아카데미 일을 하는 조카놈 말이, 3층 깊은 곳에서 사람 목소리가 들린답니다. 아무도 없는데."
            - 늙은 하인: "늙은이 노파심입니다. 흘려들으셔도 됩니다."
            - 속마음: "(원작의 에드릭은 이 말을 듣지 못했다. 그래서 3층 안쪽으로, 혼자 걸어 들어갔다.)"
            - "노인이 물러났다. 등이 아까보다 조금 펴져 있었다."
            - 속마음: "(사망 플래그 하나에, 금이 갔다.)"
          effects: ["servant.warning = 1"]
        - lines:
            - "아무도 움직이지 않았다. 벽시계 초침 소리만 홀에 울렸다."
            - "하인들은 대답하지 않았다. 하지만 공기가 조금 달라졌다."
            - "찻잔 소리가 멎었다. 젊은 하인이 쟁반을 고쳐 쥐었다. 손이 더는 떨리지 않는다."
            - "계단 아래, 늙은 하인이 눈을 한 번 감았다 떴다."
            - 속마음: "(한 번으로 될 리가 없다. 몇 년 쌓인 걸 한마디로 지울 수는 없지.)"
            - 속마음: "(그래도 오늘은, 아무도 맞지 않았다.)"
    - text: 아무 말 없이 지나간다
      lines:
        - "아무 말 없이 계단을 내려갔다. 하인들 사이를, 시선을 피해서."
        - "등 뒤에서 찻잔 소리가 멎었다."
        - "하인들이 안도의 한숨을 쉬는 소리가 들렸다."
        - "계단 아래의 늙은 하인만이, 끝까지 내 등을 보고 있었다."
        - 속마음: "(때리지 않고 지나가는 것만으로 안도하는 사람들.)"
        - 속마음: "(이게 지금의 최선일지도 모른다. …아니면 원작의 에드릭과 다를 게 없거나.)"

- id: noble_debt
  title: 가문의 빚
  on: 집안정리
  when: "origin == '몰락귀족' and debt > 0"
  repeat: 2
  lines:
    - "저택은 넓고, 방은 대부분 비어 있다. 팔 수 있는 가구는 이미 다 팔았다."
    - "벽마다 액자를 떼어 낸 자리가 하얗게 남았다. 벽지가 거기만 덜 바랬다."
    - "서재 앞을 지난다. 문은 잠겨 있고, 안에서 장부 넘기는 소리만 난다."
    - 나레이션:
        - "책상 위에 독촉장이 쌓여 있다."
        - { when: "fired.noble_debt >= 2", text: "책상 위에 독촉장이 또 쌓여 있다. 이번엔 맨 위 봉투에 붉은 도장이 찍혔다." }
    - "제국 상업 은행의 인장. 같은 모양의 봉투가 열두 통."
    - "맨 위의 한 통을 뜯었다. ── 남은 원금 은화 {{debt}}닢. 기한 내 미상환 시 저택을 처분함."
    - 속마음: "(내 주머니엔 은화 {{money}}닢. 계산은 금방 끝났다.)"
    - "큰형은 잿빛 장벽으로 떠났고, 둘째 형은 집을 나간 뒤로 소식이 없다."
    - "서명할 수 있는 사람은 서재에 틀어박힌 아버지와, 막내인 이 몸뿐."
    - 속마음: "(원작에선 '몰락 귀족 3남'이라는 설정 한 줄이었다. 빚 액수 같은 건 나오지도 않았다.)"
    - when: "talent.몸주인의잔재"
      나레이션: "독촉장을 쥔 손에 땀이 밴다. 이 몸은 이 봉투가 무섭다. 아주 오래전부터."
    - 나레이션:
        - "진열장에 마지막으로 남은 물건이 눈에 들어온다. 가문 문장이 새겨진, 할아버지의 은잔."
        - { when: "debt <= 50", text: "진열장의 은잔 자리가 비어 있다. 그 옆에 증조부의 회중시계가 홀로 남았다." }
    - "유리 너머에서 빛바랜 문장이 나를 본다. 저택이 넘어가면, 이것도 같이 넘어간다."
    - 속마음: "(팔면 당장은 숨이 트인다. 그런데 이 몸이, 그걸 원할까.)"
  choices:
    - text: 가보 하나를 판다
      effects: ["debt -= 50", "money += 20", "stress += 5"]
      lines:
        - 나레이션:
            - "은잔을 천에 싸서 시장의 전당포로 갔다."
            - { when: "debt <= 50", text: "이번엔 회중시계를 천에 싸서 전당포로 갔다." }
        - 주인:
            - "오래된 집안 물건이구먼. 은도 좋고."
            - { when: "debt <= 50", text: "또 왔구먼. 이번엔 시계야? 태엽은 멀쩡하네." }
        - 주인: "은화 일흔. 문장 값은 안 쳐 주네. 요즘 누가 몰락한 집 문장을 사겠나."
        - "은화 일흔 닢. 쉰 닢은 그 길로 은행 창구에 밀어 넣었다."
        - "남은 스무 닢이 주머니 속에서 무겁다."
        - 나레이션:
            - "할아버지의 은잔을 팔았다. 이 몸이 슬퍼하는 것 같다."
            - { when: "debt <= 50", text: "증조부의 회중시계를 팔았다. 이 몸이 또 슬퍼하는 것 같다." }
        - "돌아보지 않으려 했는데, 전당포 진열장 쪽을 두 번 돌아봤다."
        - 속마음: "(빚은 숫자다. 숫자는 줄일 수 있다. 그런데 가슴 한쪽이 무거운 건, 숫자가 아니다.)"
    - text: 나중에 생각한다
      effects: ["stress += 5"]
      lines:
        - "독촉장을 서랍에 쓸어 넣었다. 서랍이 꽉 차서 닫히지 않는다."
        - "몸으로 밀어서 겨우 닫았다. 서랍 틈으로 봉투 귀퉁이가 혀처럼 삐져나와 있다."
        - 속마음: "(지금은 빚보다 10년이 급하다. …라고 생각하기로 했다.)"
        - "서재 쪽에서 아버지의 기침 소리가 들렸다. 오래, 길게."
        - "그 소리가 그칠 때까지 복도에 서 있었다."
        - "기침이 멎자, 문 안쪽에서 장부 넘기는 소리가 다시 시작됐다."

# ---------------------------------------------------------------- 공통 반복

- id: train_flavor
  on: [기초훈련, 훈련장]
  repeat: true
  lines:
    - 나레이션:
        - "목검을 쥐고 같은 동작을 백 번 반복했다."
        - { when: "time.year == 0", text: "낡은 목검을 들고 빈터로 나갔다. 입김이 하얗게 흩어진다." }
        - { when: "count.기초훈련 + count.훈련장 >= 10", text: "손바닥 굳은살이 이제 목검 손잡이 모양을 닮았다." }
        - { when: "stress >= 60", text: "아무 생각 없이 휘둘렀다. 머릿속이 하얘질 때까지." }
    - 나레이션:
        - "땀이 흐른다. 조금은 강해진 것 같다."
        - { when: "talent.질긴힘줄", text: "땀이 흐르지만 몸은 금방 회복된다." }
        - { when: "talent.천생신력", text: "목검이 부러졌다. 또." }
        - { when: "talent.병약 and fatigue >= 50", text: "무리했다. 눈앞이 핑 돈다." }
        - { when: "perk.상태창", text: "[근력 {{stat.근력}} · 체질 {{stat.체질}}]" }
    - 속마음:
        - "(레벨 업 효과음이 없다. 그게 제일 아쉽다.)"
        - { when: "perk.상태창", text: "(숫자가 오르는 게 눈에 보인다. 이 맛에 육성 게임을 했지.)" }
        - { when: "fatigue >= 70", text: "(내일 근육통 확정이다. 원작에선 피로도 바가 빨개지는 게 다였는데.)" }
        - { when: "talent.게으름", text: "(…한 세트만 더 하고 쉬자. 아니, 지금 쉬자.)" }

- id: exhausted
  title: 탈진
  on: auto
  repeat: true
  priority: 5
  when: "fatigue >= 85"
  effects: ["fatigue -= 40", "stress += 5 * (1 + mod.stress)"]
  lines:
    - 나레이션:
        - "눈을 떴는데, 몸이 일어나지 않는다."
        - { when: "fired.exhausted >= 2", text: "또다. 눈을 떴는데, 몸이 일어나지 않는다." }
    - "팔을 들어 올리려 했다. 손가락 끝만 겨우 꿈틀거렸다."
    - 나레이션:
        - "몸이 말을 듣지 않는다. 하루 종일 누워 있었다."
        - { when: "talent.병약", text: "열이 펄펄 끓는다. 이 몸은 무리하면 안 된다." }
    - "천장이 천천히 돈다. 눈을 감아도 돈다."
    - "목이 마르다. 물병은 손 닿지 않는 책상 위에 있다."
    - 속마음: "(피로도 게이지가 빨개지면 강제 휴식. 원작에선 '하루 날렸네' 한마디였다.)"
    - 속마음: "(직접 겪어 보니, 이건 날린 게 아니라 그냥 아프다.)"
    - 나레이션:
        - "아무도 오지 않았다. 창으로 든 햇빛이 바닥을 천천히 가로질러 갔다."
        - { when: "time.year == 0 and origin == '평민장학생'", text: "점심 무렵 다락방 문이 열렸다. 이 몸의 어머니가 수프를 두고, 이마를 한 번 짚고 갔다." }
        - { when: "time.year == 0 and origin == '숲고아'", text: "할멈이 쓴 풀죽을 들이밀었다. 맛은 끔찍했고, 몸은 조금 나아졌다." }
        - { when: "time.year == 0 and origin == '엑스트라'", text: "여관 주인이 문틈으로 고개를 들이밀었다. ─ 살았수? 살았으면 방값은 내일 받지." }
        - { when: "time.year == 0 and origin == '악역도련님'", text: "하인들이 문 앞에 쟁반을 두고, 노크도 없이 물러갔다." }
        - { when: "time.year == 0 and origin == '악역도련님' and servant.trust >= 1", text: "늙은 하인이 직접 쟁반을 들고 들어왔다. 이마에 젖은 수건을 얹고, 말없이 나갔다." }
        - { when: "time.year == 1 and affinity.bruno >= 10", text: "브루노가 수업 가기 전에 물주전자를 머리맡에 두고 갔다. 쪽지엔 삐뚤빼뚤, '죽지 마'." }
    - "꿈도 없이 자다 깨다를 반복했다."
    - 속마음:
        - "(쓰러져 있는 하루도 10년에서 빠진다. 시계는 내가 누워 있어도 돌아간다.)"
        - { when: "perk.최적동선", text: "(스피드러너가 동선 관리를 못 해서 쓰러지다니. 기록 영상이었으면 댓글창이 난리 났다.)" }
    - "해가 질 무렵에야 손가락에 힘이 돌아왔다."
    - 속마음:
        - "(몸을 아끼는 것도 공략이다. 화면 밖에서는 특히.)"
        - { when: "fired.exhausted >= 2", text: "(몸을 아끼자고, 지난번에도 다짐했었는데.)" }

- id: sick_day
  title: 앓아누움
  on: auto
  repeat: true
  priority: 4
  when: "talent.병약 and time.roll < 0.06 * (1 - sick.relief / 2)"
  effects: ["fatigue += 10", "sick.count += 1"]
  lines:
    - "새벽에 오한이 들어 깼다. 이불을 둘둘 말아도 이가 딱딱 부딪힌다."
    - "열이 오른다. 오늘은 아무것도 할 수 없다."
    - "기침이 한 번 시작되면 멎지 않는다. 갈비뼈가 기침을 따라 울린다."
    - 나레이션:
        - "숨을 들이쉴 때마다 가슴 안쪽에서 쌕쌕 소리가 난다."
        - { when: "sick.relief", text: "그래도 붉은 뿌리를 먹은 뒤로 숨은 덜 막힌다. 예전 같으면 지금쯤 숨이 넘어갔다." }
    - 속마음: "(병약. 원작 재능 목록에선 '가끔 앓아누움' 한 줄짜리 단점이었다.)"
    - 속마음: "(그 한 줄이, 이 숨이었구나.)"
    - "열에 들떠 잠깐 잠들었다. 꿈속에서 모니터 불빛이 깜빡였다."
    - "화면 속에서 누군가 이 몸을 조종하고 있었다. 눕히고, 일으키고, 다시 눕혔다."
    - "깨고 나니 베갯잇이 땀으로 흠뻑 젖어 있었다."
    - 나레이션:
        - "누군가 이마에 물수건을 얹어 두고 갔다. 누군지는 보지 못했다."
        - { when: "time.year == 1", text: "의무관이 다녀갔다. 쓴 해열제 한 봉지, 그리고 '무리하지 마라' 한마디." }
    - 속마음:
        - "(아픈 하루도 10년에서 빠진다.)"
        - { when: "sick.count >= 2", text: "(앓아눕는 게 익숙해지고 있다. 그게 제일 무섭다.)" }
    - "창밖에서 누가 웃는 소리가 들렸다. 오늘은 그 소리가 아주 멀다."

- id: bloom_tough
  title: 재능 개화 — 질긴 힘줄
  on: auto
  free: true
  priority: 6
  when: "talent.질긴힘줄 == 1 and count.훈련장 + count.기초훈련 + count.검술부 >= 12"
  effects: ["talent.질긴힘줄 = 2", "mod.fatigue -= 0.1"]
  lines:
    - "종이 울리기도 전에 눈이 떠졌다."
    - "아침에 일어났는데 어제의 피로가 하나도 남아 있지 않다."
    - "어제 그렇게 굴렀는데. 허벅지도, 어깨도, 손바닥 물집도 조용하다."
    - "주먹을 쥐었다 폈다. 근육이 늘어났다 줄어드는 감각이 또렷하다. 질기게, 고무줄처럼."
    - 속마음: "(질긴 힘줄. 원작 재능 목록에선 '훈련 피로 -20%' 한 줄이었다.)"
    - 속마음: "(그 한 줄이 몸이 되면 이런 거구나. 악기가 통째로 바뀐 것 같다.)"
    - 시스템: "재능 개화: 질긴 힘줄 → 「지치지 않는 몸」 (피로 누적 추가 -10%)"
    - "침대에서 튕기듯 일어났다. 바닥이 발바닥을 밀어 올리는 것 같다."
    - "아침 연무장. 몸을 풀자마자 목검을 들었다."
    - "어제와 같은 백 번. 오늘은 백 번째에도 팔이 내려가지 않는다."
    - when: "met.garen"
      나레이션: "연무장 끝에서 가렌 교관이 팔짱을 끼고 이쪽을 보고 있다."
    - when: "met.garen"
      가렌@진지: "어제 그만큼 구르고 또 왔나."
    - when: "met.garen"
      가렌: "버틸 수 있다고 버티는 놈이 제일 먼저 쓰러진다. 기억해 둬."
    - when: "met.garen"
      속마음: "(칭찬은 아니다. 저 사람은 칭찬을 안 한다. …그래도, 보고는 있었다는 거다.)"
    - "땀이 식는 게 아까울 만큼 몸이 가볍다."
    - 속마음: "(10년짜리 장기전이다. 지치지 않는 몸은, 생각보다 큰 무기다.)"
