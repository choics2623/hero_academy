# 재능 86개 (+ 진화 전용 2개). cost > 0 은 포인트 소모, cost < 0 은 포인트 획득.
# effects는 캐릭터 생성 시 한 번 적용된다. 성장률(growth.X)은 이후 stat.X 상승량에 곱해진다.
# 판정 보너스는 checks.yaml의 plus/minus에 있다 (선택형 재능은 `서번트.검`처럼).
# tags: 같은 태그가 2개·3개 모이면 시너지가 깨어난다 (synergies.yaml).
#   검 · 마법 · 신성 · 사교 · 은밀 · 학자 · 야생 · 강인 · 저주
# 효과도 판정 보너스도 없는 재능은 이벤트 조건(talent.X)으로만 작동한다.

