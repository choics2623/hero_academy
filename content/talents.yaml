# 재능 52개. cost > 0 은 포인트 소모, cost < 0 은 포인트 획득.
# effects는 캐릭터 생성 시 한 번 적용된다. 성장률(growth.X)은 이후 stat.X 상승량에 곱해진다.
# 효과가 비어 있는 재능은 이벤트 조건(talent.X)으로만 작동한다.

