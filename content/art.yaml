# ---------------------------------------------------------------- 이벤트 CG (src/art/cg.ts)
# 배경 삽화(bg) + 인물 흉상(cast) + 효과(fx). 따로 그린 그림은 없고, 셋을 겹쳐서 그린다.
# 흉상은 64px 폭으로 160px 화면 아래쪽에 붙는다. x는 흉상 가운데 (0 왼쪽 끝 ~ 1 오른쪽 끝).

