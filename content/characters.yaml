# 캐릭터. met = 인연 화면에 나타나는 조건 (기본: affinity.<id> > 0 or met.<id>)
# memo = 인연 화면의 한 줄 메모. 가장 구체적인 것이 보인다.

- id: aren
  name: 아렌
  desc: 원작 주인공. 성검에 선택받은 평민
  assist: { dmg: 6, text: "아렌의 목검이 빈틈을 친다!" }
  memo:
    - "성검에 선택받은 평민. 아직 자기 힘을 모른다."
    - { when: "aren.temper >= 1", text: "나를 믿기 시작했다. 원작보다 표정이 밝다." }
    - { when: "aren.temper <= -1", text: "원작처럼 이를 악물고 혼자 버티는 중." }
    - { when: "tourney.winner == 'me'", text: "무투대회 결승에서 나에게 졌다. 눈빛이 달라졌다." }
    # 41_town_festival
    - { when: "fest.with == 'aren' and fest.moment", text: "봄 축제 날, 처음 보는 시계탑을 안다고 했다. '용사님' 말고 이름으로 불러 줘서 좋다고." }

- id: liana
  name: 리아나
  desc: 하프엘프. 원작 2학년 여름 사망
  assist: { dmg: 5, text: "리아나의 화살이 어둠을 가른다!" }
  memo:
    - "원예부의 하프엘프. 숲 이야기를 좋아한다."
    - { when: "know.moonherb", text: "어릴 때 월광초 달인 약을 먹었다고 한다." }
    - { when: "fs.F05.noticed", text: "계단에서 가슴을 짚던 모습이 마음에 걸린다." }
    - { when: "secret.liana", text: "내가 심장 이야기를 꺼낸 뒤로 조금 경계한다." }
    - { when: "fired.enc_walk_stars", text: "같이 별을 봤다. 엄마 이야기를 해줬다." }
    # 41_town_festival
    - { when: "fest.with == 'liana' and fest.moment", text: "봄 축제 밤, 호수에 소원 등을 같이 띄웠다. 소원은 '내년 축제'라고 했다." }

- id: mirabel
  name: 미라벨
  desc: 몰락 귀족 마법 천재
  memo:
    - "몰락한 아델하이트가의 마법 천재. 콧대가 높다."
    - { when: "rival.mirabel", text: "실기 라이벌. 지는 걸 죽기보다 싫어한다." }
    - { when: "trust.mirabel >= 15", text: "가문 이야기를 할 때만 목소리가 낮아진다." }
    # 41_town_festival
    - { when: "fest.with == 'mirabel' and fest.moment", text: "봄 축제 불꽃 무대 뒤에서, 아델하이트가 불꽃을 맡던 시절 이야기를 들었다." }

- id: kaiden
  name: 카이든
  desc: 3황자
  memo:
    - "3황자. 오만해 보이지만 검은 정직하다."
    - { when: "know.kaiden_shoulder", text: "왼쪽 어깨를 감싸는 버릇이 있다." }
    - { when: "know.kaiden_palace", text: "황궁 이야기를 할 때만 표정이 굳는다." }
    # 41_town_festival
    - { when: "fest.with == 'kaiden' and fest.moment", text: "봄 축제 날, 회색 후드를 쓴 황자에게 꼬치를 사 줬다. 빚은 잊지 않는다고 했다." }
    # 42_dorm_quests
    - { when: "news.case == 3 and news.case_end == 'buried'", text: "신문부 기사를 묻어 줬다. 황족은 빚을 잊지 않는다고 했다." }
    - { when: "news.case == 3 and news.case_end == 'rewritten'", text: "어깨 대신 새벽 연습 이야기가 신문에 실렸다. 그 얘기만 나오면 귀가 빨개진다." }
    - { when: "news.case == 3 and news.case_end == 'published'", text: "어깨 기사가 나갔다. 무투대회에서 틀렸다는 걸 증명하겠다고 했다." }

- id: bruno
  name: 브루노
  desc: 대장장이 아들
  assist: { dmg: 6, text: "브루노가 어깨로 들이받는다!" }
  memo:
    - "덩치 큰 대장장이 아들. 힘이 장사다."
    - { when: "fired.enc_canteen_bruno >= 2", text: "할아버지의 망치를 자랑으로 여긴다." }
    # 41_town_festival
    - { when: "fest.with == 'bruno' and fest.moment", text: "봄 축제 힘자랑 종 앞에서 실컷 웃었다. 곰 인형은 결국 울던 꼬마 차지였다." }

- id: finn
  name: 핀
  desc: 청소부 소년. 미구현 데이터
  memo:
    - "청소부 소년. 빗자루 끝이 검처럼 움직인다."
    - { when: "fs.F07.noticed", text: "피를 보면 손이 떨린다." }
    - { when: "finn.mentor == 'garen'", text: "가렌 교관에게 소개했다. 밤마다 둘이 연무장에 있다." }
    # 41_town_festival
    - { when: "fest.with == 'finn' and fest.moment", text: "봄 축제 밤, 시계탑 꼭대기에서 같이 불꽃을 봤다. 아무도 모르는 자리라고 했다." }
    # 42_dorm_quests
    - { when: "item.핀의쪽지", text: "글자를 배우는 중. '고마어요'라고 쓴 냅킨 쪽지를 아직 간직하고 있다." }
    - { when: "finn.letters >= 3", text: "글자를 배우는 중. 처음 쓴 단어는 자기 이름이었다." }

- id: dorothy
  name: 도로시
  desc: 식당 딸
  met: "found.dorothy or affinity.dorothy > 0"
  memo:
    - "식당 아주머니의 딸. 늘 냄비에 뭔가를 끓인다."
    - { when: "found.dorothy", text: "그 냄비 속은 요리가 아니라 연금약이었다." }
    # 41_town_festival
    - { when: "fest.with == 'dorothy' and fest.moment", text: "봄 축제 노점에서 무지개 레모네이드 소동을 같이 겪었다. 공범이라고 부른다." }
    # 42_dorm_quests
    - { when: "fired.dorothy_trial_3 and dorothy.bistol_warned", text: "비스톨 교수의 연구실에 혼자 가지 않겠다고 새끼손가락을 걸었다." }
    - { when: "fired.dorothy_trial_3 and dorothy.trial >= 3", text: "강장제 라벨에 나를 공동 개발자로 적어 줬다." }

- id: sera
  name: 세라
  desc: 반 배정 시험 탈락생
  memo:
    - "은발의 신학과 신입생."
    - { when: "fate.sera == 'saved'", text: "시험장에서 부축해준 걸 기억한다." }
    - { when: "fate.sera == 'saved_quiet'", text: "누가 도와줬는지 모른 채 학교에 남았다." }
    - { when: "fate.sera == 'dropped'", text: "시험에 떨어져 고향으로 돌아갔다." }
    # 41_town_festival
    - { when: "fest.with == 'sera' and fest.moment", text: "봄 축제 성가대에서 노래했다. 붉은 띠를 두른 교회 사람이 세라의 손등을 보고 있었다." }

- id: noel
  name: 노엘
  desc: 만년 꼴찌 선배
  memo:
    - "만년 꼴찌 4학년 선배. 늘 술 냄새가 난다."
    - { when: "fs.F09.noticed", text: "술잔에 낯선 왕가의 문장이 새겨져 있었다." }
    # 41_town_festival
    - { when: "fest.with == 'noel' and fest.moment", text: "봄 축제 밤, 망한 나라의 노래를 들려줬다. 가사를 아는 사람은 이제 노엘뿐이라고." }
    # 42_dorm_quests
    - { when: "noel.rune_seen", text: "룬 사전 여백에 사전보다 정확한 메모를 적어 둔다. 만년 꼴찌의 글씨가 아니다." }
    - { when: "noel.laundry", text: "기숙사비가 밀려 세탁실에서 잔다. 3층 유령 소문의 정체." }

- id: garen
  name: 가렌
  desc: 검술 교관
  memo:
    - "검술 교관. 말수가 적다."
    - { when: "affinity.garen >= 20", text: "가끔 내 검을 봐준다. 칭찬은 한 번도 안 했다." }
    # 40_classes_clubs
    - { when: "garen.praised and fired.bond_garen_3", text: "\"허리가 들어갔군.\" 입학하고 처음 들은 칭찬이다." }
    - { when: "garen.promise and fired.bond_garen_3", text: "졸업할 때까지 살아 있으면 20년 전 이야기를 해 주겠다고 했다." }
    - { when: "garen.warned and fired.bond_garen_3", text: "그가 죽는다는 말을 입 밖에 냈다. 가렌은 웃지 않았다." }

- id: elvera
  name: 엘베라
  desc: 마법학 교수
  memo:
    - "500살 엘프 마법학 교수."
    - { when: "fs.F11.noticed", text: "마왕의 이름을 부를 때 존칭을 붙일 뻔했다." }
    # 40_classes_clubs
    - { when: "elvera.saw_mark", text: "수정구에 스친 내 마력의 붉은 실을 본 것 같다. 아무 말도 하지 않았다." }
    - { when: "know.warm_flame and fired.bond_elvera_3", text: "태우지 않는 불을 배웠다. 그녀에게 처음 불을 가르쳐 준 사람의 불이라고 한다." }
    - { when: "fired.bond_elvera_3 and trust.elvera >= 10", text: "불을 가르쳐 준 스승 이야기는 졸업할 때쯤 해 주겠다고 했다." }

- id: bistol
  name: 비스톨
  desc: 연금술 교수
  memo:
    - "연금술 교수. 늘 피곤해 보인다."
    - { when: "fs.F06.noticed", text: "연구실에 일곱 살쯤 된 소녀의 초상화가 있다." }
    # 40_classes_clubs
    - { when: "know.bistol_formula and fired.bond_bistol_1", text: "노트에 아이 몸집에 맞춘 보존액 배합이 적혀 있었다." }
    - { when: "fired.bond_bistol_2 and affinity.bistol >= 10 and trust.bistol >= 4", text: "식당에서 늘 스튜 두 그릇을 시킨다. 한 그릇은 '약속한 사람' 몫이라고." }
    - { when: "bistol.warned and fired.bond_bistol_3 and affinity.bistol >= 16 and met.bistol", text: "\"그런 연금술사가 되지 마세요.\" 그는 기억해 두겠다고 했다." }
    - { when: "bistol.empathy and fired.bond_bistol_3 and affinity.bistol >= 16 and met.bistol", text: "되돌릴 수 있다면 나도 그러겠다고 했다. 그는 처음으로 나를 똑바로 봤다." }
    - { when: "fired.bond_bistol_3 and trust.bistol >= 10 and affinity.bistol >= 16 and met.bistol", text: "액자 속 아이 이야기는 '언젠가 자네한테 하지'라며 액자를 엎어 두었다." }

- id: luna
  name: 시스터 루나
  desc: 신학 교수
  memo:
    - "성당을 지키는 신학 교수. 웃는 얼굴로 날카로운 말을 한다."
    # 40_classes_clubs
    - { when: "luna.covered", text: "성수반 앞에서 아무렇지 않게 나를 가려 주었다. 이유는 묻지 않았다." }
    - { when: "fired.bond_luna_2 and trust.luna >= 4", text: "\"성인도 이단도 되지 말고, 그냥 졸업하는 학생\"이 되라고 했다." }

- id: librarian
  name: 사서
  desc: 도서관 사서 노인
  memo:
    - "말수가 적은 도서관 사서 노인."
    - { when: "fs.F02.noticed", text: "입학식 날 성검을 보며 '또 시작이구나'라고 했다." }
    # 42_dorm_quests
    - { when: "fired.lib_night_3 and libnight.keeper", text: "밤마다 등불을 들고 같이 서가를 정리한다. 빈 의자 이야기는 서로 꺼내지 않는다." }
    - { when: "fired.lib_night_3 and libnight.step >= 3", text: "밤마다 등불을 들고 서가를 걷는다. 창가의 빈 의자에 말을 건다." }
    # 40_classes_clubs
    - { when: "know.librarian_spring and fs.F02.noticed", text: "'또 시작이구나'는 봄마다 하는 말이라고 했다. 그날 그는 성검을 보고 있었는데." }
    - { when: "librarian.advice and fired.bond_librarian_2 and affinity.librarian >= 16", text: "바꾸려는 사람은 지치거나 혼자가 된다고 했다. 둘 다 되지 말라고." }

- id: edric
  name: 에드릭
  desc: 원작 1권에서 죽는 악역 도련님
  met: "origin != '악역도련님' and (affinity.edric > 0 or met.edric)"
  memo:
    - "벨모어가의 망나니."
    - { when: "fate.edric == 'saved'", text: "미궁에서 구해준 뒤로 나를 졸졸 따라다닌다." }
    - { when: "fate.edric == 'saved_by_teacher'", text: "교관에게 끌려 나와 살았다. 누가 알렸는지 모른다." }
    # 41_town_festival
    - { when: "fest.with == 'edric' and fest.moment", text: "봄 축제에서 같이 고리를 던졌다. 평민 축제는 처음이라고, 어머니가 오고 싶어 했다고." }

- id: grim
  name: 그림
  desc: 뒷골목 정보상
  memo:
    - "뒷골목 정보상. 정보는 공짜가 아니다."
    - { when: "intel >= 2", text: "단골 대접을 해준다." }
    # 41_town_festival
    - { when: "intel >= 2 and trust.grim >= 8", text: "정보를 사고파는 사이가 됐다. 미궁 이야기는 자기 말고 아무한테도 팔지 말라고 했다." }

- id: kael
  name: 카엘
  desc: 마족 전학생 (2학기)
  met: "false"
