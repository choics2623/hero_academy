# 가방과 장비 (docs/08 6절)
# kind: equip(장비) · use(소모품) · key(귀중품)
# slot: 모자 · 윗옷 · 아래옷 · 한벌옷 · 장신구 · 무기 · 신발  (한벌옷은 윗옷과 아래옷 칸을 함께 쓴다)
# icon: hat shirt pants robe ring amulet sword staff boots potion herb book letter charm misc
# checks: 판정 보정 (checks.yaml의 종류) · battle: 전투 보정 (hp sp mp atk matk def dodge read persuade)
# 보정 크기: 장비 하나가 판정 +1~3. 전설급만 +4.

# ---------------------------------------------------------------- 귀중품 (이야기 물건)
- id: 일기장
  name: 몸 주인의 일기장
  kind: key
  icon: book
  desc: 원래 이 몸의 주인이 쓰던 일기. 마지막 장이 찢겨 있다.

- id: 붉은뿌리
  name: 붉은 뿌리
  kind: key
  icon: herb
  desc: 폐광 깊은 곳에서 캔 뿌리. 약재상이 눈을 빛낸다.

- id: 월광초
  name: 월광초
  kind: key
  icon: herb
  desc: 달빛 아래에서만 피는 풀. 리아나의 고향 숲에서 자란다.

- id: 세계수의이슬
  name: 세계수의 이슬
  kind: key
  icon: potion
  desc: 유리병 안에서 이슬이 아침처럼 빛난다.

- id: 핀의쪽지
  name: 핀의 쪽지
  kind: key
  icon: letter
  desc: 냅킨에 삐뚤빼뚤 '고마어요'. 아직 배우는 중인 글자.

# ---------------------------------------------------------------- 소모품
- id: 강장제
  name: 강장제
  kind: use
  icon: potion
  price: 6
  desc: 쓴맛이 혀에 오래 남는 약. 전투에서 체력 40% 회복. 평소에 마시면 피로가 가신다.
  use: ["fatigue -= 15"]

- id: 룬부적
  name: 노엘의 룬 부적
  kind: use
  icon: charm
  desc: 노엘이 술값 대신 준 부적. 전투에서 타오르며 상처를 덮는다.

# ---------------------------------------------------------------- 장비
- id: 브루노목검
  name: 브루노의 목검
  kind: equip
  slot: 무기
  icon: sword
  desc: 브루노가 대장간 남은 참나무로 깎아 준 목검. 손잡이에 이니셜이 새겨져 있다.
  checks: { 완력: 1 }
  battle: { atk: 2 }
