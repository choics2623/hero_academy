# ---------------------------------------------------------------- 소모품
- id: 강장제
  name: 강장제
  kind: use
  icon: potion
  price: 12
  desc: 쓴맛이 혀에 오래 남는 약. 전투에서 체력 40% 회복. 평소에 마시면 피로가 가신다.
  use: ["fatigue -= 15"]

- id: 룬부적
  name: 노엘의 룬 부적
  kind: use
  icon: charm
  desc: 노엘이 술값 대신 준 부적. 전투에서 타오르며 상처를 덮는다.

- id: 피로회복차
  name: 피로회복차
  kind: use
  icon: herb
  price: 5
  desc: 볶은 보리와 말린 대추를 넣은 차 봉지. 우리면 구수한 김이 방 안에 퍼진다. 피로 -20.
  use: ["fatigue -= 20"]

- id: 진정허브
  name: 진정 허브 묶음
  kind: use
  icon: herb
  price: 6
  desc: 라벤더와 레몬밤을 실로 묶은 다발. 베갯머리에 두면 숨이 느려진다. 스트레스 -15.
  use: ["stress -= 15"]

- id: 상처연고
  name: 상처 연고
  kind: use
  icon: potion
  price: 8
  desc: 쑥 냄새가 코를 찌르는 초록 연고. 전투에서 바르면 체력 25% 회복. 뭉친 근육에 발라도 좋다.
  use: ["fatigue -= 8"]

- id: 집중의향
  name: 집중의 향
  kind: use
  icon: misc
  price: 14
  desc: 새끼손가락만 한 향 세 개. 태우면 송진 냄새가 머리 뒤쪽을 서늘하게 비운다. 지성·의지가 조금 오른다.
  use: ["stat.지성 += 0.8", "stat.의지 += 0.5"]

- id: 기사단강장제
  name: 기사단 보급 강장제
  kind: use
  icon: potion
  price: 28
  desc: 병목의 기사단 봉인이 반쯤 긁힌 은빛 병. 전투에서 체력 60% 회복. 평소에 마시면 밤샘 피로가 한 번에 씻긴다.
  use: ["fatigue -= 30", "stress -= 5"]

