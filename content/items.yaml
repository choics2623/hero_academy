# 가방과 장비 (docs/08 6절)
# kind: equip(장비) · use(소모품) · key(귀중품)
# slot: 모자 · 윗옷 · 아래옷 · 한벌옷 · 장신구 · 무기 · 신발  (한벌옷은 윗옷과 아래옷 칸을 함께 쓴다)
# icon: hat shirt pants robe ring amulet sword staff boots potion herb book letter charm misc
# checks: 판정 보정 (checks.yaml의 종류) · battle: 전투 보정 (hp sp mp atk matk def dodge read persuade)
# 보정 크기: 장비 하나가 판정 +1~3. 전설급만 +4.
#
# 가격: 싼 것 5~15 · 중간 18~35 · 귀한 것 40~60 (은화). price가 없으면 선물·이야기로만 얻는다.
# 상점은 content/events/43_shops.yaml (상점가 활동). 달마다 진열이 바뀐다:
#   잡화점 「작은 종」  소모품
#   재봉집 「바늘과 실」 옷·모자·신 (봄 기본 → 축제철 멋 → 장마철 검은 옷·로브)
#   대장간 골목        무기·장화·갑옷 (신입생 첫 무기 → 기사단 중고 → 무투대회 철 상급품)
#   골동품 노점        장신구 (+ 경매장에서 흘러나온 예복)
# 컨셉별 장비: 검사(완력·기민·공격) 마도사(마법·학식·마나) 성직자(신성·정신력·체력) 사교가(설득·기만)
#   그림자(은밀·회피) 학자(학식·통찰·간파) 야인(교감·기민) 철인(인내·방어·체력) 저주받은자(위압·정신력)

# ---------------------------------------------------------------- 귀중품 (이야기 물건)
